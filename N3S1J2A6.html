<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Je retiens — L'équation produit nul · 3e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--day-color:#b94040;--day-dark:#7a1f1f;--day-light:#f7eded;--day-border:#e0b8b8;--day-glow:rgba(185,64,64,.25);--green:#3d7a10;--green-bg:#eef8e2;--red:#c0392b;--red-bg:#fdeceb;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#fffdf7;color:#2b2b2b;line-height:1.6;padding:24px 16px 60px;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(2px)}
body::before{width:260px;height:260px;background:var(--day-glow);top:-80px;right:-70px}
body::after{width:200px;height:200px;background:var(--day-glow);bottom:-60px;left:-60px}
.bubble{position:fixed;border-radius:50%;background:var(--day-glow);z-index:0;pointer-events:none;opacity:.5}
.bubble.b1{width:90px;height:90px;top:40%;left:-30px}.bubble.b2{width:60px;height:60px;top:18%;left:8%}.bubble.b3{width:120px;height:120px;bottom:12%;right:-40px}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto}
.hero{text-align:center;margin-bottom:24px}
.pill{display:inline-block;background:var(--day-color);color:#fff;font-weight:bold;font-size:.85rem;letter-spacing:.5px;padding:7px 18px;border-radius:999px;box-shadow:0 4px 12px var(--day-glow)}
.hero h1{font-size:1.55rem;color:var(--day-dark);margin:14px 0 6px;line-height:1.25}
.hero .week-line{font-size:1.02rem;color:#8a8a8a;font-weight:600;margin-top:12px;letter-spacing:.3px}
.card{background:#fff;border-radius:16px;padding:24px 22px;margin:0 auto;max-width:720px;position:relative;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.06);border:1px solid #ecdede}
.card-stripe{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--day-color),var(--day-border))}
.consigne{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:13px 16px;font-weight:600;color:var(--day-dark);margin-bottom:18px}
.bar-wrap{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar{flex:1;height:12px;background:#f0e0e0;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--day-color),var(--day-border));border-radius:999px;transition:width .4s}
.bar-txt{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--day-dark);font-size:.9rem;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.chip{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.82rem;padding:4px 12px;border-radius:999px;border:2px solid}
.chip.good{color:var(--green);border-color:#bfe29a;background:var(--green-bg)}
.chip.bad{color:var(--red);border-color:#f0b8b3;background:var(--red-bg)}
.qtitle{font-weight:bold;color:var(--day-dark);margin-bottom:4px;font-size:1.05rem}
.qtheme{font-size:.85rem;color:#999;font-style:italic;margin-bottom:12px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;margin-bottom:10px;border:2px solid #eee;border-radius:12px;cursor:pointer;transition:all .15s;background:#fafafa;min-height:44px;font-size:.98rem}
.opt:hover{border-color:var(--day-border);background:#fff}
.opt .ic{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;margin-top:1px;color:#fff}
.opt.good{border-color:#8dc63f;background:var(--green-bg);cursor:default}.opt.good .ic{background:#8dc63f;border-color:#8dc63f}
.opt.bad{border-color:#e06b62;background:var(--red-bg);cursor:default}.opt.bad .ic{background:#e06b62;border-color:#e06b62}
.opt.locked{cursor:default;opacity:.96}
.opt .mono{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--day-dark)}
.hint{margin:6px 0 14px}
.hint-toggle{background:#fff;color:var(--day-dark);border:2px solid var(--day-border);border-radius:10px;padding:8px 14px;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif;min-height:44px;font-size:.9rem}
.hint-box{display:none;margin-top:10px;background:var(--day-light);border:2px solid var(--day-border);border-radius:10px;padding:11px 14px;font-size:.92rem;color:#7a1f1f}
.hint-box.show{display:block}
.fb{margin-top:8px;font-weight:600;font-size:.93rem;min-height:1px;border-radius:10px;padding:0}
.fb.show{padding:11px 14px}
.fb.win{color:var(--green);background:var(--green-bg);border:1px solid #bfe29a}
.fb.retry{color:var(--red);background:var(--red-bg);border:1px solid #f0b8b3}
.results{display:none;text-align:center;padding:8px 4px}
.results.show{display:block}
.stars{font-size:1.9rem;letter-spacing:4px;margin:6px 0 10px}
.star{color:#e2cccc}.star.on{color:var(--day-color)}
.results h2{color:var(--day-dark);font-size:1.4rem;margin-bottom:6px}
.results .msg{color:#555;margin-bottom:16px}
.btn{background:var(--day-color);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif;box-shadow:0 3px 10px var(--day-glow);min-height:44px;font-size:.95rem}
.btn:hover{transform:translateY(-1px)}
@media(max-width:480px){.hero h1{font-size:1.3rem}.card{padding:20px 16px}}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
<div class="wrap">
  <div class="hero">
    <span class="pill">Pazapa · 3e · Mathématiques</span>
    <div class="week-line">Semaine 1 – Jour 2</div>
    <h1>L'équation produit nul</h1>
  </div>

  <section class="card"><span class="card-stripe"></span>
    <div class="consigne">👉 Consigne&nbsp;: identifiez la bonne méthode pour résoudre une équation produit nul.</div>

    <div id="exo">
      <div class="bar-wrap">
        <div class="bar"><i id="barFill"></i></div>
        <span class="bar-txt" id="barTxt">0 / 0</span>
      </div>
      <div class="chips">
        <span class="chip good" id="chipGood">✅ trouvées : 0</span>
        <span class="chip bad" id="chipBad">❌ erreurs : 0</span>
      </div>
      <div id="groupBox"></div>
    </div>

    <div class="results" id="results">
      <div class="stars" id="stars"></div>
      <h2 id="resTitle"></h2>
      <p class="msg" id="resMsg"></p>
      <button class="btn" id="restartBtn" type="button">↺ Recommencer</button>
    </div>
  </section>
</div>

<script>
/* ====== DONNÉES (issues de la capture) ======
   Exercice H5P Summary : 1 groupe / 1 (Progression 0/1). */
const GROUPS=[
  {
    theme:"Méthode de résolution d'une équation produit nul",
    hint:"Pense à la propriété : un produit de facteurs est nul quand au moins l'un des facteurs est nul.",
    statements:[
      {t:"Pour résoudre une équation produit nul de la forme <span class=\"mono\">(ax + b)(cx + d) = 0</span>, on utilise la propriété du produit nul : si un produit est nul, alors au moins l'un des facteurs est nul. On résout donc séparément <span class=\"mono\">ax + b = 0</span> et <span class=\"mono\">cx + d = 0</span>.",ok:true,
       why:"C'est la propriété du produit nul : un produit est nul si l'un au moins de ses facteurs est nul. On résout chaque facteur séparément."},
      {t:"Pour résoudre une équation produit nul, on peut additionner les deux facteurs et résoudre l'équation obtenue.",ok:false,
       why:"Faux : on n'additionne pas les facteurs. On utilise la propriété du produit nul."},
      {t:"Pour résoudre une équation produit nul, il suffit de diviser les deux côtés par l'un des facteurs.",ok:false,
       why:"Faux : on ne divise pas par un facteur (il pourrait valoir 0). On résout chaque facteur = 0."},
    ]
  }
];

const TOTAL=GROUPS.length;
let cur=0, good=0, bad=0, solved=false;
const groupBox=document.getElementById('groupBox');
const barFill=document.getElementById('barFill'), barTxt=document.getElementById('barTxt');
const chipGood=document.getElementById('chipGood'), chipBad=document.getElementById('chipBad');

function updateHud(){
  barFill.style.width=(TOTAL? (good/TOTAL*100):0)+'%';
  barTxt.textContent=good+' / '+TOTAL;
  chipGood.textContent='✅ trouvées : '+good;
  chipBad.textContent='❌ erreurs : '+bad;
}

function renderGroup(){
  solved=false;
  const g=GROUPS[cur];
  let html='<div class="qtitle">Affirmation '+(cur+1)+' sur '+TOTAL+'</div>';
  html+='<div class="qtheme">'+g.theme+'</div>';
  g.statements.forEach((s,i)=>{
    html+='<div class="opt" data-i="'+i+'"><span class="ic"></span><span>'+s.t+'</span></div>';
  });
  html+='<div class="hint"><button class="hint-toggle" id="hintBtn" type="button">💡 Indice</button><div class="hint-box" id="hintBox">'+g.hint+'</div></div>';
  html+='<div class="fb" id="fb"></div>';
  groupBox.innerHTML=html;
  document.getElementById('hintBtn').addEventListener('click',()=>document.getElementById('hintBox').classList.toggle('show'));
  groupBox.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>pick(parseInt(o.dataset.i))));
  updateHud();
}

function pick(i){
  if(solved) return;                 // garde anti-double-clic
  const g=GROUPS[cur]; const s=g.statements[i];
  const opt=groupBox.querySelector('.opt[data-i="'+i+'"]');
  const fb=document.getElementById('fb');
  if(s.ok){
    solved=true; good++;
    opt.classList.add('good','locked'); opt.querySelector('.ic').textContent='✓';
    groupBox.querySelectorAll('.opt').forEach(o=>o.classList.add('locked'));
    fb.className='fb win show'; fb.textContent='✅ '+s.why;
    updateHud();
    setTimeout(()=>{ cur++; if(cur<TOTAL){renderGroup();} else {showResults();} }, 1100);
  }else{
    bad++;
    opt.classList.add('bad','locked'); opt.querySelector('.ic').textContent='✕';
    opt.style.pointerEvents='none';
    fb.className='fb retry show'; fb.textContent='❌ '+s.why+' Essaie une autre affirmation.';
    updateHud();
  }
}

function showResults(){
  document.getElementById('exo').style.display='none';
  const res=document.getElementById('results'); res.classList.add('show');
  let stars;
  if(bad===0) stars=5; else if(bad===1) stars=4; else if(bad===2) stars=3; else stars=2;
  let st=''; for(let k=1;k<=5;k++) st+='<span class="star'+(k<=stars?' on':'')+'">★</span>';
  document.getElementById('stars').innerHTML=st;
  let title,msg;
  if(stars>=5){title='Parfait !';msg='Tu as trouvé la bonne méthode du premier coup. La propriété du produit nul est maîtrisée.';}
  else if(stars===4){title='Très bien !';msg='Une seule hésitation : tu as bien identifié la bonne méthode.';}
  else if(stars===3){title='Bien';msg='C\u2019est trouvé, mais relis la propriété du produit nul pour gagner en assurance.';}
  else {title='À retravailler';msg='Reprends la propriété du produit nul : un produit est nul si au moins un facteur est nul.';}
  document.getElementById('resTitle').textContent=title;
  document.getElementById('resMsg').textContent=msg;
}

document.getElementById('restartBtn').addEventListener('click',()=>{
  cur=0;good=0;bad=0;solved=false;
  document.getElementById('results').classList.remove('show');
  document.getElementById('exo').style.display='';
  renderGroup();
});

renderGroup();
</script>
</body>
</html>
