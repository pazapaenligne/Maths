<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Je relève le défi ! S3 J4</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  /* Couleur du jour : JEUDI BLEU (variables exigées par la charte) */
  --day-color:#3ab5d8;--day-dark:#1a6e88;--day-light:#e8f6fb;--day-border:#9dd4e8;--day-glow:rgba(58,181,216,.18);
  /* Palette Pazapa */
  --bg:#ffffff;--surface:#ffffff;--border:#e3e8ea;
  --yellow:#f5c518;--green:#5fa800;--green-soft:#8dc63f;--pink:#f28b82;--orange:#f5a623;--red:#d33;
  --text:#1a1d23;--muted:#6f7480;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  padding:0 0 3rem;overflow-x:hidden;line-height:1.8;letter-spacing:.02em;word-spacing:.06em;-webkit-tap-highlight-color:transparent;}
.frame{position:relative;overflow:hidden;max-width:720px;margin:0 auto;
  background:radial-gradient(300px 300px at 100% 0%,rgba(58,181,216,.12),transparent 60%),
             radial-gradient(240px 240px at 0% 100%,rgba(157,212,232,.16),transparent 60%),
             radial-gradient(150px 150px at 100% 75%,rgba(58,181,216,.08),transparent 60%),var(--bg);}
.bubble{position:absolute;border-radius:50%;pointer-events:none;}
.bubble1{width:300px;height:300px;top:-80px;right:-80px;background:var(--day-color);opacity:.12;}
.bubble2{width:240px;height:240px;bottom:-60px;left:-60px;background:var(--day-border);opacity:.18;}
.bubble3{width:150px;height:150px;bottom:300px;right:-40px;background:var(--day-color);opacity:.08;}
.layer{position:relative;z-index:1;}

.hero{background:var(--surface);border-bottom:2px solid var(--day-light);padding:2rem 1.25rem 1.6rem;text-align:center;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--day-color);color:#fff;
  font-size:clamp(.66rem,2.6vw,.8rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.4rem 1.1rem;border-radius:99px;margin-bottom:.8rem;white-space:nowrap;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);letter-spacing:.14em;margin-bottom:.5rem;}
.hero h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.6rem,6.5vw,2.3rem);font-weight:900;line-height:1.2;color:var(--text);}
.hero h1 .hl{color:var(--day-dark);}
.hero h1 .trophy{display:inline-block;animation:bounce 3s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-7px) rotate(5deg);}}
.hero .subtitle{color:var(--muted);font-size:clamp(.82rem,3vw,.92rem);margin-top:.5rem;}

.gamebox{max-width:720px;margin:1.3rem auto 0;padding:0 1.25rem;}
.scoreboard-sticky{position:sticky;top:0;z-index:5;}
.gb-inner{background:var(--surface);border:2px solid var(--day-border);border-radius:14px;padding:1rem;box-shadow:0 4px 16px var(--day-glow);}
.gb-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.16em;color:var(--day-dark);text-align:center;margin-bottom:.6rem;text-transform:uppercase;}
.scoreboard{display:flex;gap:.5rem;margin-bottom:.8rem;}
.sb{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:.5rem .3rem;text-align:center;}
.sb .v{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:clamp(2.2rem,8vw,2.6rem);line-height:1;}
.sb .l{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.1em;color:var(--muted);margin-top:.25rem;text-transform:uppercase;}
.sb.ok{border-color:#c7e89a;} .sb.ok .v{color:var(--green);}
.sb.rem{border-color:var(--day-border);} .sb.rem .v{color:var(--day-dark);}
.sb.err{border-color:#f4c4bf;} .sb.err .v{color:var(--red);}
.xp-bg{background:var(--border);border-radius:99px;height:13px;overflow:hidden;}
.xp-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--day-dark),var(--day-color),var(--day-border));transition:width .6s ease;}
.xp-txt{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--day-dark);text-align:right;margin-top:.3rem;letter-spacing:.08em;}

.main{max-width:720px;margin:0 auto;padding:1.3rem 1.25rem 0;}

.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.3rem;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.card-stripe{height:5px;background:linear-gradient(90deg,var(--day-border),var(--green-soft),var(--yellow),var(--orange));}
.card-inner{padding:1.4rem 1.2rem;}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:.9rem;flex-wrap:wrap;}
.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:900;flex-shrink:0;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.theme-badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;padding:.2rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;margin-left:auto;white-space:nowrap;
  background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1rem;
  font-family:'JetBrains Mono',monospace;font-size:clamp(1.1rem,4vw,1.5rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.6;word-break:break-word;}
.eq-box.small{font-size:clamp(.95rem,3.2vw,1.15rem);}

.input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.6rem;}
.input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:var(--text);}
.answer-input{width:160px;background:#fff;border:2px solid var(--border);border-radius:10px;color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:.55rem .85rem;outline:none;transition:border-color .2s;min-height:44px;}
.answer-input:focus{border-color:var(--day-color);box-shadow:0 0 0 3px var(--day-glow);}
.answer-input.correct-input{border-color:var(--green-soft);background:#f0faeb;}
.answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}

.qcm-row{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.7rem;}
.qcm-choice{display:flex;align-items:center;gap:.7rem;padding:.65rem 1rem;border:2px solid var(--border);border-radius:10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.9rem;transition:.15s;background:#fff;min-height:44px;}
.qcm-choice:hover:not(.locked){border-color:var(--day-color);background:var(--day-light);}
.qcm-choice.selected{border-color:var(--day-color);background:var(--day-light);}
.qcm-choice.correct-c{border-color:var(--green-soft);background:#f0faeb;color:#2f6e10;cursor:default;}
.qcm-choice.wrong-c{border-color:var(--pink);background:#fff0ef;color:#c0392b;cursor:default;}
.qcm-choice.locked{cursor:default;}
.qcm-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;}
.qcm-choice.selected .qcm-radio{background:var(--day-color);border-color:var(--day-color);}
.qcm-choice.correct-c .qcm-radio{background:var(--green-soft);border-color:var(--green-soft);}
.qcm-choice.wrong-c .qcm-radio{background:var(--pink);border-color:var(--pink);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:10px;
  font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;letter-spacing:.04em;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s,background .15s;min-height:44px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
.btn:active:not(:disabled){transform:scale(.97);} .btn:disabled{opacity:.4;cursor:default;}
.btn-check{background:var(--green);color:#fff;}
.btn-check:hover:not(:disabled){box-shadow:0 4px 14px rgba(95,168,0,.4);}
.btn-hint{background:#fff;border:2px solid var(--orange);color:#b06f0c;}
.btn-hint:hover:not(:disabled){background:#fff7ec;}
.btn-solution{background:#fff;border:2px solid var(--day-border);color:var(--day-dark);}
.btn-solution:hover:not(:disabled){background:var(--day-light);}
.btn-next{background:var(--day-color);color:#fff;}
.btn-next:hover:not(:disabled){background:var(--day-dark);}
.btn-prev{background:#fff;border:2px solid var(--border);color:var(--muted);}
.btn-prev:hover:not(:disabled){border-color:var(--day-color);color:var(--day-dark);}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;}

.hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.7rem 1rem;font-size:.82rem;color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
.hint-box.show{display:block;}
.solution-box{margin-top:.9rem;background:var(--day-light);border:1px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.7rem 1rem;font-size:.82rem;color:var(--day-dark);display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
.solution-box.show{display:block;}
.solution-box strong{color:var(--day-color);}
.feedback{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;font-size:.88rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.8;}
.feedback.show{display:flex;}
.feedback.ok{background:#f0faeb;border:1.5px solid var(--green-soft);color:#3a7d0a;}
.feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
.feedback-icon{font-size:1.4rem;flex-shrink:0;}
.feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.8;}

.results{display:none;}
.results.show{display:block;}
.results-card{background:var(--surface);border:2px solid var(--day-border);border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 24px var(--day-glow);margin-bottom:1.3rem;animation:fadeUp .4s ease both;}
.results-inner{padding:2rem 1.3rem;text-align:center;}
.results-trophy{font-size:3.4rem;animation:bounce 3s infinite;display:block;margin-bottom:.3rem;}
.results-score{font-family:'JetBrains Mono',monospace;font-size:clamp(2.6rem,11vw,4rem);font-weight:900;line-height:1;margin:.3rem 0 .2rem;}
.results-score .s-num{color:var(--green);}
.stars-row{font-size:1.9rem;margin:.3rem 0 .9rem;letter-spacing:.15rem;}
.results-msg{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:.95rem;margin-bottom:1.4rem;letter-spacing:.03em;line-height:1.8;}

.restart-wrap{max-width:720px;margin:0 auto;padding:0 1.25rem;text-align:center;}
.btn-restart{background:var(--orange);color:#fff;font-size:.95rem;padding:.8rem 2rem;display:none;}
.btn-restart.show{display:inline-flex;}
.btn-restart:hover{background:#d98a10;}

footer{text-align:center;margin-top:2.2rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.06em;}
@media(max-width:560px){.scoreboard{gap:.35rem;} .sb{padding:.45rem .12rem;} .sb .v{font-size:2rem;}}
@media(max-width:480px){
  .hero{padding:1.6rem 1rem 1.4rem;} .main,.gamebox,.restart-wrap{padding:0 1rem;}
  .card-inner{padding:1.2rem 1rem;} .btn-row{flex-direction:column;} .btn{width:100%;}
  .answer-input{width:100%;}
}
</style>
</head>
<body>
<div class="frame">
  <div class="bubble bubble1"></div><div class="bubble bubble2"></div><div class="bubble bubble3"></div>
  <div class="layer">
    <div class="hero">
      <div class="logo-badge">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#3ab5d8"></span>
        Pazapa · Maths · 6e
      </div>
      <div class="week-label">SEMAINE 3 — JOUR 4</div>
      <h1><span class="trophy">🏆</span> Je <span class="hl">relève le défi&nbsp;!</span></h1>
      <p class="subtitle">18 challenges · décimaux</p>
    </div>

    <div class="gamebox scoreboard-sticky">
      <div class="gb-inner">
        <div class="gb-label">▶ Défi décimaux</div>
        <div class="scoreboard">
          <div class="sb ok"><div class="v" id="h-ok">0</div><div class="l">Réussies</div></div>
          <div class="sb rem"><div class="v" id="h-rem">18</div><div class="l">Restantes</div></div>
          <div class="sb err"><div class="v" id="h-ko">0</div><div class="l">Erreurs</div></div>
        </div>
        <div class="xp-bg"><div class="xp-fill" id="hero-bar"></div></div>
        <div class="xp-txt" id="hero-prog-label">0 / 18</div>
      </div>
    </div>

    <div class="main">
      <div id="cards"></div>
      <div class="results" id="results-screen">
        <div class="results-card">
          <div class="card-stripe"></div>
          <div class="results-inner">
            <span class="results-trophy">🏆</span>
            <div class="results-score"><span class="s-num" id="score-num">0</span>/18</div>
            <div class="stars-row" id="stars-row"></div>
            <div class="results-msg" id="results-msg"></div>
          </div>
        </div>
      </div>
      <div class="restart-wrap">
        <button class="btn btn-restart" id="btn-restart" onclick="restart()">🔄 Recommencer</button>
      </div>
      <footer>N6 · S3 · J4 · Je relève le défi · Pazapa Maths 6e</footer>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   18 items (4 num + 14 QCM) sur les décimaux. 1 point par item.
   - "num" : champ numérique vérifié exactement.
   - "qcm" : choix multiples, une seule bonne réponse.
   Navigation : une carte à la fois (Précédent / Suivant).
═══════════════════════════════════════════════════════════ */
function qcm(eqHtml, theme, correctText, distractors, solution, hint, small){
  var choices=[{text:correctText,correct:true}];
  distractors.forEach(function(d){choices.push({text:d,correct:false});});
  return {kind:"qcm",theme:theme,eqHtml:eqHtml,small:!!small,
    choices:choices,solution:solution,hint:hint};
}

var EXERCISES=[
  {kind:"num",theme:"Décomposition",
   eqHtml:"(7 × 10) + (2 × 1) + (3 × 0,1) + (5 × 0,001) + (6 × 0,001)",small:true,
   label:"Nombre =",ans:72.311,
   solution:"70 + 2 + 0,3 + 0,005 + 0,006 = <strong>72,311</strong>.",
   hint:"Les deux termes en millièmes se cumulent : 5 + 6 = 11 millièmes."},
  {kind:"num",theme:"Décomposition",
   eqHtml:"(4 × 100) + (8 × 1) + (5 × 0,1) + (2 × 0,001) + (7 × 0,001)",small:true,
   label:"Nombre =",ans:408.509,
   solution:"400 + 8 + 0,5 + 0,002 + 0,007 = <strong>408,509</strong>.",
   hint:"2 + 7 = 9 millièmes, soit 0,009."},
  {kind:"num",theme:"Décomposition",
   eqHtml:"(9 × 1) + (3 × 0,1) + (4 × 0,001) + (6 × 0,0001)",small:true,
   label:"Nombre =",ans:9.3046,
   solution:"9 + 0,3 + 0,004 + 0,0006 = <strong>9,3046</strong>.",
   hint:"Dixièmes, millièmes puis dix-millièmes."},
  {kind:"num",theme:"Décomposition",
   eqHtml:"(5 × 10) + (6 × 0,01)",small:true,
   label:"Nombre =",ans:50.06,
   solution:"50 + 0,06 = <strong>50,06</strong>.",
   hint:"Place un zéro au rang des dixièmes : 50,06."},

  qcm("Décompose&nbsp;: 378,5","Décomposer",
    "(3 × 100) + (7 × 10) + (8 × 1) + (5 × 0,1)",
    ["(3 × 100) + (7 × 10) + (8 × 1) + (5 × 0,01)",
     "(3 × 10) + (7 × 1) + (8 × 0,1) + (5 × 0,01)"],
    "378,5 = 300 + 70 + 8 + 0,5.","Le 5 est au rang des dixièmes (0,1).",true),
  qcm("Décompose&nbsp;: 10,53","Décomposer",
    "(1 × 10) + (5 × 0,1) + (3 × 0,01)",
    ["(1 × 10) + (5 × 0,01) + (3 × 0,001)",
     "(1 × 100) + (5 × 0,1) + (3 × 0,01)"],
    "10,53 = 10 + 0,5 + 0,03.","5 dixièmes et 3 centièmes.",true),
  qcm("Décompose&nbsp;: 5 200","Décomposer",
    "(5 × 1000) + (2 × 100)",
    ["(5 × 100) + (2 × 10)",
     "(5 × 1000) + (2 × 10)"],
    "5 200 = 5000 + 200.","5 milliers et 2 centaines.",true),
  qcm("Décompose&nbsp;: 0,109","Décomposer",
    "(1 × 0,1) + (9 × 0,001)",
    ["(1 × 0,1) + (9 × 0,01)",
     "(1 × 0,01) + (9 × 0,001)"],
    "0,109 = 0,1 + 0,009 (le rang des centièmes est vide).","1 dixième, 0 centième, 9 millièmes.",true),
  qcm("Décompose&nbsp;: 684,652","Décomposer",
    "(6 × 100) + (8 × 10) + (4 × 1) + (6 × 0,1) + (5 × 0,01) + (2 × 0,001)",
    ["(6 × 100) + (8 × 10) + (4 × 1) + (6 × 0,01) + (5 × 0,001) + (2 × 0,0001)",
     "(6 × 1000) + (8 × 100) + (4 × 10) + (6 × 0,1) + (5 × 0,01) + (2 × 0,001)"],
    "684,652 = 600 + 80 + 4 + 0,6 + 0,05 + 0,002.","Six dixièmes, cinq centièmes, deux millièmes.",true),
  qcm("Décompose&nbsp;: 890,07","Décomposer",
    "(8 × 100) + (9 × 10) + (7 × 0,01)",
    ["(8 × 100) + (9 × 10) + (7 × 0,1)",
     "(8 × 100) + (9 × 10) + (7 × 0,001)"],
    "890,07 = 800 + 90 + 0,07 (pas de dixièmes).","Le 7 est au rang des centièmes.",true),

  qcm("Écriture en fraction décimale&nbsp;: 56,9","Fraction décimale",
    "569 / 10",["569 / 100","56,9 / 10"],
    "Un chiffre après la virgule, donc dénominateur 10.","Dénominateur 10 pour un dixième."),
  qcm("Écriture en fraction décimale&nbsp;: 47,8","Fraction décimale",
    "478 / 10",["478 / 100","47,8 / 100"],
    "Un chiffre après la virgule, donc dénominateur 10.","478 dixièmes."),
  qcm("Écriture en fraction décimale&nbsp;: 235,01","Fraction décimale",
    "23501 / 100",["23501 / 1000","2350,1 / 10"],
    "Deux chiffres après la virgule, donc dénominateur 100.","Compte les chiffres après la virgule : 2 donne 100."),
  qcm("Écriture en fraction décimale&nbsp;: 8,63","Fraction décimale",
    "863 / 100",["863 / 10","8,63 / 100"],
    "Deux chiffres après la virgule, donc dénominateur 100.","863 centièmes."),

  qcm("Écris en lettres&nbsp;: 56,9","En lettres",
    "cinquante-six virgule neuf",
    ["cinq-cent-soixante-neuf","cinquante-six virgule quatre-vingt-dix"],
    "56 = cinquante-six, puis virgule neuf.","La partie décimale a un seul chiffre : neuf dixièmes."),
  qcm("Écris en lettres&nbsp;: 47,8","En lettres",
    "quarante-sept virgule huit",
    ["quatre-cent-soixante-dix-huit","quarante-sept virgule quatre-vingts"],
    "47 = quarante-sept, puis virgule huit.","Huit dixièmes."),
  qcm("Écris en lettres&nbsp;: 235,01","En lettres",
    "deux-cent-trente-cinq virgule zéro un",
    ["deux-cent-trente-cinq virgule un","deux-cent-trente-cinq virgule onze"],
    "235, puis virgule zéro un (un centième).","Le zéro des dixièmes se lit aussi.",true),
  qcm("Écris en lettres&nbsp;: 8,63","En lettres",
    "huit virgule soixante-trois",
    ["huit virgule six cent trois","huit-cent-soixante-trois"],
    "8, puis virgule soixante-trois (soixante-trois centièmes).","Soixante-trois centièmes.")
];

var TOTAL=EXERCISES.length;
var current=0;
var userAnswers=new Array(TOTAL).fill(null);
var qcmSel=new Array(TOTAL).fill(null);
var allDone=false;
function $(id){return document.getElementById(id);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function buildAll(){
  var host=$("cards");host.innerHTML="";
  EXERCISES.forEach(function(ex,i){
    var card=document.createElement("div");card.className="card";card.id="card-"+i;
    var num="Défi "+(i<9?"0":"")+(i+1);
    var eqClass="eq-box"+(ex.small?" small":"");
    var inner='<div class="card-stripe"></div><div class="card-inner">'
      +'<div class="q-header"><div class="step-num">'+(i+1)+'</div><div class="q-num">'+num+'</div>'
      +'<div class="theme-badge">'+ex.theme+'</div></div>'
      +'<div class="'+eqClass+'">'+ex.eqHtml+'</div>';
    if(ex.kind==="num"){
      inner+='<div class="input-row"><span class="input-label">'+ex.label+'</span>'
        +'<input type="number" class="answer-input" id="inp-'+i+'" placeholder="?" autocomplete="off" step="any"/></div>';
    }else{
      inner+='<div class="qcm-row" id="qcm-'+i+'"></div>';
    }
    inner+='<div class="btn-row">'
      +'<button class="btn btn-prev" id="prev-'+i+'" onclick="goPrev('+i+')"'+(i===0?' style="display:none;"':'')+'>← Précédent</button>'
      +'<button class="btn btn-check" id="chk-'+i+'" onclick="checkItem('+i+')"'+(ex.kind==="qcm"?' disabled':'')+'>✓ Valider</button>'
      +'<button class="btn btn-hint" id="hintbtn-'+i+'" onclick="toggleHint('+i+')">? Indice</button>'
      +'<button class="btn btn-solution" id="solbtn-'+i+'" onclick="toggleSolution('+i+')" disabled>Solution</button>'
      +'<button class="btn btn-next" id="next-'+i+'" onclick="goNext('+i+')">Suivant →</button>'
      +'</div>'
      +'<div class="hint-box" id="hint-'+i+'"></div>'
      +'<div class="solution-box" id="sol-'+i+'"></div>'
      +'<div class="feedback" id="fb-'+i+'"><span class="feedback-icon" id="fbi-'+i+'"></span>'
      +'<div><div id="fbm-'+i+'"></div><div class="feedback-detail" id="fbd-'+i+'"></div></div></div>'
      +'</div>';
    card.innerHTML=inner;host.appendChild(card);
    if(ex.kind==="qcm")buildQcm(i);
  });
  showCard(current);
  updateScore();
}

function showCard(idx){
  current=idx;
  for(var k=0;k<TOTAL;k++){var c=$("card-"+k);if(c)c.style.display=(k===idx?"block":"none");}
}

function ensureShuffled(i){
  var ex=EXERCISES[i];
  if(ex._shuffled)return;
  for(var s=ex.choices.length-1;s>0;s--){var r=Math.floor(Math.random()*(s+1));var t=ex.choices[s];ex.choices[s]=ex.choices[r];ex.choices[r]=t;}
  ex.correctIdx=ex.choices.findIndex(function(c){return c.correct;});
  ex._shuffled=true;
}

function buildQcm(i){
  ensureShuffled(i);
  var ex=EXERCISES[i];var container=$("qcm-"+i);container.innerHTML="";
  var answered=userAnswers[i]!==null;
  ex.choices.forEach(function(ch,idx){
    var div=document.createElement("div");
    div.className="qcm-choice"+(answered?" locked":"");
    if(!answered) div.onclick=(function(ii,jj){return function(){selectQcm(ii,jj);};})(i,idx);
    if(answered){
      if(idx===ex.correctIdx) div.classList.add("correct-c");
      else if(idx===userAnswers[i]&&idx!==ex.correctIdx) div.classList.add("wrong-c");
    }else if(qcmSel[i]===idx) div.classList.add("selected");
    var radio=document.createElement("div");radio.className="qcm-radio";div.appendChild(radio);
    var span=document.createElement("span");span.textContent=ch.text;div.appendChild(span);
    container.appendChild(div);
  });
  if(!answered) $("chk-"+i).disabled=(qcmSel[i]===null);
}
function selectQcm(i,idx){
  if(userAnswers[i]!==null)return;
  qcmSel[i]=idx;
  $("qcm-"+i).querySelectorAll(".qcm-choice").forEach(function(c,k){c.classList.toggle("selected",k===idx);});
  $("chk-"+i).disabled=false;
}

function checkItem(i){
  if(userAnswers[i]!==null) return;          /* garde anti-double-clic */
  var ex=EXERCISES[i];
  if(ex.kind==="num"){
    var val=parseFloat($("inp-"+i).value);
    if(isNaN(val)){$("inp-"+i).focus();return;}
    userAnswers[i]=val;
  }else{
    if(qcmSel[i]===null) return;
    userAnswers[i]=qcmSel[i];
  }
  $("chk-"+i).disabled=true;                  /* désactivation immédiate */
  lock(i);
}

function checkCorrect(i){
  var ex=EXERCISES[i];
  if(ex.kind==="qcm") return userAnswers[i]===ex.correctIdx;
  return parseFloat(userAnswers[i])===ex.ans;
}

function lock(i){
  var ex=EXERCISES[i];var correct=checkCorrect(i);
  var fb=$("fb-"+i);fb.className="feedback show "+(correct?"ok":"ko");
  $("fbi-"+i).textContent=correct?"✅":"❌";
  var det=$("fbd-"+i);
  if(correct){
    $("fbm-"+i).textContent=pick(["Excellent ! Défi relevé.","Parfait.","Très bien.","Bravo."]);
    det.innerHTML=ex.solution;
  }else{
    $("fbm-"+i).textContent="Pas tout à fait…";
    var bonne=(ex.kind==="qcm")?ex.choices[ex.correctIdx].text:ex.ans;
    det.innerHTML="Bonne réponse : <strong>"+bonne+"</strong>.<br>"+ex.solution;
  }
  if(ex.kind==="num"){
    var inp=$("inp-"+i);inp.disabled=true;inp.className="answer-input "+(correct?"correct-input":"wrong-input");
  }else{
    buildQcm(i);
  }
  $("hintbtn-"+i).disabled=true;
  $("hint-"+i).classList.remove("show");
  $("solbtn-"+i).disabled=false;              /* Solution accessible après validation */
  updateScore();
}

function toggleHint(i){
  if(userAnswers[i]!==null) return;
  var h=$("hint-"+i);
  if(h.classList.contains("show")){h.classList.remove("show");}
  else{h.innerHTML="<strong>Indice&nbsp;:</strong> "+EXERCISES[i].hint;h.classList.add("show");}
}
function toggleSolution(i){
  if(userAnswers[i]===null) return;
  var s=$("sol-"+i);
  if(s.classList.contains("show")){s.classList.remove("show");}
  else{s.innerHTML="<strong>Solution&nbsp;:</strong> "+EXERCISES[i].solution;s.classList.add("show");}
}

function goNext(i){
  if(i<TOTAL-1){showCard(i+1);window.scrollTo({top:0,behavior:"smooth"});}
  else if(allDone){$("results-screen").scrollIntoView({behavior:"smooth",block:"start"});}
  else{window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});}
}
function goPrev(i){ if(i>0){showCard(i-1);window.scrollTo({top:0,behavior:"smooth"});} }

function updateScore(){
  var answered=userAnswers.filter(function(a){return a!==null;}).length;
  var ok=userAnswers.filter(function(a,i){return a!==null&&checkCorrect(i);}).length;
  if(ok<0)ok=0; if(ok>TOTAL)ok=TOTAL;
  var ko=answered-ok;
  $("h-ok").textContent=ok;$("h-ko").textContent=ko;$("h-rem").textContent=TOTAL-answered;
  var pct=Math.round((answered/TOTAL)*100);
  $("hero-bar").style.width=pct+"%";
  $("hero-prog-label").textContent=answered+" / "+TOTAL;
  if(answered>=TOTAL){allDone=true;showResults(ok);$("btn-restart").classList.add("show");}
  else{allDone=false;$("results-screen").classList.remove("show");$("btn-restart").classList.remove("show");}
}

function showResults(ok){
  $("score-num").textContent=ok;
  var stars=ok>=TOTAL?5:ok>=Math.ceil(TOTAL*0.8)?4:ok>=Math.ceil(TOTAL*0.6)?3:ok>=Math.ceil(TOTAL*0.4)?2:1;
  $("stars-row").textContent="⭐".repeat(stars)+"☆".repeat(5-stars);
  var msgs=["Reprends le cours avant de réessayer.","Encore un effort, reprends les notions.","Bon résultat, révise les points manqués.","Très bon résultat, presque parfait.","Défi relevé. Bravo."];
  $("results-msg").textContent=msgs[Math.min(stars-1,4)];
  $("results-screen").classList.add("show");
}

function restart(){
  EXERCISES.forEach(function(ex){if(ex.kind==="qcm"){ex._shuffled=false;}});
  userAnswers=new Array(TOTAL).fill(null);
  qcmSel=new Array(TOTAL).fill(null);
  current=0;allDone=false;
  $("results-screen").classList.remove("show");
  $("btn-restart").classList.remove("show");
  buildAll();
  window.scrollTo({top:0,behavior:"smooth"});
}

buildAll();
</script>
</body>
</html>
