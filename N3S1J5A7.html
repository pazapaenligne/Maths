<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Je relève le défi ! S1 J5</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f5c518;--day-dark:#8a6000;--day-title:#c49a00;--day-light:#fffbeb;--day-border:#f5e08a;--badge-txt:#3a2600;--day-glow:rgba(245,197,24,.20);
  --bg:#ffffff;--surface:#ffffff;--border:#ece7d6;--green:#5fa800;--green-soft:#8dc63f;--pink:#f28b82;--orange:#f5a623;--red:#d33;
  --text:#1a1d23;--muted:#7a7568;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  padding:0 0 3rem;overflow-x:hidden;line-height:1.7;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}
.frame{position:relative;overflow:hidden;max-width:720px;margin:0 auto;
  background:radial-gradient(300px 300px at 100% 0%,rgba(245,197,24,.16),transparent 60%),
             radial-gradient(240px 240px at 0% 100%,rgba(245,224,138,.20),transparent 60%),
             radial-gradient(150px 150px at 100% 75%,rgba(245,197,24,.10),transparent 60%),var(--bg);}
.bubble{position:absolute;border-radius:50%;pointer-events:none;}
.b1{width:280px;height:280px;top:-70px;right:-80px;background:var(--day);opacity:.5;}
.b2{width:220px;height:220px;bottom:160px;left:-80px;background:var(--day-border);opacity:.55;}
.b3{width:150px;height:150px;bottom:-30px;right:-40px;background:var(--day-border);opacity:.5;}
.layer{position:relative;z-index:1;}

.hero{background:var(--surface);border-bottom:2px solid var(--day-light);padding:2rem 1.25rem 1.6rem;text-align:center;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--day);color:var(--badge-txt);
  font-size:clamp(.66rem,2.6vw,.8rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.4rem 1.1rem;border-radius:99px;margin-bottom:.8rem;white-space:nowrap;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);letter-spacing:.14em;margin-bottom:.5rem;}
.hero h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.6rem,6.5vw,2.3rem);font-weight:900;line-height:1.15;color:var(--text);}
.hero h1 .hl{color:var(--day-title);}
.hero h1 .trophy{display:inline-block;animation:bounce 3s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-7px) rotate(5deg);}}
.hero .subtitle{color:var(--muted);font-size:clamp(.82rem,3vw,.92rem);margin-top:.5rem;}
.defi-tag{display:inline-flex;align-items:center;gap:.5rem;margin-top:.8rem;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.78rem;
  letter-spacing:.1em;color:var(--badge-txt);background:var(--day);padding:.4rem 1rem;border-radius:8px;text-transform:uppercase;}
.defi-tag-dot{width:8px;height:8px;border-radius:50%;background:#b06f0c;animation:flash .9s infinite;}
@keyframes flash{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.6);}}

.gamebox{max-width:720px;margin:1.3rem auto 0;padding:0 1.25rem;}
.scoreboard-sticky{position:sticky;top:0;z-index:5;}
.gb-inner{background:var(--surface);border:2px solid var(--day-border);border-radius:14px;padding:1rem;box-shadow:0 4px 16px var(--day-glow);}
.gb-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.16em;color:var(--day-dark);text-align:center;margin-bottom:.6rem;text-transform:uppercase;}
.scoreboard{display:flex;gap:.5rem;margin-bottom:.8rem;}
.sb{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:.5rem .3rem;text-align:center;}
.sb .v{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:clamp(2.2rem,8vw,2.6rem);line-height:1;}
.sb .l{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.1em;color:var(--muted);margin-top:.25rem;text-transform:uppercase;}
.sb.ok{border-color:#c7e89a;} .sb.ok .v{color:var(--green);}
.sb.rem{border-color:var(--day-border);} .sb.rem .v{color:var(--day-dark);}
.sb.err{border-color:#f4c4bf;} .sb.err .v{color:var(--red);}
.xp-bg{background:var(--border);border-radius:99px;height:13px;overflow:hidden;}
.xp-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--day-border));transition:width .6s ease;}
.xp-txt{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--day-dark);text-align:right;margin-top:.3rem;letter-spacing:.08em;}

.main{max-width:720px;margin:0 auto;padding:1.3rem 1.25rem 0;}
.card{background:var(--surface);border:2px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.3rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.card-stripe{height:5px;background:linear-gradient(90deg,#f5c518,#f5a623,#8dc63f,#3ab5d8);}
.card-inner{padding:1.4rem 1.2rem;}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:.9rem;flex-wrap:wrap;}
.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:900;flex-shrink:0;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.q-cat{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;padding:.2rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;margin-left:auto;white-space:nowrap;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1rem;
  font-family:'JetBrains Mono',monospace;font-size:clamp(1.3rem,4.5vw,1.7rem);font-weight:700;color:var(--day-dark);text-align:center;}
.eq-box sup{font-size:.7em;}
.q-text{font-size:.88rem;color:var(--muted);margin-bottom:.8rem;line-height:1.7;}
.qcm-row{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.7rem;}
.qcm-choice{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;border:2px solid var(--border);border-radius:10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.95rem;transition:.15s;background:#fff;min-height:2.8rem;}
.qcm-choice:hover:not(.locked){border-color:var(--day);background:var(--day-light);}
.qcm-choice.selected{border-color:var(--day);background:var(--day-light);}
.qcm-choice.correct-c{border-color:var(--green-soft);background:#f0faeb;color:#2f6e10;cursor:default;}
.qcm-choice.wrong-c{border-color:var(--pink);background:#fff0ef;color:#c0392b;cursor:default;}
.qcm-choice.locked{cursor:default;}
.qcm-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;}
.qcm-choice.selected .qcm-radio{background:var(--day);border-color:var(--day);}
.qcm-choice.correct-c .qcm-radio{background:var(--green-soft);border-color:var(--green-soft);}
.qcm-choice.wrong-c .qcm-radio{background:var(--pink);border-color:var(--pink);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:10px;
  font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;letter-spacing:.04em;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s,background .15s;min-height:2.6rem;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);} .btn:disabled{opacity:.4;cursor:default;}
.btn-check{background:var(--green);color:#fff;}
.btn-check:hover:not(:disabled){box-shadow:0 4px 14px rgba(95,168,0,.4);}
.btn-hint{background:#fff;border:2px solid var(--orange);color:#b06f0c;}
.btn-hint:hover{background:#fff7ec;}
.btn-retry{background:#fff;border:2px solid var(--day);color:var(--day-dark);}
.btn-retry:hover{background:var(--day-light);}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;}

.hint-box{margin-top:.9rem;background:var(--day-light);border:1.5px dashed var(--day);border-radius:10px;padding:.7rem 1rem;font-size:.82rem;color:var(--day-dark);display:none;line-height:1.7;font-family:'JetBrains Mono',monospace;}
.hint-box.show{display:block;}
.fb{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;font-size:.88rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
.fb.show{display:flex;}
.fb.ok{background:#f0faeb;border:1.5px solid var(--green-soft);color:#3a7d0a;}
.fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
.fb-icon{font-size:1.4rem;flex-shrink:0;}
.fb-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.7;}

.results{display:none;}
.results.show{display:block;}
.results-card{background:var(--surface);border:2px solid var(--day-border);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px var(--day-glow);margin-bottom:1.3rem;}
.results-inner{padding:2rem 1.3rem;text-align:center;}
.results-trophy{font-size:3.4rem;animation:bounce 3s infinite;display:block;margin-bottom:.3rem;}
.results-score{font-family:'JetBrains Mono',monospace;font-size:clamp(2.6rem,11vw,4rem);font-weight:900;line-height:1;margin:.3rem 0 .2rem;}
.results-score .s-num{color:var(--green);}
.stars-row{font-size:1.9rem;margin:.3rem 0 .9rem;letter-spacing:.15rem;}
.results-msg{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:.95rem;margin-bottom:1.4rem;letter-spacing:.03em;}
.restart-wrap{max-width:720px;margin:0 auto;padding:0 1.25rem;text-align:center;}
.btn-restart{background:var(--day);color:var(--badge-txt);font-size:.95rem;padding:.8rem 2rem;}
.btn-restart:hover{background:var(--day-dark);color:#fff;}

footer{text-align:center;margin-top:2.2rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.06em;}
@media(max-width:560px){.scoreboard{gap:.35rem;} .sb{padding:.45rem .12rem;} .sb .v{font-size:2rem;}}
@media(max-width:480px){
  .hero{padding:1.6rem 1rem 1.4rem;} .main,.gamebox,.restart-wrap{padding:0 1rem;}
  .card-inner{padding:1.2rem 1rem;} .btn-row{flex-direction:column;} .btn-check,.btn-hint{width:100%;}
}
</style>
</head>
<body>
<div class="frame">
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
  <div class="layer">
    <div class="hero">
      <div class="logo-badge">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#f5e08a"></span>
        <span class="logo-dot" style="background:#8a6000"></span>
        Pazapa &middot; Maths &middot; 3&egrave;me
      </div>
      <div class="week-label">SEMAINE 1 &mdash; JOUR 5</div>
      <h1><span class="trophy">&#127942;</span> Je <span class="hl">rel&egrave;ve le d&eacute;fi&nbsp;!</span></h1>
      <p class="subtitle">R&eacute;soudre une in&eacute;quation du type x&sup2; &lt; k ou x&sup2; &gt; k</p>
      <div class="defi-tag"><span class="defi-tag-dot"></span> D&eacute;fi r&eacute;vision 3&egrave;me</div>
    </div>

    <div class="gamebox scoreboard-sticky">
      <div class="gb-inner">
        <div class="gb-label">&#9654; D&eacute;fi r&eacute;vision 3&egrave;me</div>
        <div class="scoreboard">
          <div class="sb ok"><div class="v" id="h-ok">0</div><div class="l">R&eacute;ussies</div></div>
          <div class="sb rem"><div class="v" id="h-rem">6</div><div class="l">Restantes</div></div>
          <div class="sb err"><div class="v" id="h-ko">0</div><div class="l">Erreurs</div></div>
        </div>
        <div class="xp-bg"><div class="xp-fill" id="bar"></div></div>
        <div class="xp-txt" id="prog">0 / 6</div>
      </div>
    </div>

    <div class="main">
      <div id="cards"></div>
      <div class="results" id="results-screen">
        <div class="results-card">
          <div class="card-stripe"></div>
          <div class="results-inner">
            <span class="results-trophy">&#127942;</span>
            <div class="results-score"><span class="s-num" id="score-num">0</span>/<span id="score-tot">6</span></div>
            <div class="stars-row" id="stars-row"></div>
            <div class="results-msg" id="results-msg"></div>
          </div>
        </div>
      </div>
      <div class="restart-wrap">
        <button class="btn btn-restart" onclick="restart()">&#128260; Recommencer (nouveaux d&eacute;fis)</button>
      </div>
      <footer>N3 &middot; S1 &middot; J5 &middot; Je rel&egrave;ve le d&eacute;fi &middot; Pazapa Maths 3&egrave;me</footer>
    </div>
  </div>
</div>

<script>
/* Génération d'exercices x²<k / x²>k (k carré parfait -> racines entières) */
var KS=[4,9,16,25,36,49,64]; // racines 2..8
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function genExercises(){
  var exs=[];
  var usedK=[];
  for(var i=0;i<6;i++){
    var k; do{k=pick(KS);}while(usedK.indexOf(k)>=0 && usedK.length<KS.length);
    usedK.push(k);
    var r=Math.round(Math.sqrt(k));
    var lt=(Math.random()<0.5); // true: x²<k ; false: x²>k
    var eqHtml, correct, choices, method, hint;
    if(lt){
      eqHtml="x<sup>2</sup> &lt; "+k;
      correct="\u2212"+r+" &lt; x &lt; "+r;
      choices=[
        {t:"\u2212"+r+" &lt; x &lt; "+r, c:true},
        {t:"x &lt; \u2212"+r+" ou x &gt; "+r, c:false},
        {t:"x &lt; "+r, c:false},
        {t:"x &gt; "+r, c:false}
      ];
      method="x<sup>2</sup> &lt; "+k+" signifie que x est entre les deux racines.<br>"
        +"\u221a"+k+" = "+r+", donc les solutions sont <strong>\u2212"+r+" &lt; x &lt; "+r+"</strong>.";
      hint="Pense \u00e0 \u221a"+k+" = "+r+". Pour x<sup>2</sup> &lt; "+k+", x est ENTRE \u2212"+r+" et "+r+".";
    }else{
      eqHtml="x<sup>2</sup> &gt; "+k;
      correct="x &lt; \u2212"+r+" ou x &gt; "+r;
      choices=[
        {t:"x &lt; \u2212"+r+" ou x &gt; "+r, c:true},
        {t:"\u2212"+r+" &lt; x &lt; "+r, c:false},
        {t:"x &gt; "+r+" seulement", c:false},
        {t:"x &lt; "+k, c:false}
      ];
      method="x<sup>2</sup> &gt; "+k+" signifie que x est en dehors des deux racines.<br>"
        +"\u221a"+k+" = "+r+", donc les solutions sont <strong>x &lt; \u2212"+r+" ou x &gt; "+r+"</strong>.";
      hint="Pense \u00e0 \u221a"+k+" = "+r+". Pour x<sup>2</sup> &gt; "+k+", x est EN DEHORS de \u2212"+r+" et "+r+".";
    }
    shuffle(choices);
    var ci=choices.findIndex(function(o){return o.c;});
    exs.push({eqHtml:eqHtml, choices:choices, correctIdx:ci, method:method, hint:hint});
  }
  return exs;
}

var EXOS=genExercises(), TOTAL=EXOS.length;
var answers=new Array(TOTAL).fill(null), sel=new Array(TOTAL).fill(null);
function $(id){return document.getElementById(id);}

function buildAll(){
  var host=$("cards");host.innerHTML="";
  EXOS.forEach(function(ex,i){
    var card=document.createElement("div");card.className="card";card.id="card-"+i;
    var inner='<div class="card-stripe"></div><div class="card-inner">'
      +'<div class="q-header"><div class="step-num">'+(i+1)+'</div><div class="q-num">D\u00e9fi '+(i<9?"0":"")+(i+1)+'</div>'
      +'<div class="q-cat">In\u00e9quation x\u00b2</div></div>'
      +'<div class="eq-box">R\u00e9soudre : '+ex.eqHtml+'</div>'
      +'<div class="q-text">Quelle est la bonne solution ?</div>'
      +'<div class="qcm-row" id="qcm-'+i+'"></div>'
      +'<div class="btn-row"><button class="btn btn-check" id="chk-'+i+'" onclick="check('+i+')" disabled>&#10003; Valider</button>'
      +'<button class="btn btn-hint" onclick="toggleHint('+i+')">? Indice</button>'
      +'<button class="btn btn-retry" id="retry-'+i+'" onclick="retry('+i+')" style="display:none;">&#8635; R&eacute;essayer</button></div>'
      +'<div class="hint-box" id="hint-'+i+'"></div>'
      +'<div class="fb" id="fb-'+i+'"><span class="fb-icon" id="fbi-'+i+'"></span>'
      +'<div><div id="fbm-'+i+'"></div><div class="fb-detail" id="fbd-'+i+'"></div></div></div>'
      +'</div>';
    card.innerHTML=inner;host.appendChild(card);
    buildQcm(i);
  });
  updateScore();
}
function buildQcm(i){
  var ex=EXOS[i];var container=$("qcm-"+i);container.innerHTML="";
  var answered=answers[i]!==null;
  ex.choices.forEach(function(ch,idx){
    var div=document.createElement("div");
    div.className="qcm-choice"+(answered?" locked":"");
    if(!answered) div.onclick=(function(ii,jj){return function(){selectQcm(ii,jj);};})(i,idx);
    if(answered){
      if(idx===ex.correctIdx) div.classList.add("correct-c");
      else if(idx===answers[i]&&idx!==ex.correctIdx) div.classList.add("wrong-c");
    }else if(sel[i]===idx) div.classList.add("selected");
    var radio=document.createElement("div");radio.className="qcm-radio";div.appendChild(radio);
    var span=document.createElement("span");span.innerHTML=ch.t;div.appendChild(span);
    container.appendChild(div);
  });
  $("chk-"+i).disabled=answered||(sel[i]===null);
}
function selectQcm(i,idx){
  sel[i]=idx;
  $("qcm-"+i).querySelectorAll(".qcm-choice").forEach(function(c,k){c.classList.toggle("selected",k===idx);});
  $("chk-"+i).disabled=false;
}
function check(i){
  if(sel[i]===null)return;
  var ex=EXOS[i];var correct=(sel[i]===ex.correctIdx);
  if(correct){
    answers[i]=sel[i];
    var fb=$("fb-"+i);fb.className="fb show ok";
    $("fbi-"+i).textContent="\u2705";
    $("fbm-"+i).textContent=pick(["\uD83C\uDF89 Excellent ! D\u00e9fi relev\u00e9 !","\u26a1 Parfait !","\uD83C\uDF1F Tr\u00e8s bien !","\uD83C\uDFC6 Bravo !"]);
    $("fbd-"+i).innerHTML=ex.method;
    $("retry-"+i).style.display="none";
    buildQcm(i);updateScore();
  }else{
    // mauvaise réponse : on ne révèle PAS la solution, on invite à réessayer
    var fb=$("fb-"+i);fb.className="fb show ko";
    $("fbi-"+i).textContent="\u274C";
    $("fbm-"+i).textContent="Pas tout \u00e0 fait\u2026 r\u00e9essaie !";
    $("fbd-"+i).innerHTML="\uD83D\uDCA1 Besoin d'aide ? Clique sur <strong>? Indice</strong>, puis <strong>R\u00e9essayer</strong>.";
    // marquer le mauvais choix en rouge mais laisser la possibilité de re-choisir
    $("qcm-"+i).querySelectorAll(".qcm-choice").forEach(function(c,k){
      c.classList.remove("selected");
      if(k===sel[i]) c.classList.add("wrong-c");
    });
    $("chk-"+i).disabled=true;
    $("retry-"+i).style.display="inline-flex";
  }
}
function retry(i){
  // remet l'exo à zéro (même énoncé), nouvelle tentative
  sel[i]=null;
  $("fb-"+i).className="fb";
  $("retry-"+i).style.display="none";
  buildQcm(i);
}
function toggleHint(i){
  var h=$("hint-"+i);
  if(h.classList.contains("show")){h.classList.remove("show");}
  else{h.innerHTML="<strong>\uD83D\uDCA1 Indice :</strong> "+EXOS[i].hint;h.classList.add("show");}
}
function updateScore(){
  var answered=answers.filter(function(a){return a!==null;}).length;
  var ok=answers.filter(function(a,i){return a!==null&&a===EXOS[i].correctIdx;}).length;
  $("h-ok").textContent=ok;$("h-ko").textContent=answered-ok;$("h-rem").textContent=TOTAL-answered;
  $("bar").style.width=Math.round(answered/TOTAL*100)+"%";
  $("prog").textContent=answered+" / "+TOTAL;
  if(answered>=TOTAL) showResults(); else $("results-screen").classList.remove("show");
}
function showResults(){
  var ok=answers.filter(function(a,i){return a!==null&&a===EXOS[i].correctIdx;}).length;
  $("score-num").textContent=ok;$("score-tot").textContent=TOTAL;
  var ratio=ok/TOTAL;
  var stars=ratio>=1?5:ratio>=.8?4:ratio>=.6?3:ratio>=.4?2:1;
  $("stars-row").textContent="\u2B50".repeat(stars)+"\u2606".repeat(5-stars);
  $("results-msg").textContent=ratio>=1?"\uD83C\uDF89 Sans-faute ! Tu ma\u00eetrises les in\u00e9quations x\u00b2. Niveau Expert !"
    :ratio>=.6?"\uD83D\uDD25 Bien jou\u00e9 ! Encore un petit effort pour le sans-faute.":"\uD83D\uDD01 Personne ne r\u00e9ussit tout du premier coup. Relance et r\u00e9essaie !";
  $("results-screen").classList.add("show");
}
function restart(){
  EXOS=genExercises();
  answers=new Array(TOTAL).fill(null);sel=new Array(TOTAL).fill(null);
  $("results-screen").classList.remove("show");
  buildAll();
  window.scrollTo({top:0,behavior:"smooth"});
}
buildAll();
</script>
