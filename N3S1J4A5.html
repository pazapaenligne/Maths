<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Je relève le défi ! S1 J4</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#3ab5d8;--day-dark:#1a6e88;--day-title:#1a6e88;--day-light:#e8f6fb;--day-border:#9dd4e8;--badge-txt:#ffffff;--day-glow:rgba(58,181,216,.18);
  --bg:#ffffff;--surface:#ffffff;--border:#e3e8ea;
  --green:#5fa800;--green-soft:#8dc63f;--pink:#f28b82;--orange:#f5a623;--red:#d33;
  --text:#1a1d23;--muted:#6f7480;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  padding:0 0 3rem;overflow-x:hidden;line-height:1.7;letter-spacing:.02em;word-spacing:.06em;-webkit-tap-highlight-color:transparent;}
.frame{position:relative;overflow:hidden;max-width:720px;margin:0 auto;
  background:radial-gradient(300px 300px at 100% 0%,rgba(58,181,216,.12),transparent 60%),
             radial-gradient(240px 240px at 0% 100%,rgba(157,212,232,.16),transparent 60%),
             radial-gradient(150px 150px at 100% 75%,rgba(58,181,216,.08),transparent 60%),var(--bg);}
.bubble{position:absolute;border-radius:50%;pointer-events:none;}
.b1{width:300px;height:300px;top:-80px;right:-80px;background:var(--day);opacity:.12;}
.b2{width:240px;height:240px;bottom:-60px;left:-60px;background:var(--day-border);opacity:.18;}
.b3{width:150px;height:150px;bottom:300px;right:-40px;background:var(--day);opacity:.08;}
.layer{position:relative;z-index:1;}

/* HERO épuré (plus de gros bandeau) */
.hero{background:var(--surface);border-bottom:2px solid var(--day-light);padding:2rem 1.25rem 1.6rem;text-align:center;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--day);color:var(--badge-txt);
  font-size:clamp(.66rem,2.6vw,.8rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.4rem 1.1rem;border-radius:99px;margin-bottom:.8rem;white-space:nowrap;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);letter-spacing:.14em;margin-bottom:.5rem;}
.hero h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.6rem,6.5vw,2.3rem);font-weight:900;line-height:1.15;color:var(--text);}
.hero h1 .hl{color:var(--day-title);}
.hero h1 .trophy{display:inline-block;animation:bounce 3s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-7px) rotate(5deg);}}
.hero .subtitle{color:var(--muted);font-size:clamp(.82rem,3vw,.92rem);margin-top:.5rem;}
.defi-tag{display:inline-flex;align-items:center;gap:.5rem;margin-top:.8rem;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.78rem;
  letter-spacing:.1em;color:var(--badge-txt);background:var(--day);padding:.4rem 1rem;border-radius:8px;text-transform:uppercase;}
.defi-tag-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:flash .9s infinite;}
@keyframes flash{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.6);}}

/* SCOREBOARD sticky */
.gamebox{max-width:720px;margin:1.3rem auto 0;padding:0 1.25rem;}
.scoreboard-sticky{position:sticky;top:0;z-index:5;}
.gb-inner{background:var(--surface);border:2px solid var(--day-border);border-radius:14px;padding:1rem;box-shadow:0 4px 16px var(--day-glow);}
.gb-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.16em;color:var(--day-dark);text-align:center;margin-bottom:.6rem;text-transform:uppercase;}
.scoreboard{display:flex;gap:.5rem;margin-bottom:.8rem;}
.sb{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:.5rem .3rem;text-align:center;}
.sb .v{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:clamp(2.2rem,8vw,2.6rem);line-height:1;}
.sb .l{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.1em;color:var(--muted);margin-top:.25rem;text-transform:uppercase;}
.sb.ok{border-color:#c7e89a;} .sb.ok .v{color:var(--green);}
.sb.rem{border-color:var(--day-border);} .sb.rem .v{color:var(--day-dark);}
.sb.err{border-color:#f4c4bf;} .sb.err .v{color:var(--red);}
.xp-bg{background:var(--border);border-radius:99px;height:13px;overflow:hidden;}
.xp-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--day-border));transition:width .6s ease;}
.xp-txt{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--day-dark);text-align:right;margin-top:.3rem;letter-spacing:.08em;}

.main{max-width:720px;margin:0 auto;padding:1.3rem 1.25rem 0;}

/* CARTE défi */
.card{background:var(--surface);border:2px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.3rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.card-stripe{height:5px;background:linear-gradient(90deg,#9dd4e8,#b8dca0,#f5c518,#f5a623);}
.card-inner{padding:1.4rem 1.2rem;}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:.9rem;flex-wrap:wrap;}
.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:900;flex-shrink:0;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.q-cat{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;padding:.2rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;margin-left:auto;white-space:nowrap;}
.cat-eq{background:#dff3fb;color:#3a8fa8;border:1px solid #b8e4f0;}
.cat-pn{background:#fff0e8;color:var(--orange);border:1px solid #f5c090;}
.cat-pb{background:#e8f4fb;color:var(--day-dark);border:1px solid #a8d8f0;}
.cat-in{background:#fff5e6;color:#c0610a;border:1px solid #f5d0a0;}
.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1rem;
  font-family:'JetBrains Mono',monospace;font-size:clamp(1.1rem,4vw,1.5rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.5;word-break:break-word;}
.method-box{background:#f5fbfe;border:1px solid var(--day-border);border-radius:8px;padding:.7rem 1rem;margin-bottom:1.1rem;
  font-size:.82rem;font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.8;display:none;}
.method-box.show{display:block;}
.method-box strong{color:var(--day-dark);}

.input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.6rem;}
.input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:var(--text);}
.answer-input{width:130px;background:#fff;border:2px solid var(--border);border-radius:10px;color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:.55rem .85rem;outline:none;transition:border-color .2s;min-height:2.6rem;}
.answer-input:focus{border-color:var(--day);box-shadow:0 0 0 3px var(--day-glow);}
.answer-input.correct-input{border-color:var(--green-soft);background:#f0faeb;}
.answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}

.sign-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem;}
.sign-label{font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;width:100%;}
.sign-btn{padding:.5rem .95rem;border:2px solid var(--border);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;cursor:pointer;background:#fff;color:var(--text);transition:.15s;min-height:2.6rem;}
.sign-btn:hover:not(:disabled){border-color:var(--day);background:var(--day-light);}
.sign-btn.selected{border-color:var(--day);background:var(--day-light);color:var(--day-dark);}
.sign-btn.correct-sign{border-color:var(--green-soft);background:#f0faeb;color:#2f6e10;cursor:default;}
.sign-btn.wrong-sign{border-color:var(--pink);background:#fff0ef;color:#c0392b;cursor:default;}
.sign-display{font-family:'JetBrains Mono',monospace;font-size:1.15rem;font-weight:700;color:var(--muted);min-width:1.3rem;text-align:center;}

.qcm-row{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.7rem;}
.qcm-choice{display:flex;align-items:center;gap:.7rem;padding:.65rem 1rem;border:2px solid var(--border);border-radius:10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.9rem;transition:.15s;background:#fff;min-height:2.6rem;}
.qcm-choice:hover:not(.locked){border-color:var(--day);background:var(--day-light);}
.qcm-choice.selected{border-color:var(--day);background:var(--day-light);}
.qcm-choice.correct-c{border-color:var(--green-soft);background:#f0faeb;color:#2f6e10;cursor:default;}
.qcm-choice.wrong-c{border-color:var(--pink);background:#fff0ef;color:#c0392b;cursor:default;}
.qcm-choice.locked{cursor:default;}
.qcm-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;}
.qcm-choice.selected .qcm-radio{background:var(--day);border-color:var(--day);}
.qcm-choice.correct-c .qcm-radio{background:var(--green-soft);border-color:var(--green-soft);}
.qcm-choice.wrong-c .qcm-radio{background:var(--pink);border-color:var(--pink);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:10px;
  font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;letter-spacing:.04em;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s,background .15s;min-height:2.6rem;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);} .btn:disabled{opacity:.4;cursor:default;}
.btn-check{background:var(--green);color:#fff;}
.btn-check:hover:not(:disabled){box-shadow:0 4px 14px rgba(95,168,0,.4);}
.btn-hint{background:#fff;border:2px solid var(--orange);color:#b06f0c;}
.btn-hint:hover{background:#fff7ec;}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;}

.hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed #f5c518;border-radius:10px;padding:.7rem 1rem;font-size:.82rem;color:#7a6010;display:none;line-height:1.7;font-family:'JetBrains Mono',monospace;}
.hint-box.show{display:block;}
.feedback{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;font-size:.88rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
.feedback.show{display:flex;}
.feedback.ok{background:#f0faeb;border:1.5px solid var(--green-soft);color:#3a7d0a;}
.feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
.feedback-icon{font-size:1.4rem;flex-shrink:0;}
.feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.7;}

/* RESULTS */
.results{display:none;}
.results.show{display:block;}
.results-card{background:var(--surface);border:2px solid var(--day-border);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px var(--day-glow);margin-bottom:1.3rem;}
.results-inner{padding:2rem 1.3rem;text-align:center;}
.results-trophy{font-size:3.4rem;animation:bounce 3s infinite;display:block;margin-bottom:.3rem;}
.results-score{font-family:'JetBrains Mono',monospace;font-size:clamp(2.6rem,11vw,4rem);font-weight:900;line-height:1;margin:.3rem 0 .2rem;}
.results-score .s-num{color:var(--green);}
.stars-row{font-size:1.9rem;margin:.3rem 0 .9rem;letter-spacing:.15rem;}
.results-msg{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:.95rem;margin-bottom:1.4rem;letter-spacing:.03em;}

.restart-wrap{max-width:720px;margin:0 auto;padding:0 1.25rem;text-align:center;}
.btn-restart{background:var(--day);color:#fff;font-size:.95rem;padding:.8rem 2rem;}
.btn-restart:hover{background:var(--day-dark);}

footer{text-align:center;margin-top:2.2rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.06em;}
@media(max-width:560px){.scoreboard{gap:.35rem;} .sb{padding:.45rem .12rem;} .sb .v{font-size:2rem;}}
@media(max-width:480px){
  .hero{padding:1.6rem 1rem 1.4rem;} .main,.gamebox,.restart-wrap{padding:0 1rem;}
  .card-inner{padding:1.2rem 1rem;} .btn-row{flex-direction:column;} .btn-check,.btn-hint{width:100%;}
  .answer-input{width:100%;}
}
</style>
</head>
<body>
<div class="frame">
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
  <div class="layer">
    <div class="hero">
      <div class="logo-badge">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#3ab5d8"></span>
        Pazapa &middot; Maths &middot; 3&egrave;me
      </div>
      <div class="week-label">SEMAINE 1 &mdash; JOUR 4</div>
      <h1><span class="trophy">&#127942;</span> Je <span class="hl">rel&egrave;ve le d&eacute;fi&nbsp;!</span></h1>
      <p class="subtitle">10 challenges &middot; &eacute;quations &middot; in&eacute;quations &middot; probl&egrave;mes</p>
      <div class="defi-tag"><span class="defi-tag-dot"></span> D&eacute;fi r&eacute;vision 3&egrave;me</div>
    </div>

    <div class="gamebox scoreboard-sticky">
      <div class="gb-inner">
        <div class="gb-label">&#9654; D&eacute;fi r&eacute;vision 3&egrave;me</div>
        <div class="scoreboard">
          <div class="sb ok"><div class="v" id="h-ok">0</div><div class="l">R&eacute;ussies</div></div>
          <div class="sb rem"><div class="v" id="h-rem">10</div><div class="l">Restantes</div></div>
          <div class="sb err"><div class="v" id="h-ko">0</div><div class="l">Erreurs</div></div>
        </div>
        <div class="xp-bg"><div class="xp-fill" id="hero-bar"></div></div>
        <div class="xp-txt" id="hero-prog-label">0 / 10</div>
      </div>
    </div>

    <div class="main">
      <div id="cards"></div>
      <div class="results" id="results-screen">
        <div class="results-card">
          <div class="card-stripe"></div>
          <div class="results-inner">
            <span class="results-trophy">&#127942;</span>
            <div class="results-score"><span class="s-num" id="score-num">0</span>/10</div>
            <div class="stars-row" id="stars-row"></div>
            <div class="results-msg" id="results-msg"></div>
          </div>
        </div>
      </div>
      <div class="restart-wrap">
        <button class="btn btn-restart" onclick="restart()">&#128260; Recommencer (10 nouveaux d&eacute;fis)</button>
      </div>
      <footer>N3 &middot; S1 &middot; J4 &middot; Je rel&egrave;ve le d&eacute;fi &middot; Pazapa Maths 3&egrave;me</footer>
    </div>
  </div>
</div>

<script>
/* ===== MOTEUR DE GÉNÉRATION — IDENTIQUE À L'ORIGINAL (non modifié) ===== */
var SIGNS={lt:{html:"&lt;",text:"<",flip:"gt"},le:{html:"&le;",text:"\u2264",flip:"ge"},gt:{html:"&gt;",text:">",flip:"lt"},ge:{html:"&ge;",text:"\u2265",flip:"le"}};
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function genExercises(){
  var exs=[];
  // 3 équations 1er degré
  for(var i=0;i<3;i++){
    var a=rnd(2,8),x=rnd(-8,8),b=rnd(-12,12);
    var c=a*x+b;
    var bStr=b>=0?" + "+b:" \u2212 "+Math.abs(b);
    exs.push({kind:"num",cat:"cat-eq",catTxt:"\u00c9quation",
      eqHtml:a+"x"+bStr+" = "+c,
      label:"x =",ans:x,
      method:"<strong>1\ufe0f\u20e3</strong> Isoler x : "+a+"x = "+c+" \u2212 ("+b+") = "+(c-b)+"<br><strong>2\ufe0f\u20e3</strong> Diviser par "+a+" : x = "+(c-b)+" \u00f7 "+a+" = "+x,
      hint:"x = "+(c-b)+" \u00f7 "+a+" = "+x
    });
  }
  // 2 produit nul (QCM)
  for(var j=0;j<2;j++){
    var x1=rnd(-6,6),x2;
    do{x2=rnd(-6,6);}while(x2===x1);
    var k1=-x1,k2=-x2;
    var k1str=k1>=0?" + "+k1:" \u2212 "+Math.abs(k1);
    var k2str=k2>=0?" + "+k2:" \u2212 "+Math.abs(k2);
    var w1=x1+rnd(1,3),w2=x2-rnd(1,2);
    var choices=[
      {text:"x = "+x1+" ou x = "+x2, correct:true},
      {text:"x = "+w1+" ou x = "+w2, correct:false},
      {text:"x = "+(x1+x2)+" (somme)", correct:false},
      {text:"Pas de solution", correct:false}
    ];
    for(var s=choices.length-1;s>0;s--){var r=Math.floor(Math.random()*(s+1));var t=choices[s];choices[s]=choices[r];choices[r]=t;}
    var correctIdx=choices.findIndex(function(c){return c.correct;});
    exs.push({kind:"qcm",cat:"cat-pn",catTxt:"Produit nul",
      eqHtml:"(x"+k1str+")(x"+k2str+") = 0",
      choices:choices,correctIdx:correctIdx,
      method:"<strong>Propri\u00e9t\u00e9 :</strong> Si A\u00d7B = 0 alors A = 0 ou B = 0<br>x"+k1str+" = 0 \u2192 x = "+x1+"<br>x"+k2str+" = 0 \u2192 x = "+x2,
      hint:"x"+k1str+" = 0 \u2192 x = "+x1+" &nbsp; ou &nbsp; x"+k2str+" = 0 \u2192 x = "+x2,
      ans:correctIdx
    });
  }
  // 2 inéquations
  for(var k=0;k<2;k++){
    var ia=rnd(2,6),ix=rnd(-6,6),ib=rnd(-8,8);
    var isign=pick(["lt","le","gt","ge"]);
    var ic;
    if(isign==="lt")      ic=ia*ix+ib+rnd(1,4);
    else if(isign==="le") ic=ia*ix+ib;
    else if(isign==="gt") ic=ia*ix+ib-rnd(1,4);
    else                  ic=ia*ix+ib;
    var ibStr=ib>=0?" + "+ib:" \u2212 "+Math.abs(ib);
    exs.push({kind:"ineq",cat:"cat-in",catTxt:"In\u00e9quation",
      eqHtml:ia+"x"+ibStr+" "+SIGNS[isign].html+" "+ic,
      signKey:isign,ans:ix,
      method:"<strong>1\ufe0f\u20e3</strong> Isoler : "+ia+"x "+SIGNS[isign].html+" "+(ic-ib)+"<br><strong>2\ufe0f\u20e3</strong> Diviser par <strong>"+ia+"</strong> (positif \u2192 signe inchang\u00e9) :<br>x "+SIGNS[isign].html+" "+ix,
      hint:"x "+SIGNS[isign].text+" "+(ic-ib)+" \u00f7 "+ia+" = "+ix
    });
  }
  // 3 problèmes
  var pb=[
    (function(){
      var larg=rnd(2,6), dif=rnd(1,5);
      var perim=2*(larg+(larg+dif));
      return {kind:"num",cat:"cat-pb",catTxt:"Probl\u00e8me",
        eqHtml:"Le p\u00e9rim\u00e8tre d\u2019un rectangle est "+perim+" cm.<br>La longueur d\u00e9passe la largeur de "+dif+" cm.",
        label:"Largeur =",ans:larg,
        method:"<strong>Mise en \u00e9quation :</strong><br>Largeur = x, longueur = x + "+dif+"<br>2x + 2(x+"+dif+") = "+perim+"<br>4x + "+(2*dif)+" = "+perim+" \u2192 4x = "+(perim-2*dif)+" \u2192 x = "+larg,
        hint:"4x + "+(2*dif)+" = "+perim+" \u2192 x = "+larg
      };
    })(),
    (function(){
      var vit=pick([60,70,80,90,100]);
      var t=rnd(2,5);
      var dist=vit*t;
      return {kind:"num",cat:"cat-pb",catTxt:"Probl\u00e8me",
        eqHtml:"Une voiture roule \u00e0 "+vit+" km/h.<br>Elle doit parcourir "+dist+" km. Combien d\u2019heures ?",
        label:"Heures =",ans:t,
        method:"<strong>\u00c9quation :</strong> "+vit+"x = "+dist+"<br>x = "+dist+" \u00f7 "+vit+" = "+t,
        hint:vit+"x = "+dist+" \u2192 x = "+t
      };
    })(),
    (function(){
      var tot=rnd(20,60);
      var dif2=rnd(2,8);
      while((tot-dif2)%2!==0){tot=rnd(20,60);}
      var petite=(tot-dif2)/2;
      return {kind:"num",cat:"cat-pb",catTxt:"Probl\u00e8me",
        eqHtml:"On partage "+tot+" points en deux parties.<br>La grande d\u00e9passe la petite de "+dif2+" points.",
        label:"Petite partie =",ans:petite,
        method:"<strong>Mise en \u00e9quation :</strong><br>Petite = x, grande = x + "+dif2+"<br>2x + "+dif2+" = "+tot+" \u2192 2x = "+(tot-dif2)+" \u2192 x = "+petite,
        hint:"2x + "+dif2+" = "+tot+" \u2192 x = "+petite
      };
    })()
  ];
  pb.forEach(function(p){exs.push(p);});
  // Shuffle
  for(var m=exs.length-1;m>0;m--){
    var ri=Math.floor(Math.random()*(m+1));
    var tmp=exs[m];exs[m]=exs[ri];exs[ri]=tmp;
  }
  return exs;
}

/* ===== AFFICHAGE — toutes les cartes sur une page ===== */
var EXERCISES=genExercises(),TOTAL=EXERCISES.length;
var userAnswers=new Array(TOTAL).fill(null);
var userSigns=new Array(TOTAL).fill(null);
var selSign=new Array(TOTAL).fill(null);
var qcmSel=new Array(TOTAL).fill(null);
function $(id){return document.getElementById(id);}

function buildAll(){
  var host=$("cards");host.innerHTML="";
  EXERCISES.forEach(function(ex,i){
    var card=document.createElement("div");card.className="card";card.id="card-"+i;
    var num="D\u00e9fi "+(i<9?"0":"")+(i+1);
    var inner='<div class="card-stripe"></div><div class="card-inner">'
      +'<div class="q-header"><div class="step-num">'+(i+1)+'</div><div class="q-num">'+num+'</div>'
      +'<div class="q-cat '+ex.cat+'">'+ex.catTxt+'</div></div>'
      +'<div class="eq-box">'+ex.eqHtml+'</div>'
      +'<div class="method-box" id="method-'+i+'">'+ex.method+'</div>';
    if(ex.kind==="num"){
      inner+='<div class="input-row"><span class="input-label">'+ex.label+'</span>'
        +'<input type="number" class="answer-input" id="inp-'+i+'" placeholder="?" autocomplete="off" step="any"/></div>'
        +'<div class="btn-row"><button class="btn btn-check" id="chk-'+i+'" onclick="checkNum('+i+')">&#10003; Valider</button>'
        +'<button class="btn btn-hint" onclick="toggleHint('+i+')">? Indice</button></div>';
    }else if(ex.kind==="qcm"){
      inner+='<div class="qcm-row" id="qcm-'+i+'"></div>'
        +'<div class="btn-row"><button class="btn btn-check" id="chk-'+i+'" onclick="checkQcm('+i+')" disabled>&#10003; Valider</button>'
        +'<button class="btn btn-hint" onclick="toggleHint('+i+')">? Indice</button></div>';
    }else{
      inner+='<div class="sign-label">Choisis le signe :</div><div class="sign-row" id="sign-'+i+'">'
        +'<button class="sign-btn" onclick="selSignFn('+i+',\'lt\')">&lt;</button>'
        +'<button class="sign-btn" onclick="selSignFn('+i+',\'le\')">&le;</button>'
        +'<button class="sign-btn" onclick="selSignFn('+i+',\'gt\')">&gt;</button>'
        +'<button class="sign-btn" onclick="selSignFn('+i+',\'ge\')">&ge;</button></div>'
        +'<div class="input-row"><span class="input-label" style="color:var(--day-dark);">x</span>'
        +'<span class="sign-display" id="sd-'+i+'">?</span>'
        +'<input type="number" class="answer-input" id="inp-'+i+'" placeholder="?" autocomplete="off" step="any"/></div>'
        +'<div class="btn-row"><button class="btn btn-check" id="chk-'+i+'" onclick="checkIneq('+i+')">&#10003; Valider</button>'
        +'<button class="btn btn-hint" onclick="toggleHint('+i+')">? Indice</button></div>';
    }
    inner+='<div class="hint-box" id="hint-'+i+'"></div>'
      +'<div class="feedback" id="fb-'+i+'"><span class="feedback-icon" id="fbi-'+i+'"></span>'
      +'<div><div id="fbm-'+i+'"></div><div class="feedback-detail" id="fbd-'+i+'"></div></div></div>'
      +'</div>';
    card.innerHTML=inner;host.appendChild(card);
    if(ex.kind==="qcm")buildQcm(i);
  });
  updateScore();
}

function buildQcm(i){
  var ex=EXERCISES[i];var container=$("qcm-"+i);container.innerHTML="";
  var answered=userAnswers[i]!==null;
  ex.choices.forEach(function(ch,idx){
    var div=document.createElement("div");
    div.className="qcm-choice"+(answered?" locked":"");
    if(!answered) div.onclick=(function(ii,jj){return function(){selectQcm(ii,jj);};})(i,idx);
    if(answered){
      if(idx===ex.correctIdx) div.classList.add("correct-c");
      else if(idx===userAnswers[i]&&idx!==ex.correctIdx) div.classList.add("wrong-c");
    }else if(qcmSel[i]===idx) div.classList.add("selected");
    var radio=document.createElement("div");radio.className="qcm-radio";div.appendChild(radio);
    var span=document.createElement("span");span.textContent=ch.text;div.appendChild(span);
    container.appendChild(div);
  });
  $("chk-"+i).disabled=answered||(qcmSel[i]===null);
}
function selectQcm(i,idx){
  qcmSel[i]=idx;
  $("qcm-"+i).querySelectorAll(".qcm-choice").forEach(function(c,k){c.classList.toggle("selected",k===idx);});
  $("chk-"+i).disabled=false;
}
function checkQcm(i){ if(qcmSel[i]===null)return; userAnswers[i]=qcmSel[i]; lock(i); }

function selSignFn(i,sk){
  if(userAnswers[i]!==null)return;
  selSign[i]=sk;
  $("sign-"+i).querySelectorAll(".sign-btn").forEach(function(b){b.className="sign-btn";});
  var order=["lt","le","gt","ge"];var bIdx=order.indexOf(sk);
  $("sign-"+i).children[bIdx].classList.add("selected");
  $("sd-"+i).innerHTML=SIGNS[sk].html;$("sd-"+i).style.color="var(--day-dark)";
}

function checkCorrect(i){
  var ex=EXERCISES[i];
  if(ex.kind==="qcm") return userAnswers[i]===ex.correctIdx;
  if(ex.kind==="ineq") return userSigns[i]===ex.signKey&&parseFloat(userAnswers[i])===ex.ans;
  return parseFloat(userAnswers[i])===ex.ans;
}
function checkNum(i){
  var val=parseFloat($("inp-"+i).value);
  if(isNaN(val)){$("inp-"+i).focus();return;}
  userAnswers[i]=val;lock(i);
}
function checkIneq(i){
  if(!selSign[i]){var h=$("hint-"+i);h.innerHTML="<strong>\u26a0\ufe0f</strong> Choisis d\u2019abord le signe !";h.classList.add("show");return;}
  var val=parseFloat($("inp-"+i).value);
  if(isNaN(val)){$("inp-"+i).focus();return;}
  userAnswers[i]=val;userSigns[i]=selSign[i];lock(i);
}

function lock(i){
  var ex=EXERCISES[i];var correct=checkCorrect(i);
  // feedback
  var fb=$("fb-"+i);fb.className="feedback show "+(correct?"ok":"ko");
  $("fbi-"+i).textContent=correct?"\u2705":"\u274C";
  var det=$("fbd-"+i);
  if(correct){
    $("fbm-"+i).textContent=pick(["\uD83C\uDF89 Excellent ! D\u00e9fi relev\u00e9 !","\u26a1 Parfait !","\uD83C\uDF1F Tr\u00e8s bien !","\uD83C\uDFC6 Bravo !"]);
    det.textContent=ex.hint;
  }else{
    $("fbm-"+i).textContent="Pas tout \u00e0 fait\u2026";
    det.innerHTML=(ex.kind==="ineq"
      ?((userSigns[i]!==ex.signKey)?"\u26a0\ufe0f Signe attendu : "+SIGNS[ex.signKey].html+" ":"")
       +((parseFloat(userAnswers[i])!==ex.ans)?"\u26a0\ufe0f Valeur : "+ex.ans+" ":"")
      :"")+"<br>\uD83D\uDCA1 "+ex.hint;
  }
  // verrouiller la carte
  $("chk-"+i).disabled=true;
  if(ex.kind==="num"){
    var inp=$("inp-"+i);inp.disabled=true;inp.className="answer-input "+(correct?"correct-input":"wrong-input");
  }else if(ex.kind==="qcm"){
    buildQcm(i);
  }else{
    var inp2=$("inp-"+i);inp2.disabled=true;inp2.className="answer-input "+(correct?"correct-input":"wrong-input");
    $("sd-"+i).innerHTML=userSigns[i]?SIGNS[userSigns[i]].html:"?";
    $("sd-"+i).style.color=correct?"var(--green)":"var(--pink)";
    var order=["lt","le","gt","ge"];
    $("sign-"+i).querySelectorAll(".sign-btn").forEach(function(b,k){
      b.disabled=true;b.className="sign-btn";
      if(order[k]===ex.signKey) b.className="sign-btn correct-sign";
      else if(order[k]===userSigns[i]&&userSigns[i]!==ex.signKey) b.className="sign-btn wrong-sign";
    });
  }
  updateScore();
}

function toggleHint(i){
  var h=$("hint-"+i);
  if(h.classList.contains("show")){h.classList.remove("show");}
  else{h.innerHTML="<strong>\uD83D\uDCA1 Indice :</strong> "+EXERCISES[i].hint;h.classList.add("show");}
}

function updateScore(){
  var answered=userAnswers.filter(function(a){return a!==null;}).length;
  var ok=userAnswers.filter(function(a,i){return a!==null&&checkCorrect(i);}).length;
  var ko=answered-ok;
  $("h-ok").textContent=ok;$("h-ko").textContent=ko;$("h-rem").textContent=TOTAL-answered;
  var pct=Math.round((answered/TOTAL)*100);
  $("hero-bar").style.width=pct+"%";
  $("hero-prog-label").textContent=answered+" / "+TOTAL;
  if(answered>=TOTAL) showResults(); else $("results-screen").classList.remove("show");
}

function showResults(){
  var ok=userAnswers.filter(function(a,i){return a!==null&&checkCorrect(i);}).length;
  $("score-num").textContent=ok;
  var stars=ok>=9?5:ok>=7?4:ok>=5?3:ok>=3?2:1;
  $("stars-row").textContent="\u2B50".repeat(stars)+"\u2606".repeat(5-stars);
  $("results-msg").textContent=["Continue l\u2019entra\u00eenement !","Bon d\u00e9but !","Pas mal !","Bien jou\u00e9 !","Tr\u00e8s bien !","\uD83C\uDF89 D\u00e9fi RELEV\u00c9 ! Bravo !"][Math.min(ok,5)];
  $("results-screen").classList.add("show");
}

function restart(){
  EXERCISES=genExercises();
  userAnswers=new Array(TOTAL).fill(null);
  userSigns=new Array(TOTAL).fill(null);
  selSign=new Array(TOTAL).fill(null);
  qcmSel=new Array(TOTAL).fill(null);
  $("results-screen").classList.remove("show");
  buildAll();
  window.scrollTo({top:0,behavior:"smooth"});
}

buildAll();
</script>
