<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Quiz — Droites graduées</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  /* ═══ COULEUR DU JOUR — Vendredi (Jour 5) → Jaune ═══ */
  :root {
    --day-color:  #f5c518;
    --day-dark:   #8a6000;
    --day-light:  #fffbeb;
    --day-border: #f5e08a;
    --day-glow:   rgba(245,197,24,.3);
    --day-btn-text:#5a4000;
  }
  /* ═══ CHARTE PAZAPA — NE PAS TOUCHER ═══ */
  :root {
    --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
    --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
    --pink:#f28b82; --orange:#f5a623;
    --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:2rem 1rem 4rem;
    position:relative; overflow-x:hidden;
    letter-spacing:.02em; word-spacing:.06em;
  }
  body::before{
    content:''; position:fixed; border-radius:50%; z-index:0;
    opacity:.13; width:340px; height:340px;
    background:var(--yellow); top:-80px; right:-80px;
    pointer-events:none;
  }
  body::after{
    content:''; position:fixed; border-radius:50%; z-index:0;
    opacity:.13; width:260px; height:260px;
    background:var(--day-color); bottom:-60px; left:-60px;
    pointer-events:none;
  }
  .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
    width:180px;height:180px;background:var(--green);
    bottom:120px;right:-40px;pointer-events:none;}
  .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
    width:120px;height:120px;background:var(--pink);
    top:200px;left:-30px;pointer-events:none;}

  header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
  .logo-badge{
    display:inline-flex;align-items:center;gap:.5rem;
    background:var(--yellow);color:#000;
    font-size:.78rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;padding:.3rem .9rem;
    border-radius:99px;margin-bottom:.5rem;
  }
  .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
  h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
  h1 .hl{color:var(--day-dark);}
  .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

  .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
  .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
  .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--orange));border-radius:99px;transition:width .5s ease;}

  .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;
    flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
  .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;
    border-radius:99px;font-size:.8rem;
    font-family:'JetBrains Mono',monospace;
    border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  .chip.correct .dot{background:var(--green);}
  .chip.wrong   .dot{background:var(--pink);}
  .chip.remaining .dot{background:var(--muted);}

  .card{width:100%;max-width:680px;background:var(--surface);
    border:2px solid var(--border);border-radius:var(--radius);
    padding:2rem 2rem 1.6rem;position:relative;z-index:1;
    box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
    border-radius:var(--radius) var(--radius) 0 0;
    background:linear-gradient(90deg,var(--day-color),var(--orange),var(--pink));}

  .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;
    padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:.7rem;
    background:var(--day-light);color:var(--day-dark);
    border:1.5px solid var(--day-border);}

  .consigne{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;
    letter-spacing:.1em;color:var(--day-dark);text-transform:uppercase;
    margin-bottom:1.2rem;display:flex;align-items:center;gap:.5rem;}
  .consigne::before{content:'';display:inline-block;width:3px;height:16px;border-radius:2px;background:var(--day-color);flex-shrink:0;}

  .question{margin-bottom:.4rem;}
  .q-text{font-size:1rem;font-weight:700;line-height:1.6;color:var(--text);
    display:flex;align-items:flex-start;margin-bottom:.4rem;}
  .q-num-badge{display:inline-flex;align-items:center;justify-content:center;
    width:1.7rem;height:1.7rem;border-radius:50%;flex-shrink:0;
    background:var(--day-color);color:var(--day-btn-text);font-weight:800;font-size:.85rem;
    font-family:'JetBrains Mono',monospace;margin-right:.6rem;}
  .q-hint-type{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;margin:0 0 .8rem 2.3rem;}

  .svg-wrap{margin:0 0 1rem 2.3rem;padding:1rem;background:var(--bg);
    border:1.5px solid var(--border);border-radius:10px;overflow-x:auto;}
  .svg-wrap svg{display:block;max-width:100%;height:auto;}

  .options{display:flex;flex-direction:column;gap:.55rem;margin-left:2.3rem;}
  .option{display:flex;align-items:center;gap:.7rem;
    padding:.7rem 1rem;border:2px solid var(--border);border-radius:10px;
    background:var(--surface);cursor:pointer;min-height:2.6rem;
    transition:border-color .15s,background .15s,transform .1s;font-size:.92rem;}
  .option:hover:not(.locked){border-color:var(--day-border);background:var(--day-light);}
  .option:active:not(.locked){transform:scale(.99);}
  .option.locked{cursor:default;}
  .opt-box{width:20px;height:20px;border:2px solid var(--muted);flex-shrink:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:.8rem;color:#fff;transition:background .15s,border-color .15s;}
  .option.selected .opt-box{background:var(--day-color);border-color:var(--day-color);}
  .option.selected{border-color:var(--day-color);background:var(--day-light);}
  .opt-label{flex:1;line-height:1.4;}
  .option.correct{border-color:var(--green);background:#f0faeb;}
  .option.correct .opt-box{background:var(--green);border-color:var(--green);}
  .option.wrong{border-color:var(--pink);background:#fff0ef;}
  .option.wrong .opt-box{background:var(--pink);border-color:var(--pink);}
  .option.missed{border-color:var(--orange);background:#fffbeb;}
  .option.missed .opt-box{background:transparent;border-color:var(--orange);color:var(--orange);}
  .opt-tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;
    margin-left:auto;padding:.15rem .5rem;border-radius:99px;display:none;}
  .option.correct .opt-tag{display:inline;background:var(--green);color:#fff;}
  .option.wrong .opt-tag{display:inline;background:var(--pink);color:#fff;}
  .option.missed .opt-tag{display:inline;background:var(--orange);color:#fff;}

  .q-feedback{margin:.7rem 0 0 2.3rem;padding:.6rem .9rem;border-radius:8px;
    font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.7;
    display:none;}
  .q-feedback.show{display:block;}
  .q-feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
  .q-feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}

  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.6rem;position:relative;z-index:2;}
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:10px;
    font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;
    transition:transform .12s,box-shadow .15s;min-height:2.6rem;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.38;cursor:default;}
  .btn-primary{background:var(--day-color);color:var(--day-btn-text);box-shadow:0 3px 10px var(--day-glow);}
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
  .btn-solution{background:var(--day-dark);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
  .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

  .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
  .results.show{display:block;}
  .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
    padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
  .results-score .s-num{color:var(--day-dark);}
  .stars{font-size:2rem;margin:.4rem 0 1rem;letter-spacing:.1em;}
  .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
  .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
  .recap-item{display:flex;align-items:flex-start;gap:.8rem;padding:.65rem 1rem;background:var(--bg);
    border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.6;}
  .recap-item .eq{color:var(--day-dark);flex:1;}
  .recap-item.ok-item{border-color:#b5e08a;}
  .recap-item.ko-item{border-color:#f9c0bb;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:480px){
    .card,.results-card{padding:1.4rem;}
    .btn{font-size:.85rem;padding:.55rem 1rem;}
    .options,.q-feedback,.q-hint-type,.svg-wrap{margin-left:0;}
    .q-text{font-size:.95rem;}
  }
</style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#f28b82"></span>
    Pazapa &middot; Maths &middot; 6&egrave;me
  </div>
  <div class="week-label">Semaine 1 &ndash; Jour 5</div>
  <h1><span class="hl">Quiz &mdash; Les droites gradu&eacute;es</span></h1>
  <p class="subtitle">4 questions &middot; graduation et abscisses</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Question 1 / 4</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<div class="score-row">
  <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
  <div class="chip wrong"><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
  <div class="chip remaining"><div class="dot"></div><span id="count-rem">4</span> restantes</div>
</div>

<div class="card" id="ex-card">
  <div class="card-stripe"></div>

  <div class="theme-badge">Droites gradu&eacute;es</div>

  <div class="consigne">R&eacute;ponds aux quatre questions, puis v&eacute;rifie</div>

  <div id="quiz-zone"></div>

  <div class="btn-row">
    <button class="btn btn-ghost" id="btn-prev" onclick="prevQuestion()" style="display:none;">&#8592; Pr&eacute;c&eacute;dent</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">Suivant &#8594;</button>
    <button class="btn btn-primary" id="btn-check" onclick="checkAll()" style="display:none;">&#10003; V&eacute;rifier</button>
    <button class="btn btn-solution" id="btn-solution" onclick="showSolution()" style="display:none;">&#128161; Solution</button>
    <button class="btn btn-primary" id="btn-results" onclick="goResults()" style="display:none;">Voir les r&eacute;sultats &#8594;</button>
    <button class="btn btn-ghost" id="btn-restart-inline" onclick="restart()" style="display:none;">&#8635; Recommencer</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#f28b82"></span>
      R&eacute;sultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/4</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <div class="recap-list" id="recap-list"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">
      &#128260; Recommencer
    </button>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };

var SVG_Q3 =
'<svg viewBox="0 0 640 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Droite gradu\u00e9e de 0 \u00e0 3 avec les points A, B, C et D">'
+'<line x1="20" y1="75" x2="620" y2="75" stroke="#1a1d23" stroke-width="2"/>'
+'<polygon points="620,75 606,69 606,81" fill="#1a1d23"/>'
/* graduations principales 0,1,2,3 : pas de 180px */
+'<g stroke="#1a1d23" stroke-width="2">'
+'<line x1="40" y1="65" x2="40" y2="85"/>'
+'<line x1="220" y1="65" x2="220" y2="85"/>'
+'<line x1="400" y1="65" x2="400" y2="85"/>'
+'<line x1="580" y1="65" x2="580" y2="85"/>'
+'</g>'
/* petites graduations au dixieme */
+'<g stroke="#9aa0aa" stroke-width="1">'
+ (function(){var t='';for(var u=0;u<3;u++){for(var k=1;k<10;k++){var x=40+u*180+k*18;t+='<line x1="'+x+'" y1="70" x2="'+x+'" y2="80"/>';}}return t;})()
+'</g>'
/* labels 0 1 2 3 */
+'<g font-family="JetBrains Mono, monospace" font-size="14" fill="#1a1d23" text-anchor="middle">'
+'<text x="40" y="103">0</text><text x="220" y="103">1</text><text x="400" y="103">2</text><text x="580" y="103">3</text>'
+'</g>'
/* points A(0,3) B(1,7) C(2,8) D(3,1) -> x = 40 + valeur*180 */
+'<g>'
+'<circle cx="'+(40+0.3*180)+'" cy="75" r="4" fill="#e05a50"/><text x="'+(40+0.3*180)+'" y="55" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#e05a50" text-anchor="middle">A</text>'
+'<circle cx="'+(40+1.7*180)+'" cy="75" r="4" fill="#3ab5d8"/><text x="'+(40+1.7*180)+'" y="55" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#3ab5d8" text-anchor="middle">B</text>'
+'<circle cx="'+(40+2.8*180)+'" cy="75" r="4" fill="#8dc63f"/><text x="'+(40+2.8*180)+'" y="55" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#2f6e10" text-anchor="middle">C</text>'
+'<circle cx="'+(40+3.1*180)+'" cy="75" r="4" fill="#f5a623"/><text x="'+(40+3.1*180)+'" y="55" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#a86b00" text-anchor="middle">D</text>'
+'</g>'
+'</svg>';

var SVG_Q4 =
'<svg viewBox="0 0 640 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Droite gradu\u00e9e de 0 \u00e0 1 au centi\u00e8me, avec deux fl\u00e8ches A et B pr\u00e8s de z\u00e9ro">'
+'<line x1="30" y1="55" x2="610" y2="55" stroke="#1a1d23" stroke-width="2"/>'
/* graduations au dixieme (grandes) de 0 a 1 : 11 traits, pas de 56px */
+'<g stroke="#1a1d23" stroke-width="2">'
+ (function(){var t='';for(var k=0;k<11;k++){var x=40+k*56;t+='<line x1="'+x+'" y1="46" x2="'+x+'" y2="64"/>';}return t;})()
+'</g>'
/* petites graduations au centieme */
+'<g stroke="#9aa0aa" stroke-width="1">'
+ (function(){var t='';for(var d=0;d<10;d++){for(var c=1;c<10;c++){var x=40+d*56+c*5.6;t+='<line x1="'+x+'" y1="50" x2="'+x+'" y2="60"/>';}}return t;})()
+'</g>'
/* cadres 0 et 1 */
+'<g font-family="JetBrains Mono, monospace" font-size="13" fill="#1a1d23">'
+'<rect x="26" y="74" width="26" height="22" fill="none" stroke="#1a1d23"/><text x="39" y="89" text-anchor="middle">0</text>'
+'<rect x="584" y="74" width="26" height="22" fill="none" stroke="#1a1d23"/><text x="597" y="89" text-anchor="middle">1</text>'
+'</g>'
/* fleche A -> 0,01 (x=40+0.01*560=45.6) ; fleche B -> 0,1 (x=40+0.1*560=96) */
+'<g stroke="#e05a50" stroke-width="1.5" fill="#e05a50">'
+'<line x1="45.6" y1="55" x2="45.6" y2="35"/><polygon points="45.6,55 41,42 50,42"/>'
+'<text x="36" y="28" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">A</text>'
+'</g>'
+'<g stroke="#3ab5d8" stroke-width="1.5" fill="#3ab5d8">'
+'<line x1="96" y1="55" x2="96" y2="28"/><polygon points="96,55 91,35 101,35"/>'
+'<text x="104" y="24" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">B</text>'
+'</g>'
+'</svg>';

var QUESTIONS = [
  {
    id:0, type:"bool",
    enonce:"Pour graduer une demi-droite, il faut\u00a0: placer un point d\u2019origine, placer des unit\u00e9s \u00e0 \u00e9gales distances, graduer l\u2019espace entre deux unit\u00e9s de fa\u00e7on r\u00e9guli\u00e8re et placer une fl\u00e8che.",
    options:[ { txt:"Vrai", correct:true }, { txt:"Faux", correct:false } ],
    explication:"Ces quatre \u00e9tapes sont bien celles d\u2019une graduation correcte\u00a0: une origine, des unit\u00e9s r\u00e9guli\u00e8rement espac\u00e9es, des sous-graduations r\u00e9guli\u00e8res et une fl\u00e8che indiquant le sens. La proposition est donc vraie."
  },
  {
    id:1, type:"bool",
    enonce:"L\u2019espace entre deux unit\u00e9s sera coup\u00e9 en dix segments si on veut graduer au dixi\u00e8me, en cent segments si on veut graduer au centi\u00e8me.",
    options:[ { txt:"Vrai", correct:true }, { txt:"Faux", correct:false } ],
    explication:"Graduer au dixi\u00e8me revient \u00e0 partager chaque unit\u00e9 en 10 parts \u00e9gales\u00a0; au centi\u00e8me, en 100 parts \u00e9gales. La proposition est donc vraie."
  },
  {
    id:2, type:"qcm",
    enonce:"A a pour abscisse\u00a0:",
    svg:"Q3",
    options:[ { txt:"3", correct:false }, { txt:"0,3", correct:true } ],
    explication:"Entre 0 et 1, chaque petit intervalle vaut 0,1. Le point A se situe au troisi\u00e8me intervalle, son abscisse est donc 0,3."
  },
  {
    id:3, type:"qcm",
    enonce:"Sur cette droite gradu\u00e9e, la premi\u00e8re fl\u00e8che indique le nombre A et la deuxi\u00e8me le nombre B\u00a0:",
    svg:"Q4",
    options:[
      { txt:"A (0,1) et B (0,01)", correct:false },
      { txt:"On ne peut pas conna\u00eetre les abscisses des points A et B avec certitude.", correct:false },
      { txt:"A (0,01) et B (0,1)", correct:true }
    ],
    explication:"L\u2019unit\u00e9 (de 0 \u00e0 1) est partag\u00e9e en 100 petits intervalles, chacun valant 0,01. La premi\u00e8re fl\u00e8che (A) pointe le premier petit trait, soit 0,01\u00a0; la deuxi\u00e8me (B) pointe la premi\u00e8re grande graduation, soit 0,1."
  }
];

var TOTAL = QUESTIONS.length;
var selections = QUESTIONS.map(function(q){ return q.options.map(function(){ return false; }); });
var validated = false;
var currentQ = 0;
var pendingScore = 0;
var pendingResults = [];

function buildQuiz(){
  var z = $("quiz-zone");
  if(!z) return;
  z.innerHTML = "";
  QUESTIONS.forEach(function(q){
    var qDiv = document.createElement("div");
    qDiv.className = "question";
    qDiv.id = "question-"+q.id;
    if(q.id!==0) qDiv.style.display = "none";

    var qText = document.createElement("div");
    qText.className = "q-text";
    qText.innerHTML = "<span class='q-num-badge'>"+(q.id+1)+"</span><span>"+q.enonce+"</span>";
    qDiv.appendChild(qText);

    var hint = document.createElement("div");
    hint.className = "q-hint-type";
    hint.textContent = q.type==="bool" ? "Vrai ou faux" : "Une seule r\u00e9ponse";
    qDiv.appendChild(hint);

    if(q.svg){
      var sv = document.createElement("div");
      sv.className = "svg-wrap";
      sv.innerHTML = (q.svg==="Q3") ? SVG_Q3 : SVG_Q4;
      qDiv.appendChild(sv);
    }

    var opts = document.createElement("div");
    opts.className = "options";
    q.options.forEach(function(o,oi){
      var opt = document.createElement("div");
      opt.className = "option";
      opt.id = "opt-"+q.id+"-"+oi;
      opt.innerHTML = "<span class='opt-box' id='box-"+q.id+"-"+oi+"'></span>"
        + "<span class='opt-label'>"+o.txt+"</span>"
        + "<span class='opt-tag' id='tag-"+q.id+"-"+oi+"'></span>";
      opt.addEventListener("click", function(){ toggleOption(q.id,oi); });
      opts.appendChild(opt);
    });
    qDiv.appendChild(opts);

    var fb = document.createElement("div");
    fb.className = "q-feedback";
    fb.id = "qfb-"+q.id;
    qDiv.appendChild(fb);

    z.appendChild(qDiv);
  });
}

function showQuestion(qi){
  if(validated) return;
  QUESTIONS.forEach(function(q){
    var el = $("question-"+q.id);
    if(el) el.style.display = (q.id===qi) ? "block" : "none";
  });
  currentQ = qi;
  $("btn-prev").style.display = (qi>0) ? "inline-flex" : "none";
  var isLast = (qi === TOTAL-1);
  $("btn-next").style.display = isLast ? "none" : "inline-flex";
  $("btn-check").style.display = isLast ? "inline-flex" : "none";
  updateProgress();
}

function nextQuestion(){ if(!validated && currentQ < TOTAL-1) showQuestion(currentQ+1); }
function prevQuestion(){ if(!validated && currentQ > 0) showQuestion(currentQ-1); }

function toggleOption(qi,oi){
  if(validated) return;
  // Toutes les questions sont \u00e0 r\u00e9ponse unique
  selections[qi] = QUESTIONS[qi].options.map(function(_,i){ return i===oi; });
  refreshSelections(qi);
  updateProgress();
}

function refreshSelections(qi){
  QUESTIONS[qi].options.forEach(function(_,oi){
    var opt = $("opt-"+qi+"-"+oi);
    var box = $("box-"+qi+"-"+oi);
    if(selections[qi][oi]){ opt.classList.add("selected"); box.innerHTML = "&#10003;"; }
    else { opt.classList.remove("selected"); box.innerHTML = ""; }
  });
}

function questionAnswered(qi){ return selections[qi].some(function(v){ return v; }); }

function updateProgress(){
  if(validated) return;
  var pct = Math.round((currentQ+1)/TOTAL*100);
  $("progress-bar").style.width = pct+"%";
  $("prog-pct").textContent = pct+"\u00a0%";
  $("prog-label").textContent = "Question "+(currentQ+1)+" / "+TOTAL;
  var done = 0;
  for(var i=0;i<TOTAL;i++){ if(questionAnswered(i)) done++; }
  $("count-rem").textContent = TOTAL - done;
}

function isQuestionCorrect(qi){
  var q = QUESTIONS[qi];
  for(var i=0;i<q.options.length;i++){
    if(selections[qi][i] !== q.options[i].correct) return false;
  }
  return true;
}

function checkAll(){
  if(validated) return;
  var anyAnswer = false;
  for(var i=0;i<TOTAL;i++){ if(questionAnswered(i)) anyAnswer = true; }
  if(!anyAnswer) return;
  validated = true;

  QUESTIONS.forEach(function(q){
    var el = $("question-"+q.id);
    if(el) el.style.display = "block";
  });
  $("btn-prev").style.display = "none";
  $("btn-next").style.display = "none";

  var score = 0;
  var results = [];
  QUESTIONS.forEach(function(q,qi){
    var ok = isQuestionCorrect(qi);
    results.push(ok);
    if(ok) score++;
    q.options.forEach(function(o,oi){
      var opt = $("opt-"+qi+"-"+oi);
      var tag = $("tag-"+qi+"-"+oi);
      opt.classList.add("locked");
      if(o.correct && selections[qi][oi]){ opt.classList.add("correct"); tag.textContent="Bonne r\u00e9ponse"; }
      else if(!o.correct && selections[qi][oi]){ opt.classList.add("wrong"); tag.textContent="Ta r\u00e9ponse"; }
      else if(o.correct && !selections[qi][oi]){ opt.classList.add("missed"); tag.textContent="Bonne r\u00e9ponse"; }
    });
    var fb = $("qfb-"+qi);
    fb.className = "q-feedback show "+(ok?"ok":"ko");
    fb.innerHTML = (ok ? "\u2705 Correct\u00a0! " : "\u274c Pas tout \u00e0 fait. ") + q.explication;
  });

  $("progress-bar").style.width = "100%";
  $("prog-pct").textContent = "100\u00a0%";
  $("prog-label").textContent = "Termin\u00e9 \u2014 "+score+" / "+TOTAL;
  $("count-ok").textContent = score;
  $("count-ko").textContent = TOTAL - score;
  $("count-rem").textContent = 0;
  $("btn-check").disabled = true;
  $("btn-solution").style.display = "inline-flex";
  $("btn-results").style.display = "inline-flex";
  $("btn-restart-inline").style.display = "inline-flex";

  pendingScore = score;
  pendingResults = results;
  var firstFb = $("qfb-0");
  if(firstFb) firstFb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function goResults(){
  showResults(pendingScore, pendingResults);
}

function showSolution(){
  if(!validated) return;
  QUESTIONS.forEach(function(q,qi){
    q.options.forEach(function(o,oi){
      var opt = $("opt-"+qi+"-"+oi);
      var box = $("box-"+qi+"-"+oi);
      var tag = $("tag-"+qi+"-"+oi);
      opt.classList.remove("wrong","missed","selected");
      if(o.correct){ opt.classList.add("correct"); box.innerHTML="&#10003;"; tag.textContent="Bonne r\u00e9ponse"; tag.style.display="inline"; }
      else { opt.classList.remove("correct"); box.innerHTML=""; tag.textContent=""; tag.style.display="none"; }
    });
  });
  $("btn-solution").disabled = true;
}

function showResults(score,results){
  $("ex-card").style.display="none";
  var rs=$("results-screen");
  rs.classList.add("show");
  $("score-num").textContent=score;
  var stars = score===4?5 : score===3?4 : score===2?3 : score===1?2 : 1;
  $("stars-row").textContent="\u2b50".repeat(stars)+"\u2606".repeat(5-stars);
  var msg;
  if(score===4) msg="Parfait\u00a0! Les quatre questions sont justes.";
  else if(score===3) msg="Tr\u00e8s bien\u00a0! Une seule question \u00e0 revoir.";
  else if(score===2) msg="Bien. La moiti\u00e9 est correcte, continue.";
  else msg="\u00c0 retravailler. Relis la le\u00e7on, puis recommence.";
  $("results-msg").textContent=msg;
  var list=$("recap-list"); list.innerHTML="";
  QUESTIONS.forEach(function(q,qi){
    var div=document.createElement("div");
    div.className="recap-item "+(results[qi]?"ok-item":"ko-item");
    div.innerHTML="<span>"+(results[qi]?"\u2705":"\u274c")+"</span>"
      +"<span class='eq'>Question "+(qi+1)+"</span>"
      +"<span>"+(results[qi]?"\u2713":"\u2717")+"</span>";
    list.appendChild(div);
  });
  rs.scrollIntoView({behavior:"smooth",block:"start"});
}

function restart(){
  validated=false;
  currentQ=0;
  selections = QUESTIONS.map(function(q){ return q.options.map(function(){ return false; }); });
  $("results-screen").classList.remove("show");
  $("ex-card").style.display="block";
  $("btn-check").disabled=false;
  $("btn-check").style.display="none";
  $("btn-next").style.display="inline-flex";
  $("btn-prev").style.display="none";
  $("btn-solution").style.display="none";
  $("btn-solution").disabled=false;
  $("btn-results").style.display="none";
  $("btn-restart-inline").style.display="none";
  $("progress-bar").style.width="0%";
  $("prog-pct").textContent="0\u00a0%";
  $("prog-label").textContent="Question 1 / "+TOTAL;
  $("count-ok").textContent="0";
  $("count-ko").textContent="0";
  $("count-rem").textContent=TOTAL;
  buildQuiz();
  showQuestion(0);
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", function(){
  $("count-rem").textContent = TOTAL;
  buildQuiz();
  showQuestion(0);
});
</script>
</body>
</html>
