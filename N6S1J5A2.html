<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pazapa Maths – 6e – Graduer et lire une droite</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#ffffff;--surface:#ffffff;--border:#e8e4d9;--yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;}
header{text-align:center;margin-bottom:1.5rem;}
.badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--yellow);color:#000;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.28rem .85rem;border-radius:99px;margin-bottom:.8rem;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
h1{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:800;line-height:1.2;color:var(--text);}
h1 .gl{color:var(--green);}h1 .bl{color:var(--blue);}
.sub{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);margin-top:.3rem;margin-bottom:1.6rem;}
.prog-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;}
.prog-info{display:flex;justify-content:space-between;font-size:.75rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.35rem;}
.bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .5s;}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.chip{display:flex;align-items:center;gap:.35rem;padding:.28rem .7rem;border-radius:99px;font-size:.75rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:#fff;font-weight:600;color:var(--text);}
.chip .cd{width:8px;height:8px;border-radius:50%;}
.card{width:100%;max-width:680px;background:#fff;border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.8rem 1.4rem;position:relative;box-shadow:0 4px 24px rgba(0,0,0,.06);}
.stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink),var(--blue),var(--green));}
.qnum{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.08em;}
.eq{font-size:clamp(1.05rem,2.2vw,1.25rem);font-weight:800;color:var(--text);margin-bottom:1rem;line-height:1.45;}
.eq .calc{color:var(--blue);font-family:'JetBrains Mono',monospace;}

/* Vrai/Faux */
.statement{font-family:'Syne',sans-serif;font-weight:600;font-size:.98rem;margin-bottom:1.1rem;line-height:1.6;color:var(--text);}
.vf-row{display:flex;gap:.8rem;margin-bottom:.4rem;}
.vf-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.85rem 1rem;border-radius:14px;border:2.5px solid var(--border);background:#fff;font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;color:var(--text);}
.vf-btn:active{transform:scale(.97);}
.vf-btn .vf-ico{font-size:1.2rem;}
.vf-btn.v:hover{border-color:var(--green);}
.vf-btn.f:hover{border-color:var(--pink);}
.vf-btn.correct{border-color:var(--green)!important;background:#f0faeb!important;color:#3a7d0a!important;}
.vf-btn.wrong{border-color:var(--pink)!important;background:#fff0ef!important;color:#c0392b!important;}
.vf-btn.picked{box-shadow:0 0 0 3px rgba(26,29,35,.12);}
.vf-btn:disabled{cursor:default;}

/* Droites graduées */
.qtxt{font-size:.86rem;color:var(--muted);margin-bottom:1rem;}
.line-block{margin:.6rem 0 1.2rem;}
.line-stage{position:relative;width:100%;}
.line-stage svg{display:block;width:100%;height:auto;}
.nl-input{position:absolute;transform:translateX(-50%);width:66px;background:#f7f6f2;border:2px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;text-align:center;padding:.2rem .05rem;outline:none;transition:border-color .2s,background .2s;}
.nl-input:focus{border-color:var(--blue);background:#fff;z-index:5;}
.nl-input.ok{border-color:var(--green);background:#f0faeb;color:#3a7d0a;}
.nl-input.ko{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
.nl-input:disabled{cursor:default;}

.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.48rem 1.1rem;border-radius:99px;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(58,181,216,.25);}
.btn-h{background:var(--yellow);color:#5a3e00;}
.btn-g{background:transparent;color:var(--muted);border:2px solid var(--border);}
.fb{margin-top:.9rem;padding:.65rem .9rem;border-radius:10px;font-size:.86rem;display:none;align-items:flex-start;gap:.5rem;line-height:1.5;}
.fb.show{display:flex;}
.fb.ok{background:#f0faeb;border:1.5px solid var(--green);color:#3a7d0a;}
.fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
.fb-det{font-size:.82rem;color:var(--text);margin-top:.25rem;line-height:1.55;}
.fb-det b{color:var(--orange);}
.hint-box{margin-top:.8rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.65rem .9rem;font-size:.82rem;color:#7a6010;display:none;line-height:1.6;}
.hint-box.show{display:block;}
.hint-box strong{color:var(--orange);}
.nav{display:flex;justify-content:space-between;margin-top:1.2rem;gap:.5rem;}
.results{width:100%;max-width:680px;text-align:center;display:none;}
.results.show{display:block;}
.results-card{background:#fff;border:2px solid var(--border);border-radius:var(--radius);padding:2.2rem 1.8rem;box-shadow:0 4px 24px rgba(0,0,0,.06);}
.score{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:800;line-height:1;margin:.6rem 0 .3rem;color:var(--blue);}
.stars{font-size:1.8rem;margin:.3rem 0 .8rem;}
.rmsg{color:var(--muted);font-size:.9rem;margin-bottom:1.8rem;}
.recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.8rem;}
.ritem{display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;background:#f7f6f2;border:1.5px solid var(--border);border-radius:10px;font-size:.8rem;color:var(--text);}
.ritem.ok-i{border-color:#b5e08a;}
.ritem.ko-i{border-color:#f9c0bb;}
.ritem .re{flex:1;}
.ritem .rv{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.74rem;color:var(--muted);}
</style>
</head>
<body>
<header>
  <div class="badge">
    <span class="dot" style="background:#f5c518"></span>
    <span class="dot" style="background:#8dc63f"></span>
    <span class="dot" style="background:#3ab5d8"></span>
    Pazapa · Maths · 6e
  </div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:.73rem;color:#8a8f9a;margin-bottom:.35rem;letter-spacing:.06em;">Semaine 3 – Séance 8</div>
  <h1>Graduer et <span class="bl">lire</span> une droite <span class="gl">graduée</span></h1>
  <p class="sub">4 questions · niveau 6ème</p>
</header>

<div class="prog-wrap">
  <div class="prog-info"><span id="prog-lbl">Question 1 / 4</span><span id="prog-pct">0 %</span></div>
  <div class="bar-bg"><div class="bar-fill" id="prog-bar" style="width:0%"></div></div>
</div>
<div class="chips">
  <div class="chip"><div class="cd" style="background:#8dc63f"></div><span id="cnt-ok">0</span> correctes</div>
  <div class="chip"><div class="cd" style="background:#f28b82"></div><span id="cnt-ko">0</span> erreurs</div>
  <div class="chip"><div class="cd" style="background:#8a8f9a"></div><span id="cnt-rem">4</span> restantes</div>
</div>

<div class="card" id="ex-card">
  <div class="stripe"></div>
  <div class="qnum" id="q-num">Question 1</div>
  <div class="eq" id="q-eq"></div>
  <div class="qtxt" id="q-txt"></div>
  <div id="q-body"></div>
  <div class="hint-box" id="hint-box"></div>
  <div class="fb" id="feedback"><span id="fb-icon" style="font-size:1.1rem;flex-shrink:0"></span><div><div id="fb-msg"></div><div class="fb-det" id="fb-det"></div></div></div>
  <div class="nav">
    <button class="btn btn-g" id="btn-prev" onclick="prevQ()">← Précédent</button>
    <div style="display:flex;gap:.5rem;">
      <button class="btn btn-h" id="btn-hint" onclick="toggleHint()">? Indice</button>
      <button class="btn btn-p" id="btn-next" onclick="nextQ()" disabled>Suivant →</button>
    </div>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="badge" style="margin-bottom:.5rem">
      <span class="dot" style="background:#f5c518"></span>
      <span class="dot" style="background:#8dc63f"></span>
      <span class="dot" style="background:#3ab5d8"></span>
      Résultats
    </div>
    <div class="score"><span id="score-num">0</span>/4</div>
    <div class="stars" id="stars-row"></div>
    <div class="rmsg" id="results-msg"></div>
    <div class="recap" id="recap-list"></div>
    <button class="btn btn-p" onclick="restart()" style="margin:0 auto;display:flex;">🔄 Recommencer</button>
  </div>
</div>

<script>
// ============================================================
//  Semaine 3 – Séance 8 : Graduer / lire une droite graduée
//  Q1 (V/F) : méthode pour graduer une demi-droite        → VRAI
//  Q2 (V/F) : dixième=10 segments, centième=100 segments   → VRAI
//  Q3 (lire, pas 0,1)  : A=0,2 B=1,8 C=2,9 D=3,6
//  Q4 (lire, pas 0,01) : A=0,02 B=0,11   (image floue : à confirmer)
// ============================================================
const COL={red:'#e8453c',blue:'#3ab5d8',green:'#8dc63f',orange:'#f5a623'};

const EXS = [
  {
    type:'vf',
    eqHTML:'1. Cette affirmation est-elle correcte ?',
    statementHTML:'Pour graduer une demi-droite, il faut : placer un point d\u2019origine, placer des unités à égales distances, graduer l\u2019espace entre deux unités de façon régulière et placer une flèche.',
    answer:true,
    explain:'C\u2019est exactement la méthode : une origine, des unités régulièrement espacées, des sous-graduations régulières entre les unités, et une flèche indiquant le sens.',
    hint:'<strong>Astuce :</strong> reprends les étapes vues en cours. Manque-t-il quelque chose, ou y a-t-il une étape en trop ?'
  },
  {
    type:'vf',
    eqHTML:'2. Cette affirmation est-elle correcte ?',
    statementHTML:'L\u2019espace entre deux unités sera coupé en <b>dix</b> segments si on veut graduer au dixième, en <b>cent</b> segments si on veut graduer au centième.',
    answer:true,
    explain:'Au dixième, on partage l\u2019unité en 10 parts égales (chaque part = 0,1). Au centième, on la partage en 100 parts égales (chaque part = 0,01).',
    hint:'<strong>Astuce :</strong> « dixième » → combien de parts dans une unité ? Et « centième » ?'
  },
  {
    type:'read',
    eqHTML:'3. Donne l\u2019abscisse de chaque point.',
    txt:'Lis l\u2019abscisse de chaque point coloré et écris-la dans la case sous la droite.',
    line:{ start:0, end:3.7, step:0.1, majors:[0,1,2,3],
      marks:[{name:'A',val:0.2,color:COL.red},{name:'B',val:1.8,color:COL.blue},
             {name:'C',val:2.9,color:COL.green},{name:'D',val:3.6,color:COL.orange}] },
    hint:'<strong>Astuce :</strong> entre deux entiers il y a 10 intervalles, donc chaque graduation vaut 0,1. Compte depuis l\u2019entier le plus proche.'
  },
  {
    type:'read',
    eqHTML:'4. Donne l\u2019abscisse indiquée par chaque flèche.',
    txt:'La droite est graduée au centième : chaque petite graduation vaut 0,01.',
    line:{ start:0, end:0.32, step:0.01, majors:[0,0.1,0.2,0.3],
      marks:[{name:'A',val:0.02,color:COL.red},{name:'B',val:0.11,color:COL.blue}] },
    hint:'<strong>Astuce :</strong> de 0 à 0,1 il y a 10 intervalles, donc chaque graduation vaut 0,01. Compte les graduations depuis 0 (ou depuis 0,1 pour le 2\u1d49 point).'
  },
];

const TOTAL=EXS.length;
let cur=0, ans=new Array(TOTAL).fill(null), readAns={}, hintOpen=false;
const $=id=>document.getElementById(id);

function rnd(v){return Math.round(v*1e6)/1e6;}
function frNum(v){return String(rnd(v)).replace('.',',');}
function numNorm(s){const n=parseFloat(String(s).trim().replace(/\u202f/g,'').replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n;}
function numOk(t,v){const n=numNorm(v);return n!==null && Math.abs(n-t)<1e-9;}

function isAnsweredVF(i){return ans[i]!==null;}
function isAnsweredRead(i){return readAns[i]!==undefined;}
function isAnswered(i){const ex=EXS[i];return ex.type==='vf'?isAnsweredVF(i):isAnsweredRead(i);}

const VW=640, padL=42, padR=42, axisY=58, VH=128;

function makeSVG(cfg){
  const span=cfg.end-cfg.start;
  const xv=v=>padL+(v-cfg.start)/span*(VW-padL-padR);
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 '+VW+' '+VH);svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const axis=document.createElementNS(NS,'line');
  axis.setAttribute('x1',padL-12);axis.setAttribute('y1',axisY);axis.setAttribute('x2',VW-padR+6);axis.setAttribute('y2',axisY);
  axis.setAttribute('stroke','#1a1d23');axis.setAttribute('stroke-width','2.4');svg.appendChild(axis);
  const arr=document.createElementNS(NS,'path');
  arr.setAttribute('d','M'+(VW-padR+6)+','+(axisY-6)+' L'+(VW-padR+18)+','+axisY+' L'+(VW-padR+6)+','+(axisY+6)+' Z');
  arr.setAttribute('fill','#1a1d23');svg.appendChild(arr);
  const nb=Math.round(span/cfg.step);
  for(let i=0;i<=nb;i++){
    const v=rnd(cfg.start+i*cfg.step);
    const isMajor=cfg.majors.some(m=>Math.abs(m-v)<1e-6);
    const half=(i%5===0)&&!isMajor;
    const h=isMajor?15:(half?10:7);
    const tick=document.createElementNS(NS,'line');
    tick.setAttribute('x1',xv(v));tick.setAttribute('y1',axisY-h);tick.setAttribute('x2',xv(v));tick.setAttribute('y2',axisY+(isMajor?h:0));
    tick.setAttribute('stroke','#1a1d23');tick.setAttribute('stroke-width',isMajor?'2.4':'1.3');svg.appendChild(tick);
    if(isMajor){
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',xv(v));t.setAttribute('y',axisY+30);t.setAttribute('text-anchor','middle');
      t.setAttribute('font-family',"'JetBrains Mono',monospace");t.setAttribute('font-size','13');t.setAttribute('font-weight','600');t.setAttribute('fill','#1a1d23');
      t.textContent=frNum(v);svg.appendChild(t);
    }
  }
  return {svg,xv,NS};
}
function drawCross(svg,NS,px,col,name){
  const s=5;const cr=document.createElementNS(NS,'path');
  cr.setAttribute('d','M'+(px-s)+','+(axisY-s)+' L'+(px+s)+','+(axisY+s)+' M'+(px-s)+','+(axisY+s)+' L'+(px+s)+','+(axisY-s));
  cr.setAttribute('stroke',col);cr.setAttribute('stroke-width','2.6');cr.setAttribute('stroke-linecap','round');svg.appendChild(cr);
  if(name){
    const lt=document.createElementNS(NS,'text');
    lt.setAttribute('x',px);lt.setAttribute('y',axisY-22);lt.setAttribute('text-anchor','middle');
    lt.setAttribute('font-family',"'Syne',sans-serif");lt.setAttribute('font-size','15');lt.setAttribute('font-weight','800');lt.setAttribute('fill',col);
    lt.textContent=name;svg.appendChild(lt);
  }
}

function renderQ(){
  const ex=EXS[cur];
  $('q-num').textContent='Question '+(cur+1);
  $('q-eq').innerHTML=ex.eqHTML;
  $('q-txt').textContent=ex.txt||'';$('q-txt').style.display=ex.txt?'':'none';
  $('hint-box').classList.remove('show');$('hint-box').innerHTML='';hintOpen=false;
  $('feedback').className='fb';
  $('btn-prev').disabled=cur===0;
  $('btn-hint').style.display=ex.hint?'':'none';
  $('btn-next').textContent=cur===TOTAL-1?'Terminer →':'Suivant →';
  $('btn-next').disabled=!isAnswered(cur);
  const body=$('q-body');body.innerHTML='';
  if(ex.type==='vf')renderVF(ex,body);else renderRead(ex,body);
  updateStats();
}

/* Vrai/Faux */
function renderVF(ex,body){
  const st=document.createElement('div');st.className='statement';st.innerHTML=ex.statementHTML;body.appendChild(st);
  const row=document.createElement('div');row.className='vf-row';
  const bV=document.createElement('button');bV.className='vf-btn v';bV.innerHTML='<span class="vf-ico">✔</span> VRAI';bV.onclick=()=>chooseVF(true);
  const bF=document.createElement('button');bF.className='vf-btn f';bF.innerHTML='<span class="vf-ico">✘</span> FAUX';bF.onclick=()=>chooseVF(false);
  row.appendChild(bV);row.appendChild(bF);body.appendChild(row);
  if(isAnsweredVF(cur)){lockVF();showFB();}
}
function chooseVF(val){
  if(isAnsweredVF(cur))return;
  ans[cur]=val;lockVF();showFB();$('btn-next').disabled=false;updateStats();
}
function lockVF(){
  const ex=EXS[cur];const btns=document.querySelectorAll('.vf-btn');btns.forEach(b=>b.disabled=true);
  const btnV=btns[0],btnF=btns[1];const userVal=ans[cur];
  const goodBtn=ex.answer?btnV:btnF;const userBtn=userVal?btnV:btnF;
  goodBtn.classList.add('correct');
  if(userVal!==ex.answer)userBtn.classList.add('wrong');
  userBtn.classList.add('picked');
}

/* Lecture droite */
function renderRead(ex,body){
  const cfg=ex.line;const {svg,xv,NS}=makeSVG(cfg);
  cfg.marks.forEach(m=>drawCross(svg,NS,xv(m.val),m.color||'#1a1d23',m.name));
  const block=document.createElement('div');block.className='line-block';
  const stage=document.createElement('div');stage.className='line-stage';stage.appendChild(svg);
  cfg.marks.forEach((m,mi)=>{
    const px=xv(m.val);
    const inp=document.createElement('input');inp.type='text';inp.className='nl-input';inp.placeholder='?';inp.autocomplete='off';inp.id='r_'+mi;inp.dataset.val=m.val;
    inp.style.left=(px/VW*100)+'%';inp.style.top=((axisY+38)/VH*100)+'%';
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const bc=$('btn-check');if(bc&&!bc.disabled)checkRead();}});
    stage.appendChild(inp);
  });
  block.appendChild(stage);body.appendChild(block);
  const br=document.createElement('div');br.style.cssText='display:flex;gap:.5rem;margin-top:.7rem;';
  const bv=document.createElement('button');bv.className='btn btn-p';bv.id='btn-check';bv.textContent='Valider ✓';bv.onclick=checkRead;
  br.appendChild(bv);body.appendChild(br);
  if(isAnsweredRead(cur)){
    cfg.marks.forEach((m,mi)=>{const inp=$('r_'+mi);if(!inp)return;inp.value=readAns[cur][mi];inp.className='nl-input '+(numOk(m.val,readAns[cur][mi])?'ok':'ko');inp.disabled=true;});
    bv.disabled=true;showFB();
  }
  setTimeout(()=>{const f=document.querySelector('#q-body .nl-input:not(:disabled)');if(f)f.focus();},40);
}
function checkRead(){
  const ex=EXS[cur];const cfg=ex.line;
  readAns[cur]=cfg.marks.map((m,mi)=>($('r_'+mi)||{value:''}).value);
  cfg.marks.forEach((m,mi)=>{const inp=$('r_'+mi);if(!inp)return;inp.className='nl-input '+(numOk(m.val,readAns[cur][mi])?'ok':'ko');inp.disabled=true;});
  const bc=$('btn-check');if(bc)bc.disabled=true;
  showFB();$('btn-next').disabled=false;updateStats();
}

function exOk(i){
  const ex=EXS[i];
  if(ex.type==='vf')return isAnsweredVF(i)&&ans[i]===ex.answer;
  if(!isAnsweredRead(i))return false;
  return ex.line.marks.every((m,mi)=>numOk(m.val,readAns[i][mi]||''));
}

function showFB(){
  const ex=EXS[cur];const ok=exOk(cur);
  $('feedback').className='fb show '+(ok?'ok':'ko');
  $('fb-icon').textContent=ok?'✅':'❌';
  if(ex.type==='vf'){
    $('fb-msg').textContent=ok?'Bonne réponse !':'Réponse incorrecte';
    $('fb-det').innerHTML='Réponse : <b>'+(ex.answer?'VRAI':'FAUX')+'</b>. '+ex.explain;
  }else{
    const ids=ex.line.marks;
    const okC=ids.filter((m,mi)=>numOk(m.val,readAns[cur][mi]||'')).length;
    $('fb-msg').textContent=ok?'Parfait !':'Pas tout à fait…';
    if(ok){$('fb-det').textContent='Toutes les abscisses sont correctes !';}
    else{const wrong=ids.filter((m,mi)=>!numOk(m.val,readAns[cur][mi]||'')).map(m=>m.name+'='+frNum(m.val));
      $('fb-det').textContent='Bonnes réponses : '+okC+' / '+ids.length+'  ·  Attendu : '+wrong.join('  ·  ');}
  }
}

function toggleHint(){const h=$('hint-box');hintOpen=!hintOpen;if(hintOpen){h.innerHTML=EXS[cur].hint;h.classList.add('show');}else h.classList.remove('show');}

function updateStats(){
  const done=EXS.filter((ex,i)=>isAnswered(i)).length;
  $('prog-bar').style.width=Math.round(done/TOTAL*100)+'%';
  $('prog-lbl').textContent='Question '+(cur+1)+' / '+TOTAL;
  $('prog-pct').textContent=Math.round(done/TOTAL*100)+' %';
  let ok=0,ko=0;EXS.forEach((ex,i)=>{if(!isAnswered(i))return;if(exOk(i))ok++;else ko++;});
  $('cnt-ok').textContent=ok;$('cnt-ko').textContent=ko;$('cnt-rem').textContent=EXS.filter((ex,i)=>!isAnswered(i)).length;
}

function nextQ(){if(cur<TOTAL-1){cur++;renderQ();window.scrollTo({top:0,behavior:'smooth'});}else showResults();}
function prevQ(){if(cur>0){cur--;renderQ();window.scrollTo({top:0,behavior:'smooth'});}}

function showResults(){
  $('ex-card').style.display='none';$('results-screen').classList.add('show');
  let ok=0;EXS.forEach((ex,i)=>{if(exOk(i))ok++;});
  $('score-num').textContent=ok;
  const filled=Math.round(ok/TOTAL*5);
  $('stars-row').textContent='⭐'.repeat(filled)+'☆'.repeat(5-filled);
  const msgs=['Continue à t\u2019entraîner !','Quelques erreurs, persévère !','Tu progresses bien !','Presque parfait !','Parfait ! 🎉'];
  $('results-msg').textContent=msgs[ok];
  const list=$('recap-list');list.innerHTML='';
  EXS.forEach((ex,i)=>{
    const ok2=exOk(i);
    const d=document.createElement('div');d.className='ritem '+(ok2?'ok-i':'ko-i');
    const txt=document.createElement('span');txt.className='re';txt.textContent='Question '+(i+1);
    const rv=document.createElement('span');rv.className='rv';
    rv.textContent=ex.type==='vf'?(ex.answer?'VRAI':'FAUX'):ex.line.marks.map(m=>m.name+'='+frNum(m.val)).join(' ');
    d.innerHTML='<span>'+(ok2?'✅':'❌')+'</span>';
    d.appendChild(txt);d.appendChild(rv);list.appendChild(d);
  });
}

function restart(){
  cur=0;ans=new Array(TOTAL).fill(null);readAns={};
  $('ex-card').style.display='block';$('results-screen').classList.remove('show');renderQ();
}

document.addEventListener('keydown',e=>{
  if($('results-screen').classList.contains('show'))return;
  const ex=EXS[cur];
  if(ex.type==='vf' && !isAnsweredVF(cur)){
    const k=e.key.toLowerCase();
    if(k==='v')chooseVF(true);else if(k==='f')chooseVF(false);
  } else if(e.key==='Enter' && isAnswered(cur) && !$('btn-next').disabled){
    nextQ();
  }
});

renderQ();
</script>
</body>
</html>
