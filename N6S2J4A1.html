<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths — Quiz — Multiplier et diviser par 10, 100, 1000</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══ COULEUR DU JOUR — Jeudi (Jour 4) → Bleu ═══ */
    :root {
      --day-color:  #3ab5d8;
      --day-dark:   #1a6e88;
      --day-light:  #e8f6fb;
      --day-border: #9dd4e8;
      --day-glow:   rgba(58,181,216,.3);
    }
    /* ═══ CHARTE PAZAPA ═══ */
    :root {
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
      position:relative;overflow-x:hidden;letter-spacing:.02em;word-spacing:.06em;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--orange);top:200px;left:-30px;pointer-events:none;}

    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
    h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
    h1 .hl{color:var(--day-dark);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}

    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:99px;font-size:.8rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong .dot{background:var(--pink);}
    .chip.remaining .dot{background:var(--muted);}

    .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 2rem 1.6rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--green));}

    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);}
    .q-eq{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1.1rem,3vw,1.5rem);font-weight:700;color:var(--day-dark);text-align:center;}
    .q-instr{font-size:.85rem;color:var(--muted);margin-bottom:1.1rem;line-height:1.6;}

    .options{display:flex;flex-direction:column;gap:.6rem;}
    .option{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border:2px solid var(--border);border-radius:12px;background:var(--bg);cursor:pointer;transition:border-color .15s,background .15s;font-size:1rem;min-height:2.6rem;font-family:'JetBrains Mono',monospace;font-weight:600;}
    .option:hover:not(.locked){border-color:var(--day-color);}
    .option .marker{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;}
    .option.multi .marker{border-radius:6px;}
    .option.selected{border-color:var(--day-color);background:var(--day-light);}
    .option.selected .marker{border-color:var(--day-color);background:var(--day-color);color:#fff;}
    .option.correct-opt{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .option.correct-opt .marker{border-color:var(--green);background:var(--green);color:#fff;}
    .option.wrong-opt{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .option.wrong-opt .marker{border-color:var(--pink);background:var(--pink);color:#fff;}
    .option.missed-opt{border-color:var(--green);background:#f0faeb;color:#2f6e10;border-style:dashed;}
    .option.locked{cursor:default;}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;position:relative;z-index:2;margin-top:1.4rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:2.6rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;font-size:.9rem;display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback.partial{background:#fffbeb;border:1.5px solid var(--yellow);color:#7a6010;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.8;}

    .nav-row{display:flex;justify-content:space-between;margin-top:1.4rem;gap:.7rem;position:relative;z-index:2;flex-wrap:wrap;}

    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-dark);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;letter-spacing:.1em;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;padding:.65rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.6;}
    .recap-item .eq{color:var(--day-dark);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}
    .recap-item.ko-item{border-color:#f9c0bb;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:480px){
      .card,.results-card{padding:1.4rem;}
      .btn{font-size:.85rem;padding:.55rem 1rem;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#f28b82"></span>
      Pazapa &middot; Maths &middot; 6&egrave;me
    </div>
    <div class="week-label">Semaine 2 &ndash; Jour 4</div>
    <h1><span style="color:var(--text)">Quiz</span> <span class="hl">&mdash; Multiplier et diviser par 10, 100, 1000</span></h1>
    <p class="subtitle">3 questions &middot; calcul mental</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">Question 1 / 3</span>
      <span id="prog-pct">0&nbsp;%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div class="score-row">
    <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
    <div class="chip wrong"><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
    <div class="chip remaining"><div class="dot"></div><span id="count-rem">3</span> restantes</div>
  </div>

  <div class="card" id="ex-card">
    <div class="card-stripe"></div>
    <div class="q-num" id="q-num">Question 1</div>
    <div class="theme-badge">Calcul mental</div>
    <div class="q-eq" id="q-eq"></div>
    <div class="q-instr" id="q-instr"></div>
    <div class="options" id="options"></div>

    <div class="feedback" id="feedback">
      <span class="feedback-icon" id="fb-icon"></span>
      <div><div id="fb-msg"></div><div class="feedback-detail" id="fb-detail"></div></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-check" onclick="checkQ()">&#10003; V&eacute;rifier</button>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">&larr; Pr&eacute;c&eacute;dent</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button>
    </div>
  </div>

  <div class="results" id="results-screen">
    <div class="results-card">
      <div class="logo-badge" style="margin-bottom:.5rem">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#f28b82"></span>
        R&eacute;sultats
      </div>
      <div class="results-score"><span class="s-num" id="score-num">0</span>/3</div>
      <div class="stars" id="stars-row"></div>
      <div class="results-msg" id="results-msg"></div>
      <div class="recap-list" id="recap-list"></div>
      <button class="btn btn-primary" onclick="restartAll()" style="margin:0 auto;display:flex;">&#128260; Recommencer</button>
    </div>
  </div>

<script>
var $ = function(id){ return document.getElementById(id); };

var QUESTIONS = [
  {
    eq:"75,3 \u00d7 100 =",
    instr:"Choisis la bonne r\u00e9ponse.",
    type:"single",
    options:["75 300","7 530","753","0,753"],
    answer:1,
    why:"Multiplier par 100, c\u2019est d\u00e9caler la virgule de 2 rangs vers la droite\u00a0: 75,3 \u00d7 100 = 7 530."
  },
  {
    eq:"214,8 : 1 000 =",
    instr:"Choisis la bonne r\u00e9ponse.",
    type:"single",
    options:["0,214 8","2,148","21,48","214 800"],
    answer:0,
    why:"Diviser par 1 000, c\u2019est d\u00e9caler la virgule de 3 rangs vers la gauche\u00a0: 214,8 : 1 000 = 0,214 8."
  },
  {
    eq:"783,032 est\u00a0:",
    instr:"Coche toutes les bonnes r\u00e9ponses (plusieurs sont possibles).",
    type:"multi",
    options:[
      "1 000 fois plus grand que 783 032",
      "100 fois plus petit que 78 303,2",
      "10 000 fois plus grand que 0,078 303 2",
      "10 fois plus petit que 78,303 2"
    ],
    answers:[1,2],
    why:"783,032 \u00d7 100 = 78 303,2 (donc 100 fois plus petit) et 0,078 303 2 \u00d7 10 000 = 783,032 (donc 10 000 fois plus grand)."
  }
];

var TOTAL = QUESTIONS.length;
var current = 0;
var userAnswers = new Array(TOTAL).fill(null); // {ok, pick} ou {ok, picks:[]}
var draftSingle = new Array(TOTAL).fill(null);
var draftMulti = QUESTIONS.map(function(q){ return q.type==="multi" ? [] : null; });

function render(){
  var q = QUESTIONS[current];
  $("q-num").textContent = "Question " + (current+1);
  $("q-eq").textContent = q.eq;
  $("q-instr").textContent = q.instr;
  $("feedback").className = "feedback";

  var done = userAnswers[current] !== null;
  var box = $("options"); box.innerHTML = "";

  q.options.forEach(function(opt, i){
    var el = document.createElement("div");
    el.className = "option" + (q.type==="multi" ? " multi" : "");
    var marker = document.createElement("span"); marker.className = "marker";
    var label = document.createElement("span"); label.textContent = opt;
    el.appendChild(marker); el.appendChild(label);

    if(done){
      el.classList.add("locked");
      applyDoneState(el, marker, q, i);
    } else {
      if(q.type==="single" && draftSingle[current]===i){ el.classList.add("selected"); marker.textContent="\u2713"; }
      if(q.type==="multi" && draftMulti[current].indexOf(i)>=0){ el.classList.add("selected"); marker.textContent="\u2713"; }
      el.onclick = (function(idx){ return function(){ pick(idx); }; })(i);
    }
    box.appendChild(el);
  });

  $("btn-check").style.display = done ? "none" : "inline-flex";
  $("btn-check").disabled = done;
  $("btn-next").disabled = !done;
  $("btn-prev").disabled = current === 0;
  $("btn-next").textContent = (current === TOTAL-1) ? "Voir les r\u00e9sultats \u2192" : "Suivant \u2192";

  if(done) showFeedback();
  updateProgress();
}

function applyDoneState(el, marker, q, i){
  if(q.type==="single"){
    var pick = userAnswers[current].pick;
    if(i === q.answer){ el.classList.add("correct-opt"); marker.textContent="\u2713"; }
    else if(i === pick){ el.classList.add("wrong-opt"); marker.textContent="\u2717"; }
  } else {
    var picks = userAnswers[current].picks;
    var isAns = q.answers.indexOf(i)>=0;
    var isPicked = picks.indexOf(i)>=0;
    if(isAns && isPicked){ el.classList.add("correct-opt"); marker.textContent="\u2713"; }
    else if(!isAns && isPicked){ el.classList.add("wrong-opt"); marker.textContent="\u2717"; }
    else if(isAns && !isPicked){ el.classList.add("missed-opt"); marker.textContent="\u2713"; }
  }
}

function pick(i){
  var q = QUESTIONS[current];
  if(userAnswers[current] !== null) return;
  if(q.type==="single"){
    draftSingle[current] = i;
  } else {
    var arr = draftMulti[current];
    var p = arr.indexOf(i);
    if(p>=0) arr.splice(p,1); else arr.push(i);
  }
  render();
}

function checkQ(){
  if(userAnswers[current] !== null) return;
  var q = QUESTIONS[current];
  if(q.type==="single"){
    if(draftSingle[current]===null){ warnEmpty(); return; }
    var ok = draftSingle[current] === q.answer;
    userAnswers[current] = { ok:ok, score: ok?1:0, pick:draftSingle[current] };
  } else {
    if(draftMulti[current].length===0){ warnEmpty(); return; }
    var picks = draftMulti[current].slice().sort();
    var ans = q.answers.slice().sort();
    // demi-point par bonne affirmation cochée, mauvaises ignorées (pas de pénalité)
    var goodPicked = picks.filter(function(v){ return ans.indexOf(v)>=0; }).length;
    var score = goodPicked / ans.length; // 0, 0,5 ou 1 pour 2 bonnes
    var ok = score===1 && picks.length===ans.length; // tout bon et rien de superflu
    userAnswers[current] = { ok:ok, score:score, picks:picks };
  }
  render();
}

function warnEmpty(){
  var fb=$("feedback");
  fb.className="feedback show ko";
  $("fb-icon").textContent="\u270b";
  $("fb-msg").innerHTML="<strong>R\u00e9ponds d\u2019abord\u00a0!</strong>";
  $("fb-detail").textContent= QUESTIONS[current].type==="multi" ? "Coche au moins une r\u00e9ponse avant de v\u00e9rifier." : "Choisis une r\u00e9ponse avant de v\u00e9rifier.";
}

function showFeedback(){
  var q = QUESTIONS[current];
  var a = userAnswers[current];
  var fb = $("feedback");
  var partial = !a.ok && a.score>0;
  fb.className = "feedback show " + (a.ok ? "ok" : (partial ? "partial" : "ko"));
  $("fb-icon").textContent = a.ok ? "\u2705" : (partial ? "\u26a0" : "\u274c");
  if(a.ok) $("fb-msg").innerHTML = "<strong>Correct\u00a0!</strong>";
  else if(partial) $("fb-msg").innerHTML = "<strong>Presque\u00a0! Tu as trouv\u00e9 une bonne r\u00e9ponse, mais il en manque.</strong>";
  else $("fb-msg").innerHTML = "<strong>Pas tout \u00e0 fait.</strong>";
  $("fb-detail").textContent = q.why;
}

function updateProgress(){
  var answered = userAnswers.filter(function(a){ return a!==null; }).length;
  var pts = userAnswers.reduce(function(s,a){ return s + (a!==null ? a.score : 0); }, 0);
  $("progress-bar").style.width = Math.round(answered/TOTAL*100)+"%";
  $("prog-label").textContent = "Question " + (current+1) + " / " + TOTAL;
  $("prog-pct").textContent = Math.round(answered/TOTAL*100)+"\u00a0%";
  $("count-ok").textContent = fmtScore(pts);
  $("count-ko").textContent = fmtScore(answered - pts);
  $("count-rem").textContent = TOTAL - answered;
}

function fmtScore(n){
  return (Math.round(n*10)/10).toString().replace(".", ",");
}

function nextQ(){ if(current<TOTAL-1){ current++; render(); window.scrollTo({top:0,behavior:"smooth"}); } else showResults(); }
function prevQ(){ if(current>0){ current--; render(); window.scrollTo({top:0,behavior:"smooth"}); } }

function restartCurrent(){
  userAnswers[current] = null;
  if(QUESTIONS[current].type==="single") draftSingle[current]=null;
  else draftMulti[current]=[];
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function showResults(){
  $("ex-card").style.display="none";
  $("results-screen").classList.add("show");
  var pts = userAnswers.reduce(function(s,a){ return s + (a!==null ? a.score : 0); }, 0);
  $("score-num").textContent = fmtScore(pts);
  var ratio = pts/TOTAL;
  var stars = ratio>=1?5 : ratio>=0.8?4 : ratio>=0.6?3 : ratio>=0.4?2 : 1;
  $("stars-row").textContent = "\u2b50".repeat(stars)+"\u2606".repeat(5-stars);
  var msg;
  if(ratio>=1) msg="Parfait\u00a0! Les 3 r\u00e9ponses sont justes.";
  else if(ratio>=0.66) msg="Tr\u00e8s bien\u00a0! Tu sais d\u00e9caler la virgule.";
  else if(ratio>=0.34) msg="Bien. Revois le sens du d\u00e9calage de la virgule.";
  else msg="\u00c0 retravailler. Relis la r\u00e8gle, puis recommence.";
  $("results-msg").textContent = msg;
  var list=$("recap-list"); list.innerHTML="";
  QUESTIONS.forEach(function(q,i){
    var a=userAnswers[i];
    var sc = a ? a.score : 0;
    var full = a && a.ok;
    var partial = a && !a.ok && a.score>0;
    var div=document.createElement("div");
    div.className="recap-item "+(full?"ok-item":"ko-item");
    var icon = full ? "\u2705" : (partial ? "\u26a0" : "\u274c");
    var pts = (q.type==="multi") ? " <span style='color:var(--muted)'>("+fmtScore(sc)+" / 1)</span>" : "";
    div.innerHTML="<span>"+icon+"</span><span class='eq'></span>"+pts;
    div.querySelector(".eq").textContent = q.eq.replace(/\s*=\s*$/,"").replace(/\u00a0:$/,"");
    list.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restartAll(){
  current=0;
  userAnswers = new Array(TOTAL).fill(null);
  draftSingle = new Array(TOTAL).fill(null);
  draftMulti = QUESTIONS.map(function(q){ return q.type==="multi" ? [] : null; });
  $("ex-card").style.display="block";
  $("results-screen").classList.remove("show");
  $("count-ok").textContent="0"; $("count-ko").textContent="0"; $("count-rem").textContent=TOTAL;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", function(){
  $("count-rem").textContent = TOTAL;
  render();
});
</script>
</body>
</html>
