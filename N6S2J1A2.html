<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Semaine 2 Jour 1 – Encadrer et classer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══════════════════════════════════════════════════
       COULEUR DU JOUR — LUNDI (orange)
    ═══════════════════════════════════════════════════ */
    :root {
      --day-color:  #f5a623;
      --day-dark:   #c47a10;
      --day-light:  #fff5e0;
      --day-border: #f5d080;
      --day-glow:   rgba(245,166,35,.3);
    }

    /* ═══════════════════════════════════════════════════
       CHARTE PAZAPA — NE PAS TOUCHER
    ═══════════════════════════════════════════════════ */
    :root {
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg); color:var(--text);
      font-family:Arial,sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; padding:2rem 1rem 4rem;
      position:relative; overflow-x:hidden;
      letter-spacing:.02em; word-spacing:.06em;
    }
    body::before{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:340px; height:340px;
      background:var(--yellow); top:-80px; right:-80px;
      pointer-events:none;
    }
    body::after{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:260px; height:260px;
      background:var(--day-color); bottom:-60px; left:-60px;
      pointer-events:none;
    }
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:180px;height:180px;background:var(--green);
      bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:120px;height:120px;background:var(--pink);
      top:200px;left:-30px;pointer-events:none;}

    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{
      display:inline-flex;align-items:center;gap:.5rem;
      background:var(--yellow);color:#000;
      font-size:.78rem;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;padding:.3rem .9rem;
      border-radius:99px;margin-bottom:.5rem;
    }
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;color:var(--muted);margin-bottom:.5rem;
    }
    h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
    h1 .hl{color:var(--day-color);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;
      font-family:'JetBrains Mono',monospace;}

    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;
      position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;
      font-size:.78rem;color:var(--muted);
      font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;
      height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;
      background:linear-gradient(90deg,var(--day-color),var(--yellow));
      border-radius:99px;transition:width .5s ease;}

    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;
      flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;
      border-radius:99px;font-size:.8rem;
      font-family:'JetBrains Mono',monospace;
      border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong   .dot{background:var(--pink);}
    .chip.remaining .dot{background:var(--muted);}

    .card{width:100%;max-width:680px;background:var(--surface);
      border:2px solid var(--border);border-radius:var(--radius);
      padding:2rem 2rem 1.6rem;position:relative;z-index:1;
      box-shadow:0 4px 20px rgba(0,0,0,.06);
      animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}

    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;
      color:var(--muted);margin-bottom:.5rem;
      text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;
      padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;
      letter-spacing:.08em;margin-bottom:.7rem;
      background:var(--day-light);color:var(--day-dark);
      border:1.5px solid var(--day-border);}

    .eq-box{background:var(--day-light);border:2px solid var(--day-border);
      border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;
      font-family:'JetBrains Mono',monospace;
      font-size:clamp(1.1rem,3vw,1.6rem);
      font-weight:700;color:var(--day-dark);text-align:center;}

    .q-text{font-size:.9rem;color:var(--muted);
      margin-bottom:.8rem;line-height:1.8;}

    .method-box{background:var(--day-light);
      border:1.5px solid var(--day-border);
      border-left:4px solid var(--day-color);
      border-radius:8px;padding:.75rem 1rem;margin-bottom:1.2rem;
      font-size:.84rem;font-family:'JetBrains Mono',monospace;
      color:var(--day-dark);line-height:1.8;}
    .method-box strong{color:var(--day-color);}

    /* Étiquettes à choisir (exercice 2) */
    .choice-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.3rem;
      position:relative;z-index:2;}
    .choice-btn{padding:.5rem .95rem;border:2px solid var(--border);
      border-radius:10px;font-family:'JetBrains Mono',monospace;
      font-size:1rem;font-weight:700;cursor:pointer;background:var(--bg);
      color:var(--text);min-height:2.6rem;
      transition:transform .12s,border-color .15s,background .15s;}
    .choice-btn:hover:not(.locked){border-color:var(--day-color);}
    .choice-btn:active{transform:scale(.94);}
    .choice-btn.selected{border-color:var(--day-color);
      background:var(--day-light);color:var(--day-dark);}
    .choice-btn.correct-sign{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .choice-btn.wrong-sign{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .choice-btn.locked{cursor:default;}

    /* Inputs (exercices 3 et 4) */
    .input-row{display:flex;align-items:center;gap:.6rem;
      flex-wrap:wrap;position:relative;z-index:2;margin-bottom:.8rem;}
    .input-label{font-family:'JetBrains Mono',monospace;
      font-size:1rem;font-weight:700;}
    .answer-input{width:110px;background:var(--bg);
      border:2px solid var(--border);border-radius:10px;
      color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:1.05rem;padding:.5rem .85rem;outline:none;
      transition:border-color .2s;position:relative;z-index:2;height:2.6rem;text-align:center;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input  {border-color:var(--pink); background:#fff0ef;}
    .mid-num{font-family:'JetBrains Mono',monospace;font-weight:700;
      font-size:1.05rem;color:var(--day-dark);min-width:5rem;text-align:center;}
    .cmp{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--muted);}

    /* Rangement (exercice 1) */
    .sort-instruction{font-size:.82rem;color:var(--muted);
      font-family:'JetBrains Mono',monospace;margin-bottom:.6rem;line-height:1.8;}
    .sort-pool{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem;
      min-height:2.8rem;position:relative;z-index:2;}
    .sort-token{padding:.5rem .9rem;border:2px solid var(--day-border);
      border-radius:10px;background:var(--day-light);color:var(--day-dark);
      font-family:'JetBrains Mono',monospace;font-size:.95rem;font-weight:700;
      cursor:pointer;min-height:2.6rem;display:inline-flex;align-items:center;
      transition:transform .12s,opacity .15s;}
    .sort-token:hover:not(.used){transform:translateY(-2px);}
    .sort-token:active{transform:scale(.94);}
    .sort-token.used{opacity:.3;cursor:default;pointer-events:none;}
    .sort-slots{display:flex;gap:.45rem;flex-wrap:wrap;
      align-items:center;margin-bottom:.4rem;position:relative;z-index:2;}
    .sort-slot{min-width:3rem;min-height:2.6rem;padding:.5rem .6rem;
      border:2px dashed var(--border);border-radius:10px;
      display:inline-flex;align-items:center;justify-content:center;
      font-family:'JetBrains Mono',monospace;font-size:.92rem;font-weight:700;
      color:var(--text);background:var(--bg);cursor:pointer;text-align:center;}
    .sort-slot.filled{border-style:solid;border-color:var(--day-border);
      background:var(--day-light);color:var(--day-dark);}
    .sort-slot.correct-slot{border-style:solid;border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .sort-slot.wrong-slot{border-style:solid;border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .sort-arrow{color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:700;}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;
      position:relative;z-index:2;margin-top:.4rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;
      padding:.6rem 1.3rem;border-radius:10px;
      font-family:Arial,sans-serif;font-size:.92rem;
      font-weight:700;cursor:pointer;border:none;
      transition:transform .12s,box-shadow .15s;
      position:relative;z-index:2;min-height:2.6rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;
      box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);
      box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);
      border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

    .hint-box{margin-top:.9rem;background:#fffbeb;
      border:1.5px dashed var(--yellow);border-radius:10px;
      padding:.75rem 1rem;font-size:.85rem;color:#7a6010;
      display:none;line-height:1.8;
      font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}

    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;
      font-size:.9rem;display:none;align-items:flex-start;
      gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink); color:#c0392b;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:.82rem;margin-top:.3rem;line-height:1.8;}

    .nav-row{display:flex;justify-content:space-between;
      margin-top:1.4rem;gap:.7rem;position:relative;z-index:2;}

    .results{width:100%;max-width:680px;text-align:center;
      display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:2.5rem 2rem;
      box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;
      line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;
      gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;
      padding:.65rem 1rem;background:var(--bg);
      border:1.5px solid var(--border);border-radius:10px;
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;line-height:1.6;}
    .recap-item .eq{color:var(--day-color);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}
    .recap-item.ko-item{border-color:#f9c0bb;}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px);}
      to  {opacity:1;transform:translateY(0);}
    }
    .card,.results{animation:fadeUp .4s ease both;}
    @media(max-width:480px){
      .card{padding:1.4rem;}
      .btn{font-size:.85rem;padding:.55rem 1rem;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 6&egrave;me
    </div>
    <div class="week-label">Semaine 2 &ndash; Jour 1</div>
    <h1>Classer et <span class="hl">encadrer</span> les nombres d&eacute;cimaux</h1>
    <p class="subtitle">4 exercices &middot; nombres d&eacute;cimaux &middot; niveau 6&egrave;me</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">Exercice 1 / 4</span>
      <span id="prog-pct">0&nbsp;%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div class="score-row">
    <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
    <div class="chip wrong"  ><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
    <div class="chip remaining"><div class="dot"></div><span id="count-rem">4</span> restantes</div>
  </div>

  <div class="card" id="ex-card">
    <div class="card-stripe"></div>
    <div class="q-num" id="q-num">Exercice 1</div>
    <div class="theme-badge" id="q-theme">Rangement</div>
    <div class="eq-box" id="q-eq"></div>
    <div class="q-text" id="q-text"></div>
    <div class="method-box" id="method-box"></div>

    <div id="answer-zone"></div>

    <div class="btn-row" id="action-row">
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">&#10003; Valider</button>
      <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    </div>

    <div class="hint-box" id="hint-box"></div>

    <div class="feedback" id="feedback">
      <span class="feedback-icon" id="fb-icon"></span>
      <div>
        <div id="fb-msg"></div>
        <div class="feedback-detail" id="fb-detail"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">&larr; Pr&eacute;c&eacute;dent</button>
      <button class="btn btn-ghost" id="btn-restart" onclick="restart()">&#128260; Recommencer</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button>
    </div>
  </div>

  <div class="results" id="results-screen">
    <div class="results-card">
      <div class="logo-badge" style="margin-bottom:.5rem">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#3ab5d8"></span>
        R&eacute;sultats
      </div>
      <div class="results-score"><span class="s-num" id="score-num">0</span>/4</div>
      <div class="stars" id="stars-row"></div>
      <div class="results-msg" id="results-msg"></div>
      <div class="recap-list" id="recap-list"></div>
      <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">&#128260; Recommencer</button>
    </div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════
   EXERCICES — Semaine 2 Jour 1 (Activité 2) : classer & encadrer
   Contenu mathématique vérifié :
   EX1 (tri DÉCROISSANT des villes par population, en milliers) :
     Dunkerque 90,995 > Nanterre 90,722 > Créteil 89,84 > Avignon 89,38
     > Vitry-sur-Seine 88,1 > Fort-de-France 85,67 > Poitiers 8,64
   EX2 (étiquette qui rend l'encadrement vrai) :
     3,45<?<3,5 -> 3,491 | 4,7<?<4,8 -> 4,729
     23<?<23,02 -> 23,01 | 7,625<?<7,626 -> 7,6251
   EX3 (encadrement au dixième) :
     5,43->5,4..5,5 | 8,12->8,1..8,2 | 52,91->52,9..53
     18,954->18,9..19 | 14,034->14..14,1 | 67,109->67,1..67,2
   EX4 (encadrement au centième) :
     2,555->2,55..2,56 | 91,108->91,1..91,11 | 0,999->0,99..1
     85,014->85,01..85,02 | 47,566->47,56..47,57 | 3,547->3,54..3,55
═══════════════════════════════════════════════════════ */

/* "12,34" -> 12.34 */
function toNum(s){ return parseFloat(String(s).replace(',', '.')); }
/* nombres égaux par valeur (8,5 == 8,50) */
function sameNum(a, b){ return Math.abs(toNum(a) - toNum(b)) < 1e-9; }

var EXERCISES = [
  /* ── Exercice 1 : classer les villes (décroissant) ── */
  {
    type:  "sort",
    order: "desc",
    theme: "Rangement",
    eq:    "Classe les villes de la plus peupl\u00e9e \u00e0 la moins peupl\u00e9e",
    method:"<strong>M\u00e9thode :</strong> ordre <strong>d\u00e9croissant</strong> = du plus grand au plus petit.<br>"
         + "Compare d\u2019abord la partie enti\u00e8re (les milliers), puis les d\u00e9cimales chiffre par chiffre.",
    series: [
      { lbl:"Villes (habitants en milliers)", values:[
          "Avignon 89,38","Poitiers 8,64","Fort-de-France 85,67","Nanterre 90,722",
          "Cr\u00e9teil 89,84","Vitry-sur-Seine 88,1","Dunkerque 90,995"
        ],
        /* valeur numérique de tri associée à chaque étiquette */
        keys:[89.38, 8.64, 85.67, 90.722, 89.84, 88.1, 90.995]
      }
    ],
    hint:  "Le plus grand est Dunkerque (90,995), puis Nanterre (90,722). Attention : 90,722 et 90,995 ont la m\u00eame partie enti\u00e8re, on compare les d\u00e9cimales."
  },
  /* ── Exercice 2 : choisir la bonne étiquette ──────── */
  {
    type:  "choice",
    theme: "Encadrement",
    eq:    "Choisis l\u2019\u00e9tiquette qui compl\u00e8te l\u2019encadrement",
    method:"<strong>M\u00e9thode :</strong> le nombre cherch\u00e9 doit \u00eatre <strong>strictement plus grand</strong> que celui de gauche et <strong>strictement plus petit</strong> que celui de droite.<br>"
         + "Aligne les virgules et compare d\u00e9cimale par d\u00e9cimale.",
    rows: [
      { lbl:"a)", low:"3,45",  high:"3,5",   choices:["3,445","3,405","3,491"], ans:"3,491" },
      { lbl:"b)", low:"4,7",   high:"4,8",   choices:["4,800","4,729","4,67"],  ans:"4,729" },
      { lbl:"c)", low:"23",    high:"23,02", choices:["23,1","23,01","23,025"], ans:"23,01" },
      { lbl:"d)", low:"7,625", high:"7,626", choices:["7,6251","7,6250","7,6265"], ans:"7,6251" }
    ],
    hint:  "Pour a) : 3,45 = 3,450 et 3,5 = 3,500. Il faut un nombre entre 3,450 et 3,500 \u2192 3,491."
  },
  /* ── Exercice 3 : encadrement au dixième ──────────── */
  {
    type:  "frame",
    theme: "Au dixi\u00e8me",
    step:  0.1,
    eq:    "Encadre au dixi\u00e8me",
    method:"<strong>M\u00e9thode :</strong> un encadrement au dixi\u00e8me utilise des nombres avec <strong>un seul chiffre apr\u00e8s la virgule</strong>.<br>"
         + "Exemple : 6,8 &lt; 6,84 &lt; 6,9.",
    items: [
      { lbl:"a)", x:"5,43",   low:"5,4",  high:"5,5"  },
      { lbl:"b)", x:"8,12",   low:"8,1",  high:"8,2"  },
      { lbl:"c)", x:"52,91",  low:"52,9", high:"53"   },
      { lbl:"d)", x:"18,954", low:"18,9", high:"19"   },
      { lbl:"e)", x:"14,034", low:"14",   high:"14,1" },
      { lbl:"f)", x:"67,109", low:"67,1", high:"67,2" }
    ],
    hint:  "On cherche le dixi\u00e8me juste en dessous et le dixi\u00e8me juste au dessus. Ex : 52,91 \u2192 52,9 &lt; 52,91 &lt; 53."
  },
  /* ── Exercice 4 : encadrement au centième ─────────── */
  {
    type:  "frame",
    theme: "Au centi\u00e8me",
    step:  0.01,
    eq:    "Encadre au centi\u00e8me",
    method:"<strong>M\u00e9thode :</strong> un encadrement au centi\u00e8me utilise des nombres avec <strong>deux chiffres apr\u00e8s la virgule</strong>.<br>"
         + "Exemple : 8,54 &lt; 8,546 &lt; 8,55.",
    items: [
      { lbl:"a)", x:"2,555",  low:"2,55",  high:"2,56"  },
      { lbl:"b)", x:"91,108", low:"91,1",  high:"91,11" },
      { lbl:"c)", x:"0,999",  low:"0,99",  high:"1"     },
      { lbl:"d)", x:"85,014", low:"85,01", high:"85,02" },
      { lbl:"e)", x:"47,566", low:"47,56", high:"47,57" },
      { lbl:"f)", x:"3,547",  low:"3,54",  high:"3,55"  }
    ],
    hint:  "On cherche le centi\u00e8me juste en dessous et juste au dessus. Ex : 0,999 \u2192 0,99 &lt; 0,999 &lt; 1."
  }
];

/* ═══════════════════════════════════════════════════════
   MOTEUR
═══════════════════════════════════════════════════════ */
var TOTAL = EXERCISES.length;
var current = 0;
var userAnswers = new Array(TOTAL).fill(null); /* {ok, data} */
var hintOpen = false;
var $ = function(id){ return document.getElementById(id); };

var draftSort = [];   /* ex1 : pour chaque série, tableau des index placés */
var draftChoice = []; /* ex2 : étiquette choisie par ligne */
var draftFrame = [];  /* ex3/4 : pour chaque item {lo, hi} saisis */

function render(){
  var ex = EXERCISES[current];
  $("q-num").textContent = "Exercice " + (current+1);
  $("q-theme").textContent = ex.theme;
  $("q-eq").innerHTML = ex.eq;
  $("q-text").textContent = "";
  $("method-box").innerHTML = ex.method;
  $("hint-box").innerHTML = "";
  $("hint-box").classList.remove("show");
  hintOpen = false;
  $("feedback").className = "feedback";

  var done = userAnswers[current] !== null;
  var zone = $("answer-zone");
  zone.innerHTML = "";

  if(ex.type === "sort")        buildSort(zone, ex, done);
  else if(ex.type === "choice") buildChoice(zone, ex, done);
  else if(ex.type === "frame")  buildFrame(zone, ex, done);

  $("btn-check").disabled = done;
  $("btn-next").disabled  = !done;
  $("btn-prev").disabled  = current === 0;
  $("btn-next").textContent = (current === TOTAL-1) ? "Terminer \u2192" : "Suivant \u2192";

  if(done) showFeedback(userAnswers[current].ok);
  updateProgress();
}

/* ---------- EX1 : tri (décroissant) ---------- */
function buildSort(zone, ex, done){
  if(draftSort.length !== ex.series.length){
    draftSort = ex.series.map(function(){ return []; });
  }
  var saved = done ? userAnswers[current].data : null;

  ex.series.forEach(function(serie, si){
    var block = document.createElement("div");
    block.style.cssText = "margin-bottom:.6rem;";

    var head = document.createElement("div");
    head.className = "sort-instruction";
    head.innerHTML = "Clique les villes du <strong style='color:var(--day-dark)'>plus grand au plus petit</strong> :";
    block.appendChild(head);

    var placed = done ? saved[si] : draftSort[si];

    var pool = document.createElement("div");
    pool.className = "sort-pool";
    serie.values.forEach(function(v, vi){
      var tok = document.createElement("span");
      tok.className = "sort-token";
      tok.textContent = v;
      if(placed.indexOf(vi) !== -1 || done) tok.classList.add("used");
      if(!done){
        tok.onclick = (function(serIdx, valIdx){ return function(){
          if(draftSort[serIdx].indexOf(valIdx) === -1){
            draftSort[serIdx].push(valIdx); render();
          }
        };})(si, vi);
      }
      pool.appendChild(tok);
    });
    block.appendChild(pool);

    /* ordre décroissant attendu (par valeur clé) */
    var keysSorted = serie.keys.slice().sort(function(a,b){ return b-a; });

    var slots = document.createElement("div");
    slots.className = "sort-slots";
    for(var k=0; k<serie.values.length; k++){
      if(k>0){
        var arr = document.createElement("span");
        arr.className = "sort-arrow"; arr.textContent = ">";
        slots.appendChild(arr);
      }
      var slot = document.createElement("span");
      slot.className = "sort-slot";
      var valIdx = placed[k];
      if(valIdx !== undefined){
        slot.classList.add("filled");
        slot.textContent = serie.values[valIdx];
        if(done){
          var okPos = Math.abs(serie.keys[valIdx] - keysSorted[k]) < 1e-9;
          slot.classList.remove("filled");
          slot.classList.add(okPos ? "correct-slot" : "wrong-slot");
        } else {
          slot.style.cursor = "pointer";
          slot.onclick = (function(serIdx, pos){ return function(){
            draftSort[serIdx].splice(pos, 1); render();
          };})(si, k);
        }
      } else {
        slot.textContent = "?";
        slot.style.color = "var(--muted)";
      }
      slots.appendChild(slot);
    }
    block.appendChild(slots);
    zone.appendChild(block);
  });
}

/* ---------- EX2 : étiquette à choisir ---------- */
function buildChoice(zone, ex, done){
  if(draftChoice.length !== ex.rows.length) draftChoice = new Array(ex.rows.length).fill(null);
  var saved = done ? userAnswers[current].data : null;

  ex.rows.forEach(function(row, i){
    var wrap = document.createElement("div");
    wrap.style.cssText = "margin-bottom:1.1rem;padding-bottom:.9rem;border-bottom:1px solid var(--border);";

    var line = document.createElement("div");
    line.style.cssText = "font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1rem;margin-bottom:.5rem;";
    line.textContent = row.lbl + "  " + row.low + "  <  ?  <  " + row.high;
    wrap.appendChild(line);

    var cr = document.createElement("div");
    cr.className = "choice-row";
    row.choices.forEach(function(c){
      var b = document.createElement("button");
      b.className = "choice-btn";
      b.textContent = c;
      if(done){
        b.classList.add("locked");
        var chosen = saved[i];
        if(c === chosen) b.classList.add(sameNum(chosen, row.ans) ? "correct-sign" : "wrong-sign");
        if(sameNum(c, row.ans) && !sameNum(chosen, row.ans)) b.classList.add("correct-sign");
      } else {
        if(draftChoice[i] === c) b.classList.add("selected");
        b.onclick = (function(idx, val){ return function(){
          draftChoice[idx] = val;
          var sibs = this.parentNode.querySelectorAll(".choice-btn");
          sibs.forEach(function(s){ s.classList.remove("selected"); });
          this.classList.add("selected");
        };})(i, c);
      }
      cr.appendChild(b);
    });
    wrap.appendChild(cr);
    zone.appendChild(wrap);
  });
}

/* ---------- EX3 / EX4 : encadrement (2 saisies) ---------- */
function buildFrame(zone, ex, done){
  if(draftFrame.length !== ex.items.length){
    draftFrame = ex.items.map(function(){ return { lo:"", hi:"" }; });
  }
  var saved = done ? userAnswers[current].data : null;

  ex.items.forEach(function(it, i){
    var row = document.createElement("div");
    row.className = "input-row";

    var lbl = document.createElement("span");
    lbl.className = "input-label";
    lbl.style.minWidth = "1.6rem";
    lbl.textContent = it.lbl;
    row.appendChild(lbl);

    /* champ borne basse */
    var inpLo = document.createElement("input");
    inpLo.type = "text"; inpLo.className = "answer-input"; inpLo.placeholder = "?";
    inpLo.autocomplete = "off"; inpLo.id = "lo" + i;

    var cmp1 = document.createElement("span"); cmp1.className = "cmp"; cmp1.textContent = "<";
    var mid  = document.createElement("span"); mid.className = "mid-num"; mid.textContent = it.x;
    var cmp2 = document.createElement("span"); cmp2.className = "cmp"; cmp2.textContent = "<";

    /* champ borne haute */
    var inpHi = document.createElement("input");
    inpHi.type = "text"; inpHi.className = "answer-input"; inpHi.placeholder = "?";
    inpHi.autocomplete = "off"; inpHi.id = "hi" + i;

    if(done){
      inpLo.value = saved[i].lo; inpLo.disabled = true;
      inpLo.className = "answer-input " + (saved[i].okLo ? "correct-input" : "wrong-input");
      inpHi.value = saved[i].hi; inpHi.disabled = true;
      inpHi.className = "answer-input " + (saved[i].okHi ? "correct-input" : "wrong-input");
    } else {
      inpLo.value = draftFrame[i].lo;
      inpHi.value = draftFrame[i].hi;
      inpLo.oninput = (function(idx){ return function(){ draftFrame[idx].lo = this.value; }; })(i);
      inpHi.oninput = (function(idx){ return function(){ draftFrame[idx].hi = this.value; }; })(i);
      var onEnter = function(e){ if(e.key === "Enter" && !$("btn-check").disabled) checkAnswer(); };
      inpLo.addEventListener("keydown", onEnter);
      inpHi.addEventListener("keydown", onEnter);
    }

    row.appendChild(inpLo); row.appendChild(cmp1);
    row.appendChild(mid);   row.appendChild(cmp2);
    row.appendChild(inpHi);
    zone.appendChild(row);
  });
}

/* ---------- VALIDATION ---------- */
function checkAnswer(){
  var ex = EXERCISES[current];
  if(ex.type === "sort")   return checkSort(ex);
  if(ex.type === "choice") return checkChoice(ex);
  if(ex.type === "frame")  return checkFrame(ex);
}

function checkSort(ex){
  for(var s=0;s<ex.series.length;s++){
    if(draftSort[s].length !== ex.series[s].values.length) return;
  }
  var allOk = ex.series.every(function(serie, si){
    var keysSorted = serie.keys.slice().sort(function(a,b){ return b-a; });
    return draftSort[si].every(function(valIdx, pos){
      return Math.abs(serie.keys[valIdx] - keysSorted[pos]) < 1e-9;
    });
  });
  userAnswers[current] = { ok: allOk, data: draftSort.map(function(a){ return a.slice(); }) };
  render();
}

function checkChoice(ex){
  for(var i=0;i<ex.rows.length;i++){ if(!draftChoice[i]) return; }
  var allOk = ex.rows.every(function(r,i){ return sameNum(draftChoice[i], r.ans); });
  userAnswers[current] = { ok: allOk, data: draftChoice.slice() };
  render();
}

function checkFrame(ex){
  var data = [];
  for(var i=0;i<ex.items.length;i++){
    var lo = (draftFrame[i].lo || "").trim();
    var hi = (draftFrame[i].hi || "").trim();
    if(lo === "" || hi === "") return;
    if(isNaN(toNum(lo)) || isNaN(toNum(hi))) return;
    data.push({
      lo: lo, hi: hi,
      okLo: sameNum(lo, ex.items[i].low),
      okHi: sameNum(hi, ex.items[i].high)
    });
  }
  var allOk = data.every(function(d){ return d.okLo && d.okHi; });
  userAnswers[current] = { ok: allOk, data: data };
  render();
}

/* ---------- FEEDBACK ---------- */
function showFeedback(correct){
  var ex = EXERCISES[current];
  var fb = $("feedback");
  fb.className = "feedback show " + (correct ? "ok" : "ko");
  $("fb-icon").textContent = correct ? "\u2705" : "\u274C";
  if(correct){
    $("fb-msg").textContent = "Bravo ! Tout est correct.";
    $("fb-detail").innerHTML = "";
  } else {
    $("fb-msg").textContent = "Pas tout \u00e0 fait\u2026";
    $("fb-detail").innerHTML = buildCorrection(ex);
  }
}

function buildCorrection(ex){
  if(ex.type === "sort"){
    var serie = ex.series[0];
    var order = serie.keys.map(function(k,i){ return i; })
      .sort(function(a,b){ return serie.keys[b] - serie.keys[a]; });
    return "Correction (d\u00e9croissant) :<br>" + order.map(function(i){ return serie.values[i]; }).join(" > ");
  }
  if(ex.type === "choice"){
    var wrong = ex.rows.filter(function(r,i){ return !sameNum(userAnswers[current].data[i], r.ans); });
    return "Correction : " + wrong.map(function(r){
      return r.lbl + " " + r.low + " < " + r.ans + " < " + r.high;
    }).join("&nbsp;&nbsp;|&nbsp;&nbsp;");
  }
  if(ex.type === "frame"){
    var w = [];
    ex.items.forEach(function(it, i){
      var d = userAnswers[current].data[i];
      if(!d.okLo || !d.okHi){
        w.push(it.lbl + " " + it.low + " < " + it.x + " < " + it.high);
      }
    });
    return "Correction : " + w.join("&nbsp;&nbsp;|&nbsp;&nbsp;");
  }
  return "";
}

function toggleHint(){
  hintOpen = !hintOpen;
  var h = $("hint-box");
  if(hintOpen){
    h.innerHTML = "<strong>? Indice :</strong> " + EXERCISES[current].hint;
    h.classList.add("show");
  } else {
    h.classList.remove("show");
  }
}

function updateProgress(){
  var answered = userAnswers.filter(function(a){ return a !== null; }).length;
  var ok = userAnswers.filter(function(a){ return a !== null && a.ok; }).length;
  var ko = answered - ok;
  var pct = Math.round((answered / TOTAL) * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = "Exercice " + (current+1) + " / " + TOTAL;
  $("prog-pct").textContent = pct + "\u00a0%";
  $("count-ok").textContent = ok;
  $("count-ko").textContent = ko;
  $("count-rem").textContent = TOTAL - answered;
}

function nextQ(){
  if(current < TOTAL-1){ current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}
function prevQ(){ if(current > 0){ current--; render(); window.scrollTo({top:0,behavior:"smooth"}); } }

function showResults(){
  $("ex-card").style.display = "none";
  $("results-screen").classList.add("show");
  var ok = userAnswers.filter(function(a){ return a !== null && a.ok; }).length;
  $("score-num").textContent = ok;
  var ratio = ok / TOTAL;
  var stars = ok >= TOTAL ? 5 : ratio >= .75 ? 4 : ratio >= .5 ? 3 : ratio >= .25 ? 2 : ok >= 1 ? 1 : 0;
  $("stars-row").textContent = "\u2B50".repeat(stars) + "\u2606".repeat(5-stars);
  var msgs = ["Continue \u00e0 t\u2019entra\u00eener !","Bon d\u00e9but !","Pas mal !","Bien jou\u00e9 !","Parfait ! Bravo ! \uD83C\uDF89"];
  $("results-msg").textContent = msgs[Math.min(ok, msgs.length-1)];
  var list = $("recap-list"); list.innerHTML = "";
  var titles = ["1. Classer les villes (d\u00e9croissant)","2. Choisir la bonne \u00e9tiquette",
                "3. Encadrer au dixi\u00e8me","4. Encadrer au centi\u00e8me"];
  EXERCISES.forEach(function(ex, i){
    var correct = userAnswers[i] !== null && userAnswers[i].ok;
    var div = document.createElement("div");
    div.className = "recap-item " + (correct ? "ok-item" : "ko-item");
    div.innerHTML = "<span>" + (correct ? "\u2705" : "\u274C") + "</span><span class='eq'></span>";
    div.querySelector(".eq").textContent = titles[i];
    list.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  userAnswers = new Array(TOTAL).fill(null);
  draftSort = []; draftChoice = []; draftFrame = [];
  current = 0;
  $("ex-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", function(){
  $("count-rem").textContent = TOTAL;
  render();
});
</script>
</body>
