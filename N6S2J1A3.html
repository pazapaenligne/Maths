<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Semaine 2 Jour 1 – Vrai/Faux & réponses</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══════════════════════════════════════════════════
       COULEUR DU JOUR — orange
    ═══════════════════════════════════════════════════ */
    :root {
      --day-color:  #f5a623;
      --day-dark:   #c47a10;
      --day-light:  #fff5e0;
      --day-border: #f5d080;
      --day-glow:   rgba(245,166,35,.3);
    }

    /* ═══════════════════════════════════════════════════
       CHARTE PAZAPA — NE PAS TOUCHER
    ═══════════════════════════════════════════════════ */
    :root {
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg); color:var(--text);
      font-family:Arial,sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; padding:2rem 1rem 4rem;
      position:relative; overflow-x:hidden;
      letter-spacing:.02em; word-spacing:.06em;
    }
    body::before{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:340px; height:340px;
      background:var(--yellow); top:-80px; right:-80px;
      pointer-events:none;
    }
    body::after{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:260px; height:260px;
      background:var(--day-color); bottom:-60px; left:-60px;
      pointer-events:none;
    }
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:180px;height:180px;background:var(--green);
      bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:120px;height:120px;background:var(--pink);
      top:200px;left:-30px;pointer-events:none;}

    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{
      display:inline-flex;align-items:center;gap:.5rem;
      background:var(--yellow);color:#000;
      font-size:.78rem;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;padding:.3rem .9rem;
      border-radius:99px;margin-bottom:.5rem;
    }
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;color:var(--muted);margin-bottom:.5rem;
    }
    h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
    h1 .hl{color:var(--day-color);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;
      font-family:'JetBrains Mono',monospace;}

    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;
      position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;
      font-size:.78rem;color:var(--muted);
      font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;
      height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;
      background:linear-gradient(90deg,var(--day-color),var(--yellow));
      border-radius:99px;transition:width .5s ease;}

    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;
      flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;
      border-radius:99px;font-size:.8rem;
      font-family:'JetBrains Mono',monospace;
      border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong   .dot{background:var(--pink);}
    .chip.remaining .dot{background:var(--muted);}

    .card{width:100%;max-width:680px;background:var(--surface);
      border:2px solid var(--border);border-radius:var(--radius);
      padding:2rem 2rem 1.6rem;position:relative;z-index:1;
      box-shadow:0 4px 20px rgba(0,0,0,.06);
      animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}

    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;
      color:var(--muted);margin-bottom:.5rem;
      text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;
      padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;
      letter-spacing:.08em;margin-bottom:.7rem;
      background:var(--day-light);color:var(--day-dark);
      border:1.5px solid var(--day-border);}

    .eq-box{background:var(--day-light);border:2px solid var(--day-border);
      border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;
      font-family:'JetBrains Mono',monospace;
      font-size:clamp(1.1rem,3vw,1.55rem);
      font-weight:700;color:var(--day-dark);text-align:center;line-height:1.5;}

    .q-text{font-size:.9rem;color:var(--muted);
      margin-bottom:.8rem;line-height:1.8;}

    .method-box{background:var(--day-light);
      border:1.5px solid var(--day-border);
      border-left:4px solid var(--day-color);
      border-radius:8px;padding:.75rem 1rem;margin-bottom:1.2rem;
      font-size:.84rem;font-family:'JetBrains Mono',monospace;
      color:var(--day-dark);line-height:1.8;}
    .method-box strong{color:var(--day-color);}

    /* Options QCM / Vrai-Faux (boutons empilés) */
    .opt-list{display:flex;flex-direction:column;gap:.6rem;
      margin-bottom:.3rem;position:relative;z-index:2;}
    .opt-btn{display:flex;align-items:center;gap:.7rem;
      text-align:left;padding:.75rem 1rem;border:2px solid var(--border);
      border-radius:10px;font-family:Arial,sans-serif;
      font-size:.95rem;font-weight:600;cursor:pointer;background:var(--bg);
      color:var(--text);min-height:2.6rem;line-height:1.6;
      transition:transform .12s,border-color .15s,background .15s;}
    .opt-btn:hover:not(.locked){border-color:var(--day-color);}
    .opt-btn:active{transform:scale(.98);}
    .opt-btn.selected{border-color:var(--day-color);background:var(--day-light);}
    .opt-btn.correct-opt{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .opt-btn.wrong-opt{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .opt-btn.locked{cursor:default;}
    .opt-mark{font-family:'JetBrains Mono',monospace;font-weight:700;
      width:1.6rem;flex-shrink:0;text-align:center;color:var(--day-dark);}

    /* Vrai/Faux : deux gros boutons côte à côte */
    .vf-row{display:flex;gap:.7rem;margin-bottom:.3rem;
      flex-wrap:wrap;position:relative;z-index:2;}
    .vf-btn{flex:1;min-width:8rem;text-align:center;
      padding:.85rem 1rem;border:2px solid var(--border);
      border-radius:10px;font-family:Arial,sans-serif;
      font-size:1.05rem;font-weight:700;cursor:pointer;background:var(--bg);
      color:var(--text);min-height:2.6rem;
      transition:transform .12s,border-color .15s,background .15s;}
    .vf-btn:hover:not(.locked){border-color:var(--day-color);}
    .vf-btn:active{transform:scale(.97);}
    .vf-btn.selected{border-color:var(--day-color);background:var(--day-light);}
    .vf-btn.correct-opt{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .vf-btn.wrong-opt{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .vf-btn.locked{cursor:default;}

    /* Encadrement à saisie */
    .input-row{display:flex;align-items:center;gap:.6rem;
      flex-wrap:wrap;position:relative;z-index:2;margin-bottom:.8rem;
      justify-content:center;}
    .answer-input{width:90px;background:var(--bg);
      border:2px solid var(--border);border-radius:10px;
      color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:1.1rem;padding:.5rem .85rem;outline:none;
      transition:border-color .2s;position:relative;z-index:2;height:2.6rem;text-align:center;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input  {border-color:var(--pink); background:#fff0ef;}
    .mid-num{font-family:'JetBrains Mono',monospace;font-weight:700;
      font-size:1.2rem;color:var(--day-dark);min-width:4.5rem;text-align:center;}
    .cmp{font-family:'JetBrains Mono',monospace;font-weight:700;
      font-size:1.2rem;color:var(--muted);}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;
      position:relative;z-index:2;margin-top:.4rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;
      padding:.6rem 1.3rem;border-radius:10px;
      font-family:Arial,sans-serif;font-size:.92rem;
      font-weight:700;cursor:pointer;border:none;
      transition:transform .12s,box-shadow .15s;
      position:relative;z-index:2;min-height:2.6rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;
      box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);
      box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);
      border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

    .hint-box{margin-top:.9rem;background:#fffbeb;
      border:1.5px dashed var(--yellow);border-radius:10px;
      padding:.75rem 1rem;font-size:.85rem;color:#7a6010;
      display:none;line-height:1.8;
      font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}

    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;
      font-size:.9rem;display:none;align-items:flex-start;
      gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink); color:#c0392b;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:.82rem;margin-top:.3rem;line-height:1.8;}

    .nav-row{display:flex;justify-content:space-between;
      margin-top:1.4rem;gap:.7rem;position:relative;z-index:2;flex-wrap:wrap;}

    .results{width:100%;max-width:680px;text-align:center;
      display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:2.5rem 2rem;
      box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;
      line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;
      gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;
      padding:.65rem 1rem;background:var(--bg);
      border:1.5px solid var(--border);border-radius:10px;
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;line-height:1.6;}
    .recap-item .eq{color:var(--day-color);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}
    .recap-item.ko-item{border-color:#f9c0bb;}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px);}
      to  {opacity:1;transform:translateY(0);}
    }
    .card,.results{animation:fadeUp .4s ease both;}
    @media(max-width:480px){
      .card{padding:1.4rem;}
      .btn{font-size:.85rem;padding:.55rem 1rem;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 6&egrave;me
    </div>
    <div class="week-label">Semaine 2 &ndash; Jour 1</div>
    <h1>Comparer, intercaler, <span class="hl">encadrer</span></h1>
    <p class="subtitle">6 questions &middot; vrai/faux &amp; r&eacute;ponses &middot; niveau 6&egrave;me</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">Question 1 / 6</span>
      <span id="prog-pct">0&nbsp;%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div class="score-row">
    <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
    <div class="chip wrong"  ><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
    <div class="chip remaining"><div class="dot"></div><span id="count-rem">6</span> restantes</div>
  </div>

  <div class="card" id="ex-card">
    <div class="card-stripe"></div>
    <div class="q-num" id="q-num">Question 1</div>
    <div class="theme-badge" id="q-theme">QCM</div>
    <div class="eq-box" id="q-eq"></div>
    <div class="q-text" id="q-text"></div>
    <div class="method-box" id="method-box"></div>

    <div id="answer-zone"></div>

    <div class="btn-row" id="action-row">
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">&#10003; Valider</button>
      <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    </div>

    <div class="hint-box" id="hint-box"></div>

    <div class="feedback" id="feedback">
      <span class="feedback-icon" id="fb-icon"></span>
      <div>
        <div id="fb-msg"></div>
        <div class="feedback-detail" id="fb-detail"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">&larr; Pr&eacute;c&eacute;dent</button>
      <button class="btn btn-ghost" id="btn-restart" onclick="restart()">&#128260; Recommencer</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button>
    </div>
  </div>

  <div class="results" id="results-screen">
    <div class="results-card">
      <div class="logo-badge" style="margin-bottom:.5rem">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#3ab5d8"></span>
        R&eacute;sultats
      </div>
      <div class="results-score"><span class="s-num" id="score-num">0</span>/6</div>
      <div class="stars" id="stars-row"></div>
      <div class="results-msg" id="results-msg"></div>
      <div class="recap-list" id="recap-list"></div>
      <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">&#128260; Recommencer</button>
    </div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════
   QUESTIONS — Semaine 2 Jour 1 (Activité 3)
   Contenu mathématique vérifié :
   Q1 QCM : ordre croissant = du plus petit au plus grand
   Q2 QCM : intercaler entre 7 et 8 = un décimal entre, ex 7,5
   Q3 V/F : 33 et 34 entiers consécutifs -> VRAI
   Q4 V/F : 6,58 > 6,6 -> FAUX (6,58 < 6,60)
   Q5 V/F : 9,8 < 9,09 < 10 -> FAUX (9,8 = 9,80 > 9,09)
   Q6 saisie : encadrer 9,87 par entiers consécutifs -> 9 < 9,87 < 10
═══════════════════════════════════════════════════════ */

function toNum(s){ return parseFloat(String(s).replace(',', '.')); }
function sameNum(a, b){ return Math.abs(toNum(a) - toNum(b)) < 1e-9; }

var EXERCISES = [
  /* ── Q1 : QCM ──────────────────────────────────── */
  {
    type:  "qcm",
    theme: "QCM",
    eq:    "Ranger dans l\u2019ordre croissant, c\u2019est ranger\u2026",
    method:"<strong>Rappel :</strong> croissant = qui augmente. On va donc du plus petit vers le plus grand.",
    options: [
      "du plus petit au plus grand",
      "du plus grand au plus petit",
      "dans n\u2019importe quel ordre"
    ],
    ans: 0,
    hint:  "Pense \u00e0 une plante qui grandit : croissant = qui augmente, donc du plus petit au plus grand."
  },
  /* ── Q2 : QCM ──────────────────────────────────── */
  {
    type:  "qcm",
    theme: "QCM",
    eq:    "Pour intercaler un nombre entre 7 et 8\u2026",
    method:"<strong>Rappel :</strong> intercaler, c\u2019est placer un nombre entre deux autres. Entre deux entiers qui se suivent, on utilise un nombre d\u00e9cimal.",
    options: [
      "on cherche un nombre d\u00e9cimal compris entre 7 et 8, par exemple 7,5",
      "c\u2019est impossible car 7 et 8 se suivent",
      "on choisit un nombre plus grand que 8"
    ],
    ans: 0,
    hint:  "Entre 7 et 8 il y a une infinit\u00e9 de nombres d\u00e9cimaux : 7,1 ; 7,5 ; 7,99\u2026"
  },
  /* ── Q3 : Vrai/Faux ────────────────────────────── */
  {
    type:  "vf",
    theme: "Vrai ou Faux",
    eq:    "Deux entiers cons\u00e9cutifs sont deux nombres qui se suivent, comme 33 et 34.",
    method:"<strong>Rappel :</strong> deux entiers cons\u00e9cutifs se suivent, leur diff\u00e9rence est \u00e9gale \u00e0 1.",
    ans:   true,
    explainTrue:  "33 et 34 se suivent (34 = 33 + 1) : ce sont bien deux entiers cons\u00e9cutifs.",
    explainFalse: "33 et 34 se suivent (34 = 33 + 1) : ce sont bien deux entiers cons\u00e9cutifs.",
    hint:  "Deux entiers cons\u00e9cutifs ont une diff\u00e9rence de 1 (ex : 5 et 6, 33 et 34)."
  },
  /* ── Q4 : Vrai/Faux ────────────────────────────── */
  {
    type:  "vf",
    theme: "Vrai ou Faux",
    eq:    "6,58 &gt; 6,6",
    method:"<strong>M\u00e9thode :</strong> ajoute un z\u00e9ro pour comparer : 6,6 = 6,60. Compare ensuite 6,58 et 6,60.",
    ans:   false,
    explainTrue:  "Faux : 6,6 = 6,60. Or 6,58 &lt; 6,60. Donc 6,58 &gt; 6,6 est FAUX.",
    explainFalse: "Bien vu : 6,6 = 6,60, et 6,58 &lt; 6,60. L\u2019affirmation \u00e9tait donc fausse.",
    hint:  "6,6 = 6,60. On compare 58 et 60 : 58 &lt; 60, donc 6,58 &lt; 6,6."
  },
  /* ── Q5 : Vrai/Faux ────────────────────────────── */
  {
    type:  "vf",
    theme: "Vrai ou Faux",
    eq:    "9,8 &lt; 9,09 &lt; 10",
    method:"<strong>M\u00e9thode :</strong> 9,8 = 9,80. Compare 9,80 et 9,09 : laquelle des deux inégalit\u00e9s est fausse ?",
    ans:   false,
    explainTrue:  "Faux : 9,8 = 9,80, et 9,80 &gt; 9,09. La premi\u00e8re in\u00e9galit\u00e9 (9,8 &lt; 9,09) est fausse.",
    explainFalse: "Exact : 9,8 = 9,80 &gt; 9,09, donc \u00ab 9,8 &lt; 9,09 \u00bb est faux. L\u2019affirmation est FAUSSE.",
    hint:  "9,8 = 9,80. Or 9,80 est plus grand que 9,09, donc 9,8 n\u2019est pas plus petit que 9,09."
  },
  /* ── Q6 : encadrement par entiers consécutifs (saisie) ── */
  {
    type:  "frame",
    theme: "Encadrement",
    eq:    "Encadre 9,87 par deux entiers cons\u00e9cutifs",
    method:"<strong>M\u00e9thode :</strong> trouve l\u2019entier juste en dessous et l\u2019entier juste au dessus. Ils doivent se suivre (diff\u00e9rence de 1).",
    x:     "9,87",
    low:   "9",
    high:  "10",
    hint:  "9,87 est entre 9 et 10. On \u00e9crit 9 &lt; 9,87 &lt; 10."
  }
];

/* ═══════════════════════════════════════════════════════
   MOTEUR
═══════════════════════════════════════════════════════ */
var TOTAL = EXERCISES.length;
var current = 0;
var userAnswers = new Array(TOTAL).fill(null); /* {ok, data} */
var hintOpen = false;
var $ = function(id){ return document.getElementById(id); };

var draftChoice = null;            /* qcm/vf : index ou bool choisi */
var draftFrame  = { lo:"", hi:"" }; /* frame : bornes saisies */

function render(){
  var ex = EXERCISES[current];
  $("q-num").textContent = "Question " + (current+1);
  $("q-theme").textContent = ex.theme;
  $("q-eq").innerHTML = ex.eq;
  $("q-text").textContent = "";
  $("method-box").innerHTML = ex.method;
  $("hint-box").innerHTML = "";
  $("hint-box").classList.remove("show");
  hintOpen = false;
  $("feedback").className = "feedback";

  var done = userAnswers[current] !== null;
  var zone = $("answer-zone");
  zone.innerHTML = "";

  /* réinitialise le brouillon courant selon le type */
  if(!done){
    if(ex.type === "frame") draftFrame = { lo:"", hi:"" };
    else draftChoice = null;
  }

  if(ex.type === "qcm")        buildQcm(zone, ex, done);
  else if(ex.type === "vf")    buildVf(zone, ex, done);
  else if(ex.type === "frame") buildFrame(zone, ex, done);

  $("btn-check").disabled = done;
  $("btn-next").disabled  = !done;
  $("btn-prev").disabled  = current === 0;
  $("btn-next").textContent = (current === TOTAL-1) ? "Terminer \u2192" : "Suivant \u2192";

  if(done) showFeedback(userAnswers[current].ok);
  updateProgress();
}

/* ---------- QCM ---------- */
function buildQcm(zone, ex, done){
  var saved = done ? userAnswers[current].data : null;
  var list = document.createElement("div");
  list.className = "opt-list";
  var letters = ["A","B","C","D"];
  ex.options.forEach(function(opt, i){
    var b = document.createElement("button");
    b.className = "opt-btn";
    var mark = document.createElement("span");
    mark.className = "opt-mark"; mark.textContent = letters[i];
    var txt = document.createElement("span"); txt.textContent = opt;
    b.appendChild(mark); b.appendChild(txt);
    if(done){
      b.classList.add("locked");
      if(i === saved) b.classList.add(i === ex.ans ? "correct-opt" : "wrong-opt");
      if(i === ex.ans && saved !== ex.ans) b.classList.add("correct-opt");
    } else {
      if(draftChoice === i) b.classList.add("selected");
      b.onclick = (function(idx){ return function(){
        draftChoice = idx;
        var sibs = list.querySelectorAll(".opt-btn");
        sibs.forEach(function(s){ s.classList.remove("selected"); });
        this.classList.add("selected");
      };})(i);
    }
    list.appendChild(b);
  });
  zone.appendChild(list);
}

/* ---------- Vrai/Faux ---------- */
function buildVf(zone, ex, done){
  var saved = done ? userAnswers[current].data : null; /* true/false choisi */
  var row = document.createElement("div");
  row.className = "vf-row";
  [["VRAI", true], ["FAUX", false]].forEach(function(pair){
    var label = pair[0], val = pair[1];
    var b = document.createElement("button");
    b.className = "vf-btn";
    b.textContent = label;
    if(done){
      b.classList.add("locked");
      if(val === saved) b.classList.add(val === ex.ans ? "correct-opt" : "wrong-opt");
      if(val === ex.ans && saved !== ex.ans) b.classList.add("correct-opt");
    } else {
      if(draftChoice === val) b.classList.add("selected");
      b.onclick = (function(v){ return function(){
        draftChoice = v;
        var sibs = row.querySelectorAll(".vf-btn");
        sibs.forEach(function(s){ s.classList.remove("selected"); });
        this.classList.add("selected");
      };})(val);
    }
    row.appendChild(b);
  });
  zone.appendChild(row);
}

/* ---------- Encadrement (saisie) ---------- */
function buildFrame(zone, ex, done){
  var saved = done ? userAnswers[current].data : null;
  var row = document.createElement("div");
  row.className = "input-row";

  var inpLo = document.createElement("input");
  inpLo.type = "text"; inpLo.className = "answer-input"; inpLo.placeholder = "?";
  inpLo.autocomplete = "off"; inpLo.id = "lo0";

  var cmp1 = document.createElement("span"); cmp1.className = "cmp"; cmp1.textContent = "<";
  var mid  = document.createElement("span"); mid.className = "mid-num"; mid.textContent = ex.x;
  var cmp2 = document.createElement("span"); cmp2.className = "cmp"; cmp2.textContent = "<";

  var inpHi = document.createElement("input");
  inpHi.type = "text"; inpHi.className = "answer-input"; inpHi.placeholder = "?";
  inpHi.autocomplete = "off"; inpHi.id = "hi0";

  if(done){
    inpLo.value = saved.lo; inpLo.disabled = true;
    inpLo.className = "answer-input " + (saved.okLo ? "correct-input" : "wrong-input");
    inpHi.value = saved.hi; inpHi.disabled = true;
    inpHi.className = "answer-input " + (saved.okHi ? "correct-input" : "wrong-input");
  } else {
    inpLo.value = draftFrame.lo;
    inpHi.value = draftFrame.hi;
    inpLo.oninput = function(){ draftFrame.lo = this.value; };
    inpHi.oninput = function(){ draftFrame.hi = this.value; };
    var onEnter = function(e){ if(e.key === "Enter" && !$("btn-check").disabled) checkAnswer(); };
    inpLo.addEventListener("keydown", onEnter);
    inpHi.addEventListener("keydown", onEnter);
  }

  row.appendChild(inpLo); row.appendChild(cmp1);
  row.appendChild(mid);   row.appendChild(cmp2);
  row.appendChild(inpHi);
  zone.appendChild(row);
}

/* ---------- VALIDATION ---------- */
function checkAnswer(){
  var ex = EXERCISES[current];
  if(ex.type === "qcm" || ex.type === "vf"){
    if(draftChoice === null) return;
    var ok = (ex.type === "qcm") ? (draftChoice === ex.ans) : (draftChoice === ex.ans);
    userAnswers[current] = { ok: ok, data: draftChoice };
  } else if(ex.type === "frame"){
    var lo = (draftFrame.lo || "").trim();
    var hi = (draftFrame.hi || "").trim();
    if(lo === "" || hi === "") return;
    if(isNaN(toNum(lo)) || isNaN(toNum(hi))) return;
    var okLo = sameNum(lo, ex.low);
    var okHi = sameNum(hi, ex.high);
    userAnswers[current] = { ok: okLo && okHi, data: { lo:lo, hi:hi, okLo:okLo, okHi:okHi } };
  }
  render();
}

/* ---------- FEEDBACK ---------- */
function showFeedback(correct){
  var ex = EXERCISES[current];
  var fb = $("feedback");
  fb.className = "feedback show " + (correct ? "ok" : "ko");
  $("fb-icon").textContent = correct ? "\u2705" : "\u274C";
  $("fb-msg").textContent = correct ? "Bravo ! Bonne r\u00e9ponse." : "Pas tout \u00e0 fait\u2026";
  $("fb-detail").innerHTML = buildDetail(ex, correct);
}

function buildDetail(ex, correct){
  if(ex.type === "qcm"){
    if(correct) return "";
    return "La bonne r\u00e9ponse \u00e9tait : <strong>" + ex.options[ex.ans] + "</strong>.";
  }
  if(ex.type === "vf"){
    return correct ? ex.explainTrue : ex.explainFalse;
  }
  if(ex.type === "frame"){
    if(correct) return "";
    return "Il fallait \u00e9crire : <strong>" + ex.low + " &lt; " + ex.x + " &lt; " + ex.high + "</strong>.";
  }
  return "";
}

function toggleHint(){
  hintOpen = !hintOpen;
  var h = $("hint-box");
  if(hintOpen){
    h.innerHTML = "<strong>? Indice :</strong> " + EXERCISES[current].hint;
    h.classList.add("show");
  } else {
    h.classList.remove("show");
  }
}

function updateProgress(){
  var answered = userAnswers.filter(function(a){ return a !== null; }).length;
  var ok = userAnswers.filter(function(a){ return a !== null && a.ok; }).length;
  var ko = answered - ok;
  var pct = Math.round((answered / TOTAL) * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = "Question " + (current+1) + " / " + TOTAL;
  $("prog-pct").textContent = pct + "\u00a0%";
  $("count-ok").textContent = ok;
  $("count-ko").textContent = ko;
  $("count-rem").textContent = TOTAL - answered;
}

function nextQ(){
  if(current < TOTAL-1){ current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}
function prevQ(){ if(current > 0){ current--; render(); window.scrollTo({top:0,behavior:"smooth"}); } }

function showResults(){
  $("ex-card").style.display = "none";
  $("results-screen").classList.add("show");
  var ok = userAnswers.filter(function(a){ return a !== null && a.ok; }).length;
  $("score-num").textContent = ok;
  var ratio = ok / TOTAL;
  var stars = ok >= TOTAL ? 5 : ratio >= .8 ? 4 : ratio >= .6 ? 3 : ratio >= .4 ? 2 : ok >= 1 ? 1 : 0;
  $("stars-row").textContent = "\u2B50".repeat(stars) + "\u2606".repeat(5-stars);
  var msgs = ["Continue \u00e0 t\u2019entra\u00eener !","Bon d\u00e9but !","Pas mal !","Bien jou\u00e9 !","Tr\u00e8s bien !","Parfait ! Bravo ! \uD83C\uDF89"];
  $("results-msg").textContent = msgs[Math.min(ok, msgs.length-1)];
  var list = $("recap-list"); list.innerHTML = "";
  var titles = ["1. Ordre croissant","2. Intercaler entre 7 et 8","3. Entiers cons\u00e9cutifs",
                "4. 6,58 &gt; 6,6 ?","5. 9,8 &lt; 9,09 &lt; 10 ?","6. Encadrer 9,87"];
  EXERCISES.forEach(function(ex, i){
    var correct = userAnswers[i] !== null && userAnswers[i].ok;
    var div = document.createElement("div");
    div.className = "recap-item " + (correct ? "ok-item" : "ko-item");
    div.innerHTML = "<span>" + (correct ? "\u2705" : "\u274C") + "</span><span class='eq'>" + titles[i] + "</span>";
    list.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  userAnswers = new Array(TOTAL).fill(null);
  draftChoice = null; draftFrame = { lo:"", hi:"" };
  current = 0;
  $("ex-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", function(){
  $("count-rem").textContent = TOTAL;
  render();
});
</script>
</body>
</html>
