<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Quiz — Comparer et ordonner les décimaux</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  /* ═══ COULEUR DU JOUR — Lundi (Jour 1) → Orange ═══ */
  :root {
    --day-color:  #f5a623;
    --day-dark:   #c47a10;
    --day-light:  #fff5e0;
    --day-border: #f5d080;
    --day-glow:   rgba(245,166,35,.3);
  }
  /* ═══ CHARTE PAZAPA — NE PAS TOUCHER ═══ */
  :root {
    --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
    --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
    --pink:#f28b82; --orange:#f5a623;
    --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
    position:relative;overflow-x:hidden;letter-spacing:.02em;word-spacing:.06em;}
  body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
  body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
  .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
  .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--pink);top:200px;left:-30px;pointer-events:none;}

  header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
  .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
  .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
  h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
  h1 .hl{color:var(--day-dark);}
  .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

  .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
  .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
  .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}

  .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
  .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:99px;font-size:.8rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  .chip.correct .dot{background:var(--green);}
  .chip.wrong .dot{background:var(--pink);}
  .chip.remaining .dot{background:var(--muted);}

  .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 2rem 1.6rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--pink),var(--blue));}

  .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);}
  .consigne{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--day-dark);text-transform:uppercase;margin-bottom:1.2rem;display:flex;align-items:center;gap:.5rem;}
  .consigne::before{content:'';display:inline-block;width:3px;height:16px;border-radius:2px;background:var(--day-color);flex-shrink:0;}

  .question{margin-bottom:.4rem;}
  .q-text{font-size:1rem;font-weight:700;line-height:1.6;color:var(--text);display:flex;align-items:flex-start;margin-bottom:.4rem;}
  .q-num-badge{display:inline-flex;align-items:center;justify-content:center;width:1.7rem;height:1.7rem;border-radius:50%;flex-shrink:0;background:var(--day-color);color:#fff;font-weight:800;font-size:.85rem;font-family:'JetBrains Mono',monospace;margin-right:.6rem;}
  .q-hint-type{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 .8rem 2.3rem;}

  .options{display:flex;flex-direction:column;gap:.55rem;margin-left:2.3rem;}
  .option{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;border:2px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;min-height:2.6rem;transition:border-color .15s,background .15s,transform .1s;font-size:.92rem;}
  .option:hover:not(.locked){border-color:var(--day-border);background:var(--day-light);}
  .option:active:not(.locked){transform:scale(.99);}
  .option.locked{cursor:default;}
  .opt-box{width:20px;height:20px;border:2px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff;transition:background .15s,border-color .15s;}
  .opt-box.checkbox{border-radius:5px;}
  .opt-box.radio{border-radius:50%;}
  .option.selected .opt-box{background:var(--day-color);border-color:var(--day-color);}
  .option.selected{border-color:var(--day-color);background:var(--day-light);}
  .opt-label{flex:1;line-height:1.4;}
  .option.correct{border-color:var(--green);background:#f0faeb;}
  .option.correct .opt-box{background:var(--green);border-color:var(--green);}
  .option.wrong{border-color:var(--pink);background:#fff0ef;}
  .option.wrong .opt-box{background:var(--pink);border-color:var(--pink);}
  .option.missed{border-color:var(--orange);background:#fffbeb;}
  .option.missed .opt-box{background:transparent;border-color:var(--orange);color:var(--orange);}
  .opt-tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;margin-left:auto;padding:.15rem .5rem;border-radius:99px;display:none;}
  .option.correct .opt-tag{display:inline;background:var(--green);color:#fff;}
  .option.wrong .opt-tag{display:inline;background:var(--pink);color:#fff;}
  .option.missed .opt-tag{display:inline;background:var(--orange);color:#fff;}

  .q-feedback{margin:.7rem 0 0 2.3rem;padding:.6rem .9rem;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.7;display:none;}
  .q-feedback.show{display:block;}
  .q-feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
  .q-feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}

  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.6rem;position:relative;z-index:2;}
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:2.6rem;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.38;cursor:default;}
  .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
  .btn-solution{background:var(--day-dark);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
  .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

  .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
  .results.show{display:block;}
  .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
  .results-score .s-num{color:var(--day-dark);}
  .stars{font-size:2rem;margin:.4rem 0 1rem;letter-spacing:.1em;}
  .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
  .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
  .recap-item{display:flex;align-items:center;gap:.8rem;padding:.65rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.6;}
  .recap-item .eq{color:var(--day-dark);flex:1;}
  .recap-item.ok-item{border-color:#b5e08a;}
  .recap-item.ko-item{border-color:#f9c0bb;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:480px){
    .card,.results-card{padding:1.4rem;}
    .btn{font-size:.85rem;padding:.55rem 1rem;}
    .options,.q-feedback,.q-hint-type{margin-left:0;}
    .q-text{font-size:.95rem;}
  }
</style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#f28b82"></span>
    Pazapa &middot; Maths &middot; 6&egrave;me
  </div>
  <div class="week-label">Semaine 2 &ndash; Jour 1</div>
  <h1><span style="color:var(--text)">Quiz</span> <span class="hl">&mdash; Comparer et ordonner les d&eacute;cimaux</span></h1>
  <p class="subtitle">6 questions &middot; comparaison et encadrement</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Question 1 / 6</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<div class="score-row">
  <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
  <div class="chip wrong"><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
  <div class="chip remaining"><div class="dot"></div><span id="count-rem">6</span> restantes</div>
</div>

<div class="card" id="ex-card">
  <div class="card-stripe"></div>
  <div class="theme-badge">Comparer les d&eacute;cimaux</div>
  <div class="consigne">R&eacute;ponds aux six questions, puis v&eacute;rifie</div>
  <div id="quiz-zone"></div>
  <div class="btn-row">
    <button class="btn btn-ghost" id="btn-prev" onclick="prevQuestion()" style="display:none;">&#8592; Pr&eacute;c&eacute;dent</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">Suivant &#8594;</button>
    <button class="btn btn-primary" id="btn-check" onclick="checkAll()" style="display:none;">&#10003; V&eacute;rifier</button>
    <button class="btn btn-solution" id="btn-solution" onclick="showSolution()" style="display:none;">&#128161; Solution</button>
    <button class="btn btn-primary" id="btn-results" onclick="goResults()" style="display:none;">Voir les r&eacute;sultats &#8594;</button>
    <button class="btn btn-ghost" id="btn-restart-inline" onclick="restart()" style="display:none;">&#8635; Recommencer</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#f28b82"></span>
      R&eacute;sultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/6</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <div class="recap-list" id="recap-list"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">
      &#128260; Recommencer
    </button>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };

var QUESTIONS = [
  {
    id:0, type:"qcm",
    enonce:"Ranger dans l\u2019ordre croissant, c\u2019est ranger\u00a0:",
    options:[ {txt:"Du plus petit au plus grand",correct:true},
              {txt:"Du plus grand au plus petit",correct:false} ],
    explication:"Croissant signifie qui augmente\u00a0: on va donc du plus petit au plus grand."
  },
  {
    id:1, type:"multi",
    enonce:"Pour intercaler un nombre entre 7 et 8\u00a0:",
    options:[ {txt:"Il faut \u00e9crire 7<8",correct:false},
              {txt:"Il faut \u00e9crire 8>7",correct:false},
              {txt:"Il faut trouver un nombre d\u00e9cimal se trouvant entre 7 et 8",correct:true},
              {txt:"6,78 convient",correct:false},
              {txt:"7,0004 convient",correct:true},
              {txt:"8,0001 convient",correct:false} ],
    explication:"Intercaler, c\u2019est trouver un nombre situ\u00e9 entre 7 et 8. 7,0004 convient car il est compris entre 7 et 8\u00a0; 6,78 est inf\u00e9rieur \u00e0 7 et 8,0001 est sup\u00e9rieur \u00e0 8."
  },
  {
    id:2, type:"bool",
    enonce:"Deux entiers cons\u00e9cutifs sont deux nombres qui se suivent comme 33 et 34.",
    options:[ {txt:"Vrai",correct:true}, {txt:"Faux",correct:false} ],
    explication:"33 et 34 se suivent sans entier entre eux\u00a0: ce sont bien deux entiers cons\u00e9cutifs. La proposition est vraie."
  },
  {
    id:3, type:"bool",
    enonce:"6,58 > 6,6",
    options:[ {txt:"Vrai",correct:false}, {txt:"Faux",correct:true} ],
    explication:"On compare les dixi\u00e8mes\u00a0: 5 dixi\u00e8mes (6,58) sont inf\u00e9rieurs \u00e0 6 dixi\u00e8mes (6,6). Donc 6,58 < 6,6\u00a0: la proposition est fausse."
  },
  {
    id:4, type:"bool",
    enonce:"9,8 < 9,09 < 10",
    options:[ {txt:"Vrai",correct:false}, {txt:"Faux",correct:true} ],
    explication:"9,8 vaut 8 dixi\u00e8mes et 9,09 vaut 0 dixi\u00e8me\u00a0; donc 9,09 < 9,8. L\u2019encadrement est faux."
  },
  {
    id:5, type:"multi",
    enonce:"Encadrer 9,87 par 2 nombres entiers cons\u00e9cutifs\u00a0:",
    options:[ {txt:"9 < 9,87 < 10",correct:true},
              {txt:"9 > 9,87 > 10",correct:false},
              {txt:"8 < 9,87 < 11",correct:false} ],
    explication:"9,87 est compris entre les deux entiers cons\u00e9cutifs 9 et 10\u00a0: 9 < 9,87 < 10. Les autres propositions sont fausses ou n\u2019utilisent pas deux entiers cons\u00e9cutifs."
  }
];

var TOTAL = QUESTIONS.length;
var selections = QUESTIONS.map(function(q){ return q.options.map(function(){ return false; }); });
var validated = false;
var currentQ = 0;
var pendingScore = 0;
var pendingResults = [];

function buildQuiz(){
  var z = $("quiz-zone");
  if(!z) return;
  z.innerHTML = "";
  QUESTIONS.forEach(function(q){
    var qDiv = document.createElement("div");
    qDiv.className = "question";
    qDiv.id = "question-"+q.id;
    if(q.id!==0) qDiv.style.display = "none";

    var qText = document.createElement("div");
    qText.className = "q-text";
    qText.innerHTML = "<span class='q-num-badge'>"+(q.id+1)+"</span><span>"+q.enonce+"</span>";
    qDiv.appendChild(qText);

    var hint = document.createElement("div");
    hint.className = "q-hint-type";
    hint.textContent = q.type==="bool" ? "Vrai ou faux" : (q.type==="multi" ? "Plusieurs r\u00e9ponses possibles" : "Une seule r\u00e9ponse");
    qDiv.appendChild(hint);

    var opts = document.createElement("div");
    opts.className = "options";
    q.options.forEach(function(o,oi){
      var opt = document.createElement("div");
      opt.className = "option";
      opt.id = "opt-"+q.id+"-"+oi;
      var boxClass = q.type==="multi" ? "checkbox" : "radio";
      opt.innerHTML = "<span class='opt-box "+boxClass+"' id='box-"+q.id+"-"+oi+"'></span>"
        + "<span class='opt-label'>"+o.txt+"</span>"
        + "<span class='opt-tag' id='tag-"+q.id+"-"+oi+"'></span>";
      opt.addEventListener("click", function(){ toggleOption(q.id,oi); });
      opts.appendChild(opt);
    });
    qDiv.appendChild(opts);

    var fb = document.createElement("div");
    fb.className = "q-feedback";
    fb.id = "qfb-"+q.id;
    qDiv.appendChild(fb);

    z.appendChild(qDiv);
  });
}

function showQuestion(qi){
  if(validated) return;
  QUESTIONS.forEach(function(q){
    var el = $("question-"+q.id);
    if(el) el.style.display = (q.id===qi) ? "block" : "none";
  });
  currentQ = qi;
  $("btn-prev").style.display = (qi>0) ? "inline-flex" : "none";
  var isLast = (qi === TOTAL-1);
  $("btn-next").style.display = isLast ? "none" : "inline-flex";
  $("btn-check").style.display = isLast ? "inline-flex" : "none";
  updateProgress();
}

function nextQuestion(){ if(!validated && currentQ < TOTAL-1) showQuestion(currentQ+1); }
function prevQuestion(){ if(!validated && currentQ > 0) showQuestion(currentQ-1); }

function toggleOption(qi,oi){
  if(validated) return;
  var q = QUESTIONS[qi];
  if(q.type==="multi"){ selections[qi][oi] = !selections[qi][oi]; }
  else { selections[qi] = q.options.map(function(_,i){ return i===oi; }); }
  refreshSelections(qi);
  updateProgress();
}

function refreshSelections(qi){
  QUESTIONS[qi].options.forEach(function(_,oi){
    var opt = $("opt-"+qi+"-"+oi);
    var box = $("box-"+qi+"-"+oi);
    if(selections[qi][oi]){ opt.classList.add("selected"); box.innerHTML = "&#10003;"; }
    else { opt.classList.remove("selected"); box.innerHTML = ""; }
  });
}

function questionAnswered(qi){ return selections[qi].some(function(v){ return v; }); }

function updateProgress(){
  if(validated) return;
  var pct = Math.round((currentQ+1)/TOTAL*100);
  $("progress-bar").style.width = pct+"%";
  $("prog-pct").textContent = pct+"\u00a0%";
  $("prog-label").textContent = "Question "+(currentQ+1)+" / "+TOTAL;
  var done = 0;
  for(var i=0;i<TOTAL;i++){ if(questionAnswered(i)) done++; }
  $("count-rem").textContent = TOTAL - done;
}

function isQuestionCorrect(qi){
  var q = QUESTIONS[qi];
  for(var i=0;i<q.options.length;i++){
    if(selections[qi][i] !== q.options[i].correct) return false;
  }
  return true;
}

function checkAll(){
  if(validated) return;
  var anyAnswer = false;
  for(var i=0;i<TOTAL;i++){ if(questionAnswered(i)) anyAnswer = true; }
  if(!anyAnswer) return;
  validated = true;

  QUESTIONS.forEach(function(q){ var el=$("question-"+q.id); if(el) el.style.display="block"; });
  $("btn-prev").style.display = "none";
  $("btn-next").style.display = "none";

  var score = 0;
  var results = [];
  QUESTIONS.forEach(function(q,qi){
    var ok = isQuestionCorrect(qi);
    results.push(ok);
    if(ok) score++;
    q.options.forEach(function(o,oi){
      var opt = $("opt-"+qi+"-"+oi);
      var tag = $("tag-"+qi+"-"+oi);
      opt.classList.add("locked");
      if(o.correct && selections[qi][oi]){ opt.classList.add("correct"); tag.textContent="Bonne r\u00e9ponse"; }
      else if(!o.correct && selections[qi][oi]){ opt.classList.add("wrong"); tag.textContent="\u00c0 ne pas cocher"; }
      else if(o.correct && !selections[qi][oi]){ opt.classList.add("missed"); tag.textContent="Manqu\u00e9"; }
    });
    var fb = $("qfb-"+qi);
    fb.className = "q-feedback show "+(ok?"ok":"ko");
    fb.innerHTML = (ok ? "\u2705 Correct\u00a0! " : "\u274c Pas tout \u00e0 fait. ") + q.explication;
  });

  $("progress-bar").style.width = "100%";
  $("prog-pct").textContent = "100\u00a0%";
  $("prog-label").textContent = "Termin\u00e9 \u2014 "+score+" / "+TOTAL;
  $("count-ok").textContent = score;
  $("count-ko").textContent = TOTAL - score;
  $("count-rem").textContent = 0;
  $("btn-check").disabled = true;
  $("btn-solution").style.display = "inline-flex";
  $("btn-results").style.display = "inline-flex";
  $("btn-restart-inline").style.display = "inline-flex";

  pendingScore = score; pendingResults = results;
  var firstFb = $("qfb-0");
  if(firstFb) firstFb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function goResults(){ showResults(pendingScore, pendingResults); }

function showSolution(){
  if(!validated) return;
  QUESTIONS.forEach(function(q,qi){
    q.options.forEach(function(o,oi){
      var opt = $("opt-"+qi+"-"+oi);
      var box = $("box-"+qi+"-"+oi);
      var tag = $("tag-"+qi+"-"+oi);
      opt.classList.remove("wrong","missed","selected");
      if(o.correct){ opt.classList.add("correct"); box.innerHTML="&#10003;"; tag.textContent="Bonne r\u00e9ponse"; tag.style.display="inline"; }
      else { opt.classList.remove("correct"); box.innerHTML=""; tag.textContent=""; tag.style.display="none"; }
    });
  });
  $("btn-solution").disabled = true;
}

function showResults(score,results){
  $("ex-card").style.display="none";
  var rs=$("results-screen");
  rs.classList.add("show");
  $("score-num").textContent=score;
  var ratio=score/TOTAL;
  var stars = ratio>=1?5 : ratio>=0.8?4 : ratio>=0.6?3 : ratio>=0.4?2 : 1;
  $("stars-row").textContent="\u2b50".repeat(stars)+"\u2606".repeat(5-stars);
  var msg;
  if(ratio>=1) msg="Parfait\u00a0! Les six questions sont justes.";
  else if(ratio>=0.8) msg="Tr\u00e8s bien\u00a0! Tu ma\u00eetrises la comparaison des d\u00e9cimaux.";
  else if(ratio>=0.5) msg="Bien. Quelques questions sont \u00e0 revoir.";
  else msg="\u00c0 retravailler. Relis la le\u00e7on, puis recommence.";
  $("results-msg").textContent=msg;
  var list=$("recap-list"); list.innerHTML="";
  QUESTIONS.forEach(function(q,qi){
    var div=document.createElement("div");
    div.className="recap-item "+(results[qi]?"ok-item":"ko-item");
    div.innerHTML="<span>"+(results[qi]?"\u2705":"\u274c")+"</span>"
      +"<span class='eq'>Question "+(qi+1)+"</span>"
      +"<span>"+(results[qi]?"\u2713":"\u2717")+"</span>";
    list.appendChild(div);
  });
  rs.scrollIntoView({behavior:"smooth",block:"start"});
}

function restart(){
  validated=false; currentQ=0;
  selections = QUESTIONS.map(function(q){ return q.options.map(function(){ return false; }); });
  $("results-screen").classList.remove("show");
  $("ex-card").style.display="block";
  $("btn-check").disabled=false;
  $("btn-check").style.display="none";
  $("btn-next").style.display="inline-flex";
  $("btn-prev").style.display="none";
  $("btn-solution").style.display="none";
  $("btn-solution").disabled=false;
  $("btn-results").style.display="none";
  $("btn-restart-inline").style.display="none";
  $("progress-bar").style.width="0%";
  $("prog-pct").textContent="0\u00a0%";
  $("prog-label").textContent="Question 1 / "+TOTAL;
  $("count-ok").textContent="0";
  $("count-ko").textContent="0";
  $("count-rem").textContent=TOTAL;
  buildQuiz();
  showQuestion(0);
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", function(){
  $("count-rem").textContent = TOTAL;
  buildQuiz();
  showQuestion(0);
});
</script>
</body>
</html>
