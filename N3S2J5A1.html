<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résoudre les exercices — Coordonnées d'un point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --j5-primary:#f5c518;
  --j5-dark:#8a6000;
  --j5-soft:#fffbeb;
  --j5-accent:#f5e08a;
  --j5-title:#c49a00;
  --j5-badge-text:#3a2600;
  --ink:#1f1a05;
  --ink-soft:#5a4f2a;
  --good:#2e7d32;
  --good-bg:#e6f4e7;
  --bad:#b71c1c;
  --bad-bg:#fde7e7;
  --border:#e8d97a;
  --white:#ffffff;
  --shadow:0 4px 20px rgba(138,96,0,0.10);
  --shadow-soft:0 2px 10px rgba(138,96,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  font-family:'JetBrains Mono', ui-monospace, monospace;
  background:var(--white);
  color:var(--ink);
  line-height:1.55;
  font-size:16px;
  min-height:100vh;
  position:relative;
}

/* ===== BULLES DE FOND ===== */
.bg-bubbles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}
.bubble{
  position:absolute;
  border-radius:50%;
  filter:blur(0.5px);
}
.b1{width:180px;height:180px;background:var(--j5-primary);opacity:0.50;top:-40px;left:-50px}
.b2{width:140px;height:140px;background:var(--j5-accent);opacity:0.55;top:120px;right:-40px}
.b3{width:110px;height:110px;background:var(--j5-primary);opacity:0.45;top:48%;left:-30px}
.b4{width:160px;height:160px;background:var(--j5-accent);opacity:0.50;top:60%;right:-50px}
.b5{width:90px;height:90px;background:var(--j5-primary);opacity:0.50;bottom:140px;left:5%}
.b6{width:130px;height:130px;background:var(--j5-accent);opacity:0.50;bottom:-30px;right:8%}
.b7{width:70px;height:70px;background:var(--j5-primary);opacity:0.45;top:30%;right:3%}
.b8{width:80px;height:80px;background:var(--j5-accent);opacity:0.45;top:78%;left:2%}

@media (max-width: 600px){
  .b1{width:120px;height:120px}
  .b2{width:90px;height:90px}
  .b3{width:70px;height:70px}
  .b4{width:100px;height:100px}
  .b5{width:60px;height:60px}
  .b6{width:90px;height:90px}
  .b7,.b8{display:none}
}

/* ===== CONTENEUR ===== */
.wrap{
  position:relative;
  z-index:1;
  max-width:780px;
  margin:0 auto;
  padding:24px 18px 60px;
}

/* ===== HERO ===== */
.hero{
  text-align:center;
  margin-bottom:28px;
  padding:8px 0 4px;
}
.pill{
  display:inline-block;
  background:var(--j5-primary);
  color:var(--j5-badge-text);
  font-weight:700;
  font-size:0.82rem;
  padding:7px 16px;
  border-radius:999px;
  letter-spacing:0.6px;
  text-transform:uppercase;
  margin-bottom:14px;
  box-shadow:var(--shadow-soft);
}
h1{
  color:var(--j5-title);
  font-size:clamp(1.5rem, 4.5vw, 2rem);
  font-weight:800;
  letter-spacing:-0.5px;
  margin-bottom:10px;
  line-height:1.2;
}
.subtitle{
  color:var(--ink-soft);
  font-size:0.98rem;
  font-weight:500;
  max-width:560px;
  margin:0 auto;
}

/* ===== SCOREBOARD STICKY ===== */
.scoreboard{
  position:sticky;
  top:8px;
  z-index:20;
  background:var(--white);
  border:2px solid var(--j5-primary);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:26px;
  box-shadow:var(--shadow);
}
.score-row{
  display:flex;
  justify-content:space-around;
  gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.score-item{
  text-align:center;
  flex:1;
  min-width:80px;
}
.score-label{
  font-size:0.72rem;
  color:var(--ink-soft);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:3px;
}
.score-value{
  font-size:1.4rem;
  font-weight:800;
  color:var(--j5-dark);
}
.score-value.success{color:var(--good)}
.score-value.error{color:var(--bad)}
.xp-bar{
  background:var(--j5-soft);
  height:14px;
  border-radius:999px;
  overflow:hidden;
  border:1px solid var(--border);
  position:relative;
}
.xp-fill{
  background:linear-gradient(90deg, var(--j5-primary), var(--j5-accent));
  height:100%;
  width:0%;
  transition:width 0.5s ease;
  border-radius:999px;
}
.xp-text{
  text-align:center;
  font-size:0.78rem;
  color:var(--ink-soft);
  font-weight:600;
  margin-top:6px;
}

/* ===== EXERCICES ===== */
.exo{
  background:var(--white);
  border:2px solid var(--border);
  border-radius:18px;
  padding:22px 20px;
  margin-bottom:22px;
  box-shadow:var(--shadow-soft);
  position:relative;
}
.exo.done{
  border-color:var(--good);
  background:linear-gradient(180deg, #f6fbf5 0%, var(--white) 100%);
}
.exo-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.exo-num{
  background:var(--j5-primary);
  color:var(--j5-badge-text);
  width:36px;
  height:36px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:1.05rem;
  flex-shrink:0;
}
.exo-done-badge{
  display:none;
  background:var(--good);
  color:white;
  padding:4px 10px;
  border-radius:999px;
  font-size:0.78rem;
  font-weight:700;
  margin-left:auto;
}
.exo.done .exo-done-badge{display:inline-block}
.exo-title{
  font-weight:700;
  color:var(--j5-dark);
  font-size:1.02rem;
  flex:1;
}
.enonce{
  font-size:1rem;
  line-height:1.65;
  color:var(--ink);
  margin-bottom:14px;
}
.enonce b{color:var(--j5-dark)}

/* ===== SVG FIGURE ===== */
.figure-wrap{
  display:flex;
  justify-content:center;
  margin:14px 0;
  background:#fdf9e8;
  border-radius:12px;
  padding:10px;
  border:1px solid var(--border);
  overflow-x:auto;
}
svg.repere{
  max-width:100%;
  height:auto;
}

/* ===== CHOIX / INPUTS ===== */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}
@media (max-width: 480px){
  .choices{grid-template-columns:1fr}
}
.choice{
  background:var(--white);
  border:2px solid var(--border);
  color:var(--ink);
  font-family:inherit;
  font-size:1.05rem;
  font-weight:600;
  padding:14px 16px;
  border-radius:12px;
  cursor:pointer;
  transition:all 0.15s;
  text-align:center;
}
.choice:hover:not(:disabled){
  background:var(--j5-soft);
  border-color:var(--j5-primary);
  transform:translateY(-1px);
}
.choice:disabled{cursor:not-allowed;opacity:0.6}
.choice.correct{
  background:var(--good-bg);
  border-color:var(--good);
  color:var(--good);
}
.choice.wrong{
  background:var(--bad-bg);
  border-color:var(--bad);
  color:var(--bad);
}

/* ===== INPUT COUPLE ===== */
.couple-input{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:1.3rem;
  font-weight:700;
  color:var(--j5-dark);
  margin:14px 0;
  flex-wrap:wrap;
}
.couple-input input{
  width:70px;
  padding:10px 8px;
  font-family:inherit;
  font-size:1.2rem;
  font-weight:700;
  text-align:center;
  border:2px solid var(--border);
  border-radius:10px;
  background:var(--white);
  color:var(--ink);
}
.couple-input input:focus{
  outline:none;
  border-color:var(--j5-primary);
  background:var(--j5-soft);
}
.couple-input input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.couple-input input.correct{border-color:var(--good);background:var(--good-bg)}

/* ===== BOUTONS ===== */
.btn{
  display:inline-block;
  font-family:inherit;
  font-weight:700;
  font-size:1rem;
  padding:13px 22px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  transition:all 0.15s;
  margin:6px 4px;
}
.btn-primary{
  background:var(--j5-primary);
  color:var(--j5-badge-text);
  box-shadow:var(--shadow-soft);
}
.btn-primary:hover{background:var(--j5-dark);color:var(--white);transform:translateY(-1px)}
.btn-retry{
  background:var(--white);
  color:var(--j5-dark);
  border:2px solid var(--j5-primary);
}
.btn-retry:hover{background:var(--j5-soft)}
.btn-restart{
  background:var(--j5-dark);
  color:var(--white);
  font-size:1.05rem;
  padding:15px 28px;
}
.btn-restart:hover{background:#5e4200}

.actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

/* ===== FEEDBACK ===== */
.feedback{
  margin-top:12px;
  padding:12px 14px;
  border-radius:10px;
  font-size:0.95rem;
  font-weight:600;
  display:none;
}
.feedback.ok{background:var(--good-bg);color:var(--good);display:block}
.feedback.ko{background:var(--bad-bg);color:var(--bad);display:block}
.solution{
  margin-top:12px;
  padding:14px 16px;
  background:var(--j5-soft);
  border-left:4px solid var(--j5-primary);
  border-radius:8px;
  font-size:0.95rem;
  color:var(--ink);
  display:none;
}
.solution.show{display:block}
.solution b{color:var(--j5-dark)}

/* ===== ZONE RECOMMENCER ===== */
.bottom-actions{
  text-align:center;
  margin-top:30px;
}

/* ===== ÉCRAN RÉSULTATS ===== */
.results{
  display:none;
  background:var(--white);
  border:3px solid var(--j5-primary);
  border-radius:24px;
  padding:32px 24px;
  text-align:center;
  margin-top:20px;
  box-shadow:var(--shadow);
}
.results.show{display:block}
.trophy{font-size:4rem;margin-bottom:12px}
.results h2{
  color:var(--j5-title);
  font-size:1.6rem;
  margin-bottom:10px;
  font-weight:800;
}
.stars{font-size:1.8rem;margin:10px 0;letter-spacing:6px}
.final-score{
  font-size:1.2rem;
  font-weight:700;
  color:var(--j5-dark);
  margin:14px 0;
}
.final-msg{
  color:var(--ink-soft);
  font-size:0.98rem;
  font-weight:500;
  max-width:480px;
  margin:14px auto 18px;
  line-height:1.6;
}
</style>
</head>
<body>

<div class="bg-bubbles" aria-hidden="true">
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>
  <div class="bubble b6"></div>
  <div class="bubble b7"></div>
  <div class="bubble b8"></div>
</div>

<div class="wrap">

  <header class="hero">
    <span class="pill">Semaine 2 · Jour 5</span>
    <h1>&#9999;&#65039; Résoudre les exercices</h1>
    <p class="subtitle">Coordonnées d'un point dans un repère — lecture, symétrique, milieu et parallélogramme.</p>
  </header>

  <div class="scoreboard" role="status" aria-live="polite">
    <div class="score-row">
      <div class="score-item">
        <div class="score-label">Réussies</div>
        <div class="score-value success" id="sc-ok">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">Restantes</div>
        <div class="score-value" id="sc-rest">4</div>
      </div>
      <div class="score-item">
        <div class="score-label">Erreurs</div>
        <div class="score-value error" id="sc-err">0</div>
      </div>
    </div>
    <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
    <div class="xp-text" id="xp-text">0 / 4</div>
  </div>

  <div id="exos-container"></div>

  <div class="bottom-actions">
    <button class="btn btn-restart" id="btn-restart-mid">↻ Recommencer</button>
  </div>

  <div class="results" id="results" role="region" aria-live="polite">
    <div class="trophy" id="trophy">🏆</div>
    <h2 id="res-title">Exercices terminés !</h2>
    <div class="stars" id="stars"></div>
    <div class="final-score" id="final-score"></div>
    <p class="final-msg" id="final-msg"></p>
    <button class="btn btn-restart" id="btn-restart-end">↻ Recommencer</button>
  </div>

</div>

<script>
// ===================== UTILITAIRES =====================
const rand = (min, max) => Math.floor(Math.random()*(max-min+1))+min;
const randNonZero = (min, max) => { let v; do { v = rand(min,max); } while (v===0); return v; };
const shuffle = (arr) => arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);

// Lettres pour les points
const LETTERS = ['A','B','C','D','E','F','G','H','M','N','P','Q','R','S','T'];

// ===================== SVG REPÈRE =====================
function drawRepere(points, opts={}){
  // points : [{name, x, y, color?, dashed?}]
  const xMin = opts.xMin ?? -6;
  const xMax = opts.xMax ?? 6;
  const yMin = opts.yMin ?? -5;
  const yMax = opts.yMax ?? 5;
  const unit = opts.unit ?? 28;        // pixels par unité
  const pad = 22;                      // marge externe
  const W = (xMax-xMin)*unit + pad*2;
  const H = (yMax-yMin)*unit + pad*2;
  const cx = pad + (-xMin)*unit;
  const cy = pad + (yMax)*unit;
  const X = x => cx + x*unit;
  const Y = y => cy - y*unit;

  let svg = `<svg class="repere" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" aria-label="Repère orthonormé">`;

  // grille légère
  svg += `<g stroke="#e8d97a" stroke-width="0.6" opacity="0.7">`;
  for(let i=xMin;i<=xMax;i++){
    svg += `<line x1="${X(i)}" y1="${Y(yMin)}" x2="${X(i)}" y2="${Y(yMax)}" />`;
  }
  for(let j=yMin;j<=yMax;j++){
    svg += `<line x1="${X(xMin)}" y1="${Y(j)}" x2="${X(xMax)}" y2="${Y(j)}" />`;
  }
  svg += `</g>`;

  // axes
  svg += `<g stroke="#1f1a05" stroke-width="1.6" fill="none">`;
  svg += `<line x1="${X(xMin)}" y1="${Y(0)}" x2="${X(xMax)}" y2="${Y(0)}" marker-end="url(#arr)"/>`;
  svg += `<line x1="${X(0)}" y1="${Y(yMin)}" x2="${X(0)}" y2="${Y(yMax)}" marker-end="url(#arr)"/>`;
  svg += `</g>`;
  svg = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1a05"/></marker></defs>` + svg;

  // graduations & labels
  svg += `<g font-family="JetBrains Mono, monospace" font-size="10" fill="#5a4f2a">`;
  for(let i=xMin;i<=xMax;i++){
    if(i===0) continue;
    svg += `<line x1="${X(i)}" y1="${Y(0)-3}" x2="${X(i)}" y2="${Y(0)+3}" stroke="#1f1a05" stroke-width="1.2"/>`;
    svg += `<text x="${X(i)}" y="${Y(0)+14}" text-anchor="middle">${i}</text>`;
  }
  for(let j=yMin;j<=yMax;j++){
    if(j===0) continue;
    svg += `<line x1="${X(0)-3}" y1="${Y(j)}" x2="${X(0)+3}" y2="${Y(j)}" stroke="#1f1a05" stroke-width="1.2"/>`;
    svg += `<text x="${X(0)-8}" y="${Y(j)+4}" text-anchor="end">${j}</text>`;
  }
  // O
  svg += `<text x="${X(0)-8}" y="${Y(0)+14}" text-anchor="end" font-weight="700">O</text>`;
  // I et J (unité)
  svg += `<text x="${X(1)+3}" y="${Y(0)-6}" font-weight="700" fill="#8a6000">I</text>`;
  svg += `<text x="${X(0)+6}" y="${Y(1)+4}" font-weight="700" fill="#8a6000">J</text>`;
  svg += `</g>`;

  // segments pointillés de repérage (optionnel)
  if(opts.guides){
    svg += `<g stroke="#c49a00" stroke-width="1.2" stroke-dasharray="3 3" fill="none">`;
    points.forEach(p => {
      if(p.guides !== false){
        svg += `<line x1="${X(p.x)}" y1="${Y(0)}" x2="${X(p.x)}" y2="${Y(p.y)}" />`;
        svg += `<line x1="${X(0)}" y1="${Y(p.y)}" x2="${X(p.x)}" y2="${Y(p.y)}" />`;
      }
    });
    svg += `</g>`;
  }

  // segments à tracer (opts.segments = [[i,j],...])
  if(opts.segments){
    svg += `<g stroke="#c47a10" stroke-width="2" fill="none">`;
    opts.segments.forEach(([i,j]) => {
      svg += `<line x1="${X(points[i].x)}" y1="${Y(points[i].y)}" x2="${X(points[j].x)}" y2="${Y(points[j].y)}"/>`;
    });
    svg += `</g>`;
  }

  // points
  svg += `<g>`;
  points.forEach(p => {
    const col = p.color || '#c47a10';
    svg += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="${col}" stroke="white" stroke-width="2"/>`;
    if(p.name){
      // décalage du label selon le quadrant
      const dx = p.x >= 0 ? 9 : -9;
      const dy = p.y >= 0 ? -8 : 14;
      const anchor = p.x >= 0 ? 'start' : 'end';
      svg += `<text x="${X(p.x)+dx}" y="${Y(p.y)+dy}" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" fill="${col}" text-anchor="${anchor}">${p.name}</text>`;
    }
  });
  svg += `</g>`;

  svg += `</svg>`;
  return svg;
}

// ===================== GÉNÉRATEURS D'EXOS =====================

// --- Exo 1 : lecture des coordonnées d'un point ---
function genExo1(){
  const x = randNonZero(-5, 5);
  const y = randNonZero(-5, 5);
  const name = 'P';
  const figure = drawRepere([{name, x, y}], {guides:true});
  // Choix : la bonne + 3 leurres plausibles (inversion x/y, signe inversé, etc.)
  const correct = `(${x} ; ${y})`;
  const distractors = new Set();
  distractors.add(`(${y} ; ${x})`);       // inversion
  distractors.add(`(${-x} ; ${y})`);      // signe x
  distractors.add(`(${x} ; ${-y})`);      // signe y
  // garantir l'unicité
  const opts = shuffle([correct, ...[...distractors].filter(s=>s!==correct).slice(0,3)]);
  return {
    title:`Lecture de coordonnées`,
    enonce:`Sur le repère ci-dessous, lis les coordonnées du point <b>${name}</b>.<br>Choisis la bonne réponse.`,
    figure,
    type:'choice',
    options:opts,
    answer:correct,
    solution:`Pour lire les coordonnées, on lit d'abord l'<b>abscisse</b> (axe horizontal) puis l'<b>ordonnée</b> (axe vertical). Ici on lit ${x} en abscisse et ${y} en ordonnée, donc <b>${name}(${x} ; ${y})</b>.`
  };
}

// --- Exo 2 : symétrique d'un point par rapport à l'axe (Ox) ---
function genExo2(){
  const x = randNonZero(-4, 4);
  const y = randNonZero(-4, 4);
  const xs = x, ys = -y;
  const figure = drawRepere(
    [{name:'A', x, y, color:'#c47a10'}],
    {guides:true}
  );
  return {
    title:`Symétrique par rapport à l'axe des abscisses`,
    enonce:`Le point <b>A</b> a pour coordonnées (${x} ; ${y}).<br>Quelles sont les coordonnées du point <b>A'</b>, symétrique de A par rapport à l'<b>axe des abscisses (Ox)</b> ?`,
    figure,
    type:'couple',
    answerX:xs,
    answerY:ys,
    solution:`Le symétrique d'un point par rapport à l'axe (Ox) garde la même abscisse et l'ordonnée change de signe.<br>Donc <b>A'(${xs} ; ${ys})</b>.`
  };
}

// --- Exo 3 : milieu d'un segment [AB] (coords entières) ---
function genExo3(){
  // On choisit A et B tels que (xA+xB) et (yA+yB) soient pairs (milieu entier)
  let xa, ya, xb, yb;
  do {
    xa = rand(-4, 4); xb = rand(-4, 4);
    ya = rand(-4, 4); yb = rand(-4, 4);
  } while (
    (xa+xb)%2 !== 0 || (ya+yb)%2 !== 0 ||
    (xa===xb && ya===yb)
  );
  const mx = (xa+xb)/2;
  const my = (ya+yb)/2;
  const figure = drawRepere(
    [{name:'A', x:xa, y:ya, color:'#c47a10'},
     {name:'B', x:xb, y:yb, color:'#c47a10'}],
    {segments:[[0,1]]}
  );
  return {
    title:`Milieu d'un segment`,
    enonce:`On donne <b>A(${xa} ; ${ya})</b> et <b>B(${xb} ; ${yb})</b>.<br>Quelles sont les coordonnées du <b>milieu M</b> du segment [AB] ?`,
    figure,
    type:'couple',
    answerX:mx,
    answerY:my,
    solution:`Le milieu M a pour coordonnées :<br>x<sub>M</sub> = (x<sub>A</sub>+x<sub>B</sub>)/2 = (${xa}+${xb})/2 = ${mx}<br>y<sub>M</sub> = (y<sub>A</sub>+y<sub>B</sub>)/2 = (${ya}+${yb})/2 = ${my}<br>Donc <b>M(${mx} ; ${my})</b>.`
  };
}

// --- Exo 4 : 4e sommet du parallélogramme ABCD ---
function genExo4(){
  // ABCD parallélogramme : D = A + C - B
  let xa, ya, xb, yb, xc, yc, xd, yd;
  let tries = 0;
  do {
    xa = rand(-4, 2); ya = rand(-3, 3);
    xb = rand(-2, 4); yb = rand(-3, 3);
    xc = rand(-2, 4); yc = rand(-3, 4);
    xd = xa + xc - xb;
    yd = ya + yc - yb;
    tries++;
    if(tries>500) break;
  } while (
    // tous distincts
    (xa===xb && ya===yb) || (xa===xc && ya===yc) || (xb===xc && yb===yc) ||
    (xa===xd && ya===yd) || (xb===xd && yb===yd) || (xc===xd && yc===yd) ||
    // D dans la fenêtre du repère
    xd < -5 || xd > 5 || yd < -4 || yd > 4 ||
    // A, B, C non alignés (sinon le parallélogramme est dégénéré)
    ((xb-xa)*(yc-ya) - (yb-ya)*(xc-xa)) === 0
  );
  const figure = drawRepere(
    [{name:'A', x:xa, y:ya},
     {name:'B', x:xb, y:yb},
     {name:'C', x:xc, y:yc}],
    {segments:[[0,1],[1,2]]}
  );
  return {
    title:`4ᵉ sommet d'un parallélogramme`,
    enonce:`On donne <b>A(${xa} ; ${ya})</b>, <b>B(${xb} ; ${yb})</b> et <b>C(${xc} ; ${yc})</b>.<br>Trouve les coordonnées du point <b>D</b> tel que <b>ABCD</b> soit un parallélogramme.`,
    figure,
    type:'couple',
    answerX:xd,
    answerY:yd,
    solution:`Dans le parallélogramme ABCD, les diagonales [AC] et [BD] ont le même milieu. On a donc :<br>x<sub>D</sub> = x<sub>A</sub> + x<sub>C</sub> − x<sub>B</sub> = ${xa} + ${xc} − ${xb} = ${xd}<br>y<sub>D</sub> = y<sub>A</sub> + y<sub>C</sub> − y<sub>B</sub> = ${ya} + ${yc} − ${yb} = ${yd}<br>Donc <b>D(${xd} ; ${yd})</b>.`
  };
}

// ===================== ÉTAT GLOBAL =====================
let exos = [];
let state = []; // par exo : {done:bool, errors:int}
const TOTAL = 4;

function genAll(){
  exos = [genExo1(), genExo2(), genExo3(), genExo4()];
  state = exos.map(()=>({done:false, errors:0}));
}

// ===================== RENDU =====================
function render(){
  const container = document.getElementById('exos-container');
  container.innerHTML = '';
  exos.forEach((e,i) => {
    const div = document.createElement('div');
    div.className = 'exo';
    div.id = `exo-${i}`;

    let inner = `
      <div class="exo-head">
        <div class="exo-num">${i+1}</div>
        <div class="exo-title">${e.title}</div>
        <span class="exo-done-badge">✓ Réussi</span>
      </div>
      <div class="enonce">${e.enonce}</div>
      <div class="figure-wrap">${e.figure}</div>
    `;

    if(e.type === 'choice'){
      inner += `<div class="choices" id="choices-${i}">`;
      e.options.forEach((opt, k) => {
        inner += `<button class="choice" data-i="${i}" data-val="${opt.replace(/"/g,'&quot;')}">${opt}</button>`;
      });
      inner += `</div>`;
    } else if(e.type === 'couple'){
      inner += `
        <div class="couple-input">
          (
          <input type="text" inputmode="numeric" pattern="-?[0-9]*" id="inX-${i}" aria-label="abscisse" autocomplete="off">
          ;
          <input type="text" inputmode="numeric" pattern="-?[0-9]*" id="inY-${i}" aria-label="ordonnée" autocomplete="off">
          )
        </div>
        <div class="actions">
          <button class="btn btn-primary" data-validate="${i}">Valider</button>
        </div>
      `;
    }

    inner += `<div class="feedback" id="fb-${i}"></div>`;
    inner += `<div class="solution" id="sol-${i}"><b>Solution :</b><br>${e.solution}</div>`;
    inner += `<div class="actions" id="retry-${i}" style="display:none;">
                <button class="btn btn-retry" data-retry="${i}">↻ Réessayer</button>
              </div>`;

    div.innerHTML = inner;
    container.appendChild(div);
  });

  // listeners
  document.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.i;
      const v = btn.dataset.val;
      handleChoice(i, v, btn);
    });
  });
  document.querySelectorAll('[data-validate]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.validate;
      handleCouple(i);
    });
  });
  document.querySelectorAll('[data-retry]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.retry;
      retryExo(i);
    });
  });

  updateScore();
  document.getElementById('results').classList.remove('show');
}

// ===================== HANDLERS =====================
function handleChoice(i, val, btn){
  if(state[i].done) return;
  const e = exos[i];
  const fb = document.getElementById(`fb-${i}`);
  const retry = document.getElementById(`retry-${i}`);

  if(val === e.answer){
    btn.classList.add('correct');
    document.querySelectorAll(`#choices-${i} .choice`).forEach(b => b.disabled = true);
    fb.className = 'feedback ok';
    fb.textContent = '✓ Bonne réponse !';
    document.getElementById(`sol-${i}`).classList.add('show');
    state[i].done = true;
    document.getElementById(`exo-${i}`).classList.add('done');
    retry.style.display = 'none';
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    state[i].errors++;
    fb.className = 'feedback ko';
    fb.textContent = '✗ Pas tout à fait. Réessaie.';
    retry.style.display = 'flex';
  }
  updateScore();
}

function handleCouple(i){
  if(state[i].done) return;
  const e = exos[i];
  const xEl = document.getElementById(`inX-${i}`);
  const yEl = document.getElementById(`inY-${i}`);
  const fb = document.getElementById(`fb-${i}`);
  const retry = document.getElementById(`retry-${i}`);

  const xv = xEl.value.trim().replace(',', '.');
  const yv = yEl.value.trim().replace(',', '.');
  if(xv === '' || yv === ''){
    fb.className = 'feedback ko';
    fb.textContent = 'Remplis les deux cases.';
    return;
  }
  const xn = Number(xv);
  const yn = Number(yv);
  if(!Number.isFinite(xn) || !Number.isFinite(yn)){
    fb.className = 'feedback ko';
    fb.textContent = 'Entre des nombres valides.';
    return;
  }

  xEl.classList.remove('wrong','correct');
  yEl.classList.remove('wrong','correct');

  if(xn === e.answerX && yn === e.answerY){
    xEl.classList.add('correct');
    yEl.classList.add('correct');
    xEl.disabled = true; yEl.disabled = true;
    document.querySelector(`[data-validate="${i}"]`).disabled = true;
    fb.className = 'feedback ok';
    fb.textContent = '✓ Bonne réponse !';
    document.getElementById(`sol-${i}`).classList.add('show');
    state[i].done = true;
    document.getElementById(`exo-${i}`).classList.add('done');
    retry.style.display = 'none';
  } else {
    if(xn !== e.answerX) xEl.classList.add('wrong');
    if(yn !== e.answerY) yEl.classList.add('wrong');
    state[i].errors++;
    fb.className = 'feedback ko';
    fb.textContent = '✗ Pas tout à fait. Vérifie et réessaie.';
    retry.style.display = 'flex';
  }
  updateScore();
}

function retryExo(i){
  const fb = document.getElementById(`fb-${i}`);
  const retry = document.getElementById(`retry-${i}`);
  fb.className = 'feedback';
  fb.textContent = '';
  retry.style.display = 'none';

  const e = exos[i];
  if(e.type === 'choice'){
    // réactive seulement les choix non encore cliqués comme faux ? non : on ré-ouvre tout sauf ceux déjà marqués wrong
    document.querySelectorAll(`#choices-${i} .choice`).forEach(b => {
      if(!b.classList.contains('wrong')){
        b.disabled = false;
      }
    });
  } else if(e.type === 'couple'){
    const xEl = document.getElementById(`inX-${i}`);
    const yEl = document.getElementById(`inY-${i}`);
    xEl.classList.remove('wrong');
    yEl.classList.remove('wrong');
    xEl.value = '';
    yEl.value = '';
    xEl.focus();
  }
}

// ===================== SCORE =====================
function updateScore(){
  const ok = state.filter(s=>s.done).length;
  const err = state.reduce((a,s)=>a+s.errors,0);
  const rest = TOTAL - ok;
  document.getElementById('sc-ok').textContent = ok;
  document.getElementById('sc-rest').textContent = rest;
  document.getElementById('sc-err').textContent = err;
  const pct = (ok/TOTAL)*100;
  document.getElementById('xp-fill').style.width = pct + '%';
  document.getElementById('xp-text').textContent = `${ok} / ${TOTAL}`;

  if(ok === TOTAL){
    setTimeout(showResults, 500);
  }
}

function showResults(){
  const ok = state.filter(s=>s.done).length;
  const err = state.reduce((a,s)=>a+s.errors,0);
  const res = document.getElementById('results');
  res.classList.add('show');

  // étoiles selon erreurs
  let stars, trophy, msg;
  if(err === 0){
    stars = '⭐⭐⭐';
    trophy = '🏆';
    msg = "Tous les exercices réussis sans erreur. Beau travail régulier !";
  } else if(err <= 2){
    stars = '⭐⭐☆';
    trophy = '🎯';
    msg = "Très bon résultat. Les erreurs font partie de l'apprentissage — personne ne réussit tout du premier coup.";
  } else {
    stars = '⭐☆☆';
    trophy = '🌱';
    msg = "Bien terminé. Reprends les exos avec erreurs pour bien fixer la méthode, personne ne réussit tout du premier coup.";
  }
  document.getElementById('trophy').textContent = trophy;
  document.getElementById('stars').textContent = stars;
  document.getElementById('final-score').textContent = `${ok} / ${TOTAL} réussis — ${err} erreur${err>1?'s':''}`;
  document.getElementById('final-msg').textContent = msg;
  res.scrollIntoView({behavior:'smooth', block:'center'});
}

// ===================== RESTART =====================
function restart(){
  genAll();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('btn-restart-mid').addEventListener('click', restart);
document.getElementById('btn-restart-end').addEventListener('click', restart);

// ===================== INIT =====================
genAll();
render();
</script>
