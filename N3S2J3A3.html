<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Je relève le défi S2 J3</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#8dc63f;--day-dark:#3d7a10;--day-title:#3d7a10;--day-light:#f0faeb;--day-border:#b5e08a;--badge-txt:#ffffff;--day-glow:rgba(141,198,63,.20);
  --bg:#ffffff;--surface:#ffffff;--muted:#6f7560;--text:#1a1d23;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 3rem;overflow-x:hidden;line-height:1.7;}
.frame{position:relative;overflow:hidden;max-width:760px;margin:0 auto;
  background:radial-gradient(300px 300px at 100% 0%,rgba(141,198,63,.16),transparent 60%),
             radial-gradient(240px 240px at 0% 100%,rgba(181,224,138,.20),transparent 60%),var(--bg);}
.bubble{position:absolute;border-radius:50%;pointer-events:none;}
.b1{width:280px;height:280px;top:-70px;right:-80px;background:var(--day);opacity:.4;}
.b2{width:220px;height:220px;bottom:60px;left:-80px;background:var(--day-border);opacity:.5;}
.b3{width:140px;height:140px;bottom:-30px;right:-40px;background:var(--day-border);opacity:.45;}
.layer{position:relative;z-index:1;}
.hero{background:var(--surface);border-bottom:2px solid var(--day-light);padding:2rem 1.25rem 1.6rem;text-align:center;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--day);color:var(--badge-txt);font-size:clamp(.66rem,2.6vw,.8rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.4rem 1.1rem;border-radius:99px;margin-bottom:.8rem;white-space:nowrap;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);letter-spacing:.14em;margin-bottom:.5rem;}
.hero h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.6rem,6.5vw,2.3rem);font-weight:900;line-height:1.15;color:var(--text);}
.hero h1 .hl{color:var(--day-title);}
.hero h1 .trophy{display:inline-block;animation:bounce 3s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-7px) rotate(5deg);}}
.hero .subtitle{color:var(--muted);font-size:clamp(.82rem,3vw,.92rem);margin-top:.5rem;}
.main{max-width:760px;margin:0 auto;padding:1.4rem 1.25rem 0;}
.app-card{background:var(--surface);border:2px solid var(--day-border);border-radius:18px;padding:1.2rem 1rem;margin-bottom:1.4rem;box-shadow:0 6px 24px var(--day-glow);}
.app-frame{position:relative;width:100%;border-radius:12px;overflow:hidden;border:2px solid var(--day-border);background:var(--day-light);}
.app-frame iframe{display:block;width:100%;height:520px;border:none;}
.app-tip{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--muted);text-align:center;margin-top:.6rem;line-height:1.6;}
footer{text-align:center;margin-top:2rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.06em;}
@media(max-width:480px){.hero{padding:1.6rem 1rem 1.4rem;}.main{padding:1.2rem 1rem 0;}.app-frame iframe{height:480px;}}
</style>
</head>
<body>
<div class="frame">
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
  <div class="layer">
    <div class="hero">
      <div class="logo-badge">
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#b5e08a"></span>
        <span class="logo-dot" style="background:#3d7a10"></span>
        Pazapa &middot; Maths &middot; 3&egrave;me
      </div>
      <div class="week-label">SEMAINE 2 &mdash; JOUR 3</div>
      <h1><span class="trophy">&#127942;</span> Je <span class="hl">rel&egrave;ve le d&eacute;fi&nbsp;!</span></h1>
      <p class="subtitle">Activit&eacute; interactive &middot; fonction affine</p>
    </div>
    <div class="main">
      <div class="app-card">
        <div class="app-frame">
          <iframe src="https://learningapps.org/watch?app=16591066" allowfullscreen="allowfullscreen" webkitallowfullscreen="true" mozallowfullscreen="true" title="Activité interactive LearningApps"></iframe>
        </div>
        <div class="app-tip">Si l'activit&eacute; ne s'affiche pas, recharge la page ou v&eacute;rifie ta connexion.</div>
      </div>
      <footer>N3 &middot; S2 &middot; J3 &middot; Je rel&egrave;ve le d&eacute;fi &middot; Pazapa Maths 3&egrave;me</footer>
    </div>
  </div>
</div>
</body>
</html>
