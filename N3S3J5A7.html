<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths &mdash; 3e &mdash; Identit&eacute;s remarquables &mdash; Niveau 3</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f5c518;--day-dark:#8a6000;--day-light:#fffbeb;
  --day-border:#f5e08a;--day-glow:rgba(245,197,24,.25);
  --bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;
  --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;
  --text:#1a1d23;--muted:#6f7480;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;line-height:1.7;}
body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.12;
  width:340px;height:340px;background:var(--day);top:-80px;right:-80px;pointer-events:none;}
body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.12;
  width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
.bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:180px;height:180px;
  background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
.bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:120px;height:120px;
  background:var(--day);top:200px;left:-30px;pointer-events:none;}

.head-card{width:100%;max-width:700px;background:var(--day-light);border:2px solid var(--day-border);
  border-radius:var(--radius);padding:1.8rem 1.5rem 1.5rem;text-align:center;
  position:relative;z-index:1;margin-bottom:1.2rem;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--day);color:#000;
  font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.6rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--day-dark);margin:.4rem 0;}
.head-card h1{line-height:1.25;margin:.2rem 0;}
.hl{color:var(--day-dark);font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;}
.lvl{display:block;color:var(--text);font-size:clamp(1.4rem,5vw,2rem);font-weight:900;margin-top:.1rem;}
.head-card .subtitle{color:var(--muted);font-size:.95rem;margin-top:.5rem;}
.level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.1rem;}
.level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.88rem;
  letter-spacing:.06em;text-transform:uppercase;padding:.55rem 1.1rem;border-radius:11px;
  border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);
  min-height:2.8rem;display:inline-flex;align-items:center;cursor:default;user-select:none;}
.level-btn.active{background:var(--day);color:#000;border-color:var(--day);
  box-shadow:0 3px 10px var(--day-glow);}

.exo-wrap{width:100%;max-width:700px;background:var(--surface);
  border:2px solid var(--border);border-radius:var(--radius);
  padding:12px;margin:0 auto 1.4rem;position:relative;z-index:1;
  box-shadow:0 4px 20px rgba(0,0,0,.05);}
.exo-label{font-family:'JetBrains Mono',monospace;font-weight:700;
  color:var(--day-dark);margin:2px 0 10px;font-size:.98rem;}
iframe{border:0;width:100%;height:600px;border-radius:12px;display:block;background:#fff;}

/* Calculatrice */
.fxc-trigger{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:0;}
.fxc-trigger svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
.fxc-pill{background:var(--day-dark);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.04em;}
.fxc-hidden{display:none!important;}
.fxc-panel{position:fixed;right:14px;bottom:14px;z-index:9999;width:312px;max-width:94vw;background:#2f343b;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-family:'JetBrains Mono',monospace;overflow:hidden;border:2px solid var(--day);}
.fxc-bar{background:#23272d;color:#cfd6de;font-size:12.5px;font-weight:700;padding:9px 10px;cursor:move;touch-action:none;user-select:none;display:flex;align-items:center;gap:6px;}
.fxc-bar .fxc-sp{flex:1;}
.fxc-icon{background:#3a4049;color:#fff;border:none;width:26px;height:26px;border-radius:7px;font-size:13px;cursor:pointer;line-height:1;}
.fxc-icon:hover{background:var(--day);color:#000;}
.fxc-help-txt{background:#23272d;color:#aeb6bf;font-size:11.5px;line-height:1.7;padding:8px 12px;border-top:1px solid #3a4049;}
.fxc-screen{background:#d7e3c8;margin:10px;border-radius:8px;padding:8px 10px;min-height:64px;display:flex;flex-direction:column;justify-content:center;border:2px solid #aab79a;}
.fxc-expr{font-size:13px;color:#4a5340;text-align:right;min-height:16px;word-break:break-all;}
.fxc-res{font-size:23px;font-weight:800;color:#222;text-align:right;word-break:break-all;}
.fxc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 10px 12px;}
.fxc-k{background:#454c55;color:#fff;border:none;border-radius:9px;padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;cursor:pointer;min-height:40px;transition:transform .08s;}
.fxc-k:active{transform:scale(.94);}.fxc-k:hover{background:#525a64;}
.fxc-k.fn{background:#3a4049;font-size:12px;color:var(--day);}
.fxc-k.op{color:var(--day);}.fxc-k.eq{background:#3a7bd5;color:#fff;}.fxc-k.blank{background:transparent;cursor:default;}
</style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>

<div class="head-card">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    PAZAPA &middot; MATHS &middot; 3&Egrave;ME
  </div>
  <div class="week-label">Semaine 3 &ndash; Jour 5</div>
  <h1><span class="hl">&#9999;&#65039; S&eacute;rie d&rsquo;exercices</span><span class="lvl">Niveau 3</span></h1>
  <p class="subtitle">Les identit&eacute;s remarquables</p>
  <div class="level-row">
    <span class="level-btn">Niveau 1</span>
    <span class="level-btn">Niveau 2</span>
    <span class="level-btn active">Niveau 3</span>
  </div>
</div>

<div class="exo-wrap">
  <div class="exo-label">Exercice 1</div>
  <iframe title="Exercice interactif"
    src="https://learningapps.org/watch?app=12470893"
    allowfullscreen="allowfullscreen" loading="lazy"></iframe>
</div>

<!-- CALCULATRICE -->
<button id="fxc-open" class="fxc-trigger" onclick="fxcOpen()" aria-label="Calculatrice">
  <svg width="62" height="86" viewBox="0 0 62 86" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcefe8"/><stop offset="1" stop-color="#bcdcd5"/></linearGradient></defs>
    <rect x="1" y="1" width="60" height="84" rx="9" fill="url(#fg)" stroke="#8fb3aa" stroke-width="1.5"/>
    <text x="9" y="13" font-family="Arial" font-size="7" font-weight="bold" fill="#2f5d52">CASIO</text>
    <text x="40" y="13" font-family="Arial" font-size="6" font-weight="bold" fill="#2f5d52">fx-92</text>
    <rect x="8" y="17" width="46" height="6" rx="2" fill="#26323a"/>
    <rect x="8" y="26" width="46" height="17" rx="2" fill="#c4d3a6" stroke="#9aa985"/>
    <circle cx="15" cy="54" r="7" fill="#7fb8ac" stroke="#5e948a"/><circle cx="15" cy="54" r="2.5" fill="#3a4f49"/>
    <g fill="#5a6b66"><rect x="27" y="49" width="7" height="4" rx="1"/><rect x="37" y="49" width="7" height="4" rx="1"/><rect x="47" y="49" width="7" height="4" rx="1"/><rect x="27" y="56" width="7" height="4" rx="1"/><rect x="37" y="56" width="7" height="4" rx="1"/><rect x="47" y="56" width="7" height="4" rx="1"/></g>
    <g fill="#7a8b86"><rect x="8" y="64" width="7" height="4" rx="1"/><rect x="18" y="64" width="7" height="4" rx="1"/><rect x="28" y="64" width="7" height="4" rx="1"/><rect x="8" y="71" width="7" height="4" rx="1"/><rect x="18" y="71" width="7" height="4" rx="1"/><rect x="28" y="71" width="7" height="4" rx="1"/></g>
    <rect x="40" y="64" width="14" height="4" rx="1" fill="#c0392b"/>
    <rect x="40" y="71" width="14" height="6" rx="1.5" fill="#3a7bd5"/>
  </svg>
  <span class="fxc-pill">Calculatrice</span>
</button>
<div id="fxc-panel" class="fxc-panel fxc-hidden">
  <div class="fxc-bar" id="fxc-bar">&#9776; fx-92<span class="fxc-sp"></span>
    <button class="fxc-icon" id="fxc-hb" type="button">?</button>
    <button class="fxc-icon" id="fxc-cb" type="button">&#10005;</button>
  </div>
  <div class="fxc-help-txt fxc-hidden" id="fxc-help">&divide;R reste &middot; FACT &middot; PGCD &middot; PPCM &middot; a/b &middot; &radic; x&sup2; ^</div>
  <div class="fxc-screen"><div class="fxc-expr" id="fxc-expr"></div><div class="fxc-res" id="fxc-res">0</div></div>
  <div class="fxc-keys" id="fxc-keys"></div>
</div>
<script>
(function(){
  var expr='';
  function E(id){return document.getElementById(id);}
  var KEYS=[
    ['FACT(','fn','FACT('],['PGCD(','fn','PGCD('],['PPCM(','fn','PPCM('],['a/b','fn','SIMP('],['AC','fn','AC'],
    ['DEL','fn','DEL'],['(','op','('],[')','op',')'],[';','op',';'],['\u00f7R','op','\u00f7R'],
    ['7','','7'],['8','','8'],['9','','9'],['\u00f7','op','\u00f7'],['\u221a(','op','\u221a('],
    ['4','','4'],['5','','5'],['6','','6'],['\u00d7','op','\u00d7'],['x\u00b2','op','\u00b2'],
    ['1','','1'],['2','','2'],['3','','3'],['\u2212','op','\u2212'],['^','op','^'],
    ['0','','0'],[',','',','],['(','op','('],['=','eq','='],['','blank','']
  ];
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
  function render(){E('fxc-expr').textContent=expr;}
  function calcSafe(str){
    var s=str,pos=0;
    function parseExpr(){var v=parseTerm();while(pos<s.length){if(s[pos]==='+'){pos++;v+=parseTerm();}else if(s[pos]==='-'){pos++;v-=parseTerm();}else break;}return v;}
    function parseTerm(){var v=parsePow();while(pos<s.length){if(s[pos]==='*'){pos++;v*=parsePow();}else if(s[pos]==='/'){pos++;var d=parsePow();if(d===0)return NaN;v/=d;}else break;}return v;}
    function parsePow(){var b=parsePrimary();if(pos<s.length&&s[pos]==='^'){pos++;return Math.pow(b,parsePow());}return b;}
    function parsePrimary(){if(pos<s.length&&s[pos]==='('){pos++;var v=parseExpr();if(pos<s.length&&s[pos]===')') pos++;return v;}if(pos<s.length&&s[pos]==='-'){pos++;return -parsePrimary();}var st=pos;while(pos<s.length&&/[0-9.]/.test(s[pos]))pos++;if(pos===st)return NaN;return parseFloat(s.slice(st,pos));}
    try{var r=parseExpr();return pos===s.length?r:NaN;}catch(e){return NaN;}
  }
  function evalNum(s){
    s=(''+s).toLowerCase().replace(/\s+/g,'').replace(/\u00a0/g,'')
      .replace(/\u00b2/g,'^2').replace(/[\u00d7]/g,'*').replace(/\u00f7/g,'/')
      .replace(/[−\u2212\u2013\u2014]/g,'-');
    var prev='';
    while(prev!==s){prev=s;s=s.replace(/([0-9)])(\()/g,'$1*$2').replace(/(\))([0-9])/g,'$1*$2');}
    return calcSafe(s);
  }
  function press(v){
    if(v==='AC'){expr='';E('fxc-res').textContent='0';render();return;}
    if(v==='DEL'){var tks=['FACT(','PGCD(','PPCM(','SIMP(','\u221a(','\u00f7R'];for(var i=0;i<tks.length;i++){if(expr.slice(-tks[i].length)===tks[i]){expr=expr.slice(0,-tks[i].length);render();return;}}expr=expr.slice(0,-1);render();return;}
    if(v==='='){
      var s=(expr||'').trim();if(!s)return;
      try{
        var m;
        if((m=s.match(/^FACT\((.+)\)$/i))){var n=Math.round(evalNum(m[1]));if(n<1){E('fxc-res').textContent='Erreur';return;}var f=[],d=2,x=n;while(d*d<=x){while(x%d===0){f.push(d);x/=d;}d++;}if(x>1)f.push(x);var out=[],ii=0;while(ii<f.length){var p=f[ii],c=0;while(ii<f.length&&f[ii]===p){c++;ii++;}out.push(c>1?(p+c):(''+p));}E('fxc-res').textContent=out.join('\u00d7');return;}
        if((m=s.match(/^PGCD\(([^;]+);([^)]+)\)$/i))){E('fxc-res').textContent=''+gcd(Math.round(evalNum(m[1])),Math.round(evalNum(m[2])));return;}
        if((m=s.match(/^PPCM\(([^;]+);([^)]+)\)$/i))){var A=Math.round(evalNum(m[1])),B=Math.round(evalNum(m[2]));E('fxc-res').textContent=''+(Math.abs(A*B)/gcd(A,B));return;}
        if((m=s.match(/^SIMP\(([^;]+);([^)]+)\)$/i))){var pp=Math.round(evalNum(m[1])),qq=Math.round(evalNum(m[2]));if(!qq){E('fxc-res').textContent='Erreur';return;}var dg=gcd(pp,qq)||1;pp/=dg;qq/=dg;if(qq<0){pp=-pp;qq=-qq;}E('fxc-res').textContent=qq===1?(''+pp):(pp+'/'+qq);return;}
        if(s.indexOf('\u00f7R')>=0){var parts=s.split('\u00f7R');var aa=Math.round(evalNum(parts[0])),bb=Math.round(evalNum(parts[1]));if(!bb){E('fxc-res').textContent='Erreur';return;}var q2=Math.floor(aa/bb),r2=aa-q2*bb;E('fxc-res').textContent='quotient '+q2+' \u00b7 reste '+r2;return;}
        var vv=evalNum(s);
        if(!isFinite(vv)){E('fxc-res').textContent='Erreur';return;}
        E('fxc-res').textContent=String(Math.round(vv*1e9)/1e9).replace('.',',');
      }catch(e){E('fxc-res').textContent='Erreur';}
      return;
    }
    if(v==='')return;
    expr+=v;render();
  }
  var kc=E('fxc-keys');
  KEYS.forEach(function(k){var btn=document.createElement('button');btn.type='button';btn.className='fxc-k '+(k[1]||'');btn.textContent=k[0];if(k[1]!=='blank')btn.addEventListener('click',function(){press(k[2]);});kc.appendChild(btn);});
  window.fxcOpen=function(){E('fxc-open').classList.add('fxc-hidden');E('fxc-panel').classList.remove('fxc-hidden');};
  E('fxc-cb').addEventListener('click',function(e){e.stopPropagation();E('fxc-panel').classList.add('fxc-hidden');E('fxc-open').classList.remove('fxc-hidden');});
  E('fxc-hb').addEventListener('click',function(e){e.stopPropagation();E('fxc-help').classList.toggle('fxc-hidden');});
  var bar=E('fxc-bar'),panel=E('fxc-panel'),drag=false,sx,sy,ox,oy,conv=false;
  bar.addEventListener('pointerdown',function(e){if(e.target.classList.contains('fxc-icon'))return;drag=true;conv=false;sx=e.clientX;sy=e.clientY;var r=panel.getBoundingClientRect();ox=r.left;oy=r.top;bar.setPointerCapture(e.pointerId);});
  bar.addEventListener('pointermove',function(e){if(!drag)return;if(!conv){panel.style.right='auto';panel.style.bottom='auto';panel.style.left=ox+'px';panel.style.top=oy+'px';conv=true;}var nx=ox+(e.clientX-sx),ny=oy+(e.clientY-sy),w=panel.offsetWidth,h=panel.offsetHeight;nx=Math.max(4,Math.min(window.innerWidth-w-4,nx));ny=Math.max(4,Math.min(window.innerHeight-h-4,ny));panel.style.left=nx+'px';panel.style.top=ny+'px';});
  bar.addEventListener('pointerup',function(e){drag=false;try{bar.releasePointerCapture(e.pointerId);}catch(_){}});
})();
</script>
</body>
</html>
