<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths &ndash; Factorisation &middot; Niveau 1</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --day-color:#3ab5d8;--day-dark:#1a6e88;--day-light:#e8f6fb;
      --day-border:#9dd4e8;--day-glow:rgba(58,181,216,.3);
      --bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;
      --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;
      --pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;letter-spacing:.03em;word-spacing:.08em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--yellow);top:200px;left:-30px;pointer-events:none;}
    .head-card{width:100%;max-width:680px;background:var(--day-light);border:2px solid var(--day-border);border-radius:var(--radius);padding:1.9rem 1.5rem 1.6rem;text-align:center;position:relative;z-index:1;margin-bottom:1.3rem;}
    .head-card .logo-badge{background:var(--day-color);color:#fff;font-size:14px;letter-spacing:.09em;display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .head-card .week-label{color:var(--day-dark);font-size:.95rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1 .hl{color:var(--day-dark);font-size:clamp(1.45rem,4.6vw,1.95rem);font-weight:800;display:inline-block;}
    .head-card h1 .lvl{color:var(--text);font-size:clamp(1.55rem,5.2vw,2.2rem);font-weight:900;display:inline-block;margin-top:.15rem;}
    .head-card .subtitle{color:var(--muted);font-size:1.02rem;margin-top:.5rem;font-family:'JetBrains Mono',monospace;}
    .level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;padding:.6rem 1.15rem;border-radius:12px;border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);min-height:2.9rem;display:inline-flex;align-items:center;cursor:default;}
    .level-btn.active{background:var(--day-color);color:#fff;border-color:var(--day-color);box-shadow:0 3px 10px var(--day-glow);}
    .stats-card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-bottom:1.7rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.05);}
    .stats-row{display:flex;gap:.8rem;}
    .stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);border-radius:12px;padding:.9rem .5rem;text-align:center;}
    .stat-num{font-size:1.7rem;font-weight:800;color:var(--day-dark);font-family:'JetBrains Mono',monospace;line-height:1.1;}
    .stat-label{font-size:.86rem;color:var(--muted);margin-top:.25rem;}
    .prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:1rem;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}
    .prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;color:var(--muted);margin-top:.6rem;}
    #cards{width:100%;max-width:680px;}
    .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.7rem 1.5rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;margin-bottom:1.5rem;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}
    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.1em;}
    .eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.8;}
    .input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.8rem;}
    .input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;}
    .answer-input{background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:.5rem .85rem;outline:none;transition:border-color .2s;height:3rem;width:min(320px,100%);}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.7rem 1.45rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(1rem,2.8vw,1.12rem);font-weight:800;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:3.1rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn.hidden{display:none;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}
    .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:1rem;color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}
    .method-box{display:none;background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.95rem 1.15rem;margin-top:.9rem;font-size:1rem;font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.85;}
    .method-box.reveal{display:block;}
    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;font-size:clamp(1rem,2.6vw,1.1rem);display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.7rem;flex-shrink:0;}
    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,11vw,4.8rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2.2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:clamp(1.02rem,2.6vw,1.12rem);margin-bottom:2rem;line-height:1.7;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
  <div class="bubble1"></div><div class="bubble2"></div>
  <div class="head-card">
    <div class="logo-badge"><span class="logo-dot" style="background:#f5c518"></span><span class="logo-dot" style="background:#8dc63f"></span><span class="logo-dot" style="background:#3ab5d8"></span> PAZAPA &middot; MATHS &middot; 4&Egrave;ME</div>
    <div class="week-label">Semaine 3 &ndash; Jour 4</div>
    <h1><span class="hl">&#9999;&#65039; S&eacute;rie d&rsquo;exercices</span><br><span class="lvl"></span></h1>
    <p class="subtitle">Factorisation &middot; facteur commun visible</p>
    <div class="level-row">
      <span class="level-btn active">Niveau 1</span>
      <span class="level-btn">Niveau 2</span>
      <span class="level-btn">Niveau 3</span>
    </div>
  </div>
  <div class="stats-card">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="st-ok">0</div><div class="stat-label">R&eacute;ussies</div></div>
      <div class="stat-box"><div class="stat-num" id="st-rem">4</div><div class="stat-label">Restantes</div></div>
      <div class="stat-box"><div class="stat-num" id="st-err">0</div><div class="stat-label">Erreurs</div></div>
    </div>
    <div class="prog-bg"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
    <div class="prog-text" id="prog-text">0 / 4</div>
  </div>
  <div id="cards"></div>
  <section class="results" id="results"><div class="results-card">
    <div class="q-num">R&eacute;sultats</div>
    <div class="results-score"><span class="s-num" id="res-score">0 / 4</span></div>
    <div class="stars" id="stars"></div><p class="results-msg" id="res-msg"></p>
    <button class="btn btn-primary" onclick="restart()">&#8635; Recommencer</button>
  </div></section>

  <script>
  var QS=[
    {eq:"A = (4x &minus; 3)(x &minus; 3) + (x + 1)(x &minus; 3)",
     answers:["(x-3)(5x-2)","(5x-2)(x-3)"],display:"(x &minus; 3)(5x &minus; 2)",
     hint:"Quelle expression apparaît dans les deux produits\u00a0? Identifie-la, mets-la en facteur, puis additionne ce qui reste.",
     method:"<strong>Explication\u00a0:</strong> Le facteur commun est (x\u00a0\u2212\u00a03).<br>A\u00a0= (x\u00a0\u2212\u00a03)\u00a0[\u00a0(4x\u00a0\u2212\u00a03)\u00a0+\u00a0(x\u00a0+\u00a01)\u00a0]\u00a0= (x\u00a0\u2212\u00a03)(4x\u00a0\u2212\u00a03\u00a0+\u00a0x\u00a0+\u00a01) = (x\u00a0\u2212\u00a03)(5x\u00a0\u2212\u00a02)."},
    {eq:"B = (2x &minus; 5)(5x &minus; 3) + (2x &minus; 5)(2x + 2)",
     answers:["(2x-5)(7x-1)","(7x-1)(2x-5)"],display:"(2x &minus; 5)(7x &minus; 1)",
     hint:"Cherche l\u2019expression identique dans les deux termes. Que reste-t-il dans chaque facteur apr\u00e8s la mise en facteur\u00a0?",
     method:"<strong>Explication\u00a0:</strong> Le facteur commun est (2x\u00a0\u2212\u00a05).<br>B\u00a0= (2x\u00a0\u2212\u00a05)\u00a0[\u00a0(5x\u00a0\u2212\u00a03)\u00a0+\u00a0(2x\u00a0+\u00a02)\u00a0]\u00a0= (2x\u00a0\u2212\u00a05)(7x\u00a0\u2212\u00a01)."},
    {eq:"C = (x + 4)(3x &minus; 2) + (5x &minus; 5)(x + 4)",
     answers:["(x+4)(8x-7)","(8x-7)(x+4)"],display:"(x + 4)(8x &minus; 7)",
     hint:"L\u2019un des deux facteurs est le m\u00eame dans les deux produits. Mets-le en \u00e9vidence, puis r\u00e9duis ce qui est entre crochets.",
     method:"<strong>Explication\u00a0:</strong> Le facteur commun est (x\u00a0+\u00a04).<br>C\u00a0= (x\u00a0+\u00a04)\u00a0[\u00a0(3x\u00a0\u2212\u00a02)\u00a0+\u00a0(5x\u00a0\u2212\u00a05)\u00a0]\u00a0= (x\u00a0+\u00a04)(8x\u00a0\u2212\u00a07)."},
    {eq:"D = (3x + 2)(4x + 2) &minus; (3x + 2)(x &minus; 3)",
     answers:["(3x+2)(3x+5)","(3x+5)(3x+2)"],display:"(3x + 2)(3x + 5)",
     hint:"Quelle parenth\u00e8se est pr\u00e9sente dans les deux termes\u00a0? Apr\u00e8s la mise en facteur, fais attention au signe \u2212 devant le deuxi\u00e8me groupe.",
     method:"<strong>Explication\u00a0:</strong> Le facteur commun est (3x\u00a0+\u00a02).<br>D\u00a0= (3x\u00a0+\u00a02)\u00a0[\u00a0(4x\u00a0+\u00a02)\u00a0\u2212\u00a0(x\u00a0\u2212\u00a03)\u00a0]\u00a0= (3x\u00a0+\u00a02)(4x\u00a0+\u00a02\u00a0\u2212\u00a0x\u00a0+\u00a03) = (3x\u00a0+\u00a02)(3x\u00a0+\u00a05)."}
  ];
  var TOTAL=QS.length,state;
  function $(id){return document.getElementById(id);}
  function norm(s){return s.toLowerCase().replace(/\s+/g,"").replace(/\u2212/g,"-").replace(/\u00d7/g,"*");}
  function buildCards(){
    state=QS.map(function(){return{done:false,ok:false,errCount:0};});
    var html="";
    for(var i=0;i<TOTAL;i++){var q=QS[i];
      html+='<div class="card" id="card'+i+'"><div class="card-stripe"></div>'
        +'<div class="q-num">Exercice '+(i+1)+' / '+TOTAL+'</div>'
        +'<div class="eq-box">'+q.eq+'</div>'
        +'<div class="input-row"><span class="input-label">Forme factoris\u00e9e\u00a0:</span>'
        +'<input type="text" class="answer-input" id="in'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="clearFb('+i+')" /></div>'
        +'<div class="btn-row">'
        +'<button class="btn btn-primary" id="vb'+i+'" onclick="check('+i+')">&#10003; V\u00e9rifier</button>'
        +'<button class="btn btn-hint" id="hb'+i+'" onclick="toggleHint('+i+')">&#128161; Indice</button>'
        +'<button class="btn btn-ghost hidden" id="eb'+i+'" onclick="toggleExpl('+i+')">Voir l\u2019explication</button>'
        +'</div>'
        +'<div class="hint-box" id="hint'+i+'">&#128161; '+q.hint+'</div>'
        +'<div class="method-box" id="method'+i+'">'+q.method+'</div>'
        +'<div class="feedback" id="fb'+i+'"><span class="feedback-icon" id="fbi'+i+'"></span><div><span id="fbt'+i+'"></span></div></div>'
        +'</div>';
    }
    $("cards").innerHTML=html;
    for(var j=0;j<TOTAL;j++){(function(k){$("in"+k).addEventListener("keydown",function(e){if(e.key==="Enter")check(k);});})(j);}
  }
  function clearFb(i){if(state[i].done)return;var fb=$("fb"+i);if(fb){fb.className="feedback";$("fbt"+i).innerHTML="";$("fbi"+i).textContent="";$("in"+i).className="answer-input";}}
  function toggleHint(i){var h=$("hint"+i);var o=h.classList.toggle("show");$("hb"+i).innerHTML=o?"&#128161; Masquer l\u2019indice":"&#128161; Indice";}
  function toggleExpl(i){var m=$("method"+i);var o=m.classList.toggle("reveal");$("eb"+i).textContent=o?"Masquer l\u2019explication":"Voir l\u2019explication";}
  function check(i){
    if(state[i].done)return;
    var raw=$("in"+i).value.trim();if(raw===""){$("in"+i).focus();return;}
    var q=QS[i];
    var ok=q.answers.some(function(a){return norm(a)===norm(raw);});
    if(ok){
      state[i].done=true;state[i].ok=true;
      $("in"+i).disabled=true;$("in"+i).className="answer-input correct-input";
      $("vb"+i).disabled=true;
      $("eb"+i).classList.remove("hidden");
      var hh=$("hint"+i);hh.classList.remove("show");$("hb"+i).innerHTML="&#128161; Indice";
      $("fb"+i).className="feedback show ok";$("fbi"+i).textContent="\u2713";$("fbt"+i).textContent="Bravo, c\u2019est juste\u00a0!";
      update();
    } else {
      state[i].errCount++;
      $("in"+i).className="answer-input wrong-input";
      if(state[i].errCount===1)update();
      if(state[i].errCount<2){
        $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";$("fbt"+i).textContent="Pas encore \u2014 essaie \u00e0 nouveau\u00a0!";
      } else {
        $("eb"+i).classList.remove("hidden");
        $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";$("fbt"+i).textContent="Pas encore \u2014 consulte l\u2019explication.";
      }
    }
  }
  function update(){
    var ok=0,err=0,done=0;
    for(var i=0;i<TOTAL;i++){if(state[i].ok)ok++;if(state[i].errCount>=1)err++;if(state[i].done)done++;}
    $("st-ok").textContent=ok;$("st-err").textContent=err;$("st-rem").textContent=TOTAL-done;
    $("pfill").style.width=Math.round(done/TOTAL*100)+"%";$("prog-text").textContent=done+" / "+TOTAL;
    if(done===TOTAL)showResults(ok);
  }
  function showResults(ok){
    $("res-score").textContent=ok+" / "+TOTAL;
    var stars=(ok===TOTAL)?5:Math.max(1,Math.round(ok/TOTAL*5));var st="";for(var s=0;s<5;s++)st+=(s<stars?"\u2b50":"\u2606");$("stars").textContent=st;
    var msg;
    if(ok===TOTAL)msg="Parfait\u00a0! Tu identifies le facteur commun au premier coup d\u2019\u0153il.";
    else if(ok>=3)msg="Tr\u00e8s bien\u00a0! Pense \u00e0 bien r\u00e9duire apr\u00e8s la mise en facteur.";
    else msg="Continue\u00a0! Cherche toujours quelle parenth\u00e8se se r\u00e9p\u00e8te dans les deux termes.";
    $("res-msg").textContent=msg;$("results").className="results show";$("results").scrollIntoView({behavior:"smooth"});
  }
  function restart(){buildCards();$("results").className="results";update();window.scrollTo({top:0,behavior:"smooth"});}
  buildCards();update();
  </script>
</body>
</html>
