<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Série d'exercices — Niveau 2 — Arbres de probabilités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --main:#f5c518; --titre:#c49a00; --light:#fff8d6; --border:#f1d97a;
         --badgetxt:#3a2600; --ink:#2a2a2a; --soft:#7a5c00; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'JetBrains Mono',monospace;background:#ffffff;color:var(--ink);
        line-height:1.55;padding:14px;max-width:860px;margin:0 auto;}
  /* HERO */
  .hero{background:var(--light);border:3px solid var(--border);border-radius:20px;
        padding:24px 20px;text-align:center;margin-bottom:16px;}
  .brand-pill{display:inline-flex;align-items:center;gap:9px;background:var(--main);
        color:var(--badgetxt);font-weight:800;font-size:.92rem;letter-spacing:1px;
        padding:9px 22px;border-radius:30px;margin-bottom:16px;}
  .brand-pill .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .brand-pill .d1{background:rgba(58,38,0,.30);}
  .brand-pill .d2{background:var(--badgetxt);}
  .week-label{color:var(--soft);font-weight:700;font-size:.86rem;letter-spacing:2px;
        margin-bottom:8px;}
  h1{font-weight:800;line-height:1.15;margin-bottom:10px;}
  h1 .serie{display:block;font-size:1.55rem;color:var(--titre);}
  h1 .niv{display:block;font-size:1.7rem;color:var(--ink);}
  h1 .niv .exp{color:var(--titre);font-size:1.1rem;}
  .subtitle{font-size:.95rem;color:var(--soft);font-weight:500;margin-bottom:16px;}
  .level-pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .pill{font-weight:800;font-size:.85rem;letter-spacing:.5px;padding:11px 20px;
        border-radius:14px;border:3px solid var(--border);background:#fff;
        color:var(--soft);min-width:118px;}
  .pill.active{background:var(--main);color:var(--badgetxt);border-color:var(--titre);
        box-shadow:0 4px 0 rgba(0,0,0,.12);}
  /* SCOREBOARD */
  .scoreboard{position:sticky;top:8px;z-index:30;background:#fff;border:3px solid var(--border);
        border-radius:16px;padding:12px 14px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);}
  .sb-row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;}
  .sb-item{flex:1;min-width:90px;text-align:center;background:var(--light);border-radius:11px;padding:8px 4px;}
  .sb-item b{display:block;font-size:1.25rem;color:var(--titre);}
  .sb-item small{font-size:.7rem;color:var(--soft);font-weight:600;}
  .xp-wrap{margin-top:10px;}
  .xp-bar{height:14px;background:var(--light);border-radius:30px;overflow:hidden;border:2px solid var(--border);}
  .xp-fill{height:100%;width:0;background:var(--main);transition:width .4s ease;}
  .xp-txt{text-align:center;font-size:.78rem;color:var(--soft);font-weight:700;margin-top:5px;}
  /* CARDS */
  .card{background:#fff;border:3px solid var(--border);border-radius:18px;padding:18px 16px;margin-bottom:16px;transition:.2s;}
  .card.done{border-color:var(--main);background:var(--light);}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .card-num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--main);
        color:var(--badgetxt);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.95rem;}
  .card-title{font-weight:700;font-size:.96rem;color:var(--titre);}
  .prompt{font-size:.95rem;margin-bottom:12px;}
  .prompt b{color:var(--titre);}
  .fig-wrap{display:flex;justify-content:center;margin:12px 0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;}
  .field{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:8px 0;}
  .field label{font-size:.9rem;font-weight:600;flex:1;min-width:160px;}
  .field .unit{font-weight:700;color:var(--soft);}
  input[type=text]{font-family:inherit;font-size:1.05rem;font-weight:700;width:120px;padding:11px 12px;
        border:3px solid var(--border);border-radius:11px;text-align:center;color:var(--ink);background:#fff;}
  input[type=text]:focus{outline:none;border-color:var(--main);}
  .choices{display:flex;flex-direction:column;gap:9px;}
  .choice{font-family:inherit;text-align:left;font-size:.95rem;font-weight:600;padding:13px 14px;
        border:3px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink);transition:.12s;}
  .choice:hover{border-color:var(--main);}
  .choice.sel{background:var(--main);color:var(--badgetxt);border-color:var(--titre);}
  .choice.good{background:#dff5c6;border-color:#8dc63f;color:#3a4d00;}
  .choice.bad{background:#ffe1dd;border-color:#f28b82;color:#7a1c14;}
  .btn{font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;border:none;border-radius:12px;
        padding:13px 20px;background:var(--main);color:var(--badgetxt);box-shadow:0 4px 0 rgba(0,0,0,.14);transition:.1s;margin-top:6px;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14);}
  .btn.sec{background:#fff;color:var(--soft);border:3px solid var(--border);box-shadow:none;}
  .btn.retry{background:#ffe9a8;color:var(--badgetxt);}
  .fb{margin-top:12px;font-weight:700;font-size:.92rem;padding:10px 12px;border-radius:11px;display:none;}
  .fb.ok{display:block;background:#dff5c6;color:#3a4d00;border:2px solid #8dc63f;}
  .fb.no{display:block;background:#ffe1dd;color:#7a1c14;border:2px solid #f28b82;}
  .sol{display:none;margin-top:10px;background:var(--light);border:2px dashed var(--titre);border-radius:11px;padding:11px 13px;font-size:.9rem;}
  .sol.show{display:block;}
  .sol b{color:var(--titre);}
  .ext-card .ext-frame{width:100%;border:2px solid var(--border);border-radius:12px;background:#fff;margin:10px 0;}
  .ext-note{font-size:.82rem;color:var(--soft);margin-bottom:8px;}
  .results{display:none;text-align:center;background:var(--light);border:3px solid var(--main);border-radius:20px;padding:28px 20px;margin-top:10px;}
  .results.show{display:block;}
  .results h2{color:var(--titre);font-size:1.4rem;margin-bottom:10px;}
  .results .big{font-size:2.4rem;font-weight:800;color:var(--titre);margin:8px 0;}
  .footer-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<div class="hero">
  <div class="brand-pill"><span class="dot d1"></span><span class="dot d2"></span>PAZAPA · MATHS · 3ÈME</div>
  <div class="week-label">SEMAINE 7 — JOUR 5</div>
  <h1><span class="serie">✏️ Série d'exercices</span><span class="niv">Niveau 2</span></h1>
  <div class="subtitle">Arbres de probabilités — expériences à deux épreuves</div>
  <div class="level-pills"><span class="pill">NIVEAU 1</span><span class="pill active">NIVEAU 2</span><span class="pill">NIVEAU 3</span></div>
</div>

<div class="scoreboard">
  <div class="sb-row">
    <div class="sb-item"><b id="sb-ok">0</b><small>Réussies</small></div>
    <div class="sb-item"><b id="sb-rem">0</b><small>Restantes</small></div>
    <div class="sb-item"><b id="sb-err">0</b><small>Erreurs</small></div>
  </div>
  <div class="xp-wrap">
    <div class="xp-bar"><div class="xp-fill" id="xp"></div></div>
    <div class="xp-txt" id="xp-txt">0 / 0</div>
  </div>
</div>

<div id="exos"></div>

<div class="results" id="results">
  <h2>🎉 Niveau terminé !</h2>
  <div class="big" id="res-score">0 / 0</div>
  <p id="res-msg"></p>
</div>

<div class="footer-actions">
  <button class="btn sec" onclick="resetLevel()">↻ Recommencer</button>
</div>

<script>
function pLabel(x,y,txt){
  return '<rect x="'+(x-17)+'" y="'+(y-10)+'" width="34" height="18" rx="4" fill="#ffffff" stroke="#f1d97a" stroke-width="1.5"/>'
       + '<text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5c00">'+txt+'</text>';
}
function pNode(x,y,lbl){
  var r=lbl?13:7;
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#fff8d6" stroke="#c49a00" stroke-width="2.5"/>'
       + (lbl?'<text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#3a2600">'+lbl+'</text>':'');
}
function arbreSVG(o){
  var rx=42, ry=131, l1x=192, l1y=[71,191], l2x=336, l2y=[[37,105],[157,225]];
  var s='<svg viewBox="0 0 412 262" width="100%" style="max-width:412px" xmlns="http://www.w3.org/2000/svg">';
  var i,j;
  for(i=0;i<2;i++) s+='<line x1="'+(rx+9)+'" y1="'+ry+'" x2="'+(l1x-13)+'" y2="'+l1y[i]+'" stroke="#c49a00" stroke-width="2.2"/>';
  for(i=0;i<2;i++) for(j=0;j<2;j++) s+='<line x1="'+(l1x+13)+'" y1="'+l1y[i]+'" x2="'+(l2x-13)+'" y2="'+l2y[i][j]+'" stroke="#c49a00" stroke-width="2.2"/>';
  s+=pNode(rx,ry,'');
  for(i=0;i<2;i++) s+=pNode(l1x,l1y[i],o.l1[i].lbl);
  for(i=0;i<2;i++) for(j=0;j<2;j++) s+=pNode(l2x,l2y[i][j],o.l2[i][j].lbl);
  for(i=0;i<2;i++) s+=pLabel((rx+l1x)/2,(ry+l1y[i])/2-7,o.l1[i].p);
  for(i=0;i<2;i++) for(j=0;j<2;j++) s+=pLabel((l1x+l2x)/2,(l1y[i]+l2y[i][j])/2-7,o.l2[i][j].p);
  if(o.out) for(i=0;i<2;i++) for(j=0;j<2;j++)
    s+='<text x="'+(l2x+18)+'" y="'+(l2y[i][j]+4)+'" font-size="10" font-weight="700" fill="#7a5c00">'+o.out[i][j]+'</text>';
  s+='</svg>';
  return s;
}
function crossTable(rows, cols, data, totals){
  var s='<table style="border-collapse:collapse;width:100%;font-size:.86rem;text-align:center">';
  s+='<tr><th style="border:2px solid #f1d97a;padding:7px;background:#fff8d6"></th>';
  for(var c=0;c<cols.length;c++) s+='<th style="border:2px solid #f1d97a;padding:7px;background:#fff8d6;color:#7a5c00">'+cols[c]+'</th>';
  if(totals) s+='<th style="border:2px solid #f1d97a;padding:7px;background:#f5c518;color:#3a2600">Total</th>';
  s+='</tr>';
  for(var r=0;r<rows.length;r++){
    s+='<tr><th style="border:2px solid #f1d97a;padding:7px;background:#fff8d6;color:#7a5c00">'+rows[r]+'</th>';
    var rt=0;
    for(c=0;c<cols.length;c++){ s+='<td style="border:2px solid #f1d97a;padding:7px;font-weight:700">'+data[r][c]+'</td>'; rt+=data[r][c]; }
    if(totals) s+='<td style="border:2px solid #f1d97a;padding:7px;background:#fff8d6;font-weight:800;color:#7a5c00">'+rt+'</td>';
    s+='</tr>';
  }
  if(totals){
    s+='<tr><th style="border:2px solid #f1d97a;padding:7px;background:#f5c518;color:#3a2600">Total</th>';
    var grand=0;
    for(c=0;c<cols.length;c++){ var ct=0; for(r=0;r<rows.length;r++) ct+=data[r][c]; grand+=ct;
      s+='<td style="border:2px solid #f1d97a;padding:7px;background:#fff8d6;font-weight:800;color:#7a5c00">'+ct+'</td>'; }
    s+='<td style="border:2px solid #f1d97a;padding:7px;background:#f5c518;font-weight:800;color:#3a2600">'+grand+'</td></tr>';
  }
  s+='</table>';
  return s;
}

var EXOS = [
  { kind:'multi', title:'Arbre complet avec remise',
    prompt:'Un sac contient 5 billes : <b>3 rouges</b> et <b>2 vertes</b>. On tire une bille, on la <b>remet</b>, puis on en tire une 2\u1d49. Complète l\'arbre puis calcule.',
    figure: arbreSVG({ l1:[{lbl:'R',p:'0,6'},{lbl:'V',p:'0,4'}],
                       l2:[[{lbl:'R',p:'0,6'},{lbl:'V',p:'0,4'}],[{lbl:'R',p:'0,6'},{lbl:'V',p:'0,4'}]],
                       out:[['(R;R)','(R;V)'],['(V;R)','(V;V)']] }),
    fields:[ {label:'P(deux rouges) =', ans:0.36, tol:0.001, unit:''},
             {label:'P(deux vertes) =', ans:0.16, tol:0.001, unit:''} ],
    sol:'P(R)=3/5=0,6 et P(V)=2/5=0,4.<br>P(deux rouges)=0,6\u00d70,6=<b>0,36</b>.<br>P(deux vertes)=0,4\u00d70,4=<b>0,16</b>.' },
  { kind:'num', title:'Tirage SANS remise',
    prompt:'Même sac : <b>3 rouges</b> et <b>2 vertes</b>. Cette fois on tire une 1\u02b3\u1d49 bille, on <b>ne la remet pas</b>, puis on tire une 2\u1d49 bille. Il ne reste alors que 4 billes. Quelle est la probabilité d\'obtenir <b>deux billes rouges</b> ?',
    figure: arbreSVG({ l1:[{lbl:'R',p:'3/5'},{lbl:'V',p:'2/5'}],
                       l2:[[{lbl:'R',p:'2/4'},{lbl:'V',p:'2/4'}],[{lbl:'R',p:'3/4'},{lbl:'V',p:'1/4'}]],
                       out:[['(R;R)','(R;V)'],['(V;R)','(V;V)']] }),
    unit:'', ans:0.3, tol:0.001,
    sol:'Sans remise, après une rouge il reste 2 rouges sur 4 billes.<br>P(R puis R) = 3/5 \u00d7 2/4 = 6/20 = <b>0,3</b>.' },
  { kind:'num', title:'\u00ab Au moins un \u00bb avec le complément',
    prompt:'On reprend le tirage <b>avec remise</b> (P(rouge)=0,6 \u00e0 chaque tirage). On a déj\u00e0 calculé P(deux rouges)=0,36. Utilise l\'événement contraire pour trouver la probabilité d\'obtenir <b>au moins une bille verte</b> sur les deux tirages.',
    unit:'', ans:0.64, tol:0.001,
    sol:'\u00ab Au moins une verte \u00bb est le contraire de \u00ab deux rouges \u00bb.<br>P = 1 \u2212 0,36 = <b>0,64</b>.' },
  { kind:'multi', title:'Une rouge ET une verte',
    prompt:'Toujours avec remise (P(rouge)=0,6 ; P(verte)=0,4). Un événement peut être formé de <b>plusieurs chemins</b>.',
    fields:[ {label:'P(Rouge puis Verte) =', ans:0.24, tol:0.001, unit:''},
             {label:'P(une rouge et une verte, quel que soit l\'ordre) =', ans:0.48, tol:0.001, unit:''} ],
    sol:'P(R;V)=0,6\u00d70,4=0,24 et P(V;R)=0,4\u00d70,6=0,24.<br>Pour un événement \u00e0 plusieurs chemins, on <b>additionne</b> : 0,24 + 0,24 = <b>0,48</b>.' },
  { kind:'num', title:'Probabilité depuis un tableau',
    prompt:'On interroge 25 élèves sur leur sport préféré. On choisit un élève au hasard. Quelle est la probabilité que ce soit <b>une fille qui préfère la natation</b> ? (résultat en écriture décimale)',
    figure: crossTable(['Filles','Garçons'], ['Natation','Course'], [[6,8],[7,4]], true),
    unit:'', ans:0.24, tol:0.001,
    sol:'Effectif \u00ab fille et natation \u00bb = 6 ; total = 25.<br>P = 6/25 = <b>0,24</b>.' },
  { kind:'qcm', title:'Plusieurs chemins',
    prompt:'Quand un événement correspond \u00e0 <b>plusieurs chemins</b> différents de l\'arbre, comment obtient-on sa probabilité ?',
    choices:['On multiplie les probabilités des chemins entre elles','On additionne les probabilités de chaque chemin','On garde seulement le plus petit chemin','On divise par le nombre de chemins'],
    ans:1,
    sol:'On <b>additionne</b> les probabilités de chacun des chemins qui réalisent l\'événement.' }
];

var state=[], errCount=0;
function genExercises(){
  state = EXOS.map(function(){ return {done:false, sel:null}; });
  errCount = 0;
  buildAll(); updateScore();
  document.getElementById('results').classList.remove('show');
}
function buildAll(){
  var box=document.getElementById('exos'); box.innerHTML='';
  EXOS.forEach(function(ex,idx){
    var c=document.createElement('div');
    c.className='card'+(ex.kind==='ext'?' ext-card':''); c.id='card'+idx;
    var inner='<div class="card-head"><div class="card-num">'+(idx+1)+'</div><div class="card-title">'+ex.title+'</div></div>';
    if(ex.kind==='ext'){
      inner+='<div class="ext-note">'+ex.note+'</div>';
      inner+='<iframe class="ext-frame" style="height:'+(ex.height||520)+'px" src="'+ex.url+'" loading="lazy" allowfullscreen></iframe>';
      inner+='<button class="btn" id="extbtn'+idx+'" onclick="markExtDone('+idx+')">✓ J\'ai terminé</button>';
      inner+='<div class="fb" id="fb'+idx+'"></div>';
    } else {
      inner+='<div class="prompt">'+ex.prompt+'</div>';
      if(ex.figure) inner+='<div class="fig-wrap">'+ex.figure+'</div>';
      if(ex.kind==='num'){
        inner+='<div class="field"><input type="text" id="in'+idx+'_0" inputmode="decimal" autocomplete="off">'+(ex.unit?'<span class="unit">'+ex.unit+'</span>':'')+'</div>';
      } else if(ex.kind==='multi'){
        ex.fields.forEach(function(f,fi){
          inner+='<div class="field"><label>'+f.label+'</label><input type="text" id="in'+idx+'_'+fi+'" inputmode="decimal" autocomplete="off">'+(f.unit?'<span class="unit">'+f.unit+'</span>':'')+'</div>';
        });
      } else if(ex.kind==='qcm'){
        inner+='<div class="choices" id="ch'+idx+'">';
        ex.choices.forEach(function(ch,ci){ inner+='<button class="choice" id="ch'+idx+'_'+ci+'" onclick="selectQcm('+idx+','+ci+')">'+ch+'</button>'; });
        inner+='</div>';
      }
      inner+='<button class="btn" id="vbtn'+idx+'" onclick="checkExo('+idx+')">Valider</button>';
      inner+='<div class="fb" id="fb'+idx+'"></div>';
      inner+='<div class="sol" id="sol'+idx+'"><b>Solution :</b><br>'+ex.sol+'</div>';
    }
    c.innerHTML=inner; box.appendChild(c);
  });
}
function parseNum(v){
  if(v===null||v===undefined) return NaN;
  v=(''+v).trim().replace(',','.').replace(/\s/g,'').replace('%','');
  if(v==='') return NaN;
  return parseFloat(v);
}
function selectQcm(idx,ci){
  if(state[idx].done) return;
  state[idx].sel=ci; var ex=EXOS[idx];
  for(var i=0;i<ex.choices.length;i++) document.getElementById('ch'+idx+'_'+i).classList.remove('sel');
  document.getElementById('ch'+idx+'_'+ci).classList.add('sel');
}
function checkExo(idx){
  if(state[idx].done) return;
  var ex=EXOS[idx], ok=true;
  if(ex.kind==='num'){
    var v=parseNum(document.getElementById('in'+idx+'_0').value);
    ok = !isNaN(v) && Math.abs(v-ex.ans)<=ex.tol;
  } else if(ex.kind==='multi'){
    for(var fi=0; fi<ex.fields.length; fi++){
      var val=parseNum(document.getElementById('in'+idx+'_'+fi).value);
      if(isNaN(val) || Math.abs(val-ex.fields[fi].ans)>ex.fields[fi].tol) ok=false;
    }
  } else if(ex.kind==='qcm'){
    if(state[idx].sel===null){ flash(idx,false,'Choisis d\'abord une réponse.'); return; }
    ok = (state[idx].sel===ex.ans);
  }
  if(ok){
    state[idx].done=true;
    document.getElementById('card'+idx).classList.add('done');
    document.getElementById('sol'+idx).classList.add('show');
    document.getElementById('vbtn'+idx).classList.add('hidden');
    if(ex.kind==='qcm') document.getElementById('ch'+idx+'_'+ex.ans).classList.add('good');
    flash(idx,true,'✓ Bravo, c\'est juste !');
  } else {
    errCount++;
    if(ex.kind==='qcm' && state[idx].sel!==null){
      var b=document.getElementById('ch'+idx+'_'+state[idx].sel);
      b.classList.remove('sel'); b.classList.add('bad');
      setTimeout(function(){ if(!state[idx].done) b.classList.remove('bad'); },900);
    }
    flash(idx,false,'✗ Pas encore. Vérifie ton calcul et réessaye.');
    var vb=document.getElementById('vbtn'+idx); vb.textContent='↻ Réessayer'; vb.classList.add('retry');
  }
  updateScore();
}
function markExtDone(idx){
  if(state[idx].done) return;
  state[idx].done=true;
  document.getElementById('card'+idx).classList.add('done');
  document.getElementById('extbtn'+idx).classList.add('hidden');
  flash(idx,true,'✓ Activité validée !'); updateScore();
}
function flash(idx,good,msg){ var fb=document.getElementById('fb'+idx); fb.className='fb '+(good?'ok':'no'); fb.textContent=msg; }
function updateScore(){
  var done=state.filter(function(s){return s.done;}).length, tot=EXOS.length;
  document.getElementById('sb-ok').textContent=done;
  document.getElementById('sb-rem').textContent=(tot-done);
  document.getElementById('sb-err').textContent=errCount;
  var pct=tot?Math.round(done/tot*100):0;
  document.getElementById('xp').style.width=pct+'%';
  document.getElementById('xp-txt').textContent=done+' / '+tot;
  if(done===tot && tot>0) showResults(done,tot);
  else document.getElementById('results').classList.remove('show');
}
function showResults(done,tot){
  var r=document.getElementById('results');
  document.getElementById('res-score').textContent=done+' / '+tot;
  var msg;
  if(errCount===0) msg='Sans-faute ! Tu maîtrises les arbres de probabilités. 🌳';
  else if(errCount<=3) msg='Très bien joué, tu as su rebondir après les erreurs. 💪';
  else msg='Niveau terminé ! Recommence pour viser le sans-faute. ✨';
  document.getElementById('res-msg').textContent=msg;
  r.classList.add('show'); r.scrollIntoView({behavior:'smooth',block:'center'});
}
function resetLevel(){ genExercises(); window.scrollTo({top:0,behavior:'smooth'}); }
genExercises();
</script>
