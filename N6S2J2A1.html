<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Semaine 2 Jour 2 – Ordres de grandeur & opérations</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══════════════════════════════════════════════════
       COULEUR DU JOUR — JOUR 2 (rose)
    ═══════════════════════════════════════════════════ */
    :root {
      --day-color:  #f28b82;
      --day-dark:   #c0392b;
      --day-light:  #fff0ef;
      --day-border: #f9c0bb;
      --day-glow:   rgba(242,139,130,.3);
    }

    /* ═══════════════════════════════════════════════════
       CHARTE PAZAPA — NE PAS TOUCHER
    ═══════════════════════════════════════════════════ */
    :root {
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg); color:var(--text);
      font-family:Arial,sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; padding:2rem 1rem 4rem;
      position:relative; overflow-x:hidden;
      letter-spacing:.02em; word-spacing:.06em;
    }
    body::before{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:340px; height:340px;
      background:var(--yellow); top:-80px; right:-80px;
      pointer-events:none;
    }
    body::after{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:260px; height:260px;
      background:var(--day-color); bottom:-60px; left:-60px;
      pointer-events:none;
    }
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:180px;height:180px;background:var(--green);
      bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:120px;height:120px;background:var(--blue);
      top:200px;left:-30px;pointer-events:none;}

    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{
      display:inline-flex;align-items:center;gap:.5rem;
      background:var(--yellow);color:#000;
      font-size:.78rem;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;padding:.3rem .9rem;
      border-radius:99px;margin-bottom:.5rem;
    }
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;color:var(--muted);margin-bottom:.5rem;
    }
    h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
    h1 .hl{color:var(--day-color);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;
      font-family:'JetBrains Mono',monospace;}

    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;
      position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;
      font-size:.78rem;color:var(--muted);
      font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;
      height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;
      background:linear-gradient(90deg,var(--day-color),var(--yellow));
      border-radius:99px;transition:width .5s ease;}

    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;
      flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;
      border-radius:99px;font-size:.8rem;
      font-family:'JetBrains Mono',monospace;
      border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong   .dot{background:var(--pink);}
    .chip.remaining .dot{background:var(--muted);}

    .card{width:100%;max-width:680px;background:var(--surface);
      border:2px solid var(--border);border-radius:var(--radius);
      padding:2rem 2rem 1.6rem;position:relative;z-index:1;
      box-shadow:0 4px 20px rgba(0,0,0,.06);
      animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--blue));}

    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;
      color:var(--muted);margin-bottom:.5rem;
      text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;
      padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;
      letter-spacing:.08em;margin-bottom:.7rem;
      background:var(--day-light);color:var(--day-dark);
      border:1.5px solid var(--day-border);}

    .eq-box{background:var(--day-light);border:2px solid var(--day-border);
      border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;
      font-family:'JetBrains Mono',monospace;
      font-size:clamp(1.05rem,3vw,1.5rem);
      font-weight:700;color:var(--day-dark);text-align:center;line-height:1.5;}

    .q-text{font-size:.9rem;color:var(--muted);
      margin-bottom:.8rem;line-height:1.8;}

    .method-box{background:var(--day-light);
      border:1.5px solid var(--day-border);
      border-left:4px solid var(--day-color);
      border-radius:8px;padding:.75rem 1rem;margin-bottom:1.2rem;
      font-size:.84rem;font-family:'JetBrains Mono',monospace;
      color:var(--day-dark);line-height:1.8;}
    .method-box strong{color:var(--day-color);}

    /* Lignes opération (ex2 / ex4) */
    .op-row{display:flex;align-items:center;gap:.55rem;
      flex-wrap:wrap;position:relative;z-index:2;margin-bottom:.9rem;
      padding-bottom:.7rem;border-bottom:1px solid var(--border);}
    .op-lbl{font-family:'JetBrains Mono',monospace;font-weight:700;
      min-width:1.6rem;color:var(--muted);}
    .op-calc{font-family:'JetBrains Mono',monospace;font-weight:700;
      font-size:1.05rem;min-width:9rem;}
    .op-eq{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--muted);}
    .answer-input{width:120px;background:var(--bg);
      border:2px solid var(--border);border-radius:10px;
      color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:1.05rem;padding:.5rem .85rem;outline:none;
      transition:border-color .2s;position:relative;z-index:2;height:2.6rem;text-align:center;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input  {border-color:var(--pink); background:#fff0ef;}
    .input-small{width:64px;}

    /* Durées (ex3) */
    .dur-row{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;
      margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);
      position:relative;z-index:2;}
    .dur-calc{font-family:'JetBrains Mono',monospace;font-weight:700;
      font-size:1rem;min-width:12.5rem;color:var(--day-dark);}
    .dur-unit{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--muted);}

    /* Choix de colonne (ex1) */
    .col-row{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;
      margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);
      position:relative;z-index:2;}
    .col-calc{font-family:'JetBrains Mono',monospace;font-weight:700;
      font-size:.98rem;min-width:11rem;}
    .col-btns{display:flex;gap:.45rem;flex-wrap:wrap;}
    .col-btn{padding:.45rem .8rem;border:2px solid var(--border);
      border-radius:9px;font-family:'JetBrains Mono',monospace;
      font-size:.92rem;font-weight:700;cursor:pointer;background:var(--bg);
      color:var(--text);min-height:2.6rem;text-align:center;
      transition:transform .12s,border-color .15s,background .15s;}
    .col-btn:hover:not(.locked){border-color:var(--day-color);}
    .col-btn:active{transform:scale(.94);}
    .col-btn.selected{border-color:var(--day-color);background:var(--day-light);color:var(--day-dark);}
    .col-btn.correct-opt{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .col-btn.wrong-opt{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .col-btn.locked{cursor:default;}
    .col-btn small{display:block;font-size:.68rem;color:var(--muted);font-weight:400;}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;
      position:relative;z-index:2;margin-top:.4rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;
      padding:.6rem 1.3rem;border-radius:10px;
      font-family:Arial,sans-serif;font-size:.92rem;
      font-weight:700;cursor:pointer;border:none;
      transition:transform .12s,box-shadow .15s;
      position:relative;z-index:2;min-height:2.6rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;
      box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);
      box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);
      border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

    .hint-box{margin-top:.9rem;background:#fffbeb;
      border:1.5px dashed var(--yellow);border-radius:10px;
      padding:.75rem 1rem;font-size:.85rem;color:#7a6010;
      display:none;line-height:1.8;
      font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}

    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;
      font-size:.9rem;display:none;align-items:flex-start;
      gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink); color:#c0392b;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:.82rem;margin-top:.3rem;line-height:1.8;}

    .nav-row{display:flex;justify-content:space-between;
      margin-top:1.4rem;gap:.7rem;position:relative;z-index:2;flex-wrap:wrap;}

    .results{width:100%;max-width:680px;text-align:center;
      display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:2.5rem 2rem;
      box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;
      line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;
      gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;
      padding:.65rem 1rem;background:var(--bg);
      border:1.5px solid var(--border);border-radius:10px;
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;line-height:1.6;}
    .recap-item .eq{color:var(--day-color);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}
    .recap-item.ko-item{border-color:#f9c0bb;}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px);}
      to  {opacity:1;transform:translateY(0);}
    }
    .card,.results{animation:fadeUp .4s ease both;}
    @media(max-width:480px){
      .card{padding:1.4rem;}
      .btn{font-size:.85rem;padding:.55rem 1rem;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 6&egrave;me
    </div>
    <div class="week-label">Semaine 2 &ndash; Jour 2</div>
    <h1>Ordres de grandeur et <span class="hl">op&eacute;rations</span></h1>
    <p class="subtitle">4 exercices &middot; additions, soustractions, dur&eacute;es &middot; niveau 6&egrave;me</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">Exercice 1 / 4</span>
      <span id="prog-pct">0&nbsp;%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div class="score-row">
    <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
    <div class="chip wrong"  ><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
    <div class="chip remaining"><div class="dot"></div><span id="count-rem">4</span> restantes</div>
  </div>

  <div class="card" id="ex-card">
    <div class="card-stripe"></div>
    <div class="q-num" id="q-num">Exercice 1</div>
    <div class="theme-badge" id="q-theme">Ordre de grandeur</div>
    <div class="eq-box" id="q-eq"></div>
    <div class="q-text" id="q-text"></div>
    <div class="method-box" id="method-box"></div>

    <div id="answer-zone"></div>

    <div class="btn-row" id="action-row">
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">&#10003; Valider</button>
      <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    </div>

    <div class="hint-box" id="hint-box"></div>

    <div class="feedback" id="feedback">
      <span class="feedback-icon" id="fb-icon"></span>
      <div>
        <div id="fb-msg"></div>
        <div class="feedback-detail" id="fb-detail"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">&larr; Pr&eacute;c&eacute;dent</button>
      <button class="btn btn-ghost" id="btn-restart" onclick="restart()">&#128260; Recommencer</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button>
    </div>
  </div>

  <div class="results" id="results-screen">
    <div class="results-card">
      <div class="logo-badge" style="margin-bottom:.5rem">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#3ab5d8"></span>
        R&eacute;sultats
      </div>
      <div class="results-score"><span class="s-num" id="score-num">0</span>/4</div>
      <div class="stars" id="stars-row"></div>
      <div class="results-msg" id="results-msg"></div>
      <div class="recap-list" id="recap-list"></div>
      <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">&#128260; Recommencer</button>
    </div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════
   EXERCICES — Semaine 2 Jour 2
   Contenu mathématique vérifié :
   EX1 ordre de grandeur (valeur exacte -> bonne colonne) :
     128,6+71,77 = 200,37     -> col 3 (200)
     1548,103+99,874 = 1647,98 -> col 1 (1600)
     301,79-187,03 = 114,76   -> col 2 (100)
     5492-1620,712 = 3871,29  -> col 1 (4000)
   EX2 additions : 47,5+31,29=78,79 | 106,1+79,4=185,5 | 1491+64,9=1555,9
   EX3 durées : 3h16+2h29=5h45 | 1h24+4h57=6h21 | 5h12-3h08=2h04
   EX4 opérations : 12,4+4,8=17,2 | 145,89+23,2=169,09 | 96+65,43=161,43
                    135,8-49=86,8 | 49,6-6,2=43,4 | 754,829-26,478=728,351
═══════════════════════════════════════════════════════ */

function toNum(s){ return parseFloat(String(s).replace(',', '.').replace(/\s/g, '')); }
function sameNum(a, b){ return Math.abs(toNum(a) - toNum(b)) < 1e-9; }

var EXERCISES = [
  /* ── Exercice 1 : choisir la colonne du bon ordre de grandeur ── */
  {
    type:  "columns",
    theme: "Ordre de grandeur",
    eq:    "Quelle colonne donne le bon ordre de grandeur ?",
    method:"<strong>M\u00e9thode :</strong> arrondis chaque nombre, puis calcule de t\u00eate.<br>"
         + "Ex : 128,6 + 71,77 \u2248 130 + 70 = 200.",
    cols:  ["1","2","3"],
    rows: [
      { calc:"128,6 + 71,77",      values:["2 000","20","200"],     ans:"3" },
      { calc:"1 548,103 + 99,874", values:["1 600","1 100","2 500"], ans:"1" },
      { calc:"301,79 \u2212 187,03", values:["500","100","1 000"],   ans:"2" },
      { calc:"5 492 \u2212 1 620,712", values:["4 000","400","7 000"], ans:"1" }
    ],
    hint:  "Arrondis : 1re ligne \u2248 200 ; 2e \u2248 1 600 ; 3e \u2248 100 ; 4e \u2248 3 900 (proche de 4 000)."
  },
  /* ── Exercice 2 : additions ── */
  {
    type:  "ops",
    theme: "Additions",
    eq:    "Calcule chaque addition",
    method:"<strong>M\u00e9thode :</strong> pose l\u2019op\u00e9ration en alignant les virgules.<br>"
         + "Astuce : un ordre de grandeur permet de v\u00e9rifier (47,5 + 31,29 \u2248 80).",
    items: [
      { lbl:"a)", calc:"47,5 + 31,29", ans:"78,79" },
      { lbl:"b)", calc:"106,1 + 79,4", ans:"185,5" },
      { lbl:"c)", calc:"1491 + 64,9",  ans:"1555,9" }
    ],
    hint:  "Aligne les virgules : 47,50 + 31,29 = 78,79. Pense \u00e0 mettre un z\u00e9ro pour avoir le m\u00eame nombre de d\u00e9cimales."
  },
  /* ── Exercice 3 : durées (heures / minutes) ── */
  {
    type:  "durations",
    theme: "Dur\u00e9es",
    eq:    "Calcule chaque dur\u00e9e (heures et minutes)",
    method:"<strong>M\u00e9thode :</strong> on ajoute (ou soustrait) <strong>s\u00e9par\u00e9ment</strong> les heures et les minutes.<br>"
         + "Si les minutes d\u00e9passent 60, on convertit : 60 min = 1 h.",
    items: [
      { lbl:"a)", h1:3, m1:16, op:"+", h2:2, m2:29, ansH:5, ansM:45 },
      { lbl:"b)", h1:1, m1:24, op:"+", h2:4, m2:57, ansH:6, ansM:21 },
      { lbl:"c)", h1:5, m1:12, op:"\u2212", h2:3, m2:8, ansH:2, ansM:4 }
    ],
    hint:  "b) 24 min + 57 min = 81 min = 1 h 21 min. On ajoute alors cette heure : 1 h + 4 h + 1 h = 6 h, reste 21 min \u2192 6 h 21 min."
  },
  /* ── Exercice 4 : poser et effectuer (ex-"devoir maison") ── */
  {
    type:  "ops",
    theme: "S\u2019entra\u00eener",
    eq:    "Pose et effectue chaque op\u00e9ration",
    method:"<strong>M\u00e9thode :</strong> aligne toujours les virgules. Pour 96 + 65,43, pense \u00e0 96 = 96,00.<br>"
         + "Pour 135,8 \u2212 49, pense \u00e0 49 = 49,0.",
    items: [
      { lbl:"a)", calc:"12,4 + 4,8",      ans:"17,2" },
      { lbl:"b)", calc:"145,89 + 23,2",   ans:"169,09" },
      { lbl:"c)", calc:"96 + 65,43",      ans:"161,43" },
      { lbl:"d)", calc:"135,8 \u2212 49",   ans:"86,8" },
      { lbl:"e)", calc:"49,6 \u2212 6,2",   ans:"43,4" },
      { lbl:"f)", calc:"754,829 \u2212 26,478", ans:"728,351" }
    ],
    hint:  "Aligne les virgules et complete avec des z\u00e9ros. Ex : 96,00 + 65,43 = 161,43."
  }
];

/* ═══════════════════════════════════════════════════════
   MOTEUR
═══════════════════════════════════════════════════════ */
var TOTAL = EXERCISES.length;
var current = 0;
var userAnswers = new Array(TOTAL).fill(null); /* {ok, data} */
var hintOpen = false;
var $ = function(id){ return document.getElementById(id); };

var draftCols = [];  /* ex1 : colonne choisie par ligne */
var draftOps  = [];  /* ex2/ex4 : réponse saisie par ligne */
var draftDur  = [];  /* ex3 : {h, m} par ligne */

function render(){
  var ex = EXERCISES[current];
  $("q-num").textContent = "Exercice " + (current+1);
  $("q-theme").textContent = ex.theme;
  $("q-eq").innerHTML = ex.eq;
  $("q-text").textContent = "";
  $("method-box").innerHTML = ex.method;
  $("hint-box").innerHTML = "";
  $("hint-box").classList.remove("show");
  hintOpen = false;
  $("feedback").className = "feedback";

  var done = userAnswers[current] !== null;
  var zone = $("answer-zone");
  zone.innerHTML = "";

  if(ex.type === "columns")        buildColumns(zone, ex, done);
  else if(ex.type === "ops")       buildOps(zone, ex, done);
  else if(ex.type === "durations") buildDurations(zone, ex, done);

  $("btn-check").disabled = done;
  $("btn-next").disabled  = !done;
  $("btn-prev").disabled  = current === 0;
  $("btn-next").textContent = (current === TOTAL-1) ? "Terminer \u2192" : "Suivant \u2192";

  if(done) showFeedback(userAnswers[current].ok);
  updateProgress();
}

/* ---------- EX1 : colonnes ---------- */
function buildColumns(zone, ex, done){
  if(draftCols.length !== ex.rows.length) draftCols = new Array(ex.rows.length).fill(null);
  var saved = done ? userAnswers[current].data : null;

  ex.rows.forEach(function(row, i){
    var line = document.createElement("div");
    line.className = "col-row";

    var calc = document.createElement("span");
    calc.className = "col-calc"; calc.textContent = row.calc;
    line.appendChild(calc);

    var btns = document.createElement("div");
    btns.className = "col-btns";
    ex.cols.forEach(function(c, ci){
      var b = document.createElement("button");
      b.className = "col-btn";
      var num = document.createElement("span"); num.textContent = c;
      var sub = document.createElement("small"); sub.textContent = row.values[ci];
      b.appendChild(num); b.appendChild(sub);
      if(done){
        b.classList.add("locked");
        var chosen = saved[i];
        if(c === chosen) b.classList.add(c === row.ans ? "correct-opt" : "wrong-opt");
        if(c === row.ans && chosen !== row.ans) b.classList.add("correct-opt");
      } else {
        if(draftCols[i] === c) b.classList.add("selected");
        b.onclick = (function(idx, val){ return function(){
          draftCols[idx] = val;
          var sibs = btns.querySelectorAll(".col-btn");
          sibs.forEach(function(s){ s.classList.remove("selected"); });
          this.classList.add("selected");
        };})(i, c);
      }
      btns.appendChild(b);
    });
    line.appendChild(btns);
    zone.appendChild(line);
  });
}

/* ---------- EX2 / EX4 : opérations à saisir ---------- */
function buildOps(zone, ex, done){
  if(draftOps.length !== ex.items.length) draftOps = new Array(ex.items.length).fill("");
  var saved = done ? userAnswers[current].data : null;

  ex.items.forEach(function(it, i){
    var row = document.createElement("div");
    row.className = "op-row";

    var lbl = document.createElement("span");
    lbl.className = "op-lbl"; lbl.textContent = it.lbl;
    row.appendChild(lbl);

    var calc = document.createElement("span");
    calc.className = "op-calc"; calc.textContent = it.calc;
    row.appendChild(calc);

    var eq = document.createElement("span");
    eq.className = "op-eq"; eq.textContent = "=";
    row.appendChild(eq);

    var inp = document.createElement("input");
    inp.type = "text"; inp.className = "answer-input"; inp.placeholder = "?";
    inp.autocomplete = "off"; inp.id = "op" + i;
    if(done){
      inp.value = saved[i].val; inp.disabled = true;
      inp.className = "answer-input " + (saved[i].ok ? "correct-input" : "wrong-input");
    } else {
      inp.value = draftOps[i];
      inp.oninput = (function(idx){ return function(){ draftOps[idx] = this.value; }; })(i);
      inp.addEventListener("keydown", function(e){
        if(e.key === "Enter" && !$("btn-check").disabled) checkAnswer();
      });
    }
    row.appendChild(inp);
    zone.appendChild(row);
  });
}

/* ---------- EX3 : durées ---------- */
function buildDurations(zone, ex, done){
  if(draftDur.length !== ex.items.length){
    draftDur = ex.items.map(function(){ return { h:"", m:"" }; });
  }
  var saved = done ? userAnswers[current].data : null;

  ex.items.forEach(function(it, i){
    var row = document.createElement("div");
    row.className = "dur-row";

    var lbl = document.createElement("span");
    lbl.className = "op-lbl"; lbl.textContent = it.lbl;
    row.appendChild(lbl);

    var calc = document.createElement("span");
    calc.className = "dur-calc";
    calc.textContent = it.h1 + " h " + pad(it.m1) + " min  " + it.op + "  " + it.h2 + " h " + pad(it.m2) + " min  =";
    row.appendChild(calc);

    var inpH = document.createElement("input");
    inpH.type = "text"; inpH.className = "answer-input input-small"; inpH.placeholder = "?";
    inpH.autocomplete = "off"; inpH.id = "dh" + i;
    var uH = document.createElement("span"); uH.className = "dur-unit"; uH.textContent = "h";

    var inpM = document.createElement("input");
    inpM.type = "text"; inpM.className = "answer-input input-small"; inpM.placeholder = "?";
    inpM.autocomplete = "off"; inpM.id = "dm" + i;
    var uM = document.createElement("span"); uM.className = "dur-unit"; uM.textContent = "min";

    if(done){
      inpH.value = saved[i].h; inpH.disabled = true;
      inpH.className = "answer-input input-small " + (saved[i].okH ? "correct-input" : "wrong-input");
      inpM.value = saved[i].m; inpM.disabled = true;
      inpM.className = "answer-input input-small " + (saved[i].okM ? "correct-input" : "wrong-input");
    } else {
      inpH.value = draftDur[i].h;
      inpM.value = draftDur[i].m;
      inpH.oninput = (function(idx){ return function(){ draftDur[idx].h = this.value; }; })(i);
      inpM.oninput = (function(idx){ return function(){ draftDur[idx].m = this.value; }; })(i);
      var onEnter = function(e){ if(e.key === "Enter" && !$("btn-check").disabled) checkAnswer(); };
      inpH.addEventListener("keydown", onEnter);
      inpM.addEventListener("keydown", onEnter);
    }

    row.appendChild(inpH); row.appendChild(uH);
    row.appendChild(inpM); row.appendChild(uM);
    zone.appendChild(row);
  });
}

function pad(n){ return (n < 10 ? "0" : "") + n; }

/* ---------- VALIDATION ---------- */
function checkAnswer(){
  var ex = EXERCISES[current];
  if(ex.type === "columns")   return checkColumns(ex);
  if(ex.type === "ops")       return checkOps(ex);
  if(ex.type === "durations") return checkDurations(ex);
}

function checkColumns(ex){
  for(var i=0;i<ex.rows.length;i++){ if(!draftCols[i]) return; }
  var allOk = ex.rows.every(function(r,i){ return draftCols[i] === r.ans; });
  userAnswers[current] = { ok: allOk, data: draftCols.slice() };
  render();
}

function checkOps(ex){
  var data = [];
  for(var i=0;i<ex.items.length;i++){
    var raw = (draftOps[i] || "").trim();
    if(raw === "") return;
    if(isNaN(toNum(raw))) return;
    data.push({ val: raw, ok: sameNum(raw, ex.items[i].ans) });
  }
  var allOk = data.every(function(d){ return d.ok; });
  userAnswers[current] = { ok: allOk, data: data };
  render();
}

function checkDurations(ex){
  var data = [];
  for(var i=0;i<ex.items.length;i++){
    var h = (draftDur[i].h || "").trim();
    var m = (draftDur[i].m || "").trim();
    if(h === "" || m === "") return;
    if(isNaN(parseInt(h,10)) || isNaN(parseInt(m,10))) return;
    var okH = parseInt(h,10) === ex.items[i].ansH;
    var okM = parseInt(m,10) === ex.items[i].ansM;
    data.push({ h:h, m:m, okH:okH, okM:okM });
  }
  var allOk = data.every(function(d){ return d.okH && d.okM; });
  userAnswers[current] = { ok: allOk, data: data };
  render();
}

/* ---------- FEEDBACK ---------- */
function showFeedback(correct){
  var ex = EXERCISES[current];
  var fb = $("feedback");
  fb.className = "feedback show " + (correct ? "ok" : "ko");
  $("fb-icon").textContent = correct ? "\u2705" : "\u274C";
  $("fb-msg").textContent = correct ? "Bravo ! Tout est correct." : "Pas tout \u00e0 fait\u2026";
  $("fb-detail").innerHTML = correct ? "" : buildCorrection(ex);
}

function buildCorrection(ex){
  if(ex.type === "columns"){
    var wrong = ex.rows.filter(function(r,i){ return userAnswers[current].data[i] !== r.ans; });
    return "Correction : " + wrong.map(function(r){
      return r.calc + " \u2192 colonne " + r.ans;
    }).join("&nbsp;&nbsp;|&nbsp;&nbsp;");
  }
  if(ex.type === "ops"){
    var w = ex.items.filter(function(it,i){ return !userAnswers[current].data[i].ok; });
    return "Correction : " + w.map(function(it){
      return it.calc + " = " + it.ans;
    }).join("&nbsp;&nbsp;|&nbsp;&nbsp;");
  }
  if(ex.type === "durations"){
    var wd = [];
    ex.items.forEach(function(it,i){
      var d = userAnswers[current].data[i];
      if(!d.okH || !d.okM){
        wd.push(it.lbl + " " + it.ansH + " h " + pad(it.ansM) + " min");
      }
    });
    return "Correction : " + wd.join("&nbsp;&nbsp;|&nbsp;&nbsp;");
  }
  return "";
}

function toggleHint(){
  hintOpen = !hintOpen;
  var h = $("hint-box");
  if(hintOpen){
    h.innerHTML = "<strong>? Indice :</strong> " + EXERCISES[current].hint;
    h.classList.add("show");
  } else {
    h.classList.remove("show");
  }
}

function updateProgress(){
  var answered = userAnswers.filter(function(a){ return a !== null; }).length;
  var ok = userAnswers.filter(function(a){ return a !== null && a.ok; }).length;
  var ko = answered - ok;
  var pct = Math.round((answered / TOTAL) * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = "Exercice " + (current+1) + " / " + TOTAL;
  $("prog-pct").textContent = pct + "\u00a0%";
  $("count-ok").textContent = ok;
  $("count-ko").textContent = ko;
  $("count-rem").textContent = TOTAL - answered;
}

function nextQ(){
  if(current < TOTAL-1){ current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}
function prevQ(){ if(current > 0){ current--; render(); window.scrollTo({top:0,behavior:"smooth"}); } }

function showResults(){
  $("ex-card").style.display = "none";
  $("results-screen").classList.add("show");
  var ok = userAnswers.filter(function(a){ return a !== null && a.ok; }).length;
  $("score-num").textContent = ok;
  var ratio = ok / TOTAL;
  var stars = ok >= TOTAL ? 5 : ratio >= .75 ? 4 : ratio >= .5 ? 3 : ratio >= .25 ? 2 : ok >= 1 ? 1 : 0;
  $("stars-row").textContent = "\u2B50".repeat(stars) + "\u2606".repeat(5-stars);
  var msgs = ["Continue \u00e0 t\u2019entra\u00eener !","Bon d\u00e9but !","Pas mal !","Bien jou\u00e9 !","Parfait ! Bravo ! \uD83C\uDF89"];
  $("results-msg").textContent = msgs[Math.min(ok, msgs.length-1)];
  var list = $("recap-list"); list.innerHTML = "";
  var titles = ["1. Ordres de grandeur","2. Additions","3. Dur\u00e9es (h/min)","4. Poser et effectuer"];
  EXERCISES.forEach(function(ex, i){
    var correct = userAnswers[i] !== null && userAnswers[i].ok;
    var div = document.createElement("div");
    div.className = "recap-item " + (correct ? "ok-item" : "ko-item");
    div.innerHTML = "<span>" + (correct ? "\u2705" : "\u274C") + "</span><span class='eq'></span>";
    div.querySelector(".eq").textContent = titles[i];
    list.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  userAnswers = new Array(TOTAL).fill(null);
  draftCols = []; draftOps = []; draftDur = [];
  current = 0;
  $("ex-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", function(){
  $("count-rem").textContent = TOTAL;
  render();
});
</script>
</body>
</html>
