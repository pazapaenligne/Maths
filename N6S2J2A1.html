<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths — Semaine 2 Jour 2 — Ordres de grandeur et opérations</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══ COULEUR DU JOUR — Mardi (Jour 2) → Rose ═══ */
    :root {
      --day-color:  #b94040;
      --day-dark:   #7a1f1f;
      --day-light:  #f7eded;
      --day-border: #f9c0bb;
      --day-glow:   rgba(185,64,64,.3);
    }
    /* ═══ CHARTE PAZAPA — NE PAS TOUCHER ═══ */
    :root {
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
      /* Erreurs : rouge foncé distinct (le rose est la couleur du jour) */
      --err-bg:#fce4e4; --err-border:#8e1b13; --err-text:#8e1b13;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
      position:relative;overflow-x:hidden;letter-spacing:.02em;word-spacing:.06em;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--blue);top:200px;left:-30px;pointer-events:none;}

    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
    h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
    h1 .hl{color:var(--day-dark);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}

    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:99px;font-size:.8rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong .dot{background:var(--err-border);}
    .chip.remaining .dot{background:var(--muted);}

    .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 2rem 1.6rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--blue));}

    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);}
    .eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1.05rem,3vw,1.4rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.5;}
    .method-box{background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.75rem 1rem;margin-bottom:1.2rem;font-size:.84rem;font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.8;}
    .method-box strong{color:var(--day-dark);}

    .op-row{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;position:relative;z-index:2;margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);}
    .op-lbl{font-family:'JetBrains Mono',monospace;font-weight:700;min-width:1.6rem;color:var(--muted);}
    .op-calc{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.05rem;min-width:9rem;}
    .op-eq{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--muted);}
    .answer-input{width:120px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.05rem;padding:.5rem .85rem;outline:none;transition:border-color .2s;position:relative;z-index:2;height:2.6rem;text-align:center;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .answer-input.wrong-input{border-color:var(--err-border);background:var(--err-bg);color:var(--err-text);}
    .input-small{width:64px;}

    .dur-row{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);position:relative;z-index:2;}
    .dur-calc{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1rem;min-width:12.5rem;color:var(--day-dark);}
    .dur-unit{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--muted);}

    .col-row{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);position:relative;z-index:2;}
    .col-calc{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.98rem;min-width:11rem;}
    .col-btns{display:flex;gap:.45rem;flex-wrap:wrap;}
    .col-btn{padding:.45rem .8rem;border:2px solid var(--border);border-radius:9px;font-family:'JetBrains Mono',monospace;font-size:.92rem;font-weight:700;cursor:pointer;background:var(--bg);color:var(--text);min-height:2.6rem;text-align:center;transition:transform .12s,border-color .15s,background .15s;}
    .col-btn:hover:not(.locked){border-color:var(--day-color);}
    .col-btn:active{transform:scale(.94);}
    .col-btn.selected{border-color:var(--day-color);background:var(--day-light);color:var(--day-dark);}
    .col-btn.correct-opt{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .col-btn.wrong-opt{border-color:var(--err-border);background:var(--err-bg);color:var(--err-text);}
    .col-btn.locked{cursor:default;}
    .col-btn small{display:block;font-size:.68rem;color:var(--muted);font-weight:400;}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;position:relative;z-index:2;margin-top:.4rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;position:relative;z-index:2;min-height:2.6rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-solution{background:var(--day-dark);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

    .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:.85rem;color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}

    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;font-size:.9rem;display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:var(--err-bg);border:1.5px solid var(--err-border);color:var(--err-text);}
    .feedback.partial{background:#fffbeb;border:1.5px solid var(--yellow);color:#7a6010;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.8;}

    .nav-row{display:flex;justify-content:space-between;margin-top:1.4rem;gap:.7rem;position:relative;z-index:2;flex-wrap:wrap;}

    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-dark);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;letter-spacing:.1em;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;padding:.65rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.6;}
    .recap-item .eq{color:var(--day-dark);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}
    .recap-item.ko-item{border-color:var(--err-border);}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:480px){
      .card,.results-card{padding:1.4rem;}
      .btn{font-size:.85rem;padding:.55rem 1rem;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#f28b82"></span>
      Pazapa &middot; Maths &middot; 6&egrave;me
    </div>
    <div class="week-label">Semaine 2 &ndash; Jour 2</div>
    <h1><span style="color:var(--text)">Ordres de grandeur</span> <span class="hl">et op&eacute;rations</span></h1>
    <p class="subtitle">4 exercices &middot; 16 items &middot; additions, soustractions, dur&eacute;es</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">Exercice 1 / 4</span>
      <span id="prog-pct">0&nbsp;%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div class="score-row">
    <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
    <div class="chip wrong"><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
    <div class="chip remaining"><div class="dot"></div><span id="count-rem">16</span> restantes</div>
  </div>

  <div class="card" id="ex-card">
    <div class="card-stripe"></div>
    <div class="q-num" id="q-num">Exercice 1</div>
    <div class="theme-badge" id="q-theme">Ordre de grandeur</div>
    <div class="eq-box" id="q-eq"></div>
    <div class="method-box" id="method-box"></div>

    <div id="answer-zone"></div>

    <div class="btn-row" id="action-row">
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">&#10003; V&eacute;rifier</button>
      <button class="btn btn-hint" id="btn-hint" onclick="toggleHint()">? Indice</button>
      <button class="btn btn-solution" id="btn-solution" onclick="showSolution()" style="display:none;">&#128161; Solution</button>
    </div>

    <div class="hint-box" id="hint-box"></div>

    <div class="feedback" id="feedback">
      <span class="feedback-icon" id="fb-icon"></span>
      <div>
        <div id="fb-msg"></div>
        <div class="feedback-detail" id="fb-detail"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">&larr; Pr&eacute;c&eacute;dent</button>
      <button class="btn btn-ghost" id="btn-restart" onclick="restart()">&#128260; Recommencer</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button>
    </div>
  </div>

  <div class="results" id="results-screen">
    <div class="results-card">
      <div class="logo-badge" style="margin-bottom:.5rem">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#f28b82"></span>
        R&eacute;sultats
      </div>
      <div class="results-score"><span class="s-num" id="score-num">0</span>/16</div>
      <div class="stars" id="stars-row"></div>
      <div class="results-msg" id="results-msg"></div>
      <div class="recap-list" id="recap-list"></div>
      <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">&#128260; Recommencer</button>
    </div>
  </div>

<script>
function toNum(s){ return parseFloat(String(s).replace(',', '.').replace(/\s/g, '')); }
function sameNum(a, b){ return Math.abs(toNum(a) - toNum(b)) < 1e-9; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
var $ = function(id){ return document.getElementById(id); };

var EXERCISES = [
  {
    type:"columns", theme:"Ordre de grandeur",
    eq:"Quelle colonne donne le bon ordre de grandeur&nbsp;?",
    method:"<strong>M\u00e9thode\u00a0:</strong> arrondis chaque nombre, puis calcule de t\u00eate. Par exemple 52,4 + 38,9 \u2248 50 + 40 = 90.",
    cols:["1","2","3"],
    rows:[
      { calc:"128,6 + 71,77",        values:["2 000","20","200"],      ans:"3" },
      { calc:"1 548,103 + 99,874",   values:["1 600","1 100","2 500"], ans:"1" },
      { calc:"301,79 \u2212 187,03",  values:["500","100","1 000"],     ans:"2" },
      { calc:"5 492 \u2212 1 620,712",values:["4 000","400","7 000"],   ans:"1" }
    ],
    hint:"Arrondis chaque nombre \u00e0 l\u2019entier le plus simple, puis fais le calcul approch\u00e9 de t\u00eate."
  },
  {
    type:"ops", theme:"Additions",
    eq:"Calcule chaque addition",
    method:"<strong>M\u00e9thode\u00a0:</strong> pose l\u2019op\u00e9ration en alignant les virgules. Un ordre de grandeur permet de v\u00e9rifier le r\u00e9sultat.",
    items:[
      { lbl:"a)", calc:"47,5 + 31,29", ans:"78,79" },
      { lbl:"b)", calc:"106,1 + 79,4", ans:"185,5" },
      { lbl:"c)", calc:"1491 + 64,9",  ans:"1555,9" }
    ],
    hint:"Aligne bien les virgules et ajoute un z\u00e9ro pour avoir le m\u00eame nombre de d\u00e9cimales avant de calculer."
  },
  {
    type:"durations", theme:"Dur\u00e9es",
    eq:"Calcule chaque dur\u00e9e (heures et minutes)",
    method:"<strong>M\u00e9thode\u00a0:</strong> on ajoute (ou soustrait) s\u00e9par\u00e9ment les heures et les minutes. Si les minutes d\u00e9passent 60, on convertit\u00a0: 60 min = 1 h.",
    items:[
      { lbl:"a)", h1:3, m1:16, op:"+", h2:2, m2:29, ansH:5, ansM:45 },
      { lbl:"b)", h1:1, m1:24, op:"+", h2:4, m2:57, ansH:6, ansM:21 },
      { lbl:"c)", h1:5, m1:12, op:"\u2212", h2:3, m2:8, ansH:2, ansM:4 }
    ],
    hint:"Additionne d\u2019abord les minutes entre elles. Si tu d\u00e9passes 60, transforme 60 minutes en 1 heure."
  },
  {
    type:"ops", theme:"S\u2019entra\u00eener",
    eq:"Pose et effectue chaque op\u00e9ration",
    method:"<strong>M\u00e9thode\u00a0:</strong> aligne toujours les virgules. Pense \u00e0 compl\u00e9ter avec des z\u00e9ros (96 = 96,00 ; 49 = 49,0).",
    items:[
      { lbl:"a)", calc:"12,4 + 4,8",         ans:"17,2" },
      { lbl:"b)", calc:"145,89 + 23,2",      ans:"169,09" },
      { lbl:"c)", calc:"96 + 65,43",         ans:"161,43" },
      { lbl:"d)", calc:"135,8 \u2212 49",     ans:"86,8" },
      { lbl:"e)", calc:"49,6 \u2212 6,2",     ans:"43,4" },
      { lbl:"f)", calc:"754,829 \u2212 26,478",ans:"728,351" }
    ],
    hint:"Aligne les virgules et complete avec des z\u00e9ros pour avoir le m\u00eame nombre de d\u00e9cimales."
  }
];

var TOTAL = EXERCISES.length;
// items par exercice : colonnes=rows, ops=items, durations=items (1 pt par durée complète)
function itemsOf(ex){ return ex.type==="columns" ? ex.rows.length : ex.items.length; }
var TOTAL_PTS = EXERCISES.reduce(function(s,ex){ return s+itemsOf(ex); }, 0); // 4+3+3+6 = 16

var current = 0;
var userAnswers = new Array(TOTAL).fill(null); // {okCount, total, data}
var hintOpen = false;
var draftCols = [], draftOps = [], draftDur = [];
var solutionShown = false;

function render(){
  solutionShown = false;
  var ex = EXERCISES[current];
  $("q-num").textContent = "Exercice " + (current+1);
  $("q-theme").textContent = ex.theme;
  $("q-eq").innerHTML = ex.eq;
  $("method-box").innerHTML = ex.method;
  $("hint-box").innerHTML = ""; $("hint-box").classList.remove("show"); hintOpen = false;
  $("feedback").className = "feedback";

  var done = userAnswers[current] !== null;
  var zone = $("answer-zone"); zone.innerHTML = "";

  if(ex.type === "columns")        buildColumns(zone, ex, done);
  else if(ex.type === "ops")       buildOps(zone, ex, done);
  else if(ex.type === "durations") buildDurations(zone, ex, done);

  $("btn-check").style.display = done ? "none" : "inline-flex";
  $("btn-check").disabled = done;
  $("btn-hint").disabled = done;
  $("btn-solution").style.display = done ? "inline-flex" : "none";
  $("btn-solution").disabled = false;
  $("btn-next").disabled = !done;
  $("btn-prev").disabled = current === 0;
  $("btn-next").textContent = (current === TOTAL-1) ? "Terminer \u2192" : "Suivant \u2192";

  if(done) showFeedback();
  updateProgress();
}

function buildColumns(zone, ex, done){
  if(draftCols.length !== ex.rows.length) draftCols = new Array(ex.rows.length).fill(null);
  var saved = done ? userAnswers[current].data : null;
  ex.rows.forEach(function(row, i){
    var line = document.createElement("div"); line.className = "col-row";
    var calc = document.createElement("span"); calc.className = "col-calc"; calc.textContent = row.calc; line.appendChild(calc);
    var btns = document.createElement("div"); btns.className = "col-btns";
    ex.cols.forEach(function(c, ci){
      var b = document.createElement("button"); b.className = "col-btn";
      var num = document.createElement("span"); num.textContent = c;
      var sub = document.createElement("small"); sub.textContent = row.values[ci];
      b.appendChild(num); b.appendChild(sub);
      if(done){
        b.classList.add("locked");
        var chosen = saved[i];
        var answered = (chosen !== null && chosen !== undefined);
        if(answered && c === chosen){
          b.classList.add(c === row.ans ? "correct-opt" : "wrong-opt");
        }
        // En mode Solution seulement : on révèle la bonne colonne en vert
        if(solutionShown && c === row.ans){ b.classList.add("correct-opt"); }
        // Sinon, une réponse fausse n'affiche PAS la bonne colonne (l'élève ne la connaît pas)
      } else {
        if(draftCols[i] === c) b.classList.add("selected");
        b.onclick = (function(idx, val){ return function(){
          draftCols[idx] = val;
          btns.querySelectorAll(".col-btn").forEach(function(s){ s.classList.remove("selected"); });
          this.classList.add("selected");
        };})(i, c);
      }
      btns.appendChild(b);
    });
    line.appendChild(btns); zone.appendChild(line);
  });
}

function buildOps(zone, ex, done){
  if(draftOps.length !== ex.items.length) draftOps = new Array(ex.items.length).fill("");
  var saved = done ? userAnswers[current].data : null;
  ex.items.forEach(function(it, i){
    var row = document.createElement("div"); row.className = "op-row";
    var lbl = document.createElement("span"); lbl.className = "op-lbl"; lbl.textContent = it.lbl; row.appendChild(lbl);
    var calc = document.createElement("span"); calc.className = "op-calc"; calc.textContent = it.calc; row.appendChild(calc);
    var eq = document.createElement("span"); eq.className = "op-eq"; eq.textContent = "="; row.appendChild(eq);
    var inp = document.createElement("input"); inp.type = "text"; inp.className = "answer-input"; inp.placeholder = "?"; inp.autocomplete = "off"; inp.id = "op" + i;
    if(done){
      inp.value = saved[i].val; inp.disabled = true;
      inp.className = "answer-input " + (saved[i].ok ? "correct-input" : "wrong-input");
    } else {
      inp.value = draftOps[i];
      inp.oninput = (function(idx){ return function(){ draftOps[idx] = this.value; }; })(i);
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter" && !$("btn-check").disabled) checkAnswer(); });
    }
    row.appendChild(inp); zone.appendChild(row);
  });
}

function buildDurations(zone, ex, done){
  if(draftDur.length !== ex.items.length) draftDur = ex.items.map(function(){ return { h:"", m:"" }; });
  var saved = done ? userAnswers[current].data : null;
  ex.items.forEach(function(it, i){
    var row = document.createElement("div"); row.className = "dur-row";
    var lbl = document.createElement("span"); lbl.className = "op-lbl"; lbl.textContent = it.lbl; row.appendChild(lbl);
    var calc = document.createElement("span"); calc.className = "dur-calc";
    calc.textContent = it.h1 + " h " + pad(it.m1) + " min  " + it.op + "  " + it.h2 + " h " + pad(it.m2) + " min  =";
    row.appendChild(calc);
    var inpH = document.createElement("input"); inpH.type = "text"; inpH.className = "answer-input input-small"; inpH.placeholder = "?"; inpH.autocomplete = "off"; inpH.id = "dh" + i;
    var uH = document.createElement("span"); uH.className = "dur-unit"; uH.textContent = "h";
    var inpM = document.createElement("input"); inpM.type = "text"; inpM.className = "answer-input input-small"; inpM.placeholder = "?"; inpM.autocomplete = "off"; inpM.id = "dm" + i;
    var uM = document.createElement("span"); uM.className = "dur-unit"; uM.textContent = "min";
    if(done){
      inpH.value = saved[i].h; inpH.disabled = true; inpH.className = "answer-input input-small " + (saved[i].okH ? "correct-input" : "wrong-input");
      inpM.value = saved[i].m; inpM.disabled = true; inpM.className = "answer-input input-small " + (saved[i].okM ? "correct-input" : "wrong-input");
    } else {
      inpH.value = draftDur[i].h; inpM.value = draftDur[i].m;
      inpH.oninput = (function(idx){ return function(){ draftDur[idx].h = this.value; }; })(i);
      inpM.oninput = (function(idx){ return function(){ draftDur[idx].m = this.value; }; })(i);
      var onEnter = function(e){ if(e.key === "Enter" && !$("btn-check").disabled) checkAnswer(); };
      inpH.addEventListener("keydown", onEnter); inpM.addEventListener("keydown", onEnter);
    }
    row.appendChild(inpH); row.appendChild(uH); row.appendChild(inpM); row.appendChild(uM);
    zone.appendChild(row);
  });
}

/* ---------- garde-fous : au moins une saisie ---------- */
function hasInputColumns(ex){ return draftCols.some(function(c){ return c; }); }
function hasInputOps(ex){ return draftOps.some(function(v){ return (v||"").trim().length>0; }); }
function hasInputDur(ex){ return draftDur.some(function(d){ return (d.h||"").trim().length>0 || (d.m||"").trim().length>0; }); }

function emptyWarning(){
  var fb=$("feedback");
  fb.className="feedback show ko";
  $("fb-icon").textContent="\u270b";
  $("fb-msg").innerHTML="<strong>R\u00e9ponds d\u2019abord\u00a0!</strong>";
  $("fb-detail").textContent="\u00c9cris ou s\u00e9lectionne au moins une r\u00e9ponse avant de v\u00e9rifier.";
}

/* ---------- VALIDATION (par item) ---------- */
function checkAnswer(){
  if(userAnswers[current] !== null) return;
  var ex = EXERCISES[current];
  if(ex.type === "columns")   return checkColumns(ex);
  if(ex.type === "ops")       return checkOps(ex);
  if(ex.type === "durations") return checkDurations(ex);
}

function checkColumns(ex){
  if(!hasInputColumns(ex)){ emptyWarning(); return; }
  var data = draftCols.slice();
  var okCount = ex.rows.reduce(function(n,r,i){ return n + (data[i]===r.ans ? 1 : 0); }, 0);
  userAnswers[current] = { okCount:okCount, total:ex.rows.length, data:data };
  render();
}

function checkOps(ex){
  if(!hasInputOps(ex)){ emptyWarning(); return; }
  var data = ex.items.map(function(it,i){
    var raw = (draftOps[i] || "").trim();
    var ok = raw!=="" && !isNaN(toNum(raw)) && sameNum(raw, it.ans);
    return { val: raw, ok: ok };
  });
  var okCount = data.reduce(function(n,d){ return n + (d.ok?1:0); }, 0);
  userAnswers[current] = { okCount:okCount, total:ex.items.length, data:data };
  render();
}

function checkDurations(ex){
  if(!hasInputDur(ex)){ emptyWarning(); return; }
  var data = ex.items.map(function(it,i){
    var h = (draftDur[i].h || "").trim(), m = (draftDur[i].m || "").trim();
    var okH = h!=="" && parseInt(h,10) === it.ansH;
    var okM = m!=="" && parseInt(m,10) === it.ansM;
    return { h:h, m:m, okH:okH, okM:okM, ok:(okH && okM) };
  });
  var okCount = data.reduce(function(n,d){ return n + (d.ok?1:0); }, 0);
  userAnswers[current] = { okCount:okCount, total:ex.items.length, data:data };
  render();
}

/* ---------- FEEDBACK (4 niveaux + pourquoi) ---------- */
function showFeedback(){
  var ex = EXERCISES[current];
  var a = userAnswers[current];
  var ratio = a.okCount / a.total;
  var fb = $("feedback");
  var cls = ratio>=1 ? "ok" : (a.okCount===0 ? "ko" : "partial");
  fb.className = "feedback show " + cls;
  $("fb-icon").textContent = ratio>=1 ? "\u2705" : (a.okCount===0 ? "\u274c" : "\u26a0");
  var msg;
  if(ratio>=1) msg="Parfait\u00a0! Tout est correct.";
  else if(ratio>=0.5) msg="Bien, mais quelques erreurs.";
  else if(a.okCount>0) msg="\u00c0 retravailler.";
  else msg="Rien de correct cette fois.";
  $("fb-msg").innerHTML = "<strong>"+a.okCount+" / "+a.total+"</strong> \u2014 "+msg;
  $("fb-detail").innerHTML = ratio>=1 ? "" : buildCorrection(ex, a);
}

function buildCorrection(ex, a){
  var L=[];
  if(ex.type === "columns"){
    ex.rows.forEach(function(r,i){
      if(a.data[i] !== r.ans){
        if(!a.data[i]) L.push(r.calc+"\u00a0: tu n\u2019as pas r\u00e9pondu.");
        else L.push(r.calc+"\u00a0: ce n\u2019est pas la bonne colonne (arrondis chaque nombre, puis calcule de t\u00eate).");
      }
    });
  } else if(ex.type === "ops"){
    ex.items.forEach(function(it,i){
      var d=a.data[i];
      if(!d.ok){
        if(d.val==="") L.push(it.lbl+" tu n\u2019as pas r\u00e9pondu.");
        else L.push(it.lbl+" "+it.calc+"\u00a0: r\u00e9sultat incorrect (aligne bien les virgules et recommence).");
      }
    });
  } else if(ex.type === "durations"){
    ex.items.forEach(function(it,i){
      var d=a.data[i];
      if(!d.ok){
        if(d.h==="" && d.m==="") L.push(it.lbl+" tu n\u2019as pas r\u00e9pondu.");
        else L.push(it.lbl+" dur\u00e9e incorrecte (calcule les minutes, convertis si \u2265 60).");
      }
    });
  }
  if(L.length===0) return "";
  return "\u00c0 revoir\u00a0:<br>"+L.join("<br>") + "<br><span style='color:var(--muted)'>Clique sur \u00ab Solution \u00bb pour voir les bonnes r\u00e9ponses.</span>";
}

/* ---------- SOLUTION ---------- */
function showSolution(){
  if(userAnswers[current] === null) return;
  var ex = EXERCISES[current];
  var zone = $("answer-zone");
  if(ex.type === "columns"){
    var rows = zone.querySelectorAll(".col-row");
    ex.rows.forEach(function(r,i){
      var btns = rows[i].querySelectorAll(".col-btn");
      btns.forEach(function(b){
        b.classList.remove("selected","wrong-opt","correct-opt");
        if(b.querySelector("span") && b.querySelector("span").textContent === r.ans) b.classList.add("correct-opt");
      });
    });
  } else if(ex.type === "ops"){
    ex.items.forEach(function(it,i){ var el=$("op"+i); if(el){ el.value=it.ans; el.className="answer-input correct-input"; } });
  } else if(ex.type === "durations"){
    ex.items.forEach(function(it,i){
      var h=$("dh"+i), m=$("dm"+i);
      if(h){ h.value=it.ansH; h.className="answer-input input-small correct-input"; }
      if(m){ m.value=pad(it.ansM); m.className="answer-input input-small correct-input"; }
    });
  }
  $("feedback").className="feedback show ok";
  $("fb-icon").textContent="\u2705";
  $("fb-msg").innerHTML="<strong>Solution affich\u00e9e.</strong>";
  $("fb-detail").textContent="Les bonnes r\u00e9ponses de cet exercice sont affich\u00e9es.";
  $("btn-solution").disabled=true;
}

function toggleHint(){
  if(userAnswers[current] !== null) return;
  hintOpen = !hintOpen;
  var h = $("hint-box");
  if(hintOpen){ h.innerHTML = "<strong>? Indice\u00a0:</strong> " + EXERCISES[current].hint; h.classList.add("show"); }
  else h.classList.remove("show");
}

function updateProgress(){
  var okPts=0, total=0;
  userAnswers.forEach(function(a){ if(a!==null){ okPts+=a.okCount; total+=a.total; } });
  var answeredItems = total;
  $("progress-bar").style.width = Math.round(answeredItems/TOTAL_PTS*100) + "%";
  $("prog-label").textContent = "Exercice " + (current+1) + " / " + TOTAL;
  $("prog-pct").textContent = Math.round(answeredItems/TOTAL_PTS*100) + "\u00a0%";
  $("count-ok").textContent = okPts;
  $("count-ko").textContent = answeredItems - okPts;
  $("count-rem").textContent = TOTAL_PTS - answeredItems;
}

function nextQ(){
  if(current < TOTAL-1){ current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}
function prevQ(){ if(current > 0){ current--; render(); window.scrollTo({top:0,behavior:"smooth"}); } }

function totalScore(){ return userAnswers.reduce(function(s,a){ return s + (a?a.okCount:0); }, 0); }

function showResults(){
  $("ex-card").style.display = "none";
  $("results-screen").classList.add("show");
  var ok = totalScore();
  $("score-num").textContent = ok;
  var ratio = ok / TOTAL_PTS;
  var stars = ratio>=1?5 : ratio>=0.8?4 : ratio>=0.6?3 : ratio>=0.4?2 : 1;
  $("stars-row").textContent = "\u2b50".repeat(stars) + "\u2606".repeat(5-stars);
  var msg;
  if(ratio>=1) msg="Parfait\u00a0! Les 16 items sont justes.";
  else if(ratio>=0.8) msg="Tr\u00e8s bien\u00a0! Tu ma\u00eetrises le calcul et les ordres de grandeur.";
  else if(ratio>=0.5) msg="Bien. Quelques items sont \u00e0 revoir.";
  else msg="\u00c0 retravailler. Relis la m\u00e9thode, puis recommence.";
  $("results-msg").textContent = msg;
  var list = $("recap-list"); list.innerHTML = "";
  var titles = ["1. Ordres de grandeur","2. Additions","3. Dur\u00e9es (h/min)","4. Poser et effectuer"];
  EXERCISES.forEach(function(ex, i){
    var a = userAnswers[i];
    var sc = a ? a.okCount : 0, tot = itemsOf(ex);
    var full = a && a.okCount===a.total;
    var div = document.createElement("div");
    div.className = "recap-item " + (full ? "ok-item" : "ko-item");
    div.innerHTML = "<span>" + (full ? "\u2705" : "\u274c") + "</span><span class='eq'></span><span>"+sc+" / "+tot+"</span>";
    div.querySelector(".eq").textContent = titles[i];
    list.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  userAnswers = new Array(TOTAL).fill(null);
  draftCols = []; draftOps = []; draftDur = []; current = 0;
  $("ex-card").style.display = "block";
  $("results-screen").classList.remove("show");
  $("count-ok").textContent="0"; $("count-ko").textContent="0"; $("count-rem").textContent=TOTAL_PTS;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", function(){
  $("count-rem").textContent = TOTAL_PTS;
  render();
});
</script>
</body>
</html>
