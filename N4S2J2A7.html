<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Nombres relatifs négatifs</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══════════════════════════════════════════════════
       ★ SEULE ZONE À MODIFIER : COULEUR DU JOUR
       ═══════════════════════════════════════════════════
       Lundi    → #f5a623 / #c47a10 / #fff5e0 / #f5d080 / rgba(245,166,35,.3)
       Mardi    → #f28b82 / #c0392b / #fff0ef / #f9c0bb / rgba(242,139,130,.3)
       Mercredi → #8dc63f / #3d7a10 / #f0faeb / #b5e08a / rgba(141,198,63,.3)
       Jeudi    → #3ab5d8 / #1a6e88 / #e8f6fb / #9dd4e8 / rgba(58,181,216,.3)
       Vendredi → #f5c518 / #8a6000 / #fffbeb / #f5e08a / rgba(245,197,24,.3)
    ═══════════════════════════════════════════════════ */
    :root {
      --day-color:  #b94040;              /* couleur principale */
      --day-dark:   #7a1f1f;              /* texte sur fond clair */
      --day-light:  #f7eded;              /* fond des blocs */
      --day-border: #e3b3b3;              /* bordures */
      --day-glow:   rgba(185,64,64,.3);  /* ombre boutons */
    }

    /* ═══════════════════════════════════════════════════
       CHARTE PAZAPA — NE PAS TOUCHER
    ═══════════════════════════════════════════════════ */
    :root {
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg); color:var(--text);
      font-family:Arial,sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; padding:2rem 1rem 4rem;
      position:relative; overflow-x:hidden;
      letter-spacing:.02em; word-spacing:.06em;
    }

    /* Fond décoratif — identique tous les jours */
    body::before{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:340px; height:340px;
      background:var(--yellow); top:-80px; right:-80px;
      pointer-events:none;
    }
    body::after{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:260px; height:260px;
      background:var(--blue); bottom:-60px; left:-60px;
      pointer-events:none;
    }
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:180px;height:180px;background:var(--blue);
      bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:120px;height:120px;background:var(--yellow);
      top:200px;left:-30px;pointer-events:none;}

    /* Header */
    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{
      display:inline-flex;align-items:center;gap:.5rem;
      background:var(--yellow);color:#000;
      font-size:.78rem;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;padding:.3rem .9rem;
      border-radius:99px;margin-bottom:.5rem;
    }
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;color:var(--muted);margin-bottom:.5rem;
    }
    h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
    h1 .hl{color:var(--day-color);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;
      font-family:'JetBrains Mono',monospace;}

    /* Progression */
    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;
      position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;
      font-size:.78rem;color:var(--muted);
      font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;
      height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;
      background:linear-gradient(90deg,var(--day-color),var(--yellow));
      border-radius:99px;transition:width .5s ease;}

    /* Chips */
    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;
      flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;
      border-radius:99px;font-size:.8rem;
      font-family:'JetBrains Mono',monospace;
      border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong   .dot{background:var(--pink);}
    .chip.remaining .dot{background:var(--muted);}

    /* Card */
    .card{width:100%;max-width:680px;background:var(--surface);
      border:2px solid var(--border);border-radius:var(--radius);
      padding:2rem 2rem 1.6rem;position:relative;z-index:1;
      box-shadow:0 4px 20px rgba(0,0,0,.06);
      animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}

    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;
      color:var(--muted);margin-bottom:.5rem;
      text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;
      padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;
      letter-spacing:.08em;margin-bottom:.7rem;
      background:var(--day-light);color:var(--day-dark);
      border:1.5px solid var(--day-border);}

    /* Équation */
    .eq-box{background:var(--day-light);border:2px solid var(--day-border);
      border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;
      font-family:'JetBrains Mono',monospace;
      font-size:clamp(.9rem,2vw,1.1rem);
      font-weight:700;color:var(--day-dark);text-align:center;}

    .q-text{font-size:.9rem;color:var(--muted);
      margin-bottom:.8rem;line-height:1.8;}

    /* Méthode */
    .method-box{display:none;background:var(--day-light);
      border:1.5px solid var(--day-border);
      border-left:4px solid var(--day-color);
      border-radius:8px;padding:.75rem 1rem;margin-bottom:1.2rem;
      font-size:.84rem;font-family:'JetBrains Mono',monospace;
      color:var(--day-dark);line-height:1.8;}
    .method-box strong{color:var(--day-color);}
    .method-box.reveal{display:block;}

    /* Input */
    .input-row{display:flex;align-items:center;gap:.7rem;
      flex-wrap:wrap;position:relative;z-index:2;margin-bottom:.8rem;}
    .input-label{font-family:'JetBrains Mono',monospace;
      font-size:1rem;font-weight:700;}
    .answer-input{width:230px;background:var(--bg);
      border:2px solid var(--border);border-radius:10px;
      color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:1.05rem;padding:.5rem .85rem;outline:none;
      transition:border-color .2s;position:relative;z-index:2;height:2.6rem;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input  {border-color:var(--pink); background:#fff0ef;}

    /* Boutons */
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;
      position:relative;z-index:2;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;
      padding:.6rem 1.3rem;border-radius:10px;
      font-family:Arial,sans-serif;font-size:.92rem;
      font-weight:700;cursor:pointer;border:none;
      transition:transform .12s,box-shadow .15s;
      position:relative;z-index:2;min-height:2.6rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;
      box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);
      box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);
      border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

    /* Indice */
    .hint-box{margin-top:.9rem;background:#fffbeb;
      border:1.5px dashed var(--yellow);border-radius:10px;
      padding:.75rem 1rem;font-size:.85rem;color:#7a6010;
      display:none;line-height:1.8;
      font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}

    /* Feedback */
    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;
      font-size:.9rem;display:none;align-items:flex-start;
      gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink); color:#c0392b;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:.82rem;margin-top:.3rem;line-height:1.8;}

    /* Nav */
    .nav-row{display:flex;justify-content:space-between;
      margin-top:1.4rem;gap:.7rem;position:relative;z-index:2;}

    /* Résultats */
    .results{width:100%;max-width:680px;text-align:center;
      display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:2.5rem 2rem;
      box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;
      line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;
      gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;
      padding:.65rem 1rem;background:var(--bg);
      border:1.5px solid var(--border);border-radius:10px;
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;line-height:1.6;}
    .recap-item .eq{color:var(--day-color);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}
    .recap-item.ko-item{border-color:#f9c0bb;}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px);}
      to  {opacity:1;transform:translateY(0);}
    }
    .card,.results{animation:fadeUp .4s ease both;}
    @media(max-width:480px){
      .card{padding:1.4rem;}
      .btn{font-size:.85rem;padding:.55rem 1rem;}
    }
    .place-consigne{font-size:1rem;color:var(--text);font-weight:600;line-height:1.7;margin-bottom:.4rem;}
    .place-line{background:var(--bg);border:2px solid var(--day-border);border-radius:12px;padding:.6rem .4rem;margin:.6rem 0;}
    .place-readout{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--day-dark);min-height:1.4rem;text-align:center;font-size:.95rem;}
    .level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;padding:.6rem 1.15rem;border-radius:12px;border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);min-height:2.9rem;display:inline-flex;align-items:center;}
    .level-btn.active{background:var(--day-color);color:#fff;border-color:var(--day-color);box-shadow:0 3px 10px var(--day-glow);}
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 4&egrave;me
    </div>
    <!-- ★ MODIFIER : Semaine et Jour -->
    <div class="week-label">Semaine 2 &ndash; Jour 2</div>
    <!-- ★ MODIFIER : Titre de l'activité -->
    <h1><span class="hl">✏️ Placer un point sur une droite graduée</span></h1>
    <!-- ★ MODIFIER : sous-titre -->
    <p class="subtitle">Série d'exercices</p>
    <div class="level-row"><span class="level-btn">Niveau 1</span><span class="level-btn">Niveau 2</span><span class="level-btn active">Niveau 3</span></div>
  </header>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">Question 1 / 7</span>
      <span id="prog-pct">0&nbsp;%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div class="score-row">
    <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
    <div class="chip wrong"  ><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
    <div class="chip remaining"><div class="dot"></div><span id="count-rem">7</span> restantes</div>
  </div>

  <div class="card" id="ex-card">
    <div class="card-stripe"></div>
    <div class="q-num" id="q-num">Exercice 1</div>
    <!-- ★ MODIFIER : badge thème -->
    <div class="theme-badge" id="q-theme">Ranger</div>
    <div class="eq-box" id="q-eq"></div>
    <div class="q-text" id="q-text"></div>

    <div class="place-area" id="place-area" style="display:none;">
      <div class="place-consigne" id="place-consigne"></div>
      <div class="place-line" id="place-line"></div>
      <div class="place-readout" id="place-readout"></div>
      <div class="btn-row" style="margin-top:.8rem;">
        <button class="btn btn-primary" id="place-check" onclick="checkPlace()">&#10003; Valider</button>
        <button class="btn btn-ghost" id="place-clear" onclick="clearPlace()">&#8635; Effacer</button>
        <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
      </div>
    </div>

    <div class="method-box" id="method-box"></div>

    <div class="input-row" id="input-row">
      <span class="input-label" id="input-label">x =</span>
      <input type="text" class="answer-input" id="answer-input"
             autocomplete="off" autocapitalize="off" spellcheck="false"/>
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">
        &#10003; Valider
      </button>
      <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    </div>

    <div class="hint-box" id="hint-box"></div>

    <div class="feedback" id="feedback">
      <span class="feedback-icon" id="fb-icon"></span>
      <div>
        <div id="fb-msg"></div>
        <div class="feedback-detail" id="fb-detail"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">
        &larr; Pr&eacute;c&eacute;dent
      </button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>
        Suivant &rarr;
      </button>
    </div>
  </div>

  <div class="results" id="results-screen">
    <div class="results-card">
      <div class="logo-badge" style="margin-bottom:.5rem">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#3ab5d8"></span>
        R&eacute;sultats
      </div>
      <div class="results-score">
        <span class="s-num" id="score-num">0</span>/<span id="score-total">7</span>
      </div>
      <div class="stars" id="stars-row"></div>
      <div class="results-msg" id="results-msg"></div>
      <div class="recap-list" id="recap-list"></div>
      <button class="btn btn-primary" onclick="restart()"
              style="margin:0 auto;display:flex;">
        &#128260; Recommencer
      </button>
    </div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════
   ★★★ ZONE À REMPLIR : LES EXERCICES ★★★

   Chaque exercice est un objet avec :
   - eq      : l'équation affichée (HTML autorisé)
   - label   : étiquette devant le champ réponse ("x =" ou "Résultat =")
   - ans     : la réponse correcte (nombre)
   - theme   : texte du badge ("Équation", "Inéquation", "Problème"…)
   - method  : explication pas à pas (HTML autorisé, utiliser \u2192 pour →)
   - hint    : indice court

   ⚠️ Règles JS importantes :
   - Jamais d'apostrophe ' dans une string → utiliser \u2019
   - Utiliser \u00d7 pour × et \u2212 pour −
   - Tester la syntaxe avant de livrer
═══════════════════════════════════════════════════════ */

var EXERCISES = [
  { type:"input", theme:"Deviner un nombre",
    eq:"Je suis un nombre positif dont la distance \u00e0 z\u00e9ro est comprise entre 3 et 4. Le produit de mes trois chiffres vaut 6. Mon chiffre des centi\u00e8mes est inf\u00e9rieur \u00e0 mon chiffre des dixi\u00e8mes. Qui suis-je\u00a0?",
    label:"R\u00e9ponse =", answers:["3.21","3,21"], show:"3,21",
    method:"Entre 3 et 4 \u2192 3,?? ; 3 \u00d7 d \u00d7 c = 6 \u2192 d \u00d7 c = 2 ; centi\u00e8mes < dixi\u00e8mes \u2192 3,21.",
    hint:"Le nombre commence par 3, puis cherche deux chiffres dont le produit avec 3 donne 6." },
  { type:"place", theme:"Placer un point",
    consigne:"Place le point <strong>A</strong> d\u2019abscisse <strong>\u22124,2</strong> sur la droite gradu\u00e9e.",
    line:{labelMin:-6,labelMax:0,step:1,sub:0.1,drawMin:-6.3,drawMax:0.4}, nom:"A", target:-4.2, snap:0.1,
    show:"\u22124,2", method:"\u22124,2 est entre \u22125 et \u22124, \u00e0 2 sous-graduations apr\u00e8s \u22125.",
    hint:"Compte les petites graduations apr\u00e8s \u22125 ; chacune vaut 0,1." },
  { type:"place", theme:"Placer un point",
    consigne:"Place le point <strong>B</strong> d\u2019abscisse <strong>\u22121,7</strong> sur la droite gradu\u00e9e.",
    line:{labelMin:-6,labelMax:0,step:1,sub:0.1,drawMin:-6.3,drawMax:0.4}, nom:"B", target:-1.7, snap:0.1,
    show:"\u22121,7", method:"\u22121,7 est entre \u22122 et \u22121, \u00e0 3 sous-graduations apr\u00e8s \u22122.",
    hint:"\u22121,7 se trouve entre \u22122 et \u22121." },
  { type:"place", theme:"Placer un point",
    consigne:"Place le point <strong>C</strong> d\u2019abscisse <strong>\u22120,9</strong> sur la droite gradu\u00e9e.",
    line:{labelMin:-6,labelMax:0,step:1,sub:0.1,drawMin:-6.3,drawMax:0.4}, nom:"C", target:-0.9, snap:0.1,
    show:"\u22120,9", method:"\u22120,9 est juste avant 0, \u00e0 une sous-graduation de 0.",
    hint:"\u22120,9 est tout proche de 0, du c\u00f4t\u00e9 n\u00e9gatif." },
  { type:"place", theme:"Placer un point",
    consigne:"Place le point <strong>D</strong> d\u2019abscisse <strong>\u22122,6</strong> sur la droite gradu\u00e9e.",
    line:{labelMin:-3,labelMax:3,step:1,sub:0.1,drawMin:-3.3,drawMax:3.4}, nom:"D", target:-2.6, snap:0.1,
    show:"\u22122,6", method:"\u22122,6 est entre \u22123 et \u22122, \u00e0 4 sous-graduations apr\u00e8s \u22123.",
    hint:"\u22122,6 se trouve entre \u22123 et \u22122." },
  { type:"place", theme:"Placer un point",
    consigne:"Place le point <strong>E</strong> d\u2019abscisse <strong>0,2</strong> sur la droite gradu\u00e9e.",
    line:{labelMin:-3,labelMax:3,step:1,sub:0.1,drawMin:-3.3,drawMax:3.4}, nom:"E", target:0.2, snap:0.1,
    show:"0,2", method:"0,2 est juste apr\u00e8s 0, \u00e0 2 sous-graduations.",
    hint:"0,2 est tout proche de 0, du c\u00f4t\u00e9 positif." },
  { type:"place", theme:"Placer un point",
    consigne:"Place le point <strong>F</strong> d\u2019abscisse <strong>2,2</strong> sur la droite gradu\u00e9e.",
    line:{labelMin:-3,labelMax:3,step:1,sub:0.1,drawMin:-3.3,drawMax:3.4}, nom:"F", target:2.2, snap:0.1,
    show:"2,2", method:"2,2 est entre 2 et 3, \u00e0 2 sous-graduations apr\u00e8s 2.",
    hint:"2,2 se trouve juste apr\u00e8s 2." }
];

/* ═══════════════════════════════════════════════════════
   MOTEUR — NE PAS MODIFIER
═══════════════════════════════════════════════════════ */
/* --- droite graduée cliquable (placement) --- */
var PW=620, Px0=40, Py=70;
function pxFor(t,dmin,dmax){ return Px0 + (t-dmin)/(dmax-dmin)*(PW-2*Px0); }
function tFor(px,dmin,dmax){ return dmin + (px-Px0)/(PW-2*Px0)*(dmax-dmin); }
function numTxt(v){ var s=(""+Math.abs(v)).replace(".",","); return (v<0?"\u2212":"")+s; }
function snap(t,sub){ return Math.round(t/sub)*sub; }
function buildLine(cfg, placed){
  var dmin=cfg.drawMin, dmax=cfg.drawMax, xL=Px0-14, xR=PW-Px0+14;
  var s="<svg viewBox='0 0 "+PW+" 110' style='width:100%;height:auto;display:block;touch-action:none;cursor:pointer;' id='place-svg'>";
  s+="<line x1='"+xL+"' y1='"+Py+"' x2='"+xR+"' y2='"+Py+"' stroke='#444' stroke-width='2'/>";
  s+="<polygon points='"+xR+","+Py+" "+(xR-10)+","+(Py-5)+" "+(xR-10)+","+(Py+5)+"' fill='#444'/>";
  if(cfg.sub){
    var n=Math.round((dmax-cfg.labelMin)/cfg.sub);
    for(var i=0;i<=n;i++){ var t=cfg.labelMin+i*cfg.sub; if(t>dmax+1e-9)break;
      var xs=pxFor(t,dmin,dmax); if(xs>=xL&&xs<=xR) s+="<line x1='"+xs.toFixed(1)+"' y1='"+(Py-4)+"' x2='"+xs.toFixed(1)+"' y2='"+(Py+4)+"' stroke='#888' stroke-width='1'/>"; }
  }
  for(var k=cfg.labelMin;k<=cfg.labelMax+1e-9;k+=cfg.step){
    var x=pxFor(k,dmin,dmax);
    s+="<line x1='"+x.toFixed(1)+"' y1='"+(Py-8)+"' x2='"+x.toFixed(1)+"' y2='"+(Py+8)+"' stroke='#444' stroke-width='2'/>";
    s+="<text x='"+x.toFixed(1)+"' y='"+(Py+26)+"' font-size='13' text-anchor='middle' fill='#222' font-family='Arial'>"+numTxt(Math.round(k*1e6)/1e6)+"</text>";
  }
  if(placed && placed.t!==null && placed.t!==undefined){
    var px=pxFor(placed.t,dmin,dmax);
    s+="<line x1='"+(px-7).toFixed(1)+"' y1='"+(Py-7)+"' x2='"+(px+7).toFixed(1)+"' y2='"+(Py+7)+"' stroke='var(--day-color)' stroke-width='3'/>";
    s+="<line x1='"+(px+7).toFixed(1)+"' y1='"+(Py-7)+"' x2='"+(px-7).toFixed(1)+"' y2='"+(Py+7)+"' stroke='var(--day-color)' stroke-width='3'/>";
    s+="<text x='"+px.toFixed(1)+"' y='"+(Py-13)+"' font-size='15' font-weight='bold' font-style='italic' text-anchor='middle' fill='var(--day-dark)' font-family='Arial'>"+placed.nom+"</text>";
  }
  s+="</svg>"; return s;
}
var TOTAL = EXERCISES.length;
var current = 0;
var userAnswers = new Array(TOTAL).fill(null);
var hintOpen = false;
var $ = function(id){ return document.getElementById(id); };

function render(){
  var ex = EXERCISES[current];
  $("q-num").textContent = "Exercice " + (current+1);
  $("q-theme").textContent = ex.theme;
  $("method-box").innerHTML = ex.method;
  $("method-box").className = "method-box" + (userAnswers[current] !== null ? " reveal" : "");
  $("hint-box").innerHTML = "";
  $("hint-box").classList.remove("show");
  hintOpen = false;
  $("feedback").className = "feedback";

  if(ex.type === "place"){
    /* ----- exercice de PLACEMENT (clic) ----- */
    $("q-eq").innerHTML = "";
    $("q-eq").style.display = "none";
    $("input-row").style.display = "none";
    $("place-area").style.display = "block";
    $("place-consigne").innerHTML = ex.consigne;
    var ph = userAnswers[current]; /* {t:...} ou null */
    var placed = (ph !== null && ph !== undefined) ? { nom:ex.nom, t:ph.t } : null;
    $("place-line").innerHTML = buildLine(ex.line, placed);
    var svg = $("place-svg");
    if(svg){ svg.addEventListener("click", onPlaceClick); }
    if(ph !== null && ph !== undefined){
      $("place-readout").textContent = "Point " + ex.nom + " placé sur " + numTxt(ph.t);
      var correct = isCorrect(ph, ex);
      $("place-check").disabled = true;
      $("place-clear").disabled = true;
      $("btn-next").disabled = false;
      showFeedback(correct);
    } else {
      $("place-readout").textContent = "Clique sur la droite pour placer le point.";
      $("place-check").disabled = false;
      $("place-clear").disabled = false;
      $("btn-next").disabled = true;
    }
  } else {
    /* ----- exercice à SAISIE (input) ----- */
    $("place-area").style.display = "none";
    $("q-eq").style.display = "";
    $("input-row").style.display = "flex";
    $("q-eq").innerHTML = ex.eq;
    $("input-label").textContent = ex.label;
    var inp = $("answer-input");
    inp.className = "answer-input";
    inp.value = userAnswers[current] !== null ? userAnswers[current] : "";
    if(userAnswers[current] !== null){
      var ok = isCorrect(userAnswers[current], ex);
      inp.className = "answer-input " + (ok ? "correct-input" : "wrong-input");
      inp.disabled = true;
      $("btn-check").disabled = true;
      $("btn-next").disabled = false;
      showFeedback(ok);
    } else {
      inp.disabled = false;
      $("btn-check").disabled = false;
      $("btn-next").disabled = true;
      inp.focus();
    }
  }
  updateProgress();
  $("btn-prev").disabled = current === 0;
}

/* ── moteur de placement par clic ── */
var pendingT = null;
function onPlaceClick(evt){
  var ex = EXERCISES[current];
  if(userAnswers[current] !== null) return;
  var svg = $("place-svg");
  var r = svg.getBoundingClientRect();
  var px = (evt.clientX - r.left) / r.width * 620; /* viewBox width */
  var t = snap(tFor(px, ex.line.drawMin, ex.line.drawMax), ex.snap);
  if(t < ex.line.drawMin) t = ex.line.drawMin;
  if(t > ex.line.drawMax) t = ex.line.drawMax;
  pendingT = Math.round(t*1e6)/1e6;
  $("place-line").innerHTML = buildLine(ex.line, { nom:ex.nom, t:pendingT });
  var s2 = $("place-svg"); if(s2){ s2.addEventListener("click", onPlaceClick); }
  $("place-readout").textContent = "Point " + ex.nom + " placé sur " + numTxt(pendingT) + " (clique sur Valider)";
}
function clearPlace(){
  if(userAnswers[current] !== null) return;
  pendingT = null;
  var ex = EXERCISES[current];
  $("place-line").innerHTML = buildLine(ex.line, null);
  var s2 = $("place-svg"); if(s2){ s2.addEventListener("click", onPlaceClick); }
  $("place-readout").textContent = "Clique sur la droite pour placer le point.";
}
function checkPlace(){
  if(pendingT === null){ $("place-readout").textContent = "Place d’abord le point en cliquant sur la droite."; return; }
  userAnswers[current] = { t: pendingT };
  pendingT = null;
  render();
}

function showFeedback(correct){
  var ex = EXERCISES[current];
  var fb = $("feedback");
  fb.className = "feedback show " + (correct ? "ok" : "ko");
  $("fb-icon").textContent = correct ? "\u2705" : "\u274C";
  if(correct){
    $("fb-msg").textContent = "Bravo ! Bonne r\u00e9ponse.";
    $("fb-detail").innerHTML = ex.hint;
  } else {
    $("fb-msg").textContent = "Pas tout \u00e0 fait\u2026";
    $("fb-detail").innerHTML = "La bonne r\u00e9ponse \u00e9tait <strong>"
      + (ex.show||ex.ans) + "</strong>.<br>" + ex.hint;
  }
}

function norm(s){return String(s).toLowerCase().replace(/\s+/g,"").replace(/\u2212/g,"-").replace(/\u00b2/g,"^2").replace(/\u00b3/g,"^3").replace(/[\u00d7\u00b7*]/g,"");}
function isCorrect(v,ex){if(v===null||v===undefined)return false;if(ex.type==="place"){return v&&typeof v.t!=="undefined"&&Math.abs(v.t-ex.target)<1e-6;}if(ex.answers){var n=norm(v);return ex.answers.some(function(a){return norm(a)===n;});}return parseFloat(v)===ex.ans;}
function checkAnswer(){
  var raw = $("answer-input").value.trim();
  if(raw===""){ $("answer-input").focus(); return; }
  userAnswers[current] = raw;
  render();
}

function toggleHint(){
  hintOpen = !hintOpen;
  var h = $("hint-box");
  if(hintOpen){
    h.innerHTML = "<strong>? Indice :</strong> " + EXERCISES[current].hint;
    h.classList.add("show");
  } else {
    h.classList.remove("show");
  }
}

function updateProgress(){
  var answered = userAnswers.filter(function(a){ return a !== null; }).length;
  var ok = userAnswers.filter(function(a,i){ return a!==null && isCorrect(a, EXERCISES[i]); }).length;
  var ko = answered - ok;
  var pct = Math.round((answered / TOTAL) * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = "Question " + (current+1) + " / " + TOTAL;
  $("prog-pct").textContent = pct + "\u00a0%";
  $("count-ok").textContent = ok;
  $("count-ko").textContent = ko;
  $("count-rem").textContent = TOTAL - answered;
}

function nextQ(){
  if(current < TOTAL-1){ current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}
function prevQ(){ if(current > 0){ current--; render(); } }

function showResults(){
  $("ex-card").style.display = "none";
  $("results-screen").classList.add("show");
  var ok = userAnswers.filter(function(a,i){
    return a !== null && isCorrect(a, EXERCISES[i]);
  }).length;
  $("score-num").textContent = ok;
  $("score-total").textContent = TOTAL;
  var stars = ok >= TOTAL ? 5 : ok >= Math.ceil(TOTAL*.8) ? 4
    : ok >= Math.ceil(TOTAL*.6) ? 3 : ok >= Math.ceil(TOTAL*.4) ? 2 : 1;
  $("stars-row").textContent = "\u2B50".repeat(stars) + "\u2606".repeat(5-stars);
  var msg;
  if(ok===TOTAL) msg="Parfait\u00a0! Bravo\u00a0! \uD83C\uDF89";
  else if(ok>=Math.ceil(TOTAL*0.8)) msg="Tr\u00e8s bien\u00a0!";
  else if(ok>=Math.ceil(TOTAL*0.6)) msg="Bien jou\u00e9\u00a0!";
  else if(ok>=Math.ceil(TOTAL*0.4)) msg="Bon d\u00e9but\u00a0!";
  else msg="Continue \u00e0 t\u2019entra\u00eener\u00a0!";
  $("results-msg").textContent = msg;
  var list = $("recap-list"); list.innerHTML = "";
  EXERCISES.forEach(function(ex, i){
    var correct = isCorrect(userAnswers[i], ex);
    var libelle = (ex.type === "place") ? ("Point " + ex.nom) : "Deviner";
    var div = document.createElement("div");
    div.className = "recap-item " + (correct ? "ok-item" : "ko-item");
    div.innerHTML = "<span>" + (correct ? "\u2705" : "\u274C") + "</span>"
      + "<span class='eq'>" + libelle + "</span>"
      + "<span>" + (ex.show||ex.ans) + "</span>";
    list.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  userAnswers = new Array(TOTAL).fill(null);
  current = 0;
  $("ex-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", function(){
  $("answer-input").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !$("btn-check").disabled) checkAnswer();
  });
  /* ★ Mettre à jour le compteur "restantes" au démarrage */
  $("count-rem").textContent = TOTAL;
  render();
});
</script>
</body>
</html>
