<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa 4e – Puissances – S8 J5 Niveau 1</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--day-color:#f5c518;--day-dark:#8a6000;--day-light:#fffbeb;--day-border:#f5e08a;
      --day-glow:rgba(245,197,24,.3);--bg:#fffdf7;--surface:#fff;--border:#e8e4d9;
      --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;
      --text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
      position:relative;overflow-x:hidden;letter-spacing:.03em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:260px;height:260px;background:var(--orange);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;
      background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;
      background:var(--green);top:200px;left:-30px;pointer-events:none;}
    .head-card{width:100%;max-width:720px;background:var(--day-light);border:2px solid var(--day-border);
      border-radius:var(--radius);padding:1.9rem 1.5rem 1.4rem;text-align:center;
      position:relative;z-index:1;margin-bottom:1rem;}
    .logo-badge{background:var(--yellow);color:#000;font-size:14px;letter-spacing:.09em;
      display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;
      padding:.35rem 1.1rem;border-radius:99px;margin-bottom:.6rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{color:var(--day-dark);font-size:.88rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;color:var(--text);margin:.3rem 0;}
    .head-card h1 .hl{color:var(--day-dark);}
    .subtitle{color:var(--muted);font-size:.9rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}
    .level-row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;
      letter-spacing:.06em;text-transform:uppercase;padding:.65rem 1.35rem;border-radius:12px;
      border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);
      min-height:2.9rem;display:inline-flex;align-items:center;}
    .level-btn.active{background:var(--day-color);color:#000;border-color:var(--day-color);
      box-shadow:0 3px 12px var(--day-glow);}
    .stats-card{width:100%;max-width:720px;background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:1.1rem;margin-bottom:1.5rem;
      box-shadow:0 4px 20px rgba(0,0,0,.05);position:relative;z-index:1;}
    .stats-row{display:flex;gap:.8rem;}
    .stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);
      border-radius:12px;padding:.9rem .5rem;text-align:center;}
    .stat-num{font-size:1.7rem;font-weight:800;color:var(--day-dark);
      font-family:'JetBrains Mono',monospace;line-height:1.1;}
    .stat-label{font-size:.86rem;color:var(--muted);margin-top:.25rem;}
    .prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:1rem;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));
      border-radius:99px;transition:width .5s ease;}
    .prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;
      color:var(--muted);margin-top:.6rem;}
    .step-dot{width:28px;height:8px;border-radius:99px;background:var(--border);
      transition:background .3s;display:inline-block;margin:0 3px;}
    .step-dot.done{background:var(--green);}
    .cards-wrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:1.2rem;
      position:relative;z-index:1;}
    .card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
      padding:1.5rem 1.5rem 1.2rem;position:relative;
      box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .35s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:linear-gradient(90deg,var(--day-color),var(--orange),var(--green));}
    .q-label{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
      margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.1em;}
    .q-type{font-size:.78rem;color:var(--day-dark);font-weight:700;
      font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem;}
    .q-consigne{font-size:.93rem;color:var(--muted);margin-bottom:.6rem;line-height:1.6;}
    .q-expr{font-size:1.2rem;font-weight:700;text-align:center;margin:.7rem 0;
      line-height:1.8;color:var(--text);}
    sup{font-size:.65em;vertical-align:super;line-height:0;}
    .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;}
    .frac .fn{border-bottom:2px solid currentColor;padding:0 5px;display:block;text-align:center;}
    .frac .fd{padding:0 5px;display:block;text-align:center;}
    .aw{display:flex;align-items:center;gap:.6rem;margin:.5rem 0;flex-wrap:wrap;}
    .ai{border:2px solid var(--day-border);border-radius:10px;padding:.65rem 1rem;
      font-size:1rem;font-family:'JetBrains Mono',monospace;font-weight:700;
      outline:none;transition:border-color .2s;width:100%;max-width:300px;}
    .ai:focus{border-color:var(--day-color);}
    .ai.ok{border-color:var(--green);background:#eef7e9;color:#2f6e10;}
    .ai.ko{border-color:var(--pink);background:#fdeeee;color:#c0392b;}
    .dnd-zone{display:flex;flex-direction:column;gap:.6rem;margin:.6rem 0;}
    .dnd-label{font-size:.85rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}
    .chips{display:flex;gap:.5rem;flex-wrap:wrap;min-height:44px;padding:.4rem;
      border:2px dashed var(--day-border);border-radius:10px;background:var(--day-light);}
    .chip{padding:.35rem .85rem;border-radius:8px;background:var(--surface);color:var(--text);
      font-weight:700;font-size:.93rem;cursor:grab;user-select:none;border:2px solid var(--border);}
    .chip.placed{background:var(--surface);border-color:var(--border);color:var(--text);}
    .chip.correct{background:#eef7e9;border-color:var(--green);color:#2f6e10;cursor:default;}
    .chip.wrong{background:#fdeeee;border-color:var(--pink);color:#c0392b;}
    .drop-target{min-height:48px;padding:.4rem;border:2px dashed var(--border);
      border-radius:10px;background:#fafafa;display:flex;align-items:center;flex-wrap:wrap;gap:.4rem;}
    .drop-target.over{border-color:var(--day-color);background:var(--day-light);}
    .btn-row{display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
      padding:.68rem 1.25rem;border-radius:10px;font-family:Arial,sans-serif;
      font-size:clamp(.92rem,2.5vw,1rem);font-weight:800;cursor:pointer;border:none;
      transition:transform .12s;min-height:2.9rem;flex:1;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-v{background:var(--day-color);color:#000;box-shadow:0 3px 10px var(--day-glow);}
    .btn-i{background:var(--day-color);color:#000;box-shadow:0 3px 10px var(--day-glow);}
    .btn-eff{background:var(--surface);color:var(--day-dark);border:2px solid var(--day-border);}
    .hint-box{margin-top:.6rem;background:#fffbeb;border:1.5px dashed var(--yellow);
      border-radius:10px;padding:.7rem 1rem;font-size:.93rem;color:var(--day-dark);
      display:none;line-height:1.7;}
    .hint-box.show{display:block;}
    .fb{margin-top:.65rem;padding:.65rem .95rem;border-radius:10px;font-size:.93rem;
      line-height:1.75;display:none;}
    .fb.show{display:block;}
    .fb.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .results-wrap{width:100%;max-width:720px;display:none;position:relative;z-index:1;margin-top:1.5rem;}
    .results-wrap.show{display:block;}
    .res-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
      padding:2.2rem 2rem;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .res-score{font-size:3.5rem;font-weight:800;color:var(--day-color);margin:.4rem 0;}
    .res-msg{color:var(--muted);font-size:1rem;margin-bottom:1.2rem;line-height:1.7;}
    .btn-restart{background:var(--surface);color:var(--day-dark);border:2px solid var(--day-border);
      border-radius:10px;padding:.7rem 1.8rem;font-size:1rem;font-weight:800;cursor:pointer;
      display:inline-flex;align-items:center;gap:.4rem;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:480px){.btn-row{flex-direction:column;}.btn{width:100%;}}
  </style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>
<div class="head-card">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    PAZAPA &middot; MATHS &middot; 4&Egrave;ME
  </div>
  <div class="week-label">Semaine&nbsp;8 &ndash; Jour&nbsp;5 &mdash; Je m&rsquo;entra&icirc;ne &mdash; Niveau&nbsp;1</div>
  <h1><span class="hl">Calculer avec des puissances d&rsquo;un nombre quelconque et notation scientifique</span></h1>
  <p class="subtitle">4 exercices &middot; Lire une puissance</p>
  <div class="level-row">
    <span class="level-btn active">Niveau&nbsp;1</span>
    <span class="level-btn">Niveau&nbsp;2</span>
    <span class="level-btn">Niveau&nbsp;3</span>
  </div>
</div>
<div class="stats-card">
  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="st-ok">0</div><div class="stat-label">R&eacute;ussies</div></div>
    <div class="stat-box"><div class="stat-num" id="st-rem">4</div><div class="stat-label">Restantes</div></div>
    <div class="stat-box"><div class="stat-num" id="st-err">0</div><div class="stat-label">&Eacute;chou&eacute;es</div></div>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
  <div class="prog-text" id="prog-text">0 / 4</div>
  <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:.7rem;" id="prog-steps"></div>
</div>
<div class="cards-wrap" id="cards"></div>
<div class="results-wrap" id="results">
  <div class="res-card">
    <div style="font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;">R&eacute;sultat</div>
    <div class="res-score" id="res-score"></div>
    <p class="res-msg" id="res-msg"></p>
    <button class="btn-restart" onclick="restart()">&#8635; Recommencer</button>
  </div>
</div>
<script>
var TOTAL=4;
var ST=[];for(var k=0;k<TOTAL;k++)ST.push({done:false,ok:false,err:false});
var score=0;

function sup(n){return '<sup>'+n+'</sup>';}
function frac(n,d){return '<span class="frac"><span class="fn">'+n+'</span><span class="fd">'+d+'</span></span>';}
function $(id){return document.getElementById(id);}

/* ══ DONNÉES ══ */
var QS=[
  {id:0,type:'dnd',num:'1',
   qtype:'Lire une puissance',
   consigne:'Fais glisser les mots dans le bon ordre pour lire cette expression.',
   expr:'9'+sup('2'),
   hint:'On lit la base (9), puis &laquo;&nbsp;exposant&nbsp;&raquo; ou &laquo;&nbsp;\u00e0 la puissance&nbsp;&raquo;, puis l\u2019exposant (2).',
   answers:[['neuf','exposant','deux'],['neuf','\u00e0 la puissance','deux']],
   corr:'On lit\u00a0: <strong>neuf exposant deux</strong> ou <strong>neuf \u00e0 la puissance deux</strong>.'},
  {id:1,type:'dnd',num:'2',
   qtype:'Lire une puissance',
   consigne:'Fais glisser les mots dans le bon ordre pour lire cette expression.',
   expr:'4'+sup('7'),
   hint:'La base est 4, l\u2019exposant est 7.',
   answers:[['quatre','exposant','sept'],['quatre','\u00e0 la puissance','sept']],
   corr:'On lit\u00a0: <strong>quatre exposant sept</strong> ou <strong>quatre \u00e0 la puissance sept</strong>.'},
  {id:2,type:'dnd',num:'3',
   qtype:'Lire une puissance',
   consigne:'Fais glisser les mots dans le bon ordre pour lire cette expression.',
   expr:'(&minus;2)'+sup('7'),
   hint:'La base est &minus;2. On lit d\u2019abord &laquo;&nbsp;moins deux&nbsp;&raquo;.',
   answers:[['moins deux','exposant','sept'],['moins deux','\u00e0 la puissance','sept']],
   corr:'On lit\u00a0: <strong>moins deux exposant sept</strong> ou <strong>moins deux \u00e0 la puissance sept</strong>.'},
  {id:3,type:'dnd',num:'4',
   qtype:'Lire une puissance',
   consigne:'Fais glisser les mots dans le bon ordre pour lire cette expression.',
   expr:'(&minus;7)'+sup('6'),
   hint:'La base est &minus;7. L\u2019exposant est 6.',
   answers:[['moins sept','exposant','six'],['moins sept','\u00e0 la puissance','six']],
   corr:'On lit\u00a0: <strong>moins sept exposant six</strong> ou <strong>moins sept \u00e0 la puissance six</strong>.'}
];

/* ══ CONSTRUCTION ══ */
function buildCards(){
  var h='';
  QS.forEach(function(q){
    if(q.type==='input'){
      h+='<div class="card" id="card'+q.id+'">'
        +'<div class="card-stripe"></div>'
        +'<div class="q-label">Question '+q.num+' / '+TOTAL+'</div>'
        +'<div class="q-type">'+q.qtype+'</div>'
        +'<div class="q-consigne">'+q.consigne+'</div>'
        +'<div class="q-expr">'+q.expr+'</div>'
        +'<div class="aw"><input class="ai" id="inp'+q.id+'" type="text" autocomplete="off" '
        +'placeholder="'+q.placeholder+'" '
        +'onkeydown="if(event.key===\'Enter\')check('+q.id+')" /></div>'
        +'<div class="btn-row">'
        +'<button class="btn btn-v" id="vb'+q.id+'" onclick="check('+q.id+')">\u2713 V\u00e9rifier</button>'
        +'<button class="btn btn-i" onclick="toggleHint(\'hx'+q.id+'\')">\uD83D\uDCA1 Indice</button>'
        +'</div>'
        +'<div class="hint-box" id="hx'+q.id+'">'+q.hint+'</div>'
        +'<div class="fb" id="fb'+q.id+'"></div>'
        +'</div>';
    } else {
      h+=buildDnd(q);
    }
  });
  $('cards').innerHTML=h;
  update();
}

function buildDnd(q){
  var words={};
  q.answers.forEach(function(a){a.forEach(function(w){words[w]=true;});});
  var wlist=Object.keys(words).sort(function(){return Math.random()-.5;});
  var chips=wlist.map(function(w,j){
    return '<div class="chip" id="ch'+q.id+'_'+j+'" draggable="true"'
      +' ondragstart="dStart(event,'+q.id+','+j+')"'
      +' ontouchstart="tStart(event,'+q.id+','+j+')"'
      +' data-word="'+w+'">'+w+'</div>';
  }).join('');
  return '<div class="card" id="card'+q.id+'">'
    +'<div class="card-stripe"></div>'
    +'<div class="q-label">Question '+q.num+' / '+TOTAL+'</div>'
    +'<div class="q-type">'+q.qtype+'</div>'
    +'<div class="q-consigne">'+q.consigne+'</div>'
    +'<div class="q-expr">'+q.expr+'</div>'
    +'<div class="dnd-zone">'
    +'<div class="dnd-label">Mots disponibles</div>'
    +'<div class="chips" id="pool'+q.id+'">'+chips+'</div>'
    +'<div class="dnd-label">Ta r\u00e9ponse</div>'
    +'<div class="drop-target" id="az'+q.id+'"'
    +' ondragover="event.preventDefault();this.classList.add(\'over\')"'
    +' ondragleave="this.classList.remove(\'over\')"'
    +' ondrop="dDrop(event,'+q.id+')"></div>'
    +'</div>'
    +'<div class="btn-row">'
    +'<button class="btn btn-v" id="vb'+q.id+'" onclick="checkDnd('+q.id+')">\u2713 V\u00e9rifier</button>'
    +'<button class="btn btn-i" onclick="toggleHint(\'hx'+q.id+'\')">\uD83D\uDCA1 Indice</button>'
    +'</div>'
    +'<div class="hint-box" id="hx'+q.id+'">'+q.hint+'</div>'
    +'<div class="fb" id="fb'+q.id+'"></div>'
    +'</div>';
}

/* ── DnD desktop ── */
var _dQ=null,_dC=null;
function dStart(e,qi,ci){_dQ=qi;_dC='ch'+qi+'_'+ci;}
function dDrop(e,qi){
  e.preventDefault();
  var az=$('az'+qi);if(!az)return;
  az.classList.remove('over');
  if(_dQ!==qi||!_dC)return;
  var c=$(_dC);if(!c)return;
  c.classList.add('placed');az.appendChild(c);_dC=null;
}
function resetDnd(qi){
  var p=$('pool'+qi),a=$('az'+qi);if(!p||!a)return;
  Array.from(a.querySelectorAll('.chip')).forEach(function(c){
    c.classList.remove('placed','correct','wrong');p.appendChild(c);
  });
}

/* ── DnD touch ── */
var _tC=null,_tCl=null,_tQ=null;
function tStart(e,qi,ci){
  _tQ=qi;_tC=$('ch'+qi+'_'+ci);
  _tCl=_tC.cloneNode(true);
  _tCl.style.cssText='position:fixed;opacity:.8;pointer-events:none;z-index:9999;'
    +'padding:.35rem .85rem;border-radius:8px;background:var(--day-color);'
    +'color:#000;font-weight:700;font-size:.93rem;border:2px solid var(--day-dark);';
  document.body.appendChild(_tCl);e.preventDefault();
  document.addEventListener('touchmove',_tM,{passive:false});
  document.addEventListener('touchend',_tE);
}
function _tM(e){
  e.preventDefault();var t=e.touches[0];
  _tCl.style.left=(t.clientX-45)+'px';_tCl.style.top=(t.clientY-22)+'px';
}
function _tE(e){
  document.removeEventListener('touchmove',_tM);
  document.removeEventListener('touchend',_tE);
  if(_tCl){document.body.removeChild(_tCl);_tCl=null;}
  if(!_tC)return;
  var t=e.changedTouches[0],az=$('az'+_tQ);
  if(az){var r=az.getBoundingClientRect();
    if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom){
      _tC.classList.add('placed');az.appendChild(_tC);}}
  _tC=null;_tQ=null;
}

function toggleHint(id){$(id).classList.toggle('show');}

/* ══ VALIDATION SAISIE ══ */
function normalise(s){
  return s.toLowerCase().trim().replace(/\s+/g,'')
    .replace(/\u00d7/g,'*').replace(/x(?=\d|\()/g,'*')
    .replace(/\u2212/g,'-');
}
function check(id){
  if(ST[id].done)return;
  var q=QS[id];
  var raw=($('inp'+id).value||'').trim();
  if(!raw){showFb(id,'ko','\u26a0\ufe0f Saisis ta r\u00e9ponse avant de valider.');return;}
  var ok=q.check(normalise(raw));
  if(ok){
    markDone(id,true,q.corr);
  } else if(!ST[id].err){
    ST[id].err=true;
    $('inp'+id).className='ai ko';
    $('vb'+id).innerHTML='\u21bb R\u00e9essayer';
    $('hx'+id).classList.add('show');
    showFb(id,'ko','\u2717 Pas tout \u00e0 fait. V\u00e9rifie ta notation et r\u00e9essaie.');
  } else {
    $('inp'+id).value=q.answerText||'';
    markDone(id,false,q.corr);
  }
}

/* ══ VALIDATION DnD ══ */
function checkDnd(id){
  if(ST[id].done)return;
  var q=QS[id];
  var az=$('az'+id);
  var chips=Array.from(az.querySelectorAll('.chip'));
  if(!chips.length){showFb(id,'ko','\u26a0\ufe0f Glisse des mots dans la zone de r\u00e9ponse.');return;}
  var placed=chips.map(function(c){return c.getAttribute('data-word');});
  var ok=q.answers.some(function(a){
    return a.length===placed.length&&a.every(function(w,j){return w===placed[j];});
  });
  if(ok){
    chips.forEach(function(c){c.className='chip correct';c.draggable=false;});
    markDone(id,true,q.corr);
  } else if(!ST[id].err){
    ST[id].err=true;
    chips.forEach(function(c){c.className='chip wrong';});
    $('vb'+id).innerHTML='\u21bb R\u00e9essayer';
    $('hx'+id).classList.add('show');
    showFb(id,'ko','\u2717 Pas dans le bon ordre. R\u00e9arrange les mots et r\u00e9essaie.');
    setTimeout(function(){
      var p=$('pool'+id),a=$('az'+id);
      if(p&&a){
        Array.from(a.querySelectorAll('.chip')).forEach(function(c){
          c.className='chip';c.draggable=true;p.appendChild(c);
        });
        a.innerHTML='';
      }
    },900);
  } else {
    var az2=$('az'+id),p2=$('pool'+id);
    if(az2)az2.innerHTML='';if(p2)p2.innerHTML='';
    q.answers[0].forEach(function(w){
      var c=document.createElement('div');
      c.className='chip correct';c.draggable=false;c.textContent=w;
      if(az2)az2.appendChild(c);
    });
    var eff=$('eff'+id);if(eff)eff.disabled=true;
    markDone(id,false,q.corr);
  }
}

function markDone(id,ok,corrHtml){
  ST[id].done=true;ST[id].ok=ok;if(ok)score++;
  var inp=$('inp'+id);if(inp){inp.className='ai '+(ok?'ok':'ko');inp.disabled=true;}
  var vb=$('vb'+id);if(vb)vb.disabled=true;
  showFb(id,ok?'ok':'ko',(ok?'\u2713 Bravo\u00a0! ':'Correction\u00a0: ')+corrHtml);
  update();
}
function showFb(id,t,msg){
  var fb=$('fb'+id);if(!fb)return;
  fb.className='fb show '+(t==='ok'?'ok':'ko');fb.innerHTML=msg;
}

/* ══ STATS ══ */
function update(){
  var done=0,ok=0;
  for(var i=0;i<TOTAL;i++){if(ST[i].done){done++;if(ST[i].ok)ok++;}}
  $('st-ok').textContent=ok;
  $('st-err').textContent=done-ok;
  $('st-rem').textContent=TOTAL-done;
  $('pfill').style.width=Math.round(done/TOTAL*100)+'%';
  $('prog-text').textContent=done+' / '+TOTAL;
  var s='';
  for(var i=0;i<TOTAL;i++)s+='<span class="step-dot'+(ST[i].done?' done':'')+'"></span>';
  var ps=$('prog-steps');if(ps)ps.innerHTML=s;
  if(done===TOTAL)showRes(ok);
}
function showRes(ok){
  $('results').className='results-wrap show';
  $('res-score').textContent=ok+' / '+TOTAL;
  $('res-msg').textContent=ok===TOTAL?'Parfait\u00a0! Tu ma\u00eetrises la notation puissance.':
    ok>=5?'Tr\u00e8s bien\u00a0! Relis les corrections pour consolider.':
    ok>=3?'Bien\u00a0! Continue \u00e0 t\u2019entra\u00eener.':
    '\u00c0 retravailler. Relis les corrections attentivement.';
}
function restart(){
  score=0;for(var i=0;i<TOTAL;i++)ST[i]={done:false,ok:false,err:false};
  $('results').className='results-wrap';
  buildCards();window.scrollTo({top:0,behavior:'smooth'});
}

buildCards();
</script>
