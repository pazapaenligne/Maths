<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pazapa Maths – 6e – Semaine 1 Séance 3</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#ffffff;--surface:#ffffff;--border:#e8e4d9;--yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;}
header{text-align:center;margin-bottom:1.5rem;}
.badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--yellow);color:#000;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.28rem .85rem;border-radius:99px;margin-bottom:.8rem;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
h1{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:800;line-height:1.2;color:var(--text);}
h1 .gl{color:var(--green);}h1 .bl{color:var(--blue);}
.sub{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);margin-top:.3rem;margin-bottom:1.6rem;}
.prog-wrap{width:100%;max-width:660px;margin-bottom:1.2rem;}
.prog-info{display:flex;justify-content:space-between;font-size:.75rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.35rem;}
.bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .5s;}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.chip{display:flex;align-items:center;gap:.35rem;padding:.28rem .7rem;border-radius:99px;font-size:.75rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:#fff;font-weight:600;color:var(--text);}
.chip .cd{width:8px;height:8px;border-radius:50%;}
.card{width:100%;max-width:660px;background:#fff;border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.8rem 1.4rem;position:relative;box-shadow:0 4px 24px rgba(0,0,0,.06);}
.stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink),var(--blue),var(--green));}
.qnum{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.08em;}
.eq{font-size:clamp(1.05rem,2.2vw,1.35rem);font-weight:800;color:var(--green);margin-bottom:.5rem;line-height:1.3;}
.qtxt{font-size:.88rem;color:var(--muted);margin-bottom:1.2rem;}

/* ── TEXTE À TROUS ── */
.gap-sentences{display:flex;flex-direction:column;gap:1rem;margin-bottom:.8rem;}
.gap-sentence{font-size:.95rem;font-family:'JetBrains Mono',monospace;line-height:2.2;color:var(--text);display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .2rem;}
.gap-sentence .s-lbl{font-weight:700;color:var(--text);margin-right:.3rem;font-size:.9rem;white-space:nowrap;}

/* le champ inline */
.gap-input{
  display:inline-block;
  background:#f0f8fd;
  border:2px solid var(--blue);
  border-radius:7px;
  color:var(--blue);
  font-family:'JetBrains Mono',monospace;
  font-size:.88rem;
  font-weight:600;
  padding:.22rem .5rem;
  outline:none;
  transition:border-color .2s,background .2s;
  vertical-align:middle;
  min-width:90px;
  text-align:center;
}
.gap-input:focus{border-color:#1a6a82;background:#fff;box-shadow:0 0 0 3px rgba(58,181,216,.15);}
.gap-input.ok{background:#f0faeb;border-color:var(--green);color:#3a7d0a;}
.gap-input.ko{background:#fff0ef;border-color:var(--pink);color:#c0392b;}
.gap-input:disabled{cursor:default;}
/* largeurs selon le contenu attendu */
.gap-input.w-sm{min-width:80px;width:80px;}
.gap-input.w-md{min-width:120px;width:120px;}
.gap-input.w-lg{min-width:160px;width:160px;}
.gap-input.w-num{min-width:90px;width:90px;}
.gap-input.w-big{min-width:110px;width:110px;}

/* ponctuation inline après champ */
.gap-word{font-family:'JetBrains Mono',monospace;font-size:.88rem;color:var(--text);vertical-align:middle;white-space:nowrap;}

/* ── Calculs (ex2 & ex3) ── */
.calc-list{display:flex;flex-direction:column;gap:.65rem;margin-bottom:.8rem;}
.calc-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:.9rem;}
.calc-lbl{font-weight:700;color:var(--text);min-width:200px;font-size:.86rem;}
.calc-lbl small{color:var(--muted);font-weight:400;display:block;font-size:.74rem;margin-top:.1rem;}
.calc-eq{color:var(--muted);font-size:.84rem;}

.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.48rem 1.1rem;border-radius:99px;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(58,181,216,.25);}
.btn-h{background:var(--yellow);color:#5a3e00;}
.btn-g{background:transparent;color:var(--muted);border:2px solid var(--border);}
.fb{margin-top:.9rem;padding:.65rem .9rem;border-radius:10px;font-size:.86rem;display:none;align-items:flex-start;gap:.5rem;line-height:1.5;}
.fb.show{display:flex;}
.fb.ok{background:#f0faeb;border:1.5px solid var(--green);color:#3a7d0a;}
.fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
.fb-det{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--text);margin-top:.2rem;}
.hint-box{margin-top:.8rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.65rem .9rem;font-size:.82rem;color:#7a6010;display:none;line-height:1.6;}
.hint-box.show{display:block;}
.hint-box strong{color:var(--orange);}
.nav{display:flex;justify-content:space-between;margin-top:1.2rem;gap:.5rem;}
.results{width:100%;max-width:660px;text-align:center;display:none;}
.results.show{display:block;}
.results-card{background:#fff;border:2px solid var(--border);border-radius:var(--radius);padding:2.2rem 1.8rem;box-shadow:0 4px 24px rgba(0,0,0,.06);}
.score{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:800;line-height:1;margin:.6rem 0 .3rem;color:var(--blue);}
.stars{font-size:1.8rem;margin:.3rem 0 .8rem;}
.rmsg{color:var(--muted);font-size:.9rem;margin-bottom:1.8rem;}
.recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.8rem;}
.ritem{display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;background:#f7f6f2;border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--text);}
.ritem.ok-i{border-color:#b5e08a;}
.ritem.ko-i{border-color:#f9c0bb;}
.ritem .re{color:var(--blue);flex:1;}
@media(max-width:480px){
  .calc-lbl{min-width:unset;width:100%;}
  .calc-row{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>
<header>
  <div class="badge">
    <span class="dot" style="background:#f5c518"></span>
    <span class="dot" style="background:#8dc63f"></span>
    <span class="dot" style="background:#3ab5d8"></span>
    Pazapa · Maths · 6e
  </div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:.73rem;color:#8a8f9a;margin-bottom:.35rem;letter-spacing:.06em;">Semaine 1 – Séance 3</div>
  <h1>Somme, <span class="gl">différence</span> et <span class="bl">produit</span></h1>
  <p class="sub">3 exercices · niveau 6ème</p>
</header>

<div class="prog-wrap">
  <div class="prog-info"><span id="prog-lbl">Exercice 1 / 3</span><span id="prog-pct">0 %</span></div>
  <div class="bar-bg"><div class="bar-fill" id="prog-bar" style="width:0%"></div></div>
</div>
<div class="chips">
  <div class="chip"><div class="cd" style="background:#8dc63f"></div><span id="cnt-ok">0</span> correctes</div>
  <div class="chip"><div class="cd" style="background:#f28b82"></div><span id="cnt-ko">0</span> erreurs</div>
  <div class="chip"><div class="cd" style="background:#8a8f9a"></div><span id="cnt-rem">3</span> restantes</div>
</div>

<div class="card" id="ex-card">
  <div class="stripe"></div>
  <div class="qnum" id="q-num">Exercice 1</div>
  <div class="eq" id="q-eq"></div>
  <div class="qtxt" id="q-txt"></div>
  <div id="q-body"></div>
  <div class="hint-box" id="hint-box"></div>
  <div class="fb" id="feedback">
    <span id="fb-icon" style="font-size:1.1rem;flex-shrink:0"></span>
    <div><div id="fb-msg"></div><div class="fb-det" id="fb-det"></div></div>
  </div>
  <div class="nav">
    <button class="btn btn-g" id="btn-prev" onclick="prevQ()">← Précédent</button>
    <div style="display:flex;gap:.5rem;">
      <button class="btn btn-h" id="btn-hint" onclick="toggleHint()">? Indice</button>
      <button class="btn btn-p" id="btn-next" onclick="nextQ()" disabled>Suivant →</button>
    </div>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="badge" style="margin-bottom:.5rem">
      <span class="dot" style="background:#f5c518"></span>
      <span class="dot" style="background:#8dc63f"></span>
      <span class="dot" style="background:#3ab5d8"></span>
      Résultats
    </div>
    <div class="score"><span id="score-num">0</span>/3</div>
    <div class="stars" id="stars-row"></div>
    <div class="rmsg" id="results-msg"></div>
    <div class="recap" id="recap-list"></div>
    <button class="btn btn-p" onclick="restart()" style="margin:0 auto;display:flex;">🔄 Recommencer</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────
//  Structure des exercices
//  type "gaps"  → texte à trous inline
//  type "calc"  → calcul avec champ résultat
// ─────────────────────────────────────────
const EXS = [
  {
    id: 0,
    type: 'gaps',
    title: '1. Compléter avec le bon vocabulaire',
    txt: 'Complète chaque phrase. Les mots disponibles sont : la somme · la différence · le produit · termes · facteurs',
    hint: '<strong>Astuce :</strong> une soustraction → <strong>la différence</strong>, les nombres s\'appellent des <strong>termes</strong>. Une addition → <strong>la somme</strong> (termes aussi). Une multiplication → <strong>le produit</strong>, les nombres s\'appellent des <strong>facteurs</strong>.',
    // Chaque item = une phrase avec des trous
    // parts : tableau de { text|gap }
    // gap : { id, w (classe largeur), key, accept? }
    items: [
      {
        lbl: 'a)',
        parts: [
          { text: '24 \u2212 15' },
          { text: ' est ' },
          { gap: { id: 'a1', w: 'w-lg', key: 'la difference', accept: ['la difference','difference','la différence','différence'] } },
          { text: ' entre les ' },
          { gap: { id: 'a2', w: 'w-md', key: 'termes', accept: ['termes','terme'] } },
          { text: ' 24 et 15.' },
        ],
        corr: 'la différence / termes'
      },
      {
        lbl: 'b)',
        parts: [
          { text: '24 \u00D7 15' },
          { text: ' est ' },
          { gap: { id: 'b1', w: 'w-md', key: 'le produit', accept: ['le produit','produit'] } },
          { text: ' des ' },
          { gap: { id: 'b2', w: 'w-md', key: 'facteurs', accept: ['facteurs','facteur'] } },
          { text: ' 24 et 15.' },
        ],
        corr: 'le produit / facteurs'
      },
      {
        lbl: 'c)',
        parts: [
          { text: '24 + 15' },
          { text: ' est ' },
          { gap: { id: 'c1', w: 'w-lg', key: 'la somme', accept: ['la somme','somme'] } },
          { text: ' des ' },
          { gap: { id: 'c2', w: 'w-md', key: 'termes', accept: ['termes','terme'] } },
          { text: ' 24 et 15.' },
        ],
        corr: 'la somme / termes'
      },
    ]
  },
  {
    id: 1,
    type: 'calc',
    title: '2. Calculer',
    txt: 'Effectue chaque calcul.',
    hint: '<strong>Astuce :</strong> « somme » = on additionne, « produit » = on multiplie, « différence » = on soustrait. Pour 250 × 40, calcule 25 × 4 = 100 puis ajoute les zéros → 10 000.',
    items: [
      { lbl: 'a) la somme de 1 324 et 4 132',      eq: '1\u202f324 + 4\u202f132 =', key: '5456' },
      { lbl: 'b) le produit de 250 par 40',         eq: '250 \u00D7 40 =',          key: '10000' },
      { lbl: 'c) la différence entre 179 et 45',   eq: '179 \u2212 45 =',          key: '134' },
    ]
  },
  {
    id: 2,
    type: 'calc',
    title: '3. Calcul mental rapide',
    txt: 'Utilise des astuces pour calculer le plus vite possible.',
    hint: '<strong>Astuce :</strong> 999 + 93 = 1\u202f000 + 93 \u2212 1. Pour \u2212 101, enlève 100 puis 1. Pour \u2212 999, enlève 1\u202f000 puis rajoute 1. \u00D7 1\u202f000 : ajoute trois zéros. \u00D7 11 : (\u00D7 10) + (\u00D7 1). \u00D7 21 : (\u00D7 20) + (\u00D7 1).',
    items: [
      { lbl: 'a) 999 + 93',       eq: '999 + 93 =',            key: '1092' },
      { lbl: 'b) 564 \u2212 101', eq: '564 \u2212 101 =',       key: '463' },
      { lbl: 'c) 1\u202f896 \u2212 999', eq: '1\u202f896 \u2212 999 =', key: '897' },
      { lbl: 'd) 5\u202f471 \u00D7 1\u202f000', eq: '5\u202f471 \u00D7 1\u202f000 =', key: '5471000' },
      { lbl: 'e) 524 \u00D7 11',  eq: '524 \u00D7 11 =',        key: '5764' },
      { lbl: 'f) 43 \u00D7 21',   eq: '43 \u00D7 21 =',         key: '903' },
    ]
  },
];

const TOTAL = EXS.length;
let cur = 0;
let answered = [false, false, false];
let hintOpen = false;
const $ = id => document.getElementById(id);

function norm(s) {
  return s.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/\u202f/g, '');
}

function isOk(key, val, accept) {
  const n = norm(val);
  if (n === norm(key)) return true;
  if (accept) return accept.some(a => norm(a) === n);
  return false;
}

function renderQ() {
  const ex = EXS[cur];
  $('q-num').textContent = 'Exercice ' + (cur + 1);
  $('q-eq').textContent = ex.title;
  $('q-txt').textContent = ex.txt;
  $('hint-box').classList.remove('show'); $('hint-box').innerHTML = ''; hintOpen = false;
  $('feedback').className = 'fb';
  $('btn-prev').disabled = cur === 0;
  $('btn-hint').style.display = ex.hint ? '' : 'none';
  $('btn-next').textContent = cur === TOTAL - 1 ? 'Terminer \u2192' : 'Suivant \u2192';
  $('btn-next').disabled = !answered[cur];

  const body = $('q-body'); body.innerHTML = '';

  if (ex.type === 'gaps') {
    renderGaps(ex, body);
  } else {
    renderCalc(ex, body);
  }

  if (answered[cur]) {
    restoreAnswers(ex);
    showFB();
  }
  updateStats();
}

// ── RENDU TEXTE À TROUS ──────────────────
function renderGaps(ex, body) {
  const wrap = document.createElement('div'); wrap.className = 'gap-sentences';
  ex.items.forEach(item => {
    const line = document.createElement('div'); line.className = 'gap-sentence';
    // label (a, b, c)
    const lbl = document.createElement('span'); lbl.className = 's-lbl'; lbl.textContent = item.lbl;
    line.appendChild(lbl);
    // parts
    item.parts.forEach(part => {
      if (part.text !== undefined) {
        const sp = document.createElement('span'); sp.className = 'gap-word'; sp.textContent = part.text;
        line.appendChild(sp);
      } else if (part.gap) {
        const g = part.gap;
        const inp = document.createElement('input'); inp.type = 'text';
        inp.className = 'gap-input ' + g.w; inp.id = 'g_' + g.id;
        inp.placeholder = '…'; inp.autocomplete = 'off'; inp.autocorrect = 'off'; inp.spellcheck = false;
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryCheck(); });
        line.appendChild(inp);
      }
    });
    wrap.appendChild(line);
  });

  const btnRow = document.createElement('div'); btnRow.style.cssText = 'display:flex;gap:.5rem;margin-top:1rem;';
  const bv = document.createElement('button'); bv.className = 'btn btn-p'; bv.id = 'btn-check';
  bv.textContent = 'Valider \u2713'; bv.onclick = checkGaps;
  btnRow.appendChild(bv); body.appendChild(wrap); body.appendChild(btnRow);

  // Focus premier champ
  setTimeout(() => { const f = document.querySelector('.gap-input:not(:disabled)'); if (f) f.focus(); }, 50);
}

function tryCheck() {
  const bc = $('btn-check'); if (bc && !bc.disabled) bc.click();
}

function checkGaps() {
  const ex = EXS[cur];
  ex._gaps = {};
  let allGaps = [];
  ex.items.forEach(item => {
    item.parts.forEach(part => {
      if (part.gap) {
        const inp = $('g_' + part.gap.id);
        const val = inp ? inp.value : '';
        ex._gaps[part.gap.id] = val;
        allGaps.push({ gap: part.gap, val });
        if (inp) { inp.className = 'gap-input ' + part.gap.w + ' ' + (isOk(part.gap.key, val, part.gap.accept) ? 'ok' : 'ko'); inp.disabled = true; }
      }
    });
  });
  answered[cur] = true;
  const bc = $('btn-check'); if (bc) bc.disabled = true;
  showFB(); $('btn-next').disabled = false; updateStats();
}

// ── RENDU CALCUL ─────────────────────────
function renderCalc(ex, body) {
  const wrap = document.createElement('div'); wrap.className = 'calc-list';
  ex.items.forEach((item, i) => {
    const row = document.createElement('div'); row.className = 'calc-row';
    const lbl = document.createElement('span'); lbl.className = 'calc-lbl'; lbl.textContent = item.lbl;
    const eq = document.createElement('span'); eq.className = 'calc-eq'; eq.textContent = item.eq;
    const inp = document.createElement('input'); inp.type = 'text';
    inp.className = 'gap-input w-big'; inp.id = 'c_' + i;
    inp.placeholder = '?'; inp.autocomplete = 'off';
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryCheck(); });
    row.appendChild(lbl); row.appendChild(eq); row.appendChild(inp);
    wrap.appendChild(row);
  });

  const btnRow = document.createElement('div'); btnRow.style.cssText = 'display:flex;gap:.5rem;margin-top:.8rem;';
  const bv = document.createElement('button'); bv.className = 'btn btn-p'; bv.id = 'btn-check';
  bv.textContent = 'Valider \u2713'; bv.onclick = checkCalc;
  btnRow.appendChild(bv); body.appendChild(wrap); body.appendChild(btnRow);

  setTimeout(() => { const f = document.querySelector('.gap-input:not(:disabled)'); if (f) f.focus(); }, 50);
}

function checkCalc() {
  const ex = EXS[cur];
  ex._calc = {};
  ex.items.forEach((item, i) => {
    const inp = $('c_' + i);
    const val = inp ? inp.value.replace(/\s/g, '').replace(/\u202f/g, '') : '';
    ex._calc[i] = val;
    if (inp) { inp.className = 'gap-input w-big ' + (val === item.key ? 'ok' : 'ko'); inp.disabled = true; }
  });
  answered[cur] = true;
  const bc = $('btn-check'); if (bc) bc.disabled = true;
  showFB(); $('btn-next').disabled = false; updateStats();
}

// ── RESTAURATION APRÈS NAVIGATION ────────
function restoreAnswers(ex) {
  if (ex.type === 'gaps' && ex._gaps) {
    ex.items.forEach(item => {
      item.parts.forEach(part => {
        if (part.gap) {
          const inp = $('g_' + part.gap.id); if (!inp) return;
          inp.value = ex._gaps[part.gap.id] || '';
          inp.className = 'gap-input ' + part.gap.w + ' ' + (isOk(part.gap.key, inp.value, part.gap.accept) ? 'ok' : 'ko');
          inp.disabled = true;
        }
      });
    });
    const bc = $('btn-check'); if (bc) bc.disabled = true;
  }
  if (ex.type === 'calc' && ex._calc) {
    ex.items.forEach((item, i) => {
      const inp = $('c_' + i); if (!inp) return;
      inp.value = ex._calc[i] || '';
      inp.className = 'gap-input w-big ' + (inp.value === item.key ? 'ok' : 'ko');
      inp.disabled = true;
    });
    const bc = $('btn-check'); if (bc) bc.disabled = true;
  }
}

// ── FEEDBACK ─────────────────────────────
function showFB() {
  const ex = EXS[cur];
  let allOk = false;
  let wrongs = [];

  if (ex.type === 'gaps' && ex._gaps) {
    let gapList = [];
    ex.items.forEach(item => { item.parts.forEach(p => { if (p.gap) gapList.push(p); }); });
    allOk = gapList.every(p => isOk(p.gap.key, ex._gaps[p.gap.id] || '', p.gap.accept));
    if (!allOk) {
      ex.items.forEach(item => {
        const bad = item.parts.filter(p => p.gap && !isOk(p.gap.key, ex._gaps[p.gap.id] || '', p.gap.accept));
        if (bad.length) wrongs.push(item.lbl + ' → ' + item.corr);
      });
    }
  } else if (ex.type === 'calc' && ex._calc) {
    allOk = ex.items.every((item, i) => ex._calc[i] === item.key);
    if (!allOk) ex.items.forEach((item, i) => { if (ex._calc[i] !== item.key) wrongs.push(item.lbl + ' → ' + item.key); });
  }

  $('feedback').className = 'fb show ' + (allOk ? 'ok' : 'ko');
  $('fb-icon').textContent = allOk ? '\u2705' : '\u274c';
  $('fb-msg').textContent = allOk ? 'Parfait !' : 'Pas tout \u00e0 fait\u2026';
  $('fb-det').textContent = allOk ? 'Toutes les r\u00e9ponses sont correctes !' : 'Correction : ' + wrongs.join('  |  ');
}

function toggleHint() {
  const h = $('hint-box'); hintOpen = !hintOpen;
  if (hintOpen) { h.innerHTML = EXS[cur].hint; h.classList.add('show'); } else h.classList.remove('show');
}

function updateStats() {
  const done = answered.filter(Boolean).length;
  $('prog-bar').style.width = Math.round(done / TOTAL * 100) + '%';
  $('prog-lbl').textContent = 'Exercice ' + (cur + 1) + ' / ' + TOTAL;
  $('prog-pct').textContent = Math.round(done / TOTAL * 100) + ' %';
  let ok = 0, ko = 0;
  EXS.forEach((ex, i) => {
    if (!answered[i]) return;
    let exOk = false;
    if (ex.type === 'gaps' && ex._gaps) {
      let gps = []; ex.items.forEach(it => it.parts.forEach(p => { if (p.gap) gps.push(p); }));
      exOk = gps.every(p => isOk(p.gap.key, ex._gaps[p.gap.id] || '', p.gap.accept));
    } else if (ex.type === 'calc' && ex._calc) {
      exOk = ex.items.every((item, j) => ex._calc[j] === item.key);
    }
    if (exOk) ok++; else ko++;
  });
  $('cnt-ok').textContent = ok;
  $('cnt-ko').textContent = ko;
  $('cnt-rem').textContent = EXS.filter((_, i) => !answered[i]).length;
}

function nextQ() {
  if (cur < TOTAL - 1) { cur++; renderQ(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else showResults();
}
function prevQ() { if (cur > 0) { cur--; renderQ(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }

function showResults() {
  $('ex-card').style.display = 'none'; $('results-screen').classList.add('show');
  let ok = 0;
  EXS.forEach((ex, i) => {
    if (!answered[i]) return;
    let exOk = false;
    if (ex.type === 'gaps' && ex._gaps) {
      let gps = []; ex.items.forEach(it => it.parts.forEach(p => { if (p.gap) gps.push(p); }));
      exOk = gps.every(p => isOk(p.gap.key, ex._gaps[p.gap.id] || '', p.gap.accept));
    } else if (ex.type === 'calc' && ex._calc) {
      exOk = ex.items.every((item, j) => ex._calc[j] === item.key);
    }
    if (exOk) ok++;
  });
  $('score-num').textContent = ok;
  const filled = ok === 3 ? 5 : ok === 2 ? 4 : ok === 1 ? 2 : 0;
  $('stars-row').textContent = '\u2b50'.repeat(filled) + '\u2606'.repeat(5 - filled);
  const msgs = ['Continue \u00e0 t\u2019entra\u00eener !', 'Bon d\u00e9but, pers\u00e9v\u00e8re !', 'Bien jou\u00e9 !', 'Parfait ! \uD83C\uDF89'];
  $('results-msg').textContent = msgs[ok];
  const list = $('recap-list'); list.innerHTML = '';
  EXS.forEach((ex, i) => {
    let exOk = false;
    if (answered[i]) {
      if (ex.type === 'gaps' && ex._gaps) {
        let gps = []; ex.items.forEach(it => it.parts.forEach(p => { if (p.gap) gps.push(p); }));
        exOk = gps.every(p => isOk(p.gap.key, ex._gaps[p.gap.id] || '', p.gap.accept));
      } else if (ex.type === 'calc' && ex._calc) {
        exOk = ex.items.every((item, j) => ex._calc[j] === item.key);
      }
    }
    const d = document.createElement('div'); d.className = 'ritem ' + (exOk ? 'ok-i' : 'ko-i');
    const icon = document.createElement('span'); icon.textContent = exOk ? '\u2705' : '\u274c';
    const re = document.createElement('span'); re.className = 're'; re.textContent = ex.title;
    d.appendChild(icon); d.appendChild(re); list.appendChild(d);
  });
}

function restart() {
  cur = 0; answered = [false, false, false];
  EXS.forEach(ex => { delete ex._gaps; delete ex._calc; });
  $('ex-card').style.display = 'block'; $('results-screen').classList.remove('show');
  renderQ();
}

renderQ();
</script>
</body>
</html>
