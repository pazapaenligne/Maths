
    <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pazapa Maths – Ce que je retiens – Semaine 1 Jour 2</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  /* ═══ COULEUR DU JOUR — Mardi (Jour 2) → Rouge-brique ═══ */
  :root {
    --day-color:  #b94040;
    --day-dark:   #7a1f1f;
    --day-light:  #f7eded;
    --day-border: #e3c0c0;
    --day-glow:   rgba(185,64,64,.3);
    --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
    --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
    --pink:#f28b82; --orange:#f5a623;
    --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;letter-spacing:.02em;word-spacing:.06em;}
  body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
  body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
  .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
  .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--pink);top:200px;left:-30px;pointer-events:none;}
  header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
  .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
  .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
  h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
  h1 .hl{color:var(--day-color);}
  .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}
  .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
  .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
  .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}
  .chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;position:relative;z-index:1;}
  .chip{display:flex;align-items:center;gap:.35rem;padding:.28rem .7rem;border-radius:99px;font-size:.75rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;color:var(--text);}
  .chip .cd{width:8px;height:8px;border-radius:50%;}
  .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 2rem 1.6rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}
  .qnum{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.08em;}
  .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);}
  .qtitle{font-size:1.05rem;font-weight:800;color:var(--day-color);margin-bottom:.5rem;}
  .qtxt{font-size:.88rem;color:var(--muted);margin-bottom:1.2rem;font-family:'JetBrains Mono',monospace;}
  .gap-sentences{display:flex;flex-direction:column;gap:1rem;margin-bottom:.8rem;}
  .gap-sentence{font-size:.95rem;font-family:'JetBrains Mono',monospace;line-height:2.2;color:var(--text);display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .2rem;}
  .s-lbl{font-weight:700;color:var(--text);margin-right:.3rem;font-size:.9rem;white-space:nowrap;}
  .gap-input{display:inline-block;background:var(--day-light);border:2px solid var(--day-color);border-radius:7px;color:var(--day-dark);font-family:'JetBrains Mono',monospace;font-size:.88rem;font-weight:600;padding:.5rem .6rem;min-height:44px;outline:none;transition:border-color .2s,background .2s;vertical-align:middle;min-width:90px;text-align:center;}
  .gap-input:focus{border-color:var(--day-dark);background:#fff;box-shadow:0 0 0 3px var(--day-glow);}
  .gap-input.ok{background:#f0faeb;border-color:var(--green);color:#3a7d0a;}
  .gap-input.ko{background:var(--day-light);border-color:var(--day-color);color:var(--day-dark);}
  .gap-input:disabled{cursor:default;}
  .gap-input.w-sm{min-width:80px;width:80px;}
  .gap-input.w-md{min-width:120px;width:120px;}
  .gap-input.w-lg{min-width:160px;width:160px;}
  .gap-input.w-num{min-width:90px;width:90px;}
  .gap-input.w-big{min-width:110px;width:110px;}
  .gap-word{font-family:'JetBrains Mono',monospace;font-size:.88rem;color:var(--text);vertical-align:middle;white-space:nowrap;}
  .calc-list{display:flex;flex-direction:column;gap:.65rem;margin-bottom:.8rem;}
  .calc-row{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem;font-family:'JetBrains Mono',monospace;font-size:.9rem;padding:.7rem .9rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;}
  .calc-lbl{font-weight:700;color:var(--text);font-size:.86rem;}
  .calc-line{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
  .calc-eq{color:var(--muted);font-size:.9rem;font-weight:600;}
  .hint-box{margin-top:.9rem;background:#f0edfb;border:1.5px dashed #9b7fd4;border-radius:10px;padding:.75rem 1rem;font-size:.82rem;color:#4a2d8a;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
  .hint-box.show{display:block;}
  .fb{margin-top:.9rem;padding:.65rem .9rem;border-radius:10px;font-size:.86rem;display:none;align-items:flex-start;gap:.5rem;line-height:1.5;}
  .fb.show{display:flex;}
  .fb.ok{background:#f0faeb;border:1.5px solid var(--green);color:#3a7d0a;}
  .fb.ko{background:var(--day-light);border:1.5px solid var(--day-color);color:var(--day-dark);}
  .fb-det{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:inherit;margin-top:.2rem;}
  .btn{display:inline-flex;align-items:center;gap:.35rem;padding:.48rem 1.1rem;border-radius:99px;font-family:Arial,sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:44px;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.35;cursor:default;}
  .btn-p{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
  .btn-p:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
  .btn-h{background:var(--orange);color:#fff;}
  .btn-g{background:transparent;color:var(--muted);border:2px solid var(--border);}
  .btn-g:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}
  .nav{display:flex;justify-content:space-between;margin-top:1.2rem;gap:.5rem;flex-wrap:wrap;}
  .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
  .results.show{display:block;}
  .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
  .score{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:800;line-height:1;margin:.6rem 0 .3rem;color:var(--day-color);}
  .stars{font-size:1.8rem;margin:.3rem 0 .8rem;}
  .rmsg{color:var(--muted);font-size:.9rem;margin-bottom:1.8rem;}
  .recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.8rem;}
  .ritem{display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--text);}
  .ritem.ok-i{border-color:#b5e08a;}
  .ritem.ko-i{border-color:var(--day-border);}
  .ritem .re{color:var(--day-color);flex:1;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:480px){
    .card{padding:1.4rem;}
    .btn{font-size:.82rem;padding:.45rem .9rem;}
  }
</style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>
<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#b94040"></span>
    Pazapa &middot; Maths &middot; 6&egrave;me
  </div>
  <div class="week-label">Semaine 1 &ndash; Jour 2</div>
  <h1><span class="hl">Ce que je retiens</span></h1>
  <p class="subtitle">3 exercices &middot; somme, diff&eacute;rence, produit &middot; 6&egrave;me</p>
</header>
<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-lbl">Exercice 1 / 3</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="prog-bar" style="width:0%"></div>
  </div>
</div>
<div class="chips">
  <div class="chip"><div class="cd" style="background:#8dc63f"></div><span id="cnt-ok">0</span>&nbsp;correctes</div>
  <div class="chip"><div class="cd" style="background:#b94040"></div><span id="cnt-ko">0</span>&nbsp;erreurs</div>
  <div class="chip"><div class="cd" style="background:#8a8f9a"></div><span id="cnt-rem">3</span>&nbsp;restantes</div>
</div>
<div class="card" id="ex-card">
  <div class="card-stripe"></div>
  <div class="qnum" id="q-num">Exercice 1</div>
  <div class="theme-badge" id="q-theme"></div>
  <div class="qtitle" id="q-eq"></div>
  <div class="qtxt" id="q-txt"></div>
  <div id="q-body"></div>
  <div class="hint-box" id="hint-box"></div>
  <div class="fb" id="feedback">
    <span id="fb-icon" style="font-size:1.1rem;flex-shrink:0"></span>
    <div><div id="fb-msg"></div><div class="fb-det" id="fb-det"></div></div>
  </div>
  <div class="nav">
    <button class="btn btn-g" id="btn-prev" onclick="prevQ()">&larr; Pr&eacute;c&eacute;dent</button>
    <div style="display:flex;gap:.5rem;">
      <button class="btn btn-h" id="btn-hint" onclick="toggleHint()">? Indice</button>
      <button class="btn btn-p" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button>
    </div>
  </div>
</div>
<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#b94040"></span>
      R&eacute;sultats
    </div>
    <div class="score"><span id="score-num">0</span>/3</div>
    <div class="stars" id="stars-row"></div>
    <div class="rmsg" id="results-msg"></div>
    <div class="recap" id="recap-list"></div>
    <button class="btn btn-p" onclick="restart()" style="margin:0 auto;display:flex;">&#128260; Recommencer</button>
  </div>
</div>
<script>
const EXS = [
  {
    id:0, type:'gaps',
    theme:'Vocabulaire',
    title:'1. Compl\u00e9ter avec le bon vocabulaire',
    txt:'Compl\u00e8te chaque phrase. Mots disponibles\u00a0: la somme \u00b7 la diff\u00e9rence \u00b7 le produit \u00b7 termes \u00b7 facteurs',
    hint:'Pense au r\u00e9sultat de chaque op\u00e9ration\u00a0: soustraction \u2192 <strong>la diff\u00e9rence</strong>, addition \u2192 <strong>la somme</strong>, multiplication \u2192 <strong>le produit</strong>. Les nombres d\u2019une addition ou soustraction s\u2019appellent des <strong>termes</strong>\u00a0; ceux d\u2019une multiplication s\u2019appellent des <strong>facteurs</strong>.',
    items:[
      { lbl:'a)', corr:'la diff\u00e9rence / termes',
        parts:[
          {text:'24 \u2212 15 est '},
          {gap:{id:'a1',w:'w-lg',key:'la difference',accept:['la difference','difference','la diff\u00e9rence','diff\u00e9rence']}},
          {text:' entre les '},
          {gap:{id:'a2',w:'w-md',key:'termes',accept:['termes','terme']}},
          {text:' 24 et 15.'}
        ]
      },
      { lbl:'b)', corr:'le produit / facteurs',
        parts:[
          {text:'24 \u00d7 15 est '},
          {gap:{id:'b1',w:'w-md',key:'le produit',accept:['le produit','produit']}},
          {text:' des '},
          {gap:{id:'b2',w:'w-md',key:'facteurs',accept:['facteurs','facteur']}},
          {text:' 24 et 15.'}
        ]
      },
      { lbl:'c)', corr:'la somme / termes',
        parts:[
          {text:'24 + 15 est '},
          {gap:{id:'c1',w:'w-lg',key:'la somme',accept:['la somme','somme']}},
          {text:' des '},
          {gap:{id:'c2',w:'w-md',key:'termes',accept:['termes','terme']}},
          {text:' 24 et 15.'}
        ]
      }
    ]
  },
  {
    id:1, type:'calc',
    theme:'Calcul',
    title:'2. Calculer',
    txt:'Effectue chaque calcul.',
    hint:'<strong>somme</strong> = additionner, <strong>produit</strong> = multiplier, <strong>diff\u00e9rence</strong> = soustraire. Pour 250 \u00d7 40\u00a0: calcule 25 \u00d7 4 = 100 puis ajoute les z\u00e9ros \u2192 10\u202f000.',
    items:[
      {lbl:'a) la somme de 1\u202f324 et 4\u202f132',    eq:'1\u202f324 + 4\u202f132 =',         key:'5456',  tip:'Aligne les chiffres de même rang : unités avec unités, dizaines avec dizaines.'},
      {lbl:'b) le produit de 250 par 40',          eq:'250 \u00d7 40 =',               key:'10000', tip:'Calcule d\u2019abord 25 \u00d7 4, puis ajoute les z\u00e9ros.'},
      {lbl:'c) la diff\u00e9rence entre 179 et 45', eq:'179 \u2212 45 =',               key:'134',   tip:'Soustrais les unités, puis les dizaines, en alignant bien les rangs.'}
    ]
  },
  {
    id:2, type:'calc',
    theme:'Calcul mental',
    title:'3. Calcul mental rapide',
    txt:'Utilise des astuces pour calculer le plus vite possible.',
    hint:'999 + 93 = 1\u202f000 + 93 \u2212 1. Pour \u2212\u202f101\u00a0: enlève 100 puis 1. Pour \u2212\u202f999\u00a0: enlève 1\u202f000 puis rajoute 1. \u00d7\u202f1\u202f000\u00a0: pour un nombre entier, multiplier par 1\u202f000 revient à ajouter trois z\u00e9ros. \u00d7\u202f11\u00a0: (\u00d710)+(\u00d71). \u00d7\u202f21\u00a0: (\u00d720)+(\u00d71).',
    items:[
      {lbl:'a)', eq:'999 + 93 =',                   key:'1092',    tip:'Pense à 1\u202f000 + 93 \u2212 1'},
      {lbl:'b)', eq:'564 \u2212 101 =',              key:'463',     tip:'Enlève 100 puis 1'},
      {lbl:'c)', eq:'1\u202f896 \u2212 999 =',       key:'897',     tip:'Enlève 1\u202f000 puis rajoute 1'},
      {lbl:'d)', eq:'5\u202f471 \u00d7 1\u202f000 =', key:'5471000', tip:'Pour un entier, \u00d71\u202f000 ajoute trois z\u00e9ros'},
      {lbl:'e)', eq:'524 \u00d7 11 =',               key:'5764',    tip:'Calcule (\u00d710) + (\u00d71)'},
      {lbl:'f)', eq:'43 \u00d7 21 =',                key:'903',     tip:'Calcule (\u00d720) + (\u00d71)'}
    ]
  }
];
const TOTAL=EXS.length;
let cur=0, answered=[false,false,false], hintOpen=false;
const $=id=>document.getElementById(id);
function norm(s){
  return s.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ').replace(/\u202f/g,'');
}
function isOk(key,val,accept){
  const n=norm(val);
  if(n===norm(key)) return true;
  if(accept) return accept.some(a=>norm(a)===n);
  return false;
}
function renderQ(){
  const ex=EXS[cur];
  $('q-num').textContent='Exercice '+(cur+1);
  $('q-theme').textContent=ex.theme;
  $('q-eq').textContent=ex.title;
  $('q-txt').textContent=ex.txt;
  $('hint-box').classList.remove('show'); $('hint-box').innerHTML=''; hintOpen=false;
  $('feedback').className='fb';
  $('btn-prev').disabled=cur===0;
  $('btn-hint').style.display=ex.hint?'':'none';
  $('btn-next').textContent=cur===TOTAL-1?'Terminer \u2192':'Suivant \u2192';
  $('btn-next').disabled=!answered[cur];
  const body=$('q-body'); body.innerHTML='';
  if(ex.type==='gaps') renderGaps(ex,body);
  else renderCalc(ex,body);
  if(answered[cur]){ restoreAnswers(ex); showFB(); }
  updateStats();
}
function renderGaps(ex,body){
  const wrap=document.createElement('div'); wrap.className='gap-sentences';
  ex.items.forEach(item=>{
    const line=document.createElement('div'); line.className='gap-sentence';
    const lbl=document.createElement('span'); lbl.className='s-lbl'; lbl.textContent=item.lbl;
    line.appendChild(lbl);
    item.parts.forEach(part=>{
      if(part.text!==undefined){
        const sp=document.createElement('span'); sp.className='gap-word'; sp.textContent=part.text;
        line.appendChild(sp);
      } else if(part.gap){
        const g=part.gap;
        const inp=document.createElement('input'); inp.type='text';
        inp.className='gap-input '+g.w; inp.id='g_'+g.id;
        inp.placeholder='\u2026'; inp.autocomplete='off'; inp.autocorrect='off'; inp.spellcheck=false;
        inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryCheck(); });
        line.appendChild(inp);
      }
    });
    wrap.appendChild(line);
  });
  const btnRow=document.createElement('div'); btnRow.style.cssText='display:flex;gap:.5rem;margin-top:1rem;';
  const bv=document.createElement('button'); bv.className='btn btn-p'; bv.id='btn-check';
  bv.textContent='Valider \u2713'; bv.onclick=checkGaps;
  btnRow.appendChild(bv); body.appendChild(wrap); body.appendChild(btnRow);
  setTimeout(()=>{ const f=document.querySelector('.gap-input:not(:disabled)'); if(f) f.focus(); },50);
}
function tryCheck(){ const bc=$('btn-check'); if(bc&&!bc.disabled) bc.click(); }
function checkGaps(){
  const ex=EXS[cur]; ex._gaps={};
  ex.items.forEach(item=>{
    item.parts.forEach(part=>{
      if(part.gap){
        const inp=$('g_'+part.gap.id);
        const val=inp?inp.value:'';
        ex._gaps[part.gap.id]=val;
        if(inp){ inp.className='gap-input '+part.gap.w+' '+(isOk(part.gap.key,val,part.gap.accept)?'ok':'ko'); inp.disabled=true; }
      }
    });
  });
  answered[cur]=true;
  const bc=$('btn-check'); if(bc) bc.disabled=true;
  showFB(); $('btn-next').disabled=false; updateStats();
}
function renderCalc(ex,body){
  const wrap=document.createElement('div'); wrap.className='calc-list';
  ex.items.forEach((item,i)=>{
    const row=document.createElement('div'); row.className='calc-row';
    const lbl=document.createElement('span'); lbl.className='calc-lbl'; lbl.textContent=item.lbl;
    const line=document.createElement('div'); line.className='calc-line';
    const eq=document.createElement('span'); eq.className='calc-eq'; eq.textContent=item.eq;
    const inp=document.createElement('input'); inp.type='text';
    inp.className='gap-input w-big'; inp.id='c_'+i;
    inp.placeholder='?'; inp.autocomplete='off';
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryCheck(); });
    line.appendChild(eq); line.appendChild(inp);
    row.appendChild(lbl); row.appendChild(line);
    wrap.appendChild(row);
  });
  const btnRow=document.createElement('div'); btnRow.style.cssText='display:flex;gap:.5rem;margin-top:.8rem;';
  const bv=document.createElement('button'); bv.className='btn btn-p'; bv.id='btn-check';
  bv.textContent='Valider \u2713'; bv.onclick=checkCalc;
  btnRow.appendChild(bv); body.appendChild(wrap); body.appendChild(btnRow);
  setTimeout(()=>{ const f=document.querySelector('.gap-input:not(:disabled)'); if(f) f.focus(); },50);
}
function checkCalc(){
  const ex=EXS[cur]; ex._calc={};
  ex.items.forEach((item,i)=>{
    const inp=$('c_'+i);
    const val=inp?inp.value.replace(/\s/g,'').replace(/\u202f/g,''):'';
    ex._calc[i]=val;
    if(inp){ inp.className='gap-input w-big '+(val===item.key?'ok':'ko'); inp.disabled=true; }
  });
  answered[cur]=true;
  const bc=$('btn-check'); if(bc) bc.disabled=true;
  showFB(); $('btn-next').disabled=false; updateStats();
}
function restoreAnswers(ex){
  if(ex.type==='gaps'&&ex._gaps){
    ex.items.forEach(item=>{
      item.parts.forEach(part=>{
        if(part.gap){
          const inp=$('g_'+part.gap.id); if(!inp) return;
          inp.value=ex._gaps[part.gap.id]||'';
          inp.className='gap-input '+part.gap.w+' '+(isOk(part.gap.key,inp.value,part.gap.accept)?'ok':'ko');
          inp.disabled=true;
        }
      });
    });
    const bc=$('btn-check'); if(bc) bc.disabled=true;
  }
  if(ex.type==='calc'&&ex._calc){
    ex.items.forEach((item,i)=>{
      const inp=$('c_'+i); if(!inp) return;
      inp.value=ex._calc[i]||'';
      inp.className='gap-input w-big '+(inp.value===item.key?'ok':'ko');
      inp.disabled=true;
    });
    const bc=$('btn-check'); if(bc) bc.disabled=true;
  }
}
function showFB(){
  const ex=EXS[cur];
  let allOk=false; let wrongs=[];
  if(ex.type==='gaps'&&ex._gaps){
    let gps=[]; ex.items.forEach(it=>it.parts.forEach(p=>{ if(p.gap) gps.push(p); }));
    allOk=gps.every(p=>isOk(p.gap.key,ex._gaps[p.gap.id]||'',p.gap.accept));
    if(!allOk) ex.items.forEach(item=>{
      const bad=item.parts.filter(p=>p.gap&&!isOk(p.gap.key,ex._gaps[p.gap.id]||'',p.gap.accept));
      if(bad.length) wrongs.push(item.lbl+' \u2192 '+item.corr);
    });
  } else if(ex.type==='calc'&&ex._calc){
    allOk=ex.items.every((item,i)=>ex._calc[i]===item.key);
    if(!allOk) ex.items.forEach((item,i)=>{ if(ex._calc[i]!==item.key) wrongs.push(item.lbl+' \u2192 '+item.key+(item.tip?' \u00b7 '+item.tip:'')); });
  }
  $('feedback').className='fb show '+(allOk?'ok':'ko');
  $('fb-icon').textContent=allOk?'\u2705':'\u274c';
  $('fb-msg').textContent=allOk?'Parfait !':'Pas tout \u00e0 fait\u2026';
  $('fb-det').textContent=allOk?'Toutes les r\u00e9ponses sont correctes !':'Correction\u00a0: '+wrongs.join('  |  ');
}
function toggleHint(){
  const h=$('hint-box'); hintOpen=!hintOpen;
  if(hintOpen){ h.innerHTML=EXS[cur].hint; h.classList.add('show'); }
  else h.classList.remove('show');
}
function updateStats(){
  const done=answered.filter(Boolean).length;
  $('prog-bar').style.width=Math.round(done/TOTAL*100)+'%';
  $('prog-lbl').textContent='Exercice '+(cur+1)+' / '+TOTAL;
  $('prog-pct').textContent=Math.round(done/TOTAL*100)+'\u00a0%';
  let ok=0,ko=0;
  EXS.forEach((ex,i)=>{
    if(!answered[i]) return;
    let exOk=false;
    if(ex.type==='gaps'&&ex._gaps){
      let gps=[]; ex.items.forEach(it=>it.parts.forEach(p=>{ if(p.gap) gps.push(p); }));
      exOk=gps.every(p=>isOk(p.gap.key,ex._gaps[p.gap.id]||'',p.gap.accept));
    } else if(ex.type==='calc'&&ex._calc){
      exOk=ex.items.every((item,j)=>ex._calc[j]===item.key);
    }
    if(exOk) ok++; else ko++;
  });
  $('cnt-ok').textContent=ok; $('cnt-ko').textContent=ko;
  $('cnt-rem').textContent=EXS.filter((_,i)=>!answered[i]).length;
}
function nextQ(){
  if(cur<TOTAL-1){ cur++; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); }
  else showResults();
}
function prevQ(){ if(cur>0){ cur--; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); } }
function showResults(){
  $('ex-card').style.display='none'; $('results-screen').classList.add('show');
  let ok=0;
  EXS.forEach((ex,i)=>{
    if(!answered[i]) return;
    let exOk=false;
    if(ex.type==='gaps'&&ex._gaps){
      let gps=[]; ex.items.forEach(it=>it.parts.forEach(p=>{ if(p.gap) gps.push(p); }));
      exOk=gps.every(p=>isOk(p.gap.key,ex._gaps[p.gap.id]||'',p.gap.accept));
    } else if(ex.type==='calc'&&ex._calc){
      exOk=ex.items.every((item,j)=>ex._calc[j]===item.key);
    }
    if(exOk) ok++;
  });
  $('score-num').textContent=ok;
  const filled=ok===3?5:ok===2?4:ok===1?2:1;
  $('stars-row').textContent='\u2b50'.repeat(filled)+'\u2606'.repeat(5-filled);
  const msgs=['Continue \u00e0 t\u2019entra\u00eener !','Bon d\u00e9but, pers\u00e9v\u00e8re !','Bien jou\u00e9 !','Parfait ! \uD83C\uDF89'];
  $('results-msg').textContent=msgs[ok];
  const list=$('recap-list'); list.innerHTML='';
  EXS.forEach((ex,i)=>{
    let exOk=false;
    if(answered[i]){
      if(ex.type==='gaps'&&ex._gaps){
        let gps=[]; ex.items.forEach(it=>it.parts.forEach(p=>{ if(p.gap) gps.push(p); }));
        exOk=gps.every(p=>isOk(p.gap.key,ex._gaps[p.gap.id]||'',p.gap.accept));
      } else if(ex.type==='calc'&&ex._calc){
        exOk=ex.items.every((item,j)=>ex._calc[j]===item.key);
      }
    }
    const d=document.createElement('div'); d.className='ritem '+(exOk?'ok-i':'ko-i');
    const icon=document.createElement('span'); icon.textContent=exOk?'\u2705':'\u274c';
    const re=document.createElement('span'); re.className='re'; re.textContent=ex.title;
    d.appendChild(icon); d.appendChild(re); list.appendChild(d);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function restart(){
  cur=0; answered=[false,false,false];
  EXS.forEach(ex=>{ delete ex._gaps; delete ex._calc; });
  $('ex-card').style.display='block'; $('results-screen').classList.remove('show');
  renderQ();
}
renderQ();
</script>
</body>
</html>
