<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths &mdash; 3e &mdash; J&apos;explore &mdash; S3 J1</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f5a623;--day-dark:#c47a10;--day-mid:#a06010;--day-light:#fff5e0;
  --day-border:#f5d080;--day-glow:rgba(245,166,35,.22);
  --bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;
  --green:#5fa800;--green-soft:#8dc63f;--pink:#f28b82;--orange:#f5a623;--blue:#3ab5d8;--red:#d33;
  --text:#1a1d23;--muted:#6f7480;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;line-height:1.7;}
body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.12;
  width:340px;height:340px;background:var(--day);top:-80px;right:-80px;pointer-events:none;}
body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.12;
  width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
.bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:180px;height:180px;
  background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
.bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:120px;height:120px;
  background:var(--day);top:200px;left:-30px;pointer-events:none;}

.head-card{width:100%;max-width:700px;background:var(--day-light);border:2px solid var(--day-border);
  border-radius:var(--radius);padding:1.8rem 1.5rem 1.5rem;text-align:center;
  position:relative;z-index:1;margin-bottom:1.2rem;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--day);color:#fff;
  font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.6rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--day-dark);margin:.4rem 0;}
.head-card h1{line-height:1.25;margin:.2rem 0;}
.hl{color:var(--day-dark);font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;}
.lvl{display:block;color:var(--text);font-size:clamp(1.4rem,5vw,2rem);font-weight:900;margin-top:.1rem;}
.head-card .subtitle{color:var(--muted);font-size:.95rem;margin-top:.5rem;}

.stats-card{width:100%;max-width:700px;background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem;
  position:relative;z-index:1;box-shadow:0 4px 18px rgba(0,0,0,.05);}
.stats-row{display:flex;gap:.7rem;}
.stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);
  border-radius:11px;padding:.8rem .4rem;text-align:center;}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:1.6rem;font-weight:800;color:var(--day-dark);}
.stat-label{font-size:.8rem;color:var(--muted);margin-top:.2rem;}
.prog-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;margin-top:.9rem;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--day),#f5c518);
  border-radius:99px;transition:width .5s;width:0%;}
.prog-text{text-align:center;font-family:'JetBrains Mono',monospace;
  font-size:.82rem;color:var(--muted);margin-top:.5rem;}

.section-wrap{width:100%;max-width:700px;position:relative;z-index:1;margin-bottom:.4rem;}
.sec-header{display:flex;align-items:center;gap:.7rem;padding:.7rem 0 .4rem;flex-wrap:wrap;}
.sec-num{width:32px;height:32px;border-radius:50%;background:var(--day);color:#fff;
  font-family:'JetBrains Mono',monospace;font-weight:900;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sec-title{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:800;color:var(--day-dark);}
.sec-badge{font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:700;
  padding:.18rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;
  background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);margin-left:auto;}
.sec-consigne{font-size:.92rem;color:var(--text);line-height:1.75;margin-bottom:1rem;font-weight:600;
  overflow-wrap:break-word;}

.qcard{width:100%;max-width:700px;background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);padding:1.5rem 1.4rem 1.3rem;margin-bottom:1.1rem;
  position:relative;z-index:1;box-shadow:0 3px 14px rgba(0,0,0,.05);overflow:hidden;}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--day),#f5c518,var(--pink),var(--day));
  background-size:200% 100%;animation:slide 3s linear infinite;}
@keyframes slide{from{background-position:0 0;}to{background-position:200% 0;}}
.q-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;
  padding-bottom:.7rem;border-bottom:1px solid var(--border);}
.q-lbl{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:1rem;
  background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);
  border-radius:8px;padding:.25rem .7rem;}

.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:11px;
  padding:.8rem 1rem;margin-bottom:.9rem;font-family:'JetBrains Mono',monospace;
  font-size:clamp(1.1rem,3.5vw,1.5rem);font-weight:700;color:var(--day-dark);
  text-align:center;overflow-wrap:break-word;}

/* QCM opts */
.opts{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem;}
.opt{display:inline-flex;align-items:center;justify-content:center;
  min-width:3rem;padding:.55rem 1rem;border-radius:9px;border:2px solid var(--border);
  background:#fff;color:var(--text);font-family:'JetBrains Mono',monospace;
  font-size:1.1rem;font-weight:700;cursor:pointer;min-height:2.8rem;transition:.12s;}
.opt:hover:not(.locked){border-color:var(--day);}
.opt.sel{border-color:var(--day);background:var(--day-light);}
.opt.correct{border-color:var(--green-soft);background:#f0faeb;color:#2f6e10;}
.opt.wrong{border-color:var(--pink);background:#fff0ef;color:#a93226;}
.opt.locked{cursor:default;pointer-events:none;}

.inp-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem;}
.inp-lbl{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;white-space:nowrap;}
.answer-input{background:#fff;border:2px solid var(--border);border-radius:9px;
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1rem;
  padding:.45rem .75rem;outline:none;transition:border-color .2s;min-height:2.8rem;
  flex:1;min-width:130px;}
.answer-input:focus{border-color:var(--day);}
.ok-inp{border-color:var(--green-soft)!important;background:#f0faeb!important;}
.ko-inp{border-color:var(--pink)!important;background:#fff0ef!important;}

.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.55rem 1.05rem;border-radius:9px;font-family:'JetBrains Mono',monospace;
  font-size:.82rem;font-weight:700;letter-spacing:.04em;cursor:pointer;border:none;
  transition:transform .12s;min-height:2.8rem;text-transform:uppercase;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.38;cursor:default;}
.btn-ok{background:var(--day);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
.btn-ok:hover:not(:disabled){transform:translateY(-1px);}
.btn-hint{background:#fff;border:2px solid var(--blue);color:var(--day-dark);}
.btn-hint:hover:not(:disabled){background:#eef7fb;}
.btn-sol{background:#fff;border:2px solid var(--day-border);color:var(--day-dark);display:none;}
.btn-sol.vis{display:inline-flex;}
.btn-rst{background:#fff;border:2px solid var(--border);color:var(--muted);}
.btn-rst:hover:not(:disabled){border-color:var(--pink);color:var(--red);}

.hint-box{display:none;margin-top:.7rem;background:#fff5e0;border:1.5px dashed var(--day);
  border-radius:9px;padding:.65rem .9rem;font-size:.88rem;color:var(--day-mid);
  line-height:1.75;font-family:'JetBrains Mono',monospace;}
.hint-box.show{display:block;}
.fb{display:none;margin-top:.65rem;padding:.65rem .9rem;border-radius:9px;
  font-size:clamp(.9rem,2.5vw,1rem);font-weight:700;line-height:1.8;overflow-wrap:break-word;}
.fb.show{display:block;}
.fb.ok{background:#f0faeb;border:1.5px solid var(--green-soft);color:#2f6e10;}
.fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#a93226;}
.sol-box{display:none;background:var(--day-light);border:1.5px solid var(--day-border);
  border-radius:9px;padding:.75rem 1rem;margin-top:.65rem;font-size:.88rem;
  color:var(--day-dark);line-height:1.85;font-family:'JetBrains Mono',monospace;
  overflow-wrap:break-word;}
.sol-box.show{display:block;}

.results-wrap{width:100%;max-width:700px;display:none;position:relative;z-index:1;margin-top:.5rem;}
.results-wrap.show{display:block;}
.results-card{background:var(--surface);border:2px solid var(--day-border);border-radius:var(--radius);
  overflow:hidden;box-shadow:0 4px 20px var(--day-glow);}
.rc-stripe{height:5px;background:linear-gradient(90deg,var(--day),#f5c518,var(--pink),var(--day));
  background-size:200% 100%;animation:slide 3s linear infinite;}
.rc-inner{padding:2rem 1.5rem;text-align:center;}
.rc-title{font-family:'JetBrains Mono',monospace;font-weight:900;
  font-size:clamp(1.1rem,4vw,1.5rem);color:var(--day-dark);margin-bottom:.4rem;}
.rc-score{font-family:'JetBrains Mono',monospace;font-size:clamp(2.8rem,10vw,4rem);
  font-weight:900;line-height:1;margin:.5rem 0 .2rem;color:var(--green);}
.rc-stars{font-size:1.8rem;margin:.2rem 0 .8rem;letter-spacing:.15rem;}
.rc-stars .on{color:var(--day);} .rc-stars .off{color:#d8d2c2;}
.rc-msg{font-family:'JetBrains Mono',monospace;font-size:clamp(.82rem,2.8vw,.92rem);
  color:var(--muted);margin-bottom:1.2rem;line-height:1.8;}
.recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.3rem;}
.ri{display:flex;align-items:flex-start;gap:.7rem;padding:.6rem .9rem;background:var(--bg);
  border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.6;}
.ri.ok-item{border-color:#b5e08a;} .ri.ko-item{border-color:#f9c0bb;}
.ri .ri-icon{flex-shrink:0;} .ri .ri-eq{color:var(--day-dark);flex:1;min-width:0;overflow-wrap:break-word;}
.ri .ri-ans{color:var(--muted);overflow-wrap:break-word;}

@media(max-width:560px){
  .stats-row{gap:.4rem;}
  .stat-num{font-size:1.35rem;}
}
@media(max-width:480px){
  .btn-row{flex-direction:column;} .btn{width:100%;}
  .head-card{padding:1.4rem 1rem 1.2rem;}
  .qcard{padding:1.2rem 1rem 1.1rem;}
  .opts{gap:.4rem;}
}
</style>
</head>

<script>
var SECTIONS=[
  { n:1, badge:'Fractions',
    consigne:'Donner la valeur d\u00e9cimale.',
    qs:[
      { id:'1a', lbl:'', type:'num',
        eq:'6 / 5',
        ph:'valeur d\u00e9cimale\u2026',
        enc:['1,2','1.2'],
        hint:'Effectue la division 6 \u00f7 5.',
        sol:'6 \u00f7 5 = \u003cstrong\u003e1,2\u003c/strong\u003e' }
    ]
  },
  { n:2, badge:'Comparaison',
    consigne:'Compl\u00e9ter avec le signe \u003c ou \u003e.',
    qs:[
      { id:'2a', lbl:'1.', type:'qcm',
        eq:'61 \u00a0\u00a0\u25a1\u00a0\u00a0 \u221232',
        opts:['\u003c','\u003e'], enc:'1',
        hint:'Un nombre positif est toujours sup\u00e9rieur \u00e0 un nombre n\u00e9gatif.',
        sol:'61 \u003e \u221232' },
      { id:'2b', lbl:'2.', type:'qcm',
        eq:'\u22120,528 \u00a0\u25a1\u00a0 \u22120,574',
        opts:['\u003c','\u003e'], enc:'1',
        hint:'Sur la droite des nombres, quel nombre est le plus \u00e0 droite\u00a0?',
        sol:'\u22120,528 \u003e \u22120,574 \u00a0(\u22120,528 est plus proche de 0)' },
      { id:'2c', lbl:'3.', type:'qcm',
        eq:'\u22126,98 \u00a0\u25a1\u00a0 \u22126,9',
        opts:['\u003c','\u003e'], enc:'0',
        hint:'Parmi deux n\u00e9gatifs, celui qui a la plus grande valeur absolue est le plus petit.',
        sol:'\u22126,98 \u003c \u22126,9 \u00a0(|6,98| \u003e |6,9|)' },
      { id:'2d', lbl:'4.', type:'qcm',
        eq:'\u22125,7 \u00a0\u25a1\u00a0 \u22125,9',
        opts:['\u003c','\u003e'], enc:'1',
        hint:'\u22125,7 et \u22125,9 sont tous deux n\u00e9gatifs. Lequel est plus proche de 0\u00a0?',
        sol:'\u22125,7 \u003e \u22125,9 \u00a0(\u22125,7 est plus proche de 0)' }
    ]
  },
  { n:3, badge:'Op\u00e9rations',
    consigne:'Calculer.',
    qs:[
      { id:'3a', lbl:'1.', type:'num',
        eq:'(\u221220) \u00f7 (+2)',
        ph:'r\u00e9sultat\u2026',
        enc:['-10','\u221210'],
        hint:'N\u00e9gatif \u00f7 positif = n\u00e9gatif. Calcule 20 \u00f7 2.',
        sol:'(\u221220) \u00f7 (+2) = \u003cstrong\u003e\u221210\u003c/strong\u003e' },
      { id:'3b', lbl:'2.', type:'num',
        eq:'(\u22126) \u2212 (+9)',
        ph:'r\u00e9sultat\u2026',
        enc:['-15','\u221215'],
        hint:'Soustraire un positif revient \u00e0 additionner son oppos\u00e9.',
        sol:'(\u22126) \u2212 (+9) = \u22126 \u2212 9 = \u003cstrong\u003e\u221215\u003c/strong\u003e' },
      { id:'3c', lbl:'3.', type:'num',
        eq:'(\u22122) + (\u22124)',
        ph:'r\u00e9sultat\u2026',
        enc:['-6','\u22126'],
        hint:'Additionner deux n\u00e9gatifs : additionne les valeurs absolues, r\u00e9sultat n\u00e9gatif.',
        sol:'(\u22122) + (\u22124) = \u003cstrong\u003e\u22126\u003c/strong\u003e' },
      { id:'3d', lbl:'4.', type:'num',
        eq:'(\u221213) \u00d7 (\u22123)',
        ph:'r\u00e9sultat\u2026',
        enc:['39'],
        hint:'N\u00e9gatif \u00d7 n\u00e9gatif = positif. Calcule 13 \u00d7 3.',
        sol:'(\u221213) \u00d7 (\u22123) = +13 \u00d7 3 = \u003cstrong\u003e39\u003c/strong\u003e' }
    ]
  },
  { n:4, badge:'R\u00e9duction',
    consigne:'R\u00e9duire les expressions suivantes, si cela est possible.',
    qs:[
      { id:'4a', lbl:'A', type:'poly',
        eq:'A = \u221211x + 4',
        ph:'expression r\u00e9duite\u2026',
        enc:'-11x+4',
        hint:'Cette expression a-t-elle des termes semblables \u00e0 regrouper\u00a0?',
        sol:'A = \u003cstrong\u003e\u221211x + 4\u003c/strong\u003e \u00a0(d\u00e9j\u00e0 r\u00e9duite)' },
      { id:'4b', lbl:'B', type:'poly',
        eq:'B = \u22128x + 9x\u00b2',
        ph:'expression r\u00e9duite\u2026',
        enc:'9x^2-8x',
        hint:'Deux termes diff\u00e9rents (x et x\u00b2) : ordre canonique = degr\u00e9 d\u00e9croissant.',
        sol:'B = \u003cstrong\u003e9x\u00b2 \u2212 8x\u003c/strong\u003e' },
      { id:'4c', lbl:'C', type:'poly',
        eq:'C = 5x \u2212 7 + x',
        ph:'expression r\u00e9duite\u2026',
        enc:'6x-7',
        hint:'Regroupe les termes en x ensemble.',
        sol:'C = 5x + x \u2212 7 = \u003cstrong\u003e6x \u2212 7\u003c/strong\u003e' },
      { id:'4d', lbl:'D', type:'poly',
        eq:'D = 9x \u00d7 (\u22121)',
        ph:'expression r\u00e9duite\u2026',
        enc:'-9x',
        hint:'Multiplie le coefficient 9 par \u22121.',
        sol:'D = 9x \u00d7 (\u22121) = \u003cstrong\u003e\u22129x\u003c/strong\u003e' },
      { id:'4e', lbl:'E', type:'poly',
        eq:'E = 11x \u2212 7 \u2212 7x + 6',
        ph:'expression r\u00e9duite\u2026',
        enc:'4x-1',
        hint:'Regroupe les termes en x d\u2019un c\u00f4t\u00e9, les constantes de l\u2019autre.',
        sol:'E = (11x \u2212 7x) + (\u22127 + 6) = \u003cstrong\u003e4x \u2212 1\u003c/strong\u003e' }
    ]
  }
];

var TOTAL=14, done={}, nOk=0, nKo=0, userOpt={};

function esc(s){return(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function norm(s){
  s=(''+s).toLowerCase();
  var r=[[' ',''],['\t',''],['\u00a0',''],['*',''],['\u00d7',''],['\u00f7',''],
    ['^2','\u00b2'],['x2','x\u00b2'],['\u2013','-'],['\u2014','-'],['\u2212','-']];
  for(var i=0;i<r.length;i++)s=s.split(r[i][0]).join(r[i][1]);
  return s;
}

/* ── Parseur ── */
function calcSafe(str){
  var s=str,pos=0;
  function parseExpr(){var v=parseTerm();while(pos<s.length){if(s[pos]==='+'){pos++;v+=parseTerm();}else if(s[pos]==='-'){pos++;v-=parseTerm();}else break;}return v;}
  function parseTerm(){var v=parsePow();while(pos<s.length){if(s[pos]==='*'){pos++;v*=parsePow();}else if(s[pos]==='/'){pos++;var d=parsePow();if(d===0)return NaN;v/=d;}else break;}return v;}
  function parsePow(){var b=parsePrimary();if(pos<s.length&&s[pos]==='^'){pos++;return Math.pow(b,parsePow());}return b;}
  function parsePrimary(){if(pos<s.length&&s[pos]==='('){pos++;var v=parseExpr();if(pos<s.length&&s[pos]===')') pos++;return v;}if(pos<s.length&&s[pos]==='-'){pos++;return -parsePrimary();}var st=pos;while(pos<s.length&&/[0-9.]/.test(s[pos]))pos++;if(pos===st)return NaN;return parseFloat(s.slice(st,pos));}
  try{var r=parseExpr();return pos===s.length?r:NaN;}catch(e){return NaN;}
}
function prepCalc(s){
  s=(''+s).toLowerCase().replace(/\s+/g,'').replace(/\u00a0/g,'')
    .replace(/\u00b2/g,'^2').replace(/\u00b3/g,'^3')
    .replace(/[\u00d7\u00b7]/g,'*').replace(/[−\u2212\u2013\u2014]/g,'-');
  return s;
}
function multiVarCalc(expr,varMap){
  var s=prepCalc(expr);
  var prev='';while(prev!==s){prev=s;s=s.replace(/([0-9)])(\()/g,'$1*$2').replace(/(\))([0-9a-z])/g,'$1*$2');}
  var vars=Object.keys(varMap).sort(function(a,b){return b.length-a.length;});
  var res='',i=0;
  while(i<s.length){var matched=false;for(var v=0;v<vars.length;v++){var vn=vars[v];if(s.substr(i,vn.length)===vn){if(res.length>0&&/[0-9a-z)]/.test(res[res.length-1]))res+='*';res+='('+varMap[vn]+')';var ni=i+vn.length;if(ni<s.length&&/[0-9a-z(]/.test(s[ni]))res+='*';i+=vn.length;matched=true;break;}}if(!matched){res+=s[i];i++;}}
  return calcSafe(res);
}
function polyEqual(student,enc){
  var pts=[-2,-1,0,1,2,3,5,7];
  for(var i=0;i<pts.length;i++){
    var sv=multiVarCalc(student,{x:pts[i]});
    var ev=multiVarCalc(enc,{x:pts[i]});
    if(!isFinite(sv)||!isFinite(ev)||Math.abs(sv-ev)>1e-5)return false;
  }
  return true;
}

/* ── Sons ── */
var _actx=null;
function getACtx(){if(!_actx){try{_actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return _actx;}
function playTone(notes,type){
  var ctx=getACtx();if(!ctx)return;
  notes.forEach(function(n){var osc=ctx.createOscillator(),g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.type=type||'sine';osc.frequency.setValueAtTime(n[0],ctx.currentTime+n[2]);g.gain.setValueAtTime(0,ctx.currentTime+n[2]);g.gain.linearRampToValueAtTime(n[3]||0.18,ctx.currentTime+n[2]+0.02);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+n[2]+n[1]);osc.start(ctx.currentTime+n[2]);osc.stop(ctx.currentTime+n[2]+n[1]+0.05);});
}
function soundCorrect(){playTone([[523,.12,0,.18],[659,.12,.1,.18],[784,.2,.2,.22],[1047,.25,.32,.2]],'sine');}
function soundWrong(){playTone([[300,.12,0,.18],[220,.2,.1,.15]],'sawtooth');}

/* ── Flash ── */
var _fl=null;
function flashScreen(t){if(!_fl){_fl=document.createElement('div');_fl.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:999;opacity:0;';document.body.appendChild(_fl);}
  _fl.style.background=t==='ok'?'rgba(95,168,0,.2)':'rgba(211,51,51,.16)';_fl.style.transition='none';_fl.style.opacity='1';
  setTimeout(function(){_fl.style.transition='opacity .5s';_fl.style.opacity='0';},80);}

/* ── Rendu ── */
function buildAll(){
  var host=document.getElementById('exos-wrap');host.innerHTML='';
  SECTIONS.forEach(function(sec){
    var wrap=document.createElement('div');wrap.className='section-wrap';
    wrap.innerHTML='<div class="sec-header"><div class="sec-num">'+sec.n+'</div>'
      +'<div class="sec-title">Exercice '+sec.n+'</div>'
      +'<div class="sec-badge">'+sec.badge+'</div></div>'
      +'<p class="sec-consigne">'+sec.consigne+'</p>';
    host.appendChild(wrap);
    sec.qs.forEach(function(q){
      var card=document.createElement('div');card.className='qcard';card.id='card-'+q.id;
      var inner='<div class="q-head"><span class="q-lbl">'+esc(q.lbl||'')+'</span>'
        +'<span style="font-family:\'JetBrains Mono\',monospace;font-weight:700;font-size:.95rem;padding-left:'+(q.lbl?'.5rem':'0')+'">'+q.eq+'</span></div>';

      if(q.type==='qcm'){
        inner+='<div class="opts" id="opts-'+q.id+'">';
        q.opts.forEach(function(o,k){inner+='<button class="opt" onclick="selOpt(\''+q.id+'\','+k+')">'+esc(o)+'</button>';});
        inner+='</div>';
      } else {
        inner+='<div class="inp-row">'+(q.lbl?'<span class="inp-lbl">'+esc(q.lbl)+'</span>':'')+
          '<input type="text" id="inp-'+q.id+'" class="answer-input" placeholder="'+esc(q.ph)+'" autocomplete="off"/></div>';
      }

      inner+='<div class="btn-row">'
        +'<button class="btn btn-ok" id="chk-'+q.id+'" onclick="checkQ(\''+q.id+'\')">&#10003; V\u00e9rifier</button>'
        +'<button class="btn btn-hint" onclick="toggleHint(\''+q.id+'\')">&#128161; Indice</button>'
        +'<button class="btn btn-sol" id="sol-btn-'+q.id+'" onclick="toggleSol(\''+q.id+'\')">&#9660; Correction</button>'
        +'<button class="btn btn-rst" onclick="resetQ(\''+q.id+'\')">&#8635;</button>'
        +'</div>'
        +'<div class="hint-box" id="hint-'+q.id+'">&#128161; <strong>Indice\u00a0:</strong> '+q.hint+'</div>'
        +'<div class="fb" id="fb-'+q.id+'"></div>'
        +'<div class="sol-box" id="solbox-'+q.id+'"><strong>Correction\u00a0:</strong><br>'+q.sol+'</div>';

      card.innerHTML=inner;host.appendChild(card);
      if(done[q.id]!==undefined)lockQ(q);
    });
  });
}

function selOpt(id,idx){
  if(done[id]!==undefined)return;
  userOpt[id]=idx;
  var btns=document.getElementById('opts-'+id).children;
  for(var k=0;k<btns.length;k++)btns[k].classList.toggle('sel',k===idx);
}

function lockQ(q){
  var ok=done[q.id];
  var btn=document.getElementById('chk-'+q.id);if(btn)btn.disabled=true;
  var solBtn=document.getElementById('sol-btn-'+q.id);if(solBtn)solBtn.classList.add('vis');
  var fb=document.getElementById('fb-'+q.id);
  var bravos=['\u2705 <strong>Bravo\u00a0!</strong>','\u2705 <strong>Exact\u00a0!</strong>','\u2705 <strong>Parfait\u00a0!</strong>','\u2705 <strong>Bien jou\u00e9\u00a0!</strong>'];
  if(fb){fb.className='fb show '+(ok?'ok':'ko');
    fb.innerHTML=ok?bravos[Math.floor(Math.random()*bravos.length)]:'\u274C <strong>Pas encore.</strong> V\u00e9rifie l\u2019indice ou la correction.';}
  if(q.type==='qcm'){
    var btns=document.getElementById('opts-'+q.id);
    if(btns){Array.from(btns.children).forEach(function(b,k){
      b.classList.add('locked');
      if(''+k===q.enc)b.classList.add('correct');
      if(''+k===''+userOpt[q.id]&&!ok)b.classList.add('wrong');
    });}
  } else {
    var inp=document.getElementById('inp-'+q.id);
    if(inp){inp.disabled=true;inp.classList.add(ok?'ok-inp':'ko-inp');}
  }
}

function checkQ(id){
  if(done[id]!==undefined)return;
  var q=findQ(id);if(!q)return;
  var fb=document.getElementById('fb-'+id);
  var ok=false;
  if(q.type==='qcm'){
    if(userOpt[id]===undefined){fb.className='fb show ko';fb.textContent='Choisis \u003c ou \u003e avant de valider.';return;}
    ok=(''+userOpt[id]===q.enc);
  } else if(q.type==='poly'){
    var val=document.getElementById('inp-'+id).value.trim();
    if(!val){fb.className='fb show ko';fb.textContent='Entre une r\u00e9ponse avant de valider.';return;}
    ok=polyEqual(val,q.enc);
  } else {
    var val=document.getElementById('inp-'+id).value.trim();
    if(!val){fb.className='fb show ko';fb.textContent='Entre une r\u00e9ponse avant de valider.';return;}
    ok=q.enc.indexOf(norm(val))>-1;
  }
  done[id]=ok;
  if(ok){nOk++;soundCorrect();flashScreen('ok');}else{nKo++;soundWrong();flashScreen('ko');}
  lockQ(q);updateScore();
}

function findQ(id){for(var s=0;s<SECTIONS.length;s++)for(var q=0;q<SECTIONS[s].qs.length;q++)if(SECTIONS[s].qs[q].id===id)return SECTIONS[s].qs[q];return null;}
function toggleHint(id){var h=document.getElementById('hint-'+id);if(h)h.classList.toggle('show');}
function toggleSol(id){
  var s=document.getElementById('solbox-'+id);if(!s)return;
  s.classList.toggle('show');
  var btn=document.getElementById('sol-btn-'+id);
  if(btn)btn.textContent=s.classList.contains('show')?'\u25b2 Masquer':'\u25bc Correction';
}
function resetQ(id){
  delete done[id];delete userOpt[id];
  var q=findQ(id);if(!q)return;
  if(q.type==='qcm'){var btns=document.getElementById('opts-'+id);if(btns)Array.from(btns.children).forEach(function(b){b.className='opt';});}
  else{var inp=document.getElementById('inp-'+id);if(inp){inp.value='';inp.disabled=false;inp.className='answer-input';}}
  var btn=document.getElementById('chk-'+id);if(btn)btn.disabled=false;
  var solBtn=document.getElementById('sol-btn-'+id);if(solBtn)solBtn.classList.remove('vis');
  var fb=document.getElementById('fb-'+id);if(fb){fb.className='fb';fb.innerHTML='';}
  var solBox=document.getElementById('solbox-'+id);if(solBox)solBox.classList.remove('show');
  var hint=document.getElementById('hint-'+id);if(hint)hint.classList.remove('show');
  nOk=0;nKo=0;Object.keys(done).forEach(function(k){if(done[k]===true)nOk++;else nKo++;});
  updateScore();
}
function resetAll(){done={};nOk=0;nKo=0;userOpt={};document.getElementById('results-wrap').classList.remove('show');buildAll();updateScore();window.scrollTo({top:0,behavior:'smooth'});}

function updateScore(){
  var ans=nOk+nKo;
  document.getElementById('sc-ok').textContent=nOk;
  document.getElementById('sc-ko').textContent=nKo;
  document.getElementById('sc-rem').textContent=TOTAL-ans;
  document.getElementById('prog-fill').style.width=Math.round(nOk/TOTAL*100)+'%';
  document.getElementById('prog-text').textContent=nOk+' / '+TOTAL;
  if(ans>=TOTAL)showResults();
}

function showResults(){
  var ratio=nOk/TOTAL;
  document.getElementById('results-wrap').classList.add('show');
  document.getElementById('rc-score').textContent=nOk+'/'+TOTAL;
  var st=ratio>=1?5:ratio>=.8?4:ratio>=.6?3:ratio>=.4?2:1;
  var sr='';for(var i=0;i<5;i++)sr+='<span class="'+(i<st?'on':'off')+'">&#9733;</span>';
  document.getElementById('rc-stars').innerHTML=sr;
  var titres=['\uD83D\uDD34 Ma\u00eettrise insuffisante','\uD83D\uDFE0 Ma\u00eettrise fragile','\uD83D\uDFE1 Ma\u00eettrise satisfaisante','\uD83D\uDFE2 Tr\u00e8s bien\u00a0!','\uD83D\uDFE2 Excellent\u00a0!'];
  var conseils=['Relis le cours et recommence avec les indices.','Reprends les exercices manqu\u00e9s.','Revois les erreurs pour consolider.','Encore un effort pour le sans-faute.','\u2B50 Tu ma\u00eetrises parfaitement ces notions\u00a0!'];
  var idx=st-1;
  document.getElementById('rc-msg').innerHTML='<strong>'+titres[idx]+'</strong><br><span style="font-weight:400">'+conseils[idx]+'</span>';
  var recap=document.getElementById('recap');recap.innerHTML='';
  SECTIONS.forEach(function(sec){sec.qs.forEach(function(q){
    var ok=done[q.id]===true;
    var div=document.createElement('div');div.className='ri '+(ok?'ok-item':'ko-item');
    div.innerHTML='<span class="ri-icon">'+(ok?'\u2714':'\u2718')+'</span>'
      +'<span class="ri-eq">'+(q.lbl?q.lbl+' ':'')+q.eq+'</span>'
      +(ok?'':'<span class="ri-ans">\u2192 '+q.sol.replace(/<[^>]+>/g,'')+'</span>');
    recap.appendChild(div);
  });});
  document.getElementById('results-wrap').scrollIntoView({behavior:'smooth'});
}

document.addEventListener('DOMContentLoaded',function(){buildAll();updateScore();});
</script>
