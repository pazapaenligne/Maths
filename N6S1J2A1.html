<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa — Texte à trous — Multiplication posée</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --day-color:  #e05a50;
    --day-dark:   #a52a1f;
    --day-light:  #fde8e6;
    --day-border: #f0a099;
    --day-glow:   rgba(224,90,80,.3);
    --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
    --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
    --pink:#f28b82; --orange:#f5a623;
    --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:2rem 1rem 4rem;
    position:relative; overflow-x:hidden;
    letter-spacing:.02em; word-spacing:.06em;
  }
  body::before{
    content:''; position:fixed; border-radius:50%; z-index:0;
    opacity:.13; width:340px; height:340px;
    background:var(--yellow); top:-80px; right:-80px;
    pointer-events:none;
  }
  body::after{
    content:''; position:fixed; border-radius:50%; z-index:0;
    opacity:.13; width:260px; height:260px;
    background:var(--day-color); bottom:-60px; left:-60px;
    pointer-events:none;
  }
  .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
    width:180px;height:180px;background:var(--green);
    bottom:120px;right:-40px;pointer-events:none;}
  .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
    width:120px;height:120px;background:var(--pink);
    top:200px;left:-30px;pointer-events:none;}

  header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
  .logo-badge{
    display:inline-flex;align-items:center;gap:.5rem;
    background:var(--yellow);color:#000;
    font-size:.78rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;padding:.3rem .9rem;
    border-radius:99px;margin-bottom:.5rem;
  }
  .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
  h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
  h1 .hl{color:var(--day-color);}
  .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

  .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
  .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
  .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}

  .card{width:100%;max-width:680px;background:var(--surface);
    border:2px solid var(--border);border-radius:var(--radius);
    padding:2rem 2rem 1.6rem;position:relative;z-index:1;
    box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
    border-radius:var(--radius) var(--radius) 0 0;
    background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}

  .word-bank{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
    margin-bottom:1.2rem;padding:.75rem 1rem;
    background:var(--day-light);border-radius:10px;border:1.5px dashed var(--day-border);}
  .word-bank-label{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;
    color:var(--day-dark);text-transform:uppercase;letter-spacing:.08em;margin-right:.3rem;flex-shrink:0;}
  .word-chip{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:600;
    padding:.3rem .8rem;border-radius:99px;background:var(--surface);color:var(--day-dark);
    border:1.5px solid var(--day-color);transition:opacity .2s,background .2s;user-select:none;}
  .word-chip.used{opacity:.35;text-decoration:line-through;background:var(--border);border-color:var(--border);color:var(--muted);}
  .word-chip.validated-ok{background:#f0faeb;border-color:var(--green);color:#2f6e10;opacity:1;text-decoration:none;}
  .word-chip.validated-ko{background:var(--day-light);border-color:var(--day-color);color:var(--day-dark);opacity:1;text-decoration:none;}

  .consigne{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;
    letter-spacing:.1em;color:var(--day-dark);text-transform:uppercase;
    margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem;}
  .consigne::before{content:'';display:inline-block;width:3px;height:16px;border-radius:2px;background:var(--day-color);flex-shrink:0;}

  .texte-exercice{font-size:.95rem;line-height:2.6;color:var(--text);margin-bottom:1.2rem;}
  .texte-exercice p{margin-bottom:.2rem;}

  .blank-wrap{display:inline-flex;align-items:center;margin:0 4px;}
  .blank-input{font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:600;
    color:var(--day-dark);background:var(--day-light);
    border:2px solid var(--day-color);border-radius:8px;
    padding:.3rem .7rem;text-align:center;
    outline:none;transition:border-color .2s,background .2s,transform .1s;}
  .blank-input:focus{border-color:var(--day-dark);background:#fff;transform:scale(1.04);box-shadow:0 0 0 3px var(--day-glow);}
  .blank-input:disabled{cursor:default;transform:none;}
  .blank-input.correct{background:#f0faeb;border-color:var(--green);color:#2f6e10;}
  .blank-input.wrong{background:var(--day-light);border-color:var(--day-color);color:var(--day-dark);}

  .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;
    padding:.75rem 1rem;font-size:.85rem;color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
  .hint-box.show{display:block;}

  .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;font-size:.9rem;
    display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
  .feedback.show{display:flex;}
  .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
  .feedback.ko{background:var(--day-light);border:1.5px solid var(--day-color);color:var(--day-dark);}
  .feedback.partial{background:#fffbeb;border:1.5px solid var(--yellow);color:#7a6010;}
  .feedback-icon{font-size:1.4rem;flex-shrink:0;}
  .feedback-detail{color:inherit;font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.8;}
  .corr-list{list-style:none;padding:0;margin-top:.5rem;}
  .corr-list li{padding:.3rem .6rem;border-radius:6px;margin-bottom:.3rem;font-size:.8rem;}
  .corr-ok{background:#e8f7d4;color:#2f6e10;}
  .corr-ko{background:var(--day-light);color:var(--day-dark);}

  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem;position:relative;z-index:2;}
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:10px;
    font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;
    transition:transform .12s,box-shadow .15s;min-height:2.6rem;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.38;cursor:default;}
  .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
  .btn-hint{background:var(--orange);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
  .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

  .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
  .results.show{display:block;}
  .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
    padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
  .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
  .results-score .s-num{color:var(--day-color);}
  .stars{font-size:2rem;margin:.4rem 0 1rem;}
  .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
  .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
  .recap-item{display:flex;align-items:flex-start;gap:.8rem;padding:.65rem 1rem;background:var(--bg);
    border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.6;}
  .recap-item .eq{color:var(--day-color);flex:1;}
  .recap-item.ok-item{border-color:#b5e08a;}
  .recap-item.ko-item{border-color:var(--day-border);}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:480px){
    .card{padding:1.4rem;}
    .btn{font-size:.85rem;padding:.55rem 1rem;}
    .texte-exercice{font-size:.88rem;}
  }
</style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#f28b82"></span>
    Pazapa &middot; Maths &middot; 6&egrave;me
  </div>
  <div class="week-label">Semaine 1 &ndash; Jour 2 &mdash;</div>
  <h1><span class="hl">Texte &agrave; trous &mdash; Calcul pos&eacute;</span></h1>
  <p class="subtitle">5 blancs &middot; multiplication pos&eacute;e &middot; r&egrave;gles fondamentales</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Blanc 1 / 5</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<div class="card" id="ex-card">
  <div class="card-stripe"></div>

  <div class="word-bank">
    <span class="word-bank-label">Mots&nbsp;:</span>
    <span class="word-chip" id="chip-rang">rang</span>
    <span class="word-chip" id="chip-retenues">retenues</span>
    <span class="word-chip" id="chip-gauche">gauche</span>
    <span class="word-chip" id="chip-multiplication">multiplication</span>
    <span class="word-chip" id="chip-ordre">ordre</span>
  </div>

  <div class="consigne">Complète le texte avec les mots proposés</div>

  <div class="texte-exercice" id="texte-zone"></div>

  <div class="hint-box" id="hint-box"></div>

  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="fb-icon"></span>
    <div>
      <div id="fb-msg"></div>
      <div class="feedback-detail" id="fb-detail"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btn-check" onclick="checkAll()">&#10003; Vérifier</button>
    <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    <button class="btn btn-ghost" id="btn-restart-inline" onclick="restart()" style="display:none;">&#8635; Recommencer</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#f28b82"></span>
      Résultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/5</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <div class="recap-list" id="recap-list"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">
      &#128260; Recommencer
    </button>
  </div>
</div>

<script>
var BLANKS = [
  { id:0, answer:"rang",           explication:"On aligne les chiffres selon leur <strong>rang</strong> (unit\u00e9s sous unit\u00e9s, dizaines sous dizaines\u2026) pour \u00e9viter les erreurs de position." },
  { id:1, answer:"retenues",       explication:"Les <strong>retenues</strong> sont les chiffres \u00e0 reporter quand le produit d\u00e9passe 9. Les oublier est la cause la plus fr\u00e9quente d\u2019erreur." },
  { id:2, answer:"gauche",         explication:"On d\u00e9cale vers la <strong>gauche</strong> car on multiplie par les dizaines, ce qui revient \u00e0 ajouter un z\u00e9ro en fin de ligne." },
  { id:3, answer:"multiplication", explication:"Lors de la <strong>multiplication</strong> pos\u00e9e \u00e0 deux chiffres, chaque chiffre du multiplicateur g\u00e9n\u00e8re une ligne d\u00e9cal\u00e9e." },
  { id:4, answer:"ordre",          explication:"Estimer l\u2019<strong>ordre</strong> de grandeur : 47 \u00d7 23 \u2248 50 \u00d7 20 = 1\u202f000, donc un r\u00e9sultat de 10 ou 10\u202f000 serait suspect." }
];

var TOTAL = BLANKS.length;
var userAnswers = new Array(TOTAL).fill("");
var validated = false;
var hintOpen = false;

function normalise(s){
  return s.trim().toLowerCase()
    .replace(/[\u00e0\u00e2\u00e4]/g,"a").replace(/[\u00e9\u00e8\u00ea\u00eb]/g,"e")
    .replace(/[\u00ee\u00ef]/g,"i").replace(/[\u00f4\u00f6]/g,"o")
    .replace(/[\u00f9\u00fb\u00fc]/g,"u").replace(/\u00e7/g,"c");
}

function makeInput(idx){
  var wrap = document.createElement("span");
  wrap.className = "blank-wrap";
  var inp = document.createElement("input");
  inp.type = "text";
  inp.className = "blank-input";
  inp.id = "blank-"+idx;
  inp.placeholder = "\u2026";
  inp.setAttribute("autocomplete","off");
  inp.setAttribute("autocorrect","off");
  inp.setAttribute("spellcheck","false");
  var sizes = [60,100,70,140,65];
  inp.style.width = sizes[idx]+"px";
  inp.addEventListener("input", function(){
    userAnswers[idx] = inp.value;
    updateChips();
    updateProgress();
  });
  inp.addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); checkAll(); }
  });
  wrap.appendChild(inp);
  return wrap;
}

function buildTexte(){
  var z = document.getElementById("texte-zone");
  if(!z) return;
  z.innerHTML = "";

  function row(nodes){
    var p = document.createElement("p");
    nodes.forEach(function(n){
      p.appendChild(typeof n==="string" ? document.createTextNode(n) : n);
    });
    z.appendChild(p);
  }

  row(["Toujours aligner les chiffres selon leur ", makeInput(0), "."]);
  row(["Poser soigneusement les ", makeInput(1), "."]);
  row(["Mettre le nombre le plus court en deuxi\u00e8me ligne."]);
  row(["D\u00e9caler d\u2019un rang vers la ", makeInput(2), " \u00e0 chaque nouvelle ligne de ", makeInput(3), "."]);
  row(["V\u00e9rifier le r\u00e9sultat avec un ", makeInput(4), " de grandeur."]);

  var first = document.getElementById("blank-0");
  if(first) first.focus();
}

function updateProgress(){
  var filled = userAnswers.filter(function(a){ return a.trim().length>0; }).length;
  var pct = Math.round(filled/TOTAL*100);
  document.getElementById("progress-bar").style.width = pct+"%";
  document.getElementById("prog-pct").textContent = pct+"\u00a0%";
  document.getElementById("prog-label").textContent = "Blanc "+(Math.min(filled+1,TOTAL))+" / "+TOTAL;
}

function updateChips(){
  if(validated) return;
  var typed = userAnswers.map(function(a){ return normalise(a); });
  BLANKS.forEach(function(b){
    var chip = document.getElementById("chip-"+b.answer);
    if(!chip) return;
    if(typed.indexOf(normalise(b.answer))!==-1) chip.classList.add("used");
    else chip.classList.remove("used");
  });
}

function checkAll(){
  if(validated) return;
  if(userAnswers.every(function(a){ return a.trim().length===0; })) return;
  validated = true;
  var score = 0;
  var results = [];
  BLANKS.forEach(function(b,i){
    var inp = document.getElementById("blank-"+i);
    var ok = normalise(b.answer)===normalise(userAnswers[i]);
    results.push(ok);
    inp.disabled = true;
    inp.classList.add(ok ? "correct" : "wrong");
    if(ok) score++;
    var chip = document.getElementById("chip-"+b.answer);
    if(chip){ chip.classList.remove("used"); chip.classList.add(ok?"validated-ok":"validated-ko"); }
  });
  document.getElementById("progress-bar").style.width = "100%";
  document.getElementById("prog-pct").textContent = "100\u00a0%";
  document.getElementById("prog-label").textContent = "Termin\u00e9 \u2014 "+score+" / "+TOTAL;
  document.getElementById("btn-check").disabled = true;
  document.getElementById("btn-restart-inline").style.display = "inline-flex";

  var fb = document.getElementById("feedback");
  var icon = document.getElementById("fb-icon");
  var msg = document.getElementById("fb-msg");
  var det = document.getElementById("fb-detail");

  if(score===TOTAL){
    fb.className="feedback show ok"; icon.textContent="\u2705";
    msg.innerHTML="<strong>Parfait !</strong> Tu ma\u00eetrises les 5 r\u00e8gles du calcul pos\u00e9.";
    det.innerHTML="Alignement par <strong>rang</strong>, <strong>retenues</strong>, d\u00e9calage vers la <strong>gauche</strong>, chaque ligne de <strong>multiplication</strong>, v\u00e9rification par l\u2019<strong>ordre</strong> de grandeur.";
  } else if(score===0){
    fb.className="feedback show ko"; icon.textContent="\u274c";
    msg.innerHTML="<strong>Aucun blanc correct.</strong> Voici les corrections\u00a0:";
    det.innerHTML=buildCorr(results);
  } else {
    fb.className="feedback show partial"; icon.textContent="\u26a0\ufe0f";
    msg.innerHTML="<strong>"+score+" / "+TOTAL+"</strong> blanc"+(score>1?"s":"")+" correct"+(score>1?"s":"")+" !";
    det.innerHTML=buildCorr(results);
  }
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
  setTimeout(function(){ showResults(score,results); }, 2000);
}

function buildCorr(results){
  var html="<ul class='corr-list'>";
  BLANKS.forEach(function(b,i){
    if(results[i]) html+="<li class='corr-ok'>\u2705 Blanc "+(i+1)+" : <strong>"+b.answer+"</strong> \u2014 correct !</li>";
    else html+="<li class='corr-ko'>\u274c Blanc "+(i+1)+" : \u00ab\u00a0"+(userAnswers[i].trim()||"(vide)")+"\u00a0\u00bb \u2192 <strong>"+b.answer+"</strong>. "+b.explication+"</li>";
  });
  return html+"</ul>";
}

function showResults(score,results){
  document.getElementById("ex-card").style.display="none";
  var rs=document.getElementById("results-screen");
  rs.classList.add("show");
  document.getElementById("score-num").textContent=score;
  var stars=score===TOTAL?5:score>=4?4:score>=3?3:score>=2?2:1;
  document.getElementById("stars-row").textContent="\u2b50".repeat(stars)+"\u2606".repeat(5-stars);
  var msgs=["Retente !","Encore un effort !","Pas mal !","Bien jou\u00e9 !","Tr\u00e8s bien !","Parfait ! Bravo ! \uD83C\uDF89"];
  document.getElementById("results-msg").textContent=msgs[Math.min(score,5)];
  var list=document.getElementById("recap-list"); list.innerHTML="";
  BLANKS.forEach(function(b,i){
    var div=document.createElement("div");
    div.className="recap-item "+(results[i]?"ok-item":"ko-item");
    div.innerHTML="<span>"+(results[i]?"\u2705":"\u274c")+"</span>"
      +"<span class='eq'>Blanc "+(i+1)+" \u2014 "+b.answer+"</span>"
      +"<span>"+(results[i]?"\u2713":"\u2717 "+(userAnswers[i].trim()||"vide"))+"</span>";
    list.appendChild(div);
  });
  rs.scrollIntoView({behavior:"smooth",block:"start"});
}

function toggleHint(){
  hintOpen=!hintOpen;
  var h=document.getElementById("hint-box");
  if(hintOpen){
    h.innerHTML="<strong>\u2753 Indice :</strong> Pense \u00e0 ce qu\u2019on fait quand on pose une op\u00e9ration : comment place-t-on les chiffres ? Que note-t-on quand un calcul d\u00e9passe 9 ? De quel c\u00f4t\u00e9 d\u00e9cale-t-on la deuxi\u00e8me ligne ? Et comment s\u2019assure-t-on que le r\u00e9sultat est raisonnable ?";
    h.classList.add("show");
  } else { h.classList.remove("show"); }
}

function restart(){
  validated=false; hintOpen=false;
  userAnswers=new Array(TOTAL).fill("");
  document.getElementById("results-screen").classList.remove("show");
  document.getElementById("ex-card").style.display="block";
  document.getElementById("feedback").className="feedback";
  document.getElementById("hint-box").classList.remove("show");
  document.getElementById("btn-check").disabled=false;
  document.getElementById("btn-restart-inline").style.display="none";
  document.getElementById("progress-bar").style.width="0%";
  document.getElementById("prog-pct").textContent="0\u00a0%";
  document.getElementById("prog-label").textContent="Blanc 1 / "+TOTAL;
  ["chip-rang","chip-retenues","chip-gauche","chip-multiplication","chip-ordre"].forEach(function(id){
    var c=document.getElementById(id); if(c) c.className="word-chip";
  });
  buildTexte();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* double sécurité : appel direct + window.onload */
if(document.getElementById("texte-zone")){
  buildTexte();
} else {
  window.addEventListener("load", buildTexte);
}
</script>
</body>
</html>
