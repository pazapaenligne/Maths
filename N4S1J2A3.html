<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Je relève le défi – 4ème S1 J2 · Grand Prix des Équations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PAZAPA — JE RELÈVE LE DÉFI
   4e · Semaine 1 · Jour 2 (MARDI)
   Couleur du jour : #f28b82 / #c0392b / #fff0ef / #f9c0bb
   ============================================================ */
:root{
  --jour:        #f28b82;   /* couleur principale du jour */
  --jour-fonce:  #c0392b;   /* version foncée */
  --jour-clair:  #fff0ef;   /* fond très clair */
  --jour-pale:   #f9c0bb;   /* version pâle */

  --bg:          #fffdf7;   /* fond général clair Pazapa */
  --dark:        #1a1f2e;   /* encart game sombre */
  --dark-2:      #232a3d;
  --vert:        #22c55e;
  --vert-neon:   #4ade80;
  --rouge:       #ef4444;
  --txt:         #2b2b2b;
  --gris:        #8b8b8b;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  padding: 20px 16px 50px;
}

/* ====== BULLES STATIQUES DE FOND ======
   - nettes (pas de blur), opacité douce, bulle rose retirée */
.bulle{ position:fixed; border-radius:50%; opacity:.32; z-index:0; pointer-events:none; }
.bulle-jaune  { width:200px; height:200px; background:#ffd84d; top:-60px;   right:-50px; }
.bulle-jour   { width:240px; height:240px; background:var(--jour-pale); bottom:-80px; left:-70px; }
.bulle-verte  { width:150px; height:150px; background:#9be7a5; top:45%;     right:-70px; }

.wrap{ position:relative; z-index:1; max-width:620px; margin:0 auto; }

/* ====================== HEADER ====================== */
.header{ text-align:center; margin-bottom:22px; }

.logo-badge{
  display:inline-flex; align-items:center; gap:8px;
  background: var(--jour);
  color:#3a2c00;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.72rem;
  letter-spacing:1.5px; padding:6px 14px; border-radius:20px;
  box-shadow:0 3px 10px rgba(242,139,130,.4);
  margin-bottom:12px;
}
.logo-badge .dots{ display:inline-flex; gap:3px; }
.logo-badge .dots i{ width:7px; height:7px; border-radius:50%; background:#3a2c00; display:block; }
.logo-badge .dots i:nth-child(2){ opacity:.6; }
.logo-badge .dots i:nth-child(3){ opacity:.3; }

.semaine{
  font-family:'Orbitron',sans-serif; font-size:.78rem; letter-spacing:3px;
  color:var(--gris); text-transform:uppercase; margin-bottom:6px;
}
.titre{
  font-family:'Orbitron', sans-serif; font-weight:900;
  font-size:2.3rem; line-height:1.1; color:var(--txt); margin-bottom:6px;
}
.titre .accent{ color:var(--jour); }
.sous-titre{
  font-family:'Orbitron',sans-serif; font-size:.82rem; letter-spacing:2px;
  color:var(--gris); margin-bottom:16px;
}
.sous-titre code{ color:var(--jour-fonce); font-weight:700; }

.badge-revision{
  display:inline-block;
  background: var(--jour);
  color:#3a2c00;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.82rem;
  letter-spacing:1px; padding:9px 22px; border-radius:24px;
  box-shadow:0 4px 14px rgba(242,139,130,.45);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ transform:scale(1);   box-shadow:0 4px 14px rgba(242,139,130,.45); }
  50%    { transform:scale(1.05);box-shadow:0 6px 22px rgba(242,139,130,.7); }
}

/* ================ ENCART GAME (fond clair dys-friendly) ================ */
.game{
  background: #fff;
  border:2px solid var(--jour);
  border-radius:18px;
  padding:18px 20px 16px;
  margin-bottom:24px;
  box-shadow:0 4px 16px rgba(242,139,130,.18);
}
.game-label{
  font-family:'Orbitron',sans-serif; font-size:.66rem; font-weight:700;
  letter-spacing:2px; color:var(--jour-fonce); margin-bottom:12px;
}

/* étoiles */
.etoiles{ text-align:center; margin-bottom:18px; font-size:1.55rem; letter-spacing:8px; }
.etoiles .star{ color:#e0d3d0; transition:.3s; display:inline-block; }
.etoiles .star.on{
  color:var(--jour);
  animation: pop .5s cubic-bezier(.18,.89,.32,1.6);
}
@keyframes pop{ 0%{ transform:scale(0); } 60%{ transform:scale(1.5); } 100%{ transform:scale(1); } }

/* scoreboard */
.scoreboard{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.score-col{
  background: #fdf6f5;
  border:1.5px solid #f0e0de;
  border-radius:12px; padding:12px 6px; text-align:center;
}
.score-num{ font-family:'Orbitron',sans-serif; font-weight:900; font-size:2.6rem; line-height:1; }
.score-col.reussis  { border-color:#9be7a5; }
.score-col.reussis  .score-num{ color:#157f3a; }
.score-col.restants { border-color:var(--jour-pale); }
.score-col.restants .score-num{ color:var(--jour-fonce); }
.score-col.erreurs  { border-color:#f5b5b5; }
.score-col.erreurs  .score-num{ color:#c0392b; }
.score-lbl{
  font-family:'Orbitron',sans-serif; font-size:.6rem; font-weight:700;
  letter-spacing:1.5px; color:#7a7a7a; margin-top:6px; text-transform:uppercase;
}

/* barre XP */
.xp-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.xp-head span:first-child{
  font-family:'Orbitron',sans-serif; font-size:.62rem; letter-spacing:1.5px; color:var(--jour-fonce);
}
.xp-head span:last-child{
  font-family:'Orbitron',sans-serif; font-size:.7rem; font-weight:700; color:var(--jour-fonce);
}
.xp-bar{ height:9px; background:#f3e3e1; border-radius:8px; overflow:hidden; }
.xp-fill{
  height:100%; width:0%;
  background:linear-gradient(90deg, var(--jour-fonce), var(--jour), #f9c0bb);
  border-radius:8px; transition:width .6s cubic-bezier(.22,1,.36,1);
}
.defi-count{
  text-align:center; margin-top:12px;
  font-family:'Orbitron',sans-serif; font-size:.78rem; font-weight:700;
  letter-spacing:2px; color:#7a7a7a;
}

/* ================== CARD EXERCICE ================== */
.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
}
.rainbow{
  height:6px;
  background:linear-gradient(90deg,#ff5e5e,#f28b82,#9be7a5,#3ab5d8,#a884ff,#ff5e5e);
  background-size:300% 100%;
  animation: slide 4s linear infinite;
}
@keyframes slide{ 0%{ background-position:0% 0; } 100%{ background-position:300% 0; } }

.card-body{ padding:22px 24px 24px; }

.card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; }
.defi-num{ font-family:'Orbitron',sans-serif; font-weight:700; font-size:1rem; letter-spacing:1px; color:var(--txt); }
.type-badge{
  font-family:'Orbitron',sans-serif; font-size:.62rem; font-weight:700;
  background:var(--jour-clair); color:var(--jour-fonce);
  padding:5px 11px; border-radius:14px; border:1px solid var(--jour-pale);
  white-space:nowrap;
}

/* encart énoncé : FOND CLAIR (dys-friendly) */
.texte-fable{
  background:var(--jour-clair);
  border:2px solid var(--jour);
  border-radius:14px;
  padding:18px 18px;
  margin-bottom:16px;
  text-align:center;
  box-shadow:0 2px 8px rgba(242,139,130,.12);
}
.texte-fable .ft-titre{
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.72rem;
  letter-spacing:1px; color:var(--jour-fonce); margin-bottom:10px;
}
.texte-fable .ft-expr{
  font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.4rem;
  color:var(--jour-fonce); letter-spacing:1px;
}

/* style "blocs Scratch" : pseudo-code lisible */
.scratch-script{
  display:inline-block; text-align:left;
  background:#fff; border:1.5px solid var(--jour-pale);
  border-radius:10px; padding:12px 14px;
  font-family:'Courier New', Consolas, monospace; font-size:.95rem;
  line-height:1.55; color:#2b2b2b;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
  white-space:pre;
}
.scratch-script .bloc{
  display:inline-block; padding:1px 7px; margin:1px 1px;
  border-radius:5px; font-weight:bold; color:#fff;
}
.scratch-script .b-mouv{ background:#4c97ff; }   /* mouvement bleu */
.scratch-script .b-ctrl{ background:#ffab19; }   /* contrôle orange */
.scratch-script .b-var { background:#ff8c1a; }   /* variables orange-rouge */
.scratch-script .b-op  { background:#59c059; }   /* opérateurs vert */
.scratch-script .b-look{ background:#9966ff; }   /* apparence violet */
.scratch-script .b-pen { background:#0fbd8c; }   /* stylo vert-bleu */
.scratch-script .indent{ padding-left:24px; }

/* zone figure SVG (pour les questions de tracé) */
.scratch-figure{
  display:flex; justify-content:center; align-items:center;
  margin-top:8px;
}
.scratch-figure svg{ max-width:160px; height:auto; }

.cursor{
  display:inline-block; width:3px; height:1.5rem; background:var(--jour-fonce);
  margin-left:4px; vertical-align:-4px;
  animation: blink 1s step-end infinite;
}
@keyframes blink{ 0%,50%{ opacity:1; } 51%,100%{ opacity:0; } }

.question-txt{
  font-size:1.05rem; font-weight:bold; color:var(--txt);
  margin-bottom:16px; line-height:1.5;
}

/* choix QCM */
.choix{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
.choix-btn{
  text-align:left; font-family:'Orbitron',sans-serif; font-size:1rem; font-weight:700;
  padding:14px 16px; border:2px solid #e8e2d4; background:#fff;
  border-radius:12px; cursor:pointer; transition:.15s; color:var(--txt);
  display:flex; align-items:center; gap:11px;
}
.choix-btn .choix-content{ flex:1; }
.choix-btn .choix-content svg{ max-width:140px; max-height:60px; vertical-align:middle; margin-right:10px; }
.choix-btn .lettre{
  flex-shrink:0; width:28px; height:28px; border-radius:50%;
  background:var(--jour-clair); color:var(--jour-fonce);
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.85rem;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--jour-pale);
}
.choix-btn sup{ font-size:.7rem; }
.choix-btn:hover:not(.locked){ border-color:var(--jour); background:var(--jour-clair); }
.choix-btn.selected{
  border-color:var(--jour); background:var(--jour-clair);
  box-shadow:0 0 0 3px rgba(242,139,130,.25);
}
.choix-btn.selected .lettre{ background:var(--jour); color:#fff; }
.choix-btn.locked{ cursor:default; }
.choix-btn.good{
  border-color:var(--vert); background:#e7faec;
}
.choix-btn.good .lettre{ background:var(--vert); color:#fff; }
.choix-btn.bad{
  border-color:var(--rouge); background:#fdeaea;
}
.choix-btn.bad .lettre{ background:var(--rouge); color:#fff; }

/* boutons */
.btns{ display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 4px; }
.btn{
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.82rem;
  letter-spacing:1px; padding:11px 18px; border:none; border-radius:10px;
  cursor:pointer; transition:transform .12s; color:#fff; position:relative;
}
.btn:active{ transform:scale(.96); }
.btn-valider{ background:var(--vert); }
.btn-indice{  background:#3ab5d8; }
.btn-suivant{ background:var(--jour); color:#3a2c00; }

.btn-valider:not(:disabled){ animation: neon-vert 1.4s ease-in-out infinite; }
.btn-indice:not(:disabled){  animation: neon-bleu 1.4s ease-in-out infinite; }
.btn-suivant:not(:disabled){ animation: neon-jour 1.4s ease-in-out infinite; }

@keyframes neon-vert{ 0%,100%{ box-shadow:0 0 6px rgba(34,197,94,.5);}  50%{ box-shadow:0 0 18px rgba(34,197,94,.95);} }
@keyframes neon-bleu{ 0%,100%{ box-shadow:0 0 6px rgba(58,181,216,.5);} 50%{ box-shadow:0 0 18px rgba(58,181,216,.95);} }
@keyframes neon-jour{ 0%,100%{ box-shadow:0 0 6px rgba(242,139,130,.5);} 50%{ box-shadow:0 0 18px rgba(242,139,130,.95);} }

.btn:disabled{
  background:#d8d8d8 !important; color:#fff !important;
  cursor:not-allowed; animation:none !important; box-shadow:none !important;
}

/* indice */
.indice-box{
  display:none; margin-top:14px; padding:13px 16px;
  background:#e8f6fb; border-left:4px solid #3ab5d8; border-radius:8px;
  font-size:.9rem; color:#1a6e88;
}
.indice-box.show{ display:block; animation: pop .35s ease; }

/* feedback */
.feedback{ display:none; margin-top:16px; padding:14px 16px; border-radius:10px; font-weight:bold; font-size:1rem; }
.feedback.show{ display:block; animation: pop .4s cubic-bezier(.18,.89,.32,1.6); }
.feedback.ok{  background:#e7faec; color:#157f3a; border:1px solid #9be7a5; }
.feedback.ko{  background:#fdeaea; color:#c0392b; border:1px solid #f5b5b5; }

/* correction */
.correction{
  display:none; margin-top:14px; padding:15px 18px;
  background:#fff8e6; border:1px dashed var(--jour); border-radius:10px;
  font-size:.92rem; color:#5a4500; line-height:1.6;
}
.correction.show{ display:block; animation: pop .4s ease; }
.correction b{ color:var(--jour-fonce); }

/* navigation */
.nav{ display:flex; justify-content:space-between; margin-top:20px; }
.nav button{
  font-family:'Orbitron',sans-serif; font-size:.78rem; font-weight:500;
  letter-spacing:.5px; padding:9px 16px; border-radius:8px;
  border:1px solid #ddd; background:#f7f7f7; color:#888; cursor:pointer; transition:.15s;
}
.nav button:not(:disabled):hover{ background:#eee; color:#555; }
.nav button:disabled{ opacity:.4; cursor:not-allowed; }

/* +25 XP flottant */
.xp-pop{
  position:fixed; top:45%; left:50%; transform:translate(-50%,-50%) scale(.5);
  font-family:'Orbitron',sans-serif; font-weight:900; font-size:3rem;
  color:var(--jour); text-shadow:0 0 20px var(--jour), 0 4px 10px rgba(0,0,0,.3);
  z-index:50; opacity:0; pointer-events:none;
}
.xp-pop.go{ animation: xpfly 1.2s cubic-bezier(.22,1,.36,1) forwards; }
@keyframes xpfly{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(.4); }
  25%{ opacity:1; transform:translate(-50%,-50%) scale(1.25); }
  70%{ opacity:1; transform:translate(-50%,-80%) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-130%) scale(.9); }
}

/* ================= ÉCRAN RÉSULTATS ================= */
.results{ display:none; }
.results.show{ display:block; animation: pop .5s ease; }
.results .mission{
  font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.7rem;
  text-align:center; color:var(--jour-fonce); letter-spacing:2px; margin-bottom:6px;
}
.results .big-score{
  font-family:'Orbitron',sans-serif; font-weight:900; font-size:3.4rem;
  text-align:center; color:var(--jour);
  text-shadow:0 0 16px rgba(242,139,130,.5); margin:8px 0;
}
.results .res-stars{ text-align:center; font-size:1.7rem; letter-spacing:5px; color:var(--jour); margin-bottom:10px; }
.results .gg{
  text-align:center; font-family:'Orbitron',sans-serif; font-size:.88rem;
  color:var(--vert); font-weight:700; letter-spacing:1px; margin-bottom:20px;
}
.recap{ background:#faf7ef; border-radius:12px; padding:14px 16px; margin-bottom:20px; }
.recap-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:9px 4px; border-bottom:1px solid #ece4cf; font-size:.86rem; gap:10px;
}
.recap-item:last-child{ border-bottom:none; }
.recap-item .eq{ font-weight:600; color:var(--txt); flex:1; }
.recap-item .st{ font-size:1.1rem; flex-shrink:0; }
.btn-rejouer{
  display:block; width:100%;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:1rem; letter-spacing:1px;
  padding:14px; border:none; border-radius:12px; color:#3a2c00;
  background:var(--jour); cursor:pointer;
  animation: neon-jour 1.4s ease-in-out infinite;
}
.btn-rejouer:active{ transform:scale(.97); }

/* ========== BOUTON SCORE FINAL (mode liste) ========== */
.btn-score-final{
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:1rem;
  letter-spacing:1.5px; padding:16px 32px;
  border:2px solid var(--jour); border-radius:14px;
  background:#fff; color:var(--gris);
  cursor:not-allowed; transition:all .25s;
  opacity:.55;
}
.btn-score-final:not(:disabled){
  background:linear-gradient(135deg, var(--jour) 0%, #fff8d0 50%, var(--jour) 100%);
  background-size:200% 100%;
  color:#3a2c00; cursor:pointer; opacity:1;
  border-color:var(--jour-fonce);
  animation: shine-final 2s linear infinite, pulse-final 1.6s ease-in-out infinite;
  box-shadow:0 6px 20px rgba(242,139,130,.4);
}
.btn-score-final:not(:disabled):hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(242,139,130,.5);
}
.btn-score-final:not(:disabled):active{
  transform:translateY(0) scale(.97);
}
@keyframes shine-final{
  0%{ background-position:0% 0; }
  100%{ background-position:200% 0; }
}
@keyframes pulse-final{
  0%,100%{ box-shadow:0 6px 20px rgba(242,139,130,.4); }
  50%    { box-shadow:0 8px 28px rgba(242,139,130,.7); }
}
.hint-score{
  font-family:'Orbitron',sans-serif; font-size:.7rem;
  letter-spacing:1px; color:var(--gris);
  margin-top:8px; text-transform:uppercase;
  transition:opacity .3s;
}
.hint-score.hidden{ opacity:0; }
</style>
</head>
<body>

<!-- bulles statiques de fond -->
<div class="bulle bulle-jaune"></div>
<div class="bulle bulle-jour"></div>
<div class="bulle bulle-verte"></div>

<div class="wrap">

  <!-- ===== HEADER ===== -->
  <div class="header">
    <div class="logo-badge">
      <span class="dots"><i></i><i></i><i></i></span>
      PAZAPA · MATHS · 4ÈME
    </div>
    <div class="semaine">Semaine 1 – Jour 2</div>
    <h1 class="titre">🏆 Je relève le <span class="accent">défi</span> !</h1>
    <div class="sous-titre">🏎️ Grand Prix des Équations · résoudre et gagner la course</div>
    <div class="badge-revision">▶ JEU MATHS 4ÈME</div>
    <div style="text-align:center; margin-top:10px;">
      <span class="type-badge">ÉQUATIONS</span>
    </div>
  </div>

  <!-- ===== JEU GRAND PRIX DES ÉQUATIONS ===== -->
  <div class="game">
    <div class="game-label">▶ DÉFI MATHS — JEU INTERACTIF</div>
    <div style="text-align:center; padding:6px 0 10px; font-size:.9rem; color:var(--gris); font-family:'Orbitron',sans-serif; letter-spacing:1px;">
      Résous les équations pour gagner la course !
    </div>
    <div style="width:100%; border-radius:14px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.18);">
      <iframe 
        src="https://pazapaenligne.github.io/francais/testf1.html?v=2"
        title="Grand Prix des Équations"
        style="display:block; width:100%; height:900px; min-height:80vh; border:none; background:#fff;"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true"
        allow="autoplay; fullscreen"></iframe>
    </div>
    <div style="text-align:center; padding:12px 0 4px; font-size:.78rem; color:var(--gris); font-style:italic;">
      💡 La calculatrice est intégrée directement dans le jeu
    </div>
  </div>

  </div>

</div>

<!-- Script de gestion des défis QCM supprimé : ce défi utilise un jeu interactif intégré via iframe -->

</body>
</html>
