<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths — Les blocs paramétrés · Niveau 3</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--day-color:#f5c518;--day-dark:#8a6000;--day-light:#fffbeb;--day-border:#f5e08a;--day-glow:rgba(245,197,24,.3);--bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;--yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;letter-spacing:.03em;word-spacing:.08em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--yellow);top:200px;left:-30px;pointer-events:none;}
    .head-card{width:100%;max-width:680px;background:var(--day-light);border:2px solid var(--day-border);border-radius:var(--radius);padding:1.9rem 1.5rem 1.6rem;text-align:center;position:relative;z-index:1;margin-bottom:1.3rem;}
    .head-card .logo-badge{background:var(--day-color);color:#000;font-size:14px;letter-spacing:.09em;display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .head-card .week-label{color:var(--day-dark);font-size:.95rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1 .hl{color:var(--day-dark);font-size:clamp(1.45rem,4.6vw,1.95rem);font-weight:800;display:inline-block;}
    .head-card .subtitle{color:var(--muted);font-size:1.02rem;margin-top:.5rem;font-family:'JetBrains Mono',monospace;}
    .level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;padding:.6rem 1.15rem;border-radius:12px;border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);min-height:2.9rem;display:inline-flex;align-items:center;cursor:default;}
    .level-btn.active{background:var(--day-color);color:#000;border-color:var(--day-color);box-shadow:0 3px 10px var(--day-glow);}
    .stats-card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-bottom:1.7rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.05);}
    .stats-row{display:flex;gap:.8rem;}
    .stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);border-radius:12px;padding:.9rem .5rem;text-align:center;}
    .stat-num{font-size:1.7rem;font-weight:800;color:var(--day-dark);font-family:'JetBrains Mono',monospace;line-height:1.1;}
    .stat-label{font-size:.86rem;color:var(--muted);margin-top:.25rem;}
    .prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:1rem;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s;}
    .prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;color:var(--muted);margin-top:.6rem;}
    #cards{width:100%;max-width:680px;}
    .card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.7rem 1.5rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:1.5rem;animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}
    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}
    .q-consigne{font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.7;margin-bottom:.8rem;}
    .scratch-wrap{background:#f5f5f5;border-radius:10px;padding:12px 14px;margin:.2rem 0 .9rem;border:1.5px solid #ddd;overflow-x:auto;}
    .sb-row{display:flex;flex-direction:column;gap:3px;}
    .sb{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:5px 10px;font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:700;color:#fff;white-space:nowrap;}
    .sb-hat{background:#f5a623;border-radius:18px 18px 5px 5px;padding:6px 12px;}
    .sb-orange{background:#f5a623;}.sb-blue{background:#3ab5d8;}.sb-green{background:#59c059;}.sb-purple{background:#9966ff;}.sb-pink{background:#e91e8c;}
    .sb-def{background:#e91e8c;border-radius:18px 18px 5px 5px;padding:6px 12px;}
    .sb-val{background:rgba(255,255,255,.3);border-radius:12px;padding:2px 8px;font-size:.75rem;}
    .sb-val-green{background:#3d9e3d;border-radius:12px;padding:2px 8px;font-size:.75rem;}
    .sb-txt{background:rgba(255,255,255,.25);border-radius:10px;padding:2px 8px;font-size:.75rem;}
    .sb-blank{background:rgba(255,255,255,.6);border-radius:12px;padding:2px 12px;font-size:.75rem;color:#888;font-style:italic;}
    .sb-num{background:#555;border-radius:12px;padding:2px 8px;font-size:.75rem;}
    .i1{padding-left:22px;}
    .method-box{display:none;background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.95rem 1.15rem;margin-top:.8rem;font-size:1rem;font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.85;}
    .method-box.reveal{display:block;}
    .input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.8rem;}
    .input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;}
    .answer-input{background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.15rem;padding:.5rem .85rem;outline:none;transition:border-color .2s;height:3rem;width:min(140px,40vw);text-align:center;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}
    .unit{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--day-dark);}
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.7rem 1.45rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(1rem,2.8vw,1.1rem);font-weight:800;cursor:pointer;border:none;transition:transform .12s;min-height:3.1rem;}
    .btn:active{transform:scale(.96);}.btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#000;box-shadow:0 3px 10px var(--day-glow);}
    .hint-btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.55rem 1.1rem;font-family:Arial,sans-serif;font-size:clamp(.95rem,2.5vw,1.05rem);font-weight:800;cursor:pointer;min-height:2.8rem;display:inline-flex;align-items:center;gap:.4rem;transition:transform .12s;}
    .hint-btn:active{transform:scale(.96);}
    .hint-box{margin-top:.7rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:.97rem;color:#7a6010;display:none;line-height:1.75;font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}
    .feedback{margin-top:.8rem;padding:.7rem 1rem;border-radius:10px;font-size:1rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.5rem;flex-shrink:0;}
    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,11vw,4.8rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-dark);}
    .stars{font-size:2.2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:1.05rem;margin-bottom:2rem;line-height:1.7;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .fxc-trigger{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:0;}
    .fxc-trigger svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
    .fxc-pill{background:var(--day-dark);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.04em;}
    .fxc-hidden{display:none!important;}
    .fxc-panel{position:fixed;right:14px;bottom:14px;z-index:9999;width:312px;max-width:94vw;background:#2f343b;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-family:'JetBrains Mono',monospace;overflow:hidden;border:2px solid var(--day-color);}
    .fxc-bar{background:#23272d;color:#cfd6de;font-size:12.5px;font-weight:700;padding:9px 10px;cursor:move;touch-action:none;user-select:none;display:flex;align-items:center;gap:6px;}
    .fxc-bar .fxc-sp{flex:1;}
    .fxc-icon{background:#3a4049;color:#fff;border:none;width:26px;height:26px;border-radius:7px;font-size:13px;cursor:pointer;line-height:1;}
    .fxc-icon:hover{background:var(--day-color);color:#000;}
    .fxc-help{background:#23272d;color:#aeb6bf;font-size:11.5px;line-height:1.7;padding:8px 12px;border-top:1px solid #3a4049;}
    .fxc-screen{background:#d7e3c8;margin:10px;border-radius:8px;padding:8px 10px;min-height:64px;display:flex;flex-direction:column;justify-content:center;border:2px solid #aab79a;position:relative;}
    .fxc-deg{position:absolute;top:4px;left:8px;font-size:10px;font-weight:700;color:#5a6b4a;letter-spacing:.05em;}
    .fxc-expr{font-size:13px;color:#4a5340;text-align:right;min-height:16px;word-break:break-all;line-height:1.4;}
    .fxc-res{font-size:23px;font-weight:800;color:#222;text-align:right;word-break:break-all;line-height:1.2;}
    .fxc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 10px 12px;}
    .fxc-k{background:#454c55;color:#fff;border:none;border-radius:9px;padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;cursor:pointer;min-height:40px;transition:transform .08s;}
    .fxc-k:active{transform:scale(.94);}.fxc-k:hover{background:#525a64;}
    .fxc-k.fn{background:#3a4049;font-size:12px;color:#f5c518;}
    .fxc-k.tg{background:#34506a;font-size:12.5px;color:#bfe0f5;}
    .fxc-k.op{color:#f5c518;}.fxc-k.eq{background:#3a7bd5;color:#fff;}.fxc-k.blank{background:transparent;cursor:default;}
    /* Blocs double input */
    .dual-input{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;margin-bottom:.8rem;}
    .dual-input .input-label{font-family:'JetBrains Mono',monospace;font-size:.95rem;font-weight:700;}
  </style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>
<div class="head-card">
  <div class="logo-badge"><span class="logo-dot" style="background:#f5c518"></span><span class="logo-dot" style="background:#8dc63f"></span><span class="logo-dot" style="background:#3ab5d8"></span> PAZAPA &middot; MATHS &middot; 3&Egrave;ME</div>
  <div class="week-label">Semaine 5 &ndash; Jour 5</div>
  <h1><span class="hl">&#128640; Les blocs param&eacute;tr&eacute;s</span></h1>
  <p class="subtitle">Algorithmique &middot; s&eacute;rie d&rsquo;exercices</p>
  <div class="level-row">
    <span class="level-btn">Niveau 1</span>
    <span class="level-btn">Niveau 2</span>
    <span class="level-btn active">Niveau 3</span>
  </div>
</div>
<div class="stats-card"><div class="stats-row">
  <div class="stat-box"><div class="stat-num" id="st-ok">0</div><div class="stat-label">R&eacute;ussies</div></div>
  <div class="stat-box"><div class="stat-num" id="st-rem">5</div><div class="stat-label">Restantes</div></div>
  <div class="stat-box"><div class="stat-num" id="st-err">0</div><div class="stat-label">&Eacute;chou&eacute;es</div></div>
</div><div class="prog-bg"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
<div class="prog-text" id="prog-text">0 / 3</div></div>
<div id="cards"></div>
<section class="results" id="results"><div class="results-card">
  <div style="font-size:.8rem;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;">R&eacute;sultats</div>
  <div class="results-score"><span class="s-num" id="res-score">0 / 5</span></div>
  <div class="stars" id="stars"></div>
  <p class="results-msg" id="res-msg"></p>
  <button class="btn btn-primary" onclick="restart()">&#8635; Recommencer</button>
</div></section>
<script>
var QS=[
  {
    cons:"Une élève souhaite dessiner un octogone régulier avec Scratch.\nPar quelles valeurs doit-on compléter les lignes 3 et 5 du bloc personnalisé pour obtenir un octogone régulier ?",
    label:"Ligne 3 (répéter) =",label2:"Ligne 5 (tourner de) =",
    answers:["8"],answers2:["45"],
    show:"Ligne 3 = 8 et Ligne 5 = 45°",
    hint:"Un octogone a 8 côtés. À chaque coin, le lutin tourne de 360° ÷ 8.",
    fig:'<div class="scratch-wrap"><div class="sb-row"><span class="sb sb-def">définir <span class="sb-txt">octogone régulier</span></span><span class="sb sb-green">stylo en position d’écriture</span><span class="sb sb-orange">répéter <span class="sb-blank">? ligne 3</span> fois</span><span class="sb sb-blue i1">avancer de <span class="sb-val">70</span> pas</span><span class="sb sb-blue i1">tourner de <span class="sb-blank">? ligne 5</span> degrés</span></div></div>',
    method:"Pour obtenir un octogone régulier, il faut répéter 8 fois et tourner de 360 ÷ 8 = 45 degrés.",
    unit:"",unit2:"°",dual:true
  },
  {
    cons:"Donner la série de couleurs affichées par ce programme.\n\nLe bloc « Note la couleur » donne la couleur de la case sur laquelle est positionné le lutin.\n\nCouleur N° 1 :",
    label:"_QCM_",answers:["Noir","noir"],show:"Noir",
    hint:"Le lutin part de (-15 ; 45). La première case visitée est noire.",
    fig:'<div class="scratch-wrap"><div class="sb-row"><span class="sb sb-hat">quand la touche <span class="sb-val">a</span> est pressée</span><span class="sb sb-green">effacer tout</span><span class="sb sb-blue">aller à x : <span class="sb-val">-15</span> y : <span class="sb-val">45</span></span><span class="sb sb-blue">s’orienter à <span class="sb-val">90</span></span><span class="sb sb-green">stylo en position d’écriture</span><span class="sb sb-orange">répéter <span class="sb-val">2</span> fois</span><span class="sb sb-orange i1">répéter <span class="sb-val">2</span> fois</span><span class="sb sb-blue i1">avancer de <span class="sb-val">60</span> pas</span><span class="sb sb-blue i1">tourner ↻ de <span class="sb-val">90</span> degrés</span><span class="sb sb-blue i1">avancer de <span class="sb-val">30</span> pas</span><span class="sb sb-blue i1">tourner ↺ de <span class="sb-val">90</span> degrés</span><span class="sb sb-pink i1">Note la couleur</span><span class="sb sb-blue">tourner ↻ de <span class="sb-val">90</span> degrés</span><span class="sb sb-green">relever le stylo</span><span class="sb sb-orange">stop <span class="sb-val">tout</span></span></div></div>',
    method:"On obtient la série de couleurs suivante :\nNoir - Gris - Bleu - Jaune",
    unit:"",qcm:true,qcmN:1
  },
  {
    cons:"Même programme.\n\nCouleur N° 2 :",
    label:"_QCM_",answers:["Gris","gris"],show:"Gris",
    hint:"C’est la deuxième couleur notée par le programme.",
    fig:'',method:"Couleur N°2 : Gris",unit:"",qcm:true,qcmN:2
  },
  {
    cons:"Même programme.\n\nCouleur N° 3 :",
    label:"_QCM_",answers:["Bleu","bleu"],show:"Bleu",
    hint:"C’est la troisième couleur notée par le programme.",
    fig:'',method:"Couleur N°3 : Bleu",unit:"",qcm:true,qcmN:3
  },
  {
    cons:"Même programme.\n\nCouleur N° 4 :",
    label:"_QCM_",answers:["Jaune","jaune"],show:"Jaune",
    hint:"C’est la quatrième et dernière couleur notée par le programme.",
    fig:'',method:"Couleur N°4 : Jaune\nSérie complète : Noir - Gris - Bleu - Jaune",
    unit:"",qcm:true,qcmN:4
  }
]
var TOTAL=QS.length;
var state=[];
function $(id){return document.getElementById(id);}
function okAns(raw,q){
  var v=raw.trim().replace(/,/,".");
  for(var i=0;i<q.answers.length;i++){if(v===q.answers[i]||v.toLowerCase()===q.answers[i].toLowerCase())return true;}

function buildCards(){
  state=[];for(var i=0;i<TOTAL;i++)state.push({done:false,ok:false,errored:false,done2:false});
  var html="";
  for(var i=0;i<TOTAL;i++){
    var q=QS[i];
    var consHtml=q.cons.replace(/\n/g,"<br>");
    html+='<div class="card" id="card'+i+'"><div class="card-stripe"></div>'
      +'<div class="q-num">Question '+(i+1)+' / '+TOTAL+'</div>'
      +'<div class="q-consigne">'+consHtml+'</div>'
      +(q.fig?q.fig:'');
    if(q.qcm){
      var couleurs=["Blanc","Vert","Bleu","Rouge","Noir","Rose","Orange","Jaune","Gris"];
      var radios='<div style="display:flex;flex-wrap:wrap;gap:8px 4px;margin:10px 0;">';
      couleurs.forEach(function(col){radios+='<span style="display:inline-flex;align-items:center;gap:5px;"><input type="radio" name="qcm'+i+'" id="qcm'+i+'_'+col+'" value="'+col+'" style="accent-color:var(--day-color);width:16px;height:16px;"><label for="qcm'+i+'_'+col+'" style="font-size:.97rem;cursor:pointer;">'+col+'</label></span>';});
      radios+='</div>';
      html+=radios;
      if(q.qcmN===1){html+='<img src="data:image/jpeg;base64,'+GRILLE_B64+'" alt="Grille couleurs" style="width:100%;max-width:500px;border-radius:8px;border:1.5px solid var(--day-border);display:block;margin:8px 0;">';}
    } else if(q.dual){
      html+='<div class="dual-input">'
        +'<span class="input-label">'+q.label+'</span>'
        +'<input type="text" class="answer-input" id="in'+i+'" placeholder="?" autocomplete="off" style="width:min(90px,30vw);"/>'
        +'</div>'
        +'<div class="dual-input">'
        +'<span class="input-label">'+q.label2+'</span>'
        +'<input type="text" class="answer-input" id="in'+i+'b" placeholder="?" autocomplete="off" style="width:min(90px,30vw);"/>'
        +(q.unit2?'<span class="unit">'+q.unit2+'</span>':'')
        +'</div>';
    } else {
      html+='<div class="input-row"><span class="input-label">'+q.label+'</span>'
        +'<input type="text" class="answer-input" id="in'+i+'" placeholder="?" autocomplete="off"/>'
        +(q.unit?'<span class="unit">'+q.unit+'</span>':'')+'</div>';
    }
    html+='<div class="btn-row">'
      +'<button class="btn btn-primary" id="vb'+i+'" onclick="chk('+i+')">&#10003; V\u00e9rifier</button>'
      +'<button class="hint-btn" id="hb'+i+'" onclick="showHint('+i+')">&#128161; Indice</button>'
      +'</div>'
      +'<div class="hint-box" id="hint'+i+'">'+q.hint+'</div>'
      +'<div class="method-box" id="method'+i+'" style="white-space:pre-line">'+q.method+'</div>'
      +'<div class="feedback" id="fb'+i+'"><span class="feedback-icon" id="fbi'+i+'"></span><div><span id="fbt'+i+'"></span></div></div></div>';
  }
  $("cards").innerHTML=html;
  for(var j=0;j<TOTAL;j++){
    (function(k){
      var inp=$("in"+k);
      if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter")chk(k);});
      var inp2=$("in"+k+"b");
      if(inp2)inp2.addEventListener("keydown",function(e){if(e.key==="Enter")chk(k);});
    })(j);
  }
}
function showHint(i){$("hint"+i).className="hint-box show";}
function showCorr(i){
  $("method"+i).className="method-box reveal";
  $("fbt"+i).innerHTML="Correction : <strong>"+QS[i].show+"</strong>.";
}
function chk(i){
  if(state[i].done)return;
  var q=QS[i];
  var raw;
  if(q.qcm){
    var sel=document.querySelector('input[name="qcm'+i+'"]:checked');
    raw=sel?sel.value:"";
  } else {
    raw=$("in"+i)?$("in"+i).value.trim():"";
  }
  var ok=okAns(raw,q);
  if(q.dual){
    var raw2=$("in"+i+"b")?$("in"+i+"b").value.trim():"";
    var ok2=false;
    for(var j=0;j<q.answers2.length;j++){if(raw2===q.answers2[j])ok2=true;}
    ok=ok&&ok2;
  }
  if(raw===""&&!q.dual&&!q.qcm){if($("in"+i))$("in"+i).focus();return;}
  if(ok){
    state[i].done=true;state[i].ok=true;
    if($("in"+i))$("in"+i).disabled=true;$("vb"+i).disabled=true;
    if($("in"+i+"b"))$("in"+i+"b").disabled=true;
    if($("in"+i))$("in"+i).className="answer-input correct-input";
    if($("in"+i+"b"))$("in"+i+"b").className="answer-input correct-input";
    $("fb"+i).className="feedback show ok";$("fbi"+i).textContent="\u2713";
    var vb2=document.createElement("button");vb2.textContent="Voir la correction";vb2.className="btn";vb2.style.cssText="background:var(--green);color:#fff;margin-top:.4rem;";(function(ii){vb2.onclick=function(){showCorr(ii);};})(i);
    $("fbt"+i).innerHTML="Bravo\u00a0! Tu as compris le fonctionnement du bloc param\u00e9tr\u00e9.\u00a0";$("fbt"+i).appendChild(vb2);
    update();
  } else if(!state[i].errored){
    state[i].errored=true;
    if($("in"+i))$("in"+i).className="answer-input wrong-input";
    if($("in"+i+"b"))$("in"+i+"b").className="answer-input wrong-input";
    $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";
    $("fbt"+i).innerHTML="Pas tout \u00e0 fait \u2014 r\u00e9essaie\u00a0!";
    $("vb"+i).innerHTML="\u21bb R\u00e9essayer";
    $("vb"+i).setAttribute("onclick","retry("+i+")");
  } else {
    state[i].done=true;state[i].ok=false;
    if($("in"+i))$("in"+i).disabled=true;$("vb"+i).disabled=true;
    if($("in"+i+"b"))$("in"+i+"b").disabled=true;
    if($("hb"+i)){$("hb"+i).disabled=true;$("hb"+i).style.opacity=".4";$("hb"+i).style.cursor="default";}
    if($("in"+i))$("in"+i).className="answer-input wrong-input";
    $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";
    var vcb=document.createElement("button");vcb.textContent="Voir la correction";vcb.className="btn";vcb.style.cssText="background:var(--pink);color:#fff;margin-top:.5rem;";(function(ii){vcb.onclick=function(){showCorr(ii);};})(i);$("fbt"+i).innerHTML="\u00c9chec.\u00a0";$("fbt"+i).appendChild(vcb);
    update();
  }
}
function retry(i){
  var q=QS[i];
  if(q.qcm){var s=document.querySelector('input[name="qcm'+i+'"]:checked');if(s)s.checked=false;}
  else{if($("in"+i)){$("in"+i).value="";$("in"+i).className="answer-input";$("in"+i).focus();}
  if($("in"+i+"b")){$("in"+i+"b").value="";$("in"+i+"b").className="answer-input";}}
  $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u270f\ufe0f";
  $("fbt"+i).innerHTML="Corrige puis v\u00e9rifie \u00e0 nouveau.";
  $("vb"+i).innerHTML="&#10003; V\u00e9rifier";$("vb"+i).setAttribute("onclick","chk("+i+")");
}
function update(){
  var done=0,ok=0;for(var i=0;i<TOTAL;i++){if(state[i].done){done++;if(state[i].ok)ok++;}}
  $("st-ok").textContent=ok;$("st-err").textContent=done-ok;$("st-rem").textContent=TOTAL-done;
  $("pfill").style.width=Math.round(done/TOTAL*100)+"%";$("prog-text").textContent=done+" / "+TOTAL;
  if(done===TOTAL)showResults(ok);
}
function showResults(ok){
  $("res-score").textContent=ok+" / "+TOTAL;
  var stars=(ok===TOTAL)?5:Math.max(1,Math.round(ok/TOTAL*5));var st="";for(var s=0;s<5;s++)st+=(s<stars?"\u2b50":"\u2606");$("stars").textContent=st;
  var err=TOTAL-ok,msg;
  if(err===0)msg="Parfait\u00a0! Tu ma\u00eetrises les blocs param\u00e9tr\u00e9s.";
  else if(err<=1)msg="Tr\u00e8s bien\u00a0! Encore un peu d\u2019entra\u00eenement.";
  else msg="\u00c0 retravailler avec la correction.";
  $("res-msg").textContent=msg;$("results").className="results show";$("results").scrollIntoView({behavior:"smooth"});
}
function restart(){buildCards();$("results").className="results";update();window.scrollTo({top:0,behavior:"smooth"});}
buildCards();update();
</script>

    <button class="fxc-icon" id="fxc-help-btn" type="button">?</button>
    <button class="fxc-icon" id="fxc-close-btn" type="button">&#10005;</button>
  </div>
  <div class="fxc-help fxc-hidden" id="fxc-help">cos sin tan &middot; &divide;R reste &middot; FACT &middot; PGCD &middot; PPCM &middot; a/b &middot; &radic; x&sup2; ^</div>
  <div class="fxc-screen"><span class="fxc-deg">DEG</span><div class="fxc-expr" id="fxc-expr"></div><div class="fxc-res" id="fxc-res">0</div></div>
  <div class="fxc-keys" id="fxc-keys"></div>
</div>
<script>
(function(){
  var expr="";var E=function(id){return document.getElementById(id);};
  var KEYS=[["cos(","tg","cos("],["sin(","tg","sin("],["tan(","tg","tan("],["cos\u207b\u00b9(","tg","cos\u207b\u00b9("],["AC","fn","AC"],["FACT(","fn","FACT("],["PGCD(","fn","PGCD("],["PPCM(","fn","PPCM("],["a/b","fn","SIMP("],["DEL","fn","DEL"],["(","op","("],[")","op",")"],[";","op",";"],["\u00f7R","op","\u00f7R"],["√(","op","√("],["7","","7"],["8","","8"],["9","","9"],["\u00f7","op","\u00f7"],["x\u00b2","op","\u00b2"],["4","","4"],["5","","5"],["6","","6"],["×","op","×"],["^","op","^"],["1","","1"],["2","","2"],["3","","3"],["\u2212","op","\u2212"],["(\u2212)","op","(\u2212)"],["0","","0"],[",","",","],["+","op","+"],["\u003d","eq","\u003d"],["","blank",""]];
  function render(){E("fxc-expr").textContent=expr;}
  function press(v){if(v==="AC"){expr="";E("fxc-res").textContent="0";render();return;}if(v==="DEL"){del();return;}if(v==="\u003d"){E("fxc-res").textContent=evaluate(expr);return;}if(v==="")return;expr+=v;render();}
  function del(){var toks=["cos\u207b\u00b9(","FACT(","PGCD(","PPCM(","SIMP(","cos(","sin(","tan(","√(","\u00f7R","(\u2212)"];for(var i=0;i<toks.length;i++){if(expr.slice(-toks[i].length)===toks[i]){expr=expr.slice(0,-toks[i].length);render();return;}}expr=expr.slice(0,-1);render();}
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
  function evaluate(raw){try{var s=(raw||"").trim();if(s==="")return"0";s=s.replace(/cos\u207b\u00b9\(/g,"acos(").replace(/×/g,"*").replace(/\u00f7/g,"/").replace(/\u00b2/g,"^2").replace(/√/g,"sqrt").replace(/\(\u2212\)/g,"-").replace(/\u2212/g,"-").replace(/,/g,".").replace(/\s+/g,"");var pos=0;function pk(){return s.charAt(pos);}function ex(){var v=tm();while(pk()==="+"||pk()==="-"){var o=s.charAt(pos++);v=(o==="+")?v+tm():v-tm();}return v;}function tm(){var v=fc();while(pk()==="*"||pk()==="/"){var o=s.charAt(pos++);var f=fc();v=(o==="*")?v*f:v/f;}return v;}function fc(){var b=ba();if(pk()==="^"){pos++;return Math.pow(b,fc());}return b;}function ba(){if(pk()==="-"){pos++;return -ba();}if(pk()==="("){pos++;var v=ex();pos++;return v;}if(s.substr(pos,5)==="acos("){pos+=5;var v=ex();pos++;return Math.acos(v)/(Math.PI/180);}if(s.substr(pos,4)==="cos("){pos+=4;var v=ex();pos++;return Math.cos(v*(Math.PI/180));}if(s.substr(pos,4)==="sin("){pos+=4;var v=ex();pos++;return Math.sin(v*(Math.PI/180));}if(s.substr(pos,4)==="tan("){pos+=4;var v=ex();pos++;return Math.tan(v*(Math.PI/180));}if(s.substr(pos,5)==="sqrt("){pos+=5;var v=ex();pos++;return Math.sqrt(v);}var st=pos;while(pos<s.length&&/[0-9.]/.test(s.charAt(pos)))pos++;if(pos===st)throw 0;return parseFloat(s.substr(st,pos-st));}var r=ex();return String(Math.round(r*1e9)/1e9).replace(".",",");}catch(e){return"Erreur";}}
  var kc=E("fxc-keys");KEYS.forEach(function(k){var btn=document.createElement("button");btn.type="button";btn.className="fxc-k "+(k[1]||"");btn.textContent=k[0];if(k[1]!=="blank")btn.addEventListener("click",function(){press(k[2]);});kc.appendChild(btn);});
  window.fxcOpen=function(){E("fxc-open").classList.add("fxc-hidden");E("fxc-panel").classList.remove("fxc-hidden");};
  window.fxcClose=function(){E("fxc-panel").classList.add("fxc-hidden");E("fxc-open").classList.remove("fxc-hidden");};
  window.fxcHelp=function(){E("fxc-help").classList.toggle("fxc-hidden");};
  E("fxc-close-btn").addEventListener("click",function(e){e.stopPropagation();fxcClose();});
  E("fxc-help-btn").addEventListener("click",function(e){e.stopPropagation();fxcHelp();});
  var bar=E("fxc-bar"),panel=E("fxc-panel"),drag=false,sx,sy,ox,oy,conv=false;
  bar.addEventListener("pointerdown",function(e){if(e.target.classList.contains("fxc-icon"))return;drag=true;conv=false;sx=e.clientX;sy=e.clientY;var r=panel.getBoundingClientRect();ox=r.left;oy=r.top;bar.setPointerCapture(e.pointerId);});
  bar.addEventListener("pointermove",function(e){if(!drag)return;if(!conv){panel.style.right="auto";panel.style.bottom="auto";panel.style.left=ox+"px";panel.style.top=oy+"px";conv=true;}var nx=ox+(e.clientX-sx),ny=oy+(e.clientY-sy);nx=Math.max(4,Math.min(window.innerWidth-panel.offsetWidth-4,nx));ny=Math.max(4,Math.min(window.innerHeight-panel.offsetHeight-4,ny));panel.style.left=nx+"px";panel.style.top=ny+"px";});
  bar.addEventListener("pointerup",function(e){drag=false;try{bar.releasePointerCapture(e.pointerId);}catch(_){}});
})();
</script>
</body>
</html>
