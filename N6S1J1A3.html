<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Semaine 1 Jour 1 – Quiz numération</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--day-color:#f5a623;--day-dark:#c47a10;--day-light:#fff5e0;--day-border:#f5d080;--day-glow:rgba(245,166,35,.3);}
    :root{--bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;--yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.6rem 1rem 3.5rem;position:relative;overflow-x:hidden;letter-spacing:.02em;word-spacing:.06em;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--pink);top:200px;left:-30px;pointer-events:none;}
    header{text-align:center;margin-bottom:1.4rem;position:relative;z-index:1;max-width:100%;}
    .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;white-space:nowrap;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:.5rem;}
    h1{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:800;line-height:1.3;word-break:break-word;}
    h1 .hl{color:var(--day-color);}
    .subtitle{color:var(--muted);font-size:clamp(.8rem,2.5vw,.88rem);margin-top:.4rem;font-family:'JetBrains Mono',monospace;word-break:break-word;}
    .scorebar{position:sticky;top:0;z-index:5;width:100%;max-width:760px;background:var(--surface);border:2px solid var(--border);border-radius:99px;padding:.5rem .9rem;margin-bottom:1.4rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.06);}
    .scorebar .sb-label{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;color:var(--day-dark);white-space:nowrap;}
    .sb-track{flex:1;min-width:120px;height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
    .sb-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}
    .chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:99px;font-size:.74rem;font-family:'JetBrains Mono',monospace;white-space:nowrap;border:1.5px solid var(--border);background:var(--bg);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong .dot{background:var(--pink);}
    .card{width:100%;max-width:760px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.6rem 1.4rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;margin-bottom:1.4rem;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}
    .q-num{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.64rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.7rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);white-space:nowrap;}
    .q-text{font-size:clamp(1rem,3vw,1.18rem);font-weight:700;color:var(--text);line-height:1.6;margin-bottom:1.1rem;word-break:break-word;}
    .q-text .blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--day-color);margin:0 .2rem;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;padding:0 .3rem;transition:background .15s,color .15s;}
    .q-text .blank.filled{background:var(--day-light);border:2px solid var(--day-border);border-radius:8px;color:var(--day-dark);font-weight:700;}
    .q-text .blank.correct-blank{background:#f0faeb;border:2px solid var(--green);color:#2f6e10;font-weight:700;}
    .q-text .blank.wrong-blank{background:#fff0ef;border:2px solid var(--pink);color:#c0392b;font-weight:700;}
    .q-text .num{font-family:'JetBrains Mono',monospace;color:var(--day-dark);white-space:nowrap;}
    .method-box{background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.75rem 1rem;margin-bottom:1.1rem;font-size:clamp(.78rem,2.4vw,.84rem);font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.8;word-break:break-word;}
    .method-box strong{color:var(--day-color);}
    /* options : QCM vertical, ou pastilles (chiffres / mots) */
    .opt-list{display:flex;flex-direction:column;gap:.55rem;position:relative;z-index:2;}
    .opt-wrap{display:flex;flex-wrap:wrap;gap:.55rem;position:relative;z-index:2;}
    .opt-btn{display:flex;align-items:center;gap:.7rem;text-align:left;padding:.7rem .95rem;border:2px solid var(--border);border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(.9rem,2.6vw,1rem);font-weight:600;cursor:pointer;background:var(--bg);color:var(--text);min-height:44px;line-height:1.5;word-break:break-word;transition:transform .12s,border-color .15s,background .15s;}
    .opt-btn:hover:not(.locked){border-color:var(--day-color);}
    .opt-btn:active{transform:scale(.98);}
    .opt-btn.selected{border-color:var(--day-color);background:var(--day-light);}
    .opt-btn.correct-opt{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .opt-btn.wrong-opt{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .opt-btn.locked{cursor:default;}
    .opt-mark{font-family:'JetBrains Mono',monospace;font-weight:700;width:1.6rem;flex-shrink:0;text-align:center;color:var(--day-dark);}
    /* pastille (mot/chiffre) : centrée, plus compacte */
    .pill{justify-content:center;min-width:64px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.05rem;padding:.65rem 1.1rem;}
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;position:relative;z-index:2;margin-top:1.1rem;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(.85rem,2.5vw,.95rem);font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;position:relative;z-index:2;min-height:44px;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}
    .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:clamp(.8rem,2.4vw,.85rem);color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;word-break:break-word;}
    .hint-box.show{display:block;}
    .feedback{margin-top:1.1rem;padding:.8rem 1rem;border-radius:10px;font-size:clamp(.86rem,2.5vw,.92rem);display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:clamp(.76rem,2.3vw,.82rem);margin-top:.3rem;line-height:1.8;word-break:break-word;}
    .global{width:100%;max-width:760px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 1.6rem;text-align:center;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .global-score{font-size:clamp(2.6rem,11vw,4.5rem);font-weight:800;line-height:1;margin:.4rem 0;}
    .global-score .s-num{color:var(--day-color);}
    .stars{font-size:1.9rem;margin:.3rem 0 .9rem;}
    .global-msg{color:var(--text);font-size:clamp(.86rem,2.6vw,.94rem);margin-bottom:1.4rem;font-weight:600;line-height:1.7;word-break:break-word;min-height:1.4rem;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .card,.global{animation:fadeUp .4s ease both;}
    @media(max-width:480px){
      body{padding:1.2rem .75rem 3rem;}
      .card{padding:1.3rem 1.1rem;}
      .btn-row .btn{flex:1 1 100%;width:100%;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 6&egrave;me
    </div>
    <div class="week-label">Semaine 1 &ndash; Jour 1</div>
    <h1>Quiz <span class="hl">numération</span></h1>
    <p class="subtitle">6 questions &middot; chiffres, classes, écriture &middot; niveau 6&egrave;me</p>
  </header>

  <div class="scorebar">
    <span class="sb-label" id="sb-label">0 / 6 questions réussies</span>
    <div class="sb-track"><div class="sb-fill" id="sb-fill"></div></div>
    <span class="chip correct"><span class="dot"></span><span id="sb-ok">0</span></span>
    <span class="chip wrong"><span class="dot"></span><span id="sb-ko">0</span></span>
  </div>

  <div id="exos"></div>

  <div class="global">
    <div class="q-num">Bilan</div>
    <div class="global-score"><span class="s-num" id="g-num">0</span>/6</div>
    <div class="stars" id="g-stars">&#9734;&#9734;&#9734;&#9734;&#9734;</div>
    <div class="global-msg" id="g-msg">Réponds aux 6 questions puis vérifie-les pour voir ton bilan.</div>
    <button class="btn btn-primary" onclick="restartAll()" style="margin:0 auto;display:flex;">&#128260; Tout recommencer</button>
  </div>

<script>
/* ════════════════════════════════════════════════════════════
   Quiz numération — Semaine 1 Jour 1
   Page unique, 100% autonome, compatible Moodle. Contenu vérifié :
   Q1 Chiffre · Q2 912 (B) · Q3 Faux · Q4 3 · Q5 203 050 008 (C) · Q6 Vrai
════════════════════════════════════════════════════════════ */

var QUESTIONS = [
  {
    theme:"Vocabulaire", style:"pill",
    text:"Un <span class='blank' id='blank-0'>?</span> est un symbole que l&rsquo;on utilise pour écrire un nombre.",
    options:["Chiffre","Nombre","Classe","Tableau"], ans:0,
    method:"<strong>Rappel :</strong> les chiffres (0 à 9) servent à écrire les nombres, comme les lettres servent à écrire les mots.",
    explain:"Un chiffre est un symbole (0, 1, 2&hellip; 9). Avec les chiffres, on écrit les nombres.",
    hint:"Pense aux lettres pour les mots : qu&rsquo;est-ce qui joue ce rôle pour les nombres ?"
  },
  {
    theme:"Classes", style:"list",
    text:"Dans le nombre <span class='num'>248 912 763 305</span>, quelle est la classe des millions ?",
    options:["305","912","763","248"], ans:1,
    method:"<strong>Méthode :</strong> découpe en tranches de 3 depuis la droite : 248 | 912 | 763 | 305 = milliards | millions | mille | unités.",
    explain:"248 | 912 | 763 | 305 : la classe des millions est 912.",
    hint:"La classe des unités est tout à droite (305), puis mille (763), puis millions&hellip;"
  },
  {
    theme:"Vrai ou Faux", style:"list",
    text:"Un nombre entier peut contenir une virgule.",
    options:["Vrai","Faux"], ans:1,
    method:"<strong>Rappel :</strong> un nombre entier n&rsquo;a pas de partie après la virgule. La virgule sépare la partie entière de la partie décimale.",
    explain:"Faux : un nombre entier ne contient pas de virgule (ex : 25, 1 000). La virgule apparaît dans les nombres décimaux.",
    hint:"À quoi sert la virgule ? À séparer l&rsquo;entier des décimales&hellip;"
  },
  {
    theme:"Classes", style:"pill",
    text:"Chaque classe est divisée en <span class='blank' id='blank-3'>?</span> colonnes : centaine, dizaine et unité.",
    options:["3","2","4","5"], ans:0,
    method:"<strong>Rappel :</strong> dans chaque classe (unités, mille, millions&hellip;) il y a 3 rangs : centaine, dizaine, unité.",
    explain:"Chaque classe a 3 colonnes : centaine, dizaine, unité.",
    hint:"Compte : centaine, dizaine, unité&hellip; ça fait combien ?"
  },
  {
    theme:"Écriture", style:"list",
    text:"Comment écrit-on en chiffres : « deux cent trois millions cinquante mille huit » ?",
    options:["203 050 080","203 500 008","203 050 008","203 005 008"], ans:2,
    method:"<strong>Méthode :</strong> deux cent trois millions = 203 000 000 ; cinquante mille = 50 000 ; huit = 8. On additionne.",
    explain:"203 000 000 + 50 000 + 8 = 203 050 008.",
    hint:"Écris chaque morceau : 203 millions, puis 50 mille, puis 8, et place bien les zéros."
  },
  {
    theme:"Vrai ou Faux", style:"list",
    text:"Dans le nombre <span class='num'>957 321 864</span>, le chiffre des centaines de millions est 9.",
    options:["Vrai","Faux"], ans:0,
    method:"<strong>Méthode :</strong> découpe : 957 | 321 | 864 = millions | mille | unités. Dans 957 (classe des millions), 9 est le chiffre des centaines de millions.",
    explain:"957 321 864 : la classe des millions est 957, donc le chiffre des centaines de millions est bien 9. Vrai.",
    hint:"Regarde la classe des millions (957) : quel est son chiffre des centaines ?"
  }
];

var TOTAL = QUESTIONS.length;
var $ = function(id){ return document.getElementById(id); };
var state = QUESTIONS.map(function(){ return { done:false, ok:false, sel:null }; });

function buildAll(){
  var root = $("exos"); root.innerHTML = "";
  QUESTIONS.forEach(function(q, ei){
    var card = document.createElement("div");
    card.className = "card"; card.id = "card-" + ei;
    card.innerHTML =
      '<div class="card-stripe"></div>' +
      '<div class="q-num">Question ' + (ei+1) + '</div>' +
      '<div class="theme-badge">' + q.theme + '</div>' +
      '<div class="q-text">' + q.text + '</div>' +
      '<div class="method-box">' + q.method + '</div>' +
      '<div id="zone-' + ei + '"></div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="check-' + ei + '">&#10003; Vérifier</button>' +
        '<button class="btn btn-hint" id="hintbtn-' + ei + '">? Indice</button>' +
        '<button class="btn btn-ghost" id="redo-' + ei + '" style="display:none;">&#128260; Refaire</button>' +
      '</div>' +
      '<div class="hint-box" id="hint-' + ei + '"></div>' +
      '<div class="feedback" id="fb-' + ei + '">' +
        '<span class="feedback-icon" id="fbi-' + ei + '"></span>' +
        '<div><div id="fbm-' + ei + '"></div><div class="feedback-detail" id="fbd-' + ei + '"></div></div>' +
      '</div>';
    root.appendChild(card);
    $("check-" + ei).onclick = (function(i){ return function(){ checkEx(i); }; })(ei);
    $("hintbtn-" + ei).onclick = (function(i){ return function(){ toggleHint(i); }; })(ei);
    $("redo-" + ei).onclick = (function(i){ return function(){ redoEx(i); }; })(ei);
    renderZone(ei);
  });
  updateGlobal();
}

function renderZone(ei){
  var q = QUESTIONS[ei], st = state[ei];
  var zone = $("zone-" + ei); zone.innerHTML = "";
  var wrap = document.createElement("div");
  wrap.className = (q.style === "pill") ? "opt-wrap" : "opt-list";
  var letters = ["A","B","C","D"];
  q.options.forEach(function(opt, oi){
    var b = document.createElement("button"); b.type = "button";
    b.className = "opt-btn" + (q.style === "pill" ? " pill" : "");
    if(q.style !== "pill"){
      var mark = document.createElement("span"); mark.className = "opt-mark"; mark.textContent = letters[oi];
      var t = document.createElement("span"); t.textContent = opt;
      b.appendChild(mark); b.appendChild(t);
    } else {
      b.textContent = opt;
    }
    if(st.done){
      b.classList.add("locked");
      if(oi === st.sel) b.classList.add(oi === q.ans ? "correct-opt" : "wrong-opt");
      if(oi === q.ans && st.sel !== q.ans) b.classList.add("correct-opt");
    } else {
      if(st.sel === oi) b.classList.add("selected");
      b.onclick = (function(o){ return function(){
        st.sel = o;
        var sibs = wrap.querySelectorAll(".opt-btn");
        sibs.forEach(function(s){ s.classList.remove("selected"); });
        this.classList.add("selected");
        updateBlank(ei);   /* le mot choisi remplit le trou */
      };})(oi);
    }
    wrap.appendChild(b);
  });
  zone.appendChild(wrap);
  updateBlank(ei);   /* synchronise le trou avec l'état courant */
}

/* Met à jour le « trou » de la phrase (questions à trou : style pill) */
function updateBlank(ei){
  var q = QUESTIONS[ei], st = state[ei];
  var blank = $("blank-" + ei);
  if(!blank) return;  /* la question n'a pas de trou */
  blank.className = "blank";
  if(st.sel === null){
    blank.textContent = "?";
    return;
  }
  blank.textContent = q.options[st.sel];
  if(st.done){
    blank.classList.add(st.sel === q.ans ? "correct-blank" : "wrong-blank");
  } else {
    blank.classList.add("filled");
  }
}

function checkEx(ei){
  var q = QUESTIONS[ei], st = state[ei];
  if(st.sel === null) return;
  st.ok = (st.sel === q.ans);
  st.done = true;
  var detail = st.ok
    ? q.explain
    : ("Bonne réponse : <strong>" + q.options[q.ans] + "</strong>. " + q.explain);
  showFb(ei, st.ok, st.ok ? "Bravo ! Bonne réponse." : "Pas tout à fait\u2026", detail);
  finishEx(ei);
}

function finishEx(ei){
  renderZone(ei);
  $("check-"+ei).disabled = true;
  $("check-"+ei).style.display = "none";
  $("redo-"+ei).style.display = "inline-flex";
  updateGlobal();
}

function redoEx(ei){
  state[ei] = { done:false, ok:false, sel:null };
  $("fb-"+ei).className = "feedback";
  $("hint-"+ei).classList.remove("show");
  $("check-"+ei).style.display = "inline-flex";
  $("check-"+ei).disabled = false;
  $("redo-"+ei).style.display = "none";
  renderZone(ei);
  updateGlobal();
}

function showFb(ei, ok, msg, detail){
  var fb = $("fb-"+ei);
  fb.className = "feedback show " + (ok ? "ok" : "ko");
  $("fbi-"+ei).textContent = ok ? "\u2705" : "\u274C";
  $("fbm-"+ei).textContent = msg;
  $("fbd-"+ei).innerHTML = detail || "";
}

function toggleHint(ei){
  var h = $("hint-"+ei);
  if(h.classList.contains("show")) h.classList.remove("show");
  else { h.innerHTML = "<strong>? Indice :</strong> " + QUESTIONS[ei].hint; h.classList.add("show"); }
}

function updateGlobal(){
  var done = state.filter(function(s){ return s.done; }).length;
  var ok = state.filter(function(s){ return s.done && s.ok; }).length;
  var ko = done - ok;
  $("sb-ok").textContent = ok;
  $("sb-ko").textContent = ko;
  $("sb-label").textContent = ok + " / " + TOTAL + " questions réussies";
  $("sb-fill").style.width = Math.round(done / TOTAL * 100) + "%";
  $("g-num").textContent = ok;
  if(done < TOTAL){
    $("g-stars").innerHTML = "&#9734;&#9734;&#9734;&#9734;&#9734;";
    $("g-msg").textContent = "Réponds aux " + TOTAL + " questions puis vérifie-les pour voir ton bilan. (" + done + " / " + TOTAL + " faites)";
    return;
  }
  var ratio = ok / TOTAL;
  var stars = ok >= TOTAL ? 5 : ratio >= .8 ? 4 : ratio >= .6 ? 3 : ratio >= .4 ? 2 : ok >= 1 ? 1 : 0;
  $("g-stars").textContent = "\u2B50".repeat(stars) + "\u2606".repeat(5-stars);
  var msg;
  if(ok === TOTAL) msg = "Excellent ! Tu maîtrises le vocabulaire et les classes de la numération.";
  else if(ratio >= .66) msg = "Très bien ! Encore quelques détails à revoir.";
  else if(ratio >= .33) msg = "Passable. Relis les rappels de méthode, puis réessaie.";
  else msg = "À retravailler : reprends chaque question avec son indice, puis recommence.";
  $("g-msg").textContent = msg;
}

function restartAll(){
  state = QUESTIONS.map(function(){ return { done:false, ok:false, sel:null }; });
  buildAll();
