<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths — Semaine 1 Jour 2 — Opérations avec parenthèses</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══ COULEUR DU JOUR — Mardi (Jour 2) → Rouge-brique ═══ */
    :root{
      --day-color:#b94040; --day-dark:#7a1f1f; --day-light:#f7eded;
      --day-border:#f9c0bb; --day-glow:rgba(185,64,64,.3);
      --err-bg:#fce4e4; --err-border:#8e1b13; --err-text:#8e1b13;
    }
    :root{
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:1.6rem 1rem 3.5rem;
      position:relative;overflow-x:hidden;letter-spacing:.02em;word-spacing:.06em;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--blue);top:200px;left:-30px;pointer-events:none;}

    header{text-align:center;margin-bottom:1.4rem;position:relative;z-index:1;max-width:100%;}
    .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;white-space:nowrap;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:.5rem;}
    h1{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:800;line-height:1.3;word-break:break-word;}
    h1 .hl{color:var(--day-dark);}
    .subtitle{color:var(--muted);font-size:clamp(.8rem,2.5vw,.88rem);margin-top:.4rem;font-family:'JetBrains Mono',monospace;word-break:break-word;}

    .scorebar{position:sticky;top:0;z-index:5;width:100%;max-width:760px;background:var(--surface);border:2px solid var(--border);border-radius:99px;padding:.5rem .9rem;margin-bottom:1.4rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.06);}
    .scorebar .sb-label{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;color:var(--day-dark);white-space:nowrap;}
    .sb-track{flex:1;min-width:120px;height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
    .sb-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}
    .chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:99px;font-size:.74rem;font-family:'JetBrains Mono',monospace;white-space:nowrap;border:1.5px solid var(--border);background:var(--bg);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong .dot{background:var(--err-border);}

    .card{width:100%;max-width:760px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.6rem 1.4rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;margin-bottom:1.4rem;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--blue));}

    .act-title{font-size:clamp(1.05rem,3vw,1.25rem);font-weight:800;color:var(--day-dark);margin-bottom:.3rem;}
    .theme-badge{display:inline-block;font-size:.64rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.7rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);white-space:nowrap;}
    .consigne{font-size:clamp(.85rem,2.5vw,.95rem);color:var(--muted);margin-bottom:1rem;line-height:1.6;}
    .method-box{background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.75rem 1rem;margin-bottom:1.1rem;font-size:clamp(.78rem,2.4vw,.84rem);font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.8;word-break:break-word;}
    .method-box strong{color:var(--day-dark);}

    .item-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.9rem;padding-bottom:.8rem;border-bottom:1px solid var(--border);position:relative;z-index:2;}
    .item-lbl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(.86rem,2.5vw,1rem);min-width:5.4rem;color:var(--muted);}
    .item-eq{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(.95rem,2.7vw,1.1rem);color:var(--text);flex:1 1 auto;min-width:8rem;}
    .ans-input{background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:600;padding:.55rem .85rem;outline:none;transition:border-color .2s;min-height:44px;}
    .ans-input:focus{border-color:var(--day-color);}
    .ans-expr{flex:1 1 100%;width:100%;text-align:left;}
    .ans-num{width:130px;text-align:center;}
    .ans-input.correct-input{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .ans-input.wrong-input{border-color:var(--err-border);background:var(--err-bg);color:var(--err-text);}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;position:relative;z-index:2;margin-top:1.1rem;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(.85rem,2.5vw,.95rem);font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;position:relative;z-index:2;min-height:44px;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-solution{background:var(--day-dark);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

    .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:clamp(.8rem,2.4vw,.85rem);color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;word-break:break-word;}
    .hint-box.show{display:block;}

    .feedback{margin-top:1.1rem;padding:.8rem 1rem;border-radius:10px;font-size:clamp(.86rem,2.5vw,.92rem);display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:var(--err-bg);border:1.5px solid var(--err-border);color:var(--err-text);}
    .feedback.partial{background:#fffbeb;border:1.5px solid var(--yellow);color:#7a6010;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:clamp(.76rem,2.3vw,.82rem);margin-top:.3rem;line-height:1.9;word-break:break-word;}

    .global{width:100%;max-width:760px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 1.6rem;text-align:center;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .global-score{font-size:clamp(2.6rem,11vw,4.5rem);font-weight:800;line-height:1;margin:.4rem 0;}
    .global-score .s-num{color:var(--day-dark);}
    .stars{font-size:1.9rem;margin:.3rem 0 .9rem;}
    .global-msg{color:var(--text);font-size:clamp(.86rem,2.6vw,.94rem);margin-bottom:1.4rem;font-weight:600;line-height:1.7;word-break:break-word;min-height:1.4rem;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .card,.global{animation:fadeUp .4s ease both;}
    @media(max-width:480px){
      body{padding:1.2rem .75rem 3rem;}
      .card{padding:1.3rem 1.1rem;}
      .item-row{flex-direction:column;align-items:stretch;}
      .item-lbl{min-width:0;}
      .ans-num{width:100%;}
      .btn-row .btn{flex:1 1 100%;width:100%;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 5ème
    </div>
    <div class="week-label">Semaine 1 &ndash; Jour 2</div>
    <h1>Opérations <span class="hl">avec parenthèses</span></h1>
    <p class="subtitle">2 activités &middot; 8 items &middot; priorités opératoires</p>
  </header>

  <div class="scorebar">
    <span class="sb-label" id="sb-label">0 / 8 items réussis</span>
    <div class="sb-track"><div class="sb-fill" id="sb-fill"></div></div>
    <span class="chip correct"><span class="dot"></span><span id="sb-ok">0</span></span>
    <span class="chip wrong"><span class="dot"></span><span id="sb-ko">0</span></span>
  </div>

  <div id="exos"></div>

  <div class="global">
    <div class="act-title" style="font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;">Bilan</div>
    <div class="global-score"><span class="s-num" id="g-num">0</span>/8</div>
    <div class="stars" id="g-stars">&#9734;&#9734;&#9734;&#9734;&#9734;</div>
    <div class="global-msg" id="g-msg">Réponds aux 2 activités puis vérifie-les pour voir ton bilan.</div>
    <button class="btn btn-primary" onclick="restartAll()" style="margin:0 auto;display:flex;">&#128260; Tout recommencer</button>
  </div>

<script>
var ACTS = [
  {
    type:"parentheses",
    title:"Activité 1 · Je place les parenthèses",
    consigne:"Place les parenthèses au bon endroit pour que l\u2019égalité soit vraie, puis écris l\u2019expression complète. Attention aux parenthèses inutiles !",
    method:"<strong>Méthode :</strong> les parenthèses se calculent en premier. Essaie de regrouper les nombres pour obtenir le résultat voulu, puis vérifie en calculant ton expression.",
    items:[
      { lbl:"Exercice 1", base:"4 × 3 − 5 + 2", target:5,  nums:[4,3,5,2],   ops:["×","−","+"], sol:"4 × 3 − (5 + 2)" },
      { lbl:"Exercice 2", base:"8 − 3 × 6 + 4", target:50, nums:[8,3,6,4],   ops:["−","×","+"], sol:"(8 − 3) × (6 + 4)" },
      { lbl:"Exercice 3", base:"12 + 4 × 7 : 2", target:20, nums:[12,4,7,2], ops:["+","×",":"], sol:"(12 + 4 × 7) : 2" },
      { lbl:"Exercice 4", base:"14 × 4 + 7 : 2", target:77, nums:[14,4,7,2], ops:["×","+",":"], sol:"14 × (4 + 7) : 2" }
    ],
    hint:"Demande-toi quelles opérations doivent être faites en premier pour atteindre le résultat. Place une paire de parenthèses autour de ces opérations, puis recalcule pour vérifier."
  },
  {
    type:"calc",
    title:"Activité 2 · Je calcule pas à pas",
    consigne:"Calcule chaque expression en respectant les priorités, puis écris le résultat.",
    method:"<strong>Méthode :</strong> on calcule d\u2019abord ce qui est entre parenthèses, puis les multiplications et divisions, et enfin les additions et soustractions, de gauche à droite.",
    items:[
      { lbl:"Calcul A", expr:"A = (6 + 4) × 25 − 5 × 2", val:240, steps:"A = (6 + 4) × 25 − 5 × 2<br>A = 10 × 25 − 5 × 2<br>A = 250 − 10<br>A = 240" },
      { lbl:"Calcul B", expr:"B = 60 : (5 − 2) × 10 : 5", val:40, steps:"B = 60 : (5 − 2) × 10 : 5<br>B = 60 : 3 × 10 : 5<br>B = 20 × 10 : 5<br>B = 200 : 5<br>B = 40" },
      { lbl:"Calcul C", expr:"C = 48 − (20 : 4 + 1) + 5", val:47, steps:"C = 48 − (20 : 4 + 1) + 5<br>C = 48 − (5 + 1) + 5<br>C = 48 − 6 + 5<br>C = 42 + 5<br>C = 47" },
      { lbl:"Calcul D", expr:"D = (62 − 2 × 20) : 2 + 6 : 2", val:14, steps:"D = (62 − 2 × 20) : 2 + 6 : 2<br>D = (62 − 40) : 2 + 6 : 2<br>D = 22 : 2 + 6 : 2<br>D = 11 + 3<br>D = 14" }
    ],
    hint:"Repère d\u2019abord les parenthèses et calcule-les. Ensuite, fais les × et : avant les + et −, en avançant de gauche à droite."
  }
];

var TOTAL_ITEMS = ACTS.reduce(function(s,a){ return s + a.items.length; }, 0); // 8
var $ = function(id){ return document.getElementById(id); };

var state = ACTS.map(function(a){
  return { done:false, vals:new Array(a.items.length).fill(""), results:new Array(a.items.length).fill(false), solution:false };
});

/* ── évaluateur sûr : nombres, + - × : et parenthèses uniquement ── */
function safeEval(expr){
  var s = String(expr).replace(/×/g,"*").replace(/x/gi,"*").replace(/÷/g,"/").replace(/:/g,"/").replace(/−/g,"-").replace(/\s/g,"");
  if(!/^[0-9+\-*/().]+$/.test(s)) return null;       // caractères autorisés seulement
  if(/[+\-*/]{2,}/.test(s.replace(/\(-/g,"("))) { /* on tolère un - après ( */ }
  try{
    // Function plutôt que eval direct, sur une chaîne déjà filtrée
    var v = Function('"use strict";return (' + s + ')')();
    if(typeof v === "number" && isFinite(v)) return v;
    return null;
  }catch(e){ return null; }
}
function digitsOf(s){ return (String(s).match(/\d+/g) || []).join(","); }

function buildAll(){
  var root = $("exos"); root.innerHTML = "";
  ACTS.forEach(function(act, ai){
    var card = document.createElement("div");
    card.className = "card"; card.id = "card-" + ai;
    var inner =
      '<div class="card-stripe"></div>' +
      '<div class="act-title">' + act.title + '</div>' +
      '<div class="theme-badge">Priorités opératoires</div>' +
      '<div class="consigne">' + act.consigne + '</div>' +
      '<div class="method-box">' + act.method + '</div>' +
      '<div id="zone-' + ai + '"></div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="check-' + ai + '">&#10003; Vérifier</button>' +
        '<button class="btn btn-hint" id="hintbtn-' + ai + '">? Indice</button>' +
        '<button class="btn btn-solution" id="solbtn-' + ai + '" style="display:none;">&#128161; Solution</button>' +
      '</div>' +
      '<div class="hint-box" id="hint-' + ai + '"></div>' +
      '<div class="feedback" id="fb-' + ai + '">' +
        '<span class="feedback-icon" id="fbi-' + ai + '"></span>' +
        '<div><div id="fbm-' + ai + '"></div><div class="feedback-detail" id="fbd-' + ai + '"></div></div>' +
      '</div>';
    card.innerHTML = inner;
    root.appendChild(card);
    $("check-" + ai).onclick = (function(i){ return function(){ checkAct(i); }; })(ai);
    $("hintbtn-" + ai).onclick = (function(i){ return function(){ toggleHint(i); }; })(ai);
    $("solbtn-" + ai).onclick = (function(i){ return function(){ showSolution(i); }; })(ai);
    renderZone(ai);
  });
  updateGlobal();
}

function renderZone(ai){
  var act = ACTS[ai], st = state[ai];
  var zone = $("zone-" + ai); zone.innerHTML = "";
  act.items.forEach(function(it, i){
    var row = document.createElement("div"); row.className = "item-row";
    var lbl = document.createElement("span"); lbl.className = "item-lbl"; lbl.textContent = it.lbl;
    row.appendChild(lbl);

    if(act.type === "parentheses"){
      var eq = document.createElement("span"); eq.className = "item-eq";
      eq.textContent = it.base + " = " + it.target;
      row.appendChild(eq);
      var inp = document.createElement("input");
      inp.type = "text"; inp.className = "ans-input ans-expr"; inp.id = "in-" + ai + "-" + i;
      inp.placeholder = "Écris l\u2019expression avec parenthèses"; inp.autocomplete = "off";
      bindInput(inp, ai, i);
      row.appendChild(inp);
    } else {
      var eq2 = document.createElement("span"); eq2.className = "item-eq"; eq2.textContent = it.expr;
      row.appendChild(eq2);
      var inp2 = document.createElement("input");
      inp2.type = "text"; inp2.className = "ans-input ans-num"; inp2.id = "in-" + ai + "-" + i;
      inp2.placeholder = "?"; inp2.autocomplete = "off"; inp2.setAttribute("inputmode","numeric");
      bindInput(inp2, ai, i);
      row.appendChild(inp2);
    }
    zone.appendChild(row);
  });
  applyState(ai);
}

function bindInput(inp, ai, i){
  var st = state[ai];
  inp.value = st.vals[i];
  if(st.done){
    inp.disabled = true;
  } else {
    inp.oninput = function(){ st.vals[i] = this.value; };
    inp.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){ ev.preventDefault(); if(!$("check-"+ai).disabled) checkAct(ai); }
    });
  }
}

function applyState(ai){
  var act = ACTS[ai], st = state[ai];
  if(!st.done) return;
  act.items.forEach(function(it, i){
    var inp = $("in-" + ai + "-" + i);
    if(!inp) return;
    inp.disabled = true;
    inp.classList.remove("correct-input","wrong-input");
    if(st.results[i]) inp.classList.add("correct-input");
    else if((st.vals[i]||"").trim() !== "") inp.classList.add("wrong-input");
  });
}

function checkAct(ai){
  var act = ACTS[ai], st = state[ai];
  if(st.done) return;                              // garde anti double-clic
  // garde-fou : au moins une réponse
  if(!st.vals.some(function(v){ return (v||"").trim().length > 0; })){ warnEmpty(ai); return; }

  act.items.forEach(function(it, i){
    var raw = (st.vals[i]||"").trim();
    if(raw === ""){ st.results[i] = false; return; }
    if(act.type === "parentheses"){
      // doit utiliser les mêmes chiffres dans le même ordre ET donner la cible
      var v = safeEval(raw);
      var sameDigits = digitsOf(raw) === it.nums.join(",");
      st.results[i] = (v !== null && Math.abs(v - it.target) < 1e-9 && sameDigits);
    } else {
      var v2 = safeEval(raw);
      st.results[i] = (v2 !== null && Math.abs(v2 - it.val) < 1e-9);
    }
  });
  st.done = true;
  finishAct(ai);
}

function warnEmpty(ai){
  var fb = $("fb-"+ai);
  fb.className = "feedback show ko";
  $("fbi-"+ai).textContent = "\u270B";
  $("fbm-"+ai).innerHTML = "<strong>Réponds d\u2019abord !</strong>";
  $("fbd-"+ai).textContent = "Écris au moins une réponse avant de vérifier.";
}

function finishAct(ai){
  renderZone(ai);
  var act = ACTS[ai], st = state[ai];
  var ok = st.results.filter(function(x){ return x; }).length;
  var tot = act.items.length;
  var fb = $("fb-"+ai);
  var ratio = ok / tot;
  fb.className = "feedback show " + (ratio>=1 ? "ok" : (ok===0 ? "ko" : "partial"));
  $("fbi-"+ai).textContent = ratio>=1 ? "\u2705" : (ok===0 ? "\u274C" : "\u26A0");
  var msg;
  if(ratio>=1) msg = "Parfait ! Tout est correct.";
  else if(ratio>=0.5) msg = "Bien, mais quelques erreurs.";
  else if(ok>0) msg = "À retravailler.";
  else msg = "Rien de correct cette fois.";
  $("fbm-"+ai).innerHTML = "<strong>" + ok + " / " + tot + "</strong> &mdash; " + msg;
  $("fbd-"+ai).innerHTML = (ratio>=1) ? "" : buildCorr(ai);

  $("check-"+ai).disabled = true;
  $("check-"+ai).style.display = "none";
  $("hintbtn-"+ai).disabled = true;
  $("solbtn-"+ai).style.display = "inline-flex";
  updateGlobal();
}

function buildCorr(ai){
  var act = ACTS[ai], st = state[ai];
  var L = [];
  act.items.forEach(function(it, i){
    if(st.results[i]) return;
    var raw = (st.vals[i]||"").trim();
    if(raw === ""){ L.push(it.lbl + " : tu n\u2019as pas répondu."); return; }
    if(act.type === "parentheses"){
      L.push(it.lbl + " : ton expression ne donne pas le bon résultat (place les parenthèses autour des opérations à faire en premier).");
    } else {
      L.push(it.lbl + " : résultat incorrect (calcule les parenthèses, puis les × et :, puis les + et −).");
    }
  });
  if(L.length === 0) return "";
  return "À revoir :<br>" + L.join("<br>") + "<br><span style='color:var(--muted)'>Clique sur « Solution » pour voir les bonnes réponses.</span>";
}

function showSolution(ai){
  var act = ACTS[ai], st = state[ai];
  if(!st.done) return;
  st.solution = true;
  act.items.forEach(function(it, i){
    var inp = $("in-" + ai + "-" + i);
    if(!inp) return;
    inp.value = (act.type === "parentheses") ? it.sol : String(it.val);
    inp.disabled = true;
    inp.classList.remove("wrong-input");
    inp.classList.add("correct-input");
  });
  var fb = $("fb-"+ai);
  fb.className = "feedback show ok";
  $("fbi-"+ai).textContent = "\u2705";
  $("fbm-"+ai).innerHTML = "<strong>Solution affichée.</strong>";
  if(act.type === "calc"){
    var L = act.items.map(function(it){ return it.steps; });
    $("fbd-"+ai).innerHTML = L.join("<br><br>");
  } else {
    $("fbd-"+ai).textContent = "Voici une écriture correcte pour chaque item.";
  }
  $("solbtn-"+ai).disabled = true;
}

function toggleHint(ai){
  var st = state[ai];
  if(st.done) return;
  var h = $("hint-"+ai);
  if(h.classList.contains("show")) h.classList.remove("show");
  else { h.innerHTML = "<strong>? Indice :</strong> " + ACTS[ai].hint; h.classList.add("show"); }
}

function updateGlobal(){
  var okTotal = 0, doneActs = 0;
  state.forEach(function(st){
    if(st.done){ doneActs++; okTotal += st.results.filter(function(x){ return x; }).length; }
  });
  var answeredItems = 0;
  state.forEach(function(st, ai){
    if(st.done) answeredItems += ACTS[ai].items.length;
  });
  $("sb-ok").textContent = okTotal;
  $("sb-ko").textContent = answeredItems - okTotal;
  $("sb-label").textContent = okTotal + " / " + TOTAL_ITEMS + " items réussis";
  $("sb-fill").style.width = Math.round(answeredItems / TOTAL_ITEMS * 100) + "%";
  $("g-num").textContent = okTotal;

  if(doneActs < ACTS.length){
    $("g-stars").innerHTML = "&#9734;&#9734;&#9734;&#9734;&#9734;";
    $("g-msg").textContent = "Réponds aux 2 activités puis vérifie-les pour voir ton bilan. (" + doneActs + " / " + ACTS.length + " faites)";
    return;
  }
  var ratio = okTotal / TOTAL_ITEMS;
  var stars = okTotal >= TOTAL_ITEMS ? 5 : ratio >= .8 ? 4 : ratio >= .6 ? 3 : ratio >= .4 ? 2 : okTotal >= 1 ? 1 : 0;
  $("g-stars").textContent = "\u2B50".repeat(stars) + "\u2606".repeat(5-stars);
  var msg;
  if(okTotal === TOTAL_ITEMS) msg = "Excellent ! Tu maîtrises les priorités et les parenthèses.";
  else if(ratio >= .6) msg = "Très bien ! Encore quelques calculs à revoir.";
  else if(ratio >= .3) msg = "Passable. Relis la méthode, puis réessaie.";
  else msg = "À retravailler : reprends chaque activité avec la méthode, puis recommence.";
  $("g-msg").textContent = msg;
}

function restartAll(){
  state = ACTS.map(function(a){
    return { done:false, vals:new Array(a.items.length).fill(""), results:new Array(a.items.length).fill(false), solution:false };
  });
  buildAll();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", buildAll);
</script>
</body>
</html>
