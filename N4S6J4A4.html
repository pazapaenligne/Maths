<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>

  <title>Pazapa 4e – Agrandissements et réductions dans l'espace – S6 J4</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --day-color:#3ab5d8;--day-dark:#145a72;--day-light:#eaf7fb;--day-border:#a8dced;
      --day-glow:rgba(58,181,216,.3);
      --bg:#fffdf7;--surface:#fff;--border:#e8e4d9;
      --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;
      --text:#1a1d23;--muted:#8a8f9a;--radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
      position:relative;overflow-x:hidden;letter-spacing:.03em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:340px;height:340px;background:var(--day-color);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:260px;height:260px;background:var(--orange);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;
      background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;
      background:var(--pink);top:200px;left:-30px;pointer-events:none;}
    .head-card{width:100%;max-width:720px;background:var(--day-light);border:2px solid var(--day-border);
      border-radius:var(--radius);padding:1.9rem 1.5rem 1.4rem;text-align:center;
      position:relative;z-index:1;margin-bottom:1.5rem;}
    .logo-badge{background:var(--day-color);color:#fff;font-size:14px;letter-spacing:.09em;
      display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;
      padding:.35rem 1.1rem;border-radius:99px;margin-bottom:.6rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{color:var(--day-dark);font-size:.88rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;color:var(--text);margin:.3rem 0;}
    .head-card h1 .hl{color:var(--day-dark);}
    .subtitle{color:var(--muted);font-size:.9rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}
    .res-card{width:100%;max-width:720px;background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:1.4rem 1.3rem;margin-bottom:1.3rem;position:relative;z-index:1;
      box-shadow:0 4px 20px rgba(0,0,0,.05);}
    .res-label{font-size:.78rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
      text-transform:uppercase;letter-spacing:.1em;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem;}
    .res-label::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--day-color);display:inline-block;}
    .res-title{font-size:.9rem;color:var(--text);font-weight:700;margin:1rem 0 .4rem;}
    .res-title:first-of-type{margin-top:0;}
    .res-link{display:inline-block;color:var(--day-dark);font-weight:700;text-decoration:none;
      border-bottom:2px solid var(--day-border);padding-bottom:1px;}
    .res-link:hover{border-color:var(--day-color);}
    iframe{border-radius:10px;border:1px solid var(--border);}
  </style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>

<div class="head-card">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#f5a623"></span>
    PAZAPA &middot; MATHS &middot; 4&Egrave;ME
  </div>
  <div class="week-label">Semaine&nbsp;6 &ndash; Jour&nbsp;4 &mdash; Je m&rsquo;entra&icirc;ne</div>

</div>

</div>

  <p class="res-title">Exercices interactifs </p>
  <a class="res-link" href="https://college.hachette-education.com/ressources/0002017158318/cami3_c12_006_117_Exointer/" target="_blank" rel="noopener">Cliquer ici &rarr;</a>
</div>

</body>
</html>
