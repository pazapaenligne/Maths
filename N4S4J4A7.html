<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Cosinus · Niveau 3</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--day-color:#3ab5d8;--day-dark:#1a6e88;--day-light:#e8f6fb;--day-border:#9dd4e8;--day-glow:rgba(58,181,216,.3);--bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;--yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;letter-spacing:.03em;word-spacing:.08em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--yellow);top:200px;left:-30px;pointer-events:none;}
    .head-card{width:100%;max-width:680px;background:var(--day-light);border:2px solid var(--day-border);border-radius:var(--radius);padding:1.9rem 1.5rem 1.6rem;text-align:center;position:relative;z-index:1;margin-bottom:1.3rem;}
    .head-card .logo-badge{background:var(--day-color);color:#fff;font-size:14px;letter-spacing:.09em;display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .head-card .week-label{color:var(--day-dark);font-size:.95rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1 .hl{color:var(--day-dark);font-size:clamp(1.45rem,4.6vw,1.95rem);font-weight:800;display:inline-block;}
    .head-card .subtitle{color:var(--muted);font-size:1.02rem;margin-top:.5rem;font-family:'JetBrains Mono',monospace;}
    .level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;padding:.6rem 1.15rem;border-radius:12px;border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);min-height:2.9rem;display:inline-flex;align-items:center;cursor:default;}
    .level-btn.active{background:var(--day-color);color:#fff;border-color:var(--day-color);box-shadow:0 3px 10px var(--day-glow);}
    .stats-card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-bottom:1.7rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.05);}
    .stats-row{display:flex;gap:.8rem;}
    .stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);border-radius:12px;padding:.9rem .5rem;text-align:center;}
    .stat-num{font-size:1.7rem;font-weight:800;color:var(--day-dark);font-family:'JetBrains Mono',monospace;line-height:1.1;}
    .stat-label{font-size:.86rem;color:var(--muted);margin-top:.25rem;}
    .prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:1rem;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s;}
    .prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;color:var(--muted);margin-top:.6rem;}
    .section-title{max-width:680px;margin:1.6rem auto .7rem;font-weight:900;font-size:clamp(1.1rem,3.2vw,1.35rem);color:var(--day-dark);position:relative;z-index:1;}
    .sec-consigne{max-width:680px;margin:-.2rem auto 1rem;color:var(--day-dark);font-weight:600;font-size:1rem;line-height:1.7;position:relative;z-index:1;}
    #cards{width:100%;max-width:680px;}
    .card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.7rem 1.5rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:1.5rem;animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}
    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}
    .q-consigne{font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.7;margin-bottom:.5rem;}
    .fig-wrap{background:#fff;border:1.5px solid var(--day-border);border-radius:12px;padding:.5rem;margin:.2rem 0 .9rem;}
    .method-box{display:none;background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.95rem 1.15rem;margin-top:.8rem;font-size:1rem;font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.85;}
    .method-box.reveal{display:block;}
    .input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.8rem;}
    .input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;}
    .answer-input{background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.15rem;padding:.5rem .85rem;outline:none;transition:border-color .2s;height:3rem;width:min(120px,40vw);text-align:center;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}
    .unit{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--muted);}
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.7rem 1.45rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(1rem,2.8vw,1.1rem);font-weight:800;cursor:pointer;border:none;transition:transform .12s;min-height:3.1rem;}
    .btn:active{transform:scale(.96);}.btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .hint-btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.55rem 1.1rem;font-family:Arial,sans-serif;font-size:clamp(.95rem,2.5vw,1.05rem);font-weight:800;cursor:pointer;min-height:2.8rem;display:inline-flex;align-items:center;gap:.4rem;transition:transform .12s;}
    .hint-btn:active{transform:scale(.96);}
    .hint-box{margin-top:.7rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:.97rem;color:#7a6010;display:none;line-height:1.75;font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}
    .feedback{margin-top:.8rem;padding:.7rem 1rem;border-radius:10px;font-size:1rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.5rem;flex-shrink:0;}
    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,11vw,4.8rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2.2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:1.05rem;margin-bottom:2rem;line-height:1.7;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .ang{position:relative;display:inline-block;white-space:nowrap;padding-top:.30em;line-height:1;}
    .ang>.ang-h{position:absolute;left:0;top:0;width:100%;height:.42em;overflow:visible;pointer-events:none;}
    .fxc-trigger{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:0;}
    .fxc-trigger svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
    .fxc-pill{background:var(--day-dark);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.04em;}
    .fxc-hidden{display:none!important;}
    .fxc-panel{position:fixed;right:14px;bottom:14px;z-index:9999;width:312px;max-width:94vw;background:#2f343b;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-family:'JetBrains Mono',monospace;overflow:hidden;border:2px solid var(--day-color);}
    .fxc-bar{background:#23272d;color:#cfd6de;font-size:12.5px;font-weight:700;padding:9px 10px;cursor:move;touch-action:none;user-select:none;display:flex;align-items:center;gap:6px;}
    .fxc-bar .fxc-sp{flex:1;}
    .fxc-icon{background:#3a4049;color:#fff;border:none;width:26px;height:26px;border-radius:7px;font-size:13px;cursor:pointer;line-height:1;}
    .fxc-icon:hover{background:var(--day-color);color:#000;}
    .fxc-help{background:#23272d;color:#aeb6bf;font-size:11.5px;line-height:1.7;padding:8px 12px;border-top:1px solid #3a4049;}
    .fxc-screen{background:#d7e3c8;margin:10px;border-radius:8px;padding:8px 10px;min-height:64px;display:flex;flex-direction:column;justify-content:center;border:2px solid #aab79a;position:relative;}
    .fxc-deg{position:absolute;top:4px;left:8px;font-size:10px;font-weight:700;color:#5a6b4a;letter-spacing:.05em;}
    .fxc-expr{font-size:13px;color:#4a5340;text-align:right;min-height:16px;word-break:break-all;line-height:1.4;}
    .fxc-res{font-size:23px;font-weight:800;color:#222;text-align:right;word-break:break-all;line-height:1.2;}
    .fxc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 10px 12px;}
    .fxc-k{background:#454c55;color:#fff;border:none;border-radius:9px;padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;cursor:pointer;min-height:40px;transition:transform .08s;}
    .fxc-k:active{transform:scale(.94);}.fxc-k:hover{background:#525a64;}
    .fxc-k.fn{background:#3a4049;font-size:12px;color:#3ab5d8;}
    .fxc-k.tg{background:#34506a;font-size:12.5px;color:#bfe0f5;}
    .fxc-k.op{color:#3ab5d8;}.fxc-k.eq{background:#3a7bd5;color:#fff;}.fxc-k.blank{background:transparent;cursor:default;}
  </style>
</head>

<script>
var ANG="<span class='ang'><svg class='ang-h' viewBox='0 0 100 22' preserveAspectRatio='none'><path d='M6 18 L50 5 L94 18' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' vector-effect='non-scaling-stroke'/></svg>";
var QS=[
  {cons:"Le triangle UVW est rectangle en U, avec VW\u00a0= 11,1\u00a0cm, UV\u00a0= 6,3\u00a0cm et UW\u00a0= 9,1\u00a0cm. Calcule l\u2019angle "+ANG+"UVW</span> (\u00e0 1\u00b0 pr\u00e8s).",label:ANG+"UVW</span>\u00a0\u2248",answers:["55"],show:"55\u00b0",hint:"L\u2019angle est en V. UV est adjacent, VW est l\u2019hypot\u00e9nuse. \u00c9cris cos(\u2220UVW) = UV/VW puis applique cos\u207b\u00b9.",fig:'<svg viewBox="0 0 250 215" width="100%" style="max-width:270px;height:auto;display:block;margin:0 auto;" xmlns="http://www.w3.org/2000/svg"><line x1="58" y1="170" x2="58" y2="50" stroke="#444" stroke-width="2"/><line x1="58" y1="170" x2="200" y2="170" stroke="#444" stroke-width="2"/><line x1="58" y1="50" x2="200" y2="170" stroke="#444" stroke-width="2"/><path d="M58,158 L70,158 L70,170" fill="none" stroke="#777" stroke-width="1.6"/><circle cx="58" cy="170" r="2.6" fill="#222"/><circle cx="58" cy="50" r="2.6" fill="#222"/><circle cx="200" cy="170" r="2.6" fill="#222"/><g font-family="Georgia,serif" font-style="italic" font-size="15.5" fill="#111"><text x="31" y="189">U</text><text x="37" y="36">V</text><text x="220" y="184">W</text></g></svg>',method:"Angle en V : cos("+ANG+"UVW</span>) = UV/VW = 6,3/11,1.\nDonc "+ANG+"UVW</span> = cos\u207b\u00b9(6,3 \u00f7 11,1) \u2248 55\u00b0.",unit:"\u00b0"},
  {cons:"Le triangle GHI est rectangle en G, avec HI\u00a0= 12,7\u00a0cm, GH\u00a0= 5,7\u00a0cm et GI\u00a0= 11,3\u00a0cm. Calcule l\u2019angle "+ANG+"GHI</span> (\u00e0 1\u00b0 pr\u00e8s).",label:ANG+"GHI</span>\u00a0\u2248",answers:["63"],show:"63\u00b0",hint:"L\u2019angle est en H. Quel c\u00f4t\u00e9 est adjacent \u00e0 H\u00a0? Lequel est l\u2019hypot\u00e9nuse\u00a0?",fig:'<svg viewBox="0 0 250 215" width="100%" style="max-width:270px;height:auto;display:block;margin:0 auto;" xmlns="http://www.w3.org/2000/svg"><line x1="58" y1="52" x2="58" y2="172" stroke="#444" stroke-width="2"/><line x1="58" y1="52" x2="200" y2="52" stroke="#444" stroke-width="2"/><line x1="58" y1="172" x2="200" y2="52" stroke="#444" stroke-width="2"/><path d="M58,64 L70,64 L70,52" fill="none" stroke="#777" stroke-width="1.6"/><circle cx="58" cy="52" r="2.6" fill="#222"/><circle cx="58" cy="172" r="2.6" fill="#222"/><circle cx="200" cy="52" r="2.6" fill="#222"/><g font-family="Georgia,serif" font-style="italic" font-size="15.5" fill="#111"><text x="31" y="43">G</text><text x="37" y="196">H</text><text x="220" y="48">I</text></g></svg>',method:"Angle en H : cos("+ANG+"GHI</span>) = GH/HI = 5,7/12,7.\nDonc "+ANG+"GHI</span> = cos\u207b\u00b9(5,7 \u00f7 12,7) \u2248 63\u00b0.",unit:"\u00b0"},

var TOTAL=QS.length,state;
function $(id){return document.getElementById(id);}
function norm(s){return String(s).toLowerCase().replace(/\u00b0/g,"").replace(/\s+/g,"").replace(/,/g,".");}
function okAns(raw,q){
  var n=norm(raw);
  return q.answers.some(function(a){
    if(norm(a)===n)return true;
    /* tolérance ±1° pour les angles */
    var nv=parseFloat(n),av=parseFloat(norm(a));
    if(!isNaN(nv)&&!isNaN(av)&&Math.abs(nv-av)<=1)return true;
    return false;
  });
}
function showHint(i){
  var hb=$("hb"+i),hbox=$("hint"+i);if(!hbox)return;

}
function buildCards(){

    html+='<div class="card" id="card'+i+'"><div class="card-stripe"></div>'
      +'<div class="q-num">Question '+(i+1)+' / '+TOTAL+'</div>'
      +'<div class="q-consigne">'+q.cons+'</div>'
      +'<div class="fig-wrap">'+q.fig+'</div>'
      +'<div class="input-row"><span class="input-label">'+q.label+'</span>'
      +'<input type="text" class="answer-input" id="in'+i+'" placeholder="?" autocomplete="off" autocapitalize="off" spellcheck="false"/>'
      +'<span class="unit">'+q.unit+'</span></div>'
      +'<div class="btn-row">'
      +'<button class="btn btn-primary" id="vb'+i+'" onclick="chk('+i+')">&#10003; Vérifier</button>'
      +'<button class="hint-btn" id="hb'+i+'" onclick="showHint('+i+')">&#128161; Indice</button>'
      +'</div>'
      +'<div class="hint-box" id="hint'+i+'">'+q.hint+'</div>'
      +'<div class="method-box" id="method'+i+'" style="white-space:pre-line">'+q.method+'</div>'
      +'<div class="feedback" id="fb'+i+'"><span class="feedback-icon" id="fbi'+i+'"></span><div><span id="fbt'+i+'"></span></div></div>'
      +'</div>';
  }
  $("cards").innerHTML=html;
  for(var j=0;j<TOTAL;j++){(function(k){$("in"+k).addEventListener("keydown",function(e){if(e.key==="Enter")chk(k);});})(j);}

function chk(i){
  if(state[i].done)return;

    state[i].done=true;state[i].ok=true;
    $("in"+i).disabled=true;$("vb"+i).disabled=true;
    $("in"+i).className="answer-input correct-input";
    $("method"+i).className="method-box reveal";
    $("fb"+i).className="feedback show ok";$("fbi"+i).textContent="\u2713";
    $("fbt"+i).innerHTML="Bravo, c\u2019est juste\u00a0!";
    update();
  } else if(!state[i].errored){
    state[i].errored=true;
    $("in"+i).className="answer-input wrong-input";
    $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";
    $("fbt"+i).innerHTML="Pas tout \u00e0 fait \u2014 r\u00e9essaie\u00a0!";
    $("vb"+i).innerHTML="\u21bb R\u00e9essayer";
    $("vb"+i).setAttribute("onclick","retry("+i+")");
  } else {
    state[i].done=true;state[i].ok=false;
    $("in"+i).disabled=true;$("vb"+i).disabled=true;
    $("in"+i).className="answer-input wrong-input";
    $("method"+i).className="method-box reveal";
    $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";
    $("fbt"+i).innerHTML="R\u00e9ponse\u00a0: <strong>"+q.show+"</strong>.";
    update();
  }
}
function retry(i){
  $("in"+i).value="";$("in"+i).className="answer-input";$("in"+i).focus();
  $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u270f\ufe0f";
  $("fbt"+i).innerHTML="Corrige puis v\u00e9rifie \u00e0 nouveau.";
  $("vb"+i).innerHTML="&#10003; Vérifier";$("vb"+i).setAttribute("onclick","chk("+i+")");
}
function update(){
  var done=0,ok=0;for(var i=0;i<TOTAL;i++){if(state[i].done){done++;if(state[i].ok)ok++;}}
  $("st-ok").textContent=ok;$("st-err").textContent=done-ok;$("st-rem").textContent=TOTAL-done;
  $("pfill").style.width=Math.round(done/TOTAL*100)+"%";$("prog-text").textContent=done+" / "+TOTAL;
  if(done===TOTAL)showResults(ok);
}
function showResults(ok){
  $("res-score").textContent=ok+" / "+TOTAL;
  var stars=(ok===TOTAL)?5:Math.max(1,Math.round(ok/TOTAL*5));var st="";for(var s=0;s<5;s++)st+=(s<stars?"\u2b50":"\u2606");$("stars").textContent=st;
  var err=TOTAL-ok,msg;
  if(err===0)msg="Parfait, sans-faute\u00a0! Tu ma\u00eetrises le cosinus.";
  else if(err<=2)msg="Tr\u00e8s bien\u00a0! Tu progresses bien.";
  else if(err<=4)msg="Bien jou\u00e9. Encore un peu d\u2019entra\u00eenement.";
  else msg="\u00c0 retravailler tranquillement avec la calculatrice.";
  $("res-msg").textContent=msg;$("results").className="results show";$("results").scrollIntoView({behavior:"smooth"});
}
function restart(){buildCards();$("results").className="results";update();window.scrollTo({top:0,behavior:"smooth"});}
buildCards();update();
</script>

<script>

  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}

  function factString(n){n=Math.round(n);if(n<1)return"Erreur";if(n===1)return"1";var f=[],d=2,x=n;while(d*d<=x){while(x%d===0){f.push(d);x/=d;}d++;}if(x>1)f.push(x);var out=[],i=0;while(i<f.length){var p=f[i],c=0;while(i<f.length&&f[i]===p){c++;i++;}out.push(c>1?(p+sup(c)):(""+p));}if(f.length===1&&f[0]===n)return n+" (premier)";return out.join("\u00d7");}

  bar.addEventListener("pointermove",function(e){if(!drag)return;if(!conv){panel.style.right="auto";panel.style.bottom="auto";panel.style.left=ox+"px";panel.style.top=oy+"px";conv=true;}var nx=ox+(e.clientX-sx),ny=oy+(e.clientY-sy);var w=panel.offsetWidth,h=panel.offsetHeight;nx=Math.max(4,Math.min(window.innerWidth-w-4,nx));ny=Math.max(4,Math.min(window.innerHeight-h-4,ny));panel.style.left=nx+"px";panel.style.top=ny+"px";});
  bar.addEventListener("pointerup",function(e){drag=false;try{bar.releasePointerCapture(e.pointerId);}catch(_){}});
})();
