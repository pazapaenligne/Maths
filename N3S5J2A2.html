<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✏️ Résoudre les exercices – Somme de nombres relatifs</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --j2-main:  #f28b82;
  --j2-dark:  #c0392b;
  --j2-soft:  #fff0ef;
  --j2-light: #f9c0bb;
  --white:    #ffffff;
  --text:     #1a1a1a;
  --text-muted:#666666;
  --shadow:   0 4px 24px rgba(192,57,43,0.11);
  --font:     'JetBrains Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#fff;color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── BLOBS ── */
.blob{position:fixed;pointer-events:none;z-index:0;opacity:0.27;filter:blur(1px)}
.blob-1{top:-80px;right:-100px;width:420px;height:380px;background:var(--j2-light);
  border-radius:60% 40% 73% 27% / 52% 47% 53% 48%}
.blob-2{top:40%;left:-110px;width:310px;height:280px;background:var(--j2-soft);
  border-radius:44% 56% 31% 69% / 65% 35% 65% 35%}
.blob-3{bottom:-90px;left:15px;width:380px;height:350px;background:var(--j2-light);
  border-radius:53% 47% 40% 60% / 45% 60% 40% 55%}

/* ── LAYOUT ── */
.container{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 16px 60px}

/* ── HERO ── */
.hero{padding:44px 0 28px;text-align:center}
.badge{display:inline-block;background:var(--j2-main);color:#fff;font-weight:700;font-size:.72rem;
  letter-spacing:.12em;text-transform:uppercase;padding:5px 16px;border-radius:99px;margin-bottom:16px}
.hero h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;color:var(--j2-dark);margin-bottom:8px}
.hero p{font-size:.88rem;color:var(--text-muted);max-width:540px;margin:0 auto}

/* ── SCOREBOARD ── */
.scoreboard{position:sticky;top:0;z-index:100;background:var(--white);
  border-bottom:2px solid var(--j2-light);padding:10px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.score-item{display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;white-space:nowrap}
.score-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-ok{background:#27ae60}.dot-left{background:var(--j2-main)}.dot-err{background:#c0392b}
.xp-wrap{flex:1;min-width:120px;display:flex;align-items:center;gap:8px}
.xp-bar-bg{flex:1;height:8px;background:var(--j2-soft);border-radius:99px;overflow:hidden}
.xp-bar{height:100%;background:var(--j2-main);border-radius:99px;transition:width .4s}
.xp-label{font-size:.72rem;font-weight:700;color:var(--j2-dark);white-space:nowrap}

/* ── EXERCISE CARD ── */
.exo-card{background:var(--white);border:2px solid var(--j2-light);border-radius:18px;
  padding:24px;margin-top:22px;box-shadow:var(--shadow);transition:border-color .3s}
.exo-card.validated{border-color:#27ae60;background:#f6fff8}
.exo-card.errored{border-color:#c0392b;background:#fff6f6}
.exo-num{font-size:.68rem;font-weight:700;color:var(--j2-dark);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:8px}
.exo-question{font-size:.96rem;font-weight:600;line-height:1.6;margin-bottom:16px}

/* droite graduée SVG */
.fig-wrap{margin:14px 0;overflow:auto}
.fig-wrap svg{max-width:100%;height:auto;font-family:var(--font)}

/* choices */
.choices{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.choice-btn{font-family:var(--font);font-size:.92rem;font-weight:700;
  padding:11px 22px;border-radius:10px;border:2px solid var(--j2-light);
  background:var(--j2-soft);color:var(--text);cursor:pointer;transition:all .18s;
  min-width:64px;text-align:center}
.choice-btn:hover:not(:disabled){background:var(--j2-light);border-color:var(--j2-main)}
.choice-btn.selected{background:var(--j2-light);border-color:var(--j2-dark)}
.choice-btn.correct{background:#e8f8ef;border-color:#27ae60;color:#1a6b3a}
.choice-btn.wrong{background:#fde8e8;border-color:#c0392b;color:#7a1010}
.choice-btn:disabled{cursor:not-allowed;opacity:.85}

/* saisie */
.input-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.num-input{font-family:var(--font);font-size:1.05rem;font-weight:700;
  width:80px;padding:10px 10px;border-radius:9px;border:2px solid var(--j2-light);
  background:var(--j2-soft);text-align:center;outline:none}
.num-input:focus{border-color:var(--j2-main)}
.num-input.input-correct{border-color:#27ae60;background:#e8f8ef}
.num-input.input-wrong{border-color:#c0392b;background:#fde8e8}

/* feedback */
.feedback{font-size:.83rem;font-weight:600;padding:9px 14px;border-radius:9px;
  margin-bottom:10px;display:none;line-height:1.5}
.feedback.show{display:block}
.feedback.ok{background:#e8f8ef;color:#1a6b3a}
.feedback.ko{background:#fde8e8;color:#7a1010}

/* boutons action */
.btn-validate{font-family:var(--font);font-size:.9rem;font-weight:700;
  background:var(--j2-main);color:#fff;border:none;border-radius:11px;
  padding:11px 28px;cursor:pointer;transition:background .18s}
.btn-validate:hover{background:var(--j2-dark)}
.btn-validate:disabled{background:#ccc;cursor:not-allowed}
.btn-retry{font-family:var(--font);font-size:.85rem;font-weight:700;
  background:var(--j2-soft);color:var(--j2-dark);border:2px solid var(--j2-main);
  border-radius:11px;padding:9px 22px;cursor:pointer;transition:all .18s;display:none}
.btn-retry:hover{background:var(--j2-light)}
.validated-badge{display:none;font-size:.82rem;font-weight:700;color:#27ae60;
  padding:7px 14px;background:#e8f8ef;border-radius:9px}
.exo-card.validated .validated-badge{display:inline-block}
.exo-card.validated .btn-validate{display:none}
.exo-card.validated .btn-retry{display:none}

/* expression mise en valeur */
.expr{display:inline-block;background:var(--j2-soft);border:1.5px solid var(--j2-light);
  border-radius:8px;padding:10px 18px;font-size:1.15rem;font-weight:800;
  color:var(--j2-dark);margin:10px 0 16px;letter-spacing:.03em}
.expr .neg{color:#c0392b}
.expr .pos{color:#27ae60}

/* bouton global */
.btn-restart{font-family:var(--font);font-size:.95rem;font-weight:700;
  background:var(--j2-dark);color:#fff;border:none;border-radius:14px;
  padding:14px 40px;cursor:pointer;margin-top:32px;display:block;
  margin-left:auto;margin-right:auto;transition:background .18s}
.btn-restart:hover{background:#921d12}

/* résultat */
#result-screen{display:none;text-align:center;padding:40px 20px}
.trophy{font-size:4rem;margin-bottom:12px}
.result-score{font-size:1.6rem;font-weight:800;color:var(--j2-dark);margin-bottom:8px}
.stars{font-size:2rem;margin-bottom:12px}
.result-msg{font-size:.9rem;color:var(--text-muted);max-width:420px;margin:0 auto 24px}

@media(max-width:480px){
  .hero h1{font-size:1.3rem}
  .exo-card{padding:16px}
  .num-input{width:68px}
  .choice-btn{font-size:.82rem;padding:9px 14px}
  .expr{font-size:1rem;padding:8px 12px}
}
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<!-- SCOREBOARD -->
<div class="scoreboard">
  <div class="score-item"><span class="dot dot-ok"></span><span id="sc-ok">0</span>&nbsp;Réussies</div>
  <div class="score-item"><span class="dot dot-left"></span><span id="sc-left">4</span>&nbsp;Restantes</div>
  <div class="score-item"><span class="dot dot-err"></span><span id="sc-err">0</span>&nbsp;Erreurs</div>
  <div class="xp-wrap">
    <div class="xp-bar-bg"><div class="xp-bar" id="xp-bar" style="width:0%"></div></div>
    <span class="xp-label" id="xp-label">0 / 4</span>
  </div>
</div>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="badge">🌸 Semaine 5 · Jour 2</div>
    <h1>&#9999;&#65039; Résoudre les exercices</h1>
    <p>Somme de nombres relatifs — résous mentalement et sans calculatrice.</p>
  </div>

  <div id="exos-wrap"></div>

  <button class="btn-restart" id="btn-restart">🔄 Recommencer</button>

  <div id="result-screen">
    <div class="trophy" id="res-trophy">🏅</div>
    <div class="result-score" id="res-score"></div>
    <div class="stars" id="res-stars"></div>
    <div class="result-msg" id="res-msg"></div>
    <button class="btn-restart" id="btn-restart-2">🔄 Nouvel essai</button>
  </div>
</div>

<script>
/* ══════════════════════
   UTILITAIRES
══════════════════════ */
let state = {ok:0, err:0, total:4};

function updateScoreboard(){
  document.getElementById('sc-ok').textContent   = state.ok;
  document.getElementById('sc-left').textContent = state.total - state.ok;
  document.getElementById('sc-err').textContent  = state.err;
  const pct = Math.round(state.ok / state.total * 100);
  document.getElementById('xp-bar').style.width  = pct + '%';
  document.getElementById('xp-label').textContent = state.ok + ' / ' + state.total;
}

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ return arr.slice().sort(()=>Math.random()-.5); }

/* Affiche un nombre relatif avec signe explicite : +5 ou −7 */
function signStr(n){
  return n >= 0 ? '+' + n : '−' + Math.abs(n);
}
/* HTML coloré */
function signHtml(n){
  if(n > 0)  return `<span class="pos">+${n}</span>`;
  if(n < 0)  return `<span class="neg">−${Math.abs(n)}</span>`;
  return `<span>0</span>`;
}
/* Parenthésé pour l'écriture de somme */
function parenHtml(n){
  if(n >= 0) return `(<span class="pos">+${n}</span>)`;
  return `(<span class="neg">−${Math.abs(n)}</span>)`;
}

/* ══════════════════════════════════════════════
   DROITE GRADUÉE SVG
   Montre le point de départ et la flèche de déplacement
   xmin..xmax, valeur départ, déplacement
══════════════════════════════════════════════ */
function drawGraduatedLine(depart, deplacement, resultat){
  const W = 340, H = 80;
  const xmin = Math.min(depart, resultat) - 3;
  const xmax = Math.max(depart, resultat) + 3;
  const range = xmax - xmin;
  const scale = (W - 40) / range;
  const ox = 20 - xmin * scale; // pixel x=0

  function px(v){ return ox + v * scale; }
  const yAxis = 44;

  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="font-family:'JetBrains Mono',monospace">`;
  svg += `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--j2-soft)" rx="10"/>`;

  // ligne principale
  svg += `<line x1="10" y1="${yAxis}" x2="${W-10}" y2="${yAxis}" stroke="#d08080" stroke-width="2"/>`;

  // graduations
  for(let v = Math.ceil(xmin); v <= Math.floor(xmax); v++){
    const x = px(v);
    if(x < 12 || x > W-12) continue;
    const major = (v % 5 === 0);
    svg += `<line x1="${x}" y1="${yAxis-5}" x2="${x}" y2="${yAxis+5}" stroke="#b06060" stroke-width="${major?1.5:0.8}"/>`;
    if(major || Math.abs(v) <= 2){
      svg += `<text x="${x}" y="${yAxis+18}" fill="#b06060" font-size="9" text-anchor="middle" font-weight="600">${v}</text>`;
    }
  }

  // point départ (cercle plein rose foncé)
  const xD = px(depart);
  svg += `<circle cx="${xD}" cy="${yAxis}" r="6" fill="var(--j2-dark)" stroke="#fff" stroke-width="2"/>`;
  svg += `<text x="${xD}" y="${yAxis-12}" fill="var(--j2-dark)" font-size="10" text-anchor="middle" font-weight="700">${depart > 0 ? '+'+depart : depart}</text>`;

  // flèche de déplacement (arc au-dessus)
  const xR = px(resultat);
  const mid = (xD + xR) / 2;
  const curve = deplacement >= 0 ? -18 : -18;
  const col = deplacement >= 0 ? '#27ae60' : '#c0392b';
  svg += `<path d="M ${xD} ${yAxis-6} Q ${mid} ${yAxis+curve} ${xR} ${yAxis-6}" fill="none" stroke="${col}" stroke-width="2" marker-end="url(#arr)"/>`;

  // label déplacement au milieu de la courbe
  const dy = deplacement >= 0 ? -26 : -26;
  svg += `<text x="${mid}" y="${yAxis+curve+dy}" fill="${col}" font-size="10" text-anchor="middle" font-weight="700">${deplacement > 0 ? '+'+deplacement : deplacement}</text>`;

  // définition flèche
  svg += `<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="${col}"/></marker></defs>`;

  svg += `</svg>`;
  return svg;
}

/* ══════════════════════════════════════════════
   GÉNÉRATEURS
══════════════════════════════════════════════ */

/* EXO 1 — Somme de 2 relatifs, QCM 4 propositions */
function genExo1(){
  const pool = [
    [-7,3],[-5,9],[-4,-6],[8,-3],[-12,7],
    [6,-6],[-5,-8],[9,-4],[-3,11],[4,-15],
    [-9,2],[7,-11],[3,-8],[-6,6],[10,-4]
  ];
  const [a,b] = pick(pool);
  const correct = a + b;

  // 3 distracteurs proches et distincts
  const wrongs = new Set();
  const candidates = [correct+1,correct-1,correct+2,correct-2,
                      -(correct),Math.abs(a)+Math.abs(b),-(Math.abs(a)+Math.abs(b))];
  for(const c of candidates){
    if(c !== correct && !wrongs.has(c)) wrongs.add(c);
    if(wrongs.size >= 3) break;
  }
  const choices = shuffle([correct, ...[...wrongs].slice(0,3)]);

  const fig = drawGraduatedLine(a, b, correct);

  return {
    type: 'qcm',
    num: 'Exercice 1',
    question: `Calcule mentalement :`,
    exprHtml: `${parenHtml(a)} + ${parenHtml(b)}`,
    figHtml: fig,
    choices: choices.map(String),
    correct: String(correct),
    explanationOk: `✅ Exact ! (${a > 0?'+'+a:a}) + (${b > 0?'+'+b:b}) = <b>${correct}</b>`,
    explanationKo: `❌ (${a > 0?'+'+a:a}) + (${b > 0?'+'+b:b}) = <b>${correct}</b>. ${a<0&&b<0?'Deux négatifs : on additionne les valeurs absolues et on garde le signe −.':Math.sign(a)!==Math.sign(b)?`Les signes sont opposés : on soustrait les valeurs absolues et on garde le signe du plus grand (${Math.abs(a)>Math.abs(b)?a:b}).`:'Les signes sont identiques.'}`
  };
}

/* EXO 2 — Somme de 3 relatifs, saisie directe */
function genExo2(){
  const pool = [
    [-3,5,-2],[7,-4,-6],[-8,3,4],[5,-9,2],
    [-6,-2,11],[4,-7,-1],[-5,8,-3],[10,-6,-7],
    [6,-3,-8],[-2,-4,9],[3,7,-12],[-1,-5,4]
  ];
  const [a,b,c] = pick(pool);
  const correct = a + b + c;

  return {
    type: 'input',
    num: 'Exercice 2',
    question: `Calcule mentalement (commence par les termes de même signe) :`,
    exprHtml: `${parenHtml(a)} + ${parenHtml(b)} + ${parenHtml(c)}`,
    correct: correct,
    inputLabel: 'Résultat =',
    explanationOk: `✅ Bravo ! (${a>0?'+'+a:a}) + (${b>0?'+'+b:b}) + (${c>0?'+'+c:c}) = <b>${correct}</b>`,
    explanationKo: `❌ Résultat : <b>${correct}</b>. Astuce : regroupe d'abord les positifs (${[a,b,c].filter(x=>x>0).join(' + ')||'aucun'}) et les négatifs (${[a,b,c].filter(x=>x<0).join(', ')||'aucun'}), puis calcule la différence.`
  };
}

/* EXO 3 — Terme manquant : a + ? = s */
function genExo3(){
  const pool = [
    [-5, 3],  // ?=8
    [7, -2],  // ?=-9
    [-4,-7],  // ?=-3
    [9,  1],  // ?=-8
    [-6, 0],  // ?=6
    [3,-10],  // ?=-13
    [-8, 5],  // ?=13
    [4, -1],  // ?=-5
    [-3,-9],  // ?=-6
    [6, 2],   // ?=-4
  ];
  const [a, s] = pick(pool);
  const manq = s - a;

  return {
    type: 'input',
    num: 'Exercice 3',
    question: `Trouve le nombre manquant&nbsp;:`,
    exprHtml: `${parenHtml(a)} + <span style="display:inline-block;width:40px;height:24px;border-bottom:2.5px solid var(--j2-dark);vertical-align:bottom;margin:0 4px"></span> = ${s > 0 ? '+'+s : s}`,
    correct: manq,
    inputLabel: 'Le nombre manquant est',
    explanationOk: `✅ Exact ! (${a>0?'+'+a:a}) + (${manq>0?'+'+manq:manq}) = ${s}`,
    explanationKo: `❌ Le nombre manquant est <b>${manq>0?'+'+manq:manq}</b>. Pour trouver ?, on calcule : ? = ${s} − (${a>0?'+'+a:a}) = ${manq}.`
  };
}

/* EXO 4 — Contexte concret : thermomètre ou altitude */
function genExo4(){
  const scenarios = [
    {
      ctx: `Le matin, la température est de <b>−8&nbsp;°C</b>. Dans la journée, elle monte de <b>5&nbsp;°C</b>. Quelle est la température l'après-midi&nbsp;?`,
      a: -8, b: 5, unite: '°C',
      hint: 'On ajoute le déplacement à la température de départ.'
    },
    {
      ctx: `À midi, il fait <b>+3&nbsp;°C</b>. Le soir, la température baisse de <b>11&nbsp;°C</b>. Quelle est la température le soir&nbsp;?`,
      a: 3, b: -11, unite: '°C',
      hint: 'Baisser de 11°C revient à ajouter −11.'
    },
    {
      ctx: `La nuit, il fait <b>−4&nbsp;°C</b>. Pendant la nuit, la température baisse encore de <b>3&nbsp;°C</b>. Quelle est la température à l'aube&nbsp;?`,
      a: -4, b: -3, unite: '°C',
      hint: 'Deux négatifs : la température descend encore plus bas.'
    },
    {
      ctx: `Il fait <b>+6&nbsp;°C</b> au sommet d'une colline. La nuit, la température baisse de <b>9&nbsp;°C</b>. Quelle température fait-il au petit matin&nbsp;?`,
      a: 6, b: -9, unite: '°C',
      hint: '6 − 9 = ? Pense à la droite graduée.'
    },
    {
      ctx: `Un plongeur est à <b>−12&nbsp;m</b> de profondeur. Il remonte de <b>5&nbsp;m</b>. À quelle profondeur se trouve-t-il&nbsp;?`,
      a: -12, b: 5, unite: 'm',
      hint: 'Remonter de 5 m revient à ajouter +5 à la profondeur.'
    },
    {
      ctx: `Un randonneur est à <b>+450&nbsp;m</b> d'altitude. Il descend de <b>680&nbsp;m</b>. À quelle altitude se trouve-t-il&nbsp;?`,
      a: 450, b: -680, unite: 'm',
      hint: 'Descendre revient à ajouter un nombre négatif.'
    },
  ];
  const sc = pick(scenarios);
  const correct = sc.a + sc.b;
  const fig = drawGraduatedLine(sc.a, sc.b, correct);

  return {
    type: 'input',
    num: 'Exercice 4',
    question: sc.ctx,
    exprHtml: `(${sc.a > 0 ? '+'+sc.a : sc.a}) + (${sc.b > 0 ? '+'+sc.b : sc.b}) =`,
    figHtml: fig,
    correct: correct,
    inputLabel: `Réponse (en ${sc.unite})`,
    explanationOk: `✅ Correct ! La réponse est <b>${correct > 0 ? '+'+correct : correct}&nbsp;${sc.unite}</b>.`,
    explanationKo: `❌ La réponse est <b>${correct > 0 ? '+'+correct : correct}&nbsp;${sc.unite}</b>. ${sc.hint}`
  };
}

/* ══════════════════════════════════════════════
   RENDU
══════════════════════════════════════════════ */
let exercises = [];

function renderExos(){
  exercises = [genExo1(), genExo2(), genExo3(), genExo4()];
  state = {ok:0, err:0, total:4};
  updateScoreboard();

  const wrap = document.getElementById('exos-wrap');
  wrap.innerHTML = '';
  wrap.style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('btn-restart').style.display = 'block';

  exercises.forEach((exo, idx) => {
    const card = document.createElement('div');
    card.className = 'exo-card';
    card.id = 'card-' + idx;

    let html = `<div class="exo-num">${exo.num}</div>
      <div class="exo-question">${exo.question}</div>
      <div class="expr">${exo.exprHtml}</div>`;

    if(exo.figHtml){
      html += `<div class="fig-wrap">${exo.figHtml}</div>`;
    }

    if(exo.type === 'qcm'){
      html += `<div class="choices" id="choices-${idx}">`;
      exo.choices.forEach(c => {
        html += `<button class="choice-btn" data-exo="${idx}" data-val="${c}">${c}</button>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="input-row">
        <span style="font-size:.88rem;font-weight:700">${exo.inputLabel} =</span>
        <input class="num-input" id="inp-${idx}" type="number" placeholder="?">
      </div>`;
    }

    html += `<div class="feedback" id="fb-${idx}"></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn-validate" id="btn-val-${idx}">Valider</button>
        <button class="btn-retry" id="btn-retry-${idx}">↻ Réessayer</button>
        <span class="validated-badge">✅ Validé !</span>
      </div>`;

    card.innerHTML = html;
    wrap.appendChild(card);
  });

  // Events QCM — sélection
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.exo);
      if(document.getElementById('card-'+idx).classList.contains('validated')) return;
      document.querySelectorAll(`#choices-${idx} .choice-btn`).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });

  // Events Valider / Réessayer
  exercises.forEach((exo, idx) => {
    const btnVal   = document.getElementById('btn-val-'  + idx);
    const btnRetry = document.getElementById('btn-retry-'+ idx);
    const fb       = document.getElementById('fb-'       + idx);
    const card     = document.getElementById('card-'     + idx);

    btnVal.addEventListener('click', () => {
      let correct = false;

      if(exo.type === 'qcm'){
        const sel = document.querySelector(`#choices-${idx} .choice-btn.selected`);
        if(!sel){ fb.className='feedback show ko'; fb.innerHTML='❗ Choisis une réponse.'; return; }
        correct = sel.dataset.val === exo.correct;
        document.querySelectorAll(`#choices-${idx} .choice-btn`).forEach(b => {
          b.disabled = true;
          if(b.dataset.val === exo.correct) b.classList.add('correct');
          else if(b.classList.contains('selected')) b.classList.add('wrong');
        });

      } else {
        const inp = document.getElementById('inp-'+idx);
        const val = parseInt(inp.value);
        if(isNaN(val)){ fb.className='feedback show ko'; fb.innerHTML='❗ Saisis un nombre entier.'; return; }
        correct = val === exo.correct;
        inp.disabled = true;
        inp.classList.add(correct ? 'input-correct' : 'input-wrong');
      }

      fb.className = 'feedback show ' + (correct ? 'ok' : 'ko');
      fb.innerHTML  = correct ? exo.explanationOk : exo.explanationKo;

      if(correct){
        card.classList.add('validated');
        state.ok++;
        updateScoreboard();
        checkAllDone();
      } else {
        card.classList.add('errored');
        state.err++;
        updateScoreboard();
        btnVal.style.display   = 'none';
        btnRetry.style.display = 'inline-block';
      }
    });

    btnRetry.addEventListener('click', () => {
      card.classList.remove('errored');
      fb.className = 'feedback';
      fb.innerHTML = '';
      btnVal.style.display   = 'inline-block';
      btnRetry.style.display = 'none';

      if(exo.type === 'qcm'){
        document.querySelectorAll(`#choices-${idx} .choice-btn`).forEach(b => {
          b.disabled = false;
          b.classList.remove('correct','wrong','selected');
        });
      } else {
        const inp = document.getElementById('inp-'+idx);
        inp.disabled = false;
        inp.classList.remove('input-correct','input-wrong');
        inp.value = '';
        inp.focus();
      }
    });
  });
}

function checkAllDone(){
  if(state.ok < state.total) return;
  setTimeout(() => {
    document.getElementById('exos-wrap').style.display  = 'none';
    document.getElementById('btn-restart').style.display = 'none';
    const rs = document.getElementById('result-screen');
    rs.style.display = 'block';
    const e = state.err;
    const trophy = e===0 ? '🏆' : e<=2 ? '🥈' : '🥉';
    const stars  = e===0 ? '⭐⭐⭐' : e<=2 ? '⭐⭐' : '⭐';
    const msg    = e===0
      ? 'Tous les exercices réussis sans erreur. Très solide !'
      : e<=2
        ? 'Beau travail ! Quelques essais, mais tu as trouvé. Personne ne réussit tout du premier coup.'
        : "Tu as persévéré et fini tous les exercices. C'est l'essentiel.";
    document.getElementById('res-trophy').textContent = trophy;
    document.getElementById('res-stars').textContent  = stars;
    document.getElementById('res-score').textContent  = `${state.total} / ${state.total} — ${e} erreur(s)`;
    document.getElementById('res-msg').textContent    = msg;
  }, 600);
}

document.getElementById('btn-restart').addEventListener('click',  renderExos);
document.getElementById('btn-restart-2').addEventListener('click', renderExos);

renderExos();
</script>
