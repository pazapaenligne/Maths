<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PAZAPA Maths — Priorités opératoires · Automatismes</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ───────── CHARTE J5 JAUNE ───────── */
:root{
  --jour:#f5c518;        /* principal */
  --jour-fonce:#8a6000;  /* texte foncé */
  --jour-soft:#fffbeb;   /* fond soft */
  --jour-accent:#f5e08a; /* accent / blobs */
  --jour-titre:#c49a00;  /* titre */
  --badge-txt:#3a2600;   /* texte badge */
  --vert:#8dc63f; --vert-fonce:#3d7a10; --vert-soft:#f0faeb;
  --rouge:#e74c3c; --rouge-soft:#fdedec; --rouge-fonce:#c0392b;
  --texte:#23262d; --gris:#8a8f9a; --bord:#ece8dd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:auto;}
body{
  background:#ffffff; color:var(--texte);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:1.6rem 1rem 4rem; position:relative;
}
/* ───────── 3 BLOBS ORGANIQUES FIXES ───────── */
.blob{position:fixed;z-index:0;pointer-events:none;background:var(--jour-accent);filter:blur(1px);}
.blob1{width:300px;height:280px;top:-70px;right:-80px;opacity:.30;
  border-radius:38% 62% 55% 45% / 56% 40% 60% 44%;}
.blob2{width:220px;height:240px;top:38%;left:-90px;opacity:.27;
  border-radius:62% 38% 44% 56% / 42% 58% 42% 58%;}
.blob3{width:260px;height:230px;bottom:-60px;right:-50px;opacity:.28;
  border-radius:45% 55% 62% 38% / 55% 45% 58% 42%;}

/* ───────── HERO ───────── */
.hero{text-align:center;position:relative;z-index:1;margin-bottom:1.4rem;max-width:720px;}
.badge-semaine{
  display:inline-block;background:var(--jour-soft);border:2px solid var(--jour);
  color:var(--badge-txt);font-weight:800;font-size:.78rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.35rem 1rem;border-radius:99px;margin-bottom:.8rem;
}
h1{font-size:clamp(1.45rem,4vw,2.1rem);font-weight:800;color:var(--jour-titre);line-height:1.25;}
.sous-titre{color:var(--gris);font-size:.92rem;margin-top:.45rem;line-height:1.8;}
.consigne{
  margin:1rem auto 0;max-width:560px;border:2px dashed var(--jour);
  background:var(--jour-soft);color:var(--jour-fonce);border-radius:14px;
  padding:.7rem 1rem;font-size:.9rem;font-weight:600;line-height:1.8;
}

/* ───────── STARTGATE ───────── */
.startgate{
  position:relative;z-index:1;width:100%;max-width:640px;background:#fff;
  border:2px solid var(--bord);border-radius:18px;padding:1.6rem 1.6rem 1.8rem;
  box-shadow:0 6px 24px rgba(0,0,0,.07);text-align:center;
}
.startgate h2{font-size:1.15rem;color:var(--jour-fonce);margin-bottom:.7rem;}
.startgate p{font-size:.9rem;color:var(--texte);line-height:1.9;margin-bottom:.6rem;text-align:left;}
.memo{
  background:var(--jour-soft);border:1.5px solid var(--jour-accent);
  border-left:5px solid var(--jour);border-radius:10px;
  padding:.8rem 1rem;margin:.9rem 0 1.2rem;font-size:.86rem;
  color:var(--jour-fonce);line-height:1.9;text-align:left;
}
.btn{
  font-family:'JetBrains Mono',monospace;border:none;cursor:pointer;
  border-radius:12px;font-weight:800;transition:transform .12s, box-shadow .15s, opacity .15s;
  min-height:2.9rem;
}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;}
.btn-start{
  background:var(--jour);color:#3a2600;font-size:1.05rem;padding:.85rem 2.2rem;
  box-shadow:0 4px 14px rgba(245,197,24,.5);
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(245,197,24,.6);}

/* ───────── TOPBAR STICKY ───────── */
.topbar{
  position:sticky;top:0;z-index:5;width:100%;max-width:680px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(4px);
  border:2px solid var(--bord);border-radius:16px;
  padding:.6rem .9rem .7rem;margin-bottom:1.1rem;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;}
.pastilles{display:flex;gap:.45rem;justify-content:center;flex:1;}
.pastille{
  width:2.1rem;height:2.1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.9rem;border:2px solid var(--bord);color:var(--gris);background:#fff;
  transition:all .25s;
}
.pastille.active{background:var(--jour);border-color:var(--jour);color:#3a2600;transform:scale(1.12);}
.pastille.ok{background:var(--vert);border-color:var(--vert);color:#fff;}
.pastille.ko{background:var(--rouge);border-color:var(--rouge);color:#fff;}
.chrono{
  display:inline-flex;align-items:center;gap:.3rem;background:var(--jour-soft);
  border:2px solid var(--jour);color:var(--jour-fonce);font-weight:800;font-size:1rem;
  padding:.3rem .8rem;border-radius:99px;min-width:4.6rem;justify-content:center;
}
.chrono.warn{background:var(--rouge-soft);border-color:var(--rouge);color:var(--rouge-fonce);
  animation:pulse .55s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.btn-son{
  background:#fff;border:2px solid var(--bord);border-radius:50%;
  width:2.5rem;height:2.5rem;min-height:2.5rem;font-size:1.05rem;cursor:pointer;
}
.progress-bg{background:var(--bord);border-radius:99px;height:8px;overflow:hidden;margin-top:.6rem;}
.progress-fill{height:100%;width:0%;border-radius:99px;transition:width .5s ease;
  background:linear-gradient(90deg,var(--jour),#d9a800);}

/* ───────── CARTE QUESTION ───────── */
.gamearea{position:relative;z-index:1;width:100%;max-width:680px;}
.carte{
  background:#fff;border:2px solid var(--bord);border-radius:18px;
  padding:1.5rem 1.5rem 1.6rem;box-shadow:0 6px 24px rgba(0,0,0,.07);
  animation:fadeUp .35s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.q-label{font-size:.74rem;color:var(--gris);text-transform:uppercase;letter-spacing:.12em;
  font-weight:700;margin-bottom:.8rem;}
.q-consigne{font-size:1rem;font-weight:700;color:var(--jour-fonce);text-align:center;
  margin-bottom:1rem;line-height:1.8;}
.q-consigne i{font-style:italic;}
.figure-box{margin:0 auto 1.1rem;max-width:360px;}
.figure-box svg{width:100%;height:auto;display:block;}

.saisie-ligne{
  display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap;
  margin-bottom:.5rem;font-size:1.3rem;font-weight:800;
}
.saisie-ligne i{font-style:italic;}
.saisie-ligne input{
  font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;
  width:3.6rem;padding:.5rem .4rem;border-radius:11px;
  border:2.5px solid var(--jour);background:#fff;color:var(--texte);text-align:center;
}
.saisie-ligne input:focus{outline:3px solid var(--jour-accent);}
.btn-valider{background:var(--jour);color:#3a2600;font-size:1rem;padding:.7rem 1.6rem;
  box-shadow:0 3px 12px rgba(245,197,24,.5);margin-left:.4rem;}
.aide-saisie{font-size:.8rem;color:var(--gris);text-align:center;margin-bottom:1rem;line-height:1.8;}
.warn-saisie{
  display:none;text-align:center;color:var(--rouge-fonce);background:var(--rouge-soft);
  border:1.5px solid var(--rouge);border-radius:10px;padding:.45rem .7rem;
  font-size:.82rem;margin-bottom:.9rem;line-height:1.7;
}
.warn-saisie.show{display:block;animation:fadeUp .25s ease both;}

/* ───────── FEEDBACK ───────── */
.feedback{display:none;margin-top:1.1rem;border-radius:12px;padding:.85rem 1rem;
  font-size:.9rem;line-height:1.95;}
.feedback.show{display:block;animation:fadeUp .3s ease both;}
.feedback.ok{background:var(--vert-soft);border:2px solid var(--vert);color:var(--vert-fonce);}
.feedback.ko{background:var(--rouge-soft);border:2px solid var(--rouge);color:var(--rouge-fonce);}
.feedback .fb-titre{font-weight:800;font-size:1rem;margin-bottom:.3rem;}

/* ───────── DÉCOMPTE ───────── */
.countdown{
  position:fixed;inset:0;z-index:50;background:rgba(255,251,235,.97);
  display:none;align-items:center;justify-content:center;
}
.countdown.show{display:flex;}
.cd-num{font-size:clamp(5rem,22vw,9rem);font-weight:800;color:var(--jour-titre);
  animation:cdPop .8s ease both;}
@keyframes cdPop{0%{transform:scale(.3);opacity:0;}45%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);opacity:1;}}

/* ───────── RÉSULTATS ───────── */
.resultats{
  display:none;position:relative;z-index:1;width:100%;max-width:640px;background:#fff;
  border:2px solid var(--bord);border-radius:18px;padding:1.8rem 1.6rem;
  box-shadow:0 6px 24px rgba(0,0,0,.07);text-align:center;
}
.resultats.show{display:block;animation:fadeUp .4s ease both;}
.trophee{font-size:3.2rem;margin-bottom:.4rem;}
.score-final{font-size:1.5rem;font-weight:800;color:var(--jour-fonce);margin-bottom:.4rem;}
.etoiles{font-size:2rem;letter-spacing:.2em;margin-bottom:.6rem;}
.msg-final{font-size:.95rem;color:var(--texte);line-height:1.9;margin-bottom:1.2rem;}
.recap{text-align:left;margin-bottom:1.4rem;display:flex;flex-direction:column;gap:.5rem;}
.recap-item{
  display:flex;gap:.6rem;align-items:flex-start;border-radius:10px;
  padding:.55rem .8rem;font-size:.84rem;line-height:1.9;
}
.recap-item.ok{background:var(--vert-soft);border:1.5px solid var(--vert);color:var(--vert-fonce);}
.recap-item.ko{background:var(--rouge-soft);border:1.5px solid var(--rouge);color:var(--rouge-fonce);}
.btn-rejouer{background:var(--jour);color:#3a2600;font-size:1rem;padding:.8rem 1.8rem;
  box-shadow:0 4px 14px rgba(245,197,24,.5);}

.hidden{display:none !important;}

/* ───────── MOBILE ───────── */
@media(max-width:430px){
  body{padding:1.1rem .7rem 3rem;}
  .saisie-ligne{font-size:1.15rem;}
  .saisie-ligne input{font-size:1rem;width:3.2rem;}
  .pastille{width:1.8rem;height:1.8rem;font-size:.8rem;}
  .chrono{font-size:.9rem;min-width:4rem;}
  .topbar{padding:.5rem .6rem .6rem;}
}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<header class="hero">
  <div class="badge-semaine">Semaine 4 · Jour 5</div>
  <h1>Priorités opératoires</h1>
  <p class="sous-titre">Je travaille mes automatismes de calculs</p>
  <div class="consigne">⚡ Entraîne-toi le plus vite possible !</div>
</header>

<section class="startgate" id="startgate">
  <iframe
    src="https://coopmaths.fr/alea/?uuid=4d4a8&id=parallelogramme1&i=1&alea=bQMs&v=can&canD=1&canTi=Course+aux+Nombres&canT=2026&canSA=1&canSM=gathered&canI=1"
    style="display:block;width:125%;height:calc(100vh - 200px);min-height:750px;border:none;border-radius:12px;transform:scale(0.8);transform-origin:top left;margin-bottom:-20%;"
    allowfullscreen
    title="Course aux Nombres — Priorités opératoires">
  </iframe>
  <div style="margin-top:1.2rem;text-align:center;">
    <a href="https://coopmaths.fr/alea/?uuid=4d4a8&id=parallelogramme1&i=1&alea=bQMs&v=can&canD=1&canTi=Course+aux+Nombres&canT=2026&canSA=1&canSM=gathered&canI=1"
       target="_blank" rel="noopener"
       style="display:inline-block;background:var(--jour);color:#3a2600;font-family:'JetBrains Mono',monospace;
              font-weight:800;font-size:.95rem;padding:.75rem 2rem;border-radius:12px;
              text-decoration:none;box-shadow:0 4px 14px rgba(245,197,24,.5);">
      &#9654;&#65039; Ouvrir en plein &eacute;cran
    </a>
  </div>
</section>

</body>
</html>
