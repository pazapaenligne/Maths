<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Je relève le défi – 4ème S3 J5 · Calcul littéral (V2 iframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --jour:#f5c518; --jour-fonce:#8a6000; --jour-clair:#fffbeb; --jour-pale:#f5e08a;
  --bg:#fffdf7; --txt:#2b2010; --gris:#8b7a60;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg); color: var(--txt);
  min-height: 100vh; padding: 20px 16px 50px;
  position: relative; overflow-x: hidden;
}
.bulle{ position:fixed; border-radius:50%; opacity:.30; z-index:0; pointer-events:none; }
.bulle-1{ width:200px; height:200px; background:#ffd84d; top:-60px; right:-50px; }
.bulle-2{ width:240px; height:240px; background:var(--jour-pale); bottom:-80px; left:-70px; }
.bulle-3{ width:150px; height:150px; background:#9be7a5; top:45%; right:-70px; }
.bulle-4{ width:120px; height:120px; background:#f7c8d4; top:200px; left:-30px; }
.wrap{ position:relative; z-index:1; max-width:1100px; margin:0 auto; }
.header{ text-align:center; margin-bottom:24px; }
.logo-badge{
  display:inline-flex; align-items:center; gap:8px;
  background: var(--jour); color:#3a2c00;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.72rem;
  letter-spacing:1.5px; padding:6px 14px; border-radius:20px;
  box-shadow:0 3px 10px rgba(245,197,24,.4); margin-bottom:12px;
}
.logo-badge .dots{ display:inline-flex; gap:3px; }
.logo-badge .dots i{ width:7px; height:7px; border-radius:50%; background:#3a2c00; display:block; }
.logo-badge .dots i:nth-child(2){ opacity:.6; }
.logo-badge .dots i:nth-child(3){ opacity:.3; }
.semaine{
  font-family:'Orbitron',sans-serif; font-size:.78rem; letter-spacing:3px;
  color:var(--gris); text-transform:uppercase; margin-bottom:6px;
}
.titre{
  font-family:'Orbitron', sans-serif; font-weight:900;
  font-size:2.2rem; line-height:1.1; color:var(--txt); margin-bottom:6px;
}
.titre .accent{ color:var(--jour-fonce); }
.sous-titre{
  font-family:'Orbitron',sans-serif; font-size:.82rem; letter-spacing:2px;
  color:var(--gris); margin-bottom:14px;
}
.badge-mission{
  display:inline-block; background: var(--jour); color:#3a2c00;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.82rem;
  letter-spacing:1px; padding:9px 22px; border-radius:24px;
  box-shadow:0 4px 14px rgba(245,197,24,.45);
}
.consigne{
  background: var(--jour-clair);
  border: 2px solid var(--jour);
  border-radius: 12px;
  padding: 14px 20px;
  margin-bottom: 18px;
  text-align: center;
  font-size: .95rem;
  color: var(--jour-fonce);
  font-weight: 600;
}
.consigne b{ color: var(--txt); }
.cadre-iframe{
  background: #fff;
  border: 4px solid var(--jour);
  border-radius: 16px;
  padding: 8px;
  box-shadow: 0 10px 28px rgba(0,0,0,.12);
}
.cadre-iframe .iframe-container{
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
}
.cadre-iframe iframe{
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: none;
  background: #fff;
}
.footer-aide{
  text-align: center; margin-top: 14px;
  font-size: .85rem; color: var(--gris);
  font-family:'Orbitron',sans-serif;
  letter-spacing: 1px; font-style: italic;
}
</style>
</head>
<body>

<div class="bulle bulle-1"></div>
<div class="bulle bulle-2"></div>
<div class="bulle bulle-3"></div>
<div class="bulle bulle-4"></div>

<div class="wrap">

  <div class="header">
    <div class="logo-badge">
      <span class="dots"><i></i><i></i><i></i></span>
      PAZAPA · MATHS · 4ÈME
    </div>
    <div class="semaine">Semaine 3 – Jour 5</div>
    <h1 class="titre">🏆 Je relève le <span class="accent">défi</span>&nbsp;!</h1>
    <div class="sous-titre">🏚️ Escape game · calcul littéral</div>
    <div class="badge-mission">▶ DÉFI MATHS 4ÈME</div>
  </div>

  <div class="consigne">
    🎯 <b>Consigne</b>&nbsp;: explore la maison abandonnée et résous les énigmes pour t&apos;échapper&nbsp;!
  </div>

  <div class="cadre-iframe">
    <div class="iframe-container">
      <iframe
        title="Escape game calcul littéral"
        src="https://view.genially.com/5fc3575cb4ceef0d0bcfd026"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true"
        scrolling="yes"
        allownetworking="all"></iframe>
    </div>
  </div>

  <div class="footer-aide">✨ Bonne chance, jeune mathématicien&nbsp;! ✨</div>

</div>

</body>
</html>
