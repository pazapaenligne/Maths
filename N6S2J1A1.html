<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Exercices — Comparer et ordonner les décimaux</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  /* ═══ COULEUR DU JOUR — Lundi (Jour 1) → Orange ═══ */
  :root {
    --day-color:  #f5a623;
    --day-dark:   #c47a10;
    --day-light:  #fff5e0;
    --day-border: #f5d080;
    --day-glow:   rgba(245,166,35,.3);
  }
  /* ═══ CHARTE PAZAPA — NE PAS TOUCHER ═══ */
  :root {
    --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
    --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
    --pink:#f28b82; --orange:#f5a623;
    --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
    position:relative;overflow-x:hidden;letter-spacing:.02em;word-spacing:.06em;}
  body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
  body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
  .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
  .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--pink);top:200px;left:-30px;pointer-events:none;}

  header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
  .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
  .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
  h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
  h1 .hl{color:var(--day-dark);}
  .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

  .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
  .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
  .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}

  .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
  .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:99px;font-size:.8rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  .chip.correct .dot{background:var(--green);}
  .chip.wrong .dot{background:var(--pink);}
  .chip.remaining .dot{background:var(--muted);}

  .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 2rem 1.6rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--pink),var(--blue));}

  .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);}
  .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.1em;}
  .q-title{font-size:1.05rem;font-weight:800;color:var(--text);margin-bottom:.4rem;line-height:1.3;}
  .consigne{font-size:.88rem;color:var(--muted);margin-bottom:1.1rem;line-height:1.6;}

  .item{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;padding:.55rem .2rem;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:.95rem;}
  .item:last-child{border-bottom:none;}
  .item-lbl{color:var(--day-dark);font-weight:700;min-width:1.5rem;}
  .item-val{font-weight:600;}

  /* Ex1 : boutons < > = */
  .cmp-group{display:inline-flex;gap:.3rem;}
  .cmp-btn{width:2.4rem;height:2.4rem;border-radius:8px;border:2px solid var(--border);background:var(--surface);
    font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:var(--day-dark);cursor:pointer;transition:all .15s;}
  .cmp-btn:hover:not(:disabled){border-color:var(--day-color);background:var(--day-light);}
  .cmp-btn.sel{background:var(--day-color);color:#fff;border-color:var(--day-color);}
  .cmp-btn.correct{background:#f0faeb;border-color:var(--green);color:#2f6e10;}
  .cmp-btn.wrong{background:#fff0ef;border-color:var(--pink);color:#c0392b;}
  .cmp-btn:disabled{cursor:default;}
  .cmp-group.cmp-empty{outline:2px dashed var(--orange);outline-offset:3px;border-radius:8px;}

  /* saisies (Ex2, Ex3) */
  .blank-input{font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:600;color:var(--day-dark);
    background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:.3rem .5rem;text-align:center;
    min-height:2.6rem;width:5.5rem;outline:none;transition:border-color .2s,background .2s;}
  .blank-input:focus{border-color:var(--day-color);background:#fff;}
  .blank-input:disabled{cursor:default;}
  .blank-input.blank-wide{width:7rem;}
  .blank-input.correct-input{background:#f0faeb;border-color:var(--green);color:#2f6e10;}
  .blank-input.wrong-input{background:#fff0ef;border-color:var(--pink);color:#c0392b;}
  .serie-line{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;}
  .serie-src{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.3rem;}
  .lt{color:var(--day-dark);font-weight:700;}

  .corr-note{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--day-dark);margin-top:.3rem;display:none;}
  .corr-note.show{display:block;}

  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:2.6rem;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.38;cursor:default;}
  .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
  .btn-hint{background:var(--orange);color:#fff;}
  .btn-solution{background:var(--day-dark);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
  .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

  .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:.85rem;color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
  .hint-box.show{display:block;}
  .hint-box strong{color:#a86b00;}

  .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;font-size:.9rem;display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
  .feedback.show{display:flex;}
  .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
  .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
  .feedback.partial{background:#fffbeb;border:1.5px solid var(--yellow);color:#7a6010;}
  .feedback-icon{font-size:1.4rem;flex-shrink:0;}
  .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.8;}

  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.4rem;position:relative;z-index:2;}

  .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
  .results.show{display:block;}
  .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
  .results-score .s-num{color:var(--day-dark);}
  .stars{font-size:2rem;margin:.4rem 0 1rem;letter-spacing:.1em;}
  .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
  .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
  .recap-item{display:flex;align-items:center;gap:.8rem;padding:.65rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.6;}
  .recap-item .eq{color:var(--day-dark);flex:1;}
  .recap-item.ok-item{border-color:#b5e08a;}
  .recap-item.ko-item{border-color:#f9c0bb;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:480px){
    .card,.results-card{padding:1.4rem;}
    .btn{font-size:.85rem;padding:.55rem 1rem;}
  }
</style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#f28b82"></span>
    Pazapa &middot; Maths &middot; 6&egrave;me
  </div>
  <div class="week-label">Semaine 2 &ndash; Jour 1</div>
  <h1><span style="color:var(--text)">Comparer et ordonner</span> <span class="hl">les d&eacute;cimaux</span></h1>
  <p class="subtitle">3 exercices &middot; 17 items</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Exercice 1 / 3</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="prog-bar" style="width:0%"></div>
  </div>
</div>

<div class="score-row">
  <div class="chip correct"><div class="dot"></div><span id="cnt-ok">0</span> correctes</div>
  <div class="chip wrong"><div class="dot"></div><span id="cnt-ko">0</span> erreurs</div>
  <div class="chip remaining"><div class="dot"></div><span id="cnt-rem">17</span> restantes</div>
</div>

<div class="card" id="ex-card">
  <div class="card-stripe"></div>
  <div class="q-num" id="q-num">Exercice 1</div>
  <div class="theme-badge">Comparer les d&eacute;cimaux</div>
  <div class="q-title" id="q-title"></div>
  <div class="consigne" id="q-txt"></div>
  <div id="q-body"></div>
  <div class="hint-box" id="hint-box"></div>
  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="fb-icon"></span>
    <div><div id="fb-msg"></div><div class="feedback-detail" id="fb-det"></div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()" style="display:none;">&#8592; Pr&eacute;c&eacute;dent</button>
    <button class="btn btn-primary" id="btn-check" onclick="checkEx()">&#10003; V&eacute;rifier</button>
    <button class="btn btn-hint" id="btn-hint" onclick="toggleHint()">? Indice</button>
    <button class="btn btn-solution" id="btn-solution" onclick="showSolution()" style="display:none;">&#128161; Solution</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQ()" style="display:none;">Suivant &#8594;</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#f28b82"></span>
      R&eacute;sultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/17</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <div class="recap-list" id="recap-list"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">
      &#128260; Recommencer
    </button>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
function rnd(v){ return Math.round(v*1e9)/1e9; }
function fr(v){ return String(rnd(v)).replace('.',','); }
function num(s){ var n=parseFloat(String(s).trim().replace(/\u202f/g,'').replace(/\s/g,'').replace(',','.')); return isNaN(n)?null:n; }

// Compare une valeur tapée à une cible (numérique si possible, sinon texte brut comme "32 %")
function matchOne(target, val){
  var tv=num(target);
  if(tv!==null){ var uv=num(val); return uv!==null && Math.abs(uv-tv)<1e-9; }
  return String(val).trim().replace(/\s/g,'')===target.replace(/\s/g,'');
}
// Une cellule peut attendre 1 valeur, ou 2 valeurs égales (l'élève tape les deux, dans n'importe quel ordre)
function matchCell(cell, val){
  if(cell.length===1) return matchOne(cell[0], val);
  // 2 valeurs égales : on attend que la saisie contienne les deux (séparées par =, ; , espace…)
  var parts=String(val).split(/\s*=\s*|\s*;\s*|\s+/).map(function(p){return p.trim();}).filter(function(p){return p.length>0;});
  if(parts.length<2) return false;
  // chaque valeur attendue doit être retrouvée dans la saisie, et inversement (mêmes nombres)
  var okAll = cell.every(function(c){ return parts.some(function(p){ return matchOne(c,p); }); });
  var noExtra = parts.every(function(p){ return cell.some(function(c){ return matchOne(c,p); }); });
  return okAll && noExtra && parts.length===cell.length;
}
function cellText(cell){ return cell.join(" = "); }
function serieText(it){
  var out="";
  it.cells.forEach(function(cell,k){
    if(k>0){ var op=(it.ops && it.ops[k-1])?it.ops[k-1]:"<"; out+=" "+op+" "; }
    out+=cellText(cell);
  });
  return out;
}

// ── Exercice 1 : comparer par < > = ──
var EX1 = [
  {a:"4,7", b:"4,700", rep:"="},
  {a:"13,95", b:"12,01", rep:">"},
  {a:"3,4", b:"8,39", rep:"<"},
  {a:"1,754", b:"1,76", rep:"<"},
  {a:"8,5", b:"8,499", rep:">"},
  {a:"19,020", b:"10,021", rep:">"},
  {a:"64,7201", b:"64,723", rep:"<"}
];
// ── Exercice 2 : ranger dans l'ordre croissant ──
var EX2 = [
  {src:"1 ; -2,7 ; -0,8 ; -0,2 ; -1,1", cells:[["-2,7"],["-1,1"],["-0,8"],["-0,2"],["1"]]},
  {src:"8,5 ; 8,61 ; 8 ; 8,50 ; 8,45", cells:[["8"],["8,45"],["8,5"],["8,50"],["8,61"]], ops:["<","<","=","<"], eqGroup:[2,3], egalite:true},
  {src:"45,01 ; 45,41 ; 45,1 ; 44,91 ; 45,025", cells:[["44,91"],["45,01"],["45,025"],["45,1"],["45,41"]]},
  {src:"1 + 21/100 ; 32 % ; 124/100 ; 347/1000 ; 0,345", cells:[["32 %"],["0,345"],["347/1000"],["1 + 21/100"],["124/100"]], vals:[0.32,0.345,0.347,1.21,1.24]}
];
// ── Exercice 3 : intercaler un décimal (réponse = tout nombre dans l'intervalle ouvert) ──
var EX3 = [
  {a:"18", b:"19", lo:18, hi:19},
  {a:"2,3", b:"2,4", lo:2.3, hi:2.4},
  {a:"64", b:"64,2", lo:64, hi:64.2},
  {a:"0,50", b:"0,51", lo:0.50, hi:0.51},
  {a:"5,8", b:"5,9", lo:5.8, hi:5.9},
  {a:"3", b:"3,01", lo:3, hi:3.01}
];

var EXOS = [
  {
    title:"1. Recopie et compl\u00e8te par <, > ou =.",
    txt:"Clique sur le bon signe entre les deux nombres.",
    type:"cmp", data:EX1,
    hint:"<strong>Astuce\u00a0:</strong> compare d\u2019abord les parties enti\u00e8res, puis les dixi\u00e8mes, puis les centi\u00e8mes\u2026 Les z\u00e9ros inutiles \u00e0 la fin ne changent pas la valeur (par exemple 2,3 = 2,30)."
  },
  {
    title:"2. Ranger dans l\u2019ordre croissant chaque s\u00e9rie de nombres.",
    txt:"\u00c9cris les nombres de la s\u00e9rie du plus petit au plus grand.",
    type:"order", data:EX2,
    hint:"<strong>Astuce\u00a0:</strong> convertis tout dans la m\u00eame \u00e9criture d\u00e9cimale pour comparer. Souviens-toi qu\u2019un pourcentage se divise par 100 et qu\u2019une fraction d\u00e9cimale se lit selon son d\u00e9nominateur (par exemple 5/10 = 0,5). Attention aux nombres n\u00e9gatifs\u00a0: le plus petit est le plus \u00e9loign\u00e9 de z\u00e9ro."
  },
  {
    title:"3. Recopier et compl\u00e9ter par un nombre d\u00e9cimal.",
    txt:"\u00c9cris un nombre d\u00e9cimal compris entre les deux bornes.",
    type:"between", data:EX3,
    hint:"<strong>Astuce\u00a0:</strong> il existe plusieurs r\u00e9ponses. Cherche un nombre strictement plus grand que celui de gauche et strictement plus petit que celui de droite. Par exemple, entre 4 et 5 on peut \u00e9crire 4,2, 4,5 ou 4,75."
  }
];

var TOTAL_EX = EXOS.length;
var TOTAL_PTS = EX1.length + EX2.length + EX3.length; // 7 + 4 + 6 = 17
var cur = 0;
var validated = [false,false,false];
var hintOpen = false;

function buildEx(){
  var ex=EXOS[cur];
  var body=$("q-body"); body.innerHTML="";

  if(ex.type==="cmp"){
    ex.data.forEach(function(it,i){
      var row=document.createElement("div"); row.className="item";
      row.innerHTML="<span class='item-lbl'>"+String.fromCharCode(97+i)+")</span>"
        +"<span class='item-val'>"+it.a+"</span>"
        +"<span class='cmp-group' id='cmp-"+i+"'>"
        +"<button class='cmp-btn' data-s='<' onclick='pickCmp("+i+",\"<\")'>&lt;</button>"
        +"<button class='cmp-btn' data-s='>' onclick='pickCmp("+i+",\">\")'>&gt;</button>"
        +"<button class='cmp-btn' data-s='=' onclick='pickCmp("+i+",\"=\")'>=</button>"
        +"</span>"
        +"<span class='item-val'>"+it.b+"</span>";
      body.appendChild(row);
    });
  } else if(ex.type==="order"){
    ex.data.forEach(function(it,i){
      var row=document.createElement("div"); row.className="item"; row.style.flexDirection="column"; row.style.alignItems="flex-start";
      var src=document.createElement("div"); src.className="serie-src";
      src.innerHTML="<span class='item-lbl'>"+String.fromCharCode(97+i)+")</span> "+it.src;
      row.appendChild(src);
      var line=document.createElement("div"); line.className="serie-line";
      it.cells.forEach(function(cell,k){
        if(k>0){
          var lt=document.createElement("span"); lt.className="lt";
          lt.textContent = (it.ops && it.ops[k-1]) ? it.ops[k-1] : "<";
          line.appendChild(lt);
        }
        var inp=document.createElement("input"); inp.type="text"; inp.className="blank-input";
        inp.setAttribute("autocomplete","off"); inp.id="o_"+i+"_"+k; inp.placeholder="?";
        inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ var b=$("btn-check"); if(b && b.style.display!=='none' && !b.disabled) checkEx(); } });
        line.appendChild(inp);
      });
      row.appendChild(line);
      body.appendChild(row);
    });
  } else { // between
    ex.data.forEach(function(it,i){
      var row=document.createElement("div"); row.className="item";
      var inp="<input type='text' class='blank-input' id='b_"+i+"' placeholder='?' autocomplete='off'>";
      row.innerHTML="<span class='item-lbl'>"+String.fromCharCode(97+i)+")</span>"
        +"<span class='item-val'>"+it.a+"</span><span class='lt'>&lt;</span>"+inp+"<span class='lt'>&lt;</span><span class='item-val'>"+it.b+"</span>";
      body.appendChild(row);
      setTimeout((function(id){return function(){var el=$(id);if(el)el.addEventListener("keydown",function(e){if(e.key==="Enter"){var b=$("btn-check");if(b&&b.style.display!=='none'&&!b.disabled)checkEx();}});};})("b_"+i),0);
    });
  }
}

var pickState = {};
function pickCmp(i,sign){
  if(validated[cur]) return;
  pickState[i]=sign;
  var grp=$("cmp-"+i);
  [].slice.call(grp.children).forEach(function(b){
    b.classList.toggle("sel", b.getAttribute("data-s")===sign);
  });
  updateRemaining();
}

function renderQ(){
  var ex=EXOS[cur];
  $("q-num").textContent="Exercice "+(cur+1);
  $("q-title").textContent=ex.title;
  $("q-txt").textContent=ex.txt;
  $("hint-box").classList.remove("show"); $("hint-box").innerHTML=""; hintOpen=false;
  $("feedback").className="feedback";
  pickState={};
  $("btn-prev").style.display = cur>0 ? "inline-flex" : "none";
  $("btn-hint").style.display = ex.hint ? "inline-flex" : "none";

  buildEx();

  if(validated[cur]){
    restoreEx();
    $("btn-check").style.display="none";
    $("btn-hint").disabled=true;
    $("btn-solution").style.display="inline-flex";
    $("btn-next").style.display="inline-flex";
    $("btn-next").textContent = cur===TOTAL_EX-1 ? "Voir les r\u00e9sultats \u2192" : "Suivant \u2192";
    showFB();
  } else {
    $("btn-check").style.display="inline-flex"; $("btn-check").disabled=false;
    $("btn-hint").disabled=false;
    $("btn-solution").style.display="none"; $("btn-solution").disabled=false;
    $("btn-next").style.display="none";
  }
  updateStats();
}

function hasAnyInput(ex){
  if(ex.type==="cmp"){
    return ex.data.some(function(_,i){ return pickState[i]!==undefined && pickState[i]!==null; });
  } else if(ex.type==="order"){
    return ex.data.some(function(it,i){
      return it.cells.some(function(_,k){ var el=$("o_"+i+"_"+k); return el && el.value.trim().length>0; });
    });
  } else {
    return ex.data.some(function(_,i){ var el=$("b_"+i); return el && el.value.trim().length>0; });
  }
}

function evalEx(){
  // retourne {ok, total, detail:[bool]}
  var ex=EXOS[cur], ok=0, detail=[];
  if(ex.type==="cmp"){
    ex.data.forEach(function(it,i){ var good=pickState[i]===it.rep; detail.push(good); if(good)ok++; });
  } else if(ex.type==="order"){
    ex.data.forEach(function(it,i){
      var good=true;
      it.cells.forEach(function(cell,k){
        var el=$("o_"+i+"_"+k);
        if(!el || !matchCell(cell, el.value)) good=false;
      });
      detail.push(good); if(good)ok++;
    });
  } else {
    ex.data.forEach(function(it,i){
      var el=$("b_"+i); var v=num(el?el.value:"");
      var good = v!==null && v>it.lo+1e-12 && v<it.hi-1e-12;
      detail.push(good); if(good)ok++;
    });
  }
  return {ok:ok, total:ex.data.length, detail:detail};
}

function checkEx(){
  if(validated[cur]) return;
  var ex=EXOS[cur];
  // exiger au moins une saisie : sinon on ne valide pas (sinon l'élève verrait les réponses sans rien faire)
  if(!hasAnyInput(ex)){
    var fb=$("feedback");
    fb.className="feedback show ko";
    $("fb-icon").textContent="\u270b";
    $("fb-msg").innerHTML="<strong>R\u00e9ponds d\u2019abord\u00a0!</strong>";
    $("fb-det").textContent="\u00c9cris ou s\u00e9lectionne au moins une r\u00e9ponse avant de v\u00e9rifier.";
    return;
  }
  var info=evalEx();
  validated[cur]=true;
  ex._info=info;

  // appliquer styles
  if(ex.type==="cmp"){
    ex.data.forEach(function(it,i){
      var grp=$("cmp-"+i);
      [].slice.call(grp.children).forEach(function(b){ b.disabled=true; });
      var sel=pickState[i];
      if(sel===undefined || sel===null){
        // item non répondu : on ne dévoile pas la bonne réponse, on signale juste "non répondu"
        grp.classList.add("cmp-empty");
        return;
      }
      [].slice.call(grp.children).forEach(function(b){
        var s=b.getAttribute("data-s");
        if(s===it.rep){ b.classList.add("correct"); }
        if(s===sel && sel!==it.rep){ b.classList.add("wrong"); }
      });
    });
  } else if(ex.type==="order"){
    ex.data.forEach(function(it,i){
      it.cells.forEach(function(cell,k){
        var el=$("o_"+i+"_"+k); if(!el)return;
        var good=matchCell(cell, el.value);
        el.className="blank-input "+(good?"correct-input":"wrong-input");
        el.disabled=true;
      });
      // Félicitation si les deux cases du groupe d'égalité sont correctes
      if(it.egalite && it.eqGroup){
        var both=it.eqGroup.every(function(k){ var el=$("o_"+i+"_"+k); return el && matchCell(it.cells[k], el.value); });
        if(both) EXOS[cur]._egaliteOk=true;
      }
    });
  } else {
    ex.data.forEach(function(it,i){
      var el=$("b_"+i); var v=num(el.value);
      var good=v!==null && v>it.lo+1e-12 && v<it.hi-1e-12;
      el.className="blank-input "+(good?"correct-input":"wrong-input");
      el.disabled=true;
    });
  }

  $("btn-check").style.display="none";
  $("btn-hint").disabled=true;
  $("btn-solution").style.display="inline-flex";
  $("btn-next").style.display="inline-flex";
  $("btn-next").textContent = cur===TOTAL_EX-1 ? "Voir les r\u00e9sultats \u2192" : "Suivant \u2192";
  showFB();
  updateStats();
  $("feedback").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function restoreEx(){
  var ex=EXOS[cur]; if(!ex._saved) return;
  if(ex.type==="cmp"){
    ex.data.forEach(function(it,i){
      pickState[i]=ex._saved[i];
      var grp=$("cmp-"+i);
      [].slice.call(grp.children).forEach(function(b){
        b.disabled=true;
        var s=b.getAttribute("data-s");
        if(s===it.rep) b.classList.add("correct");
        if(s===ex._saved[i] && ex._saved[i]!==it.rep) b.classList.add("wrong");
      });
    });
  } else if(ex.type==="order"){
    ex.data.forEach(function(it,i){
      it.cells.forEach(function(cell,k){
        var el=$("o_"+i+"_"+k); if(!el)return;
        el.value=ex._saved[i+"_"+k]||"";
        var good=matchCell(cell, el.value);
        el.className="blank-input "+(good?"correct-input":"wrong-input"); el.disabled=true;
      });
    });
  } else {
    ex.data.forEach(function(it,i){
      var el=$("b_"+i); el.value=ex._saved[i]||"";
      var v=num(el.value); var good=v!==null && v>it.lo+1e-12 && v<it.hi-1e-12;
      el.className="blank-input "+(good?"correct-input":"wrong-input"); el.disabled=true;
    });
  }
}

function saveEx(){
  var ex=EXOS[cur]; ex._saved={};
  if(ex.type==="cmp"){ ex.data.forEach(function(_,i){ ex._saved[i]=pickState[i]; }); }
  else if(ex.type==="order"){ ex.data.forEach(function(it,i){ it.cells.forEach(function(_,k){ var el=$("o_"+i+"_"+k); ex._saved[i+"_"+k]=el?el.value:""; }); }); }
  else { ex.data.forEach(function(_,i){ var el=$("b_"+i); ex._saved[i]=el?el.value:""; }); }
}

function showFB(){
  var ex=EXOS[cur];
  var info = ex._info || evalEx();
  if(!ex._saved) saveEx();
  var allOk=info.ok===info.total;
  var fb=$("feedback");
  fb.className="feedback show "+(allOk?"ok":(info.ok===0?"ko":"partial"));
  $("fb-icon").textContent= allOk?"\u2705":(info.ok===0?"\u274c":"\u26a0");
  $("fb-msg").innerHTML="<strong>"+info.ok+" / "+info.total+"</strong> item"+(info.ok>1?"s":"")+" correct"+(info.ok>1?"s":"")+".";
  var corr=buildCorr(ex,info);
  if(ex._egaliteOk){
    corr = "\ud83d\udc4f Bravo\u00a0! Tu as bien compris que 8,5 et 8,50 sont le m\u00eame nombre."
         + (corr==="Tout est correct pour cet exercice." ? "" : "<br>"+corr);
  }
  $("fb-det").innerHTML=corr;
}

function pourquoiCmp(a,b,rep){
  var na=num(a), nb=num(b);
  if(rep==="="){
    return " (m\u00eame valeur\u00a0: les z\u00e9ros inutiles \u00e0 la fin ne comptent pas).";
  }
  var ia=Math.floor(Math.abs(na)), ib=Math.floor(Math.abs(nb));
  if(ia!==ib){
    return " (on compare les parties enti\u00e8res\u00a0: "+ia+" et "+ib+").";
  }
  return " (parties enti\u00e8res \u00e9gales, on compare alors les chiffres apr\u00e8s la virgule).";
}
function isAnswered(ex,i){
  if(ex.type==="cmp"){ return pickState[i]!==undefined && pickState[i]!==null; }
  if(ex.type==="order"){ return ex.data[i].cells.some(function(_,k){ var el=$("o_"+i+"_"+k); return el && el.value.trim().length>0; }); }
  var el=$("b_"+i); return el && el.value.trim().length>0;
}
function buildCorr(ex,info){
  var L=[];
  if(ex.type==="cmp"){
    ex.data.forEach(function(it,i){
      if(info.detail[i]) return;
      var lbl=String.fromCharCode(97+i)+")\u00a0";
      if(!isAnswered(ex,i)) L.push(lbl+"tu n\u2019as pas r\u00e9pondu \u00e0 cet item.");
      else L.push(lbl+"comparaison incorrecte (compare rang par rang, en commen\u00e7ant par la partie enti\u00e8re).");
    });
  } else if(ex.type==="order"){
    ex.data.forEach(function(it,i){
      if(info.detail[i]) return;
      var lbl=String.fromCharCode(97+i)+")\u00a0";
      if(!isAnswered(ex,i)) L.push(lbl+"tu n\u2019as pas r\u00e9pondu \u00e0 cette s\u00e9rie.");
      else L.push(lbl+"l\u2019ordre n\u2019est pas correct (range du plus petit au plus grand en comparant rang par rang).");
    });
  } else {
    ex.data.forEach(function(it,i){
      if(info.detail[i]) return;
      var lbl=String.fromCharCode(97+i)+")\u00a0";
      if(!isAnswered(ex,i)) L.push(lbl+"tu n\u2019as pas r\u00e9pondu \u00e0 cet item.");
      else L.push(lbl+"ce nombre ne convient pas (il doit \u00eatre plus grand que le premier et plus petit que le second).");
    });
  }
  if(L.length===0) return "Tout est correct pour cet exercice.";
  return "\u00c0 revoir\u00a0:<br>"+L.join("<br>") + "<br><span style='color:var(--muted)'>Clique sur \u00ab Solution \u00bb pour voir les bonnes r\u00e9ponses.</span>";
}

function showSolution(){
  if(!validated[cur]) return;
  var ex=EXOS[cur];
  if(ex.type==="cmp"){
    ex.data.forEach(function(it,i){
      var grp=$("cmp-"+i);
      [].slice.call(grp.children).forEach(function(b){
        b.classList.remove("wrong","sel");
        b.classList.toggle("correct", b.getAttribute("data-s")===it.rep);
      });
    });
  } else if(ex.type==="order"){
    ex.data.forEach(function(it,i){ it.cells.forEach(function(cell,k){ var el=$("o_"+i+"_"+k); if(el){ el.value=cellText(cell); el.className="blank-input correct-input"; } }); });
  } else {
    ex.data.forEach(function(it,i){ var el=$("b_"+i); if(el){ el.value=fr((it.lo+it.hi)/2); el.className="blank-input correct-input"; } });
  }
  $("feedback").className="feedback show ok";
  $("fb-icon").textContent="\u2705";
  $("fb-msg").innerHTML="<strong>Solution affich\u00e9e.</strong>";
  $("fb-det").textContent="Les bonnes r\u00e9ponses de cet exercice sont affich\u00e9es.";
  $("btn-solution").disabled=true;
}

function toggleHint(){
  if(validated[cur]) return;
  var h=$("hint-box"); hintOpen=!hintOpen;
  if(hintOpen){ h.innerHTML=EXOS[cur].hint; h.classList.add("show"); } else h.classList.remove("show");
}

function totalScore(){
  var s=0; EXOS.forEach(function(ex){ if(ex._info) s+=ex._info.ok; }); return s;
}
function updateRemaining(){ /* placeholder for live count before validation */ }

function updateStats(){
  var doneEx=validated.filter(Boolean).length;
  $("prog-bar").style.width=Math.round(doneEx/TOTAL_EX*100)+"%";
  $("prog-label").textContent="Exercice "+(cur+1)+" / "+TOTAL_EX;
  $("prog-pct").textContent=Math.round(doneEx/TOTAL_EX*100)+"\u00a0%";
  var ok=totalScore();
  var done=0; EXOS.forEach(function(ex){ if(ex._info) done+=ex._info.total; });
  $("cnt-ok").textContent=ok;
  $("cnt-ko").textContent=done-ok;
  $("cnt-rem").textContent=TOTAL_PTS-done;
}

function nextQ(){ if(cur<TOTAL_EX-1){ cur++; renderQ(); window.scrollTo({top:0,behavior:"smooth"}); } else showResults(); }
function prevQ(){ if(cur>0){ cur--; renderQ(); window.scrollTo({top:0,behavior:"smooth"}); } }

function showResults(){
  $("ex-card").style.display="none";
  $("results-screen").classList.add("show");
  var ok=totalScore();
  $("score-num").textContent=ok;
  var ratio=ok/TOTAL_PTS;
  var stars=ratio>=1?5:ratio>=0.8?4:ratio>=0.6?3:ratio>=0.4?2:1;
  $("stars-row").textContent="\u2b50".repeat(stars)+"\u2606".repeat(5-stars);
  var msg;
  if(ratio>=1) msg="Parfait\u00a0! Les 17 items sont justes.";
  else if(ratio>=0.8) msg="Tr\u00e8s bien\u00a0! Tu ma\u00eetrises la comparaison des d\u00e9cimaux.";
  else if(ratio>=0.5) msg="Bien. Quelques items sont \u00e0 revoir.";
  else msg="\u00c0 retravailler. Relis la le\u00e7on, puis recommence.";
  $("results-msg").textContent=msg;
  var list=$("recap-list"); list.innerHTML="";
  EXOS.forEach(function(ex,i){
    var info=ex._info||{ok:0,total:ex.data.length};
    var exOk=info.ok===info.total && validated[i];
    var d=document.createElement("div"); d.className="recap-item "+(exOk?"ok-item":"ko-item");
    d.innerHTML="<span>"+(exOk?"\u2705":"\u274c")+"</span><span class='eq'>Exercice "+(i+1)+"</span><span>"+info.ok+" / "+info.total+"</span>";
    list.appendChild(d);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  cur=0; validated=[false,false,false]; hintOpen=false; pickState={};
  EXOS.forEach(function(ex){ delete ex._info; delete ex._saved; delete ex._egaliteOk; });
  $("ex-card").style.display="block"; $("results-screen").classList.remove("show");
  $("cnt-ok").textContent="0"; $("cnt-ko").textContent="0"; $("cnt-rem").textContent=TOTAL_PTS;
  renderQ();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", function(){
  $("cnt-rem").textContent=TOTAL_PTS;
  renderQ();
});
</script>
</body>
