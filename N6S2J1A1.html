<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Semaine 2 Jour 1 – Nombres décimaux</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══════════════════════════════════════════════════
       COULEUR DU JOUR — LUNDI (orange)
    ═══════════════════════════════════════════════════ */
    :root {
      --day-color:  #f5a623;
      --day-dark:   #c47a10;
      --day-light:  #fff5e0;
      --day-border: #f5d080;
      --day-glow:   rgba(245,166,35,.3);
    }

    /* ═══════════════════════════════════════════════════
       CHARTE PAZAPA — NE PAS TOUCHER
    ═══════════════════════════════════════════════════ */
    :root {
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg); color:var(--text);
      font-family:Arial,sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; padding:2rem 1rem 4rem;
      position:relative; overflow-x:hidden;
      letter-spacing:.02em; word-spacing:.06em;
    }
    body::before{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:340px; height:340px;
      background:var(--yellow); top:-80px; right:-80px;
      pointer-events:none;
    }
    body::after{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:260px; height:260px;
      background:var(--day-color); bottom:-60px; left:-60px;
      pointer-events:none;
    }
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:180px;height:180px;background:var(--green);
      bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:120px;height:120px;background:var(--pink);
      top:200px;left:-30px;pointer-events:none;}

    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{
      display:inline-flex;align-items:center;gap:.5rem;
      background:var(--yellow);color:#000;
      font-size:.78rem;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;padding:.3rem .9rem;
      border-radius:99px;margin-bottom:.5rem;
    }
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;color:var(--muted);margin-bottom:.5rem;
    }
    h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
    h1 .hl{color:var(--day-color);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;
      font-family:'JetBrains Mono',monospace;}

    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;
      position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;
      font-size:.78rem;color:var(--muted);
      font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;
      height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;
      background:linear-gradient(90deg,var(--day-color),var(--yellow));
      border-radius:99px;transition:width .5s ease;}

    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;
      flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;
      border-radius:99px;font-size:.8rem;
      font-family:'JetBrains Mono',monospace;
      border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong   .dot{background:var(--pink);}
    .chip.remaining .dot{background:var(--muted);}

    .card{width:100%;max-width:680px;background:var(--surface);
      border:2px solid var(--border);border-radius:var(--radius);
      padding:2rem 2rem 1.6rem;position:relative;z-index:1;
      box-shadow:0 4px 20px rgba(0,0,0,.06);
      animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}

    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;
      color:var(--muted);margin-bottom:.5rem;
      text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;
      padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;
      letter-spacing:.08em;margin-bottom:.7rem;
      background:var(--day-light);color:var(--day-dark);
      border:1.5px solid var(--day-border);}

    .eq-box{background:var(--day-light);border:2px solid var(--day-border);
      border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;
      font-family:'JetBrains Mono',monospace;
      font-size:clamp(1.2rem,3vw,1.8rem);
      font-weight:700;color:var(--day-dark);text-align:center;}

    .q-text{font-size:.9rem;color:var(--muted);
      margin-bottom:.8rem;line-height:1.8;}

    .method-box{background:var(--day-light);
      border:1.5px solid var(--day-border);
      border-left:4px solid var(--day-color);
      border-radius:8px;padding:.75rem 1rem;margin-bottom:1.2rem;
      font-size:.84rem;font-family:'JetBrains Mono',monospace;
      color:var(--day-dark);line-height:1.8;}
    .method-box strong{color:var(--day-color);}

    /* Sélecteurs de signe (exercice 1) */
    .sign-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem;
      position:relative;z-index:2;}
    .sign-btn{padding:.5rem .95rem;border:2px solid var(--border);
      border-radius:10px;font-family:'JetBrains Mono',monospace;
      font-size:1.15rem;font-weight:700;cursor:pointer;background:var(--bg);
      color:var(--text);min-height:2.6rem;min-width:3rem;
      transition:transform .12s,border-color .15s,background .15s;}
    .sign-btn:hover:not(.locked){border-color:var(--day-color);}
    .sign-btn:active{transform:scale(.94);}
    .sign-btn.selected{border-color:var(--day-color);
      background:var(--day-light);color:var(--day-dark);}
    .sign-btn.correct-sign{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .sign-btn.wrong-sign{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .sign-btn.locked{cursor:default;}

    /* Input (exercices 3) */
    .input-row{display:flex;align-items:center;gap:.7rem;
      flex-wrap:wrap;position:relative;z-index:2;margin-bottom:.8rem;}
    .input-label{font-family:'JetBrains Mono',monospace;
      font-size:1rem;font-weight:700;}
    .answer-input{width:130px;background:var(--bg);
      border:2px solid var(--border);border-radius:10px;
      color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:1.05rem;padding:.5rem .85rem;outline:none;
      transition:border-color .2s;position:relative;z-index:2;height:2.6rem;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input  {border-color:var(--pink); background:#fff0ef;}

    /* Rangement (exercice 2) */
    .sort-instruction{font-size:.82rem;color:var(--muted);
      font-family:'JetBrains Mono',monospace;margin-bottom:.6rem;line-height:1.8;}
    .sort-pool{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem;
      min-height:2.8rem;position:relative;z-index:2;}
    .sort-token{padding:.5rem .9rem;border:2px solid var(--day-border);
      border-radius:10px;background:var(--day-light);color:var(--day-dark);
      font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;
      cursor:pointer;min-height:2.6rem;display:inline-flex;align-items:center;
      transition:transform .12s,opacity .15s;}
    .sort-token:hover:not(.used){transform:translateY(-2px);}
    .sort-token:active{transform:scale(.94);}
    .sort-token.used{opacity:.3;cursor:default;pointer-events:none;}
    .sort-slots{display:flex;gap:.5rem;flex-wrap:wrap;
      align-items:center;margin-bottom:.4rem;position:relative;z-index:2;}
    .sort-slot{min-width:3.4rem;min-height:2.6rem;padding:.5rem .7rem;
      border:2px dashed var(--border);border-radius:10px;
      display:inline-flex;align-items:center;justify-content:center;
      font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;
      color:var(--text);background:var(--bg);cursor:pointer;}
    .sort-slot.filled{border-style:solid;border-color:var(--day-border);
      background:var(--day-light);color:var(--day-dark);}
    .sort-slot.correct-slot{border-style:solid;border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .sort-slot.wrong-slot{border-style:solid;border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .sort-arrow{color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:700;}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;
      position:relative;z-index:2;margin-top:.4rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;
      padding:.6rem 1.3rem;border-radius:10px;
      font-family:Arial,sans-serif;font-size:.92rem;
      font-weight:700;cursor:pointer;border:none;
      transition:transform .12s,box-shadow .15s;
      position:relative;z-index:2;min-height:2.6rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;
      box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);
      box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);
      border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

    .hint-box{margin-top:.9rem;background:#fffbeb;
      border:1.5px dashed var(--yellow);border-radius:10px;
      padding:.75rem 1rem;font-size:.85rem;color:#7a6010;
      display:none;line-height:1.8;
      font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}

    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;
      font-size:.9rem;display:none;align-items:flex-start;
      gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink); color:#c0392b;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:.82rem;margin-top:.3rem;line-height:1.8;}

    .nav-row{display:flex;justify-content:space-between;
      margin-top:1.4rem;gap:.7rem;position:relative;z-index:2;}

    .results{width:100%;max-width:680px;text-align:center;
      display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:2.5rem 2rem;
      box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;
      line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;
      gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;
      padding:.65rem 1rem;background:var(--bg);
      border:1.5px solid var(--border);border-radius:10px;
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;line-height:1.6;}
    .recap-item .eq{color:var(--day-color);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}
    .recap-item.ko-item{border-color:#f9c0bb;}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px);}
      to  {opacity:1;transform:translateY(0);}
    }
    .card,.results{animation:fadeUp .4s ease both;}
    @media(max-width:480px){
      .card{padding:1.4rem;}
      .btn{font-size:.85rem;padding:.55rem 1rem;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 6&egrave;me
    </div>
    <div class="week-label">Semaine 2 &ndash; Jour 1 (Lundi)</div>
    <h1>Comparer et ranger les <span class="hl">nombres d&eacute;cimaux</span></h1>
    <p class="subtitle">3 exercices &middot; nombres d&eacute;cimaux &middot; niveau 6&egrave;me</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">Exercice 1 / 3</span>
      <span id="prog-pct">0&nbsp;%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div class="score-row">
    <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
    <div class="chip wrong"  ><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
    <div class="chip remaining"><div class="dot"></div><span id="count-rem">3</span> restantes</div>
  </div>

  <div class="card" id="ex-card">
    <div class="card-stripe"></div>
    <div class="q-num" id="q-num">Exercice 1</div>
    <div class="theme-badge" id="q-theme">Comparaison</div>
    <div class="eq-box" id="q-eq"></div>
    <div class="q-text" id="q-text"></div>
    <div class="method-box" id="method-box"></div>

    <div id="answer-zone"></div>

    <div class="btn-row" id="action-row">
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">&#10003; Valider</button>
      <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    </div>

    <div class="hint-box" id="hint-box"></div>

    <div class="feedback" id="feedback">
      <span class="feedback-icon" id="fb-icon"></span>
      <div>
        <div id="fb-msg"></div>
        <div class="feedback-detail" id="fb-detail"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">&larr; Pr&eacute;c&eacute;dent</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button>
    </div>
  </div>

  <div class="results" id="results-screen">
    <div class="results-card">
      <div class="logo-badge" style="margin-bottom:.5rem">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#3ab5d8"></span>
        R&eacute;sultats
      </div>
      <div class="results-score"><span class="s-num" id="score-num">0</span>/3</div>
      <div class="stars" id="stars-row"></div>
      <div class="results-msg" id="results-msg"></div>
      <div class="recap-list" id="recap-list"></div>
      <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">&#128260; Recommencer</button>
    </div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════
   EXERCICES — Semaine 2 Jour 1 : nombres décimaux
   Contenu mathématique vérifié :
   EX1 (comparaisons) :
     4,7 = 4,700 | 13,95 > 12,01 | 3,4 < 8,39 | 1,754 < 1,76
     8,5 > 8,499 | 19,020 > 10,021 | 64,7201 < 64,723
   EX2 (ordre croissant) :
     a) 0,2 0,8 1 1,1 2,7
     b) 8 8,45 8,5 8,50 8,61   (8,5 = 8,50, ordre indifférent → comparaison par valeur)
     c) 44,91 45,01 45,025 45,1 45,41
     d) 0,32 0,345 0,347 1,21 1,24   (1+21/100=1,21 ; 32%=0,32 ; 124/100=1,24 ; 347/1000=0,347)
   EX3 (intercaler, validation par intervalle strict) :
     18<x<19 | 2,3<x<2,4 | 64<x<64,2 | 0,50<x<0,51 | 5,8<x<5,9 | 3<x<3,01
     (l'énoncé original "5,9 < ... < 5,8" est impossible : corrigé en 5,8 < ... < 5,9)
═══════════════════════════════════════════════════════ */

/* Conversion "1,234" -> 1.234 */
function toNum(s){ return parseFloat(String(s).replace(',', '.')); }

var EXERCISES = [
  /* ── Exercice 1 : choisir le bon signe ──────────── */
  {
    type:  "sign",
    theme: "Comparaison",
    eq:    "Compl&egrave;te par &lt; , &gt; ou =",
    method:"<strong>M\u00e9thode :</strong> on aligne les parties enti\u00e8res, puis on compare les d\u00e9cimales chiffre par chiffre.<br>"
         + "On peut ajouter des z\u00e9ros \u00e0 droite sans changer le nombre : 4,7 = 4,70 = 4,700.",
    pairs: [
      { left:"4,7",     right:"4,700",  ans:"=" },
      { left:"13,95",   right:"12,01",  ans:">" },
      { left:"3,4",     right:"8,39",   ans:"<" },
      { left:"1,754",   right:"1,76",   ans:"<" },
      { left:"8,5",     right:"8,499",  ans:">" },
      { left:"19,020",  right:"10,021", ans:">" },
      { left:"64,7201", right:"64,723", ans:"<" }
    ],
    hint:  "Ajoute des z\u00e9ros pour avoir le m\u00eame nombre de d\u00e9cimales : 1,754 et 1,760 \u2192 754 < 760, donc 1,754 < 1,76."
  },
  /* ── Exercice 2 : ranger dans l'ordre croissant ──── */
  {
    type:  "sort",
    theme: "Rangement",
    eq:    "Range dans l\u2019ordre croissant",
    method:"<strong>M\u00e9thode :</strong> du plus petit au plus grand. Compare d\u2019abord la partie enti\u00e8re, puis les d\u00e9cimales.<br>"
         + "Astuce s\u00e9rie d) : 1 + 21/100 = 1,21 &middot; 32 % = 0,32 &middot; 124/100 = 1,24 &middot; 347/1000 = 0,347.",
    series: [
      { lbl:"a)", values:["1","2,7","0,8","0,2","1,1"] },
      { lbl:"b)", values:["8,5","8,61","8","8,50","8,45"] },
      { lbl:"c)", values:["45,01","45,41","45,1","44,91","45,025"] },
      { lbl:"d)", values:["1,21","0,32","1,24","0,347","0,345"] }
    ],
    hint:  "Aligne les virgules et compl\u00e8te avec des z\u00e9ros. Deux \u00e9critures \u00e9gales (8,5 et 8,50) peuvent se placer dans n\u2019importe quel ordre entre elles."
  },
  /* ── Exercice 3 : intercaler un nombre décimal ───── */
  {
    type:  "interval",
    theme: "Intercaler",
    eq:    "Trouve un nombre d\u00e9cimal qui convient",
    method:"<strong>M\u00e9thode :</strong> trouve un nombre strictement plus grand que celui de gauche et strictement plus petit que celui de droite.<br>"
         + "Astuce : ajoute une d\u00e9cimale suppl\u00e9mentaire (ex : entre 0,50 et 0,51 \u2192 0,505).",
    bounds: [
      { lbl:"a)", low:"18",   high:"19"    },
      { lbl:"b)", low:"2,3",  high:"2,4"   },
      { lbl:"c)", low:"64",   high:"64,2"  },
      { lbl:"d)", low:"0,50", high:"0,51"  },
      { lbl:"e)", low:"5,8",  high:"5,9"   },
      { lbl:"f)", low:"3",    high:"3,01"  }
    ],
    hint:  "Entre 3 et 3,01, tu peux choisir 3,005 (car 3 < 3,005 < 3,01). Plusieurs r\u00e9ponses sont possibles."
  }
];

var SIGNS = ["<", "\u2264", "=", "\u2265", ">"];

/* ═══════════════════════════════════════════════════════
   MOTEUR
═══════════════════════════════════════════════════════ */
var TOTAL = EXERCISES.length;
var current = 0;
/* userAnswers[i] : null = non répondu, sinon objet { ok:bool, data:... } */
var userAnswers = new Array(TOTAL).fill(null);
var hintOpen = false;
var $ = function(id){ return document.getElementById(id); };

/* État de saisie courant (avant validation) */
var draftSign = [];     // ex1 : signe choisi par paire
var draftSort = [];     // ex2 : pour chaque série, tableau des valeurs placées
var draftInterval = []; // ex3 : valeurs saisies

function render(){
  var ex = EXERCISES[current];
  $("q-num").textContent = "Exercice " + (current+1);
  $("q-theme").textContent = ex.theme;
  $("q-eq").innerHTML = ex.eq;
  $("q-text").textContent = "";
  $("method-box").innerHTML = ex.method;
  $("hint-box").innerHTML = "";
  $("hint-box").classList.remove("show");
  hintOpen = false;
  $("feedback").className = "feedback";

  var done = userAnswers[current] !== null;
  var zone = $("answer-zone");
  zone.innerHTML = "";

  if(ex.type === "sign")     buildSign(zone, ex, done);
  else if(ex.type === "sort")     buildSort(zone, ex, done);
  else if(ex.type === "interval") buildInterval(zone, ex, done);

  $("btn-check").disabled = done;
  $("btn-next").disabled  = !done;
  $("btn-prev").disabled  = current === 0;
  $("btn-next").textContent = (current === TOTAL-1) ? "Terminer \u2192" : "Suivant \u2192";

  if(done) showFeedback(userAnswers[current].ok);
  updateProgress();
}

/* ---------- EX1 : signes ---------- */
function buildSign(zone, ex, done){
  if(draftSign.length !== ex.pairs.length) draftSign = new Array(ex.pairs.length).fill(null);
  var saved = done ? userAnswers[current].data : null;

  ex.pairs.forEach(function(pair, i){
    var wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.9rem;";

    var lbl = document.createElement("span");
    lbl.style.cssText = "font-family:'JetBrains Mono',monospace;font-weight:700;min-width:1.4rem;color:var(--muted);";
    lbl.textContent = String.fromCharCode(97+i) + ")";
    wrap.appendChild(lbl);

    var nLeft = document.createElement("span");
    nLeft.style.cssText = "font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.05rem;min-width:4.5rem;text-align:right;";
    nLeft.textContent = pair.left;
    wrap.appendChild(nLeft);

    var signRow = document.createElement("div");
    signRow.className = "sign-row";
    SIGNS.forEach(function(sg){
      var b = document.createElement("button");
      b.className = "sign-btn";
      b.textContent = sg;
      if(done){
        b.classList.add("locked");
        var chosen = saved[i];
        if(sg === chosen){
          b.classList.add(chosen === pair.ans ? "correct-sign" : "wrong-sign");
        }
        if(sg === pair.ans && chosen !== pair.ans){
          b.classList.add("correct-sign");
        }
      } else {
        if(draftSign[i] === sg) b.classList.add("selected");
        b.onclick = (function(idx, val){ return function(){
          draftSign[idx] = val;
          var sibs = this.parentNode.querySelectorAll(".sign-btn");
          sibs.forEach(function(s){ s.classList.remove("selected"); });
          this.classList.add("selected");
        };})(i, sg);
      }
      signRow.appendChild(b);
    });
    wrap.appendChild(signRow);

    var nRight = document.createElement("span");
    nRight.style.cssText = "font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.05rem;min-width:4.5rem;";
    nRight.textContent = pair.right;
    wrap.appendChild(nRight);

    zone.appendChild(wrap);
  });
}

/* ---------- EX2 : rangement croissant ---------- */
function buildSort(zone, ex, done){
  if(draftSort.length !== ex.series.length){
    draftSort = ex.series.map(function(){ return []; });
  }
  var saved = done ? userAnswers[current].data : null;

  ex.series.forEach(function(serie, si){
    var block = document.createElement("div");
    block.style.cssText = "margin-bottom:1.3rem;padding-bottom:1rem;border-bottom:1px solid var(--border);";

    var head = document.createElement("div");
    head.className = "sort-instruction";
    head.innerHTML = "<strong style='color:var(--day-dark)'>" + serie.lbl + "</strong> clique les nombres du plus petit au plus grand :";
    block.appendChild(head);

    /* Pool de jetons */
    var pool = document.createElement("div");
    pool.className = "sort-pool";
    var placed = done ? saved[si] : draftSort[si];

    serie.values.forEach(function(v, vi){
      var tok = document.createElement("span");
      tok.className = "sort-token";
      tok.textContent = v;
      var isUsed = placed.indexOf(vi) !== -1;
      if(isUsed || done) tok.classList.add("used");
      if(!done){
        tok.onclick = (function(serIdx, valIdx){ return function(){
          if(draftSort[serIdx].indexOf(valIdx) === -1){
            draftSort[serIdx].push(valIdx);
            render();
          }
        };})(si, vi);
      }
      pool.appendChild(tok);
    });
    block.appendChild(pool);

    /* Slots remplis (ordre choisi) */
    var slots = document.createElement("div");
    slots.className = "sort-slots";
    var sortedVals = serie.values.map(toNum).slice().sort(function(a,b){ return a-b; });

    for(var k=0; k<serie.values.length; k++){
      if(k>0){
        var arr = document.createElement("span");
        arr.className = "sort-arrow";
        arr.textContent = "<";
        slots.appendChild(arr);
      }
      var slot = document.createElement("span");
      slot.className = "sort-slot";
      var valIdx = placed[k];
      if(valIdx !== undefined){
        slot.classList.add("filled");
        slot.textContent = serie.values[valIdx];
        if(done){
          /* correct si la valeur placée à cette position correspond à la k-ième plus petite (par valeur) */
          var okPos = Math.abs(toNum(serie.values[valIdx]) - sortedVals[k]) < 1e-9;
          slot.classList.remove("filled");
          slot.classList.add(okPos ? "correct-slot" : "wrong-slot");
        } else {
          /* clic = retirer le dernier / ce jeton */
          slot.style.cursor = "pointer";
          slot.onclick = (function(serIdx, pos){ return function(){
            draftSort[serIdx].splice(pos, 1);
            render();
          };})(si, k);
        }
      } else {
        slot.textContent = "?";
        slot.style.color = "var(--muted)";
      }
      slots.appendChild(slot);
    }
    block.appendChild(slots);
    zone.appendChild(block);
  });
}

/* ---------- EX3 : intercaler ---------- */
function buildInterval(zone, ex, done){
  if(draftInterval.length !== ex.bounds.length) draftInterval = new Array(ex.bounds.length).fill("");
  var saved = done ? userAnswers[current].data : null;

  ex.bounds.forEach(function(b, i){
    var row = document.createElement("div");
    row.className = "input-row";

    var lbl = document.createElement("span");
    lbl.className = "input-label";
    lbl.style.minWidth = "8.5rem";
    lbl.textContent = b.lbl + "  " + b.low + " <  ?  < " + b.high;
    row.appendChild(lbl);

    var inp = document.createElement("input");
    inp.type = "text";
    inp.className = "answer-input";
    inp.placeholder = "?";
    inp.autocomplete = "off";
    inp.id = "iv" + i;
    if(done){
      inp.value = saved[i].val;
      inp.disabled = true;
      inp.className = "answer-input " + (saved[i].ok ? "correct-input" : "wrong-input");
    } else {
      inp.value = draftInterval[i];
      inp.oninput = (function(idx){ return function(){ draftInterval[idx] = this.value; }; })(i);
      inp.addEventListener("keydown", function(e){
        if(e.key === "Enter" && !$("btn-check").disabled) checkAnswer();
      });
    }
    row.appendChild(inp);
    zone.appendChild(row);
  });
}

/* ---------- VALIDATION ---------- */
function checkAnswer(){
  var ex = EXERCISES[current];
  if(ex.type === "sign")     return checkSign(ex);
  if(ex.type === "sort")     return checkSort(ex);
  if(ex.type === "interval") return checkInterval(ex);
}

function checkSign(ex){
  /* tous les signes doivent être choisis */
  for(var i=0;i<ex.pairs.length;i++){ if(!draftSign[i]) return; }
  var allOk = ex.pairs.every(function(p,i){ return draftSign[i] === p.ans; });
  userAnswers[current] = { ok: allOk, data: draftSign.slice() };
  render();
}

function checkSort(ex){
  /* chaque série doit être entièrement remplie */
  for(var s=0;s<ex.series.length;s++){
    if(draftSort[s].length !== ex.series[s].values.length) return;
  }
  var allOk = ex.series.every(function(serie, si){
    var sortedVals = serie.values.map(toNum).slice().sort(function(a,b){ return a-b; });
    return draftSort[si].every(function(valIdx, pos){
      return Math.abs(toNum(serie.values[valIdx]) - sortedVals[pos]) < 1e-9;
    });
  });
  userAnswers[current] = { ok: allOk, data: draftSort.map(function(a){ return a.slice(); }) };
  render();
}

function checkInterval(ex){
  /* tous les champs doivent être remplis par un nombre valide */
  var data = [];
  for(var i=0;i<ex.bounds.length;i++){
    var raw = (draftInterval[i] || "").trim();
    if(raw === "") return;
    var v = toNum(raw);
    if(isNaN(v)) return;
    var lo = toNum(ex.bounds[i].low), hi = toNum(ex.bounds[i].high);
    var ok = v > lo && v < hi;
    data.push({ val: raw, ok: ok });
  }
  var allOk = data.every(function(d){ return d.ok; });
  userAnswers[current] = { ok: allOk, data: data };
  render();
}

/* ---------- FEEDBACK ---------- */
function showFeedback(correct){
  var ex = EXERCISES[current];
  var fb = $("feedback");
  fb.className = "feedback show " + (correct ? "ok" : "ko");
  $("fb-icon").textContent = correct ? "\u2705" : "\u274C";
  if(correct){
    $("fb-msg").textContent = "Bravo ! Tout est correct.";
    $("fb-detail").innerHTML = "";
  } else {
    $("fb-msg").textContent = "Pas tout \u00e0 fait\u2026";
    $("fb-detail").innerHTML = buildCorrection(ex);
  }
}

function buildCorrection(ex){
  if(ex.type === "sign"){
    var wrong = ex.pairs.filter(function(p,i){ return userAnswers[current].data[i] !== p.ans; });
    return "Correction : " + wrong.map(function(p){
      return p.left + " " + p.ans + " " + p.right;
    }).join("&nbsp;&nbsp;|&nbsp;&nbsp;");
  }
  if(ex.type === "sort"){
    var parts = [];
    ex.series.forEach(function(serie, si){
      var sortedVals = serie.values.slice().sort(function(a,b){ return toNum(a)-toNum(b); });
      var userOk = userAnswers[current].data[si].every(function(valIdx, pos){
        var sv = serie.values.map(toNum).slice().sort(function(a,b){ return a-b; });
        return Math.abs(toNum(serie.values[valIdx]) - sv[pos]) < 1e-9;
      });
      if(!userOk){
        parts.push(serie.lbl + " " + sortedVals.join(" < "));
      }
    });
    return "Correction : " + parts.join("<br>");
  }
  if(ex.type === "interval"){
    var w = [];
    ex.bounds.forEach(function(b, i){
      if(!userAnswers[current].data[i].ok){
        /* propose un exemple : milieu arrondi à assez de décimales */
        var lo = toNum(b.low), hi = toNum(b.high);
        var mid = (lo + hi) / 2;
        w.push(b.lbl + " ex : " + String(mid).replace(".", ","));
      }
    });
    return "Il faut un nombre strictement entre les deux bornes.<br>" + w.join("&nbsp;&nbsp;|&nbsp;&nbsp;");
  }
  return "";
}

function toggleHint(){
  hintOpen = !hintOpen;
  var h = $("hint-box");
  if(hintOpen){
    h.innerHTML = "<strong>? Indice :</strong> " + EXERCISES[current].hint;
    h.classList.add("show");
  } else {
    h.classList.remove("show");
  }
}

function updateProgress(){
  var answered = userAnswers.filter(function(a){ return a !== null; }).length;
  var ok = userAnswers.filter(function(a){ return a !== null && a.ok; }).length;
  var ko = answered - ok;
  var pct = Math.round((answered / TOTAL) * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = "Exercice " + (current+1) + " / " + TOTAL;
  $("prog-pct").textContent = pct + "\u00a0%";
  $("count-ok").textContent = ok;
  $("count-ko").textContent = ko;
  $("count-rem").textContent = TOTAL - answered;
}

function nextQ(){
  if(current < TOTAL-1){ current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}
function prevQ(){ if(current > 0){ current--; render(); window.scrollTo({top:0,behavior:"smooth"}); } }

function showResults(){
  $("ex-card").style.display = "none";
  $("results-screen").classList.add("show");
  var ok = userAnswers.filter(function(a){ return a !== null && a.ok; }).length;
  $("score-num").textContent = ok;
  var ratio = ok / TOTAL;
  var stars = ok >= TOTAL ? 5 : ratio >= .8 ? 4 : ratio >= .6 ? 3 : ratio >= .4 ? 2 : ok >= 1 ? 1 : 0;
  $("stars-row").textContent = "\u2B50".repeat(stars) + "\u2606".repeat(5-stars);
  var msgs = ["Continue \u00e0 t\u2019entra\u00eener !","Bon d\u00e9but !","Bien jou\u00e9 !","Parfait ! Bravo ! \uD83C\uDF89"];
  $("results-msg").textContent = msgs[Math.min(ok, msgs.length-1)];
  var list = $("recap-list"); list.innerHTML = "";
  EXERCISES.forEach(function(ex, i){
    var correct = userAnswers[i] !== null && userAnswers[i].ok;
    var div = document.createElement("div");
    div.className = "recap-item " + (correct ? "ok-item" : "ko-item");
    var titles = ["1. Comparer (< , > ou =)", "2. Ranger dans l\u2019ordre croissant", "3. Intercaler un d\u00e9cimal"];
    div.innerHTML = "<span>" + (correct ? "\u2705" : "\u274C") + "</span>"
      + "<span class='eq'></span>";
    div.querySelector(".eq").textContent = titles[i];
    list.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
  userAnswers = new Array(TOTAL).fill(null);
  draftSign = []; draftSort = []; draftInterval = [];
  current = 0;
  $("ex-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", function(){
  $("count-rem").textContent = TOTAL;
  render();
});
</script>
</body>
