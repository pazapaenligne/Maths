<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pazapa — Flash Défi — Propriétés du parallélogramme</title>
<style>
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}}
:root{
  --day-color:#3ab5d8;--day-dark:#1a6e88;--day-light:#e8f6fb;
  --day-border:#9dd4e8;--day-glow:rgba(58,181,216,.3);
  --bg:#f2fafd;--surface:#fff;--border:#d7edf5;
  --green:#8dc63f;--blue:#3ab5d8;--yellow:#f5c518;--red:#b94040;
  --text:#1a1d23;--muted:#5f8a99;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.5rem 1rem 4rem;overflow-x:hidden;line-height:1.7;}
body::before{content:'';position:fixed;inset:0;z-index:0;opacity:.03;
  background:repeating-linear-gradient(45deg,transparent,transparent 20px,#3ab5d8 20px,#3ab5d8 21px);pointer-events:none;}
.bubble-yellow{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:220px;height:220px;background:var(--yellow);top:-60px;right:-40px;pointer-events:none;}
.bubble-day{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:200px;height:200px;background:var(--day-color);bottom:-50px;left:-40px;pointer-events:none;}
.bubble-green{position:fixed;border-radius:50%;z-index:0;opacity:.06;width:150px;height:150px;background:var(--green);top:40%;right:-70px;pointer-events:none;}
.bubble-pink{position:fixed;border-radius:50%;z-index:0;opacity:.06;width:150px;height:150px;background:#f28b82;top:35%;left:-70px;pointer-events:none;}
header{text-align:center;margin-bottom:1.2rem;position:relative;z-index:1;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:#f5c518;color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:monospace;font-size:.82rem;color:var(--muted);margin-bottom:.4rem;}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;line-height:1.3;color:var(--day-dark);}
.activity-label{font-size:clamp(1rem,3vw,1.2rem);font-weight:800;color:var(--text);margin-top:.3rem;line-height:1.35;}
.subtitle{color:var(--muted);font-size:.88rem;margin-top:.35rem;font-family:monospace;}
.chrono-wrap{width:100%;max-width:560px;position:relative;z-index:1;margin-bottom:.8rem;}
.chrono-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;}
.chrono-label{font-family:monospace;font-size:.78rem;color:var(--muted);text-transform:uppercase;}
.chrono-val{font-family:monospace;font-weight:800;font-size:1.5rem;color:var(--day-dark);}
.chrono-val.urgent{color:#8f1f1f;animation:pulse .5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.chrono-bar-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;}
.chrono-bar{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .9s linear;}
.chrono-bar.urgent{background:linear-gradient(90deg,#8f1f1f,#c0392b);}
.prog-dots{display:flex;gap:.5rem;justify-content:center;margin-bottom:1rem;position:relative;z-index:1;}
.prog-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:.3s;}
.prog-dot.done{background:var(--green);}.prog-dot.active{background:var(--day-color);}
#flash-zone{width:100%;max-width:560px;position:relative;z-index:1;}
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.6rem;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--green));}
.q-badge{display:inline-block;background:var(--day-dark);color:#fff;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.2rem .65rem;border-radius:99px;margin-bottom:.7rem;font-family:monospace;}
.q-consigne{font-size:.85rem;color:var(--muted);margin-bottom:.5rem;font-style:italic;}
.q-text{font-size:clamp(1rem,3vw,1.15rem);font-weight:700;color:var(--text);margin-bottom:.9rem;line-height:1.75;}
.figure-wrap{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem;margin-bottom:1.1rem;text-align:center;}
.figure-wrap svg{max-width:100%;height:auto;display:block;margin:0 auto;}
.opts-col{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem;}
.opt-btn{display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;border-radius:10px;border:2px solid var(--day-border);background:var(--day-light);cursor:pointer;min-height:48px;font-size:clamp(.95rem,2.6vw,1.02rem);font-weight:600;transition:.15s;text-align:left;width:100%;font-family:Arial,sans-serif;}
.opt-btn:hover:not([disabled]){border-color:var(--day-color);background:#d9f0fa;}
.opt-btn:focus-visible{outline:3px solid var(--day-color);outline-offset:2px;}
.opt-btn[disabled]{cursor:default;}
.opt-btn.ok{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.opt-btn.ko{border-color:#c0392b;background:#fce4e4;color:#8f2f2f;}
.opt-btn.reveal{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.opt-letter{font-family:monospace;font-weight:800;min-width:1.3rem;color:var(--day-dark);}
.feedback{margin-top:.9rem;padding:.75rem 1rem;border-radius:10px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8;display:none;border-left:5px solid transparent;}
.feedback.show{display:block;}
.feedback.ok{background:#eefad8;border-left-color:var(--green);color:#3d7a10;}
.feedback.ko{background:#fce4e4;border-left-color:#c0392b;color:#8f2f2f;}
.fb-titre{font-weight:800;display:block;margin-bottom:.2rem;}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(.88rem,2.5vw,.97rem);font-weight:800;cursor:pointer;border:none;min-height:44px;transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn:focus-visible{outline:3px solid var(--day-color);outline-offset:2px;}
.btn-primary{background:var(--day-dark);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
.btn-primary:hover{transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
.btn-ghost:hover{border-color:var(--day-color);color:var(--text);}
.btn-row{display:flex;justify-content:flex-end;margin-top:1rem;}
#final-screen{width:100%;max-width:560px;display:none;position:relative;z-index:1;}
.final-card{background:var(--surface);border:2px solid var(--day-border);border-radius:var(--radius);padding:2rem 1.6rem;box-shadow:0 4px 20px rgba(0,0,0,.06);text-align:center;}
.final-msg{font-size:1.02rem;font-weight:700;color:var(--day-dark);line-height:1.8;margin-bottom:1.3rem;}
@media(max-width:480px){body{padding:1rem .75rem 3rem;}.card{padding:1.2rem;}}
</style>
</head>
<body>
<div class="bubble-yellow"></div><div class="bubble-day"></div><div class="bubble-green"></div><div class="bubble-pink"></div>
<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa &middot; Math&eacute;matiques &middot; 5&egrave;me
  </div>
  <div class="week-label">Semaine 7 &ndash; Jour 4</div>
  <h1>Propri&eacute;t&eacute;s du parall&eacute;logramme</h1>
  <p class="activity-label">&#9889; Flash D&eacute;fi</p>
  <p class="subtitle">D&eacute;finir, reconna&icirc;tre, utiliser</p>
</header>

<div class="chrono-wrap">
  <div class="chrono-top">
    <span class="chrono-label">&#8987; Temps restant</span>
    <span class="chrono-val" id="chrono-val" role="timer" aria-live="off" aria-label="Temps restant pour la question">20 s</span>
  </div>
  <div class="chrono-bar-bg"><div class="chrono-bar" id="chrono-bar" style="width:100%" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20" aria-label="Progression du temps restant"></div></div>
</div>
<div class="prog-dots" aria-label="Progression dans les trois questions">
  <div class="prog-dot active" id="pd0" aria-hidden="true"></div>
  <div class="prog-dot" id="pd1" aria-hidden="true"></div>
  <div class="prog-dot" id="pd2" aria-hidden="true"></div>
</div>

<div id="flash-zone">
  <div class="card" id="card">
    <div class="card-stripe"></div>
    <div class="q-badge" id="q-badge">Question 1 / 3</div>
    <div id="q-content"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="btn-row" id="btn-row"></div>
  </div>
</div>

<div id="final-screen">
  <div class="final-card">
    <div class="logo-badge" style="margin:0 auto .9rem;display:flex;width:fit-content;">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
    </div>
    <div class="final-msg" id="final-message" tabindex="-1">Flash D&eacute;fi termin&eacute;.</div>
    <button class="btn btn-ghost" id="btn-restart" type="button">&#8635; Recommencer</button>
  </div>
</div>

<script>
(function(){
"use strict";
var DUREE=20,TOTAL=3;
var tempsRestant=DUREE,timerID=null,qIdx=0,answered=false,fini=false;
var autoAdvanceID=null;
var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function el(id){return document.getElementById(id);}

var QUESTIONS=[
  {
    consigne:null,
    text:"Un parall\u00e9logramme est\u00a0:",
    options:[
      "un quadrilat\u00e8re ayant ses quatre c\u00f4t\u00e9s \u00e9gaux",
      "un quadrilat\u00e8re ayant ses c\u00f4t\u00e9s oppos\u00e9s parall\u00e8les",
      "un quadrilat\u00e8re ayant quatre angles droits"
    ],
    correct:1,
    fbOk:"Exact\u00a0! Un parall\u00e9logramme est un quadrilat\u00e8re dont les c\u00f4t\u00e9s oppos\u00e9s sont parall\u00e8les deux \u00e0 deux.",
    fbKo:"Un parall\u00e9logramme se d\u00e9finit par ses c\u00f4t\u00e9s oppos\u00e9s parall\u00e8les\u00a0: ce n\u2019est ni une question de longueur, ni une question d\u2019angles droits."
  },
  {
    consigne:null,
    text:"Dans un parall\u00e9logramme\u00a0:",
    options:[
      "les c\u00f4t\u00e9s oppos\u00e9s sont de m\u00eame longueur",
      "les quatre c\u00f4t\u00e9s sont \u00e9gaux",
      "les diagonales sont perpendiculaires"
    ],
    correct:0,
    fbOk:"Exact\u00a0! Dans un parall\u00e9logramme, les c\u00f4t\u00e9s oppos\u00e9s ont toujours la m\u00eame longueur.",
    fbKo:"Dans un parall\u00e9logramme, ce sont les c\u00f4t\u00e9s oppos\u00e9s qui ont la m\u00eame longueur. Les autres propositions ne sont vraies que pour certains parall\u00e9logrammes particuliers."
  },
  {
    consigne:null,
    text:"Dans un parall\u00e9logramme\u00a0:",
    options:[
      "les diagonales se coupent en leur milieu",
      "les diagonales ont toujours la m\u00eame longueur",
      "les quatre angles sont \u00e9gaux"
    ],
    correct:0,
    fbOk:"Exact\u00a0! Dans tout parall\u00e9logramme, les diagonales se coupent en leur milieu.",
    fbKo:"La propri\u00e9t\u00e9 vraie pour tout parall\u00e9logramme est\u00a0: les diagonales se coupent en leur milieu. Les autres propositions ne sont vraies que pour certains parall\u00e9logrammes particuliers."
  }
];

function updateChrono(){
  el('chrono-val').textContent=tempsRestant+' s';
  el('chrono-bar').style.width=(tempsRestant/DUREE*100)+'%';
  el('chrono-bar').setAttribute('aria-valuenow', String(Math.max(0,tempsRestant)));
  var urgent=(tempsRestant<=7);
  el('chrono-val').className='chrono-val'+(urgent?' urgent':'');
  el('chrono-bar').className='chrono-bar'+(urgent?' urgent':'');
}
function startTimer(){
  if(timerID){clearInterval(timerID);}
  timerID=setInterval(function(){
    tempsRestant--;
    updateChrono();
    if(tempsRestant<=0){
      tempsRestant=0;
      updateChrono();
      clearInterval(timerID);timerID=null;
      handleTimeout();
    }
  },1000);
}
function pauseChrono(){
  if(timerID){clearInterval(timerID);timerID=null;}
}
function handleTimeout(){
  if(answered||fini) return;
  answered=true;
  pauseChrono();
  var qd=QUESTIONS[qIdx];
  el('q-content').querySelectorAll('.opt-btn[data-i]').forEach(function(b,j){
    b.disabled=true;
    if(j===qd.correct) b.classList.add('reveal');
  });
  var fb=el('feedback');
  fb.className='feedback show ko';
  fb.innerHTML='<span class="fb-titre">\u231b Temps \u00e9coul\u00e9</span>La bonne r\u00e9ponse est maintenant indiqu\u00e9e.<br>'+qd.fbKo;
  el('btn-row').innerHTML='';
  clearTimeout(autoAdvanceID);
  autoAdvanceID=setTimeout(function(){ if(!fini) nextStep(); },2500);
}
function buildQ(qd){
  var h='';
  if(qd.consigne) h+='<div class="q-consigne">'+qd.consigne+'</div>';
  h+='<div class="q-text" id="current-question" tabindex="-1">'+qd.text+'</div>';
  h+='<div class="opts-col">';
  qd.options.forEach(function(o,i){
    h+='<button class="opt-btn" type="button" data-i="'+i+'"><span class="opt-letter">'+String.fromCharCode(65+i)+'.</span> '+o+'</button>';
  });
  h+='</div>';
  return h;
}
function attachQ(qd){
  el('q-content').querySelectorAll('.opt-btn[data-i]').forEach(function(b){
    var i=parseInt(b.getAttribute('data-i'));
    b.addEventListener('click',function(){answer(qd,i);});
  });
}
function answer(qd,i){
  if(answered) return;
  answered=true;
  pauseChrono();
  var ok=(i===qd.correct);
  el('q-content').querySelectorAll('.opt-btn[data-i]').forEach(function(b,j){
    b.disabled=true;
    if(j===qd.correct) b.classList.add(ok&&j===i?'ok':'reveal');
    else if(j===i) b.classList.add('ko');
  });
  var fb=el('feedback');
  fb.className='feedback show '+(ok?'ok':'ko');
  fb.innerHTML='<span class="fb-titre">'+(ok?'\u2705':'\u274c')+'</span>'+(ok?qd.fbOk:qd.fbKo);
  var row=el('btn-row'); row.innerHTML='';
  var nb=document.createElement('button');
  nb.type='button'; nb.className='btn btn-primary';
  nb.textContent=(qIdx===TOTAL-1)?'Terminer':'Question suivante';
  nb.addEventListener('click',nextStep);
  row.appendChild(nb);
}
function nextStep(){
  if(fini) return;
  clearTimeout(autoAdvanceID);
  if(qIdx===TOTAL-1){
    showFinal();
    return;
  }
  qIdx++;
  tempsRestant=DUREE;
  updateChrono();
  render();
  startTimer();
}
function render(){
  answered=false;
  for(var i=0;i<3;i++) el('pd'+i).className='prog-dot'+(i<qIdx?' done':i===qIdx?' active':'');
  el('q-badge').textContent='Question '+(qIdx+1)+' / '+TOTAL;
  el('feedback').className='feedback';
  el('feedback').innerHTML='';
  el('btn-row').innerHTML='';
  el('q-content').innerHTML=buildQ(QUESTIONS[qIdx]);
  attachQ(QUESTIONS[qIdx]);
  var qt=el('current-question'); if(qt){ qt.focus(); }
}
function showFinal(){
  fini=true;
  pauseChrono();
  el('flash-zone').style.display='none';
  document.querySelector('.chrono-wrap').style.display='none';
  document.querySelector('.prog-dots').style.display='none';
  el('final-screen').style.display='block';
  window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
  var m=el('final-message'); if(m){ m.focus(); }
}
function restart(){
  clearTimeout(autoAdvanceID);
  pauseChrono();
  fini=false;qIdx=0;tempsRestant=DUREE;
  el('final-screen').style.display='none';
  el('flash-zone').style.display='block';
  document.querySelector('.chrono-wrap').style.display='block';
  document.querySelector('.prog-dots').style.display='flex';
  render();
  updateChrono();
  startTimer();
  window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
}
el('btn-restart').addEventListener('click',restart);
render();
updateChrono();
startTimer();
})();
</script>
</body>
</html>
