<div class="wrap">

    </div>

<script>
const $ = id => document.getElementById(id);
const TOTAL_Q = 5;
const TIME_PER_QUESTION = 60;
let timeLeft = TIME_PER_QUESTION;
let timerInterval = null;

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = TIME_PER_QUESTION;
  updateTimerDisplay();

  timerInterval = setInterval(function(){
    timeLeft--;

    if(timeLeft <= 0){
      timeLeft = 0;
      updateTimerDisplay();
      clearInterval(timerInterval);
      handleTimeUp();
      return;
    }

    updateTimerDisplay();
  },1000);
}

function updateTimerDisplay(){
  const timer = $('timer-display');

  if(timeLeft > 0){
    timer.textContent = '⏱ Temps : ' + timeLeft + ' s';
  } else {
    timer.textContent = '⏱ Temps écoulé !';
  }

  timer.classList.toggle('alert', timeLeft <= 10);
}

function lockCurrentQuestion(){
  locked = true;

  document
    .querySelectorAll('#opts .opt-card')
    .forEach(function(option){
      option.classList.add('locked');
      option.disabled = true;
    });

  $('btn-indice').disabled = true;
}

function handleTimeUp(){
  if(locked) return;

  const data = questions[qIdx];
  const opts = document.querySelectorAll('#opts .opt-card');

  lockCurrentQuestion();

  opts.forEach(function(option,index){
    if(index === data.correctIndex){
      option.classList.add('correctZ');
    } else {
      option.classList.add('dimmed');
    }
  });

  const feedback = $('feedback');
  feedback.className = 'feedback ko show';
  feedback.innerHTML = '⏱ Temps écoulé ! La bonne réponse est affichée en vert.';

  const correction = $('correction');
  correction.className = 'correction show';
  correction.innerHTML = '<b>Correction :</b> ' + correctionFor(data);

  setTimeout(nextQuestion,1800);
}

/* =========================================================
   MOTEUR DE GÉNÉRATION — repris à l'identique du fichier 4e
   (moyennes / étendues), sans la mise en scène.
   ========================================================= */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function genSeriesMean(meanScaled, n, minVal, maxVal, maxTries){
  maxTries = maxTries || 100;
  for(let t=0; t<maxTries; t++){
    let vals=[], sum=0;
    for(let i=0;i<n-1;i++){ const v=randInt(minVal,maxVal); vals.push(v); sum+=v; }
    const last = meanScaled*n - sum;
    if(Number.isInteger(last) && last>=minVal && last<=maxVal){ vals.push(last); shuffle(vals); return vals; }
  }
  return null;
}
function genSeriesRange(rangeScaled, n, minVal, maxVal, maxTries){
  maxTries = maxTries || 100;
  for(let t=0; t<maxTries; t++){
    if(maxVal-rangeScaled < minVal) return null;
    const lo = randInt(minVal, maxVal-rangeScaled);
    let vals = [lo, lo+rangeScaled];
    for(let i=0;i<n-2;i++){ vals.push(randInt(lo, lo+rangeScaled)); }
    shuffle(vals);
    return vals;
  }
  return null;
}
function genValueSeries(cfg, targetScaled, n){
  return cfg.type==="moyenne"
    ? genSeriesMean(targetScaled, n, cfg.minVal, cfg.maxVal)
    : genSeriesRange(targetScaled, n, cfg.minVal, cfg.maxVal);
}
function checkSeries(cfg, vals, targetScaled){
  if(cfg.type==="moyenne") return vals.reduce((a,b)=>a+b,0) === targetScaled*vals.length;
  return (Math.max(...vals)-Math.min(...vals)) === targetScaled;
}
function fmtVal(v, scale){
  if(scale===1){ return v<0 ? "\u2212"+Math.abs(v) : String(v); }
  const dec = v/scale;
  const s = Math.abs(dec).toFixed(1).replace(".", ",");
  return dec<0 ? "\u2212"+s : s;
}
function typeLabel(type){ return type==="moyenne" ? "moyenne" : "étendue"; }
function methodReminder(type){
  return type==="moyenne"
    ? "Pour calculer une moyenne, on additionne toutes les valeurs de la série, puis on divise cette somme par le nombre de valeurs."
    : "L\u2019étendue correspond à la différence entre la plus grande et la plus petite valeur d\u2019une série.";
}
function genDistractors(target, scale, type, count){
  const pool = scale===1 ? [1,2,3,4,-1,-2,-3,-4,5,-5] : [5,10,15,20,-5,-10,-15,-20,25,-25];
  shuffle(pool);
  const result = [];
  for(const d of pool){
    const val = target+d;
    if(val===target) continue;
    if(type==="etendue" && val<1) continue;
    if(result.indexOf(val)===-1) result.push(val);
    if(result.length>=count) break;
  }
  let guard=0;
  while(result.length<count && guard<30){
    guard++;
    const step = (scale===1?1:10)*randInt(6,9)*(Math.random()<0.5?1:-1);
    const val = target+step;
    if(val!==target && result.indexOf(val)===-1 && !(type==="etendue"&&val<1)) result.push(val);
  }
  return result;
}

const FALLBACK_ZONES_DIFF_MOYENNE = {
  mode:"zones-diff", cfg:{type:"moyenne",scale:1}, scale:1, commonTarget:8, oddTarget:10,
  series:[
    { vals:[6,10], isOdd:false },
    { vals:[7,8,9], isOdd:false },
    { vals:[4,8,12], isOdd:false },
    { vals:[8,12], isOdd:true }
  ],
  correctIndex:3,
  consigne:'Quelle série de nombres n\u2019a pas la même <span class="kw">moyenne</span> que les autres&nbsp;?'
};
const FALLBACK_ZONES_DIFF_ETENDUE = {
  mode:"zones-diff", cfg:{type:"etendue",scale:1}, scale:1, commonTarget:6, oddTarget:9,
  series:[
    { vals:[2,8], isOdd:false },
    { vals:[5,11], isOdd:false },
    { vals:[0,6], isOdd:false },
    { vals:[2,11], isOdd:true }
  ],
  correctIndex:3,
  consigne:'Quelle série de nombres n\u2019a pas la même <span class="kw">étendue</span> que les autres&nbsp;?'
};
const FALLBACK_STATEMENTS = {
  mode:"statements", type:"moyenne", scale:1, vals:[4,6,8], target:6,
  items:[
    { value:8, isCorrect:false },
    { value:6, isCorrect:true },
    { value:5, isCorrect:false },
    { value:9, isCorrect:false }
  ],
  correctIndex:1,
  consigne:"Parmi ces quatre affirmations, laquelle est correcte&nbsp;?"
};
const FALLBACK_ZONES_TARGET = {
  mode:"zones-target", type:"moyenne", scale:1, target:7,
  series:[
    { vals:[4,6] },
    { vals:[5,9] },
    { vals:[8,10] },
    { vals:[3,7,8] }
  ],
  correctIndex:1,
  consigne:'Quelle série a pour <span class="kw">moyenne</span> <strong>7</strong>&nbsp;?'
};

function buildZonesDiff(cfg){
  for(let attempt=0; attempt<50; attempt++){
    const commonTarget = randInt(cfg.targetMin, cfg.targetMax);
    let delta = randInt(cfg.deltaMin, cfg.deltaMax);
    if(cfg.type==="moyenne" && Math.random()<0.5) delta = -delta;
    let oddTarget = commonTarget + delta;
    if(cfg.type==="etendue" && oddTarget<1) oddTarget = commonTarget + Math.abs(delta);
    if(oddTarget===commonTarget) continue;

    const series = []; let ok = true;
    for(let i=0;i<3;i++){
      const n = cfg.nOptions[randInt(0,cfg.nOptions.length-1)];
      const vals = genValueSeries(cfg, commonTarget, n);
      if(!vals){ ok=false; break; }
      series.push({ vals, isOdd:false });
    }
    if(!ok) continue;
    const nOdd = cfg.nOptions[randInt(0,cfg.nOptions.length-1)];
    const valsOdd = genValueSeries(cfg, oddTarget, nOdd);
    if(!valsOdd) continue;
    series.push({ vals:valsOdd, isOdd:true });

    shuffle(series);
    const correctIndex = series.findIndex(s=>s.isOdd);
    let checkOk = true;
    for(const s of series){ if(!checkSeries(cfg, s.vals, s.isOdd?oddTarget:commonTarget)) checkOk=false; }
    if(!checkOk || correctIndex<0) continue;

    const label = typeLabel(cfg.type);
    return {
      mode:"zones-diff", cfg, scale:cfg.scale, commonTarget, oddTarget, series, correctIndex,
      consigne: "Quelle série de nombres n\u2019a pas la même <span class=\"kw\">"+label+"</span> que les autres&nbsp;?"
    };
  }
  return cfg.type==="moyenne" ? FALLBACK_ZONES_DIFF_MOYENNE : FALLBACK_ZONES_DIFF_ETENDUE;
}

function buildStatements(){
  const type = Math.random()<0.5 ? "moyenne" : "etendue";
  const scale = (type==="moyenne" && Math.random()<0.4) ? 10 : 1;
  const cfg = {
    type, scale,
    minVal: type==="etendue" ? 0 : (scale===10 ? 10 : 1),
    maxVal: scale===10 ? 220 : 25
  };
  const targetMin = scale===10 ? 50 : (type==="etendue" ? 4 : 6);
  const targetMax = scale===10 ? 160 : (type==="etendue" ? 14 : 16);
  const nOptions = [3,4,5];

  for(let attempt=0; attempt<50; attempt++){
    const target = randInt(targetMin, targetMax);
    const n = nOptions[randInt(0,nOptions.length-1)];
    const vals = genValueSeries(cfg, target, n);
    if(!vals) continue;
    if(!checkSeries(cfg, vals, target)) continue;
    const distractors = genDistractors(target, scale, type, 3);
    if(distractors.length<3) continue;

    const items = shuffle([
      { value:target, isCorrect:true },
      { value:distractors[0], isCorrect:false },
      { value:distractors[1], isCorrect:false },
      { value:distractors[2], isCorrect:false }
    ]);
    const correctIndex = items.findIndex(it=>it.isCorrect);
    if(correctIndex<0) continue;

    return {
      mode:"statements", type, scale, vals, target, items, correctIndex,
      consigne:"Parmi ces quatre affirmations, laquelle est correcte&nbsp;?"
    };
  }
  return FALLBACK_STATEMENTS;
}

function buildZonesTarget(){
  const type = Math.random()<0.5 ? "moyenne" : "etendue";
  let cfg, targetMin, targetMax;
  if(type==="etendue"){
    cfg = { type, scale:1, minVal:0, maxVal:26 };
    targetMin=4; targetMax=16;
  } else {
    const decimal = Math.random()<0.35;
    const allowNeg = Math.random()<0.3;
    if(decimal){
      cfg = { type, scale:10, minVal: allowNeg?-60:10, maxVal:180 };
      targetMin = allowNeg?-20:40; targetMax = allowNeg?70:140;
    } else {
      cfg = { type, scale:1, minVal: allowNeg?-10:1, maxVal:25 };
      targetMin = allowNeg?-3:6; targetMax = allowNeg?12:16;
    }
  }
  const nOptions = type==="etendue" ? [2,3,4,5] : [2,3,4];

  for(let attempt=0; attempt<50; attempt++){
    const target = randInt(targetMin, targetMax);
    const nMain = nOptions[randInt(0,nOptions.length-1)];
    const mainVals = genValueSeries(cfg, target, nMain);
    if(!mainVals) continue;
    if(!checkSeries(cfg, mainVals, target)) continue;

    const series = [{ vals: mainVals }];
    let ok = true;
    for(let i=0;i<3;i++){
      let other = null;
      for(let tries=0; tries<20 && !other; tries++){
        const otherTarget = randInt(targetMin, targetMax);
        if(otherTarget===target) continue;
        const n = nOptions[randInt(0,nOptions.length-1)];
        const v = genValueSeries(cfg, otherTarget, n);
        if(v && checkSeries(cfg, v, otherTarget) && !checkSeries(cfg, v, target)) other = v;
      }
      if(!other){ ok=false; break; }
      series.push({ vals: other });
    }
    if(!ok) continue;

    shuffle(series);
    let matchCount = 0, correctIndex = -1;
    series.forEach(function(s,i){ if(checkSeries(cfg, s.vals, target)){ matchCount++; correctIndex=i; } });
    if(matchCount!==1) continue;

    const label = typeLabel(type);
    return {
      mode:"zones-target", type, scale:cfg.scale, target, series, correctIndex,
      consigne:"Quelle série a pour <span class=\"kw\">"+label+"</span> <strong>"+fmtVal(target,cfg.scale)+"</strong>&nbsp;?"
    };
  }
  return FALLBACK_ZONES_TARGET;
}

function buildQuestion(qIndex){
  switch(qIndex){
    case 0: return buildZonesDiff({ type:"moyenne", scale:1, nOptions:[2,3], minVal:1, maxVal:20, targetMin:6, targetMax:14, deltaMin:2, deltaMax:4 });
    case 1: return buildZonesDiff({ type:"moyenne", scale:1, nOptions:[3,4], minVal:1, maxVal:35, targetMin:12, targetMax:26, deltaMin:3, deltaMax:6 });
    case 2: return buildZonesDiff({ type:"etendue", scale:1, nOptions:[2,3,4,5], minVal:0, maxVal:26, targetMin:4, targetMax:14, deltaMin:3, deltaMax:6 });
    case 3: return buildStatements();
    case 4: return buildZonesTarget();
  }
}

function typeBadgeLabel(data){
  if(data.mode==="statements") return "VRAI OU FAUX";
  if(data.mode==="zones-target") return "TROUVER LA SÉRIE";
  return "COMPARER — " + typeLabel(data.cfg.type).toUpperCase();
}

function methodReminderFor(data){
  if(data.mode==="zones-diff") return methodReminder(data.cfg.type);
  return methodReminder(data.type);
}

function correctionFor(data){
  if(data.mode==="zones-diff"){
    const label = typeLabel(data.cfg.type);
    const commonTxt = fmtVal(data.commonTarget, data.scale);
    const oddTxt = fmtVal(data.oddTarget, data.scale);
    return methodReminder(data.cfg.type)+' Les trois autres séries ont pour '+label+' <b>'+commonTxt+'</b>, tandis que la série mise en évidence a pour '+label+' <b>'+oddTxt+'</b>.';
  }
  if(data.mode==="zones-target"){
    const label = typeLabel(data.type);
    const targetTxt = fmtVal(data.target, data.scale);
    return methodReminder(data.type)+' La série recherchée a bien pour '+label+' <b>'+targetTxt+'</b>.';
  }
  const correctItem = data.items[data.correctIndex];
  const verb = data.type==="moyenne" ? "moyenne" : "étendue";
  const correctTxt = fmtVal(correctItem.value, data.scale);
  return methodReminder(data.type)+' La '+verb+' de cette série vaut en réalité <b>'+correctTxt+'</b>.';
}

/* =========================================================
   MOTEUR "JE RELÈVE LE DÉFI" (habillage Pazapa)
   ========================================================= */
let questions = [];
let qIdx = 0;
let attempts = 0;
let scoreOk = 0;
let selected = -1;
let locked = false;
let defiStartTime = null;

function generateAllQuestions(){
  questions = [];
  for(let i=0;i<TOTAL_Q;i++) questions.push(buildQuestion(i));
}

function renderChoices(data){
  const zone = $('choix-zone');
  const letters = ["A","B","C","D"];
  let html;
  if(data.mode==="statements"){
    let pasHtml = '<div class="pastilles">';
    for(const v of data.vals){ pasHtml += '<div class="pas">'+fmtVal(v,data.scale)+'</div>'; }
    pasHtml += '</div>';
    html = pasHtml + '<div class="opt-grid single" id="opts">';
    data.items.forEach(function(it,i){
      const verb = data.type==="moyenne" ? "La moyenne" : "L\u2019étendue";
      const text = verb+" de cette série est <b>"+fmtVal(it.value,data.scale)+"</b>.";
      html += '<button class="opt-card stmt" id="opt'+i+'" type="button" onclick="pickOption('+i+')"><span class="opt-label">'+letters[i]+'</span><span>'+text+'</span></button>';
    });
    html += '</div>';
  } else {
    html = '<div class="opt-grid" id="opts">';
    for(let i=0;i<4;i++){
      const s = data.series[i];
      let pas = '';
      for(const v of s.vals){ pas += '<div class="pas">'+fmtVal(v,data.scale)+'</div>'; }
      html += '<button class="opt-card" id="opt'+i+'" type="button" onclick="pickOption('+i+')">'
        + '<span class="opt-label">Série '+letters[i]+'</span>'
        + '<div class="pastilles">'+pas+'</div></button>';
    }
    html += '</div>';
  }
  zone.innerHTML = html;
}

function renderQuestion(){
  const data = questions[qIdx];
  $('q-count').textContent = 'QUESTION ' + (qIdx+1) + ' / ' + TOTAL_Q;
  $('q-type-badge').textContent = typeBadgeLabel(data);
  $('question-txt').innerHTML = data.consigne;
  renderChoices(data);

  selected = -1;
  attempts = 0;
  locked = false;
  $('indice-box').className = 'indice-box';
  $('indice-box').innerHTML = '';
  $('feedback').className = 'feedback';
  $('feedback').innerHTML = '';
  $('correction').className = 'correction';
  $('correction').innerHTML = '';

  $('btn-indice').disabled = false;
  startTimer();
}

window.pickOption = function(i){
  if(locked) return;
  const data = questions[qIdx];
  attempts++;
  const correct = (i === data.correctIndex);
  const opts = document.querySelectorAll('#opts .opt-card');

  if(correct){
    clearInterval(timerInterval);
    lockCurrentQuestion();
    opts.forEach((o,idx)=>{
      if(idx===data.correctIndex) o.classList.add('correctZ');
      else o.classList.add('dimmed');
    });
    scoreOk++;
    const fb = $('feedback');
    fb.className = 'feedback ok show';
    fb.innerHTML = '✅ Bravo ! Bonne réponse.';
    const corr = $('correction');
    corr.className = 'correction show';
    corr.innerHTML = '<b>Explication :</b> ' + correctionFor(data);
    setTimeout(nextQuestion, 1000);
  } else {
    if(attempts===1){
      opts.forEach((o,idx)=>{ if(idx===i) o.classList.add('wrongZ'); });
      const fb = $('feedback');
      fb.className = 'feedback ko show';
      fb.innerHTML = '❌ Ce n\u2019est pas la bonne série. Réessaie !';
      const box = $('indice-box');
      box.className = 'indice-box show';
      box.innerHTML = '💡 ' + methodReminderFor(data);
    } else {
      clearInterval(timerInterval);
      lockCurrentQuestion();
      opts.forEach((o,idx)=>{
        if(idx===data.correctIndex) o.classList.add('correctZ');
        else if(idx===i) o.classList.add('wrongZ');
        else o.classList.add('dimmed');
      });
      const fb = $('feedback');
      fb.className = 'feedback ko show';
      fb.innerHTML = '❌ Regarde la correction ci-dessous.';
      const corr = $('correction');
      corr.className = 'correction show';
      corr.innerHTML = '<b>Correction :</b> ' + correctionFor(data);
      setTimeout(nextQuestion, 1800);
    }
  }
};

window.toggleIndice = function(){
  const data = questions[qIdx];
  const box = $('indice-box');
  if(box.innerHTML.trim()===''){ box.innerHTML = '💡 ' + methodReminderFor(data); }
  box.classList.toggle('show');
};

function nextQuestion(){
  clearInterval(timerInterval);
  qIdx++;
  if(qIdx >= TOTAL_Q){
    $('quiz-card').style.display = 'none';
    showBilan();
  } else {
    renderQuestion();
  }
}

function formatTemps(sec){
  if(sec < 60) return sec + ' s';
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return m + ' min ' + String(s).padStart(2,'0') + ' s';
}

function showBilan(){
  clearInterval(timerInterval);
  const totalTimeUsed = Math.round((Date.now() - defiStartTime) / 1000);
  $('score-value').textContent = scoreOk;
  $('temps-value').textContent = formatTemps(totalTimeUsed);

  let stars = '';
  for(let i=0;i<5;i++){ stars += '<span class="' + (i < scoreOk ? 'on' : 'off') + '">' + (i < scoreOk ? '★' : '☆') + '</span>'; }
  $('stars-big').innerHTML = stars;

  /* Thème : Statistiques */
  let badge, phrase;
  if(scoreOk === 5){
    badge = '🌟 Expert des statistiques';
    phrase = 'Tu maîtrises désormais le calcul des moyennes et des étendues.';
  } else if(scoreOk === 4){
    badge = '🥇 Analyste confirmé';
    phrase = 'Tu maîtrises désormais le calcul des moyennes et des étendues.';
  } else if(scoreOk === 3){
    badge = '🥈 Bon calculateur';
    phrase = 'Encore quelques entraînements et tu maîtriseras parfaitement les statistiques.';
  } else if(scoreOk === 2){
    badge = '🥉 En progression';
    phrase = 'Encore quelques entraînements et tu maîtriseras parfaitement les statistiques.';
  } else {
    badge = '📊 Continue à t\u2019entraîner';
    phrase = 'Revois le calcul de la moyenne et de l\u2019étendue, puis retente ta chance.';
  }
  $('badge-final').textContent = badge;
  $('encouragement').textContent = phrase;

  $('final-card').classList.add('show');
  fireConfetti();
}

/* ============== CONFETTIS (canvas léger, ~1s) ============== */
function fireConfetti(){
  const canvas = $('confetti-canvas');
  const card = $('final-card');
  canvas.width = card.offsetWidth;
  canvas.height = card.offsetHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#f5a623','#f5c518','#8dc63f','#3ab5d8','#f9c0bb'];
  const pieces = [];
  for(let i=0;i<60;i++){
    pieces.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.5,
      w: 5 + Math.random()*5,
      h: 8 + Math.random()*6,
      color: colors[Math.floor(Math.random()*colors.length)],
      vy: 2 + Math.random()*3,
      vx: (Math.random()-0.5)*2,
      rot: Math.random()*360,
      vrot: (Math.random()-0.5)*10
    });
  }
  const start = Date.now();
  const duration = 1200;
  function frame(){
    const elapsed = Date.now() - start;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if(elapsed < duration){
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  requestAnimationFrame(frame);
}

window.rejouerDefi = function(){
  clearInterval(timerInterval);
  qIdx = 0;
  scoreOk = 0;
  defiStartTime = Date.now();
  generateAllQuestions();
  $('final-card').classList.remove('show');
  $('quiz-card').style.display = '';
  renderQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
};

defiStartTime = Date.now();
generateAllQuestions();
renderQuestion();
