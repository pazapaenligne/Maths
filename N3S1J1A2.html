<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Défi Maths 3ème – Résoudre des équations</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f7fa;
      --border: #e2e6ed;
      --accent: #f5c518;
      --accent2: #3ecfcf;
      --danger: #ff5f5f;
      --success: #4cdb8a;
      --text: #1a1d23;
      --muted: #7a8394;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* — HEADER — */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: #000;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .25rem .7rem;
      border-radius: 4px;
      margin-bottom: .8rem;
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      line-height: 1.15;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      color: var(--muted);
      font-size: .9rem;
      margin-top: .4rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* — PROGRESS BAR — */
    .progress-wrap {
      width: 100%;
      max-width: 680px;
      margin-bottom: 1.8rem;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: .8rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: .45rem;
    }
    .progress-bar-bg {
      background: var(--border);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 99px;
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    /* — SCORE CHIPS — */
    .score-row {
      display: flex;
      gap: .7rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .35rem .8rem;
      border-radius: 99px;
      font-size: .82rem;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
    .chip.correct .dot { background: var(--success); }
    .chip.wrong .dot { background: var(--danger); }
    .chip.remaining .dot { background: var(--muted); }

    /* — CARD — */
    .card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 2rem 1.6rem;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
    }

    .question-num {
      font-size: .75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      margin-bottom: .8rem;
    }
    .equation {
      font-size: clamp(1.3rem, 3.5vw, 1.9rem);
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent2);
      margin-bottom: .5rem;
      letter-spacing: -.01em;
    }
    .question-text {
      font-size: .93rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    /* — INPUT ROW — */
    .input-row {
      display: flex;
      align-items: center;
      gap: .7rem;
      flex-wrap: wrap;
    }
    .input-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      color: var(--text);
    }
    .answer-input {
      width: 110px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      padding: .5rem .85rem;
      outline: none;
      transition: border-color .2s;
    }
    .answer-input:focus { border-color: var(--accent2); }
    .answer-input.correct-input { border-color: var(--success); background: #edfaf3; }
    .answer-input.wrong-input { border-color: var(--danger); background: #fdecea; }

    /* — BUTTONS — */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .55rem 1.2rem;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity .15s, transform .12s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: var(--accent);
      color: #000;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent2); color: var(--text); }
    .btn:disabled { opacity: .4; cursor: default; }

    /* — FEEDBACK — */
    .feedback {
      margin-top: 1.2rem;
      padding: .75rem 1rem;
      border-radius: 8px;
      font-size: .9rem;
      display: none;
      align-items: flex-start;
      gap: .6rem;
      line-height: 1.5;
    }
    .feedback.show { display: flex; }
    .feedback.ok { background: #edfaf3; border: 1px solid var(--success); color: var(--success); }
    .feedback.ko { background: #fdecea; border: 1px solid var(--danger); color: var(--danger); }
    .feedback-icon { font-size: 1.1rem; flex-shrink: 0; }
    .feedback-detail { color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: .82rem; margin-top: .25rem; }

    /* — HINT — */
    .hint-box {
      margin-top: .9rem;
      background: #f0f3f8;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: .7rem 1rem;
      font-size: .83rem;
      color: var(--muted);
      display: none;
      line-height: 1.6;
    }
    .hint-box.show { display: block; }
    .hint-box strong { color: var(--accent); }

    /* — NAV BUTTONS — */
    .nav-row {
      display: flex;
      justify-content: space-between;
      margin-top: 1.4rem;
      gap: .7rem;
    }

    /* — RESULTS SCREEN — */
    .results {
      width: 100%;
      max-width: 680px;
      text-align: center;
      display: none;
    }
    .results.show { display: block; }
    .results-score {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 800;
      line-height: 1;
      margin: 1rem 0 .5rem;
    }
    .results-score span { color: var(--accent); }
    .stars { font-size: 2rem; margin: .5rem 0 1.2rem; }
    .results-msg { color: var(--muted); font-size: .95rem; margin-bottom: 2rem; }

    .recap-list {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin-bottom: 2rem;
    }
    .recap-item {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .6rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
    }
    .recap-item .ri { font-size: 1rem; }
    .recap-item .eq { color: var(--accent2); flex: 1; }
    .recap-item .ans { }
    .recap-item.ok-item { border-color: #1a4a2e; }
    .recap-item.ko-item { border-color: #4a1a1a; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card, .results { animation: fadeUp .4s ease both; }
  </style>
</head>
<body>

<header>
  <div class="badge">Défi Révisions · 3ème</div>
  <h1>Résoudre des <span>équations</span></h1>
  <p class="subtitle">10 exercices · niveau collège</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Question 1 / 10</span>
    <span id="prog-pct">0 %</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<div class="score-row">
  <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
  <div class="chip wrong"><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
  <div class="chip remaining"><div class="dot"></div><span id="count-rem">10</span> restantes</div>
</div>

<!-- EXERCISE CARD -->
<div class="card" id="ex-card">
  <div class="question-num" id="q-num">Exercice 1</div>
  <div class="equation" id="q-eq"></div>
  <div class="question-text">Trouve la valeur de <em>x</em> qui vérifie cette équation.</div>

  <div class="input-row">
    <span class="input-label">x =</span>
    <input type="number" class="answer-input" id="answer-input" placeholder="?" autocomplete="off"/>
    <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">Valider ✓</button>
    <button class="btn btn-ghost" id="btn-hint" onclick="toggleHint()">Indice ?</button>
  </div>

  <div class="hint-box" id="hint-box"></div>

  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="fb-icon"></span>
    <div>
      <div id="fb-msg"></div>
      <div class="feedback-detail" id="fb-detail"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">← Précédent</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant →</button>
  </div>
</div>

<!-- RESULTS SCREEN -->
<div class="results" id="results-screen">
  <div class="badge">Résultats</div>
  <div class="results-score"><span id="score-num">0</span>/10</div>
  <div class="stars" id="stars-row"></div>
  <div class="results-msg" id="results-msg"></div>

  <div class="recap-list" id="recap-list"></div>

  <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;gap:.4rem">
    🔄 Recommencer
  </button>
</div>

<script>
/* ——— EXERCICES ——— */
const EXERCISES = [
  { eq: "3x + 5 = 14",           ans: 3,    hint: "Isoler x : 3x = 14 – 5, donc 3x = 9, d'où x = 9 ÷ 3." },
  { eq: "2x – 7 = 11",           ans: 9,    hint: "Ajouter 7 des deux côtés : 2x = 18, puis diviser par 2." },
  { eq: "5x = 35",               ans: 7,    hint: "Diviser les deux membres par 5." },
  { eq: "4x + 3 = 3x + 10",     ans: 7,    hint: "Rassembler les x d'un côté : 4x – 3x = 10 – 3." },
  { eq: "–2x + 8 = 2",          ans: 3,    hint: "–2x = 2 – 8 = –6, donc x = –6 ÷ (–2)." },
  { eq: "6x – 4 = 2x + 12",     ans: 4,    hint: "6x – 2x = 12 + 4, soit 4x = 16." },
  { eq: "x/3 + 1 = 5",          ans: 12,   hint: "Soustraire 1 : x/3 = 4, puis multiplier par 3." },
  { eq: "3(x – 2) = 9",         ans: 5,    hint: "Développer : 3x – 6 = 9, donc 3x = 15." },
  { eq: "2(3x + 1) = 14",       ans: 2,    hint: "Développer : 6x + 2 = 14, soit 6x = 12." },
  { eq: "5x – 3 = 2x + 9",      ans: 4,    hint: "5x – 2x = 9 + 3, soit 3x = 12." },
];

let current = 0;
let userAnswers = new Array(EXERCISES.length).fill(null); // null = unanswered
let hintOpen = false;

/* ——— DOM shortcuts ——— */
const $ = id => document.getElementById(id);

function render() {
  const ex = EXERCISES[current];
  $('q-num').textContent = `Exercice ${current + 1}`;
  $('q-eq').textContent = ex.eq;
  $('hint-box').textContent = '';
  $('hint-box').classList.remove('show');
  hintOpen = false;

  const inp = $('answer-input');
  inp.className = 'answer-input';
  inp.value = userAnswers[current] !== null ? userAnswers[current] : '';

  // feedback
  const fb = $('feedback');
  fb.className = 'feedback';
  if (userAnswers[current] !== null) {
    const correct = userAnswers[current] === ex.ans;
    showFeedback(correct, userAnswers[current]);
    inp.className = 'answer-input ' + (correct ? 'correct-input' : 'wrong-input');
    $('btn-next').disabled = false;
    $('btn-check').disabled = true;
    inp.disabled = true;
  } else {
    $('btn-next').disabled = true;
    $('btn-check').disabled = false;
    inp.disabled = false;
    inp.focus();
  }

  // progress
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = Math.round((answered / EXERCISES.length) * 100);
  $('progress-bar').style.width = pct + '%';
  $('prog-label').textContent = `Question ${current + 1} / ${EXERCISES.length}`;
  $('prog-pct').textContent = pct + ' %';

  // chips
  const ok = userAnswers.filter((a, i) => a === EXERCISES[i].ans).length;
  const ko = userAnswers.filter((a, i) => a !== null && a !== EXERCISES[i].ans).length;
  $('count-ok').textContent = ok;
  $('count-ko').textContent = ko;
  $('count-rem').textContent = EXERCISES.length - answered;

  // prev btn
  $('btn-prev').disabled = current === 0;
}

function showFeedback(correct, val) {
  const fb = $('feedback');
  fb.className = 'feedback show ' + (correct ? 'ok' : 'ko');
  $('fb-icon').textContent = correct ? '✓' : '✗';
  $('fb-msg').textContent = correct ? 'Bonne réponse !' : 'Pas tout à fait…';
  $('fb-detail').textContent = correct
    ? `x = ${val} vérifie bien l'équation.`
    : `La bonne réponse était x = ${EXERCISES[current].ans}.`;
}

function checkAnswer() {
  const val = parseFloat($('answer-input').value);
  if (isNaN(val)) { $('answer-input').focus(); return; }
  userAnswers[current] = val;
  render();
}

function toggleHint() {
  const h = $('hint-box');
  hintOpen = !hintOpen;
  if (hintOpen) {
    h.innerHTML = '<strong>💡 Indice :</strong> ' + EXERCISES[current].hint;
    h.classList.add('show');
  } else {
    h.classList.remove('show');
  }
}

function nextQ() {
  if (current < EXERCISES.length - 1) {
    current++;
    render();
    window.scrollTo({top: 0, behavior:'smooth'});
  } else {
    showResults();
  }
}

function prevQ() {
  if (current > 0) { current--; render(); }
}

function showResults() {
  $('ex-card').style.display = 'none';
  $('results-screen').classList.add('show');

  const ok = userAnswers.filter((a, i) => a === EXERCISES[i].ans).length;
  $('score-num').textContent = ok;

  // stars
  const stars = ok >= 9 ? 5 : ok >= 7 ? 4 : ok >= 5 ? 3 : ok >= 3 ? 2 : 1;
  $('stars-row').textContent = '⭐'.repeat(stars) + '☆'.repeat(5 - stars);

  const msgs = [
    'Continue à t\'entraîner, tu vas y arriver !',
    'Bon début, quelques révisions s\'imposent.',
    'Pas mal ! Encore un peu de pratique.',
    'Très bien ! Tu maîtrises bien le sujet.',
    'Excellent ! Tu es prêt(e) pour l\'évaluation.',
    'Parfait ! Résultats exceptionnels ! 🎉',
  ];
  $('results-msg').textContent = msgs[Math.min(ok, 5)];

  // recap
  const list = $('recap-list');
  list.innerHTML = '';
  EXERCISES.forEach((ex, i) => {
    const ans = userAnswers[i];
    const correct = ans === ex.ans;
    const div = document.createElement('div');
    div.className = 'recap-item ' + (correct ? 'ok-item' : 'ko-item');
    div.innerHTML = `
      <span class="ri">${correct ? '✅' : '❌'}</span>
      <span class="eq">${ex.eq}</span>
      <span class="ans">x = <strong>${ex.ans}</strong>${!correct && ans !== null ? ` (tu as mis ${ans})` : ans === null ? ' (pas répondu)' : ''}</span>
    `;
    list.appendChild(div);
  });

  window.scrollTo({top: 0, behavior:'smooth'});
}

function restart() {
  current = 0;
  userAnswers = new Array(EXERCISES.length).fill(null);
  $('ex-card').style.display = 'block';
  $('results-screen').classList.remove('show');
  render();
}

// Allow Enter key to validate
document.addEventListener('DOMContentLoaded', () => {
  $('answer-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !$('btn-check').disabled) checkAnswer();
  });
  render();
});
</script>

</body>
</html>
