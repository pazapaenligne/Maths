<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traduis par une expression littérale — 4ème</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --main:#f5a623; --titre:#a8660b; --light:#fff2dc; --border:#f5c98a;
         --badgetxt:#5a3500; --ink:#2a2a2a; --soft:#a8660b; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'JetBrains Mono',monospace;background:#fff;color:var(--ink);line-height:1.55;padding:14px;max-width:760px;margin:0 auto;}
  .hero{background:var(--light);border:3px solid var(--border);border-radius:20px;padding:22px 20px;text-align:center;margin-bottom:16px;}
  .brand-pill{display:inline-flex;align-items:center;gap:9px;background:var(--main);color:var(--badgetxt);font-weight:800;font-size:.92rem;letter-spacing:1px;padding:9px 22px;border-radius:30px;margin-bottom:16px;}
  .brand-pill .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .brand-pill .d1{background:rgba(90,53,0,.30);}
  .brand-pill .d2{background:var(--titre);}
  .week-label{color:var(--soft);font-weight:700;font-size:.86rem;letter-spacing:2px;margin-bottom:8px;}
  h1{font-weight:800;line-height:1.15;margin-bottom:10px;}
  h1 .serie{display:block;font-size:1.45rem;color:var(--titre);}
  h1 .niv{display:block;font-size:1.7rem;color:var(--ink);}
  .subtitle{font-size:.95rem;color:var(--soft);font-weight:500;margin-bottom:16px;}
  .level-pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .pill{font-family:inherit;font-weight:800;font-size:.85rem;letter-spacing:.5px;padding:11px 20px;border-radius:14px;border:3px solid var(--border);background:#fff;color:var(--soft);min-width:118px;cursor:pointer;transition:.12s;}
  .pill:hover{border-color:var(--main);}
  .pill.active{background:var(--main);color:var(--badgetxt);border-color:var(--titre);box-shadow:0 4px 0 rgba(0,0,0,.12);}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:3px solid var(--border);border-radius:16px;padding:12px 16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.06);flex-wrap:wrap;}
  .score-tag{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:1.05rem;color:var(--titre);}
  .qcount{font-size:.85rem;color:var(--soft);font-weight:700;}
  .dots{display:flex;gap:7px;flex-wrap:wrap;}
  .qdot{width:13px;height:13px;border-radius:50%;background:var(--light);border:2px solid var(--border);}
  .qdot.done{background:var(--main);border-color:var(--titre);}
  .qdot.cur{box-shadow:0 0 0 3px rgba(245,166,35,.35);}

  .qcard{background:#fff;border:3px solid var(--border);border-radius:18px;padding:26px 22px 22px;box-shadow:0 4px 18px rgba(0,0,0,.07);min-height:280px;display:flex;flex-direction:column;}
  .qcard .q-title{text-align:center;font-weight:800;font-size:1.25rem;color:var(--titre);margin-bottom:18px;}
  .q-statement{font-family:Georgia,serif;font-style:italic;font-size:1.18rem;line-height:1.6;margin-bottom:22px;}
  .ans-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .ans-lhs{font-family:Georgia,serif;font-style:italic;font-weight:800;font-size:1.6rem;color:var(--titre);}
  input[type=text]{font-family:inherit;font-size:1.15rem;font-weight:700;width:min(280px,70vw);padding:12px 14px;border:3px solid var(--border);border-radius:11px;text-align:center;color:var(--ink);background:#fff;}
  input[type=text]:focus{outline:none;border-color:var(--main);}
  .help-syntax{font-size:.8rem;color:var(--soft);margin:6px 0 0;}
  .help-syntax code{background:var(--light);padding:1px 6px;border-radius:5px;}
  .fb{margin-top:16px;font-weight:700;font-size:1rem;padding:11px 13px;border-radius:11px;display:none;}
  .fb.ok{display:block;background:#dff5c6;color:#3a4d00;border:2px solid #8dc63f;}
  .fb.no{display:block;background:#ffe1dd;color:#7a1c14;border:2px solid #f28b82;}
  .hint{display:none;margin-top:12px;background:#fffbeb;border:2px dashed var(--border);border-radius:11px;padding:11px 13px;font-size:.9rem;color:var(--titre);line-height:1.6;}
  .hint.show{display:block;}
  .hint em{font-style:italic;font-family:Georgia,serif;}
  .sol{display:none;margin-top:12px;background:var(--light);border:2px dashed var(--titre);border-radius:11px;padding:12px 14px;font-size:1rem;line-height:1.7;}
  .sol.show{display:block;}
  .sol b{color:var(--titre);} .sol em{font-style:italic;font-family:Georgia,serif;}
  .btn-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:18px;}
  .btn{font-family:inherit;font-weight:800;font-size:.98rem;cursor:pointer;border:none;border-radius:12px;padding:13px 22px;background:var(--main);color:var(--badgetxt);box-shadow:0 4px 0 rgba(0,0,0,.14);transition:.1s;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14);}
  #vbtn{background:#f28b82;color:#fff;}
  #vbtn:hover{background:#ee7268;}
  #vbtn.retry{background:#ffe2b0;color:var(--badgetxt);}
  .btn.ghost{background:#fff;color:var(--soft);border:3px solid var(--border);box-shadow:none;}
  .btn.retry{background:#ffe2b0;color:var(--badgetxt);}
  .btn.next{background:#8dc63f;color:#214d00;box-shadow:0 4px 0 rgba(0,0,0,.14);}

  .results{display:none;text-align:center;background:var(--light);border:3px solid var(--main);border-radius:20px;padding:30px 22px;}
  .results.show{display:block;}
  .results h2{color:var(--titre);font-size:1.4rem;margin-bottom:10px;}
  .results .big{font-size:2.6rem;font-weight:800;color:var(--titre);margin:8px 0;}
  .results .btn{margin-top:14px;}

  .extra{margin-top:22px;}
  .extra-title{font-weight:800;color:var(--titre);font-size:1.1rem;margin:0 4px 8px;border-left:5px solid var(--main);padding-left:10px;}
  .extra-note{font-size:.88rem;color:var(--soft);margin:0 4px 10px;}
  .ext-frame-wrap{background:#fff;border:3px solid var(--border);border-radius:16px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.06);}
  .ext-frame{width:100%;height:560px;border:none;border-radius:10px;background:#fff;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<div class="hero">
  <div class="brand-pill"><span class="dot d1"></span><span class="dot d2"></span>PAZAPA &middot; MATHS &middot; 4&Egrave;ME</div>
  <div class="week-label">SEMAINE 1 — JOUR 1</div>
  <h1><span class="serie">&#9999;&#65039; Traduis par une expression</span></h1>
  <div class="subtitle">Calcul littéral</div>
  <div class="level-pills">
    <button class="pill active" id="pill1" onclick="setLevel(1)">NIVEAU 1</button>
    <button class="pill" id="pill2" onclick="setLevel(2)">NIVEAU 2</button>
  </div>
</div>

<div class="topbar">
  <span class="score-tag" id="score-tag">Score : 0</span>
  <div class="dots" id="dots"></div>
  <span class="qcount" id="qcount">Question 1 / 4</span>
</div>

<div id="stage"></div>

<div class="results" id="results">
  <h2>&#127942; Niveau terminé !</h2>
  <div class="big" id="res-score">0 / 0</div>
  <p id="res-msg"></p>
  <button class="btn" onclick="resetLevel()">&#8635; Recommencer ce niveau</button>
</div>

<div class="extra" id="extra">
  <div class="extra-title">&#127919; Pour aller plus loin</div>
  <div class="extra-note">Un exercice interactif complémentaire pour t'entraîner encore.</div>
  <div class="ext-frame-wrap">
    <iframe class="ext-frame" title="Exercice complémentaire" src="https://www.hatier-clic.fr/miniliens/mie/9782401082175/C03_ex35_eleve/index.html" loading="lazy" allowfullscreen></iframe>
  </div>
</div>

<script>
function norm(s){
  return String(s||'').toLowerCase()
    .replace(/\u00d7/g,'*').replace(/\u00f7/g,'/').replace(/\u2212/g,'-')
    .replace(/\u00b2/g,'^2')
    .replace(/\s+/g,'');
}
function eqAny(val, answers){
  var v=norm(val);
  for(var i=0;i<answers.length;i++){ if(v===norm(answers[i])) return true; }
  return false;
}

var LEVELS={
1:[
  {lhs:'B =', prompt:'<em>B</em> est le produit de 4 par <em>a</em>.',
   answers:['4a','4*a','a*4','a4'],
   hint:'Un produit, c\'est une multiplication. Devant une lettre, le signe \u00d7 ne s\'écrit pas.',
   sol:'<em>B</em> = <b>4a</b>'},
  {lhs:'C =', prompt:'<em>C</em> est la différence de <em>a</em> et de 3.',
   answers:['a-3'],
   hint:'Une différence, c\'est une soustraction : on garde l\'ordre donné dans la phrase.',
   sol:'<em>C</em> = <b>a \u2212 3</b>'},
  {lhs:'D =', prompt:'<em>D</em> est la somme de 4 et du produit de 4 par <em>y</em>.',
   answers:['4+4y','4y+4','4+4*y','4*y+4'],
   hint:'D\'abord le produit de 4 par <em>y</em>, puis on l\'ajoute à 4. L\'ordre des termes d\'une somme n\'a pas d\'importance.',
   sol:'<em>D</em> = <b>4 + 4y</b>'},
  {lhs:'E =', prompt:'<em>E</em> est la somme du produit de 2 par <em>y</em> et de 2.',
   answers:['2y+2','2*y+2','2+2y','2+2*y'],
   hint:'Le produit de 2 par <em>y</em> s\'écrit 2<em>y</em> ; on lui ajoute ensuite 2.',
   sol:'<em>E</em> = <b>2y + 2</b>'}
],
2:[
  {lhs:'A =', prompt:'<em>A</em> est le produit de 5 par la somme de <em>y</em> et de 8.',
   answers:['5(y+8)','5*(y+8)','(y+8)*5','5(8+y)','5*(8+y)','(8+y)*5'],
   hint:'La somme de <em>y</em> et 8 se calcule en premier : place-la entre parenthèses, puis multiplie par 5.',
   sol:'<em>A</em> = <b>5(y + 8)</b>'},
  {lhs:'B =', prompt:'<em>B</em> est le produit de 4 par la différence de <em>x</em> et de 3.',
   answers:['4(x-3)','4*(x-3)','(x-3)*4'],
   hint:'La différence de <em>x</em> et 3 va entre parenthèses, puis on multiplie le tout par 4.',
   sol:'<em>B</em> = <b>4(x \u2212 3)</b>'},
  {lhs:'C =', prompt:'<em>C</em> est la différence du produit de 3 par <em>a</em> et du produit de 4 par <em>a</em>.',
   answers:['3a-4a','3*a-4*a'],
   hint:'Écris chaque produit (3<em>a</em> et 4<em>a</em>), puis fais leur différence dans l\'ordre donné.',
   sol:'<em>C</em> = <b>3a \u2212 4a</b>'},
  {lhs:'D =', prompt:'<em>D</em> est la différence du carré de <em>a</em> et du produit de 7 par <em>a</em>.',
   answers:['a^2-7a','a^2-7*a','a\u00b2-7a','a\u00b2-7*a'],
   hint:'Le carré de <em>a</em> s\'écrit <em>a</em>\u00b2 (ou a^2). Le produit de 7 par <em>a</em> s\'écrit 7<em>a</em>. On fait leur différence.',
   sol:'<em>D</em> = <b>a\u00b2 \u2212 7a</b>'},
  {lhs:'E =', prompt:'<em>E</em> est le carré de la somme de <em>x</em> et de 6.',
   answers:['(x+6)^2','(x+6)\u00b2','(6+x)^2','(6+x)\u00b2','(x+6)*(x+6)','(x+6)(x+6)'],
   hint:'D\'abord la somme de <em>x</em> et 6 entre parenthèses, puis on élève tout au carré.',
   sol:'<em>E</em> = <b>(x + 6)\u00b2</b>'}
]
};

var level=1, cur=0, score=0, errCount=0, doneArr=[];

function setLevel(n){
  level=n; cur=0; score=0; errCount=0;
  doneArr=LEVELS[n].map(function(){return false;});
  [1,2].forEach(function(k){ document.getElementById('pill'+k).classList.toggle('active', k===n); });
  document.getElementById('results').classList.remove('show');
  document.getElementById('stage').style.display='';
  document.querySelector('.topbar').style.display='';
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderDots(){
  var d=document.getElementById('dots'); d.innerHTML='';
  LEVELS[level].forEach(function(_,i){
    d.insertAdjacentHTML('beforeend','<span class="qdot'+(doneArr[i]?' done':'')+(i===cur?' cur':'')+'"></span>');
  });
  document.getElementById('score-tag').textContent='Score : '+score;
  document.getElementById('qcount').textContent='Question '+(cur+1)+' / '+LEVELS[level].length;
}

function renderQuestion(){
  var ex=LEVELS[level][cur];
  var html=''
   +'<div class="qcard">'
   +'  <div class="q-title">Traduis par une expression littérale :</div>'
   +'  <div class="q-statement">'+ex.prompt+'</div>'
   +'  <div class="ans-row"><span class="ans-lhs">'+ex.lhs+'</span>'
   +'    <input type="text" id="ans" autocomplete="off"></div>'
   +'  <div class="help-syntax">Astuce : tu peux écrire <code>*</code> pour \u00d7 et <code>^2</code> pour un carré.</div>'
   +'  <div class="fb" id="fb"></div>'
   +'  <div class="hint" id="hint">'+ex.hint+'</div>'
   +'  <div class="sol" id="sol"><b>Solution :</b><br>'+ex.sol+'</div>'
   +'  <div class="btn-bar" id="btnbar">'
   +'    <button class="btn" id="vbtn" onclick="checkAns()">Valider</button>'
   +'    <button class="btn ghost" id="hbtn" onclick="toggleHint()">&#128161; Indice</button>'
   +'    <button class="btn ghost" id="sbtn" onclick="revealSol()">Solution</button>'
   +'  </div>'
   +'</div>';
  document.getElementById('stage').innerHTML=html;
  renderDots();
  var inp=document.getElementById('ans');
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') checkAns(); });
  inp.focus();
}

function checkAns(){
  var ex=LEVELS[level][cur];
  var v=document.getElementById('ans').value;
  if(String(v||'').trim()===''){ flash(false,'Saisis d\'abord une expression.'); return; }
  if(eqAny(v, ex.answers)){
    if(!doneArr[cur]){ doneArr[cur]=true; score++; }
    document.getElementById('sol').classList.add('show');
    document.getElementById('vbtn').classList.add('hidden');
    flash(true,'\u2713 Bravo, c\'est juste !');
    addNextBtn();
  } else {
    errCount++;
    flash(false,'\u2717 Essaie à nouveau, ou clique sur « Solution ».');
    var vb=document.getElementById('vbtn'); vb.textContent='\u21bb Réessayer'; vb.classList.add('retry');
  }
  renderDots();
}
function toggleHint(){
  var hb=document.getElementById('hint'); var b=document.getElementById('hbtn');
  var open=hb.classList.toggle('show');
  b.innerHTML = open ? '&#128161; Masquer l\'indice' : '&#128161; Indice';
}
function revealSol(){
  document.getElementById('sol').classList.add('show');
  addNextBtn();
}
function addNextBtn(){
  if(document.getElementById('nbtn')) return;
  var last = cur===LEVELS[level].length-1;
  var label = last ? 'Voir le bilan &#8594;' : 'Suite &#8594;';
  document.getElementById('btnbar').insertAdjacentHTML('beforeend',
    '<button class="btn next" id="nbtn" onclick="nextQ()">'+label+'</button>');
}
function nextQ(){
  if(cur < LEVELS[level].length-1){ cur++; renderQuestion(); }
  else { showResults(); }
}
function flash(good,msg){ var fb=document.getElementById('fb'); fb.className='fb '+(good?'ok':'no'); fb.textContent=msg; }

function showResults(){
  document.getElementById('stage').style.display='none';
  document.querySelector('.topbar').style.display='none';
  var tot=LEVELS[level].length;
  document.getElementById('res-score').textContent=score+' / '+tot;
  var msg; if(errCount===0) msg='Sans-faute ! Tu sais traduire une phrase par une expression. \u2b50'; else if(errCount<=3) msg='Très bien joué, tu as su rebondir après les erreurs. \uD83C\uDFC6'; else msg='Niveau terminé ! Recommence pour viser le sans-faute. \uD83C\uDFAF';
  document.getElementById('res-msg').textContent=msg;
  var r=document.getElementById('results'); r.classList.add('show'); r.scrollIntoView({behavior:'smooth',block:'center'});
}
function resetLevel(){ setLevel(level); }

setLevel(1);
</script>
</body>
</html>
