<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Carte mentale (à trous) — La division euclidienne</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #eee; padding: 20px; }
  .fiche { position:relative; max-width:820px; margin:0 auto; background:#fffdf7; border-radius:18px; overflow:hidden; color:#1a1d23; line-height:1.8; text-align:left; border:1.5px solid #e8e4d9; }
  .b { position:absolute; border-radius:50%; pointer-events:none; }
  .stripe { height:6px; position:relative; z-index:1; }
  .pad { position:relative; z-index:1; padding:24px 26px 28px; }
  .head { text-align:center; margin-bottom:8px; }
  .badge { display:inline-block; background:#f5c518; color:#8a6000; font-family:'Courier New',monospace; font-size:12px; font-weight:bold; letter-spacing:1px; padding:5px 14px; border-radius:99px; }
  .badge .d1{color:#f28b82}.badge .d2{color:#8dc63f}.badge .d3{color:#3ab5d8}
  .wj { color:#8a8f9a; font-size:13px; margin:9px 0 4px 0; }
  .cm { color:#c47a10; font-size:14px; font-weight:bold; margin-bottom:2px; }
  .title { font-size:24px; font-weight:bold; color:#c47a10; }
  .pdf { text-align:center; font-size:15px; font-weight:bold; color:#c47a10; margin:6px 0 4px 0; }
</style>
</head>
<body>
<div class="fiche">
  <div class="b" style="top:-50px;right:-50px;width:220px;height:220px;background:#f5c518;opacity:.10;"></div>
  <div class="b" style="bottom:-50px;left:-50px;width:200px;height:200px;background:#f5a623;opacity:.10;"></div>
  <div class="b" style="bottom:160px;right:-40px;width:140px;height:140px;background:#8dc63f;opacity:.08;"></div>
  <div class="b" style="top:200px;left:-30px;width:110px;height:110px;background:#f28b82;opacity:.10;"></div>

  <div class="stripe" style="background:linear-gradient(90deg,#f5a623,#f5c518,#f28b82);"></div>

  <div class="pad">
    <div class="head">
      <span class="badge"><span class="d1">&#9679;</span><span class="d2">&#9679;</span><span class="d3">&#9679;</span>&nbsp;PAZAPA &middot; MATHS &middot; 6e</span>
      <p class="wj">Semaine 3 &ndash; Jour 1</p>
      <p class="cm">Carte mentale</p>
      <p class="title">La division euclidienne</p>
    </div>

    <svg viewBox="0 0 820 440" style="display:block;width:100%;height:auto;" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
      <!-- ===== OPÉRATION POSÉE (centre) ===== -->
      <!-- potence : trait vertical + trait horizontal -->
      <line x1="410" y1="120" x2="410" y2="300" stroke="#1a1d23" stroke-width="2"/>
      <line x1="410" y1="150" x2="480" y2="150" stroke="#1a1d23" stroke-width="2"/>

      <!-- dividende 162 -->
      <text x="360" y="135" font-size="20" text-anchor="end" font-family="'Courier New',monospace" fill="#1a1d23">162</text>
      <!-- - 14 -->
      <text x="360" y="170" font-size="18" text-anchor="end" font-family="'Courier New',monospace" fill="#c0392b">&#8722; 14</text>
      <line x1="320" y1="178" x2="372" y2="178" stroke="#1a1d23" stroke-width="1.2"/>
      <!-- 22 (abaisse le 2) -->
      <text x="365" y="198" font-size="18" text-anchor="end" font-family="'Courier New',monospace" fill="#1a1d23">22</text>
      <!-- - 21 -->
      <text x="365" y="222" font-size="18" text-anchor="end" font-family="'Courier New',monospace" fill="#7d3c98">&#8722; 21</text>
      <line x1="320" y1="230" x2="378" y2="230" stroke="#1a1d23" stroke-width="1.2"/>
      <!-- reste 01 -->
      <text x="372" y="250" font-size="18" text-anchor="end" font-family="'Courier New',monospace" fill="#27867a">01</text>

      <!-- diviseur 7 -->
      <text x="430" y="142" font-size="20" font-family="'Courier New',monospace" fill="#e67e22" font-weight="bold">7</text>
      <!-- quotient 23 -->
      <text x="430" y="175" font-size="20" font-family="'Courier New',monospace" fill="#2980b9" font-weight="bold">23</text>

      <!-- ===== ÉTIQUETTES + FLÈCHES ===== -->
      <!-- Dividende (haut gauche, rouge) -->
      <rect x="40" y="40" width="240" height="46" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
      <text x="160" y="68" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">&hellip;&hellip;&hellip;&hellip;&hellip;&hellip;</text>
      
      <path d="M255 86 Q310 110 350 128" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar_r)"/>

      <!-- Diviseur (haut droite, orange) -->
      <rect x="540" y="40" width="240" height="46" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2"/>
      <text x="660" y="68" font-size="13" text-anchor="middle" fill="#e67e22" font-weight="bold">&hellip;&hellip;&hellip;&hellip;&hellip;&hellip;</text>
      
      <path d="M545 78 Q490 110 442 130" fill="none" stroke="#e67e22" stroke-width="2.5" marker-end="url(#ar_o)"/>

      <!-- Quotient (droite, vert) -->
      <rect x="540" y="210" width="240" height="46" rx="10" fill="#fff" stroke="#8dc63f" stroke-width="2"/>
      <text x="660" y="238" font-size="13" text-anchor="middle" fill="#3d7a10" font-weight="bold">&hellip;&hellip;&hellip;&hellip;&hellip;&hellip;</text>
      
      <path d="M540 224 Q500 200 452 178" fill="none" stroke="#8dc63f" stroke-width="2.5" marker-end="url(#ar_g)"/>

      <!-- Reste (bas gauche, violet) -->
      <rect x="40" y="330" width="270" height="46" rx="10" fill="#fff" stroke="#7d3c98" stroke-width="2"/>
      <text x="175" y="358" font-size="13" text-anchor="middle" fill="#7d3c98" font-weight="bold">&hellip;&hellip;&hellip;&hellip;&hellip;&hellip;</text>
      
      <path d="M290 332 Q350 290 378 255" fill="none" stroke="#7d3c98" stroke-width="2.5" marker-end="url(#ar_v)"/>

      <!-- marqueurs de flèches -->
      <defs>
        <marker id="ar_r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/></marker>
        <marker id="ar_o" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e67e22"/></marker>
        <marker id="ar_g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8dc63f"/></marker>
        <marker id="ar_v" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7d3c98"/></marker>
      </defs>
    </svg>

    <p style="text-align:center;font-size:14px;color:#1a1d23;margin:6px 0 0 0;font-family:'Courier New',monospace;">&hellip;&hellip; = &hellip;&hellip; &times; &hellip;&hellip; + &hellip;&hellip;</p>

    <p class="pdf">*** Le pdf imprimable est disponible <a href="https://education.pazapaenligne.com/mod/resource/view.php?id=307330&forceview=1" target="_blank" rel="noopener" style="color:#c47a10;">ici</a> ! ***</p>
  </div>

  <div class="stripe" style="background:linear-gradient(90deg,#f28b82,#f5c518,#f5a623);"></div>
</div>
</body>
</html>
