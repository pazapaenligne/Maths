<head>

<style>
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}}
:root{

  --day-border:#b5e08a;--day-glow:rgba(141,198,63,.3);

  --green:#8dc63f;--blue:#3ab5d8;--yellow:#f5c518;--orange:#f5a623;--red:#b94040;
  --text:#1a1d23;--muted:#7a8a6a;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:0 1rem 90px;overflow-x:hidden;line-height:1.7;}
body::before{content:'';position:fixed;inset:0;z-index:0;opacity:.03;
  background:repeating-linear-gradient(45deg,transparent,transparent 20px,#8dc63f 20px,#8dc63f 21px);pointer-events:none;}
.bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:260px;height:260px;background:var(--yellow);top:-60px;right:-40px;pointer-events:none;}
.bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.08;width:190px;height:190px;background:var(--day-color);bottom:-40px;left:-40px;pointer-events:none;}
.bubble3{position:fixed;border-radius:50%;z-index:0;opacity:.06;width:140px;height:140px;background:var(--blue);top:40%;right:-60px;pointer-events:none;}
.bubble4{position:fixed;border-radius:50%;z-index:0;opacity:.06;width:150px;height:150px;background:#f28b82;bottom:20%;left:-60px;pointer-events:none;}
header{width:100%;text-align:center;padding:1.2rem 0 .5rem;position:relative;z-index:1;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:#f5c518;color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);}
h1{font-size:clamp(1.2rem,3.5vw,1.8rem);font-weight:900;color:var(--day-dark);margin:.3rem 0 .1rem;}
.activity-label{font-size:clamp(1rem,3vw,1.2rem);font-weight:800;color:var(--text);}
.level-track{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:.8rem auto;position:relative;z-index:1;font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);flex-wrap:wrap;}
.level-pill{padding:.35rem .8rem;border-radius:99px;border:2px solid var(--border);background:var(--surface);font-weight:700;}
.level-pill.active{border-color:var(--day-color);background:var(--day-light);color:var(--day-dark);}
.level-pill.done{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.level-title{width:100%;max-width:640px;text-align:center;font-size:1rem;font-weight:800;color:var(--day-dark);font-family:'JetBrains Mono',monospace;margin:.4rem auto 0;position:relative;z-index:1;}
.level-mission{width:100%;max-width:640px;text-align:center;font-size:.86rem;color:var(--muted);margin:0 auto .8rem;position:relative;z-index:1;}
#main-zone{width:100%;max-width:640px;position:relative;z-index:1;}
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.4rem;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.05);transition:box-shadow .25s ease;}
.card.halo-ok{box-shadow:0 0 0 6px rgba(141,198,63,.35),0 4px 16px rgba(0,0,0,.05);}
.card.halo-ko{box-shadow:0 0 0 6px rgba(245,166,35,.35),0 4px 16px rgba(0,0,0,.05);}
.card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--blue));}
.ex-badge{display:inline-block;background:var(--day-color);color:#fff;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.2rem .65rem;border-radius:99px;margin-bottom:.7rem;font-family:'JetBrains Mono',monospace;}
.q-label{font-size:clamp(1rem,3vw,1.1rem);font-weight:700;line-height:1.6;margin-bottom:.7rem;}
.figure-wrap{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.7rem;margin-bottom:.9rem;text-align:center;}
.stat-table{border-collapse:collapse;margin:0 auto;font-size:.92rem;}
.stat-table th,.stat-table td{border:1.5px solid var(--day-border);padding:.5rem .9rem;font-family:'JetBrains Mono',monospace;}
.stat-table th{background:var(--day-color);color:#fff;font-weight:800;}
.stat-table td{background:var(--surface);font-weight:700;color:var(--day-dark);}
.hint-box{background:#fff8e6;border:1.5px solid #f0d989;border-left:5px solid var(--yellow);border-radius:8px;padding:.6rem .85rem;font-size:.88rem;color:#7a5500;margin-bottom:1rem;line-height:1.6;}
.answer-zone{margin-bottom:.9rem;}
.num-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
.num-input{width:8rem;padding:.55rem .7rem;border-radius:8px;border:2px solid var(--day-border);background:var(--day-light);font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:800;text-align:center;color:var(--day-dark);}
.num-input:focus-visible{outline:3px solid var(--day-dark);}
.num-input.ok{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.num-input.ko{border-color:var(--orange);background:#fff3e0;color:#8a5a10;}
.unit-tag{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--muted);}
.opts-col{display:flex;flex-direction:column;gap:.45rem;}
.opt-card{font-size:.92rem;font-weight:600;padding:.65rem 1rem;border-radius:10px;border:2px solid var(--day-border);background:var(--day-light);color:var(--text);cursor:pointer;min-height:48px;text-align:left;display:flex;gap:.6rem;align-items:center;width:100%;font-family:'JetBrains Mono',monospace;transition:.15s;}
.opt-card:hover:not([disabled]){border-color:var(--day-color);background:#e5f5d0;}
.opt-card:focus-visible{outline:3px solid var(--day-dark);outline-offset:2px;}
.opt-card[disabled]{cursor:default;}
.opt-card.selected{border-color:var(--day-color);background:#e5f5d0;font-weight:800;}
.opt-card.ok{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.opt-card.ko{border-color:var(--orange);background:#fff3e0;color:#8a5a10;}
.opt-letter{font-family:'JetBrains Mono',monospace;font-weight:800;min-width:1.3rem;color:var(--day-dark);}
.match-row{display:flex;align-items:center;gap:.6rem;margin:.5rem 0;flex-wrap:wrap;}
.match-label{font-weight:700;min-width:8rem;font-size:.92rem;}
.match-select{flex:1;min-width:10rem;padding:.5rem .6rem;border-radius:8px;border:2px solid var(--day-border);background:var(--day-light);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.88rem;min-height:44px;cursor:pointer;color:var(--day-dark);}
.match-select:focus-visible{outline:3px solid var(--day-dark);}
.match-select.ok{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.match-select.ko{border-color:var(--orange);background:#fff3e0;color:#8a5a10;}
.feedback{margin-top:.9rem;padding:.7rem .9rem;border-radius:10px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;display:none;border-left:5px solid transparent;}
.feedback.show{display:block;}
.feedback.ok{background:#eefad8;border-left-color:var(--green);color:#3d7a10;}
.feedback.ko{background:#fff3e0;border-left-color:var(--orange);color:#8a5a10;}
.feedback.correction{background:#fce4e4;border-left-color:#c0392b;color:#8f2f2f;}
.fb-titre{font-weight:800;display:block;margin-bottom:.3rem;}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(.88rem,2.5vw,.97rem);font-weight:800;cursor:pointer;border:none;min-height:44px;transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn:focus-visible{outline:3px solid var(--day-dark);outline-offset:2px;}
.btn-primary{background:var(--day-dark);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
.btn-primary:hover{transform:translateY(-1px);}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem;}
#final-screen{display:none;width:100%;max-width:640px;position:relative;z-index:1;}
#final-screen.show{display:block;}
.final-card{background:var(--surface);border:2px solid var(--day-border);border-radius:var(--radius);padding:2rem 1.6rem;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.stripe{height:4px;border-radius:4px;margin-bottom:1.2rem;background:linear-gradient(90deg,#8dc63f,#f5c518,#3ab5d8);}
.final-title{font-size:1.25rem;font-weight:900;color:var(--day-dark);margin-bottom:1rem;}
@media(max-width:480px){body{padding:0 .75rem 70px;}.card{padding:1rem;}}
</style>
</head>

(function(){
"use strict";

/* ── Tableau statistique ── */
function tableFig(headers,rows){

  h+='</tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr>'; r.forEach(function(c){h+='<td>'+c+'</td>';}); h+='</tr>';});
  h+='</tbody></table></div>';

}

var LEVELS=[
{

{

/* ── Normalisation numérique (virgule/point, espaces, unités) ── */
function normalizeNumeric(v){
  if(v===null||v===undefined) return null;
  v=String(v).trim().replace(/%/g,'').replace(/[\s\u00A0\u202F]/g,'').replace(',','.');
  if(v==='') return null;
  var n=Number(v);
  return Number.isFinite(n)?n:null;
}

/* ── Moteur ── */
var curLevel=0,curEx=0,attempts=0,answered=false,selectedQcm=null,advanceID=null;

function clearAdvance(){ if(advanceID!==null){clearTimeout(advanceID);advanceID=null;} }

function renderExercise(){
  clearAdvance();
  answered=false;attempts=0;selectedQcm=null;
  updateTrack();
  var lvl=LEVELS[curLevel], ex=lvl.exercises[curEx];
  $('level-title').textContent=lvl.title;
  $('level-mission').innerHTML='\uD83C\uDFAF Objectif\u00a0: '+lvl.mission;
  var zone=$('main-zone'); zone.innerHTML='';
  var card=document.createElement('div'); card.className='card'; card.id='ex-card';
  card.innerHTML='<div class="card-stripe"></div>'
    +'<div class="ex-badge">Exercice '+(curEx+1)+' / '+lvl.exercises.length+'</div>'
    +'<div class="q-label">'+ex.label+'</div>'
    +(ex.figure||'')
    +'<div class="hint-box">'+ex.hint+'</div>'
    +'<div class="answer-zone" id="answer-zone"></div>'
    +'<div class="feedback" id="feedback" role="status" aria-live="polite"></div>'
    +'<div class="btn-row" id="btn-row"></div>';
  zone.appendChild(card);

  var az=$('answer-zone');
  if(ex.type==='numeric'){
    az.innerHTML='<div class="num-row"><input type="text" inputmode="decimal" class="num-input" id="num-in" aria-label="Ta r\u00e9ponse '+(ex.unit?('en '+ex.unit):'')+'"/><span class="unit-tag">'+(ex.unit||'')+'</span></div>';
    $('num-in').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();verifyExercise();}});
    $('num-in').focus();
    var br=$('btn-row');
    var vb=document.createElement('button');vb.type='button';vb.className='btn btn-primary';vb.textContent='\u2713 V\u00e9rifier';
    vb.addEventListener('click',verifyExercise);br.appendChild(vb);
  } else if(ex.type==='qcm'){
    var oc=document.createElement('div');oc.className='opts-col';oc.id='qcm-opts';
    ex.options.forEach(function(o,i){
      var btn=document.createElement('button');btn.type='button';btn.className='opt-card';
      btn.setAttribute('aria-pressed','false');
      btn.innerHTML='<span class="opt-letter">'+String.fromCharCode(65+i)+'.</span> '+o;
      btn.addEventListener('click',function(){
        if(answered) return;
        selectedQcm=i;
        oc.querySelectorAll('.opt-card').forEach(function(b,j){
          b.classList.toggle('selected',j===i);
          b.setAttribute('aria-pressed',j===i?'true':'false');
        });
      });
      oc.appendChild(btn);
    });
    az.appendChild(oc);
    var firstOpt=oc.querySelector('.opt-card'); if(firstOpt) firstOpt.focus();
    var brq=$('btn-row');
    var vbq=document.createElement('button');vbq.type='button';vbq.className='btn btn-primary';vbq.textContent='\u2713 V\u00e9rifier';
    vbq.addEventListener('click',verifyExercise);brq.appendChild(vbq);
  } else if(ex.type==='match'){
    var mz=document.createElement('div');
    ex.rows.forEach(function(r,ri){
      var mr=document.createElement('div');mr.className='match-row';
      var lab=document.createElement('span');lab.className='match-label';lab.textContent=r.label;
      var sel=document.createElement('select');sel.className='match-select';sel.id='match-'+ri;
      sel.setAttribute('aria-label','R\u00e9ponse pour '+r.label);
      r.opts.forEach(function(o,i){var opt=document.createElement('option');opt.value=i;opt.textContent=o;sel.appendChild(opt);});
      mr.appendChild(lab);mr.appendChild(sel);
      mz.appendChild(mr);
    });
    az.appendChild(mz);
    var firstSel=mz.querySelector('select'); if(firstSel) firstSel.focus();
    var br2=$('btn-row');
    var vb2=document.createElement('button');vb2.type='button';vb2.className='btn btn-primary';vb2.textContent='\u2713 V\u00e9rifier';
    vb2.addEventListener('click',verifyExercise);br2.appendChild(vb2);
  } else if(ex.type==='fill'){
    var fw=document.createElement('div');fw.style.fontSize='1.05rem';fw.style.fontWeight='700';
    var sel1=document.createElement('select');sel1.className='match-select';sel1.id='fill-1';sel1.style.display='inline-block';sel1.style.width='auto';sel1.setAttribute('aria-label','Premier terme de la formule');
    ex.opts1.forEach(function(o,i){var opt=document.createElement('option');opt.value=i;opt.textContent=o;sel1.appendChild(opt);});
    var sel2=document.createElement('select');sel2.className='match-select';sel2.id='fill-2';sel2.style.display='inline-block';sel2.style.width='auto';sel2.setAttribute('aria-label','Second terme de la formule');
    ex.opts2.forEach(function(o,i){var opt=document.createElement('option');opt.value=i;opt.textContent=o;sel2.appendChild(opt);});
    fw.appendChild(document.createTextNode(ex.prefix));
    fw.appendChild(sel1);
    fw.appendChild(document.createTextNode(ex.sep));
    fw.appendChild(sel2);
    az.appendChild(fw);
    sel1.focus();
    var br3=$('btn-row');
    var vb3=document.createElement('button');vb3.type='button';vb3.className='btn btn-primary';vb3.textContent='\u2713 V\u00e9rifier';
    vb3.addEventListener('click',verifyExercise);br3.appendChild(vb3);
  }
}

function updateTrack(){
  [0,1,2].forEach(function(i){
    var pill=$('lp'+i);
    pill.className='level-pill'+(i===curLevel?' active':i<curLevel?' done':'');
  });
}

function checkAnswer(){
  var lvl=LEVELS[curLevel], ex=lvl.exercises[curEx];
  if(ex.type==='numeric'){
    var v=normalizeNumeric($('num-in').value);
    if(v===null) return null;
    return Math.abs(v-ex.expected)<(ex.tolerance||0.5);
  }
  if(ex.type==='qcm'){
    if(selectedQcm===null) return null;
    return selectedQcm===ex.correct;
  }
  if(ex.type==='match'){
    var allFilled=true, allOk=true;
    ex.rows.forEach(function(r,ri){
      var v=parseInt($('match-'+ri).value);
      if(!v){allFilled=false;} else if(v!==r.correct){allOk=false;}
    });
    if(!allFilled) return null;
    return allOk;
  }
  if(ex.type==='fill'){
    var v1=parseInt($('fill-1').value), v2=parseInt($('fill-2').value);
    if(!v1||!v2) return null;
    return (v1===ex.correct1 && v2===ex.correct2);
  }
}

function verifyExercise(){
  if(answered) return;
  var lvl=LEVELS[curLevel], ex=lvl.exercises[curEx];
  var ok=checkAnswer();
  if(ok===null){
    var fb=$('feedback');fb.className='feedback show ko';
    fb.innerHTML='<span class="fb-titre">\u270F\uFE0F</span>R\u00e9ponds \u00e0 la question avant de v\u00e9rifier.';
    return;
  }
  attempts++;
  var card=$('ex-card');
  if(ok){
    answered=true;
    card.classList.add('halo-ok');
    markFields(ex,true);
    var fb=$('feedback');fb.className='feedback show ok';
    fb.innerHTML='<span class="fb-titre">\u2705 Bravo\u00a0!</span>'+ex.fbOk;
    disableAnswerZone();
    clearAdvance();
    advanceID=setTimeout(function(){advanceID=null;goToNext();},1600);
  } else if(attempts===1){
    card.classList.add('halo-ko');
    markFields(ex,false);
    var fb2=$('feedback');fb2.className='feedback show ko';
    fb2.innerHTML='<span class="fb-titre">\uD83D\uDD04 Essaie encore</span>Relis l\u2019indice et corrige ta r\u00e9ponse.';
    setTimeout(function(){card.classList.remove('halo-ko');},900);
  } else {
    answered=true;
    var fb3=$('feedback');fb3.className='feedback show correction';
    fb3.innerHTML='<span class="fb-titre">\uD83D\uDCD8 Correction</span>'+ex.correction;
    revealCorrect(ex);
    disableAnswerZone();
    clearAdvance();
    advanceID=setTimeout(function(){advanceID=null;goToNext();},3400);
  }
}

function markFields(ex,ok){
  if(ex.type==='numeric'){
    var inp=$('num-in'); inp.classList.remove('ok','ko'); inp.classList.add(ok?'ok':'ko');
  } else if(ex.type==='qcm'){
    var oc=$('qcm-opts');
    oc.querySelectorAll('.opt-card').forEach(function(b,j){
      b.classList.remove('ok','ko');
      if(j===selectedQcm) b.classList.add(j===ex.correct?'ok':'ko');
    });
  } else if(ex.type==='match'){
    ex.rows.forEach(function(r,ri){
      var sel=$('match-'+ri); var v=parseInt(sel.value);
      sel.classList.remove('ok','ko');
      sel.classList.add(v===r.correct?'ok':'ko');
    });
  } else if(ex.type==='fill'){
    var s1=$('fill-1'),s2=$('fill-2');
    s1.classList.remove('ok','ko');s2.classList.remove('ok','ko');
    s1.classList.add(parseInt(s1.value)===ex.correct1?'ok':'ko');
    s2.classList.add(parseInt(s2.value)===ex.correct2?'ok':'ko');
  }
}
function revealCorrect(ex){
  if(ex.type==='numeric'){
    var inp=$('num-in'); inp.value=ex.expected; inp.classList.remove('ko'); inp.classList.add('ok');
  } else if(ex.type==='qcm'){
    var oc=$('qcm-opts');
    oc.querySelectorAll('.opt-card').forEach(function(b,j){
      b.classList.remove('ok','ko');
      if(j===ex.correct) b.classList.add('ok');
      else if(j===selectedQcm) b.classList.add('ko');
    });
  } else if(ex.type==='match'){
    ex.rows.forEach(function(r,ri){var sel=$('match-'+ri);sel.value=r.correct;sel.classList.remove('ko');sel.classList.add('ok');});
  } else if(ex.type==='fill'){
    $('fill-1').value=ex.correct1;$('fill-2').value=ex.correct2;
    $('fill-1').classList.remove('ko');$('fill-1').classList.add('ok');
    $('fill-2').classList.remove('ko');$('fill-2').classList.add('ok');
  }
}
function disableAnswerZone(){
  document.querySelectorAll('#answer-zone input,#answer-zone select,#answer-zone button').forEach(function(el){el.disabled=true;});
}

function goToNext(){
  var lvl=LEVELS[curLevel];
  if(curEx<lvl.exercises.length-1){
    curEx++;
    renderExercise();
  } else if(curLevel<LEVELS.length-1){
    curLevel++;curEx=0;
    renderExercise();
  } else {
    showFinal();
  }
  window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
}

function showFinal(){
  updateTrack();
  $('lp2').className='level-pill done';
  $('main-zone').style.display='none';
  $('level-title').style.display='none';
  $('level-mission').style.display='none';
  $('final-screen').classList.add('show');
  window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
  $('final-title').focus();
}

renderExercise();
})();
</script>
