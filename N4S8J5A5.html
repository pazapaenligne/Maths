<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa 4e – Puissances – S8 J5 Niveau 2</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --day-color:#f5c518;--day-dark:#8a6000;--day-light:#fffbeb;--day-border:#f5e08a;
      --day-glow:rgba(245,197,24,.3);
      --bg:#fffdf7;--surface:#fff;--border:#e8e4d9;
      --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;
      --text:#1a1d23;--muted:#8a8f9a;--radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
      position:relative;overflow-x:hidden;letter-spacing:.03em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:260px;height:260px;background:var(--orange);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;
      background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;
      background:var(--green);top:200px;left:-30px;pointer-events:none;}
    /* HEAD */
    .head-card{width:100%;max-width:720px;background:var(--day-light);border:2px solid var(--day-border);
      border-radius:var(--radius);padding:1.9rem 1.5rem 1.4rem;text-align:center;
      position:relative;z-index:1;margin-bottom:1rem;}
    .logo-badge{background:var(--yellow);color:#000;font-size:14px;letter-spacing:.09em;
      display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;
      padding:.35rem 1.1rem;border-radius:99px;margin-bottom:.6rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{color:var(--day-dark);font-size:.88rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;color:var(--text);margin:.3rem 0;}
    .head-card h1 .hl{color:var(--day-dark);}
    .subtitle{color:var(--muted);font-size:.9rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}
    .level-row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;
      letter-spacing:.06em;text-transform:uppercase;padding:.65rem 1.35rem;border-radius:12px;
      border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);
      min-height:2.9rem;display:inline-flex;align-items:center;}
    .level-btn.active{background:var(--day-color);color:#000;border-color:var(--day-color);
      box-shadow:0 3px 12px var(--day-glow);}
    /* STATS */
    .stats-card{width:100%;max-width:720px;background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:1.1rem;margin-bottom:1.5rem;
      box-shadow:0 4px 20px rgba(0,0,0,.05);position:relative;z-index:1;}
    .stats-row{display:flex;gap:.8rem;}
    .stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);
      border-radius:12px;padding:.9rem .5rem;text-align:center;}
    .stat-num{font-size:1.7rem;font-weight:800;color:var(--day-dark);
      font-family:'JetBrains Mono',monospace;line-height:1.1;}
    .stat-label{font-size:.86rem;color:var(--muted);margin-top:.25rem;}
    .prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:1rem;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));
      border-radius:99px;transition:width .5s ease;}
    .prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;
      color:var(--muted);margin-top:.6rem;}
    /* CARDS */
    .cards-wrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:1.2rem;
      position:relative;z-index:1;}
    .card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
      padding:1.5rem 1.5rem 1.2rem;position:relative;
      box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .35s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:linear-gradient(90deg,var(--day-color),var(--orange),var(--green));}
    .q-label{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
      margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.1em;}
    .q-expr{font-size:1.15rem;font-weight:700;color:var(--text);margin:.6rem 0 .8rem;
      display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;}
    /* FRACTIONS */
    .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;}
    .frac .fn{border-bottom:2px solid currentColor;padding:0 6px;display:block;text-align:center;font-weight:700;}
    .frac .fd{padding:0 6px;display:block;text-align:center;font-weight:700;}
    sup{font-size:.65em;vertical-align:super;line-height:0;}
    /* INPUT */
    .aw{display:flex;align-items:center;gap:.7rem;margin:.5rem 0;flex-wrap:wrap;}
    .ai{border:2px solid var(--day-border);border-radius:10px;padding:.6rem .85rem;
      font-size:1rem;font-family:'JetBrains Mono',monospace;font-weight:700;
      outline:none;transition:border-color .2s;width:120px;text-align:center;}
    .ai:focus{border-color:var(--day-color);}
    .ai.ok{border-color:var(--green);background:#eef7e9;color:#2f6e10;}
    .ai.ko{border-color:var(--pink);background:#fdeeee;color:#c0392b;}
    /* BOUTONS */
    .btn-row{display:flex;gap:.6rem;margin-top:.9rem;flex-wrap:wrap;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
      padding:.68rem 1.25rem;border-radius:10px;font-family:Arial,sans-serif;
      font-size:clamp(.92rem,2.5vw,1rem);font-weight:800;cursor:pointer;border:none;
      transition:transform .12s;min-height:2.9rem;flex:1;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-v{background:var(--day-color);color:#000;box-shadow:0 3px 10px var(--day-glow);}
    .btn-i{background:var(--day-color);color:#000;box-shadow:0 3px 10px var(--day-glow);}
    /* HINT */
    .hint-box{margin-top:.65rem;background:#fffbeb;border:1.5px dashed var(--yellow);
      border-radius:10px;padding:.7rem 1rem;font-size:.93rem;color:var(--day-dark);
      display:none;line-height:1.75;}
    .hint-box.show{display:block;}
    /* FEEDBACK */
    .fb{margin-top:.7rem;padding:.7rem 1rem;border-radius:10px;font-size:.93rem;
      line-height:1.85;display:none;}
    .fb.show{display:block;}
    .fb.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    /* CORRECTION STEPS */
    .corr-step{margin:.35rem 0;padding-left:.8rem;border-left:3px solid var(--day-border);}
    .corr-arrow{color:var(--day-dark);font-weight:700;margin:0 .3rem;}
    /* RÉSULTATS */
    .results-wrap{width:100%;max-width:720px;display:none;position:relative;z-index:1;margin-top:1.5rem;}
    .results-wrap.show{display:block;}
    .res-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
      padding:2.2rem 2rem;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .res-score{font-size:3.5rem;font-weight:800;color:var(--day-color);margin:.4rem 0;}
    .res-msg{color:var(--muted);font-size:1rem;margin-bottom:1.2rem;line-height:1.7;}
    .btn-restart{background:var(--surface);color:var(--day-dark);border:2px solid var(--day-border);
      border-radius:10px;padding:.7rem 1.8rem;font-size:1rem;font-weight:800;cursor:pointer;
      display:inline-flex;align-items:center;gap:.4rem;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:480px){.btn-row{flex-direction:column;}.btn{width:100%;}}
  </style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>

<div class="head-card">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    PAZAPA &middot; MATHS &middot; 4&Egrave;ME
  </div>
  <div class="week-label">Semaine&nbsp;8 &ndash; Jour&nbsp;5 &mdash; Je m&rsquo;entra&icirc;ne &mdash; Niveau&nbsp;2</div>
  <h1><span class="hl">Calculer avec des puissances d&rsquo;un nombre quelconque et notation scientifique</span></h1>
  <p class="subtitle">6 exercices &middot; Propri&eacute;t&eacute;s des puissances</p>
  <div class="level-row">
    <span class="level-btn">Niveau&nbsp;1</span>
    <span class="level-btn active">Niveau&nbsp;2</span>
    <span class="level-btn">Niveau&nbsp;3</span>
  </div>
</div>

<div class="stats-card">
  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="st-ok">0</div><div class="stat-label">R&eacute;ussies</div></div>
    <div class="stat-box"><div class="stat-num" id="st-rem">6</div><div class="stat-label">Restantes</div></div>
    <div class="stat-box"><div class="stat-num" id="st-err">0</div><div class="stat-label">&Eacute;chou&eacute;es</div></div>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
  <div class="prog-text" id="prog-text">0 / 6</div>
</div>

<div class="cards-wrap" id="cards"></div>

<div class="results-wrap" id="results">
  <div class="res-card">
    <div style="font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;">R&eacute;sultat</div>
    <div class="res-score" id="res-score"></div>
    <p class="res-msg" id="res-msg"></p>
    <button class="btn-restart" onclick="restart()">&#8635; Recommencer</button>
  </div>
</div>

<script>
/* ══ UTILITAIRES ══ */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
function simplify(n,d){if(d===0)return null;if(d<0){n=-n;d=-d;}var g=gcd(Math.abs(n),Math.abs(d));return{n:n/g,d:d/g};}
function eqFrac(an,ad,bn,bd){var a=simplify(an,ad),b=simplify(bn,bd);if(!a||!b)return false;return a.n===b.n&&a.d===b.d;}
function sup(n){return '<sup>'+n+'</sup>';}
function frac(n,d){return '<span class="frac"><span class="fn">'+n+'</span><span class="fd">'+d+'</span></span>';}
function hF(n,d){return '<span class="frac"><span class="fn">'+n+'</span><span class="fd">'+d+'</span></span>';}
function $(id){return document.getElementById(id);}

/* Normalisation de la saisie pour comparaison de forme textuelle */
function normPow(raw){
  return (raw||'').trim()
    /* espaces */
    .replace(/\s+/g,'')
    /* signe moins Unicode → ASCII */
    .replace(/\u2212/g,'-')
    /* exposants Unicode → ^n */
    .replace(/\u00b2/g,'^2')  /* ² */
    .replace(/\u00b3/g,'^3')  /* ³ */
    .replace(/\u2074/g,'^4')  /* ⁴ */
    .replace(/\u2076/g,'^6')  /* ⁶ */
    .replace(/\u2079/g,'^9')  /* ⁹ */
    .toLowerCase();
}

/* Validation : comparaison de forme textuelle uniquement (pas de valeur numérique) */
function validate(raw,accepted){
  var n=normPow(raw);
  if(!n)return'empty';
  for(var i=0;i<accepted.length;i++){
    if(n===normPow(accepted[i]))return'ok';
  }
  return'wrong';
}

/* ══ DONNÉES ══ */
var TOTAL=6;
var ST=[];for(var k=0;k<TOTAL;k++)ST.push({done:false,ok:false,err:false});

var QS=[

  /* ── Ex1 : Utiliser la notation puissance (3C10-3) ── */
  {id:0,lbl:'1',
   consigne:'Utiliser la notation puissance.',
   subs:[
     {lbl:'1.', expr:'3'+sup('−2'),
      desc:'&Eacute;cris avec des &times;, sans utiliser la notation puissance.',
      forms:['1/(3×3)','1/(3*3)','1/(3x3)'], answerText:'1/(3×3)',
      corr:'3'+sup('−2')+'='+frac('1','3'+sup(2))+'='+frac('1','3&times;3')+'=<strong>'+frac('1','9')+'</strong>'},
     {lbl:'2.', expr:'&minus;(&minus;7)&times;(&minus;7)',
      desc:'Simplifie en utilisant la notation puissance.',
      forms:['-(−7)^2','-(-7)^2','−(−7)²','-(−7)²'], answerText:'-(-7)^2',
      corr:'&minus;(&minus;7)&times;(&minus;7)=<strong>&minus;(&minus;7)'+sup(2)+'</strong>'},
     {lbl:'3.', expr:'(&minus;10)&times;(&minus;10)&times;(&minus;10)&times;(&minus;10)',
      desc:'Simplifie en utilisant la notation puissance.',
      forms:['(-10)^4','(−10)^4','(-10)⁴','(−10)⁴'], answerText:'(-10)^4',
      corr:'(&minus;10)&times;(&minus;10)&times;(&minus;10)&times;(&minus;10)=<strong>(&minus;10)'+sup(4)+'</strong>'},
     {lbl:'4.', expr:'&minus;4'+sup('−2'),
      desc:'&Eacute;cris avec des &times;, sans utiliser la notation puissance.',
      forms:['-1/(4×4)','-1/(4*4)','-1/(4x4)'], answerText:'-1/(4×4)',
      corr:'&minus;4'+sup('−2')+'=&minus;'+frac('1','4'+sup(2))+'=&minus;'+frac('1','4&times;4')+'=<strong>&minus;'+frac('1','16')+'</strong>'},
   ],
   hint:'Pour un exposant négatif : a⁻ⁿ='+frac('1','aⁿ')+'. Pour simplifier : compte le nombre de facteurs identiques.'
  },

  /* ── Ex2 : Utiliser la notation puissance (3C10-3) ── */
  {id:1,lbl:'2',
   consigne:'Utiliser la notation puissance.',
   subs:[
     {lbl:'1.', expr:'&minus;(&minus;10)'+sup('−3'),
      desc:'&Eacute;cris avec des &times;, sans utiliser la notation puissance.',
      forms:['-1/((-10)×(-10)×(-10))','-1/((-10)*(-10)*(-10))'],
      answerText:'-1/((-10)×(-10)×(-10))',
      corr:'&minus;(&minus;10)'+sup('−3')+'=&minus;'+frac('1','(&minus;10)'+sup(3))+'=&minus;'+frac('1','(&minus;10)&times;(&minus;10)&times;(&minus;10)')+'=<strong>'+frac('1','1000')+'</strong>'},
     {lbl:'2.', expr:'9&times;9',
      desc:'Simplifie.',
      forms:['9^2','9²'], answerText:'9^2',
      corr:'9&times;9=<strong>9'+sup(2)+'</strong>'},
     {lbl:'3.', expr:'5'+sup(2),
      desc:'&Eacute;cris avec des &times;.',
      forms:['5×5','5*5','5x5'], answerText:'5×5',
      corr:'5'+sup(2)+'=<strong>5&times;5</strong>'},
     {lbl:'4.', expr:'&minus;'+frac('1','(&minus;10)&times;(&minus;10)&times;(&minus;10)&times;(&minus;10)&times;(&minus;10)&times;(&minus;10)&times;(&minus;10)'),
      desc:'Simplifie en utilisant la notation puissance.',
      forms:['-((-10)^-7)','-(-10)^-7','-((-10)^−7)','-(-10)^−7'], answerText:'-(-10)^-7',
      corr:'&minus;'+frac('1','(&minus;10)'+sup(7))+'=<strong>&minus;(&minus;10)'+sup('−7')+'</strong>'},
   ],
   hint:'Pour a⁻ⁿ : exposant négatif = inverse. Pour simplifier un produit : compte les facteurs.'
  },

  /* ── Ex3 : Écrire sous la forme aⁿ — 7 questions (3C10-2) ── */
  {id:2,lbl:'3',
   consigne:'&Eacute;cris sous la forme aⁿ.',
   subs:[
     {lbl:'A', expr2:hF('(&minus;2)'+sup(4),'(&minus;2)'+sup(2)),
      forms:['2^2','2²'], answerText:'2^2',
      corr:'(&minus;2)'+sup(4)+'÷(&minus;2)'+sup(2)+'=(&minus;2)'+sup('4−2')+'=(&minus;2)'+sup(2)+'=<strong>2'+sup(2)+'</strong>'},
     {lbl:'B', expr:'((&minus;3)'+sup(3)+')'+sup(3),
      forms:['(-3)^9','(−3)^9','(-3)⁹','(−3)⁹'], answerText:'(-3)^9',
      corr:'(aᵐ)ⁿ=aᵐ×ⁿ : ((&minus;3)'+sup(3)+')'+sup(3)+'=(&minus;3)'+sup('3×3')+'=<strong>(&minus;3)'+sup(9)+'</strong>'},
     {lbl:'C', expr:'(6'+sup(3)+')'+sup(2),
      forms:['6^6','6⁶'], answerText:'6^6',
      corr:'(aᵐ)ⁿ=aᵐ×ⁿ : (6'+sup(3)+')'+sup(2)+'=6'+sup('3×2')+'=<strong>6'+sup(6)+'</strong>'},
     {lbl:'D', expr2:hF('(&minus;8)'+sup(2),'(&minus;2)'+sup(2)),
      forms:['4^2','4²'], answerText:'4^2',
      corr:'(&minus;8)'+sup(2)+'÷(&minus;2)'+sup(2)+'=('+frac('&minus;8','&minus;2')+')'+sup(2)+'=<strong>4'+sup(2)+'</strong>'},
     {lbl:'E', expr:'(&minus;8)'+sup(3)+'&times;3'+sup(3),
      forms:['(-24)^3','(−24)^3','(-24)³','(−24)³'], answerText:'(-24)^3',
      corr:'(&minus;8)'+sup(3)+'×3'+sup(3)+'=((&minus;8)×3)'+sup(3)+'=<strong>(&minus;24)'+sup(3)+'</strong>'},
     {lbl:'F', expr2:hF('9'+sup(5),'9'+sup(3)),
      forms:['9^2','9²'], answerText:'9^2',
      corr:'aᵐ÷aⁿ=aᵐ⁻ⁿ : 9'+sup(5)+'÷9'+sup(3)+'=9'+sup('5−3')+'=<strong>9'+sup(2)+'</strong>'},
     {lbl:'G', expr:'(&minus;6)'+sup(4)+'&times;(&minus;6)'+sup(3),
      forms:['(-6)^7','(−6)^7','(-6)⁷','(−6)⁷'], answerText:'(-6)^7',
      corr:'aᵐ×aⁿ=aᵐ⁺ⁿ : (&minus;6)'+sup(4)+'×(&minus;6)'+sup(3)+'=(&minus;6)'+sup('4+3')+'=<strong>(&minus;6)'+sup(7)+'</strong>'},
   ],
   hint:'Quotient (aᵐ÷aⁿ=aᵐ⁻ⁿ), puissance de puissance (aᵐ)ⁿ=aᵐ×ⁿ, produit (aⁿ×bⁿ=(a×b)ⁿ, aᵐ×aⁿ=aᵐ⁺ⁿ).'
  },

  /* ── Ex4 : Écrire sous la forme aⁿ — 5 questions (3C10-2) ── */
  {id:3,lbl:'4',
   consigne:'&Eacute;cris sous la forme aⁿ.',
   subs:[
     {lbl:'A', expr:'7'+sup(4)+'&times;3'+sup(4),
      forms:['21^4','21⁴'], answerText:'21^4',
      corr:'aⁿ×bⁿ=(a×b)ⁿ : 7'+sup(4)+'×3'+sup(4)+'=(7×3)'+sup(4)+'=<strong>21'+sup(4)+'</strong>'},
     {lbl:'B', expr2:hF('7'+sup(5),'7'+sup(2)),
      forms:['7^3','7³'], answerText:'7^3',
      corr:'aᵐ÷aⁿ=aᵐ⁻ⁿ : 7'+sup(5)+'÷7'+sup(2)+'=7'+sup('5−2')+'=<strong>7'+sup(3)+'</strong>'},
     {lbl:'C', expr:'3'+sup(4)+'&times;3'+sup(2),
      forms:['3^6','3⁶'], answerText:'3^6',
      corr:'aᵐ×aⁿ=aᵐ⁺ⁿ : 3'+sup(4)+'×3'+sup(2)+'=3'+sup('4+2')+'=<strong>3'+sup(6)+'</strong>'},
     {lbl:'D', expr:'(3'+sup(2)+')'+sup(3),
      forms:['3^6','3⁶'], answerText:'3^6',
      corr:'(aᵐ)ⁿ=aᵐ×ⁿ : (3'+sup(2)+')'+sup(3)+'=3'+sup('2×3')+'=<strong>3'+sup(6)+'</strong>'},
     {lbl:'E', expr:'5'+sup(3)+'&times;2'+sup(3),
      forms:['10^3','10³'], answerText:'10^3',
      corr:'aⁿ×bⁿ=(a×b)ⁿ : 5'+sup(3)+'×2'+sup(3)+'=(5×2)'+sup(3)+'=<strong>10'+sup(3)+'</strong>'},
   ],
   hint:'Identifie la propriété : même base ou même exposant ?'
  },

  /* ── Ex5 : Écrire sous la forme aⁿ — 5 questions (3C10-2) ── */
  {id:4,lbl:'5',
   consigne:'&Eacute;cris sous la forme aⁿ.',
   subs:[
     {lbl:'A', expr:'3'+sup(4)+'&times;3'+sup(2),
      forms:['3^6','3⁶'], answerText:'3^6',
      corr:'aᵐ×aⁿ=aᵐ⁺ⁿ : 3'+sup(4)+'×3'+sup(2)+'=3'+sup('4+2')+'=<strong>3'+sup(6)+'</strong>'},
     {lbl:'B', expr:'(4'+sup(3)+')'+sup(2),
      forms:['4^6','4⁶'], answerText:'4^6',
      corr:'(aᵐ)ⁿ=aᵐ×ⁿ : (4'+sup(3)+')'+sup(2)+'=4'+sup('3×2')+'=<strong>4'+sup(6)+'</strong>'},
     {lbl:'C', expr:'5'+sup(3)+'&times;3'+sup(3),
      forms:['15^3','15³'], answerText:'15^3',
      corr:'aⁿ×bⁿ=(a×b)ⁿ : 5'+sup(3)+'×3'+sup(3)+'=(5×3)'+sup(3)+'=<strong>15'+sup(3)+'</strong>'},
     {lbl:'D', expr2:hF('3'+sup(5),'3'+sup(2)),
      forms:['3^3','3³'], answerText:'3^3',
      corr:'aᵐ÷aⁿ=aᵐ⁻ⁿ : 3'+sup(5)+'÷3'+sup(2)+'=3'+sup('5−2')+'=<strong>3'+sup(3)+'</strong>'},
     {lbl:'E', expr:'2'+sup(4)+'&times;2'+sup(5),
      forms:['2^9','2⁹'], answerText:'2^9',
      corr:'aᵐ×aⁿ=aᵐ⁺ⁿ : 2'+sup(4)+'×2'+sup(5)+'=2'+sup('4+5')+'=<strong>2'+sup(9)+'</strong>'},
   ],
   hint:'Identifie la propriété : même base ou même exposant ?'
  },

  /* ── Ex6 : Entier ou fraction (3C10-3) ── */
  {id:5,lbl:'6',
   consigne:'Donne l’écriture des nombres suivants sous la forme d’un nombre entier ou d’une fraction, sans exposant et sans ×.',
   subs:[
     {lbl:'1.', expr:'7'+sup('−2'),
      forms:['1/49'], answerText:'1/49',
      corr:'7'+sup('−2')+'='+frac('1','7'+sup(2))+'='+frac('1','7&times;7')+'=<strong>'+frac('1','49')+'</strong>'},
     {lbl:'2.', expr:'3'+sup(4),
      forms:['81'], answerText:'81',
      corr:'3'+sup(4)+'=3&times;3&times;3&times;3=<strong>81</strong>'},
     {lbl:'3.', expr:'6'+sup(2),
      forms:['36'], answerText:'36',
      corr:'6'+sup(2)+'=6&times;6=<strong>36</strong>'},
     {lbl:'4.', expr:'2'+sup('−4'),
      forms:['1/16','1/(16)'], answerText:'1/16',
      corr:'2'+sup('−4')+'='+frac('1','2'+sup(4))+'='+frac('1','2&times;2&times;2&times;2')+'=<strong>'+frac('1','16')+'</strong>'},
   ],
   hint:'Pour a⁻ⁿ : exposant négatif = inverse de la puissance positive.'
  },
];

/* ══ CONSTRUCTION ══ */
function buildCards(){
  var h='';
  QS.forEach(function(q){
    var subsH='';
    q.subs.forEach(function(s,j){
      var e=s.expr2||s.expr||'';
      var desc=s.desc?'<div style="font-size:.93rem;color:var(--text);font-weight:600;margin:.1rem 0 .3rem 0;">'+s.desc+'</div>':'';
      subsH+='<div style="margin:.75rem 0;">'
        +'<span style="font-family:\'JetBrains Mono\',monospace;font-weight:700;color:var(--day-dark);">'+s.lbl+'</span> '
        +desc
        +'<div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.25rem;">'
        +'<span style="font-size:1.05rem;font-weight:700;">'+e+(e?' =':'')+'</span>'
        +'<input class="ai" id="inp'+q.id+'_'+j+'" type="text" autocomplete="off" '
        +'onkeydown="if(event.key===\'Enter\')checkMulti('+q.id+')" />'
        +'</div>'
        +'</div>';
    });
    h+='<div class="card" id="c'+q.id+'">'
      +'<div class="card-stripe"></div>'
      +'<div class="q-label">Exercice '+q.lbl+'</div>'
      +'<div style="font-size:.93rem;color:var(--muted);margin:.3rem 0 .8rem;line-height:1.6;">'+q.consigne+'</div>'
      +subsH
      +'<div class="btn-row">'
      +'<button class="btn btn-v" id="vb'+q.id+'" onclick="checkMulti('+q.id+')">✓ Vérifier</button>'
      +'<button class="btn btn-i" onclick="toggleHint(\'hx'+q.id+'\')">&#x1F4A1; Indice</button>'
      +'</div>'
      +'<div class="hint-box" id="hx'+q.id+'">'+q.hint+'</div>'
      +'<div class="fb" id="fb'+q.id+'"></div>'
      +'</div>';
  });
  $('cards').innerHTML=h;
  update();
}

function toggleHint(id){$(id).classList.toggle('show');}

/* ══ VALIDATION ══ */
function checkMulti(id){
  if(ST[id].done)return;
  var q=QS[id];
  var allOk=true, hasWrong=false;
  q.subs.forEach(function(s,j){
    var raw=($('inp'+id+'_'+j).value||'').trim();
    if(!raw){hasWrong=true;allOk=false;return;}
    var res=validate(raw,s.forms);
    if(res==='ok') $('inp'+id+'_'+j).className='ai ok';
    else{$('inp'+id+'_'+j).className='ai ko';allOk=false;hasWrong=true;}
  });
  var corrH=q.subs.map(function(s){
    return '<div style="margin:.3rem 0 .3rem .5rem;"><strong>'+s.lbl+'</strong> '+s.corr+'</div>';
  }).join('');
  if(allOk){
    ST[id].done=true;ST[id].ok=true;
    q.subs.forEach(function(s,j){$('inp'+id+'_'+j).disabled=true;});
    $('vb'+id).disabled=true;
    showFb(id,'ok','✓ Bravo !<br>'+corrH);
  } else if(!ST[id].err){
    ST[id].err=true;
    $('vb'+id).innerHTML='↻ Réessayer';
    $('hx'+id).classList.add('show');
    showFb(id,'ko','✗ Certaines réponses sont incorrectes. Vérifie et réessaie.');
  } else {
    ST[id].done=true;ST[id].ok=false;
    q.subs.forEach(function(s,j){
      if(validate(($('inp'+id+'_'+j).value||'').trim(),s.forms)!=='ok')
        $('inp'+id+'_'+j).value=s.answerText;
      $('inp'+id+'_'+j).disabled=true;
    });
    $('vb'+id).disabled=true;
    showFb(id,'ko','✗ Correction :<br>'+corrH);
  }
  update();
}

function check(id){
  if(ST[id].done)return;
  var q=QS[id];
  var raw=($('inp'+id).value||'').trim();
  if(!raw){showFb(id,'ko','\u26a0\ufe0f Saisis ta r\u00e9ponse avant de valider.');return;}
  var res=validate(raw,q.accepted);
  if(res==='ok'){
    ST[id].done=true;ST[id].ok=true;
    $('inp'+id).className='ai ok';$('inp'+id).disabled=true;
    $('vb'+id).disabled=true;
    showFb(id,'ok','\u2713 Bravo\u00a0!<br>'+q.corr);
  } else if(res==='unsimplified'){
    $('inp'+id).className='ai ko';
    showFb(id,'ko','Ton r\u00e9sultat est correct mais pas encore simplifi\u00e9 au maximum.');
  } else if(res==='neg-denom'){
    $('inp'+id).className='ai ko';
    showFb(id,'ko','Le d\u00e9nominateur doit \u00eatre positif.');
  } else if(!ST[id].err){
    ST[id].err=true;
    $('inp'+id).className='ai ko';
    $('vb'+id).innerHTML='\u21bb R\u00e9essayer';
    showFb(id,'ko','\u2717 Pas tout \u00e0 fait. V\u00e9rifie ton calcul et r\u00e9essaie.');
    $('hx'+id).classList.add('show');
  } else {
    ST[id].done=true;ST[id].ok=false;
    $('inp'+id).value=q.answerText;
    $('inp'+id).className='ai ko';$('inp'+id).disabled=true;
    $('vb'+id).disabled=true;
    showFb(id,'ko','\u2717 Correction\u00a0:<br>'+q.corr);
  }
  update();
}

function showFb(id,t,msg){
  var fb=$('fb'+id);
  fb.className='fb show '+(t==='ok'?'ok':'ko');
  fb.innerHTML=msg;
}

/* ══ STATS ══ */
function update(){
  var done=0,ok=0;
  for(var i=0;i<TOTAL;i++){if(ST[i].done){done++;if(ST[i].ok)ok++;}}
  $('st-ok').textContent=ok;
  $('st-err').textContent=done-ok;
  $('st-rem').textContent=TOTAL-done;
  $('pfill').style.width=Math.round(done/TOTAL*100)+'%';
  $('prog-text').textContent=done+' / '+TOTAL;
  if(done===TOTAL)showRes(ok);
}

function showRes(ok){
  $('results').className='results-wrap show';
  $('res-score').textContent=ok+' / '+TOTAL;
  $('res-msg').textContent=ok===TOTAL?'Excellent\u00a0! Tu ma\u00eetrises les propri\u00e9t\u00e9s des puissances.':
    ok>=5?'Tr\u00e8s bien\u00a0! Relis les corrections pour consolider.':
    ok>=3?'Bien\u00a0! Continue \u00e0 t\u2019entra\u00eener.':
    '\u00c0 retravailler. Relis chaque correction attentivement.';
}

/* ══ RECOMMENCER ══ */
function restart(){
  for(var i=0;i<TOTAL;i++)ST[i]={done:false,ok:false,err:false};
  $('results').className='results-wrap';
  buildCards();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildCards();
</script>
