<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Calcul littéral Niveau 3 (S3 J1)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f5a623;--day-dark:#a8660b;--day-title:#a8660b;--day-light:#fff2dc;--day-border:#f5c98a;--badge-txt:#ffffff;--day-glow:rgba(245,166,35,.22);
  --bg:#fffdf7;--surface:#ffffff;--border:#eedad7;--green:#5fa800;--green-soft:#8dc63f;--pink:#f28b82;--red:#d33;
  --text:#1a1d23;--muted:#7a7568;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 3rem;overflow-x:hidden;line-height:1.7;-webkit-tap-highlight-color:transparent;}
.frame{position:relative;overflow:hidden;max-width:760px;margin:0 auto;background:var(--bg);}

/* Bulles : jaune haut-droite / jour bas-gauche / vert bas-droite / rose haut-gauche */
.bubble{position:absolute;border-radius:50%;pointer-events:none;}
.b1{width:260px;height:260px;top:-70px;right:-70px;background:#f5e04a;opacity:.38;}
.b2{width:210px;height:210px;bottom:160px;left:-75px;background:var(--day);opacity:.45;}
.b3{width:150px;height:150px;bottom:-40px;right:-45px;background:#8dc63f;opacity:.38;}
.b4{width:180px;height:180px;top:-60px;left:-60px;background:#f28b82;opacity:.32;}

.layer{position:relative;z-index:1;}
.hero{background:transparent;padding:2rem 1.25rem 1.4rem;text-align:center;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--day);color:var(--badge-txt);font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.4rem 1.1rem;border-radius:99px;margin-bottom:.8rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);letter-spacing:.14em;margin-bottom:.5rem;}
.hero h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.4rem,5.5vw,2rem);font-weight:900;line-height:1.18;color:var(--text);}
.hero h1 .hl{color:var(--day-title);}
.hero .subtitle{color:var(--muted);font-size:.92rem;margin-top:.5rem;font-family:'JetBrains Mono',monospace;}

.gamebox{max-width:760px;margin:1.1rem auto 0;padding:0 1.25rem;}
.scoreboard-sticky{position:sticky;top:0;z-index:5;}
.gb-inner{background:var(--surface);border:2px solid var(--day-border);border-radius:14px;padding:1rem;box-shadow:0 4px 16px var(--day-glow);}
.gb-label{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.16em;color:var(--day-dark);text-align:center;margin-bottom:.6rem;text-transform:uppercase;}
.scoreboard{display:flex;gap:.5rem;margin-bottom:.75rem;}
.sb{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:.5rem .3rem;text-align:center;}
.sb .v{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:clamp(1.9rem,7vw,2.4rem);line-height:1;}
.sb .l{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.1em;color:var(--muted);margin-top:.2rem;text-transform:uppercase;}
.sb.ok{border-color:#c7e89a;} .sb.ok .v{color:var(--green);}
.sb.rem{border-color:var(--day-border);} .sb.rem .v{color:var(--day-dark);}
.sb.err{border-color:#f4c4bf;} .sb.err .v{color:var(--red);}
.xp-bg{background:var(--border);border-radius:99px;height:12px;overflow:hidden;}
.xp-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--day-border));transition:width .6s ease;}
.xp-txt{font-family:'JetBrains Mono',monospace;font-size:.64rem;color:var(--day-dark);text-align:right;margin-top:.28rem;letter-spacing:.08em;}

.main{max-width:760px;margin:0 auto;padding:1.2rem 1.25rem 0;}
.card{background:var(--surface);border:2px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.3rem;box-shadow:0 4px 18px rgba(0,0,0,.06);}
.card-stripe{height:5px;background:linear-gradient(90deg,#f5a623,#f28b82,#8dc63f,#3ab5d8,#f5c518);}
.card-inner{padding:1.4rem 1.2rem;}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:.9rem;flex-wrap:wrap;}
.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:900;flex-shrink:0;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.q-cat{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;padding:.2rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;margin-left:auto;white-space:nowrap;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.85rem 1.1rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1.05rem,3.8vw,1.35rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.55;}
.q-text{font-size:.95rem;color:var(--text);margin-bottom:.9rem;line-height:1.75;}
.q-text b{color:var(--day-dark);}
.input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.6rem;}
.input-label{font-family:'JetBrains Mono',monospace;font-size:.95rem;font-weight:700;color:var(--text);}
.answer-input{width:130px;background:#fff;border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:.55rem .7rem;outline:none;transition:border-color .2s;min-height:2.7rem;text-align:center;}
.answer-input:focus{border-color:var(--day);box-shadow:0 0 0 3px var(--day-glow);}
.answer-input.correct-input{border-color:var(--green-soft);background:#f0faeb;}
.answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.3rem;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:800;letter-spacing:.04em;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:2.8rem;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);} .btn:disabled{opacity:.4;cursor:default;}
.btn-check{background:var(--green);color:#fff;}
.btn-check:hover:not(:disabled){box-shadow:0 4px 14px rgba(95,168,0,.4);}
.btn-hint{background:#fff;border:2px solid var(--day);color:var(--day-dark);}
.btn-hint:hover{background:var(--day-light);}
.btn-retry{background:#fff;border:2px solid var(--day-dark);color:var(--day-dark);}
.btn-retry:hover{background:var(--day-light);}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem;}
.hint-box{margin-top:.9rem;background:var(--day-light);border:1.5px dashed var(--day-dark);border-radius:10px;padding:.7rem 1rem;font-size:.84rem;color:var(--day-dark);display:none;line-height:1.75;font-family:'JetBrains Mono',monospace;}
.hint-box.show{display:block;}
.fb{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;font-size:.88rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
.fb.show{display:flex;}
.fb.ok{background:#f0faeb;border:1.5px solid var(--green-soft);color:#3a7d0a;}
.fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
.fb-icon{font-size:1.35rem;flex-shrink:0;}
.fb-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.7;}

.results{display:none;}.results.show{display:block;}
.results-card{background:var(--surface);border:2px solid var(--day-border);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px var(--day-glow);margin-bottom:1.3rem;}
.results-inner{padding:2rem 1.3rem;text-align:center;}
.results-trophy{font-size:3.2rem;animation:bounce 3s infinite;display:block;margin-bottom:.3rem;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-7px) rotate(5deg);}}
.results-score{font-family:'JetBrains Mono',monospace;font-size:clamp(2.6rem,11vw,4rem);font-weight:900;line-height:1;margin:.3rem 0 .2rem;}
.results-score .s-num{color:var(--green);}
.stars-row{font-size:1.9rem;margin:.3rem 0 .9rem;letter-spacing:.15rem;}
.results-msg{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:.95rem;margin-bottom:1.4rem;}
.restart-wrap{max-width:760px;margin:0 auto;padding:0 1.25rem;text-align:center;}
.btn-restart{background:var(--day);color:#fff;font-size:.92rem;padding:.85rem 2rem;}
.btn-restart:hover{background:var(--day-dark);}
footer{text-align:center;margin-top:2rem;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.06em;}

@media(max-width:560px){.scoreboard{gap:.3rem;}.sb .v{font-size:1.85rem;}}
@media(max-width:480px){.hero{padding:1.5rem 1rem 1.2rem;}.main,.gamebox,.restart-wrap{padding:0 1rem;}.card-inner{padding:1.2rem 1rem;}.btn-row{flex-direction:column;}.btn-check,.btn-hint,.btn-retry{width:100%;}}
</style>
</head>
<body>
<div class="frame">
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="layer">

    <div class="hero">
      <div class="logo-badge">
        <span class="logo-dot" style="background:#f5a623"></span>
        <span class="logo-dot" style="background:#f5c98a"></span>
        <span class="logo-dot" style="background:#a8660b"></span>
        Pazapa &middot; Maths &middot; 3&egrave;me
      </div>
      <div class="week-label">SEMAINE 3 &mdash; JOUR 1</div>
      <h1><span class="hl">Calcul litt&eacute;ral</span><br>S&eacute;rie d&apos;exercices &mdash; Niveau&nbsp;3 Expert</h1>
      <p class="subtitle">Double distributivit&eacute; &middot; Identit&eacute;s remarquables</p>
    </div>

    <div class="gamebox scoreboard-sticky">
      <div class="gb-inner">
        <div class="gb-label">&#9654; Calcul litt&eacute;ral &middot; Niveau 3 Expert &middot; S3 J1</div>
        <div class="scoreboard">
          <div class="sb ok"><div class="v" id="h-ok">0</div><div class="l">R&eacute;ussies</div></div>
          <div class="sb rem"><div class="v" id="h-rem">4</div><div class="l">Restantes</div></div>
          <div class="sb err"><div class="v" id="h-ko">0</div><div class="l">Erreurs</div></div>
        </div>
        <div class="xp-bg"><div class="xp-fill" id="bar"></div></div>
        <div class="xp-txt" id="prog">0 / 4</div>
      </div>
    </div>

    <div class="main">
      <div id="cards"></div>

      <div class="results" id="results-screen">
        <div class="results-card">
          <div class="card-stripe"></div>
          <div class="results-inner">
            <span class="results-trophy">&#127942;</span>
            <div class="results-score"><span class="s-num" id="score-num">0</span>/<span id="score-tot">4</span></div>
            <div class="stars-row" id="stars-row"></div>
            <div class="results-msg" id="results-msg"></div>
          </div>
        </div>
      </div>

      <div class="restart-wrap">
        <button class="btn btn-restart" id="btn-restart" onclick="restart()" style="display:none;">&#8635; Recommencer</button>
      </div>

      <footer>S3 &middot; J1 &middot; Calcul litt&eacute;ral Niveau 3 &middot; Pazapa Maths 3&egrave;me</footer>
    </div>
  </div>
</div>

<script>
var TOTAL = 4;
var answers = [null, null, null, null];
var checked = [false, false, false, false];
var erreurs = [false, false, false, false];
var tentatives = [0, 0, 0, 0];

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function genExercises() {
  var exs = [];

  /* Exo 1 — Double distributivité (ax+b)(cx+d) */
  (function () {
    var a = pick([1, 2, 3]), c = pick([1, 2, 3]);
    var b = pick([-3, -2, 2, 3]), d = pick([-3, -2, 2, 3]);
    var coefX2 = a * c, coefX = a * d + b * c, cste = b * d;
    var inside1 = (a === 1 ? "x" : a + "x") + (b > 0 ? " + " + b : " \u2212 " + Math.abs(b));
    var inside2 = (c === 1 ? "x" : c + "x") + (d > 0 ? " + " + d : " \u2212 " + Math.abs(d));
    var cX2Str = "" + coefX2;
    var cXStr = (coefX >= 0 ? " + " + coefX : " \u2212 " + Math.abs(coefX));
    var cStr = (cste >= 0 ? " + " + cste : " \u2212 " + Math.abs(cste));
    exs.push({
      kind: "multi",
      cat: "Double distrib.",
      q: "D\u00e9veloppe et r\u00e9duis cette expression. Donne le coefficient de x\u00b2, celui de x, puis la constante.",
      eq: "(\u00a0" + inside1 + "\u00a0)(\u00a0" + inside2 + "\u00a0)",
      fields: [
        { label: "Coefficient de x\u00b2 =", ans: coefX2 },
        { label: "Coefficient de x =", ans: coefX },
        { label: "Constante =", ans: cste }
      ],
      method: "Double distributivit\u00e9\u00a0: (" + inside1 + ")(" + inside2 + ")<br>"
        + "= " + (a * c) + "x\u00b2 + (" + (a * d) + ")x + (" + (b * c) + ")x + (" + (b * d) + ")<br>"
        + "= <strong>" + cX2Str + "x\u00b2" + cXStr + "x" + cStr + "</strong>.",
      /* INDICE : m\u00e9thode g\u00e9n\u00e9rale, sans valeurs num\u00e9riques */
      hint: "Applique la double distributivit\u00e9\u00a0: chaque terme de la premi\u00e8re parenth\u00e8se multiplie chaque terme de la deuxi\u00e8me, ce qui donne 4 produits. Regroupe ensuite les termes en x."
    });
  })();

  /* Exo 2 — Identité remarquable (ax ± b)² */
  (function () {
    var a = pick([1, 2, 3]);
    var b = pick([2, 3, 4, 5]);
    var sign = pick([-1, 1]);
    var coefX2 = a * a;
    var coefX = 2 * a * sign * b;
    var cste = b * b;
    var inside = (a === 1 ? "x" : a + "x") + (sign > 0 ? " + " + b : " \u2212 " + b);
    var cXStr = (coefX >= 0 ? " + " + coefX : " \u2212 " + Math.abs(coefX));
    exs.push({
      kind: "multi",
      cat: "Identit\u00e9 remarquable",
      q: "D\u00e9veloppe ce carr\u00e9 en utilisant l\u2019identit\u00e9 remarquable (a" + (sign > 0 ? " + " : " \u2212 ") + "b)\u00b2 = a\u00b2" + (sign > 0 ? " + " : " \u2212 ") + "2ab + b\u00b2.<br>Donne le coefficient de x\u00b2, celui de x, puis la constante.",
      eq: "(\u00a0" + inside + "\u00a0)\u00b2",
      fields: [
        { label: "Coefficient de x\u00b2 =", ans: coefX2 },
        { label: "Coefficient de x =", ans: coefX },
        { label: "Constante =", ans: cste }
      ],
      method: "(" + inside + ")\u00b2 = (" + (a === 1 ? "x" : a + "x") + ")\u00b2 " + (sign > 0 ? "+" : "\u2212") + " 2\u00d7" + (a === 1 ? "x" : a + "x") + "\u00d7" + b + " + " + b + "\u00b2"
        + " = <strong>" + coefX2 + "x\u00b2" + cXStr + "x + " + cste + "</strong>.",
      /* INDICE : formule g\u00e9n\u00e9rale SANS d\u00e9signer a et b avec les valeurs de l\u2019exercice */
      hint: "Rappel de l\u2019identit\u00e9\u00a0: (A \u00b1 B)\u00b2 = A\u00b2 \u00b1 2AB + B\u00b2. Identifie ce qui joue le r\u00f4le de A et ce qui joue le r\u00f4le de B dans l\u2019expression, puis applique la formule."
    });
  })();

  /* Exo 3 — Identité remarquable (ax − b)(ax + b) = a²x² − b² */
  (function () {
    var a = pick([1, 2, 3]);
    var b = pick([2, 3, 4, 5]);
    var coefX2 = a * a;
    var cste = -(b * b);
    var inside1 = (a === 1 ? "x" : a + "x") + " \u2212 " + b;
    var inside2 = (a === 1 ? "x" : a + "x") + " + " + b;
    exs.push({
      kind: "multi",
      cat: "Identit\u00e9 remarquable",
      q: "D\u00e9veloppe en utilisant l\u2019identit\u00e9 remarquable (A \u2212 B)(A + B) = A\u00b2 \u2212 B\u00b2.<br>Donne le coefficient de x\u00b2 (le coefficient de x est 0), puis la constante.",
      eq: "(\u00a0" + inside1 + "\u00a0)(\u00a0" + inside2 + "\u00a0)",
      fields: [
        { label: "Coefficient de x\u00b2 =", ans: coefX2 },
        { label: "Constante =", ans: cste }
      ],
      method: "(" + inside1 + ")(" + inside2 + ") = (" + (a === 1 ? "x" : a + "x") + ")\u00b2 \u2212 " + b + "\u00b2 = <strong>" + coefX2 + "x\u00b2 \u2212 " + (b * b) + "</strong> (le terme en x dispara\u00eet).",
      /* INDICE : formule g\u00e9n\u00e9rale SANS d\u00e9signer a et b avec les valeurs de l\u2019exercice */
      hint: "Rappel de l\u2019identit\u00e9\u00a0: (A \u2212 B)(A + B) = A\u00b2 \u2212 B\u00b2. Identifie ce qui joue le r\u00f4le de A et ce qui joue le r\u00f4le de B. Le terme en x dispara\u00eet toujours avec cette identit\u00e9."
    });
  })();

  /* Exo 4 — D\u00e9fi DNB : d\u00e9velopper (ax+b)(k1x + k2) */
  (function () {
    var a = pick([2, 3]), b = pick([1, 2, 3]);
    var k1 = pick([2, 3, 4]), k2 = pick([1, 2, 3, 4]);
    var coefX2 = k1 * a;
    var coefX = k1 * b + k2 * a;
    var cste = k2 * b;
    var inside1 = a + "x + " + b;
    var inside2 = (k1 === 1 ? "x" : k1 + "x") + " + " + k2;
    exs.push({
      kind: "multi",
      cat: "D\u00e9fi DNB",
      q: "D\u00e9veloppe enti\u00e8rement cette expression. Donne le coefficient de x\u00b2, celui de x, puis la constante.",
      eq: "(\u00a0" + inside1 + "\u00a0)(\u00a0" + inside2 + "\u00a0)",
      fields: [
        { label: "Coefficient de x\u00b2 =", ans: coefX2 },
        { label: "Coefficient de x =", ans: coefX },
        { label: "Constante =", ans: cste }
      ],
      method: "(" + inside1 + ")(" + inside2 + ")<br>"
        + "= " + a + "x\u00d7" + (k1 === 1 ? "x" : k1 + "x") + " + " + a + "x\u00d7" + k2 + " + " + b + "\u00d7" + (k1 === 1 ? "x" : k1 + "x") + " + " + b + "\u00d7" + k2 + "<br>"
        + "= " + coefX2 + "x\u00b2 + " + (a * k2) + "x + " + (b * k1) + "x + " + cste
        + " = <strong>" + coefX2 + "x\u00b2 + " + coefX + "x + " + cste + "</strong>.",
      /* INDICE : m\u00e9thode g\u00e9n\u00e9rale, sans valeurs */
      hint: "Applique la double distributivit\u00e9\u00a0: chaque terme de la premi\u00e8re parenth\u00e8se multiplie chaque terme de la deuxi\u00e8me (4 produits au total). Regroupe les termes de m\u00eame degr\u00e9."
    });
  })();

  return exs;
}

var EXOS = genExercises();

function $(id) { return document.getElementById(id); }

function buildAll() {
  var host = $("cards");
  host.innerHTML = "";
  EXOS.forEach(function (ex, i) {
    var card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + i;
    var inner = '<div class="card-stripe"></div><div class="card-inner">'
      + '<div class="q-header"><div class="step-num">' + (i + 1) + '</div>'
      + '<div class="q-num">Exercice 0' + (i + 1) + '</div>'
      + '<div class="q-cat">' + ex.cat + '</div></div>'
      + '<div class="q-text">' + ex.q + '</div>';
    if (ex.eq) inner += '<div class="eq-box">' + ex.eq + '</div>';
    ex.fields.forEach(function (f, fi) {
      inner += '<div class="input-row"><span class="input-label">' + f.label + '</span>'
        + '<input type="number" class="answer-input" id="inp-' + i + '-' + fi + '" placeholder="?" step="any"/></div>';
    });
    inner += '<div class="btn-row">'
      + '<button class="btn btn-check" id="chk-' + i + '" onclick="check(' + i + ')">&#10003; Valider</button>'
      + '<button class="btn btn-hint" onclick="toggleHint(' + i + ')">? Indice</button>'
      + '<button class="btn btn-retry" id="retry-' + i + '" onclick="retry(' + i + ')" style="display:none;">&#8635; R\u00e9essayer</button>'
      + '</div>'
      + '<div class="hint-box" id="hint-' + i + '"></div>'
      + '<div class="fb" id="fb-' + i + '"><span class="fb-icon" id="fbi-' + i + '"></span>'
      + '<div><div id="fbm-' + i + '"></div><div class="fb-detail" id="fbd-' + i + '"></div></div></div>'
      + '</div>';
    card.innerHTML = inner;
    host.appendChild(card);
  });
  updateScore();
}

function check(i) {
  if (checked[i]) return;
  var ex = EXOS[i], correct;
  var allFilled = true, allCorrect = true, firstEmpty = null;
  ex.fields.forEach(function (f, fi) {
    var v = $("inp-" + i + "-" + fi).value;
    if (v === "") { allFilled = false; if (firstEmpty === null) firstEmpty = fi; }
    else if (parseFloat(v) !== f.ans) { allCorrect = false; }
  });
  if (!allFilled) { $("inp-" + i + "-" + firstEmpty).focus(); return; }
  correct = allCorrect;

  $("chk-" + i).disabled = true;

  if (correct) {
    checked[i] = true;
    answers[i] = 1;
    $("fb-" + i).className = "fb show ok";
    $("fbi-" + i).textContent = "\u2705";
    $("fbm-" + i).textContent = pick(["Bravo !", "Parfait !", "Excellent !", "Tr\u00e8s bien !"]);
    $("fbd-" + i).innerHTML = ex.method;
    ex.fields.forEach(function (f, fi) {
      var el = $("inp-" + i + "-" + fi);
      el.disabled = true;
      el.className = "answer-input correct-input";
    });
    $("retry-" + i).style.display = "none";
    updateScore();
  } else {
    if (!erreurs[i]) { erreurs[i] = true; }
    tentatives[i]++;
    $("fb-" + i).className = "fb show ko";
    $("fbi-" + i).textContent = "\u274C";
    $("fbm-" + i).textContent = "Pas tout \u00e0 fait\u2026 r\u00e9essaie !";
    if (tentatives[i] >= 2) {
      $("fbd-" + i).innerHTML = "<strong>Correction :</strong><br>" + ex.method;
    } else {
      $("fbd-" + i).innerHTML = "Clique <strong>? Indice</strong> pour de l\u2019aide, puis <strong>R\u00e9essayer</strong>.";
    }
    ex.fields.forEach(function (f, fi) {
      var v = $("inp-" + i + "-" + fi).value;
      $("inp-" + i + "-" + fi).className = "answer-input " + (parseFloat(v) === f.ans ? "correct-input" : "wrong-input");
    });
    $("retry-" + i).style.display = "inline-flex";
    updateScore();
  }
}

function retry(i) {
  ex = EXOS[i];
  ex.fields.forEach(function (f, fi) {
    var el = $("inp-" + i + "-" + fi);
    el.value = ""; el.disabled = false; el.className = "answer-input";
  });
  $("inp-" + i + "-0").focus();
  $("fb-" + i).className = "fb";
  $("chk-" + i).disabled = false;
  $("retry-" + i).style.display = "none";
}

function toggleHint(i) {
  var h = $("hint-" + i);
  if (h.classList.contains("show")) {
    h.classList.remove("show");
  } else {
    h.innerHTML = "<strong>Indice\u00a0:</strong> " + EXOS[i].hint;
    h.classList.add("show");
  }
}

function updateScore() {
  var ok = answers.filter(function (a) { return a !== null; }).length;
  var ko = erreurs.filter(function (e) { return e === true; }).length;
  $("h-ok").textContent = ok;
  $("h-rem").textContent = TOTAL - ok;
  $("h-ko").textContent = ko;
  $("bar").style.width = Math.round(ok / TOTAL * 100) + "%";
  $("prog").textContent = ok + " / " + TOTAL;
  if (ok >= TOTAL) showResults();
}

function showResults() {
  var ko = erreurs.filter(function (e) { return e === true; }).length;
  $("score-num").textContent = TOTAL - ko;
  $("score-tot").textContent = TOTAL;
  var stars = "";
  if (ko === 0) stars = "\u2B50\u2B50\u2B50\u2B50\u2B50";
  else if (ko === 1) stars = "\u2B50\u2B50\u2B50\u2B50";
  else if (ko === 2) stars = "\u2B50\u2B50\u2B50";
  else stars = "\u2B50\u2B50";
  $("stars-row").textContent = stars;
  var msgs = [
    "F\u00e9licitations, z\u00e9ro erreur ! Niveau Expert ma\u00eet\u00e9ris\u00e9.",
    "Tr\u00e8s bien, encore un peu d\u2019entra\u00eenement et ce sera parfait.",
    "Continue \u00e0 r\u00e9viser les identit\u00e9s remarquables, tu progresses !"
  ];
  $("results-msg").textContent = ko === 0 ? msgs[0] : ko === 1 ? msgs[1] : msgs[2];
  $("results-screen").classList.add("show");
  $("btn-restart").style.display = "inline-flex";
}

function restart() {
  EXOS = genExercises();
  answers = [null, null, null, null];
  checked = [false, false, false, false];
  erreurs = [false, false, false, false];
  tentatives = [0, 0, 0, 0];
  $("results-screen").classList.remove("show");
  $("btn-restart").style.display = "none";
  buildAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

buildAll();
</script>
</body>
</html>
