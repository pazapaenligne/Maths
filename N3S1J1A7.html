<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Je retiens ! — Les équations du 1er degré · 4e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --day-color:#f5a623;
  --day-dark:#c47a10;
  --day-light:#fff5e0;
  --day-border:#f5d080;
  --day-glow:rgba(245,166,35,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#fffdf7;color:#2b2b2b;line-height:1.65;padding:24px 16px 60px;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(2px)}
body::before{width:260px;height:260px;background:var(--day-glow);top:-80px;right:-70px}
body::after{width:200px;height:200px;background:var(--day-glow);bottom:-60px;left:-60px}
.bubble{position:fixed;border-radius:50%;background:var(--day-glow);z-index:0;pointer-events:none;opacity:.5}
.bubble.b1{width:90px;height:90px;top:40%;left:-30px}
.bubble.b2{width:60px;height:60px;top:18%;left:8%}
.bubble.b3{width:120px;height:120px;bottom:12%;right:-40px}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto}

.hero{text-align:center;margin-bottom:26px}
.pill{display:inline-block;background:var(--day-color);color:#fff;font-weight:bold;font-size:.85rem;letter-spacing:.5px;padding:7px 18px;border-radius:999px;box-shadow:0 4px 12px var(--day-glow)}
.hero h1{font-size:1.9rem;color:var(--day-dark);margin:14px 0 8px;line-height:1.2}
.hero .week-line{font-size:1.02rem;color:#8a8a8a;font-weight:600;margin-top:12px;letter-spacing:.3px}
.hero .sub{font-size:1.02rem;color:#555;max-width:560px;margin:0 auto}

/* progression */
.progress-wrap{max-width:760px;margin:0 auto 18px;position:relative;z-index:1}
.progress-info{display:flex;justify-content:space-between;font-size:.82rem;color:#8a8f9a;font-family:'JetBrains Mono',monospace;margin-bottom:5px}
.progress-bar-bg{background:#eee6d8;border-radius:99px;height:8px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--day-border));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

.card{background:#fff;border-radius:16px;padding:26px 24px 24px;margin:0 auto 26px;max-width:760px;position:relative;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.06);border:1px solid #f0e8d6}
.card-stripe{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--day-color),var(--day-border))}
.consigne{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:12px 16px;font-weight:600;color:var(--day-dark);margin-bottom:16px}
.group-num{display:inline-flex;align-items:center;gap:8px;background:var(--day-light);color:var(--day-dark);font-weight:bold;font-size:.92rem;padding:6px 14px;border-radius:999px;margin-bottom:14px;border:2px solid var(--day-border);font-family:'JetBrains Mono',monospace}

.math{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--day-dark)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--day-dark);margin:0 3px}
.frac .num{border-bottom:2px solid currentColor;padding:0 5px;font-size:.88em;line-height:1.35}
.frac .den{padding:0 5px;font-size:.88em;line-height:1.35}

.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.choice-btn{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border:2px solid #eee;border-radius:10px;cursor:pointer;font-size:.95rem;line-height:1.6;text-align:left;background:#fff;transition:border-color .15s,background .15s;width:100%;font-family:Arial,sans-serif;color:#2b2b2b}
.choice-btn:hover:not([disabled]){border-color:var(--day-border)}
.choice-btn.selected{border-color:var(--day-color);background:var(--day-light)}
.choice-btn.correct-c{border-color:#8dc63f;background:#eef8e2;cursor:default}
.choice-btn.wrong-c{border-color:#e06b62;background:#fdeceb;cursor:default;opacity:.85}
.choice-icon{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;margin-top:.15rem;font-weight:700;color:#fff}
.choice-btn.selected .choice-icon{background:var(--day-color);border-color:var(--day-color)}
.choice-btn.correct-c .choice-icon{background:#8dc63f;border-color:#8dc63f}
.choice-btn.wrong-c .choice-icon{background:#e06b62;border-color:#e06b62}

.hint-toggle{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--day-dark);border:2px solid var(--day-border);border-radius:10px;padding:6px 14px;font-weight:bold;font-size:.88rem;cursor:pointer;font-family:Arial,sans-serif;margin-bottom:10px}
.hint-box{display:none;background:#fffbe8;border:2px dashed #f5d080;border-radius:10px;padding:10px 13px;font-size:.92rem;color:#7a5b00;margin-bottom:10px;line-height:1.6}
.hint-box.show{display:block}

.feedback{margin-top:6px;padding:12px 14px;border-radius:10px;font-size:.93rem;display:none;line-height:1.6;font-weight:600}
.feedback.show{display:block}
.feedback.ok{background:#eef8e2;border:2px solid #8dc63f;color:#3d7a10}
.feedback.ko{background:#fdeceb;border:2px solid #e06b62;color:#c0392b}

.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:10px;font-family:Arial,sans-serif;font-size:.92rem;font-weight:bold;cursor:pointer;border:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px)}
.btn-ghost{background:#fff;color:var(--day-dark);border:2px solid var(--day-border)}

.results{max-width:760px;margin:0 auto;text-align:center;display:none;position:relative;z-index:1}
.results.show{display:block}
.results-card{background:#fff;border-radius:16px;padding:36px 24px;box-shadow:0 6px 22px rgba(0,0,0,.06);border:1px solid #f0e8d6;position:relative;overflow:hidden}
.results-score{font-size:clamp(3rem,10vw,4.5rem);font-weight:800;line-height:1;margin:10px 0 4px;color:#2b2b2b}
.results-score .s-num{color:var(--day-dark)}
.stars{font-size:1.9rem;margin:6px 0 12px}
.results-msg{color:#666;font-size:1rem;margin-bottom:22px}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card,.results{animation:fadeUp .4s ease both}

@media(max-width:480px){
  .hero h1{font-size:1.5rem}
  .card{padding:20px 16px}
}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
<div class="wrap">

  <div class="hero">
    <span class="pill">Pazapa · 4e · Mathématiques</span>
    <div class="week-line">Semaine 1 – Jour 1</div>
    <h1>📚 Je retiens !</h1>
    <p class="sub">L'essentiel sur la résolution des équations du 1er degré, en 4 groupes d'affirmations.</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">Groupe 1 / 4</span>
      <span id="prog-pct">0 %</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>
  </div>

  <div class="card" id="main-card">
    <span class="card-stripe"></span>
    <div class="consigne">👉 Consigne : choisis l'affirmation <b>correcte</b> dans chaque groupe, puis clique sur « Valider ».</div>
    <div class="group-num" id="group-num">Groupe 1 / 4</div>
    <div class="choices" id="choices-container"></div>
    <button class="hint-toggle" type="button" onclick="toggleHint()">💡 Indice</button>
    <div class="hint-box" id="hint-box"></div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-validate" onclick="validate()" disabled>Valider ✓</button>
      <button class="btn btn-ghost" id="btn-next" onclick="nextGroup()" disabled>Suivant →</button>
      <button class="btn btn-ghost" id="btn-restart" onclick="restart()" style="display:none;">↺ Recommencer</button>
    </div>
  </div>

  <div class="results" id="results-screen">
    <div class="results-card">
      <span class="card-stripe"></span>
      <span class="pill">Résultats</span>
      <div class="results-score"><span class="s-num" id="score-num">0</span>/4</div>
      <div class="stars" id="stars-row"></div>
      <div class="results-msg" id="results-msg"></div>
      <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;">↺ Recommencer</button>
    </div>
  </div>

</div>

<script>
function frac(num, den){return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;}
function m(txt){return `<span class="math">${txt}</span>`;}

const GROUPS = [
  {
    correct: 0,
    tip: "Une équation du 1er degré contient une seule inconnue à la puissance 1.",
    feedback_ok: "Exact ! Une équation du 1er degré s'écrit sous la forme ax + b = 0, avec a ≠ 0, et a une seule inconnue x.",
    feedback_ko: "La bonne réponse est la première. Une équation du 1er degré : ax + b = 0, une seule inconnue, pas d'exposant.",
    choices: [
      `Une équation du 1er degré est une égalité de la forme ${m('ax + b = 0')} où ${m('a')} et ${m('b')} sont des nombres connus et ${m('x')} l'inconnue.`,
      `Une équation du 1er degré peut contenir plusieurs inconnues comme ${m('x')} et ${m('y')}.`,
      `Une équation du 1er degré peut avoir des termes en ${m('x²')}.`,
    ]
  },
  {
    correct: 0,
    tip: "On effectue la même opération des deux côtés de l'égalité.",
    feedback_ok: "Parfait ! On isole x en utilisant les opérations inverses (+ ↔ −, × ↔ ÷), toujours des deux côtés.",
    feedback_ko: "Non. On ne peut pas multiplier par zéro (cela annule tout) ni toujours développer en premier. On isole x avec les opérations inverses.",
    choices: [
      "Pour résoudre une équation du 1er degré, on isole l'inconnue en effectuant les mêmes opérations inverses des deux côtés.",
      "Pour résoudre une équation du 1er degré, on peut multiplier les deux membres par zéro.",
      "Pour résoudre une équation du 1er degré, on doit toujours commencer par développer les parenthèses.",
    ]
  },
  {
    correct: 0,
    tip: "Si a ≠ 0, on peut diviser par a des deux côtés.",
    feedback_ok: `Correct ! Si a ≠ 0, on divise par a : x = ${frac('−b','a')}. C'est la solution unique.`,
    feedback_ko: `La bonne réponse est la première. Si a ≠ 0, l'équation ax + b = 0 a une solution unique : x = ${frac('−b','a')}.`,
    choices: [
      `Si ${m('a ≠ 0')}, l'équation ${m('ax + b = 0')} a une solution unique : ${m('x =')} ${frac('−b','a')}.`,
      `Si ${m('a = 0')} et ${m('b ≠ 0')}, l'équation a une solution unique.`,
      `Si ${m('a = 0')} et ${m('b = 0')}, l'équation n'a pas de solution.`,
    ]
  },
  {
    correct: 0,
    tip: "Résoudre = trouver la valeur qui rend l'égalité vraie.",
    feedback_ok: "Bravo ! Résoudre une équation, c'est trouver la (ou les) valeur(s) de x qui rendent l'égalité vraie.",
    feedback_ko: "Non. Résoudre une équation du 1er degré donne une valeur unique de x (si a ≠ 0), pas plusieurs, et ce n'est pas juste vérifier une égalité.",
    choices: [
      "La résolution d'une équation du 1er degré permet de trouver la valeur de l'inconnue qui vérifie l'égalité.",
      "La résolution d'une équation du 1er degré permet toujours de trouver plusieurs valeurs possibles.",
      "La résolution d'une équation du 1er degré permet seulement de déterminer si l'égalité est vraie ou fausse.",
    ]
  },
];

let current = 0;
let score = 0;
let selected = null;
let hintOpen = false;
const $ = id => document.getElementById(id);

function render(){
  const g = GROUPS[current];
  selected = null;
  hintOpen = false;
  $("group-num").textContent = `Groupe ${current+1} / ${GROUPS.length}`;
  $("hint-box").className = "hint-box";
  $("feedback").className = "feedback";
  $("btn-validate").disabled = true;
  $("btn-next").disabled = true;
  $("btn-next").textContent = "Suivant →";
  $("btn-restart").style.display = "none";

  const container = $("choices-container");
  container.innerHTML = "";
  g.choices.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.type = "button";
    btn.innerHTML = `<span class="choice-icon"></span><span>${text}</span>`;
    btn.addEventListener("click", () => selectChoice(i));
    container.appendChild(btn);
  });
  updateProgress();
}

function selectChoice(i){
  if(document.querySelector(".choice-btn[disabled]"))return;
  selected = i;
  document.querySelectorAll(".choice-btn").forEach((b, idx) => {
    b.classList.toggle("selected", idx === i);
    b.querySelector(".choice-icon").textContent = idx === i ? "✓" : "";
  });
  $("btn-validate").disabled = false;
}

function validate(){
  if(selected===null)return;
  const g = GROUPS[current];
  const ok = selected === g.correct;
  if (ok) score++;

  document.querySelectorAll(".choice-btn").forEach((b, i) => {
    b.disabled = true;
    if (i === g.correct){ b.classList.add("correct-c"); b.querySelector(".choice-icon").textContent = "✓"; }
    else if (i === selected && !ok){ b.classList.add("wrong-c"); b.querySelector(".choice-icon").textContent = "✗"; }
  });

  const fb = $("feedback");
  fb.className = "feedback show " + (ok ? "ok" : "ko");
  fb.innerHTML = (ok ? "✅ " : "❌ ") + (ok ? g.feedback_ok : g.feedback_ko);

  $("btn-validate").disabled = true;
  $("btn-next").disabled = false;
  $("btn-next").textContent = current < GROUPS.length - 1 ? "Suivant →" : "Voir les résultats";
  $("btn-restart").style.display = "inline-flex";
  updateProgress(true);
}

function toggleHint(){
  hintOpen = !hintOpen;
  const h = $("hint-box");
  if (hintOpen){ h.innerHTML = "💡 " + GROUPS[current].tip; h.classList.add("show"); }
  else h.classList.remove("show");
}

function nextGroup(){
  if (current < GROUPS.length - 1){ current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}

function updateProgress(afterValidate){
  const done = current + (afterValidate ? 1 : 0);
  const pct = Math.round((done / GROUPS.length) * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = `Groupe ${current+1} / ${GROUPS.length}`;
  $("prog-pct").textContent = pct + " %";
}

function showResults(){
  $("main-card").style.display = "none";
  $("results-screen").classList.add("show");
  $("score-num").textContent = score;
  const stars = score === 4 ? 5 : score === 3 ? 4 : score === 2 ? 3 : score === 1 ? 2 : 1;
  $("stars-row").textContent = "⭐".repeat(stars) + "☆".repeat(5-stars);
  const msgs = ["Continue à travailler ces notions !", "Bon début !", "Bonne compréhension !", "Presque parfait !", "Parfait ! Tu maîtrises les équations du 1er degré ! 🎉"];
  $("results-msg").textContent = msgs[score];
}

function restart(){
  current = 0; score = 0;
  $("main-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
