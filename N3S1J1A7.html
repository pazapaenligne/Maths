<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Je retiens !</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;--yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--pink);top:200px;left:-30px;pointer-events:none;}
    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:.6rem;letter-spacing:.06em;}
    h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;line-height:1.2;}
    h1 .hl-green{color:var(--green);}h1 .hl-blue{color:var(--blue);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.4rem;position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}

    .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem;position:relative;z-index:1;box-shadow:0 4px 24px rgba(0,0,0,.06);}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink),var(--blue),var(--green));}
    .intro-text{font-size:.95rem;color:var(--muted);margin-bottom:1.5rem;line-height:1.6;}
    .group-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem;}

    /* Math inline style */
    .math{font-family:'JetBrains Mono',monospace;font-style:italic;color:var(--blue);}
    .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:'JetBrains Mono',monospace;font-style:italic;margin:0 2px;}
    .frac .num{border-bottom:1.5px solid currentColor;padding:0 3px;font-size:.85em;line-height:1.3;}
    .frac .den{padding:0 3px;font-size:.85em;line-height:1.3;}

    .choices{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.2rem;}
    .choice-btn{display:flex;align-items:flex-start;gap:.8rem;padding:.85rem 1rem;border:2px solid var(--border);border-radius:10px;cursor:pointer;font-size:.9rem;line-height:1.6;text-align:left;background:var(--bg);transition:border-color .15s,background .15s,transform .1s;width:100%;}
    .choice-btn:hover:not([disabled]){border-color:var(--blue);background:#f0f9ff;transform:scale(1.005);}
    .choice-btn.selected{border-color:var(--blue);background:#e8f5ff;}
    .choice-btn.correct-c{border-color:var(--green);background:#f0faeb;cursor:default;}
    .choice-btn.wrong-c{border-color:var(--pink);background:#fff0ef;cursor:default;opacity:.7;}
    .choice-icon{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;margin-top:.15rem;}
    .choice-btn.selected .choice-icon{background:var(--blue);border-color:var(--blue);color:#fff;}
    .choice-btn.correct-c .choice-icon{background:var(--green);border-color:var(--green);color:#fff;}
    .choice-btn.wrong-c .choice-icon{background:var(--pink);border-color:var(--pink);color:#fff;}

    .hint-toggle{font-size:.82rem;color:var(--muted);cursor:pointer;margin-bottom:.8rem;display:inline-flex;align-items:center;gap:.3rem;}
    .hint-toggle:hover{color:var(--orange);}
    .hint-box{background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:8px;padding:.6rem .9rem;font-size:.83rem;color:#7a6010;display:none;margin-bottom:.8rem;line-height:1.6;}
    .hint-box.show{display:block;}

    .feedback{margin-top:1rem;padding:.85rem 1rem;border-radius:10px;font-size:.9rem;display:none;line-height:1.6;}
    .feedback.show{display:block;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-detail{margin-top:.35rem;font-size:.85rem;color:var(--text);}

    .btn-row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.2rem;border-radius:99px;font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .12s;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(58,181,216,.3);}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--blue);color:var(--text);}

    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 24px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--blue);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .card,.results{animation:fadeUp .4s ease both;}
  </style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa · Maths · 3ème
  </div>
  <div class="week-label">Semaine 1 – Jour 1</div>
  <h1>📚 Je <span class="hl-green">retiens</span> !</h1>
  <p class="subtitle">4 groupes · choisir la bonne affirmation</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Groupe 1 / 4</span>
    <span id="prog-pct">0 %</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<div class="card" id="main-card">
  <div class="card-stripe"></div>
  <p class="intro-text">Choisissez l'affirmation <strong>correcte</strong> dans chaque groupe.</p>
  <div class="group-num" id="group-num">Groupe 1 / 4</div>
  <div class="choices" id="choices-container"></div>
  <div class="hint-toggle" onclick="toggleHint()">💡 Indice</div>
  <div class="hint-box" id="hint-box"></div>
  <div class="feedback" id="feedback"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-validate" onclick="validate()" disabled>Valider ✓</button>
    <button class="btn btn-ghost" id="btn-next" onclick="nextGroup()" disabled>Suivant →</button>
    <button class="btn btn-ghost" id="btn-restart" onclick="restart()" style="display:none;">🔄 Recommencer</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Résultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/4</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">🔄 Recommencer</button>
  </div>
</div>

<script>
// Helper : fraction HTML
function frac(num, den) {
  return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
}
function m(txt) { return `<span class="math">${txt}</span>`; }

const GROUPS = [
  {
    correct: 0,
    tip: "Une équation du 1er degré contient une seule inconnue à la puissance 1.",
    feedback_ok: "Exact ! Une équation du 1er degré s'écrit sous la forme ax + b = 0, avec a ≠ 0, et a une seule inconnue x.",
    feedback_ko: "La bonne réponse est la première. Une équation du 1er degré : ax + b = 0, une seule inconnue, pas d'exposant.",
    choices: [
      `Une équation du 1er degré est une égalité de la forme ${m('ax + b = 0')} où ${m('a')} et ${m('b')} sont des nombres connus et ${m('x')} l'inconnue.`,
      `Une équation du 1er degré peut contenir plusieurs inconnues comme ${m('x')} et ${m('y')}.`,
      `Une équation du 1er degré peut avoir des termes en ${m('x²')}.`,
    ]
  },
  {
    correct: 0,
    tip: "On effectue la même opération des deux côtés de l'égalité.",
    feedback_ok: "Parfait ! On isole x en utilisant les opérations inverses (+ ↔ −, × ↔ ÷), toujours des deux côtés.",
    feedback_ko: "Non. On ne peut pas multiplier par zéro (cela annule tout) ni toujours développer en premier. On isole x avec les opérations inverses.",
    choices: [
      "Pour résoudre une équation du 1er degré, on isole l'inconnue en effectuant les mêmes opérations inverses des deux côtés.",
      "Pour résoudre une équation du 1er degré, on peut multiplier les deux membres par zéro.",
      "Pour résoudre une équation du 1er degré, on doit toujours commencer par développer les parenthèses.",
    ]
  },
  {
    correct: 0,
    tip: "Si a ≠ 0, on peut diviser par a des deux côtés.",
    feedback_ok: `Correct ! Si a ≠ 0, on divise par a : x = ${frac('−b','a')}. C'est la solution unique.`,
    feedback_ko: `La bonne réponse est la première. Si a ≠ 0, l'équation ax + b = 0 a une solution unique : x = ${frac('−b','a')}.`,
    choices: [
      `Si ${m('a ≠ 0')}, l'équation ${m('ax + b = 0')} a une solution unique : ${m('x =')} ${frac('−b','a')}.`,
      `Si ${m('a = 0')} et ${m('b ≠ 0')}, l'équation a une solution unique.`,
      `Si ${m('a = 0')} et ${m('b = 0')}, l'équation n'a pas de solution.`,
    ]
  },
  {
    correct: 0,
    tip: "Résoudre = trouver la valeur qui rend l'égalité vraie.",
    feedback_ok: "Bravo ! Résoudre une équation, c'est trouver la (ou les) valeur(s) de x qui rendent l'égalité vraie.",
    feedback_ko: "Non. Résoudre une équation du 1er degré donne une valeur unique de x (si a ≠ 0), pas plusieurs, et ce n'est pas juste vérifier une égalité.",
    choices: [
      "La résolution d'une équation du 1er degré permet de trouver la valeur de l'inconnue qui vérifie l'égalité.",
      "La résolution d'une équation du 1er degré permet toujours de trouver plusieurs valeurs possibles.",
      "La résolution d'une équation du 1er degré permet seulement de déterminer si l'égalité est vraie ou fausse.",
    ]
  },
];

let current = 0;
let score = 0;
let selected = null;
let hintOpen = false;
const $ = id => document.getElementById(id);

function render() {
  const g = GROUPS[current];
  selected = null;
  hintOpen = false;
  $("group-num").textContent = `Groupe ${current+1} / ${GROUPS.length}`;
  $("hint-box").className = "hint-box";
  $("feedback").className = "feedback";
  $("btn-validate").disabled = true;
  $("btn-next").disabled = true;
  $("btn-restart").style.display = "none";

  const container = $("choices-container");
  container.innerHTML = "";
  g.choices.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="choice-icon"></span><span>${text}</span>`;
    btn.addEventListener("click", () => selectChoice(i));
    container.appendChild(btn);
  });

  updateProgress();
}

function selectChoice(i) {
  selected = i;
  document.querySelectorAll(".choice-btn").forEach((b, idx) => {
    b.classList.toggle("selected", idx === i);
    b.querySelector(".choice-icon").textContent = idx === i ? "✓" : "";
  });
  $("btn-validate").disabled = false;
}

function validate() {
  const g = GROUPS[current];
  const ok = selected === g.correct;
  if (ok) score++;

  document.querySelectorAll(".choice-btn").forEach((b, i) => {
    b.removeEventListener("click", () => {});
    b.disabled = true;
    if (i === g.correct) { b.classList.add("correct-c"); b.querySelector(".choice-icon").textContent = "✓"; }
    else if (i === selected && !ok) { b.classList.add("wrong-c"); b.querySelector(".choice-icon").textContent = "✗"; }
  });

  const fb = $("feedback");
  fb.className = "feedback show " + (ok ? "ok" : "ko");
  fb.innerHTML = (ok ? "✅ " : "❌ ") + (ok ? g.feedback_ok : g.feedback_ko);

  $("btn-validate").disabled = true;
  $("btn-next").disabled = false;
  $("btn-next").textContent = current < GROUPS.length - 1 ? "Suivant →" : "Voir les résultats";
  $("btn-restart").style.display = "inline-flex";
  updateProgress();
}

function toggleHint() {
  hintOpen = !hintOpen;
  const h = $("hint-box");
  if (hintOpen) { h.innerHTML = "💡 " + GROUPS[current].tip; h.classList.add("show"); }
  else h.classList.remove("show");
}

function nextGroup() {
  if (current < GROUPS.length - 1) { current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}

function updateProgress() {
  const pct = Math.round((current / GROUPS.length) * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = `Groupe ${current+1} / ${GROUPS.length}`;
  $("prog-pct").textContent = pct + " %";
}

function showResults() {
  $("main-card").style.display = "none";
  $("results-screen").classList.add("show");
  $("score-num").textContent = score;
  const stars = score === 4 ? 5 : score === 3 ? 4 : score === 2 ? 3 : score === 1 ? 2 : 1;
  $("stars-row").textContent = "⭐".repeat(stars) + "☆".repeat(5-stars);
  const msgs = ["Continue à travailler ces notions !", "Bon début !", "Bonne compréhension !", "Presque parfait !", "Parfait ! Tu maîtrises les équations du 1er degré ! 🎉"];
  $("results-msg").textContent = msgs[score];
}

function restart() {
  current = 0; score = 0;
  $("main-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
