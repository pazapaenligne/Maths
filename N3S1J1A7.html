<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Résumé équations 1er degré</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
  <style>
    :root {
      --bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;
      --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;
      --pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--pink);top:200px;left:-30px;}

    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:.6rem;letter-spacing:.06em;}
    h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;line-height:1.2;}
    h1 .hl-green{color:var(--green);}h1 .hl-blue{color:var(--blue);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

    /* Progress */
    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.4rem;position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}

    /* Card */
    .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem;position:relative;z-index:1;box-shadow:0 4px 24px rgba(0,0,0,.06);}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink),var(--blue),var(--green));}
    .intro-text{font-size:.95rem;color:var(--muted);margin-bottom:1.5rem;line-height:1.6;}
    .group-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem;}

    /* Choices */
    .choices{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.2rem;}
    .choice-btn{
      display:flex;align-items:flex-start;gap:.8rem;padding:.85rem 1rem;
      border:2px solid var(--border);border-radius:10px;cursor:pointer;
      font-size:.9rem;line-height:1.5;text-align:left;
      background:var(--bg);transition:border-color .15s,background .15s,transform .1s;
    }
    .choice-btn:hover:not(:disabled){border-color:var(--blue);background:#f0f9ff;transform:scale(1.005);}
    .choice-btn.selected{border-color:var(--blue);background:#e8f5ff;}
    .choice-btn.correct-c{border-color:var(--green);background:#f0faeb;cursor:default;}
    .choice-btn.wrong-c{border-color:var(--pink);background:#fff0ef;cursor:default;opacity:.7;}
    .choice-btn:disabled{cursor:default;}
    .choice-icon{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;margin-top:.1rem;}
    .choice-btn.selected .choice-icon{background:var(--blue);border-color:var(--blue);color:#fff;}
    .choice-btn.correct-c .choice-icon{background:var(--green);border-color:var(--green);color:#fff;}
    .choice-btn.wrong-c .choice-icon{background:var(--pink);border-color:var(--pink);color:#fff;}

    /* Hint */
    .hint-toggle{font-size:.8rem;color:var(--muted);cursor:pointer;margin-bottom:.8rem;display:inline-flex;align-items:center;gap:.3rem;}
    .hint-toggle:hover{color:var(--orange);}
    .hint-box{background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:8px;padding:.6rem .9rem;font-size:.83rem;color:#7a6010;display:none;margin-bottom:.8rem;line-height:1.6;}
    .hint-box.show{display:block;}

    /* Feedback */
    .feedback{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;font-size:.9rem;display:none;line-height:1.5;}
    .feedback.show{display:block;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#3a7d0a;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}

    /* Buttons */
    .btn-row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.2rem;border-radius:99px;font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .12s;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(58,181,216,.3);}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--blue);color:var(--text);}

    /* Results */
    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 24px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--blue);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:1.5rem;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .card,.results{animation:fadeUp .4s ease both;}
  </style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa · Maths · 3ème
  </div>
  <div class="week-label">Semaine 1 – Jour 1</div>
  <h1>Résumé : <span class="hl-green">équations</span><br>du <span class="hl-blue">1er degré</span></h1>
  <p class="subtitle">4 groupes · choisir la bonne affirmation</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Groupe 1 / 4</span>
    <span id="prog-pct">0 %</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<div class="card" id="main-card">
  <div class="card-stripe"></div>
  <p class="intro-text">Choisissez l'affirmation <strong>correcte</strong> dans chaque groupe pour résumer l'essentiel sur la résolution des équations du 1er degré.</p>
  <div class="group-num" id="group-num">Groupe 1 / 4</div>
  <div class="choices" id="choices-container"></div>
  <div class="hint-toggle" onclick="toggleHint()">💡 Indice</div>
  <div class="hint-box" id="hint-box"></div>
  <div class="feedback" id="feedback"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-validate" onclick="validate()" disabled>Valider ✓</button>
    <button class="btn btn-ghost" id="btn-next" onclick="nextGroup()" disabled>Suivant →</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Résultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/4</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">🔄 Recommencer</button>
  </div>
</div>

<script>
const GROUPS = [
  {
    correct: 0,
    tip: "Pensez à la forme générale d'une équation du 1er degré.",
    choices: [
      "Une équation du 1er degré est une égalité de la forme \( ax + b = 0 \) où \( a \) et \( b \) sont des nombres connus et \( x \) l'inconnue.",
      "Une équation du 1er degré peut contenir plusieurs inconnues.",
      "Une équation du 1er degré est toujours linéaire mais peut avoir des exposants.",
    ]
  },
  {
    correct: 0,
    tip: "Rappelez-vous les règles de conservation de l'égalité.",
    choices: [
      "Pour résoudre une équation du 1er degré, on isole l'inconnue en utilisant les opérations inverses.",
      "Pour résoudre une équation du 1er degré, on peut multiplier les deux membres par zéro.",
      "Pour résoudre une équation du 1er degré, on doit toujours commencer par développer.",
    ]
  },
  {
    correct: 0,
    tip: "Considérez le cas où \( a \neq 0 \).",
    choices: [
      "Si \( a \neq 0 \), l'équation \( ax + b = 0 \) a une solution unique : \( x = -\dfrac{b}{a} \).",
      "Si \( a = 0 \), l'équation \( ax + b = 0 \) n'a pas de solution.",
      "Si \( a = 0 \), l'équation \( ax + b = 0 \) a une infinité de solutions.",
    ]
  },
  {
    correct: 0,
    tip: "Pensez à l'objectif principal de la résolution d'une équation.",
    choices: [
      "La résolution d'une équation du 1er degré permet de trouver la valeur de l'inconnue qui vérifie l'égalité.",
      "La résolution d'une équation du 1er degré permet de trouver plusieurs valeurs possibles.",
      "La résolution d'une équation du 1er degré permet de déterminer si l'égalité est vraie ou fausse.",
    ]
  },
];

let current = 0;
let score = 0;
let selected = null;
let hintOpen = false;
const $ = id => document.getElementById(id);

function render() {
  const g = GROUPS[current];
  selected = null;
  hintOpen = false;
  $("group-num").textContent = `Groupe ${current+1} / ${GROUPS.length}`;
  $("hint-box").className = "hint-box";
  $("feedback").className = "feedback";
  $("btn-validate").disabled = true;
  $("btn-next").disabled = true;

  const container = $("choices-container");
  container.innerHTML = "";
  g.choices.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="choice-icon"></span><span>${text}</span>`;
    btn.onclick = () => selectChoice(i);
    container.appendChild(btn);
  });

  updateProgress();
  if (window.MathJax) MathJax.typesetPromise([container]);
}

function selectChoice(i) {
  selected = i;
  document.querySelectorAll(".choice-btn").forEach((b, idx) => {
    b.classList.toggle("selected", idx === i);
    b.querySelector(".choice-icon").textContent = idx === i ? "✓" : "";
  });
  $("btn-validate").disabled = false;
}

function validate() {
  const g = GROUPS[current];
  const ok = selected === g.correct;
  if (ok) score++;

  document.querySelectorAll(".choice-btn").forEach((b, i) => {
    b.onclick = null;
    b.disabled = true;
    if (i === g.correct) b.classList.add("correct-c");
    else if (i === selected && !ok) b.classList.add("wrong-c");
    b.querySelector(".choice-icon").textContent = i === g.correct ? "✓" : (i === selected && !ok ? "✗" : "");
  });

  const fb = $("feedback");
  fb.className = "feedback show " + (ok ? "ok" : "ko");
  fb.textContent = ok ? "✅ Bonne réponse !" : "❌ Ce n'est pas la bonne affirmation. La bonne réponse est surlignée en vert.";

  $("btn-validate").disabled = true;
  $("btn-next").disabled = false;
  $("btn-next").textContent = current < GROUPS.length - 1 ? "Suivant →" : "Voir les résultats";
  updateProgress();
}

function toggleHint() {
  hintOpen = !hintOpen;
  const h = $("hint-box");
  if (hintOpen) {
    h.innerHTML = "💡 " + GROUPS[current].tip;
    h.classList.add("show");
    if (window.MathJax) MathJax.typesetPromise([h]);
  } else { h.classList.remove("show"); }
}

function nextGroup() {
  if (current < GROUPS.length - 1) { current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}

function updateProgress() {
  const pct = Math.round((current / GROUPS.length) * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = `Groupe ${current+1} / ${GROUPS.length}`;
  $("prog-pct").textContent = pct + " %";
}

function showResults() {
  $("main-card").style.display = "none";
  $("results-screen").classList.add("show");
  $("score-num").textContent = score;
  const stars = score === 4 ? 5 : score === 3 ? 4 : score === 2 ? 3 : score === 1 ? 2 : 1;
  $("stars-row").textContent = "⭐".repeat(stars) + "☆".repeat(5-stars);
  const msgs = ["Continue à travailler ces notions !", "Bien commencé, continue !", "Bonne compréhension !", "Presque parfait !", "Parfait ! Tu maîtrises les équations du 1er degré ! 🎉"];
  $("results-msg").textContent = msgs[score];
}

function restart() {
  current = 0; score = 0;
  $("main-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
