<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Je rel&egrave;ve le d&eacute;fi &ndash; 3&egrave;me S3 J4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --jour:#3ab5d8;--jour-fonce:#1a6e88;--jour-clair:#e8f6fb;--jour-pale:#9dd4e8;
  --bg:#fffdf7;--txt:#2b2010;--gris:#8b7a60;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;padding:20px 16px 80px;
  position:relative;overflow-x:hidden;
}
.bulle{position:fixed;border-radius:50%;opacity:.28;z-index:0;pointer-events:none;}
.bulle-1{width:200px;height:200px;background:#ffd84d;top:-60px;right:-50px;}
.bulle-2{width:240px;height:240px;background:var(--jour-pale);bottom:-80px;left:-70px;}
.bulle-3{width:150px;height:150px;background:#9be7a5;top:45%;right:-70px;}
.bulle-4{width:120px;height:120px;background:#f7c8d4;top:200px;left:-30px;}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;}

/* Header */
.header{text-align:center;margin-bottom:24px;}
.logo-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--jour);color:#fff;
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:.72rem;
  letter-spacing:1.5px;padding:6px 14px;border-radius:20px;
  box-shadow:0 3px 10px rgba(58,181,216,.4);margin-bottom:12px;
}
.logo-badge .dots{display:inline-flex;gap:3px;}
.logo-badge .dots i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.7;display:block;}
.logo-badge .dots i:first-child{opacity:1;}
.semaine{
  font-family:'Orbitron',sans-serif;font-size:.78rem;letter-spacing:3px;
  color:var(--gris);text-transform:uppercase;margin-bottom:6px;
}
.titre{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.1;color:var(--txt);margin-bottom:6px;
}
.titre .accent{color:var(--jour-fonce);}
.sous-titre{
  font-family:'Orbitron',sans-serif;font-size:.82rem;letter-spacing:2px;
  color:var(--gris);margin-bottom:14px;
}
.badge-mission{
  display:inline-block;background:var(--jour);color:#fff;
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:.82rem;
  letter-spacing:1px;padding:9px 22px;border-radius:24px;
  box-shadow:0 4px 14px rgba(58,181,216,.45);
}

/* Cadre principal */
.cadre{
  background:#fff;
  border:3px solid var(--jour);
  border-radius:18px;
  box-shadow:0 10px 32px rgba(58,181,216,.18);
  overflow:hidden;
  margin-top:20px;
}
.cadre-header{
  background:var(--jour-clair);
  padding:10px 18px;
  border-bottom:2px solid var(--jour-pale);
  font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:2px;
  color:var(--jour-fonce);font-weight:700;text-transform:uppercase;
}
/* Conteneur 16:9 responsive */
.iframe-wrap{
  position:relative;padding-bottom:56.25%;height:0;background:#f0faff;
}
.iframe-wrap iframe{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border:none;
}

.footer-aide{
  text-align:center;margin-top:14px;
  font-size:.85rem;color:var(--gris);
  font-family:'Orbitron',sans-serif;letter-spacing:1px;font-style:italic;
}

/* Calculatrice */
.fxc-trig{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;flex-direction:column;
  align-items:center;gap:4px;cursor:pointer;user-select:none;background:none;border:none;padding:0;}
.fxc-trig svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
.fxc-pill{background:var(--jour-fonce);color:#fff;font-family:'Orbitron',sans-serif;
  font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:10px;letter-spacing:.04em;}
.fxc-hidden{display:none!important;}
.fxc-panel{position:fixed;right:14px;bottom:14px;z-index:9999;width:312px;max-width:94vw;
  background:#2f343b;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);
  font-family:'JetBrains Mono',monospace;overflow:hidden;border:2px solid var(--jour);}
.fxc-bar{background:#23272d;color:#cfd6de;font-size:12.5px;font-weight:700;padding:9px 10px;
  cursor:move;touch-action:none;user-select:none;display:flex;align-items:center;gap:6px;}
.fxc-bar .fxc-sp{flex:1;}
.fxc-icon{background:#3a4049;color:#fff;border:none;width:26px;height:26px;border-radius:7px;
  font-size:13px;cursor:pointer;line-height:1;}
.fxc-icon:hover{background:var(--jour);}
.fxc-help-txt{background:#23272d;color:#aeb6bf;font-size:11.5px;line-height:1.7;
  padding:8px 12px;border-top:1px solid #3a4049;}
.fxc-screen{background:#d7e3c8;margin:10px;border-radius:8px;padding:8px 10px;
  min-height:64px;display:flex;flex-direction:column;justify-content:center;border:2px solid #aab79a;}
.fxc-expr{font-size:13px;color:#4a5340;text-align:right;min-height:16px;word-break:break-all;}
.fxc-res{font-size:23px;font-weight:800;color:#222;text-align:right;word-break:break-all;}
.fxc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 10px 12px;}
.fxc-k{background:#454c55;color:#fff;border:none;border-radius:9px;padding:10px 0;
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;
  cursor:pointer;min-height:40px;transition:transform .08s;}
.fxc-k:active{transform:scale(.94);}.fxc-k:hover{background:#525a64;}
.fxc-k.fn{background:#3a4049;font-size:12px;color:var(--jour);}
.fxc-k.op{color:var(--jour);}.fxc-k.eq{background:#3a7bd5;color:#fff;}
.fxc-k.blank{background:transparent;cursor:default;}
</style>
</head>
<body>
<div class="bulle bulle-1"></div>
<div class="bulle bulle-2"></div>
<div class="bulle bulle-3"></div>
<div class="bulle bulle-4"></div>

<div class="wrap">
  <div class="header">
    <div class="logo-badge">
      <span class="dots"><i></i><i></i><i></i></span>
      PAZAPA &middot; MATHS &middot; 3&Egrave;ME
    </div>
    <div class="semaine">Semaine 3 &ndash; Jour 4</div>
    <h1 class="titre">&#127942; Je rel&egrave;ve le <span class="accent">d&eacute;fi</span>&nbsp;!</h1>
    <div class="sous-titre">&#127775; D&eacute;fi Maths 3&egrave;me &mdash; S3 J4</div>
    <div class="badge-mission">&#9654; MULTI-COMP&Eacute;TENCES</div>
  </div>

  <div class="cadre">
    <div class="cadre-header">&#127891; Exercice interactif</div>
    <div class="iframe-wrap">
      <iframe
        src="https://learningapps.org/watch?app=17285272"
        title="D&eacute;fi Maths 3&egrave;me S3 J4"
        allowfullscreen="true"
        loading="lazy">
      </iframe>
    </div>
  </div>

  <div class="footer-aide">&#10024; Termine l&apos;exercice puis recommence pour t&apos;am&eacute;liorer &#10024;</div>
</div>

<!-- Calculatrice fx-92 -->
<button id="fxc-trig" class="fxc-trig" aria-label="Calculatrice">
  <svg width="62" height="86" viewBox="0 0 62 86" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="fg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcefe8"/><stop offset="1" stop-color="#bcdcd5"/>
    </linearGradient></defs>
    <rect x="1" y="1" width="60" height="84" rx="9" fill="url(#fg6)" stroke="#8fb3aa" stroke-width="1.5"/>
    <text x="9" y="13" font-family="Arial" font-size="7" font-weight="bold" fill="#2f5d52">CASIO</text>
    <text x="40" y="13" font-family="Arial" font-size="6" font-weight="bold" fill="#2f5d52">fx-92</text>
    <rect x="8" y="17" width="46" height="6" rx="2" fill="#26323a"/>
    <rect x="8" y="26" width="46" height="17" rx="2" fill="#c4d3a6" stroke="#9aa985"/>
    <circle cx="15" cy="54" r="7" fill="#7fb8ac" stroke="#5e948a"/>
    <circle cx="15" cy="54" r="2.5" fill="#3a4f49"/>
    <g fill="#5a6b66">
      <rect x="27" y="49" width="7" height="4" rx="1"/><rect x="37" y="49" width="7" height="4" rx="1"/>
      <rect x="47" y="49" width="7" height="4" rx="1"/><rect x="27" y="56" width="7" height="4" rx="1"/>
      <rect x="37" y="56" width="7" height="4" rx="1"/><rect x="47" y="56" width="7" height="4" rx="1"/>
    </g>
    <g fill="#7a8b86">
      <rect x="8" y="64" width="7" height="4" rx="1"/><rect x="18" y="64" width="7" height="4" rx="1"/>
      <rect x="28" y="64" width="7" height="4" rx="1"/><rect x="8" y="71" width="7" height="4" rx="1"/>
      <rect x="18" y="71" width="7" height="4" rx="1"/><rect x="28" y="71" width="7" height="4" rx="1"/>
    </g>
    <rect x="40" y="64" width="14" height="4" rx="1" fill="#c0392b"/>
    <rect x="40" y="71" width="14" height="6" rx="1.5" fill="#3a7bd5"/>
  </svg>
  <span class="fxc-pill">Calculatrice</span>
</button>
<div id="fxc-panel" class="fxc-panel fxc-hidden">
  <div class="fxc-bar" id="fxc-bar">&#9776; fx-92<span class="fxc-sp"></span>
    <button class="fxc-icon" id="fxc-hb">?</button>
    <button class="fxc-icon" id="fxc-cb">&#10005;</button>
  </div>
  <div class="fxc-help-txt fxc-hidden" id="fxc-help">&divide;R reste &middot; FACT &middot; PGCD &middot; PPCM &middot; a/b &middot; &radic; x&sup2; ^</div>
  <div class="fxc-screen"><div class="fxc-expr" id="fxc-expr"></div><div class="fxc-res" id="fxc-res">0</div></div>
  <div class="fxc-keys" id="fxc-keys"></div>
</div>

<script>
(function(){
  var expr='';
  function E(id){return document.getElementById(id);}
  var KEYS=[
    ['FACT(','fn','FACT('],['PGCD(','fn','PGCD('],['PPCM(','fn','PPCM('],['a/b','fn','SIMP('],['AC','fn','AC'],
    ['DEL','fn','DEL'],['(','op','('],[')','op',')'],[';','op',';'],['÷R','op','÷R'],
    ['7','','7'],['8','','8'],['9','','9'],['÷','op','÷'],['√(','op','√('],
    ['4','','4'],['5','','5'],['6','','6'],['×','op','×'],['x²','op','²'],
    ['1','','1'],['2','','2'],['3','','3'],['−','op','−'],['^','op','^'],
    ['0','','0'],[',','',','],['+','op','+'],['=','eq','='],['','blank','']
  ];
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
  function calcSafe(str){
    var s=str.replace(/\s+/g,'');var pos=0;
    function parseExpr(){var v=parseTerm();while(pos<s.length){if(s[pos]==='+'){pos++;v+=parseTerm();}else if(s[pos]==='-'){pos++;v-=parseTerm();}else break;}return v;}
    function parseTerm(){var v=parsePow();while(pos<s.length){if(s[pos]==='*'){pos++;v*=parsePow();}else if(s[pos]==='/'){pos++;var d=parsePow();if(d===0)return NaN;v/=d;}else break;}return v;}
    function parsePow(){var b=parsePrimary();if(pos<s.length&&s[pos]==='^'){pos++;return Math.pow(b,parsePow());}return b;}
    function parsePrimary(){if(pos<s.length&&s[pos]==='('){pos++;var v=parseExpr();if(pos<s.length&&s[pos]===')') pos++;return v;}if(pos<s.length&&s[pos]==='-'){pos++;return -parsePrimary();}var st=pos;while(pos<s.length&&/[0-9.]/.test(s[pos]))pos++;if(pos===st)return NaN;return parseFloat(s.slice(st,pos));}
    try{var r=parseExpr();return pos===s.length?r:NaN;}catch(e){return NaN;}
  }
  function evalN(s){
    s=s.replace(/[−–]/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/√\(/g,'sqrt(').replace(/,/g,'.');
    s=s.replace(/sqrt\(([^)]+)\)/g,function(m,inner){var v=calcSafe(inner);return isNaN(v)||v<0?'NaN':String(Math.sqrt(v));});
    return calcSafe(s);
  }
  function sup(n){var m={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};return String(n).split('').map(function(c){return m[c]||c;}).join('');}
  function factStr(n){n=Math.round(n);if(n<1)return'Erreur';if(n===1)return'1';var f=[],d=2,x=n;while(d*d<=x){while(x%d===0){f.push(d);x/=d;}d++;}if(x>1)f.push(x);var out=[],i=0;while(i<f.length){var p=f[i],c=0;while(i<f.length&&f[i]===p){c++;i++;}out.push(c>1?(p+sup(c)):(''+p));}if(f.length===1&&f[0]===n)return n+' (premier)';return out.join('×');}
  function render(){E('fxc-expr').textContent=expr;}
  function press(v){
    if(v==='AC'){expr='';E('fxc-res').textContent='0';render();return;}
    if(v==='DEL'){var tks=['FACT(','PGCD(','PPCM(','SIMP(','√(','÷R'];for(var i=0;i<tks.length;i++){if(expr.slice(-tks[i].length)===tks[i]){expr=expr.slice(0,-tks[i].length);render();return;}}expr=expr.slice(0,-1);render();return;}
    if(v==='='){
      var s=(expr||'').trim();if(!s)return;
      try{
        var m;
        if((m=s.match(/^FACT\((.+)\)$/i))){E('fxc-res').textContent=factStr(evalN(m[1]));return;}
        if((m=s.match(/^PGCD\(([^;]+);([^)]+)\)$/i))){E('fxc-res').textContent=''+gcd(Math.round(evalN(m[1])),Math.round(evalN(m[2])));return;}
        if((m=s.match(/^PPCM\(([^;]+);([^)]+)\)$/i))){var A=Math.round(evalN(m[1])),B=Math.round(evalN(m[2]));E('fxc-res').textContent=''+(Math.abs(A*B)/gcd(A,B));return;}
        if((m=s.match(/^SIMP\(([^;]+);([^)]+)\)$/i))){var pp=Math.round(evalN(m[1])),qq=Math.round(evalN(m[2]));if(!qq){E('fxc-res').textContent='Erreur';return;}var dg=gcd(pp,qq)||1;pp/=dg;qq/=dg;if(qq<0){pp=-pp;qq=-qq;}E('fxc-res').textContent=qq===1?(''+pp):(pp+'/'+qq);return;}
        if(s.indexOf('÷R')>=0){var p=s.split('÷R');var aa=Math.round(evalN(p[0])),bb=Math.round(evalN(p[1]));if(!bb){E('fxc-res').textContent='Erreur';return;}var q=Math.floor(aa/bb),r=aa-q*bb;E('fxc-res').textContent='quotient '+q+' · reste '+r;return;}
        var vv=evalN(s);if(!isFinite(vv)){E('fxc-res').textContent='Erreur';return;}
        E('fxc-res').textContent=String(Math.round(vv*1e9)/1e9).replace('.',',');
      }catch(e){E('fxc-res').textContent='Erreur';}
      return;
    }
    if(v==='')return;
    expr+=v;render();
  }
  var kc=E('fxc-keys');
  KEYS.forEach(function(k){var btn=document.createElement('button');btn.type='button';btn.className='fxc-k '+(k[1]||'');btn.textContent=k[0];if(k[1]!=='blank')btn.addEventListener('click',function(){press(k[2]);});kc.appendChild(btn);});
  var trig=document.getElementById('fxc-trig'),panel=E('fxc-panel'),bar=E('fxc-bar');
  trig.addEventListener('click',function(){trig.classList.add('fxc-hidden');panel.classList.remove('fxc-hidden');});
  E('fxc-cb').addEventListener('click',function(e){e.stopPropagation();panel.classList.add('fxc-hidden');trig.classList.remove('fxc-hidden');});
  E('fxc-hb').addEventListener('click',function(e){e.stopPropagation();E('fxc-help').classList.toggle('fxc-hidden');});
  var drag=false,sx,sy,ox,oy,conv=false;
  bar.addEventListener('pointerdown',function(e){if(e.target.classList.contains('fxc-icon'))return;drag=true;conv=false;sx=e.clientX;sy=e.clientY;var r=panel.getBoundingClientRect();ox=r.left;oy=r.top;bar.setPointerCapture(e.pointerId);});
  bar.addEventListener('pointermove',function(e){if(!drag)return;if(!conv){panel.style.right='auto';panel.style.bottom='auto';panel.style.left=ox+'px';panel.style.top=oy+'px';conv=true;}var nx=ox+(e.clientX-sx),ny=oy+(e.clientY-sy),w=panel.offsetWidth,h=panel.offsetHeight;nx=Math.max(4,Math.min(window.innerWidth-w-4,nx));ny=Math.max(4,Math.min(window.innerHeight-h-4,ny));panel.style.left=nx+'px';panel.style.top=ny+'px';});
  bar.addEventListener('pointerup',function(e){drag=false;try{bar.releasePointerCapture(e.pointerId);}catch(_){}});
})();
</script>
</body>
</html>
