<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths &mdash; 3e &mdash; Identit&eacute;s remarquables &mdash; Niveau 2</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f5c518;--day-dark:#8a6000;--day-mid:#7a5500;--day-light:#fffbeb;
  --day-border:#f5e08a;--day-glow:rgba(245,197,24,.25);
  --bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;
  --green:#5fa800;--green-soft:#8dc63f;--pink:#f28b82;--orange:#f5a623;--blue:#3ab5d8;--red:#d33;
  --text:#1a1d23;--muted:#6f7480;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;line-height:1.7;}
body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.12;
  width:340px;height:340px;background:var(--day);top:-80px;right:-80px;pointer-events:none;}
body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.12;
  width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
.bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:180px;height:180px;
  background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
.bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:120px;height:120px;
  background:var(--day);top:200px;left:-30px;pointer-events:none;}

/* HEAD CARD */
.head-card{width:100%;max-width:700px;background:var(--day-light);border:2px solid var(--day-border);
  border-radius:var(--radius);padding:1.8rem 1.5rem 1.5rem;text-align:center;
  position:relative;z-index:1;margin-bottom:1.2rem;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--day);color:#000;
  font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.6rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--day-dark);margin:.4rem 0;}
.head-card h1{line-height:1.25;margin:.2rem 0;}
.hl{color:var(--day-dark);font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;}
.lvl{display:block;color:var(--text);font-size:clamp(1.4rem,5vw,2rem);font-weight:900;margin-top:.1rem;}
.head-card .subtitle{color:var(--muted);font-size:.95rem;margin-top:.5rem;}
.level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.1rem;}
.level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.88rem;
  letter-spacing:.06em;text-transform:uppercase;padding:.55rem 1.1rem;border-radius:11px;
  border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);
  min-height:2.8rem;display:inline-flex;align-items:center;cursor:default;user-select:none;}
.level-btn.active{background:var(--day);color:#000;border-color:var(--day);
  box-shadow:0 3px 10px var(--day-glow);}

/* STATS */
.stats-card{width:100%;max-width:700px;background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem;
  position:relative;z-index:1;box-shadow:0 4px 18px rgba(0,0,0,.05);}
.stats-row{display:flex;gap:.7rem;}
.stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);
  border-radius:11px;padding:.8rem .4rem;text-align:center;}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:1.6rem;font-weight:800;color:var(--day-dark);}
.stat-label{font-size:.8rem;color:var(--muted);margin-top:.2rem;}
.prog-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;margin-top:.9rem;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--day),var(--orange));
  border-radius:99px;transition:width .5s;width:0%;}
.prog-text{text-align:center;font-family:'JetBrains Mono',monospace;
  font-size:.82rem;color:var(--muted);margin-top:.5rem;}

/* SECTIONS */
.section-wrap{width:100%;max-width:700px;position:relative;z-index:1;margin-bottom:.4rem;}
.sec-header{display:flex;align-items:center;gap:.7rem;padding:.7rem 0 .4rem;flex-wrap:wrap;}
.sec-num{width:32px;height:32px;border-radius:50%;background:var(--day);color:#000;
  font-family:'JetBrains Mono',monospace;font-weight:900;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sec-title{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:800;color:var(--day-dark);}
.sec-badge{font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:700;
  padding:.18rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;
  background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);margin-left:auto;}
.sec-consigne{font-size:.92rem;color:var(--text);line-height:1.75;margin-bottom:1rem;font-weight:600;
  overflow-wrap:break-word;}

/* CARDS */
.qcard{width:100%;max-width:700px;background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);padding:1.5rem 1.4rem 1.3rem;margin-bottom:1.1rem;
  position:relative;z-index:1;box-shadow:0 3px 14px rgba(0,0,0,.05);overflow:hidden;}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--day),var(--orange),var(--pink),var(--day));
  background-size:200% 100%;animation:slide 3s linear infinite;}
@keyframes slide{from{background-position:0 0;}to{background-position:200% 0;}}
.q-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;
  padding-bottom:.7rem;border-bottom:1px solid var(--border);}
.q-lbl{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:1rem;
  background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);
  border-radius:8px;padding:.25rem .7rem;}

/* DOUBLE type eq */
.double-eq{background:var(--day-light);border:2px solid var(--day-border);border-radius:11px;
  padding:.8rem 1rem;margin-bottom:.9rem;display:flex;align-items:center;gap:.4rem;
  flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:clamp(.95rem,3vw,1.25rem);
  font-weight:700;color:var(--day-dark);overflow-wrap:break-word;}

/* EQ BOX (single) */
.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:11px;
  padding:.8rem 1rem;margin-bottom:.9rem;font-family:'JetBrains Mono',monospace;
  font-size:clamp(1.1rem,3.5vw,1.5rem);font-weight:700;color:var(--day-dark);
  text-align:center;overflow-wrap:break-word;}

/* INPUTS */
.answer-input{background:#fff;border:2px solid var(--border);border-radius:9px;
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1rem;
  padding:.45rem .75rem;outline:none;transition:border-color .2s;min-height:2.8rem;}
.answer-input:focus{border-color:var(--day);}
.ai-sm{width:100px;}
.ai-lg{width:180px;}
.inp-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem;}
.inp-lbl{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;white-space:nowrap;}
.inp-main{flex:1;min-width:130px;}
.ok-inp{border-color:var(--green-soft)!important;background:#f0faeb!important;}
.ko-inp{border-color:var(--pink)!important;background:#fff0ef!important;}

/* BOUTONS */
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.55rem 1.05rem;border-radius:9px;font-family:'JetBrains Mono',monospace;
  font-size:.82rem;font-weight:700;letter-spacing:.04em;cursor:pointer;border:none;
  transition:transform .12s;min-height:2.8rem;text-transform:uppercase;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.38;cursor:default;}
.btn-ok{background:var(--day);color:#000;box-shadow:0 3px 10px var(--day-glow);}
.btn-ok:hover:not(:disabled){transform:translateY(-1px);}
.btn-hint{background:#fff;border:2px solid var(--orange);color:var(--day-dark);}
.btn-hint:hover:not(:disabled){background:#fff8ee;}
.btn-sol{background:#fff;border:2px solid var(--day-border);color:var(--day-dark);display:none;}
.btn-sol.vis{display:inline-flex;}
.btn-rst{background:#fff;border:2px solid var(--border);color:var(--muted);}
.btn-rst:hover:not(:disabled){border-color:var(--pink);color:var(--red);}

/* HINT / FB / SOL */
.hint-box{display:none;margin-top:.7rem;background:#fffbeb;border:1.5px dashed var(--day);
  border-radius:9px;padding:.65rem .9rem;font-size:.88rem;color:var(--day-mid);
  line-height:1.75;font-family:'JetBrains Mono',monospace;overflow-wrap:break-word;}
.hint-box.show{display:block;}
.fb{display:none;margin-top:.65rem;padding:.65rem .9rem;border-radius:9px;
  font-size:clamp(.9rem,2.5vw,1rem);font-weight:700;line-height:1.8;overflow-wrap:break-word;}
.fb.show{display:block;}
.fb.ok{background:#f0faeb;border:1.5px solid var(--green-soft);color:#2f6e10;}
.fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#a93226;}
.sol-box{display:none;background:var(--day-light);border:1.5px solid var(--day-border);
  border-radius:9px;padding:.75rem 1rem;margin-top:.65rem;font-size:.88rem;
  color:var(--day-dark);line-height:1.85;font-family:'JetBrains Mono',monospace;
  overflow-wrap:break-word;}
.sol-box.show{display:block;}

/* RESULTS */
.results-wrap{width:100%;max-width:700px;display:none;position:relative;z-index:1;margin-top:.5rem;}
.results-wrap.show{display:block;}
.results-card{background:var(--surface);border:2px solid var(--day-border);border-radius:var(--radius);
  overflow:hidden;box-shadow:0 4px 20px var(--day-glow);}
.rc-stripe{height:5px;background:linear-gradient(90deg,var(--day),var(--orange),var(--pink),var(--day));
  background-size:200% 100%;animation:slide 3s linear infinite;}
.rc-inner{padding:2rem 1.5rem;text-align:center;}
.rc-title{font-family:'JetBrains Mono',monospace;font-weight:900;
  font-size:clamp(1.1rem,4vw,1.5rem);color:var(--day-dark);margin-bottom:.4rem;}
.rc-score{font-family:'JetBrains Mono',monospace;font-size:clamp(2.8rem,10vw,4rem);
  font-weight:900;line-height:1;margin:.5rem 0 .2rem;color:var(--green);}
.rc-stars{font-size:1.8rem;margin:.2rem 0 .8rem;letter-spacing:.15rem;}
.rc-stars .on{color:var(--day);}
.rc-stars .off{color:#d8d2c2;}
.rc-msg{font-family:'JetBrains Mono',monospace;font-size:clamp(.82rem,2.8vw,.92rem);
  color:var(--muted);margin-bottom:1.2rem;line-height:1.8;}
.recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.3rem;}
.ri{display:flex;align-items:flex-start;gap:.7rem;padding:.6rem .9rem;background:var(--bg);
  border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;
  font-size:.8rem;line-height:1.6;}
.ri.ok-item{border-color:#b5e08a;}
.ri.ko-item{border-color:#f9c0bb;}
.ri .ri-icon{flex-shrink:0;font-size:1rem;}
.ri .ri-eq{color:var(--day-dark);flex:1;min-width:0;overflow-wrap:break-word;}
.ri .ri-ans{color:var(--muted);overflow-wrap:break-word;}

/* RESPONSIVE */

/* ── Effets visuels ── */
#flash-overlay{position:fixed;inset:0;pointer-events:none;z-index:200;opacity:0;}
#flash-overlay.flash-ok{animation:flashOk .5s ease forwards;}
#flash-overlay.flash-ko{animation:flashKo .45s ease forwards;}
@keyframes flashOk{0%{opacity:0;background:rgba(95,168,0,.22);}20%{opacity:1;}100%{opacity:0;background:rgba(95,168,0,0);}}
@keyframes flashKo{0%{opacity:0;background:rgba(211,51,51,.18);}20%{opacity:1;}100%{opacity:0;background:rgba(211,51,51,0);}}
.qcard.card-ok-flash{animation:cardOk .45s ease;}
.qcard.card-ko-flash{animation:cardKo .4s ease;}
@keyframes cardOk{0%{box-shadow:0 0 0 0 rgba(95,168,0,.8);}50%{box-shadow:0 0 0 8px rgba(95,168,0,.35);}100%{box-shadow:0 3px 14px rgba(0,0,0,.05);}}
@keyframes cardKo{0%{box-shadow:0 0 0 0 rgba(211,51,51,.7);}50%{box-shadow:0 0 0 8px rgba(211,51,51,.28);}100%{box-shadow:0 3px 14px rgba(0,0,0,.05);}}

@media(max-width:480px){
  .btn-row{flex-direction:column;}
  .btn{width:100%;}
  .double-eq{font-size:.9rem;gap:.3rem;}
  .ai-sm{width:72px;}
  .ai-lg{width:130px;}
  .head-card{padding:1.4rem 1rem 1.2rem;}
  .qcard{padding:1.2rem 1rem 1.1rem;}
  .stats-row{gap:.4rem;}
  .sec-consigne{font-size:.88rem;}
}
@media(max-width:560px){
  .stats-row{gap:.4rem;}
  .stat-num{font-size:1.35rem;}
}

/* Calculatrice */
.fxc-trigger{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:0;}
.fxc-trigger svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
.fxc-pill{background:var(--day-dark);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.04em;}
.fxc-hidden{display:none!important;}
.fxc-panel{position:fixed;right:14px;bottom:14px;z-index:9999;width:312px;max-width:94vw;background:#2f343b;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-family:'JetBrains Mono',monospace;overflow:hidden;border:2px solid var(--day);}
.fxc-bar{background:#23272d;color:#cfd6de;font-size:12.5px;font-weight:700;padding:9px 10px;cursor:move;touch-action:none;user-select:none;display:flex;align-items:center;gap:6px;}
.fxc-bar .fxc-sp{flex:1;}
.fxc-icon{background:#3a4049;color:#fff;border:none;width:26px;height:26px;border-radius:7px;font-size:13px;cursor:pointer;line-height:1;}
.fxc-icon:hover{background:var(--day);color:#000;}
.fxc-help-txt{background:#23272d;color:#aeb6bf;font-size:11.5px;line-height:1.7;padding:8px 12px;border-top:1px solid #3a4049;}
.fxc-screen{background:#d7e3c8;margin:10px;border-radius:8px;padding:8px 10px;min-height:64px;display:flex;flex-direction:column;justify-content:center;border:2px solid #aab79a;}
.fxc-expr{font-size:13px;color:#4a5340;text-align:right;min-height:16px;word-break:break-all;}
.fxc-res{font-size:23px;font-weight:800;color:#222;text-align:right;word-break:break-all;}
.fxc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 10px 12px;}
.fxc-k{background:#454c55;color:#fff;border:none;border-radius:9px;padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;cursor:pointer;min-height:40px;transition:transform .08s;}
.fxc-k:active{transform:scale(.94);}.fxc-k:hover{background:#525a64;}
.fxc-k.fn{background:#3a4049;font-size:12px;color:var(--day);}
.fxc-k.op{color:var(--day);}.fxc-k.eq{background:#3a7bd5;color:#fff;}.fxc-k.blank{background:transparent;cursor:default;}
</style>
</head>
<body>
<div id="flash-overlay"></div>
<div class="bubble1"></div><div class="bubble2"></div>

<div class="head-card">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    PAZAPA &middot; MATHS &middot; 3&Egrave;ME
  </div>
  <div class="week-label">Semaine 3 &ndash; Jour 5</div>
  <h1><span class="hl">&#9999;&#65039; S&eacute;rie d&rsquo;exercices</span><span class="lvl">Niveau 2</span></h1>

  <div class="level-row">

    <div class="rc-stripe"></div>

      <div class="rc-title">&#9733; S&eacute;rie termin&eacute;e&nbsp;!</div>

<script>
/* ══ DONNÉES ══ */
var SECTIONS=[
  { n:1, badge:'Identit\u00e9s remarquables',
    consigne:'Compl\u00e9ter le terme manquant avec un mon\u00f4me \u00e0 coefficient positif, puis \u00e9crire la forme factoris\u00e9e.',
    qs:[
      { id:'1a', lbl:'A', type:'double',
        pre:'z\u00b2\u00a0+', mid:'+\u00a01',

/* ══ UTILITAIRES ══ */
function esc(s){return(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function norm(s){
  s=(''+s).toLowerCase();
  var r=[[' ',''],['\t',''],['\u00a0',''],['*',''],['\u00d7',''],['\u00f7',''],
    ['^2','\u00b2'],['x2','x\u00b2'],['\u2013','-'],['\u2014','-'],['\u2212','-']];
  for(var i=0;i<r.length;i++)s=s.split(r[i][0]).join(r[i][1]);
  return s;
}

/* ══ PARSEUR SÉCURISÉ ══ */
function calcSafe(str){
  var s=str,pos=0;
  function parseExpr(){var v=parseTerm();while(pos<s.length){if(s[pos]==='+'){pos++;v+=parseTerm();}else if(s[pos]==='-'){pos++;v-=parseTerm();}else break;}return v;}
  function parseTerm(){var v=parsePow();while(pos<s.length){if(s[pos]==='*'){pos++;v*=parsePow();}else if(s[pos]==='/'){pos++;var d=parsePow();if(d===0)return NaN;v/=d;}else break;}return v;}
  function parsePow(){var b=parsePrimary();if(pos<s.length&&s[pos]==='^'){pos++;return Math.pow(b,parsePow());}return b;}
  function parsePrimary(){if(pos<s.length&&s[pos]==='('){pos++;var v=parseExpr();if(pos<s.length&&s[pos]===')') pos++;return v;}if(pos<s.length&&s[pos]==='-'){pos++;return -parsePrimary();}var st=pos;while(pos<s.length&&/[0-9.]/.test(s[pos]))pos++;if(pos===st)return NaN;return parseFloat(s.slice(st,pos));}
  try{var r=parseExpr();return pos===s.length?r:NaN;}catch(e){return NaN;}
}
function prepCalc(s){
  s=(''+s).toLowerCase().replace(/\s+/g,'').replace(/\u00a0/g,'')
    .replace(/\u00b2/g,'^2').replace(/\u00b3/g,'^3')
    .replace(/x2(?![0-9])/g,'x^2').replace(/[\u00d7\u00b7]/g,'*')
    .replace(/[−\u2212\u2013\u2014]/g,'-');
  return s;
}
function multiVarCalc(expr,varMap){
  var s=prepCalc(expr);
  var prev='';
  while(prev!==s){prev=s;s=s.replace(/([0-9)])(\()/g,'$1*$2').replace(/(\))([0-9a-z])/g,'$1*$2');}
  var vars=Object.keys(varMap).sort(function(a,b){return b.length-a.length;});
  var res='',i=0;
  while(i<s.length){
    var matched=false;
    for(var v=0;v<vars.length;v++){
      var vn=vars[v];
      if(s.substr(i,vn.length)===vn){
        if(res.length>0&&/[0-9a-z)]/.test(res[res.length-1]))res+='*';
        res+='('+varMap[vn]+')';
        var ni=i+vn.length;
        if(ni<s.length&&/[0-9a-z(]/.test(s[ni]))res+='*';
        i+=vn.length;matched=true;break;
      }
    }
    if(!matched){res+=s[i];i++;}
  }
  return calcSafe(res);
}
function polyEqual(student,enc){
  var pts=[-2,-1,0,1,2,3,5,7];
  for(var i=0;i<pts.length;i++){
    var sv=multiVarCalc(student,{x:pts[i]});
    var ev=multiVarCalc(enc,{x:pts[i]});
    if(!isFinite(sv)||!isFinite(ev)||Math.abs(sv-ev)>1e-5)return false;
  }
  return true;
}
function multiVarEqual(student,enc,tests){
  for(var i=0;i<tests.length;i++){
    var sv=multiVarCalc(student,tests[i]);
    var ev=multiVarCalc(enc,tests[i]);
    if(!isFinite(sv)||!isFinite(ev)||Math.abs(sv-ev)>1e-5)return false;
  }
  return true;
}

      +'<div class="sec-num">'+sec.n+'</div>'

      +'<div class="sec-badge">'+sec.badge+'</div></div>'
      +'<p class="sec-consigne">'+sec.consigne+'</p>';
    host.appendChild(wrap);
    sec.qs.forEach(function(q){
      var card=document.createElement('div');
      card.className='qcard';card.id='card-'+q.id;
      var inner='<div class="q-head"><span class="q-lbl">'+esc(q.lbl)+'</span></div>';

      if(q.type==='double'){
        inner+='<div class="double-eq">'
          +q.pre+'\u00a0'
          +'<input type="text" id="inp1-'+q.id+'" class="answer-input ai-sm" placeholder="'+q.ph1+'" autocomplete="off"/>'
          +'\u00a0'+q.mid+'\u00a0=\u00a0'
          +'<input type="text" id="inp2-'+q.id+'" class="answer-input ai-lg" placeholder="'+q.ph2+'" autocomplete="off"/>'
          +'</div>';
      } else {
        inner+='<div class="eq-box">'+q.eq+'</div>'
          +'<div class="inp-row"><span class="inp-lbl">'+esc(q.lbl)+'\u00a0=</span>'
          +'<input type="text" id="inp-'+q.id+'" class="answer-input inp-main" placeholder="'+esc(q.ph)+'" autocomplete="off"/></div>';
      }

      inner+='<div class="btn-row">'
        +'<button class="btn btn-ok" id="chk-'+q.id+'" onclick="checkQ(\''+q.id+'\')">&#10003; V\u00e9rifier</button>'
        +'<button class="btn btn-hint" onclick="toggleHint(\''+q.id+'\')">&#128161; Indice</button>'
        +'<button class="btn btn-sol" id="sol-btn-'+q.id+'" onclick="toggleSol(\''+q.id+'\')">&#9650; Correction</button>'
        +'<button class="btn btn-rst" onclick="resetQ(\''+q.id+'\')">&#8635;</button>'
        +'</div>'
        +'<div class="hint-box" id="hint-'+q.id+'">&#128161; <strong>Indice\u00a0:</strong> '+q.hint+'</div>'

function lockQ(q){
  var ok=done[q.id];
  var btn=document.getElementById('chk-'+q.id);if(btn)btn.disabled=true;
  var solBtn=document.getElementById('sol-btn-'+q.id);if(solBtn)solBtn.classList.add('vis');
  var fb=document.getElementById('fb-'+q.id);
  var bravos=['\u2705 <strong>Bravo\u00a0!</strong>','\u2705 <strong>Exact\u00a0!</strong>','\u2705 <strong>Parfait\u00a0!</strong>','\u2705 <strong>Bien jou\u00e9\u00a0!</strong>'];
  if(fb){
    fb.className='fb show '+(ok?'ok':'ko');
    fb.innerHTML=ok?bravos[Math.floor(Math.random()*bravos.length)]
      :'\u274C <strong>Pas encore.</strong> V\u00e9rifie tes calculs et utilise l\u2019indice si besoin.';
  }
  if(q.type==='double'){
    var aux=nOkAux[q.id]||{ok1:false,ok2:false};
    var i1=document.getElementById('inp1-'+q.id);
    var i2=document.getElementById('inp2-'+q.id);
    if(i1){i1.disabled=true;i1.classList.add(aux.ok1?'ok-inp':'ko-inp');}
    if(i2){i2.disabled=true;i2.classList.add(aux.ok2?'ok-inp':'ko-inp');}
  } else {
    var inp=document.getElementById('inp-'+q.id);
    if(inp){inp.disabled=true;inp.classList.add(ok?'ok-inp':'ko-inp');}
  }
}

function checkQ(id){
  if(done[id]!==undefined)return;
  var q=findQ(id);if(!q)return;
  var fb=document.getElementById('fb-'+id);
  var ok=false;

  if(q.type==='double'){
    var i1=document.getElementById('inp1-'+id);
    var i2=document.getElementById('inp2-'+id);
    var v1=(i1?i1.value:'').trim();
    var v2=(i2?i2.value:'').trim();
    if(!v1||!v2){fb.className='fb show ko';fb.textContent='Remplis les deux cases avant de valider.';return;}
    var ok1=q.enc1.indexOf(norm(v1))>-1;
    var ok2=multiVarEqual(v2,q.enc2,q.tests);
    ok=ok1&&ok2;
    nOkAux[id]={ok1:ok1,ok2:ok2};
  } else {
    var val=document.getElementById('inp-'+id).value.trim();
    if(!val){fb.className='fb show ko';fb.textContent='Entre une r\u00e9ponse avant de valider.';return;}
    if(q.type==='poly') ok=polyEqual(val,q.enc);
    else ok=multiVarEqual(val,q.enc,q.tests);
  }
  done[id]=ok;
  if(ok){nOk++;soundCorrect();flashScreen('ok');}else{nKo++;soundWrong();flashScreen('ko');}
  lockQ(q);updateScore();
  if(ok){soundOk();flashScreen('ok');}else{soundKo();flashScreen('ko');}
  flashCard(id,ok);
}

function findQ(id){
  for(var s=0;s<SECTIONS.length;s++)
    for(var q=0;q<SECTIONS[s].qs.length;q++)
      if(SECTIONS[s].qs[q].id===id)return SECTIONS[s].qs[q];
  return null;
}

function toggleHint(id){var h=document.getElementById('hint-'+id);if(h)h.classList.toggle('show');}
function toggleSol(id){
  var s=document.getElementById('solbox-'+id);if(!s)return;
  s.classList.toggle('show');
  var btn=document.getElementById('sol-btn-'+id);
  if(btn)btn.textContent=s.classList.contains('show')?'\u25b2 Masquer':'\u25bc Correction';
}

function resetQ(id){
  delete done[id];delete nOkAux[id];
  var q=findQ(id);if(!q)return;
  if(q.type==='double'){
    var i1=document.getElementById('inp1-'+id);var i2=document.getElementById('inp2-'+id);
    if(i1){i1.value='';i1.disabled=false;i1.className='answer-input ai-sm';}
    if(i2){i2.value='';i2.disabled=false;i2.className='answer-input ai-lg';}
  } else {
    var inp=document.getElementById('inp-'+id);
    if(inp){inp.value='';inp.disabled=false;inp.className='answer-input inp-main';}
  }
  var btn=document.getElementById('chk-'+id);if(btn)btn.disabled=false;
  var solBtn=document.getElementById('sol-btn-'+id);if(solBtn)solBtn.classList.remove('vis');
  var fb=document.getElementById('fb-'+id);if(fb){fb.className='fb';fb.innerHTML='';}
  var solBox=document.getElementById('solbox-'+id);if(solBox)solBox.classList.remove('show');
  var hint=document.getElementById('hint-'+id);if(hint)hint.classList.remove('show');
  nOk=0;nKo=0;
  Object.keys(done).forEach(function(k){if(done[k]===true)nOk++;else nKo++;});
  updateScore();
}

function resetAll(){
  done={};nOk=0;nKo=0;nOkAux={};
  document.getElementById('results-wrap').classList.remove('show');
  buildAll();updateScore();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateScore(){
  var ans=nOk+nKo;
  document.getElementById('sc-ok').textContent=nOk;
  document.getElementById('sc-ko').textContent=nKo;
  document.getElementById('sc-rem').textContent=TOTAL-ans;
  document.getElementById('prog-fill').style.width=Math.round(nOk/TOTAL*100)+'%';
  document.getElementById('prog-text').textContent=nOk+' / '+TOTAL;
  if(ans>=TOTAL)showResults();
}

function showResults(){
  var ratio=nOk/TOTAL;
  document.getElementById('results-wrap').classList.add('show');
  document.getElementById('rc-score').textContent=nOk+'/'+TOTAL;
  var st=ratio>=1?5:ratio>=.8?4:ratio>=.6?3:ratio>=.4?2:1;
  var sr='';for(var i=0;i<5;i++)sr+='<span class="'+(i<st?'on':'off')+'">&#9733;</span>';
  document.getElementById('rc-stars').innerHTML=sr;
  var titres=[
    '\uD83D\uDD34 Ma\u00EEtrise insuffisante',
    '\uD83D\uDFE0 Ma\u00EEtrise fragile',
    '\uD83D\uDFE1 Ma\u00EEtrise satisfaisante',
    '\uD83D\uDFE2 Tr\u00e8s bien\u00a0!',
    '\uD83D\uDFE2 Excellent\u00a0!'
  ];
  var conseils=[
    'Relis le cours sur les identit\u00e9s remarquables et recommence avec les indices.',
    'Reprends les exercices manqu\u00e9s un par un, en utilisant les indices.',
    'Revois les exercices incorrects pour consolider.',
    'Encore un effort sur les points manqu\u00e9s pour viser le sans-faute.',
    '\u2B50 Tu ma\u00EEtrises parfaitement les identit\u00e9s remarquables\u00a0!'
  ];
  var idx=st-1;
  document.getElementById('rc-msg').innerHTML='<strong>'+titres[idx]+'</strong><br><span style="font-weight:400">'+conseils[idx]+'</span>';
  var recap=document.getElementById('recap');recap.innerHTML='';
  SECTIONS.forEach(function(sec){
    sec.qs.forEach(function(q){
      var ok=done[q.id]===true;
      var div=document.createElement('div');
      div.className='ri '+(ok?'ok-item':'ko-item');
      var eqLabel=q.type==='double'?q.lbl+'\u00a0: \u2026 = \u2026':q.lbl+'\u00a0: '+q.eq;
      div.innerHTML='<span class="ri-icon">'+(ok?'\u2714':'\u2718')+'</span>'
        +'<span class="ri-eq">'+eqLabel+'</span>'
        +(ok?'':'<span class="ri-ans">\u2192 '+q.sol+'</span>');
      recap.appendChild(div);
    });
  });
  document.getElementById('results-wrap').scrollIntoView({behavior:'smooth'});
}

var _actx=null;
function getACtx(){if(!_actx){try{_actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return _actx;}
function playTone(notes,type){
  var ctx=getACtx();if(!ctx)return;
  notes.forEach(function(n){
    var osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type=type||'sine';
    osc.frequency.setValueAtTime(n[0],ctx.currentTime+n[2]);
    gain.gain.setValueAtTime(0,ctx.currentTime+n[2]);
    gain.gain.linearRampToValueAtTime(n[3]||0.18,ctx.currentTime+n[2]+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+n[2]+n[1]);
    osc.start(ctx.currentTime+n[2]);
    osc.stop(ctx.currentTime+n[2]+n[1]+0.05);
  });
}

/* ══ CALCULATRICE ══ */
(function(){
  var expr='';
  function E(id){return document.getElementById(id);}
  var KEYS=[
    ['FACT(','fn','FACT('],['PGCD(','fn','PGCD('],['PPCM(','fn','PPCM('],['a/b','fn','SIMP('],['AC','fn','AC'],
    ['DEL','fn','DEL'],['(','op','('],[')','op',')'],[';','op',';'],['\u00f7R','op','\u00f7R'],
    ['7','','7'],['8','','8'],['9','','9'],['\u00f7','op','\u00f7'],['\u221a(','op','\u221a('],
    ['4','','4'],['5','','5'],['6','','6'],['\u00d7','op','\u00d7'],['x\u00b2','op','\u00b2'],
    ['1','','1'],['2','','2'],['3','','3'],['\u2212','op','\u2212'],['^','op','^'],
    ['0','','0'],[',','',','],['(','op','('],['=','eq','='],['','blank','']
  ];
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
  function render(){E('fxc-expr').textContent=expr;}
  function evalNum(s){
    s=(''+s).toLowerCase().replace(/\s+/g,'').replace(/\u00a0/g,'')
      .replace(/\u00b2/g,'^2').replace(/[\u00d7]/g,'*').replace(/\u00f7/g,'/')
      .replace(/[−\u2212\u2013\u2014]/g,'-');
    var prev='';
    while(prev!==s){prev=s;s=s.replace(/([0-9)])(\()/g,'$1*$2').replace(/(\))([0-9])/g,'$1*$2');}
    return calcSafe(s);
  }
  function press(v){
    if(v==='AC'){expr='';E('fxc-res').textContent='0';render();return;}
    if(v==='DEL'){var tks=['FACT(','PGCD(','PPCM(','SIMP(','\u221a(','\u00f7R'];for(var i=0;i<tks.length;i++){if(expr.slice(-tks[i].length)===tks[i]){expr=expr.slice(0,-tks[i].length);render();return;}}expr=expr.slice(0,-1);render();return;}
    if(v==='='){
      var s=(expr||'').trim();if(!s)return;
      try{
        var m;
        if((m=s.match(/^FACT\((.+)\)$/i))){var n=Math.round(evalNum(m[1]));if(n<1){E('fxc-res').textContent='Erreur';return;}var f=[],d=2,x=n;while(d*d<=x){while(x%d===0){f.push(d);x/=d;}d++;}if(x>1)f.push(x);var out=[],ii=0;while(ii<f.length){var p=f[ii],c=0;while(ii<f.length&&f[ii]===p){c++;ii++;}out.push(c>1?(p+c):(''+p));}E('fxc-res').textContent=out.join('\u00d7');return;}
        if((m=s.match(/^PGCD\(([^;]+);([^)]+)\)$/i))){E('fxc-res').textContent=''+gcd(Math.round(evalNum(m[1])),Math.round(evalNum(m[2])));return;}
        if((m=s.match(/^PPCM\(([^;]+);([^)]+)\)$/i))){var A=Math.round(evalNum(m[1])),B=Math.round(evalNum(m[2]));E('fxc-res').textContent=''+(Math.abs(A*B)/gcd(A,B));return;}
        if((m=s.match(/^SIMP\(([^;]+);([^)]+)\)$/i))){var pp=Math.round(evalNum(m[1])),qq=Math.round(evalNum(m[2]));if(!qq){E('fxc-res').textContent='Erreur';return;}var dg=gcd(pp,qq)||1;pp/=dg;qq/=dg;if(qq<0){pp=-pp;qq=-qq;}E('fxc-res').textContent=qq===1?(''+pp):(pp+'/'+qq);return;}
        if(s.indexOf('\u00f7R')>=0){var parts=s.split('\u00f7R');var aa=Math.round(evalNum(parts[0])),bb=Math.round(evalNum(parts[1]));if(!bb){E('fxc-res').textContent='Erreur';return;}var q2=Math.floor(aa/bb),r2=aa-q2*bb;E('fxc-res').textContent='quotient '+q2+' \u00b7 reste '+r2;return;}
        var vv=evalNum(s);
        if(!isFinite(vv)){E('fxc-res').textContent='Erreur';return;}
        E('fxc-res').textContent=String(Math.round(vv*1e9)/1e9).replace('.',',');
      }catch(e){E('fxc-res').textContent='Erreur';}
      return;
    }
    if(v==='')return;
    expr+=v;render();
  }
  var kc=E('fxc-keys');
  KEYS.forEach(function(k){var btn=document.createElement('button');btn.type='button';btn.className='fxc-k '+(k[1]||'');btn.textContent=k[0];if(k[1]!=='blank')btn.addEventListener('click',function(){press(k[2]);});kc.appendChild(btn);});
  window.fxcOpen=function(){E('fxc-open').classList.add('fxc-hidden');E('fxc-panel').classList.remove('fxc-hidden');};
  E('fxc-cb').addEventListener('click',function(e){e.stopPropagation();E('fxc-panel').classList.add('fxc-hidden');E('fxc-open').classList.remove('fxc-hidden');});
  E('fxc-hb').addEventListener('click',function(e){e.stopPropagation();E('fxc-help').classList.toggle('fxc-hidden');});
  var bar=E('fxc-bar'),panel=E('fxc-panel'),drag=false,sx,sy,ox,oy,conv=false;
  bar.addEventListener('pointerdown',function(e){if(e.target.classList.contains('fxc-icon'))return;drag=true;conv=false;sx=e.clientX;sy=e.clientY;var r=panel.getBoundingClientRect();ox=r.left;oy=r.top;bar.setPointerCapture(e.pointerId);});
  bar.addEventListener('pointermove',function(e){if(!drag)return;if(!conv){panel.style.right='auto';panel.style.bottom='auto';panel.style.left=ox+'px';panel.style.top=oy+'px';conv=true;}var nx=ox+(e.clientX-sx),ny=oy+(e.clientY-sy),w=panel.offsetWidth,h=panel.offsetHeight;nx=Math.max(4,Math.min(window.innerWidth-w-4,nx));ny=Math.max(4,Math.min(window.innerHeight-h-4,ny));panel.style.left=nx+'px';panel.style.top=ny+'px';});
  bar.addEventListener('pointerup',function(e){drag=false;try{bar.releasePointerCapture(e.pointerId);}catch(_){}});
})();
</script>
