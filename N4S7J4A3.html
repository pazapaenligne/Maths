<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PAZAPA Maths — Calculer des probabilités</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --jour:#3ab5d8;--jour-fonce:#1a6e88;--jour-soft:#e8f6fb;
  --jour-accent:#9dd4e8;--jour-titre:#1a6e88;--badge-txt:#0d3d4f;
  --vert:#8dc63f;--vert-fonce:#3d7a10;--vert-soft:#f0faeb;
  --rouge:#e74c3c;--rouge-soft:#fdedec;--rouge-fonce:#c0392b;
  --texte:#23262d;--gris:#8a8f9a;--bord:#ece8dd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}
body{
  background:#fffdf7;color:var(--texte);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.6rem 1rem 4rem;position:relative;
}
.blob{position:fixed;z-index:0;pointer-events:none;filter:blur(1px);}
.blob1{width:300px;height:280px;top:-70px;right:-80px;opacity:.28;background:#f5d080;border-radius:38% 62% 55% 45%/56% 40% 60% 44%;}
.blob2{width:220px;height:240px;top:38%;left:-90px;opacity:.22;background:var(--jour-accent);border-radius:62% 38% 44% 56%/42% 58% 42% 58%;}
.blob3{width:260px;height:230px;bottom:-60px;right:-50px;opacity:.20;background:#8dc63f;border-radius:45% 55% 62% 38%/55% 45% 58% 42%;}
.blob4{width:140px;height:150px;bottom:200px;left:-30px;opacity:.16;background:#f28b82;border-radius:50% 50% 40% 60%/60% 40% 60% 40%;}
.hero{text-align:center;position:relative;z-index:1;margin-bottom:1.4rem;max-width:720px;width:100%;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:#f5c518;color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--gris);margin-bottom:.5rem;}
h1{font-size:clamp(1.45rem,4vw,2.1rem);font-weight:800;line-height:1.25;}
h1 .hl{color:var(--jour-titre);}
.sous-titre{color:var(--gris);font-size:.9rem;margin-top:.4rem;line-height:1.8;}
.consigne{
  margin:1rem auto 0;max-width:560px;border:2px dashed var(--jour);
  background:var(--jour-soft);color:var(--jour-fonce);border-radius:14px;
  padding:.7rem 1rem;font-size:.9rem;font-weight:600;line-height:1.8;
}
/* CARTE LIEN */
.carte-lien{
  position:relative;z-index:1;width:100%;max-width:640px;
  background:#fff;border:2px solid var(--bord);border-radius:18px;
  overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.07);
}
.carte-stripe{height:4px;background:linear-gradient(90deg,var(--jour),#8dc63f,#f5c518);}

.site-icon{font-size:3rem;margin-bottom:.8rem;}
.site-name{font-size:1.1rem;font-weight:800;color:var(--jour-fonce);margin-bottom:.4rem;}
.site-desc{font-size:.88rem;color:var(--gris);line-height:1.8;margin-bottom:1.4rem;}
.iframe-wrap{width:100%;height:560px;background:#f8f8f8;}
.iframe-wrap iframe{width:100%;height:100%;border:0;}
.btn-lien{
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--jour);color:#fff;font-family:'JetBrains Mono',monospace;
  font-weight:800;font-size:.85rem;padding:.55rem 1.3rem;border-radius:10px;
  text-decoration:none;box-shadow:0 3px 10px rgba(58,181,216,.35);
  transition:transform .12s,box-shadow .15s;
}
.btn-lien:hover{transform:translateY(-2px);}
.btn-lien:active{transform:scale(.97);}
.btn-lien svg{width:16px;height:16px;flex-shrink:0;}
@media(max-width:500px){body{padding:1rem .6rem 3rem;}}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>

<!-- HERO -->
<header class="hero">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa &middot; Maths &middot; 4&egrave;me
  </div>
  <div class="week-label">Semaine&nbsp;7 &ndash; Jour&nbsp;4</div>
  <h1><span class="hl">Calculer des probabilit&eacute;s</span></h1>
  <p class="sous-titre">Je travaille mes automatismes de calculs.</p>
  <div class="consigne">&#128073; Joue au Mathador et atteins la cible en combinant les nombres&nbsp;!</div>
</header>

<!-- CARTE LIEN -->
<section class="carte-lien">
  <div class="carte-stripe"></div>
  <div class="iframe-wrap">
    <iframe
      src="https://mathix.org/mathador/"
      allowfullscreen="true"
      title="Mathador &mdash; Le casse-t&ecirc;te des nombres">
    </iframe>
  </div>
  <div style="text-align:center;padding:.7rem 1rem .9rem;border-top:1px solid var(--bord);">
    <a class="btn-lien" href="https://mathix.org/mathador/" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Ouvrir en plein &eacute;cran
    </a>
  </div>
</section>

</body>
</html>
