<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✏️ Résoudre les exercices – Symétrie centrale</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --j1-main:   #f5a623;
  --j1-dark:   #c47a10;
  --j1-soft:   #fff5e0;
  --j1-light:  #f5d080;
  --white:     #ffffff;
  --text:      #1a1a1a;
  --text-muted:#666666;
  --radius-lg: 18px;
  --radius-md: 12px;
  --shadow:    0 4px 24px rgba(196,122,16,0.13);
  --font: 'JetBrains Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#fff;color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── BLOBS ── */
.blob{position:fixed;pointer-events:none;z-index:0;opacity:0.27;filter:blur(1px)}
.blob-1{top:-80px;right:-100px;width:420px;height:380px;background:var(--j1-light);
  border-radius:62% 38% 71% 29% / 55% 44% 56% 45%}
.blob-2{top:38%;left:-110px;width:320px;height:290px;background:var(--j1-soft);
  border-radius:41% 59% 34% 66% / 68% 32% 68% 32%}
.blob-3{bottom:-90px;left:20px;width:370px;height:340px;background:var(--j1-light);
  border-radius:55% 45% 38% 62% / 42% 63% 37% 58%}

/* ── LAYOUT ── */
.container{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 16px 60px}

/* ── HERO ── */
.hero{padding:44px 0 28px;text-align:center}
.badge{display:inline-block;background:var(--j1-main);color:#fff;font-weight:700;font-size:.72rem;
  letter-spacing:.12em;text-transform:uppercase;padding:5px 16px;border-radius:99px;margin-bottom:16px}
.hero h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;color:var(--j1-dark);margin-bottom:8px}
.hero p{font-size:.88rem;color:var(--text-muted);max-width:520px;margin:0 auto}

/* ── SCOREBOARD ── */
.scoreboard{position:sticky;top:0;z-index:100;background:var(--white);
  border-bottom:2px solid var(--j1-light);padding:10px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.score-item{display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700}
.score-item .dot{width:10px;height:10px;border-radius:50%}
.dot-ok{background:#27ae60}.dot-left{background:var(--j1-main)}.dot-err{background:#e74c3c}
.xp-wrap{flex:1;min-width:120px;display:flex;align-items:center;gap:8px}
.xp-bar-bg{flex:1;height:8px;background:var(--j1-soft);border-radius:99px;overflow:hidden}
.xp-bar{height:100%;background:var(--j1-main);border-radius:99px;transition:width .4s}
.xp-label{font-size:.72rem;font-weight:700;color:var(--j1-dark);white-space:nowrap}

/* ── EXERCISE CARD ── */
.exo-card{background:var(--white);border:2px solid var(--j1-light);border-radius:var(--radius-lg);
  padding:24px;margin-top:22px;box-shadow:var(--shadow);transition:border-color .3s}
.exo-card.validated{border-color:#27ae60;background:#f6fff8}
.exo-card.errored{border-color:#e74c3c;background:#fff6f6}
.exo-num{font-size:.68rem;font-weight:700;color:var(--j1-dark);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.exo-question{font-size:.96rem;font-weight:600;line-height:1.5;margin-bottom:16px}

/* choices */
.choices{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.choice-btn{font-family:var(--font);font-size:.88rem;font-weight:600;
  padding:10px 20px;border-radius:10px;border:2px solid var(--j1-light);
  background:var(--j1-soft);color:var(--text);cursor:pointer;transition:all .18s}
.choice-btn:hover:not(:disabled){background:var(--j1-light);border-color:var(--j1-main)}
.choice-btn.correct{background:#e8f8ef;border-color:#27ae60;color:#1a6b3a}
.choice-btn.wrong{background:#fde8e8;border-color:#e74c3c;color:#8b1a1a}
.choice-btn:disabled{cursor:not-allowed;opacity:.85}

/* coord input */
.coord-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.coord-input{font-family:var(--font);font-size:1rem;font-weight:600;
  width:70px;padding:9px 10px;border-radius:9px;border:2px solid var(--j1-light);
  background:var(--j1-soft);text-align:center;outline:none}
.coord-input:focus{border-color:var(--j1-main)}
.coord-input.input-correct{border-color:#27ae60;background:#e8f8ef}
.coord-input.input-wrong{border-color:#e74c3c;background:#fde8e8}

/* feedback */
.feedback{font-size:.82rem;font-weight:600;padding:8px 14px;border-radius:9px;margin-bottom:10px;display:none}
.feedback.show{display:block}
.feedback.ok{background:#e8f8ef;color:#1a6b3a}
.feedback.ko{background:#fde8e8;color:#8b1a1a}

/* action btns */
.btn-validate{font-family:var(--font);font-size:.9rem;font-weight:700;
  background:var(--j1-main);color:#fff;border:none;border-radius:11px;
  padding:11px 28px;cursor:pointer;transition:background .18s}
.btn-validate:hover{background:var(--j1-dark)}
.btn-validate:disabled{background:#ccc;cursor:not-allowed}
.btn-retry{font-family:var(--font);font-size:.85rem;font-weight:700;
  background:var(--j1-soft);color:var(--j1-dark);border:2px solid var(--j1-main);
  border-radius:11px;padding:9px 22px;cursor:pointer;transition:all .18s;display:none}
.btn-retry:hover{background:var(--j1-light)}
.validated-badge{display:none;font-size:.82rem;font-weight:700;color:#27ae60;
  padding:7px 14px;background:#e8f8ef;border-radius:9px}
.exo-card.validated .validated-badge{display:inline-block}
.exo-card.validated .btn-validate{display:none}
.exo-card.validated .btn-retry{display:none}

/* SVG figure */
.fig-wrap{margin:14px 0;overflow:auto}
.fig-wrap svg{max-width:100%;height:auto;font-family:var(--font)}

/* ── BUTTONS GLOBAL ── */
.btn-restart{font-family:var(--font);font-size:.95rem;font-weight:700;
  background:var(--j1-dark);color:#fff;border:none;border-radius:14px;
  padding:14px 40px;cursor:pointer;margin-top:32px;display:block;margin-left:auto;margin-right:auto;
  transition:background .18s}
.btn-restart:hover{background:#9a5e08}

/* ── RESULT SCREEN ── */
#result-screen{display:none;text-align:center;padding:40px 20px}
.trophy{font-size:4rem;margin-bottom:12px}
.result-score{font-size:1.6rem;font-weight:800;color:var(--j1-dark);margin-bottom:8px}
.stars{font-size:2rem;margin-bottom:12px}
.result-msg{font-size:.9rem;color:var(--text-muted);max-width:420px;margin:0 auto 24px}

@media(max-width:480px){
  .hero h1{font-size:1.3rem}
  .exo-card{padding:16px}
  .coord-input{width:58px}
  .choices{gap:7px}
  .choice-btn{font-size:.8rem;padding:8px 14px}
}
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<!-- SCOREBOARD -->
<div class="scoreboard" id="scoreboard">
  <div class="score-item"><span class="dot dot-ok"></span><span id="sc-ok">0</span> Réussies</div>
  <div class="score-item"><span class="dot dot-left"></span><span id="sc-left">4</span> Restantes</div>
  <div class="score-item"><span class="dot dot-err"></span><span id="sc-err">0</span> Erreurs</div>
  <div class="xp-wrap">
    <div class="xp-bar-bg"><div class="xp-bar" id="xp-bar" style="width:0%"></div></div>
    <span class="xp-label" id="xp-label">0 / 4</span>
  </div>
</div>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="badge">🟠 Semaine 5 · Jour 1</div>
    <h1>&#9999;&#65039; Résoudre les exercices</h1>
    <p>Symétrie centrale — Reconnais si deux figures sont symétriques par rapport à un point&nbsp;O, et calcule les coordonnées d'un symétrique.</p>
  </div>

  <!-- EXERCICES -->
  <div id="exos-wrap"></div>

  <button class="btn-restart" id="btn-restart">🔄 Recommencer</button>

  <!-- RÉSULTAT -->
  <div id="result-screen">
    <div class="trophy" id="res-trophy">🏅</div>
    <div class="result-score" id="res-score"></div>
    <div class="stars" id="res-stars"></div>
    <div class="result-msg" id="res-msg"></div>
    <button class="btn-restart" id="btn-restart-2">🔄 Nouvel essai</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   UTILITAIRES GÉNÉRAUX
══════════════════════════════════════════════════ */
let state = { ok:0, err:0, total:4 };

function updateScoreboard(){
  const left = state.total - state.ok;
  document.getElementById('sc-ok').textContent   = state.ok;
  document.getElementById('sc-left').textContent = left;
  document.getElementById('sc-err').textContent  = state.err;
  const pct = Math.round(state.ok / state.total * 100);
  document.getElementById('xp-bar').style.width  = pct + '%';
  document.getElementById('xp-label').textContent = state.ok + ' / ' + state.total;
}

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ return arr.slice().sort(()=>Math.random()-.5); }

/* ══════════════════════════════════════════════════
   SVG HELPERS
══════════════════════════════════════════════════ */
const SVG_NS = 'http://www.w3.org/2000/svg';

function svgEl(tag,attrs={}){
  const el = document.createElementNS(SVG_NS,tag);
  for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

/* Repère avec grille (xmin..xmax, ymin..ymax), px par unité = scale */
function buildGrid(svg, xmin,xmax,ymin,ymax, scale, ox,oy){
  // fond
  const bg = svgEl('rect',{x:0,y:0,width:svg.getAttribute('width'),height:svg.getAttribute('height'),fill:'var(--j1-soft)',rx:10});
  svg.appendChild(bg);
  const g = svgEl('g');
  // grille légère
  for(let x=xmin;x<=xmax;x++){
    const px = ox + x*scale;
    const line = svgEl('line',{x1:px,y1:oy+ymin*scale,x2:px,y2:oy+ymax*scale,
      stroke:'#e0c88a',strokeWidth:'0.6'});
    g.appendChild(line);
  }
  for(let y=ymin;y<=ymax;y++){
    const py = oy - y*scale;
    const line = svgEl('line',{x1:ox+xmin*scale,y1:py,x2:ox+xmax*scale,y2:py,
      stroke:'#e0c88a',strokeWidth:'0.6'});
    g.appendChild(line);
  }
  // axes
  const axX = svgEl('line',{x1:ox+xmin*scale,y1:oy,x2:ox+xmax*scale,y2:oy,
    stroke:'#b07820',strokeWidth:'1.5','marker-end':'url(#arrowX)'});
  const axY = svgEl('line',{x1:ox,y1:oy-ymin*scale,x2:ox,y2:oy+ymax*scale,
    stroke:'#b07820',strokeWidth:'1.5','marker-end':'url(#arrowY)'});
  // libellés axes
  const lx = svgEl('text',{x:ox+xmax*scale+8,y:oy+4,fill:'#b07820',fontSize:'11',fontWeight:'700'});
  lx.textContent='x';
  const ly = svgEl('text',{x:ox-4,y:oy+ymin*scale-6,fill:'#b07820',fontSize:'11',fontWeight:'700',textAnchor:'end'});
  ly.textContent='y';
  // graduations x
  for(let x=xmin;x<=xmax;x++){
    if(x===0) continue;
    const px=ox+x*scale;
    const t=svgEl('text',{x:px,y:oy+14,fill:'#b07820',fontSize:'9',textAnchor:'middle'});
    t.textContent=x;
    g.appendChild(t);
  }
  // graduations y
  for(let y=ymin;y<=ymax;y++){
    if(y===0) continue;
    const py=oy-y*scale;
    const t=svgEl('text',{x:ox-5,y:py+3,fill:'#b07820',fontSize:'9',textAnchor:'end'});
    t.textContent=y;
    g.appendChild(t);
  }
  // O label
  const oLbl=svgEl('text',{x:ox-10,y:oy+12,fill:'#b07820',fontSize:'10',textAnchor:'end'});
  oLbl.textContent='O';
  g.appendChild(oLbl);
  svg.appendChild(g);
  svg.appendChild(axX); svg.appendChild(axY);
  svg.appendChild(lx); svg.appendChild(ly);
}

function addDefs(svg){
  const defs=svgEl('defs');
  // flèche X
  const mX=svgEl('marker',{id:'arrowX',markerWidth:'8',markerHeight:'8',refX:'6',refY:'3',orient:'auto'});
  const pX=svgEl('path',{d:'M0,0 L0,6 L8,3 z',fill:'#b07820'});
  mX.appendChild(pX); defs.appendChild(mX);
  // flèche Y
  const mY=svgEl('marker',{id:'arrowY',markerWidth:'8',markerHeight:'8',refX:'3',refY:'0',orient:'auto'});
  const pY=svgEl('path',{d:'M0,0 L6,0 L3,8 z',fill:'#b07820',transform:'rotate(180,3,4)'});
  mY.appendChild(pY); defs.appendChild(mY);
  svg.appendChild(defs);
}

/* Point nommé sur le repère */
function drawPoint(svg,px,py,label,color='#e07000',labelDx=8,labelDy=-6){
  const c=svgEl('circle',{cx:px,cy:py,r:'5',fill:color,stroke:'#fff',strokeWidth:'2'});
  svg.appendChild(c);
  if(label){
    const t=svgEl('text',{x:px+labelDx,y:py+labelDy,fill:color,fontSize:'12',fontWeight:'700'});
    t.textContent=label;
    svg.appendChild(t);
  }
}

/* Segment */
function drawSeg(svg,x1,y1,x2,y2,color='#e07000',sw=2,dash=''){
  const l=svgEl('line',{x1,y1,x2,y2,stroke:color,strokeWidth:sw,strokeDasharray:dash});
  svg.appendChild(l);
}

/* ══════════════════════════════════════════════════
   GÉNÉRATEURS D'EXERCICES
══════════════════════════════════════════════════ */

/* ── EXO 1 : Reconnaître symétrie centrale OUI/NON ─────────────
   Deux triangles : soit image l'un de l'autre par rapport à O,
   soit décalés / renversés autrement. */
function genExo1(){
  const isYes = Math.random() < .5;

  // Centre O aléatoire (petites coords pour rester dans le repère)
  const Ox=rand(1,2), Oy=rand(1,2);

  // Sommets du triangle A
  let tries=0;
  let A,B,C,Ap,Bp,Cp;
  do{
    A={x:rand(-4,0)+Ox, y:rand(1,4)+Oy};
    B={x:rand(-4,0)+Ox, y:rand(-3,0)+Oy};
    C={x:rand(1,4)+Ox,  y:rand(-2,2)+Oy};
    tries++;
  }while(tries<50 && (Math.abs(A.x-B.x)<1||Math.abs(A.y-C.y)<1));

  // Image par symétrie centrale : P' = 2O - P
  Ap={x:2*Ox-A.x, y:2*Oy-A.y};
  Bp={x:2*Ox-B.x, y:2*Oy-B.y};
  Cp={x:2*Ox-C.x, y:2*Oy-C.y};

  // Si NON : on décale un peu Ap pour casser la symétrie
  if(!isYes){
    const err = pick([1,-1]) * (rand(1,2));
    Ap.x += err; Ap.y += pick([0,1,-1]);
  }

  // Dessin
  const W=320,H=280,scale=22,ox=W/2-Ox*scale,oy=H/2+Oy*scale;
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,xmlns:SVG_NS});
  addDefs(svg);
  buildGrid(svg,-6,6,-5,5,scale,ox,oy);

  function toSvg(p){return {px:ox+p.x*scale, py:oy-p.y*scale};}
  const sA=toSvg(A),sB=toSvg(B),sC=toSvg(C);
  const sAp=toSvg(Ap),sBp=toSvg(Bp),sCp=toSvg(Cp);
  const sO={px:ox+Ox*scale,py:oy-Oy*scale};

  // Triangle 1 (orange foncé)
  const poly1=svgEl('polygon',{
    points:`${sA.px},${sA.py} ${sB.px},${sB.py} ${sC.px},${sC.py}`,
    fill:'rgba(245,166,35,0.18)',stroke:'var(--j1-dark)',strokeWidth:'2'});
  svg.appendChild(poly1);
  drawPoint(svg,sA.px,sA.py,'A','#c47a10',-14,4);
  drawPoint(svg,sB.px,sB.py,'B','#c47a10',-14,4);
  drawPoint(svg,sC.px,sC.py,'C','#c47a10',7,4);

  // Triangle 2 (bleu)
  const poly2=svgEl('polygon',{
    points:`${sAp.px},${sAp.py} ${sBp.px},${sBp.py} ${sCp.px},${sCp.py}`,
    fill:'rgba(58,181,216,0.15)',stroke:'#1a6e88',strokeWidth:'2'});
  svg.appendChild(poly2);
  drawPoint(svg,sAp.px,sAp.py,"A'",'#1a6e88',7,4);
  drawPoint(svg,sBp.px,sBp.py,"B'",'#1a6e88',7,4);
  drawPoint(svg,sCp.px,sCp.py,"C'",'#1a6e88',7,-8);

  // Centre O
  drawPoint(svg,sO.px,sO.py,'O','#e74c3c',-14,4);

  const figHtml = svg.outerHTML;

  const correct = isYes ? 'Oui' : 'Non';
  const choices = ['Oui','Non'];

  return {
    type:'qcm',
    num:'Exercice 1',
    question:`Les deux triangles (orange et bleu) sont-ils symétriques l'un de l'autre par rapport au point O&nbsp;?`,
    figHtml,
    choices,
    correct,
    explanationOk:`✅ Exact&nbsp;! ${isYes ? "Chaque sommet du triangle bleu est bien l'image du sommet correspondant du triangle orange par rapport à O (O est le milieu de [AA'], [BB'] et [CC'])." : "Les triangles ne sont pas en symétrie centrale par rapport à O."}`,
    explanationKo:`❌ ${isYes ? "Si, les deux triangles SONT symétriques par rapport à O. Vérifie que O est bien le milieu de [AA'], [BB'] et [CC']." : "Les deux triangles NE sont PAS symétriques par rapport à O. L'un des segments [AA'], [BB'] ou [CC'] n'a pas O pour milieu."}`
  };
}

/* ── EXO 2 : Calculer le symétrique d'un point ─────────────────
   Données : O(ox,oy) et M(mx,my). Trouver M'(x',y') tel que O milieu de [MM'].
   Formule : x' = 2*ox - mx,  y' = 2*oy - my */
function genExo2(){
  const Ox=rand(-2,2), Oy=rand(-2,2);
  const Mx=rand(-4,4), My=rand(-4,4);
  const Mpx=2*Ox-Mx, Mpy=2*Oy-My;

  // Dessin
  const W=300,H=260,scale=22,ox=W/2-Ox*scale*0,oy=H/2;
  // On centre sur (0,0) et on dessine avec les coordonnées réelles
  const cOx=W/2, cOy=H/2; // SVG origin = (0,0) du repère
  function tSvg(x,y){return {px:cOx+x*scale, py:cOy-y*scale};}

  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,xmlns:SVG_NS});
  addDefs(svg);
  buildGrid(svg,-6,6,-5,5,scale,cOx,cOy);

  const sO=tSvg(Ox,Oy), sM=tSvg(Mx,My), sMp=tSvg(Mpx,Mpy);

  // segment MM' pointillé
  drawSeg(svg,sM.px,sM.py,sMp.px,sMp.py,'#aaa',1.5,'4 3');

  // points
  drawPoint(svg,sO.px,sO.py,'O','#e74c3c',-14,4);
  drawPoint(svg,sM.px,sM.py,'M','#c47a10',7,4);
  // M' affiché avec ? 
  const sMpPos=sMp;
  const qCirc=svgEl('circle',{cx:sMpPos.px,cy:sMpPos.py,r:'6',fill:'#fde8e8',stroke:'#e74c3c',strokeWidth:'2',strokeDasharray:'3 2'});
  svg.appendChild(qCirc);
  const qTxt=svgEl('text',{x:sMpPos.px+9,y:sMpPos.py-5,fill:'#e74c3c',fontSize:'13',fontWeight:'800'});
  qTxt.textContent="M'(?,?)";
  svg.appendChild(qTxt);

  const figHtml=svg.outerHTML;

  return {
    type:'coord',
    num:'Exercice 2',
    question:`O(${Ox}&nbsp;;&nbsp;${Oy}) est le centre de symétrie. M(${Mx}&nbsp;;&nbsp;${My}) est un point. Quelles sont les coordonnées de M', le symétrique de M par rapport à O&nbsp;?<br><small style="color:var(--text-muted)">Rappel : si O est le milieu de [MM'], alors x′ = 2x<sub>O</sub> − x<sub>M</sub></small>`,
    figHtml,
    correctX: Mpx,
    correctY: Mpy,
    explanationOk:`✅ Parfait ! M′(${Mpx}&nbsp;;&nbsp;${Mpy}). On a bien x′ = 2×${Ox} − ${Mx} = ${Mpx} et y′ = 2×${Oy} − ${My} = ${Mpy}.`,
    explanationKo:`❌ Rappel : x′ = 2×x<sub>O</sub> − x<sub>M</sub> = 2×${Ox} − ${Mx} = <b>${Mpx}</b> et y′ = 2×${Oy} − ${My} = <b>${Mpy}</b>.`
  };
}

/* ── EXO 3 : Distinguer centrale / axiale / aucune ─────────────
   On montre une lettre ou figure simple et son type de symétrie. */
function genExo3(){
  const cases=[
    {label:'La lettre S',sym:'centrale',why:"La lettre S possède un centre de symétrie (demi-tour de 180°), mais pas d'axe de symétrie."},
    {label:'La lettre A',sym:'axiale',why:"La lettre A possède un axe de symétrie vertical, mais pas de centre de symétrie."},
    {label:'La lettre Z',sym:'centrale',why:"La lettre Z possède un centre de symétrie, mais pas d'axe de symétrie."},
    {label:'La lettre H',sym:'les deux',why:"La lettre H possède à la fois deux axes de symétrie et un centre de symétrie."},
    {label:'La lettre P',sym:'aucune',why:"La lettre P n'a ni axe ni centre de symétrie."},
    {label:'La lettre N',sym:'centrale',why:"La lettre N possède un centre de symétrie, mais pas d'axe de symétrie."},
    {label:'Un rectangle non carré',sym:'les deux',why:"Un rectangle possède deux axes de symétrie et un centre de symétrie (son centre géométrique)."},
    {label:'Un triangle isocèle non équilatéral',sym:'axiale',why:"Un triangle isocèle possède un axe de symétrie (médiatrice de la base) mais pas de centre de symétrie."},
  ];
  const chosen=pick(cases);
  const allTypes=['centrale','axiale','les deux','aucune'];
  const choices=shuffle(allTypes);

  /* SVG : représentation de la lettre */
  const letterMap={
    'La lettre S':'S','La lettre A':'A','La lettre Z':'Z','La lettre H':'H',
    'La lettre P':'P','La lettre N':'N',
    'Un rectangle non carré':null,'Un triangle isocèle non équilatéral':null
  };
  const W=200,H=150;
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,xmlns:SVG_NS});
  const bg=svgEl('rect',{x:0,y:0,width:W,height:H,fill:'var(--j1-soft)',rx:10});
  svg.appendChild(bg);

  const letter=letterMap[chosen.label];
  if(letter){
    const t=svgEl('text',{x:W/2,y:H/2+28,fill:'var(--j1-dark)',fontSize:'90',fontWeight:'800',textAnchor:'middle',fontFamily:"'JetBrains Mono',monospace"});
    t.textContent=letter;
    svg.appendChild(t);
  } else if(chosen.label==='Un rectangle non carré'){
    const rect=svgEl('rect',{x:40,y:50,width:120,height:60,fill:'rgba(245,166,35,0.2)',stroke:'var(--j1-dark)',strokeWidth:'2.5',rx:2});
    svg.appendChild(rect);
  } else {
    // triangle isocèle
    const poly=svgEl('polygon',{points:'100,20 40,130 160,130',fill:'rgba(245,166,35,0.2)',stroke:'var(--j1-dark)',strokeWidth:'2.5'});
    svg.appendChild(poly);
  }
  const figHtml=svg.outerHTML;

  // libellé lisible
  const typeLabels={'centrale':'symétrie centrale','axiale':'symétrie axiale','les deux':'les deux','aucune':'aucune symétrie'};

  return {
    type:'qcm',
    num:'Exercice 3',
    question:`Quel type de symétrie possède <b>${chosen.label}</b>&nbsp;? (Choisis la meilleure réponse)`,
    figHtml,
    choices:choices.map(c=>typeLabels[c]),
    correct:typeLabels[chosen.sym],
    explanationOk:`✅ Bien vu ! ${chosen.why}`,
    explanationKo:`❌ ${chosen.why}`
  };
}

/* ── EXO 4 : Centre de symétrie – trouver les coordonnées de O ──
   Données : M(mx,my) et M'(mpx,mpy). Trouver O milieu.
   Formule : Ox=(mx+mpx)/2 , Oy=(my+mpy)/2 */
function genExo4(){
  // On génère des coords telles que O a des coordonnées entières
  const Ox=rand(-3,3), Oy=rand(-3,3);
  // M aléatoire, M' déduit
  const Mx=Ox+rand(-3,3)*1, My=Oy+rand(-3,3)*1;
  const Mpx=2*Ox-Mx, Mpy=2*Oy-My;

  const W=300,H=260,scale=22,cOx=W/2,cOy=H/2;
  function tSvg(x,y){return {px:cOx+x*scale,py:cOy-y*scale};}
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,xmlns:SVG_NS});
  addDefs(svg);
  buildGrid(svg,-6,6,-5,5,scale,cOx,cOy);

  const sM=tSvg(Mx,My), sMp=tSvg(Mpx,Mpy), sO=tSvg(Ox,Oy);
  // segment MM'
  drawSeg(svg,sM.px,sM.py,sMp.px,sMp.py,'#aaa',1.5,'4 3');
  drawPoint(svg,sM.px,sM.py,'M','#c47a10',7,4);
  drawPoint(svg,sMp.px,sMp.py,"M'",'#1a6e88',7,4);
  // O avec ?
  const qC=svgEl('circle',{cx:sO.px,cy:sO.py,r:'7',fill:'#fde8e8',stroke:'#e74c3c',strokeWidth:'2',strokeDasharray:'3 2'});
  svg.appendChild(qC);
  const qT=svgEl('text',{x:sO.px+10,y:sO.py-6,fill:'#e74c3c',fontSize:'12',fontWeight:'800'});
  qT.textContent='O(?,?)';
  svg.appendChild(qT);

  const figHtml=svg.outerHTML;

  return {
    type:'coord',
    num:'Exercice 4',
    question:`M(${Mx}&nbsp;;&nbsp;${My}) et M′(${Mpx}&nbsp;;&nbsp;${Mpy}) sont symétriques par rapport à O. Trouve les coordonnées du centre O.<br><small style="color:var(--text-muted)">Rappel : O est le milieu de [MM′], donc x<sub>O</sub> = (x<sub>M</sub> + x<sub>M′</sub>) ÷ 2</small>`,
    figHtml,
    correctX: Ox,
    correctY: Oy,
    explanationOk:`✅ Excellent ! O(${Ox}&nbsp;;&nbsp;${Oy}). On a x<sub>O</sub> = (${Mx} + ${Mpx}) ÷ 2 = ${Ox} et y<sub>O</sub> = (${My} + ${Mpy}) ÷ 2 = ${Oy}.`,
    explanationKo:`❌ O est le milieu de [MM′] : x<sub>O</sub> = (${Mx} + ${Mpx}) ÷ 2 = <b>${Ox}</b> et y<sub>O</sub> = (${My} + ${Mpy}) ÷ 2 = <b>${Oy}</b>.`
  };
}

/* ══════════════════════════════════════════════════
   RENDU DES EXERCICES
══════════════════════════════════════════════════ */
let exercises = [];

function renderExos(){
  exercises = [genExo1(), genExo2(), genExo3(), genExo4()];
  state = {ok:0, err:0, total:4};
  updateScoreboard();

  const wrap = document.getElementById('exos-wrap');
  wrap.innerHTML = '';
  document.getElementById('result-screen').style.display='none';
  document.getElementById('btn-restart').style.display='block';

  exercises.forEach((exo, idx) => {
    const card = document.createElement('div');
    card.className = 'exo-card';
    card.id = 'card-' + idx;

    let innerHtml = `<div class="exo-num">${exo.num}</div>
      <div class="exo-question">${exo.question}</div>`;

    if(exo.figHtml){
      innerHtml += `<div class="fig-wrap">${exo.figHtml}</div>`;
    }

    if(exo.type === 'qcm'){
      innerHtml += `<div class="choices" id="choices-${idx}">`;
      exo.choices.forEach(c => {
        innerHtml += `<button class="choice-btn" data-exo="${idx}" data-val="${c}">${c}</button>`;
      });
      innerHtml += `</div>`;
    } else if(exo.type === 'coord'){
      innerHtml += `<div class="coord-row">
        <span style="font-size:.9rem;font-weight:700">x′ =</span>
        <input class="coord-input" id="inp-x-${idx}" type="number" placeholder="?">
        <span style="font-size:.9rem;font-weight:700">y′ =</span>
        <input class="coord-input" id="inp-y-${idx}" type="number" placeholder="?">
      </div>`;
    }

    innerHtml += `<div class="feedback" id="fb-${idx}"></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn-validate" id="btn-val-${idx}">Valider</button>
        <button class="btn-retry" id="btn-retry-${idx}">↻ Réessayer</button>
        <span class="validated-badge">✅ Validé !</span>
      </div>`;

    card.innerHTML = innerHtml;
    wrap.appendChild(card);
  });

  // Events QCM
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.exo);
      const card = document.getElementById('card-'+idx);
      if(card.classList.contains('validated')) return;
      // highlight selection
      document.querySelectorAll(`#choices-${idx} .choice-btn`).forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      btn.style.background='var(--j1-light)';
      btn.style.borderColor='var(--j1-dark)';
    });
  });

  // Events Valider
  exercises.forEach((exo, idx) => {
    const btnVal = document.getElementById('btn-val-'+idx);
    const btnRetry = document.getElementById('btn-retry-'+idx);
    const fb = document.getElementById('fb-'+idx);
    const card = document.getElementById('card-'+idx);

    btnVal.addEventListener('click', () => {
      let correct = false;

      if(exo.type === 'qcm'){
        const sel = document.querySelector(`#choices-${idx} .choice-btn.selected`) ||
                    document.querySelector(`#choices-${idx} .choice-btn[style*="background"]`);
        // Cherche le bouton avec highlight
        const selBtn = [...document.querySelectorAll(`#choices-${idx} .choice-btn`)]
          .find(b => b.style.background === 'var(--j1-light)' || b.classList.contains('selected'));
        if(!selBtn){ fb.className='feedback show ko'; fb.innerHTML='❗ Choisis une réponse.'; return; }
        correct = selBtn.dataset.val === exo.correct;
        // Colorier tous les boutons
        document.querySelectorAll(`#choices-${idx} .choice-btn`).forEach(b=>{
          b.disabled=true;
          if(b.dataset.val === exo.correct) b.classList.add('correct');
          else if(b.classList.contains('selected')||b.style.background==='var(--j1-light)') b.classList.add('wrong');
        });

      } else if(exo.type === 'coord'){
        const vx = parseInt(document.getElementById('inp-x-'+idx).value);
        const vy = parseInt(document.getElementById('inp-y-'+idx).value);
        if(isNaN(vx)||isNaN(vy)){ fb.className='feedback show ko'; fb.innerHTML='❗ Saisis x′ et y′.'; return; }
        correct = (vx === exo.correctX) && (vy === exo.correctY);
        const ix = document.getElementById('inp-x-'+idx);
        const iy = document.getElementById('inp-y-'+idx);
        if(correct){
          ix.classList.add('input-correct'); iy.classList.add('input-correct');
        } else {
          if(vx!==exo.correctX) ix.classList.add('input-wrong');
          if(vy!==exo.correctY) iy.classList.add('input-wrong');
        }
        ix.disabled=true; iy.disabled=true;
      }

      fb.className = 'feedback show ' + (correct?'ok':'ko');
      fb.innerHTML = correct ? exo.explanationOk : exo.explanationKo;

      if(correct){
        card.classList.add('validated');
        state.ok++;
        updateScoreboard();
        checkAllDone();
      } else {
        card.classList.add('errored');
        state.err++;
        updateScoreboard();
        btnVal.style.display='none';
        btnRetry.style.display='inline-block';
        // reset couleur coord inputs après un temps
      }
    });

    btnRetry.addEventListener('click', () => {
      card.classList.remove('errored');
      fb.className='feedback';
      fb.innerHTML='';
      btnVal.style.display='inline-block';
      btnRetry.style.display='none';

      if(exo.type === 'qcm'){
        document.querySelectorAll(`#choices-${idx} .choice-btn`).forEach(b=>{
          b.disabled=false;
          b.classList.remove('correct','wrong','selected');
          b.style.background='';
          b.style.borderColor='';
        });
      } else {
        const ix=document.getElementById('inp-x-'+idx);
        const iy=document.getElementById('inp-y-'+idx);
        ix.disabled=false; iy.disabled=false;
        ix.classList.remove('input-correct','input-wrong');
        iy.classList.remove('input-correct','input-wrong');
        ix.value=''; iy.value='';
      }
    });
  });
}

function checkAllDone(){
  if(state.ok < state.total) return;
  setTimeout(()=>{
    document.getElementById('exos-wrap').style.display='none';
    document.getElementById('btn-restart').style.display='none';
    const rs=document.getElementById('result-screen');
    rs.style.display='block';
    const total=state.total, errors=state.err;
    const pct=Math.round(total/(total+errors)*100);
    document.getElementById('res-score').textContent=`${total} / ${total} — ${errors} erreur(s)`;
    let stars='⭐⭐⭐', trophy='🏅', msg='';
    if(errors===0){stars='⭐⭐⭐';trophy='🏆';msg='Tous les exercices réussis du premier coup, sans erreur. Très solide !'}
    else if(errors<=2){stars='⭐⭐';trophy='🥈';msg='Beau travail ! Quelques essais, mais tu as trouvé. Personne ne réussit tout du premier coup.'}
    else{stars='⭐';trophy='🥉';msg="Tu as persévéré et tu as trouvé toutes les réponses. C'est ce qui compte."}
    document.getElementById('res-trophy').textContent=trophy;
    document.getElementById('res-stars').textContent=stars;
    document.getElementById('res-msg').textContent=msg;
  },600);
}

document.getElementById('btn-restart').addEventListener('click',()=>{
  document.getElementById('exos-wrap').style.display='block';
  renderExos();
});
document.getElementById('btn-restart-2').addEventListener('click',()=>{
  document.getElementById('exos-wrap').style.display='block';
  renderExos();
});

// Init
renderExos();
</script>
