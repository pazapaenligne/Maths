<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résoudre les exercices — Aires, solides et volumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Charte du jour : J2 ROSE ===== */
  :root{
    --j2:        #f28b82;
    --j2-dark:   #c0392b;
    --j2-soft:   #fff0ef;
    --j2-accent: #f9c0bb;
    --ink:       #2c2418;
    --ink-soft:  #6b5145;
    --ok:        #3d8b40;
    --ok-soft:   #eaf6ea;
    --err:       #c0392b;
    --err-soft:  #fdecea;
    --line:      #f0dcd9;
    --white:     #ffffff;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; overflow-x:hidden; }
  body{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    color:var(--ink);
    background:var(--white);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    position:relative;
    min-height:100vh;
  }

  /* ===== Fond : 3 grandes formes organiques (blobs) ===== */
  .blob{
    position:fixed; z-index:0;
    background:var(--j2-accent);
    opacity:0.28; filter:blur(1px);
    pointer-events:none;
  }
  .blob-1{ top:-160px; right:-150px; width:460px; height:430px;
    border-radius:62% 38% 46% 54% / 58% 47% 53% 42%; }
  .blob-2{ top:42%; left:-190px; width:430px; height:470px;
    border-radius:44% 56% 63% 37% / 49% 38% 62% 51%; opacity:0.26; }
  .blob-3{ bottom:-180px; left:14%; width:500px; height:420px;
    border-radius:55% 45% 38% 62% / 42% 60% 40% 58%; opacity:0.27; }

  .wrap{ position:relative; z-index:1; max-width:860px; margin:0 auto; padding:26px 18px 60px; }

  /* ===== Hero ===== */
  .hero{ text-align:center; padding:14px 6px 22px; }
  .pill{
    display:inline-block; background:var(--j2-soft);
    border:2px solid var(--j2-accent); color:var(--j2-dark);
    font-weight:700; font-size:0.82rem; letter-spacing:0.06em;
    text-transform:uppercase; padding:7px 16px; border-radius:999px; margin-bottom:16px;
  }
  .hero h1{ font-size:2.05rem; font-weight:800; color:var(--j2-dark); line-height:1.15; margin-bottom:10px; }
  .hero p.sub{ font-size:1.02rem; color:var(--ink-soft); max-width:580px; margin:0 auto; font-weight:500; }
  .hero .consigne{
    display:inline-block; margin-top:14px; background:var(--white);
    border:2px dashed var(--j2-accent); border-radius:12px; padding:8px 16px;
    font-weight:600; color:var(--j2-dark); font-size:0.92rem;
  }

  /* ===== Scoreboard sticky ===== */
  .scoreboard{
    position:sticky; top:10px; z-index:20; background:var(--white);
    border:2px solid var(--line); border-radius:16px;
    box-shadow:0 6px 20px rgba(192,57,43,0.10); padding:14px 16px; margin:10px 0 26px;
  }
  .score-stats{ display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:stretch; }
  .stat{ flex:1 1 90px; background:var(--j2-soft); border-radius:12px; padding:8px 6px; text-align:center; border:1.5px solid var(--j2-accent); }
  .stat .num{ font-size:1.5rem; font-weight:800; color:var(--j2-dark); line-height:1.1; }
  .stat .lbl{ font-size:0.72rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .stat.err   { background:var(--err-soft); border-color:#f3c6c0; }
  .stat.err .num{ color:var(--err); }
  .stat.done  { background:var(--ok-soft); border-color:#bfe0c0; }
  .stat.done .num{ color:var(--ok); }

  .xp-row{ margin-top:12px; }
  .xp-top{ display:flex; justify-content:space-between; font-size:0.8rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .xp-track{ height:16px; background:var(--j2-soft); border-radius:999px; overflow:hidden; border:1.5px solid var(--j2-accent); }
  .xp-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--j2), var(--j2-dark)); border-radius:999px; transition:width 0.5s cubic-bezier(.2,.8,.2,1); }

  /* ===== Cartes exercices ===== */
  .card{
    background:var(--white); border:2px solid var(--line); border-radius:18px;
    padding:20px 18px; margin-bottom:22px; box-shadow:0 4px 14px rgba(44,36,24,0.05);
    transition:border-color 0.3s, box-shadow 0.3s;
  }
  .card.is-correct{ border-color:#bfe0c0; box-shadow:0 6px 18px rgba(61,139,64,0.12); }
  .card.is-error{ border-color:#f3c6c0; }
  .card-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .badge-num{ flex:0 0 auto; width:42px; height:42px; background:var(--j2); color:var(--white);
    border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.25rem; }
  .card.is-correct .badge-num{ background:var(--ok); }
  .card-head .ctitle{ font-weight:700; font-size:1.02rem; color:var(--j2-dark); }
  .card.is-correct .ctitle{ color:var(--ok); }
  .check-mark{ margin-left:auto; font-size:1.5rem; color:var(--ok); opacity:0; transition:opacity 0.3s; }
  .card.is-correct .check-mark{ opacity:1; }

  .question{ font-size:1rem; margin-bottom:14px; color:var(--ink); }
  .question b{ color:var(--j2-dark); }

  /* ===== Figure SVG ===== */
  .figure{ background:var(--j2-soft); border:1.5px solid var(--j2-accent); border-radius:14px; padding:8px; margin:0 auto 16px; max-width:320px; }
  .figure svg{ width:100%; height:auto; display:block; }

  /* ===== Saisie ===== */
  .answer-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .num-input{ font-family:inherit; font-size:1.2rem; font-weight:700; width:130px; padding:12px 14px;
    border:2.5px solid var(--j2-accent); border-radius:12px; color:var(--ink); text-align:center; background:var(--white); }
  .num-input:focus{ outline:none; border-color:var(--j2); box-shadow:0 0 0 4px rgba(242,139,130,0.20); }
  .unit-tag{ font-weight:700; color:var(--ink-soft); font-size:1.05rem; }

  /* ===== QCM ===== */
  .qcm{ display:flex; gap:10px; flex-wrap:wrap; }
  .qcm-btn{ font-family:inherit; flex:1 1 130px; font-size:1.05rem; font-weight:700; padding:15px 12px;
    border:2.5px solid var(--j2-accent); border-radius:14px; background:var(--white); color:var(--j2-dark);
    cursor:pointer; transition:transform 0.1s, background 0.2s, border-color 0.2s; }
  .qcm-btn:hover{ background:var(--j2-soft); }
  .qcm-btn:active{ transform:scale(0.97); }
  .qcm-btn.picked{ background:var(--j2); color:var(--white); border-color:var(--j2-dark); }

  /* ===== Boutons ===== */
  .btn{ font-family:inherit; font-weight:700; font-size:1.02rem; padding:13px 22px; border:none; border-radius:12px;
    cursor:pointer; transition:transform 0.1s, background 0.2s, box-shadow 0.2s; }
  .btn:active{ transform:scale(0.97); }
  .btn-check{ background:var(--j2); color:var(--white); box-shadow:0 4px 0 var(--j2-dark); }
  .btn-check:hover{ background:#ef7d72; box-shadow:0 4px 0 #a82f22; }
  .btn-retry{ background:var(--err-soft); color:var(--err); border:2px solid #f3c6c0; }
  .btn-retry:hover{ background:#fbe0db; }
  .btn-big{ display:block; width:100%; max-width:340px; margin:18px auto 0; background:var(--j2-dark); color:var(--white);
    font-size:1.12rem; padding:16px; box-shadow:0 5px 0 #8f2a1f; }
  .btn-big:hover{ background:#a82f22; }

  /* ===== Feedback ===== */
  .feedback{ margin-top:14px; font-weight:600; display:none; }
  .feedback.show{ display:block; }
  .feedback.ok{ color:var(--ok); }
  .feedback.bad{ color:var(--err); }
  .solution{ margin-top:12px; background:var(--ok-soft); border:1.5px solid #bfe0c0; border-radius:12px;
    padding:12px 14px; font-size:0.95rem; color:#1f5b22; display:none; }
  .solution.show{ display:block; }
  .solution b{ color:var(--ok); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .locked{ opacity:0.65; pointer-events:none; }
  .hint{ font-size:0.86rem; color:var(--ink-soft); margin-top:6px; font-style:italic; }

  /* ===== Écran résultats ===== */
  .results{ display:none; text-align:center; background:var(--white); border:2.5px solid var(--j2-accent);
    border-radius:20px; padding:34px 22px; margin-bottom:24px; box-shadow:0 10px 30px rgba(192,57,43,0.16); }
  .results.show{ display:block; animation:pop 0.5s ease; }
  @keyframes pop{ from{ transform:scale(0.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .results .trophy{ font-size:3.4rem; line-height:1; }
  .results h2{ color:var(--j2-dark); font-size:1.6rem; margin:10px 0 4px; }
  .results .rscore{ font-size:1.1rem; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .stars{ font-size:2rem; letter-spacing:6px; margin:6px 0 12px; }
  .star-on{ color:var(--j2); }
  .star-off{ color:var(--line); }
  .results .rmsg{ color:var(--ink-soft); font-weight:500; max-width:440px; margin:0 auto 6px; }

  @media (max-width:430px){
    .hero h1{ font-size:1.62rem; }
    .stat .num{ font-size:1.25rem; }
    .stat .lbl{ font-size:0.64rem; }
    .num-input{ width:110px; }
    .wrap{ padding:20px 12px 50px; }
    .qcm-btn{ font-size:0.98rem; }
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="wrap">
    <header class="hero">
      <span class="pill">Semaine 4 · Jour 2</span>
      <h1>&#9999;&#65039; Résoudre les exercices</h1>
      <p class="sub">Aires, solides et volumes : reconnaître un solide, calculer une aire de mémoire et calculer un volume.</p>
      <div class="consigne">&#128221; Lis bien chaque figure avant de répondre.</div>
    </header>

    <section class="scoreboard" aria-label="Tableau de score">
      <div class="score-stats">
        <div class="stat done"><div class="num" id="s-ok">0</div><div class="lbl">Réussies</div></div>
        <div class="stat"><div class="num" id="s-left">4</div><div class="lbl">Restantes</div></div>
        <div class="stat err"><div class="num" id="s-err">0</div><div class="lbl">Erreurs</div></div>
      </div>
      <div class="xp-row">
        <div class="xp-top"><span>Progression</span><span id="xp-text">0 / 4</span></div>
        <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
      </div>
    </section>

    <div id="results" class="results">
      <div class="trophy">&#127942;</div>
      <h2>Tous les exercices terminés&nbsp;!</h2>
      <div class="rscore" id="r-score"></div>
      <div class="stars" id="r-stars"></div>
      <p class="rmsg" id="r-msg"></p>
      <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer</button>
    </div>

    <main id="exoList"></main>

    <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer tous les exercices</button>
  </div>

<script>
/* ============================================================
   PAZAPA — N3S4J2 — Aires, solides et volumes
   ============================================================ */
const TOTAL = 4;
const rint = n => Math.floor(Math.random()*n);
const pick = a => a[rint(a.length)];
const coin = () => Math.random() < 0.5;

let exos = [];
let state = [];

/* ===== Bibliothèque SVG : solides (perspective cavalière) ===== */
const SK = '#c0392b';                 /* trait visible */
const SH = '#d98880';                 /* trait caché */
const SF = 'rgba(249,192,187,0.42)';  /* remplissage face */
function L(p,q,d){ return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${d?SH:SK}" stroke-width="${d?1.6:2.4}" ${d?'stroke-dasharray="5 4"':''} stroke-linecap="round"/>`; }
function PG(pts){ return `<polygon points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="${SF}" stroke="none"/>`; }
function TX(x,y,t,col,sz){ return `<text x="${x}" y="${y}" font-family="JetBrains Mono, monospace" font-size="${sz||13}" font-weight="700" fill="${col||'#2c2418'}" text-anchor="middle">${t}</text>`; }

/* boîte (cube / pavé droit). dims = {w,h,d} labels ou null.
   Mesuré depuis la face avant-bas (baseline) vers le haut pour que les cotes tiennent. */
function svgBox(w,h,dep,dims){
  const by=182, ox=dep, oy=dep;
  const X = 58;
  const BL={x:X,y:by}, BR={x:X+w,y:by}, TR={x:X+w,y:by-h}, TL={x:X,y:by-h};
  const TLb={x:X+ox,y:by-h-oy}, TRb={x:X+w+ox,y:by-h-oy}, BRb={x:X+w+ox,y:by-oy}, BLb={x:X+ox,y:by-oy};
  let s='';
  s+=PG([TL,TR,BR,BL])+PG([TL,TR,TRb,TLb])+PG([TR,BR,BRb,TRb]);
  s+=L(BL,BLb,1)+L(BLb,TLb,1)+L(BLb,BRb,1);
  s+=L(TL,TR)+L(TR,BR)+L(BR,BL)+L(BL,TL)+L(TL,TLb)+L(TR,TRb)+L(BR,BRb)+L(TLb,TRb)+L(TRb,BRb);
  if(dims){
    if(dims.w) s+=TX((BL.x+BR.x)/2, by+20, dims.w);
    if(dims.h) s+=TX(BR.x+22, (TR.y+BR.y)/2+4, dims.h);
    if(dims.d) s+=TX((TR.x+TRb.x)/2+14, (TR.y+TRb.y)/2-3, dims.d);
  }
  return s;
}
function svgCyl(rx,ry,ht,dims){
  const cx=120, topY=44, botY=44+ht;
  let s='';
  s+=`<path d="M ${cx-rx} ${topY} A ${rx} ${ry} 0 0 0 ${cx+rx} ${topY} L ${cx+rx} ${botY} A ${rx} ${ry} 0 0 1 ${cx-rx} ${botY} Z" fill="${SF}" stroke="none"/>`;
  s+=`<ellipse cx="${cx}" cy="${topY}" rx="${rx}" ry="${ry}" fill="${SF}" stroke="none"/>`;
  s+=`<path d="M ${cx-rx} ${botY} A ${rx} ${ry} 0 0 1 ${cx+rx} ${botY}" fill="none" stroke="${SH}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  s+=`<path d="M ${cx-rx} ${botY} A ${rx} ${ry} 0 0 0 ${cx+rx} ${botY}" fill="none" stroke="${SK}" stroke-width="2.4"/>`;
  s+=L({x:cx-rx,y:topY},{x:cx-rx,y:botY})+L({x:cx+rx,y:topY},{x:cx+rx,y:botY});
  s+=`<ellipse cx="${cx}" cy="${topY}" rx="${rx}" ry="${ry}" fill="none" stroke="${SK}" stroke-width="2.4"/>`;
  if(dims){
    if(dims.r){ s+=`<line x1="${cx}" y1="${topY}" x2="${cx+rx}" y2="${topY}" stroke="${SK}" stroke-width="1.5"/>`; s+=TX(cx+rx/2, topY-ry-6, dims.r); }
    if(dims.h) s+=TX(cx+rx+22,(topY+botY)/2+4, dims.h);
  }
  return s;
}
function svgCone(rx,ry,ht){
  const cx=120, baseY=44+ht, apexY=40;
  let s='';
  s+=`<path d="M ${cx-rx} ${baseY} L ${cx} ${apexY} L ${cx+rx} ${baseY} A ${rx} ${ry} 0 0 1 ${cx-rx} ${baseY} Z" fill="${SF}" stroke="none"/>`;
  s+=`<path d="M ${cx-rx} ${baseY} A ${rx} ${ry} 0 0 1 ${cx+rx} ${baseY}" fill="none" stroke="${SH}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  s+=`<path d="M ${cx-rx} ${baseY} A ${rx} ${ry} 0 0 0 ${cx+rx} ${baseY}" fill="none" stroke="${SK}" stroke-width="2.4"/>`;
  s+=L({x:cx-rx,y:baseY},{x:cx,y:apexY})+L({x:cx+rx,y:baseY},{x:cx,y:apexY});
  return s;
}
function svgPyr(){
  const x=58,by=140,w=96,ox=44,oy=34,topY=36;
  const P1={x,y:by},P2={x:x+w,y:by},P3={x:x+w+ox,y:by-oy},P4={x:x+ox,y:by-oy};
  const S0={x:(P1.x+P3.x)/2, y:topY};
  let s='';
  s+=PG([P1,P2,S0])+PG([P2,P3,S0]);
  s+=L(P1,P4,1)+L(P4,P3,1)+L(P4,S0,1);
  s+=L(P1,P2)+L(P2,P3)+L(P1,S0)+L(P2,S0)+L(P3,S0);
  return s;
}
function svgPrism(){
  const x=50,by=142,w=98,ox=46,oy=34,ht=82;
  const Q1={x,y:by},Q2={x:x+w,y:by},Q3={x:x+w*0.45+ox,y:by-oy};
  const Q1t={x:Q1.x,y:Q1.y-ht},Q2t={x:Q2.x,y:Q2.y-ht},Q3t={x:Q3.x,y:Q3.y-ht};
  let s='';
  s+=PG([Q1,Q2,Q2t,Q1t])+PG([Q2,Q3,Q3t,Q2t])+PG([Q1t,Q2t,Q3t]);
  s+=L(Q1,Q3,1)+L(Q2,Q3,1)+L(Q3,Q3t,1);
  s+=L(Q1,Q2)+L(Q1,Q1t)+L(Q2,Q2t)+L(Q1t,Q2t)+L(Q2t,Q3t)+L(Q3t,Q1t);
  return s;
}
function svgBoule(){
  const cx=120,cy=104,r=60;
  let s='';
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${SF}" stroke="${SK}" stroke-width="2.4"/>`;
  s+=`<path d="M ${cx-r} ${cy} A ${r} ${r*0.28} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${SH}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  s+=`<path d="M ${cx-r} ${cy} A ${r} ${r*0.28} 0 0 0 ${cx+r} ${cy}" fill="none" stroke="${SK}" stroke-width="2.4"/>`;
  return s;
}
function wrapSvg(inner){ return `<svg viewBox="0 0 240 210" role="img" aria-label="figure">${inner}</svg>`; }

/* ===== Bibliothèque SVG : figures planes (aires) ===== */
function svgSquare(c){
  const x=70,y=46,s=110;
  let g='';
  g+=`<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="${SF}" stroke="${SK}" stroke-width="2.4" rx="2"/>`;
  g+=TX(x+s/2, y+s+22, c+' cm');
  g+=TX(x-18, y+s/2+4, c+' cm');
  return wrapSvg2(g);
}
function svgRect(Ln,ln){
  const x=44,y=58,w=152,h=86;
  let g='';
  g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${SF}" stroke="${SK}" stroke-width="2.4" rx="2"/>`;
  g+=TX(x+w/2, y+h+22, Ln+' cm');
  g+=TX(x-20, y+h/2+4, ln+' cm');
  return wrapSvg2(g);
}
function svgTri(b,h){
  /* triangle rectangle pour montrer base et hauteur clairement */
  const x=88,baseY=152,w=122,top=48;
  const A={x,y:baseY},B={x:x+w,y:baseY},C={x,y:top};
  let g='';
  g+=`<polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" fill="${SF}" stroke="${SK}" stroke-width="2.4" stroke-linejoin="round"/>`;
  /* petit carré d'angle droit en A */
  g+=`<polygon points="${A.x},${A.y} ${A.x+14},${A.y} ${A.x+14},${A.y-14} ${A.x},${A.y-14}" fill="none" stroke="${SK}" stroke-width="1.6"/>`;
  g+=TX((A.x+B.x)/2, baseY+22, 'base '+b+' cm');
  g+=`<text x="${x-12}" y="${(baseY+top)/2+4}" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#2c2418" text-anchor="end">${h}</text>`;
  return wrapSvg2(g);
}
function svgDisk(r){
  const cx=120,cy=100,rad=70;
  let g='';
  g+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${SF}" stroke="${SK}" stroke-width="2.4"/>`;
  g+=`<line x1="${cx}" y1="${cy}" x2="${cx+rad}" y2="${cy}" stroke="${SK}" stroke-width="1.8"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="3" fill="${SK}"/>`;
  g+=TX(cx+rad/2, cy-8, r+' cm');
  return wrapSvg2(g);
}
function wrapSvg2(inner){ return `<svg viewBox="0 0 240 190" role="img" aria-label="figure">${inner}</svg>`; }

/* ============================================================
   Générateurs d'exercices
   ============================================================ */

const SOLIDES = [
  {nom:'Cube',         draw:()=>svgBox(96,96,40)},
  {nom:'Pavé droit',   draw:()=>svgBox(124,72,40)},
  {nom:'Cylindre',     draw:()=>svgCyl(52,17,100)},
  {nom:'Cône',         draw:()=>svgCone(56,18,104)},
  {nom:'Pyramide',     draw:()=>svgPyr()},
  {nom:'Prisme droit', draw:()=>svgPrism()},
  {nom:'Boule',        draw:()=>svgBoule()},
];

/* Ex1 : reconnaître un solide (QCM 4 choix) */
function genReconnaitre(){
  const idx = rint(SOLIDES.length);
  const bon = SOLIDES[idx];
  /* 3 distracteurs */
  const autres = SOLIDES.filter((_,i)=>i!==idx).map(s=>s.nom);
  const distract = [];
  while(distract.length<3){ const c=pick(autres); if(!distract.includes(c)) distract.push(c); }
  let choix = [bon.nom, ...distract];
  /* mélange */
  for(let i=choix.length-1;i>0;i--){ const j=rint(i+1); [choix[i],choix[j]]=[choix[j],choix[i]]; }
  return {
    type:'qcm', choices:choix, answer:bon.nom,
    title:'Reconnaître un solide',
    question:`Observe le solide ci-dessous. <b>Comment s\u2019appelle-t-il&nbsp;?</b>`,
    figure: wrapSvg(bon.draw()),
    solution:`Ce solide est un <b>${bon.nom.toLowerCase()}</b>. On le reconnaît à la forme de ses faces et de ses arêtes (les arêtes cachées sont en pointillés).`
  };
}

/* Ex2 : calculer une aire (calcul mental) */
function genAire(){
  const kind = pick(['carre','rect','tri','disque']);
  if(kind==='carre'){
    const c = 2+rint(11);
    return { type:'input', unit:'cm²', answer:c*c, title:'Aire d\u2019un carré',
      question:`Calcule l\u2019aire de ce carré de côté <b>${c} cm</b>.`,
      figure:svgSquare(c),
      solution:`Aire d\u2019un carré = côté × côté.<br>Aire = ${c} × ${c} = <b>${c*c} cm²</b>.` };
  }
  if(kind==='rect'){
    let Ln=3+rint(10), ln=2+rint(8);
    if(ln>Ln){ const t=Ln; Ln=ln; ln=t; }
    return { type:'input', unit:'cm²', answer:Ln*ln, title:'Aire d\u2019un rectangle',
      question:`Calcule l\u2019aire de ce rectangle de longueur <b>${Ln} cm</b> et de largeur <b>${ln} cm</b>.`,
      figure:svgRect(Ln,ln),
      solution:`Aire d\u2019un rectangle = Longueur × largeur.<br>Aire = ${Ln} × ${ln} = <b>${Ln*ln} cm²</b>.` };
  }
  if(kind==='tri'){
    let b,h;
    do{ b=4+rint(9); h=2+rint(9); }while((b*h)%2!==0);
    return { type:'input', unit:'cm²', answer:(b*h)/2, title:'Aire d\u2019un triangle',
      question:`Calcule l\u2019aire de ce triangle de base <b>${b} cm</b> et de hauteur <b>${h} cm</b>.`,
      figure:svgTri(b, h+' cm'),
      solution:`Aire d\u2019un triangle = (base × hauteur) ÷ 2.<br>Aire = (${b} × ${h}) ÷ 2 = ${b*h} ÷ 2 = <b>${(b*h)/2} cm²</b>.` };
  }
  /* disque : réponse = coefficient devant π */
  const r = 2+rint(9);
  return { type:'input', unit:'× π cm²', answer:r*r, title:'Aire d\u2019un disque',
    question:`Calcule l\u2019aire de ce disque de rayon <b>${r} cm</b>. L\u2019aire s\u2019écrit sous la forme <b>(nombre) × π</b>. Écris seulement le <b>nombre</b> devant π.`,
    figure:svgDisk(r),
    hint:'Aire d\u2019un disque = π × rayon × rayon.',
    solution:`Aire d\u2019un disque = π × rayon² = π × ${r}² = π × ${r*r}.<br>L\u2019aire est donc <b>${r*r} × π cm²</b> → on écrit <b>${r*r}</b>.` };
}

/* Ex3 : calculer un volume */
function genVolume(){
  const kind = pick(['cube','pave','cyl','pyr']);
  if(kind==='cube'){
    const a = 2+rint(5);
    return { type:'input', unit:'cm³', answer:a*a*a, title:'Volume d\u2019un cube',
      question:`Calcule le volume de ce cube d\u2019arête <b>${a} cm</b>.`,
      figure:wrapSvg(svgBox(96,96,40,{w:a+' cm'})),
      solution:`Volume d\u2019un cube = arête³.<br>V = ${a} × ${a} × ${a} = <b>${a*a*a} cm³</b>.` };
  }
  if(kind==='pave'){
    const Ln=2+rint(7), ln=2+rint(5), h=2+rint(5);
    return { type:'input', unit:'cm³', answer:Ln*ln*h, title:'Volume d\u2019un pavé droit',
      question:`Calcule le volume de ce pavé droit de dimensions <b>${Ln} cm</b>, <b>${ln} cm</b> et <b>${h} cm</b>.`,
      figure:wrapSvg(svgBox(124,72,42,{w:Ln+' cm', h:h+' cm', d:ln+' cm'})),
      solution:`Volume d\u2019un pavé droit = Longueur × largeur × hauteur.<br>V = ${Ln} × ${ln} × ${h} = <b>${Ln*ln*h} cm³</b>.` };
  }
  if(kind==='cyl'){
    const r=2+rint(5), h=2+rint(7);
    return { type:'input', unit:'× π cm³', answer:r*r*h, title:'Volume d\u2019un cylindre',
      question:`Calcule le volume de ce cylindre de rayon <b>${r} cm</b> et de hauteur <b>${h} cm</b>. Le volume s\u2019écrit <b>(nombre) × π</b>. Écris seulement le <b>nombre</b> devant π.`,
      figure:wrapSvg(svgCyl(48,16,104,{r:r+' cm', h:h+' cm'})),
      hint:'Volume d\u2019un cylindre = π × rayon² × hauteur.',
      solution:`Volume = π × rayon² × hauteur = π × ${r}² × ${h} = π × ${r*r} × ${h} = π × ${r*r*h}.<br>Le volume est <b>${r*r*h} × π cm³</b> → on écrit <b>${r*r*h}</b>.` };
  }
  /* pyramide base carrée : V = côté² × h / 3 */
  let c,h;
  do{ c=2+rint(7); h=2+rint(8); }while((c*c*h)%3!==0);
  return { type:'input', unit:'cm³', answer:(c*c*h)/3, title:'Volume d\u2019une pyramide',
    question:`Calcule le volume de cette pyramide à base carrée de côté <b>${c} cm</b> et de hauteur <b>${h} cm</b>.`,
    figure:wrapSvg(svgPyr()),
    hint:'Volume d\u2019une pyramide = (aire de la base × hauteur) ÷ 3.',
    solution:`Aire de la base carrée = ${c} × ${c} = ${c*c} cm².<br>Volume = (aire base × hauteur) ÷ 3 = (${c*c} × ${h}) ÷ 3 = ${c*c*h} ÷ 3 = <b>${(c*c*h)/3} cm³</b>.` };
}

/* Ex4 : application concrète */
function genApplication(){
  if(coin()){
    /* aquarium en pavé droit, dimensions en dm -> litres (1 dm³ = 1 L) */
    const a=2+rint(8), b=2+rint(8), c=2+rint(6);
    return { type:'input', unit:'L', answer:a*b*c, title:'Application — l\u2019aquarium',
      question:`Un aquarium a la forme d\u2019un pavé droit. Il mesure <b>${a} dm</b> de long, <b>${b} dm</b> de large et <b>${c} dm</b> de haut. Combien de <b>litres</b> d\u2019eau peut-il contenir au maximum&nbsp;? <br><span class="hint">Rappel&nbsp;: 1 dm³ = 1 litre.</span>`,
      figure:wrapSvg(svgBox(124,72,42,{w:a+' dm', h:c+' dm', d:b+' dm'})),
      solution:`Volume = ${a} × ${b} × ${c} = ${a*b*c} dm³.<br>Comme 1 dm³ = 1 litre, l\u2019aquarium contient <b>${a*b*c} litres</b>.` };
  } else {
    /* pot cylindrique (pâtisserie/sciences) -> volume en fonction de π */
    const r=2+rint(5), h=2+rint(7);
    return { type:'input', unit:'× π cm³', answer:r*r*h, title:'Application — le pot',
      question:`Une pâtissière range sa farine dans un pot en forme de cylindre de rayon <b>${r} cm</b> et de hauteur <b>${h} cm</b>. Quel est le <b>volume</b> du pot&nbsp;? Le volume s\u2019écrit <b>(nombre) × π</b>. Écris seulement le <b>nombre</b> devant π.`,
      figure:wrapSvg(svgCyl(48,16,104,{r:r+' cm', h:h+' cm'})),
      hint:'Volume d\u2019un cylindre = π × rayon² × hauteur.',
      solution:`Volume = π × rayon² × hauteur = π × ${r}² × ${h} = π × ${r*r*h}.<br>Le volume du pot est <b>${r*r*h} × π cm³</b> → on écrit <b>${r*r*h}</b>.` };
  }
}

const GENERATORS = [genReconnaitre, genAire, genVolume, genApplication];

/* ============================================================
   Rendu
   ============================================================ */
function generateAll(){
  exos = GENERATORS.map(g => g());
  state = exos.map(()=>({correct:false, errors:0}));
  document.getElementById('results').classList.remove('show');
  const root = document.getElementById('exoList');
  root.innerHTML = '';
  exos.forEach((ex, i) => root.appendChild(buildCard(ex, i)));
  updateScore();
  window.__exos = exos;
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildCard(ex, i){
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-'+i;

  let inputHTML;
  if(ex.type === 'input'){
    inputHTML = `
      <div class="answer-row">
        <input class="num-input" id="in-${i}" type="number" inputmode="numeric" placeholder="?" aria-label="ta réponse">
        <span class="unit-tag">${ex.unit}</span>
      </div>
      ${ex.hint ? `<div class="hint">&#128161; ${ex.hint}</div>` : ''}
      <div class="actions" id="act-${i}">
        <button class="btn btn-check" id="chk-${i}">Vérifier</button>
      </div>`;
  } else {
    const opts = ex.choices.map(c=>`<button class="qcm-btn" data-val="${c}" data-i="${i}">${c}</button>`).join('');
    inputHTML = `<div class="qcm">${opts}</div><div class="actions" id="act-${i}"></div>`;
  }

  card.innerHTML = `
    <div class="card-head">
      <div class="badge-num">${i+1}</div>
      <div class="ctitle">${ex.title}</div>
      <div class="check-mark">&#10004;</div>
    </div>
    <p class="question">${ex.question}</p>
    ${ex.figure ? `<div class="figure">${ex.figure}</div>` : ''}
    ${inputHTML}
    <div class="feedback" id="fb-${i}"></div>
    <div class="solution" id="sol-${i}">${ex.solution}</div>`;

  setTimeout(()=>{
    if(ex.type === 'input'){
      card.querySelector('#chk-'+i).addEventListener('click', ()=>checkInput(i));
      card.querySelector('#in-'+i).addEventListener('keydown', e=>{ if(e.key==='Enter') checkInput(i); });
    } else {
      card.querySelectorAll('.qcm-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>checkQcm(i, btn.dataset.val));
      });
    }
  },0);

  return card;
}

function checkInput(i){
  if(state[i].correct) return;
  const inp = document.getElementById('in-'+i);
  const raw = inp.value.trim().replace(',', '.');
  const fb = document.getElementById('fb-'+i);
  if(raw === ''){ flash(fb,'bad','Écris d\u2019abord ta réponse.'); return; }
  const val = Number(raw);
  if(Number.isNaN(val)){ flash(fb,'bad','Écris un nombre.'); return; }
  if(Math.abs(val - exos[i].answer) < 1e-9){ markCorrect(i); } else { markError(i); }
}

function checkQcm(i, val){
  if(state[i].correct) return;
  const card = document.getElementById('card-'+i);
  card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.toggle('picked', b.dataset.val===val));
  if(val === exos[i].answer){ markCorrect(i); } else { markError(i); }
}

function markError(i){
  state[i].errors++;
  const card = document.getElementById('card-'+i);
  card.classList.add('is-error');
  flash(document.getElementById('fb-'+i),'bad','Pas encore… reprends la figure et ta formule, puis réessaie.');
  const act = document.getElementById('act-'+i);
  if(!act.querySelector('.btn-retry')){
    const r = document.createElement('button');
    r.className = 'btn btn-retry';
    r.innerHTML = '&#8635; Réessayer';
    r.addEventListener('click', ()=>retry(i));
    act.appendChild(r);
  }
  updateScore();
}

function retry(i){
  const card = document.getElementById('card-'+i);
  card.classList.remove('is-error');
  document.getElementById('fb-'+i).classList.remove('show');
  if(exos[i].type === 'input'){
    const inp = document.getElementById('in-'+i); inp.value=''; inp.focus();
  } else {
    card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.remove('picked'));
  }
  const r = document.getElementById('act-'+i).querySelector('.btn-retry');
  if(r) r.remove();
}

function markCorrect(i){
  state[i].correct = true;
  const card = document.getElementById('card-'+i);
  card.classList.remove('is-error');
  card.classList.add('is-correct');
  flash(document.getElementById('fb-'+i),'ok','Bravo, c\u2019est juste&nbsp;!');
  document.getElementById('sol-'+i).classList.add('show');
  const act = document.getElementById('act-'+i);
  act.classList.add('locked');
  if(exos[i].type === 'input'){
    const inp = document.getElementById('in-'+i); inp.disabled=true; inp.classList.add('locked');
  } else {
    card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.add('locked'));
  }
  updateScore();
  checkFinished();
}

function flash(el, kind, msg){ el.className = 'feedback show ' + kind; el.innerHTML = msg; }

function updateScore(){
  const ok = state.filter(s=>s.correct).length;
  const err = state.reduce((a,s)=>a+s.errors,0);
  document.getElementById('s-ok').textContent = ok;
  document.getElementById('s-left').textContent = TOTAL - ok;
  document.getElementById('s-err').textContent = err;
  document.getElementById('xp-text').textContent = ok + ' / ' + TOTAL;
  document.getElementById('xp-fill').style.width = (100*ok/TOTAL) + '%';
}

function checkFinished(){
  if(state.every(s=>s.correct)){
    const err = state.reduce((a,s)=>a+s.errors,0);
    let stars = 3;
    if(err>=1 && err<=2) stars=2;
    if(err>=3) stars=1;
    document.getElementById('r-score').textContent = `${TOTAL} / ${TOTAL} réussis · ${err} erreur${err>1?'s':''}`;
    let starHTML='';
    for(let k=0;k<3;k++) starHTML += `<span class="${k<stars?'star-on':'star-off'}">&#9733;</span>`;
    document.getElementById('r-stars').innerHTML = starHTML;
    document.getElementById('r-msg').textContent =
      'Personne ne réussit tout du premier coup — l\u2019important, c\u2019est d\u2019avoir cherché et compris. Tu peux recommencer avec de nouvelles figures.';
    const res = document.getElementById('results');
    res.classList.add('show');
    setTimeout(()=>res.scrollIntoView({behavior:'smooth', block:'center'}), 250);
  }
}

generateAll();
</script>
