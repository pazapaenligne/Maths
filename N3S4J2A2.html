<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PAZAPA Maths — 3e S4J2 · Exercices interactifs</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--jour:#b94040;--jour-fonce:#7a1f1f;--jour-soft:#f7eded;--jour-accent:#dba0a0;--bord:#ece8dd;--gris:#8a8f9a;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}
body{background:#fffdf7;color:#23262d;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.6rem 1rem 4rem;position:relative;}
.bubble{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(1px);}
.bubble1{width:280px;height:280px;top:-60px;right:-60px;background:#f5e08a;opacity:.35;}
.bubble2{width:220px;height:220px;bottom:-50px;left:-50px;background:#dba0a0;opacity:.30;}
.bubble3{width:180px;height:180px;top:35%;right:-60px;background:#b5e08a;opacity:.22;}
.bubble4{width:160px;height:160px;top:50%;left:-55px;background:#f9c0bb;opacity:.22;}
.hero{text-align:center;position:relative;z-index:1;margin-bottom:1.5rem;max-width:720px;}
.pazapa-badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #e8e0d0;border-radius:99px;padding:.28rem .9rem;margin-bottom:.65rem;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#555;}
.pazapa-badge .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.dot1{background:#f5a623;}.dot2{background:#8dc63f;}.dot3{background:#3ab5d8;}
.badge-semaine{display:inline-block;background:var(--jour-soft);border:2px solid var(--jour);color:#5a1414;font-weight:800;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;padding:.35rem 1rem;border-radius:99px;margin-bottom:.9rem;}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:var(--jour-fonce);line-height:1.25;margin-bottom:.5rem;}
.consigne{max-width:560px;margin:0 auto;border:2px dashed var(--jour);background:var(--jour-soft);color:var(--jour-fonce);border-radius:14px;padding:.7rem 1rem;font-size:.9rem;font-weight:600;line-height:1.8;}
.zone{position:relative;z-index:1;width:100%;max-width:680px;}
.zone-note{text-align:center;font-size:.8rem;color:var(--gris);margin-top:.5rem;line-height:1.7;}
</style>
</head>
<body>
<div class="bubble bubble1"></div><div class="bubble bubble2"></div>
<div class="bubble bubble3"></div><div class="bubble bubble4"></div>
<header class="hero">
  <div class="pazapa-badge">
    <span class="dot dot1"></span><span class="dot dot2"></span><span class="dot dot3"></span>
    Pazapa &nbsp;·&nbsp; 3e &nbsp;·&nbsp; Mathématiques
  </div>
  <div class="badge-semaine">Semaine 4 · Jour 2</div>
  <h1>✏️ Exercices interactifs</h1>
  <div class="consigne">👉 Fais les activités directement dans la fenêtre. Clique sur « Vérifier » pour valider tes réponses.</div>
</header>
<div class="zone">
  <div style="width:100%;background:#fff;border:2px solid var(--bord);border-radius:16px;overflow:hidden;margin:0 auto 1.4rem;box-shadow:0 4px 20px rgba(0,0,0,.05);position:relative;z-index:1;">
    <div style="width:100%;height:1090px;overflow:hidden;position:relative;">
      <iframe style="border:0;width:100%;height:1150px;display:block;background:#fff;"
        title="Exercice interactif"
        src="https://coopmaths.fr/alea/?uuid=051aa&alea=8381&interactif=1&n=5&duration=10&s=8&s2=true&cd=1&tip=0&i=1&v=eleve&title=&es=011010&recorder=moodle"
        allowfullscreen="allowfullscreen" loading="lazy"></iframe>
      <div style="position:absolute;top:0;left:0;right:0;height:105px;background:#fff;z-index:9999;pointer-events:none;"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;height:25px;background:#fff;z-index:9999;pointer-events:none;"></div>
    </div>
  </div>
  <div style="width:100%;background:#fff;border:2px solid var(--bord);border-radius:16px;overflow:hidden;margin:0 auto 1.4rem;box-shadow:0 4px 20px rgba(0,0,0,.05);position:relative;z-index:1;">
    <div style="width:100%;height:1090px;overflow:hidden;position:relative;">
      <iframe style="border:0;width:100%;height:1150px;display:block;background:#fff;"
        title="Exercice interactif"
        src="https://coopmaths.fr/alea/?uuid=9e8f9&alea=41593&interactif=1&n=3&duration=10&s=1-2-3&cd=1&tip=0&i=1&v=eleve&title=&es=011010&recorder=moodle"
        allowfullscreen="allowfullscreen" loading="lazy"></iframe>
      <div style="position:absolute;top:0;left:0;right:0;height:105px;background:#fff;z-index:9999;pointer-events:none;"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;height:25px;background:#fff;z-index:9999;pointer-events:none;"></div>
    </div>
  </div>
  <div style="width:100%;background:#fff;border:2px solid var(--bord);border-radius:16px;overflow:hidden;margin:0 auto 1.4rem;box-shadow:0 4px 20px rgba(0,0,0,.05);position:relative;z-index:1;">
    <div style="width:100%;height:1090px;overflow:hidden;position:relative;">
      <iframe style="border:0;width:100%;height:1150px;display:block;background:#fff;"
        title="Exercice interactif"
        src="https://coopmaths.fr/alea/?uuid=acb80&alea=2652&interactif=1&n=1&duration=10&s=2&s2=true&s3=1&s4=8&cd=1&tip=0&i=1&v=eleve&title=&es=011010&recorder=moodle"
        allowfullscreen="allowfullscreen" loading="lazy"></iframe>
      <div style="position:absolute;top:0;left:0;right:0;height:105px;background:#fff;z-index:9999;pointer-events:none;"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;height:25px;background:#fff;z-index:9999;pointer-events:none;"></div>
    </div>
  </div>
  <p class="zone-note">Si un exercice ne s'affiche pas, recharge la page ou ouvre-le dans un nouvel onglet.</p>
</div>
</body>
</html>
