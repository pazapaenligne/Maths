<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – [TITRE]</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══════════════════════════════════════════════════
       ★ SEULE ZONE À MODIFIER : COULEUR DU JOUR
       ═══════════════════════════════════════════════════
       Lundi    → #f5a623 / #c47a10 / #fff5e0 / #f5d080 / rgba(245,166,35,.3)
       Mardi    → #f28b82 / #c0392b / #fff0ef / #f9c0bb / rgba(242,139,130,.3)
       Mercredi → #8dc63f / #3d7a10 / #f0faeb / #b5e08a / rgba(141,198,63,.3)
       Jeudi    → #3ab5d8 / #1a6e88 / #e8f6fb / #9dd4e8 / rgba(58,181,216,.3)
       Vendredi → #f5c518 / #8a6000 / #fffbeb / #f5e08a / rgba(245,197,24,.3)
    ═══════════════════════════════════════════════════ */
    :root {
      --day-color:  #f5c518;              /* couleur principale */
      --day-dark:   #8a6000;              /* texte sur fond clair */
      --day-light:  #fffbeb;              /* fond des blocs */
      --day-border: #f5e08a;              /* bordures */
      --day-glow:   rgba(245,197,24,.3);  /* ombre boutons */
    }

    /* ═══════════════════════════════════════════════════
       CHARTE PAZAPA — NE PAS TOUCHER
    ═══════════════════════════════════════════════════ */
    :root {
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg); color:var(--text);
      font-family:Arial,sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; padding:2rem 1rem 4rem;
      position:relative; overflow-x:hidden;
      letter-spacing:.02em; word-spacing:.06em;
    }

    /* Fond décoratif — identique tous les jours */
    body::before{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:340px; height:340px;
      background:var(--yellow); top:-80px; right:-80px;
      pointer-events:none;
    }
    body::after{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:260px; height:260px;
      background:var(--blue); bottom:-60px; left:-60px;
      pointer-events:none;
    }
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:180px;height:180px;background:var(--blue);
      bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:120px;height:120px;background:var(--yellow);
      top:200px;left:-30px;pointer-events:none;}

    /* Header */
    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{
      display:inline-flex;align-items:center;gap:.5rem;
      background:var(--yellow);color:#000;
      font-size:.78rem;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;padding:.3rem .9rem;
      border-radius:99px;margin-bottom:.5rem;
    }
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;color:var(--muted);margin-bottom:.5rem;
    }
    h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
    h1 .hl{color:var(--day-color);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;
      font-family:'JetBrains Mono',monospace;}

    /* Progression */
    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;
      position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;
      font-size:.78rem;color:var(--muted);
      font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;
      height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;
      background:linear-gradient(90deg,var(--day-color),var(--yellow));
      border-radius:99px;transition:width .5s ease;}

    /* Chips */
    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;
      flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;
      border-radius:99px;font-size:.8rem;
      font-family:'JetBrains Mono',monospace;
      border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong   .dot{background:var(--pink);}
    .chip.remaining .dot{background:var(--muted);}

    /* Card */
    .card{width:100%;max-width:680px;background:var(--surface);
      border:2px solid var(--border);border-radius:var(--radius);
      padding:2rem 2rem 1.6rem;position:relative;z-index:1;
      box-shadow:0 4px 20px rgba(0,0,0,.06);
      animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}

    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;
      color:var(--muted);margin-bottom:.5rem;
      text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;
      padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;
      letter-spacing:.08em;margin-bottom:.7rem;
      background:var(--day-light);color:var(--day-dark);
      border:1.5px solid var(--day-border);}

    /* Équation */
    .eq-box{background:var(--day-light);border:2px solid var(--day-border);
      border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;
      font-family:'JetBrains Mono',monospace;
      font-size:clamp(1.2rem,3vw,1.8rem);
      font-weight:700;color:var(--day-dark);text-align:center;}

    .q-text{font-size:.9rem;color:var(--muted);
      margin-bottom:.8rem;line-height:1.8;}

    /* Méthode */
    .method-box{display:none;background:var(--day-light);
      border:1.5px solid var(--day-border);
      border-left:4px solid var(--day-color);
      border-radius:8px;padding:.75rem 1rem;margin-bottom:1.2rem;
      font-size:.84rem;font-family:'JetBrains Mono',monospace;
      color:var(--day-dark);line-height:1.8;}
    .method-box strong{color:var(--day-color);}
    .method-box.reveal{display:block;}

    /* Input */
    .input-row{display:flex;align-items:center;gap:.7rem;
      flex-wrap:wrap;position:relative;z-index:2;margin-bottom:.8rem;}
    .input-label{font-family:'JetBrains Mono',monospace;
      font-size:1rem;font-weight:700;}
    .answer-input{width:160px;background:var(--bg);
      border:2px solid var(--border);border-radius:10px;
      color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:1.05rem;padding:.5rem .85rem;outline:none;
      transition:border-color .2s;position:relative;z-index:2;height:2.6rem;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input  {border-color:var(--pink); background:#fff0ef;}

    /* Boutons */
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;
      position:relative;z-index:2;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;
      padding:.6rem 1.3rem;border-radius:10px;
      font-family:Arial,sans-serif;font-size:.92rem;
      font-weight:700;cursor:pointer;border:none;
      transition:transform .12s,box-shadow .15s;
      position:relative;z-index:2;min-height:2.6rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;
      box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);
      box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);
      border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

    /* Indice */
    .hint-box{margin-top:.9rem;background:#fffbeb;
      border:1.5px dashed var(--yellow);border-radius:10px;
      padding:.75rem 1rem;font-size:.85rem;color:#7a6010;
      display:none;line-height:1.8;
      font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}

    /* Feedback */
    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;
      font-size:.9rem;display:none;align-items:flex-start;
      gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink); color:#c0392b;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;
      font-size:.82rem;margin-top:.3rem;line-height:1.8;}

    /* Nav */
    .nav-row{display:flex;justify-content:space-between;
      margin-top:1.4rem;gap:.7rem;position:relative;z-index:2;}

    /* Résultats */
    .results{width:100%;max-width:680px;text-align:center;
      display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:2.5rem 2rem;
      box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;
      line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;
      gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;
      padding:.65rem 1rem;background:var(--bg);
      border:1.5px solid var(--border);border-radius:10px;
      font-family:'JetBrains Mono',monospace;
      font-size:.82rem;line-height:1.6;}
    .recap-item .eq{color:var(--day-color);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}
    .recap-item.ko-item{border-color:#f9c0bb;}


    .hint-btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.55rem 1.1rem;font-family:Arial,sans-serif;font-size:clamp(.95rem,2.5vw,1.05rem);font-weight:800;cursor:pointer;min-height:2.8rem;display:inline-flex;align-items:center;gap:.4rem;transition:transform .12s;}
    .hint-btn:active{transform:scale(.96);}
    .hint-box{margin-top:.7rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:.97rem;color:#7a6010;display:none;line-height:1.75;font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px);}
      to  {opacity:1;transform:translateY(0);}
    }
    .card,.results{animation:fadeUp .4s ease both;}
    @media(max-width:480px){
      .card{padding:1.4rem;}
      .btn{font-size:.85rem;padding:.55rem 1rem;}
    }
  
    #cards{width:100%;max-width:680px;}
    #cards .card{margin:0 auto 1.5rem;padding:1.8rem 1.7rem 1.5rem;}
    .btn-hint{background:var(--orange);color:#fff;}
    .head-card{width:100%;max-width:680px;background:var(--day-light);border:2px solid var(--day-border);border-radius:var(--radius);padding:1.9rem 1.5rem 1.6rem;text-align:center;position:relative;z-index:1;margin-bottom:1.3rem;}
    .head-card .logo-badge{background:var(--day-color);color:#000;font-size:14px;letter-spacing:.09em;}
    .head-card .week-label{color:var(--day-dark);font-size:.95rem;margin:.5rem 0;}
    .head-card h1{line-height:1.25;margin:.2rem 0;}
    .head-card h1 .hl{color:var(--day-dark);font-size:clamp(1.45rem,4.6vw,1.95rem);font-weight:800;display:inline-block;}
    .head-card h1 .lvl{color:var(--text);font-size:clamp(1.55rem,5.2vw,2.2rem);font-weight:900;display:inline-block;margin-top:.15rem;}
    .head-card .subtitle{color:var(--muted);font-size:1.02rem;margin-top:.5rem;}
    .level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;padding:.6rem 1.15rem;border-radius:12px;border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);text-decoration:none;min-height:2.9rem;display:inline-flex;align-items:center;}
    .level-btn.active{background:var(--day-color);color:#000;border-color:var(--day-color);box-shadow:0 3px 10px var(--day-glow);}
    .stats-card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-bottom:1.7rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.05);}
    .stats-row{display:flex;gap:.8rem;}
    .stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);border-radius:12px;padding:.9rem .5rem;text-align:center;}
    .stat-num{font-size:1.7rem;font-weight:800;color:var(--day-dark);font-family:'JetBrains Mono',monospace;line-height:1.1;}
    .stat-label{font-size:.86rem;color:var(--muted);margin-top:.25rem;}
    .prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:1rem;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--orange));border-radius:99px;transition:width .5s ease;}
    .prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;color:var(--muted);margin-top:.6rem;}
    /* exercice : police réduite, expression qui revient à la ligne aux bons endroits */
    .q-text{font-size:.98rem!important;color:var(--day-dark)!important;font-weight:600!important;line-height:1.7!important;margin-bottom:.55rem!important;}
    .eq-box{font-size:clamp(.98rem,2.4vw,1.3rem)!important;line-height:1.9!important;padding:1rem 1.1rem!important;word-spacing:.12em;}
    .input-label{font-size:1.2rem!important;}
    .answer-input{font-size:1.25rem!important;height:3.1rem!important;width:160px!important;}
    .btn{font-size:clamp(1rem,2.8vw,1.12rem)!important;font-weight:800!important;min-height:3.1rem!important;padding:.7rem 1.45rem!important;}
    .method-box{font-size:1rem!important;line-height:1.85!important;padding:.95rem 1.15rem!important;}
    .hint-box{font-size:1rem!important;line-height:1.8!important;}
    .feedback{font-size:clamp(1rem,2.6vw,1.1rem)!important;line-height:1.8!important;}
    .feedback-icon{font-size:1.7rem!important;}
    .results-score{font-size:clamp(3rem,11vw,4.8rem)!important;}
    .stars{font-size:2.2rem!important;}
    .results-msg{font-size:clamp(1.02rem,2.6vw,1.12rem)!important;line-height:1.7!important;}
    .recap-item{font-size:.94rem!important;line-height:1.7!important;}
    body{letter-spacing:.03em;word-spacing:.08em;line-height:1.6;}
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>
  <div class="head-card">
    <div class="logo-badge">
      <span class="logo-dot" style="background:rgba(0,0,0,.25)"></span>
      <span class="logo-dot" style="background:#000"></span>
      PAZAPA &middot; MATHS &middot; 4&Egrave;ME
    </div>
    <div class="week-label">Semaine 2 &ndash; Jour 5</div>
    <h1><span class="hl">&#9999;&#65039; Priorit&eacute;s op&eacute;ratoires</span></h1>
    <p class="subtitle">Priorit&eacute;s op&eacute;ratoires &middot; calculs imbriqu&eacute;s</p>
    <div class="level-row"><span class="level-btn">Niveau 1</span><span class="level-btn">Niveau 2</span><span class="level-btn active">Niveau 3</span></div>
  </div>

  <div class="stats-card">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="st-ok">0</div><div class="stat-label">R&eacute;ussies</div></div>
      <div class="stat-box"><div class="stat-num" id="st-rem">7</div><div class="stat-label">Restantes</div></div>
      <div class="stat-box"><div class="stat-num" id="st-err">0</div><div class="stat-label">Échouées</div></div>
    </div>
    <div class="prog-bg"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
    <div class="prog-text" id="prog-text">0 / 7</div>
  </div>

  <div id="cards"></div>

  <section class="results" id="results">
    <div class="results-card">
      <div class="q-num">R&eacute;sultats</div>
      <div class="results-score"><span class="s-num" id="res-score">0 / 7</span></div>
      <div class="stars" id="stars"></div>
      <p class="results-msg" id="res-msg"></p>
      <div class="recap-list" id="recap"></div>
      <button class="btn btn-primary" onclick="restart()">&#8635; Recommencer</button>
    </div>
  </section>

  <script>
  var EXERCISES = [
  { eq:"Calcule A en respectant les priorités : (99 + 4 − (1 + 2)) ÷ (3 × 6 − (11 − 3))", label:"A =", answers:["10"], show:"10", theme:"Calculs imbriqués",
    method:"Parenthèses internes : 1+2=3 et 11−3=8.<br>Haut : 99+4−3=100 ; bas : 18−8=10.<br>100 ÷ 10 = 10", hint:"Calcule les parenthèses les plus internes en premier." },
  { eq:"Calcule A en respectant les priorités : (6 − 3) × (6 − 2) + (6 × 2 + 10 ÷ 2)", label:"A =", answers:["29"], show:"29", theme:"Calculs imbriqués",
    method:"(6−3)×(6−2)=3×4=12.<br>Dernière parenthèse : 6×2+10÷2=12+5=17.<br>12 + 17 = 29", hint:"Dans la dernière parenthèse, × et ÷ d’abord." },
  { eq:"Calcule A en respectant les priorités : 260 ÷ 10 − (17 − 5) + (13 × 11 − 145 ÷ 5)", label:"A =", answers:["128"], show:"128", theme:"Calculs imbriqués",
    method:"260÷10=26 ; (17−5)=12 ; (13×11 − 145÷5)=143−29=114.<br>26 − 12 + 114 = 128", hint:"Dans la parenthèse, fais × et ÷ avant −." },
  { eq:"Calcule A en respectant les priorités : (1 + 1) × (2 + 2) ÷ ((25 − 7) ÷ (15 − 6))", label:"A =", answers:["4"], show:"4", theme:"Calculs imbriqués",
    method:"(1+1)×(2+2)=2×4=8.<br>((25−7)÷(15−6))=18÷9=2.<br>8 ÷ 2 = 4", hint:"Calcule le bloc imbriqué du bas, puis divise." },
  { eq:"Calcule A en respectant les priorités : (40 ÷ (2 + 3)) + (4 × (7 − 2))", label:"A =", answers:["28"], show:"28", theme:"Calculs imbriqués",
    method:"40÷(2+3)=40÷5=8.<br>4×(7−2)=4×5=20.<br>8 + 20 = 28", hint:"Parenthèse interne d’abord, puis ÷ ou ×." },
  { eq:"Calcule A en respectant les priorités : ((12 + 8) ÷ 4) × (9 − 3 × 2)", label:"A =", answers:["15"], show:"15", theme:"Calculs imbriqués",
    method:"((12+8)÷4)=20÷4=5.<br>(9−3×2)=9−6=3.<br>5 × 3 = 15", hint:"Dans (9 − 3 × 2), la multiplication passe avant." },
  { eq:"Calcule A en respectant les priorités : (100 − (6 × 7 + 8)) ÷ (5 × (4 − 2))", label:"A =", answers:["5"], show:"5", theme:"Calculs imbriqués",
    method:"(6×7+8)=42+8=50 ; 100−50=50.<br>(5×(4−2))=5×2=10.<br>50 ÷ 10 = 5", hint:"Calcule chaque grande parenthèse, puis divise." }
];
  var TOTAL=EXERCISES.length;
  var state;
  function $(id){return document.getElementById(id);}
  function norm(s){return String(s).toLowerCase().replace(/\s+/g,"").replace(/\u2212/g,"-");}
  function isCorrect(v,ex){if(v===null||v===undefined)return false;if(ex.answers){var n=norm(v);return ex.answers.some(function(a){return norm(a)===n;});}return parseFloat(v)===ex.ans;}
  function showCorr(i){
    $("method"+i).className="method-box reveal";
    $("vc"+i).style.display="none";
  }
  function showHint(i){
    var hb=$("hb"+i),hbox=$("hint"+i);if(!hbox)return;
    hbox.classList.toggle("show");
    if(hb)hb.innerHTML=hbox.classList.contains("show")?"&#128161; Masquer l\u2019indice":"&#128161; Indice";
  }
  function buildCards(){
    state=EXERCISES.map(function(){return{done:false,ok:false,errored:false};});
    var html="";
    for(var i=0;i<TOTAL;i++){var ex=EXERCISES[i];
      var _p=ex.eq.split(" : ");
      var _cons=_p.length>1?(_p[0]+"\u00a0:"):"";
      var _expr=_p.length>1?_p.slice(1).join(" : "):ex.eq;
      html+='<div class="card" id="card'+i+'"><div class="card-stripe"></div>'
        +'<div class="q-num">Question '+(i+1)+' / '+TOTAL+'</div>'
        +'<div class="theme-badge">'+ex.theme+'</div>'
        +(_cons?('<div class="q-text">'+_cons+'</div>'):'')
        +'<div class="eq-box">'+_expr+'</div>'
        +'<div class="method-box" id="method'+i+'">'+ex.method+'</div>'
        +'<div class="input-row"><span class="input-label">'+ex.label+'</span>'
        +'<input type="text" inputmode="numeric" class="answer-input" id="in'+i+'" placeholder="?" autocomplete="off"/></div>'
        +'<div class="btn-row"><button class="btn btn-primary" id="vb'+i+'" onclick="checkOne('+i+')">&#10003; Vérifier</button>'
        +(ex.hint?'<button class="hint-btn" id="hb'+i+'" onclick="showHint('+i+')">&#128161; Indice</button>':'')
        +'</div>'
        +'<div class="hint-box" id="hint'+i+'">'+(ex.hint||'')+'</div>'
        +'<button class="btn" id="vc'+i+'" onclick="showCorr('+i+')" style="display:none;background:var(--pink);color:#fff;margin-top:.4rem;font-size:.9rem;">&#128196; Voir la correction</button>'
+'<div class="feedback" id="fb'+i+'"><span class="feedback-icon" id="fbi'+i+'"></span><div><span id="fbt'+i+'"></span></div></div></div>';}
    $("cards").innerHTML=html;
    for(var j=0;j<TOTAL;j++){(function(k){$("in"+k).addEventListener("keydown",function(e){if(e.key==="Enter")checkOne(k);});})(j);}
  }
  function checkOne(i){
    if(state[i].done)return;
    var raw=$("in"+i).value.trim();if(raw===""){$("in"+i).focus();return;}
    var ex=EXERCISES[i];
    var n=norm(raw);
    var ok=ex.answers.some(function(a){return norm(a)===n;});
    if(ok){
      state[i].done=true;state[i].ok=true;
      $("in"+i).disabled=true;$("vb"+i).disabled=true;
      $("in"+i).className="answer-input correct-input";
      $("method"+i).className="method-box reveal";
      $("fb"+i).className="feedback show ok";$("fbi"+i).textContent="\u2713";
      $("fbt"+i).innerHTML="Bravo, c\u2019est juste\u00a0!";update();
    } else if(!state[i].errored){
      state[i].errored=true;
      $("in"+i).className="answer-input wrong-input";
      $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";
      $("fbt"+i).innerHTML="Pas tout \u00e0 fait \u2014 r\u00e9essaie\u00a0!";
      $("vb"+i).innerHTML="\u21bb R\u00e9essayer";$("vb"+i).setAttribute("onclick","retryOne("+i+")");
    } else {
      state[i].done=true;state[i].ok=false;
      $("in"+i).disabled=true;$("vb"+i).disabled=true;
      $("in"+i).className="answer-input wrong-input";
      $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";
      $("fbt"+i).innerHTML="\u00c9chec.";$("vc"+i).style.display="";update();
    }
  }
  function retryOne(i){
    $("in"+i).value="";$("in"+i).className="answer-input";$("in"+i).focus();
    $("fb"+i).className="feedback";
    $("vb"+i).innerHTML="&#10003; V\u00e9rifier";$("vb"+i).setAttribute("onclick","checkOne("+i+")");
  }
  function update(){
    var done=0,ok=0;for(var i=0;i<TOTAL;i++){if(state[i].done){done++;if(state[i].ok)ok++;}}
    $("st-ok").textContent=ok;$("st-err").textContent=done-ok;$("st-rem").textContent=TOTAL-done;
    $("pfill").style.width=Math.round(done/TOTAL*100)+"%";$("prog-text").textContent=done+" / "+TOTAL;
    if(done===TOTAL)showResults(ok);
  }
  function showResults(ok){
    $("res-score").textContent=ok+" / "+TOTAL;
    var stars=(ok===TOTAL)?5:Math.max(1,Math.round(ok/TOTAL*5));
    var st="";for(var s=0;s<5;s++)st+=(s<stars?"\u2b50":"\u2606");$("stars").textContent=st;
    var err=TOTAL-ok,msg;
    if(err===0)msg="Parfait, sans-faute\u00a0! Tu g\u00e8res les priorit\u00e9s.";
    else if(err<=2)msg="Tr\u00e8s bien\u00a0! Tu as su corriger tes erreurs.";
    else if(err<=4)msg="Bien jou\u00e9. Encore un peu d\u2019entra\u00eenement.";
    else msg="\u00c0 retravailler\u00a0: parenth\u00e8ses, puis \u00d7 et \u00f7, puis + et \u2212.";
    $("res-msg").textContent=msg;
    var rc="";for(var i=0;i<TOTAL;i++){var ex=EXERCISES[i];rc+='<div class="recap-item '+(state[i].ok?"ok-item":"ko-item")+'"><span>'+(state[i].ok?"\u2713":"\u2717")+'</span><span class="eq">A = '+ex.show+'</span></div>';}
    $("recap").innerHTML=rc;$("results").className="results show";$("results").scrollIntoView({behavior:"smooth"});
  }
  function restart(){buildCards();$("results").className="results";update();window.scrollTo({top:0,behavior:"smooth"});}
  buildCards();update();
  </script>
</body>
</html>
