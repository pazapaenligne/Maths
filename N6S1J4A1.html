<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Texte à trous — Les nombres décimaux</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --day-color:  #3ab5d8;
    --day-dark:   #1a6e88;
    --day-light:  #e8f6fb;
    --day-border: #9dd4e8;
    --day-glow:   rgba(58,181,216,.3);
  }
  :root {
    --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
    --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
    --pink:#f28b82; --orange:#f5a623;
    --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:2rem 1rem 4rem;
    position:relative; overflow-x:hidden;
    letter-spacing:.02em; word-spacing:.06em;
  }
  body::before{
    content:''; position:fixed; border-radius:50%; z-index:0;
    opacity:.13; width:340px; height:340px;
    background:var(--yellow); top:-80px; right:-80px;
    pointer-events:none;
  }
  body::after{
    content:''; position:fixed; border-radius:50%; z-index:0;
    opacity:.13; width:260px; height:260px;
    background:var(--day-color); bottom:-60px; left:-60px;
    pointer-events:none;
  }
  .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
    width:180px;height:180px;background:var(--green);
    bottom:120px;right:-40px;pointer-events:none;}
  .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
    width:120px;height:120px;background:var(--pink);
    top:200px;left:-30px;pointer-events:none;}

  header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
  .logo-badge{
    display:inline-flex;align-items:center;gap:.5rem;
    background:var(--yellow);color:#000;
    font-size:.78rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;padding:.3rem .9rem;
    border-radius:99px;margin-bottom:.5rem;
  }
  .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
  h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
  h1 .hl{color:var(--day-color);}
  .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

  .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
  .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
  .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}

  .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;
    flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
  .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;
    border-radius:99px;font-size:.8rem;
    font-family:'JetBrains Mono',monospace;
    border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  .chip.correct .dot{background:var(--green);}
  .chip.wrong   .dot{background:var(--pink);}
  .chip.remaining .dot{background:var(--muted);}

  .card{width:100%;max-width:680px;background:var(--surface);
    border:2px solid var(--border);border-radius:var(--radius);
    padding:2rem 2rem 1.6rem;position:relative;z-index:1;
    box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
    border-radius:var(--radius) var(--radius) 0 0;
    background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}

  .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;
    padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:.7rem;
    background:var(--day-light);color:var(--day-dark);
    border:1.5px solid var(--day-border);}

  .word-bank{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
    margin-bottom:1.2rem;padding:.75rem 1rem;
    background:var(--day-light);border-radius:10px;border:1.5px dashed var(--day-border);}
  .word-bank-label{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;
    color:var(--day-dark);text-transform:uppercase;letter-spacing:.08em;margin-right:.3rem;flex-shrink:0;}
  .word-chip{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:600;
    padding:.3rem .8rem;border-radius:99px;background:var(--surface);color:var(--day-dark);
    border:1.5px solid var(--day-color);transition:opacity .2s,background .2s;user-select:none;}
  .word-chip.used{opacity:.35;text-decoration:line-through;background:var(--border);border-color:var(--border);color:var(--muted);}
  .word-chip.validated-ok{background:#f0faeb;border-color:var(--green);color:#2f6e10;opacity:1;text-decoration:none;}
  .word-chip.validated-ko{background:#fff0ef;border-color:var(--pink);color:#c0392b;opacity:1;text-decoration:none;}

  .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;
    color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}

  .texte-exercice{font-size:.95rem;line-height:2.6;color:var(--text);margin-bottom:1.2rem;}
  .texte-exercice p{margin-bottom:.4rem;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;}
  .puce{color:var(--day-color);font-weight:800;margin-right:.4rem;flex-shrink:0;}

  .blank-wrap{display:inline-flex;align-items:center;margin:0 4px;}
  .blank-input{font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:600;
    color:var(--day-dark);background:var(--bg);
    border:2px solid var(--border);border-radius:8px;
    padding:.3rem .7rem;text-align:center;height:2.6rem;
    outline:none;transition:border-color .2s,background .2s;}
  .blank-input:focus{border-color:var(--day-color);background:#fff;}
  .blank-input:disabled{cursor:default;}
  .blank-input.correct-input{background:#f0faeb;border-color:var(--green);color:#2f6e10;}
  .blank-input.wrong-input{background:#fff0ef;border-color:var(--pink);color:#c0392b;}

  .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;
    padding:.75rem 1rem;font-size:.85rem;color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
  .hint-box.show{display:block;}

  .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;font-size:.9rem;
    display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
  .feedback.show{display:flex;}
  .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
  .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
  .feedback.partial{background:#fffbeb;border:1.5px solid var(--yellow);color:#7a6010;}
  .feedback-icon{font-size:1.4rem;flex-shrink:0;}
  .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.8;}
  .corr-list{list-style:none;padding:0;margin-top:.5rem;}
  .corr-list li{padding:.3rem .6rem;border-radius:6px;margin-bottom:.3rem;font-size:.8rem;}
  .corr-ok{background:#e8f7d4;color:#2f6e10;}
  .corr-ko{background:#fff0ef;color:#c0392b;}

  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem;position:relative;z-index:2;}
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:10px;
    font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;
    transition:transform .12s,box-shadow .15s;min-height:2.6rem;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.38;cursor:default;}
  .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
  .btn-hint{background:var(--orange);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
  .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

  .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
  .results.show{display:block;}
  .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
    padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
  .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
  .results-score .s-num{color:var(--day-color);}
  .stars{font-size:2rem;margin:.4rem 0 1rem;}
  .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
  .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
  .recap-item{display:flex;align-items:flex-start;gap:.8rem;padding:.65rem 1rem;background:var(--bg);
    border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.6;}
  .recap-item .eq{color:var(--day-color);flex:1;}
  .recap-item.ok-item{border-color:#b5e08a;}
  .recap-item.ko-item{border-color:#f9c0bb;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .card,.results{animation:fadeUp .4s ease both;}
  @media(max-width:480px){
    .card,.results-card{padding:1.4rem;}
    .btn{font-size:.85rem;padding:.55rem 1rem;}
    .texte-exercice{font-size:.88rem;line-height:2.4;}
  }
</style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa &middot; Maths &middot; 6&egrave;me
  </div>
  <div class="week-label">Semaine 1 &ndash; Jour 4</div>
  <h1><span style="color:var(--text)">Texte &agrave; trous</span> <span class="hl">&mdash; Les nombres d&eacute;cimaux</span></h1>
  <p class="subtitle">d&eacute;finition et &eacute;criture</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Blanc 1 / 6</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<div class="score-row">
  <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span>&nbsp;<span id="lbl-ok">correcte</span></div>
  <div class="chip wrong"><div class="dot"></div><span id="count-ko">0</span>&nbsp;<span id="lbl-ko">erreur</span></div>
  <div class="chip remaining"><div class="dot"></div><span id="count-rem">6</span>&nbsp;<span id="lbl-rem">restantes</span></div>
</div>

<div class="card" id="ex-card">
  <div class="card-stripe"></div>

  <div class="q-num">Exercice 1</div>
  <div class="theme-badge">Nombres d&eacute;cimaux</div>

  <div class="word-bank">
    <span class="word-bank-label">Mots&nbsp;:</span>
    <span class="word-chip" data-w="decimale">d&eacute;cimale</span>
    <span class="word-chip" data-w="decimale">d&eacute;cimale</span>
    <span class="word-chip" data-w="entiere">enti&egrave;re</span>
    <span class="word-chip" data-w="infinie">infinie</span>
    <span class="word-chip" data-w="inutiles">inutiles</span>
    <span class="word-chip" data-w="numeration">num&eacute;ration</span>
  </div>

  <div class="texte-exercice" id="texte-zone"></div>

  <div class="hint-box" id="hint-box"></div>

  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="fb-icon"></span>
    <div>
      <div id="fb-msg"></div>
      <div class="feedback-detail" id="fb-detail"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btn-check" onclick="checkAll()">&#10003; V&eacute;rifier</button>
    <button class="btn btn-hint" id="btn-hint" onclick="toggleHint()">? Indice</button>
    <button class="btn btn-ghost" id="btn-solution" onclick="showSolution()" style="display:none;">&#128161; Solution</button>
    <button class="btn btn-primary" id="btn-results" onclick="goResults()" style="display:none;">Voir les résultats &#8594;</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      R&eacute;sultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/6</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <div class="recap-list" id="recap-list"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">
      &#128260; Recommencer
    </button>
  </div>
</div>

<script>
var BLANKS = [
  { id:0, answer:"enti\u00e8re",    libelle:"partie enti\u00e8re", corrige:"relis la phrase\u00a0: quelle partie se trouve \u00e0 gauche de la virgule\u00a0?", explication:"La partie <strong>enti\u00e8re</strong> est situ\u00e9e \u00e0 gauche de la virgule\u00a0; elle compte les unit\u00e9s enti\u00e8res." },
  { id:1, answer:"d\u00e9cimale",   libelle:"partie d\u00e9cimale", corrige:"relis la phrase\u00a0: quelle partie se trouve \u00e0 droite de la virgule\u00a0?", explication:"La partie <strong>d\u00e9cimale</strong> est situ\u00e9e \u00e0 droite de la virgule\u00a0; elle compte les dixi\u00e8mes, centi\u00e8mes, milli\u00e8mes\u2026" },
  { id:2, answer:"d\u00e9cimale",   libelle:"fraction d\u00e9cimale", corrige:"relis la phrase et cherche le mot qui correspond au vocabulaire des nombres d\u00e9cimaux.", explication:"Une fraction <strong>d\u00e9cimale</strong> a pour d\u00e9nominateur 10, 100, 1\u202f000\u2026 (exemple\u00a0: 37/100)." },
  { id:3, answer:"num\u00e9ration", libelle:"tableau de num\u00e9ration", corrige:"dans quel tableau range-t-on les chiffres selon leur rang\u00a0?", explication:"Le tableau de <strong>num\u00e9ration</strong> range chaque chiffre selon son rang, des unit\u00e9s jusqu\u2019aux dix-milli\u00e8mes." },
  { id:4, answer:"inutiles",     libelle:"z\u00e9ros inutiles", corrige:"observe l\u2019exemple donn\u00e9 sur les z\u00e9ros et r\u00e9fl\u00e9chis \u00e0 leur r\u00f4le dans l\u2019\u00e9criture d\u2019un nombre.", explication:"Certains z\u00e9ros sont <strong>inutiles</strong>\u00a0: par exemple, 04,50 s\u2019\u00e9crit 4,5." },
  { id:5, answer:"infinie",      libelle:"\u00e9criture infinie", corrige:"r\u00e9fl\u00e9chis \u00e0 l\u2019\u00e9criture d\u00e9cimale d\u2019un nombre qui ne s\u2019arr\u00eate jamais.", explication:"Un nombre non d\u00e9cimal poss\u00e8de une \u00e9criture d\u00e9cimale <strong>infinie</strong>\u00a0: son \u00e9criture d\u00e9cimale ne s\u2019arr\u00eate jamais. Par exemple\u00a0: 1/3 = 0,333\u2026" }
];

var TOTAL = BLANKS.length;
var userAnswers = new Array(TOTAL).fill("");
var validated = false;
var pendingScore = 0;
var pendingResults = [];
var hintOpen = false;
var $ = function(id){ return document.getElementById(id); };

function updateCounters(ok, ko, rem){
  $("count-ok").textContent = ok;
  $("count-ko").textContent = ko;
  $("count-rem").textContent = rem;
  $("lbl-ok").textContent  = "correcte" + (ok>1?"s":"");
  $("lbl-ko").textContent  = "erreur"   + (ko>1?"s":"");
  $("lbl-rem").textContent = "restante" + (rem>1?"s":"");
}

function normalise(s){
  return s.trim().toLowerCase()
    .replace(/[\u00e0\u00e2\u00e4]/g,"a").replace(/[\u00e9\u00e8\u00ea\u00eb]/g,"e")
    .replace(/[\u00ee\u00ef]/g,"i").replace(/[\u00f4\u00f6]/g,"o")
    .replace(/[\u00f9\u00fb\u00fc]/g,"u").replace(/\u00e7/g,"c");
}

function makeInput(idx){
  var wrap = document.createElement("span");
  wrap.className = "blank-wrap";
  var inp = document.createElement("input");
  inp.type = "text";
  inp.className = "blank-input";
  inp.id = "blank-"+idx;
  inp.placeholder = "\u2026";
  inp.setAttribute("autocomplete","off");
  inp.setAttribute("autocorrect","off");
  inp.setAttribute("spellcheck","false");
  var sizes = [90,100,100,120,90,90];
  inp.style.width = sizes[idx]+"px";
  inp.addEventListener("input", function(){
    userAnswers[idx] = inp.value;
    updateChips();
    updateProgress();
  });
  inp.addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); checkAll(); }
  });
  wrap.appendChild(inp);
  return wrap;
}

function buildTexte(){
  var z = $("texte-zone");
  if(!z) return;
  z.innerHTML = "";
  function row(nodes){
    var p = document.createElement("p");
    var puce = document.createElement("span");
    puce.className = "puce";
    puce.textContent = "\u25fe";
    p.appendChild(puce);
    nodes.forEach(function(n){
      p.appendChild(typeof n==="string" ? document.createTextNode(n) : n);
    });
    z.appendChild(p);
  }
  row(["Un nombre d\u00e9cimal a une partie ", makeInput(0), " et une partie ", makeInput(1), ", s\u00e9par\u00e9es par une virgule."]);
  row(["Il peut \u00eatre \u00e9crit sous forme de fraction ", makeInput(2), "."]);
  row(["Il peut \u00eatre plac\u00e9 dans un tableau de ", makeInput(3), " allant jusqu\u2019aux dix-milli\u00e8mes."]);
  row(["Certains z\u00e9ros sont ", makeInput(4), "\u00a0: par exemple, 04,50 s\u2019\u00e9crit 4,5."]);
  row(["Un nombre non d\u00e9cimal poss\u00e8de une \u00e9criture d\u00e9cimale ", makeInput(5), "."]);
  var first = $("blank-0");
  if(first) first.focus();
}

function updateProgress(){
  if(validated) return;
  var filled = userAnswers.filter(function(a){ return a.trim().length>0; }).length;
  var pct = Math.round(filled/TOTAL*100);
  $("progress-bar").style.width = pct+"%";
  $("prog-pct").textContent = pct+"\u00a0%";
  $("prog-label").textContent = "Blanc "+(Math.min(filled+1,TOTAL))+" / "+TOTAL;
  var rem = TOTAL - filled;
  $("count-rem").textContent = rem;
  $("lbl-rem").textContent = "restante" + (rem>1?"s":"");
}

function updateChips(){
  if(validated) return;
  var chips = document.querySelectorAll(".word-chip");
  var typedCounts = {};
  userAnswers.forEach(function(a){
    var n = normalise(a);
    if(n.length>0) typedCounts[n] = (typedCounts[n]||0)+1;
  });
  var seen = {};
  chips.forEach(function(chip){
    var w = chip.getAttribute("data-w");
    seen[w] = (seen[w]||0)+1;
    if(typedCounts[w] && seen[w] <= typedCounts[w]) chip.classList.add("used");
    else chip.classList.remove("used");
  });
}

function checkAll(){
  if(validated) return;
  if(userAnswers.every(function(a){ return a.trim().length===0; })){
    var fbv=$("feedback");
    fbv.className="feedback show ko";
    $("fb-icon").textContent="\u270b";
    $("fb-msg").innerHTML="<strong>R\u00e9ponds d\u2019abord\u00a0!</strong>";
    $("fb-detail").textContent="\u00c9cris au moins un mot avant de v\u00e9rifier.";
    return;
  }
  var score = 0;
  var results = [];
  BLANKS.forEach(function(b,i){
    var inp = $("blank-"+i);
    var ok = normalise(b.answer)===normalise(userAnswers[i]);
    results.push(ok);
    inp.classList.remove("correct-input","wrong-input");
    inp.classList.add(ok ? "correct-input" : "wrong-input");
    if(ok) score++;
  });
  markChips(results);
  $("progress-bar").style.width = Math.round(score/TOTAL*100)+"%";
  $("prog-pct").textContent = Math.round(score/TOTAL*100)+"\u00a0%";
  $("prog-label").textContent = score+" / "+TOTAL+" corrects";
  updateCounters(score, TOTAL - score, TOTAL - score);

  var fb = $("feedback");
  if(score===TOTAL){
    // tout juste : on fige et on propose les résultats
    validated = true;
    BLANKS.forEach(function(b,i){ $("blank-"+i).disabled = true; });
    $("btn-check").disabled = true;
    $("btn-hint").disabled = true;
    $("btn-solution").style.display = "inline-flex";
    fb.className="feedback show ok"; $("fb-icon").textContent="\u2705";
    $("fb-msg").innerHTML="<strong>Parfait\u00a0!</strong> Tu connais toutes les caract\u00e9ristiques d\u2019un nombre d\u00e9cimal.";
    $("fb-detail").innerHTML="";
    pendingScore = score;
    pendingResults = results;
    $("btn-results").style.display = "inline-flex";
  } else {
    // erreurs : on laisse l'élève corriger (champs faux restent modifiables)
    fb.className="feedback show partial"; $("fb-icon").textContent="\u26a0";
    $("fb-msg").innerHTML="<strong>"+score+" / "+TOTAL+"</strong> r\u00e9ponse"+(score>1?"s":"")+" correcte"+(score>1?"s":"")+". Relis chaque phrase et rep\u00e8re le vocabulaire des nombres d\u00e9cimaux\u00a0: partie enti\u00e8re, partie d\u00e9cimale, fraction d\u00e9cimale, num\u00e9ration et \u00e9criture infinie. Observe les indices donn\u00e9s dans le texte, puis corrige tes r\u00e9ponses avant de r\u00e9essayer.";
    $("fb-detail").innerHTML=buildCorr(results);
    // la solution reste accessible si l'élève bloque
    $("btn-solution").style.display = "inline-flex";
  }
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function goResults(){
  showResults(pendingScore, pendingResults);
}

function markChips(results){
  var chips = document.querySelectorAll(".word-chip");
  chips.forEach(function(c){ c.className="word-chip"; });
  var byWord = {};
  chips.forEach(function(c){
    var w = c.getAttribute("data-w");
    (byWord[w]=byWord[w]||[]).push(c);
  });
  BLANKS.forEach(function(b,i){
    var w = normalise(b.answer);
    if(byWord[w] && byWord[w].length){
      var chip = byWord[w].shift();
      chip.classList.add(results[i]?"validated-ok":"validated-ko");
    }
  });
}

function buildCorr(results){
  var html="<ul class='corr-list'>";
  BLANKS.forEach(function(b,i){
    if(results[i]){
      html+="<li class='corr-ok'>\u2705 Blanc "+(i+1)+"\u00a0: correct\u00a0!</li>";
    } else if(userAnswers[i].trim().length===0){
      html+="<li class='corr-ko'>\u274c Blanc "+(i+1)+"\u00a0: tu n\u2019as pas r\u00e9pondu \u00e0 ce blanc.</li>";
    } else {
      html+="<li class='corr-ko'>\u274c Blanc "+(i+1)+"\u00a0: "+b.corrige+"</li>";
    }
  });
  html+="</ul><span style='color:var(--muted)'>Corrige tes r\u00e9ponses et essaie \u00e0 nouveau. Si besoin, utilise l\u2019indice ou consulte la solution.</span>";
  return html;
}

function showResults(score,results){
  $("ex-card").style.display="none";
  var rs=$("results-screen");
  rs.classList.add("show");
  $("score-num").textContent=score;
  var stars = score===6?5 : score===5?4 : score>=3?3 : score>=1?2 : 1;
  $("stars-row").textContent="\u2b50".repeat(stars)+"\u2606".repeat(5-stars);
  var msgs=[
    "\u00c0 retravailler. Relis bien la le\u00e7on, puis recommence.",
    "Bien. Quelques notions sont \u00e0 revoir.",
    "Tr\u00e8s bien\u00a0! Tu ma\u00eetrises presque tout.",
    "Parfait\u00a0! Toutes les r\u00e9ponses sont justes."
  ];
  var lvl = score===6?3 : score>=4?2 : score>=2?1 : 0;
  $("results-msg").textContent=msgs[lvl];
  var list=$("recap-list"); list.innerHTML="";
  BLANKS.forEach(function(b,i){
    var div=document.createElement("div");
    div.className="recap-item "+(results[i]?"ok-item":"ko-item");
    div.innerHTML="<span>"+(results[i]?"\u2705":"\u274c")+"</span>"
      +"<span class='eq'>Blanc "+(i+1)+" \u2014 "+b.libelle+"</span>"
      +"<span>"+(results[i]?"\u2713":"\u2717 "+(userAnswers[i].trim()||"vide"))+"</span>";
    list.appendChild(div);
  });
  rs.scrollIntoView({behavior:"smooth",block:"start"});
}

function showSolution(){
  validated = true;
  var results = [];
  BLANKS.forEach(function(b,i){
    var inp = $("blank-"+i);
    results.push(normalise(b.answer)===normalise(userAnswers[i]));
    inp.value = b.answer;
    inp.disabled = true;
    inp.classList.remove("wrong-input");
    inp.classList.add("correct-input");
  });
  $("btn-check").disabled = true;
  $("btn-hint").disabled = true;
  var fb = $("feedback");
  fb.className="feedback show ok";
  $("fb-icon").textContent="\u2705";
  $("fb-msg").innerHTML="<strong>Solution compl\u00e8te affich\u00e9e.</strong>";
  $("fb-detail").innerHTML=buildCorr(BLANKS.map(function(){return true;}));
  $("btn-solution").disabled = true;
  // le score retenu reste celui des réponses de l'élève (la solution ne donne pas les points)
  pendingScore = results.filter(Boolean).length;
  pendingResults = results;
  $("btn-results").style.display = "inline-flex";
}

function toggleHint(){
  if(validated) return;
  hintOpen=!hintOpen;
  var h=$("hint-box");
  if(hintOpen){
    h.innerHTML="<strong>? Indice\u00a0:</strong> Pense \u00e0 ce qui se trouve de chaque c\u00f4t\u00e9 de la virgule. Quel type de fraction a pour d\u00e9nominateur 10, 100, 1\u202f000\u202f? Dans quel tableau range-t-on les chiffres\u202f? Quels z\u00e9ros sont inutiles\u202f? Et que dire de l\u2019\u00e9criture d\u00e9cimale d\u2019un nombre qui n\u2019est pas d\u00e9cimal\u202f?";
    h.classList.add("show");
  } else { h.classList.remove("show"); }
}

function restart(){
  validated=false; hintOpen=false;
  userAnswers=new Array(TOTAL).fill("");
  $("results-screen").classList.remove("show");
  $("ex-card").style.display="block";
  $("feedback").className="feedback";
  $("hint-box").classList.remove("show");
  $("btn-check").disabled=false;
  $("btn-hint").disabled=false;
  $("btn-solution").style.display="none";
  $("btn-results").style.display="none";
  $("btn-solution").disabled=false;
  $("progress-bar").style.width="0%";
  $("prog-pct").textContent="0\u00a0%";
  $("prog-label").textContent="Blanc 1 / "+TOTAL;
  updateCounters(0, 0, TOTAL);
  document.querySelectorAll(".word-chip").forEach(function(c){ c.className="word-chip"; });
  buildTexte();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", function(){
  updateCounters(0, 0, TOTAL);
  buildTexte();
});
</script>
</body>
</html>
