<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pazapa — Flash Défi — Inégalité triangulaire</title>
<style>
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}}
:root{
  --day-color:#8dc63f;--day-dark:#3d7a10;--day-light:#f0f7e6;
  --day-border:#bde08a;--day-glow:rgba(141,198,63,.3);
  --bg:#f6faf0;--surface:#fff;--border:#dce8cc;
  --green:#8dc63f;--blue:#3ab5d8;--yellow:#f5c518;--red:#b94040;
  --text:#1a1d23;--muted:#7a8a6a;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.5rem 1rem 4rem;overflow-x:hidden;line-height:1.7;}
body::before{content:'';position:fixed;inset:0;z-index:0;opacity:.03;
  background:repeating-linear-gradient(45deg,transparent,transparent 20px,#8dc63f 20px,#8dc63f 21px);pointer-events:none;}
.bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:280px;height:280px;background:var(--day-color);top:-70px;right:-50px;pointer-events:none;}
.bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.07;width:200px;height:200px;background:var(--blue);bottom:-50px;left:-40px;pointer-events:none;}
header{text-align:center;margin-bottom:1.2rem;position:relative;z-index:1;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:#f5c518;color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:monospace;font-size:.82rem;color:var(--muted);margin-bottom:.4rem;}
h1{font-size:clamp(1.2rem,3.5vw,1.7rem);font-weight:800;line-height:1.3;color:var(--day-dark);}
.subtitle{color:var(--muted);font-size:.84rem;margin-top:.3rem;font-family:monospace;}
.chrono-wrap{width:100%;max-width:560px;position:relative;z-index:1;margin-bottom:.8rem;}
.chrono-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;}
.chrono-label{font-family:monospace;font-size:.78rem;color:var(--muted);text-transform:uppercase;}
.chrono-val{font-family:monospace;font-weight:800;font-size:1.5rem;color:var(--day-dark);}
.chrono-val.urgent{color:#c0392b;animation:pulse .5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.chrono-bar-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;}
.chrono-bar{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .9s linear;}
.chrono-bar.urgent{background:linear-gradient(90deg,#c0392b,#e74c3c);}
.prog-dots{display:flex;gap:.5rem;justify-content:center;margin-bottom:1rem;position:relative;z-index:1;}
.prog-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:.3s;}
.prog-dot.done{background:var(--green);}.prog-dot.active{background:var(--day-color);}
#start-screen{width:100%;max-width:560px;position:relative;z-index:1;}
.start-card{background:var(--surface);border:2px solid var(--day-border);border-radius:var(--radius);padding:2rem;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.stripe{height:4px;border-radius:4px;margin-bottom:1.2rem;background:linear-gradient(90deg,#8dc63f,#f5c518,#3ab5d8);}
.start-title{font-size:1.1rem;font-weight:800;color:var(--day-dark);margin-bottom:.6rem;}
#flash-zone{width:100%;max-width:560px;position:relative;z-index:1;display:none;}
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.6rem;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--blue));}
.q-badge{display:inline-block;background:var(--day-color);color:#fff;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.2rem .65rem;border-radius:99px;margin-bottom:.7rem;font-family:monospace;}
.q-text{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.8rem;line-height:1.6;}
.longueurs{display:flex;gap:.8rem;margin-bottom:.8rem;flex-wrap:wrap;}
.lng-tag{background:var(--day-light);border:2px solid var(--day-border);border-radius:10px;padding:.4rem .9rem;font-family:monospace;font-weight:800;font-size:1.05rem;color:var(--day-dark);}
.lng-tag.highlight{background:#fff3b0;border-color:#f5c518;color:#7a5500;}
.opts-col{display:flex;flex-direction:column;gap:.45rem;margin-top:.5rem;}
.opt-btn{display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;border-radius:10px;border:2px solid var(--day-border);background:var(--day-light);cursor:pointer;min-height:44px;font-size:.95rem;font-weight:600;transition:.15s;text-align:left;width:100%;}
.opt-btn:hover:not([disabled]){border-color:var(--day-color);background:#e8f5d0;}
.opt-btn:focus-visible{outline:3px solid var(--day-color);outline-offset:2px;}
.opt-btn[disabled]{cursor:default;}
.opt-btn.ok{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.opt-btn.ko{border-color:#c0392b;background:#fce4e4;color:#8f2f2f;}
.opt-btn.reveal{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.opt-letter{font-family:monospace;font-weight:800;min-width:1.3rem;color:var(--day-dark);}
.trou-wrap{font-size:1.05rem;font-weight:700;line-height:2.4;margin:.5rem 0;}
.trou-input{width:3.5rem;padding:.3rem .5rem;border-radius:8px;border:2px solid var(--day-border);background:var(--day-light);font-family:monospace;font-size:1rem;font-weight:800;text-align:center;color:var(--day-dark);}
.trou-input:focus{outline:3px solid var(--day-color);outline-offset:2px;}
.trou-input.ok{border-color:var(--green);background:#eefad8;}
.trou-input.ko{border-color:#c0392b;background:#fce4e4;}
.vf-row{display:flex;gap:.5rem;margin-top:.4rem;}
.vf-btn{padding:.55rem 1.1rem;border-radius:8px;border:2px solid var(--day-border);background:var(--day-light);cursor:pointer;font-weight:700;font-size:.9rem;min-height:44px;transition:.15s;}
.vf-btn:hover:not([disabled]){border-color:var(--day-color);}
.vf-btn:focus-visible{outline:3px solid var(--day-color);outline-offset:2px;}
.vf-btn[disabled]{cursor:default;}
.vf-btn.ok{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.vf-btn.ko{border-color:#c0392b;background:#fce4e4;color:#8f2f2f;}
.vf-btn.reveal{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.vf-btn.selected{border-color:var(--day-color);background:#e8f5d0;font-weight:900;}
.feedback{margin-top:.8rem;padding:.65rem .9rem;border-radius:10px;font-family:monospace;font-size:.82rem;line-height:1.75;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:#eefad8;border:1.5px solid var(--green);color:#3d7a10;}
.feedback.ko{background:#fce4e4;border:1.5px solid #c0392b;color:#8f2f2f;}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;min-height:44px;transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn:focus-visible{outline:3px solid var(--day-color);outline-offset:2px;}
.btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
.btn-primary:hover{transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
.btn-ghost:hover{border-color:var(--day-color);color:var(--text);}
#final-screen{width:100%;max-width:560px;display:none;position:relative;z-index:1;}
.final-card{background:var(--surface);border:2px solid var(--day-border);border-radius:var(--radius);padding:2rem 1.6rem;box-shadow:0 4px 20px rgba(0,0,0,.06);text-align:center;}
.final-icon{font-size:2.5rem;margin-bottom:.5rem;}
.final-title{font-size:1.2rem;font-weight:800;color:var(--day-dark);margin-bottom:.5rem;}
.final-msg{font-size:.93rem;color:var(--text);line-height:1.8;margin-bottom:1rem;}
.btn-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem;}
@media(max-width:480px){body{padding:1rem .75rem 3rem;}.card{padding:1.2rem;}}
</style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>
<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa &middot; Maths &middot; 5&egrave;me
  </div>
  <div class="week-label">Semaine 6 &ndash; Jour 4</div>
  <h1>&#9889; Flash D&eacute;fi</h1>
  <p class="subtitle">Utiliser l&rsquo;in&eacute;galit&eacute; triangulaire &middot; 3 questions &middot; 20 secondes</p>
</header>

<div id="start-screen">
  <div class="start-card">
    <div class="stripe"></div>
    <div class="start-title">Flash D&eacute;fi &mdash; Utiliser l&rsquo;in&eacute;galit&eacute; triangulaire</div>
    <p style="color:var(--muted);font-size:.92rem;margin-bottom:1.2rem;"><strong>20 secondes &mdash; 3 questions</strong></p>
    <button class="btn btn-primary" id="btn-start" style="font-size:1.05rem;padding:.8rem 2rem;">&#9654; Commencer</button>
  </div>
</div>

<div id="flash-zone" style="display:none;">
  <div class="chrono-wrap">
    <div class="chrono-top">
      <span class="chrono-label">&#8987; Temps restant</span>
      <span class="chrono-val" id="chrono-val">20 s</span>
    </div>
    <div class="chrono-bar-bg"><div class="chrono-bar" id="chrono-bar" style="width:100%"></div></div>
  </div>
  <div class="prog-dots">
    <div class="prog-dot active" id="pd0"></div>
    <div class="prog-dot" id="pd1"></div>
    <div class="prog-dot" id="pd2"></div>
  </div>
  <div class="card" id="card">
    <div class="card-stripe"></div>
    <div class="q-badge" id="q-badge">Question 1 / 3</div>
    <div id="q-content"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  </div>
</div>

<div id="final-screen" style="display:none;">
  <div class="final-card">
    <div class="stripe"></div>
    <div class="logo-badge" style="margin:0 auto .7rem;display:flex;width:fit-content;">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
    </div>
    <div class="final-icon" id="final-icon"></div>
    <div class="final-title" id="final-title"></div>
    <div class="final-msg" id="final-msg"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-restart">&#8635; Recommencer</button>
    </div>
  </div>
</div>

<script>
(function(){
var DUREE=20,TOTAL=3;
var tempsRestant=DUREE,timerID=null,transitionID=null,fini=false,answered=false,qIdx=0;

function el(id){return document.getElementById(id);}

function updateChrono(){
  el('chrono-val').textContent=tempsRestant+' s';
  el('chrono-bar').style.width=(tempsRestant/DUREE*100)+'%';
  var urgent=(tempsRestant<=5);
  el('chrono-val').className='chrono-val'+(urgent?' urgent':'');
  el('chrono-bar').className='chrono-bar'+(urgent?' urgent':'');
}

function startTimer(){
  if(timerID){clearInterval(timerID);}
  timerID=setInterval(function(){
    tempsRestant--;
    updateChrono();
    if(tempsRestant<=0){
      clearInterval(timerID);timerID=null;
      clearTimeout(transitionID);transitionID=null;
      if(!fini) showFin(false);
    }
  },1000);
}

function pauseChrono(){
  if(timerID){clearInterval(timerID);timerID=null;}
}



function startFlash(){
  el('start-screen').style.display='none';
  el('flash-zone').style.display='block';
  qIdx=0;fini=false;answered=false;tempsRestant=DUREE;
  updateChrono();render();startTimer();
}

// ── Q1 : Oui/Non — 5,7,9 constructible ? ──
function buildQ1(){
  return '<div class="q-text">Peut-on construire un triangle avec ces longueurs\u00a0?</div>'
    +'<div class="longueurs"><span class="lng-tag">5</span><span class="lng-tag">7</span><span class="lng-tag highlight">9</span></div>'
    +'<div class="vf-row">'
    +'<button class="vf-btn" id="vf-oui" tabindex="0">Oui</button>'
    +'<button class="vf-btn" id="vf-non" tabindex="0">Non</button>'
    +'</div>';
}
function attachQ1(){
  var bo=el('vf-oui'),bn=el('vf-non');
  bo.addEventListener('click',function(){answerQ1('Oui');});
  bn.addEventListener('click',function(){answerQ1('Non');});
  bo.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();answerQ1('Oui');}});
  bn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();answerQ1('Non');}});
}
function answerQ1(label){
  if(answered) return;
  answered=true;pauseChrono();
  var ok=(label==='Oui');
  var bo=el('vf-oui'),bn=el('vf-non');
  bo.disabled=true;bn.disabled=true;
  bo.className='vf-btn'+(ok&&label==='Oui'?' ok':label==='Oui'?' ko':' reveal');
  bn.className='vf-btn'+(label==='Non'?' ko':'');
  var fb=el('feedback');fb.className='feedback show '+(ok?'ok':'ko');
  fb.textContent=ok
    ?'\u2705 Exact\u00a0! La plus grande longueur est 9. Or 5\u00a0+\u00a07\u00a0=\u00a012 et 9\u00a0<\u00a012. Le triangle est constructible.'
    :'\u274c La plus grande longueur est 9. On calcule 5\u00a0+\u00a07\u00a0=\u00a012. Comme 9\u00a0<\u00a012, le triangle est constructible.';
  scheduleNext();
}

// ── Q2 : Quelle longueur comparer en priorité ? ──
function buildQ2(){
  return '<div class="q-text">Quelle longueur faut-il comparer en priorit\u00e9\u00a0?</div>'
    +'<div class="longueurs"><span class="lng-tag">4</span><span class="lng-tag">6</span><span class="lng-tag">12</span></div>'
    +'<div class="opts-col">'
    +'<button class="opt-btn" data-q2="0" tabindex="0"><span class="opt-letter">A.</span> 4</button>'
    +'<button class="opt-btn" data-q2="1" tabindex="0"><span class="opt-letter">B.</span> 6</button>'
    +'<button class="opt-btn" data-q2="2" tabindex="0"><span class="opt-letter">C.</span> 12</button>'
    +'</div>';
}
function attachQ2(){
  el('q-content').querySelectorAll('.opt-btn[data-q2]').forEach(function(b){
    var i=parseInt(b.getAttribute('data-q2'));
    b.addEventListener('click',function(){answerQ2(i);});
    b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();answerQ2(i);}});
  });
}
function answerQ2(i){
  if(answered) return;
  answered=true;pauseChrono();
  var ok=(i===2);
  el('q-content').querySelectorAll('.opt-btn[data-q2]').forEach(function(b,j){
    b.disabled=true;
    if(j===2) b.classList.add(ok&&j===i?'ok':'reveal');
    else if(j===i) b.classList.add('ko');
  });
  var fb=el('feedback');fb.className='feedback show '+(ok?'ok':'ko');
  fb.textContent=ok
    ?'\u2705 Exact\u00a0! On commence toujours par rep\u00e9rer la plus grande longueur, ici 12.'
    :'\u274c On compare toujours la plus grande longueur \u00e0 la somme des deux autres. Ici c\u2019est 12.';
  scheduleNext();
}

// ── Q3 : cas limite 5,8,13 — non constructible ──
function buildQ3(){
  return '<div class="q-text">Peut-on construire un triangle avec ces longueurs ?</div>'
    +'<div class="longueurs"><span class="lng-tag">5</span><span class="lng-tag">8</span><span class="lng-tag highlight">13</span></div>'
    +'<div class="vf-row">'
    +'<button class="vf-btn" id="vf3-oui" tabindex="0">Oui</button>'
    +'<button class="vf-btn" id="vf3-non" tabindex="0">Non</button>'
    +'</div>';
}
function attachQ3(){
  var bo=el('vf3-oui'),bn=el('vf3-non');
  if(!bo||!bn) return;
  bo.addEventListener('click',function(){answerQ3('Oui');});
  bn.addEventListener('click',function(){answerQ3('Non');});
  bo.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();answerQ3('Oui');}});
  bn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();answerQ3('Non');}});
}
function answerQ3(label){
  if(answered) return;
  answered=true;pauseChrono();
  var ok=(label==='Non');
  var bo=el('vf3-oui'),bn=el('vf3-non');
  bo.disabled=true;bn.disabled=true;
  bo.className='vf-btn'+(label==='Oui'?' ko':'');
  bn.className='vf-btn'+(ok?' ok':' reveal');
  var fb=el('feedback');fb.className='feedback show '+(ok?'ok':'ko');
  fb.textContent=ok
    ?'✅ Exact ! La plus grande longueur est 13. Or 5 + 8 = 13. Les trois points seraient alignés : on n’obtient pas un triangle.'
    :'❌ La plus grande longueur est 13 et 5 + 8 = 13. Lorsque la plus grande longueur est égale à la somme des deux autres, les trois points sont alignés.';
  scheduleNext();
}

function scheduleNext(){
  clearTimeout(transitionID);
  pauseChrono();
  if(qIdx===TOTAL-1){
    transitionID=setTimeout(function(){transitionID=null;if(!fini)showFin(true);},1800);
    return;
  }
  transitionID=setTimeout(function(){
    transitionID=null;if(fini)return;
    qIdx++;render();startTimer();
  },1800);
}

function render(){
  answered=false;
  for(var i=0;i<3;i++) el('pd'+i).className='prog-dot'+(i<qIdx?' done':i===qIdx?' active':'');
  el('q-badge').textContent='Question '+(qIdx+1)+' / '+TOTAL;
  el('feedback').className='feedback';el('feedback').innerHTML='';
  if(qIdx===0){el('q-content').innerHTML=buildQ1();attachQ1();}
  else if(qIdx===1){el('q-content').innerHTML=buildQ2();attachQ2();}
  else{el('q-content').innerHTML=buildQ3();attachQ3();}
}

function showFin(normal){
  fini=true;clearInterval(timerID);timerID=null;clearTimeout(transitionID);transitionID=null;
  el('flash-zone').style.display='none';el('final-screen').style.display='block';
  if(normal){
    el('final-icon').textContent='\u26a1';
    el('final-title').textContent='Flash D\u00e9fi termin\u00e9\u00a0!';
    el('final-msg').innerHTML='Bravo\u00a0! Tu sais maintenant contr\u00f4ler rapidement des longueurs avant de construire un triangle.';
  } else {
    el('final-icon').textContent='\u23f0';
    el('final-title').textContent='Temps \u00e9coul\u00e9\u00a0!';
    el('final-msg').innerHTML='Ce n\u2019est pas grave. Les niveaux vont te permettre de revoir l\u2019in\u00e9galit\u00e9 triangulaire pas \u00e0 pas.';
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(){
  clearInterval(timerID);timerID=null;clearTimeout(transitionID);transitionID=null;
  fini=false;answered=false;qIdx=0;tempsRestant=DUREE;
  el('final-screen').style.display='none';el('start-screen').style.display='';
  updateChrono();window.scrollTo({top:0,behavior:'smooth'});
}

el('btn-start').addEventListener('click',startFlash);
el('btn-restart').addEventListener('click',restart);
updateChrono();
})();
</script>
</body>
</html>
