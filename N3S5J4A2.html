<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résoudre les exercices — Instructions conditionnelles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Charte du jour : J4 BLEU ===== */
  :root{
    --j4:#3ab5d8; --j4-dark:#1a6e88; --j4-soft:#e8f6fb; --j4-accent:#9dd4e8;
    --ink:#1d2b30; --ink-soft:#4f6670; --ok:#3d8b40; --ok-soft:#eaf6ea;
    --err:#c0392b; --err-soft:#fdecea; --line:#d3e9f1; --white:#ffffff;
    /* couleurs blocs Scratch */
    --sc-ctrl:#f5a623; --sc-move:#3ab5d8; --sc-var:#9b59b6; --sc-oper:#4c97d6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; overflow-x:hidden; }
  body{ font-family:'JetBrains Mono', ui-monospace, monospace; color:var(--ink); background:var(--white);
    line-height:1.55; -webkit-font-smoothing:antialiased; position:relative; min-height:100vh; }

  .blob{ position:fixed; z-index:0; background:var(--j4-accent); opacity:0.28; filter:blur(1px); pointer-events:none; }
  .blob-1{ top:-160px; right:-150px; width:460px; height:430px; border-radius:62% 38% 46% 54% / 58% 47% 53% 42%; }
  .blob-2{ top:42%; left:-190px; width:430px; height:470px; border-radius:44% 56% 63% 37% / 49% 38% 62% 51%; opacity:0.26; }
  .blob-3{ bottom:-180px; left:14%; width:500px; height:420px; border-radius:55% 45% 38% 62% / 42% 60% 40% 58%; opacity:0.27; }

  .wrap{ position:relative; z-index:1; max-width:860px; margin:0 auto; padding:26px 18px 60px; }
  .hero{ text-align:center; padding:14px 6px 22px; }
  .pill{ display:inline-block; background:var(--j4-soft); border:2px solid var(--j4-accent); color:var(--j4-dark);
    font-weight:700; font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase; padding:7px 16px; border-radius:999px; margin-bottom:16px; }
  .hero h1{ font-size:2.05rem; font-weight:800; color:var(--j4-dark); line-height:1.15; margin-bottom:10px; }
  .hero p.sub{ font-size:1.02rem; color:var(--ink-soft); max-width:580px; margin:0 auto; font-weight:500; }
  .hero .consigne{ display:inline-block; margin-top:14px; background:var(--white); border:2px dashed var(--j4-accent);
    border-radius:12px; padding:8px 16px; font-weight:600; color:var(--j4-dark); font-size:0.92rem; }

  .scoreboard{ position:sticky; top:10px; z-index:20; background:var(--white); border:2px solid var(--line); border-radius:16px;
    box-shadow:0 6px 20px rgba(26,110,136,0.10); padding:14px 16px; margin:10px 0 26px; }
  .score-stats{ display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:stretch; }
  .stat{ flex:1 1 90px; background:var(--j4-soft); border-radius:12px; padding:8px 6px; text-align:center; border:1.5px solid var(--j4-accent); }
  .stat .num{ font-size:1.5rem; font-weight:800; color:var(--j4-dark); line-height:1.1; }
  .stat .lbl{ font-size:0.72rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .stat.err{ background:var(--err-soft); border-color:#f3c6c0; } .stat.err .num{ color:var(--err); }
  .stat.done{ background:var(--ok-soft); border-color:#bfe0c0; } .stat.done .num{ color:var(--ok); }
  .xp-row{ margin-top:12px; }
  .xp-top{ display:flex; justify-content:space-between; font-size:0.8rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .xp-track{ height:16px; background:var(--j4-soft); border-radius:999px; overflow:hidden; border:1.5px solid var(--j4-accent); }
  .xp-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--j4), var(--j4-dark)); border-radius:999px; transition:width 0.5s cubic-bezier(.2,.8,.2,1); }

  .card{ background:var(--white); border:2px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:22px;
    box-shadow:0 4px 14px rgba(29,43,48,0.05); transition:border-color 0.3s, box-shadow 0.3s; }
  .card.is-correct{ border-color:#bfe0c0; box-shadow:0 6px 18px rgba(61,139,64,0.12); }
  .card.is-error{ border-color:#f3c6c0; }
  .card-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .badge-num{ flex:0 0 auto; width:42px; height:42px; background:var(--j4); color:var(--white); border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.25rem; }
  .card.is-correct .badge-num{ background:var(--ok); }
  .card-head .ctitle{ font-weight:700; font-size:1.02rem; color:var(--j4-dark); }
  .card.is-correct .ctitle{ color:var(--ok); }
  .check-mark{ margin-left:auto; font-size:1.5rem; color:var(--ok); opacity:0; transition:opacity 0.3s; }
  .card.is-correct .check-mark{ opacity:1; }

  .question{ font-size:1rem; margin-bottom:14px; color:var(--ink); }
  .question b{ color:var(--j4-dark); }

  .figure{ background:var(--j4-soft); border:1.5px solid var(--j4-accent); border-radius:14px; padding:10px; margin:0 auto 16px; max-width:360px; }
  .figure svg{ width:100%; height:auto; display:block; }

  .answer-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .num-input{ font-family:inherit; font-size:1.2rem; font-weight:700; width:140px; padding:12px 14px;
    border:2.5px solid var(--j4-accent); border-radius:12px; color:var(--ink); text-align:center; background:var(--white); }
  .num-input:focus{ outline:none; border-color:var(--j4); box-shadow:0 0 0 4px rgba(58,181,216,0.20); }

  .qcm{ display:flex; gap:10px; flex-wrap:wrap; }
  .qcm-btn{ font-family:inherit; flex:1 1 120px; font-size:1.1rem; font-weight:700; padding:16px 12px;
    border:2.5px solid var(--j4-accent); border-radius:14px; background:var(--white); color:var(--j4-dark); cursor:pointer; transition:0.15s; }
  .qcm-btn:hover{ background:var(--j4-soft); } .qcm-btn:active{ transform:scale(0.97); }
  .qcm-btn.picked{ background:var(--j4); color:var(--white); border-color:var(--j4-dark); }

  .btn{ font-family:inherit; font-weight:700; font-size:1.02rem; padding:13px 22px; border:none; border-radius:12px; cursor:pointer; transition:0.12s; }
  .btn:active{ transform:scale(0.97); }
  .btn-check{ background:var(--j4); color:var(--white); box-shadow:0 4px 0 var(--j4-dark); }
  .btn-check:hover{ background:#33a6c7; box-shadow:0 4px 0 #155a70; }
  .btn-retry{ background:var(--err-soft); color:var(--err); border:2px solid #f3c6c0; }
  .btn-retry:hover{ background:#fbe0db; }
  .btn-big{ display:block; width:100%; max-width:340px; margin:18px auto 0; background:var(--j4-dark); color:var(--white);
    font-size:1.12rem; padding:16px; box-shadow:0 5px 0 #114a5c; }
  .btn-big:hover{ background:#155a70; }

  .feedback{ margin-top:14px; font-weight:600; display:none; }
  .feedback.show{ display:block; } .feedback.ok{ color:var(--ok); } .feedback.bad{ color:var(--err); }
  .solution{ margin-top:12px; background:var(--ok-soft); border:1.5px solid #bfe0c0; border-radius:12px; padding:12px 14px; font-size:0.95rem; color:#1f5b22; display:none; }
  .solution.show{ display:block; } .solution b{ color:var(--ok); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .locked{ opacity:0.65; pointer-events:none; }
  .hint{ font-size:0.86rem; color:var(--ink-soft); margin-top:6px; font-style:italic; }

  .results{ display:none; text-align:center; background:var(--white); border:2.5px solid var(--j4-accent); border-radius:20px;
    padding:34px 22px; margin-bottom:24px; box-shadow:0 10px 30px rgba(26,110,136,0.16); }
  .results.show{ display:block; animation:pop 0.5s ease; }
  @keyframes pop{ from{ transform:scale(0.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .results .trophy{ font-size:3.4rem; line-height:1; }
  .results h2{ color:var(--j4-dark); font-size:1.6rem; margin:10px 0 4px; }
  .results .rscore{ font-size:1.1rem; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .stars{ font-size:2rem; letter-spacing:6px; margin:6px 0 12px; }
  .star-on{ color:var(--j4); } .star-off{ color:var(--line); }
  .results .rmsg{ color:var(--ink-soft); font-weight:500; max-width:440px; margin:0 auto 6px; }

  @media (max-width:430px){
    .hero h1{ font-size:1.62rem; } .stat .num{ font-size:1.25rem; } .stat .lbl{ font-size:0.64rem; }
    .num-input{ width:120px; } .wrap{ padding:20px 12px 50px; } .qcm-btn{ font-size:1rem; }
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="wrap">
    <header class="hero">
      <span class="pill">Semaine 5 · Jour 4</span>
      <h1>&#9999;&#65039; Résoudre les exercices</h1>
      <p class="sub">Instructions conditionnelles : lire un script « si … alors … sinon … » et prévoir ce qu&rsquo;il affiche.</p>
      <div class="consigne">&#129504; Résous <u>mentalement</u> et <u>sans calculatrice</u>.</div>
    </header>

    <section class="scoreboard" aria-label="Tableau de score">
      <div class="score-stats">
        <div class="stat done"><div class="num" id="s-ok">0</div><div class="lbl">Réussies</div></div>
        <div class="stat"><div class="num" id="s-left">4</div><div class="lbl">Restantes</div></div>
        <div class="stat err"><div class="num" id="s-err">0</div><div class="lbl">Erreurs</div></div>
      </div>
      <div class="xp-row">
        <div class="xp-top"><span>Progression</span><span id="xp-text">0 / 4</span></div>
        <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
      </div>
    </section>

    <div id="results" class="results">
      <div class="trophy">&#127942;</div>
      <h2>Tous les exercices terminés&nbsp;!</h2>
      <div class="rscore" id="r-score"></div>
      <div class="stars" id="r-stars"></div>
      <p class="rmsg" id="r-msg"></p>
      <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer</button>
    </div>

    <main id="exoList"></main>
    <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer tous les exercices</button>
  </div>

<script>
/* ============================================================
   PAZAPA — N3S5J4 — Instructions conditionnelles (Scratch)
   ============================================================ */
const TOTAL = 4;
const rint = n => Math.floor(Math.random()*n);
const pick = a => a[rint(a.length)];
const coin = () => Math.random() < 0.5;

let exos = [];
let state = [];

/* ============================================================
   Blocs Scratch (SVG)
   ============================================================ */
const SC_CTRL='#f5a623', SC_MOVE='#3ab5d8', SC_VAR='#9b59b6', SC_OPER='#4c97d6';
function scTx(x,y,t,sz,anchor){ return `<text x="${x}" y="${y}" font-family="JetBrains Mono,monospace" font-size="${sz||13}" font-weight="700" fill="#fff" ${anchor?`text-anchor="${anchor}"`:''}>${t}</text>`; }
function scFlat(x,y,w,h,color,label){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${color}" stroke="rgba(0,0,0,0.12)"/>`+scTx(x+13,y+h/2+5,label); }
function scHex(x,y,w,h,label){
  const e=h/2;
  const pts=`${x+e},${y} ${x+w-e},${y} ${x+w},${y+h/2} ${x+w-e},${y+h} ${x+e},${y+h} ${x},${y+h/2}`;
  return `<polygon points="${pts}" fill="${SC_OPER}" stroke="rgba(0,0,0,0.18)"/>`+scTx(x+w/2,y+h/2+5,label,12.5,'middle');
}
/* C-block "si <cond> alors {then} [sinon {else}]" -> {svg, height} */
function scIf(x, y, condLabel, thenLabels, elseLabels){
  const blkH=30, gap=4, indent=18, headW=290, condX=x+38, condW=160;
  let s='', cy=y;
  s+=`<rect x="${x}" y="${cy}" width="${headW}" height="${blkH}" rx="7" fill="${SC_CTRL}"/>`;
  s+=scTx(x+13, cy+blkH/2+5, 'si');
  s+=scHex(condX, cy+4, condW, blkH-8, condLabel);
  s+=scTx(condX+condW+10, cy+blkH/2+5, 'alors');
  cy+=blkH+2;
  let innerTop=cy;
  thenLabels.forEach(l=>{ s+=scFlat(x+indent, cy, 206, blkH, l.color||SC_MOVE, l.t); cy+=blkH+gap; });
  s=`<rect x="${x}" y="${innerTop}" width="14" height="${cy-innerTop}" fill="${SC_CTRL}"/>`+s;
  if(elseLabels){
    s+=`<rect x="${x}" y="${cy}" width="${headW}" height="${blkH}" rx="7" fill="${SC_CTRL}"/>`;
    s+=scTx(x+13, cy+blkH/2+5, 'sinon');
    cy+=blkH+2;
    let elseTop=cy;
    elseLabels.forEach(l=>{ s+=scFlat(x+indent, cy, 206, blkH, l.color||SC_MOVE, l.t); cy+=blkH+gap; });
    s=`<rect x="${x}" y="${elseTop}" width="14" height="${cy-elseTop}" fill="${SC_CTRL}"/>`+s;
  }
  s+=`<rect x="${x}" y="${cy}" width="120" height="${blkH*0.6}" rx="6" fill="${SC_CTRL}"/>`;
  cy+=blkH*0.6+2;
  return {svg:s, height:cy-y};
}
/* script complet : chapeau + set var + if + dire */
function scScript(startLabel, condLabel, thenLabels, elseLabels){
  const W=330, blkH=30, gap=6; let y=10, s='';
  s+=scFlat(14,y,196,blkH,SC_CTRL,'⚑ quand cliqué'); y+=blkH+gap;
  s+=scFlat(14,y,214,blkH,SC_VAR,startLabel); y+=blkH+gap;
  const c=scIf(20,y,condLabel,thenLabels,elseLabels); s+=c.svg; y+=c.height+gap;
  s+=scFlat(14,y,200,blkH,SC_VAR,'dire total'); y+=blkH+10;
  return `<svg viewBox="0 0 ${W} ${y}" role="img" aria-label="script Scratch">${s}</svg>`;
}

/* ============================================================
   Générateurs
   ============================================================ */
const OPS = {
  '>': (n,k)=>n>k, '<': (n,k)=>n<k, '=': (n,k)=>n===k
};
const OP_TXT = { '>':'>', '<':'<', '=':'=' };

/* Ex1 : si <cond> alors { ajouter d } */
function genSiAlors(){
  const start = rint(16);              /* 0..15 */
  const op = pick(['>','<']);
  const k = 2 + rint(13);              /* 2..14 */
  const d = pick([2,3,4,5,10]);
  const cond = OPS[op](start,k);
  const total = start + (cond ? d : 0);
  return { type:'input', answer:total, title:'Lire un bloc « si … alors »',
    question:`On exécute ce script. Quelle valeur le lutin <b>dit-il</b> à la fin&nbsp;? (la variable s\u2019appelle <b>total</b>)`,
    figure: scScript(`mettre total à ${start}`, `total ${OP_TXT[op]} ${k}`, [{t:`ajouter ${d} à total`}], null),
    hint:'On teste la condition. Si elle est vraie, on fait l\u2019action ; sinon, on ne change rien.',
    solution:`Au départ total = ${start}. La condition « ${start} ${OP_TXT[op]} ${k} » est <b>${cond?'vraie':'fausse'}</b>.<br>${cond?`Donc on ajoute ${d}\u00a0: total = ${start} + ${d} = <b>${total}</b>.`:`Donc on ne change rien\u00a0: total reste <b>${total}</b>.`}` };
}

/* Ex2 : si <cond> alors { A } sinon { B } */
function genSiAlorsSinon(){
  const start = rint(16);
  const op = pick(['>','<']);
  const k = 3 + rint(11);              /* 3..13 */
  const dThen = pick([10,5,8,6]);
  const dElse = pick([2,3,4]);
  const cond = OPS[op](start,k);
  const total = start + (cond ? dThen : dElse);
  return { type:'input', answer:total, title:'Lire un bloc « si … alors … sinon »',
    question:`On exécute ce script. Quelle valeur le lutin <b>dit-il</b> à la fin&nbsp;?`,
    figure: scScript(`mettre total à ${start}`, `total ${OP_TXT[op]} ${k}`,
                     [{t:`ajouter ${dThen} à total`}], [{t:`ajouter ${dElse} à total`}]),
    hint:'Si la condition est vraie, on fait le bloc « alors ». Sinon, on fait le bloc « sinon ».',
    solution:`Au départ total = ${start}. La condition « ${start} ${OP_TXT[op]} ${k} » est <b>${cond?'vraie':'fausse'}</b>.<br>${cond?`On fait le bloc « alors »\u00a0: total = ${start} + ${dThen} = <b>${total}</b>.`:`On fait le bloc « sinon »\u00a0: total = ${start} + ${dElse} = <b>${total}</b>.`}` };
}

/* Ex3 : la condition est-elle VRAIE ou FAUSSE ? (avec et / ou) */
function genConditionVF(){
  const n = rint(21);                  /* 0..20 */
  const logic = pick(['et','ou']);
  let k1,k2,op1,op2,c1,c2;
  /* on choisit deux comparaisons simples */
  op1='>'; k1=2+rint(12);
  op2='<'; k2=8+rint(11);              /* k2 > k1 souvent */
  c1=OPS[op1](n,k1); c2=OPS[op2](n,k2);
  const result = (logic==='et') ? (c1&&c2) : (c1||c2);
  return { type:'qcm-vf', answer: result ? 'Vrai' : 'Faux', title:'La condition est-elle vraie\u00a0?',
    question:`La variable <b>nombre</b> vaut <b>${n}</b>. Cette condition est-elle <b>vraie</b> ou <b>fausse</b>&nbsp;?`,
    figure: condHexFigure(`nombre ${op1} ${k1}`, logic, `nombre ${op2} ${k2}`),
    hint: logic==='et' ? 'Avec « et », les DEUX conditions doivent être vraies.' : 'Avec « ou », il suffit qu\u2019UNE des deux conditions soit vraie.',
    solution:`« ${n} ${op1} ${k1} » est ${c1?'vraie':'fausse'} et « ${n} ${op2} ${k2} » est ${c2?'vraie':'fausse'}.<br>Avec « ${logic} », la condition complète est <b>${result?'vraie':'fausse'}</b>.` };
}
/* figure : une grande condition hexagonale  (cond1) logic (cond2) */
function condHexFigure(c1, logic, c2){
  const W=330, H=70, h=34, y=18;
  let s='';
  const w1=130, w2=130, lw=36;
  let x=10;
  s+=scHex(x,y,w1,h,c1); x+=w1+6;
  s+=`<text x="${x+lw/2}" y="${y+h/2+5}" font-family="JetBrains Mono,monospace" font-size="14" font-weight="800" fill="#1a6e88" text-anchor="middle">${logic}</text>`; x+=lw+6;
  s+=scHex(x,y,w2,h,c2);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="condition">${s}</svg>`;
}

/* Ex4 : si <nombre est pair> alors {A} sinon {B} */
function genPairImpair(){
  const start = rint(20);              /* 0..19 */
  const wantPair = coin();
  const dThen = pick([10,8,6,4]);
  const dElse = pick([5,3,1]);
  const isPair = (start%2===0);
  const cond = wantPair ? isPair : !isPair;
  const total = start + (cond ? dThen : dElse);
  const condLabel = wantPair ? 'total est pair' : 'total est impair';
  return { type:'input', answer:total, title:'Condition « pair / impair »',
    question:`On exécute ce script. Quelle valeur le lutin <b>dit-il</b> à la fin&nbsp;?`,
    figure: scScript(`mettre total à ${start}`, condLabel,
                     [{t:`ajouter ${dThen} à total`}], [{t:`ajouter ${dElse} à total`}]),
    hint:'Un nombre est pair s\u2019il se termine par 0, 2, 4, 6 ou 8 ; impair sinon.',
    solution:`total = ${start}, qui est <b>${isPair?'pair':'impair'}</b>. La condition « ${condLabel} » est donc <b>${cond?'vraie':'fausse'}</b>.<br>${cond?`On fait « alors »\u00a0: ${start} + ${dThen} = <b>${total}</b>.`:`On fait « sinon »\u00a0: ${start} + ${dElse} = <b>${total}</b>.`}` };
}

const GENERATORS = [genSiAlors, genSiAlorsSinon, genConditionVF, genPairImpair];

/* ============================================================
   Rendu
   ============================================================ */
function generateAll(){
  exos = GENERATORS.map(g => g());
  state = exos.map(()=>({correct:false, errors:0}));
  document.getElementById('results').classList.remove('show');
  const root = document.getElementById('exoList');
  root.innerHTML = '';
  exos.forEach((ex, i) => root.appendChild(buildCard(ex, i)));
  updateScore();
  window.__exos = exos;
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildCard(ex, i){
  const card = document.createElement('div');
  card.className='card'; card.id='card-'+i;
  let body='';
  if(ex.type==='input'){
    body=`
      ${ex.figure ? `<div class="figure">${ex.figure}</div>` : ''}
      <div class="answer-row">
        <input class="num-input" id="in-${i}" type="number" inputmode="numeric" placeholder="?" aria-label="ta réponse">
      </div>
      ${ex.hint ? `<div class="hint">&#128161; ${ex.hint}</div>` : ''}
      <div class="actions" id="act-${i}"><button class="btn btn-check" id="chk-${i}">Vérifier</button></div>`;
  } else { /* qcm-vf */
    body=`
      ${ex.figure ? `<div class="figure">${ex.figure}</div>` : ''}
      <div class="qcm">
        <button class="qcm-btn" data-val="Vrai" data-i="${i}">&#10004; Vrai</button>
        <button class="qcm-btn" data-val="Faux" data-i="${i}">&#10008; Faux</button>
      </div>
      ${ex.hint ? `<div class="hint">&#128161; ${ex.hint}</div>` : ''}
      <div class="actions" id="act-${i}"></div>`;
  }
  card.innerHTML=`
    <div class="card-head">
      <div class="badge-num">${i+1}</div>
      <div class="ctitle">${ex.title}</div>
      <div class="check-mark">&#10004;</div>
    </div>
    <p class="question">${ex.question}</p>
    ${body}
    <div class="feedback" id="fb-${i}"></div>
    <div class="solution" id="sol-${i}">${ex.solution}</div>`;
  setTimeout(()=>{
    if(ex.type==='input'){
      card.querySelector('#chk-'+i).addEventListener('click', ()=>checkInput(i));
      card.querySelector('#in-'+i).addEventListener('keydown', e=>{ if(e.key==='Enter') checkInput(i); });
    } else {
      card.querySelectorAll('.qcm-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>checkVF(i, btn.dataset.val));
      });
    }
  },0);
  return card;
}

function checkInput(i){
  if(state[i].correct) return;
  const inp=document.getElementById('in-'+i); const raw=inp.value.trim().replace(',','.'); const fb=document.getElementById('fb-'+i);
  if(raw===''){ flash(fb,'bad','Écris d\u2019abord ta réponse.'); return; }
  const val=Number(raw);
  if(Number.isNaN(val)){ flash(fb,'bad','Écris un nombre.'); return; }
  if(Math.abs(val-exos[i].answer)<1e-9) markCorrect(i); else markError(i);
}
function checkVF(i, val){
  if(state[i].correct) return;
  const card=document.getElementById('card-'+i);
  card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.toggle('picked', b.dataset.val===val));
  if(val===exos[i].answer) markCorrect(i); else markError(i);
}

function markError(i){
  state[i].errors++;
  document.getElementById('card-'+i).classList.add('is-error');
  flash(document.getElementById('fb-'+i),'bad','Pas encore… relis le script ligne par ligne, puis réessaie.');
  const act=document.getElementById('act-'+i);
  if(!act.querySelector('.btn-retry')){
    const r=document.createElement('button'); r.className='btn btn-retry'; r.innerHTML='&#8635; Réessayer';
    r.addEventListener('click', ()=>retry(i)); act.appendChild(r);
  }
  updateScore();
}
function retry(i){
  const ex=exos[i]; const card=document.getElementById('card-'+i);
  card.classList.remove('is-error'); document.getElementById('fb-'+i).classList.remove('show');
  if(ex.type==='input'){ const inp=document.getElementById('in-'+i); inp.value=''; inp.focus(); }
  else { card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.remove('picked')); }
  const r=document.getElementById('act-'+i).querySelector('.btn-retry'); if(r) r.remove();
}
function markCorrect(i){
  state[i].correct=true;
  const ex=exos[i]; const card=document.getElementById('card-'+i);
  card.classList.remove('is-error'); card.classList.add('is-correct');
  flash(document.getElementById('fb-'+i),'ok','Bravo, c\u2019est juste&nbsp;!');
  document.getElementById('sol-'+i).classList.add('show');
  document.getElementById('act-'+i).classList.add('locked');
  if(ex.type==='input'){ const inp=document.getElementById('in-'+i); inp.disabled=true; inp.classList.add('locked'); }
  else { card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.add('locked')); }
  updateScore(); checkFinished();
}
function flash(el,kind,msg){ el.className='feedback show '+kind; el.innerHTML=msg; }
function updateScore(){
  const ok=state.filter(s=>s.correct).length, err=state.reduce((a,s)=>a+s.errors,0);
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-left').textContent=TOTAL-ok;
  document.getElementById('s-err').textContent=err;
  document.getElementById('xp-text').textContent=ok+' / '+TOTAL;
  document.getElementById('xp-fill').style.width=(100*ok/TOTAL)+'%';
}
function checkFinished(){
  if(state.every(s=>s.correct)){
    const err=state.reduce((a,s)=>a+s.errors,0);
    let stars=3; if(err>=1&&err<=2) stars=2; if(err>=3) stars=1;
    document.getElementById('r-score').textContent=`${TOTAL} / ${TOTAL} réussis · ${err} erreur${err>1?'s':''}`;
    let sh=''; for(let k=0;k<3;k++) sh+=`<span class="${k<stars?'star-on':'star-off'}">&#9733;</span>`;
    document.getElementById('r-stars').innerHTML=sh;
    document.getElementById('r-msg').textContent='Personne ne réussit tout du premier coup — l\u2019important, c\u2019est d\u2019avoir cherché et compris. Tu peux recommencer avec de nouveaux scripts.';
    const res=document.getElementById('results'); res.classList.add('show');
    setTimeout(()=>res.scrollIntoView({behavior:'smooth', block:'center'}), 250);
  }
}
generateAll();
</script>
</body>
</html>
