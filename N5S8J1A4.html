<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pazapa — Je m'entraîne — Aires des polygones et du disque</title>
<style>
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}}
:root{
  --day-color:#f5a623;--day-dark:#c47a10;--day-light:#fff5e0;
  --day-border:#f5d080;--day-glow:rgba(245,166,35,.3);
  --bg:#fffdf7;--surface:#fff;--border:#f0e2c0;
  --green:#8dc63f;--blue:#3ab5d8;--yellow:#f5c518;--red:#b94040;
  --text:#1a1d23;--muted:#8a7a5a;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:0 1rem 110px;overflow-x:hidden;line-height:1.7;}
body::before{content:'';position:fixed;inset:0;z-index:0;opacity:.03;
  background:repeating-linear-gradient(45deg,transparent,transparent 20px,#f5a623 20px,#f5a623 21px);pointer-events:none;}
.bubble-yellow{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:220px;height:220px;background:var(--yellow);top:-60px;right:-40px;pointer-events:none;}
.bubble-day{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:180px;height:180px;background:var(--day-color);bottom:-40px;left:-40px;pointer-events:none;}
.bubble-green{position:fixed;border-radius:50%;z-index:0;opacity:.06;width:140px;height:140px;background:var(--green);top:45%;right:-70px;pointer-events:none;}
.bubble-pink{position:fixed;border-radius:50%;z-index:0;opacity:.06;width:140px;height:140px;background:#f28b82;top:40%;left:-70px;pointer-events:none;}
header{width:100%;text-align:center;padding:1.2rem 0 .5rem;position:relative;z-index:1;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:#f5c518;color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:monospace;font-size:.82rem;color:var(--muted);}
h1{font-size:clamp(1.2rem,3.5vw,1.8rem);font-weight:900;color:var(--day-dark);margin:.3rem 0 .1rem;}
.activity-label{font-size:clamp(1rem,3vw,1.25rem);font-weight:800;color:var(--text);line-height:1.35;}
.subtitle-main{color:var(--muted);font-size:.86rem;font-family:monospace;margin-top:.3rem;}
.stars-badge{display:inline-flex;align-items:center;gap:.5rem;justify-content:center;margin:.7rem auto;padding:.6rem 1.3rem;background:var(--surface);border:2px solid var(--day-border);border-radius:99px;font-family:monospace;font-weight:800;font-size:1.15rem;color:var(--day-dark);position:relative;z-index:1;width:fit-content;}
.stars-badge .star-icon{font-size:1.1rem;}
.hud{width:100%;max-width:680px;display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.6rem 1rem;margin:.6rem auto;background:var(--surface);border:2px solid var(--border);border-radius:12px;position:relative;z-index:1;flex-wrap:wrap;}
.lv-btn{font-family:monospace;font-weight:700;font-size:.8rem;padding:.45rem .9rem;border-radius:8px;border:2px solid var(--border);background:var(--surface);color:var(--muted);min-height:44px;display:inline-flex;align-items:center;-webkit-appearance:none;appearance:none;}
.lv-btn.active{border-color:var(--day-color);background:var(--day-light);color:var(--day-dark);}
.lv-btn.done{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.lv-btn.locked{opacity:.45;cursor:not-allowed;}
.lv-btn:not(.locked){cursor:pointer;}
.lv-btn:focus-visible{outline:3px solid var(--day-dark);outline-offset:2px;}
.level-banner{width:100%;max-width:680px;margin:.3rem auto 0;position:relative;z-index:1;font-size:1rem;font-weight:800;color:var(--day-dark);font-family:monospace;}
.level-mission{width:100%;max-width:680px;margin:0 auto .9rem;font-size:.88rem;color:var(--muted);position:relative;z-index:1;}
#main-zone{width:100%;max-width:680px;position:relative;z-index:1;}
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.3rem 1.4rem;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.05);margin-bottom:.8rem;}
.card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--green));}
.figure-wrap{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.7rem;margin-bottom:1rem;text-align:center;}
.figure-wrap svg{max-width:130px;height:auto;}
.figures-mini-row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-bottom:1rem;}
.figures-mini-row .figure-wrap{flex:0 0 auto;width:130px;}
.q-block{margin-bottom:1.2rem;padding-bottom:1.1rem;border-bottom:1.5px dashed var(--border);}
.q-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.ex-title{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--day-dark);background:var(--day-light);border-left:4px solid var(--day-color);padding:.4rem .7rem;border-radius:6px;margin-bottom:.9rem;}
.q-row{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.6rem;}
.q-num{background:var(--day-color);color:#fff;border-radius:50%;width:1.7rem;height:1.7rem;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;flex-shrink:0;margin-top:.05rem;}
.q-label{font-size:clamp(1rem,3vw,1.1rem);font-weight:700;line-height:1.7;}
.q-feedback{font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;padding:.7rem .9rem;border-radius:10px;margin-top:.6rem;display:none;border-left:5px solid transparent;}
.q-feedback.show{display:block;}
.q-feedback.ok{background:#eefad8;border-left-color:var(--green);color:#3d7a10;}
.q-feedback.ko{background:#fce4e4;border-left-color:#c0392b;color:#8f2f2f;}
.fb-titre{font-weight:800;display:block;margin-bottom:.2rem;}
.hint-actions{margin-top:.7rem;}
.hint-box[hidden]{display:none !important;}
.hint-box{margin-top:.55rem;padding:.7rem .9rem;border:1.5px dashed var(--day-dark);border-radius:10px;background:var(--day-light);color:var(--text);font-size:.88rem;line-height:1.7;}
.expected-answer{margin-top:.55rem;padding-top:.5rem;border-top:1px solid currentColor;font-weight:700;}
.q-block.correct-on-first{border-left:4px solid var(--green);padding-left:.7rem;}
.opts-col{display:flex;flex-direction:column;gap:.45rem;margin-top:.5rem;}
.opt-card{font-size:.92rem;font-weight:600;padding:.65rem 1rem;border-radius:10px;border:2px solid var(--day-border);background:var(--day-light);color:var(--text);cursor:pointer;min-height:48px;text-align:left;display:flex;gap:.6rem;align-items:center;transition:.15s;width:100%;line-height:1.5;font-family:monospace;}
.opt-card:hover:not([disabled]){border-color:var(--day-color);background:#fff3d9;}
.opt-card:focus-visible{outline:3px solid var(--day-dark);outline-offset:2px;}
.opt-card[disabled]{cursor:default;}
.opt-card.ok{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.opt-card.ko{border-color:#c0392b;background:#fce4e4;color:#8f2f2f;}
.opt-card.reveal{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.opt-card.selected{border-color:var(--day-color);background:#fff3d9;font-weight:800;}
.opt-letter{font-family:monospace;font-weight:800;min-width:1.3rem;flex-shrink:0;color:var(--day-dark);}
.trou-wrap{font-size:.98rem;font-weight:600;line-height:2.7;margin:.4rem 0;}
.trou-select{padding:.35rem .55rem;border-radius:8px;border:2px solid var(--day-border);background:var(--day-light);font-family:monospace;font-weight:700;font-size:.9rem;min-height:42px;cursor:pointer;color:var(--day-dark);}
.trou-select:focus-visible{outline:3px solid var(--day-dark);}
.trou-select.ok{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.trou-select.ko{border-color:#c0392b;background:#fce4e4;color:#8f2f2f;}
.num-row{display:flex;align-items:center;gap:.6rem;margin:.5rem 0;flex-wrap:wrap;}
.num-input{width:7rem;padding:.5rem .6rem;border-radius:8px;border:2px solid var(--day-border);background:var(--day-light);font-family:monospace;font-size:1.05rem;font-weight:800;text-align:center;color:var(--day-dark);}
.num-input:focus-visible{outline:3px solid var(--day-dark);}
.num-input.ok{border-color:var(--green);background:#eefad8;color:#3d7a10;}
.num-input.ko{border-color:#c0392b;background:#fce4e4;color:#8f2f2f;}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(.88rem,2.5vw,.97rem);font-weight:800;cursor:pointer;border:none;min-height:44px;transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn:focus-visible{outline:3px solid var(--day-dark);outline-offset:2px;}
.btn-primary{background:var(--day-dark);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
.btn-primary:hover{transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
.btn-ghost:hover{border-color:var(--day-color);color:var(--text);}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem;}
.msg-vide{font-family:monospace;font-size:.85rem;color:#c0392b;width:100%;margin-bottom:.2rem;}
.level-success{display:none;background:var(--surface);border:2px solid var(--green);border-radius:var(--radius);padding:1.4rem;text-align:center;margin-top:.6rem;box-shadow:0 4px 16px rgba(141,198,63,.15);}
.level-success.show{display:block;}
.ls-star{font-size:2rem;margin-bottom:.3rem;}
.ls-title{font-weight:800;font-size:1.05rem;color:#3d7a10;margin-bottom:.4rem;}
.ls-msg{font-size:.92rem;color:var(--text);line-height:1.8;}
.soon-card{background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius);padding:2rem 1.4rem;text-align:center;color:var(--muted);font-size:.95rem;}
#final-screen{display:none;width:100%;max-width:680px;position:relative;z-index:1;}
#final-screen.show{display:block;}
.final-card{background:var(--surface);border:2px solid var(--day-border);border-radius:var(--radius);padding:2rem 1.6rem;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.stripe{height:4px;border-radius:4px;margin-bottom:1.2rem;background:linear-gradient(90deg,#f5a623,#f5c518,#8dc63f);}
.final-title{font-size:1.2rem;font-weight:900;color:var(--day-dark);margin-bottom:.4rem;}
.final-sub{font-size:.94rem;color:var(--text);line-height:1.8;margin-bottom:.8rem;}
@media(max-width:480px){body{padding:0 .75rem 90px;}.card{padding:1rem;}}
</style>
</head>

</div>

    <div class="stripe"></div>
    <div class="logo-badge" style="margin:0 auto .7rem;display:flex;width:fit-content;">
      <span class="logo-dot" style="background:#f5c518"></span>

    </div>
    <div class="final-title" id="final-title" tabindex="-1">&#127881; Bravo&nbsp;!</div>

      <button class="btn btn-ghost" id="btn-review">&#8635; Revoir les niveaux</button>
    </div>
  </div>
</div>

var $=function(id){return document.getElementById(id);};
var currentLevel=0;
var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var state={};

function initState(){
  state={
    0:{answers:{},attempts:0,validated:false,done:false,unlocked:true},
    1:{answers:{},attempts:0,validated:false,done:false,unlocked:false},

  };
}
initState();

/* ══════════════════════════════════════════════════════
   MOTEUR G\u00c9N\u00c9RIQUE DE RENDU DES QUESTIONS
   ══════════════════════════════════════════════════════ */
function tagsHtml(tags){
  if(!tags||!tags.length) return '';
  var h='<div class="tags-row">';
  tags.forEach(function(t){h+='<span class="tag">'+t+'</span>';});
  return h+'</div>';
}
function figHtml(qd){
  if(qd.figureHtml) return qd.figureHtml;
  return qd.figure?'<div class="figure-wrap">'+qd.figure+'</div>':'';
}
function exTitleHtml(qd){
  return qd.exTitle?'<div class="ex-title">'+qd.exTitle+'</div>':'';
}
function hintBoxHtml(qd,st){
  if(!qd.hint){
    return '';
  }
  return '<div class="hint-actions">'
    +'<button type="button"'
    +' class="btn btn-ghost btn-question-hint"'
    +' id="hint-btn-'+qd.key+'"'
    +' aria-expanded="false"'
    +' aria-controls="hint-'+qd.key+'">'
    +'\uD83D\uDCA1 Indice'
    +'</button>'
    +'<div class="hint-box" id="hint-'+qd.key+'" hidden>'
    +qd.hint
    +'</div>'
    +'</div>';
}
function attachHintBtn(qd,st,lvlIdx,root){
  if(!qd.hint){
    return;
  }
  var button=root.querySelector('#hint-btn-'+qd.key);
  var box=root.querySelector('#hint-'+qd.key);
  if(!button || !box){
    return;
  }
  button.addEventListener('click',function(){
    var open=box.hidden;
    box.hidden=!open;
    button.setAttribute('aria-expanded',open?'true':'false');
    button.textContent=open?'\uD83D\uDCA1 Masquer l\u2019indice':'\uD83D\uDCA1 Indice';
  });
}

// QCM
function renderQCM(container,qd,st,lvlIdx){
  var b=document.createElement('div'); b.className='q-block';
  b.innerHTML=exTitleHtml(qd)+'<div class="q-row"><span class="q-num">'+qd.num+'</span><span class="q-label">'+qd.label+'</span></div>'
    +tagsHtml(qd.tags)+figHtml(qd)
    +'<div class="opts-col" id="opts-'+qd.key+'"></div>'
    +hintBoxHtml(qd,st)
    +'<div class="q-feedback" id="fb-'+qd.key+'" role="status" aria-live="polite"></div>';
  container.appendChild(b);
  attachHintBtn(qd,st,lvlIdx,b);
  var row=b.querySelector('#opts-'+qd.key);
  qd.options.forEach(function(o,i){
    var btn=document.createElement('button'); btn.type='button'; btn.className='opt-card';
    btn.innerHTML='<span class="opt-letter">'+String.fromCharCode(65+i)+'.</span> '+o;
    var cur=st.answers[qd.key];
    if(st.validated){
      btn.disabled=true;
      if(i===qd.correct) btn.classList.add(cur===i?'ok':'reveal');
      else if(cur===i) btn.classList.add('ko');
    } else if(cur===i) btn.classList.add('selected');
    btn.addEventListener('click',function(){
      if(state[lvlIdx].validated) return;
      state[lvlIdx].answers[qd.key]=i;
      row.querySelectorAll('.opt-card').forEach(function(bb,j){bb.className='opt-card'+(j===i?' selected':'');});
    });
    row.appendChild(btn);
  });
  if(st.validated&&st.answers[qd.key]!==undefined){
    var ok=st.answers[qd.key]===qd.correct;
    var fb=b.querySelector('#fb-'+qd.key);
    fb.className='q-feedback show '+(ok?'ok':'ko');
    fb.innerHTML='<span class="fb-titre">'+(ok?'\u2705':'\u274c')+'</span>'+(ok?qd.fbOk:qd.fbKo);
  }
}
function qcmAnswered(qd,st){return st.answers[qd.key]!==undefined;}
function qcmCorrect(qd,st){return st.answers[qd.key]===qd.correct;}

// Texte \u00e0 trous / association
function renderFill(container,qd,st,lvlIdx){
  var b=document.createElement('div'); b.className='q-block';
  b.innerHTML=exTitleHtml(qd)+'<div class="q-row"><span class="q-num">'+qd.num+'</span><span class="q-label">'+qd.label+'</span></div>'
    +tagsHtml(qd.tags)+figHtml(qd);
  var tw=document.createElement('div'); tw.className='trou-wrap';
  qd.segments.forEach(function(seg,si){
    if(typeof seg==='string'){
      tw.appendChild(document.createTextNode(seg));
    } else {
      var sel=document.createElement('select'); sel.className='trou-select'; sel.id='sel-'+qd.key+'-'+si;
      sel.setAttribute('aria-label', seg.ariaLabel || 'Choisir la r\u00e9ponse');
      seg.options.forEach(function(o,i){var opt=document.createElement('option');opt.value=i;opt.textContent=o;sel.appendChild(opt);});
      var cur=st.answers[qd.key+'_'+si];
      if(cur!==undefined) sel.value=cur;
      if(st.validated){sel.disabled=true;sel.classList.add(cur==seg.correct?'ok':'ko');}
      sel.addEventListener('change',function(){state[lvlIdx].answers[qd.key+'_'+si]=parseInt(sel.value);});
      tw.appendChild(sel);
    }
  });
  b.appendChild(tw);
  var hintWrap=document.createElement('div'); hintWrap.innerHTML=hintBoxHtml(qd,st);
  b.appendChild(hintWrap);
  attachHintBtn(qd,st,lvlIdx,b);
  var fb=document.createElement('div'); fb.className='q-feedback'; fb.id='fb-'+qd.key;
  fb.setAttribute('role','status'); fb.setAttribute('aria-live','polite');
  if(st.validated){
    var ok=fillCorrect(qd,st);
    fb.className='q-feedback show '+(ok?'ok':'ko');
    fb.innerHTML='<span class="fb-titre">'+(ok?'\u2705':'\u274c')+'</span>'+(ok?qd.fbOk:qd.fbKo);
    if(!ok){
      fb.innerHTML+='<div class="expected-answer"><strong>R\u00e9ponses attendues\u00a0:</strong> '+fillExpectedText(qd)+'</div>';
    }
  }
  b.appendChild(fb);
  container.appendChild(b);
}
function fillExpectedText(qd){
  var answers=[];
  qd.segments.forEach(function(seg){
    if(typeof seg!=='string'){
      answers.push(seg.options[seg.correct]);
    }
  });
  return answers.join(' \u00b7 ');
}
function fillBlankKeys(qd){
  var ks=[];qd.segments.forEach(function(seg,si){if(typeof seg!=='string') ks.push({key:qd.key+'_'+si,correct:seg.correct});});
  return ks;
}
function fillAnswered(qd,st){
  return fillBlankKeys(qd).every(function(b){return st.answers[b.key]!==undefined&&st.answers[b.key]!==0;});
}
function fillCorrect(qd,st){
  return fillBlankKeys(qd).every(function(b){return st.answers[b.key]===b.correct;});
}

// R\u00e9ponse num\u00e9rique
function normalizeNumeric(v){
  if(v===null||v===undefined) return null;
  var s=String(v).trim().toLowerCase()
    .replace(/\u00a0/g,' ')
    .replace(/\u00b0/g,'')
    .replace(/cm\u00b2/g,'')
    .replace(/cm2/g,'')
    .replace(/cm/g,'')
    .replace(/\s+/g,'')
    .replace(/,/g,'.');
  if(s==='') return null;
  if(!/^-?\d+(?:\.\d+)?$/.test(s)) return null;
  var n=Number(s);
  return Number.isFinite(n)?n:null;
}
function renderNumeric(container,qd,st,lvlIdx){
  var b=document.createElement('div'); b.className='q-block';
  b.innerHTML=exTitleHtml(qd)+'<div class="q-row"><span class="q-num">'+qd.num+'</span><span class="q-label">'+qd.label+'</span></div>'
    +tagsHtml(qd.tags)+figHtml(qd);
  var row=document.createElement('div'); row.className='num-row';
  var inp=document.createElement('input'); inp.type='text'; inp.inputMode='decimal'; inp.className='num-input';
  inp.id='num-'+qd.key; inp.setAttribute('aria-label','R\u00e9ponse en '+(qd.unit||''));
  var cur=st.answers[qd.key];
  if(cur!==undefined) inp.value=cur;
  if(st.validated){
    inp.disabled=true;
    inp.classList.add(normalizeNumeric(cur)===qd.expected?'ok':'ko');
  }
  inp.addEventListener('input',function(){ if(!state[lvlIdx].validated) state[lvlIdx].answers[qd.key]=inp.value; });
  row.appendChild(inp);
  var unit=document.createElement('span'); unit.textContent=qd.unit||''; row.appendChild(unit);
  b.appendChild(row);
  var hintWrap=document.createElement('div'); hintWrap.innerHTML=hintBoxHtml(qd,st);
  b.appendChild(hintWrap);
  attachHintBtn(qd,st,lvlIdx,b);
  var fb=document.createElement('div'); fb.className='q-feedback'; fb.id='fb-'+qd.key;
  fb.setAttribute('role','status'); fb.setAttribute('aria-live','polite');
  if(st.validated){
    var ok=numCorrect(qd,st);
    fb.className='q-feedback show '+(ok?'ok':'ko');
    fb.innerHTML='<span class="fb-titre">'+(ok?'\u2705':'\u274c')+'</span>'+(ok?qd.fbOk:qd.fbKo);
    if(!ok && qd.answerDisplay){
      fb.innerHTML+='<div class="expected-answer"><strong>R\u00e9ponse attendue\u00a0:</strong> '+qd.answerDisplay+'</div>';
    }
  }
  b.appendChild(fb);
  container.appendChild(b);
}
function numAnswered(qd,st){ return st.answers[qd.key]!==undefined && normalizeNumeric(st.answers[qd.key])!==null; }
function numCorrect(qd,st){ var v=normalizeNumeric(st.answers[qd.key]); return v!==null && Math.abs(v-qd.expected)<0.05; }

function renderQuestion(container,qd,st,lvlIdx){
  if(qd.type==='fill') renderFill(container,qd,st,lvlIdx);
  else if(qd.type==='numeric') renderNumeric(container,qd,st,lvlIdx);
  else renderQCM(container,qd,st,lvlIdx);
}
function qAnswered(qd,st){
  if(qd.type==='fill') return fillAnswered(qd,st);
  if(qd.type==='numeric') return numAnswered(qd,st);
  return qcmAnswered(qd,st);
}
function qCorrect(qd,st){
  if(qd.type==='fill') return fillCorrect(qd,st);
  if(qd.type==='numeric') return numCorrect(qd,st);
  return qcmCorrect(qd,st);
}

function renderLevel(){
  updateHUD();
  var zone=$('main-zone'); zone.innerHTML='';
  var lvlIdx=currentLevel, lvl=LEVELS[lvlIdx], st=state[lvlIdx];
  if(!lvl){
    var soon=document.createElement('div'); soon.className='soon-card';
    soon.textContent='Niveau '+(lvlIdx+1)+' \u2014 contenu \u00e0 venir.';
    zone.appendChild(soon);
    return;
  }
  var card=document.createElement('div'); card.className='card';
  card.innerHTML='<div class="card-stripe"></div>';
  if(lvl.figure){
    var fw=document.createElement('div'); fw.className='figure-wrap';
    fw.innerHTML=lvl.figure+'<div class="figure-cap">'+lvl.figureCaption+'</div>';
    card.appendChild(fw);
  }
  lvl.questions.forEach(function(qd){renderQuestion(card,qd,st,lvlIdx);});
  zone.appendChild(card);
  appendFooter(lvl,zone,lvlIdx,st);
}

function allAnswered(){
  var lvl=LEVELS[currentLevel], st=state[currentLevel];
  return lvl.questions.every(function(qd){return qAnswered(qd,st);});
}
function allCorrect(){
  var lvl=LEVELS[currentLevel], st=state[currentLevel];
  return lvl.questions.every(function(qd){return qCorrect(qd,st);});
}

function updateHUD(){
  var starsEarned=[0,1,2].filter(function(i){return state[i].done;}).length;
  $('stars-badge').innerHTML='<span class="star-icon">\u2b50</span> '+starsEarned+'&nbsp;/&nbsp;3';
  [0,1,2].forEach(function(i){
    var btn=$('lv'+(i+1)+'-btn'); if(!btn) return;
    var hasContent=!!LEVELS[i];
    btn.className='lv-btn'+(i===currentLevel?' active':state[i].done?' done':(!state[i].unlocked||!hasContent)?' locked':'');
    btn.disabled=!(state[i].unlocked&&hasContent);
    btn.setAttribute('aria-disabled', (state[i].unlocked&&hasContent)?'false':'true');
    if(i===currentLevel){btn.setAttribute('aria-current','step');} else {btn.removeAttribute('aria-current');}
  });
  if(LEVELS[currentLevel]){
    $('level-banner').textContent=LEVELS[currentLevel].title;
    $('level-mission').innerHTML='\uD83C\uDFAF Objectif\u00a0: '+LEVELS[currentLevel].mission;
  } else {
    $('level-banner').textContent='Niveau '+(currentLevel+1);
    $('level-mission').innerHTML='';
  }
}

function goToLevel(i){
  if(!state[i].unlocked) return;
  currentLevel=i; renderLevel();
  window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
}

function appendFooter(lvl,zone,lvlIdx,st){
  var suc=document.createElement('div'); suc.className='level-success'; suc.id='lvs-'+lvlIdx;
  if(st.done){
    suc.classList.add('show');
    suc.innerHTML='<div class="ls-star">\u2705</div><div class="ls-title">Niveau r\u00e9ussi\u00a0!</div><div class="ls-msg">'+lvl.fbSuccess+'</div>';
    if(lvlIdx<2 && LEVELS[lvlIdx+1]){
      var nb=document.createElement('button'); nb.type='button'; nb.className='btn btn-primary'; nb.style.marginTop='.8rem';
      nb.innerHTML='Niveau '+(lvlIdx+2)+' \u2192'; nb.addEventListener('click',goNext); suc.appendChild(nb);
    } else {
      var fb=document.createElement('button'); fb.type='button'; fb.className='btn btn-primary'; fb.style.marginTop='.8rem';
      fb.innerHTML='Voir le bilan \u2192'; fb.addEventListener('click',showFinal); suc.appendChild(fb);
    }
  } else if(st.validated && st.attempts>=2){
    suc.classList.add('show');
    suc.innerHTML='<div class="ls-star">\uD83D\uDCA1</div><div class="ls-title">Corrections disponibles ci-dessus</div><div class="ls-msg">Tu peux continuer vers la suite, ou retenter ce niveau.</div>';
    var rowBtns=document.createElement('div'); rowBtns.className='btn-row'; rowBtns.style.justifyContent='center';
    var rb=document.createElement('button'); rb.type='button'; rb.className='btn btn-ghost';
    rb.innerHTML='\u21bb Retenter ce niveau'; rb.addEventListener('click',restartLevel); rowBtns.appendChild(rb);
    if(lvlIdx<2 && LEVELS[lvlIdx+1]){
      if(!state[lvlIdx+1].unlocked) state[lvlIdx+1].unlocked=true;
      var nb2=document.createElement('button'); nb2.type='button'; nb2.className='btn btn-primary';
      nb2.innerHTML='Continuer \u2192 Niveau '+(lvlIdx+2); nb2.addEventListener('click',goNext); rowBtns.appendChild(nb2);
    } else if(lvlIdx===2){
      var fb2=document.createElement('button'); fb2.type='button'; fb2.className='btn btn-primary';
      fb2.innerHTML='Voir le bilan \u2192'; fb2.addEventListener('click',showFinal); rowBtns.appendChild(fb2);
    }
    suc.appendChild(rowBtns);
  }
  zone.appendChild(suc);

  if(!st.done && !(st.validated && st.attempts>=2)){
    var br=document.createElement('div'); br.className='btn-row';
    var vb=document.createElement('button'); vb.type='button'; vb.className='btn btn-primary';
    vb.innerHTML=st.attempts>0?'\u21bb V\u00e9rifier \u00e0 nouveau':'\u2713 V\u00e9rifier';
    vb.addEventListener('click',verifyLevel); br.appendChild(vb);
    var rb3=document.createElement('button'); rb3.type='button'; rb3.className='btn btn-ghost';
    rb3.innerHTML='\u21bb Recommencer'; rb3.addEventListener('click',restartLevel); br.appendChild(rb3);
    zone.appendChild(br);
  }
}

function showFirstAttemptHelp(){
  var lvl=LEVELS[currentLevel], st=state[currentLevel];
  lvl.questions.forEach(function(qd){
    if(!qCorrect(qd,st)){
      var fb=$('fb-'+qd.key);
      if(fb){fb.className='q-feedback show ko';fb.innerHTML='<span class="fb-titre">\uD83D\uDCA1 Indice</span>'+qd.hint;}
      var hintBox=$('hint-'+qd.key);
      var hintBtn=$('hint-btn-'+qd.key);
      if(hintBox){ hintBox.hidden=false; }
      if(hintBtn){ hintBtn.setAttribute('aria-expanded','true'); hintBtn.textContent='\uD83D\uDCA1 Masquer l\u2019indice'; }
    }
  });
}

function verifyLevel(){
  var lvlIdx=currentLevel, st=state[lvlIdx];
  if(!allAnswered()){
    var rows=document.querySelectorAll('#main-zone .btn-row');
    rows.forEach(function(row){
      if(!row.querySelector('.msg-vide')){
        var msg=document.createElement('div'); msg.className='msg-vide';
        msg.textContent='\u270F\uFE0F R\u00e9ponds \u00e0 toutes les questions avant de valider.';
        row.insertBefore(msg,row.firstChild);
      }
    });
    return;
  }
  st.attempts++;
  if(allCorrect()){
    st.validated=true; st.done=true;
    if(lvlIdx<2 && LEVELS[lvlIdx+1]) state[lvlIdx+1].unlocked=true;
    renderLevel();
  } else if(st.attempts===1){
    st.validated=false;
    renderLevel();
    showFirstAttemptHelp();
    var rows2=document.querySelectorAll('#main-zone .btn-row');
    rows2.forEach(function(row){
      row.innerHTML='';
      var vb=document.createElement('button'); vb.type='button'; vb.className='btn btn-primary';
      vb.innerHTML='\u21bb V\u00e9rifier \u00e0 nouveau'; vb.addEventListener('click',verifyLevel); row.appendChild(vb);
      var rb=document.createElement('button'); rb.type='button'; rb.className='btn btn-ghost';
      rb.innerHTML='\u21bb Recommencer'; rb.addEventListener('click',restartLevel); row.appendChild(rb);
    });
  } else {
    st.validated=true;
    if(lvlIdx<2 && LEVELS[lvlIdx+1]) state[lvlIdx+1].unlocked=true;
    renderLevel();
  }
}

function goNext(){
  if(currentLevel<2){currentLevel++; renderLevel(); window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});}
}
function restartLevel(){
  var lvlIdx=currentLevel;
  var wasUnlocked=state[lvlIdx].unlocked;
  state[lvlIdx]={answers:{},attempts:0,validated:false,done:false,unlocked:wasUnlocked};
  renderLevel();
  window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
}
function showFinal(){
  $('main-zone').style.display='none';
  document.querySelector('.hud').style.display='none';
  $('stars-badge').style.display='none';
  $('level-banner').style.display='none';
  $('level-mission').style.display='none';
  $('final-screen').classList.add('show');
  window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
  $('final-title').focus();
}
function reviewLevels(){
  currentLevel=0;
  $('final-screen').classList.remove('show');
  ['main-zone','level-banner','level-mission','stars-badge'].forEach(function(id){$(id).style.display='';});
  document.querySelector('.hud').style.display='';
  renderLevel();
  window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
}

$('lv1-btn').addEventListener('click',function(){goToLevel(0);});
$('lv2-btn').addEventListener('click',function(){goToLevel(1);});
$('lv3-btn').addEventListener('click',function(){goToLevel(2);});
$('btn-review').addEventListener('click',reviewLevels);

renderLevel();
</script>
</body>
</html>
