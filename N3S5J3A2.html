<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résoudre les exercices — Nombres relatifs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Charte du jour : J3 VERT ===== */
  :root{
    --j3:#8dc63f; --j3-dark:#3d7a10; --j3-soft:#f0faeb; --j3-accent:#b5e08a;
    --ink:#243018; --ink-soft:#586b45; --ok:#3d8b40; --ok-soft:#eaf6ea;
    --err:#c0392b; --err-soft:#fdecea; --line:#dcebcf; --white:#ffffff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; overflow-x:hidden; }
  body{ font-family:'JetBrains Mono', ui-monospace, monospace; color:var(--ink); background:var(--white);
    line-height:1.55; -webkit-font-smoothing:antialiased; position:relative; min-height:100vh; }

  .blob{ position:fixed; z-index:0; background:var(--j3-accent); opacity:0.28; filter:blur(1px); pointer-events:none; }
  .blob-1{ top:-160px; right:-150px; width:460px; height:430px; border-radius:62% 38% 46% 54% / 58% 47% 53% 42%; }
  .blob-2{ top:42%; left:-190px; width:430px; height:470px; border-radius:44% 56% 63% 37% / 49% 38% 62% 51%; opacity:0.26; }
  .blob-3{ bottom:-180px; left:14%; width:500px; height:420px; border-radius:55% 45% 38% 62% / 42% 60% 40% 58%; opacity:0.27; }

  .wrap{ position:relative; z-index:1; max-width:860px; margin:0 auto; padding:26px 18px 60px; }
  .hero{ text-align:center; padding:14px 6px 22px; }
  .pill{ display:inline-block; background:var(--j3-soft); border:2px solid var(--j3-accent); color:var(--j3-dark);
    font-weight:700; font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase; padding:7px 16px; border-radius:999px; margin-bottom:16px; }
  .hero h1{ font-size:2.05rem; font-weight:800; color:var(--j3-dark); line-height:1.15; margin-bottom:10px; }
  .hero p.sub{ font-size:1.02rem; color:var(--ink-soft); max-width:580px; margin:0 auto; font-weight:500; }
  .hero .consigne{ display:inline-block; margin-top:14px; background:var(--white); border:2px dashed var(--j3-accent);
    border-radius:12px; padding:8px 16px; font-weight:600; color:var(--j3-dark); font-size:0.92rem; }

  .scoreboard{ position:sticky; top:10px; z-index:20; background:var(--white); border:2px solid var(--line); border-radius:16px;
    box-shadow:0 6px 20px rgba(61,122,16,0.10); padding:14px 16px; margin:10px 0 26px; }
  .score-stats{ display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:stretch; }
  .stat{ flex:1 1 90px; background:var(--j3-soft); border-radius:12px; padding:8px 6px; text-align:center; border:1.5px solid var(--j3-accent); }
  .stat .num{ font-size:1.5rem; font-weight:800; color:var(--j3-dark); line-height:1.1; }
  .stat .lbl{ font-size:0.72rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .stat.err{ background:var(--err-soft); border-color:#f3c6c0; } .stat.err .num{ color:var(--err); }
  .stat.done{ background:var(--ok-soft); border-color:#bfe0c0; } .stat.done .num{ color:var(--ok); }
  .xp-row{ margin-top:12px; }
  .xp-top{ display:flex; justify-content:space-between; font-size:0.8rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .xp-track{ height:16px; background:var(--j3-soft); border-radius:999px; overflow:hidden; border:1.5px solid var(--j3-accent); }
  .xp-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--j3), var(--j3-dark)); border-radius:999px; transition:width 0.5s cubic-bezier(.2,.8,.2,1); }

  .card{ background:var(--white); border:2px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:22px;
    box-shadow:0 4px 14px rgba(36,48,24,0.05); transition:border-color 0.3s, box-shadow 0.3s; }
  .card.is-correct{ border-color:#bfe0c0; box-shadow:0 6px 18px rgba(61,139,64,0.12); }
  .card.is-error{ border-color:#f3c6c0; }
  .card-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .badge-num{ flex:0 0 auto; width:42px; height:42px; background:var(--j3); color:var(--white); border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.25rem; }
  .card.is-correct .badge-num{ background:var(--ok); }
  .card-head .ctitle{ font-weight:700; font-size:1.02rem; color:var(--j3-dark); }
  .card.is-correct .ctitle{ color:var(--ok); }
  .check-mark{ margin-left:auto; font-size:1.5rem; color:var(--ok); opacity:0; transition:opacity 0.3s; }
  .card.is-correct .check-mark{ opacity:1; }

  .question{ font-size:1rem; margin-bottom:14px; color:var(--ink); }
  .question b{ color:var(--j3-dark); }

  .math-box{ background:var(--j3-soft); border:1.5px solid var(--j3-accent); border-radius:14px; padding:18px 14px;
    margin:0 auto 16px; text-align:center; font-size:1.6rem; font-weight:800; color:var(--j3-dark); letter-spacing:0.02em; }
  .math-box .neg{ color:var(--err); }
  .figure{ background:var(--j3-soft); border:1.5px solid var(--j3-accent); border-radius:14px; padding:8px; margin:0 auto 16px; max-width:460px; }
  .figure svg{ width:100%; height:auto; display:block; }

  .answer-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .num-input{ font-family:inherit; font-size:1.2rem; font-weight:700; width:140px; padding:12px 14px;
    border:2.5px solid var(--j3-accent); border-radius:12px; color:var(--ink); text-align:center; background:var(--white); }
  .num-input:focus{ outline:none; border-color:var(--j3); box-shadow:0 0 0 4px rgba(141,198,63,0.22); }

  .qcm{ display:flex; gap:10px; flex-wrap:wrap; }
  .qcm-btn{ font-family:inherit; flex:1 1 80px; font-size:1.25rem; font-weight:800; padding:16px 12px;
    border:2.5px solid var(--j3-accent); border-radius:14px; background:var(--white); color:var(--j3-dark); cursor:pointer; transition:0.15s; }
  .qcm-btn:hover{ background:var(--j3-soft); } .qcm-btn:active{ transform:scale(0.97); }
  .qcm-btn.picked{ background:var(--j3); color:var(--white); border-color:var(--j3-dark); }

  .btn{ font-family:inherit; font-weight:700; font-size:1.02rem; padding:13px 22px; border:none; border-radius:12px; cursor:pointer; transition:0.12s; }
  .btn:active{ transform:scale(0.97); }
  .btn-check{ background:var(--j3); color:var(--white); box-shadow:0 4px 0 var(--j3-dark); }
  .btn-check:hover{ background:#7eb635; box-shadow:0 4px 0 #336609; }
  .btn-retry{ background:var(--err-soft); color:var(--err); border:2px solid #f3c6c0; }
  .btn-retry:hover{ background:#fbe0db; }
  .btn-big{ display:block; width:100%; max-width:340px; margin:18px auto 0; background:var(--j3-dark); color:var(--white);
    font-size:1.12rem; padding:16px; box-shadow:0 5px 0 #2c5a09; }
  .btn-big:hover{ background:#326409; }

  .feedback{ margin-top:14px; font-weight:600; display:none; }
  .feedback.show{ display:block; } .feedback.ok{ color:var(--ok); } .feedback.bad{ color:var(--err); }
  .solution{ margin-top:12px; background:var(--ok-soft); border:1.5px solid #bfe0c0; border-radius:12px; padding:12px 14px; font-size:0.95rem; color:#1f5b22; display:none; }
  .solution.show{ display:block; } .solution b{ color:var(--ok); } .solution .neg{ color:var(--err); font-weight:700; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .locked{ opacity:0.65; pointer-events:none; }
  .hint{ font-size:0.86rem; color:var(--ink-soft); margin-top:6px; font-style:italic; }

  .results{ display:none; text-align:center; background:var(--white); border:2.5px solid var(--j3-accent); border-radius:20px;
    padding:34px 22px; margin-bottom:24px; box-shadow:0 10px 30px rgba(61,122,16,0.16); }
  .results.show{ display:block; animation:pop 0.5s ease; }
  @keyframes pop{ from{ transform:scale(0.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .results .trophy{ font-size:3.4rem; line-height:1; }
  .results h2{ color:var(--j3-dark); font-size:1.6rem; margin:10px 0 4px; }
  .results .rscore{ font-size:1.1rem; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .stars{ font-size:2rem; letter-spacing:6px; margin:6px 0 12px; }
  .star-on{ color:var(--j3); } .star-off{ color:var(--line); }
  .results .rmsg{ color:var(--ink-soft); font-weight:500; max-width:440px; margin:0 auto 6px; }

  @media (max-width:430px){
    .hero h1{ font-size:1.62rem; } .stat .num{ font-size:1.25rem; } .stat .lbl{ font-size:0.64rem; }
    .num-input{ width:120px; } .wrap{ padding:20px 12px 50px; } .math-box{ font-size:1.35rem; }
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="wrap">
    <header class="hero">
      <span class="pill">Semaine 5 · Jour 3</span>
      <h1>&#9999;&#65039; Résoudre les exercices</h1>
      <p class="sub">Nombres relatifs : additionner, soustraire, multiplier et comparer des nombres positifs et négatifs.</p>
      <div class="consigne">&#129504; Résous <u>mentalement</u> et <u>sans calculatrice</u>.</div>
    </header>

    <section class="scoreboard" aria-label="Tableau de score">
      <div class="score-stats">
        <div class="stat done"><div class="num" id="s-ok">0</div><div class="lbl">Réussies</div></div>
        <div class="stat"><div class="num" id="s-left">4</div><div class="lbl">Restantes</div></div>
        <div class="stat err"><div class="num" id="s-err">0</div><div class="lbl">Erreurs</div></div>
      </div>
      <div class="xp-row">
        <div class="xp-top"><span>Progression</span><span id="xp-text">0 / 4</span></div>
        <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
      </div>
    </section>

    <div id="results" class="results">
      <div class="trophy">&#127942;</div>
      <h2>Tous les exercices terminés&nbsp;!</h2>
      <div class="rscore" id="r-score"></div>
      <div class="stars" id="r-stars"></div>
      <p class="rmsg" id="r-msg"></p>
      <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer</button>
    </div>

    <main id="exoList"></main>
    <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer tous les exercices</button>
  </div>

<script>
/* ============================================================
   PAZAPA — N3S5J3 — Nombres relatifs
   ============================================================ */
const TOTAL = 4;
const rint = n => Math.floor(Math.random()*n);
const pick = a => a[rint(a.length)];
const coin = () => Math.random() < 0.5;

let exos = [];
let state = [];

/* nombre relatif non nul dans [-rng, rng] */
function relNonZero(rng){ let v=0; while(v===0){ v = rint(2*rng+1)-rng; } return v; }
/* écriture (+a) ou (-a) avec parenthèses, le négatif en rouge */
function paren(v){
  const sign = v<0 ? '−' : '+';
  const cls = v<0 ? ' class="neg"' : '';
  return `(<span${cls}>${sign}${Math.abs(v)}</span>)`;
}
/* écriture simple d'un relatif (pour solutions), négatif en rouge */
function rel(v){
  if(v<0) return `<span class="neg">−${Math.abs(v)}</span>`;
  return `${v}`;
}

/* ---------- Droite graduée (Ex4) ---------- */
function droiteGraduee(a,b){
  const W=440,H=104,y=60;
  const lo=Math.min(a,b,0)-1, hi=Math.max(a,b,0)+1;
  const span=Math.max(hi-lo,1);
  const mL=28, mR=28, u=(W-mL-mR)/span;
  const X=v=>mL+(v-lo)*u;
  const GRN='#3d7a10', RED='#c0392b', BLU='#1a6e88';
  // n'afficher un label que tous les "step" pour éviter le chevauchement
  const step = span>16 ? 2 : 1;
  let s='';
  s+=`<line x1="${mL-10}" y1="${y}" x2="${W-mR+10}" y2="${y}" stroke="${GRN}" stroke-width="2.4"/>`;
  s+=`<path d="M ${W-mR+10} ${y} l -9 -5 l 0 10 Z" fill="${GRN}"/>`;
  for(let v=Math.ceil(lo); v<=Math.floor(hi); v++){
    const x=X(v);
    s+=`<line x1="${x}" y1="${y-6}" x2="${x}" y2="${y+6}" stroke="${GRN}" stroke-width="${v===0?2.4:1.3}"/>`;
    if(v%step===0 || v===0){
      s+=`<text x="${x}" y="${y+24}" font-family="JetBrains Mono,monospace" font-size="12" font-weight="${v===0?800:600}" fill="#243018" text-anchor="middle">${v}</text>`;
    }
  }
  function pt(v,col,label){
    const x=X(v);
    return `<circle cx="${x}" cy="${y}" r="6" fill="${col}"/>`+
           `<text x="${x}" y="${y-14}" font-family="JetBrains Mono,monospace" font-size="14" font-weight="800" fill="${col}" text-anchor="middle">${label}</text>`;
  }
  s+=pt(a,RED,'a')+pt(b,BLU,'b');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="droite graduée">${s}</svg>`;
}

/* ============================================================
   Générateurs
   ============================================================ */

/* Ex1 : addition de relatifs */
function genAddition(){
  const a=relNonZero(12), b=relNonZero(12);
  const res=a+b;
  return { type:'input', answer:res, title:'Additionner des relatifs',
    question:`Calcule cette somme de nombres relatifs.`,
    mathHtml:`${paren(a)} + ${paren(b)} = ?`,
    hint:'Mêmes signes&nbsp;: on additionne et on garde le signe. Signes différents&nbsp;: on soustrait et on garde le signe du plus grand en distance à zéro.',
    solution:`${paren(a)} + ${paren(b)} = <b>${rel(res)}</b>.` };
}
/* Ex2 : soustraction de relatifs */
function genSoustraction(){
  const a=relNonZero(12), b=relNonZero(12);
  const res=a-b;
  return { type:'input', answer:res, title:'Soustraire des relatifs',
    question:`Calcule cette différence de nombres relatifs.`,
    mathHtml:`${paren(a)} − ${paren(b)} = ?`,
    hint:'Soustraire un nombre, c\u2019est ajouter son opposé&nbsp;: a − b = a + (l\u2019opposé de b).',
    solution:`Soustraire ${paren(b)}, c\u2019est ajouter son opposé ${paren(-b)}.<br>${paren(a)} − ${paren(b)} = ${paren(a)} + ${paren(-b)} = <b>${rel(res)}</b>.` };
}
/* Ex3 : multiplication de relatifs */
function genMultiplication(){
  const a=relNonZero(10), b=relNonZero(10);
  const res=a*b;
  const sameSign=(a>0)===(b>0);
  return { type:'input', answer:res, title:'Multiplier des relatifs',
    question:`Calcule ce produit de nombres relatifs.`,
    mathHtml:`${paren(a)} × ${paren(b)} = ?`,
    hint:'Règle des signes&nbsp;: deux signes identiques donnent un produit positif, deux signes différents donnent un produit négatif.',
    solution:`Les deux facteurs ont des signes ${sameSign?'identiques → résultat positif':'différents → résultat négatif'}.<br>${Math.abs(a)} × ${Math.abs(b)} = ${Math.abs(res)}, donc ${paren(a)} × ${paren(b)} = <b>${rel(res)}</b>.` };
}
/* Ex4 : comparer deux relatifs (QCM < = >) */
function genComparaison(){
  let a,b;
  do{ a=relNonZero(12); b=rint(25)-12; }while(a===b);   /* b peut être 0, a non nul, a≠b */
  const ans = a<b ? '<' : '>';
  return { type:'qcm-cmp', a, b, answer:ans, title:'Comparer des relatifs',
    question:`Compare ces deux nombres relatifs. Quel symbole place-t-on entre <b>${rel(a)}</b> et <b>${rel(b)}</b>&nbsp;?`,
    figure:droiteGraduee(a,b),
    hint:'Sur la droite graduée, le nombre le plus à gauche est le plus petit.',
    solution:`Sur la droite graduée, ${rel(a)} est ${a<b?'à gauche de':'à droite de'} ${rel(b)}.<br>Donc ${rel(a)} <b>${ans}</b> ${rel(b)}.` };
}

const GENERATORS = [genAddition, genSoustraction, genMultiplication, genComparaison];

/* ============================================================
   Rendu
   ============================================================ */
function generateAll(){
  exos = GENERATORS.map(g => g());
  state = exos.map(()=>({correct:false, errors:0}));
  document.getElementById('results').classList.remove('show');
  const root = document.getElementById('exoList');
  root.innerHTML = '';
  exos.forEach((ex, i) => root.appendChild(buildCard(ex, i)));
  updateScore();
  window.__exos = exos;
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildCard(ex, i){
  const card = document.createElement('div');
  card.className='card'; card.id='card-'+i;
  let body='';
  if(ex.type==='input'){
    body=`
      <div class="math-box">${ex.mathHtml}</div>
      <div class="answer-row">
        <input class="num-input" id="in-${i}" type="number" inputmode="numeric" placeholder="?" aria-label="ta réponse">
      </div>
      ${ex.hint ? `<div class="hint">&#128161; ${ex.hint}</div>` : ''}
      <div class="actions" id="act-${i}"><button class="btn btn-check" id="chk-${i}">Vérifier</button></div>`;
  } else { /* qcm-cmp */
    body=`
      ${ex.figure ? `<div class="figure">${ex.figure}</div>` : ''}
      <div class="qcm">
        <button class="qcm-btn" data-val="&lt;" data-i="${i}">&lt;</button>
        <button class="qcm-btn" data-val="=" data-i="${i}">=</button>
        <button class="qcm-btn" data-val="&gt;" data-i="${i}">&gt;</button>
      </div>
      ${ex.hint ? `<div class="hint">&#128161; ${ex.hint}</div>` : ''}
      <div class="actions" id="act-${i}"></div>`;
  }
  card.innerHTML=`
    <div class="card-head">
      <div class="badge-num">${i+1}</div>
      <div class="ctitle">${ex.title}</div>
      <div class="check-mark">&#10004;</div>
    </div>
    <p class="question">${ex.question}</p>
    ${body}
    <div class="feedback" id="fb-${i}"></div>
    <div class="solution" id="sol-${i}">${ex.solution}</div>`;
  setTimeout(()=>{
    if(ex.type==='input'){
      card.querySelector('#chk-'+i).addEventListener('click', ()=>checkInput(i));
      card.querySelector('#in-'+i).addEventListener('keydown', e=>{ if(e.key==='Enter') checkInput(i); });
    } else {
      card.querySelectorAll('.qcm-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>checkCmp(i, btn.dataset.val));
      });
    }
  },0);
  return card;
}

function checkInput(i){
  if(state[i].correct) return;
  const inp=document.getElementById('in-'+i); const raw=inp.value.trim().replace(',', '.').replace('−','-'); const fb=document.getElementById('fb-'+i);
  if(raw===''){ flash(fb,'bad','Écris d\u2019abord ta réponse.'); return; }
  const val=Number(raw);
  if(Number.isNaN(val)){ flash(fb,'bad','Écris un nombre (utilise le signe − pour un négatif).'); return; }
  if(Math.abs(val-exos[i].answer)<1e-9) markCorrect(i); else markError(i);
}
function checkCmp(i, val){
  if(state[i].correct) return;
  const card=document.getElementById('card-'+i);
  card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.toggle('picked', b.dataset.val===val));
  if(val===exos[i].answer) markCorrect(i); else markError(i);
}

function markError(i){
  state[i].errors++;
  document.getElementById('card-'+i).classList.add('is-error');
  flash(document.getElementById('fb-'+i),'bad','Pas encore… reprends la règle des signes, puis réessaie.');
  const act=document.getElementById('act-'+i);
  if(!act.querySelector('.btn-retry')){
    const r=document.createElement('button'); r.className='btn btn-retry'; r.innerHTML='&#8635; Réessayer';
    r.addEventListener('click', ()=>retry(i)); act.appendChild(r);
  }
  updateScore();
}
function retry(i){
  const ex=exos[i]; const card=document.getElementById('card-'+i);
  card.classList.remove('is-error'); document.getElementById('fb-'+i).classList.remove('show');
  if(ex.type==='input'){ const inp=document.getElementById('in-'+i); inp.value=''; inp.focus(); }
  else { card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.remove('picked')); }
  const r=document.getElementById('act-'+i).querySelector('.btn-retry'); if(r) r.remove();
}
function markCorrect(i){
  state[i].correct=true;
  const ex=exos[i]; const card=document.getElementById('card-'+i);
  card.classList.remove('is-error'); card.classList.add('is-correct');
  flash(document.getElementById('fb-'+i),'ok','Bravo, c\u2019est juste&nbsp;!');
  document.getElementById('sol-'+i).classList.add('show');
  document.getElementById('act-'+i).classList.add('locked');
  if(ex.type==='input'){ const inp=document.getElementById('in-'+i); inp.disabled=true; inp.classList.add('locked'); }
  else { card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.add('locked')); }
  updateScore(); checkFinished();
}
function flash(el,kind,msg){ el.className='feedback show '+kind; el.innerHTML=msg; }
function updateScore(){
  const ok=state.filter(s=>s.correct).length, err=state.reduce((a,s)=>a+s.errors,0);
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-left').textContent=TOTAL-ok;
  document.getElementById('s-err').textContent=err;
  document.getElementById('xp-text').textContent=ok+' / '+TOTAL;
  document.getElementById('xp-fill').style.width=(100*ok/TOTAL)+'%';
}
function checkFinished(){
  if(state.every(s=>s.correct)){
    const err=state.reduce((a,s)=>a+s.errors,0);
    let stars=3; if(err>=1&&err<=2) stars=2; if(err>=3) stars=1;
    document.getElementById('r-score').textContent=`${TOTAL} / ${TOTAL} réussis · ${err} erreur${err>1?'s':''}`;
    let sh=''; for(let k=0;k<3;k++) sh+=`<span class="${k<stars?'star-on':'star-off'}">&#9733;</span>`;
    document.getElementById('r-stars').innerHTML=sh;
    document.getElementById('r-msg').textContent='Personne ne réussit tout du premier coup — l\u2019important, c\u2019est d\u2019avoir cherché et compris. Tu peux recommencer avec de nouveaux nombres.';
    const res=document.getElementById('results'); res.classList.add('show');
    setTimeout(()=>res.scrollIntoView({behavior:'smooth', block:'center'}), 250);
  }
}
generateAll();
</script>
</body>
</html>
