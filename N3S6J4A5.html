<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths 3e – Reconnaître une section plane – S6 J4</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --day-color:#3ab5d8;--day-dark:#1a6e88;--day-light:#e8f6fb;--day-border:#9dd4e8;
      --day-glow:rgba(58,181,216,.3);
      --bg:#fffdf7;--surface:#fff;--border:#e8e4d9;
      --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;
      --text:#1a1d23;--muted:#8a8f9a;--radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
      position:relative;overflow-x:hidden;letter-spacing:.03em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;
      background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;
      background:var(--yellow);top:200px;left:-30px;pointer-events:none;}
    /* HEAD */
    .head-card{width:100%;max-width:900px;background:var(--day-light);border:2px solid var(--day-border);
      border-radius:var(--radius);padding:1.9rem 1.5rem 1.6rem;text-align:center;
      position:relative;z-index:1;margin-bottom:1.5rem;}
    .logo-badge{background:var(--yellow);color:#000;font-size:14px;letter-spacing:.09em;
      display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;
      padding:.35rem 1.1rem;border-radius:99px;margin-bottom:.6rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{color:var(--day-dark);font-size:.88rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:var(--text);margin:.3rem 0;}
    .head-card h1 .hl{color:var(--day-dark);}
    .subtitle{color:var(--muted);font-size:.97rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}
    /* CARDS */
    .activities{width:100%;max-width:900px;display:flex;flex-direction:column;gap:1.5rem;position:relative;z-index:1;}
    .activity-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
      overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .activity-stripe{height:4px;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--green));}
    .activity-label{padding:.8rem 1.4rem;font-family:'JetBrains Mono',monospace;font-size:.78rem;
      font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--day-dark);
      background:var(--day-light);border-bottom:1.5px solid var(--day-border);}
    iframe{display:block;width:100%;border:0;}
    .ext-link{padding:.65rem 1.4rem;font-size:.88rem;color:var(--muted);
      border-top:1.5px solid var(--border);background:var(--bg);}
    .ext-link a{color:var(--day-dark);font-weight:700;text-decoration:underline;}
    .ext-link a:hover{color:var(--day-color);}

    /* ── STYLE COMMUN EXERCICEURS ── */
    .exo-board{
      background:linear-gradient(160deg,#2d3748,#1a202c);
      font-family:'Georgia',serif;color:#fff;
      padding:1.8rem 2rem;min-height:440px;position:relative;
    }
    .exo-score-box{position:absolute;top:1rem;right:1.2rem;background:#fff;color:#000;
      font-family:Arial,sans-serif;font-weight:900;font-size:1.05rem;
      padding:.3rem .8rem;border-radius:6px;}
    .exo-title{font-style:italic;font-size:1.2rem;font-weight:700;margin-bottom:1.1rem;}
    .exo-enonce{font-style:italic;font-size:1.05rem;line-height:1.8;margin-bottom:.8rem;}
    .exo-tbl{border-collapse:collapse;font-style:italic;font-size:1rem;margin:.5rem 0 .9rem;}
    .exo-tbl td,.exo-tbl th{border:1.5px solid #aaa;padding:.4rem .9rem;text-align:center;}
    .exo-tbl th{background:rgba(255,255,255,.08);}
    .exo-rep-row{display:flex;align-items:center;gap:.8rem;margin:.8rem 0;flex-wrap:wrap;}
    .exo-rep-label{font-style:italic;font-size:1.1rem;}
    .exo-inp{background:#f5c518;border:none;outline:none;padding:.5rem .8rem;
      font-size:1.05rem;font-family:Arial,sans-serif;font-weight:700;
      width:170px;border-radius:4px;color:#000;}
    .exo-fb{display:none;background:#22c55e;color:#000;font-style:italic;
      font-size:1rem;line-height:1.65;padding:.75rem 1rem;border-radius:4px;margin:.5rem 0;}
    .exo-btn-y{background:#f5c518;color:#000;border:none;padding:.55rem 1.5rem;
      font-family:Arial,sans-serif;font-size:1.05rem;font-weight:900;
      border-radius:6px;cursor:pointer;margin-top:.7rem;}
    .exo-btn-y:hover{opacity:.88;}
    .exo-start,.exo-end{text-align:center;padding:2rem 1rem;}
    .exo-start p,.exo-end p{font-style:italic;font-size:1.1rem;margin:.5rem 0;}
  </style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>

<div class="head-card">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    PAZAPA &middot; MATHS &middot; 3&Egrave;ME
  </div>
  <div class="week-label">Semaine&nbsp;6 &ndash; Jour&nbsp;4</div>
  <h1><span class="hl">&#127922; Reconna&icirc;tre une section plane</span></h1>
  <p class="subtitle">Je travaille mes automatismes de calculs</p>
</div>

<div class="activities">

  <!-- ═══ EXERCICE 3 : INTRUS CARTES URNES ═══ -->
  <div class="activity-card">
    <div class="activity-stripe"></div>
    <div class="activity-label">Trouve l&rsquo;intrus</div>
    <div style="background:#fff;padding:1.5rem 1rem;">

      <!-- Écran choix niveau -->
      <div id="e3-niveau" style="text-align:center;padding:1rem;">
        <p style="font-family:'JetBrains Mono',monospace;font-size:.9rem;color:#3d7a10;font-weight:700;margin-bottom:.3rem;">Calcul mental</p>
        <p style="font-size:1.1rem;font-weight:700;margin-bottom:1.2rem;">Quel est l&rsquo;intrus&nbsp;?</p>
        <p style="font-family:'JetBrains Mono',monospace;font-size:.85rem;color:#8a8f9a;margin-bottom:.5rem;">Choisis ton niveau.</p>
        <div style="display:flex;gap:1.5rem;justify-content:center;margin-top:.8rem;align-items:center;">
          <button onclick="E3.start(1)" title="Niveau 1" style="background:none;border:none;cursor:pointer;padding:4px;transition:transform .15s;" onmouseenter="this.style.transform='scale(1.15)'" onmouseleave="this.style.transform=''"><svg width="48" height="44" viewBox="0 0 48 44" xmlns="http://www.w3.org/2000/svg">
  <polygon points="24,2 46,16 24,42 2,16" fill="#2d8a4e"/>
  <polygon points="24,2 46,16 24,20" fill="#4caf50" opacity=".7"/>
  <polygon points="2,16 24,20 24,42" fill="#1a5c30" opacity=".5"/>
  <polygon points="24,2 2,16 24,20" fill="#4caf50" opacity=".4"/>
</svg></button>
          <button onclick="E3.start(2)" title="Niveau 2" style="background:none;border:none;cursor:pointer;padding:4px;transition:transform .15s;" onmouseenter="this.style.transform='scale(1.15)'" onmouseleave="this.style.transform=''"><svg width="48" height="44" viewBox="0 0 48 44" xmlns="http://www.w3.org/2000/svg">
  <polygon points="24,2 46,16 24,42 2,16" fill="#8a8a8a"/>
  <polygon points="24,2 46,16 24,20" fill="#aaaaaa" opacity=".7"/>
  <polygon points="2,16 24,20 24,42" fill="#666666" opacity=".5"/>
  <polygon points="24,2 2,16 24,20" fill="#aaaaaa" opacity=".4"/>
</svg></button>
          <button onclick="E3.start(3)" title="Niveau 3" style="background:none;border:none;cursor:pointer;padding:4px;transition:transform .15s;" onmouseenter="this.style.transform='scale(1.15)'" onmouseleave="this.style.transform=''"><svg width="48" height="44" viewBox="0 0 48 44" xmlns="http://www.w3.org/2000/svg">
  <polygon points="24,2 46,16 24,42 2,16" fill="#b0b0b0"/>
  <polygon points="24,2 46,16 24,20" fill="#cccccc" opacity=".7"/>
  <polygon points="2,16 24,20 24,42" fill="#909090" opacity=".5"/>
  <polygon points="24,2 2,16 24,20" fill="#cccccc" opacity=".4"/>
</svg></button>
        </div>
      </div>

      <!-- Zone de jeu -->
      <div id="e3-game" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;font-family:'JetBrains Mono',monospace;font-size:.85rem;color:#8a8f9a;">
          <span id="e3-qnum">Question 1 / 8</span>
          <span>Score&nbsp;: <span id="e3-sc">0</span> / 8</span>
        </div>
        <p style="font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#8a8f9a;text-align:center;margin-bottom:.8rem;">
          Une carte ne correspond pas aux 3 autres. Clique sur <strong>l&rsquo;intrus</strong>.
        </p>
        <div id="e3-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:.9rem;max-width:580px;margin:0 auto;"></div>
        <div id="e3-fb" style="margin-top:1rem;padding:.7rem 1rem;border-radius:10px;font-size:.95rem;display:none;text-align:center;font-weight:700;"></div>
        <div style="text-align:center;margin-top:.8rem;">
          <button id="e3-btn" onclick="E3.next()" style="display:none;background:#f5c518;color:#000;border:none;padding:.55rem 1.5rem;font-family:Arial,sans-serif;font-size:1.05rem;font-weight:900;border-radius:6px;cursor:pointer;">Question suivante &rarr;</button>
        </div>
      </div>

      <!-- Écran fin -->
      <div id="e3-end" style="display:none;text-align:center;padding:1.2rem;">
        <p style="font-size:1.1rem;font-weight:700;margin-bottom:.5rem;" id="e3-end-msg"></p>
        <button onclick="E3.reset()" style="background:#f5c518;color:#000;border:none;padding:.55rem 1.5rem;font-family:Arial,sans-serif;font-size:1.05rem;font-weight:900;border-radius:6px;cursor:pointer;margin-top:.8rem;">&#8635; Changer de niveau</button>
      </div>

    </div>
  </div>

</div>

<script>
/* ════════════════════════════════
   EXERCICE 3 — TROUVE L'INTRUS (FONCTIONS)
   Niveau 1 : f(x) = ax (a entier positif)
   Niveau 2 : f(x) = ax + b (a, b entiers positifs)
   Niveau 3 : f(x) = ax + b (coefficients éventuellement négatifs)
   Interface conservée à l'identique (grille, couleurs, score, feedback).
════════════════════════════════ */
var E3=(function(){
  var idx=0,score=0,nb=8,niveau=1,answered=false,questions=[];

  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function $(id){return document.getElementById(id);}

  function fStr(a,b){
    var s='f(x) = ';
    if(a===1) s+='x';
    else if(a===-1) s+='\u2212x';
    else s+=a+'x';
    if(b>0) s+=' + '+b;
    else if(b<0) s+=' \u2212 '+Math.abs(b);
    return s;
  }
  function calcStr(a,b,x){
    var s='f('+x+') = '+a+'\u00d7'+(x<0?'('+x+')':x)+(b>=0?' + '+b:' \u2212 '+Math.abs(b));
    return s;
  }
  function calcVal(a,b,x){ return a*x+b; }

  /* Modèles de phrases (vocabulaire imposé) */
  var TEMPLATES=[
    function(x,y){ return x+' a pour image '+y+' par f.'; },
    function(x,y){ return x+' est l\u2019ant\u00e9c\u00e9dent de '+y+' par f.'; },
    function(x,y){ return y+' est l\u2019image de '+x+' par f.'; }
  ];

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){var j=rand(0,i);var t=arr[i];arr[i]=arr[j];arr[j]=t;}
    return arr;
  }

  /* Génère une question conforme : 1 carte fonction + 3 affirmations,
     exactement une des 3 affirmations est fausse (l'intrus). */
  function genQ(){
    var lv=niveau, a, b;
    if(lv===1){
      a=rand(2,9); b=0;
    } else if(lv===2){
      a=rand(2,9); b=rand(1,15);
    } else {
      a=rand(-9,9); if(a===0||a===1) a=rand(2,9)*(Math.random()<0.5?-1:1);
      b=rand(-12,12);
    }

    /* Choisir 3 valeurs de x distinctes */
    var xs=[];
    while(xs.length<3){
      var x=lv===3?rand(-9,9):rand(1,9);
      if(x!==0 && xs.indexOf(x)===-1) xs.push(x);
    }

    var tmpl=shuffle([0,1,2]);
    var affirmations=xs.map(function(x,i){
      var y=calcVal(a,b,x);
      return {x:x, yTrue:y, y:y, tpl:tmpl[i], correct:true};
    });

    /* Choisir l'affirmation qui deviendra l'intrus */
    var intrusIdx=rand(0,2);
    var target=affirmations[intrusIdx];
    var delta, faux;
    do{
      delta=rand(1,4)*(Math.random()<0.5?1:-1);
      faux=target.yTrue+delta;
    } while(faux===target.yTrue);
    target.y=faux;
    target.correct=false;

    /* Construire les 4 cartes */
    var cards=[];
    cards.push({type:'fn', html:'<div style="font-size:1.05rem;font-weight:700;">'+fStr(a,b)+'</div>', correct:true});
    affirmations.forEach(function(af){
      cards.push({
        type:'aff',
        html:'<div style="font-size:.92rem;font-weight:600;line-height:1.6;">'+TEMPLATES[af.tpl](af.x,af.y)+'</div>',
        correct:af.correct,
        explain:calcStr(a,b,target.x)+' = '+target.yTrue+'.'
      });
    });

    /* Mélanger les 4 cartes */
    cards=shuffle(cards);
    return {cards:cards, a:a, b:b, target:target};
  }

  var BORDER_COLORS=['#22c55e','#ef4444','#f5c518','#3ab5d8'];

  function render(){
    answered=false;
    var q=questions[idx];
    $('e3-qnum').textContent='Question '+(idx+1)+' / '+nb;
    $('e3-sc').textContent=score;
    $('e3-fb').style.display='none';
    $('e3-btn').style.display='none';
    var grid=$('e3-grid');
    grid.innerHTML='';
    q.cards.forEach(function(card,ci){
      var div=document.createElement('div');
      div.style.cssText='border:2.5px solid '+BORDER_COLORS[ci]+';border-radius:12px;padding:.9rem;min-height:100px;'
        +'display:flex;align-items:center;justify-content:center;cursor:pointer;'
        +'text-align:center;background:#fff;transition:transform .12s,box-shadow .12s;';
      div.innerHTML=card.html;
      div.addEventListener('mouseenter',function(){this.style.transform='scale(1.02)';this.style.boxShadow='0 4px 12px rgba(0,0,0,.12)';});
      div.addEventListener('mouseleave',function(){this.style.transform='';this.style.boxShadow='';});
      (function(c,d){
        div.addEventListener('click',function(){choisir(c,d,q);});
      })(card,div);
      grid.appendChild(div);
    });
  }

  function choisir(card,div,q){
    if(answered)return;
    answered=true;
    var ok=!card.correct;
    if(ok)score++;
    $('e3-sc').textContent=score;
    var explainTxt='';
    var cells=$('e3-grid').children;
    for(var i=0;i<cells.length;i++){
      if(!q.cards[i].correct){
        cells[i].style.background='#fef2f2';
        cells[i].style.borderColor='#ef4444';
        cells[i].style.borderWidth='3px';
        explainTxt=q.cards[i].explain||'';
      }
    }
    var fb=$('e3-fb');
    fb.style.display='block';
    if(ok){
      fb.style.cssText='display:block;margin-top:1rem;padding:.7rem 1rem;border-radius:10px;font-size:.95rem;text-align:center;font-weight:700;background:#f0faeb;color:#2f6e10;border:1.5px solid #22c55e;';
      fb.innerHTML='\u2705 Bravo\u00a0! Tu as trouv\u00e9 l\u2019intrus.'+(explainTxt?'<br><span style="font-weight:600;font-size:.85rem;">'+explainTxt+'</span>':'');
    } else {
      fb.style.cssText='display:block;margin-top:1rem;padding:.7rem 1rem;border-radius:10px;font-size:.95rem;text-align:center;font-weight:700;background:#fff0ef;color:#c0392b;border:1.5px solid #f28b82;';
      fb.innerHTML='\u274C Ce n\u2019est pas l\u2019intrus.'+(explainTxt?'<br><span style="font-weight:600;font-size:.85rem;">'+explainTxt+'</span>':'');
    }
    $('e3-btn').style.display='inline-block';
    $('e3-btn').textContent=idx<nb-1?'Question suivante \u2192':'Voir mon r\u00e9sultat';
  }

  function next(){
    idx++;
    if(idx>=nb){showEnd();return;}
    render();
  }

  function showEnd(){
    $('e3-game').style.display='none';
    $('e3-end').style.display='block';
    var m=score>=7?'Excellent ! Tu ma\u00eetrises les fonctions.':
             score>=5?'Bien ! Continue \u00e0 t\u2019entra\u00eener.':
             'Il faut t\u2019entra\u00eener encore ! Courage !';
    $('e3-end-msg').textContent='Score : '+score+' / '+nb+' \u2014 '+m;
  }

  function start(lv){
    niveau=lv||1; idx=0; score=0; answered=false;
    questions=[];for(var i=0;i<nb;i++)questions.push(genQ());
    $('e3-niveau').style.display='none';
    $('e3-end').style.display='none';
    $('e3-game').style.display='block';
    render();
  }

  function reset(){
    $('e3-game').style.display='none';
    $('e3-end').style.display='none';
    $('e3-niveau').style.display='block';
  }

  return {start:start,next:next,reset:reset};
})();
</script>
</body>
</html>
