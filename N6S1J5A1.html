<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Droites graduées — Abscisses</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  /* ═══ COULEUR DU JOUR — Vendredi (Jour 5) → Jaune ═══ */
  :root {
    --day-color:  #f5c518;
    --day-dark:   #8a6000;
    --day-light:  #fffbeb;
    --day-border: #f5e08a;
    --day-glow:   rgba(245,197,24,.3);
  }
  /* ═══ CHARTE PAZAPA — NE PAS TOUCHER ═══ */
  :root {
    --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
    --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
    --pink:#f28b82; --orange:#f5a623;
    --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:2rem 1rem 4rem;
    position:relative; overflow-x:hidden;
    letter-spacing:.02em; word-spacing:.06em;
  }
  body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
    width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
  body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
    width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
  .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;
    background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
  .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;
    background:var(--pink);top:200px;left:-30px;pointer-events:none;}

  header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
  .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;
    font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
  .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
  h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
  h1 .hl{color:var(--day-color);}
  .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

  .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
  .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);
    font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
  .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));
    border-radius:99px;transition:width .5s ease;}

  .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
  .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:99px;font-size:.8rem;
    font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  .chip.correct .dot{background:var(--green);}
  .chip.wrong .dot{background:var(--pink);}
  .chip.remaining .dot{background:var(--muted);}

  .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);
    border-radius:var(--radius);padding:2rem 2rem 1.6rem;position:relative;z-index:1;
    box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;
    background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}

  .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem;
    background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);}

  .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
    margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.1em;}
  .q-title{font-size:1.05rem;font-weight:800;color:var(--text);margin-bottom:.4rem;line-height:1.3;}
  .consigne{font-size:.88rem;color:var(--muted);margin-bottom:1rem;line-height:1.6;}
  .consigne b{color:var(--day-dark);font-family:'JetBrains Mono',monospace;}

  .line-block{margin:1.1rem 0 1.4rem;}
  .line-sublbl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.85rem;color:var(--day-dark);margin-bottom:.25rem;}
  .line-stage{position:relative;width:100%;}
  .line-stage svg{display:block;width:100%;height:auto;}
  .nl-input{position:absolute;transform:translateX(-50%);width:62px;background:var(--bg);
    border:2px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;
    font-size:.82rem;font-weight:600;text-align:center;padding:.3rem .1rem;outline:none;min-height:2.6rem;
    transition:border-color .2s,background .2s;}
  .nl-input:focus{border-color:var(--day-color);background:#fff;z-index:5;}
  .nl-input.ok{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
  .nl-input.ko{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
  .nl-input:disabled{cursor:default;}

  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:10px;
    font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;
    transition:transform .12s,box-shadow .15s;min-height:2.6rem;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.38;cursor:default;}
  .btn-primary{background:var(--day-color);color:#5a4000;box-shadow:0 3px 10px var(--day-glow);}
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
  .btn-hint{background:var(--orange);color:#fff;}
  .btn-solution{background:var(--day-dark);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
  .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

  .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;
    padding:.75rem 1rem;font-size:.85rem;color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
  .hint-box.show{display:block;}
  .hint-box strong{color:#a86b00;}

  .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;font-size:.9rem;
    display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
  .feedback.show{display:flex;}
  .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
  .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
  .feedback-icon{font-size:1.4rem;flex-shrink:0;}
  .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.8;}

  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.4rem;position:relative;z-index:2;}

  .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
  .results.show{display:block;}
  .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
    padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
  .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
  .results-score .s-num{color:var(--day-color);}
  .stars{font-size:2rem;margin:.4rem 0 1rem;letter-spacing:.1em;}
  .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
  .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
  .recap-item{display:flex;align-items:center;gap:.8rem;padding:.65rem 1rem;background:var(--bg);
    border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.6;}
  .recap-item .eq{color:var(--day-dark);flex:1;}
  .recap-item.ok-item{border-color:#b5e08a;}
  .recap-item.ko-item{border-color:#f9c0bb;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:480px){
    .card,.results-card{padding:1.4rem;}
    .btn{font-size:.85rem;padding:.55rem 1rem;}
    .nl-input{width:54px;font-size:.76rem;}
  }
</style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#f28b82"></span>
    Pazapa &middot; Maths &middot; 6&egrave;me
  </div>
  <div class="week-label">Semaine 1 &ndash; Jour 5</div>
  <h1><span class="hl">Les droites gradu&eacute;es &mdash; Abscisses</span></h1>
  <p class="subtitle">3 exercices &middot; 19 abscisses</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Exercice 1 / 3</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="prog-bar" style="width:0%"></div>
  </div>
</div>

<div class="score-row">
  <div class="chip correct"><div class="dot"></div><span id="cnt-ok">0</span> correctes</div>
  <div class="chip wrong"><div class="dot"></div><span id="cnt-ko">0</span> erreurs</div>
  <div class="chip remaining"><div class="dot"></div><span id="cnt-rem">19</span> restantes</div>
</div>

<div class="card" id="ex-card">
  <div class="card-stripe"></div>
  <div class="q-num" id="q-num">Exercice 1</div>
  <div class="theme-badge">Droites gradu&eacute;es</div>
  <div class="q-title" id="q-title"></div>
  <div class="consigne" id="q-txt"></div>
  <div id="q-body"></div>
  <div class="hint-box" id="hint-box"></div>
  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="fb-icon"></span>
    <div><div id="fb-msg"></div><div class="feedback-detail" id="fb-det"></div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()" style="display:none;">&#8592; Pr&eacute;c&eacute;dent</button>
    <button class="btn btn-primary" id="btn-check" onclick="checkLine()">&#10003; V&eacute;rifier</button>
    <button class="btn btn-hint" id="btn-hint" onclick="toggleHint()">? Indice</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQ()" style="display:none;">Suivant &#8594;</button>
    <button class="btn btn-solution" id="btn-solution" onclick="showSolution()" style="display:none;">&#128161; Solution</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#f28b82"></span>
      R&eacute;sultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/19</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <div class="recap-list" id="recap-list"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">
      &#128260; Recommencer
    </button>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
var COL = {
  rouge:'#e8453c', bleu:'#3ab5d8', vert:'#2f8a10', orange:'#f5a623',
  violet:'#9b59b6', cyan:'#5aa9c8', rose:'#e84393'
};

var EXS = [
  {
    title:"1. Donner l\u2019abscisse de chaque point.",
    txt:"Lis l\u2019abscisse de chaque point color\u00e9 et \u00e9cris-la dans la case sous la droite.",
    lines:[
      { start:0, end:3.5, step:0.1, majors:[0,1,2,3],
        marks:[{name:"A",val:0.3,color:COL.rouge},{name:"B",val:1.7,color:COL.bleu},
               {name:"C",val:2.9,color:COL.vert},{name:"D",val:3.4,color:COL.orange}] },
      { start:0, end:4, step:0.1, majors:[0,1,2,3,4],
        marks:[{name:"A",val:1.5,color:COL.violet},{name:"B",val:2.9,color:COL.cyan}] }
    ],
    hint:"<strong>Astuce\u00a0:</strong> entre deux entiers il y a 10 intervalles, donc chaque graduation vaut 0,1. Compte les graduations depuis le rep\u00e8re connu le plus proche. \u00c9cris avec une virgule (exemple\u00a0: 0,3)."
  },
  {
    title:"2. Donner l\u2019abscisse de chaque point.",
    txt:"Attention\u00a0: ici le pas n\u2019est pas toujours 0,1\u00a0!",
    lines:[
      { start:0, end:3.5, step:0.5, majors:[0,1,2,3],
        marks:[{name:"C",val:0.5,color:COL.orange},{name:"A",val:1.5,color:COL.rouge},
               {name:"B",val:3,color:COL.bleu},{name:"D",val:3.5,color:COL.vert}] },
      { start:2, end:4.4, step:0.2, majors:[2,3,4],
        marks:[{name:"A",val:2.2,color:COL.rose},{name:"B",val:2.8,color:COL.violet},
               {name:"C",val:3.4,color:COL.orange}] }
    ],
    hint:"<strong>Astuce\u00a0:</strong> compte d\u2019abord le nombre d\u2019intervalles entre deux entiers. 2 intervalles donnent un pas de 0,5\u00a0; 5 intervalles donnent un pas de 0,2."
  },
  {
    title:"3. Compl\u00e9ter les graduations indiqu\u00e9es.",
    txt:"Trouve la valeur de chaque graduation marqu\u00e9e d\u2019une croix noire.",
    lines:[
      { label:"a)", start:5.5, end:7, step:0.25, majors:[5.5,6,7],
        marks:[{val:5.75,color:"#1a1d23"},{val:6.25,color:"#1a1d23"},{val:6.75,color:"#1a1d23"}] },
      { label:"b)", start:6.45, end:6.61, step:0.01, majors:[6.5,6.6],
        marks:[{val:6.47,color:"#1a1d23"},{val:6.54,color:"#1a1d23"},{val:6.57,color:"#1a1d23"}] }
    ],
    hint:"<strong>Astuce\u00a0:</strong> trouve le pas entre deux graduations connues. En a) de 5,5 \u00e0 6 en 2 sauts, le pas vaut 0,25. En b) de 6,5 \u00e0 6,6 en 10 sauts, le pas vaut 0,01."
  }
];

var TOTAL_EX = EXS.length;
var TOTAL_PTS = EXS.reduce(function(a,ex){return a + ex.lines.reduce(function(b,l){return b+l.marks.length;},0);},0);
var cur = 0;
var validated = [false,false,false];
var hintOpen = false;

function rnd(v){ return Math.round(v*1e6)/1e6; }
function fr(v){ return String(rnd(v)).replace('.',','); }
function numNorm(s){
  var n=parseFloat(String(s).trim().replace(/\u202f/g,'').replace(/\s/g,'').replace(',','.'));
  return isNaN(n)?null:n;
}
function valOk(target,val){ var n=numNorm(val); return n!==null && Math.abs(n-target)<1e-9; }

var VW=620, padL=42, padR=42, axisY=58, VH=140;

function buildLine(cfg, lineIdx){
  var span=cfg.end-cfg.start;
  var xv=function(v){ return padL+(v-cfg.start)/span*(VW-padL-padR); };
  var NS='http://www.w3.org/2000/svg';

  var block=document.createElement('div'); block.className='line-block';
  if(cfg.label){ var l=document.createElement('div'); l.className='line-sublbl'; l.textContent=cfg.label; block.appendChild(l); }

  var stage=document.createElement('div'); stage.className='line-stage';
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 '+VW+' '+VH);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.setAttribute('role','img');

  var axis=document.createElementNS(NS,'line');
  axis.setAttribute('x1',padL-12); axis.setAttribute('y1',axisY);
  axis.setAttribute('x2',VW-padR+6); axis.setAttribute('y2',axisY);
  axis.setAttribute('stroke','#1a1d23'); axis.setAttribute('stroke-width','2.4');
  svg.appendChild(axis);
  var arr=document.createElementNS(NS,'path');
  arr.setAttribute('d','M'+(VW-padR+6)+','+(axisY-6)+' L'+(VW-padR+18)+','+axisY+' L'+(VW-padR+6)+','+(axisY+6)+' Z');
  arr.setAttribute('fill','#1a1d23'); svg.appendChild(arr);

  var nb=Math.round(span/cfg.step);
  for(var i=0;i<=nb;i++){
    var v=rnd(cfg.start+i*cfg.step);
    var isMajor=cfg.majors.some(function(m){return Math.abs(m-v)<1e-6;});
    var h=isMajor?15:8;
    var tick=document.createElementNS(NS,'line');
    tick.setAttribute('x1',xv(v)); tick.setAttribute('y1',axisY-h);
    tick.setAttribute('x2',xv(v)); tick.setAttribute('y2',axisY+(isMajor?h:0));
    tick.setAttribute('stroke','#1a1d23'); tick.setAttribute('stroke-width',isMajor?'2.4':'1.3');
    svg.appendChild(tick);
    if(isMajor){
      var t=document.createElementNS(NS,'text');
      t.setAttribute('x',xv(v)); t.setAttribute('y',axisY+32); t.setAttribute('text-anchor','middle');
      t.setAttribute('font-family',"'JetBrains Mono',monospace"); t.setAttribute('font-size','14');
      t.setAttribute('font-weight','600'); t.setAttribute('fill','#1a1d23');
      t.textContent=fr(v); svg.appendChild(t);
    }
  }

  cfg.marks.forEach(function(m){
    var px=xv(m.val), col=m.color||'#1a1d23', sc=5;
    var cr=document.createElementNS(NS,'path');
    cr.setAttribute('d','M'+(px-sc)+','+(axisY-sc)+' L'+(px+sc)+','+(axisY+sc)+' M'+(px-sc)+','+(axisY+sc)+' L'+(px+sc)+','+(axisY-sc));
    cr.setAttribute('stroke',col); cr.setAttribute('stroke-width','2.6'); cr.setAttribute('stroke-linecap','round');
    svg.appendChild(cr);
    if(m.name){
      var lt=document.createElementNS(NS,'text');
      lt.setAttribute('x',px); lt.setAttribute('y',axisY-24); lt.setAttribute('text-anchor','middle');
      lt.setAttribute('font-family','Arial,sans-serif'); lt.setAttribute('font-size','16');
      lt.setAttribute('font-weight','800'); lt.setAttribute('fill',col); lt.textContent=m.name;
      svg.appendChild(lt);
    }
  });
  stage.appendChild(svg);

  cfg.marks.forEach(function(m,mi){
    var px=xv(m.val);
    var inp=document.createElement('input');
    inp.type='text'; inp.className='nl-input'; inp.placeholder='?';
    inp.setAttribute('autocomplete','off'); inp.setAttribute('inputmode','decimal');
    inp.id='i_'+cur+'_'+lineIdx+'_'+mi;
    inp.dataset.val=m.val;
    inp.style.left=(px/VW*100)+'%';
    inp.style.top=((axisY+42)/VH*100)+'%';
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ var bc=$('btn-check'); if(bc && bc.style.display!=='none' && !bc.disabled) checkLine(); } });
    stage.appendChild(inp);
  });

  block.appendChild(stage);
  return block;
}

function allInputs(){ return [].slice.call(document.querySelectorAll('#q-body .nl-input')); }

function renderQ(){
  var ex=EXS[cur];
  $('q-num').textContent='Exercice '+(cur+1);
  $('q-title').textContent=ex.title;
  $('q-txt').textContent=ex.txt;
  $('hint-box').classList.remove('show'); $('hint-box').innerHTML=''; hintOpen=false;
  $('feedback').className='feedback';

  $('btn-prev').style.display = cur>0 ? 'inline-flex' : 'none';
  $('btn-hint').style.display = ex.hint ? 'inline-flex' : 'none';

  var body=$('q-body'); body.innerHTML='';
  ex.lines.forEach(function(cfg,li){ body.appendChild(buildLine(cfg,li)); });

  if(validated[cur]){
    // Etat verifie : restaurer
    allInputs().forEach(function(inp){
      var saved = ex._ans ? ex._ans[inp.id] : undefined;
      if(saved!==undefined) inp.value=saved;
      var good=valOk(parseFloat(inp.dataset.val),inp.value);
      inp.className='nl-input '+(good?'ok':'ko');
      inp.disabled=true;
    });
    $('btn-check').style.display='none';
    $('btn-hint').disabled=true;
    $('btn-solution').style.display='inline-flex';
    $('btn-next').style.display = 'inline-flex';
    $('btn-next').textContent = cur===TOTAL_EX-1 ? 'Voir les r\u00e9sultats \u2192' : 'Suivant \u2192';
    showFB();
  } else {
    $('btn-check').style.display='inline-flex';
    $('btn-check').disabled=false;
    $('btn-hint').disabled=false;
    $('btn-solution').style.display='none';
    $('btn-solution').disabled=false;
    $('btn-next').style.display='none';
    setTimeout(function(){ var f=document.querySelector('#q-body .nl-input:not(:disabled)'); if(f)f.focus(); },40);
  }
  updateStats();
}

function checkLine(){
  if(validated[cur]) return;
  var ex=EXS[cur];
  var inputs=allInputs();
  if(inputs.every(function(inp){return inp.value.trim()==='';})) return;
  ex._ans={};
  inputs.forEach(function(inp){
    var target=parseFloat(inp.dataset.val);
    ex._ans[inp.id]=inp.value;
    var good=valOk(target,inp.value);
    inp.className='nl-input '+(good?'ok':'ko');
    inp.disabled=true;
  });
  validated[cur]=true;
  $('btn-check').style.display='none';
  $('btn-hint').disabled=true;
  $('btn-solution').style.display='inline-flex';
  $('btn-next').style.display='inline-flex';
  $('btn-next').textContent = cur===TOTAL_EX-1 ? 'Voir les r\u00e9sultats \u2192' : 'Suivant \u2192';
  showFB();
  updateStats();
  $('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function lineInfo(ex){
  // retourne {ok, total, wrong:[valeurs attendues]}
  var inputs=allInputs(); var ok=0, wrong=[];
  inputs.forEach(function(inp){
    var target=parseFloat(inp.dataset.val);
    if(valOk(target,inp.value)) ok++; else wrong.push(fr(target));
  });
  return {ok:ok,total:inputs.length,wrong:wrong};
}

function showFB(){
  var info=lineInfo(EXS[cur]);
  var allOk = info.ok===info.total;
  $('feedback').className='feedback show '+(allOk?'ok':'ko');
  $('fb-icon').textContent = allOk?'\u2705':'\u274c';
  $('fb-msg').innerHTML = allOk
    ? '<strong>Parfait\u00a0!</strong> Toutes les abscisses sont correctes.'
    : '<strong>'+info.ok+' / '+info.total+'</strong> abscisse'+(info.ok>1?'s':'')+' correcte'+(info.ok>1?'s':'')+'.';
  $('fb-det').textContent = allOk
    ? 'Tu sais lire les graduations de cette droite.'
    : 'Valeurs attendues pour les cases en rouge\u00a0: '+info.wrong.join('  \u00b7  ')+'.';
}

function showSolution(){
  if(!validated[cur]) return;
  allInputs().forEach(function(inp){
    inp.value=fr(parseFloat(inp.dataset.val));
    inp.className='nl-input ok';
    inp.disabled=true;
  });
  $('feedback').className='feedback show ok';
  $('fb-icon').textContent='\u2705';
  $('fb-msg').innerHTML='<strong>Solution affich\u00e9e.</strong>';
  $('fb-det').textContent='Les abscisses correctes de cet exercice sont maintenant affich\u00e9es.';
  $('btn-solution').disabled=true;
}

function toggleHint(){
  if(validated[cur]) return;
  var h=$('hint-box'); hintOpen=!hintOpen;
  if(hintOpen){ h.innerHTML=EXS[cur].hint; h.classList.add('show'); } else h.classList.remove('show');
}

function totalScore(){
  var s=0;
  EXS.forEach(function(ex){
    if(!ex._ans) return;
    var ids=Object.keys(ex._ans);
    ids.forEach(function(id){
      // retrouver la cible : parse depuis dataset n'est plus dispo hors DOM, on a stocke val dans _targets
      if(ex._targets && valOk(ex._targets[id], ex._ans[id])) s++;
    });
  });
  return s;
}

function updateStats(){
  // sauvegarder cibles courantes
  var ex=EXS[cur];
  if(validated[cur] && ex._ans){
    ex._targets=ex._targets||{};
    allInputs().forEach(function(inp){ ex._targets[inp.id]=parseFloat(inp.dataset.val); });
  }
  var doneEx=validated.filter(Boolean).length;
  $('prog-bar').style.width=Math.round(doneEx/TOTAL_EX*100)+'%';
  $('prog-label').textContent='Exercice '+(cur+1)+' / '+TOTAL_EX;
  $('prog-pct').textContent=Math.round(doneEx/TOTAL_EX*100)+'\u00a0%';

  var ok=totalScore();
  var doneCount=0;
  EXS.forEach(function(e){ if(e._ans) doneCount+=Object.keys(e._ans).length; });
  $('cnt-ok').textContent=ok;
  $('cnt-ko').textContent=doneCount-ok;
  $('cnt-rem').textContent=TOTAL_PTS-doneCount;
}

function nextQ(){
  if(cur<TOTAL_EX-1){ cur++; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); }
  else showResults();
}
function prevQ(){ if(cur>0){ cur--; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); } }

function showResults(){
  $('ex-card').style.display='none';
  $('results-screen').classList.add('show');
  var ok=totalScore();
  $('score-num').textContent=ok;
  var ratio=ok/TOTAL_PTS;
  var stars = ratio>=1?5 : ratio>=0.8?4 : ratio>=0.6?3 : ratio>=0.4?2 : 1;
  $('stars-row').textContent='\u2b50'.repeat(stars)+'\u2606'.repeat(5-stars);
  var msg;
  if(ratio>=1) msg='Parfait\u00a0! Les 19 abscisses sont justes.';
  else if(ratio>=0.8) msg='Tr\u00e8s bien\u00a0! Tu ma\u00eetrises la lecture des droites gradu\u00e9es.';
  else if(ratio>=0.5) msg='Bien. Quelques abscisses sont \u00e0 revoir.';
  else msg='\u00c0 retravailler. Relis la le\u00e7on, puis recommence.';
  $('results-msg').textContent=msg;
  var list=$('recap-list'); list.innerHTML='';
  EXS.forEach(function(ex,i){
    var ids = ex._ans ? Object.keys(ex._ans) : [];
    var exOk = ids.length>0 && ids.every(function(id){ return ex._targets && valOk(ex._targets[id],ex._ans[id]); });
    var nbOk = ids.filter(function(id){ return ex._targets && valOk(ex._targets[id],ex._ans[id]); }).length;
    var nbTot = ex.lines.reduce(function(b,l){return b+l.marks.length;},0);
    var d=document.createElement('div');
    d.className='recap-item '+(exOk?'ok-item':'ko-item');
    d.innerHTML='<span>'+(exOk?'\u2705':'\u274c')+'</span><span class="eq">Exercice '+(i+1)+'</span><span>'+nbOk+' / '+nbTot+'</span>';
    list.appendChild(d);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(){
  cur=0; validated=[false,false,false]; hintOpen=false;
  EXS.forEach(function(ex){ delete ex._ans; delete ex._targets; });
  $('ex-card').style.display='block';
  $('results-screen').classList.remove('show');
  $('cnt-ok').textContent='0'; $('cnt-ko').textContent='0'; $('cnt-rem').textContent=TOTAL_PTS;
  renderQ();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('DOMContentLoaded', function(){
  $('cnt-rem').textContent=TOTAL_PTS;
  renderQ();
});
</script>
</body>
</html>
