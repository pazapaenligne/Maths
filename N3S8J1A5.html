<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths 3e – Multiples et diviseurs – S8 J1 C</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --day-color:#f5a623;--day-dark:#c47a10;--day-light:#fff5e0;--day-border:#f5d080;
      --day-glow:rgba(245,166,35,.3);
      --bg:#fffdf7;--surface:#fff;--border:#e8e4d9;
      --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;
      --text:#1a1d23;--muted:#8a8f9a;--radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
      position:relative;overflow-x:hidden;letter-spacing:.03em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
      width:260px;height:260px;background:var(--orange);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;
      background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;
      background:var(--green);top:200px;left:-30px;pointer-events:none;}
    /* HEAD */
    .head-card{width:100%;max-width:680px;background:var(--day-light);border:2px solid var(--day-border);
      border-radius:var(--radius);padding:1.9rem 1.5rem 1.6rem;text-align:center;
      position:relative;z-index:1;margin-bottom:1.3rem;}
    .logo-badge{background:var(--yellow);color:#000;font-size:14px;letter-spacing:.09em;
      display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;
      padding:.35rem 1.1rem;border-radius:99px;margin-bottom:.6rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{color:var(--day-dark);font-size:.88rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:var(--text);margin:.3rem 0;}
    .head-card h1 .hl{color:var(--day-dark);}
    .subtitle{color:var(--muted);font-size:.97rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}
    /* NIVEAUX */
    .level-row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1.3rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;
      letter-spacing:.06em;text-transform:uppercase;padding:.65rem 1.35rem;border-radius:12px;
      border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);
      min-height:2.9rem;display:inline-flex;align-items:center;text-decoration:none;
      cursor:pointer;transition:all .18s;}
    .level-btn.active{background:var(--day-color);color:#000;border-color:var(--day-color);
      box-shadow:0 3px 12px var(--day-glow);}
    .stats-card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);
      border-radius:var(--radius);padding:1.1rem;margin-bottom:1.7rem;z-index:1;
      box-shadow:0 4px 20px rgba(0,0,0,.05);}
    .stats-intro{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.92rem;
      color:var(--muted);margin-bottom:.9rem;}
    .stats-row{display:flex;gap:.8rem;}
    .stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);
      border-radius:12px;padding:.9rem .5rem;text-align:center;}
    .stat-num{font-size:1.7rem;font-weight:800;color:var(--day-dark);
      font-family:'JetBrains Mono',monospace;line-height:1.1;}
    .stat-label{font-size:.86rem;color:var(--muted);margin-top:.25rem;}
    .prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:1rem;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));
      border-radius:99px;transition:width .5s ease;}
    .prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;
      color:var(--muted);margin-top:.6rem;}
    /* CARDS */
    #cards{width:100%;max-width:680px;}
    .card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
      padding:1.8rem 1.7rem 1.5rem;position:relative;z-index:1;
      box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:1.5rem;animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--green));}
    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
      margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}
    .q-consigne{font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.75;margin-bottom:.9rem;}
    .q-consigne em{font-weight:400;color:var(--muted);}
    .q-consigne code{font-family:'JetBrains Mono',monospace;background:var(--day-light);
      padding:.1rem .4rem;border-radius:4px;font-size:.97rem;color:var(--day-dark);}
    /* INPUT */
    .aw{display:flex;align-items:center;gap:.8rem;margin:.8rem 0;flex-wrap:wrap;}
    .ai{border:2px solid var(--day-border);border-radius:12px;padding:.75rem 1rem;
      font-size:1rem;font-family:Arial,sans-serif;font-weight:600;
      outline:none;transition:border-color .2s;min-width:160px;}
    .ai:focus{border-color:var(--day-color);}
    .ai.ok{border-color:var(--green);background:#eef7e9;color:#2f6e10;}
    .ai.ko{border-color:var(--pink);background:#fdeeee;color:#c0392b;}
    .al{font-size:.88rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}
    /* TEXTAREA */
    .at{border:2px solid var(--day-border);border-radius:12px;padding:.75rem 1rem;
      font-size:1rem;font-family:Arial,sans-serif;font-weight:600;
      outline:none;transition:border-color .2s;width:100%;resize:vertical;min-height:90px;}
    .at:focus{border-color:var(--day-color);}
    .at.ok{border-color:var(--green);background:#eef7e9;color:#2f6e10;}
    .at.ko{border-color:var(--pink);background:#fdeeee;color:#c0392b;}
    /* BOUTONS */
    .btn-row{display:flex;gap:.7rem;margin-top:1rem;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
      padding:.75rem 1.5rem;border-radius:12px;font-family:Arial,sans-serif;
      font-size:clamp(.95rem,2.5vw,1.05rem);font-weight:800;cursor:pointer;border:none;
      transition:transform .12s;min-height:3rem;flex:1;}
    .btn:active{transform:scale(.96);}.btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 4px 12px var(--day-glow);}
    .btn-hint{background:var(--day-color);color:#fff;box-shadow:0 4px 12px var(--day-glow);}
    /* INDICE */
    .hint-box{margin-top:.7rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;
      padding:.75rem 1rem;font-size:.97rem;color:#7a6010;display:none;line-height:1.75;}
    .hint-box.show{display:block;}
    /* FEEDBACK */
    .feedback{margin-top:.8rem;padding:.7rem 1rem;border-radius:10px;font-size:1rem;
      display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.5rem;flex-shrink:0;}
    /* RÉSULTATS */
    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
      padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,11vw,4.8rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .results-msg{color:var(--muted);font-size:1.05rem;margin-bottom:1rem;line-height:1.7;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:480px){.btn-row{flex-direction:column;}.btn{width:100%;}}
  </style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>

<div class="head-card">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    PAZAPA &middot; MATHS &middot; 3&Egrave;ME
  </div>
  <div class="week-label">Semaine&nbsp;8 &ndash; Jour&nbsp;1</div>
  <h1><span class="hl">Reconna&icirc;tre les multiples et diviseurs d&rsquo;un nombre</span></h1>
  <p class="subtitle">Arithm&eacute;tique &middot; Calcul num&eacute;rique</p>
  <div class="level-row">
    <span class="level-btn">Niveau&nbsp;1</span>
    <span class="level-btn">Niveau&nbsp;2</span>
    <span class="level-btn active">Niveau&nbsp;3</span>
  </div>
</div>

<p style="max-width:680px;margin:0 auto 14px;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:1rem;position:relative;z-index:1;">
  Compl&egrave;te chaque &eacute;tape, puis clique sur <strong>V&eacute;rifier</strong>.
</p>

<div class="stats-card">
  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="st-ok">0</div><div class="stat-label">R&eacute;ussies</div></div>
    <div class="stat-box"><div class="stat-num" id="st-rem">4</div><div class="stat-label">Restantes</div></div>
    <div class="stat-box"><div class="stat-num" id="st-err">0</div><div class="stat-label">&Eacute;chou&eacute;es</div></div>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="pfill" style="width:0%"></div></div>

</div>

<div id="cards"></div>

<section class="results" id="results">
  <div class="results-card">
    <div style="font-size:.8rem;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;">R&eacute;sultats</div>
    <div class="results-score"><span class="s-num" id="res-score">0 / 4</span></div>
    <p class="results-msg" id="res-msg"></p>
    <button class="btn btn-primary" style="max-width:260px;margin:0 auto;" onclick="restart()">&#8635; Recommencer</button>
  </div>
</section>

<script>
var TOTAL=4;
var ST=[{done:false,ok:false,err:false},{done:false,ok:false,err:false},{done:false,ok:false,err:false},{done:false,ok:false,err:false}];

/* ── Normaliseur de texte ── */
function norm(v){
  return v.toLowerCase()
    .replace(/[\u2019\u2018']/g,"'")
    .replace(/\s+/g,' ')
    .trim();
}

/* ── Q4 : données des 6 lignes ── */
var Q4_LINES=[
  {left:'177',right:'708',   ans:'div'},
  {left:'2\u202f169',right:'723',   ans:'mul'},
  {left:'966',right:'961',   ans:'ni'},
  {left:'636',right:'3\u202f180', ans:'div'},
  {left:'434',right:'117',   ans:'ni'},
  {left:'2\u202f356',right:'589',  ans:'mul'}
];
var Q4_OPTS={
  div:"est un diviseur de",
  mul:"est un multiple de",
  ni:"n'est ni un diviseur ni un multiple de"
};

var QS=[
  /* Q1 — sécurisé */
  {
    nom:"Quotient dans une division euclidienne par 28",
    cons:"Quel est le plus grand quotient possible dans une division euclidienne par <strong>28</strong>\u00a0?",
    hint:"R\u00e9fl\u00e9chis\u00a0: si le dividende est tr\u00e8s grand, que se passe-t-il pour le quotient\u00a0? Y a-t-il une limite\u00a0?",
    check:function(v){
      v=norm(v);
      /* Formulations acceptées — phrases significatives uniquement */
      return /il n.?y a pas de (plus grand|maximum|quotient max)/.test(v)
        ||/il n.?existe pas de (plus grand|maximum|quotient max)/.test(v)
        ||/aucun (plus grand|quotient max|maximum)/.test(v)
        ||/le quotient n.?a pas de maximum/.test(v)
        ||/le quotient peut (être|etre) aussi grand/.test(v)
        ||/le quotient est illimit/.test(v)
        ||/pas de plus grand quotient/.test(v)
        ||/pas de quotient maximum/.test(v)
        ||/pas de maximum/.test(v)
        ||/quotient illimit/.test(v)
        ||/illimit/.test(v)&&v.indexOf('quotient')>=0;
    },
    fb:"Il n\u2019y a <strong>pas de plus grand quotient possible</strong>\u00a0: le quotient d\u00e9pend du dividende et peut \u00eatre aussi grand qu\u2019on veut.",
    type:"textarea"
  },
  /* Q2 — sécurisé : quotient associé à 1551, reste associé à 19 */
  {
    nom:"D\u00e9duire quotient et reste",
    cons:"On sait que <code>69\u202f814 = 45 \u00d7 1\u202f551 + 19</code>.<br>En d\u00e9duire le quotient et le reste de la division euclidienne de <strong>69\u202f814</strong> par <strong>45</strong>.",
    hint:"Dans l\u2019\u00e9galit\u00e9 a = b \u00d7 q + r, q est le quotient et r est le reste. Identifie chaque terme.",
    check:function(v){
      v=norm(v);
      /* Trouver la position de "quotient" et "1551"/"1 551" */
      var has1551=v.indexOf('1551')>=0||v.indexOf('1 551')>=0||v.indexOf('1\u202f551')>=0;
      var has19=/(^|[^0-9])19([^0-9]|$)/.test(v);
      if(!has1551||!has19)return false;
      /* Vérifier que 1551 est côté quotient et 19 côté reste */
      /* Chercher "quotient" avant "1551" ou "q" avant "1551" */
      /* Les deux rôles doivent être explicitement présents */
      var posQ=Math.max(v.indexOf('quotient'),v.indexOf('q='),v.indexOf('q ='),v.indexOf('q:'));
      var posR=Math.max(v.indexOf('reste'),v.indexOf('r='),v.indexOf('r ='),v.indexOf('r:'));
      if(posQ<0||posR<0)return false;
      /* Position de 1551 */
      var pos1551=v.indexOf('1551')>=0?v.indexOf('1551'):(v.indexOf('1 551')>=0?v.indexOf('1 551'):-1);
      if(pos1551<0)return false;
      /* Position de 19 — exclure le "19" contenu dans "1551" */
      var pos1551end=pos1551+(v.indexOf('1551')>=0?4:5);
      var pos19=v.search(/(^|[^0-9])19([^0-9]|$)/);
      if(pos19<0||pos19<pos1551end)return false;
      /* 1551 doit être dans un rayon de 30 chars de "quotient" */
      var distQ1551=Math.abs(pos1551-posQ);
      if(distQ1551>30)return false;
      /* 19 doit être dans un rayon de 25 chars de "reste" */
      var distR19=Math.abs(pos19-posR);
      if(distR19>25)return false;
      /* Anti-inversion : refuser si 1551 est côté reste ET 19 côté quotient */
      var dist1551R=Math.abs(pos1551-posR);
      var dist19Q=Math.abs(pos19-posQ);
      var inverted=(dist1551R<distQ1551)&&(dist19Q<distR19);
      return !inverted;
    },
    fb:"Le <strong>quotient</strong> vaut <strong>1\u202f551</strong> et le <strong>reste</strong> vaut <strong>19</strong>, car 69\u202f814 = 45 \u00d7 1\u202f551 + 19.",
    type:"textarea"
  },
  /* Q3 — sécurisé : chaque nombre associé à sa propre conclusion */
  {
    nom:"Diviseurs via \u00e9galit\u00e9s",
    cons:"On donne les trois \u00e9galit\u00e9s suivantes\u00a0:<br><code>428 = 108 \u00d7 3 + 104</code><br><code>428 = 107 \u00d7 4 + 0</code><br><code>428 = 106 \u00d7 4 + 4</code><br>Sans calculer, dire si <strong>108</strong>, <strong>107</strong> et <strong>106</strong> sont des diviseurs de <strong>428</strong>. Justifier.",
    hint:"Un entier b est un diviseur de a si et seulement si le reste de la division euclidienne de a par b est \u00e9gal \u00e0 0.",
    check:function(v){
      v=norm(v);
      /* Découper en 3 segments indépendants selon la position des nombres */
      var p108=v.indexOf('108'), p107=v.indexOf('107'), p106=v.indexOf('106');
      if(p108<0||p107<0||p106<0)return false;
      /* Trier les positions pour délimiter chaque segment */
      var positions=[{num:'108',pos:p108},{num:'107',pos:p107},{num:'106',pos:p106}];
      positions.sort(function(a,b){return a.pos-b.pos;});
      function segOf(num){
        var found=null;
        for(var i=0;i<positions.length;i++){if(positions[i].num===num){found=i;break;}}
        if(found===null)return '';
        var start=positions[found].pos;
        var end=found<positions.length-1?positions[found+1].pos:v.length;
        return v.substring(start, end);
      }
      var seg108=segOf('108');
      var seg107=segOf('107');
      var seg106=segOf('106');
      /* 108 : négation + divise/diviseur dans son segment */
      var ko108=/(ne divise pas|n.est pas (un )?diviseur|pas (un )?diviseur|non diviseur|pas diviser)/.test(seg108)
             ||(/pas|non/.test(seg108)&&/(divis)/.test(seg108));
      /* 107 : affirmation positive dans son segment, sans négation */
      var hasPos107=/(divise(?! pas)|est un diviseur|est diviseur)/.test(seg107);
      var hasNeg107=/(ne divise pas|n.est pas|pas (un )?diviseur)/.test(seg107);
      var ok107=hasPos107&&!hasNeg107;
      /* 106 : négation + divise/diviseur dans son segment */
      var ko106=/(ne divise pas|n.est pas (un )?diviseur|pas (un )?diviseur|non diviseur|pas diviser)/.test(seg106)
             ||(/pas|non/.test(seg106)&&/(divis)/.test(seg106));
      return ko108&&ok107&&ko106;
    },
    fb:"&bull; <strong>108</strong> n\u2019est <strong>pas</strong> un diviseur de 428 (reste 104 \u2260 0).<br>&bull; <strong>107 divise 428</strong> (reste = 0).<br>&bull; <strong>106</strong> n\u2019est <strong>pas</strong> un diviseur de 428 (reste 4 \u2260 0).",
    type:"textarea"
  },
  /* Q4 — 6 menus déroulants */
  {
    nom:"Diviseur, multiple ou ni l\u2019un ni l\u2019autre",
    cons:"Apr\u00e8s avoir test\u00e9 avec la calculatrice, compl\u00e8te chaque phrase\u00a0:",
    hint:"Utilise la calculatrice\u00a0: calcule 708 \u00f7 177. Si le r\u00e9sultat est entier, 177 est un diviseur de 708. Si 177 \u00f7 708 est entier, 177 est un multiple de 708.",
    check:null, /* géré par checkQ4 */
    fb:"&bull; 177 <strong>est un diviseur de</strong> 708 (708 = 177 \u00d7 4).<br>&bull; 2\u202f169 <strong>est un multiple de</strong> 723 (2\u202f169 = 723 \u00d7 3).<br>&bull; 966 <strong>n\u2019est ni un diviseur, ni un multiple de</strong> 961 (966 = 961 \u00d7 1 + 5).<br>&bull; 636 <strong>est un diviseur de</strong> 3\u202f180 (3\u202f180 = 636 \u00d7 5).<br>&bull; 434 <strong>n\u2019est ni un diviseur, ni un multiple de</strong> 117.<br>&bull; 2\u202f356 <strong>est un multiple de</strong> 589 (2\u202f356 = 589 \u00d7 4).",
    type:"select"
  }
];

function $(id){return document.getElementById(id);}

/* ── Rendu Q4 : 6 lignes avec select ── */
function renderQ4(){
  var h='';
  Q4_LINES.forEach(function(line,j){
    h+='<div style="display:flex;align-items:center;gap:.5rem;margin:.5rem 0;flex-wrap:wrap;">'
      +'<span style="font-weight:700;min-width:60px;">'+line.left+'</span>'
      +'<select id="sel3_'+j+'" style="border:2px solid var(--day-border);border-radius:8px;'
      +'padding:.4rem .6rem;font-size:.93rem;font-family:Arial,sans-serif;background:#fff;'
      +'cursor:pointer;outline:none;transition:border-color .2s;">'
      +'<option value="">— choisir —</option>'
      +'<option value="div">est un diviseur de</option>'
      +'<option value="mul">est un multiple de</option>'
      +'<option value="ni">n\u2019est ni un diviseur ni un multiple de</option>'
      +'</select>'
      +'<span style="font-weight:700;min-width:60px;">'+line.right+'</span>'
      +'</div>';
  });
  return h;
}

function getQ4Vals(){
  return Q4_LINES.map(function(_,j){
    var s=document.getElementById('sel3_'+j);
    return s?s.value:'';
  });
}

function checkQ4(){
  var vals=getQ4Vals();
  var allOk=true;
  vals.forEach(function(v,j){if(v!==Q4_LINES[j].ans)allOk=false;});
  return allOk;
}

function colorQ4(vals, forceCorrect){
  Q4_LINES.forEach(function(line,j){
    var s=document.getElementById('sel3_'+j);if(!s)return;
    var userVal=vals[j];
    var ok=(userVal===line.ans);
    if(forceCorrect&&!ok){
      s.value=line.ans; /* injecter la bonne réponse */
      s.style.borderColor='#27ae60';
      s.style.background='#eef7e9';
      s.style.color='#2f6e10';
    } else {
      s.style.borderColor=ok?'#27ae60':'#e03030';
      s.style.background=ok?'#eef7e9':'#fdeeee';
      s.style.color=ok?'#2f6e10':'#c0392b';
    }
  });
}

function disableQ4(){
  Q4_LINES.forEach(function(_,j){
    var s=document.getElementById('sel3_'+j);if(s)s.disabled=true;
  });
}

/* ── Build cards ── */
function buildCards(){
  var h='';
  for(var i=0;i<TOTAL;i++){
    var q=QS[i];
    var inp;
    if(q.type==='select'){
      inp=renderQ4();
    } else if(q.type==='textarea'){
      inp='<textarea class="at" id="ai'+i+'" rows="3" placeholder="Tape ta r\u00e9ponse ici\u2026"></textarea>';
    } else {
      inp='<input class="ai" id="ai'+i+'" type="text" autocomplete="off" />';
    }
    h+='<div class="card" id="card'+i+'">'
      +'<div class="card-stripe"></div>'
      +'<div class="q-num">Question '+(i+1)+'\u00a0/\u00a04</div>'
      +'<div class="q-consigne">'+q.cons+'</div>'
      +inp
      +'<div class="btn-row">'
      +'<button class="btn btn-primary" id="vb'+i+'" onclick="check('+i+')">&#10003; V\u00e9rifier</button>'
      +'<button class="btn btn-hint" onclick="cycHint('+i+')">&#128161; Indice</button>'
      +'</div>'
      +'<div class="hint-box" id="hx'+i+'">'+q.hint+'</div>'
      +'<div class="feedback" id="fb'+i+'"><span class="feedback-icon" id="fbi'+i+'"></span><div><span id="fbt'+i+'"></span></div></div>'
      +'</div>';
  }
  $('cards').innerHTML=h;
  update();
}

function cycHint(i){$('hx'+i).classList.toggle('show');}

/* ── Check général ── */
function check(i){
  if(ST[i].done)return;
  var q=QS[i];

  /* Q4 : traitement spécial */
  if(q.type==='select'){
    var vals=getQ4Vals();
    var hasEmpty=vals.some(function(v){return v==='';});
    if(hasEmpty){showFb(i,'ko','\u26a0\ufe0f','Compl\u00e8te tous les menus avant de valider.');return;}
    var ok=checkQ4();
    if(ok){
      ST[i].done=true;ST[i].ok=true;
      colorQ4(vals,false);disableQ4();
      $('vb'+i).disabled=true;
      showFb(i,'ok','\u2713',q.fb);
    } else if(!ST[i].err){
      ST[i].err=true;
      colorQ4(vals,false);
      $('vb'+i).innerHTML='\u21bb R\u00e9essayer';
      showFb(i,'ko','\u2717','Pas tout \u00e0 fait\u00a0! V\u00e9rifie tes r\u00e9ponses et r\u00e9essaie.');
    } else {
      ST[i].done=true;ST[i].ok=false;
      colorQ4(vals,true);disableQ4();
      $('vb'+i).disabled=true;
      showFb(i,'ko','\u2717',q.fb);
    }
    update();return;
  }

  /* Q1, Q2, Q3 : textarea */
  var val=$('ai'+i)?$('ai'+i).value:'';
  if(!val.trim()){showFb(i,'ko','\u26a0\ufe0f','Tape ta r\u00e9ponse avant de valider.');return;}
  var ok=q.check(val);
  if(ok){
    ST[i].done=true;ST[i].ok=true;
    $('ai'+i).className='at ok';$('ai'+i).disabled=true;
    $('vb'+i).disabled=true;
    showFb(i,'ok','\u2713',q.fb);
  } else if(!ST[i].err){
    ST[i].err=true;
    $('ai'+i).className='at ko';
    $('vb'+i).innerHTML='\u21bb R\u00e9essayer';
    showFb(i,'ko','\u2717','Pas tout \u00e0 fait\u00a0! V\u00e9rifie ta r\u00e9ponse et r\u00e9essaie.');
  } else {
    ST[i].done=true;ST[i].ok=false;
    $('ai'+i).className='at ko';$('ai'+i).disabled=true;
    $('vb'+i).disabled=true;
    showFb(i,'ko','\u2717','Correction\u00a0: '+q.fb);
  }
  update();
}

function showFb(i,t,ic,tx){
  var f=$('fb'+i);f.className='feedback show '+t;
  $('fbi'+i).textContent=ic;$('fbt'+i).innerHTML=tx;
}

function update(){
  var done=0,ok=0;
  for(var i=0;i<TOTAL;i++){if(ST[i].done){done++;if(ST[i].ok)ok++;}}
  $('st-ok').textContent=ok;
  $('st-err').textContent=done-ok;
  $('st-rem').textContent=TOTAL-done;
  $('pfill').style.width=Math.round(done/TOTAL*100)+'%';
  $('prog-text').textContent=done+' / '+TOTAL;
  if(done===TOTAL)showRes(ok);
}

function showRes(ok){
  /* Pas d'étoiles — résultat sur 4 uniquement */
  $('res-score').textContent=ok+' / '+TOTAL;
  var msg=ok===TOTAL?'Excellent\u00a0! Tu ma\u00eetrises les diviseurs et multiples.':
    ok>=3?'Tr\u00e8s bien\u00a0! Relis les corrections pour consolider.':
    '\u00c0 retravailler\u00a0: relis chaque correction attentivement.';
  $('res-msg').textContent=msg;
  $('results').className='results show';
}

function restart(){
  ST=[{done:false,ok:false,err:false},{done:false,ok:false,err:false},{done:false,ok:false,err:false},{done:false,ok:false,err:false}];
  $('results').className='results';
  buildCards();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildCards();

</script>
</body>
</html>
