<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa 4e – Compléter la représentation d'une pyramide ou d'un cône – S6 J2</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --day-color:#b7472a;--day-dark:#6e2a17;--day-light:#fbeee8;--day-border:#e8b7a4;
  --day-glow:rgba(183,71,42,.3);
  --bg:#fffdf7;--surface:#fff;--border:#e8e4d9;
  --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;
  --text:#1a1d23;--muted:#8a8f9a;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;
  position:relative;overflow-x:hidden;letter-spacing:.03em;line-height:1.6;}
body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
  width:340px;height:340px;background:var(--day-color);top:-80px;right:-80px;pointer-events:none;}
body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
  width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
.bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;
  background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
.bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;
  background:var(--yellow);top:200px;left:-30px;pointer-events:none;}
.head-card{width:100%;max-width:640px;background:var(--day-light);border:2px solid var(--day-border);
  border-radius:var(--radius);padding:1.9rem 1.5rem 1.4rem;text-align:center;
  position:relative;z-index:1;margin-bottom:1rem;}
.logo-badge{background:var(--day-color);color:#fff;font-size:14px;letter-spacing:.09em;
  display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;
  padding:.35rem 1.1rem;border-radius:99px;margin-bottom:.6rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{color:var(--day-dark);font-size:.88rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
.head-card h1{font-size:clamp(1.1rem,4vw,1.5rem);font-weight:900;color:var(--text);margin:.3rem 0;}
.head-card h1 .hl{color:var(--day-dark);}
.subtitle{color:var(--muted);font-size:.9rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}
.stats-card{width:100%;max-width:640px;background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);padding:1.1rem;margin-bottom:1.5rem;
  box-shadow:0 4px 20px rgba(0,0,0,.05);position:relative;z-index:1;}
.prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--orange));
  border-radius:99px;transition:width .5s ease;}
.prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;
  color:var(--muted);margin-top:.6rem;}
.card{width:100%;max-width:640px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
  padding:1.5rem 1.5rem 1.2rem;position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .35s ease both;z-index:1;}
.card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
  border-radius:var(--radius) var(--radius) 0 0;
  background:linear-gradient(90deg,var(--day-color),var(--orange),var(--blue));}
.q-label{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
  margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.1em;}
.consigne{font-size:.98rem;color:var(--text);margin:.3rem 0 .8rem;line-height:1.6;}
.fig-wrap{text-align:center;margin:.6rem 0;background:var(--day-light);border-radius:12px;padding:.9rem;}
.fig-wrap img{max-width:100%;border-radius:6px;}
.fig-caption{font-size:.78rem;color:var(--muted);margin-top:.5rem;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;}
.paper-box{margin-top:.8rem;background:var(--day-light);border:1.5px dashed var(--day-color);
  border-radius:10px;padding:.8rem 1rem;font-size:.93rem;color:var(--day-dark);line-height:1.7;}
.btn-row{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.7rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;
  font-size:clamp(.92rem,2.5vw,1rem);font-weight:800;cursor:pointer;border:none;
  transition:transform .12s;min-height:2.9rem;flex:1;}
.btn:active{transform:scale(.96);}
.btn-v{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
.corr-wrap{display:none;margin-top:1rem;}
.corr-wrap.show{display:block;}
.corr-title{font-size:.78rem;font-family:'JetBrains Mono',monospace;color:var(--day-dark);
  text-transform:uppercase;letter-spacing:.1em;margin:1rem 0 .5rem;font-weight:700;}
.corr-list{margin:.3rem 0 .8rem 1.2rem;font-size:.92rem;color:var(--text);line-height:1.9;}
.corr-text{font-size:.9rem;color:var(--text);line-height:1.7;
  background:var(--day-light);border-radius:10px;padding:.8rem 1rem;}
.results-wrap{width:100%;max-width:640px;display:none;position:relative;z-index:1;margin-top:1.5rem;}
.results-wrap.show{display:block;}
.res-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
  padding:2.2rem 2rem;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.res-msg{color:var(--text);font-size:1.05rem;margin-bottom:1.2rem;line-height:1.7;}
.btn-restart{background:var(--surface);color:var(--day-dark);border:2px solid var(--day-border);
  border-radius:10px;padding:.7rem 1.8rem;font-size:1rem;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.btn-row{flex-direction:column;}.btn{width:100%;}}
</style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>

<div class="head-card">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    PAZAPA &middot; MATHS &middot; 4&Egrave;ME
  </div>
  <div class="week-label">Semaine&nbsp;6 &ndash; Jour&nbsp;2 &mdash; Je m&rsquo;entra&icirc;ne &mdash; Niveau&nbsp;1</div>
  <h1><span class="hl">Compl&eacute;ter la repr&eacute;sentation d&rsquo;une pyramide ou d&rsquo;un c&ocirc;ne en perspective cavali&egrave;re</span></h1>
  <p class="subtitle">4 exercices &middot; &Agrave; r&eacute;aliser sur ton cahier ou une feuille</p>
</div>

<div class="stats-card">
  <div class="prog-bg"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
  <div class="prog-text" id="prog-text">Exercice 1 / 4</div>
</div>

<div id="cardHost"></div>

<div class="results-wrap" id="results">
  <div class="res-card">
    <p class="res-msg">&#127881; Tu as termin&eacute; les 4 exercices de construction en perspective cavali&egrave;re&nbsp;!</p>
    <button class="btn-restart" onclick="restart()">&#8635; Recommencer</button>
  </div>
</div>

    +'<div class="fig-wrap"><img src="'+q.imgCorr+'" alt="Correction exercice '+q.lbl+'"/><div class="fig-caption">Figure compl&eacute;t&eacute;e</div></div>'
    +'<div class="corr-title">Ce qu&rsquo;il fallait faire</div>'
    +'<ul class="corr-list">'+q.corrList.map(function(li){return '<li>'+li+'</li>';}).join('')+'</ul>'
    +'<div class="corr-text">'+q.corrText+'</div>'
    +'<div class="btn-row"><button class="btn btn-v" onclick="next()">'+(current===TOTAL-1?'Terminer':'Exercice suivant &rarr;')+'</button></div>'
    +'</div>'
    +'</div>';
  $('cardHost').innerHTML=h;
  updateProg();
}

function showCorr(){
  if(!revealed[current]){
    revealed[current]=true;
  }
  $('corrWrap').classList.add('show');
  $('btnDone').style.display='none';
  updateProg();
}

function next(){
  current++;
  render();
}

function updateProg(){
  var doneCount=revealed.filter(Boolean).length;
  $('pfill').style.width=Math.round(doneCount/TOTAL*100)+'%';
  if(current<TOTAL && revealed[current]){
    $('prog-text').textContent='Exercice '+(current+1)+' termin&eacute; &mdash; '+(current+1)+' / '+TOTAL;
  } else if(current<TOTAL){
    $('prog-text').textContent='Exercice '+(current+1)+' / '+TOTAL;
  }
}

function restart(){
  current=0;
  for(var i=0;i<TOTAL;i++)revealed[i]=false;
  $('results').className='results-wrap';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
</body>
</html>
