<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PAZAPA Maths — S1J2 · Résoudre une équation du 1er degré</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ───────── CHARTE J2 ROSE ───────── */
:root{
  --jour:#f28b82;        /* principal */
  --jour-fonce:#c0392b;  /* texte foncé */
  --jour-soft:#fff0ef;   /* fond soft */
  --jour-accent:#f9c0bb; /* accent / blobs */
  --jour-titre:#c0392b;  /* titre */
  --badge-txt:#6b1408;   /* texte badge */
  --vert:#8dc63f; --vert-fonce:#3d7a10; --vert-soft:#f0faeb;
  --rouge:#e74c3c; --rouge-soft:#fdedec; --rouge-fonce:#c0392b;
  --texte:#23262d; --gris:#8a8f9a; --bord:#ece8dd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}
body{
  background:#ffffff; color:var(--texte);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:1.6rem 1rem 4rem; position:relative;
}
/* ───────── 3 BLOBS ORGANIQUES FIXES ───────── */
.blob{position:fixed;z-index:0;pointer-events:none;background:var(--jour-accent);filter:blur(1px);}
.blob1{width:300px;height:280px;top:-70px;right:-80px;opacity:.30;
  border-radius:38% 62% 55% 45% / 56% 40% 60% 44%;}
.blob2{width:220px;height:240px;top:38%;left:-90px;opacity:.27;
  border-radius:62% 38% 44% 56% / 42% 58% 42% 58%;}
.blob3{width:260px;height:230px;bottom:-60px;right:-50px;opacity:.28;
  border-radius:45% 55% 62% 38% / 55% 45% 58% 42%;}

/* ───────── HERO ───────── */
header{text-align:center;position:relative;z-index:1;margin-bottom:1.4rem;max-width:720px;}
.badge-semaine{
  display:inline-block;background:var(--jour-soft);border:2px solid var(--jour);
  color:var(--badge-txt);font-weight:800;font-size:.78rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.35rem 1rem;border-radius:99px;margin-bottom:.8rem;
}
h1{font-size:clamp(1.35rem,4vw,1.9rem);font-weight:800;color:var(--jour-titre);line-height:1.35;}
.sous-titre{color:var(--gris);font-size:.92rem;margin-top:.45rem;line-height:1.8;}

/* ───────── PROGRESSION + COMPTEURS ───────── */
.progress-wrap{width:100%;max-width:660px;margin-bottom:1rem;position:relative;z-index:1;}
.progress-info{
  display:flex;justify-content:space-between;font-size:.78rem;color:var(--gris);
  margin-bottom:.4rem;
}
.progress-bar-bg{background:var(--bord);border-radius:99px;height:8px;overflow:hidden;}
.progress-bar-fill{
  height:100%;width:0%;border-radius:99px;transition:width .5s ease;
  background:linear-gradient(90deg,var(--jour),#e8625c);
}
.score-row{
  display:flex;gap:.6rem;margin-bottom:1.4rem;flex-wrap:wrap;justify-content:center;
  position:relative;z-index:1;
}
.chip{
  display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:99px;
  font-size:.8rem;border:2px solid var(--bord);background:#fff;font-weight:600;
}
.chip .dot{width:8px;height:8px;border-radius:50%;}
.chip.correct .dot{background:var(--vert);}
.chip.wrong .dot{background:var(--rouge);}
.chip.remaining .dot{background:var(--gris);}

/* ───────── CARTE ───────── */
.carte{
  width:100%;max-width:660px;background:#fff;
  border:2px solid var(--bord);border-radius:18px;
  padding:1.6rem 1.6rem 1.5rem;position:relative;z-index:1;
  box-shadow:0 6px 24px rgba(0,0,0,.07);
  animation:fadeUp .4s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.q-label{font-size:.74rem;color:var(--gris);text-transform:uppercase;letter-spacing:.12em;
  font-weight:700;margin-bottom:.8rem;}
.eq-bloc{
  background:var(--jour-soft);border:2px solid var(--jour-accent);border-radius:14px;
  padding:1rem .8rem;text-align:center;margin-bottom:.8rem;
}
.equation{
  font-size:clamp(1.3rem,4.2vw,1.8rem);font-weight:800;color:var(--texte);line-height:1.9;
}
.question-text{font-size:.86rem;color:var(--gris);margin-bottom:1.2rem;text-align:center;line-height:1.8;}
.question-text i{font-style:italic;}

/* ───────── SAISIE ───────── */
.input-row{display:flex;align-items:center;justify-content:center;gap:.7rem;flex-wrap:wrap;}
.input-label{font-size:1.15rem;font-weight:800;}
.input-label i{font-style:italic;}
.answer-input{
  width:7.5rem;background:#fff;border:2.5px solid var(--jour);border-radius:11px;
  color:var(--texte);font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;
  padding:.55rem .7rem;outline:none;text-align:center;
}
.answer-input:focus{outline:3px solid var(--jour-accent);}
.answer-input.correct-input{border-color:var(--vert);background:var(--vert-soft);}
.answer-input.wrong-input{border-color:var(--rouge);background:var(--rouge-soft);}
.answer-input:disabled{opacity:.85;}

/* ───────── BOUTONS ───────── */
.btn{
  font-family:'JetBrains Mono',monospace;border:none;cursor:pointer;
  border-radius:12px;font-weight:800;font-size:.92rem;
  padding:.65rem 1.3rem;min-height:2.8rem;
  display:inline-flex;align-items:center;gap:.4rem;
  transition:transform .12s, box-shadow .15s, opacity .15s;
}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;}
.btn-primary{
  background:var(--jour);color:#fff;
  box-shadow:0 3px 12px rgba(242,139,130,.5);
}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(242,139,130,.6);}
.btn-hint{
  background:var(--jour-soft);color:var(--jour-fonce);border:2px solid var(--jour);
}
.btn-hint:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(242,139,130,.35);}
.btn-ghost{
  background:#fff;color:var(--gris);border:2px solid var(--bord);
}
.btn-ghost:hover:not(:disabled){border-color:var(--jour);color:var(--texte);}

/* ───────── FEEDBACK + INDICE ───────── */
.feedback{
  margin-top:1.2rem;padding:.8rem 1rem;border-radius:12px;font-size:.9rem;
  display:none;align-items:flex-start;gap:.6rem;line-height:1.9;
}
.feedback.show{display:flex;animation:fadeUp .3s ease both;}
.feedback.ok{background:var(--vert-soft);border:2px solid var(--vert);color:var(--vert-fonce);}
.feedback.ko{background:var(--rouge-soft);border:2px solid var(--rouge);color:var(--rouge-fonce);}
.feedback-icon{font-size:1.2rem;flex-shrink:0;}
.feedback-detail{color:var(--texte);font-size:.82rem;margin-top:.2rem;line-height:1.8;}
.hint-box{
  margin-top:.9rem;background:var(--jour-soft);
  border:2px dashed var(--jour);border-radius:12px;padding:.7rem 1rem;
  font-size:.84rem;color:var(--jour-fonce);display:none;line-height:1.9;
}
.hint-box.show{display:block;animation:fadeUp .25s ease both;}
.hint-box strong{color:var(--jour-fonce);}

/* ───────── NAVIGATION ───────── */
.nav-row{display:flex;justify-content:space-between;margin-top:1.4rem;gap:.7rem;}

/* ───────── RÉSULTATS ───────── */
.results{
  width:100%;max-width:660px;text-align:center;display:none;
  position:relative;z-index:1;
}
.results.show{display:block;animation:fadeUp .4s ease both;}
.results-card{
  background:#fff;border:2px solid var(--bord);border-radius:18px;
  padding:1.8rem 1.6rem;box-shadow:0 6px 24px rgba(0,0,0,.07);
}
.trophee{font-size:3.2rem;margin-bottom:.4rem;}
.results-score{
  font-size:clamp(2.4rem,9vw,4rem);font-weight:800;line-height:1.1;margin:.4rem 0;
  color:var(--jour-fonce);
}
.stars{font-size:1.9rem;letter-spacing:.15em;margin:.4rem 0 .8rem;}
.results-msg{color:var(--texte);font-size:.95rem;margin-bottom:1.6rem;line-height:1.9;}
.recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.6rem;}
.recap-item{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  padding:.6rem .9rem;border-radius:10px;font-size:.84rem;line-height:1.8;
}
.recap-item .eq{flex:1;min-width:10rem;}
.recap-item.ok-item{background:var(--vert-soft);border:1.5px solid var(--vert);color:var(--vert-fonce);}
.recap-item.ko-item{background:var(--rouge-soft);border:1.5px solid var(--rouge);color:var(--rouge-fonce);}

/* ───────── MOBILE ───────── */
@media(max-width:430px){
  body{padding:1.1rem .7rem 3rem;}
  .equation{font-size:1.2rem;}
  .carte{padding:1.2rem 1rem 1.3rem;}
  .answer-input{width:6.5rem;font-size:1rem;}
  .btn{font-size:.84rem;padding:.6rem 1rem;}
}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<header>
  <div class="badge-semaine">Semaine 1 · Jour 2</div>
  <h1>✏️ Résoudre une équation du 1er degré</h1>
  <p class="sous-titre">5 exercices · niveau collège</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Question 1 / 5</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar"></div>
  </div>
</div>

<div class="score-row">
  <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span>&nbsp;correctes</div>
  <div class="chip wrong"><div class="dot"></div><span id="count-ko">0</span>&nbsp;erreurs</div>
  <div class="chip remaining"><div class="dot"></div><span id="count-rem">5</span>&nbsp;restantes</div>
</div>

<div class="carte" id="ex-card">
  <div class="q-label" id="q-num">Exercice 1</div>
  <div class="eq-bloc"><div class="equation" id="q-eq"></div></div>
  <div class="question-text">Trouve la valeur de <i>x</i> qui vérifie cette équation.</div>

  <div class="input-row">
    <span class="input-label"><i>x</i>&nbsp;=</span>
    <input type="number" class="answer-input" id="answer-input" placeholder="?" autocomplete="off"/>
    <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">✅ Valider</button>
    <button class="btn btn-hint" id="btn-hint" onclick="toggleHint()">💡 Indice</button>
  </div>

  <div class="hint-box" id="hint-box"></div>

  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="fb-icon"></span>
    <div>
      <div id="fb-msg"></div>
      <div class="feedback-detail" id="fb-detail"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">← Précédent</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant →</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="trophee">🏆</div>
    <div class="results-score"><span id="score-num">0</span>/5</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <div class="recap-list" id="recap-list"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;">↻ Recommencer</button>
  </div>
</div>

<script>
"use strict";
var EXERCISES = [
  { eq: "2x + 3 = 11",            ans: 4, hint: "On enl\u00e8ve 3 des deux c\u00f4t\u00e9s\u00a0: 2x = 11 \u2212 3. Puis on divise par 2." },
  { eq: "5x \u2212 4 = 16",        ans: 4, hint: "On ajoute 4 des deux c\u00f4t\u00e9s\u00a0: 5x = 16 + 4. Puis on divise par 5." },
  { eq: "3x + 7 = x + 15",        ans: 4, hint: "On regroupe\u00a0: 3x \u2212 x = 15 \u2212 7. Puis on isole x en divisant par 2." },
  { eq: "4(x \u2212 1) = 2x + 6",  ans: 5, hint: "On d\u00e9veloppe\u00a0: 4x \u2212 4 = 2x + 6. On regroupe les x \u00e0 gauche, les nombres \u00e0 droite, puis on divise par 2." },
  { eq: "\u22123x + 9 = x \u2212 7", ans: 4, hint: "On regroupe\u00a0: \u22123x \u2212 x = \u22127 \u2212 9. Puis on divise par \u22124 (attention au signe\u00a0!)." }
];

var current = 0;
var userAnswers = new Array(EXERCISES.length).fill(null);
var hintOpen = false;
var $ = function(id){ return document.getElementById(id); };

function render() {
  var ex = EXERCISES[current];
  $('q-num').textContent = 'Exercice ' + (current + 1) + ' / ' + EXERCISES.length;
  $('q-eq').textContent = ex.eq;
  $('hint-box').innerHTML = '';
  $('hint-box').classList.remove('show');
  hintOpen = false;

  var inp = $('answer-input');
  inp.className = 'answer-input';
  inp.value = userAnswers[current] !== null ? userAnswers[current] : '';
  $('feedback').className = 'feedback';

  if (userAnswers[current] !== null) {
    var correct = userAnswers[current] === ex.ans;
    showFeedback(correct);
    inp.className = 'answer-input ' + (correct ? 'correct-input' : 'wrong-input');
    $('btn-next').disabled = false;
    $('btn-check').disabled = true;
    inp.disabled = true;
  } else {
    $('btn-next').disabled = true;
    $('btn-check').disabled = false;
    inp.disabled = false;
    inp.focus();
  }

  var answered = userAnswers.filter(function(a){ return a !== null; }).length;
  var pct = Math.round(answered / EXERCISES.length * 100);
  $('progress-bar').style.width = pct + '%';
  $('prog-label').textContent = 'Question ' + (current + 1) + ' / ' + EXERCISES.length;
  $('prog-pct').textContent = pct + '\u00a0%';

  var ok = userAnswers.filter(function(a, i){ return a === EXERCISES[i].ans; }).length;
  var ko = userAnswers.filter(function(a, i){ return a !== null && a !== EXERCISES[i].ans; }).length;
  $('count-ok').textContent = ok;
  $('count-ko').textContent = ko;
  $('count-rem').textContent = EXERCISES.length - answered;
  $('btn-prev').disabled = (current === 0);
}

function showFeedback(correct) {
  var fb = $('feedback');
  fb.className = 'feedback show ' + (correct ? 'ok' : 'ko');
  $('fb-icon').textContent = correct ? '\u2705' : '\u274c';
  $('fb-msg').textContent = correct ? 'Bonne r\u00e9ponse\u00a0!' : 'Pas tout \u00e0 fait\u2026';
  $('fb-detail').textContent = correct
    ? 'x = ' + userAnswers[current] + ' v\u00e9rifie bien l\u2019\u00e9quation.'
    : 'La bonne r\u00e9ponse \u00e9tait x = ' + EXERCISES[current].ans + '.';
}

function checkAnswer() {
  var val = parseFloat($('answer-input').value);
  if (isNaN(val)) { $('answer-input').focus(); return; }
  userAnswers[current] = val;
  render();
}

function toggleHint() {
  var h = $('hint-box');
  hintOpen = !hintOpen;
  if (hintOpen) {
    h.innerHTML = '<strong>\uD83D\uDCA1 Indice\u00a0:</strong> ' + EXERCISES[current].hint;
    h.classList.add('show');
  } else {
    h.classList.remove('show');
  }
}

function nextQ() {
  if (current < EXERCISES.length - 1) { current++; render(); window.scrollTo({ top:0, behavior:'smooth' }); }
  else { showResults(); }
}

function prevQ() {
  if (current > 0) { current--; render(); }
}

function showResults() {
  $('ex-card').style.display = 'none';
  $('results-screen').classList.add('show');
  var ok = userAnswers.filter(function(a, i){ return a === EXERCISES[i].ans; }).length;
  $('score-num').textContent = ok;
  var stars = (ok === 5) ? 3 : (ok >= 3 ? 2 : 1);
  $('stars-row').textContent = '\u2b50'.repeat(stars) + '\u2606'.repeat(3 - stars);
  var msg;
  if (ok === 5) { msg = 'Parfait\u00a0! Bravo\u00a0! \uD83C\uDF89'; }
  else if (ok >= 3) { msg = 'Bien jou\u00e9\u00a0! Encore un petit entra\u00eenement et ce sera parfait\u00a0!'; }
  else { msg = 'C\u2019est un bon d\u00e9but\u00a0! Recommence pour t\u2019entra\u00eener, tu vas y arriver\u00a0! \uD83D\uDCAA'; }
  $('results-msg').textContent = msg;
  var list = $('recap-list');
  list.innerHTML = '';
  EXERCISES.forEach(function(ex, i){
    var ans = userAnswers[i];
    var correct = (ans === ex.ans);
    var div = document.createElement('div');
    div.className = 'recap-item ' + (correct ? 'ok-item' : 'ko-item');
    var droite = 'x = ' + ex.ans + (!correct && ans !== null ? ' (tu as mis ' + ans + ')' : '');
    div.innerHTML = '<span>' + (correct ? '\u2714' : '\u2718') + '</span>'
      + '<span class="eq">' + ex.eq + '</span><span><strong>' + droite + '</strong></span>';
    list.appendChild(div);
  });
  window.scrollTo({ top:0, behavior:'smooth' });
}

function restart() {
  current = 0;
  userAnswers = new Array(EXERCISES.length).fill(null);
  $('ex-card').style.display = 'block';
  $('results-screen').classList.remove('show');
  render();
}

document.addEventListener('DOMContentLoaded', function(){
  $('answer-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !$('btn-check').disabled) { checkAnswer(); }
  });
  render();
});
</script>
</body>
</html>
