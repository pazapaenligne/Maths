<head>

<title>PAZAPA Maths — N4S3J1 · Exercices</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --jour:#f5a623; --jour-fonce:#c47a10; --jour-soft:#fff5e0; --jour-accent:#f5d080;
  --badge-txt:#5a3500;
  --vert:#8dc63f; --vert-fonce:#3d7a10; --vert-soft:#f0faeb;
  --rouge:#e74c3c; --rouge-soft:#fdedec; --rouge-fonce:#c0392b;
  --bleu:#3ab5d8; --bleu-soft:#e8f6fb;
  --texte:#23262d; --gris:#8a8f9a; --bord:#ece8dd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}
body{background:#fffdf7;color:var(--texte);font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.6rem 1rem 4rem;position:relative;}
.blob{position:fixed;z-index:0;pointer-events:none;filter:blur(1px);}
.b1{width:300px;height:280px;top:-70px;right:-80px;background:var(--jour-accent);opacity:.30;border-radius:38% 62% 55% 45% / 56% 40% 60% 44%;}
.b2{width:220px;height:240px;bottom:8%;left:-90px;background:var(--jour-accent);opacity:.25;border-radius:62% 38% 44% 56% / 42% 58% 42% 58%;}
.b3{width:240px;height:220px;top:40%;right:-70px;background:#bfe49a;opacity:.20;border-radius:45% 55% 62% 38% / 55% 45% 58% 42%;}
.b4{width:200px;height:200px;top:20%;left:-70px;background:#f6c0bb;opacity:.18;border-radius:55% 45% 40% 60% / 50% 55% 45% 50%;}

header{position:relative;z-index:1;text-align:center;max-width:720px;margin-bottom:1.4rem;}
.capsule{display:inline-flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--bord);
  border-radius:99px;padding:.3rem .9rem;font-family:'JetBrains Mono',monospace;font-size:.78rem;
  font-weight:700;color:var(--gris);margin-bottom:.6rem;}
.capsule .dots{color:var(--jour);letter-spacing:.12em;}
.badge{display:block;width:max-content;margin:0 auto .7rem;background:var(--jour-soft);border:2px solid var(--jour);
  color:var(--badge-txt);font-family:'JetBrains Mono',monospace;font-weight:800;font-size:.74rem;
  letter-spacing:.14em;padding:.32rem 1rem;border-radius:99px;}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:var(--jour-fonce);line-height:1.25;}
.intro{color:#5a5f6a;font-size:.92rem;margin-top:.5rem;line-height:1.7;}
.scorechip{display:inline-block;margin-top:.9rem;background:var(--vert-soft);border:2px solid var(--vert);
  color:var(--vert-fonce);font-family:'JetBrains Mono',monospace;font-weight:800;font-size:.85rem;
  padding:.3rem .9rem;border-radius:99px;}

#app{position:relative;z-index:1;width:100%;max-width:720px;display:flex;flex-direction:column;gap:1.3rem;}
.ex{background:#fff;border:2px solid var(--bord);border-radius:18px;padding:1.3rem 1.3rem 1.4rem;
  box-shadow:0 6px 22px rgba(0,0,0,.06);}
.ex-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem;}
.ex-code{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:.74rem;background:var(--jour);
  color:#fff;padding:.2rem .6rem;border-radius:8px;letter-spacing:.05em;}
.ex-head h2{font-size:1.02rem;color:var(--jour-fonce);font-weight:800;line-height:1.4;}
.ex-consigne{font-size:.92rem;color:#4a4f5a;line-height:1.7;margin-bottom:.9rem;}

.item{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.55rem 0;border-top:1px dashed var(--bord);}
.item:first-of-type{border-top:none;}
.item .lab{font-size:1.12rem;font-weight:700;display:inline-flex;align-items:center;gap:.35rem;flex-wrap:wrap;}
.item .lab i{font-style:italic;}
.item input{font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:700;min-height:2.6rem;
  width:7.5rem;max-width:42vw;padding:.4rem .6rem;border-radius:10px;border:2.5px solid var(--jour);
  background:#fff;color:var(--texte);text-align:center;}
.item input:focus{outline:3px solid var(--jour-accent);}
.cmp-btns{display:inline-flex;gap:.45rem;}
.cmp-btns button{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:800;min-width:3rem;
  min-height:2.6rem;border:2.5px solid var(--jour);border-radius:10px;background:#fff;color:var(--texte);cursor:pointer;}
.cmp-btns button.sel{background:var(--jour);color:#fff;}
.verdict{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:.86rem;min-width:5.5rem;}
.verdict.ok{color:var(--vert-fonce);}
.verdict.ko{color:var(--rouge-fonce);}
.verdict.info{color:var(--jour-fonce);}
.item.ok input,.item.ok .cmp-btns button.sel{border-color:var(--vert);}
.item.ok input{background:var(--vert-soft);}
.item.ko input,.item.ko .cmp-btns button.sel{border-color:var(--rouge);}
.item.ko input{background:var(--rouge-soft);}

.actions{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:1rem;}
.btn{font-family:'JetBrains Mono',monospace;border:none;cursor:pointer;border-radius:11px;font-weight:800;
  font-size:clamp(.82rem,2.4vw,.92rem);min-height:2.7rem;padding:.5rem 1rem;transition:transform .1s,opacity .15s;}
.btn:active{transform:scale(.96);}
.btn.check{background:var(--jour);color:#fff;}
.btn.hint{background:var(--bleu-soft);color:#1a6e88;border:2px solid var(--bleu);}
.btn.sol{background:#fff;color:var(--jour-fonce);border:2px solid var(--jour);}
.btn.reset{background:#f4f1ea;color:#6a6f7a;border:2px solid var(--bord);}

.box{display:none;margin-top:.9rem;border-radius:12px;padding:.8rem 1rem;font-size:.9rem;line-height:1.85;}
.box.show{display:block;}
.box.hintbox{background:var(--bleu-soft);border:2px solid var(--bleu);color:#13586e;}
.box.solbox{background:var(--jour-soft);border:2px solid var(--jour-accent);color:var(--jour-fonce);}
.box b{font-weight:800;}
.box .step{display:block;}
.box i{font-style:italic;}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.12;font-weight:700;}
.frac .num{border-bottom:2.5px solid currentColor;padding:0 .3em;}
.frac .den{padding:0 .3em;}

@media(max-width:430px){
  body{padding:1.1rem .7rem 3rem;}
  .item .lab{font-size:1rem;}
  .item input{font-size:.95rem;width:6.5rem;}
}
</style>

<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>

<header>
  <div class="capsule"><span class="dots">● ● ●</span> Pazapa · 4e · Mathématiques</div>
  <div class="badge">SEMAINE 3 · JOUR 1</div>
  <h1>✏️ Résoudre les exercices</h1>
  <p class="intro">Je m'entraîne sur les exercices de la séance : valeur décimale, comparaison de relatifs, calculs sur les relatifs, fractions et réduction d'expressions.</p>

</header>

<main id="app"></main>

<script>
"use strict";
var $=function(id){return document.getElementById(id);};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function makeFrac(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return {n:n/g,d:d/g};}
function sameFrac(f,g){return f&&g&&f.n*g.d===g.n*f.d;}
function fr(n,d){return "<span class='frac'><span class='num'>"+n+"</span><span class='den'>"+d+"</span></span>";}
var M="\u2212"; /* signe moins typographique */

/* ── parseurs ── */
function parseDecimal(raw){
  var s=String(raw).replace(/\s+/g,"").replace(/\u2212/g,"-").replace(/,/g,".");
  if(s==="") return null;
  if(s.indexOf("/")>=0) return "FRACTION";
  if(!/^[+-]?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}
function parseEntier(raw){
  var s=String(raw).replace(/\s+/g,"").replace(/\u2212/g,"-").replace(/^\+/,"");
  if(!/^[-]?\d+$/.test(s)) return null;
  return parseInt(s,10);
}
function parseFractionStrict(raw){
  var s=String(raw).replace(/\s+/g,"").replace(/\u2212/g,"-");
  if(s==="") return null;
  var m=s.match(/^([+-]?\d+)\/([+-]?\d+)$/);
  if(m){var d=parseInt(m[2],10);if(d===0)return null;return makeFrac(parseInt(m[1],10),d);}
  if(/^[+-]?\d+$/.test(s)) return makeFrac(parseInt(s,10),1);
  if(/^[+-]?\d*[.,]\d+$/.test(s)) return "DECIMAL";
  return null;
}
function polyParse(s){
  s=String(s).toLowerCase().replace(/\s/g,"").replace(/[\u2212\u2013\u2014]/g,"-").replace(/\u00d7/g,"").replace(/\*/g,"").replace(/\u00b7/g,"").replace(/\u00b2/g,"^2");
  if(s==="") return null;
  if(s[0]!=="+"&&s[0]!=="-") s="+"+s;
  var a2=0,a1=0,a0=0,n2=0,n1=0,n0=0,re=/([+-][^+-]+)/g,m,matched="";
  while((m=re.exec(s))!==null){
    var t=m[1];matched+=t;
    if(t.indexOf("x^2")>=0){var c=t.split("x^2").join("");if(c==="+")c="+1";else if(c==="-")c="-1";var v=Number(c);if(isNaN(v))return null;a2+=v;n2++;}
    else if(t.indexOf("x")>=0){var c1=t.split("x").join("");if(c1==="+")c1="+1";else if(c1==="-")c1="-1";var v1=Number(c1);if(isNaN(v1))return null;a1+=v1;n1++;}
    else{var v0=Number(t);if(isNaN(v0))return null;a0+=v0;n0++;}
  }
  if(matched!==s) return null;
  return {a2:a2,a1:a1,a0:a0,n2:n2,n1:n1,n0:n0};
}

/* ── contenu EXACT des captures ── */
var EXOS=[
 { code:"6C22", titre:"D\u00e9terminer la valeur d\u00e9cimale d'une fraction",
   consigne:"Donne la valeur d\u00e9cimale de :",
   items:[ {kind:"dec", lab:fr(6,5)+" =", ansNum:1.2} ],
   indice:"Divise le num\u00e9rateur par le d\u00e9nominateur, ou \u00e9cris la fraction avec 10 au d\u00e9nominateur.",
   correction:"<span class='step'>"+fr(6,5)+" = "+fr(5,5)+" + "+fr(1,5)+"</span><span class='step'>= 1 + 0,2</span><span class='step'>= <b>1,2</b></span>" },

 { code:"5R13", titre:"Comparer des nombres relatifs",
   consigne:"Compl\u00e8te avec le signe &lt; ou &gt;.",
   items:[
     {kind:"cmp", left:"2,12", right:"2,5", ans:"<"},
     {kind:"cmp", left:"5", right:"3", ans:">"},
     {kind:"cmp", left:"2,111", right:"2,48", ans:"<"},
     {kind:"cmp", left:M+"7,7", right:"7,5", ans:"<"}
   ],
   indice:"Compare d'abord la partie enti\u00e8re, puis les chiffres apr\u00e8s la virgule un par un. Un nombre n\u00e9gatif est toujours plus petit qu'un positif.",
   correction:"<span class='step'>1. 2,12 <b>&lt;</b> 2,5 (on compare les dixi\u00e8mes : 1 &lt; 5).</span>"
     +"<span class='step'>2. 5 <b>&gt;</b> 3.</span>"
     +"<span class='step'>3. 2,111 <b>&lt;</b> 2,48 (dixi\u00e8mes : 1 &lt; 4 ; avoir plus de chiffres ne rend pas plus grand).</span>"
     +"<span class='step'>4. "+M+"7,7 <b>&lt;</b> 7,5 (un n\u00e9gatif est plus petit qu'un positif).</span>" },

 { code:"REL", titre:"Calculs sur les nombres relatifs",
   consigne:"Calcule (\u00e9cris le signe \u2212 si besoin).",
   items:[
     {kind:"int", lab:"("+M+"35) \u00f7 ("+M+"7) =", ans:5},
     {kind:"int", lab:"("+M+"14) \u2212 (+2) =", ans:-16},
     {kind:"int", lab:"("+M+"5) + ("+M+"7) =", ans:-12},
     {kind:"int", lab:"(+11) \u00d7 ("+M+"9) =", ans:-99}
   ],
   indice:"R\u00e8gle des signes pour \u00d7 et \u00f7 : m\u00eames signes \u2192 +, signes diff\u00e9rents \u2192 \u2212. Pour + et \u2212, tiens compte du signe de chaque nombre.",
   correction:"<span class='step'>1. ("+M+"35) \u00f7 ("+M+"7) : m\u00eames signes \u2192 positif ; 35 \u00f7 7 = 5 \u2192 <b>+5</b>.</span>"
     +"<span class='step'>2. ("+M+"14) \u2212 (+2) = "+M+"14 \u2212 2 = <b>"+M+"16</b>.</span>"
     +"<span class='step'>3. ("+M+"5) + ("+M+"7) = <b>"+M+"12</b>.</span>"
     +"<span class='step'>4. (+11) \u00d7 ("+M+"9) : signes diff\u00e9rents \u2192 n\u00e9gatif ; 11 \u00d7 9 = 99 \u2192 <b>"+M+"99</b>.</span>" },

 { code:"4C23", titre:"Somme, diff\u00e9rence, produit ou quotient de fractions",
   consigne:"Calcule. Donne le r\u00e9sultat sous forme d'une fraction.",
   items:[
     {kind:"frac", lab:"A = "+fr(8,7)+" \u00d7 "+fr(3,9)+" \u2212 "+fr(4,7)+" =", ans:{n:-4,d:21}},
     {kind:"frac", lab:"B = "+fr(2,3)+" \u00d7 "+fr(4,5)+" =", ans:{n:8,d:15}}
   ],
   indice:"Effectue le produit <i>avant</i> la soustraction (priorit\u00e9s). Pour soustraire, mets au m\u00eame d\u00e9nominateur, puis simplifie.",
   correction:"<span class='step'><b>A</b> : on calcule d'abord le produit (priorit\u00e9).</span>"
     +"<span class='step'>"+fr(8,7)+" \u00d7 "+fr(3,9)+" = "+fr(24,63)+" , puis "+fr(24,63)+" \u2212 "+fr(4,7)+" = "+fr(24,63)+" \u2212 "+fr(36,63)+"</span>"
     +"<span class='step'>= "+fr("\u221212",63)+" = <b>"+M+fr(4,21)+"</b></span>"
     +"<span class='step'><b>B</b> : "+fr(2,3)+" \u00d7 "+fr(4,5)+" = <b>"+fr(8,15)+"</b> (on multiplie num\u00e9rateurs et d\u00e9nominateurs).</span>" },

 { code:"3L11-2", titre:"R\u00e9duire une expression",
   consigne:"R\u00e9duis les expressions suivantes, si c'est possible.",
   items:[
     {kind:"poly", lab:"A = 2 \u2212 7<i>x</i> \u2212 11 + 2<i>x</i> =", ans:{a2:0,a1:-5,a0:-9}},
     {kind:"poly", lab:"B = 4<i>x</i> \u00d7 9 =", ans:{a2:0,a1:36,a0:0}},
     {kind:"poly", lab:"C = "+M+"4 \u00d7 4<i>x</i> =", ans:{a2:0,a1:-16,a0:0}},
     {kind:"poly", lab:"D = 9<i>x</i> \u2212 4 + <i>x</i> =", ans:{a2:0,a1:10,a0:-4}},
     {kind:"poly", lab:"E = "+M+"2<i>x</i> \u2212 4<i>x</i>\u00b2 =", ans:{a2:-4,a1:-2,a0:0}}
   ],
   indice:"Regroupe les termes semblables : les <i>x</i> ensemble, les nombres ensemble. Attention : <i>x</i> et <i>x</i>\u00b2 ne sont pas semblables. Pour un produit comme 4<i>x</i> \u00d7 9, multiplie les nombres.",
   correction:"<span class='step'><b>A</b> = ("+M+"7<i>x</i> + 2<i>x</i>) + (2 \u2212 11) = <b>"+M+"5<i>x</i> \u2212 9</b></span>"
     +"<span class='step'><b>B</b> = 4<i>x</i> \u00d7 9 = <b>36<i>x</i></b></span>"
     +"<span class='step'><b>C</b> = "+M+"4 \u00d7 4<i>x</i> = <b>"+M+"16<i>x</i></b></span>"
     +"<span class='step'><b>D</b> = 9<i>x</i> + <i>x</i> \u2212 4 = <b>10<i>x</i> \u2212 4</b></span>"
     +"<span class='step'><b>E</b> = <b>"+M+"2<i>x</i> \u2212 4<i>x</i>\u00b2</b> : d\u00e9j\u00e0 r\u00e9duite (<i>x</i> et <i>x</i>\u00b2 ne sont pas semblables).</span>" }
];

var TOTAL=0; EXOS.forEach(function(e){TOTAL+=e.items.length;});
var correctSet={};

/* ── rendu ── */
function render(){
  var app=$("app");
  EXOS.forEach(function(ex,ei){
    var sec=document.createElement("section"); sec.className="ex";
    var h="<div class='ex-head'><span class='ex-code'>"+ex.code+"</span><h2>"+ex.titre+"</h2></div>";
    h+="<p class='ex-consigne'>"+ex.consigne+"</p>";
    ex.items.forEach(function(it,ii){
      var id="it_"+ei+"_"+ii;
      h+="<div class='item' id="+id+" data-ei="+ei+" data-ii="+ii+">";
      h+="<span class='lab'>"+it.lab+"</span>";
      if(it.kind==="cmp"){
        h+="<span class='lab'>"+it.left+"</span>";
        h+="<span class='cmp-btns'><button data-s='&lt;'>&lt;</button><button data-s='&gt;'>&gt;</button></span>";
        h+="<span class='lab'>"+it.right+"</span>";
      }else{
        var ph = it.kind==="frac" ? "ex : 3/4" : (it.kind==="poly" ? "ex : 3x-5" : "ex : 1,2");
        h+="<input type='text' autocomplete='off' spellcheck='false' placeholder='"+ph+"'>";
      }
      h+="<span class='verdict'></span></div>";
    });
    h+="<div class='actions'>"
      +"<button class='btn check'>\u2705 V\u00e9rifier</button>"
      +"<button class='btn hint'>\uD83D\uDCA1 Indice</button>"
      +"<button class='btn sol'>\uD83D\uDD0E Voir la correction</button>"
      +"<button class='btn reset'>\u21bb Recommencer</button></div>";
    h+="<div class='box hintbox'>\uD83D\uDCA1 "+ex.indice+"</div>";
    h+="<div class='box solbox'>"+ex.correction+"</div>";
    sec.innerHTML=h;
    app.appendChild(sec);

    /* boutons de comparaison */
    sec.querySelectorAll(".cmp-btns").forEach(function(grp){
      grp.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click",function(){
          grp.querySelectorAll("button").forEach(function(x){x.classList.remove("sel");});
          b.classList.add("sel"); grp.dataset.val=b.getAttribute("data-s");
        });
      });
    });
    sec.querySelector(".check").addEventListener("click",function(){checkSection(sec,ex,ei);});
    sec.querySelector(".hint").addEventListener("click",function(){sec.querySelector(".hintbox").classList.toggle("show");});
    sec.querySelector(".sol").addEventListener("click",function(){sec.querySelector(".solbox").classList.toggle("show");});
    sec.querySelector(".reset").addEventListener("click",function(){resetSection(sec,ei);});
  });
}

function setVerdict(item,state,msg){
  var v=item.querySelector(".verdict");
  item.classList.remove("ok","ko"); v.classList.remove("ok","ko","info");
  if(state==="ok"){item.classList.add("ok");v.classList.add("ok");v.textContent="\u2713 Juste";}
  else if(state==="ko"){item.classList.add("ko");v.classList.add("ko");v.textContent="\u2717 "+(msg||"\u00c0 revoir");}
  else{v.classList.add("info");v.textContent=msg||"";}
}

function checkSection(sec,ex,ei){
  ex.items.forEach(function(it,ii){
    var item=sec.querySelector("#it_"+ei+"_"+ii), key=ei+"_"+ii, ok=false;
    if(it.kind==="cmp"){
      var grp=item.querySelector(".cmp-btns"), sel=grp.dataset.val;
      if(!sel){ setVerdict(item,"info","choisis < ou >"); return; }
      ok=(sel===it.ans);
      setVerdict(item, ok?"ok":"ko");
    }else{
      var raw=item.querySelector("input").value;
      if(it.kind==="dec"){
        var d=parseDecimal(raw);
        if(d==="FRACTION"){ setVerdict(item,"info","donne un d\u00e9cimal"); return; }
        if(d===null){ setVerdict(item,"info","\u00e9cris un nombre"); return; }
        ok=Math.abs(d-it.ansNum)<1e-9; setVerdict(item, ok?"ok":"ko");
      }else if(it.kind==="int"){
        var n=parseEntier(raw);
        if(n===null){ setVerdict(item,"info","\u00e9cris un entier"); return; }
        ok=(n===it.ans); setVerdict(item, ok?"ok":"ko");
      }else if(it.kind==="frac"){
        var f=parseFractionStrict(raw);
        if(f==="DECIMAL"){ setVerdict(item,"info","donne une fraction"); return; }
        if(f===null){ setVerdict(item,"info","ex : 3/4"); return; }
        ok=sameFrac(f,it.ans); setVerdict(item, ok?"ok":"ko");
      }else{ /* poly */
        var p=polyParse(raw);
        if(p===null){ setVerdict(item,"info","ex : 3x-5"); return; }
        ok=(p.a2===it.ans.a2&&p.a1===it.ans.a1&&p.a0===it.ans.a0&&p.n2<=1&&p.n1<=1&&p.n0<=1);
        setVerdict(item, ok?"ok":(p.a2===it.ans.a2&&p.a1===it.ans.a1&&p.a0===it.ans.a0?"ko":"ko"), ok?"":"pense \u00e0 r\u00e9duire");
      }
    }
    if(ok) correctSet[key]=true; else delete correctSet[key];
  });
  updateScore();
}

function resetSection(sec,ei){
  sec.querySelectorAll(".item").forEach(function(item,ii){
    item.classList.remove("ok","ko");
    var v=item.querySelector(".verdict"); v.className="verdict"; v.textContent="";
    var inp=item.querySelector("input"); if(inp) inp.value="";
    var grp=item.querySelector(".cmp-btns"); if(grp){ delete grp.dataset.val; grp.querySelectorAll("button").forEach(function(b){b.classList.remove("sel");}); }
    delete correctSet[ei+"_"+ii];
  });
  sec.querySelector(".hintbox").classList.remove("show");
  sec.querySelector(".solbox").classList.remove("show");
  updateScore();
}

function updateScore(){
  var c=0; for(var k in correctSet){ if(correctSet[k]) c++; }
  $("scoreChip").textContent="R\u00e9ussites : "+c+" / "+TOTAL;
}

/* expose pour tests */
window.__polyParse=polyParse; window.__parseFractionStrict=parseFractionStrict; window.__parseEntier=parseEntier; window.__parseDecimal=parseDecimal; window.__sameFrac=sameFrac; window.__makeFrac=makeFrac;
document.addEventListener("DOMContentLoaded",render);
</script>
