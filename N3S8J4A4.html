<script>
/* ══════════════════════════════════════════════
   SON — Web Audio API uniquement
══════════════════════════════════════════════ */
var actx=null;
function getCtx(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==='suspended') actx.resume(); return actx; }
function beep(freq,dur,type,vol,delay){
  try{
    var ctx=getCtx(); var t0=ctx.currentTime+(delay||0);
    var osc=ctx.createOscillator(); var gain=ctx.createGain();
    osc.type=type||'sine'; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(vol||.18,t0+.02);
    gain.gain.exponentialRampToValueAtTime(.001,t0+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+.02);
  }catch(e){}
}
function soundOk(){ beep(784,.14,'sine',.16,0); beep(1046,.18,'sine',.16,.1); }
function soundKo(){ beep(220,.22,'square',.12,0); }
function soundLevelDone(){ beep(523,.14,'sine',.15,0); beep(659,.14,'sine',.15,.13); beep(784,.22,'sine',.15,.26); }

/* ══════════════════════════════════════════════
   OUTILS DE VÉRIFICATION DE RÉPONSES
══════════════════════════════════════════════ */
function normTxt(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/^(le |la |l'|les )/,'')
    .replace(/\s+/g,' ').trim();
}
function numsFrom(s){
  var m=(s||'').match(/\d+/g);
  return m ? m.map(function(x){return parseInt(x,10);}) : [];
}
function sameMultiset(a,b){
  if(a.length!==b.length) return false;
  var as=a.slice().sort(function(x,y){return x-y;});
  var bs=b.slice().sort(function(x,y){return x-y;});
  for(var i=0;i<as.length;i++){ if(as[i]!==bs[i]) return false; }
  return true;
}
function sameSet(a,b){
  var au=Array.from(new Set(a)).sort(function(x,y){return x-y;});
  var bu=Array.from(new Set(b)).sort(function(x,y){return x-y;});
  return sameMultiset(au,bu);
}

/* Types de champ :
   num      -> {type:'num', ans:Number, tol:Number}
   text     -> {type:'text', accept:[...normalisés]}
   multiset -> {type:'multiset', ans:[nombres]}   (ordre libre, mêmes valeurs)
   setof    -> {type:'setof', ans:[nombres]}      (ensemble, doublons ignorés)
*/
function fieldOk(field, raw){
  if(field.type==='num'){
    var v=parseFloat((raw||'').toString().replace(',','.'));
    if(isNaN(v)) return false;
    return Math.abs(v-field.ans) <= (field.tol||0.001);
  }
  if(field.type==='text'){
    var n=normTxt(raw);
    return field.accept.indexOf(n)!==-1;
  }
  if(field.type==='multiset'){
    return sameMultiset(numsFrom(raw), field.ans);
  }
  if(field.type==='setof'){
    return sameSet(numsFrom(raw), field.ans);
  }
  return false;
}

    fieldLabel:'R\u00e9ponse',
    field:{type:'text', accept:d.accept},
    hint:'Rep\u00e8re le nombre qui multiplie (le diviseur), celui qui reste (le reste) et celui qui est partag\u00e9 (le dividende).',
    correction:d.expr+'. Le nombre '+d.cible+' est le <strong>'+d.accept[0]+'</strong>.'
  });
});



/* ══════════════════════════════════════════════
   MOTEUR DE JEU — Niveau fixe pour ce fichier
══════════════════════════════════════════════ */
var $=function(id){return document.getElementById(id);};
var state={level:2, idx:0, attempts:0, locked:false, ok:0, err:0, selQcm:null};

function startLevel(level){
  state.level=level; state.idx=0; state.ok=0; state.err=0;
  $('results').classList.remove('show');
  $('stats-card').classList.add('show');
  $('ex-card').classList.add('show');
  loadStep();
}
function replayLevel(){ startLevel(state.level); }

function updateStats(){
  var total=STEPS[state.level].length;
  var done=state.idx;
  $('st-ok').textContent=state.ok;
  $('st-err').textContent=state.err;
  $('st-rem').textContent=total-done;
  $('pfill').style.width=Math.round(done/total*100)+'%';
  $('prog-text').textContent='Niveau '+state.level+' \u00b7 Question '+Math.min(done+1,total)+' / '+total;
}

function loadStep(){
  state.attempts=0; state.locked=false; state.selQcm=null;
  var step=STEPS[state.level][state.idx];
  updateStats();
  $('q-num').textContent='Question '+(state.idx+1)+' / '+STEPS[state.level].length;
  $('q-theme').textContent=step.theme;
  if(step.context){ $('q-context').style.display='block'; $('q-context').innerHTML=step.context; }
  else { $('q-context').style.display='none'; }
  $('q-consigne').innerHTML=step.consigne;

  var fh='';
  if(step.kind==='text'){
    fh='<div class="field-row"><span class="field-label">'+step.fieldLabel+'</span>'
      +'<input class="ai" type="text" id="f0" autocomplete="off"/></div>';
  } else if(step.kind==='multi'){
    step.fields.forEach(function(f,i){
      fh+='<div class="field-row"><span class="field-label">'+f.label+'</span>'
        +'<input class="ai" type="text" id="f'+i+'" autocomplete="off"/></div>';
    });
  } else if(step.kind==='qcm'){
    fh='<div class="qcm-row" id="qcm-row">';
    step.choices.forEach(function(c,i){
      fh+='<div class="qcm-choice" data-i="'+i+'" onclick="selectQcm('+i+')"><div class="qcm-radio"></div><span>'+c+'</span></div>';
    });
    fh+='</div>';
  }
  $('q-fields').innerHTML=fh;

  $('hint-box').className='hint-box';
  $('feedback').className='feedback';
  $('btn-check').disabled=false;
  $('btn-check').textContent='\u2713 V\u00e9rifier';
  $('btn-hint').disabled=false;
}

function selectQcm(i){
  if(state.locked) return;
  state.selQcm=i;
  var row=$('qcm-row');
  Array.prototype.forEach.call(row.children,function(c,k){ c.classList.toggle('selected', k===i); });
}

function toggleHint(){
  var step=STEPS[state.level][state.idx];
  var h=$('hint-box');
  if(h.classList.contains('show')){ h.classList.remove('show'); }
  else { h.innerHTML='<strong>\uD83D\uDCA1 Indice\u00a0:</strong> '+step.hint; h.classList.add('show'); }
}

function checkStep(){
  if(state.locked) return;
  var step=STEPS[state.level][state.idx];
  var allOk=true;

  if(step.kind==='qcm'){
    if(state.selQcm===null || state.selQcm===undefined) return;
    allOk = (state.selQcm===step.correctIndex);
  } else if(step.kind==='text'){
    var v=$('f0').value;
    if(!v.trim()) { $('f0').focus(); return; }
    allOk = fieldOk(step.field, v);
  } else {
    var vals=[];
    for(var i=0;i<step.fields.length;i++){
      var el=$('f'+i);
      if(!el.value.trim()){ el.focus(); return; }
      vals.push(el.value);
    }
    step.fields.forEach(function(f,i){ if(!fieldOk(f.field, vals[i])) allOk=false; });
  }

  if(allOk){
    state.attempts=0; state.locked=true; state.ok++;
    markFieldsColor(step,true);
    soundOk();
    showFb('ok','\u2705','Bravo\u00a0! Bonne r\u00e9ponse.', step.correction);
    $('btn-check').disabled=true; $('btn-hint').disabled=true;
    updateStats();
    setTimeout(nextStep,1500);
  } else {
    state.attempts++;
    if(state.attempts===1){
      markFieldsColor(step,false);
      soundKo();
      showFb('ko','\u274c','Pas tout \u00e0 fait\u2026 r\u00e9essaie\u00a0!', null);
      if(!$('hint-box').classList.contains('show')) toggleHint();
    } else {
      state.locked=true; state.err++;
      markFieldsColor(step,false,true);
      soundKo();
      showFb('ko','\u274c','La correction :', step.correction);
      $('btn-check').disabled=true; $('btn-hint').disabled=true;
      updateStats();
      setTimeout(nextStep,2500);
    }
  }
}

function markFieldsColor(step, ok, disable){
  if(step.kind==='qcm'){
    var row=$('qcm-row');
    Array.prototype.forEach.call(row.children,function(c,k){
      if(disable){ c.classList.add('locked'); }
      if(ok){
        if(k===state.selQcm) c.classList.add('correct-c');
      } else {
        if(k===state.selQcm) c.classList.add('wrong-c');
        if(disable && k===step.correctIndex) c.classList.add('correct-c');
      }
    });
  } else {
    var n = step.kind==='text' ? 1 : step.fields.length;
    for(var i=0;i<n;i++){
      var el=$('f'+i);
      var fspec = step.kind==='text' ? step.field : step.fields[i].field;
      var indivOk = fieldOk(fspec, el.value);
      el.className = 'ai ' + (indivOk ? 'ok' : 'ko');
      if(disable){
        el.disabled=true;
        if(!indivOk){
          if(fspec.type==='num') el.value=fspec.ans;
          else if(fspec.type==='multiset'||fspec.type==='setof') el.value=fspec.ans.join(' \u00d7 ');
          else if(fspec.type==='text') el.value=fspec.display || fspec.accept[0];
          el.className='ai ok';
        }
      }
    }
  }
}

function showFb(type,icon,msg,detail){
  var fb=$('feedback');
  fb.className='feedback show '+type;
  $('fb-icon').textContent=icon;
  $('fb-msg').textContent=msg;
  $('fb-detail').innerHTML = detail || '';
}

function nextStep(){
  state.idx++;
  if(state.idx>=STEPS[state.level].length){
    $('ex-card').classList.remove('show');
    $('stats-card').classList.remove('show');
    var total=STEPS[state.level].length;
    $('res-score').textContent=state.ok+' / '+total+' r\u00e9ussies du premier coup';
    var msg = state.err===0 ? 'Parfait, aucune erreur\u00a0! Tu ma\u00eetrises bien la divisibilit\u00e9.'
      : (state.err<=2 ? 'Tr\u00e8s bien, continue \u00e0 t\u2019entra\u00eener sur ces notions.'
      : 'Relis attentivement les corrections pour consolider tes acquis.');
    $('res-msg').textContent=msg;
    $('results').classList.add('show');
    soundLevelDone();
  } else {
    loadStep();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

startLevel(2);

</script>
