<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résoudre les exercices — Calcul littéral et nombres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Charte du jour : J3 VERT ===== */
  :root{
    --j3:        #8dc63f;
    --j3-dark:   #3d7a10;
    --j3-soft:   #f0faeb;
    --j3-accent: #b5e08a;
    --ink:       #243018;
    --ink-soft:  #586b45;
    --ok:        #3d8b40;
    --ok-soft:   #eaf6ea;
    --err:       #c0392b;
    --err-soft:  #fdecea;
    --line:      #dcebcf;
    --white:     #ffffff;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; overflow-x:hidden; }
  body{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    color:var(--ink); background:var(--white); line-height:1.55;
    -webkit-font-smoothing:antialiased; position:relative; min-height:100vh;
  }

  /* ===== Fond : 3 grandes formes organiques (blobs) ===== */
  .blob{ position:fixed; z-index:0; background:var(--j3-accent); opacity:0.28; filter:blur(1px); pointer-events:none; }
  .blob-1{ top:-160px; right:-150px; width:460px; height:430px; border-radius:62% 38% 46% 54% / 58% 47% 53% 42%; }
  .blob-2{ top:42%; left:-190px; width:430px; height:470px; border-radius:44% 56% 63% 37% / 49% 38% 62% 51%; opacity:0.26; }
  .blob-3{ bottom:-180px; left:14%; width:500px; height:420px; border-radius:55% 45% 38% 62% / 42% 60% 40% 58%; opacity:0.27; }

  .wrap{ position:relative; z-index:1; max-width:860px; margin:0 auto; padding:26px 18px 60px; }

  /* ===== Hero ===== */
  .hero{ text-align:center; padding:14px 6px 22px; }
  .pill{ display:inline-block; background:var(--j3-soft); border:2px solid var(--j3-accent); color:var(--j3-dark);
    font-weight:700; font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase; padding:7px 16px; border-radius:999px; margin-bottom:16px; }
  .hero h1{ font-size:2.05rem; font-weight:800; color:var(--j3-dark); line-height:1.15; margin-bottom:10px; }
  .hero p.sub{ font-size:1.02rem; color:var(--ink-soft); max-width:580px; margin:0 auto; font-weight:500; }
  .hero .consigne{ display:inline-block; margin-top:14px; background:var(--white); border:2px dashed var(--j3-accent);
    border-radius:12px; padding:8px 16px; font-weight:600; color:var(--j3-dark); font-size:0.92rem; }

  /* ===== Scoreboard sticky ===== */
  .scoreboard{ position:sticky; top:10px; z-index:20; background:var(--white); border:2px solid var(--line); border-radius:16px;
    box-shadow:0 6px 20px rgba(61,122,16,0.10); padding:14px 16px; margin:10px 0 26px; }
  .score-stats{ display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:stretch; }
  .stat{ flex:1 1 90px; background:var(--j3-soft); border-radius:12px; padding:8px 6px; text-align:center; border:1.5px solid var(--j3-accent); }
  .stat .num{ font-size:1.5rem; font-weight:800; color:var(--j3-dark); line-height:1.1; }
  .stat .lbl{ font-size:0.72rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .stat.err   { background:var(--err-soft); border-color:#f3c6c0; }
  .stat.err .num{ color:var(--err); }
  .stat.done  { background:var(--ok-soft); border-color:#bfe0c0; }
  .stat.done .num{ color:var(--ok); }

  .xp-row{ margin-top:12px; }
  .xp-top{ display:flex; justify-content:space-between; font-size:0.8rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .xp-track{ height:16px; background:var(--j3-soft); border-radius:999px; overflow:hidden; border:1.5px solid var(--j3-accent); }
  .xp-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--j3), var(--j3-dark)); border-radius:999px; transition:width 0.5s cubic-bezier(.2,.8,.2,1); }

  /* ===== Cartes exercices ===== */
  .card{ background:var(--white); border:2px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:22px;
    box-shadow:0 4px 14px rgba(36,48,24,0.05); transition:border-color 0.3s, box-shadow 0.3s; }
  .card.is-correct{ border-color:#bfe0c0; box-shadow:0 6px 18px rgba(61,139,64,0.12); }
  .card.is-error{ border-color:#f3c6c0; }
  .card-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .badge-num{ flex:0 0 auto; width:42px; height:42px; background:var(--j3); color:var(--white); border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.25rem; }
  .card.is-correct .badge-num{ background:var(--ok); }
  .card-head .ctitle{ font-weight:700; font-size:1.02rem; color:var(--j3-dark); }
  .card.is-correct .ctitle{ color:var(--ok); }
  .check-mark{ margin-left:auto; font-size:1.5rem; color:var(--ok); opacity:0; transition:opacity 0.3s; }
  .card.is-correct .check-mark{ opacity:1; }

  .question{ font-size:1rem; margin-bottom:14px; color:var(--ink); }
  .question b{ color:var(--j3-dark); }

  /* ===== Bloc maths (expression encadrée) ===== */
  .math-box{ background:var(--j3-soft); border:1.5px solid var(--j3-accent); border-radius:14px; padding:18px 14px;
    margin:0 auto 16px; text-align:center; font-size:1.55rem; font-weight:800; color:var(--j3-dark); letter-spacing:0.02em; }
  .math-box .var{ font-style:italic; }

  /* ===== Tableau divisibilité ===== */
  .divtable{ width:100%; border-collapse:collapse; margin:0 auto 14px; font-size:1rem; }
  .divtable th, .divtable td{ border:1.5px solid var(--j3-accent); padding:10px 6px; text-align:center; }
  .divtable th{ background:var(--j3-soft); color:var(--j3-dark); font-weight:700; }
  .divtable td.numcell{ font-weight:800; font-size:1.15rem; color:var(--ink); background:var(--white); }
  .divcheck{ display:inline-flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .div-btn{ font-family:inherit; font-weight:700; font-size:1.05rem; min-width:46px; padding:8px 10px;
    border:2px solid var(--j3-accent); border-radius:10px; background:var(--white); color:var(--j3-dark); cursor:pointer; transition:0.15s; }
  .div-btn:hover{ background:var(--j3-soft); }
  .div-btn.sel-yes{ background:var(--j3); color:var(--white); border-color:var(--j3-dark); }
  .div-btn.sel-no{ background:#e9eef0; color:#6b6b6b; border-color:#c8d0d4; text-decoration:line-through; }

  /* ===== Saisie ===== */
  .answer-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .num-input{ font-family:inherit; font-size:1.2rem; font-weight:700; width:130px; padding:12px 14px;
    border:2.5px solid var(--j3-accent); border-radius:12px; color:var(--ink); text-align:center; background:var(--white); }
  .num-input.wide{ width:200px; text-align:left; }
  .num-input:focus{ outline:none; border-color:var(--j3); box-shadow:0 0 0 4px rgba(141,198,63,0.22); }
  .unit-tag{ font-weight:700; color:var(--ink-soft); font-size:1.05rem; }

  /* ===== QCM ===== */
  .qcm{ display:flex; gap:10px; flex-wrap:wrap; }
  .qcm-btn{ font-family:inherit; flex:1 1 120px; font-size:1.05rem; font-weight:700; padding:15px 12px;
    border:2.5px solid var(--j3-accent); border-radius:14px; background:var(--white); color:var(--j3-dark); cursor:pointer; transition:0.15s; }
  .qcm-btn:hover{ background:var(--j3-soft); }
  .qcm-btn:active{ transform:scale(0.97); }
  .qcm-btn.picked{ background:var(--j3); color:var(--white); border-color:var(--j3-dark); }

  /* ===== Boutons ===== */
  .btn{ font-family:inherit; font-weight:700; font-size:1.02rem; padding:13px 22px; border:none; border-radius:12px; cursor:pointer; transition:0.12s; }
  .btn:active{ transform:scale(0.97); }
  .btn-check{ background:var(--j3); color:var(--white); box-shadow:0 4px 0 var(--j3-dark); }
  .btn-check:hover{ background:#7eb635; box-shadow:0 4px 0 #336609; }
  .btn-retry{ background:var(--err-soft); color:var(--err); border:2px solid #f3c6c0; }
  .btn-retry:hover{ background:#fbe0db; }
  .btn-big{ display:block; width:100%; max-width:340px; margin:18px auto 0; background:var(--j3-dark); color:var(--white);
    font-size:1.12rem; padding:16px; box-shadow:0 5px 0 #2c5a09; }
  .btn-big:hover{ background:#326409; }

  /* ===== Feedback ===== */
  .feedback{ margin-top:14px; font-weight:600; display:none; }
  .feedback.show{ display:block; }
  .feedback.ok{ color:var(--ok); }
  .feedback.bad{ color:var(--err); }
  .solution{ margin-top:12px; background:var(--ok-soft); border:1.5px solid #bfe0c0; border-radius:12px; padding:12px 14px; font-size:0.95rem; color:#1f5b22; display:none; }
  .solution.show{ display:block; }
  .solution b{ color:var(--ok); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .locked{ opacity:0.65; pointer-events:none; }
  .hint{ font-size:0.86rem; color:var(--ink-soft); margin-top:6px; font-style:italic; }

  /* ===== Écran résultats ===== */
  .results{ display:none; text-align:center; background:var(--white); border:2.5px solid var(--j3-accent); border-radius:20px;
    padding:34px 22px; margin-bottom:24px; box-shadow:0 10px 30px rgba(61,122,16,0.16); }
  .results.show{ display:block; animation:pop 0.5s ease; }
  @keyframes pop{ from{ transform:scale(0.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .results .trophy{ font-size:3.4rem; line-height:1; }
  .results h2{ color:var(--j3-dark); font-size:1.6rem; margin:10px 0 4px; }
  .results .rscore{ font-size:1.1rem; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .stars{ font-size:2rem; letter-spacing:6px; margin:6px 0 12px; }
  .star-on{ color:var(--j3); }
  .star-off{ color:var(--line); }
  .results .rmsg{ color:var(--ink-soft); font-weight:500; max-width:440px; margin:0 auto 6px; }

  @media (max-width:430px){
    .hero h1{ font-size:1.62rem; }
    .stat .num{ font-size:1.25rem; }
    .stat .lbl{ font-size:0.64rem; }
    .num-input{ width:110px; }
    .num-input.wide{ width:100%; }
    .wrap{ padding:20px 12px 50px; }
    .math-box{ font-size:1.3rem; }
    .divtable{ font-size:0.9rem; }
    .div-btn{ min-width:40px; padding:7px 8px; font-size:0.98rem; }
  }
</style>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="wrap">
    <header class="hero">
      <span class="pill">Semaine 4 · Jour 3</span>
      <h1>&#9999;&#65039; Résoudre les exercices</h1>
      <p class="sub">Calcul littéral et nombres : carrés parfaits, critères de divisibilité, développer et factoriser.</p>
      <div class="consigne">&#129504; Résous <u>mentalement</u> et <u>sans calculatrice</u>.</div>
    </header>

    <section class="scoreboard" aria-label="Tableau de score">
      <div class="score-stats">
        <div class="stat done"><div class="num" id="s-ok">0</div><div class="lbl">Réussies</div></div>
        <div class="stat"><div class="num" id="s-left">4</div><div class="lbl">Restantes</div></div>
        <div class="stat err"><div class="num" id="s-err">0</div><div class="lbl">Erreurs</div></div>
      </div>
      <div class="xp-row">
        <div class="xp-top"><span>Progression</span><span id="xp-text">0 / 4</span></div>
        <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
      </div>
    </section>

    <div id="results" class="results">
      <div class="trophy">&#127942;</div>
      <h2>Tous les exercices terminés&nbsp;!</h2>
      <div class="rscore" id="r-score"></div>
      <div class="stars" id="r-stars"></div>
      <p class="rmsg" id="r-msg"></p>
      <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer</button>
    </div>

    <main id="exoList"></main>

    <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer tous les exercices</button>
  </div>

<script>
/* ============================================================
   PAZAPA — N3S4J3 — Calcul littéral et nombres
   ============================================================ */
const TOTAL = 4;
const rint = n => Math.floor(Math.random()*n);
const pick = a => a[rint(a.length)];
const coin = () => Math.random() < 0.5;
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; }

let exos = [];
let state = [];

/* ---------- Parsers d'expressions littéraires ---------- */
/* Linéaire : "6x+8", "8+6x", "6*x + 8", "x+5", "-3x+2" -> {a,b} ou null */
function parseLinear(str){
  if(str==null) return null;
  let s = String(str).toLowerCase().replace(/\s+/g,'').replace(/\*/g,'').replace(/×/g,'');
  if(s==='') return null;
  s = s.replace(/-/g,'+-');
  if(s[0]==='+') s = s.slice(1);
  const terms = s.split('+').filter(t=>t!=='');
  let a=0, b=0;
  for(let t of terms){
    if(t.includes('x')){
      let coef = t.replace('x','');
      if(coef==='') coef='1';
      if(coef==='-') coef='-1';
      if(!/^-?\d+$/.test(coef)) return null;
      a += parseInt(coef,10);
    } else {
      if(!/^-?\d+$/.test(t)) return null;
      b += parseInt(t,10);
    }
  }
  return {a,b};
}
/* Produit : "g(px+q)" -> {g,a,b} ou null */
function parseProduct(str){
  if(str==null) return null;
  let s = String(str).toLowerCase().replace(/\s+/g,'').replace(/\*/g,'').replace(/×/g,'');
  let m = s.match(/^(-?\d+)\((.+)\)$/);
  if(!m) return null;
  const g = parseInt(m[1],10);
  const inner = parseLinear(m[2]);
  if(inner===null) return null;
  return {g, a:inner.a, b:inner.b};
}
/* Affichage propre d'une expression linéaire ax+b */
function fmtLin(a,b){
  let xs;
  if(a===1) xs='x'; else if(a===-1) xs='-x'; else xs=a+'x';
  if(b===0) return xs;
  if(b>0) return xs+' + '+b;
  return xs+' − '+Math.abs(b);
}

/* ============================================================
   Générateurs
   ============================================================ */

/* Ex1 : carrés parfaits (deux sens, QCM ou saisie) */
function genCarres(){
  if(coin()){
    /* sens direct : n² = ? */
    const n = 2+rint(18);   /* 2..19 */
    return { kind:'square', type:'input', unit:'', answer:n*n,
      title:'Carré parfait',
      question:`Calcule mentalement le carré du nombre <b>${n}</b>, c\u2019est-à-dire <b>${n}²</b>.`,
      mathHtml:`${n}<sup>2</sup> = ?`,
      solution:`${n}² = ${n} × ${n} = <b>${n*n}</b>.` };
  } else {
    /* sens inverse : racine d'un carré parfait */
    const n = 2+rint(18);
    const s = n*n;
    return { kind:'sqrt', type:'input', unit:'', answer:n,
      title:'Racine d\u2019un carré parfait',
      question:`<b>${s}</b> est un carré parfait. Quel est le nombre qui, multiplié par lui-même, donne <b>${s}</b>&nbsp;? (c\u2019est √${s})`,
      mathHtml:`&#8730;${s} = ?`,
      solution:`On cherche le nombre dont le carré vaut ${s}.<br>${n} × ${n} = ${s}, donc √${s} = <b>${n}</b>.` };
  }
}

/* Ex2 : critères de divisibilité (table d'un nombre, sélection des diviseurs) */
const DIVISORS = [2,3,5,9,10];
function divisible(num, d){
  if(d===2) return num%2===0;
  if(d===5) return num%5===0;
  if(d===10) return num%10===0;
  const ds = String(num).split('').reduce((a,c)=>a+(+c),0);
  if(d===3) return ds%3===0;
  if(d===9) return ds%9===0;
  return num%d===0;
}
function genDivisibilite(){
  /* nombre à 3 chiffres "intéressant" : au moins 1 diviseur vrai et 1 faux parmi la liste */
  let num, truth;
  do{
    num = 100 + rint(900);
    truth = {};
    DIVISORS.forEach(d=> truth[d]=divisible(num,d));
    var nbTrue = DIVISORS.filter(d=>truth[d]).length;
  }while(nbTrue===0 || nbTrue===DIVISORS.length);
  return { kind:'div', type:'divtable', num, truth, divisors:DIVISORS.slice(),
    title:'Critères de divisibilité',
    question:`Pour le nombre <b>${num}</b>, indique par quels nombres il est divisible. Touche un diviseur pour le marquer <b>oui</b>, touche encore pour <b>non</b>.`,
    solution: buildDivSolution(num, truth) };
}
function buildDivSolution(num, truth){
  const ds = String(num).split('').reduce((a,c)=>a+(+c),0);
  const parts = [];
  parts.push(`Chiffre des unités&nbsp;: <b>${String(num).slice(-1)}</b> · somme des chiffres&nbsp;: <b>${ds}</b>.`);
  const ouis = DIVISORS.filter(d=>truth[d]);
  const nons = DIVISORS.filter(d=>!truth[d]);
  parts.push(`${num} est divisible par&nbsp;: <b>${ouis.length?ouis.join(', '):'aucun de la liste'}</b>.`);
  if(nons.length) parts.push(`Il n\u2019est pas divisible par&nbsp;: ${nons.join(', ')}.`);
  return parts.join('<br>');
}

/* Ex3 : développer (simple distributivité) */
function genDevelopper(){
  const k = 2+rint(8);   /* 2..9 */
  const a = 2+rint(7);   /* 2..8 */
  const b = 1+rint(11);  /* 1..11 */
  const minus = coin();
  const bb = minus ? -b : b;
  const ansA = k*a, ansB = k*bb;
  const inner = fmtLin(a, bb);
  return { kind:'develop', type:'expr-lin', answerA:ansA, answerB:ansB,
    title:'Développer',
    question:`Développe et réduis cette expression. Écris ta réponse sous la forme <b>(nombre)x + (nombre)</b>.`,
    mathHtml:`${k} × ( ${inner.replace('x','<span class="var">x</span>')} )`,
    hint:'On multiplie le nombre de devant par chaque terme entre parenthèses.',
    placeholder:'ex : 6x + 8',
    solution:`${k} × (${inner}) = ${k}×${a>1?a:''}x ${bb>=0?'+':'−'} ${k}×${Math.abs(bb)}<br>= <b>${fmtLin(ansA, ansB)}</b>.` };
}

/* Ex4 : factoriser (facteur commun numérique, factorisation unique) */
function genFactoriser(){
  /* g( p x + q ) avec gcd(p,q)=1, g in 2..6 */
  let g,p,q,A,B;
  do{
    g = 2+rint(5);          /* 2..6 */
    p = 1+rint(6);          /* 1..6 */
    q = 1+rint(9);          /* 1..9 */
  }while(gcd(p,q)!==1 || g*p>36 || g*q>36);
  A = g*p; B = g*q;
  return { kind:'factor', type:'expr-prod', gAns:g, aAns:p, bAns:q, A, B,
    title:'Factoriser',
    question:`Factorise complètement cette expression (mets en facteur le plus grand nombre commun). Écris ta réponse sous la forme <b>(nombre)(... x + ...)</b>.`,
    mathHtml:`${A}<span class="var">x</span> + ${B}`,
    hint:'Cherche le plus grand nombre qui divise les deux nombres.',
    placeholder:'ex : 2(x + 3)',
    solution:`Le plus grand diviseur commun de ${A} et ${B} est <b>${g}</b>.<br>${A}x + ${B} = <b>${g}(${fmtLin(p,q)})</b>.` };
}

const GENERATORS = [genCarres, genDivisibilite, genDevelopper, genFactoriser];

/* ============================================================
   Rendu
   ============================================================ */
function generateAll(){
  exos = GENERATORS.map(g => g());
  state = exos.map(()=>({correct:false, errors:0, divsel:{}}));
  document.getElementById('results').classList.remove('show');
  const root = document.getElementById('exoList');
  root.innerHTML = '';
  exos.forEach((ex, i) => root.appendChild(buildCard(ex, i)));
  updateScore();
  window.__exos = exos;
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildCard(ex, i){
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-'+i;

  let body = '';
  if(ex.type === 'input'){
    body = `
      <div class="math-box">${ex.mathHtml}</div>
      <div class="answer-row">
        <input class="num-input" id="in-${i}" type="number" inputmode="numeric" placeholder="?" aria-label="ta réponse">
        ${ex.unit ? `<span class="unit-tag">${ex.unit}</span>` : ''}
      </div>
      ${ex.hint ? `<div class="hint">&#128161; ${ex.hint}</div>` : ''}
      <div class="actions" id="act-${i}"><button class="btn btn-check" id="chk-${i}">Vérifier</button></div>`;
  } else if(ex.type === 'expr-lin' || ex.type === 'expr-prod'){
    body = `
      <div class="math-box">${ex.mathHtml}</div>
      <div class="answer-row">
        <input class="num-input wide" id="in-${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ex.placeholder}" aria-label="ta réponse">
      </div>
      ${ex.hint ? `<div class="hint">&#128161; ${ex.hint}</div>` : ''}
      <div class="actions" id="act-${i}"><button class="btn btn-check" id="chk-${i}">Vérifier</button></div>`;
  } else if(ex.type === 'divtable'){
    const rows = ex.divisors.map(d=>`
      <tr>
        <td class="numcell">${d}</td>
        <td><button class="div-btn" data-i="${i}" data-d="${d}" aria-label="diviseur ${d}">?</button></td>
      </tr>`).join('');
    body = `
      <table class="divtable">
        <thead><tr><th>Diviseur</th><th>${ex.num} est-il divisible&nbsp;?</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="actions" id="act-${i}"><button class="btn btn-check" id="chk-${i}">Vérifier</button></div>`;
  }

  card.innerHTML = `
    <div class="card-head">
      <div class="badge-num">${i+1}</div>
      <div class="ctitle">${ex.title}</div>
      <div class="check-mark">&#10004;</div>
    </div>
    <p class="question">${ex.question}</p>
    ${body}
    <div class="feedback" id="fb-${i}"></div>
    <div class="solution" id="sol-${i}">${ex.solution}</div>`;

  setTimeout(()=>{
    const chk = card.querySelector('#chk-'+i);
    if(ex.type==='divtable'){
      chk.addEventListener('click', ()=>checkDiv(i));
      card.querySelectorAll('.div-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>cycleDiv(i, +btn.dataset.d, btn));
      });
    } else {
      chk.addEventListener('click', ()=>checkAnswer(i));
      const inp = card.querySelector('#in-'+i);
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(i); });
    }
  },0);

  return card;
}

/* cycle ? -> oui -> non -> ? */
function cycleDiv(i, d, btn){
  if(state[i].correct) return;
  const cur = state[i].divsel[d] || 'unset';
  let next;
  if(cur==='unset') next='yes';
  else if(cur==='yes') next='no';
  else next='unset';
  state[i].divsel[d]=next;
  btn.classList.toggle('sel-yes', next==='yes');
  btn.classList.toggle('sel-no', next==='no');
  btn.textContent = next==='yes' ? 'oui' : (next==='no' ? 'non' : '?');
}

function checkDiv(i){
  if(state[i].correct) return;
  const ex = exos[i];
  const fb = document.getElementById('fb-'+i);
  /* toutes les lignes doivent être renseignées */
  for(const d of ex.divisors){
    if(!state[i].divsel[d] || state[i].divsel[d]==='unset'){
      flash(fb,'bad','Réponds pour chaque diviseur (oui ou non).');
      return;
    }
  }
  let allGood = true;
  for(const d of ex.divisors){
    const want = ex.truth[d] ? 'yes' : 'no';
    if(state[i].divsel[d] !== want){ allGood=false; break; }
  }
  if(allGood) markCorrect(i); else markError(i);
}

function checkAnswer(i){
  if(state[i].correct) return;
  const ex = exos[i];
  const inp = document.getElementById('in-'+i);
  const raw = inp.value.trim();
  const fb = document.getElementById('fb-'+i);
  if(raw===''){ flash(fb,'bad','Écris d\u2019abord ta réponse.'); return; }

  if(ex.type==='input'){
    const val = Number(raw.replace(',','.'));
    if(Number.isNaN(val)){ flash(fb,'bad','Écris un nombre.'); return; }
    if(Math.abs(val-ex.answer)<1e-9) markCorrect(i); else markError(i);
  }
  else if(ex.type==='expr-lin'){
    const p = parseLinear(raw);
    if(p===null){ flash(fb,'bad','Écris ta réponse sous la forme  ax + b  (par exemple 6x + 8).'); return; }
    if(p.a===ex.answerA && p.b===ex.answerB) markCorrect(i); else markError(i);
  }
  else if(ex.type==='expr-prod'){
    const pr = parseProduct(raw);
    if(pr===null){ flash(fb,'bad','Écris ta réponse sous la forme  nombre(...x + ...)  (par exemple 2(x + 3)).'); return; }
    /* vérifie que c'est bien la factorisation : développé identique ET facteur = pgcd (factorisation complète) */
    const devA = pr.g*pr.a, devB = pr.g*pr.b;
    if(devA===ex.A && devB===ex.B){
      if(Math.abs(pr.g)===ex.gAns){ markCorrect(i); }
      else { flash(document.getElementById('fb-'+i),'bad','C\u2019est presque ça&nbsp;! Mets en facteur le PLUS GRAND nombre commun, puis réessaie.'); registerErrorOnly(i); }
    } else {
      markError(i);
    }
  }
}

function markError(i){
  state[i].errors++;
  const card = document.getElementById('card-'+i);
  card.classList.add('is-error');
  flash(document.getElementById('fb-'+i),'bad','Pas encore… reprends ton calcul de tête, puis réessaie.');
  addRetry(i);
  updateScore();
}
/* erreur comptée + bouton réessayer, mais message déjà posé (factorisation incomplète) */
function registerErrorOnly(i){
  state[i].errors++;
  document.getElementById('card-'+i).classList.add('is-error');
  addRetry(i);
  updateScore();
}
function addRetry(i){
  const act = document.getElementById('act-'+i);
  if(!act.querySelector('.btn-retry')){
    const r = document.createElement('button');
    r.className='btn btn-retry'; r.innerHTML='&#8635; Réessayer';
    r.addEventListener('click', ()=>retry(i));
    act.appendChild(r);
  }
}

function retry(i){
  const ex = exos[i];
  const card = document.getElementById('card-'+i);
  card.classList.remove('is-error');
  document.getElementById('fb-'+i).classList.remove('show');
  if(ex.type==='divtable'){
    state[i].divsel={};
    card.querySelectorAll('.div-btn').forEach(b=>{ b.classList.remove('sel-yes','sel-no'); b.textContent='?'; });
  } else {
    const inp=document.getElementById('in-'+i); inp.value=''; inp.focus();
  }
  const r=document.getElementById('act-'+i).querySelector('.btn-retry');
  if(r) r.remove();
}

function markCorrect(i){
  state[i].correct = true;
  const ex = exos[i];
  const card = document.getElementById('card-'+i);
  card.classList.remove('is-error');
  card.classList.add('is-correct');
  flash(document.getElementById('fb-'+i),'ok','Bravo, c\u2019est juste&nbsp;!');
  document.getElementById('sol-'+i).classList.add('show');
  const act = document.getElementById('act-'+i);
  act.classList.add('locked');
  if(ex.type==='divtable'){
    card.querySelectorAll('.div-btn').forEach(b=>b.classList.add('locked'));
  } else {
    const inp=document.getElementById('in-'+i); inp.disabled=true; inp.classList.add('locked');
  }
  updateScore();
  checkFinished();
}

function flash(el, kind, msg){ el.className='feedback show '+kind; el.innerHTML=msg; }

function updateScore(){
  const ok = state.filter(s=>s.correct).length;
  const err = state.reduce((a,s)=>a+s.errors,0);
  document.getElementById('s-ok').textContent = ok;
  document.getElementById('s-left').textContent = TOTAL-ok;
  document.getElementById('s-err').textContent = err;
  document.getElementById('xp-text').textContent = ok+' / '+TOTAL;
  document.getElementById('xp-fill').style.width = (100*ok/TOTAL)+'%';
}

function checkFinished(){
  if(state.every(s=>s.correct)){
    const err = state.reduce((a,s)=>a+s.errors,0);
    let stars=3; if(err>=1&&err<=2) stars=2; if(err>=3) stars=1;
    document.getElementById('r-score').textContent = `${TOTAL} / ${TOTAL} réussis · ${err} erreur${err>1?'s':''}`;
    let sh=''; for(let k=0;k<3;k++) sh+=`<span class="${k<stars?'star-on':'star-off'}">&#9733;</span>`;
    document.getElementById('r-stars').innerHTML = sh;
    document.getElementById('r-msg').textContent =
      'Personne ne réussit tout du premier coup — l\u2019important, c\u2019est d\u2019avoir cherché et compris. Tu peux recommencer avec de nouveaux nombres.';
    const res=document.getElementById('results'); res.classList.add('show');
    setTimeout(()=>res.scrollIntoView({behavior:'smooth', block:'center'}), 250);
  }
}

generateAll();
</script>
</body>
</html>
