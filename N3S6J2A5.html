<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Je relève le défi – 3e S6 J2 · Se repérer dans une sphère</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PAZAPA — JE RELÈVE LE DÉFI
   3e · Semaine 6 · Jour 2 (MARDI)
   Couleur du jour : #b94040 / #7a1f1f / #f7eded / #f9c0bb
   ============================================================ */
:root{
  --jour:        #b94040;
  --jour-fonce:  #7a1f1f;
  --jour-clair:  #f7eded;
  --jour-pale:   #f9c0bb;

  --bg:          #fffdf7;
  --vert:        #22c55e;
  --rouge:       #ef4444;
  --txt:         #2b2b2b;
  --gris:        #8b8b8b;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  padding: 20px 16px 50px;
}

.bulle{ position:fixed; border-radius:50%; opacity:.32; z-index:0; pointer-events:none; }
.bulle-jaune  { width:200px; height:200px; background:#ffd84d; top:-60px;   right:-50px; }
.bulle-jour   { width:240px; height:240px; background:var(--jour-pale); bottom:-80px; left:-70px; }
.bulle-verte  { width:150px; height:150px; background:#9be7a5; top:45%;     right:-70px; }

.wrap{ position:relative; z-index:1; max-width:620px; margin:0 auto; }

/* ====================== HEADER ====================== */
.header{ text-align:center; margin-bottom:22px; }

.logo-badge{
  display:inline-flex; align-items:center; gap:8px;
  background: var(--jour);
  color:#fff;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.72rem;
  letter-spacing:1.5px; padding:6px 14px; border-radius:20px;
  box-shadow:0 3px 10px rgba(185,64,64,.4);
  margin-bottom:12px;
}
.logo-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }

.semaine{
  font-family:'Orbitron',sans-serif; font-size:.78rem; letter-spacing:3px;
  color:var(--gris); text-transform:uppercase; margin-bottom:6px;
}
.titre{
  font-family:'Orbitron', sans-serif; font-weight:900;
  font-size:1.9rem; line-height:1.2; color:var(--txt); margin-bottom:6px;
}
.titre .accent{ color:var(--jour-fonce); }
.sous-titre{
  font-family:'Orbitron',sans-serif; font-size:.8rem; letter-spacing:1.2px;
  color:var(--gris); margin-bottom:16px;
}
.badge-revision{
  display:inline-block;
  background: var(--jour);
  color:#fff;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.78rem;
  letter-spacing:1px; padding:8px 20px; border-radius:24px;
  box-shadow:0 4px 14px rgba(185,64,64,.45);
}

/* ================== CARD ================== */
.card{
  background:#fff; border-radius:16px; border:2px solid #e8e2d4;
  padding:22px; margin-bottom:18px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
}
.timer-display{
  width: max-content;
  margin: 0 auto 14px;
  padding: 8px 16px;
  border-radius: 20px;
  background: var(--jour-clair);
  border: 2px solid var(--jour);
  color: var(--jour-fonce);
  font-family: 'Orbitron', sans-serif;
  font-size: .85rem;
  font-weight: 700;
}
.timer-display.alert{
  color: var(--rouge);
  border-color: var(--rouge);
  background: #fdeaea;
  animation: timerPulse .8s infinite alternate;
}
@keyframes timerPulse{
  from { transform: scale(1); }
  to { transform: scale(1.05); }
}
.q-count{
  text-align:center; font-family:'Orbitron',sans-serif; font-size:.78rem;
  font-weight:700; letter-spacing:2px; color:var(--jour-fonce); margin-bottom:14px;
}

/* ================== GLOBE ================== */
.globe-wrap{ text-align:center; margin-bottom:16px; }
.globe-wrap svg{ max-width:280px; width:100%; height:auto; }

.coord-display{
  text-align:center; font-family:'Orbitron',sans-serif; font-size:1.1rem;
  font-weight:700; color:var(--jour-fonce); margin-bottom:14px;
}
.question-txt{
  text-align:center; font-size:1rem; font-weight:700; margin-bottom:18px; color:var(--txt);
}

/* ================== SÉLECTEUR À MOLETTE ================== */
.wheel-row{ display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
.wheel-col{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.wheel-btn{
  width:44px; height:32px; border:none; border-radius:8px; background:var(--jour);
  color:#fff; font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:transform .1s;
}
.wheel-btn:active{ transform:scale(.92); }
.wheel-box{
  width:44px; height:48px; border:2px solid var(--jour-pale); border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.3rem; color:var(--txt); background:#fff;
}
.wheel-sep{ font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.3rem; color:var(--jour-fonce); align-self:center; margin-top:38px; }

.btn-row{ display:flex; justify-content:center; margin-bottom:6px; }
.btn-ok{
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.9rem;
  letter-spacing:1px; padding:12px 32px; border:none; border-radius:10px;
  cursor:pointer; transition:transform .12s; color:#fff; background:var(--vert);
}
.btn-ok:active{ transform:scale(.96); }
.btn-ok:disabled{ background:#d8d8d8; cursor:not-allowed; }

.indice-box{
  display:none; margin-top:14px; padding:12px 14px; background:#e8f6fb;
  border-left:4px solid #3ab5d8; border-radius:8px; font-size:.86rem; color:#1a6e88; line-height:1.7; text-align:center;
}
.indice-box.show{ display:block; animation:fade .3s ease; }

.feedback{ display:none; margin-top:14px; padding:12px 14px; border-radius:10px; font-weight:700; font-size:.92rem; text-align:center; }
.feedback.show{ display:block; animation:fade .3s ease; }
.feedback.ok{ background:#eef7e9; color:#157f3a; border:1.5px solid var(--vert); }
.feedback.ko{ background:#fdeaea; color:#c0392b; border:1.5px solid var(--rouge); }

@keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

/* ================== ÉCRAN FINAL ================== */
.final-card{ text-align:center; display:none; position:relative; overflow:hidden; }
.final-card.show{ display:block; animation:fade .4s ease; }
.confetti-canvas{ position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; }
.final-emoji{ font-size:3.4rem; margin-bottom:10px; animation:pop .5s cubic-bezier(.18,.89,.32,1.6); }
@keyframes pop{ 0%{transform:scale(0);} 60%{transform:scale(1.2);} 100%{transform:scale(1);} }
.final-title{ font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.5rem; color:var(--jour-fonce); margin-bottom:20px; }

.stars-big{ font-size:2.6rem; letter-spacing:6px; margin-bottom:4px; animation:pop .6s .1s cubic-bezier(.18,.89,.32,1.6) both; }
.stars-big .on{ color:var(--jour); }
.stars-big .off{ color:#e6e0d0; }
.score-big{
  font-family:'Orbitron',sans-serif; font-weight:900; font-size:2.2rem; color:var(--jour-fonce);
  margin-bottom:20px;
}

.badge-final{
  display:inline-block; font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.2rem;
  padding:12px 30px; border-radius:16px; margin-bottom:16px;
  background:linear-gradient(135deg, var(--jour-clair), #fff); border:3px solid var(--jour);
  color:var(--jour-fonce); box-shadow:0 6px 18px rgba(185,64,64,.25);
  animation:pop .6s .2s cubic-bezier(.18,.89,.32,1.6) both;
}
.encouragement{ font-size:1rem; line-height:1.7; color:var(--txt); margin-bottom:14px; font-weight:600; }
.temps-sub{ font-family:'Orbitron',sans-serif; font-size:.8rem; color:var(--gris); margin-bottom:22px; }

.btn-rejouer{
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:1rem;
  letter-spacing:1px; padding:16px 40px; border:none; border-radius:14px;
  cursor:pointer; transition:transform .12s; color:#fff; background:var(--jour);
  box-shadow:0 6px 16px rgba(185,64,64,.4);
}
.btn-rejouer:active{ transform:scale(.96); }

@media(max-width:480px){
  .titre{ font-size:1.5rem; }
  .wheel-btn{ width:38px; }
  .wheel-box{ width:38px; font-size:1.1rem; }
}
</style>
</head>
<body>

<div class="bulle bulle-jaune"></div>
<div class="bulle bulle-jour"></div>
<div class="bulle bulle-verte"></div>

<div class="wrap">

  <div class="header">
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      PAZAPA · MATHS · 3ÈME
    </div>
    <div class="semaine">Semaine 6 – Jour 2</div>
    <h1 class="titre">🏆 Je relève le <span class="accent">défi</span> !</h1>
    <div class="sous-titre">🌐 Se repérer dans une sphère</div>
    <div class="badge-revision">▶ DÉFI BREVET 3ÈME</div>
  </div>

  <div class="card" id="quiz-card">
    <div class="q-count" id="q-count">QUESTION 1 / 5</div>
    <div class="timer-display" id="timer-display">⏱ Temps : 60 s</div>
    <div class="globe-wrap"><svg id="globe-svg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="coord-display" id="coord-display"></div>
    <div class="question-txt" id="question-txt"></div>

    <div class="wheel-row" id="wheel-row">
      <div class="wheel-col">
        <button class="wheel-btn" onclick="changeDigit(0,1)">▲</button>
        <div class="wheel-box" id="digit-0">0</div>
        <button class="wheel-btn" onclick="changeDigit(0,-1)">▼</button>
      </div>
      <div class="wheel-col">
        <button class="wheel-btn" onclick="changeDigit(1,1)">▲</button>
        <div class="wheel-box" id="digit-1">0</div>
        <button class="wheel-btn" onclick="changeDigit(1,-1)">▼</button>
      </div>
      <div class="wheel-col">
        <button class="wheel-btn" onclick="changeDigit(2,1)">▲</button>
        <div class="wheel-box" id="digit-2">0</div>
        <button class="wheel-btn" onclick="changeDigit(2,-1)">▼</button>
      </div>
      <div class="wheel-sep">°</div>
      <div class="wheel-col">
        <button class="wheel-btn" onclick="changeLetter(1)">▲</button>
        <div class="wheel-box" id="letter-box">N</div>
        <button class="wheel-btn" onclick="changeLetter(-1)">▼</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-ok" id="btn-ok" onclick="validateAnswer()">✓ OK</button>
    </div>

    <div class="indice-box" id="indice-box"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="card final-card" id="final-card">
    <canvas class="confetti-canvas" id="confetti-canvas"></canvas>
    <div class="final-emoji">🏆</div>
    <div class="final-title">Défi terminé !</div>

    <div class="stars-big" id="stars-big"></div>
    <div class="score-big"><span id="score-value">0</span> / 5</div>

    <div class="badge-final" id="badge-final"></div>
    <div class="encouragement" id="encouragement"></div>
    <div class="temps-sub">⏱ Temps total : <span id="temps-value">0 s</span></div>

    <button class="btn-rejouer" onclick="rejouerDefi()">🔄 Rejouer le défi</button>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

/* ============== CHRONOMÈTRE BLOQUANT (60 s / question) ============== */
const TIME_PER_QUESTION = 60;
let timeLeft = TIME_PER_QUESTION;
let timerInterval = null;
let questionLocked = false;

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = TIME_PER_QUESTION;
  questionLocked = false;
  updateTimerDisplay();

  timerInterval = setInterval(() => {
    timeLeft--;

    if(timeLeft <= 0){
      timeLeft = 0;
      updateTimerDisplay();
      clearInterval(timerInterval);
      handleTimeUp();
      return;
    }

    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay(){
  const timer = document.getElementById('timer-display');

  if(timeLeft > 0){
    timer.textContent = '⏱ Temps : ' + timeLeft + ' s';
  } else {
    timer.textContent = '⏱ Temps écoulé !';
  }

  timer.classList.toggle('alert', timeLeft <= 10);
}

function lockQuestion(){
  questionLocked = true;
  document.getElementById('btn-ok').disabled = true;

  document
    .querySelectorAll('#wheel-row button')
    .forEach(button => button.disabled = true);
}

function handleTimeUp(){
  if(questionLocked) return;

  const q = questions[qIdx];

  let expectedValue;
  let expectedLetter;

  if(q.asks === 'lat'){
    expectedValue = q.lat;
    expectedLetter = q.latDir;
  } else {
    expectedValue = q.lon;
    expectedLetter = q.lonDir;
  }

  lockQuestion();
  playErrorSound();

  const answer =
    String(expectedValue).padStart(3, '0') +
    '° ' +
    expectedLetter;

  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback ko show';
  feedback.innerHTML =
    '⏱ Temps écoulé !<br>' +
    'La bonne réponse était : <b>' +
    answer +
    '</b>';

  setTimeout(nextQuestion, 1800);
}
const TOTAL_Q = 5;

/* ============== SONS (Web Audio API, sans fichier externe) ============== */
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, duration, type, delay){
  delay = delay || 0;
  try{
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + 0.02);
  }catch(e){}
}
function playSuccessSound(){ playTone(523,0.14,'sine',0); playTone(659,0.18,'sine',0.13); playTone(784,0.22,'sine',0.28); }
function playErrorSound(){ playTone(180,0.22,'square',0); }

/* ============== GÉNÉRATION DES QUESTIONS ============== */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

let questions = [];
function generateQuestions(){
  questions = [];
  for(let i=0;i<TOTAL_Q;i++){
    const lat = randInt(0,90);
    const latDir = pick(['N','S']);
    const lon = randInt(0,180);
    const lonDir = pick(['E','O']);
    const asks = pick(['lat','lon']);
    questions.push({lat, latDir, lon, lonDir, asks});
  }
}

let qIdx = 0;
let attempts = 0;
let reussisCount = 0;
let defiStartTime = null;
let currentLetterOptions = ['N','S'];
let letterIdx = 0;
let digits = [0,0,0];

/* ============== GLOBE SVG ============== */
function buildGlobeSVG(lat, latDir, lon, lonDir){
  const cx=120, cy=120, R=100;
  let svg = '';
  svg += '<defs><clipPath id="globeClip"><circle cx="'+cx+'" cy="'+cy+'" r="'+R+'"/></clipPath>'
       + '<radialGradient id="globeShade" cx="35%" cy="30%" r="75%">'
       + '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>'
       + '<stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>'
       + '<stop offset="100%" stop-color="#00142e" stop-opacity="0.35"/>'
       + '</radialGradient></defs>';
  // sphère : texture terrestre réaliste (image équirectangulaire) + fond de secours
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="#3a6fa8"/>';
  svg += '<image href="https://upload.wikimedia.org/wikipedia/commons/8/83/Equirectangular_projection_SW.jpg" '
       + 'x="'+(cx-R*1.55)+'" y="'+(cy-R)+'" width="'+(R*3.1)+'" height="'+(R*2)+'" '
       + 'clip-path="url(#globeClip)" preserveAspectRatio="xMidYMid slice" opacity="0.92"/>';
  // relief lumineux (ombre/lumière) par-dessus la texture
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="url(#globeShade)"/>';
  // Meridiens (ellipses verticales, vue simplifiée)
  [-60,-30,0,30,60].forEach(function(mLon){
    const rx = R*Math.abs(Math.cos(mLon*Math.PI/180));
    const color = mLon===0 ? '#5fd68a' : '#f5e08a';
    const width = mLon===0 ? 2.2 : 1;
    svg += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+R+'" fill="none" stroke="'+color+'" stroke-width="'+width+'" opacity="0.85"/>';
  });
  // parallèles horizontales réelles (courbes elliptiques aplaties selon latitude)
  [-60,-30,30,60].forEach(function(pLat){
    const yy = cy - R*Math.sin(pLat*Math.PI/180);
    const rx = R*Math.cos(pLat*Math.PI/180);
    const ry = 6;
    svg += '<ellipse cx="'+cx+'" cy="'+yy+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="#f5e08a" stroke-width="1" opacity="0.85"/>';
  });
  // équateur (ligne rouge, légèrement incurvée comme une ellipse très aplatie)
  svg += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+R+'" ry="5" fill="none" stroke="#e05050" stroke-width="2.2" opacity="0.9"/>';
  // contour de la sphère
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#1a3a5c" stroke-width="2"/>';

  // Point P (projection orthographique simplifiée, longitude ramenée à l'hémisphère visible)
  const latSigned = latDir==='S' ? -lat : lat;
  let lonSigned = lonDir==='O' ? -lon : lon;
  let lonVis = lonSigned;
  if(lonVis>90) lonVis = 180-lonVis;
  if(lonVis<-90) lonVis = -180-lonVis;
  const latRad = latSigned*Math.PI/180;
  const lonRad = lonVis*Math.PI/180;
  const px = cx + R*Math.cos(latRad)*Math.sin(lonRad);
  const py = cy - R*Math.sin(latRad);
  svg += '<circle cx="'+px+'" cy="'+py+'" r="7" fill="#9b2fae" opacity="0.25"/>';
  svg += '<circle cx="'+px+'" cy="'+py+'" r="4.5" fill="#9b2fae" stroke="#fff" stroke-width="1.5"/>';
  svg += '<text x="'+(px+9)+'" y="'+(py-6)+'" font-size="15" font-weight="700" fill="#7a2088" stroke="#fff" stroke-width="3" paint-order="stroke" font-family=\'Orbitron,sans-serif\'>P</text>';

  return svg;
}

/* ============== AFFICHAGE D'UNE QUESTION ============== */
function renderQuestion(){
  const q = questions[qIdx];
  $('q-count').textContent = 'QUESTION ' + (qIdx+1) + ' / ' + TOTAL_Q;
  $('globe-svg').innerHTML = buildGlobeSVG(q.lat, q.latDir, q.lon, q.lonDir);
  $('coord-display').textContent = 'P(' + q.lat + '° ' + q.latDir + ' ; ' + q.lon + '° ' + q.lonDir + ')';
  $('question-txt').textContent = q.asks==='lat' ? 'La latitude du point M est :' : 'La longitude du point M est :';

  digits = [randInt(0,9), randInt(0,9), randInt(0,9)];
  currentLetterOptions = q.asks==='lat' ? ['N','S'] : ['E','O'];
  letterIdx = 0;
  updateWheelDisplay();

  attempts = 0;
  $('indice-box').className = 'indice-box';
  $('indice-box').innerHTML = '';
  $('feedback').className = 'feedback';
  $('feedback').innerHTML = '';
  $('btn-ok').disabled = false;
  document.querySelectorAll('#wheel-row button').forEach(b=> b.disabled=false);

  startTimer();
}

function updateWheelDisplay(){
  digits.forEach((d,i)=>{ $('digit-'+i).textContent = d; });
  $('letter-box').textContent = currentLetterOptions[letterIdx];
}
window.changeDigit = function(idx, dir){
  digits[idx] = (digits[idx] + dir + 10) % 10;
  updateWheelDisplay();
};
window.changeLetter = function(dir){
  letterIdx = (letterIdx + dir + currentLetterOptions.length) % currentLetterOptions.length;
  updateWheelDisplay();
};

/* ============== VALIDATION ============== */
window.validateAnswer = function(){
  if(questionLocked) return;

  const q = questions[qIdx];
  const givenValue = digits[0]*100 + digits[1]*10 + digits[2];
  const givenLetter = currentLetterOptions[letterIdx];

  let expectedValue, expectedLetter;
  if(q.asks==='lat'){ expectedValue = q.lat; expectedLetter = q.latDir; }
  else { expectedValue = q.lon; expectedLetter = q.lonDir; }

  attempts++;
  const correct = (givenValue === expectedValue) && (givenLetter === expectedLetter);
  const fb = $('feedback');

  if(correct){
    clearInterval(timerInterval);
    lockQuestion();
    reussisCount++;
    playSuccessSound();
    fb.className = 'feedback ok show';
    fb.innerHTML = '✅ Bravo !';
    setTimeout(nextQuestion, 1000);
  } else {
    playErrorSound();
    if(attempts===1){
      fb.className = 'feedback ko show';
      fb.innerHTML = '❌ Ce n\u2019est pas encore ça. Réessaie !';
      const box = $('indice-box');
      box.className = 'indice-box show';
      if(q.asks==='lat'){
        box.innerHTML = '💡 Repère d\u2019abord l\u2019équateur (en rouge) avant de déterminer la latitude.';
      } else {
        box.innerHTML = '💡 Repère d\u2019abord le méridien de Greenwich (en vert) avant de déterminer la longitude.';
      }
    } else {
      clearInterval(timerInterval);
      lockQuestion();
      fb.className = 'feedback ko show';
      const expStr = String(expectedValue).padStart(3,'0') + '° ' + expectedLetter;
      fb.innerHTML = '❌ La bonne réponse était : <b>' + expStr + '</b>';
      setTimeout(nextQuestion, 1800);
    }
  }
};

function nextQuestion(){
  clearInterval(timerInterval);
  qIdx++;
  if(qIdx >= TOTAL_Q){
    $('quiz-card').style.display = 'none';
    showBilan();
  } else {
    renderQuestion();
  }
}

/* ============== BILAN FINAL ============== */
function formatTemps(sec){
  if(sec < 60) return sec + ' s';
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return m + ' min ' + String(s).padStart(2,'0') + ' s';
}

function showBilan(){
  const totalTimeUsed = Math.round((Date.now() - defiStartTime) / 1000);
  $('score-value').textContent = reussisCount;
  $('temps-value').textContent = formatTemps(totalTimeUsed);

  let stars = '';
  for(let i=0;i<5;i++){ stars += '<span class="' + (i < reussisCount ? 'on' : 'off') + '">' + (i < reussisCount ? '★' : '☆') + '</span>'; }
  $('stars-big').innerHTML = stars;

  let badge, phrase;
  if(reussisCount === 5){
    badge = '🌟 Expert';
    phrase = 'Tu sais désormais repérer un point grâce à sa latitude et sa longitude.';
  } else if(reussisCount === 4){
    badge = '🥇 Maître explorateur';
    phrase = 'Tu sais désormais repérer un point grâce à sa latitude et sa longitude.';
  } else if(reussisCount === 3){
    badge = '🥈 Explorateur';
    phrase = 'Encore un peu d\u2019entraînement et tu deviendras un véritable expert du repérage sur le globe.';
  } else if(reussisCount === 2){
    badge = '🥉 Aventurier';
    phrase = 'Encore un peu d\u2019entraînement et tu deviendras un véritable expert du repérage sur le globe.';
  } else {
    badge = '🧭 En apprentissage';
    phrase = 'Revois la latitude, la longitude, l\u2019équateur et le méridien de Greenwich, puis retente ta chance.';
  }
  $('badge-final').textContent = badge;
  $('encouragement').textContent = phrase;

  $('final-card').classList.add('show');
  fireConfetti();
}

/* ============== CONFETTIS (canvas léger, ~1s) ============== */
function fireConfetti(){
  const canvas = $('confetti-canvas');
  const card = $('final-card');
  canvas.width = card.offsetWidth;
  canvas.height = card.offsetHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#b94040','#f5c518','#8dc63f','#3ab5d8','#f9c0bb'];
  const pieces = [];
  for(let i=0;i<60;i++){
    pieces.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.5,
      w: 5 + Math.random()*5,
      h: 8 + Math.random()*6,
      color: colors[Math.floor(Math.random()*colors.length)],
      vy: 2 + Math.random()*3,
      vx: (Math.random()-0.5)*2,
      rot: Math.random()*360,
      vrot: (Math.random()-0.5)*10
    });
  }
  const start = Date.now();
  const duration = 1200;
  function frame(){
    const elapsed = Date.now() - start;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if(elapsed < duration){
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  requestAnimationFrame(frame);
}

/* ============== REJOUER LE DÉFI ============== */
window.rejouerDefi = function(){
  clearInterval(timerInterval);
  qIdx = 0;
  attempts = 0;
  reussisCount = 0;
  defiStartTime = Date.now();
  generateQuestions();
  $('final-card').classList.remove('show');
  $('quiz-card').style.display = '';
  renderQuestion();
};

/* ============== INIT ============== */
defiStartTime = Date.now();
generateQuestions();
renderQuestion();
</script>
