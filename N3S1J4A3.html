<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Inéquations 1er degré – Niveau intermédiaire</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;--yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;--purple:#9b59b6;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--purple);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--pink);top:200px;left:-30px;pointer-events:none;}
    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:.6rem;}
    h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;line-height:1.2;}
    h1 .hl-blue{color:var(--blue);}h1 .hl-purple{color:var(--purple);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}
    .progress-wrap{width:100%;max-width:700px;margin-bottom:1.2rem;position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}
    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:99px;font-size:.8rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}.chip.wrong .dot{background:var(--pink);}.chip.remaining .dot{background:var(--muted);}
    .card{width:100%;max-width:700px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 2rem 1.6rem;position:relative;z-index:1;box-shadow:0 4px 24px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink),var(--purple),var(--blue));}
    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.08em;}
    .level-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .55rem;border-radius:4px;text-transform:uppercase;letter-spacing:.08em;border:1.5px solid;margin-bottom:.7rem;}
    .badge-resolve{background:#f0f0ff;color:var(--purple);border-color:#d0c0f0;}
    .badge-verify{background:#fff0e8;color:var(--orange);border-color:#f5c090;}
    .ineq-display{font-family:'JetBrains Mono',monospace;font-size:clamp(1.4rem,3.8vw,2.1rem);font-weight:800;color:var(--blue);margin-bottom:.4rem;letter-spacing:.02em;}
    .q-text{font-size:.9rem;color:var(--muted);margin-bottom:1rem;line-height:1.5;}
    .method-box{background:#f8f0ff;border:1.5px solid #d8b8f8;border-radius:10px;padding:.75rem 1rem;margin-bottom:1.2rem;font-size:.84rem;font-family:'JetBrains Mono',monospace;color:#5a2080;line-height:1.8;}
    .method-box strong{color:var(--purple);}
    /* ── RÉSOLUTION : signe + valeur ── */
    .sign-label{font-size:.8rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .sign-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;position:relative;z-index:2;}
    .sign-btn{padding:.5rem 1rem;border:2px solid var(--border);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;cursor:pointer;background:var(--surface);color:var(--text);transition:border-color .15s,background .15s,transform .1s;position:relative;z-index:2;}
    .sign-btn:hover{border-color:var(--purple);background:#f8f0ff;transform:translateY(-1px);}
    .sign-btn.selected{border-color:var(--purple);background:#f8f0ff;color:var(--purple);}
    .sign-btn.correct-sign{border-color:var(--green);background:#f0faeb;color:#2f6e10;cursor:default;}
    .sign-btn.wrong-sign{border-color:var(--pink);background:#fff0ef;color:#c0392b;cursor:default;}
    .input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;position:relative;z-index:2;}
    .input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;}
    .sign-display{font-family:'JetBrains Mono',monospace;font-size:1.2rem;font-weight:700;color:var(--muted);min-width:1.4rem;text-align:center;}
    .answer-input{width:110px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.05rem;padding:.5rem .85rem;outline:none;transition:border-color .2s;position:relative;z-index:2;}
    .answer-input:focus{border-color:var(--blue);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}
    /* ── VÉRIFICATION : boutons OUI/NON ── */
    .yesno-row{display:flex;gap:1rem;justify-content:center;margin:1rem 0;position:relative;z-index:2;}
    .yn-btn{padding:.65rem 2rem;border:2.5px solid var(--border);border-radius:12px;font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s,transform .1s;position:relative;z-index:2;}
    .yn-btn:hover{transform:translateY(-2px);}
    .yn-btn.yes:hover{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .yn-btn.no:hover{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .yn-btn.selected-yes{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .yn-btn.selected-no{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .yn-btn.correct-yn{border-color:var(--green);background:#f0faeb;color:#2f6e10;cursor:default;}
    .yn-btn.wrong-yn{border-color:var(--pink);background:#fff0ef;color:#c0392b;cursor:default;}
    .yn-btn.disabled{opacity:.5;cursor:default;pointer-events:none;}
    /* ── Communs ── */
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.2rem;border-radius:99px;font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .12s;position:relative;z-index:2;}
    .btn:active{transform:scale(.96);}.btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--purple);color:#fff;box-shadow:0 3px 10px rgba(155,89,182,.3);}
    .btn-hint{background:var(--yellow);color:#5a3e00;}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--purple);color:var(--text);}
    .btn-row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.5rem;position:relative;z-index:2;}
    .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.7rem 1rem;font-size:.84rem;color:#7a6010;display:none;line-height:1.7;font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}.hint-box strong{color:var(--orange);}
    .feedback{margin-top:1.2rem;padding:.75rem 1rem;border-radius:10px;font-size:.9rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.5;}
    .feedback.show{display:flex;}.feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#3a7d0a;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.2rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.7;}
    .nav-row{display:flex;justify-content:space-between;margin-top:1.4rem;gap:.7rem;position:relative;z-index:2;}
    .results{width:100%;max-width:700px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 24px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--purple);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;padding:.7rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.5;}
    .recap-item .eq{color:var(--blue);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}.recap-item.ko-item{border-color:#f9c0bb;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .card,.results{animation:fadeUp .4s ease both;}
  </style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa &middot; Maths &middot; 3&egrave;me
  </div>
  <div class="week-label">Semaine 1 &ndash; Jour 4</div>
  <h1>In&eacute;quations du <span class="hl-blue">1er degr&eacute;</span></h1>
  <p class="subtitle">8 exercices &middot; niveau <span style="color:var(--purple);font-weight:700;">interm&eacute;diaire</span> &middot; r&eacute;solution + v&eacute;rification</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Question 1 / 8</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<div class="score-row">
  <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
  <div class="chip wrong"><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
  <div class="chip remaining"><div class="dot"></div><span id="count-rem">8</span> restantes</div>
</div>

<div class="card" id="ex-card">
  <div class="card-stripe"></div>
  <div class="q-num" id="q-num">Exercice 1</div>
  <div class="level-badge badge-resolve" id="q-badge">&#127381; R&eacute;soudre</div>
  <div class="ineq-display" id="q-eq"></div>
  <div class="q-text" id="q-text"></div>
  <div class="method-box" id="method-box"></div>

  <!-- RÉSOLUTION -->
  <div id="part-resolve">
    <div class="sign-label">Choisis le signe de l&rsquo;in&eacute;galit&eacute; :</div>
    <div class="sign-row" id="sign-row">
      <button class="sign-btn" id="sign-lt" onclick="selectSign('lt')">&lt;</button>
      <button class="sign-btn" id="sign-le" onclick="selectSign('le')">&le;</button>
      <button class="sign-btn" id="sign-gt" onclick="selectSign('gt')">&gt;</button>
      <button class="sign-btn" id="sign-ge" onclick="selectSign('ge')">&ge;</button>
    </div>
    <div class="input-row">
      <span class="input-label">x</span>
      <span class="sign-display" id="sign-display">?</span>
      <input type="number" class="answer-input" id="answer-input" placeholder="?" autocomplete="off" step="any"/>
    </div>
    <div class="btn-row" style="margin-top:.8rem;">
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">Valider &#10003;</button>
      <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    </div>
  </div>

  <!-- VÉRIFICATION -->
  <div id="part-verify" style="display:none;">
    <div id="verify-question" style="font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--text);margin-bottom:.5rem;"></div>
    <div class="yesno-row">
      <button class="yn-btn yes" id="btn-yes" onclick="checkYesNo(true)">&#10003; Oui, c&rsquo;est une solution</button>
      <button class="yn-btn no"  id="btn-no"  onclick="checkYesNo(false)">&#10007; Non, ce n&rsquo;est pas une solution</button>
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    </div>
  </div>

  <div class="hint-box" id="hint-box"></div>
  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="fb-icon"></span>
    <div><div id="fb-msg"></div><div class="feedback-detail" id="fb-detail"></div></div>
  </div>
  <div class="nav-row">
    <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">&larr; Pr&eacute;c&eacute;dent</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      R&eacute;sultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/8</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <div class="recap-list" id="recap-list"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">&#128260; Recommencer</button>
  </div>
</div>

<script>
var SIGNS = {
  lt:  { html:"&lt;",  text:"<",  flip:"gt" },
  le:  { html:"&le;",  text:"\u2264", flip:"ge" },
  gt:  { html:"&gt;",  text:">",  flip:"lt" },
  ge:  { html:"&ge;",  text:"\u2265", flip:"le" }
};

function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function genExercises() {
  var exs = [];

  // ── TYPE 1 : ax + b OP cx + d  (deux membres, a>c, diviseur positif) ×3
  for (var i=0; i<3; i++) {
    var a = rnd(3,8), c = rnd(1,a-1), x = rnd(-6,6);
    var sign = pick(["lt","le","gt","ge"]);
    var b = rnd(-8,8), d;
    var diff = a-c; // positive
    var lhs = diff*x;
    if (sign==="lt")      d = b+lhs+rnd(1,6);
    else if (sign==="le") d = b+lhs;
    else if (sign==="gt") d = b+lhs-rnd(1,6);
    else                  d = b+lhs;

    var bStr = b>=0 ? " + "+b : " \u2212 "+Math.abs(b);
    var dStr = d>=0 ? " + "+d : " \u2212 "+Math.abs(d);
    exs.push({
      kind: "resolve",
      type: 1,
      eq: a+"x"+bStr+" "+SIGNS[sign].text+" "+c+"x"+dStr,
      eqHtml: a+"x"+bStr+" "+SIGNS[sign].html+" "+c+"x"+dStr,
      signKey: sign, ans: x,
      method: "<strong>M\u00e9thode :</strong><br>"
        +"1\ufe0f\u20e3 Regrouper les x \u00e0 gauche : ("+a+"\u2212"+c+")x"+bStr+" "+SIGNS[sign].html+" "+d+"<br>"
        +"2\ufe0f\u20e3 "+diff+"x "+SIGNS[sign].html+" "+(d-b)+"<br>"
        +"3\ufe0f\u20e3 Diviser par "+diff+" (positif \u2192 signe inchang\u00e9)",
      hint: diff+"x "+SIGNS[sign].text+" "+(d-b)+" \u2192 x "+SIGNS[sign].text+" "+x
    });
  }

  // ── TYPE 2 : a(x+b) OP c  (distributivité, diviseur positif) ×2
  for (var j=0; j<2; j++) {
    var a2 = rnd(2,5), b2 = rnd(-5,5), x2 = rnd(-7,7);
    var sign2 = pick(["lt","le","gt","ge"]);
    var c2;
    // a2*(x2+b2) sign2 c2 — fix c2 from solution
    var lhs2 = a2*(x2+b2);
    if (sign2==="lt")      c2 = lhs2 + rnd(1,a2-1); // a2*x2 + offset, x2 is JUST below
    else if (sign2==="le") c2 = lhs2;
    else if (sign2==="gt") c2 = lhs2 - rnd(1,a2-1);
    else                   c2 = lhs2;
    var b2str = b2>=0 ? "x + "+b2 : "x \u2212 "+Math.abs(b2);
    exs.push({
      kind: "resolve",
      type: 2,
      eq: a2+"("+b2str+") "+SIGNS[sign2].text+" "+c2,
      eqHtml: a2+"("+b2str+") "+SIGNS[sign2].html+" "+c2,
      signKey: sign2, ans: x2,
      method: "<strong>M\u00e9thode :</strong><br>"
        +"1\ufe0f\u20e3 Distribuer : "+a2+"x + "+(a2*b2)+" "+SIGNS[sign2].html+" "+c2+"<br>"
        +"2\ufe0f\u20e3 "+a2+"x "+SIGNS[sign2].html+" "+(c2-a2*b2)+"<br>"
        +"3\ufe0f\u20e3 Diviser par "+a2+" (positif \u2192 signe inchang\u00e9)",
      hint: a2+"x "+SIGNS[sign2].text+" "+(c2-a2*b2)+" \u2192 x "+SIGNS[sign2].text+" "+x2
    });
  }

  // ── TYPE 3 : −ax + b OP c  (diviseur NÉGATIF → flip) ×1
  var a3 = rnd(2,5), b3 = rnd(-5,5), x3 = rnd(-4,4);
  var sign3 = pick(["lt","le","gt","ge"]);
  var flip3 = SIGNS[sign3].flip;
  var lhs3 = -a3*x3 + b3;
  var c3;
  if (sign3==="lt")      c3 = lhs3 + rnd(1,4);
  else if (sign3==="le") c3 = lhs3;
  else if (sign3==="gt") c3 = lhs3 - rnd(1,4);
  else                   c3 = lhs3;
  var b3str = b3>=0 ? " + "+b3 : " \u2212 "+Math.abs(b3);
  exs.push({
    kind: "resolve",
    type: 3,
    eq: "\u2212"+a3+"x"+b3str+" "+SIGNS[sign3].text+" "+c3,
    eqHtml: "\u2212"+a3+"x"+b3str+" "+SIGNS[sign3].html+" "+c3,
    signKey: flip3, ans: x3,
    method: "<strong>M\u00e9thode :</strong><br>"
      +"1\ufe0f\u20e3 Soustraire "+b3+" : \u2212"+a3+"x "+SIGNS[sign3].html+" "+(c3-b3)+"<br>"
      +"2\ufe0f\u20e3 Diviser par <strong>\u2212"+a3+"</strong> \u26a0\ufe0f <strong>le signe se retourne !</strong><br>"
      +"&nbsp;&nbsp;"+SIGNS[sign3].html+" devient "+SIGNS[flip3].html+"<br>"
      +"3\ufe0f\u20e3 x "+SIGNS[flip3].html+" "+x3,
    hint: "Division par \u2212"+a3+" : "+SIGNS[sign3].text+" \u2192 "+SIGNS[flip3].text+". Solution : x "+SIGNS[flip3].text+" "+x3
  });

  // ── TYPE 4 : VÉRIFICATION — x est-il solution ? ×2
  for (var k=0; k<2; k++) {
    // Build an inéquation and a test value
    var av = rnd(2,6), bv = rnd(-8,8), cv = rnd(-10,10);
    var signV = pick(["lt","le","gt","ge"]);
    // Choose test value: 50% correct, 50% incorrect
    var xv_sol = Math.floor((cv-bv)/av); // boundary
    var isSol;
    var testVal;
    if (Math.random() < 0.5) {
      // give the CORRECT solution
      isSol = true;
      // pick a value that satisfies the ineq
      if (signV==="lt")      testVal = xv_sol - 1;
      else if (signV==="le") testVal = xv_sol;
      else if (signV==="gt") testVal = xv_sol + 1;
      else                   testVal = xv_sol;
    } else {
      // give a NON-solution
      isSol = false;
      if (signV==="lt")      testVal = xv_sol + 1;
      else if (signV==="le") testVal = xv_sol + 1;
      else if (sign==="gt")  testVal = xv_sol - 1;
      else                   testVal = xv_sol - 1;
    }
    // Verify our isSol claim
    var lhsV = av*testVal + bv;
    var actualSol;
    if (signV==="lt")      actualSol = lhsV < cv;
    else if (signV==="le") actualSol = lhsV <= cv;
    else if (signV==="gt") actualSol = lhsV > cv;
    else                   actualSol = lhsV >= cv;
    isSol = actualSol; // always use computed truth

    var bvStr = bv>=0 ? " + "+bv : " \u2212 "+Math.abs(bv);
    exs.push({
      kind: "verify",
      eq: av+"x"+bvStr+" "+SIGNS[signV].html+" "+cv,
      eqHtml: av+"x"+bvStr+" "+SIGNS[signV].html+" "+cv,
      testVal: testVal,
      isSol: isSol,
      lhsV: lhsV,
      cv: cv,
      signV: signV,
      method: "<strong>M\u00e9thode :</strong> Substitue x = "+testVal+" dans l\u2019in\u00e9quation.<br>"
        +"Si l\u2019in\u00e9galit\u00e9 est vraie \u2192 c\u2019est une solution. Sinon \u2192 non.",
      hint: av+" \u00d7 "+testVal+" + ("+bv+") = "+lhsV+". On teste : "+lhsV+" "+SIGNS[signV].html+" "+cv+" \u2192 "+(isSol?"VRAI \u2192 solution":"FAUX \u2192 pas solution")
    });
  }

  return exs;
}

// ── State ─────────────────────────────────────────────────────────
var EXERCISES = genExercises();
var TOTAL = EXERCISES.length;
var current = 0;
var userAnswers = new Array(TOTAL).fill(null); // resolve: numeric | verify: bool
var userSigns   = new Array(TOTAL).fill(null);
var selectedSign = null;
var hintOpen = false;
var $ = function(id){ return document.getElementById(id); };

function render() {
  var ex = EXERCISES[current];
  $("q-num").textContent = "Exercice "+(current+1);
  $("q-eq").innerHTML = ex.eqHtml;
  $("method-box").innerHTML = ex.method;
  $("hint-box").innerHTML = "";
  $("hint-box").classList.remove("show");
  hintOpen = false;
  $("feedback").className = "feedback";

  // Badge
  if (ex.kind === "resolve") {
    $("q-badge").className = "level-badge badge-resolve";
    $("q-badge").innerHTML = "&#128295; R&eacute;soudre";
    $("q-text").textContent = "R\u00e9sous cette in\u00e9quation. Choisis le signe et la valeur limite.";
    $("part-resolve").style.display = "block";
    $("part-verify").style.display = "none";
  } else {
    $("q-badge").className = "level-badge badge-verify";
    $("q-badge").innerHTML = "&#10067; V&eacute;rifier";
    $("q-text").textContent = "x = "+ex.testVal+" est-il une solution de cette in\u00e9quation ?";
    $("part-resolve").style.display = "none";
    $("part-verify").style.display = "block";
    $("verify-question").innerHTML = "On teste x = <strong>"+ex.testVal+"</strong> dans l\u2019in\u00e9quation :";
  }

  // Reset sign buttons
  ["lt","le","gt","ge"].forEach(function(s){
    var b = $("sign-"+s);
    b.className = "sign-btn";
    b.disabled = false;
    b.onclick = (function(sk){ return function(){ selectSign(sk); }; })(s);
  });
  selectedSign = null;
  $("sign-display").innerHTML = "?";
  $("sign-display").style.color = "var(--muted)";

  // Reset yes/no
  $("btn-yes").className = "yn-btn yes";
  $("btn-no").className  = "yn-btn no";
  $("btn-yes").disabled = false;
  $("btn-no").disabled  = false;
  $("btn-yes").onclick = function(){ checkYesNo(true); };
  $("btn-no").onclick  = function(){ checkYesNo(false); };

  var inp = $("answer-input");
  inp.className = "answer-input";
  inp.value = userAnswers[current] !== null && ex.kind==="resolve" ? userAnswers[current] : "";

  if (userAnswers[current] !== null) {
    $("btn-next").disabled = false;
    $("btn-check").disabled = true;
    $("btn-yes").disabled = true;
    $("btn-no").disabled  = true;
    inp.disabled = true;

    var correct = checkCorrect(current);
    showFeedback(correct, current);

    if (ex.kind === "resolve") {
      inp.className = "answer-input "+(correct?"correct-input":"wrong-input");
      var savedSign = userSigns[current];
      selectedSign = savedSign;
      $("sign-display").innerHTML = savedSign ? SIGNS[savedSign].html : "?";
      $("sign-display").style.color = correct ? "var(--green)" : "var(--pink)";
      ["lt","le","gt","ge"].forEach(function(s){
        var b = $("sign-"+s);
        b.disabled = true;
        if (s === ex.signKey) b.className = "sign-btn correct-sign";
        else if (s === savedSign && savedSign !== ex.signKey) b.className = "sign-btn wrong-sign";
      });
    } else {
      var ans = userAnswers[current];
      if (ans === true) {
        $("btn-yes").className = correct ? "yn-btn correct-yn" : "yn-btn wrong-yn";
        $("btn-no").className  = "yn-btn disabled";
      } else {
        $("btn-no").className  = correct ? "yn-btn correct-yn" : "yn-btn wrong-yn";
        $("btn-yes").className = "yn-btn disabled";
      }
    }
  } else {
    $("btn-next").disabled = true;
    $("btn-check").disabled = false;
    inp.disabled = false;
    if (ex.kind === "resolve") inp.focus();
  }

  updateProgress();
  $("btn-prev").disabled = current === 0;
}

function checkCorrect(idx) {
  var ex = EXERCISES[idx];
  if (ex.kind === "resolve") {
    return userSigns[idx] === ex.signKey && parseFloat(userAnswers[idx]) === ex.ans;
  } else {
    return userAnswers[idx] === ex.isSol;
  }
}

function selectSign(sk) {
  if ($("btn-check").disabled) return;
  selectedSign = sk;
  ["lt","le","gt","ge"].forEach(function(s){
    $("sign-"+s).className = "sign-btn"+(s===sk?" selected":"");
  });
  $("sign-display").innerHTML = SIGNS[sk].html;
  $("sign-display").style.color = "var(--purple)";
}

function checkAnswer() {
  if (!selectedSign) {
    $("hint-box").innerHTML = "<strong>\u26a0\ufe0f</strong> Choisis d\u2019abord le signe !";
    $("hint-box").classList.add("show");
    return;
  }
  var val = parseFloat($("answer-input").value);
  if (isNaN(val)) { $("answer-input").focus(); return; }
  userAnswers[current] = val;
  userSigns[current]   = selectedSign;
  render();
}

function checkYesNo(answer) {
  userAnswers[current] = answer;
  render();
}

function showFeedback(correct, idx) {
  var ex = EXERCISES[idx];
  var fb = $("feedback");
  fb.className = "feedback show "+(correct?"ok":"ko");
  $("fb-icon").textContent = correct ? "\u2705" : "\u274C";
  var det = $("fb-detail");

  if (ex.kind === "resolve") {
    if (correct) {
      $("fb-msg").textContent = "Parfait ! Bonne in\u00e9quation !";
      det.innerHTML = "x "+SIGNS[ex.signKey].html+" "+ex.ans+" est la solution correcte.";
    } else {
      $("fb-msg").textContent = "Pas tout \u00e0 fait\u2026";
      var signErr = userSigns[idx] !== ex.signKey
        ? "\u26a0\ufe0f Signe : il fallait "+SIGNS[ex.signKey].html+" et non "+(userSigns[idx]?SIGNS[userSigns[idx]].html:"?")+". "
        : "";
      var valErr = parseFloat(userAnswers[idx]) !== ex.ans
        ? "\u26a0\ufe0f Valeur : il fallait "+ex.ans+". "
        : "";
      det.innerHTML = signErr + valErr + "<br>" + ex.hint;
    }
  } else {
    var calc = ex.lhsV;
    var calcStr = EXERCISES[idx].eq.replace(/x/g,"("+ex.testVal+")");
    if (correct) {
      $("fb-msg").textContent = correct && ex.isSol
        ? "\u2705 Oui ! x = "+ex.testVal+" est bien une solution."
        : "\u2705 Non ! x = "+ex.testVal+" n\u2019est pas une solution.";
      det.innerHTML = calc+" "+SIGNS[ex.signV].html+" "+ex.cv+" est <strong>"+(ex.isSol?"VRAIE":"FAUSSE")+"</strong>. "+ex.hint;
    } else {
      $("fb-msg").textContent = "\u274C Ce n\u2019est pas la bonne r\u00e9ponse.";
      det.innerHTML = "Calcul : "+calc+" "+SIGNS[ex.signV].html+" "+ex.cv+" est <strong>"+(ex.isSol?"VRAIE \u2192 c\u2019est bien une solution !":"FAUSSE \u2192 ce n\u2019est pas une solution !")+"</strong><br>"+ex.hint;
    }
  }
}

function toggleHint() {
  hintOpen = !hintOpen;
  var h = $("hint-box");
  if (hintOpen) {
    h.innerHTML = "<strong>? Indice :</strong> "+EXERCISES[current].hint;
    h.classList.add("show");
  } else h.classList.remove("show");
}

function updateProgress() {
  var answered = userAnswers.filter(function(a){ return a!==null; }).length;
  var pct = Math.round((answered/TOTAL)*100);
  $("progress-bar").style.width = pct+"%";
  $("prog-label").textContent = "Question "+(current+1)+" / "+TOTAL;
  $("prog-pct").textContent = pct+"\u00a0%";
  var ok = userAnswers.filter(function(a,i){ return a!==null && checkCorrect(i); }).length;
  var ko = answered - ok;
  $("count-ok").textContent = ok;
  $("count-ko").textContent = ko;
  $("count-rem").textContent = TOTAL - answered;
}

function nextQ() {
  if (current < TOTAL-1) { current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}
function prevQ() { if (current>0) { current--; render(); } }

function showResults() {
  $("ex-card").style.display = "none";
  $("results-screen").classList.add("show");
  var ok = userAnswers.filter(function(a,i){ return a!==null && checkCorrect(i); }).length;
  $("score-num").textContent = ok;
  var stars = ok>=7?5:ok>=6?4:ok>=5?3:ok>=3?2:1;
  $("stars-row").textContent = "\u2B50".repeat(stars)+"\u2606".repeat(5-stars);
  var msgs = ["Continue \u00e0 t\u2019entra\u00eener !","Bon d\u00e9but !","Pas mal !","Bien jou\u00e9 !","Tr\u00e8s bien !","Parfait ! Bravo ! \uD83C\uDF89"];
  $("results-msg").textContent = msgs[Math.min(ok,msgs.length-1)];
  var list = $("recap-list");
  list.innerHTML = "";
  EXERCISES.forEach(function(ex,i){
    var correct = userAnswers[i]!==null && checkCorrect(i);
    var div = document.createElement("div");
    div.className = "recap-item "+(correct?"ok-item":"ko-item");
    var solTxt = ex.kind==="resolve"
      ? "x "+SIGNS[ex.signKey].html+" "+ex.ans
      : (ex.isSol ? "Oui, solution" : "Non, pas solution");
    var userTxt = userAnswers[i]===null ? "non r\u00e9pondu"
      : ex.kind==="resolve"
        ? "x "+(userSigns[i]?SIGNS[userSigns[i]].html:"?")+" "+userAnswers[i]
        : (userAnswers[i] ? "Oui" : "Non");
    div.innerHTML = "<span>"+(correct?"\u2705":"\u274C")+"</span>"
      +"<span class=\"eq\">"+ex.eqHtml+"</span>"
      +"<span>"+solTxt+(!correct?" (toi : "+userTxt+")":"")+"</span>";
    list.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart() {
  EXERCISES = genExercises();
  current = 0;
  userAnswers = new Array(TOTAL).fill(null);
  userSigns   = new Array(TOTAL).fill(null);
  $("ex-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", function() {
  $("answer-input").addEventListener("keydown", function(e){
    if (e.key==="Enter" && !$("btn-check").disabled) checkAnswer();
  });
  render();
});
</script>
</body>
</html>
