<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Série d'exercices Niveau 1 (S3 J2)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f28b82;--day-dark:#b03a30;--day-title:#b03a30;--day-light:#ffeae7;--day-border:#f6b8b1;--badge-txt:#ffffff;--day-glow:rgba(242,139,130,.24);
  --bg:#ffffff;--surface:#ffffff;--border:#eedad7;--green:#5fa800;--green-soft:#8dc63f;--pink:#f28b82;--orange:#f5a623;--red:#d33;
  --text:#1a1d23;--muted:#7a7568;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 3rem;overflow-x:hidden;line-height:1.7;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}
.frame{position:relative;overflow:hidden;max-width:760px;margin:0 auto;
  background:radial-gradient(300px 300px at 100% 0%,rgba(242,139,130,.20),transparent 60%),
             radial-gradient(240px 240px at 0% 100%,rgba(246,184,177,.24),transparent 60%),
             radial-gradient(150px 150px at 100% 80%,rgba(242,139,130,.14),transparent 60%),var(--bg);}
.bubble{position:absolute;border-radius:50%;pointer-events:none;}
.b1{width:290px;height:290px;top:-75px;right:-80px;background:var(--day);opacity:.48;}
.b2{width:220px;height:220px;bottom:180px;left:-85px;background:var(--day-border);opacity:.55;}
.b3{width:160px;height:160px;bottom:-40px;right:-50px;background:var(--day-border);opacity:.50;}
.layer{position:relative;z-index:1;}
.hero{background:var(--surface);border-bottom:2px solid var(--day-light);padding:2rem 1.25rem 1.6rem;text-align:center;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--day);color:var(--badge-txt);font-size:clamp(.66rem,2.6vw,.8rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.4rem 1.1rem;border-radius:99px;margin-bottom:.8rem;white-space:nowrap;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);letter-spacing:.14em;margin-bottom:.5rem;}
.hero h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.5rem,6vw,2.1rem);font-weight:900;line-height:1.15;color:var(--text);}
.hero h1 .hl{color:var(--day-title);}
.hero .subtitle{color:var(--muted);font-size:clamp(.82rem,3vw,.92rem);margin-top:.5rem;}
.level-pills{display:flex;gap:.4rem;justify-content:center;margin-top:.9rem;flex-wrap:wrap;}
.lp{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;padding:.3rem .7rem;border-radius:99px;border:2px solid var(--day-border);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.lp.active{background:var(--day);color:#fff;border-color:var(--day);}
.gamebox{max-width:760px;margin:1.3rem auto 0;padding:0 1.25rem;}
.scoreboard-sticky{position:sticky;top:0;z-index:5;}
.gb-inner{background:var(--surface);border:2px solid var(--day-border);border-radius:14px;padding:1rem;box-shadow:0 4px 16px var(--day-glow);}
.gb-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.16em;color:var(--day-dark);text-align:center;margin-bottom:.6rem;text-transform:uppercase;}
.scoreboard{display:flex;gap:.5rem;margin-bottom:.8rem;}
.sb{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:.5rem .3rem;text-align:center;}
.sb .v{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:clamp(2rem,7vw,2.4rem);line-height:1;}
.sb .l{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.1em;color:var(--muted);margin-top:.25rem;text-transform:uppercase;}
.sb.ok{border-color:#c7e89a;} .sb.ok .v{color:var(--green);}
.sb.rem{border-color:var(--day-border);} .sb.rem .v{color:var(--day-dark);}
.sb.err{border-color:#f4c4bf;} .sb.err .v{color:var(--red);}
.xp-bg{background:var(--border);border-radius:99px;height:13px;overflow:hidden;}
.xp-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--day-border));transition:width .6s ease;}
.xp-txt{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--day-dark);text-align:right;margin-top:.3rem;letter-spacing:.08em;}
.main{max-width:760px;margin:0 auto;padding:1.3rem 1.25rem 0;}
.card{background:var(--surface);border:2px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.3rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.card-stripe{height:5px;background:linear-gradient(90deg,#f28b82,#f5a623,#8dc63f,#3ab5d8,#f5c518);}
.card-inner{padding:1.4rem 1.2rem;}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:.9rem;flex-wrap:wrap;}
.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:900;flex-shrink:0;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.q-cat{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;padding:.2rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;margin-left:auto;white-space:nowrap;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1.1rem,4vw,1.4rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.5;}
.q-text{font-size:.92rem;color:var(--text);margin-bottom:.9rem;line-height:1.75;}
.q-text b{color:var(--day-dark);}
.input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.6rem;}
.input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:var(--text);}
.answer-input{width:130px;background:#fff;border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:.55rem .7rem;outline:none;transition:border-color .2s;min-height:2.7rem;text-align:center;}
.answer-input:focus{border-color:var(--day);box-shadow:0 0 0 3px var(--day-glow);}
.answer-input.correct-input{border-color:var(--green-soft);background:#f0faeb;}
.answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}
/* Tables et grilles (distributivité, Yohaku) */
.gridwrap{display:flex;justify-content:center;margin-bottom:1rem;overflow-x:auto;}
.distrib-table{border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:.95rem;}
.distrib-table th,.distrib-table td{border:2px solid var(--day-border);padding:.4rem .2rem;text-align:center;min-width:62px;}
.distrib-table th{background:var(--day);color:#fff;font-weight:800;}
.distrib-table td{background:#fff;color:var(--day-dark);font-weight:700;}
.distrib-table td.cell-in{padding:.2rem;}
.distrib-table .corner{background:var(--day-light);color:var(--day-dark);}
.distrib-table input{width:54px;border:2px solid var(--border);border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:.95rem;text-align:center;padding:.3rem .1rem;min-height:2.3rem;outline:none;}
.distrib-table input:focus{border-color:var(--day);box-shadow:0 0 0 2px var(--day-glow);}
.distrib-table input.correct-input{border-color:var(--green-soft);background:#f0faeb;}
.distrib-table input.wrong-input{border-color:var(--pink);background:#fff0ef;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.3rem;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;letter-spacing:.04em;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s,background .15s;min-height:2.7rem;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);} .btn:disabled{opacity:.4;cursor:default;}
.btn-check{background:var(--green);color:#fff;}
.btn-check:hover:not(:disabled){box-shadow:0 4px 14px rgba(95,168,0,.4);}
.btn-hint{background:#fff;border:2px solid var(--day);color:var(--day-dark);}
.btn-hint:hover{background:var(--day-light);}
.btn-retry{background:#fff;border:2px solid var(--day-dark);color:var(--day-dark);}
.btn-retry:hover{background:var(--day-light);}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem;}
.hint-box{margin-top:.9rem;background:var(--day-light);border:1.5px dashed var(--day-dark);border-radius:10px;padding:.7rem 1rem;font-size:.82rem;color:var(--day-dark);display:none;line-height:1.7;font-family:'JetBrains Mono',monospace;}
.hint-box.show{display:block;}
.fb{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;font-size:.88rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
.fb.show{display:flex;}
.fb.ok{background:#f0faeb;border:1.5px solid var(--green-soft);color:#3a7d0a;}
.fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
.fb-icon{font-size:1.4rem;flex-shrink:0;}
.fb-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.7;}
.results{display:none;}.results.show{display:block;}
.results-card{background:var(--surface);border:2px solid var(--day-border);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px var(--day-glow);margin-bottom:1.3rem;}
.results-inner{padding:2rem 1.3rem;text-align:center;}
.results-trophy{font-size:3.4rem;animation:bounce 3s infinite;display:block;margin-bottom:.3rem;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-7px) rotate(5deg);}}
.results-score{font-family:'JetBrains Mono',monospace;font-size:clamp(2.6rem,11vw,4rem);font-weight:900;line-height:1;margin:.3rem 0 .2rem;}
.results-score .s-num{color:var(--green);}
.stars-row{font-size:1.9rem;margin:.3rem 0 .9rem;letter-spacing:.15rem;}
.results-msg{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:.95rem;margin-bottom:1.4rem;letter-spacing:.03em;}
.restart-wrap{max-width:760px;margin:0 auto;padding:0 1.25rem;text-align:center;}
.btn-restart{background:var(--day);color:#fff;font-size:.95rem;padding:.85rem 2rem;}
.btn-restart:hover{background:var(--day-dark);}
footer{text-align:center;margin-top:2.2rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.06em;}
@media(max-width:560px){.scoreboard{gap:.35rem;}.sb{padding:.45rem .12rem;}.sb .v{font-size:1.9rem;}}
@media(max-width:480px){.hero{padding:1.6rem 1rem 1.4rem;}.main,.gamebox,.restart-wrap{padding:0 1rem;}.card-inner{padding:1.2rem 1rem;}.btn-row{flex-direction:column;}.btn-check,.btn-hint,.btn-retry{width:100%;}}
</style>
</head>
<body>
<div class="frame">
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
  <div class="layer">
    <div class="hero">
      <div class="logo-badge">
        <span class="logo-dot" style="background:#f28b82"></span>
        <span class="logo-dot" style="background:#f6b8b1"></span>
        <span class="logo-dot" style="background:#b03a30"></span>
        Pazapa &middot; Maths &middot; 3&egrave;me
      </div>
      <div class="week-label">SEMAINE 3 &mdash; JOUR 2</div>
      <h1>&#9999;&#65039; <span class="hl">S&eacute;rie d'exercices</span><br>Niveau 3 &middot; Expert</h1>
      <p class="subtitle">D&eacute;velopper : identit&eacute;s, double distributivit&eacute;, grilles</p>
      <div class="level-pills">
        <span class="lp ">Niveau 1</span>
        <span class="lp ">Niveau 2</span>
        <span class="lp active">Niveau 3</span>
      </div>
    </div>
    <div class="gamebox scoreboard-sticky">
      <div class="gb-inner">
        <div class="gb-label">&#9654; D&eacute;velopper &middot; Niveau 3 Expert</div>
        <div class="scoreboard">
          <div class="sb ok"><div class="v" id="h-ok">0</div><div class="l">R&eacute;ussies</div></div>
          <div class="sb rem"><div class="v" id="h-rem">4</div><div class="l">Restantes</div></div>
          <div class="sb err"><div class="v" id="h-ko">0</div><div class="l">Erreurs</div></div>
        </div>
        <div class="xp-bg"><div class="xp-fill" id="bar"></div></div>
        <div class="xp-txt" id="prog">0 / 4</div>
      </div>
    </div>
    <div class="main">
      <div id="cards"></div>
      <div class="results" id="results-screen">
        <div class="results-card"><div class="card-stripe"></div><div class="results-inner">
          <span class="results-trophy">&#127942;</span>
          <div class="results-score"><span class="s-num" id="score-num">0</span>/<span id="score-tot">4</span></div>
          <div class="stars-row" id="stars-row"></div>
          <div class="results-msg" id="results-msg"></div>
        </div></div>
      </div>
      <div class="restart-wrap"><button class="btn btn-restart" onclick="restart()">&#128260; Recommencer</button></div>
      <footer>N3 &middot; S3 &middot; J2 &middot; S&eacute;rie Niveau 3 Expert &middot; Pazapa Maths 3&egrave;me</footer>
    </div>
  </div>
</div>
<script>
var LEVEL=3;
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

function termX(c){if(c===0)return"";if(c===1)return"x";if(c===-1)return"-x";return c+"x";}
function paren(v){return v<0?("("+v+")"):(""+v);}
/* écrit ax + b proprement */
function aff(a,b){
  var s="";
  if(a===0){return ""+b;}
  s=termX(a);
  if(b>0)s+=" + "+b;else if(b<0)s+=" - "+Math.abs(b);
  return s;
}
/* écrit un binôme dans une parenthèse: (ax + b) */
function binom(a,b){return "("+aff(a,b)+")";}

function genExercises(){
  var exs=[];

  /* Exo 1 — Développer (ax-b)(ax+b) = a²x² - b² (valeurs plus grandes) */
  (function(){
    var a=pick([2,3,4]), b=pick([3,4,5,6,7]);
    var cx2=a*a, cc=-b*b;
    exs.push({kind:"multi",cat:"Identit\u00e9 (a\u2212b)(a+b)",
      q:"D\u00e9veloppe en utilisant l'identit\u00e9 (a\u2212b)(a+b) = a\u00b2 \u2212 b\u00b2. Donne le coefficient de x\u00b2, puis la constante.",
      eq:"("+termX(a)+" \u2212 "+b+")("+termX(a)+" + "+b+") = ?",
      fields:[{label:"Coefficient de x\u00b2 =",ans:cx2},{label:"Constante =",ans:cc}],
      method:"("+termX(a)+")\u00b2 \u2212 "+b+"\u00b2 = "+cx2+"x\u00b2 \u2212 "+(b*b)+" = <strong>"+cx2+"x\u00b2 \u2212 "+(b*b)+"</strong>.",
      hint:"(a\u2212b)(a+b) = a\u00b2 \u2212 b\u00b2, avec a = "+termX(a)+" et b = "+b+". Le terme en x s'\u00e9limine."});
  })();

  /* Exo 2 — Double distributivité corsée (ax+b)(cx+d) avec coefficients jusqu'à 4 */
  (function(){
    var a=pick([2,3,4]), c=pick([2,3,4]);
    var b=pick([-4,-3,-2,2,3,4]), d=pick([-4,-3,-2,2,3,4]);
    var cx2=a*c, cx=a*d+b*c, cc=b*d;
    exs.push({kind:"multi",cat:"Double distrib.",
      q:"D\u00e9veloppe et r\u00e9duis. Donne le coefficient de x\u00b2, celui de x, puis la constante.",
      eq:binom(a,b)+binom(c,d)+" = ?",
      fields:[{label:"Coefficient de x\u00b2 =",ans:cx2},{label:"Coefficient de x =",ans:cx},{label:"Constante =",ans:cc}],
      method:binom(a,b)+binom(c,d)+" = "+cx2+"x\u00b2"+(cx>=0?" + "+cx:" - "+Math.abs(cx))+"x"+(cc>=0?" + "+cc:" - "+Math.abs(cc))+".",
      hint:"Chaque terme de la 1re parenth\u00e8se multiplie chaque terme de la 2e (4 produits), puis regroupe les x."});
  })();

  /* Exo 3 — Compléter une table de double distributivité (ax+b)(cx+d) */
  (function(){
    var a=pick([1,2,3]), c=pick([1,2,3]);
    var b=pick([2,3,4]), d=pick([2,3,4]);
    var p11=a*c, p12=a*d, p21=b*c, p22=b*d;  // ax*cx -> coef x², ax*d -> coef x, b*cx -> coef x, b*d -> cste
    var gridHTML='<div class="gridwrap"><table class="distrib-table">'
      +'<tr><th class="corner">\u00d7</th><th>'+termX(c)+'</th><th>'+d+'</th></tr>'
      +'<tr><th>'+termX(a)+'</th><td class="cell-in"><input type="number" id="GRID_0" placeholder="?"/></td><td class="cell-in"><input type="number" id="GRID_1" placeholder="?"/></td></tr>'
      +'<tr><th>'+b+'</th><td class="cell-in"><input type="number" id="GRID_2" placeholder="?"/></td><td class="cell-in"><input type="number" id="GRID_3" placeholder="?"/></td></tr>'
      +'</table></div>';
    exs.push({kind:"grid",cat:"Table double distrib.",
      q:"<b>Table de double distributivit\u00e9.</b> Compl\u00e8te la grille pour "+binom(a,b)+binom(c,d)+". "
        +"Pour chaque case, entre seulement le <b>coefficient</b> (un nombre) : case x\u00d7x \u2192 coef de x\u00b2, cases mixtes \u2192 coef de x, case nombre\u00d7nombre \u2192 constante.",
      gridHTML:gridHTML,
      fields:[{ans:p11,type:"num"},{ans:p12,type:"num"},{ans:p21,type:"num"},{ans:p22,type:"num"}],
      method:termX(a)+"\u00d7"+termX(c)+" = "+p11+"x\u00b2 ; "+termX(a)+"\u00d7"+d+" = "+p12+"x ; "+b+"\u00d7"+termX(c)+" = "+p21+"x ; "+b+"\u00d7"+d+" = "+p22+". "
        +"En regroupant : "+(p11)+"x\u00b2 + "+(p12+p21)+"x + "+p22+".",
      hint:"Chaque case = (terme de la ligne) \u00d7 (terme de la colonne). Donne le coefficient (sans le x)."});
  })();

  /* Exo 4 — Rose multiplicative : grille où produits de monômes/nombres doivent coïncider */
  (function(){
    // 3 "pétales" : on donne deux facteurs par pétale, l'élève calcule chaque produit.
    var f1=pick([2,3,4]), f2=pick([2,3,4]);
    var g1=pick([2,3,4]), g2=pick([2,3,5]);
    var h1=pick([2,3,4]), h2=pick([2,3,5]);
    var p1=f1*f2, p2=g1*g2, p3=h1*h2;
    var gridHTML='<div class="gridwrap"><table class="distrib-table">'
      +'<tr><th>P\u00e9tale</th><th>Facteur A</th><th>Facteur B</th><th>Produit</th></tr>'
      +'<tr><th>\ud83c\udf38 1</th><td>'+f1+'</td><td>'+f2+'</td><td class="cell-in"><input type="number" id="GRID_0" placeholder="?"/></td></tr>'
      +'<tr><th>\ud83c\udf38 2</th><td>'+g1+'</td><td>'+g2+'</td><td class="cell-in"><input type="number" id="GRID_1" placeholder="?"/></td></tr>'
      +'<tr><th>\ud83c\udf38 3</th><td>'+h1+'</td><td>'+h2+'</td><td class="cell-in"><input type="number" id="GRID_2" placeholder="?"/></td></tr>'
      +'</table></div>';
    exs.push({kind:"grid",cat:"Rose multiplicative",
      q:"<b>Rose multiplicative.</b> Pour chaque p\u00e9tale, calcule le <b>produit</b> des deux facteurs et compl\u00e8te la derni\u00e8re colonne.",
      gridHTML:gridHTML,
      fields:[{ans:p1,type:"num"},{ans:p2,type:"num"},{ans:p3,type:"num"}],
      method:"P\u00e9tale 1 : "+f1+"\u00d7"+f2+" = "+p1+" ; p\u00e9tale 2 : "+g1+"\u00d7"+g2+" = "+p2+" ; p\u00e9tale 3 : "+h1+"\u00d7"+h2+" = "+p3+".",
      hint:"Chaque produit = Facteur A \u00d7 Facteur B de la ligne."});
  })();

  return exs;
}

var EXOS=genExercises(),TOTAL=EXOS.length;
var answers=new Array(TOTAL).fill(null);
function $(id){return document.getElementById(id);}
function buildAll(){
  var host=$("cards");host.innerHTML="";
  EXOS.forEach(function(ex,i){
    var card=document.createElement("div");card.className="card";card.id="card-"+i;
    var inner='<div class="card-stripe"></div><div class="card-inner">'
      +'<div class="q-header"><div class="step-num">'+(i+1)+'</div><div class="q-num">Exercice '+(i<9?"0":"")+(i+1)+'</div>'
      +'<div class="q-cat">'+ex.cat+'</div></div>'
      +'<div class="q-text">'+ex.q+'</div>';
    if(ex.eq) inner+='<div class="eq-box">'+ex.eq+'</div>';
    if(ex.kind==="grid"){
      // injecter la grille avec ids uniques inp-i-fi
      var g=ex.gridHTML;
      ex.fields.forEach(function(f,fi){ g=g.replace("GRID_"+fi, "inp-"+i+"-"+fi); });
      inner+=g;
    }else if(ex.kind==="multi"){
      ex.fields.forEach(function(f,fi){
        inner+='<div class="input-row"><span class="input-label">'+f.label+'</span><input type="number" class="answer-input" id="inp-'+i+'-'+fi+'" placeholder="?" step="any"/></div>';
      });
    }else{
      inner+='<div class="input-row"><span class="input-label">'+ex.label+'</span><input type="number" class="answer-input" id="inp-'+i+'" placeholder="?" step="any"/></div>';
    }
    inner+='<div class="btn-row"><button class="btn btn-check" id="chk-'+i+'" onclick="check('+i+')">&#10003; Valider</button>'
      +'<button class="btn btn-hint" onclick="toggleHint('+i+')">? Indice</button>'
      +'<button class="btn btn-retry" id="retry-'+i+'" onclick="retry('+i+')" style="display:none;">&#8635; R&eacute;essayer</button></div>'
      +'<div class="hint-box" id="hint-'+i+'"></div>'
      +'<div class="fb" id="fb-'+i+'"><span class="fb-icon" id="fbi-'+i+'"></span><div><div id="fbm-'+i+'"></div><div class="fb-detail" id="fbd-'+i+'"></div></div></div>'
      +'</div>';
    card.innerHTML=inner;host.appendChild(card);
  });
  updateScore();
}
function check(i){
  var ex=EXOS[i],fb=$("fb-"+i),correct,raw;
  if(ex.kind==="multi"||ex.kind==="grid"){
    var allFilled=true, allCorrect=true, firstEmpty=null;
    ex.fields.forEach(function(f,fi){
      var v=$("inp-"+i+"-"+fi).value;
      if(v===""){allFilled=false; if(firstEmpty===null)firstEmpty=fi;}
      else if(parseFloat(v)!==f.ans){allCorrect=false;}
    });
    if(!allFilled){$("inp-"+i+"-"+firstEmpty).focus();return;}
    correct=allCorrect;
  }else{
    raw=$("inp-"+i).value;if(raw===""){$("inp-"+i).focus();return;}
    correct=(parseFloat(raw)===ex.ans);
  }
  if(correct){
    answers[i]=1;fb.className="fb show ok";$("fbi-"+i).textContent="\u2705";
    $("fbm-"+i).textContent=pick(["\uD83C\uDF89 Bravo !","\u26a1 Parfait !","\uD83C\uDF1F Tr\u00e8s bien !","\uD83C\uDFC6 Excellent !"]);
    $("fbd-"+i).innerHTML=ex.method;
    if(ex.kind==="multi"||ex.kind==="grid"){ex.fields.forEach(function(f,fi){var el=$("inp-"+i+"-"+fi);el.disabled=true;el.className=(ex.kind==="grid"?"correct-input":"answer-input correct-input");});}
    else{$("inp-"+i).disabled=true;$("inp-"+i).className="answer-input correct-input";}
    $("chk-"+i).disabled=true;$("retry-"+i).style.display="none";updateScore();
  }else{
    fb.className="fb show ko";$("fbi-"+i).textContent="\u274C";
    $("fbm-"+i).textContent="Pas tout \u00e0 fait\u2026 r\u00e9essaie !";
    $("fbd-"+i).innerHTML="\uD83D\uDCA1 Clique <strong>? Indice</strong> pour de l'aide, puis <strong>R\u00e9essayer</strong>.";
    if(ex.kind==="multi"||ex.kind==="grid"){ex.fields.forEach(function(f,fi){$("inp-"+i+"-"+fi).className=(ex.kind==="grid"?"wrong-input":"answer-input wrong-input");});}
    else{$("inp-"+i).className="answer-input wrong-input";}
    $("chk-"+i).disabled=true;$("retry-"+i).style.display="inline-flex";
  }
}
function retry(i){
  var ex=EXOS[i];
  if(ex.kind==="multi"||ex.kind==="grid"){ex.fields.forEach(function(f,fi){var el=$("inp-"+i+"-"+fi);el.value="";el.disabled=false;el.className=(ex.kind==="grid"?"":"answer-input");});$("inp-"+i+"-0").focus();}
  else{$("inp-"+i).value="";$("inp-"+i).disabled=false;$("inp-"+i).className="answer-input";$("inp-"+i).focus();}
  $("fb-"+i).className="fb";$("chk-"+i).disabled=false;$("retry-"+i).style.display="none";
}
function toggleHint(i){var h=$("hint-"+i);if(h.classList.contains("show")){h.classList.remove("show");}else{h.innerHTML="<strong>\uD83D\uDCA1 Indice :</strong> "+EXOS[i].hint;h.classList.add("show");}}
function updateScore(){
  var ok=answers.filter(function(a){return a!==null;}).length;
  $("h-ok").textContent=ok;$("h-rem").textContent=TOTAL-ok;
  $("bar").style.width=Math.round(ok/TOTAL*100)+"%";$("prog").textContent=ok+" / "+TOTAL;
  if(ok>=TOTAL)showResults();else $("results-screen").classList.remove("show");
}
function showResults(){
  $("score-num").textContent=TOTAL;$("score-tot").textContent=TOTAL;
  $("stars-row").textContent="\u2B50\u2B50\u2B50\u2B50\u2B50";
  $("results-msg").textContent="\uD83C\uDF89 S\u00e9rie Niveau "+LEVEL+" termin\u00e9e ! Bravo.";
  $("results-screen").classList.add("show");
}
function restart(){EXOS=genExercises();answers=new Array(TOTAL).fill(null);$("results-screen").classList.remove("show");buildAll();window.scrollTo({top:0,behavior:"smooth"});}
buildAll();
</script>
