<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths &mdash; 3e &mdash; Factoriser expression complexe &mdash; Niveau 3</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#3ab5d8;--day-dark:#1a6e88;--day-light:#e8f6fb;--day-border:#9dd4e8;
  --day-glow:rgba(58,181,216,.25);
  --bg:#fffdf7;--surface:#fff;--border:#e8e4d9;
  --yellow:#f5c518;--green:#8dc63f;--pink:#f28b82;--orange:#f5a623;
  --text:#1a1d23;--muted:#8a8f9a;--radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.5rem 1rem 4rem;position:relative;overflow-x:hidden;line-height:1.6;}
body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.12;
  width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.12;
  width:260px;height:260px;background:var(--day);bottom:-60px;left:-60px;pointer-events:none;}
.bub1{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:180px;height:180px;
  background:var(--day);bottom:120px;right:-40px;pointer-events:none;}
.bub2{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:120px;height:120px;
  background:var(--yellow);top:200px;left:-30px;pointer-events:none;}

/* ── Head card ── */
.head-card{width:100%;max-width:700px;background:var(--day-light);border:2px solid var(--day-border);
  border-radius:var(--radius);padding:1.7rem 1.4rem 1.5rem;text-align:center;
  position:relative;z-index:1;margin-bottom:1.2rem;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--day);color:#fff;
  font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:.35rem 1rem;border-radius:99px;margin-bottom:.6rem;
  box-shadow:0 3px 10px var(--day-glow);}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-lbl{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--day-dark);
  margin-bottom:.4rem;letter-spacing:.06em;}
.head-card h1{font-size:clamp(1.3rem,4.5vw,1.8rem);font-weight:900;line-height:1.2;}
.head-card h1 .hl{color:var(--day-dark);}
.head-card h1 .lvl{color:var(--text);font-size:clamp(1.5rem,5vw,2rem);font-weight:900;}
.head-card .sub{color:var(--muted);font-size:.95rem;margin-top:.4rem;
  font-family:'JetBrains Mono',monospace;}
.level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.1rem;}
.level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.88rem;
  letter-spacing:.06em;text-transform:uppercase;padding:.55rem 1.1rem;border-radius:10px;
  border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);
  text-decoration:none;min-height:2.8rem;display:inline-flex;align-items:center;}
.level-btn.active{background:var(--day);color:#fff;border-color:var(--day);
  box-shadow:0 3px 10px var(--day-glow);}

/* ── Score ── */
.score-strip{width:100%;max-width:700px;background:var(--surface);
  border:2px solid var(--border);border-radius:14px;padding:.9rem 1.1rem;
  margin-bottom:1.3rem;position:relative;z-index:1;
  box-shadow:0 4px 16px rgba(0,0,0,.05);}
.score-inner{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;}
.sc-box{flex:1;min-width:70px;background:var(--day-light);border:1.5px solid var(--day-border);
  border-radius:10px;padding:.6rem .4rem;text-align:center;}
.sc-num{font-family:'JetBrains Mono',monospace;font-size:1.6rem;font-weight:900;
  color:var(--day-dark);line-height:1;}
.sc-lbl{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;margin-top:.2rem;}
.prog-bg{flex:3;min-width:120px;background:var(--border);border-radius:99px;height:10px;overflow:hidden;}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--day),var(--yellow));
  border-radius:99px;transition:width .5s ease;}

/* ── Section ── */
.section-wrap{width:100%;max-width:700px;position:relative;z-index:1;}
.sec-header{display:flex;align-items:center;gap:.8rem;margin:1.4rem 0 .5rem;
  padding:.7rem 1rem;background:var(--day-light);border:1.5px solid var(--day-border);
  border-radius:10px;}
.sec-num{width:32px;height:32px;border-radius:50%;background:var(--day);color:#fff;
  font-family:'JetBrains Mono',monospace;font-weight:900;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sec-title{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.9rem;
  color:var(--day-dark);letter-spacing:.04em;}
.sec-badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;
  background:var(--day);color:#fff;padding:.15rem .55rem;border-radius:4px;
  text-transform:uppercase;letter-spacing:.08em;margin-left:auto;}
.sec-consigne{font-size:.9rem;color:var(--day-dark);font-weight:600;
  margin-bottom:.9rem;padding:0 .2rem;line-height:1.7;}

/* ── Question card ── */
.qcard{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
  padding:1.3rem 1.2rem 1.1rem;margin-bottom:.9rem;position:relative;
  box-shadow:0 3px 14px rgba(0,0,0,.05);overflow:hidden;}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--day),var(--yellow),var(--orange),var(--pink));}
.q-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;}
.q-badge{background:var(--day-light);border:1.5px solid var(--day-border);border-radius:6px;
  font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;
  color:var(--day-dark);padding:.15rem .6rem;text-transform:uppercase;letter-spacing:.08em;}
.q-letter{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:900;
  color:var(--day-dark);}
.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:10px;
  padding:.75rem 1rem;margin:.4rem 0 .8rem;font-family:'JetBrains Mono',monospace;
  font-size:clamp(.95rem,3.2vw,1.25rem);font-weight:700;color:var(--day-dark);text-align:center;
  word-break:break-word;line-height:1.5;}
.inp-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem;}
.inp-lbl{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;
  color:var(--day-dark);}
.answer-input{background:var(--bg);border:2px solid var(--border);border-radius:9px;
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1rem;
  padding:.5rem .85rem;outline:none;transition:border-color .2s,box-shadow .2s;
  min-height:2.7rem;flex:1;min-width:min(200px,50vw);}
.answer-input:focus{border-color:var(--day);box-shadow:0 0 0 3px var(--day-glow);}
.answer-input.ok-inp{border-color:var(--green);background:#f0faeb;}
.answer-input.ko-inp{border-color:var(--pink);background:#fff0ef;}
.answer-input:disabled{opacity:.85;}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.55rem 1.1rem;
  border-radius:9px;font-family:'JetBrains Mono',monospace;font-size:.82rem;
  font-weight:700;cursor:pointer;border:none;min-height:2.7rem;
  transition:transform .1s,box-shadow .15s;text-transform:uppercase;letter-spacing:.04em;}
.btn:active{transform:scale(.96);} .btn:disabled{opacity:.38;cursor:default;}
.btn-ok{background:var(--day);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
.btn-ok:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
.btn-sol{background:#fff;border:2px solid var(--day-border);color:var(--day-dark);display:none;}
.btn-sol.vis{display:inline-flex;}
.btn-sol:hover{background:var(--day-light);}
.btn-rst{background:#fff;border:2px solid var(--border);color:var(--muted);}
.btn-rst:hover{border-color:var(--pink);color:#a93226;}
.btn-hint{background:#fff;border:2px solid var(--orange);color:#c47a10;}
.btn-hint:hover{background:#fff5e0;}
/* feedback */
.fb{display:none;margin-top:.7rem;padding:.65rem .85rem;border-radius:9px;
  font-family:'JetBrains Mono',monospace;font-size:.86rem;font-weight:700;line-height:1.7;}
.fb.show{display:block;}
.fb.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
.fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#a93226;}
/* hint */
.hint-box{display:none;margin-top:.6rem;background:#fffbeb;border:1.5px dashed var(--yellow);
  border-radius:9px;padding:.65rem .9rem;font-size:.84rem;color:#7a6010;
  font-family:'JetBrains Mono',monospace;line-height:1.7;}
.hint-box.show{display:block;}
/* solution */
.sol-box{display:none;margin-top:.5rem;background:var(--day-light);border:1.5px solid var(--day-border);
  border-radius:9px;padding:.65rem .9rem;font-size:.86rem;color:var(--day-dark);
  font-family:'JetBrains Mono',monospace;line-height:1.8;word-break:break-word;}
.sol-box.show{display:block;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.qcard{animation:fadeUp .3s ease both;}
@media(max-width:480px){.btn-row{flex-direction:column;}.btn{width:100%;}}
</style>
</head>
<body>
<div class="bub1"></div><div class="bub2"></div>

<div class="head-card">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    PAZAPA &middot; MATHS &middot; 3&Egrave;ME
  </div>
  <div class="week-lbl">Semaine 3 &ndash; Jour 4</div>
  <h1>
    <span class="hl">&#9999;&#65039; S&eacute;rie d&rsquo;exercices</span><br>
    <span class="lvl">Niveau 3</span>
  </h1>
  <p class="sub">Factoriser une expression litt&eacute;rale complexe</p>
  <div class="level-row">
    <span class="level-btn">Niveau 1</span>
    <span class="level-btn">Niveau 2</span>
    <span class="level-btn active">Niveau 3</span>
  </div>
</div>

<div class="score-strip">
  <div class="score-inner">
    <div class="sc-box"><div class="sc-num" id="sc-ok">0</div><div class="sc-lbl">R&eacute;ussis</div></div>
    <div class="sc-box"><div class="sc-num" id="sc-rem">14</div><div class="sc-lbl">Restants</div></div>
    <div class="sc-box"><div class="sc-num" id="sc-ko">0</div><div class="sc-lbl">Erreurs</div></div>
    <div class="prog-bg"><div class="prog-fill" id="prog"></div></div>
  </div>
</div>

<div class="section-wrap" id="exos"></div>

<!-- ══ CALCULATRICE fx-92 ══ -->
<style>
.fxc-trig{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:0;}
.fxc-trig svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
.fxc-pill{background:var(--day-dark);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.04em;}
.fxc-hidden{display:none!important;}
.fxc-panel{position:fixed;right:14px;bottom:14px;z-index:9999;width:312px;max-width:94vw;background:#2f343b;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-family:'JetBrains Mono',monospace;overflow:hidden;border:2px solid var(--day);}
.fxc-bar{background:#23272d;color:#cfd6de;font-size:12.5px;font-weight:700;padding:9px 10px;cursor:move;touch-action:none;user-select:none;display:flex;align-items:center;gap:6px;}
.fxc-bar .fxc-sp{flex:1;}
.fxc-icon{background:#3a4049;color:#fff;border:none;width:26px;height:26px;border-radius:7px;font-size:13px;cursor:pointer;line-height:1;}
.fxc-icon:hover{background:var(--day);color:#fff;}
.fxc-help-txt{background:#23272d;color:#aeb6bf;font-size:11.5px;line-height:1.7;padding:8px 12px;border-top:1px solid #3a4049;}
.fxc-screen{background:#d7e3c8;margin:10px;border-radius:8px;padding:8px 10px;min-height:64px;display:flex;flex-direction:column;justify-content:center;border:2px solid #aab79a;}
.fxc-expr{font-size:13px;color:#4a5340;text-align:right;min-height:16px;word-break:break-all;}
.fxc-res{font-size:23px;font-weight:800;color:#222;text-align:right;word-break:break-all;}
.fxc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 10px 12px;}
.fxc-k{background:#454c55;color:#fff;border:none;border-radius:9px;padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;cursor:pointer;min-height:40px;transition:transform .08s;}
.fxc-k:active{transform:scale(.94);} .fxc-k:hover{background:#525a64;}
.fxc-k.fn{background:#3a4049;font-size:12px;color:var(--day);}
.fxc-k.op{color:var(--day);} .fxc-k.eq{background:#3a7bd5;color:#fff;} .fxc-k.blank{background:transparent;cursor:default;}
</style>
<button id="fxc-trig" class="fxc-trig" aria-label="Calculatrice">
  <svg width="62" height="86" viewBox="0 0 62 86" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="fg5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcefe8"/><stop offset="1" stop-color="#bcdcd5"/></linearGradient></defs>
    <rect x="1" y="1" width="60" height="84" rx="9" fill="url(#fg5)" stroke="#8fb3aa" stroke-width="1.5"/>

    <rect x="8" y="26" width="46" height="17" rx="2" fill="#c4d3a6" stroke="#9aa985"/>
    <circle cx="15" cy="54" r="7" fill="#7fb8ac" stroke="#5e948a"/><circle cx="15" cy="54" r="2.5" fill="#3a4f49"/>
    <g fill="#5a6b66"><rect x="27" y="49" width="7" height="4" rx="1"/><rect x="37" y="49" width="7" height="4" rx="1"/><rect x="47" y="49" width="7" height="4" rx="1"/><rect x="27" y="56" width="7" height="4" rx="1"/><rect x="37" y="56" width="7" height="4" rx="1"/><rect x="47" y="56" width="7" height="4" rx="1"/></g>
    <g fill="#7a8b86"><rect x="8" y="64" width="7" height="4" rx="1"/><rect x="18" y="64" width="7" height="4" rx="1"/><rect x="28" y="64" width="7" height="4" rx="1"/><rect x="8" y="71" width="7" height="4" rx="1"/><rect x="18" y="71" width="7" height="4" rx="1"/><rect x="28" y="71" width="7" height="4" rx="1"/></g>
    <rect x="40" y="64" width="14" height="4" rx="1" fill="#c0392b"/>
    <rect x="40" y="71" width="14" height="6" rx="1.5" fill="#3a7bd5"/>
  </svg>
  <span class="fxc-pill">Calculatrice</span>
</button>
<div id="fxc-panel" class="fxc-panel fxc-hidden">
  <div class="fxc-bar" id="fxc-bar">&#9776; fx-92<span class="fxc-sp"></span>
    <button class="fxc-icon" id="fxc-hb">?</button>
    <button class="fxc-icon" id="fxc-cb">&#10005;</button>
  </div>
  <div class="fxc-help-txt fxc-hidden" id="fxc-help">&divide;R reste &middot; FACT &middot; PGCD &middot; PPCM &middot; a/b &middot; &radic; x&sup2; ^</div>

  <div class="fxc-keys" id="fxc-keys"></div>
</div>

<script>
/* ══ DONNÉES ══ */
var SECTIONS=[
  { n:1, badge:'Mise en évidence',
    consigne:'Factoriser les expressions suivantes.',
    qs:[
      { id:'1a', lbl:'A',
        eq:'8a &minus; 8b',
        type:'multi', tests:[{a:2,b:3},{a:-1,b:4},{a:5,b:-2},{a:3,b:-1}],
        enc:'8(a-b)',
        hint:'Le facteur commun des deux termes est <strong>8</strong>.',
        sol:'A = 8(a &minus; b)' },
      { id:'1b', lbl:'B',
        eq:'21 + 3a',
        type:'multi', tests:[{a:2},{a:-1},{a:5},{a:3}],
        enc:'3(7+a)',
        hint:'Le facteur commun des deux termes est <strong>3</strong>.',
        sol:'B = 3(7 + a)' },
      { id:'1c', lbl:'C',
        eq:'15a + 20b',
        type:'multi', tests:[{a:2,b:3},{a:-1,b:4},{a:5,b:-2},{a:3,b:-1}],
        enc:'5(3a+4b)',
        hint:'Le facteur commun des deux termes est <strong>5</strong>.',
        sol:'C = 5(3a + 4b)' },
      { id:'1d', lbl:'D',
        eq:'17x² &minus; 5x',
        type:'multi', tests:[{x:2},{x:-1},{x:5},{x:3}],
        enc:'x(17x-5)',
        hint:'Le facteur commun des deux termes est <strong>x</strong>.',
        sol:'D = x(17x &minus; 5)' }
    ]
  },
  { n:2, badge:'Facteur commun binomial',
    consigne:'Factoriser les expressions suivantes.',
    qs:[
      { id:'2a', lbl:'A',
        eq:'(a + 2)(a &minus; 3) + (a + 2)(3a + 5)',
        type:'multi', tests:[{a:2},{a:-1},{a:5},{a:3}],
        enc:'(a+2)(4a+2)',
        hint:'Le facteur commun est <strong>(a + 2)</strong>. Additionne les termes restants.',
        sol:'A = (a + 2)(4a + 2)' },
      { id:'2b', lbl:'B',
        eq:'(y + 5)(2y + 12) + (y + 5)(y &minus; 4)',
        type:'multi', tests:[{y:2},{y:-1},{y:5},{y:3}],
        enc:'(y+5)(3y+8)',
        hint:'Le facteur commun est <strong>(y + 5)</strong>.',
        sol:'B = (y + 5)(3y + 8)' },
      { id:'2c', lbl:'C',
        eq:'(2b &minus; 3)(b + 1) + (b + 2)(2b &minus; 3)',
        type:'multi', tests:[{b:2},{b:-1},{b:5},{b:3}],
        enc:'(2b-3)(2b+3)',
        hint:'Le facteur commun est <strong>(2b &minus; 3)</strong>.',
        sol:'C = (2b &minus; 3)(2b + 3)' }
    ]
  },
  { n:3, badge:'Mise en évidence',
    consigne:'Factoriser les expressions suivantes.',
    qs:[
      { id:'3a', lbl:'A',
        eq:'4a + 4b + 4',
        type:'multi', tests:[{a:2,b:3},{a:-1,b:4},{a:5,b:-2},{a:3,b:-1}],
        enc:'4(a+b+1)',
        hint:'Le facteur commun des trois termes est <strong>4</strong>.',
        sol:'A = 4(a + b + 1)' },
      { id:'3b', lbl:'B',
        eq:'35 &minus; 7a',
        type:'multi', tests:[{a:2},{a:-1},{a:5},{a:3}],
        enc:'7(5-a)',
        hint:'Le facteur commun des deux termes est <strong>7</strong>.',
        sol:'B = 7(5 &minus; a)' },
      { id:'3c', lbl:'C',
        eq:'12a + 16b',
        type:'multi', tests:[{a:2,b:3},{a:-1,b:4},{a:5,b:-2},{a:3,b:-1}],
        enc:'4(3a+4b)',
        hint:'Le facteur commun des deux termes est <strong>4</strong>.',
        sol:'C = 4(3a + 4b)' },
      { id:'3d', lbl:'D',
        eq:'20x² + 4x',
        type:'multi', tests:[{x:2},{x:-1},{x:5},{x:3}],
        enc:'4x(5x+1)',
        hint:'Le facteur commun des deux termes est <strong>4x</strong>.',
        sol:'D = 4x(5x + 1)' }
    ]
  },
  { n:4, badge:'Facteur commun binomial',
    consigne:'Factoriser les expressions suivantes.',
    qs:[
      { id:'4a', lbl:'A',
        eq:'(2a + 1)(a &minus; 5) + (2a + 1)(2a + 6)',
        type:'multi', tests:[{a:2},{a:-1},{a:5},{a:3}],
        enc:'(2a+1)(3a+1)',
        hint:'Le facteur commun est <strong>(2a + 1)</strong>.',
        sol:'A = (2a + 1)(3a + 1)' },
      { id:'4b', lbl:'B',
        eq:'(2 &minus; 5y)(y + 12) + (2 &minus; 5y)(y &minus; 4)',
        type:'multi', tests:[{y:2},{y:-1},{y:5},{y:3}],
        enc:'(2-5y)(2y+8)',
        hint:'Le facteur commun est <strong>(2 &minus; 5y)</strong>.',
        sol:'B = (2 &minus; 5y)(2y + 8)' },
      { id:'4c', lbl:'C',
        eq:'(b + 1) + (b + 1)(5b &minus; 3)',
        type:'multi', tests:[{b:2},{b:-1},{b:5},{b:3}],
        enc:'(b+1)(5b-2)',
        hint:'Le facteur commun est <strong>(b + 1)</strong>. Note que (b+1) = (b+1) × 1.',
        sol:'C = (b + 1)(5b &minus; 2)' }
    ]
  }
];

var TOTAL=14, done={}, nOk=0, nKo=0;

/* ══ CALCUL ══ */
function calcSafe(str){
  var s=str,pos=0;
  function peek(){return pos<s.length?s[pos]:'';}
  function parseE(){var v=parseT();while(peek()==='+'){pos++;v+=parseT();}while(peek()==='-'){pos++;v-=parseT();}return v;}
  // Réécrit proprement
  function parseExpr(){
    var v=parseTerm();
    while(pos<s.length){
      if(s[pos]==='+'){pos++;v+=parseTerm();}
      else if(s[pos]==='-'){pos++;v-=parseTerm();}
      else break;
    }
    return v;
  }
  function parseTerm(){
    var v=parsePow();
    while(pos<s.length){
      if(s[pos]==='*'){pos++;v*=parsePow();}
      else if(s[pos]==='/'){pos++;var d=parsePow();if(d===0)return NaN;v/=d;}
      else break;
    }
    return v;
  }
  function parsePow(){var b=parsePrimary();if(pos<s.length&&s[pos]==='^'){pos++;var e=parsePow();return Math.pow(b,e);}return b;}
  function parsePrimary(){
    if(pos<s.length&&s[pos]==='('){pos++;var v=parseExpr();if(pos<s.length&&s[pos]===')') pos++;return v;}
    if(pos<s.length&&s[pos]==='-'){pos++;return -parsePrimary();}
    if(pos<s.length&&s[pos]==='+'){pos++;return parsePrimary();}
    var st=pos;while(pos<s.length&&/[0-9.]/.test(s[pos]))pos++;
    if(pos===st)return NaN;
    return parseFloat(s.slice(st,pos));
  }
  try{var r=parseExpr();return pos===s.length?r:NaN;}catch(e){return NaN;}
}

function prepCalc(s){
  s=(''+s).toLowerCase()
    .replace(/\s+/g,'').replace(/\u00a0/g,'')
    .replace(/\u00b2/g,'^2').replace(/\u00b3/g,'^3')
    .replace(/x2(?![0-9])/g,'x^2').replace(/\^2/g,'^2')
    .replace(/[\u00d7\u00b7]/g,'*')
    .replace(/[−\u2212\u2013\u2014]/g,'-');
  return s;
}

function multiVarCalc(expr, varMap){
  var s=prepCalc(expr);
  // Insérer * implicite: digit(, )(, )digit
  var prev='';
  while(prev!==s){
    prev=s;
    s=s.replace(/([0-9)])(\()/g,'$1*$2')
       .replace(/(\))([0-9a-z])/g,'$1*$2');
  }
  // Substituer les variables (char par char)
  var vars=Object.keys(varMap).sort(function(a,b){return b.length-a.length;});
  var res='',i=0;
  while(i<s.length){
    var matched=false;
    for(var v=0;v<vars.length;v++){
      var vn=vars[v];
      if(s.substr(i,vn.length)===vn){
        if(res.length>0&&/[0-9a-z)]/.test(res[res.length-1]))res+='*';
        res+='('+varMap[vn]+')';
        var ni=i+vn.length;
        if(ni<s.length&&/[0-9a-z(]/.test(s[ni]))res+='*';
        i+=vn.length;matched=true;break;
      }
    }
    if(!matched){res+=s[i];i++;}
  }
  return calcSafe(res);
}

function polyEqual(student, enc){
  var pts=[-2,-1,0,1,2,3,5,7];
  for(var i=0;i<pts.length;i++){
    var sv=multiVarCalc(student,{x:pts[i]});
    var ev=multiVarCalc(enc,{x:pts[i]});
    if(!isFinite(sv)||!isFinite(ev)||Math.abs(sv-ev)>1e-5)return false;
  }
  return true;
}
function multiVarEqual(student, enc, tests){
  for(var i=0;i<tests.length;i++){
    var sv=multiVarCalc(student,tests[i]);
    var ev=multiVarCalc(enc,tests[i]);
    if(!isFinite(sv)||!isFinite(ev)||Math.abs(sv-ev)>1e-5)return false;
  }
  return true;
}

/* ══ RENDU ══ */
function buildAll(){
  var host=document.getElementById('exos');
  host.innerHTML='';
  SECTIONS.forEach(function(sec){
    var h=document.createElement('div');
    h.className='section-wrap';
    h.innerHTML='<div class="sec-header"><div class="sec-num">'+sec.n+'</div>'
      +'<div class="sec-title">Exercice '+sec.n+'</div>'
      +'<div class="sec-badge">'+sec.badge+'</div></div>'
      +'<p class="sec-consigne">'+sec.consigne+'</p>';
    host.appendChild(h);
    sec.qs.forEach(function(q){
      var card=document.createElement('div');
      card.className='qcard';card.id='card-'+q.id;
      card.innerHTML=
        '<div class="q-head"><span class="q-badge">Exo '+sec.n+'</span>'
        +'<span class="q-letter">'+q.lbl+' =</span></div>'
        +'<div class="eq-box">'+q.eq+'</div>'
        +'<div class="inp-row">'
        +'<span class="inp-lbl">'+q.lbl+' =</span>'
        +'<input type="text" class="answer-input" id="inp-'+q.id
        +'" placeholder="ta r\u00e9ponse\u2026" autocomplete="off"/></div>'
        +'<div class="btn-row">'
        +'<button class="btn btn-ok" id="btn-'+q.id+'" onclick="checkQ(\''+q.id+'\')">&#10003; V\u00e9rifier</button>'
        +'<button class="btn btn-hint" onclick="toggleHint(\''+q.id+'\')">&#128161; Indice</button>'
        +'<button class="btn btn-sol" id="rev-'+q.id+'" onclick="toggleSol(\''+q.id+'\')">&#128065; Correction</button>'
        +'<button class="btn btn-rst" onclick="resetQ(\''+q.id+'\')">&#8635;</button>'
        +'</div>'
        +'<div class="hint-box" id="hint-'+q.id+'">&#128161; <strong>Indice&nbsp;:</strong> '+q.hint+'</div>'
        +'<div class="fb" id="fb-'+q.id+'"></div>'
        +'<div class="sol-box" id="sol-'+q.id+'"><strong>Correction&nbsp;:</strong><br>'+q.sol+'</div>';
      h.appendChild(card);
      if(done[q.id]!==undefined)lockQ(q);
    });
  });
}

function findQ(id){
  for(var s=0;s<SECTIONS.length;s++)
    for(var q=0;q<SECTIONS[s].qs.length;q++)
      if(SECTIONS[s].qs[q].id===id)return SECTIONS[s].qs[q];
  return null;
}

function lockQ(q){
  var ok=done[q.id];
  var inp=document.getElementById('inp-'+q.id);
  if(inp){inp.disabled=true;inp.classList.add(ok?'ok-inp':'ko-inp');}
  var btn=document.getElementById('btn-'+q.id);if(btn)btn.disabled=true;
  var rev=document.getElementById('rev-'+q.id);if(rev)rev.classList.add('vis');
  var fb=document.getElementById('fb-'+q.id);
  if(fb){fb.className='fb show '+(ok?'ok':'ko');
    var bravos=['\u2705 <strong>Bravo\u00a0!</strong>','\u2705 <strong>Exact\u00a0!</strong>','\u2705 <strong>Parfait\u00a0!</strong>','\u2705 <strong>Bien jou\u00e9\u00a0!</strong>'];
    fb.innerHTML=ok?bravos[Math.floor(Math.random()*bravos.length)]
      :'\u274C <strong>Pas tout \u00e0 fait.</strong> Consulte l\u2019indice ou la correction.';}
}

function checkQ(id){
  if(done[id]!==undefined)return;
  var q=findQ(id);if(!q)return;
  var val=document.getElementById('inp-'+id).value.trim();
  var fb=document.getElementById('fb-'+id);
  if(!val){fb.className='fb show ko';fb.textContent='Entre une r\u00e9ponse avant de valider.';return;}
  var ok;
  if(q.type==='poly') ok=polyEqual(val,q.enc);
  else ok=multiVarEqual(val,q.enc,q.tests);
  done[id]=ok;
  if(ok)nOk++;else nKo++;
  lockQ(q);updateScore();
}

function toggleHint(id){
  var h=document.getElementById('hint-'+id);
  if(h)h.classList.toggle('show');
}
function toggleSol(id){
  var s=document.getElementById('sol-'+id);
  if(!s)return;
  s.classList.toggle('show');
  var btn=document.getElementById('rev-'+id);
  if(btn)btn.textContent=s.classList.contains('show')?'\u25b2 Masquer':'\u25bc Correction';
}
function resetQ(id){
  delete done[id];
  var inp=document.getElementById('inp-'+id);
  if(inp){inp.value='';inp.disabled=false;inp.className='answer-input';}
  var btn=document.getElementById('btn-'+id);if(btn)btn.disabled=false;
  var rev=document.getElementById('rev-'+id);if(rev){rev.classList.remove('vis');rev.textContent='\u25bc Correction';}
  var fb=document.getElementById('fb-'+id);if(fb){fb.className='fb';fb.innerHTML='';}
  var sol=document.getElementById('sol-'+id);if(sol)sol.classList.remove('show');
  var hnt=document.getElementById('hint-'+id);if(hnt)hnt.classList.remove('show');
  // Recalc scores from scratch
  nOk=0;nKo=0;
  Object.keys(done).forEach(function(k){if(done[k]===true)nOk++;else nKo++;});
  updateScore();
}
function updateScore(){
  var ans=nOk+nKo;
  document.getElementById('sc-ok').textContent=nOk;
  document.getElementById('sc-ko').textContent=nKo;
  document.getElementById('sc-rem').textContent=TOTAL-ans;
  document.getElementById('prog').style.width=Math.round(nOk/TOTAL*100)+'%';
}

/* ══ CALCULATRICE ══ */
(function(){
  var expr='';
  function E(id){return document.getElementById(id);}
  var KEYS=[
    ['FACT(','fn','FACT('],['PGCD(','fn','PGCD('],['PPCM(','fn','PPCM('],['a/b','fn','SIMP('],['AC','fn','AC'],
    ['DEL','fn','DEL'],['(','op','('],[')','op',')'],[';','op',';'],['\u00f7R','op','\u00f7R'],
    ['7','','7'],['8','','8'],['9','','9'],['\u00f7','op','\u00f7'],['\u221a(','op','\u221a('],
    ['4','','4'],['5','','5'],['6','','6'],['\u00d7','op','\u00d7'],['x\u00b2','op','\u00b2'],
    ['1','','1'],['2','','2'],['3','','3'],['\u2212','op','\u2212'],['^','op','^'],
    ['0','','0'],[',','',','],['(','op','('],['=','eq','='],['','blank','']
  ];
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
  function render(){E('fxc-expr').textContent=expr;}
  function press(v){
    if(v==='AC'){expr='';E('fxc-res').textContent='0';render();return;}
    if(v==='DEL'){var tks=['FACT(','PGCD(','PPCM(','SIMP(','\u221a(','\u00f7R'];for(var i=0;i<tks.length;i++){if(expr.slice(-tks[i].length)===tks[i]){expr=expr.slice(0,-tks[i].length);render();return;}}expr=expr.slice(0,-1);render();return;}
    if(v==='='){
      var s=(expr||'').trim();if(!s)return;
      try{
        var m;
        if((m=s.match(/^FACT\((.+)\)$/i))){var n=Math.round(multiVarCalc(m[1],{}));if(n<1){E('fxc-res').textContent='Erreur';return;}var f=[],d=2,x=n;while(d*d<=x){while(x%d===0){f.push(d);x/=d;}d++;}if(x>1)f.push(x);var out=[],ii=0;while(ii<f.length){var p=f[ii],c=0;while(ii<f.length&&f[ii]===p){c++;ii++;}out.push(c>1?(p+c):(''+p));}E('fxc-res').textContent=out.join('\u00d7');return;}
        if((m=s.match(/^PGCD\(([^;]+);([^)]+)\)$/i))){E('fxc-res').textContent=''+gcd(Math.round(multiVarCalc(m[1],{})),Math.round(multiVarCalc(m[2],{})));return;}
        if((m=s.match(/^PPCM\(([^;]+);([^)]+)\)$/i))){var A=Math.round(multiVarCalc(m[1],{})),B=Math.round(multiVarCalc(m[2],{}));E('fxc-res').textContent=''+(Math.abs(A*B)/gcd(A,B));return;}
        if((m=s.match(/^SIMP\(([^;]+);([^)]+)\)$/i))){var pp=Math.round(multiVarCalc(m[1],{})),qq=Math.round(multiVarCalc(m[2],{}));if(!qq){E('fxc-res').textContent='Erreur';return;}var dg=gcd(pp,qq)||1;pp/=dg;qq/=dg;if(qq<0){pp=-pp;qq=-qq;}E('fxc-res').textContent=qq===1?(''+pp):(pp+'/'+qq);return;}
        if(s.indexOf('\u00f7R')>=0){var parts=s.split('\u00f7R');var aa=Math.round(multiVarCalc(parts[0],{})),bb=Math.round(multiVarCalc(parts[1],{}));if(!bb){E('fxc-res').textContent='Erreur';return;}var q=Math.floor(aa/bb),r=aa-q*bb;E('fxc-res').textContent='quotient '+q+' \u00b7 reste '+r;return;}
        var vv=multiVarCalc(s,{});
        if(!isFinite(vv)){E('fxc-res').textContent='Erreur';return;}
        E('fxc-res').textContent=String(Math.round(vv*1e9)/1e9).replace('.',',');
      }catch(e){E('fxc-res').textContent='Erreur';}
      return;
    }
    if(v==='')return;
    expr+=v;render();
  }
  var kc=E('fxc-keys');
  KEYS.forEach(function(k){var btn=document.createElement('button');btn.type='button';btn.className='fxc-k '+(k[1]||'');btn.textContent=k[0];if(k[1]!=='blank')btn.addEventListener('click',function(){press(k[2]);});kc.appendChild(btn);});
  var trig=document.getElementById('fxc-trig'),panel=E('fxc-panel'),bar=E('fxc-bar');
  trig.addEventListener('click',function(){trig.classList.add('fxc-hidden');panel.classList.remove('fxc-hidden');});
  E('fxc-cb').addEventListener('click',function(e){e.stopPropagation();panel.classList.add('fxc-hidden');trig.classList.remove('fxc-hidden');});
  E('fxc-hb').addEventListener('click',function(e){e.stopPropagation();E('fxc-help').classList.toggle('fxc-hidden');});
  var drag=false,sx,sy,ox,oy,conv=false;
  bar.addEventListener('pointerdown',function(e){if(e.target.classList.contains('fxc-icon'))return;drag=true;conv=false;sx=e.clientX;sy=e.clientY;var r=panel.getBoundingClientRect();ox=r.left;oy=r.top;bar.setPointerCapture(e.pointerId);});
  bar.addEventListener('pointermove',function(e){if(!drag)return;if(!conv){panel.style.right='auto';panel.style.bottom='auto';panel.style.left=ox+'px';panel.style.top=oy+'px';conv=true;}var nx=ox+(e.clientX-sx),ny=oy+(e.clientY-sy),w=panel.offsetWidth,h=panel.offsetHeight;nx=Math.max(4,Math.min(window.innerWidth-w-4,nx));ny=Math.max(4,Math.min(window.innerHeight-h-4,ny));panel.style.left=nx+'px';panel.style.top=ny+'px';});
  bar.addEventListener('pointerup',function(e){drag=false;try{bar.releasePointerCapture(e.pointerId);}catch(_){}});
})();

document.addEventListener('DOMContentLoaded',function(){buildAll();});
</script>
