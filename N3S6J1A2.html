<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résoudre les exercices — Décrire les solides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Charte du jour : J1 ORANGE ===== */
  :root{
    --j1:#f5a623; --j1-dark:#c47a10; --j1-soft:#fff5e0; --j1-accent:#f5d080;
    --ink:#2c2418; --ink-soft:#6b5d45; --ok:#3d8b40; --ok-soft:#eaf6ea;
    --err:#c0392b; --err-soft:#fdecea; --line:#ece3d2; --white:#ffffff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; overflow-x:hidden; }
  body{ font-family:'JetBrains Mono', ui-monospace, monospace; color:var(--ink); background:var(--white);
    line-height:1.55; -webkit-font-smoothing:antialiased; position:relative; min-height:100vh; }

  .blob{ position:fixed; z-index:0; background:var(--j1-accent); opacity:0.28; filter:blur(1px); pointer-events:none; }
  .blob-1{ top:-160px; right:-150px; width:460px; height:430px; border-radius:62% 38% 46% 54% / 58% 47% 53% 42%; }
  .blob-2{ top:42%; left:-190px; width:430px; height:470px; border-radius:44% 56% 63% 37% / 49% 38% 62% 51%; opacity:0.26; }
  .blob-3{ bottom:-180px; left:14%; width:500px; height:420px; border-radius:55% 45% 38% 62% / 42% 60% 40% 58%; opacity:0.27; }

  .wrap{ position:relative; z-index:1; max-width:860px; margin:0 auto; padding:26px 18px 60px; }
  .hero{ text-align:center; padding:14px 6px 22px; }
  .pill{ display:inline-block; background:var(--j1-soft); border:2px solid var(--j1-accent); color:var(--j1-dark);
    font-weight:700; font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase; padding:7px 16px; border-radius:999px; margin-bottom:16px; }
  .hero h1{ font-size:2.05rem; font-weight:800; color:var(--j1-dark); line-height:1.15; margin-bottom:10px; }
  .hero p.sub{ font-size:1.02rem; color:var(--ink-soft); max-width:580px; margin:0 auto; font-weight:500; }
  .hero .consigne{ display:inline-block; margin-top:14px; background:var(--white); border:2px dashed var(--j1-accent);
    border-radius:12px; padding:8px 16px; font-weight:600; color:var(--j1-dark); font-size:0.92rem; }

  .scoreboard{ position:sticky; top:10px; z-index:20; background:var(--white); border:2px solid var(--line); border-radius:16px;
    box-shadow:0 6px 20px rgba(196,122,16,0.10); padding:14px 16px; margin:10px 0 26px; }
  .score-stats{ display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:stretch; }
  .stat{ flex:1 1 90px; background:var(--j1-soft); border-radius:12px; padding:8px 6px; text-align:center; border:1.5px solid var(--j1-accent); }
  .stat .num{ font-size:1.5rem; font-weight:800; color:var(--j1-dark); line-height:1.1; }
  .stat .lbl{ font-size:0.72rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .stat.err{ background:var(--err-soft); border-color:#f3c6c0; } .stat.err .num{ color:var(--err); }
  .stat.done{ background:var(--ok-soft); border-color:#bfe0c0; } .stat.done .num{ color:var(--ok); }
  .xp-row{ margin-top:12px; }
  .xp-top{ display:flex; justify-content:space-between; font-size:0.8rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .xp-track{ height:16px; background:var(--j1-soft); border-radius:999px; overflow:hidden; border:1.5px solid var(--j1-accent); }
  .xp-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--j1), var(--j1-dark)); border-radius:999px; transition:width 0.5s cubic-bezier(.2,.8,.2,1); }

  .card{ background:var(--white); border:2px solid var(--line); border-radius:18px; padding:20px 18px; margin-bottom:22px;
    box-shadow:0 4px 14px rgba(44,36,24,0.05); transition:border-color 0.3s, box-shadow 0.3s; }
  .card.is-correct{ border-color:#bfe0c0; box-shadow:0 6px 18px rgba(61,139,64,0.12); }
  .card.is-error{ border-color:#f3c6c0; }
  .card-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .badge-num{ flex:0 0 auto; width:42px; height:42px; background:var(--j1); color:var(--white); border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.25rem; }
  .card.is-correct .badge-num{ background:var(--ok); }
  .card-head .ctitle{ font-weight:700; font-size:1.02rem; color:var(--j1-dark); }
  .card.is-correct .ctitle{ color:var(--ok); }
  .check-mark{ margin-left:auto; font-size:1.5rem; color:var(--ok); opacity:0; transition:opacity 0.3s; }
  .card.is-correct .check-mark{ opacity:1; }

  .question{ font-size:1.05rem; margin-bottom:14px; color:var(--ink); font-weight:600; }
  .question b{ color:var(--j1-dark); }

  .figure{ background:var(--j1-soft); border:1.5px solid var(--j1-accent); border-radius:14px; padding:10px; margin:0 auto 16px; max-width:300px; }
  .figure svg{ width:100%; height:auto; display:block; }

  .answer-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .num-input{ font-family:inherit; font-size:1.2rem; font-weight:700; width:140px; padding:12px 14px;
    border:2.5px solid var(--j1-accent); border-radius:12px; color:var(--ink); text-align:center; background:var(--white); }
  .num-input:focus{ outline:none; border-color:var(--j1); box-shadow:0 0 0 4px rgba(245,166,35,0.18); }

  .qcm{ display:flex; gap:10px; flex-wrap:wrap; }
  .qcm-btn{ font-family:inherit; flex:1 1 calc(50% - 5px); font-size:1.05rem; font-weight:700; padding:15px 12px;
    border:2.5px solid var(--j1-accent); border-radius:14px; background:var(--white); color:var(--j1-dark); cursor:pointer; transition:0.15s; }
  .qcm-btn:hover{ background:var(--j1-soft); } .qcm-btn:active{ transform:scale(0.97); }
  .qcm-btn.picked{ background:var(--j1); color:var(--white); border-color:var(--j1-dark); }

  .btn{ font-family:inherit; font-weight:700; font-size:1.02rem; padding:13px 22px; border:none; border-radius:12px; cursor:pointer; transition:0.12s; }
  .btn:active{ transform:scale(0.97); }
  .btn-check{ background:var(--j1); color:var(--white); box-shadow:0 4px 0 var(--j1-dark); }
  .btn-check:hover{ background:var(--j1-dark); box-shadow:0 4px 0 #9c6209; }
  .btn-retry{ background:var(--err-soft); color:var(--err); border:2px solid #f3c6c0; }
  .btn-retry:hover{ background:#fbe0db; }
  .btn-big{ display:block; width:100%; max-width:340px; margin:18px auto 0; background:var(--j1-dark); color:var(--white);
    font-size:1.12rem; padding:16px; box-shadow:0 5px 0 #8a5a0c; }
  .btn-big:hover{ background:#a86a0e; }

  .feedback{ margin-top:14px; font-weight:600; display:none; }
  .feedback.show{ display:block; } .feedback.ok{ color:var(--ok); } .feedback.bad{ color:var(--err); }
  .solution{ margin-top:12px; background:var(--ok-soft); border:1.5px solid #bfe0c0; border-radius:12px; padding:12px 14px; font-size:0.95rem; color:#1f5b22; display:none; }
  .solution.show{ display:block; } .solution b{ color:var(--ok); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .locked{ opacity:0.65; pointer-events:none; }
  .hint{ font-size:0.86rem; color:var(--ink-soft); margin-top:6px; font-style:italic; }

  .results{ display:none; text-align:center; background:var(--white); border:2.5px solid var(--j1-accent); border-radius:20px;
    padding:34px 22px; margin-bottom:24px; box-shadow:0 10px 30px rgba(196,122,16,0.16); }
  .results.show{ display:block; animation:pop 0.5s ease; }
  @keyframes pop{ from{ transform:scale(0.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .results .trophy{ font-size:3.4rem; line-height:1; }
  .results h2{ color:var(--j1-dark); font-size:1.6rem; margin:10px 0 4px; }
  .results .rscore{ font-size:1.1rem; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .stars{ font-size:2rem; letter-spacing:6px; margin:6px 0 12px; }
  .star-on{ color:var(--j1); } .star-off{ color:var(--line); }
  .results .rmsg{ color:var(--ink-soft); font-weight:500; max-width:440px; margin:0 auto 6px; }

  @media (max-width:430px){
    .hero h1{ font-size:1.62rem; } .stat .num{ font-size:1.25rem; } .stat .lbl{ font-size:0.64rem; }
    .num-input{ width:120px; } .wrap{ padding:20px 12px 50px; } .qcm-btn{ font-size:0.95rem; }
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="wrap">
    <header class="hero">
      <span class="pill">Semaine 6 · Jour 1</span>
      <h1>&#9999;&#65039; Résoudre les exercices</h1>
      <p class="sub">Décrire les solides : compter les sommets, les arêtes, les faces d&rsquo;un prisme droit et reconnaître ses bases.</p>
      <div class="consigne">&#9889; Je travaille mes automatismes&nbsp;: complète rapidement&nbsp;!</div>
    </header>

    <section class="scoreboard" aria-label="Tableau de score">
      <div class="score-stats">
        <div class="stat done"><div class="num" id="s-ok">0</div><div class="lbl">Réussies</div></div>
        <div class="stat"><div class="num" id="s-left">4</div><div class="lbl">Restantes</div></div>
        <div class="stat err"><div class="num" id="s-err">0</div><div class="lbl">Erreurs</div></div>
      </div>
      <div class="xp-row">
        <div class="xp-top"><span>Progression</span><span id="xp-text">0 / 4</span></div>
        <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
      </div>
    </section>

    <div id="results" class="results">
      <div class="trophy">&#127942;</div>
      <h2>Tous les exercices terminés&nbsp;!</h2>
      <div class="rscore" id="r-score"></div>
      <div class="stars" id="r-stars"></div>
      <p class="rmsg" id="r-msg"></p>
      <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer</button>
    </div>

    <main id="exoList"></main>
    <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer tous les exercices</button>
  </div>

<script>
/* ============================================================
   PAZAPA — N3S6J1 — Décrire les solides (prismes droits)
   ============================================================ */
const TOTAL = 4;
const rint = n => Math.floor(Math.random()*n);
const pick = a => a[rint(a.length)];
const coin = () => Math.random() < 0.5;

let exos = [];
let state = [];

/* ---------- Données prisme à base n-gone ---------- */
const NOMS_BASE = {3:'un triangle', 4:'un quadrilatère', 5:'un pentagone', 6:'un hexagone', 8:'un octogone'};
const NOMS_BASE_COURT = {3:'triangle', 4:'quadrilatère', 5:'pentagone', 6:'hexagone', 8:'octogone'};
function prismeData(n){
  return { n, sommets:2*n, bases:2, aretesLat:n, aretesTot:3*n, facesLat:n, facesTot:n+2,
           natureBase:NOMS_BASE[n], natureBaseCourt:NOMS_BASE_COURT[n] };
}

/* ---------- Dessin SVG ---------- */
const SK='#c47a10', SH='#d9a441', SF='rgba(245,208,128,0.5)';
function L(p,q,d){return `<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="${d?SH:SK}" stroke-width="${d?1.6:2.4}" ${d?'stroke-dasharray="5 4"':''} stroke-linecap="round"/>`;}
function PG(pts,fill){return `<polygon points="${pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" fill="${fill||SF}" stroke="none"/>`;}

/* prisme "couché" à base triangle (style image 4) */
function drawPrismeTri(){
  const x=70, by=170, w=110, ox=46, oy=42, ht=92;
  const Q1={x,y:by}, Q2={x:x+w,y:by}, Q3={x:x+w*0.5+ox*0.5, y:by-oy};
  const Q1t={x:Q1.x,y:Q1.y-ht}, Q2t={x:Q2.x,y:Q2.y-ht}, Q3t={x:Q3.x,y:Q3.y-ht};
  let s='';
  s+=PG([Q1,Q2,Q2t,Q1t]) + PG([Q2,Q3,Q3t,Q2t]) + PG([Q1t,Q2t,Q3t]);
  s+=L(Q1,Q3,1)+L(Q2,Q3,1)+L(Q3,Q3t,1);
  s+=L(Q1,Q2)+L(Q1,Q1t)+L(Q2,Q2t)+L(Q1t,Q2t)+L(Q2t,Q3t)+L(Q3t,Q1t);
  return `<svg viewBox="0 0 250 210" role="img" aria-label="prisme à base triangulaire">${s}</svg>`;
}
/* pavé droit (base quadrilatère, style image 1) */
function drawPave(){
  const by=170, X=70, w=110, h=92, dep=42, ox=dep, oy=dep;
  const BL={x:X,y:by}, BR={x:X+w,y:by}, TR={x:X+w,y:by-h}, TL={x:X,y:by-h};
  const TLb={x:X+ox,y:by-h-oy}, TRb={x:X+w+ox,y:by-h-oy}, BRb={x:X+w+ox,y:by-oy}, BLb={x:X+ox,y:by-oy};
  let s='';
  s+=PG([TL,TR,BR,BL]) + PG([TL,TR,TRb,TLb]) + PG([TR,BR,BRb,TRb]);
  s+=L(BL,BLb,1)+L(BLb,TLb,1)+L(BLb,BRb,1);
  s+=L(TL,TR)+L(TR,BR)+L(BR,BL)+L(BL,TL)+L(TL,TLb)+L(TR,TRb)+L(BR,BRb)+L(TLb,TRb)+L(TRb,BRb);
  return `<svg viewBox="0 0 250 210" role="img" aria-label="pavé droit">${s}</svg>`;
}
/* prisme à base n-gone (n>=5) en perspective ellipse (style images 2,5,6,9) */
function drawPrismeNgone(n){
  const W=240,H=210, cx=120, cyBot=150, cyTop=72, rx=72, ry=24;
  const start = Math.PI/2 + Math.PI/n;
  function basePts(cy){ const pts=[]; for(let i=0;i<n;i++){ const a=start+i*2*Math.PI/n; pts.push({x:cx+rx*Math.cos(a), y:cy-ry*Math.sin(a)}); } return pts; }
  const bot=basePts(cyBot), top=basePts(cyTop);
  let s='';
  s+=PG(top, SF);
  for(let i=0;i<n;i++){ const front=Math.sin(start+i*2*Math.PI/n)<0; s+=L(bot[i],top[i],!front); }
  for(let i=0;i<n;i++){ const j=(i+1)%n; const front=Math.sin(start+(i+0.5)*2*Math.PI/n)<0; s+=L(bot[i],bot[j],!front); }
  for(let i=0;i<n;i++){ const j=(i+1)%n; s+=L(top[i],top[j],false); }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="prisme à base à ${n} côtés">${s}</svg>`;
}
function drawSolide(n){
  if(n===3) return drawPrismeTri();
  if(n===4) return drawPave();
  return drawPrismeNgone(n);
}

/* ============================================================
   Générateurs (chaque exo tire un prisme + une question)
   ============================================================ */
const N_CHOICES = [3,4,5,6,8];

/* Type comptage : sommets / arêtes / arêtes latérales / faces / faces latérales / bases */
const COMPTE_TYPES = [
  { key:'sommets',   q:'Combien ce solide comporte-t-il de <b>sommets</b>&nbsp;?',
    val:d=>d.sommets, unit:'sommets',
    sol:d=>`Il y a ${d.n} sommets sur la base du bas et ${d.n} sur la base du haut, soit ${d.n} × 2 = <b>${d.sommets} sommets</b>.` },
  { key:'aretesTot', q:'Combien ce solide comporte-t-il d&rsquo;<b>arêtes</b>&nbsp;?',
    val:d=>d.aretesTot, unit:'arêtes',
    sol:d=>`${d.n} arêtes sur la base du bas, ${d.n} sur la base du haut, et ${d.n} arêtes latérales (verticales)&nbsp;: ${d.n} × 3 = <b>${d.aretesTot} arêtes</b>.` },
  { key:'aretesLat', q:'Combien ce solide comporte-t-il d&rsquo;<b>arêtes latérales</b>&nbsp;?',
    val:d=>d.aretesLat, unit:'arêtes latérales',
    sol:d=>`Les arêtes latérales relient les deux bases. Il y en a une par sommet de la base, soit <b>${d.aretesLat}</b>.` },
  { key:'facesTot',  q:'Combien ce solide comporte-t-il de <b>faces</b>&nbsp;?',
    val:d=>d.facesTot, unit:'faces',
    sol:d=>`Il y a ${d.n} faces latérales plus les 2 bases&nbsp;: ${d.n} + 2 = <b>${d.facesTot} faces</b>.` },
  { key:'facesLat',  q:'Combien ce solide comporte-t-il de <b>faces latérales</b>&nbsp;?',
    val:d=>d.facesLat, unit:'faces latérales',
    sol:d=>`Une face latérale par côté de la base, soit <b>${d.facesLat} faces latérales</b>.` },
  { key:'bases',     q:'Combien ce solide comporte-t-il de <b>base(s)</b>&nbsp;?',
    val:d=>d.bases, unit:'bases',
    sol:d=>`Un prisme droit a toujours <b>2 bases</b> (celle du bas et celle du haut), identiques et parallèles.` },
];

function makeCompteExo(typeKey){
  const n = pick(N_CHOICES);
  const d = prismeData(n);
  const t = COMPTE_TYPES.find(x=>x.key===typeKey);
  return { type:'input', answer:t.val(d), title:'Décrire le solide',
    question:t.q, figure:drawSolide(n),
    hint:'Observe bien les deux bases et les côtés. Les arêtes cachées sont en pointillés.',
    solution:t.sol(d) };
}

/* Type nature de la base (QCM) */
function makeNatureBaseExo(){
  const n = pick(N_CHOICES);
  const d = prismeData(n);
  const bonnes = NOMS_BASE_COURT[n];
  let choix = [bonnes];
  const autres = Object.values(NOMS_BASE_COURT).filter(x=>x!==bonnes);
  while(choix.length<4){ const c=pick(autres); if(!choix.includes(c)) choix.push(c); }
  for(let i=choix.length-1;i>0;i--){ const j=rint(i+1); [choix[i],choix[j]]=[choix[j],choix[i]]; }
  return { type:'qcm', choices:choix, answer:bonnes, title:'Nature de la base',
    question:'Quelle est la <b>nature de la base</b> de ce solide&nbsp;?',
    figure:drawSolide(n),
    hint:'Compte les côtés d&rsquo;une base (en haut ou en bas).',
    solution:`La base est un polygone à ${n} côtés&nbsp;: c&rsquo;est <b>${bonnes==='quadrilatère'?'un quadrilatère':'un '+bonnes}</b>.` };
}

/* Type nature des faces latérales (QCM) — prisme DROIT -> rectangles */
function makeNatureFacesExo(){
  const n = pick(N_CHOICES);
  let choix = ['des rectangles','des triangles','des carrés','des trapèzes'];
  for(let i=choix.length-1;i>0;i--){ const j=rint(i+1); [choix[i],choix[j]]=[choix[j],choix[i]]; }
  return { type:'qcm', choices:choix, answer:'des rectangles', title:'Nature des faces latérales',
    question:'Quelle est la <b>nature des faces latérales</b> de ce prisme droit&nbsp;?',
    figure:drawSolide(n),
    hint:'Dans un prisme droit, les côtés se dressent « tout droit » au-dessus de la base.',
    solution:`Dans un prisme <b>droit</b>, les faces latérales sont <b>des rectangles</b>.` };
}

/* 4 générateurs : on varie les questions pour couvrir le diaporama */
function gen1(){ return makeCompteExo(pick(['sommets','aretesTot','aretesLat'])); }
function gen2(){ return makeCompteExo(pick(['facesTot','facesLat','bases'])); }
function gen3(){ return makeNatureBaseExo(); }
function gen4(){ return makeNatureFacesExo(); }

const GENERATORS = [gen1, gen2, gen3, gen4];

/* ============================================================
   Rendu
   ============================================================ */
function generateAll(){
  exos = GENERATORS.map(g => g());
  state = exos.map(()=>({correct:false, errors:0}));
  document.getElementById('results').classList.remove('show');
  const root = document.getElementById('exoList');
  root.innerHTML = '';
  exos.forEach((ex, i) => root.appendChild(buildCard(ex, i)));
  updateScore();
  window.__exos = exos;
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildCard(ex, i){
  const card = document.createElement('div');
  card.className='card'; card.id='card-'+i;
  let body='';
  if(ex.type==='input'){
    body=`
      ${ex.figure ? `<div class="figure">${ex.figure}</div>` : ''}
      <div class="answer-row">
        <input class="num-input" id="in-${i}" type="number" inputmode="numeric" placeholder="?" aria-label="ta réponse">
      </div>
      ${ex.hint ? `<div class="hint">&#128161; ${ex.hint}</div>` : ''}
      <div class="actions" id="act-${i}"><button class="btn btn-check" id="chk-${i}">Vérifier</button></div>`;
  } else { /* qcm */
    const opts = ex.choices.map(c=>`<button class="qcm-btn" data-val="${c}" data-i="${i}">${c}</button>`).join('');
    body=`
      ${ex.figure ? `<div class="figure">${ex.figure}</div>` : ''}
      <div class="qcm">${opts}</div>
      ${ex.hint ? `<div class="hint">&#128161; ${ex.hint}</div>` : ''}
      <div class="actions" id="act-${i}"></div>`;
  }
  card.innerHTML=`
    <div class="card-head">
      <div class="badge-num">${i+1}</div>
      <div class="ctitle">${ex.title}</div>
      <div class="check-mark">&#10004;</div>
    </div>
    <p class="question">${ex.question}</p>
    ${body}
    <div class="feedback" id="fb-${i}"></div>
    <div class="solution" id="sol-${i}">${ex.solution}</div>`;
  setTimeout(()=>{
    if(ex.type==='input'){
      card.querySelector('#chk-'+i).addEventListener('click', ()=>checkInput(i));
      card.querySelector('#in-'+i).addEventListener('keydown', e=>{ if(e.key==='Enter') checkInput(i); });
    } else {
      card.querySelectorAll('.qcm-btn').forEach(btn=>{ btn.addEventListener('click', ()=>checkQcm(i, btn.dataset.val)); });
    }
  },0);
  return card;
}

function checkInput(i){
  if(state[i].correct) return;
  const inp=document.getElementById('in-'+i); const raw=inp.value.trim().replace(',','.'); const fb=document.getElementById('fb-'+i);
  if(raw===''){ flash(fb,'bad','Écris d&rsquo;abord ta réponse.'); return; }
  const val=Number(raw);
  if(Number.isNaN(val)){ flash(fb,'bad','Écris un nombre.'); return; }
  if(Math.abs(val-exos[i].answer)<1e-9) markCorrect(i); else markError(i);
}
function checkQcm(i, val){
  if(state[i].correct) return;
  const card=document.getElementById('card-'+i);
  card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.toggle('picked', b.dataset.val===val));
  if(val===exos[i].answer) markCorrect(i); else markError(i);
}

function markError(i){
  state[i].errors++;
  document.getElementById('card-'+i).classList.add('is-error');
  flash(document.getElementById('fb-'+i),'bad','Pas encore… recompte bien sur la figure, puis réessaie.');
  const act=document.getElementById('act-'+i);
  if(!act.querySelector('.btn-retry')){
    const r=document.createElement('button'); r.className='btn btn-retry'; r.innerHTML='&#8635; Réessayer';
    r.addEventListener('click', ()=>retry(i)); act.appendChild(r);
  }
  updateScore();
}
function retry(i){
  const ex=exos[i]; const card=document.getElementById('card-'+i);
  card.classList.remove('is-error'); document.getElementById('fb-'+i).classList.remove('show');
  if(ex.type==='input'){ const inp=document.getElementById('in-'+i); inp.value=''; inp.focus(); }
  else { card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.remove('picked')); }
  const r=document.getElementById('act-'+i).querySelector('.btn-retry'); if(r) r.remove();
}
function markCorrect(i){
  state[i].correct=true;
  const ex=exos[i]; const card=document.getElementById('card-'+i);
  card.classList.remove('is-error'); card.classList.add('is-correct');
  flash(document.getElementById('fb-'+i),'ok','Bravo, c&rsquo;est juste&nbsp;!');
  document.getElementById('sol-'+i).classList.add('show');
  document.getElementById('act-'+i).classList.add('locked');
  if(ex.type==='input'){ const inp=document.getElementById('in-'+i); inp.disabled=true; inp.classList.add('locked'); }
  else { card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.add('locked')); }
  updateScore(); checkFinished();
}
function flash(el,kind,msg){ el.className='feedback show '+kind; el.innerHTML=msg; }
function updateScore(){
  const ok=state.filter(s=>s.correct).length, err=state.reduce((a,s)=>a+s.errors,0);
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-left').textContent=TOTAL-ok;
  document.getElementById('s-err').textContent=err;
  document.getElementById('xp-text').textContent=ok+' / '+TOTAL;
  document.getElementById('xp-fill').style.width=(100*ok/TOTAL)+'%';
}
function checkFinished(){
  if(state.every(s=>s.correct)){
    const err=state.reduce((a,s)=>a+s.errors,0);
    let stars=3; if(err>=1&&err<=2) stars=2; if(err>=3) stars=1;
    document.getElementById('r-score').textContent=`${TOTAL} / ${TOTAL} réussis · ${err} erreur${err>1?'s':''}`;
    let sh=''; for(let k=0;k<3;k++) sh+=`<span class="${k<stars?'star-on':'star-off'}">&#9733;</span>`;
    document.getElementById('r-stars').innerHTML=sh;
    document.getElementById('r-msg').textContent='Personne ne réussit tout du premier coup — l\u2019important, c\u2019est d\u2019avoir cherché et compris. Tu peux recommencer avec de nouveaux solides.';
    const res=document.getElementById('results'); res.classList.add('show');
    setTimeout(()=>res.scrollIntoView({behavior:'smooth', block:'center'}), 250);
  }
}
generateAll();
</script>
