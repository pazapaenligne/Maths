<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PAZAPA Maths — Se repérer dans un pavé droit</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ───────── CHARTE J1 ORANGE (LUNDI) ───────── */
:root{
  --jour:#f5a623;
  --jour-fonce:#c47a10;
  --jour-soft:#fff5e0;
  --jour-accent:#f5d080;
  --jour-titre:#c47a10;
  --badge-txt:#7a4500;
  --vert:#8dc63f; --vert-fonce:#3d7a10; --vert-soft:#f0faeb;
  --rouge:#e74c3c; --rouge-soft:#fdedec; --rouge-fonce:#c0392b;
  --texte:#23262d; --gris:#8a8f9a; --bord:#ece8dd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}
body{
  background:#fffdf7; color:var(--texte);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:1.6rem 1rem 4rem; position:relative;
}

/* ───────── BLOBS FIXES (identiques tous les jours) ───────── */
.blob{position:fixed;z-index:0;pointer-events:none;filter:blur(1px);}
.blob1{width:300px;height:280px;top:-70px;right:-80px;opacity:.28;
  background:#f5d080;border-radius:38% 62% 55% 45% / 56% 40% 60% 44%;}
.blob2{width:220px;height:240px;top:38%;left:-90px;opacity:.22;
  background:var(--jour-accent);border-radius:62% 38% 44% 56% / 42% 58% 42% 58%;}
.blob3{width:260px;height:230px;bottom:-60px;right:-50px;opacity:.20;
  background:#8dc63f;border-radius:45% 55% 62% 38% / 55% 45% 58% 42%;}
.blob4{width:140px;height:150px;bottom:200px;left:-30px;opacity:.16;
  background:#f28b82;border-radius:50% 50% 40% 60% / 60% 40% 60% 40%;}

/* ───────── HERO ───────── */
.hero{text-align:center;position:relative;z-index:1;margin-bottom:1.4rem;max-width:720px;width:100%;}
.logo-badge{
  display:inline-flex;align-items:center;gap:.5rem;
  background:#f5c518;color:#000;
  font-size:.78rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:.3rem .9rem;
  border-radius:99px;margin-bottom:.5rem;
}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.week-label{
  font-family:'JetBrains Mono',monospace;
  font-size:.82rem;color:var(--gris);margin-bottom:.5rem;
}
h1{font-size:clamp(1.45rem,4vw,2.1rem);font-weight:800;line-height:1.25;}
h1 .hl{color:var(--jour);}
.sous-titre{color:var(--gris);font-size:.9rem;margin-top:.4rem;line-height:1.8;}
.consigne{
  margin:1rem auto 0;max-width:560px;border:2px dashed var(--jour);
  background:var(--jour-soft);color:var(--jour-fonce);border-radius:14px;
  padding:.7rem 1rem;font-size:.9rem;font-weight:600;line-height:1.8;
}
.astuce{
  margin:.6rem auto 0;max-width:560px;
  color:var(--gris);font-size:.8rem;font-style:normal;line-height:1.8;
}

/* ───────── CARTE IFRAME ───────── */
.carte-iframe{
  position:relative;z-index:1;width:100%;max-width:640px;
  background:#fff;border:2px solid var(--bord);border-radius:18px;
  overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.07);
}
.carte-stripe{
  height:4px;
  background:linear-gradient(90deg,var(--jour),#f5c518,#f28b82);
}
.iframe-wrap{width:100%;height:500px;background:#f8f8f8;}
.iframe-wrap iframe{width:100%;height:100%;border:0;}
.ext-link{padding:.65rem 1.2rem;font-size:.8rem;color:var(--gris);
  border-top:1.5px solid var(--bord);background:#fffdf7;text-align:center;line-height:1.8;}
.ext-link a{color:var(--jour-fonce);font-weight:700;text-decoration:underline;}

/* ───────── MOBILE ───────── */
@media(max-width:500px){
  body{padding:1rem .6rem 3rem;}
  .iframe-wrap{height:420px;}
}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>

<!-- ───────── HERO ───────── -->
<header class="hero">
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa &middot; Maths &middot; 3&egrave;me
  </div>
  <div class="week-label">Semaine&nbsp;6 &ndash; Jour&nbsp;1</div>
  <h1><span class="hl">Se rep&eacute;rer dans un pav&eacute; droit</span></h1>
  <p class="sous-titre">Je travaille mes automatismes de calculs</p>
  <div class="consigne">&#128073; Compl&egrave;te rapidement.</div>
  <p class="astuce">&#128269; Si l&rsquo;affichage est trop petit, appuie sur &laquo;&nbsp;+&nbsp;&raquo; pour zoomer.</p>
</header>

<!-- ───────── CARTE IFRAME ───────── -->
<section class="carte-iframe" aria-label="Activit&eacute; mathsmentales">
  <div class="carte-stripe"></div>
  <div class="iframe-wrap">
    <iframe
      src="https://mathsmentales.net/diaporama.html?i=321,e=correction,o=no,s=1,so=h,f=n,a=,colors=,snd=null&p=0~t=Diapo%201~c=1~o=true_i=6GB1~o=0,1,2,3~q=0.0,1-1.0,1,2-2.-3.0,1~p=~t=8~n=10"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      title="Activit&eacute; interactive sur le pav&eacute; droit">
    </iframe>
  </div>
  <div class="ext-link">&#128279; Si l&rsquo;activit&eacute; ne s&rsquo;affiche pas&nbsp;:
    <a href="https://mathsmentales.net/diaporama.html?i=321,e=correction,o=no,s=1,so=h,f=n,a=,colors=,snd=null&p=0~t=Diapo%201~c=1~o=true_i=6GB1~o=0,1,2,3~q=0.0,1-1.0,1,2-2.-3.0,1~p=~t=8~n=10" target="_blank" rel="noopener">Ouvrir dans un nouvel onglet</a>
  </div>
</section>

</body>
</html>
