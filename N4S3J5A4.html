<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths &ndash; Identit&eacute;s remarquables &middot; Niveau 2</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --day-color:#f5c518;--day-dark:#8a6000;--day-light:#fffbeb;
      --day-border:#f5e08a;--day-glow:rgba(245,197,24,.3);
      --bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;
      --yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;
      --pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;letter-spacing:.03em;word-spacing:.08em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--yellow);top:200px;left:-30px;pointer-events:none;}
    .head-card{width:100%;max-width:680px;background:var(--day-light);border:2px solid var(--day-border);border-radius:var(--radius);padding:1.9rem 1.5rem 1.6rem;text-align:center;position:relative;z-index:1;margin-bottom:1.3rem;}
    .head-card .logo-badge{background:var(--day-color);color:#000;font-size:14px;letter-spacing:.09em;display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .head-card .week-label{color:var(--day-dark);font-size:.95rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1 .hl{color:var(--day-dark);font-size:clamp(1.45rem,4.6vw,1.95rem);font-weight:800;display:inline-block;}
    .head-card h1 .lvl{color:var(--text);font-size:clamp(1.55rem,5.2vw,2.2rem);font-weight:900;display:inline-block;margin-top:.15rem;}
    .head-card .subtitle{color:var(--muted);font-size:1.02rem;margin-top:.5rem;font-family:'JetBrains Mono',monospace;}
    .level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;padding:.6rem 1.15rem;border-radius:12px;border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);min-height:2.9rem;display:inline-flex;align-items:center;cursor:default;}
    .level-btn.active{background:var(--day-color);color:#000;border-color:var(--day-color);box-shadow:0 3px 10px var(--day-glow);}
    .stats-card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-bottom:1.7rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.05);}
    .stats-row{display:flex;gap:.8rem;}
    .stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);border-radius:12px;padding:.9rem .5rem;text-align:center;}
    .stat-num{font-size:1.7rem;font-weight:800;color:var(--day-dark);font-family:'JetBrains Mono',monospace;line-height:1.1;}
    .stat-label{font-size:.86rem;color:var(--muted);margin-top:.25rem;}
    .prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:1rem;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--orange));border-radius:99px;transition:width .5s ease;}
    .prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;color:var(--muted);margin-top:.6rem;}
    .section-title{max-width:680px;margin:1.6rem auto .7rem;font-weight:900;font-size:clamp(1.1rem,3.2vw,1.35rem);color:var(--day-dark);position:relative;z-index:1;}
    .sec-consigne{max-width:680px;margin:-.2rem auto 1rem;color:var(--day-dark);font-weight:600;font-size:.95rem;line-height:1.7;position:relative;z-index:1;}
    #cards{width:100%;max-width:680px;}
    .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.7rem 1.5rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;margin-bottom:1.5rem;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}
    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.1em;}
    .eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(.98rem,2.4vw,1.25rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.9;}
    /* cases inline */
    .expr-line{font-family:'JetBrains Mono',monospace;font-size:clamp(.95rem,2.2vw,1.1rem);font-weight:700;color:var(--day-dark);line-height:2.4;display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;margin-bottom:.5rem;}
    .box-input{display:inline-block;background:var(--bg);border:2px solid var(--border);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:clamp(.9rem,2.2vw,1.05rem);font-weight:700;color:var(--text);padding:.25rem .5rem;outline:none;transition:border-color .2s;height:2.4rem;min-width:60px;width:100px;text-align:center;vertical-align:middle;}
    .box-input:focus{border-color:var(--day-color);}
    .box-input.ok{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .box-input.ko{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.8rem;}
    .input-label{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;}
    .answer-input{background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:.5rem .85rem;outline:none;transition:border-color .2s;height:3rem;width:min(280px,100%);}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.7rem 1.45rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(1rem,2.8vw,1.12rem);font-weight:800;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:3.1rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn.hidden{display:none;}
    .btn-primary{background:var(--day-color);color:#000;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}
    .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:1rem;color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}
    .method-box{display:none;background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.95rem 1.15rem;margin-top:.9rem;font-size:1rem;font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.85;}
    .method-box.reveal{display:block;}
    .feedback{margin-top:1rem;padding:.8rem 1rem;border-radius:10px;font-size:clamp(1rem,2.6vw,1.1rem);display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.7rem;flex-shrink:0;}
    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,11vw,4.8rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2.2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:clamp(1.02rem,2.6vw,1.12rem);margin-bottom:2rem;line-height:1.7;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
  <div class="bubble1"></div><div class="bubble2"></div>
  <div class="head-card">
    <div class="logo-badge"><span class="logo-dot" style="background:rgba(0,0,0,.25)"></span><span class="logo-dot" style="background:#000"></span> PAZAPA &middot; MATHS &middot; 4&Egrave;ME</div>
    <div class="week-label">Semaine 3 &ndash; Jour 5</div>
    <h1><span class="hl">&#9999;&#65039; S&eacute;rie d&rsquo;exercices</span><br><span class="lvl"></span></h1>
    <p class="subtitle">Identit&eacute;s remarquables &middot; factorisation</p>
    <div class="level-row">
      <span class="level-btn">Niveau 1</span>
      <span class="level-btn active">Niveau 2</span>
      <span class="level-btn">Niveau 3</span>
    </div>
  </div>
  <div class="stats-card">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="st-ok">0</div><div class="stat-label">R&eacute;ussies</div></div>
      <div class="stat-box"><div class="stat-num" id="st-rem">13</div><div class="stat-label">Restantes</div></div>
      <div class="stat-box"><div class="stat-num" id="st-err">0</div><div class="stat-label">Erreurs</div></div>
    </div>
    <div class="prog-bg"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
    <div class="prog-text" id="prog-text">0 / 13</div>
  </div>
  <div id="cards"></div>
  <section class="results" id="results"><div class="results-card">
    <div class="q-num">R&eacute;sultats</div>
    <div class="results-score"><span class="s-num" id="res-score">0 / 13</span></div>
    <div class="stars" id="stars"></div><p class="results-msg" id="res-msg"></p>
    <button class="btn btn-primary" onclick="restart()">&#8635; Recommencer</button>
  </div></section>

  <script>
  /* Types :
     'simple' : une zone de r\u00e9ponse
     'parts'  : plusieurs cases inline (tpl + parts)  */
  var QS=[
    /* ── Bloc 1 : (a-b)(a+b) ── */
    {sec:"Factoriser \u00e0 l\u2019aide de l\u2019identit\u00e9 (a-b)(a+b) = a\u00b2 \u2212 b\u00b2",
     scons:"Chaque expression est une diff\u00e9rence de deux carr\u00e9s.",
     type:"simple",
     eq:"A = 81x\u00b2 \u2212 4",
     answers:["(9x-2)(9x+2)","(9x+2)(9x-2)"],display:"(9x \u2212 2)(9x + 2)",
     hint:"Identifie a tel que a\u00b2 = 81x\u00b2, et b tel que b\u00b2 = 4. Applique alors (a-b)(a+b).",
     method:"<strong>Explication\u00a0:</strong> a = 9x, b = 2. A = (9x\u00a0\u2212\u00a02)(9x\u00a0+\u00a02)."},
    {sec:"Factoriser \u00e0 l\u2019aide de l\u2019identit\u00e9 (a-b)(a+b) = a\u00b2 \u2212 b\u00b2",scons:"",
     type:"simple",
     eq:"B = 81x\u00b2 \u2212 64",
     answers:["(9x-8)(9x+8)","(9x+8)(9x-8)"],display:"(9x \u2212 8)(9x + 8)",
     hint:"Quelle valeur de a donne a\u00b2 = 81x\u00b2 ? Quelle valeur de b donne b\u00b2 = 64 ?",
     method:"<strong>Explication\u00a0:</strong> a = 9x, b = 8. B = (9x\u00a0\u2212\u00a08)(9x\u00a0+\u00a08)."},
    {sec:"Factoriser \u00e0 l\u2019aide de l\u2019identit\u00e9 (a-b)(a+b) = a\u00b2 \u2212 b\u00b2",scons:"",
     type:"simple",
     eq:"C = 64x\u00b2 \u2212 1",
     answers:["(8x-1)(8x+1)","(8x+1)(8x-1)"],display:"(8x \u2212 1)(8x + 1)",
     hint:"Le deuxi\u00e8me terme est \u00e9gal \u00e0 1\u00b2. Identifie a et b.",
     method:"<strong>Explication\u00a0:</strong> a = 8x, b = 1. C = (8x\u00a0\u2212\u00a01)(8x\u00a0+\u00a01)."},
    {sec:"Factoriser \u00e0 l\u2019aide de l\u2019identit\u00e9 (a-b)(a+b) = a\u00b2 \u2212 b\u00b2",scons:"",
     type:"simple",
     eq:"D = 49x\u00b2 \u2212 36",
     answers:["(7x-6)(7x+6)","(7x+6)(7x-6)"],display:"(7x \u2212 6)(7x + 6)",
     hint:"Cherche les racines carr\u00e9es de 49x\u00b2 et de 36.",
     method:"<strong>Explication\u00a0:</strong> a = 7x, b = 6. D = (7x\u00a0\u2212\u00a06)(7x\u00a0+\u00a06)."},
    /* ── Bloc 2 : terme manquant + factorisation ── */
    {sec:"Compl\u00e9ter le terme manquant et donner la factorisation",
     scons:"Ajoute le terme manquant (mon\u00f4me \u00e0 coefficient positif) pour obtenir une identit\u00e9 remarquable, puis \u00e9cris la factorisation.",
     type:"parts",
     tpl:"<span>A = z\u00b2 + </span>{{0}}<span> + 1 = </span>{{1}}",
     parts:[["2z"],["(z+1)^2","(z+1)2","(z+1)\u00b2"]],
     hint:"(z\u00a0+\u00a0b)\u00b2 = z\u00b2\u00a0+\u00a02bz\u00a0+\u00a0b\u00b2. Ici b\u00b2\u00a0=\u00a01, donc cherche quel terme central donne l\u2019identit\u00e9.",
     method:"<strong>Explication\u00a0:</strong> b\u00a0=\u00a01, terme central = 2\u00d7z\u00d71 = 2z. A = (z\u00a0+\u00a01)\u00b2."},
    {sec:"Compl\u00e9ter le terme manquant et donner la factorisation",scons:"",
     type:"parts",
     tpl:"<span>B = y\u00b2 \u2212 </span>{{0}}<span> + 64 = </span>{{1}}",
     parts:[["16y"],["(y-8)^2","(y-8)2","(y-8)\u00b2"]],
     hint:"(y\u00a0\u2212\u00a0b)\u00b2 = y\u00b2\u00a0\u2212\u00a02by\u00a0+\u00a0b\u00b2. Ici b\u00b2\u00a0=\u00a064, donc b\u00a0=\u00a08. Quel est alors le terme central\u00a0?",
     method:"<strong>Explication\u00a0:</strong> b\u00a0=\u00a08, terme central = 2\u00d7y\u00d78 = 16y. B = (y\u00a0\u2212\u00a08)\u00b2."},
    {sec:"Compl\u00e9ter le terme manquant et donner la factorisation",scons:"",
     type:"parts",
     tpl:"<span>C = 16t\u00b2 \u2212 </span>{{0}}<span> + 1 = </span>{{1}}",
     parts:[["8t"],["(4t-1)^2","(4t-1)2","(4t-1)\u00b2"]],
     hint:"16t\u00b2 = (4t)\u00b2 et le terme constant est 1 = 1\u00b2. Quel est le terme crois\u00e9\u00a0?",
     method:"<strong>Explication\u00a0:</strong> a = 4t, b = 1, terme central = 2\u00d74t\u00d71 = 8t. C = (4t\u00a0\u2212\u00a01)\u00b2."},
    {sec:"Compl\u00e9ter le terme manquant et donner la factorisation",scons:"",
     type:"parts",
     tpl:"<span>D = 25z\u00b2 + </span>{{0}}<span> + 25 = </span>{{1}}",
     parts:[["50z"],["(5z+5)^2","(5z+5)2","(5z+5)\u00b2","25(z+1)^2","25(z+1)2"]],
     hint:"25z\u00b2 = (5z)\u00b2 et 25 = 5\u00b2. Quel est le terme crois\u00e9 de (5z\u00a0+\u00a05)\u00b2\u00a0?",
     method:"<strong>Explication\u00a0:</strong> a = 5z, b = 5, terme central = 2\u00d75z\u00d75 = 50z. D = (5z\u00a0+\u00a05)\u00b2."},
    /* ── Bloc 3 : mise en \u00e9vidence ── */
    {sec:"Factoriser au maximum",scons:"",
     type:"simple",
     eq:"A = 14ry \u2212 35y",
     answers:["7y(2r-5)","7y(-5+2r)"],display:"7y(2r \u2212 5)",
     hint:"Cherche la lettre commune \u00e0 tous les termes et le PGCD des coefficients.",
     method:"<strong>Explication\u00a0:</strong> PGCD(14,35) = 7. Lettre commune\u00a0: y. A = 7y(2r\u00a0\u2212\u00a05)."},
    {sec:"Factoriser au maximum",scons:"",
     type:"simple",
     eq:"B = 42z \u2212 36",
     answers:["6(7z-6)","6(-6+7z)"],display:"6(7z \u2212 6)",
     hint:"Quel est le PGCD de ces deux coefficients\u00a0? Y a-t-il une lettre commune\u00a0?",
     method:"<strong>Explication\u00a0:</strong> PGCD(42,36) = 6. Pas de lettre commune. B = 6(7z\u00a0\u2212\u00a06)."},
    {sec:"Factoriser au maximum",scons:"",
     type:"simple",
     eq:"C = \u221224sz \u2212 18z",
     answers:["-6z(4s+3)","6z(-4s-3)"],display:"\u22126z(4s + 3)",
     hint:"La lettre z est commune. Quel facteur num\u00e9rique peut-on extraire, en gardant des coefficients positifs dans la parenth\u00e8se\u00a0?",
     method:"<strong>Explication\u00a0:</strong> PGCD(24,18) = 6. Lettre commune\u00a0: z. On factorise par \u22126z pour garder des termes positifs. C = \u22126z(4s\u00a0+\u00a03)."},
    {sec:"Factoriser au maximum",scons:"",
     type:"simple",
     eq:"D = \u221263s\u00b2t + 63st\u00b2 + 27t",
     answers:["9t(-7s^2+7st+3)","9t(7st-7s^2+3)","9t(3+7st-7s^2)"],display:"9t(\u22127s\u00b2 + 7st + 3)",
     hint:"Cherche la lettre commune et le PGCD des coefficients. Attention au signe\u00a0: quel facteur permet d\u2019avoir un coefficient positif devant le deuxi\u00e8me terme\u00a0?",
     method:"<strong>Explication\u00a0:</strong> PGCD(63,63,27) = 9. Lettre commune\u00a0: t. D = 9t(\u22127s\u00b2\u00a0+\u00a07st\u00a0+\u00a03)."},
    {sec:"Factoriser au maximum",scons:"",
     type:"simple",
     eq:"E = \u221256s\u00b2 + 48r + 16s",
     answers:["8(-7s^2+6r+2s)","8(6r+2s-7s^2)","8(2s+6r-7s^2)"],display:"8(\u22127s\u00b2 + 6r + 2s)",
     hint:"Quel est le PGCD de 56, 48 et 16\u00a0? Il n\u2019y a pas de lettre commune \u00e0 tous les termes.",
     method:"<strong>Explication\u00a0:</strong> PGCD(56,48,16) = 8. Pas de lettre commune. E = 8(\u22127s\u00b2\u00a0+\u00a06r\u00a0+\u00a02s)."}
  ];
  var TOTAL=QS.length, state;
  function $(id){return document.getElementById(id);}
  function norm(s){return String(s).toLowerCase().replace(/\s+/g,"").replace(/\u2212/g,"-").replace(/\u00b2/g,"2").replace(/\^2/g,"2").replace(/\u00d7/g,"");}
  function buildCards(){
    state=QS.map(function(q){return{done:false,ok:false,errCount:0};});
    var html="",lastSec="";
    for(var i=0;i<TOTAL;i++){var q=QS[i];
      if(q.sec!==lastSec){
        html+='<div class="section-title">'+q.sec+'</div>';
        if(q.scons)html+='<p class="sec-consigne">'+q.scons+'</p>';
        lastSec=q.sec;
      }
      html+='<div class="card" id="card'+i+'"><div class="card-stripe"></div>'
        +'<div class="q-num">Exercice '+(i+1)+' / '+TOTAL+'</div>';
      if(q.type==="simple"){
        html+='<div class="eq-box">'+q.eq+'</div>'
          +'<div class="input-row"><span class="input-label">Forme factoris\u00e9e\u00a0:</span>'
          +'<input type="text" class="answer-input" id="in'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="clearFb('+i+')" /></div>';
      } else {
        var tpl=q.tpl;
        for(var k=0;k<q.parts.length;k++){
          tpl=tpl.replace("{{"+k+"}}",
            '<input type="text" class="box-input" id="b'+i+'_'+k+'" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="clearFb('+i+')" />');
        }
        html+='<div class="expr-line">'+tpl+'</div>';
      }
      html+='<div class="btn-row">'
        +'<button class="btn btn-primary" id="vb'+i+'" onclick="check('+i+')">&#10003; V\u00e9rifier</button>'
        +'<button class="btn btn-hint" id="hb'+i+'" onclick="toggleHint('+i+')">&#128161; Indice</button>'
        +'<button class="btn btn-ghost hidden" id="eb'+i+'" onclick="toggleExpl('+i+')">Voir l\u2019explication</button>'
        +'</div>'
        +'<div class="hint-box" id="hint'+i+'">&#128161; '+q.hint+'</div>'
        +'<div class="method-box" id="method'+i+'">'+q.method+'</div>'
        +'<div class="feedback" id="fb'+i+'"><span class="feedback-icon" id="fbi'+i+'"></span><div><span id="fbt'+i+'"></span></div></div>'
        +'</div>';
    }
    $("cards").innerHTML=html;
    for(var j=0;j<TOTAL;j++){(function(ii){
      var q=QS[ii];
      if(q.type==="simple"){
        var el=$("in"+ii);if(el)el.addEventListener("keydown",function(e){if(e.key==="Enter")check(ii);});
      } else {
        for(var k=0;k<q.parts.length;k++){(function(kk){
          var el=$("b"+ii+"_"+kk);if(el)el.addEventListener("keydown",function(e){if(e.key==="Enter")check(ii);});
        })(k);}
      }
    })(j);}
  }
  function clearFb(i){
    if(state[i].done)return;
    $("fb"+i).className="feedback";$("fbt"+i).innerHTML="";$("fbi"+i).textContent="";
    var q=QS[i];
    if(q.type==="simple"){var el=$("in"+i);if(el&&!el.disabled)el.className="answer-input";}
    else{for(var k=0;k<q.parts.length;k++){var el=$("b"+i+"_"+k);if(el&&!el.disabled)el.className="box-input";}}
  }
  function toggleHint(i){var h=$("hint"+i);var o=h.classList.toggle("show");$("hb"+i).innerHTML=o?"&#128161; Masquer l\u2019indice":"&#128161; Indice";}
  function toggleExpl(i){var m=$("method"+i);var o=m.classList.toggle("reveal");$("eb"+i).textContent=o?"Masquer l\u2019explication":"Voir l\u2019explication";}
  function check(i){
    if(state[i].done)return;
    var q=QS[i], allok=true;
    if(q.type==="simple"){
      var raw=$("in"+i).value.trim();if(raw===""){$("in"+i).focus();return;}
      allok=q.answers.some(function(a){return norm(a)===norm(raw);});
      $("in"+i).className="answer-input "+(allok?"correct-input":"wrong-input");
    } else {
      for(var k=0;k<q.parts.length;k++){
        var el=$("b"+i+"_"+k);if(!el||el.value.trim()===""){if(el)el.focus();return;}
      }
      for(var k=0;k<q.parts.length;k++){
        var raw=$("b"+i+"_"+k).value.trim();
        var good=q.parts[k].some(function(a){return norm(a)===norm(raw);});
        $("b"+i+"_"+k).className="box-input "+(good?"ok":"ko");
        if(!good)allok=false;
      }
    }
    if(allok){
      state[i].done=true;state[i].ok=true;
      if(q.type==="simple")$("in"+i).disabled=true;
      else for(var k=0;k<q.parts.length;k++)$("b"+i+"_"+k).disabled=true;
      $("vb"+i).disabled=true;
      $("eb"+i).classList.remove("hidden");
      $("hint"+i).classList.remove("show");$("hb"+i).innerHTML="&#128161; Indice";
      $("fb"+i).className="feedback show ok";$("fbi"+i).textContent="\u2713";$("fbt"+i).textContent="Bravo, c\u2019est juste\u00a0!";
      update();
    } else {
      state[i].errCount++;
      if(state[i].errCount===1)update();
      if(state[i].errCount<2){
        $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";$("fbt"+i).textContent="Pas encore \u2014 essaie \u00e0 nouveau\u00a0!";
      } else {
        $("eb"+i).classList.remove("hidden");
        $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";$("fbt"+i).textContent="Pas encore \u2014 consulte l\u2019explication.";
      }
    }
  }
  function update(){
    var ok=0,err=0,done=0;
    for(var i=0;i<TOTAL;i++){if(state[i].ok)ok++;if(state[i].errCount>=1)err++;if(state[i].done)done++;}
    $("st-ok").textContent=ok;$("st-err").textContent=err;$("st-rem").textContent=TOTAL-done;
    $("pfill").style.width=Math.round(done/TOTAL*100)+"%";$("prog-text").textContent=done+" / "+TOTAL;
    if(done===TOTAL)showResults(ok);
  }
  function showResults(ok){
    $("res-score").textContent=ok+" / "+TOTAL;
    var stars=(ok===TOTAL)?5:Math.max(1,Math.round(ok/TOTAL*5));var st="";for(var s=0;s<5;s++)st+=(s<stars?"\u2b50":"\u2606");$("stars").textContent=st;
    var msg;
    if(ok===TOTAL)msg="Parfait\u00a0! Tu ma\u00eetrises les identit\u00e9s remarquables et la factorisation.";
    else if(ok>=11)msg="Tr\u00e8s bien\u00a0! Pense \u00e0 v\u00e9rifier les racines carr\u00e9es et les termes crois\u00e9s.";
    else msg="Continue\u00a0! Revois les trois identit\u00e9s remarquables et entra\u00eene-toi.";
    $("res-msg").textContent=msg;$("results").className="results show";$("results").scrollIntoView({behavior:"smooth"});
  }
  function restart(){buildCards();$("results").className="results";update();window.scrollTo({top:0,behavior:"smooth"});}
  buildCards();update();
  </script>
</body>
</html>
