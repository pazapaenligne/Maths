<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Mise en équation</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #fffdf7; --surface: #ffffff; --border: #e8e4d9;
      --yellow: #f5c518; --green: #8dc63f; --blue: #3ab5d8;
      --pink: #f28b82; --orange: #f5a623; --text: #1a1d23; --muted: #8a8f9a; --radius: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem 4rem; position: relative; overflow-x: hidden;
    }
    body::before, body::after { content: ''; position: fixed; border-radius: 50%; z-index: 0; opacity: .13; }
    body::before { width: 340px; height: 340px; background: var(--yellow); top: -80px; right: -80px; }
    body::after  { width: 260px; height: 260px; background: var(--blue); bottom: -60px; left: -60px; }
    .bubble1 { position: fixed; border-radius: 50%; z-index: 0; opacity: .10; width: 180px; height: 180px; background: var(--green); bottom: 120px; right: -40px; }
    .bubble2 { position: fixed; border-radius: 50%; z-index: 0; opacity: .10; width: 120px; height: 120px; background: var(--pink); top: 200px; left: -30px; }

    header { text-align: center; margin-bottom: 2rem; position: relative; z-index: 1; }
    .logo-badge { display: inline-flex; align-items: center; gap: .5rem; background: var(--yellow); color: #000; font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: .3rem .9rem; border-radius: 99px; margin-bottom: .5rem; }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .week-label { font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--muted); margin-bottom: .6rem; letter-spacing: .06em; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 800; line-height: 1.2; }
    h1 .hl-green { color: var(--green); } h1 .hl-blue { color: var(--blue); }
    .subtitle { color: var(--muted); font-size: .88rem; margin-top: .4rem; font-family: 'JetBrains Mono', monospace; }

    /* Progress */
    .progress-wrap { width: 100%; max-width: 660px; margin-bottom: 1.4rem; position: relative; z-index: 1; }
    .progress-info { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-bottom: .4rem; }
    .progress-bar-bg { background: var(--border); border-radius: 99px; height: 7px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--green)); border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }

    /* Score chips */
    .score-row { display: flex; gap: .6rem; margin-bottom: 1.8rem; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
    .chip { display: flex; align-items: center; gap: .4rem; padding: .3rem .75rem; border-radius: 99px; font-size: .8rem; font-family: 'JetBrains Mono', monospace; border: 1.5px solid var(--border); background: var(--surface); font-weight: 600; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
    .chip.correct .dot { background: var(--green); }
    .chip.wrong .dot   { background: var(--pink); }
    .chip.remaining .dot { background: var(--muted); }

    /* Card */
    .card { width: 100%; max-width: 660px; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 2rem 2rem 1.6rem; position: relative; z-index: 1; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
    .card-stripe { position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: var(--radius) var(--radius) 0 0; background: linear-gradient(90deg, var(--yellow), var(--orange), var(--pink), var(--blue), var(--green)); }
    .question-num { font-size: .72rem; font-family: 'JetBrains Mono', monospace; color: var(--muted); margin-bottom: .7rem; text-transform: uppercase; letter-spacing: .08em; }
    .type-badge { display: inline-block; font-size: .65rem; font-weight: 700; padding: .15rem .5rem; border-radius: 4px; margin-bottom: .6rem; text-transform: uppercase; letter-spacing: .08em; }
    .type-qcm  { background: #fff3cd; color: #7a5700; }
    .type-eq   { background: #d4edff; color: #0a4d7a; }

    /* QCM */
    .problem-text { font-size: 1.05rem; font-weight: 700; line-height: 1.5; margin-bottom: 1.4rem; padding: 1rem; background: #fffbeb; border: 1.5px solid var(--yellow); border-radius: 10px; }
    .consigne { font-size: .85rem; color: var(--muted); margin-bottom: 1rem; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
    .choice-btn {
      display: flex; align-items: center; gap: .7rem;
      padding: .75rem 1rem; border-radius: 10px;
      border: 2px solid var(--border); background: var(--bg);
      cursor: pointer; font-family: 'JetBrains Mono', monospace;
      font-size: 1rem; font-weight: 600; color: var(--text);
      transition: border-color .15s, background .15s, transform .1s;
      text-align: left;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--yellow); background: #fffbeb; transform: scale(1.01); }
    .choice-btn .cb-box { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: .8rem; }
    .choice-btn.selected { border-color: var(--yellow); background: #fffbeb; }
    .choice-btn.selected .cb-box { background: var(--yellow); border-color: var(--yellow); }
    .choice-btn.correct-choice { border-color: var(--green); background: #f0faeb; }
    .choice-btn.correct-choice .cb-box { background: var(--green); border-color: var(--green); color: #fff; }
    .choice-btn.wrong-choice { border-color: var(--pink); background: #fff0ef; }
    .choice-btn.wrong-choice .cb-box { background: var(--pink); border-color: var(--pink); color: #fff; }
    .choice-btn:disabled { cursor: default; }

    /* Equation input */
    .equation { font-size: clamp(1.4rem, 3.5vw, 2rem); font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--blue); margin-bottom: .4rem; }
    .question-text { font-size: .9rem; color: var(--muted); margin-bottom: 1.5rem; }
    .input-row { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
    .input-label { font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; font-weight: 700; }
    .answer-input { width: 110px; background: var(--bg); border: 2px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; padding: .5rem .85rem; outline: none; transition: border-color .2s; }
    .answer-input:focus { border-color: var(--blue); }
    .answer-input.correct-input { border-color: var(--green); background: #f0faeb; }
    .answer-input.wrong-input   { border-color: var(--pink); background: #fff0ef; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .55rem 1.2rem; border-radius: 99px; font-family: 'Syne', sans-serif; font-size: .9rem; font-weight: 700; cursor: pointer; border: none; transition: transform .12s, box-shadow .12s; }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .38; cursor: default; }
    .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 3px 10px rgba(58,181,216,.3); }
    .btn-hint    { background: var(--yellow); color: #5a3e00; box-shadow: 0 3px 10px rgba(245,197,24,.25); }
    .btn-ghost   { background: transparent; color: var(--muted); border: 2px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--blue); color: var(--text); }

    /* Feedback */
    .feedback { margin-top: 1.2rem; padding: .75rem 1rem; border-radius: 10px; font-size: .9rem; display: none; align-items: flex-start; gap: .6rem; line-height: 1.5; }
    .feedback.show { display: flex; }
    .feedback.ok { background: #f0faeb; border: 1.5px solid var(--green); color: #3a7d0a; }
    .feedback.ko { background: #fff0ef; border: 1.5px solid var(--pink);  color: #c0392b; }
    .feedback-detail { color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: .82rem; margin-top: .2rem; }

    /* Hint */
    .hint-box { margin-top: .9rem; background: #fffbeb; border: 1.5px dashed var(--yellow); border-radius: 10px; padding: .7rem 1rem; font-size: .84rem; color: #7a6010; display: none; line-height: 1.6; }
    .hint-box.show { display: block; }
    .hint-box strong { color: var(--orange); }

    .nav-row { display: flex; justify-content: space-between; margin-top: 1.4rem; gap: .7rem; }

    /* Results */
    .results { width: 100%; max-width: 660px; text-align: center; display: none; position: relative; z-index: 1; }
    .results.show { display: block; }
    .results-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 2.5rem 2rem; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
    .results-score { font-size: clamp(3rem, 10vw, 5rem); font-weight: 800; line-height: 1; margin: .8rem 0 .4rem; }
    .results-score .s-num { color: var(--blue); }
    .stars { font-size: 2rem; margin: .4rem 0 1rem; }
    .results-msg { color: var(--muted); font-size: .95rem; margin-bottom: 2rem; }
    .recap-list { text-align: left; display: flex; flex-direction: column; gap: .5rem; margin-bottom: 2rem; }
    .recap-item { display: flex; align-items: center; gap: .8rem; padding: .6rem 1rem; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: .82rem; }
    .recap-item .eq { color: var(--blue); flex: 1; font-size: .78rem; }
    .recap-item.ok-item { border-color: #b5e08a; }
    .recap-item.ko-item { border-color: #f9c0bb; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .card, .results { animation: fadeUp .4s ease both; }
  </style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa · Maths · 3ème
  </div>
  <div class="week-label">Semaine 1 – Jour 3</div>
  <h1>Mise en <span class="hl-green">équation</span><br>de <span class="hl-blue">problèmes</span></h1>
  <p class="subtitle">10 exercices · niveau collège</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Question 1 / 10</span>
    <span id="prog-pct">0 %</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<div class="score-row">
  <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span> correctes</div>
  <div class="chip wrong"><div class="dot"></div><span id="count-ko">0</span> erreurs</div>
  <div class="chip remaining"><div class="dot"></div><span id="count-rem">10</span> restantes</div>
</div>

<div class="card" id="ex-card">
  <div class="card-stripe"></div>
  <div class="question-num" id="q-num">Exercice 1</div>
  <div id="q-type-badge"></div>
  <div id="q-content"></div>
  <div class="hint-box" id="hint-box"></div>
  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="fb-icon"></span>
    <div><div id="fb-msg"></div><div class="feedback-detail" id="fb-detail"></div></div>
  </div>
  <div class="nav-row">
    <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()">← Précédent</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled>Suivant →</button>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.5rem">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Résultats
    </div>
    <div class="results-score"><span class="s-num" id="score-num">0</span>/10</div>
    <div class="stars" id="stars-row"></div>
    <div class="results-msg" id="results-msg"></div>
    <div class="recap-list" id="recap-list"></div>
    <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">🔄 Recommencer</button>
  </div>
</div>

<script>
// type: "qcm" ou "eq"
const EXERCISES = [
  { type:"qcm", problem:"Trois DVD (au même prix) et un CD à 12€ sont facturés 57€. Quel est le prix d'un DVD ?",
    choices:["3 + 12x = 57","3 + 12 = 57x","3x + 12 = 57","3x + 12x = 57"], correct:2,
    hint:"x = prix d'un DVD. 3 DVD → 3x, plus 1 CD à 12€ = 57€." },
  { type:"qcm", problem:"Emma a 5 ans de plus que son frère. La somme de leurs âges est 27 ans. Quelle équation modélise cette situation ?",
    choices:["x + 5 = 27","x + (x+5) = 27","5x = 27","2x + 5 = 27x"], correct:1,
    hint:"Frère = x, Emma = x+5. Somme = x + (x+5) = 27." },
  { type:"qcm", problem:"Un rectangle a une longueur double de sa largeur. Son périmètre est 36 cm. Quelle équation modélise la largeur x ?",
    choices:["2x + x = 36","2(2x + x) = 36","x + 2x = 36","4x = 36"], correct:1,
    hint:"Largeur = x, longueur = 2x. Périmètre = 2×(x + 2x) = 36." },
  { type:"qcm", problem:"Un marchand vend des stylos à 2€ et des cahiers à 5€. Il vend 3 stylos et x cahiers pour 31€. Quelle équation ?",
    choices:["2x + 5 = 31","3x + 5x = 31","6 + 5x = 31","2 + 5x = 31"], correct:2,
    hint:"3 stylos = 3×2 = 6€. x cahiers = 5x. Total : 6 + 5x = 31." },
  { type:"qcm", problem:"Le triple d'un nombre diminué de 4 donne 17. Quelle équation ?",
    choices:["3x + 4 = 17","3(x – 4) = 17","3x – 4 = 17","x – 4 = 17"], correct:2,
    hint:"Triple d'un nombre = 3x. Diminué de 4 = 3x – 4. Résultat = 17." },
  { type:"eq", eq:"3x + 12 = 57",   ans:15, hint:"3x = 57 – 12 = 45, donc x = 15. Prix d'un DVD = 15€." },
  { type:"eq", eq:"x + (x+5) = 27", ans:11, hint:"2x + 5 = 27, soit 2x = 22, x = 11. Frère a 11 ans." },
  { type:"eq", eq:"2(2x + x) = 36", ans:6,  hint:"2×3x = 36, soit 6x = 36, x = 6. Largeur = 6 cm." },
  { type:"eq", eq:"6 + 5x = 31",    ans:5,  hint:"5x = 31 – 6 = 25, donc x = 5 cahiers." },
  { type:"eq", eq:"3x – 4 = 17",    ans:7,  hint:"3x = 17 + 4 = 21, donc x = 7." },
];

const TOTAL = EXERCISES.length;
let current = 0;
let userAnswers = new Array(TOTAL).fill(null);
let hintOpen = false;
const $ = id => document.getElementById(id);

function render() {
  const ex = EXERCISES[current];
  $("q-num").textContent = `Exercice ${current + 1}`;
  $("hint-box").innerHTML = "";
  $("hint-box").classList.remove("show");
  $("feedback").className = "feedback";
  hintOpen = false;

  // Type badge
  const badge = $("q-type-badge");
  badge.innerHTML = ex.type === "qcm"
    ? `<span class="type-badge type-qcm">QCM – Choisir la bonne équation</span>`
    : `<span class="type-badge type-eq">Résoudre l'équation</span>`;

  // Content
  const content = $("q-content");
  if (ex.type === "qcm") {
    renderQCM(ex, content);
  } else {
    renderEQ(ex, content);
  }

  updateProgress();
  $("btn-prev").disabled = current === 0;
}

function renderQCM(ex, container) {
  const answered = userAnswers[current] !== null;
  const userChoice = userAnswers[current];

  container.innerHTML = `
    <div class="problem-text">${ex.problem}</div>
    <div class="consigne">Coche l'équation qui correspond au problème.</div>
    <div class="choices" id="choices-grid"></div>
    <div style="margin-top:1rem;display:flex;gap:.7rem;flex-wrap:wrap;">
      <button class="btn btn-primary" id="btn-check-qcm" onclick="checkQCM()" ${answered ? "disabled" : ""}>Valider ✓</button>
      <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    </div>`;

  const grid = document.getElementById("choices-grid");
  ex.choices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.disabled = answered;
    let boxContent = "";
    if (answered) {
      if (i === ex.correct) { btn.classList.add("correct-choice"); boxContent = "✓"; }
      else if (i === userChoice) { btn.classList.add("wrong-choice"); boxContent = "✗"; }
    } else {
      if (userAnswers[current] === null && i === (window._selectedChoice ?? -1)) btn.classList.add("selected");
    }
    btn.innerHTML = `<span class="cb-box">${boxContent}</span><span>${c}</span>`;
    if (!answered) {
      btn.onclick = () => selectChoice(i);
    }
    grid.appendChild(btn);
  });

  if (answered) {
    const correct = userChoice === ex.correct;
    showFeedback(correct, ex, correct ? null : ex.choices[ex.correct]);
    $("btn-next").disabled = false;
  } else {
    $("btn-next").disabled = true;
    window._selectedChoice = null;
  }
}

function selectChoice(i) {
  window._selectedChoice = i;
  document.querySelectorAll(".choice-btn").forEach((b, idx) => {
    b.classList.toggle("selected", idx === i);
    b.querySelector(".cb-box").textContent = idx === i ? "" : "";
  });
}

function checkQCM() {
  if (window._selectedChoice === null || window._selectedChoice === undefined) return;
  userAnswers[current] = window._selectedChoice;
  render();
}

function renderEQ(ex, container) {
  const answered = userAnswers[current] !== null;
  container.innerHTML = `
    <div class="equation">${ex.eq}</div>
    <div class="question-text">Trouve la valeur de <em>x</em> qui vérifie cette équation.</div>
    <div class="input-row">
      <span class="input-label">x =</span>
      <input type="number" class="answer-input ${answered ? (userAnswers[current] === ex.ans ? "correct-input" : "wrong-input") : ""}"
        id="answer-input" placeholder="?" autocomplete="off"
        value="${answered ? userAnswers[current] : ""}"
        ${answered ? "disabled" : ""}/>
      <button class="btn btn-primary" id="btn-check" onclick="checkEQ()" ${answered ? "disabled" : ""}>Valider ✓</button>
      <button class="btn btn-hint" onclick="toggleHint()">? Indice</button>
    </div>`;

  if (!answered) {
    setTimeout(() => {
      const inp = document.getElementById("answer-input");
      if (inp) {
        inp.focus();
        inp.addEventListener("keydown", e => { if (e.key === "Enter") checkEQ(); });
      }
    }, 50);
  } else {
    showFeedback(userAnswers[current] === ex.ans, ex, null);
    $("btn-next").disabled = false;
  }
}

function checkEQ() {
  const val = parseFloat(document.getElementById("answer-input").value);
  if (isNaN(val)) return;
  userAnswers[current] = val;
  render();
}

function showFeedback(correct, ex, correctAnswer) {
  const fb = $("feedback");
  fb.className = "feedback show " + (correct ? "ok" : "ko");
  $("fb-icon").textContent = correct ? "✅" : "❌";
  $("fb-msg").textContent = correct ? "Bonne réponse !" : "Pas tout à fait…";
  if (ex.type === "qcm") {
    $("fb-detail").textContent = correct ? "Tu as bien identifié la bonne équation !" : `La bonne équation était : ${ex.choices[ex.correct]}`;
  } else {
    $("fb-detail").textContent = correct ? `x = ${userAnswers[current]} vérifie bien l'équation.` : `La bonne réponse était x = ${ex.ans}.`;
  }
}

function toggleHint() {
  const h = $("hint-box");
  hintOpen = !hintOpen;
  if (hintOpen) {
    h.innerHTML = `<strong>? Indice :</strong> ${EXERCISES[current].hint}`;
    h.classList.add("show");
  } else { h.classList.remove("show"); }
}

function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = Math.round((answered / TOTAL) * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = `Question ${current + 1} / ${TOTAL}`;
  $("prog-pct").textContent = pct + " %";
  const ok = userAnswers.filter((a, i) => {
    const ex = EXERCISES[i];
    return ex.type === "qcm" ? a === ex.correct : a === ex.ans;
  }).length;
  const ko = userAnswers.filter((a, i) => {
    if (a === null) return false;
    const ex = EXERCISES[i];
    return ex.type === "qcm" ? a !== ex.correct : a !== ex.ans;
  }).length;
  $("count-ok").textContent = ok;
  $("count-ko").textContent = ko;
  $("count-rem").textContent = TOTAL - answered;
}

function nextQ() {
  if (current < TOTAL - 1) { current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResults();
}
function prevQ() { if (current > 0) { current--; render(); } }

function showResults() {
  $("ex-card").style.display = "none";
  $("results-screen").classList.add("show");
  const ok = userAnswers.filter((a, i) => {
    const ex = EXERCISES[i];
    return ex.type === "qcm" ? a === ex.correct : a === ex.ans;
  }).length;
  $("score-num").textContent = ok;
  const stars = ok >= 9 ? 5 : ok >= 7 ? 4 : ok >= 5 ? 3 : ok >= 3 ? 2 : 1;
  $("stars-row").textContent = "⭐".repeat(stars) + "☆".repeat(5 - stars);
  const msgs = ["Continue à t'entraîner !", "Bon début !", "Pas mal !", "Bien joué !", "Très bien !", "Parfait ! Bravo ! 🎉"];
  $("results-msg").textContent = msgs[Math.min(ok, 5)];
  const list = $("recap-list");
  list.innerHTML = "";
  EXERCISES.forEach((ex, i) => {
    const a = userAnswers[i];
    const correct = ex.type === "qcm" ? a === ex.correct : a === ex.ans;
    const div = document.createElement("div");
    div.className = "recap-item " + (correct ? "ok-item" : "ko-item");
    const label = ex.type === "qcm" ? ex.problem.substring(0, 40) + "…" : ex.eq;
    div.innerHTML = `<span>${correct ? "✅" : "❌"}</span><span class="eq">${label}</span>`;
    list.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart() {
  current = 0;
  userAnswers = new Array(TOTAL).fill(null);
  window._selectedChoice = null;
  $("ex-card").style.display = "block";
  $("results-screen").classList.remove("show");
  render();
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
