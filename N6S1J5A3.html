<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pazapa Maths – Droite graduée – S1 J5</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --day-color:#f5c518; --day-dark:#8a6000; --day-light:#fffbeb;
  --day-border:#f5e08a; --day-glow:rgba(245,197,24,.3);
  --bg:#fffdf7; --surface:#ffffff; --surface2:#faf8f2;
  --border:#e8e4d9; --border2:#ddd8cc;
  --green:#8dc63f; --green-light:#f0faeb; --green-dark:#3d7a10;
  --pink:#f28b82; --pink-light:#fff0ef;
  --yellow:#f5c518; --orange:#f5a623; --blue:#3ab5d8;
  --text:#1a1d23; --muted:#8a8f9a;
  --radius:14px; --radius-sm:9px;
  --neon-g:0 0 12px rgba(245,197,24,.55), 0 0 28px rgba(245,197,24,.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg); color:var(--text);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:1.6rem 1rem 3.5rem; position:relative; overflow-x:hidden;line-height:1.8;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(245,197,24,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,197,24,.05) 1px, transparent 1px);
  background-size:44px 44px;
}
.g1{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(4px);opacity:.55;width:220px;height:220px;background:#ffd84d;top:-60px;right:-50px;}
.g2{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(4px);opacity:.55;width:240px;height:240px;background:var(--day-border);bottom:-80px;left:-70px;}
.g3{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(4px);opacity:.45;width:150px;height:150px;background:#9be7a5;top:45%;right:-70px;}
.g4{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(4px);opacity:.45;width:130px;height:130px;background:#f9b8c5;top:30%;left:-60px;}

.wrap{width:100%;max-width:780px;position:relative;z-index:1;}

header{text-align:center;margin-bottom:1.6rem;}
.logo-badge{
  display:inline-flex;align-items:center;gap:.45rem;
  background:linear-gradient(135deg,var(--day-dark),var(--day-color));
  color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:.3rem 1rem;border-radius:99px;
  margin-bottom:.6rem;white-space:nowrap;box-shadow:var(--neon-g);
}
.logo-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.week-label{font-size:.78rem;color:var(--muted);margin-bottom:.5rem;letter-spacing:.06em;}
.defi-banner{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:.4rem;}
.trophy{font-size:2.2rem;animation:trophy-bounce 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(245,197,24,.8));}
@keyframes trophy-bounce{
  0%,100%{transform:translateY(0) rotate(-8deg);filter:drop-shadow(0 0 8px rgba(245,197,24,.7));}
  30%{transform:translateY(-8px) rotate(8deg);filter:drop-shadow(0 0 18px rgba(245,197,24,1));}
  60%{transform:translateY(-4px) rotate(-4deg);filter:drop-shadow(0 0 12px rgba(245,197,24,.85));}
}
.defi-title{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(1.1rem,4.5vw,1.7rem);
  background:linear-gradient(135deg,var(--day-dark),var(--day-color),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.04em;
}
.defi-stars{display:flex;gap:3px;}
.defi-stars span{font-size:1rem;animation:star-pop 2s ease-in-out infinite;}
.defi-stars span:nth-child(1){animation-delay:0s;}
.defi-stars span:nth-child(2){animation-delay:.15s;}
.defi-stars span:nth-child(3){animation-delay:.3s;}
@keyframes star-pop{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.4);opacity:1;filter:drop-shadow(0 0 4px #f5c518);}}
h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(1.3rem,5vw,2rem);line-height:1.2;word-break:break-word;}
h1 .hl{color:var(--day-dark);text-shadow:var(--neon-g);}
.subtitle{color:var(--muted);font-size:clamp(.75rem,2.5vw,.85rem);margin-top:.4rem;letter-spacing:.04em;}

.scorebar{
  position:sticky;top:0;z-index:5;width:100%;
  background:rgba(255,253,247,.92);backdrop-filter:blur(12px);
  border:1.5px solid var(--border2);border-radius:99px;
  padding:.55rem 1.1rem;margin-bottom:1.6rem;
  display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.sb-label{font-size:.76rem;font-weight:700;color:var(--day-dark);white-space:nowrap;letter-spacing:.04em;}
.sb-track{flex:1;min-width:100px;height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.sb-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--day-dark),var(--day-color),var(--orange));border-radius:99px;transition:width .5s ease;box-shadow:var(--neon-g);}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .65rem;border-radius:99px;font-size:.72rem;white-space:nowrap;border:1px solid var(--border2);background:var(--surface2);font-weight:700;}
.chip .dot{width:7px;height:7px;border-radius:50%;}
.chip.correct .dot{background:var(--green);}
.chip.wrong .dot{background:var(--pink);}

.card{
  width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:0;position:relative;z-index:1;
  box-shadow:0 6px 24px rgba(0,0,0,.08);animation:fadeUp .4s ease both;margin-bottom:1.4rem;overflow:hidden;
}
.card-header{background:#13161e;padding:1.2rem 1.6rem 1.1rem;border-bottom:1px solid rgba(245,197,24,.2);}
.card-stripe{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--day-dark),var(--day-color),var(--orange),var(--blue));box-shadow:0 0 10px rgba(245,197,24,.4);}
.q-num{font-size:.65rem;color:#5a6080;margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.12em;}
.theme-badge{display:inline-block;font-size:.62rem;font-weight:700;padding:.14rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.6rem;background:rgba(245,197,24,.12);color:var(--day-color);border:1px solid rgba(245,197,24,.3);}
.eq-box{background:rgba(245,197,24,.08);border:1px solid rgba(245,197,24,.3);border-radius:var(--radius-sm);padding:.75rem 1rem;font-size:clamp(.95rem,3vw,1.1rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.5;word-break:break-word;text-shadow:0 0 14px rgba(245,197,24,.25);}
.card-body{background:var(--surface);padding:1.4rem 1.6rem 1.4rem;}
.method-box{background:var(--surface2);border:1.5px solid var(--border);border-left:3px solid var(--day-color);border-radius:var(--radius-sm);padding:.75rem 1rem;margin-bottom:1.1rem;font-size:clamp(.78rem,2.4vw,.84rem);color:#5a5f72;line-height:1.8;word-break:break-word;}
.method-box strong{color:var(--day-dark);}

/* DROITE GRADUÉE */
.place-legend{display:flex;flex-wrap:wrap;gap:.45rem;margin:.2rem 0 .8rem;}
.pl-chip{display:flex;align-items:center;gap:.4rem;padding:.32rem .75rem;border-radius:99px;border:2px solid var(--border);background:#fff;font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:600;cursor:pointer;transition:transform .12s,border-color .15s;min-height:40px;}
.pl-chip:active{transform:scale(.96);}
.pl-chip .pl-name{font-weight:800;}
.pl-chip.sel{border-color:var(--day-color);background:var(--day-light);box-shadow:0 0 0 3px rgba(245,197,24,.18);}
.pl-chip.done{opacity:.55;}
.pl-chip .pl-val{color:var(--muted);}
.place-tip{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--muted);margin:0 0 .8rem;line-height:1.7;}
.line-block{margin:.6rem 0 1rem;}
.line-stage{position:relative;width:100%;}
.line-stage svg{display:block;width:100%;height:auto;}
.read-answers{display:flex;flex-wrap:wrap;gap:.55rem .9rem;justify-content:center;margin:.4rem 0 .2rem;}
.ra-cell{display:flex;align-items:center;gap:.35rem;}
.ra-lab{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.92rem;}
.nl-input{width:84px;background:var(--day-light);border:2px solid var(--day-border);border-radius:8px;color:var(--day-dark);font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:600;text-align:center;padding:.4rem .1rem;outline:none;transition:border-color .2s,background .2s;min-height:40px;}
.nl-input:focus{border-color:var(--day-dark);background:#fff;}
.nl-input.ok{border-color:var(--green);background:#e7faec;color:#2f6e10;}
.nl-input.ko{border-color:var(--pink);background:var(--pink-light);color:#c0392b;}
.nl-input:disabled{cursor:default;}

.tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.1rem;justify-content:flex-start;}
.btn{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.6rem 1.2rem;border-radius:var(--radius-sm);
  font-family:'Orbitron',sans-serif;font-size:clamp(.7rem,2.2vw,.78rem);font-weight:700;letter-spacing:.06em;
  cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:44px;
}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;}
.btn-p{background:linear-gradient(135deg,var(--day-dark),var(--day-color));color:#fff;box-shadow:var(--neon-g);}
.btn-p:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 20px rgba(245,197,24,.6);}
.btn-g{background:var(--surface2);color:var(--muted);border:1.5px solid var(--border2);}
.btn-g:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

.hint{margin-top:.8rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:var(--radius-sm);padding:.65rem 1rem;font-size:clamp(.78rem,2.4vw,.84rem);color:#7a6010;line-height:1.8;display:none;word-break:break-word;}
.hint.show{display:block;}
.hint strong{color:var(--orange);}

.fb{margin-top:.9rem;padding:.75rem 1rem;border-radius:var(--radius-sm);font-size:clamp(.84rem,2.5vw,.9rem);display:none;align-items:flex-start;gap:.6rem;line-height:1.8;}
.fb.show{display:flex;animation:pop .3s cubic-bezier(.18,.89,.32,1.6);}
.fb.ok{background:var(--green-light);border:1.5px solid var(--green);color:var(--green-dark);}
.fb.ko{background:var(--pink-light);border:1.5px solid var(--pink);color:#c0392b;}
.fb-icon{font-size:1.2rem;flex-shrink:0;}
.fb-detail{color:#5a5f72;font-size:clamp(.74rem,2.2vw,.8rem);margin-top:.2rem;line-height:1.8;}

.global{
  width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:0;position:relative;z-index:1;
  box-shadow:0 6px 24px rgba(0,0,0,.08);overflow:hidden;
}
.global .card-stripe{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--day-dark),var(--day-color),var(--orange),var(--blue));box-shadow:0 0 10px rgba(245,197,24,.4);}
.global-inner{padding:2.2rem 1.6rem 1.8rem;text-align:center;}
.global-score{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2.6rem,11vw,4.5rem);line-height:1;margin:.4rem 0;}
.global-score .s-num{color:var(--day-dark);text-shadow:var(--neon-g);}
.stars{font-size:1.9rem;margin:.3rem 0 .9rem;letter-spacing:.1em;}
.global-msg{color:var(--muted);font-size:clamp(.84rem,2.6vw,.92rem);margin-bottom:1.4rem;line-height:1.7;word-break:break-word;}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes pop{0%{transform:scale(.9);}60%{transform:scale(1.03);}100%{transform:scale(1);}}

@media(max-width:520px){
  .card-body{padding:1.1rem 1rem;}
  .card-header{padding:1rem 1rem .9rem;}
  .tools{flex-direction:column;}
  .btn{width:100%;justify-content:center;}
}
</style>
</head>
<body>
<div class="g1"></div><div class="g2"></div><div class="g3"></div><div class="g4"></div>
<div class="wrap">

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa &middot; Maths &middot; 6e
  </div>
  <div class="week-label">Semaine 1 — Jour 5</div>
  <div class="defi-banner">
    <div class="trophy">&#127942;</div>
    <div class="defi-title">Je relève le défi&nbsp;!</div>
    <div class="defi-stars"><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span></div>
  </div>
  <h1>Placer et lire sur la <span class="hl">droite graduée</span></h1>
  <p class="subtitle">4 exercices &middot; placer &middot; lire des abscisses</p>
</header>

<div class="scorebar">
  <span class="sb-label" id="sb-label">0 / 16 points</span>
  <div class="sb-track"><div class="sb-fill" id="sb-fill"></div></div>
  <span class="chip correct"><span class="dot"></span><span id="sb-ok">0</span></span>
  <span class="chip wrong"><span class="dot"></span><span id="sb-ko">0</span></span>
</div>

<div id="cards"></div>

<div class="global">
  <div class="card-stripe"></div>
  <div class="global-inner">
    <div style="font-family:'Orbitron',sans-serif;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.5rem;">Bilan final</div>
    <div class="global-score"><span class="s-num" id="g-num">0</span> / 16</div>
    <div class="stars" id="g-stars">&#9734;&#9734;&#9734;&#9734;&#9734;</div>
    <div class="global-msg" id="g-msg">Valide les 4 exercices pour voir ton bilan.</div>
    <button class="btn btn-p" onclick="restartAll()" style="margin:0 auto;display:inline-flex;">&#8635; Tout recommencer</button>
  </div>
</div>

</div>

<script>
var COL={red:'#e8453c',blue:'#3ab5d8',green:'#8dc63f',orange:'#f5a623',
  purple:'#9b59b6',cyan:'#7fc7e8',pink:'#e84393',black:'#1a1d23'};

var EXS=[
  {
    mode:'place', theme:'Placer des points', title:'Place les points M, N, O et P.',
    method:"<strong>Méthode&nbsp;:</strong> sélectionne un point, puis clique sur la bonne graduation. Entre deux entiers il y a 5 intervalles, donc chaque graduation vaut 0,2.",
    txt:'Sélectionne un point puis clique sur la bonne graduation.',
    line:{start:7.8,end:10.4,step:0.2,majors:[8,9,10]},
    points:[{name:'M',val:8.8,color:COL.red},{name:'N',val:9.2,color:COL.blue},{name:'O',val:8.4,color:COL.green},{name:'P',val:9.6,color:COL.orange}],
    hint:"Chaque graduation vaut 0,2. Compte les graduations depuis l'entier le plus proche."
  },
  {
    mode:'place', theme:'Placer au millième', title:'Place les points Q, R, S et T.',
    method:"<strong>Méthode&nbsp;:</strong> ici on travaille au millième. De 2,18 à 2,19 il y a 10 intervalles, donc chaque graduation vaut 0,001.",
    txt:'Sélectionne un point puis clique sur la bonne graduation.',
    line:{start:2.18,end:2.234,step:0.001,majors:[2.18,2.19]},
    points:[{name:'Q',val:2.185,color:COL.red},{name:'R',val:2.191,color:COL.blue},{name:'S',val:2.189,color:COL.green},{name:'T',val:2.23,color:COL.orange}],
    hint:"Chaque graduation vaut 0,001. Repère d'abord 2,2 (le premier grand trait après 2,19), puis avance jusqu'au troisième grand trait pour T = 2,23."
  },
  {
    mode:'read', theme:'Lire des abscisses', title:'Donne les abscisses des points A, B, C, D et E.',
    method:"<strong>Méthode&nbsp;:</strong> les grandes graduations sont les dixièmes. Entre deux, chaque petite graduation vaut 0,01.",
    txt:"Lis l'abscisse de chaque point coloré et écris-la sous la droite.",
    line:{start:28.55,end:29.12,step:0.01,majors:[28.6,28.7,28.8,28.9,29],
      marks:[{name:'A',val:28.65,color:COL.red},{name:'B',val:28.75,color:COL.blue},{name:'C',val:28.83,color:COL.green},{name:'D',val:28.99,color:COL.orange},{name:'E',val:29.01,color:COL.black}]},
    hint:"Les grandes graduations sont les dixièmes (28,6 ; 28,7 …). Chaque petite graduation vaut 0,01."
  },
  {
    mode:'read', theme:'Lire au millième', title:'Donne les abscisses des points A, B et C.',
    method:"<strong>Méthode&nbsp;:</strong> de 15,7 à 15,71 il y a 10 intervalles, donc chaque graduation vaut 0,001.",
    txt:"Travaille au millième&nbsp;: lis l'abscisse de chaque point coloré.",
    line:{start:15.698,end:15.714,step:0.001,majors:[15.7,15.71],
      marks:[{name:'A',val:15.702,color:COL.pink},{name:'B',val:15.707,color:COL.cyan},{name:'C',val:15.711,color:COL.purple}]},
    hint:"Chaque graduation vaut 0,001 (un millième). Compte depuis le repère 15,7."
  }
];

var TOTAL=0; EXS.forEach(function(e){TOTAL+=(e.mode==='place'?e.points.length:e.line.marks.length);});
var done=new Array(EXS.length).fill(false);
var groupScore=new Array(EXS.length).fill(0);
var sel=new Array(EXS.length).fill(null);
function $(id){return document.getElementById(id);}
function rnd(v){return Math.round(v*1e6)/1e6;}
function fr(v){return String(rnd(v)).replace('.',',');}
function numNorm(s){var n=parseFloat(String(s).trim().replace(/\u202f/g,'').replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n;}
function valOk(t,v){var n=numNorm(v);return n!==null && Math.abs(n-t)<1e-9;}

var VW=640,padL=42,padR=42,axisY=58,VH=110;
function makeSVG(cfg){
  var span=cfg.end-cfg.start;
  var xv=function(v){return padL+(v-cfg.start)/span*(VW-padL-padR);};
  var NS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 '+VW+' '+VH);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  var axis=document.createElementNS(NS,'line');
  axis.setAttribute('x1',padL-12);axis.setAttribute('y1',axisY);
  axis.setAttribute('x2',VW-padR+6);axis.setAttribute('y2',axisY);
  axis.setAttribute('stroke','#1a1d23');axis.setAttribute('stroke-width','2.4');svg.appendChild(axis);
  var arr=document.createElementNS(NS,'path');
  arr.setAttribute('d','M'+(VW-padR+6)+','+(axisY-6)+' L'+(VW-padR+18)+','+axisY+' L'+(VW-padR+6)+','+(axisY+6)+' Z');
  arr.setAttribute('fill','#1a1d23');svg.appendChild(arr);
  var nb=Math.round(span/cfg.step);
  for(var i=0;i<=nb;i++){
    var v=rnd(cfg.start+i*cfg.step);
    var isMajor=cfg.majors.some(function(m){return Math.abs(m-v)<1e-6;});
    var ten=(i%10===0)&&!isMajor;
    var half=(i%5===0)&&!isMajor&&!ten;
    var h=isMajor?15:(ten?12:(half?9:7));
    var tick=document.createElementNS(NS,'line');
    tick.setAttribute('x1',xv(v));tick.setAttribute('y1',axisY-h);
    tick.setAttribute('x2',xv(v));tick.setAttribute('y2',axisY+(isMajor?h:0));
    tick.setAttribute('stroke','#1a1d23');tick.setAttribute('stroke-width',isMajor?'2.4':'1.3');
    svg.appendChild(tick);
    if(isMajor){
      var t=document.createElementNS(NS,'text');
      t.setAttribute('x',xv(v));t.setAttribute('y',axisY+30);
      t.setAttribute('text-anchor','middle');t.setAttribute('font-family',"'JetBrains Mono',monospace");
      t.setAttribute('font-size','13');t.setAttribute('font-weight','600');t.setAttribute('fill','#1a1d23');
      t.textContent=fr(v);svg.appendChild(t);
    }
  }
  return {svg:svg,xv:xv,NS:NS};
}
function drawCross(svg,NS,px,col,name){
  var s=5;
  var cr=document.createElementNS(NS,'path');
  cr.setAttribute('d','M'+(px-s)+','+(axisY-s)+' L'+(px+s)+','+(axisY+s)+' M'+(px-s)+','+(axisY+s)+' L'+(px+s)+','+(axisY-s));
  cr.setAttribute('stroke',col);cr.setAttribute('stroke-width','2.6');cr.setAttribute('stroke-linecap','round');
  svg.appendChild(cr);
  if(name){
    var lt=document.createElementNS(NS,'text');
    lt.setAttribute('x',px);lt.setAttribute('y',axisY-22);lt.setAttribute('text-anchor','middle');
    lt.setAttribute('font-family',"'Orbitron',sans-serif");lt.setAttribute('font-size','15');
    lt.setAttribute('font-weight','700');lt.setAttribute('fill',col);lt.textContent=name;
    svg.appendChild(lt);
  }
}

function build(){
  var host=$("cards");host.innerHTML="";
  EXS.forEach(function(ex,gi){
    var card=document.createElement("div");card.className="card";card.id="card-"+gi;
    var html='<div class="card-stripe"></div><div class="card-header">'
      +'<div class="q-num">Exercice '+(gi+1)+' / '+EXS.length+'</div>'
      +'<div class="theme-badge">'+ex.theme+'</div>'
      +'<div class="eq-box">'+ex.title+'</div></div>'
      +'<div class="card-body"><div class="method-box">'+ex.method+'</div>'
      +'<div id="body-'+gi+'"></div>'
      +'<div class="tools">'
      +'<button class="btn btn-g" id="btnh-'+gi+'" onclick="toggleHint('+gi+')">? Indice</button>'
      +'<button class="btn btn-p" id="btnc-'+gi+'" onclick="checkGroup('+gi+')" disabled>✓ Valider</button>'
      +'<button class="btn btn-g" id="btnr-'+gi+'" onclick="resetGroup('+gi+')" style="display:none;">&#8635; Recommencer</button>'
      +'<button class="btn btn-g" id="btns-'+gi+'" onclick="showSolution('+gi+')" disabled>Solution</button>'
      +'</div>'
      +'<div class="hint" id="hint-'+gi+'"><strong>Astuce&nbsp;:</strong> '+ex.hint+'</div>'
      +'<div class="hint" id="solbox-'+gi+'" style="border-style:solid;border-color:var(--day-border);background:var(--day-light);color:var(--day-dark);"></div>'
      +'<div class="fb" id="fb-'+gi+'"><span class="fb-icon" id="fbi-'+gi+'"></span><div><div id="fbm-'+gi+'"></div><div class="fb-detail" id="fbd-'+gi+'"></div></div></div>'
      +'</div>';
    card.innerHTML=html;host.appendChild(card);
    renderBody(gi);
  });
  updateScorebar();
}

function renderBody(gi){
  var ex=EXS[gi];var body=$("body-"+gi);body.innerHTML="";
  if(ex.mode==='place'){
    if(!ex._placed)ex._placed={};
    var leg=document.createElement('div');leg.className='place-legend';
    ex.points.forEach(function(p){
      var c=document.createElement('div');c.className='pl-chip';c.dataset.name=p.name;
      c.innerHTML='<span class="pl-name" style="color:'+p.color+'">'+p.name+'</span><span class="pl-val">'+fr(p.val)+'</span>';
      if(ex._placed[p.name]!==undefined)c.classList.add('done');
      if(sel[gi]===p.name)c.classList.add('sel');
      c.onclick=function(){if(done[gi])return;sel[gi]=p.name;renderBody(gi);};
      leg.appendChild(c);
    });
    body.appendChild(leg);
    var tip=document.createElement('div');tip.className='place-tip';tip.innerHTML='1. Clique sur un point ci-dessus.<br>2. Clique sur la graduation choisie.';
    body.appendChild(tip);
    var r=makeSVG(ex.line);var svg=r.svg,xv=r.xv,NS=r.NS;
    var span=ex.line.end-ex.line.start;var nb=Math.round(span/ex.line.step);
    if(!done[gi]){
      for(var i=0;i<=nb;i++){
        var v=rnd(ex.line.start+i*ex.line.step);var px=xv(v);
        var hit=document.createElementNS(NS,'rect');
        hit.setAttribute('x',px-7);hit.setAttribute('y',axisY-22);hit.setAttribute('width','14');hit.setAttribute('height','44');
        hit.setAttribute('fill','transparent');hit.style.cursor='pointer';
        (function(val){hit.addEventListener('click',function(){placeAt(gi,val);});})(v);
        svg.appendChild(hit);
      }
    }
    Object.keys(ex._placed).forEach(function(name){
      var p=ex.points.find(function(q){return q.name===name;});
      var col=p.color;
      if(done[gi]){col=Math.abs(ex._placed[name]-p.val)<1e-9?'#3a7d0a':'#c0392b';}
      drawCross(svg,NS,xv(ex._placed[name]),col,p.name);
    });
    var block=document.createElement('div');block.className='line-block';
    var stage=document.createElement('div');stage.className='line-stage';stage.appendChild(svg);
    block.appendChild(stage);body.appendChild(block);
    updPlaceBtn(gi);
  }else{
    var rr=makeSVG(ex.line);
    ex.line.marks.forEach(function(m){drawCross(rr.svg,rr.NS,rr.xv(m.val),m.color||'#1a1d23',m.name);});
    var block2=document.createElement('div');block2.className='line-block';
    var stage2=document.createElement('div');stage2.className='line-stage';stage2.appendChild(rr.svg);
    block2.appendChild(stage2);body.appendChild(block2);
    var row=document.createElement('div');row.className='read-answers';
    ex.line.marks.forEach(function(m,mi){
      var cell=document.createElement('div');cell.className='ra-cell';
      var lab=document.createElement('span');lab.className='ra-lab';lab.style.color=m.color||'#1a1d23';lab.textContent=m.name+' =';
      var inp=document.createElement('input');inp.type='text';inp.className='nl-input';inp.placeholder='?';inp.autocomplete='off';inp.id='r-'+gi+'-'+mi;inp.inputMode='decimal';
      if(done[gi]&&ex._ans){inp.value=ex._ans[mi];inp.disabled=true;inp.className='nl-input '+(valOk(m.val,ex._ans[mi])?'ok':'ko');}
      else{inp.addEventListener('input',function(){updReadBtn(gi);});}
      cell.appendChild(lab);cell.appendChild(inp);row.appendChild(cell);
    });
    body.appendChild(row);
    updReadBtn(gi);
  }
}
