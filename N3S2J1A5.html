<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Série d'exercices Niveau 3 (S2 J1)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f5a623;--day-dark:#c47a10;--day-title:#c47a10;--day-light:#fff5e0;--day-border:#f5d080;--badge-txt:#ffffff;--day-glow:rgba(245,166,35,.20);
  --bg:#ffffff;--surface:#ffffff;--border:#ece2d0;--green:#5fa800;--green-soft:#8dc63f;--pink:#f28b82;--orange:#f5a623;--red:#d33;
  --text:#1a1d23;--muted:#7a7568;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 3rem;overflow-x:hidden;line-height:1.7;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}
.frame{position:relative;overflow:hidden;max-width:720px;margin:0 auto;
  background:radial-gradient(300px 300px at 100% 0%,rgba(245,166,35,.16),transparent 60%),
             radial-gradient(240px 240px at 0% 100%,rgba(245,208,128,.20),transparent 60%),
             radial-gradient(150px 150px at 100% 80%,rgba(245,166,35,.10),transparent 60%),var(--bg);}
.bubble{position:absolute;border-radius:50%;pointer-events:none;}
.b1{width:280px;height:280px;top:-70px;right:-80px;background:var(--day);opacity:.42;}
.b2{width:220px;height:220px;bottom:160px;left:-80px;background:var(--day-border);opacity:.5;}
.b3{width:150px;height:150px;bottom:-30px;right:-40px;background:var(--day-border);opacity:.45;}
.layer{position:relative;z-index:1;}
.hero{background:var(--surface);border-bottom:2px solid var(--day-light);padding:2rem 1.25rem 1.6rem;text-align:center;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--day);color:var(--badge-txt);font-size:clamp(.66rem,2.6vw,.8rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.4rem 1.1rem;border-radius:99px;margin-bottom:.8rem;white-space:nowrap;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);letter-spacing:.14em;margin-bottom:.5rem;}
.hero h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.5rem,6vw,2.1rem);font-weight:900;line-height:1.15;color:var(--text);}
.hero h1 .hl{color:var(--day-title);}
.hero .subtitle{color:var(--muted);font-size:clamp(.82rem,3vw,.92rem);margin-top:.5rem;}
.level-pills{display:flex;gap:.4rem;justify-content:center;margin-top:.9rem;flex-wrap:wrap;}
.lp{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;padding:.3rem .7rem;border-radius:99px;border:2px solid var(--day-border);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.lp.active{background:var(--day);color:#fff;border-color:var(--day);}
.gamebox{max-width:720px;margin:1.3rem auto 0;padding:0 1.25rem;}
.scoreboard-sticky{position:sticky;top:0;z-index:5;}
.gb-inner{background:var(--surface);border:2px solid var(--day-border);border-radius:14px;padding:1rem;box-shadow:0 4px 16px var(--day-glow);}
.gb-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.16em;color:var(--day-dark);text-align:center;margin-bottom:.6rem;text-transform:uppercase;}
.scoreboard{display:flex;gap:.5rem;margin-bottom:.8rem;}
.sb{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:.5rem .3rem;text-align:center;}
.sb .v{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:clamp(2rem,7vw,2.4rem);line-height:1;}
.sb .l{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.1em;color:var(--muted);margin-top:.25rem;text-transform:uppercase;}
.sb.ok{border-color:#c7e89a;} .sb.ok .v{color:var(--green);}
.sb.rem{border-color:var(--day-border);} .sb.rem .v{color:var(--day-dark);}
.sb.err{border-color:#f4c4bf;} .sb.err .v{color:var(--red);}
.xp-bg{background:var(--border);border-radius:99px;height:13px;overflow:hidden;}
.xp-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--day-border));transition:width .6s ease;}
.xp-txt{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--day-dark);text-align:right;margin-top:.3rem;letter-spacing:.08em;}
.main{max-width:720px;margin:0 auto;padding:1.3rem 1.25rem 0;}
.card{background:var(--surface);border:2px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.3rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.card-stripe{height:5px;background:linear-gradient(90deg,#f5a623,#f5c518,#8dc63f,#3ab5d8);}
.card-inner{padding:1.4rem 1.2rem;}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:.9rem;flex-wrap:wrap;}
.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:900;flex-shrink:0;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.q-cat{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;padding:.2rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;margin-left:auto;white-space:nowrap;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1.1rem,4vw,1.4rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.5;}
.q-text{font-size:.9rem;color:var(--text);margin-bottom:.8rem;line-height:1.7;}
table.valtab{border-collapse:collapse;margin:.4rem auto .2rem;font-family:'JetBrains Mono',monospace;}
table.valtab td,table.valtab th{border:2px solid var(--day-border);padding:.45rem .7rem;text-align:center;font-size:.95rem;background:#fff;}
table.valtab th{background:var(--day-light);color:var(--day-dark);}
.input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.6rem;}
.input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:var(--text);}
.answer-input{width:120px;background:#fff;border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:.55rem .7rem;outline:none;transition:border-color .2s;min-height:2.6rem;text-align:center;}
.answer-input:focus{border-color:var(--day);box-shadow:0 0 0 3px var(--day-glow);}
.answer-input.correct-input{border-color:var(--green-soft);background:#f0faeb;}
.answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}
.qcm-row{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.6rem;}
.qcm-choice{display:flex;align-items:center;gap:.7rem;padding:.65rem 1rem;border:2px solid var(--border);border-radius:10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.92rem;transition:.15s;background:#fff;min-height:2.6rem;}
.qcm-choice:hover:not(.locked){border-color:var(--day);background:var(--day-light);}
.qcm-choice.selected{border-color:var(--day);background:var(--day-light);}
.qcm-choice.correct-c{border-color:var(--green-soft);background:#f0faeb;color:#2f6e10;cursor:default;}
.qcm-choice.wrong-c{border-color:var(--pink);background:#fff0ef;color:#c0392b;cursor:default;}
.qcm-choice.locked{cursor:default;}
.qcm-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;}
.qcm-choice.selected .qcm-radio{background:var(--day);border-color:var(--day);}
.qcm-choice.correct-c .qcm-radio{background:var(--green-soft);border-color:var(--green-soft);}
.qcm-choice.wrong-c .qcm-radio{background:var(--pink);border-color:var(--pink);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;letter-spacing:.04em;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s,background .15s;min-height:2.6rem;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);} .btn:disabled{opacity:.4;cursor:default;}
.btn-check{background:var(--green);color:#fff;}
.btn-check:hover:not(:disabled){box-shadow:0 4px 14px rgba(95,168,0,.4);}
.btn-hint{background:#fff;border:2px solid var(--orange);color:#b06f0c;}
.btn-hint:hover{background:#fff7ec;}
.btn-retry{background:#fff;border:2px solid var(--day);color:var(--day-dark);}
.btn-retry:hover{background:var(--day-light);}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem;}
.hint-box{margin-top:.9rem;background:var(--day-light);border:1.5px dashed var(--day);border-radius:10px;padding:.7rem 1rem;font-size:.82rem;color:var(--day-dark);display:none;line-height:1.7;font-family:'JetBrains Mono',monospace;}
.hint-box.show{display:block;}
.fb{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;font-size:.88rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
.fb.show{display:flex;}
.fb.ok{background:#f0faeb;border:1.5px solid var(--green-soft);color:#3a7d0a;}
.fb.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
.fb-icon{font-size:1.4rem;flex-shrink:0;}
.fb-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.7;}
.results{display:none;}.results.show{display:block;}
.results-card{background:var(--surface);border:2px solid var(--day-border);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px var(--day-glow);margin-bottom:1.3rem;}
.results-inner{padding:2rem 1.3rem;text-align:center;}
.results-trophy{font-size:3.4rem;animation:bounce 3s infinite;display:block;margin-bottom:.3rem;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-7px) rotate(5deg);}}
.results-score{font-family:'JetBrains Mono',monospace;font-size:clamp(2.6rem,11vw,4rem);font-weight:900;line-height:1;margin:.3rem 0 .2rem;}
.results-score .s-num{color:var(--green);}
.stars-row{font-size:1.9rem;margin:.3rem 0 .9rem;letter-spacing:.15rem;}
.results-msg{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:.95rem;margin-bottom:1.4rem;letter-spacing:.03em;}
.restart-wrap{max-width:720px;margin:0 auto;padding:0 1.25rem;text-align:center;}
.btn-restart{background:var(--day);color:#fff;font-size:.95rem;padding:.8rem 2rem;}
.btn-restart:hover{background:var(--day-dark);}
footer{text-align:center;margin-top:2.2rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.06em;}
@media(max-width:560px){.scoreboard{gap:.35rem;}.sb{padding:.45rem .12rem;}.sb .v{font-size:1.9rem;}}
@media(max-width:480px){.hero{padding:1.6rem 1rem 1.4rem;}.main,.gamebox,.restart-wrap{padding:0 1rem;}.card-inner{padding:1.2rem 1rem;}.btn-row{flex-direction:column;}.btn-check,.btn-hint,.btn-retry{width:100%;}}
</style>
</head>
<body>
<div class="frame">
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
  <div class="layer">
    <div class="hero">
      <div class="logo-badge">
        <span class="logo-dot" style="background:#f5a623"></span>
        <span class="logo-dot" style="background:#f5d080"></span>
        <span class="logo-dot" style="background:#c47a10"></span>
        Pazapa &middot; Maths &middot; 3&egrave;me
      </div>
      <div class="week-label">SEMAINE 2 &mdash; JOUR 1</div>
      <h1>&#9999;&#65039; <span class="hl">S&eacute;rie d'exercices</span><br>Niveau 3</h1>
      <p class="subtitle">Coefficient, images, ant&eacute;c&eacute;dents &amp; probl&egrave;mes</p>
      <div class="level-pills">
        <span class="lp ">Niveau 1</span>
        <span class="lp ">Niveau 2</span>
        <span class="lp active">Niveau 3</span>
      </div>
    </div>
    <div class="gamebox scoreboard-sticky">
      <div class="gb-inner">
        <div class="gb-label">&#9654; Fonctions lin&eacute;aires &middot; Niveau 3</div>
        <div class="scoreboard">
          <div class="sb ok"><div class="v" id="h-ok">0</div><div class="l">R&eacute;ussies</div></div>
          <div class="sb rem"><div class="v" id="h-rem">4</div><div class="l">Restantes</div></div>
          <div class="sb err"><div class="v" id="h-ko">0</div><div class="l">Erreurs</div></div>
        </div>
        <div class="xp-bg"><div class="xp-fill" id="bar"></div></div>
        <div class="xp-txt" id="prog">0 / 4</div>
      </div>
    </div>
    <div class="main">
      <div id="cards"></div>
      <div class="results" id="results-screen">
        <div class="results-card"><div class="card-stripe"></div><div class="results-inner">
          <span class="results-trophy">&#127942;</span>
          <div class="results-score"><span class="s-num" id="score-num">0</span>/<span id="score-tot">4</span></div>
          <div class="stars-row" id="stars-row"></div>
          <div class="results-msg" id="results-msg"></div>
        </div></div>
      </div>
      <div class="restart-wrap"><button class="btn btn-restart" onclick="restart()">&#128260; Recommencer</button></div>
      <footer>N3 &middot; S2 &middot; J1 &middot; S&eacute;rie Niveau 3 &middot; Pazapa Maths 3&egrave;me</footer>
    </div>
  </div>
</div>
<script>
var LEVEL=3;
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function genExercises(){
  var exs=[];
  if(LEVEL===1){
    // 2 lecture image/antécédent depuis tableau + 2 vocabulaire (QCM)
    for(var t=0;t<2;t++){
      var a=pick([2,3,5,10]);
      var xs=[1,2,3,4,5];
      var rows=xs.map(function(v){return [v,a*v];});
      var askImg=(Math.random()<0.5);
      if(askImg){
        var xq=pick(xs);
        exs.push({kind:"num",cat:"Tableau",
          q:"Dans ce tableau de valeurs de la fonction f, lis l'<b>image</b> de "+xq+" (c'est f("+xq+")).",
          table:rows, label:"f("+xq+") =", ans:a*xq,
          method:"On lit dans la colonne x = "+xq+" : f("+xq+") = <strong>"+(a*xq)+"</strong>.",
          hint:"Cherche la colonne o&ugrave; x = "+xq+", puis lis la valeur en dessous."});
      }else{
        var yq=a*pick(xs); var xa=yq/a;
        exs.push({kind:"num",cat:"Tableau",
          q:"Dans ce tableau, lis l'<b>ant&eacute;c&eacute;dent</b> de "+yq+" (le x tel que f(x) = "+yq+").",
          table:rows, label:"x =", ans:xa,
          method:"On cherche la valeur "+yq+" dans la ligne f(x), puis on lit le x correspondant : <strong>"+xa+"</strong>.",
          hint:"Trouve "+yq+" dans la ligne du bas, puis regarde le x au-dessus."});
      }
    }
    // 2 vocabulaire QCM
    var vocab=[
      {q:"f(3) = 12. Que repr&eacute;sente 12 ?",choices:[{t:"l'image de 3",c:true},{t:"l'ant&eacute;c&eacute;dent de 3",c:false},{t:"le coefficient",c:false}],
       method:"f(3) = 12 : 12 est l'<strong>image</strong> de 3 par f.",hint:"f(nombre) = r&eacute;sultat : le r&eacute;sultat est l'image."},
      {q:"f(5) = 20. Que repr&eacute;sente 5 ?",choices:[{t:"l'image de 20",c:false},{t:"un ant&eacute;c&eacute;dent de 20",c:true},{t:"l'ordonn&eacute;e",c:false}],
       method:"5 est un <strong>ant&eacute;c&eacute;dent</strong> de 20 (car f(5) = 20).",hint:"Le nombre DANS f( ) est l'ant&eacute;c&eacute;dent."},
      {q:"Une fonction lin&eacute;aire s'&eacute;crit&hellip;",choices:[{t:"f(x) = ax",c:true},{t:"f(x) = ax + b",c:false},{t:"f(x) = b",c:false}],
       method:"Une fonction <strong>lin&eacute;aire</strong> : f(x) = ax (passe par l'origine).",hint:"Lin&eacute;aire = pas de + b."}
    ];
    shuffle(vocab).slice(0,2).forEach(function(v){
      var ch=shuffle(v.choices.slice());var ci=ch.findIndex(function(c){return c.c;});
      exs.push({kind:"qcm",cat:"Vocabulaire",q:v.q,choices:ch,correctIdx:ci,method:v.method,hint:v.hint});
    });
  } else if(LEVEL===2){
    // 4 : images & antécédents d'une f(x)=ax
    var a=pick([3,4,5,6]);
    var done=[];
    for(var i=0;i<4;i++){
      var img=(i<2); // 2 images, 2 antécédents
      if(img){
        var xq=rnd(2,9);
        exs.push({kind:"num",cat:"Image",
          q:"Soit la fonction lin&eacute;aire f(x) = "+a+"x. Calcule l'image de "+xq+".",
          eq:"f("+xq+") = "+a+" &times; "+xq, label:"f("+xq+") =", ans:a*xq,
          method:"f("+xq+") = "+a+" &times; "+xq+" = <strong>"+(a*xq)+"</strong>.",
          hint:"Multiplie "+a+" par "+xq+"."});
      }else{
        var xa=rnd(2,9), y=a*xa;
        exs.push({kind:"num",cat:"Ant&eacute;c&eacute;dent",
          q:"Soit f(x) = "+a+"x. Quel est l'ant&eacute;c&eacute;dent de "+y+" ?",
          eq:""+a+"x = "+y, label:"x =", ans:xa,
          method:""+a+"x = "+y+" &rarr; x = "+y+" &divide; "+a+" = <strong>"+xa+"</strong>.",
          hint:"Divise "+y+" par "+a+"."});
      }
    }
  } else {
    // NIVEAU 3 : déterminer le coefficient + image + problème
    // 1) coeff depuis un couple
    var a1=pick([3,4,6,7,8]), x1=rnd(2,6), y1=a1*x1;
    exs.push({kind:"num",cat:"Coefficient",
      q:"Une fonction lin&eacute;aire v&eacute;rifie f("+x1+") = "+y1+". D&eacute;termine son coefficient <b>a</b>.",
      eq:"a &times; "+x1+" = "+y1, label:"a =", ans:a1,
      method:"a = "+y1+" &divide; "+x1+" = <strong>"+a1+"</strong>. Donc f(x) = "+a1+"x.",
      hint:"a = image &divide; ant&eacute;c&eacute;dent = "+y1+" &divide; "+x1+"."});
    // 2) avec ce a, calcule une image
    var x2=rnd(5,12);
    exs.push({kind:"num",cat:"Image",
      q:"On a trouv&eacute; f(x) = "+a1+"x. Calcule f("+x2+").",
      eq:"f("+x2+") = "+a1+" &times; "+x2, label:"f("+x2+") =", ans:a1*x2,
      method:"f("+x2+") = "+a1+" &times; "+x2+" = <strong>"+(a1*x2)+"</strong>.",
      hint:"Multiplie "+a1+" par "+x2+"."});
    // 3) antécédent
    var a3=pick([5,9,11,12]), xa3=rnd(3,8), y3=a3*xa3;
    exs.push({kind:"num",cat:"Ant&eacute;c&eacute;dent",
      q:"Soit f(x) = "+a3+"x. Quel est l'ant&eacute;c&eacute;dent de "+y3+" ?",
      eq:""+a3+"x = "+y3, label:"x =", ans:xa3,
      method:"x = "+y3+" &divide; "+a3+" = <strong>"+xa3+"</strong>.",
      hint:"Divise "+y3+" par "+a3+"."});
    // 4) problème proportionnalité
    var prix=pick([2,3,4,5]), nb=rnd(4,12), tot=prix*nb;
    exs.push({kind:"num",cat:"Probl&egrave;me",
      q:nb+" objets identiques co&ucirc;tent "+tot+" &euro; en tout. Le prix est proportionnel au nombre d'objets. Combien co&ucirc;te <b>1</b> objet ?",
      eq:""+nb+" &times; p = "+tot, label:"prix =", ans:prix,
      method:"p = "+tot+" &divide; "+nb+" = <strong>"+prix+" &euro;</strong> par objet.",
      hint:"Divise le total "+tot+" par le nombre d'objets "+nb+"."});
  }
  return exs;
}

var EXOS=genExercises(),TOTAL=EXOS.length;
var answers=new Array(TOTAL).fill(null), sel=new Array(TOTAL).fill(null);
function $(id){return document.getElementById(id);}
function tableHTML(rows){
  var top='<tr><th>x</th>',bot='<tr><th>f(x)</th>';
  rows.forEach(function(r){top+='<td>'+r[0]+'</td>';bot+='<td>'+r[1]+'</td>';});
  return '<table class="valtab">'+top+'</tr>'+bot+'</tr></table>';
}
function buildAll(){
  var host=$("cards");host.innerHTML="";
  EXOS.forEach(function(ex,i){
    var card=document.createElement("div");card.className="card";card.id="card-"+i;
    var inner='<div class="card-stripe"></div><div class="card-inner">'
      +'<div class="q-header"><div class="step-num">'+(i+1)+'</div><div class="q-num">Exercice '+(i<9?"0":"")+(i+1)+'</div>'
      +'<div class="q-cat">'+ex.cat+'</div></div>'
      +'<div class="q-text">'+ex.q+'</div>';
    if(ex.table) inner+=tableHTML(ex.table);
    if(ex.eq) inner+='<div class="eq-box">'+ex.eq+'</div>';
    if(ex.kind==="num"){
      inner+='<div class="input-row"><span class="input-label">'+ex.label+'</span>'
        +'<input type="number" class="answer-input" id="inp-'+i+'" placeholder="?" step="any"/></div>';
    }else{
      inner+='<div class="qcm-row" id="qcm-'+i+'"></div>';
    }
    inner+='<div class="btn-row"><button class="btn btn-check" id="chk-'+i+'" onclick="check('+i+')"'+(ex.kind==="qcm"?' disabled':'')+'>&#10003; Valider</button>'
      +'<button class="btn btn-hint" onclick="toggleHint('+i+')">? Indice</button>'
      +'<button class="btn btn-retry" id="retry-'+i+'" onclick="retry('+i+')" style="display:none;">&#8635; R&eacute;essayer</button></div>'
      +'<div class="hint-box" id="hint-'+i+'"></div>'
      +'<div class="fb" id="fb-'+i+'"><span class="fb-icon" id="fbi-'+i+'"></span><div><div id="fbm-'+i+'"></div><div class="fb-detail" id="fbd-'+i+'"></div></div></div>'
      +'</div>';
    card.innerHTML=inner;host.appendChild(card);
    if(ex.kind==="qcm") buildQcm(i);
  });
  updateScore();
}
function buildQcm(i){
  var ex=EXOS[i],c=$("qcm-"+i);c.innerHTML="";var answered=answers[i]!==null;
  ex.choices.forEach(function(ch,idx){
    var d=document.createElement("div");d.className="qcm-choice"+(answered?" locked":"");
    if(!answered)d.onclick=(function(ii,jj){return function(){selQcm(ii,jj);};})(i,idx);
    if(answered){if(idx===ex.correctIdx)d.classList.add("correct-c");else if(idx===sel[i])d.classList.add("wrong-c");}
    else if(sel[i]===idx)d.classList.add("selected");
    var r=document.createElement("div");r.className="qcm-radio";d.appendChild(r);
    var s=document.createElement("span");s.innerHTML=ch.t;d.appendChild(s);c.appendChild(d);
  });
  $("chk-"+i).disabled=answered||(sel[i]===null);
}
function selQcm(i,idx){sel[i]=idx;$("qcm-"+i).querySelectorAll(".qcm-choice").forEach(function(c,k){c.classList.toggle("selected",k===idx);});$("chk-"+i).disabled=false;}
function check(i){
  var ex=EXOS[i],correct;
  if(ex.kind==="qcm"){ if(sel[i]===null)return; correct=(sel[i]===ex.correctIdx); }
  else { var raw=$("inp-"+i).value; if(raw===""){$("inp-"+i).focus();return;} correct=(parseFloat(raw)===ex.ans); }
  var fb=$("fb-"+i);
  if(correct){
    answers[i]=1;
    fb.className="fb show ok";$("fbi-"+i).textContent="\u2705";
    $("fbm-"+i).textContent=pick(["\uD83C\uDF89 Bravo !","\u26a1 Parfait !","\uD83C\uDF1F Tr\u00e8s bien !","\uD83C\uDFC6 Excellent !"]);
    $("fbd-"+i).innerHTML=ex.method;
    if(ex.kind==="num"){$("inp-"+i).disabled=true;$("inp-"+i).className="answer-input correct-input";}else{buildQcm(i);}
    $("chk-"+i).disabled=true;$("retry-"+i).style.display="none";updateScore();
  }else{
    fb.className="fb show ko";$("fbi-"+i).textContent="\u274C";
    $("fbm-"+i).textContent="Pas tout \u00e0 fait\u2026 r\u00e9essaie !";
    $("fbd-"+i).innerHTML="\uD83D\uDCA1 Clique sur <strong>? Indice</strong> pour de l'aide, puis <strong>R\u00e9essayer</strong>.";
    if(ex.kind==="num")$("inp-"+i).className="answer-input wrong-input";
    $("chk-"+i).disabled=true;$("retry-"+i).style.display="inline-flex";
  }
}
function retry(i){
  var ex=EXOS[i];$("fb-"+i).className="fb";$("chk-"+i).disabled=false;$("retry-"+i).style.display="none";
  if(ex.kind==="num"){$("inp-"+i).value="";$("inp-"+i).disabled=false;$("inp-"+i).className="answer-input";$("inp-"+i).focus();}
  else{sel[i]=null;buildQcm(i);}
}
function toggleHint(i){var h=$("hint-"+i);if(h.classList.contains("show")){h.classList.remove("show");}else{h.innerHTML="<strong>\uD83D\uDCA1 Indice :</strong> "+EXOS[i].hint;h.classList.add("show");}}
function updateScore(){
  var ok=answers.filter(function(a){return a!==null;}).length;
  $("h-ok").textContent=ok;$("h-rem").textContent=TOTAL-ok;
  $("bar").style.width=Math.round(ok/TOTAL*100)+"%";$("prog").textContent=ok+" / "+TOTAL;
  if(ok>=TOTAL)showResults();else $("results-screen").classList.remove("show");
}
function showResults(){
  $("score-num").textContent=TOTAL;$("score-tot").textContent=TOTAL;
  $("stars-row").textContent="\u2B50\u2B50\u2B50\u2B50\u2B50";
  $("results-msg").textContent="\uD83C\uDF89 S\u00e9rie Niveau "+LEVEL+" termin\u00e9e ! Bravo.";
  $("results-screen").classList.add("show");
}
function restart(){EXOS=genExercises();answers=new Array(TOTAL).fill(null);sel=new Array(TOTAL).fill(null);$("results-screen").classList.remove("show");buildAll();window.scrollTo({top:0,behavior:"smooth"});}
buildAll();
</script>
</body>
</html>
