<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Théorème de Thalès · Niveau 2</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--day-color:#b94040;--day-dark:#7a1f1f;--day-light:#f7eded;--day-border:#e3b3b3;--day-glow:rgba(185,64,64,.3);--bg:#fffdf7;--surface:#fff;--border:#e8e4d9;--yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;position:relative;overflow-x:hidden;letter-spacing:.03em;word-spacing:.08em;line-height:1.6;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--blue);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--yellow);top:200px;left:-30px;pointer-events:none;}
    .head-card{width:100%;max-width:720px;background:var(--day-light);border:2px solid var(--day-border);border-radius:var(--radius);padding:1.9rem 1.5rem 1.6rem;text-align:center;position:relative;z-index:1;margin-bottom:1.3rem;}
    .head-card .logo-badge{background:var(--day-color);color:#fff;font-size:14px;letter-spacing:.09em;display:inline-flex;align-items:center;gap:.5rem;font-weight:700;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .head-card .week-label{color:var(--day-dark);font-size:.95rem;margin:.5rem 0;font-family:'JetBrains Mono',monospace;}
    .head-card h1 .hl{color:var(--day-dark);font-size:clamp(1.45rem,4.6vw,1.95rem);font-weight:800;display:inline-block;}
    .head-card .subtitle{color:var(--muted);font-size:1.02rem;margin-top:.5rem;font-family:'JetBrains Mono',monospace;}
    .level-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem;}
    .level-btn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;padding:.6rem 1.15rem;border-radius:12px;border:2px solid var(--day-border);background:var(--surface);color:var(--day-dark);min-height:2.9rem;display:inline-flex;align-items:center;cursor:default;}
    .level-btn.active{background:var(--day-color);color:#fff;border-color:var(--day-color);box-shadow:0 3px 10px var(--day-glow);}
    .stats-card{width:100%;max-width:720px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-bottom:1.4rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.05);}
    .stats-row{display:flex;gap:.8rem;}
    .stat-box{flex:1;background:var(--day-light);border:1.5px solid var(--day-border);border-radius:12px;padding:.9rem .5rem;text-align:center;}
    .stat-num{font-size:1.7rem;font-weight:800;color:var(--day-dark);font-family:'JetBrains Mono',monospace;line-height:1.1;}
    .stat-label{font-size:.86rem;color:var(--muted);margin-top:.25rem;}
    .prog-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:1rem;}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}
    .prog-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.95rem;color:var(--muted);margin-top:.6rem;}
    .section-title{width:100%;max-width:720px;margin:1.4rem 0 .5rem;font-weight:900;font-size:clamp(1.1rem,3.2vw,1.3rem);color:var(--day-dark);position:relative;z-index:1;}
    #cards{width:100%;max-width:720px;}
    .card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.7rem 1.5rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:1.5rem;animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}
    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.1em;}
    .q-consigne{font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.75;margin-bottom:.9rem;}
    .fig-wrap{text-align:center;margin:.5rem 0 1.1rem;}
    .fig-wrap svg{width:min(220px,100%);height:auto;}
    .method-box{display:none;background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.95rem 1.15rem;margin-top:.8rem;font-size:1rem;font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.85;white-space:pre-line;}
    .method-box.reveal{display:block;}
    .input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.7rem;}
    .input-label{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;}
    .answer-input{background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.15rem;padding:.5rem .85rem;outline:none;transition:border-color .2s;height:3rem;width:min(280px,100%);}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input{border-color:var(--pink);background:#fff0ef;}
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.7rem 1.45rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(1rem,2.8vw,1.1rem);font-weight:800;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:3rem;}
    .btn:active{transform:scale(.96);}.btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);}
    .feedback{margin-top:.8rem;padding:.7rem 1rem;border-radius:10px;font-size:1rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.5rem;flex-shrink:0;}
    .opts{display:flex;flex-direction:column;gap:.6rem;margin:.4rem 0;}
    .opt{text-align:left;font-family:Arial,sans-serif;font-size:1rem;font-weight:600;cursor:pointer;border:2px solid var(--day-border);background:var(--surface);color:var(--text);border-radius:12px;padding:.85rem 1rem;min-height:3rem;line-height:1.55;transition:border-color .15s;}
    .opt:hover:not(:disabled){border-color:var(--day-color);}
    .opt:disabled{cursor:default;}
    .opt.sel{background:var(--day-light);border-color:var(--day-color);}
    .opt.good{background:#eef7e9;border-color:var(--green);color:#2f6e10;}
    .opt.bad{background:#fdeeee;border-color:var(--pink);color:#c0392b;}
    .results{width:100%;max-width:720px;text-align:center;display:none;position:relative;z-index:1;margin-bottom:1.5rem;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,11vw,4.8rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2.2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:1.05rem;margin-bottom:2rem;line-height:1.7;}

    .hint-btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.55rem 1.1rem;font-family:Arial,sans-serif;font-size:clamp(.95rem,2.5vw,1.05rem);font-weight:800;cursor:pointer;min-height:2.8rem;display:inline-flex;align-items:center;gap:.4rem;transition:transform .12s;}
    .hint-btn:active{transform:scale(.96);}
    .hint-box{margin-top:.7rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:.97rem;color:#7a6010;display:none;line-height:1.75;font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .fxc-trigger{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:0;}
    .fxc-trigger svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
    .fxc-pill{background:var(--day-dark);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.04em;}
    .fxc-hidden{display:none!important;}
    .fxc-panel{position:fixed;right:14px;bottom:14px;z-index:9999;width:300px;max-width:94vw;background:#2f343b;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-family:'JetBrains Mono',monospace;overflow:hidden;border:2px solid var(--day-color);}
    .fxc-bar{background:#23272d;color:#cfd6de;font-size:12.5px;font-weight:700;padding:9px 10px;cursor:move;touch-action:none;user-select:none;display:flex;align-items:center;gap:6px;}
    .fxc-bar .fxc-sp{flex:1;}
    .fxc-icon{background:#3a4049;color:#fff;border:none;width:26px;height:26px;border-radius:7px;font-size:13px;cursor:pointer;line-height:1;}
    .fxc-icon:hover{background:var(--day-color);color:#fff;}
    .fxc-help{background:#23272d;color:#aeb6bf;font-size:11.5px;line-height:1.7;padding:8px 12px;border-top:1px solid #3a4049;}
    .fxc-screen{background:#d7e3c8;margin:10px;border-radius:8px;padding:8px 10px;min-height:64px;display:flex;flex-direction:column;justify-content:center;border:2px solid #aab79a;}
    .fxc-expr{font-size:13px;color:#4a5340;text-align:right;min-height:16px;word-break:break-all;line-height:1.4;}
    .fxc-res{font-size:24px;font-weight:800;color:#222;text-align:right;word-break:break-all;line-height:1.2;}
    .fxc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 10px 12px;}
    .fxc-k{background:#454c55;color:#fff;border:none;border-radius:9px;padding:11px 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;cursor:pointer;min-height:42px;transition:transform .08s;}
    .fxc-k:active{transform:scale(.94);}.fxc-k:hover{background:#525a64;}
    .fxc-k.fn{background:#3a4049;font-size:12px;color:#b94040;}
    .fxc-k.op{color:#b94040;}.fxc-k.eq{background:#3a7bd5;color:#fff;}.fxc-k.red{background:#c0392b;color:#fff;}
  </style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>

<div class="head-card">
  <div class="logo-badge"><span class="logo-dot" style="background:#f5c518"></span><span class="logo-dot" style="background:#8dc63f"></span><span class="logo-dot" style="background:#3ab5d8"></span> PAZAPA &middot; MATHS &middot; 4&Egrave;ME</div>
  <div class="week-label">Semaine 4 &ndash; Jour 2</div>
  <h1><span class="hl">&#9999;&#65039; Th&eacute;or&egrave;me de Thal&egrave;s</span></h1>
  <p class="subtitle">Calculer une longueur avec Thal&egrave;s</p>
  <div class="level-row">
    <span class="level-btn">Niveau 1</span>
    <span class="level-btn active">Niveau 2</span>
    <span class="level-btn">Niveau 3</span>
  </div>
</div>

<div class="stats-card"><div class="stats-row">
  <div class="stat-box"><div class="stat-num" id="st-ok">0</div><div class="stat-label">R&eacute;ussies</div></div>
  <div class="stat-box"><div class="stat-num" id="st-rem">6</div><div class="stat-label">Restantes</div></div>
  <div class="stat-box"><div class="stat-num" id="st-err">0</div><div class="stat-label">Erreurs</div></div>
</div><div class="prog-bg"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
<div class="prog-text" id="prog-text">0 / 6</div></div>

<div id="cards"></div>

<section class="results" id="results"><div class="results-card">
  <div style="font-size:.8rem;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;">R&eacute;sultats</div>
  <div class="results-score"><span class="s-num" id="res-score">0 / 6</span></div>
  <div class="stars" id="stars"></div>
  <p class="results-msg" id="res-msg"></p>
  <button class="btn btn-primary" onclick="restart()">&#8635; Recommencer</button>
</div></section>

<script>
/* ── Figures SVG ── */
/* Exercice 1 — triangle STU, V sur US, W sur UT, VW // ST */
/* S en haut à droite, U à gauche, T en bas */
var FIG1 = '<svg viewBox="0 0 205 248" xmlns="http://www.w3.org/2000/svg"><line x1="175" y1="22" x2="22" y2="88" stroke="#444" stroke-width="1.8"/><line x1="175" y1="22" x2="108" y2="222" stroke="#444" stroke-width="1.8"/><line x1="22" y1="88" x2="108" y2="222" stroke="#444" stroke-width="1.8"/><line x1="83" y1="62" x2="56" y2="142" stroke="#b94040" stroke-width="2.2"/><circle cx="175" cy="22" r="3" fill="#444"/><text x="180" y="15" font-family="Arial" font-size="14" font-style="italic" fill="#444">S</text><circle cx="22" cy="88" r="3" fill="#444"/><text x="5" y="92" font-family="Arial" font-size="14" font-style="italic" fill="#444">U</text><circle cx="108" cy="222" r="3" fill="#444"/><text x="112" y="236" font-family="Arial" font-size="14" font-style="italic" fill="#444">T</text><circle cx="83" cy="62" r="3" fill="#b94040"/><text x="87" y="55" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">V</text><circle cx="56" cy="142" r="3" fill="#b94040"/><text x="39" y="146" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">W</text></svg>';

/* Exercice 2 — configuration papillon : G en haut, I au centre, H à droite, J en bas gauche, K à gauche */
var FIG2 = '<svg viewBox="0 0 210 205" xmlns="http://www.w3.org/2000/svg"><line x1="140" y1="18" x2="18" y2="178" stroke="#444" stroke-width="1.8"/><line x1="24" y1="136" x2="120" y2="158" stroke="#444" stroke-width="1.8"/><line x1="140" y1="18" x2="120" y2="158" stroke="#b94040" stroke-width="2.2"/><line x1="18" y1="178" x2="24" y2="136" stroke="#b94040" stroke-width="2.2"/><circle cx="140" cy="18" r="3" fill="#b94040"/><text x="144" y="12" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">G</text><circle cx="120" cy="158" r="3" fill="#b94040"/><text x="125" y="161" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">H</text><circle cx="46" cy="141" r="3" fill="#444"/><text x="50" y="134" font-family="Arial" font-size="14" font-style="italic" fill="#444">I</text><circle cx="18" cy="178" r="3" fill="#b94040"/><text x="4" y="184" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">J</text><circle cx="24" cy="136" r="3" fill="#b94040"/><text x="7" y="133" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">K</text></svg>';

var FIG3 = '<svg viewBox="0 0 205 248" xmlns="http://www.w3.org/2000/svg"><line x1="175" y1="22" x2="22" y2="88" stroke="#444" stroke-width="1.8"/><line x1="175" y1="22" x2="108" y2="222" stroke="#444" stroke-width="1.8"/><line x1="22" y1="88" x2="108" y2="222" stroke="#444" stroke-width="1.8"/><line x1="83" y1="62" x2="56" y2="142" stroke="#b94040" stroke-width="2.2"/><circle cx="175" cy="22" r="3" fill="#444"/><text x="180" y="15" font-family="Arial" font-size="14" font-style="italic" fill="#444">S</text><circle cx="22" cy="88" r="3" fill="#444"/><text x="5" y="92" font-family="Arial" font-size="14" font-style="italic" fill="#444">U</text><circle cx="108" cy="222" r="3" fill="#444"/><text x="112" y="236" font-family="Arial" font-size="14" font-style="italic" fill="#444">T</text><circle cx="83" cy="62" r="3" fill="#b94040"/><text x="87" y="55" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">V</text><circle cx="56" cy="142" r="3" fill="#b94040"/><text x="39" y="146" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">W</text></svg>';

/* Exercice 4 — papillon MN haut, KJ bas, L au centre — image 3 fidèle */
var FIG4 = '<svg viewBox="0 0 210 255" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="38" x2="173" y2="224" stroke="#444" stroke-width="1.8"/><line x1="172" y1="52" x2="18" y2="210" stroke="#444" stroke-width="1.8"/><line x1="22" y1="38" x2="172" y2="52" stroke="#b94040" stroke-width="2.2"/><line x1="18" y1="210" x2="173" y2="224" stroke="#b94040" stroke-width="2.2"/><circle cx="22" cy="38" r="3" fill="#b94040"/><text x="5" y="34" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">M</text><circle cx="172" cy="52" r="3" fill="#b94040"/><text x="177" y="48" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">N</text><circle cx="96" cy="130" r="3" fill="#444"/><text x="101" y="133" font-family="Arial" font-size="14" font-style="italic" fill="#444">L</text><circle cx="18" cy="210" r="3" fill="#b94040"/><text x="1" y="215" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">K</text><circle cx="173" cy="224" r="3" fill="#b94040"/><text x="178" y="229" font-family="Arial" font-size="14" font-style="italic" fill="#b94040">J</text></svg>';

/* ── Exercices groupés ── */
var EXOS = [
  {
    sec:"Exercice 1",
    intitule:"Sur la figure suivante, SU\u00a0= 6\u00a0cm, ST\u00a0= 8\u00a0cm, UV\u00a0= 2,4\u00a0cm, UW\u00a0= 2,8\u00a0cm et (ST)//(VW).",
    fig:FIG1,
    questions:[
      {label:"VW\u00a0=", answers:["3,2 cm","3,2"], show:"3,2\u00a0cm",
       hint:"Repère les deux droites parallèles et les deux sécantes. Le rapport UV/US doit égaler VW/ST.",cons:"Calcule VW.",
       method:"D\u2019apr\u00e8s Thal\u00e8s\u00a0: UV/US = VW/ST\n2,4/6 = VW/8\nVW = 8 \u00d7 2,4 \u00f7 6 = 3,2\u00a0cm"},
      {label:"UT\u00a0=", answers:["7 cm","7"], show:"7\u00a0cm",
       hint:"Utilise le même rapport de Thalès. Identifie quel segment est l’inconnue et isole-le.",cons:"Calcule UT.",
       method:"D\u2019apr\u00e8s Thal\u00e8s\u00a0: UW/UT = UV/US\n2,8/UT = 2,4/6\nUT = 2,8 \u00d7 6 \u00f7 2,4 = 7\u00a0cm"},
    ]
  },
  {
    sec:"Exercice 2",
    intitule:"Sur la figure suivante, GI\u00a0= 8\u00a0cm, GH\u00a0= 5\u00a0cm, IJ\u00a0= 2,4\u00a0cm, IK\u00a0= 1,8\u00a0cm et (GH)//(JK). G, I, J sont align\u00e9s et H, I, K sont align\u00e9s.",
    fig:FIG2,
    questions:[
      {label:"JK\u00a0=", answers:["1,5 cm","1,5"], show:"1,5\u00a0cm",
       hint:"Écris le rapport entre les segments portés par la même sécante, puis égale-le au rapport correspondant.",cons:"Calcule JK.",
       method:"D\u2019apr\u00e8s Thal\u00e8s\u00a0: IJ/IG = JK/GH\n2,4/8 = JK/5\nJK = 5 \u00d7 2,4 \u00f7 8 = 1,5\u00a0cm"},
      {label:"IH\u00a0=", answers:["6 cm","6"], show:"6\u00a0cm",
       hint:"L’inconnue IH est au dénominateur. Écris l’égalité de Thalès, puis croise les produits pour l’isoler.",cons:"Calcule IH.",
       method:"D\u2019apr\u00e8s Thal\u00e8s\u00a0: IK/IH = IJ/IG\n1,8/IH = 2,4/8\nIH = 1,8 \u00d7 8 \u00f7 2,4 = 6\u00a0cm"},
    ]
  },
  {
    sec:"Exercice 3",
    intitule:"Sur la figure suivante :<br>&#8605; V est sur [US],<br>&#8605; W est sur [UT],<br>&#8605; les droites (ST) et (VW) sont parall\u00e8les.",
    fig:FIG3,
    questions:[
      {label:"=", type:"relation", expected:["uv/us","uw/ut","vw/st"], show:"UV/US = UW/UT = VW/ST",
       hint:"Part du sommet commun S. Pour chaque sécante, écris le rapport grand segment / petit segment. Les deux ratios doivent égaler le rapport des parallèles.",cons:"\u00c9cris la double \u00e9galit\u00e9 de Thal\u00e8s (sous la forme \u2026/\u2026 = \u2026/\u2026 = \u2026/\u2026).",
       method:"UV/US = UW/UT = VW/ST\n(on peut aussi \u00e9crire US/UV = UT/UW = ST/VW)"},
    ]
  },
  {
    sec:"Exercice 4",
    intitule:"Sur la figure suivante :<br>&#8605; les droites (MJ) et (NK) se coupent en L,<br>&#8605; les droites (MN) et (KJ) sont parall\u00e8les.",
    fig:FIG4,
    questions:[
      {label:"=", type:"relation", expected:["lm/lj","ln/lk","mn/jk"], show:"LM/LJ = LN/LK = MN/JK",
       hint:"Même méthode : part du sommet L commun aux deux sécantes.",cons:"\u00c9cris la double \u00e9galit\u00e9 de Thal\u00e8s.",
       method:"LM/LJ = LN/LK = MN/JK\n(on peut aussi \u00e9crire LJ/LM = LK/LN = JK/MN)"},
    ]
  },
];

/* Aplatir les questions pour le moteur de score */
var QS = [];
EXOS.forEach(function(ex){
  ex.questions.forEach(function(q,qi){
    QS.push({exo:ex, qi:qi, type:q.type||"input", label:q.label, answers:q.answers, show:q.show, expected:q.expected, cons:q.cons, method:q.method});
  });
});
var TOTAL=QS.length, state;
function $(id){return document.getElementById(id);}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,"").replace(/,/g,".");}
function normRatio(r){var p=r.split("/");if(p.length!==2)return null;var a=p[0].toLowerCase().replace(/[^a-z]/g,"").split("").sort().join("");var b=p[1].toLowerCase().replace(/[^a-z]/g,"").split("").sort().join("");if(a.length<2||b.length<2)return null;return a+"/"+b;}
function relOk(raw,exp){
  var s=raw.replace(/\s+/g,"");var rs=s.split("=");if(rs.length<3)return false;
  var got=[];
  for(var i=0;i<rs.length;i++){var nr=normRatio(rs[i]);if(!nr)return false;got.push(nr);}
  if(got.length!==exp.length)return false;
  /* Build inverted family */
  var inv=exp.map(function(r){var p=r.split("/");return p[1]+"/"+p[0];});
  /* Check if got is a permutation of exp OR inv (order-independent) */
  function isPermOf(arr,ref){
    var used=ref.slice();
    for(var i=0;i<arr.length;i++){
      var idx=used.indexOf(arr[i]);
      if(idx===-1)return false;
      used.splice(idx,1);
    }
    return used.length===0;
  }
  return isPermOf(got,exp)||isPermOf(got,inv);
}

function showHint(i){
  var hb=$("hb"+i);
  var hbox=$("hint"+i);
  if(!hbox)return;
  hbox.classList.toggle("show");
  if(hb)hb.innerHTML=hbox.classList.contains("show")?"&#128161; Masquer l\u2019indice":"&#128161; Indice";
}
function buildCards(){
  state=QS.map(function(){return{done:false,ok:false,errored:false};});
  var html="", qIdx=0;
  EXOS.forEach(function(ex){
    var startIdx=qIdx;
    html+='<div class="card" id="exo'+startIdx+'"><div class="card-stripe"></div>';
    html+='<div class="q-num">'+ex.sec+'</div>';
    html+='<div class="q-consigne" style="font-weight:600;font-size:1rem;color:var(--text);margin-bottom:.9rem;">'+ex.intitule+'</div>';
    if(ex.fig)html+='<div class="fig-wrap">'+ex.fig+'</div>';
    ex.questions.forEach(function(q){
      var i=qIdx++;
      html+='<div style="margin-bottom:.7rem;">'
        +'<div style="font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.4rem;">'+q.cons+'</div>'
        +'<div class="input-row" style="margin-bottom:.3rem;"><span class="input-label">'+q.label+'</span>'
        +'<input type="text" class="answer-input" id="in'+i+'" placeholder="?" autocomplete="off" autocapitalize="off" spellcheck="false"/></div>'
        +'<div class="btn-row" style="margin-bottom:.3rem;">'
        +'<button class="btn btn-primary" id="vb'+i+'" onclick="checkOne('+i+')">&#10003; V\u00e9rifier</button>'
        +(q.hint?'<button class="hint-btn" id="hb'+i+'" onclick="showHint('+i+')">&#128161; Indice</button>':'')  
        +'</div>'
        +'<div class="hint-box" id="hint'+i+'">'+( q.hint||'')+'</div>'
        +'<div class="method-box" id="method'+i+'" style="margin-top:.5rem;">'+q.method+'</div>'
        +'<div class="feedback" id="fb'+i+'"><span class="feedback-icon" id="fbi'+i+'"></span><div><span id="fbt'+i+'"></span></div></div>'
        +'</div>';
    });
    html+='</div>';
  });
  $("cards").innerHTML=html;
  for(var j=0;j<TOTAL;j++){(function(k){
    $("in"+k).addEventListener("keydown",function(e){if(e.key==="Enter")checkOne(k);});
  })(j);}
}

function checkOne(i){
  if(state[i].done)return;
  var raw=$("in"+i).value.trim();if(raw===""){$("in"+i).focus();return;}
  var q=QS[i], ok=(q.type==="relation")?relOk(raw,q.expected):q.answers.some(function(a){return norm(a)===norm(raw);});
  if(ok){
    state[i].done=true;state[i].ok=true;
    $("in"+i).disabled=true;$("vb"+i).disabled=true;
    $("in"+i).className="answer-input correct-input";
    $("method"+i).className="method-box reveal";
    $("fb"+i).className="feedback show ok";$("fbi"+i).textContent="\u2713";
    $("fbt"+i).innerHTML="Bravo, c\u2019est juste\u00a0!";
    update();
  } else {
    if(!state[i].errored){
      state[i].errored=true;update();
      $("in"+i).className="answer-input wrong-input";
      $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";
      $("fbt"+i).innerHTML="Pas encore \u2014 r\u00e9essaie\u00a0!";
      $("vb"+i).innerHTML="\u21bb R\u00e9essayer";
      $("vb"+i).setAttribute("onclick","retryOne("+i+")");
    } else {
      state[i].done=true;state[i].ok=false;
      $("in"+i).disabled=true;$("vb"+i).disabled=true;
      $("in"+i).className="answer-input wrong-input";
      $("method"+i).className="method-box reveal";
      $("fb"+i).className="feedback show ko";$("fbi"+i).textContent="\u2717";
      $("fbt"+i).innerHTML="R\u00e9ponse\u00a0: <strong>"+q.show+"</strong>.";
      update();
    }
  }
}
function retryOne(i){
  $("in"+i).value="";$("in"+i).className="answer-input";$("in"+i).focus();
  $("fb"+i).className="feedback";
  $("vb"+i).innerHTML="\u2713 V\u00e9rifier";$("vb"+i).setAttribute("onclick","checkOne("+i+")");
}
function update(){
  var done=0,ok=0;
  for(var i=0;i<TOTAL;i++){if(state[i].done){done++;if(state[i].ok)ok++;}}
  $("st-ok").textContent=ok;$("st-err").textContent=done-ok;$("st-rem").textContent=TOTAL-done;
  $("pfill").style.width=Math.round(done/TOTAL*100)+"%";$("prog-text").textContent=done+" / "+TOTAL;
  if(done===TOTAL)showResults(ok);
}
function showResults(ok){
  $("res-score").textContent=ok+" / "+TOTAL;
  var stars=(ok===TOTAL)?5:Math.max(1,Math.round(ok/TOTAL*5));var st="";for(var s=0;s<5;s++)st+=(s<stars?"\u2b50":"\u2606");$("stars").textContent=st;
  var err=TOTAL-ok,msg;
  if(err===0)msg="Parfait\u00a0! Tu ma\u00eetrises le th\u00e9or\u00e8me de Thal\u00e8s.";
  else if(err<=1)msg="Tr\u00e8s bien\u00a0! Presque sans-faute.";
  else if(err<=3)msg="Bien jou\u00e9. Reprends les calculs manqu\u00e9s.";
  else msg="\u00c0 retravailler \u00e9tape par \u00e9tape, tu vas y arriver.";
  $("res-msg").textContent=msg;$("results").className="results show";$("results").scrollIntoView({behavior:"smooth"});
}
function restart(){buildCards();$("results").className="results";update();window.scrollTo({top:0,behavior:"smooth"});}
buildCards();update();
</script>

<div id="fxc-panel" class="fxc-panel fxc-hidden">
  <div class="fxc-bar" id="fxc-bar">&#9776; fx-92 &middot; glisse pour d&eacute;placer<span class="fxc-sp"></span>
    <button class="fxc-icon" id="fxc-help-btn" type="button">?</button>
    <button class="fxc-icon" id="fxc-close-btn" type="button">&#10005;</button>
  </div>
  <div class="fxc-help fxc-hidden" id="fxc-help">&divide;R reste &middot; FACT facteurs premiers &middot; PGCD &middot; PPCM &middot; a/b simplifier &middot; &radic; x&sup2; ^</div>
  <div class="fxc-screen"><div class="fxc-expr" id="fxc-expr"></div><div class="fxc-res" id="fxc-res">0</div></div>
  <div class="fxc-keys" id="fxc-keys"></div>
</div>
<script>
(function(){
  var expr="";var E=function(id){return document.getElementById(id);};
  var KEYS=[["FACT(","fn","FACT("],["PGCD(","fn","PGCD("],["PPCM(","fn","PPCM("],["a/b","fn","SIMP("],["AC","red","AC"],["DEL","fn","DEL"],["(","op","("],[")","op",")"],[";","op",";"],["\u00f7R","op","\u00f7R"],["7","","7"],["8","","8"],["9","","9"],["\u00f7","op","\u00f7"],["\u221a(","op","\u221a("],["4","","4"],["5","","5"],["6","","6"],["\u00d7","op","\u00d7"],["x\u00b2","op","\u00b2"],["1","","1"],["2","","2"],["3","","3"],["\u2212","op","\u2212"],["^","op","^"],["0","","0"],[",","",","],["(\u2212)","op","(\u2212)"],["+","op","+"],["=","eq","="]];
  function render(){E("fxc-expr").textContent=expr;}
  function press(v){if(v==="AC"){expr="";E("fxc-res").textContent="0";render();return;}if(v==="DEL"){del();return;}if(v==="="){E("fxc-res").textContent=evaluate(expr);return;}expr+=v;render();}
  function del(){var toks=["FACT(","PGCD(","PPCM(","SIMP(","\u221a(","\u00f7R","(\u2212)"];for(var i=0;i<toks.length;i++){if(expr.slice(-toks[i].length)===toks[i]){expr=expr.slice(0,-toks[i].length);render();return;}}expr=expr.slice(0,-1);render();}
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
  function sup(n){var m={"0":"\u2070","1":"\u00b9","2":"\u00b2","3":"\u00b3","4":"\u2074","5":"\u2075","6":"\u2076","7":"\u2077","8":"\u2078","9":"\u2079"};return String(n).split("").map(function(c){return m[c]||c;}).join("");}
  function factString(n){n=Math.round(n);if(n<1)return"Erreur";if(n===1)return"1";var f=[],d=2,x=n;while(d*d<=x){while(x%d===0){f.push(d);x/=d;}d++;}if(x>1)f.push(x);var out=[],i=0;while(i<f.length){var p=f[i],c=0;while(i<f.length&&f[i]===p){c++;i++;}out.push(c>1?(p+sup(c)):(""+p));}if(f.length===1&&f[0]===n)return n+" (premier)";return out.join("\u00d7");}
  function calc(str){var s=str.replace(/\u00d7/g,"*").replace(/\u00f7/g,"/").replace(/\u00b2/g,"^2").replace(/\u221a/g,"sqrt").replace(/\(\u2212\)/g,"-").replace(/\u2212/g,"-").replace(/,/g,".").replace(/\s+/g,"");var pos=0;function pk(){return s.charAt(pos);}function ex(){var v=tm();while(pk()==="+"||pk()==="-"){var o=s.charAt(pos++);var t=tm();v=(o==="+")?v+t:v-t;}return v;}function tm(){var v=fc();while(pk()==="*"||pk()==="/"){var o=s.charAt(pos++);var f=fc();if(o==="*")v*=f;else{if(f===0)throw 0;v/=f;}}return v;}function fc(){var b=ba();if(pk()==="^"){pos++;var e=fc();return Math.pow(b,e);}return b;}function ba(){if(pk()==="-"){pos++;return -ba();}if(pk()==="("){pos++;var v=ex();if(s.charAt(pos)!==")")throw 0;pos++;return v;}if(s.substr(pos,5)==="sqrt("){pos+=5;var v=ex();if(s.charAt(pos)!==")")throw 0;pos++;if(v<0)throw 0;return Math.sqrt(v);}var st=pos;while(pos<s.length&&/[0-9.]/.test(s.charAt(pos)))pos++;if(pos===st)throw 0;return parseFloat(s.substr(st,pos-st));}var r=ex();if(pos!==s.length)throw 0;return r;}
  function args(inner){return inner.split(/[;,]/);}
  function evaluate(raw){var s=(raw||"").trim();if(s==="")return"0";try{if(s.indexOf("\u00f7R")>=0){var p=s.split("\u00f7R");if(p.length!==2)throw 0;var a=Math.round(calc(p[0])),b=Math.round(calc(p[1]));if(b===0)throw 0;var q=Math.floor(a/b),r=a-q*b;return"quotient "+q+" \u00b7 reste "+r;}var m;if((m=s.match(/^FACT\((.+)\)$/i)))return factString(calc(m[1]));if((m=s.match(/^PGCD\((.+)\)$/i))){var g=args(m[1]);return""+gcd(Math.round(calc(g[0])),Math.round(calc(g[1])));}if((m=s.match(/^PPCM\((.+)\)$/i))){var l=args(m[1]);var A=Math.round(calc(l[0])),B=Math.round(calc(l[1]));if(A===0||B===0)throw 0;return""+(Math.abs(A*B)/gcd(A,B));}if((m=s.match(/^SIMP\((.+)\)$/i))){var z=args(m[1]);var pp=Math.round(calc(z[0])),qq=Math.round(calc(z[1]));if(qq===0)throw 0;var d=gcd(pp,qq)||1;pp/=d;qq/=d;if(qq<0){pp=-pp;qq=-qq;}return qq===1?(""+pp):(pp+"/"+qq);}var v=calc(s);if(!isFinite(v))throw 0;var rv=Math.round(v*1e10)/1e10;return String(rv).replace(".",",");}catch(e){return"Erreur";}}
  var kc=E("fxc-keys");KEYS.forEach(function(k){var btn=document.createElement("button");btn.type="button";btn.className="fxc-k "+(k[1]||"");btn.textContent=k[0];btn.addEventListener("click",function(){press(k[2]);});kc.appendChild(btn);});
  window.fxcOpen=function(){E("fxc-open").classList.add("fxc-hidden");E("fxc-panel").classList.remove("fxc-hidden");};
  window.fxcClose=function(){E("fxc-panel").classList.add("fxc-hidden");E("fxc-open").classList.remove("fxc-hidden");};
  window.fxcHelp=function(){E("fxc-help").classList.toggle("fxc-hidden");};
  E("fxc-close-btn").addEventListener("click",function(e){e.stopPropagation();fxcClose();});
  E("fxc-help-btn").addEventListener("click",function(e){e.stopPropagation();fxcHelp();});
  var bar=E("fxc-bar"),panel=E("fxc-panel"),drag=false,sx,sy,ox,oy,conv=false;
  bar.addEventListener("pointerdown",function(e){if(e.target.classList.contains("fxc-icon"))return;drag=true;conv=false;sx=e.clientX;sy=e.clientY;var r=panel.getBoundingClientRect();ox=r.left;oy=r.top;bar.setPointerCapture(e.pointerId);});
  bar.addEventListener("pointermove",function(e){if(!drag)return;if(!conv){panel.style.right="auto";panel.style.bottom="auto";panel.style.left=ox+"px";panel.style.top=oy+"px";conv=true;}var nx=ox+(e.clientX-sx),ny=oy+(e.clientY-sy);var w=panel.offsetWidth,h=panel.offsetHeight;nx=Math.max(4,Math.min(window.innerWidth-w-4,nx));ny=Math.max(4,Math.min(window.innerHeight-h-4,ny));panel.style.left=nx+"px";panel.style.top=ny+"px";});
  bar.addEventListener("pointerup",function(e){drag=false;try{bar.releasePointerCapture(e.pointerId);}catch(_){}});
})();
</script>
