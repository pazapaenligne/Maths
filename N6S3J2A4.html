<svg viewBox="0 0 1120 760" style="display:block;width:100%;height:auto;" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

      <!-- NŒUD CENTRAL -->
      <rect x="470" y="330" width="180" height="100" rx="18" fill="#c8d6ee" stroke="#9db4dc" stroke-width="2"/>
      <text x="560" y="372" font-size="20" font-weight="bold" fill="#2c3e66" text-anchor="middle">Crit&egrave;re de</text>
      <text x="560" y="398" font-size="20" font-weight="bold" fill="#2c3e66" text-anchor="middle">divisibilit&eacute;</text>
      <rect x="40" y="30" width="360" height="130" rx="14" fill="#fffbe8" stroke="#f5c518" stroke-width="2"/>
      <text x="58" y="58" font-size="15" font-weight="bold" fill="#b88a00">Divisible par 2</text>
      <text x="58" y="84" font-size="14" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight='bold'>2</tspan> s'il est</text>
      <text x="58" y="106" font-size="14" fill="#1a1d23"><tspan font-weight='bold'>pair</tspan>, c'est-&agrave;-dire s'il se termine par</text>
      <text x="58" y="128" font-size="14" fill="#1a1d23"><tspan font-weight='bold'>0, 2, 4, 6 ou 8</tspan>.</text>
      <rect x="720" y="30" width="360" height="130" rx="14" fill="#fdeef3" stroke="#e9a8c2" stroke-width="2"/>
      <text x="738" y="58" font-size="15" font-weight="bold" fill="#b5527e">Divisible par 10</text>
      <text x="738" y="84" font-size="14" fill="#1a1d23">Un nombre entier est divisible par</text>
      <text x="738" y="106" font-size="14" fill="#1a1d23"><tspan font-weight='bold'>10</tspan> s'il <tspan font-weight='bold'>se termine par 0</tspan>.</text>
      <rect x="20" y="310" width="350" height="140" rx="14" fill="#fdf0e6" stroke="#f0a868" stroke-width="2"/>
      <text x="38" y="338" font-size="15" font-weight="bold" fill="#c2691f">Divisible par 3</text>
      <text x="38" y="364" font-size="14" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight='bold'>3</tspan></text>
      <text x="38" y="386" font-size="14" fill="#1a1d23">si la <tspan font-weight='bold'>somme de ses chiffres</tspan></text>
      <text x="38" y="408" font-size="14" fill="#1a1d23"><tspan font-weight='bold'>est divisible par 3</tspan>.</text>
      <rect x="750" y="310" width="350" height="140" rx="14" fill="#e8f1f8" stroke="#8fb4d6" stroke-width="2"/>
      <text x="768" y="338" font-size="15" font-weight="bold" fill="#3a6e9c">Divisible par 5</text>
      <text x="768" y="364" font-size="14" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight='bold'>5</tspan></text>
      <text x="768" y="386" font-size="14" fill="#1a1d23">s'il <tspan font-weight='bold'>se termine par 0 ou 5</tspan>.</text>
      <rect x="40" y="600" width="360" height="140" rx="14" fill="#eef8e3" stroke="#a9d278" stroke-width="2"/>
      <text x="58" y="628" font-size="15" font-weight="bold" fill="#5a8a2a">Divisible par 9</text>
      <text x="58" y="654" font-size="14" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight='bold'>9</tspan></text>

      <rect x="720" y="600" width="360" height="140" rx="14" fill="#f0f1f3" stroke="#b9bdc4" stroke-width="2"/>
      <text x="738" y="628" font-size="15" font-weight="bold" fill="#6b7079">Divisible par 4</text>
      <text x="738" y="654" font-size="14" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight='bold'>4</tspan> si le</text>
      <text x="738" y="676" font-size="14" fill="#1a1d23"><tspan font-weight='bold'>nombre form&eacute; de ses deux chiffres</tspan></text>
      <text x="738" y="698" font-size="14" fill="#1a1d23"><tspan font-weight='bold'>de droite est un multiple de 4</tspan>.</text>
