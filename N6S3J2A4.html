<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>N6S3J2 - Carte mentale - Critères de divisibilité</title>
<style>
  body { background:#fffdf7; margin:0; font-family:Arial,Helvetica,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; background:#fffdf7; border:1.5px solid #e8e4d9; border-radius:18px; overflow:hidden; position:relative; }
  .bubble { position:absolute; border-radius:50%; pointer-events:none; }
  @media print { body { background:#fff; padding:0; } .wrap{border:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="bubble" style="top:-50px;right:-50px;width:220px;height:220px;background:#f5c518;opacity:.10;"></div>
  <div class="bubble" style="bottom:-50px;left:-50px;width:200px;height:200px;background:#b94040;opacity:.10;"></div>
  <div class="bubble" style="bottom:120px;right:-40px;width:140px;height:140px;background:#8dc63f;opacity:.08;"></div>
  <div class="bubble" style="top:160px;left:-30px;width:110px;height:110px;background:#f28b82;opacity:.10;"></div>

  <div style="height:6px;background:linear-gradient(90deg,#b94040,#f28b82,#f5c518);position:relative;z-index:1;"></div>

  <div style="position:relative;z-index:1;padding:20px 22px 24px;">
    <div style="text-align:center;margin-bottom:8px;">
      <span style="display:inline-block;background:#f5c518;color:#8a6000;font-family:'Courier New',monospace;font-size:12px;font-weight:bold;letter-spacing:1px;padding:5px 14px;border-radius:99px;"><span style="color:#f28b82;">&#9679;</span> <span style="color:#8dc63f;">&#9679;</span> <span style="color:#3ab5d8;">&#9679;</span> PAZAPA &middot; MATHS &middot; 6e</span>
      <p style="color:#8a8f9a;font-size:13px;margin:9px 0 4px 0;">Semaine 3 &ndash; Jour 2</p>
      <p style="color:#7a1f1f;font-size:13px;font-weight:bold;margin:0 0 2px 0;"><span class="nolink">Carte mentale</span></p>
      <p style="font-size:23px;font-weight:bold;margin:0;color:#7a1f1f;">Crit&egrave;re de divisibilit&eacute;</p>
    </div>

    <svg viewBox="0 0 1000 720" style="display:block;width:100%;height:auto;" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
      <!-- ======= TRAITS (sous les boîtes) ======= -->
      <!-- centre approx (500,360) -->
      <line x1="430" y1="320" x2="250" y2="150" stroke="#f5c518" stroke-width="3"/>
      <line x1="570" y1="320" x2="760" y2="150" stroke="#e9a8c2" stroke-width="3"/>
      <line x1="430" y1="360" x2="190" y2="360" stroke="#f0a868" stroke-width="3"/>
      <line x1="570" y1="360" x2="810" y2="360" stroke="#8fb4d6" stroke-width="3"/>
      <line x1="430" y1="400" x2="250" y2="580" stroke="#a9d278" stroke-width="3"/>
      <line x1="570" y1="400" x2="760" y2="580" stroke="#b9bdc4" stroke-width="3"/>
      <!-- pointes de flèche vers le centre -->
      <polygon points="430,340 446,332 446,348" fill="#f5c518"/>
      <polygon points="570,340 554,332 554,348" fill="#e9a8c2"/>
      <polygon points="432,360 448,352 448,368" fill="#f0a868"/>
      <polygon points="568,360 552,352 552,368" fill="#8fb4d6"/>
      <polygon points="430,380 446,372 446,388" fill="#a9d278"/>
      <polygon points="570,380 554,372 554,388" fill="#b9bdc4"/>

      <!-- ======= NŒUD CENTRAL ======= -->
      <rect x="410" y="312" width="180" height="96" rx="18" fill="#c8d6ee" stroke="#9db4dc" stroke-width="2"/>
      <text x="500" y="352" font-size="19" font-weight="bold" fill="#2c3e66" text-anchor="middle">Crit&egrave;re de</text>
      <text x="500" y="378" font-size="19" font-weight="bold" fill="#2c3e66" text-anchor="middle">divisibilit&eacute;</text>

      <!-- ======= BRANCHE 2 (haut gauche, jaune) ======= -->
      <rect x="70" y="40" width="290" height="110" rx="14" fill="#fffbe8" stroke="#f5c518" stroke-width="2"/>
      <text x="86" y="64" font-size="14" font-weight="bold" fill="#b88a00">Divisible par 2</text>
      <text x="86" y="88" font-size="13.5" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight="bold">2</tspan> s'il est</text>
      <text x="86" y="108" font-size="13.5" fill="#1a1d23"><tspan font-weight="bold">pair</tspan>, c'est-&agrave;-dire s'il se termine par</text>
      <text x="86" y="128" font-size="13.5" font-weight="bold" fill="#1a1d23">0, 2, 4, 6 ou 8.</text>

      <!-- ======= BRANCHE 10 (haut droite, rose) ======= -->
      <rect x="650" y="40" width="290" height="110" rx="14" fill="#fdeef3" stroke="#e9a8c2" stroke-width="2"/>
      <text x="666" y="64" font-size="14" font-weight="bold" fill="#b5527e">Divisible par 10</text>
      <text x="666" y="92" font-size="13.5" fill="#1a1d23">Un nombre entier est divisible par</text>
      <text x="666" y="112" font-size="13.5" fill="#1a1d23"><tspan font-weight="bold">10</tspan> s'il <tspan font-weight="bold">se termine par 0</tspan>.</text>

      <!-- ======= BRANCHE 3 (gauche, orange) ======= -->
      <rect x="40" y="300" width="280" height="120" rx="14" fill="#fdf0e6" stroke="#f0a868" stroke-width="2"/>
      <text x="56" y="326" font-size="14" font-weight="bold" fill="#c2691f">Divisible par 3</text>
      <text x="56" y="352" font-size="13.5" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight="bold">3</tspan></text>
      <text x="56" y="372" font-size="13.5" font-weight="bold" fill="#1a1d23">si la somme de ses chiffres est</text>
      <text x="56" y="392" font-size="13.5" font-weight="bold" fill="#1a1d23">divisible par 3.</text>

      <!-- ======= BRANCHE 5 (droite, bleu) ======= -->
      <rect x="680" y="300" width="280" height="120" rx="14" fill="#e8f1f8" stroke="#8fb4d6" stroke-width="2"/>
      <text x="696" y="326" font-size="14" font-weight="bold" fill="#3a6e9c">Divisible par 5</text>
      <text x="696" y="352" font-size="13.5" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight="bold">5</tspan></text>
      <text x="696" y="372" font-size="13.5" fill="#1a1d23">s'il <tspan font-weight="bold">se termine par 0 ou 5</tspan>.</text>

      <!-- ======= BRANCHE 9 (bas gauche, vert) ======= -->
      <rect x="70" y="570" width="290" height="120" rx="14" fill="#eef8e3" stroke="#a9d278" stroke-width="2"/>
      <text x="86" y="596" font-size="14" font-weight="bold" fill="#5a8a2a">Divisible par 9</text>
      <text x="86" y="622" font-size="13.5" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight="bold">9</tspan> si la</text>
      <text x="86" y="642" font-size="13.5" font-weight="bold" fill="#1a1d23">somme de ses chiffres est</text>
      <text x="86" y="662" font-size="13.5" font-weight="bold" fill="#1a1d23">divisible par 9.</text>

      <!-- ======= BRANCHE 4 (bas droite, gris) ======= -->
      <rect x="650" y="570" width="290" height="120" rx="14" fill="#f0f1f3" stroke="#b9bdc4" stroke-width="2"/>
      <text x="666" y="596" font-size="14" font-weight="bold" fill="#6b7079">Divisible par 4</text>
      <text x="666" y="622" font-size="13.5" fill="#1a1d23">Un nombre entier est divisible par <tspan font-weight="bold">4</tspan></text>
      <text x="666" y="642" font-size="13.5" fill="#1a1d23">si le <tspan font-weight="bold">nombre form&eacute; de ses deux</tspan></text>
      <text x="666" y="662" font-size="13.5" font-weight="bold" fill="#1a1d23">chiffres de droite est un multiple de 4.</text>
    </svg>

    <p style="text-align:center;font-size:15px;font-weight:bold;color:#7a1f1f;margin:8px 0 4px 0;">
      *** Le pdf imprimable est disponible <a href="https://www.claudeusercontent.com/LIEN_PDF_ICI" style="color:#7a1f1f;">ici</a> ! ***</p>
  </div>

  <div style="height:6px;background:linear-gradient(90deg,#f5c518,#f28b82,#b94040);position:relative;z-index:1;"></div>
</div>
</body>
</html>
