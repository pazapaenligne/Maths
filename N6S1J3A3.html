<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pazapa Maths – 6e – Vrai ou Faux : fractions décimales</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --day-color:#8dc63f; --day-dark:#3d7a10; --day-dark2:#2a5209;
  --day-light:#f0faeb; --day-border:#b5e08a; --day-glow:rgba(141,198,63,.28);
  --bg:#ffffff; --surface:#ffffff; --border:#e8e4d9;
  --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
  --pink:#f28b82; --pink-light:#fff0ef; --pink-dark:#c0392b;
  --orange:#f5a623;
  --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.5rem 0.75rem 3rem;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}

/* BULLES */
.bubble1{position:fixed;border-radius:50%;z-index:0;pointer-events:none;
  width:260px;height:260px;top:-80px;right:-80px;
  background:radial-gradient(circle,rgba(141,198,63,.14),transparent 70%);}
.bubble2{position:fixed;border-radius:50%;z-index:0;pointer-events:none;
  width:200px;height:200px;bottom:-70px;left:-70px;
  background:radial-gradient(circle,rgba(245,197,24,.10),transparent 70%);}
.bubble3{position:fixed;border-radius:50%;z-index:0;pointer-events:none;
  width:130px;height:130px;top:40%;left:-50px;
  background:radial-gradient(circle,rgba(58,181,216,.08),transparent 70%);}
.bubble4{position:fixed;border-radius:50%;z-index:0;pointer-events:none;
  width:110px;height:110px;bottom:20%;right:-40px;
  background:radial-gradient(circle,rgba(141,198,63,.09),transparent 70%);}

.wrap{width:100%;max-width:660px;position:relative;z-index:1;}

/* HEADER */
header{text-align:center;margin-bottom:1.4rem;}
.badge{
  display:inline-flex;align-items:center;gap:.4rem;
  background:var(--yellow);color:#000;
  font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:.28rem .85rem;border-radius:99px;margin-bottom:.5rem;
  box-shadow:0 2px 10px rgba(245,197,24,.35);white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.78rem;
  color:var(--muted);margin-bottom:.4rem;}
h1{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:800;line-height:1.3;
  word-break:break-word;margin-bottom:.3rem;}
h1 .gl{color:var(--day-dark);}
h1 .bl{color:var(--blue);}
.sub{font-family:'JetBrains Mono',monospace;font-size:.78rem;
  color:var(--muted);margin-bottom:1.4rem;}

/* PROGRESS */
.prog-wrap{width:100%;margin-bottom:.9rem;}
.prog-info{display:flex;justify-content:space-between;
  font-size:.73rem;font-family:'JetBrains Mono',monospace;
  color:var(--muted);margin-bottom:.3rem;}
.bar-bg{background:var(--border);border-radius:99px;height:6px;overflow:hidden;}
.bar-fill{height:100%;
  background:linear-gradient(90deg,var(--day-color),var(--yellow));
  border-radius:99px;transition:width .5s ease;width:0%;}

/* CHIPS */
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem;}
.chip{display:flex;align-items:center;gap:.35rem;padding:.25rem .65rem;
  border-radius:99px;font-size:.74rem;font-family:'JetBrains Mono',monospace;
  border:1.5px solid var(--border);background:var(--surface);
  font-weight:600;white-space:nowrap;}
.chip .cd{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* CARD */
.card{
  width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:1.5rem 1.3rem 1.3rem;
  position:relative;box-shadow:0 6px 28px rgba(0,0,0,.07);
  animation:fadeUp .35s ease both;
}
.card-stripe{position:absolute;top:0;left:0;right:0;height:4px;
  border-radius:var(--radius) var(--radius) 0 0;
  background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink),var(--blue));}
.qnum{font-size:.68rem;font-family:'JetBrains Mono',monospace;
  color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}

/* AFFIRMATION */
.eq{
  font-size:clamp(1rem,2.8vw,1.2rem);font-weight:700;
  color:var(--text);margin-bottom:1.1rem;line-height:1.6;
  word-break:break-word;
  background:var(--day-light);border:1.5px solid var(--day-border);
  border-left:4px solid var(--day-color);
  border-radius:var(--radius-sm,10px);padding:.8rem 1rem;
}
.eq b{color:var(--day-dark);font-family:'JetBrains Mono',monospace;}

/* FRACTION */
.frac{display:inline-flex;flex-direction:column;text-align:center;
  vertical-align:middle;line-height:1;
  font-family:'JetBrains Mono',monospace;margin:0 .15rem;}
.frac .num{border-bottom:2px solid var(--text);padding:0 .35rem 2px;}
.frac .den{padding-top:2px;}

/* BOUTONS VRAI / FAUX */
.vf-row{display:flex;gap:.7rem;margin-bottom:.5rem;}
@media(max-width:380px){.vf-row{flex-direction:column;}}
.vf-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.85rem 1rem;border-radius:12px;
  border:2.5px solid var(--border);background:var(--surface);
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(.95rem,2.8vw,1.08rem);font-weight:800;
  cursor:pointer;transition:transform .12s,border-color .15s,background .15s;
  color:var(--text);min-height:2.8rem;
  -webkit-tap-highlight-color:transparent;
}
.vf-btn:active{transform:scale(.97);}
.vf-btn.v:hover{border-color:var(--day-color);background:var(--day-light);}
.vf-btn.f:hover{border-color:var(--pink);background:var(--pink-light);}
.vf-ico{font-size:1.2rem;}
/* états post-validation */
.vf-btn.correct{border-color:var(--day-color)!important;background:var(--day-light)!important;color:var(--day-dark)!important;}
.vf-btn.wrong  {border-color:var(--pink)!important;background:var(--pink-light)!important;color:var(--pink-dark)!important;}
.vf-btn.picked {box-shadow:0 0 0 3px rgba(26,29,35,.10);}
.vf-btn:disabled{cursor:default;}

/* FEEDBACK */
.fb{margin-top:.9rem;padding:.75rem .95rem;border-radius:10px;
  font-size:clamp(.83rem,2.5vw,.92rem);display:none;
  align-items:flex-start;gap:.55rem;line-height:1.65;word-break:break-word;}
.fb.show{display:flex;}
.fb.ok{background:var(--day-light);border:1.5px solid var(--day-color);color:var(--day-dark);}
.fb.ko{background:var(--pink-light);border:1.5px solid var(--pink);color:var(--pink-dark);}
.fb-ico{font-size:1.1rem;flex-shrink:0;}
.fb-msg{font-weight:800;margin-bottom:.2rem;}
.fb-det{font-size:.82rem;color:var(--text);margin-top:.2rem;line-height:1.75;}
.fb-det b{color:var(--orange);}

/* INDICE */
.hint-box{
  margin-top:.8rem;background:#fffbeb;
  border:1.5px dashed var(--yellow);border-radius:10px;
  padding:.65rem .9rem;font-size:.83rem;color:#7a6010;
  display:none;line-height:1.7;word-break:break-word;
}
.hint-box.show{display:block;}
.hint-box strong{color:var(--orange);}

/* BOUTONS NAV */
.nav{display:flex;justify-content:space-between;margin-top:1.2rem;gap:.5rem;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.52rem 1.1rem;border-radius:99px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(.82rem,2.5vw,.9rem);font-weight:700;
  cursor:pointer;border:none;
  transition:transform .12s,box-shadow .14s,opacity .12s;
  min-height:2.6rem;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;transform:none!important;}
.btn-p{background:var(--day-color);color:#fff;
  box-shadow:0 3px 10px var(--day-glow);}
.btn-p:hover:not(:disabled){transform:translateY(-1px);
  box-shadow:0 5px 14px var(--day-glow);}
.btn-h{background:var(--yellow);color:#5a3e00;}
.btn-h:hover:not(:disabled){transform:translateY(-1px);}
.btn-g{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
.btn-g:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}

/* RÉSULTATS */
.results{width:100%;max-width:660px;text-align:center;
  display:none;animation:fadeUp .4s ease both;}
.results.show{display:block;}
.results-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:2rem 1.4rem;
  box-shadow:0 6px 28px rgba(0,0,0,.07);position:relative;overflow:hidden;
}
.results-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
  border-radius:var(--radius) var(--radius) 0 0;
  background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink),var(--blue));}
.score{font-size:clamp(2.8rem,10vw,4.5rem);font-weight:800;
  line-height:1;margin:.6rem 0 .3rem;color:var(--day-dark);}
.stars{font-size:1.8rem;margin:.3rem 0 .8rem;letter-spacing:.08em;}
.rmsg{color:var(--muted);font-size:clamp(.85rem,2.5vw,.95rem);
  margin-bottom:1.6rem;line-height:1.8;word-break:break-word;}
.recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.6rem;}
.ritem{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:10px;font-size:.82rem;word-break:break-word;}
.ritem.ok-i{border-color:var(--day-border);}
.ritem.ko-i{border-color:#f9c0bb;}
.ritem .re{flex:1;color:var(--text);}
.ritem .rv{font-family:'JetBrains Mono',monospace;font-weight:700;
  font-size:.74rem;color:var(--muted);}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:479px){
  .card{padding:1.2rem 1rem;}
  .nav{flex-wrap:wrap;}
}
</style>
</head>
<body>
<div class="bubble1"></div>
<div class="bubble2"></div>
<div class="bubble3"></div>
<div class="bubble4"></div>
<div class="wrap">

<header>
  <div class="badge">
    <span class="dot" style="background:#f5c518"></span>
    <span class="dot" style="background:#8dc63f"></span>
    <span class="dot" style="background:#f5a623"></span>
    Pazapa · Maths · 6e
  </div>
  <div class="week-label">Semaine 3 – Séance 6</div>
  <h1>Vrai ou <span class="bl">Faux</span> : les fractions <span class="gl">décimales</span></h1>
  <p class="sub">5 affirmations · niveau 6ème</p>
</header>

<div class="prog-wrap">
  <div class="prog-info">
    <span id="prog-lbl">Question 1 / 5</span>
    <span id="prog-pct">0 %</span>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="prog-bar"></div></div>
</div>

<div class="chips">
  <div class="chip"><div class="cd" style="background:#8dc63f"></div><span id="cnt-ok">0</span> correctes</div>
  <div class="chip"><div class="cd" style="background:#f28b82"></div><span id="cnt-ko">0</span> erreurs</div>
  <div class="chip"><div class="cd" style="background:#8a8f9a"></div><span id="cnt-rem">5</span> restantes</div>
</div>

<div class="card" id="ex-card">
  <div class="card-stripe"></div>
  <div class="qnum" id="q-num">Affirmation 1</div>
  <div class="eq" id="q-eq"></div>
  <div id="q-body"></div>
  <div class="hint-box" id="hint-box"></div>
  <div class="fb" id="feedback">
    <span class="fb-ico" id="fb-icon"></span>
    <div>
      <div class="fb-msg" id="fb-msg"></div>
      <div class="fb-det" id="fb-det"></div>
    </div>
  </div>
  <div class="nav">
    <button class="btn btn-g" id="btn-prev" onclick="prevQ()">← Précédent</button>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button class="btn btn-h" id="btn-hint" onclick="toggleHint()">? Indice</button>
      <button class="btn btn-p" id="btn-next" onclick="nextQ()" disabled>Suivant →</button>
    </div>
  </div>
</div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="badge" style="margin-bottom:.6rem;">
      <span class="dot" style="background:#f5c518"></span>
      <span class="dot" style="background:#8dc63f"></span>
      <span class="dot" style="background:#f5a623"></span>
      Résultats
    </div>
    <div class="score"><span id="score-num">0</span>/5</div>
    <div class="stars" id="stars-row"></div>
    <div class="rmsg" id="results-msg"></div>
    <div class="recap" id="recap-list"></div>
    <button class="btn btn-p" onclick="restart()"
      style="margin:0 auto;display:flex;width:100%;justify-content:center;">
      ↺ Recommencer
    </button>
  </div>
</div>

</div><!-- /wrap -->

<script>
/* ── DONNÉES — JS original intact ─────────────────────────── */
var EXS = [
  {
    html: 'Un nombre d\u00e9cimal ne peut <b>pas toujours</b> s\u2019\u00e9crire sous forme de fraction d\u00e9cimale.',
    answer: false,
    explain: 'Au contraire\u00a0: <b>tout</b> nombre d\u00e9cimal peut s\u2019\u00e9crire sous forme de fraction d\u00e9cimale. C\u2019est m\u00eame ce qui le d\u00e9finit. Ex.\u00a0: 0,7 = 7/10\u00a0; 2,35 = 235/100.',
    hint: '<strong>Astuce\u00a0:</strong> repense \u00e0 un exemple. 0,7 = 7/10, 2,35 = 235/100\u2026 Trouves-tu un nombre d\u00e9cimal impossible \u00e0 \u00e9crire ainsi\u00a0?'
  },
  {
    html: '<span class="frac"><span class="num">4</span><span class="den">1</span></span> est une fraction d\u00e9cimale.',
    answer: true,
    explain: 'Vrai\u00a0: le d\u00e9nominateur 1 = 10<sup>0</sup> est une <b>puissance de 10</b>, et 4/1 = 4 est bien un nombre d\u00e9cimal.',
    hint: '<strong>Astuce\u00a0:</strong> une fraction d\u00e9cimale a un d\u00e9nominateur \u00e9gal \u00e0 une puissance de 10\u00a0: 1, 10, 100, 1000\u2026 Le 1 en fait-il partie\u00a0?'
  },
  {
    html: 'Une fraction d\u00e9cimale est une fraction dont le <b>num\u00e9rateur</b> (le nombre \u00ab\u00a0du haut\u00a0\u00bb) est un multiple de 10.',
    answer: false,
    explain: 'C\u2019est le <b>d\u00e9nominateur</b> (en bas) qui doit \u00eatre une puissance de 10, pas le num\u00e9rateur. Dans 7/10, le num\u00e9rateur 7 n\u2019est pas un multiple de 10, et pourtant c\u2019est bien une fraction d\u00e9cimale.',
    hint: '<strong>Astuce\u00a0:</strong> dans une fraction d\u00e9cimale, quelle partie doit valoir 10, 100, 1000\u2026\u00a0: le haut ou le bas\u00a0?'
  },
  {
    html: '<span class="frac"><span class="num">10</span><span class="den">3</span></span> est une fraction d\u00e9cimale.',
    answer: false,
    explain: 'Le d\u00e9nominateur 3 n\u2019est pas une puissance de 10. De plus 10/3 = 3,333\u2026 n\u2019est m\u00eame pas un nombre d\u00e9cimal.',
    hint: '<strong>Astuce\u00a0:</strong> regarde le d\u00e9nominateur. 3 fait-il partie de 10, 100, 1000\u2026\u00a0?'
  },
  {
    html: 'Une fraction d\u00e9cimale est une fraction dont le d\u00e9nominateur est un <b>multiple</b> de 10.',
    answer: false,
    explain: 'Presque\u00a0! Il faut une <b>puissance</b> de 10 (10, 100, 1000\u2026), et non un simple multiple. 20, 30, 40 sont des multiples de 10 mais ne donnent pas tous des fractions d\u00e9cimales (ex. 1/30 = 0,0333\u2026).',
    hint: '<strong>Astuce\u00a0:</strong> \u00ab\u00a0multiple de 10\u00a0\u00bb (10, 20, 30\u2026) et \u00ab\u00a0puissance de 10\u00a0\u00bb (10, 100, 1000\u2026), ce n\u2019est pas pareil. Lequel d\u00e9finit une fraction d\u00e9cimale\u00a0?'
  }
];

var TOTAL = EXS.length;
var cur = 0;
var chosen = new Array(TOTAL).fill(null);
var hintOpen = false;
function $(id){ return document.getElementById(id); }

function renderQ(){
  var ex = EXS[cur];
  $('q-num').textContent = 'Affirmation ' + (cur + 1);
  $('q-eq').innerHTML = ex.html;
  $('hint-box').classList.remove('show'); $('hint-box').innerHTML = '';
  hintOpen = false;
  $('feedback').className = 'fb';
  $('btn-prev').disabled = (cur === 0);
  $('btn-hint').style.display = ex.hint ? '' : 'none';
  $('btn-next').textContent = cur === TOTAL - 1 ? 'Terminer \u2192' : 'Suivant \u2192';
  $('btn-next').disabled = (chosen[cur] === null);

  var body = $('q-body'); body.innerHTML = '';
  var row = document.createElement('div'); row.className = 'vf-row';
  var bV = document.createElement('button');
  bV.className = 'vf-btn v';
  bV.innerHTML = '<span class="vf-ico">\u2714</span> VRAI';
  bV.onclick = function(){ choose(true); };
  var bF = document.createElement('button');
  bF.className = 'vf-btn f';
  bF.innerHTML = '<span class="vf-ico">\u2718</span> FAUX';
  bF.onclick = function(){ choose(false); };
  row.appendChild(bV); row.appendChild(bF); body.appendChild(row);

  if(chosen[cur] !== null){ lockButtons(); showFB(); }
  updateStats();
}

function choose(val){
  if(chosen[cur] !== null) return;
  chosen[cur] = val;
  lockButtons(); showFB();
  $('btn-next').disabled = false;
  updateStats();
}

function lockButtons(){
  var ex = EXS[cur];
  var btns = document.querySelectorAll('.vf-btn');
  btns.forEach(function(b){ b.disabled = true; });
  var btnV = btns[0], btnF = btns[1];
  var goodBtn = ex.answer ? btnV : btnF;
  var userBtn = chosen[cur] ? btnV : btnF;
  goodBtn.classList.add('correct');
  if(chosen[cur] !== ex.answer) userBtn.classList.add('wrong');
  userBtn.classList.add('picked');
}

function showFB(){
  var ex = EXS[cur];
  var ok = (chosen[cur] === ex.answer);
  $('feedback').className = 'fb show ' + (ok ? 'ok' : 'ko');
  $('fb-icon').textContent = ok ? '\u2705' : '\u274c';
  $('fb-msg').textContent  = ok ? 'Bonne r\u00e9ponse !' : 'R\u00e9ponse incorrecte';
  var bonne = ex.answer ? 'VRAI' : 'FAUX';
  $('fb-det').innerHTML = 'R\u00e9ponse\u00a0: <b>' + bonne + '</b>. ' + ex.explain;
}

function toggleHint(){
  var h = $('hint-box');
  hintOpen = !hintOpen;
  if(hintOpen){ h.innerHTML = EXS[cur].hint; h.classList.add('show'); }
  else h.classList.remove('show');
}

function updateStats(){
  var done = chosen.filter(function(c){ return c !== null; }).length;
  $('prog-bar').style.width = Math.round(done / TOTAL * 100) + '%';
  $('prog-lbl').textContent = 'Question ' + (cur + 1) + ' / ' + TOTAL;
  $('prog-pct').textContent = Math.round(done / TOTAL * 100) + ' %';
  var ok = 0, ko = 0;
  EXS.forEach(function(ex, i){
    if(chosen[i] === null) return;
    if(chosen[i] === ex.answer) ok++; else ko++;
  });
  $('cnt-ok').textContent  = ok;
  $('cnt-ko').textContent  = ko;
  $('cnt-rem').textContent = chosen.filter(function(c){ return c === null; }).length;
}

function nextQ(){
  if(cur < TOTAL - 1){ cur++; renderQ(); window.scrollTo({top:0, behavior:'smooth'}); }
  else showResults();
}
function prevQ(){
  if(cur > 0){ cur--; renderQ(); window.scrollTo({top:0, behavior:'smooth'}); }
}

function showResults(){
  $('ex-card').style.display = 'none';
  $('results-screen').classList.add('show');
  var ok = 0;
  EXS.forEach(function(ex, i){ if(chosen[i] === ex.answer) ok++; });
  $('score-num').textContent = ok;
  var filled = Math.round(ok / TOTAL * 5);
  $('stars-row').textContent = '\u2b50'.repeat(filled) + '\u2606'.repeat(5 - filled);
  var msgs = [
    'Continue \u00e0 t\u2019entra\u00eener\u00a0!',
    'Quelques notions \u00e0 revoir.',
    'Tu progresses\u00a0!',
    'C\u2019est presque \u00e7a\u00a0!',
    'Tr\u00e8s bien\u00a0!',
    'Parfait\u00a0! \uD83C\uDF89'
  ];
  $('results-msg').textContent = msgs[ok];
  var list = $('recap-list'); list.innerHTML = '';
  EXS.forEach(function(ex, i){
    var ok2 = (chosen[i] === ex.answer);
    var d = document.createElement('div'); d.className = 'ritem ' + (ok2 ? 'ok-i' : 'ko-i');
    var txt = document.createElement('span'); txt.className = 're';
    txt.textContent = 'Affirmation ' + (i + 1);
    var rv = document.createElement('span'); rv.className = 'rv';
    rv.textContent = ex.answer ? 'VRAI' : 'FAUX';
    d.innerHTML = '<span>' + (ok2 ? '\u2705' : '\u274c') + '</span>';
    d.appendChild(txt); d.appendChild(rv); list.appendChild(d);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function restart(){
  cur = 0; chosen = new Array(TOTAL).fill(null);
  $('ex-card').style.display = 'block';
  $('results-screen').classList.remove('show');
  renderQ();
}

/* raccourcis clavier V / F / Entrée */
document.addEventListener('keydown', function(e){
  if($('results-screen').classList.contains('show')) return;
  var k = e.key.toLowerCase();
  if(chosen[cur] === null){
    if(k === 'v') choose(true);
    else if(k === 'f') choose(false);
  } else if(e.key === 'Enter' && !$('btn-next').disabled){
    nextQ();
  }
});

renderQ();
</script>
</body>
</html>
