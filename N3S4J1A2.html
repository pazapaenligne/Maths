<html lang="fr">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résoudre les exercices — Théorème de Pythagore</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Charte du jour : J1 ORANGE ===== */
  :root{
    --j1:        #f5a623;
    --j1-dark:   #c47a10;
    --j1-soft:   #fff5e0;
    --j1-accent: #f5d080;
    --ink:       #2c2418;
    --ink-soft:  #6b5d45;
    --ok:        #3d8b40;
    --ok-soft:   #eaf6ea;
    --err:       #c0392b;
    --err-soft:  #fdecea;
    --line:      #ece3d2;
    --white:     #ffffff;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ width:100%; overflow-x:hidden; }

  body{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    color:var(--ink);
    background:var(--white);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    position:relative;
    min-height:100vh;
  }

  /* ===== Fond : 3 grandes formes organiques (blobs) ===== */
  .blob{
    position:fixed;
    z-index:0;
    background:var(--j1-accent);
    opacity:0.28;
    filter:blur(1px);
    pointer-events:none;
  }
  .blob-1{ /* haut-droite */
    top:-160px; right:-150px;
    width:460px; height:430px;
    border-radius:62% 38% 46% 54% / 58% 47% 53% 42%;
  }
  .blob-2{ /* gauche-milieu */
    top:42%; left:-190px;
    width:430px; height:470px;
    border-radius:44% 56% 63% 37% / 49% 38% 62% 51%;
    opacity:0.26;
  }
  .blob-3{ /* bas-gauche */
    bottom:-180px; left:14%;
    width:500px; height:420px;
    border-radius:55% 45% 38% 62% / 42% 60% 40% 58%;
    opacity:0.27;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:860px;
    margin:0 auto;
    padding:26px 18px 60px;
  }

  /* ===== Hero ===== */
  .hero{ text-align:center; padding:14px 6px 22px; }
  .pill{
    display:inline-block;
    background:var(--j1-soft);
    border:2px solid var(--j1-accent);
    color:var(--j1-dark);
    font-weight:700;
    font-size:0.82rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:7px 16px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .hero h1{
    font-size:2.05rem;
    font-weight:800;
    color:var(--j1-dark);
    line-height:1.15;
    margin-bottom:10px;
  }
  .hero p.sub{
    font-size:1.02rem;
    color:var(--ink-soft);
    max-width:560px;
    margin:0 auto;
    font-weight:500;
  }
  .hero .consigne{
    display:inline-block;
    margin-top:14px;
    background:var(--white);
    border:2px dashed var(--j1-accent);
    border-radius:12px;
    padding:8px 16px;
    font-weight:600;
    color:var(--j1-dark);
    font-size:0.92rem;
  }

  /* ===== Scoreboard sticky ===== */
  .scoreboard{
    position:sticky;
    top:10px;
    z-index:20;
    background:var(--white);
    border:2px solid var(--line);
    border-radius:16px;
    box-shadow:0 6px 20px rgba(196,122,16,0.10);
    padding:14px 16px;
    margin:10px 0 26px;
  }
  .score-stats{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:space-between;
    align-items:stretch;
  }
  .stat{
    flex:1 1 90px;
    background:var(--j1-soft);
    border-radius:12px;
    padding:8px 6px;
    text-align:center;
    border:1.5px solid var(--j1-accent);
  }
  .stat .num{ font-size:1.5rem; font-weight:800; color:var(--j1-dark); line-height:1.1; }
  .stat .lbl{ font-size:0.72rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .stat.err   { background:var(--err-soft); border-color:#f3c6c0; }
  .stat.err .num{ color:var(--err); }
  .stat.done  { background:var(--ok-soft); border-color:#bfe0c0; }
  .stat.done .num{ color:var(--ok); }

  .xp-row{ margin-top:12px; }
  .xp-top{ display:flex; justify-content:space-between; font-size:0.8rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .xp-track{
    height:16px;
    background:var(--j1-soft);
    border-radius:999px;
    overflow:hidden;
    border:1.5px solid var(--j1-accent);
  }
  .xp-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--j1), var(--j1-dark));
    border-radius:999px;
    transition:width 0.5s cubic-bezier(.2,.8,.2,1);
  }

  /* ===== Cartes exercices ===== */
  .card{
    background:var(--white);
    border:2px solid var(--line);
    border-radius:18px;
    padding:20px 18px;
    margin-bottom:22px;
    box-shadow:0 4px 14px rgba(44,36,24,0.05);
    transition:border-color 0.3s, box-shadow 0.3s;
  }
  .card.is-correct{ border-color:#bfe0c0; box-shadow:0 6px 18px rgba(61,139,64,0.12); }
  .card.is-error{ border-color:#f3c6c0; }

  .card-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .badge-num{
    flex:0 0 auto;
    width:42px; height:42px;
    background:var(--j1);
    color:var(--white);
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:1.25rem;
  }
  .card.is-correct .badge-num{ background:var(--ok); }
  .card-head .ctitle{ font-weight:700; font-size:1.02rem; color:var(--j1-dark); }
  .card.is-correct .ctitle{ color:var(--ok); }
  .check-mark{ margin-left:auto; font-size:1.5rem; color:var(--ok); opacity:0; transition:opacity 0.3s; }
  .card.is-correct .check-mark{ opacity:1; }

  .question{ font-size:1rem; margin-bottom:14px; color:var(--ink); }
  .question b{ color:var(--j1-dark); }

  /* ===== Figure SVG ===== */
  .figure{
    background:var(--j1-soft);
    border:1.5px solid var(--j1-accent);
    border-radius:14px;
    padding:8px;
    margin:0 auto 16px;
    max-width:320px;
  }
  .figure svg{ width:100%; height:auto; display:block; }

  /* ===== Saisie ===== */
  .answer-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .num-input{
    font-family:inherit;
    font-size:1.2rem;
    font-weight:700;
    width:130px;
    padding:12px 14px;
    border:2.5px solid var(--j1-accent);
    border-radius:12px;
    color:var(--ink);
    text-align:center;
    background:var(--white);
  }
  .num-input:focus{ outline:none; border-color:var(--j1); box-shadow:0 0 0 4px rgba(245,166,35,0.18); }
  .unit-tag{ font-weight:700; color:var(--ink-soft); font-size:1.05rem; }

  /* ===== QCM ===== */
  .qcm{ display:flex; gap:12px; flex-wrap:wrap; }
  .qcm-btn{
    font-family:inherit;
    flex:1 1 130px;
    font-size:1.15rem;
    font-weight:700;
    padding:16px;
    border:2.5px solid var(--j1-accent);
    border-radius:14px;
    background:var(--white);
    color:var(--j1-dark);
    cursor:pointer;
    transition:transform 0.1s, background 0.2s, border-color 0.2s;
  }
  .qcm-btn:hover{ background:var(--j1-soft); }
  .qcm-btn:active{ transform:scale(0.97); }
  .qcm-btn.picked{ background:var(--j1); color:var(--white); border-color:var(--j1-dark); }

  /* ===== Boutons ===== */
  .btn{
    font-family:inherit;
    font-weight:700;
    font-size:1.02rem;
    padding:13px 22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:transform 0.1s, background 0.2s, box-shadow 0.2s;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-check{ background:var(--j1); color:var(--white); box-shadow:0 4px 0 var(--j1-dark); }
  .btn-check:hover{ background:var(--j1-dark); box-shadow:0 4px 0 #9c6209; }
  .btn-retry{ background:var(--err-soft); color:var(--err); border:2px solid #f3c6c0; }
  .btn-retry:hover{ background:#fbe0db; }
  .btn-big{
    display:block;
    width:100%;
    max-width:340px;
    margin:18px auto 0;
    background:var(--j1-dark);
    color:var(--white);
    font-size:1.12rem;
    padding:16px;
    box-shadow:0 5px 0 #8a5a0c;
  }
  .btn-big:hover{ background:#a86a0e; }

  /* ===== Feedback ===== */
  .feedback{ margin-top:14px; font-weight:600; display:none; }
  .feedback.show{ display:block; }
  .feedback.ok{ color:var(--ok); }
  .feedback.bad{ color:var(--err); }
  .solution{
    margin-top:12px;
    background:var(--ok-soft);
    border:1.5px solid #bfe0c0;
    border-radius:12px;
    padding:12px 14px;
    font-size:0.95rem;
    color:#1f5b22;
    display:none;
  }
  .solution.show{ display:block; }
  .solution b{ color:var(--ok); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .locked{ opacity:0.65; pointer-events:none; }

  /* ===== Écran résultats ===== */
  .results{
    display:none;
    text-align:center;
    background:var(--white);
    border:2.5px solid var(--j1-accent);
    border-radius:20px;
    padding:34px 22px;
    margin-bottom:24px;
    box-shadow:0 10px 30px rgba(196,122,16,0.16);
  }
  .results.show{ display:block; animation:pop 0.5s ease; }
  @keyframes pop{ from{ transform:scale(0.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .results .trophy{ font-size:3.4rem; line-height:1; }
  .results h2{ color:var(--j1-dark); font-size:1.6rem; margin:10px 0 4px; }
  .results .rscore{ font-size:1.1rem; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .stars{ font-size:2rem; letter-spacing:6px; margin:6px 0 12px; }
  .star-on{ color:var(--j1); }
  .star-off{ color:var(--line); }
  .results .rmsg{ color:var(--ink-soft); font-weight:500; max-width:440px; margin:0 auto 6px; }

  @media (max-width:430px){
    .hero h1{ font-size:1.62rem; }
    .stat .num{ font-size:1.25rem; }
    .stat .lbl{ font-size:0.64rem; }
    .num-input{ width:110px; }
    .wrap{ padding:20px 12px 50px; }
  }
</style>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="wrap">
    <header class="hero">
      <span class="pill">Semaine 4 · Jour 1</span>
      <h1>&#9999;&#65039; Résoudre les exercices</h1>
      <p class="sub">Théorème de Pythagore : calculer une longueur dans un triangle rectangle et reconnaître un triangle rectangle.</p>
      <div class="consigne">&#128221; Calcule <u>sans calculatrice</u>.</div>
    </header>

    <section class="scoreboard" aria-label="Tableau de score">
      <div class="score-stats">
        <div class="stat done"><div class="num" id="s-ok">0</div><div class="lbl">Réussies</div></div>
        <div class="stat"><div class="num" id="s-left">4</div><div class="lbl">Restantes</div></div>
        <div class="stat err"><div class="num" id="s-err">0</div><div class="lbl">Erreurs</div></div>
      </div>
      <div class="xp-row">
        <div class="xp-top"><span>Progression</span><span id="xp-text">0 / 4</span></div>
        <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
      </div>
    </section>

    <div id="results" class="results">
      <div class="trophy">&#127942;</div>
      <h2>Tous les exercices terminés&nbsp;!</h2>
      <div class="rscore" id="r-score"></div>
      <div class="stars" id="r-stars"></div>
      <p class="rmsg" id="r-msg"></p>
      <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer</button>
    </div>

    <main id="exoList"></main>

    <button class="btn btn-big" onclick="generateAll()">&#8635; Recommencer tous les exercices</button>
  </div>

<script>
/* ============================================================
   PAZAPA — N3S4J1 — Théorème de Pythagore
   ============================================================ */
const TOTAL = 4;
const TRIPLES = [[3,4,5],[6,8,10],[9,12,15],[12,16,20],[15,20,25],
                 [5,12,13],[10,24,26],[8,15,17],[7,24,25],[20,21,29]];

const rint  = n => Math.floor(Math.random()*n);
const pick  = a => a[rint(a.length)];
const coin  = () => Math.random() < 0.5;

let exos = [];   /* objets exercice */
let state = [];  /* {correct, errors} par exo */

/* ---------- Géométrie SVG ---------- */
function svgEsc(s){ return String(s); }

/*
  Dessine un triangle dans une boîte SVG.
  A,B,C : points en coordonnées maths (y vers le haut).
  labels : {AB, BC, CA} textes des longueurs.
  unknown : 'AB' | 'BC' | 'CA' | null  -> affiché en rouge "?"
  rightAngleAt : 'A' | 'B' | 'C' | null
*/
function drawTriangle(A, B, C, labels, unknown, rightAngleAt){
  const W = 300, H = 220, M = 42;
  const pts = {A, B, C};
  const xs = [A.x,B.x,C.x], ys = [A.y,B.y,C.y];
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(maxX-minX, 1e-6), spanY = Math.max(maxY-minY, 1e-6);
  const s = Math.min((W-2*M)/spanX, (H-2*M)/spanY);
  /* centre la figure */
  const offX = M + ((W-2*M) - spanX*s)/2;
  const offY = M + ((H-2*M) - spanY*s)/2;
  const T = p => ({
    x: offX + (p.x - minX)*s,
    y: H - (offY + (p.y - minY)*s)   /* flip y */
  });
  const a = T(A), b = T(B), c = T(C);
  const cx = (a.x+b.x+c.x)/3, cy = (a.y+b.y+c.y)/3;

  /* grille légère */
  let grid = '';
  for(let gx=0; gx<=W; gx+=24) grid += `<line x1="${gx}" y1="0" x2="${gx}" y2="${H}" stroke="#c47a10" stroke-opacity="0.10" stroke-width="1"/>`;
  for(let gy=0; gy<=H; gy+=24) grid += `<line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="#c47a10" stroke-opacity="0.10" stroke-width="1"/>`;

  /* polygone */
  const poly = `<polygon points="${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}" fill="rgba(255,255,255,0.6)" stroke="#c47a10" stroke-width="2.6" stroke-linejoin="round"/>`;

  /* marqueur angle droit */
  let ra = '';
  if(rightAngleAt){
    const V = T(pts[rightAngleAt]);
    const others = ['A','B','C'].filter(k=>k!==rightAngleAt).map(k=>T(pts[k]));
    const u1 = norm(sub(others[0], V)), u2 = norm(sub(others[1], V));
    const m = 15;
    const p0 = V;
    const p1 = add(V, mul(u1, m));
    const p2 = add(add(V, mul(u1, m)), mul(u2, m));
    const p3 = add(V, mul(u2, m));
    ra = `<polygon points="${p0.x},${p0.y} ${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}" fill="none" stroke="#c47a10" stroke-width="2"/>`;
  }

  /* sommets + lettres */
  let verts = '';
  for(const [k,P] of [['A',a],['B',b],['C',c]]){
    const dir = norm(sub(P, {x:cx,y:cy}));
    const lx = P.x + dir.x*18, ly = P.y + dir.y*18 + 5;
    verts += `<circle cx="${P.x}" cy="${P.y}" r="4" fill="#c47a10"/>`;
    verts += `<text x="${lx}" y="${ly}" font-family="JetBrains Mono, monospace" font-size="16" font-weight="800" fill="#2c2418" text-anchor="middle">${k}</text>`;
  }

  /* labels des côtés */
  const edges = [['AB',a,b],['BC',b,c],['CA',c,a]];
  let elab = '';
  for(const [name,P,Q] of edges){
    const mid = {x:(P.x+Q.x)/2, y:(P.y+Q.y)/2};
    let dir = norm(sub(mid, {x:cx,y:cy}));
    if(!isFinite(dir.x)) dir = {x:0,y:-1};
    const lx = mid.x + dir.x*20, ly = mid.y + dir.y*20 + 4;
    if(unknown === name){
      elab += `<text x="${lx}" y="${ly}" font-family="JetBrains Mono, monospace" font-size="20" font-weight="800" fill="#c0392b" text-anchor="middle">?</text>`;
    } else {
      elab += `<text x="${lx}" y="${ly}" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#2c2418" text-anchor="middle">${labels[name]}</text>`;
    }
  }

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="figure triangle">${grid}${poly}${ra}${verts}${elab}</svg>`;
}
/* petites fonctions vectorielles */
function sub(p,q){ return {x:p.x-q.x, y:p.y-q.y}; }
function add(p,q){ return {x:p.x+q.x, y:p.y+q.y}; }
function mul(p,k){ return {x:p.x*k, y:p.y*k}; }
function norm(p){ const d=Math.hypot(p.x,p.y)||1; return {x:p.x/d, y:p.y/d}; }

/* ---------- Générateurs d'exercices ---------- */

/* Ex1 : calculer l'hypoténuse */
function genHypotenuse(){
  const [t0,t1,c] = pick(TRIPLES);
  /* on mélange les deux côtés de l'angle droit pour varier l'affichage */
  let legH = t0, legV = t1;
  if(coin()){ legH = t1; legV = t0; }
  /* B = angle droit (origine), C à droite (legH), A en haut (legV) */
  const A = {x:0, y:legV}, B = {x:0, y:0}, C = {x:legH, y:0};
  const labels = { AB:`${legV} cm`, BC:`${legH} cm`, CA:`? cm` };
  const fig = drawTriangle(A,B,C, labels, 'CA', 'B');
  return {
    type:'input', unit:'cm', answer:c,
    title:'Calculer l\u2019hypoténuse',
    question:`Le triangle <b>ABC</b> est rectangle en <b>B</b>. Les deux côtés de l\u2019angle droit mesurent <b>${legH} cm</b> et <b>${legV} cm</b>. Calcule la longueur de l\u2019hypoténuse <b>[AC]</b>.`,
    figure:fig,
    solution:`D\u2019après le théorème de Pythagore&nbsp;: <b>AC² = AB² + BC²</b><br>AC² = ${legV}² + ${legH}² = ${legV*legV} + ${legH*legH} = <b>${c*c}</b><br>Donc AC = √${c*c} = <b>${c} cm</b>.`
  };
}

/* Ex2 : calculer un côté de l'angle droit */
function genLeg(){
  const [t0,t1,c] = pick(TRIPLES);
  /* on choisit le côté connu et le côté inconnu */
  let known = t0, unknownLen = t1;
  if(coin()){ known = t1; unknownLen = t0; }
  /* B angle droit. On connaît l'hypoténuse [AC]=c et le côté [BC]=known ; inconnu [AB] */
  const A = {x:0, y:unknownLen}, B = {x:0, y:0}, C = {x:known, y:0};
  const labels = { AB:`? cm`, BC:`${known} cm`, CA:`${c} cm` };
  const fig = drawTriangle(A,B,C, labels, 'AB', 'B');
  return {
    type:'input', unit:'cm', answer:unknownLen,
    title:'Calculer un côté de l\u2019angle droit',
    question:`Le triangle <b>ABC</b> est rectangle en <b>B</b>. L\u2019hypoténuse <b>[AC]</b> mesure <b>${c} cm</b> et le côté <b>[BC]</b> mesure <b>${known} cm</b>. Calcule la longueur du côté <b>[AB]</b>.`,
    figure:fig,
    solution:`D\u2019après le théorème de Pythagore&nbsp;: <b>AB² = AC² − BC²</b><br>AB² = ${c}² − ${known}² = ${c*c} − ${known*known} = <b>${unknownLen*unknownLen}</b><br>Donc AB = √${unknownLen*unknownLen} = <b>${unknownLen} cm</b>.`
  };
}

/* Ex3 : réciproque (QCM Oui / Non) */
function genReciproque(){
  let sides; /* [AB, AC, BC] avec BC = plus grand côté (candidat hypoténuse) */
  let isRight;
  if(coin()){
    /* OUI : vrai triangle rectangle */
    const [a,b,c] = pick(TRIPLES);
    sides = [a,b,c]; isRight = true;
  } else {
    /* NON : on perturbe le plus grand côté de ±1 (jamais rectangle) */
    let ok = false, a,b,cp;
    while(!ok){
      const [x,y,z] = pick(TRIPLES);
      const d = coin()? 1 : -1;
      a=x; b=y; cp=z+d;
      if(cp <= b) continue;            /* cp doit rester le plus grand */
      if(a + b <= cp) continue;        /* inégalité triangulaire */
      ok = true;
    }
    sides = [a,b,cp]; isRight = false;
  }
  const [AB, AC, BC] = sides;
  /* figure : base BC sur l'axe x, apex A par intersection de cercles */
  const Ax = (AB*AB - AC*AC + BC*BC) / (2*BC);
  const Ay = Math.sqrt(Math.max(AB*AB - Ax*Ax, 0));
  const A = {x:Ax, y:Ay}, B = {x:0, y:0}, C = {x:BC, y:0};
  const labels = { AB:`${AB} cm`, CA:`${AC} cm`, BC:`${BC} cm` };
  const fig = drawTriangle(A,B,C, labels, null, null); /* PAS de marqueur d'angle droit */
  const big = BC, p = AB, q = AC;
  const sumSq = p*p + q*q, bigSq = big*big;
  const cmp = (bigSq === sumSq) ? '=' : '≠';
  const concl = isRight
     ? `Comme ${bigSq} = ${sumSq}, le triangle <b>est rectangle</b> (en A).`
     : `Comme ${bigSq} ${cmp} ${sumSq}, le triangle <b>n\u2019est pas rectangle</b>.`;
  return {
    type:'qcm', answer: isRight ? 'Oui' : 'Non',
    title:'Réciproque de Pythagore',
    question:`Le triangle <b>ABC</b> a pour côtés&nbsp;: <b>AB = ${AB} cm</b>, <b>AC = ${AC} cm</b> et <b>BC = ${BC} cm</b>. En utilisant la réciproque du théorème de Pythagore, ce triangle est-il rectangle&nbsp;?`,
    figure:fig,
    solution:`Le plus grand côté est <b>[BC] = ${big} cm</b>.<br>On compare&nbsp;: BC² = ${big}² = <b>${bigSq}</b> et AB² + AC² = ${p}² + ${q}² = ${p*p} + ${q*q} = <b>${sumSq}</b>.<br>${concl}`
  };
}

/* Ex4 : application concrète (échelle OU parc) */
function genApplication(){
  if(coin()){
    /* Échelle contre un mur : échelle = hyp, pied = un côté, hauteur = inconnu */
    const [a,b,c] = pick(TRIPLES);
    /* échelle = c, distance au pied = a, hauteur = b */
    /* figure : mur vertical [AB]=hauteur ?, sol [BC]=a, échelle [CA]=c, angle droit en B */
    const A = {x:0, y:b}, B = {x:0, y:0}, C = {x:a, y:0};
    const labels = { AB:`? m`, BC:`${a} m`, CA:`${c} m` };
    const fig = drawTriangle(A,B,C, labels, 'AB', 'B');
    return {
      type:'input', unit:'m', answer:b,
      title:'Application — l\u2019échelle',
      question:`Une échelle de <b>${c} m</b> est appuyée contre un mur vertical. Le pied de l\u2019échelle est posé à <b>${a} m</b> du mur. Le mur, le sol et l\u2019échelle forment un triangle rectangle. À quelle <b>hauteur</b> l\u2019échelle touche-t-elle le mur&nbsp;?`,
      figure:fig,
      solution:`D\u2019après le théorème de Pythagore&nbsp;: <b>hauteur² = échelle² − distance²</b><br>hauteur² = ${c}² − ${a}² = ${c*c} − ${a*a} = <b>${b*b}</b><br>Donc hauteur = √${b*b} = <b>${b} m</b>.`
    };
  } else {
    /* Parc rectangulaire : largeur a, longueur b, diagonale = inconnu (hyp) */
    const [a,b,c] = pick(TRIPLES);
    /* figure : triangle rectangle = moitié du rectangle. [BC]=largeur a, [AB]=longueur b, [CA]=diagonale ? */
    const A = {x:0, y:b}, B = {x:0, y:0}, C = {x:a, y:0};
    const labels = { AB:`${b} m`, BC:`${a} m`, CA:`? m` };
    const fig = drawTriangle(A,B,C, labels, 'CA', 'B');
    return {
      type:'input', unit:'m', answer:c,
      title:'Application — le parc',
      question:`Un parc rectangulaire mesure <b>${a} m</b> de large et <b>${b} m</b> de long. Un sentier le traverse en <b>diagonale</b>, d\u2019un coin jusqu\u2019au coin opposé. Quelle est la <b>longueur</b> de ce sentier&nbsp;?`,
      figure:fig,
      solution:`La diagonale est l\u2019hypoténuse d\u2019un triangle rectangle. D\u2019après Pythagore&nbsp;: <b>diagonale² = largeur² + longueur²</b><br>diagonale² = ${a}² + ${b}² = ${a*a} + ${b*b} = <b>${c*c}</b><br>Donc diagonale = √${c*c} = <b>${c} m</b>.`
    };
  }
}

const GENERATORS = [genHypotenuse, genLeg, genReciproque, genApplication];

/* ---------- Rendu ---------- */
function generateAll(){
  exos = GENERATORS.map(g => g());
  state = exos.map(()=>({correct:false, errors:0}));
  document.getElementById('results').classList.remove('show');
  const root = document.getElementById('exoList');
  root.innerHTML = '';
  exos.forEach((ex, i) => root.appendChild(buildCard(ex, i)));
  updateScore();
  window.__exos = exos;   /* hook de test */
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildCard(ex, i){
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-'+i;

  let inputHTML;
  if(ex.type === 'input'){
    inputHTML = `
      <div class="answer-row">
        <input class="num-input" id="in-${i}" type="number" inputmode="numeric" placeholder="?" aria-label="ta réponse">
        <span class="unit-tag">${ex.unit}</span>
      </div>
      <div class="actions" id="act-${i}">
        <button class="btn btn-check" id="chk-${i}">Vérifier</button>
      </div>`;
  } else {
    inputHTML = `
      <div class="qcm">
        <button class="qcm-btn" data-val="Oui" data-i="${i}">Oui, il est rectangle</button>
        <button class="qcm-btn" data-val="Non" data-i="${i}">Non, il ne l\u2019est pas</button>
      </div>
      <div class="actions" id="act-${i}"></div>`;
  }

  card.innerHTML = `
    <div class="card-head">
      <div class="badge-num">${i+1}</div>
      <div class="ctitle">${ex.title}</div>
      <div class="check-mark">&#10004;</div>
    </div>
    <p class="question">${ex.question}</p>
    ${ex.figure ? `<div class="figure">${ex.figure}</div>` : ''}
    ${inputHTML}
    <div class="feedback" id="fb-${i}"></div>
    <div class="solution" id="sol-${i}">${ex.solution}</div>`;

  /* écouteurs */
  setTimeout(()=>{
    if(ex.type === 'input'){
      const chk = card.querySelector('#chk-'+i);
      chk.addEventListener('click', ()=>checkInput(i));
      const inp = card.querySelector('#in-'+i);
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkInput(i); });
    } else {
      card.querySelectorAll('.qcm-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>checkQcm(i, btn.dataset.val));
      });
    }
  },0);

  return card;
}

function checkInput(i){
  if(state[i].correct) return;
  const inp = document.getElementById('in-'+i);
  const raw = inp.value.trim().replace(',', '.');
  const fb = document.getElementById('fb-'+i);
  if(raw === ''){ flash(fb,'bad','Écris d\u2019abord ta réponse.'); return; }
  const val = Number(raw);
  if(Number.isNaN(val)){ flash(fb,'bad','Écris un nombre.'); return; }
  if(Math.abs(val - exos[i].answer) < 1e-9){
    markCorrect(i);
  } else {
    markError(i);
  }
}

function checkQcm(i, val){
  if(state[i].correct) return;
  /* surligne le choix */
  const card = document.getElementById('card-'+i);
  card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.toggle('picked', b.dataset.val===val));
  if(val === exos[i].answer){
    markCorrect(i);
  } else {
    markError(i);
  }
}

function markError(i){
  state[i].errors++;
  const card = document.getElementById('card-'+i);
  card.classList.add('is-error');
  const fb = document.getElementById('fb-'+i);
  flash(fb,'bad','Pas encore… réessaie en reprenant ton calcul.');
  /* bouton Réessayer sur CET exo (solution non révélée) */
  const act = document.getElementById('act-'+i);
  if(!act.querySelector('.btn-retry')){
    const r = document.createElement('button');
    r.className = 'btn btn-retry';
    r.innerHTML = '&#8635; Réessayer';
    r.addEventListener('click', ()=>retry(i));
    act.appendChild(r);
  }
  updateScore();
}

function retry(i){
  const card = document.getElementById('card-'+i);
  card.classList.remove('is-error');
  document.getElementById('fb-'+i).classList.remove('show');
  if(exos[i].type === 'input'){
    const inp = document.getElementById('in-'+i);
    inp.value = ''; inp.focus();
  } else {
    card.querySelectorAll('.qcm-btn').forEach(b=>b.classList.remove('picked'));
  }
  const r = document.getElementById('act-'+i).querySelector('.btn-retry');
  if(r) r.remove();
}

function markCorrect(i){
  state[i].correct = true;
  const card = document.getElementById('card-'+i);
  card.classList.remove('is-error');
  card.classList.add('is-correct');
  const fb = document.getElementById('fb-'+i);
  flash(fb,'ok','Bravo, c\u2019est juste&nbsp;!');
  document.getElementById('sol-'+i).classList.add('show'); /* solution révélée seulement maintenant */
  /* verrouille la saisie */
  const act = document.getElementById('act-'+i);
  act.classList.add('locked');
  if(exos[i].type === 'input'){
    const inp = document.getElementById('in-'+i);
    inp.disabled = true; inp.classList.add('locked');
  } else {
    card.querySelectorAll('.qcm-btn').forEach(b=>{ b.classList.add('locked'); });
  }
  updateScore();
  checkFinished();
}

function flash(el, kind, msg){
  el.className = 'feedback show ' + kind;
  el.innerHTML = msg;
}

function updateScore(){
  const ok = state.filter(s=>s.correct).length;
  const err = state.reduce((a,s)=>a+s.errors,0);
  document.getElementById('s-ok').textContent = ok;
  document.getElementById('s-left').textContent = TOTAL - ok;
  document.getElementById('s-err').textContent = err;
  document.getElementById('xp-text').textContent = ok + ' / ' + TOTAL;
  document.getElementById('xp-fill').style.width = (100*ok/TOTAL) + '%';
}

function checkFinished(){
  if(state.every(s=>s.correct)){
    const err = state.reduce((a,s)=>a+s.errors,0);
    let stars = 3;
    if(err >= 1 && err <= 2) stars = 2;
    if(err >= 3) stars = 1;
    document.getElementById('r-score').textContent =
      `${TOTAL} / ${TOTAL} réussis · ${err} erreur${err>1?'s':''}`;
    let starHTML = '';
    for(let k=0;k<3;k++) starHTML += `<span class="${k<stars?'star-on':'star-off'}">&#9733;</span>`;
    document.getElementById('r-stars').innerHTML = starHTML;
    document.getElementById('r-msg').textContent =
      'Personne ne réussit tout du premier coup — l\u2019important, c\u2019est d\u2019avoir cherché et compris. Tu peux recommencer avec de nouveaux nombres.';
    const res = document.getElementById('results');
    res.classList.add('show');
    setTimeout(()=>res.scrollIntoView({behavior:'smooth', block:'center'}), 250);
  }
}

/* démarrage */
generateAll();
</script>
