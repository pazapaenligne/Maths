<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa Maths — Distributivité simple (4e S3 J1)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f5a623;--day-dark:#b06f0c;--day-light:#fff7ec;--day-border:#f8c97a;--day-glow:rgba(245,166,35,.18);
  --bg:#ffffff;--surface:#ffffff;--border:#eeddd0;
  --green:#5fa800;--green-soft:#8dc63f;--green-bg:#f0faeb;--green-border:#c7e89a;
  --pink:#f28b82;--pink-bg:#fff0ef;--pink-border:#f4c4bf;
  --orange:#f5a623;--red:#d33;
  --text:#1a1d23;--muted:#7a7568;
  --radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 3rem;overflow-x:hidden;line-height:1.7;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}

/* ── FRAME & BULLES ── */
.frame{position:relative;overflow:hidden;max-width:760px;margin:0 auto;
  background:radial-gradient(300px 300px at 100% 0%,rgba(245,166,35,.13),transparent 60%),
             radial-gradient(240px 240px at 0% 100%,rgba(248,201,122,.18),transparent 60%),var(--bg);}
.bubble{position:absolute;border-radius:50%;pointer-events:none;}
.b1{width:300px;height:300px;top:-80px;right:-90px;background:var(--day);opacity:.42;}
.b2{width:220px;height:220px;bottom:200px;left:-80px;background:var(--day-border);opacity:.50;}
.b3{width:140px;height:140px;bottom:-30px;right:-40px;background:var(--day-border);opacity:.45;}
.layer{position:relative;z-index:1;}

/* ── HERO ── */
.hero{background:var(--surface);border-bottom:2px solid var(--day-light);padding:2rem 1.25rem 1.6rem;text-align:center;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--day);color:#fff;font-size:clamp(.66rem,2.6vw,.8rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.4rem 1.1rem;border-radius:99px;margin-bottom:.8rem;white-space:nowrap;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted);letter-spacing:.14em;margin-bottom:.5rem;}
.hero h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.4rem,5.5vw,2rem);font-weight:900;line-height:1.15;color:var(--text);}
.hero h1 .hl{color:var(--day-dark);}
.theme-badge{display:inline-block;margin-top:.7rem;background:var(--day-light);border:2px solid var(--day-border);color:var(--day-dark);font-size:.75rem;font-weight:700;padding:.3rem .9rem;border-radius:99px;letter-spacing:.06em;}

/* ── SCOREBOARD ── */
.gamebox{max-width:760px;margin:1.2rem auto 0;padding:0 1.25rem;}
.scoreboard-sticky{position:sticky;top:0;z-index:5;}
.gb-inner{background:var(--surface);border:2px solid var(--day-border);border-radius:14px;padding:1rem;box-shadow:0 4px 16px var(--day-glow);}
.gb-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.16em;color:var(--day-dark);text-align:center;margin-bottom:.6rem;text-transform:uppercase;}
.scoreboard{display:flex;gap:.5rem;margin-bottom:.8rem;}
.sb{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:.5rem .3rem;text-align:center;}
.sb .v{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:clamp(1.8rem,6vw,2.4rem);line-height:1;}
.sb .l{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.1em;color:var(--muted);margin-top:.25rem;text-transform:uppercase;}
.sb.ok{border-color:var(--green-border);} .sb.ok .v{color:var(--green);}
.sb.rem{border-color:var(--day-border);} .sb.rem .v{color:var(--day-dark);}
.sb.err{border-color:var(--pink-border);} .sb.err .v{color:var(--red);}
.xp-bg{background:var(--border);border-radius:99px;height:13px;overflow:hidden;}
.xp-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--day-border));transition:width .6s ease;}
.xp-txt{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--day-dark);text-align:right;margin-top:.3rem;letter-spacing:.08em;}

/* ── MAIN ── */
.main{max-width:760px;margin:0 auto;padding:1.3rem 1.25rem 0;}
.section-title{font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--day-dark);margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem;}
.section-title::before{content:'';display:block;width:18px;height:3px;background:var(--day);border-radius:2px;}

/* ── CARD ── */
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.3rem;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .35s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.card-stripe{height:5px;background:linear-gradient(90deg,#f28b82,#f5a623,#8dc63f,#3ab5d8);}
.card-inner{padding:1.4rem 1.2rem;}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:.9rem;flex-wrap:wrap;}
.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:900;flex-shrink:0;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.q-cat{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;padding:.2rem .55rem;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;margin-left:auto;white-space:nowrap;background:var(--day-light);color:var(--day-dark);border:1px solid var(--day-border);}
.eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1.1rem,4vw,1.5rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.5;}
.consigne{font-size:.9rem;color:var(--text);margin-bottom:.9rem;line-height:1.7;}
.consigne b{color:var(--day-dark);}

/* ── INPUT ── */
.input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.6rem;}
.input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:var(--text);}
.answer-input{background:#fff;border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:.55rem .7rem;outline:none;transition:border-color .2s;min-height:2.6rem;text-align:center;width:160px;}
.answer-input:focus{border-color:var(--day);box-shadow:0 0 0 3px var(--day-glow);}
.answer-input.correct-input{border-color:var(--green-soft);background:var(--green-bg);}
.answer-input.wrong-input{border-color:var(--pink);background:var(--pink-bg);}

/* ── APPARIEMENT ── */
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem;}
@media(max-width:480px){.pair-grid{grid-template-columns:1fr;}}
.pair-col-title{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.4rem;text-align:center;}
.pair-items{display:flex;flex-direction:column;gap:.45rem;}
.pair-item{padding:.6rem .9rem;border:2px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:clamp(.88rem,3vw,1rem);font-weight:600;cursor:pointer;text-align:center;background:#fff;transition:border-color .15s,background .15s;min-height:2.6rem;display:flex;align-items:center;justify-content:center;user-select:none;}
.pair-item:hover:not(.locked):not(.matched){border-color:var(--day);background:var(--day-light);}
.pair-item.selected{border-color:var(--day);background:var(--day-light);box-shadow:0 0 0 3px var(--day-glow);}
.pair-item.matched-ok{border-color:var(--green-soft);background:var(--green-bg);color:var(--green);cursor:default;}
.pair-item.matched-ko{border-color:var(--pink);background:var(--pink-bg);color:var(--red);cursor:default;}
.pair-item.intrus-revealed{border-color:#ddd;background:#f7f7f7;color:var(--muted);cursor:default;text-decoration:line-through;}
.pair-item.locked{cursor:default;}
.pair-match-count{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:.6rem;text-align:center;}

/* ── BOUTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;letter-spacing:.04em;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s,background .15s;min-height:2.6rem;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);} .btn:disabled{opacity:.4;cursor:default;}
.btn-check{background:var(--green);color:#fff;}
.btn-check:hover:not(:disabled){box-shadow:0 4px 14px rgba(95,168,0,.4);}
.btn-hint{background:#fff;border:2px solid var(--orange);color:var(--day-dark);}
.btn-hint:hover:not(:disabled){background:var(--day-light);}
.btn-retry{background:#fff;border:2px solid var(--day);color:var(--day-dark);}
.btn-retry:hover:not(:disabled){background:var(--day-light);}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem;}

/* ── HINT & FEEDBACK ── */
.hint-box{margin-top:.9rem;background:var(--day-light);border:1.5px dashed var(--day);border-radius:10px;padding:.7rem 1rem;font-size:.82rem;color:var(--day-dark);display:none;line-height:1.7;font-family:'JetBrains Mono',monospace;}
.hint-box.show{display:block;}
.fb{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;font-size:.88rem;display:none;align-items:flex-start;gap:.6rem;line-height:1.7;}
.fb.show{display:flex;}
.fb.ok{background:var(--green-bg);border:1.5px solid var(--green-soft);color:#3a7d0a;}
.fb.ko{background:var(--pink-bg);border:1.5px solid var(--pink);color:#c0392b;}
.fb-icon{font-size:1.4rem;flex-shrink:0;}
.fb-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.7;}

/* ── RÉSULTATS ── */
.results{display:none;}.results.show{display:block;}
.results-card{background:var(--surface);border:2px solid var(--day-border);border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 24px var(--day-glow);margin-bottom:1.3rem;}
.results-inner{padding:2rem 1.3rem;text-align:center;}
.results-trophy{font-size:3.2rem;animation:bounce 3s infinite;display:block;margin-bottom:.3rem;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-7px) rotate(5deg);}}
.results-score{font-family:'JetBrains Mono',monospace;font-size:clamp(2.4rem,10vw,3.8rem);font-weight:900;line-height:1;margin:.3rem 0 .2rem;}
.results-score .s-num{color:var(--green);}
.stars-row{font-size:1.8rem;margin:.3rem 0 .9rem;letter-spacing:.15rem;}
.results-msg{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:.95rem;margin-bottom:1.4rem;letter-spacing:.03em;}
.results-feedback{background:var(--day-light);border:2px solid var(--day-border);border-radius:10px;padding:.9rem 1.1rem;font-size:.85rem;color:var(--day-dark);text-align:left;line-height:1.8;margin-bottom:1.2rem;}

/* ── RESTART ── */
.restart-wrap{max-width:760px;margin:0 auto;padding:0 1.25rem;text-align:center;}
.btn-restart{background:var(--day);color:#fff;font-size:.95rem;padding:.8rem 2rem;}
.btn-restart:hover{background:var(--day-dark);}
footer{text-align:center;margin-top:2.2rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.06em;}

@media(max-width:600px){
  .scoreboard{gap:.35rem;}.sb{padding:.4rem .1rem;}.sb .v{font-size:1.7rem;}
  .hero{padding:1.4rem 1rem 1.2rem;}.main,.gamebox,.restart-wrap{padding:0 1rem;}
  .card-inner{padding:1.1rem .9rem;}.btn-row{flex-direction:column;}.btn-row .btn{width:100%;}
  .pair-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="frame">
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="layer">

    <!-- HERO -->
    <div class="hero">
      <div class="logo-badge">
        <span class="logo-dot" style="background:#f28b82"></span>
        <span class="logo-dot" style="background:#ffffff"></span>
        <span class="logo-dot" style="background:#b06f0c"></span>
        Pazapa &middot; Maths &middot; 4e
      </div>
      <div class="week-label">SEMAINE 3 &mdash; JOUR 1</div>
      <h1>✏️ <span class="hl">Série d'exercices</span></h1>
      <div class="theme-badge">Distributivité simple</div>
    </div>

    <!-- SCOREBOARD -->
    <div class="gamebox scoreboard-sticky">
      <div class="gb-inner">
        <div class="gb-label">▶ Distributivité &middot; Progression</div>
        <div class="scoreboard">
          <div class="sb ok"><div class="v" id="h-ok">0</div><div class="l">Réussies</div></div>
          <div class="sb rem"><div class="v" id="h-rem">8</div><div class="l">Restantes</div></div>
          <div class="sb err"><div class="v" id="h-ko">0</div><div class="l">Erreurs</div></div>
        </div>
        <div class="xp-bg"><div class="xp-fill" id="bar"></div></div>
        <div class="xp-txt" id="prog">0 / 8</div>
      </div>
    </div>

    <!-- EXERCICES -->
    <div class="main">
      <div id="cards-part1"></div>
      <div id="cards-part2"></div>

      <!-- RÉSULTATS -->
      <div class="results" id="results-screen">
        <div class="results-card">
          <div class="card-stripe"></div>
          <div class="results-inner">
            <span class="results-trophy">🏆</span>
            <div class="results-score"><span class="s-num" id="score-num">0</span>/<span id="score-tot">8</span></div>
            <div class="stars-row" id="stars-row"></div>
            <div class="results-msg" id="results-msg"></div>
            <div class="results-feedback" id="results-feedback"></div>
          </div>
        </div>
      </div>

      <div class="restart-wrap">
        <button class="btn btn-restart" onclick="restart()">↺ Recommencer</button>
      </div>
      <footer>N4 &middot; S3 &middot; J1 &middot; Série Exercices &middot; Pazapa Maths 4e</footer>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DONNÉES
   ========================================================= */

/* --- PARTIE 1 : Appariement (Bilan distributivité) ---
   Paires : forme factorisée ↔ forme développée
   + 2 intrus par colonne (sans correspondance valide)
*/
var PAIRS_DATA = [
  { id:1, left:"3(x + 4)",    right:"3x + 12"   },
  { id:2, left:"4(x + 3)",    right:"4x + 12"   },
  { id:3, left:"5(x + 2)",    right:"5x + 10"   },
  { id:4, left:"2(x + 7)",    right:"2x + 14"   },
  { id:5, left:"6(x + 1)",    right:"6x + 6"    },
  { id:6, left:"15(5 + 3)",   right:"15×5 + 15×3" },
  { id:7, left:"5(3 + 15)",   right:"5×3 + 5×15"  }
];
/* intrus colonne gauche (sans paire dans colonne droite) */
var INTRUS_LEFT  = ["3x + 4x", "(3 + 5)×4"];
/* intrus colonne droite */
var INTRUS_RIGHT = ["3x + 3×4", "15×5 + 3×5"];

/* --- PARTIE 2 : Saisie libre développement ---
   k(x ± a) → kx ± ka   (k entier, a entier, coefficients simples)
*/
function genDevExos() {
  var pool = [
    { expr:"4(x + 5)",  ans:"4x + 20",  k:4, a:5, sign:"+" },
    { expr:"3(x + 6)",  ans:"3x + 18",  k:3, a:6, sign:"+" },
    { expr:"7(x + 2)",  ans:"7x + 14",  k:7, a:2, sign:"+" },
    { expr:"5(x − 3)",  ans:"5x − 15",  k:5, a:3, sign:"−" },
    { expr:"2(x + 9)",  ans:"2x + 18",  k:2, a:9, sign:"+" },
    { expr:"6(x − 4)",  ans:"6x − 24",  k:6, a:4, sign:"−" },
    { expr:"8(x + 1)",  ans:"8x + 8",   k:8, a:1, sign:"+" },
    { expr:"4(x − 7)",  ans:"4x − 28",  k:4, a:7, sign:"−" },
    { expr:"3(x + 8)",  ans:"3x + 24",  k:3, a:8, sign:"+" },
    { expr:"9(x + 2)",  ans:"9x + 18",  k:9, a:2, sign:"+" }
  ];
  /* sélectionner 5 aléatoirement */
  var shuffled = pool.slice().sort(function(){return Math.random()-.5;});
  return shuffled.slice(0, 5);
}

/* =========================================================
   ÉTAT GLOBAL
   ========================================================= */
var devExos = [];
var pairState = {};   /* {leftSel, rightSel, matched:[]} */
var answers   = {};   /* {id: 'ok'|'ko'} */
var TOTAL     = 8;    /* 3 paires correctes comptées + 5 dev */

/* Pour l'appariement on comptera 3 paires correctement identifiées
   (on affiche 7 paires + intrus mais seules les vraies paires comptent) */
var PAIR_COUNT = 3; /* on en expose 3 dans la grille visible pour ne pas surcharger */
var DEV_COUNT  = 5;

/* =========================================================
   CONSTRUCTION
   ========================================================= */
function buildAll() {
  devExos  = genDevExos();
  pairState = { leftSel: null, rightSel: null, matched: [], wrong: 0 };
  answers   = {};
  TOTAL     = PAIR_COUNT + DEV_COUNT;
  document.getElementById("h-rem").textContent = TOTAL;
  document.getElementById("prog").textContent = "0 / " + TOTAL;
  document.getElementById("results-screen").classList.remove("show");
  buildPart1();
  buildPart2();
  updateScore();
}

/* --- PARTIE 1 : Appariement --- */
function buildPart1() {
  var host = document.getElementById("cards-part1");
  host.innerHTML = "";

  /* sélectionner 3 vraies paires + 1 intrus gauche + 1 intrus droit */
  var truePairs = PAIRS_DATA.slice().sort(function(){return Math.random()-.5;}).slice(0,3);
  var iL = INTRUS_LEFT[Math.floor(Math.random()*INTRUS_LEFT.length)];
  var iR = INTRUS_RIGHT[Math.floor(Math.random()*INTRUS_RIGHT.length)];

  var leftItems  = truePairs.map(function(p){return {id:p.id, txt:p.left, real:true};});
  leftItems.push({id:"iL", txt:iL, real:false});
  leftItems = leftItems.sort(function(){return Math.random()-.5;});

  var rightItems = truePairs.map(function(p){return {id:p.id, txt:p.right, real:true};});
  rightItems.push({id:"iR", txt:iR, real:false});
  rightItems = rightItems.sort(function(){return Math.random()-.5;});

  pairState.leftItems  = leftItems;
  pairState.rightItems = rightItems;
  pairState.truePairs  = truePairs;

  var card = document.createElement("div");
  card.className = "card";
  card.id = "card-pair";
  card.style.animationDelay = "0s";

  var html = '<div class="card-stripe"></div><div class="card-inner">';
  html += '<div class="q-header"><div class="step-num">A</div>';
  html += '<div class="q-num">Activité A</div>';
  html += '<div class="q-cat">Appariement</div></div>';
  html += '<p class="consigne">Associez chaque expression factorisée à sa forme développée. <b>Attention aux intrus !</b></p>';
  html += '<div class="pair-match-count" id="pair-count-txt">Paires trouvées : 0 / ' + PAIR_COUNT + '</div>';
  html += '<div class="pair-grid">';
  html += '<div><div class="pair-col-title">Forme factorisée</div><div class="pair-items" id="left-col">';
  leftItems.forEach(function(it){
    html += '<div class="pair-item" id="pL-'+it.id+'" onclick="selectPair(\'left\',\''+it.id+'\')">'+it.txt+'</div>';
  });
  html += '</div></div>';
  html += '<div><div class="pair-col-title">Forme développée</div><div class="pair-items" id="right-col">';
  rightItems.forEach(function(it){
    html += '<div class="pair-item" id="pR-'+it.id+'" onclick="selectPair(\'right\',\''+it.id+'\')">'+it.txt+'</div>';
  });
  html += '</div></div>';
  html += '</div>'; /* pair-grid */
  html += '<div class="fb" id="fb-pair"><span class="fb-icon" id="fbi-pair"></span>';
  html += '<div><div id="fbm-pair"></div><div class="fb-detail" id="fbd-pair"></div></div></div>';
  html += '</div>'; /* card-inner */
  card.innerHTML = html;
  host.appendChild(card);
}

function selectPair(side, id) {
  /* Vérifier si déjà matché */
  var elId = (side === "left" ? "pL-" : "pR-") + id;
  var el = document.getElementById(elId);
  if (!el || el.classList.contains("matched-ok") || el.classList.contains("matched-ko") || el.classList.contains("intrus-revealed") || el.classList.contains("locked")) return;
  /* total paires déjà trouvées */
  if (pairState.matched.length >= PAIR_COUNT) return;

  if (side === "left") {
    /* désélectionner ancien */
    if (pairState.leftSel && pairState.leftSel !== id) {
      var old = document.getElementById("pL-" + pairState.leftSel);
      if (old) old.classList.remove("selected");
    }
    el.classList.toggle("selected");
    pairState.leftSel = el.classList.contains("selected") ? id : null;
  } else {
    if (pairState.rightSel && pairState.rightSel !== id) {
      var old2 = document.getElementById("pR-" + pairState.rightSel);
      if (old2) old2.classList.remove("selected");
    }
    el.classList.toggle("selected");
    pairState.rightSel = el.classList.contains("selected") ? id : null;
  }

  /* Si les deux côtés sélectionnés → tenter la paire */
  if (pairState.leftSel !== null && pairState.rightSel !== null) {
    tryMatch();
  }
}

function tryMatch() {
  var lId = pairState.leftSel;
  var rId = pairState.rightSel;
  var elL = document.getElementById("pL-" + lId);
  var elR = document.getElementById("pR-" + rId);

  /* Chercher si c'est une vraie paire */
  var isMatch = false;
  pairState.truePairs.forEach(function(p){
    if (String(p.id) === String(lId) && String(p.id) === String(rId)) isMatch = true;
  });

  /* Cas intrus : si l'un des deux est un intrus */
  var lItem = pairState.leftItems.find(function(x){return String(x.id)===String(lId);});
  var rItem = pairState.rightItems.find(function(x){return String(x.id)===String(rId);});

  if (isMatch) {
    elL.classList.remove("selected"); elL.classList.add("matched-ok","locked");
    elR.classList.remove("selected"); elR.classList.add("matched-ok","locked");
    pairState.matched.push(lId);
    /* marquer dans answers */
    answers["pair-" + lId] = "ok";
    var nb = pairState.matched.length;
    document.getElementById("pair-count-txt").textContent = "Paires trouvées : " + nb + " / " + PAIR_COUNT;
    showPairFb("ok", "Bonne paire ! " + elL.textContent + " s'associe bien avec " + elR.textContent + ".");
    if (nb >= PAIR_COUNT) {
      /* révéler les intrus */
      pairState.leftItems.forEach(function(it){
        if (!it.real) { var e=document.getElementById("pL-"+it.id); if(e) e.classList.add("intrus-revealed","locked"); }
      });
      pairState.rightItems.forEach(function(it){
        if (!it.real) { var e=document.getElementById("pR-"+it.id); if(e) e.classList.add("intrus-revealed","locked"); }
      });
    }
    updateScore();
  } else {
    /* mauvaise association → flash rouge, puis reset */
    elL.classList.remove("selected"); elL.classList.add("matched-ko");
    elR.classList.remove("selected"); elR.classList.add("matched-ko");
    pairState.wrong++;
    showPairFb("ko", "Ce n'est pas la bonne paire. Regarde attentivement les termes de chaque expression, puis réessaie.");
    setTimeout(function(){
      elL.classList.remove("matched-ko");
      elR.classList.remove("matched-ko");
      clearPairFb();
    }, 1400);
  }
  pairState.leftSel  = null;
  pairState.rightSel = null;
}

function showPairFb(type, msg) {
  var fb = document.getElementById("fb-pair");
  fb.className = "fb show " + (type==="ok" ? "ok" : "ko");
  document.getElementById("fbi-pair").textContent = type==="ok" ? "✅" : "❌";
  document.getElementById("fbm-pair").textContent = msg;
  document.getElementById("fbd-pair").textContent = "";
}
function clearPairFb() {
  document.getElementById("fb-pair").className = "fb";
}

/* --- PARTIE 2 : Saisie libre développement --- */
function buildPart2() {
  var host = document.getElementById("cards-part2");
  host.innerHTML = "";
  devExos.forEach(function(ex, i) {
    var delay = (0.05 + i * 0.07).toFixed(2);
    var card = document.createElement("div");
    card.className = "card";
    card.id = "card-dev-" + i;
    card.style.animationDelay = delay + "s";

    var html = '<div class="card-stripe"></div><div class="card-inner">';
    html += '<div class="q-header">';
    html += '<div class="step-num">' + (i+1) + '</div>';
    html += '<div class="q-num">Exercice 0' + (i+1) + '</div>';
    html += '<div class="q-cat">Développer</div></div>';
    html += '<p class="consigne">Développe et réduis l\'expression.</p>';
    html += '<div class="eq-box">' + ex.expr + ' =</div>';
    html += '<div class="input-row">';
    html += '<span class="input-label">Résultat :</span>';
    html += '<input type="text" class="answer-input" id="inp-dev-'+i+'" placeholder="ex : 4x + 20" autocomplete="off" autocorrect="off" spellcheck="false"/>';
    html += '</div>';
    html += '<div class="btn-row">';
    html += '<button class="btn btn-check" id="chk-dev-'+i+'" onclick="checkDev('+i+')">✓ Valider</button>';
    html += '<button class="btn btn-hint" onclick="toggleHint('+i+')">? Indice</button>';
    html += '<button class="btn btn-retry" id="retry-dev-'+i+'" onclick="retryDev('+i+')" style="display:none;">↺ Réessayer</button>';
    html += '</div>';
    html += '<div class="hint-box" id="hint-dev-'+i+'"></div>';
    html += '<div class="fb" id="fb-dev-'+i+'">';
    html += '<span class="fb-icon" id="fbi-dev-'+i+'"></span>';
    html += '<div><div id="fbm-dev-'+i+'"></div><div class="fb-detail" id="fbd-dev-'+i+'"></div></div>';
    html += '</div>';
    html += '</div>'; /* card-inner */
    card.innerHTML = html;
    host.appendChild(card);

    /* Valider sur Entrée */
    setTimeout(function(idx){
      var inp = document.getElementById("inp-dev-"+idx);
      if(inp) inp.addEventListener("keydown", function(e){ if(e.key==="Enter") checkDev(idx); });
    }, 0, i);
  });
}

/* =========================================================
   VÉRIFICATION DÉVELOPPEMENT
   ========================================================= */
function normalise(s) {
  /* normalise l'expression saisie pour comparaison souple */
  return s
    .replace(/\s+/g,"")           /* supprimer espaces */
    .replace(/[×*]/g,"")          /* ignorer signe ×/× */
    .replace(/−/g,"-")            /* tiret long → signe moins */
    .replace(/\+/g,"+")
    .toLowerCase();
}

function checkDev(i) {
  var btn = document.getElementById("chk-dev-"+i);
  if (btn.disabled) return;
  btn.disabled = true;

  var raw  = document.getElementById("inp-dev-"+i).value.trim();
  if (!raw) { btn.disabled = false; document.getElementById("inp-dev-"+i).focus(); return; }

  var ex   = devExos[i];
  var correct = (normalise(raw) === normalise(ex.ans));

  var fb  = document.getElementById("fb-dev-"+i);
  var inp = document.getElementById("inp-dev-"+i);

  if (correct) {
    answers["dev-"+i] = "ok";
    fb.className = "fb show ok";
    document.getElementById("fbi-dev-"+i).textContent = "✅";
    document.getElementById("fbm-dev-"+i).textContent = pickOk();
    document.getElementById("fbd-dev-"+i).innerHTML =
      ex.expr + " = <strong>" + ex.ans + "</strong>.";
    inp.disabled = true;
    inp.className = "answer-input correct-input";
    document.getElementById("retry-dev-"+i).style.display = "none";
    updateScore();
  } else {
    answers["dev-"+i] = "ko";
    fb.className = "fb show ko";
    document.getElementById("fbi-dev-"+i).textContent = "❌";
    document.getElementById("fbm-dev-"+i).textContent = "Pas tout à fait… réessaie !";
    document.getElementById("fbd-dev-"+i).innerHTML =
      "Clique sur <strong>? Indice</strong> pour de l'aide, puis <strong>Réessayer</strong>.";
    inp.className = "answer-input wrong-input";
    document.getElementById("retry-dev-"+i).style.display = "inline-flex";
  }
}

function retryDev(i) {
  var inp = document.getElementById("inp-dev-"+i);
  inp.value = "";
  inp.disabled = false;
  inp.className = "answer-input";
  document.getElementById("fb-dev-"+i).className = "fb";
  var btn = document.getElementById("chk-dev-"+i);
  btn.disabled = false;
  document.getElementById("retry-dev-"+i).style.display = "none";
  inp.focus();
}

function toggleHint(i) {
  var h = document.getElementById("hint-dev-"+i);
  var ex = devExos[i];
  if (h.classList.contains("show")) {
    h.classList.remove("show");
  } else {
    var sign = ex.sign === "+" ? "+" : "−";
    h.innerHTML = "💡 <strong>Indice :</strong> Multiplie le facteur " + ex.k +
      " par chaque terme entre parenthèses.<br>" +
      ex.k + " × x = " + ex.k + "x &nbsp;|&nbsp; " +
      ex.k + " × " + ex.a + " = " + (ex.k * ex.a) + ".";
    h.classList.add("show");
  }
}

/* =========================================================
   SCORE & RÉSULTATS
   ========================================================= */
function updateScore() {
  var pairOk = Object.keys(answers).filter(function(k){return k.startsWith("pair-") && answers[k]==="ok";}).length;
  var devOk  = Object.keys(answers).filter(function(k){return k.startsWith("dev-")  && answers[k]==="ok";}).length;
  var totalOk = pairOk + devOk;

  document.getElementById("h-ok").textContent  = totalOk;
  document.getElementById("h-rem").textContent = Math.max(0, TOTAL - totalOk);
  document.getElementById("bar").style.width   = Math.round(totalOk / TOTAL * 100) + "%";
  document.getElementById("prog").textContent  = totalOk + " / " + TOTAL;

  /* Compter les erreurs (dev seulement — l'appariement n'est pas "faux" définitivement) */
  var devKo = Object.keys(answers).filter(function(k){return k.startsWith("dev-") && answers[k]==="ko";}).length;
  document.getElementById("h-ko").textContent = devKo;

  if (totalOk >= TOTAL) showResults(totalOk);
  else document.getElementById("results-screen").classList.remove("show");
}

function showResults(ok) {
  var pct = ok / TOTAL;
  var stars, msg, detail;

  if (pct >= 1) {
    stars = "⭐⭐⭐⭐⭐";
    msg   = "Série terminée — résultat parfait !";
    detail = "Toutes les expressions sont correctement développées et les paires bien associées. Excellent travail !";
  } else if (pct >= .8) {
    stars = "⭐⭐⭐⭐";
    msg   = "Très bien — encore un petit effort !";
    detail = "La majorité des exercices est réussie. Relis les erreurs pour bien fixer la méthode.";
  } else if (pct >= .6) {
    stars = "⭐⭐⭐";
    msg   = "Bien — continue de t'entraîner.";
    detail = "Rappel de la méthode : k(x + a) = k × x + k × a = kx + ka. Multiplie chaque terme par le facteur extérieur.";
  } else {
    stars = "⭐⭐";
    msg   = "À retravailler — relis la leçon.";
    detail = "La distributivité simple : k(x + a) = kx + ka. Pense à multiplier le facteur par chaque terme à l'intérieur des parenthèses.";
  }

  document.getElementById("score-num").textContent = ok;
  document.getElementById("score-tot").textContent = TOTAL;
  document.getElementById("stars-row").textContent = stars;
  document.getElementById("results-msg").textContent = msg;
  document.getElementById("results-feedback").textContent = detail;
  document.getElementById("results-screen").classList.add("show");
}

function pickOk() {
  var msgs = ["Bravo !", "Parfait !", "Très bien !", "Excellent !", "C'est ça !"];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

   RECOMMENCER
   ========================================================= */
function restart() {
  buildAll();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* =========================================================
   LANCEMENT
   ========================================================= */
buildAll();
</script>
