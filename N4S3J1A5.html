<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths &ndash; Distributivit&eacute; simple (4e S3 J1)</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --day-color:  #f5a623;
      --day-dark:   #c47a10;
      --day-light:  #fff5e0;
      --day-border: #f5d080;
      --day-glow:   rgba(245,166,35,.3);
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg); color:var(--text);
      font-family:Arial,sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; padding:2rem 1rem 4rem;
      position:relative; overflow-x:hidden;
      letter-spacing:.02em; word-spacing:.06em;
    }
    body::before{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:340px; height:340px;
      background:var(--yellow); top:-80px; right:-80px;
      pointer-events:none;
    }
    body::after{
      content:''; position:fixed; border-radius:50%; z-index:0;
      opacity:.13; width:260px; height:260px;
      background:var(--day-color); bottom:-60px; left:-60px;
      pointer-events:none;
    }
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:180px;height:180px;background:var(--green);
      bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;
      width:120px;height:120px;background:var(--pink);
      top:200px;left:-30px;pointer-events:none;}

    header{text-align:center;margin-bottom:2rem;position:relative;z-index:1;}
    .logo-badge{
      display:inline-flex;align-items:center;gap:.5rem;
      background:var(--yellow);color:#000;
      font-size:.78rem;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;padding:.3rem .9rem;
      border-radius:99px;margin-bottom:.5rem;
    }
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.5rem;}
    h1{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:800;line-height:1.3;}
    h1 .hl{color:var(--day-color);}
    .subtitle{color:var(--muted);font-size:.88rem;margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

    /* Scoreboard */
    .progress-wrap{width:100%;max-width:680px;margin-bottom:1.2rem;position:relative;z-index:1;}
    .progress-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
    .progress-bar-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}
    .score-row{display:flex;gap:.6rem;margin-bottom:1.6rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
    .chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:99px;font-size:.8rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong   .dot{background:var(--pink);}
    .chip.remaining .dot{background:var(--muted);}

    /* Cards */
    .cards-wrap{width:100%;max-width:680px;position:relative;z-index:1;}
    .card{width:100%;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 2rem 1.4rem;position:relative;margin-bottom:1.2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}
    .q-num{font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);}
    .eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1.2rem,3vw,1.8rem);font-weight:700;color:var(--day-dark);text-align:center;}

    /* Input */
    .input-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.8rem;}
    .input-label{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;}
    .answer-input{background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.05rem;padding:.5rem .85rem;outline:none;transition:border-color .2s;height:2.6rem;width:180px;}
    .answer-input:focus{border-color:var(--day-color);}
    .answer-input.correct-input{border-color:var(--green);background:#f0faeb;}
    .answer-input.wrong-input  {border-color:var(--pink); background:#fff0ef;}
    .answer-input:disabled{opacity:.75;}

    /* Boutons */
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:2.6rem;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-retry{background:transparent;color:var(--day-dark);border:2px solid var(--day-border);}
    .btn-retry:hover:not(:disabled){background:var(--day-light);}

    /* Indice */
    .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:.85rem;color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;}
    .hint-box.show{display:block;}

    /* Feedback */
    .feedback{margin-top:1.2rem;padding:.8rem 1rem;border-radius:10px;font-size:.9rem;display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.3rem;line-height:1.8;}

    /* R&eacute;sultats */
    .results{width:100%;max-width:680px;text-align:center;display:none;position:relative;z-index:1;}
    .results.show{display:block;}
    .results-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .results-score{font-size:clamp(3rem,10vw,5rem);font-weight:800;line-height:1;margin:.8rem 0 .4rem;}
    .results-score .s-num{color:var(--day-color);}
    .stars{font-size:2rem;margin:.4rem 0 1rem;}
    .results-msg{color:var(--muted);font-size:.95rem;margin-bottom:2rem;}
    .recap-list{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.8rem;padding:.65rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;line-height:1.6;}
    .recap-item .eq{color:var(--day-color);flex:1;}
    .recap-item.ok-item{border-color:#b5e08a;}
    .recap-item.ko-item{border-color:#f9c0bb;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .card{animation:fadeUp .4s ease both;}

    @media(max-width:480px){
      .card{padding:1.4rem;}
      .btn{font-size:.85rem;padding:.55rem 1rem;}
      .answer-input{width:140px;}
      .btn-row{flex-direction:column;}
      .btn-row .btn{width:100%;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f28b82"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 4e
    </div>
    <div class="week-label">Semaine 3 &ndash; Jour 1</div>
    <h1>&#9999;&#65039; <span class="hl">S&eacute;rie d&rsquo;exercices</span></h1>
    <p class="subtitle">Distributivit&eacute; simple &middot; D&eacute;velopper et r&eacute;duire</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">0 / 6 r&eacute;ussies</span>
      <span id="prog-pct">0&nbsp;%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div class="score-row">
    <div class="chip correct"><div class="dot"></div><span id="count-ok">0</span>&nbsp;correctes</div>
    <div class="chip wrong"  ><div class="dot"></div><span id="count-ko">0</span>&nbsp;erreurs</div>
    <div class="chip remaining"><div class="dot"></div><span id="count-rem">6</span>&nbsp;restantes</div>
  </div>

  <div class="cards-wrap" id="cards-wrap"></div>

  <div class="results" id="results-screen">
    <div class="results-card">
      <div class="logo-badge" style="margin-bottom:.5rem">
        <span class="logo-dot" style="background:#f28b82"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#3ab5d8"></span>
        R&eacute;sultats
      </div>
      <div class="results-score"><span class="s-num" id="score-num">0</span>/6</div>
      <div class="stars" id="stars-row"></div>
      <div class="results-msg" id="results-msg"></div>
      <div class="recap-list" id="recap-list"></div>
      <button class="btn btn-primary" onclick="restart()" style="margin:0 auto;display:flex;">
        &#128260; Recommencer
      </button>
    </div>
  </div>

<script>
var POOL = [
  {
    eq: "4(x + 5) =", ans: "4x+20", display: "4x + 20",
    hint: "Multiplie 4 par chaque terme s\u00e9par\u00e9ment\u00a0: 4 \u00d7 x d\u2019un c\u00f4t\u00e9, 4 \u00d7 5 de l\u2019autre.",
    method: "k(x + a) = k\u00d7x + k\u00d7a<br>Ici\u00a0: 4\u00d7x + 4\u00d75."
  },
  {
    eq: "3(x + 6) =", ans: "3x+18", display: "3x + 18",
    hint: "Distribue 3 sur chaque terme\u00a0: 3 \u00d7 x et 3 \u00d7 6.",
    method: "k(x + a) = k\u00d7x + k\u00d7a<br>Ici\u00a0: 3\u00d7x + 3\u00d76."
  },
  {
    eq: "7(x + 2) =", ans: "7x+14", display: "7x + 14",
    hint: "Quel est le r\u00f4le du facteur 7 vis-\u00e0-vis de chaque terme entre parenth\u00e8ses\u00a0?",
    method: "k(x + a) = k\u00d7x + k\u00d7a<br>Ici\u00a0: 7\u00d7x + 7\u00d72."
  },
  {
    eq: "5(x \u2212 3) =", ans: "5x-15", display: "5x \u2212 15",
    hint: "Attention au signe\u00a0: quand tu distribues sur \u22123, le signe du deuxi\u00e8me terme change-t-il\u00a0?",
    method: "k(x \u2212 a) = k\u00d7x \u2212 k\u00d7a<br>Ici\u00a0: 5\u00d7x \u2212 5\u00d73."
  },
  {
    eq: "2(x + 9) =", ans: "2x+18", display: "2x + 18",
    hint: "Distribue 2 sur x, puis 2 sur 9.",
    method: "k(x + a) = k\u00d7x + k\u00d7a<br>Ici\u00a0: 2\u00d7x + 2\u00d79."
  },
  {
    eq: "6(x \u2212 4) =", ans: "6x-24", display: "6x \u2212 24",
    hint: "Le facteur 6 se distribue sur les deux termes. Quel signe pour le deuxi\u00e8me\u00a0?",
    method: "k(x \u2212 a) = k\u00d7x \u2212 k\u00d7a<br>Ici\u00a0: 6\u00d7x \u2212 6\u00d74."
  },
  {
    eq: "8(x + 1) =", ans: "8x+8", display: "8x + 8",
    hint: "8 fois 1, c\u2019est simple\u00a0! Et 8 fois x\u00a0?",
    method: "k(x + a) = k\u00d7x + k\u00d7a<br>Ici\u00a0: 8\u00d7x + 8\u00d71."
  },
  {
    eq: "4(x \u2212 7) =", ans: "4x-28", display: "4x \u2212 28",
    hint: "Le deuxi\u00e8me terme entre parenth\u00e8ses est n\u00e9gatif\u00a0: quel signe aura le r\u00e9sultat\u00a0?",
    method: "k(x \u2212 a) = k\u00d7x \u2212 k\u00d7a<br>Ici\u00a0: 4\u00d7x \u2212 4\u00d77."
  },
  {
    eq: "9(x + 2) =", ans: "9x+18", display: "9x + 18",
    hint: "Multiplie 9 par chacun des deux termes.",
    method: "k(x + a) = k\u00d7x + k\u00d7a<br>Ici\u00a0: 9\u00d7x + 9\u00d72."
  },
  {
    eq: "3(x \u2212 5) =", ans: "3x-15", display: "3x \u2212 15",
    hint: "3 \u00d7 x donne le premier terme. Que donne 3 \u00d7 (\u22125)\u00a0?",
    method: "k(x \u2212 a) = k\u00d7x \u2212 k\u00d7a<br>Ici\u00a0: 3\u00d7x \u2212 3\u00d75."
  }
];

var EXERCISES, TOTAL, state;

function pickExercises() {
  return POOL.slice().sort(function(){ return Math.random() - .5; }).slice(0, 6);
}

function normalise(s) {
  return s.replace(/\s+/g,"").replace(/\u00d7|\*/g,"")
          .replace(/\u2212/g,"-").replace(/\u2013/g,"-").replace(/\u2014/g,"-")
          .toLowerCase();
}

function $(id){ return document.getElementById(id); }

function buildCards() {
  var wrap = $("cards-wrap");
  wrap.innerHTML = "";
  EXERCISES.forEach(function(ex, i) {
    var delay = (i * 0.06).toFixed(2);
    var div = document.createElement("div");
    div.className = "card";
    div.style.animationDelay = delay + "s";
    div.id = "card-" + i;
    div.innerHTML =
      '<div class="card-stripe"></div>'
      + '<div class="q-num">Exercice ' + (i+1) + '</div>'
      + '<div class="theme-badge">D\u00e9velopper</div>'
      + '<div class="eq-box">' + ex.eq + '</div>'
      + '<div class="input-row">'
      +   '<span class="input-label">R\u00e9sultat\u00a0:</span>'
      +   '<input type="text" class="answer-input" id="inp-'+i+'"'
      +     ' placeholder="ex\u00a0: 4x + 20" autocomplete="off" autocorrect="off" spellcheck="false"/>'
      + '</div>'
      + '<div class="btn-row">'
      +   '<button class="btn btn-primary" id="chk-'+i+'" onclick="checkAnswer('+i+')">&#10003; Valider</button>'
      +   '<button class="btn btn-hint" onclick="toggleHint('+i+')">? Indice</button>'
      +   '<button class="btn btn-retry" id="retry-'+i+'" style="display:none;" onclick="retryAnswer('+i+')">&#8635; R\u00e9essayer</button>'
      + '</div>'
      + '<div class="hint-box" id="hint-'+i+'"></div>'
      + '<div class="feedback" id="fb-'+i+'">'
      +   '<span class="feedback-icon" id="fbi-'+i+'"></span>'
      +   '<div><div id="fbm-'+i+'"></div>'
      +   '<div class="feedback-detail" id="fbd-'+i+'"></div></div>'
      + '</div>';
    wrap.appendChild(div);

    /* Valider sur Entr\u00e9e */
    (function(idx){
      setTimeout(function(){
        var inp = document.getElementById("inp-"+idx);
        if (inp) inp.addEventListener("keydown", function(e){
          if (e.key === "Enter" && !document.getElementById("chk-"+idx).disabled) checkAnswer(idx);
        });
      }, 0);
    })(i);
  });
}

function checkAnswer(i) {
  var chk = $("chk-"+i);
  if (chk.disabled) return;
  chk.disabled = true;

  var raw = $("inp-"+i).value.trim();
  if (!raw) { chk.disabled = false; $("inp-"+i).focus(); return; }

  var ex = EXERCISES[i];
  var correct = normalise(raw) === normalise(ex.ans);

  if (correct) {
    state[i] = "ok";
    $("inp-"+i).disabled = true;
    $("inp-"+i).className = "answer-input correct-input";
    $("retry-"+i).style.display = "none";
    showFeedback(i, true);
  } else {
    state[i] = "ko";
    $("inp-"+i).className = "answer-input wrong-input";
    $("retry-"+i).style.display = "inline-flex";
    showFeedback(i, false);
  }
  updateScore();
}

function retryAnswer(i) {
  state[i] = null;
  $("inp-"+i).value = "";
  $("inp-"+i).disabled = false;
  $("inp-"+i).className = "answer-input";
  $("chk-"+i).disabled = false;
  $("retry-"+i).style.display = "none";
  $("fb-"+i).className = "feedback";
  updateScore();
  $("inp-"+i).focus();
}

function toggleHint(i) {
  var h = $("hint-"+i);
  if (h.classList.contains("show")) {
    h.classList.remove("show");
  } else {
    h.innerHTML = "<strong>&#128161; Indice\u00a0:</strong> " + EXERCISES[i].hint;
    h.classList.add("show");
  }
}

function showFeedback(i, correct) {
  var fb = $("fb-"+i);
  fb.className = "feedback show " + (correct ? "ok" : "ko");
  $("fbi-"+i).textContent = correct ? "\u2705" : "\u274C";
  if (correct) {
    $("fbm-"+i).textContent = pickOk();
    $("fbd-"+i).innerHTML = EXERCISES[i].method;
  } else {
    $("fbm-"+i).textContent = "Pas tout \u00e0 fait\u2026 r\u00e9essaie\u00a0!";
    $("fbd-"+i).innerHTML = "Clique sur <strong>? Indice</strong> pour de l\u2019aide, puis <strong>R\u00e9essayer</strong>.";
  }
}

function updateScore() {
  var ok  = state.filter(function(s){ return s === "ok"; }).length;
  var ko  = state.filter(function(s){ return s === "ko"; }).length;
  var rem = state.filter(function(s){ return s === null; }).length;
  var pct = Math.round(ok / TOTAL * 100);
  $("progress-bar").style.width = pct + "%";
  $("prog-label").textContent = ok + " / " + TOTAL + " r\u00e9ussies";
  $("prog-pct").textContent = pct + "\u00a0%";
  $("count-ok").textContent = ok;
  $("count-ko").textContent = ko;
  $("count-rem").textContent = rem;
  if (ok >= TOTAL) showResults();
}

function showResults() {
  $("results-screen").classList.add("show");
  var ok = state.filter(function(s){ return s === "ok"; }).length;
  $("score-num").textContent = ok;
  var stars = ok >= TOTAL ? 5 : ok >= Math.ceil(TOTAL*.8) ? 4 : ok >= Math.ceil(TOTAL*.6) ? 3 : ok >= Math.ceil(TOTAL*.4) ? 2 : 1;
  $("stars-row").textContent = "\u2B50".repeat(stars) + "\u2606".repeat(5-stars);
  var msgs = ["Continue \u00e0 t\u2019entra\u00eener\u00a0!", "Bon d\u00e9but\u00a0!", "Pas mal\u00a0!", "Bien jou\u00e9\u00a0!", "Tr\u00e8s bien\u00a0!", "Parfait \u2014 bravo\u00a0!"];
  $("results-msg").textContent = msgs[Math.min(ok, msgs.length-1)];
  var list = $("recap-list"); list.innerHTML = "";
  EXERCISES.forEach(function(ex, i) {
    var isOk = state[i] === "ok";
    var div = document.createElement("div");
    div.className = "recap-item " + (isOk ? "ok-item" : "ko-item");
    div.innerHTML = "<span>" + (isOk ? "\u2705" : "\u274C") + "</span>"
      + "<span class='eq'>" + ex.eq + "</span>"
      + "<span>" + (isOk ? ex.display : "R\u00e9ponse\u00a0: " + ex.display) + "</span>";
    list.appendChild(div);
  });
  $("results-screen").scrollIntoView({ behavior: "smooth", block: "start" });
}

function pickOk() {
  var msgs = ["Bravo\u00a0!", "Parfait\u00a0!", "Tr\u00e8s bien\u00a0!", "Excellent\u00a0!", "C\u2019est juste\u00a0!"];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

function restart() {
  EXERCISES = pickExercises();
  state = new Array(TOTAL).fill(null);
  $("results-screen").classList.remove("show");
  buildCards();
  updateScore();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* Init */
EXERCISES = pickExercises();
TOTAL = EXERCISES.length;
state = new Array(TOTAL).fill(null);
buildCards();
updateScore();
