<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths — Semaine 1 Jour 3 — Comparer et ranger les nombres relatifs</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ═══ COULEUR DU JOUR — Mercredi (Jour 3) → Vert ═══ */
    :root{
      --day-color:#8dc63f; --day-dark:#3d7a10; --day-light:#f0faeb;
      --day-border:#b5e08a; --day-glow:rgba(141,198,63,.3);
    }
    :root{
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --blue:#3ab5d8;
      --pink:#f28b82; --orange:#f5a623;
      --text:#1a1d23; --muted:#8a8f9a; --radius:16px;
      --err-bg:#fff0ef; --err-border:#c0392b; --err-text:#c0392b;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:1.6rem 1rem 3.5rem;
      position:relative;overflow-x:hidden;letter-spacing:.02em;word-spacing:.06em;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--blue);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--orange);top:200px;left:-30px;pointer-events:none;}

    header{text-align:center;margin-bottom:1.4rem;position:relative;z-index:1;max-width:100%;}
    .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;white-space:nowrap;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:.5rem;}
    h1{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:800;line-height:1.3;word-break:break-word;}
    h1 .hl{color:var(--day-dark);}
    .subtitle{color:var(--muted);font-size:clamp(.8rem,2.5vw,.88rem);margin-top:.4rem;font-family:'JetBrains Mono',monospace;word-break:break-word;}

    .progress-wrap{position:sticky;top:0;z-index:5;width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:99px;padding:.5rem .9rem;margin-bottom:1.4rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 12px rgba(0,0,0,.06);}
    .progress-wrap .pw-label{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;color:var(--day-dark);white-space:nowrap;}
    .pw-track{flex:1;min-width:90px;height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
    .pw-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}
    .pw-step{font-family:'JetBrains Mono',monospace;font-size:.74rem;font-weight:700;color:var(--muted);white-space:nowrap;}

    .card{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.6rem 1.5rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--blue));}

    .niveau-badge{display:inline-flex;align-items:center;gap:.45rem;font-size:.7rem;font-weight:700;padding:.25rem .7rem;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.7rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);}
    .niveau-badge .nb-dot{width:14px;height:14px;border-radius:50%;background:var(--day-color);}
    .ex-title{font-size:clamp(1.05rem,3vw,1.25rem);font-weight:800;color:var(--day-dark);margin-bottom:.3rem;}
    .consigne{font-size:clamp(.85rem,2.5vw,.95rem);color:var(--text);margin-bottom:1.1rem;line-height:1.9;}

    .enonce{background:var(--day-light);border:2px solid var(--day-border);border-left:5px solid var(--day-color);border-radius:12px;padding:1rem 1.1rem;margin-bottom:1.1rem;}
    .enonce .phrase{font-size:clamp(1rem,2.8vw,1.15rem);line-height:2.1;color:var(--text);}
    .gap{display:inline-block;min-width:60px;border-bottom:3px solid var(--day-color);text-align:center;font-weight:800;color:var(--day-dark);padding:0 .3rem;}
    .pair-eq{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:clamp(1.1rem,3.4vw,1.5rem);text-align:center;color:var(--text);}

    .options{display:flex;flex-direction:column;gap:.7rem;margin-bottom:.4rem;}
    .opt{display:flex;align-items:center;gap:.7rem;padding:.85rem 1rem;border-radius:12px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:clamp(.92rem,2.6vw,1rem);font-weight:600;transition:border-color .15s,background .15s,transform .08s;min-height:44px;}
    .opt:hover:not(.locked){border-color:var(--day-color);transform:translateY(-1px);}
    .opt .opt-key{width:26px;height:26px;border-radius:7px;background:var(--day-light);color:var(--day-dark);font-family:'JetBrains Mono',monospace;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .opt.reveal-correct{border-color:var(--green);background:#f0faeb;}
    .opt.chosen-correct{border-color:var(--green);background:#f0faeb;}
    .opt.chosen-wrong{border-color:var(--err-border);background:var(--err-bg);}
    .opt.locked{cursor:default;}

    /* symboles < = > */
    .sym-row{display:flex;gap:.7rem;justify-content:center;margin-bottom:.4rem;}
    .sym{width:72px;height:60px;border-radius:12px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.6rem;color:var(--day-dark);display:flex;align-items:center;justify-content:center;transition:border-color .15s,transform .08s;}
    .sym:hover:not(.locked){border-color:var(--day-color);transform:translateY(-1px);}
    .sym.reveal-correct{border-color:var(--green);background:#f0faeb;}
    .sym.chosen-correct{border-color:var(--green);background:#f0faeb;}
    .sym.chosen-wrong{border-color:var(--err-border);background:var(--err-bg);}
    .sym.locked{cursor:default;}

    /* rangement par clic */
    .rank-pool{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-bottom:1rem;}
    .rank-num{min-width:74px;min-height:50px;padding:.5rem .9rem;border-radius:12px;border:2px solid var(--day-border);background:var(--surface);
      font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(1rem,3vw,1.2rem);color:var(--day-dark);cursor:pointer;
      display:flex;align-items:center;justify-content:center;transition:transform .08s,border-color .15s,opacity .15s;}
    .rank-num:hover:not(.used){border-color:var(--day-color);transform:translateY(-1px);}
    .rank-num.used{opacity:.32;cursor:default;}
    .rank-slots{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin-bottom:.5rem;min-height:54px;}
    .rank-slot{min-width:74px;min-height:50px;border-radius:12px;border:2px dashed var(--day-border);background:var(--day-light);
      display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(1rem,3vw,1.2rem);color:var(--day-dark);cursor:pointer;}
    .rank-slot.empty{color:var(--muted);}
    .rank-slot.correct-slot{border-style:solid;border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .rank-slot.wrong-slot{border-style:solid;border-color:var(--err-border);background:var(--err-bg);color:var(--err-text);}
    .rank-lt{font-family:'JetBrains Mono',monospace;font-weight:800;color:var(--muted);font-size:1.2rem;}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1.2rem;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.5rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(.85rem,2.5vw,.95rem);font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:44px;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.4;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
    .btn-ghost{background:transparent;color:var(--day-dark);border:2px solid var(--day-border);}
    .btn-ghost:hover:not(:disabled){background:var(--day-light);}

    .feedback{margin-top:1.1rem;padding:.85rem 1rem;border-radius:10px;font-size:clamp(.86rem,2.5vw,.95rem);display:none;align-items:flex-start;gap:.7rem;line-height:1.9;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:var(--err-bg);border:1.5px solid var(--err-border);color:var(--err-text);}
    .feedback .fb-ic{font-size:1.3rem;flex-shrink:0;}
    .feedback .fb-sol{display:block;margin-top:.25rem;color:var(--text);font-weight:400;}

    /* écran départ + transition */
    .screen{width:100%;max-width:680px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2.2rem 1.6rem;text-align:center;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;}
    .screen .big-ic{font-size:3rem;margin-bottom:.6rem;}
    .screen h2{font-size:clamp(1.15rem,3.4vw,1.5rem);color:var(--day-dark);margin-bottom:.6rem;}
    .screen p{color:var(--text);font-size:clamp(.88rem,2.6vw,.98rem);line-height:1.9;margin-bottom:1.3rem;}

    /* bilan */
    .trophee{font-size:3rem;line-height:1;margin-bottom:.3rem;}
    .global-score{font-size:clamp(2.4rem,10vw,4rem);font-weight:800;line-height:1;margin:.2rem 0;color:var(--day-dark);}
    .stars{font-size:1.9rem;margin:.2rem 0 .8rem;}
    .global-msg{color:var(--text);font-size:clamp(.9rem,2.6vw,1rem);margin-bottom:1.3rem;font-weight:600;line-height:1.7;}
    .recap{text-align:left;display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.3rem;}
    .recap-item{display:flex;align-items:flex-start;gap:.6rem;padding:.7rem .9rem;border-radius:10px;font-size:clamp(.82rem,2.4vw,.9rem);line-height:1.7;}
    .recap-item.ok{background:#f0faeb;border:1.5px solid var(--day-color);color:#3d7a10;}
    .recap-item.ko{background:#fce4e4;border:1.5px solid #8e1b13;color:#8e1b13;}
    .recap-item .ri-ic{flex-shrink:0;font-weight:700;}
    .comp-box{text-align:left;background:var(--day-light);border:1.5px solid var(--day-border);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.3rem;}
    .comp-box h3{color:var(--day-dark);font-size:.95rem;margin-bottom:.5rem;}
    .comp-box .comp-line{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.4rem;font-size:clamp(.84rem,2.4vw,.92rem);line-height:1.8;color:var(--text);}
    .comp-box .comp-line .arr{color:var(--day-dark);font-weight:800;flex-shrink:0;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    @media(max-width:480px){
      body{padding:1.2rem .75rem 3rem;}
      .card,.screen{padding:1.4rem 1.1rem;}
      .btn-row .btn{flex:1 1 100%;width:100%;}
      .sym{width:60px;height:54px;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 5ème
    </div>
    <div class="week-label">Semaine 1 &ndash; Jour 3</div>
    <h1>Comparer et ranger les <span class="hl">nombres relatifs</span></h1>
    <p class="subtitle">Les règles, puis le grand rangement</p>
  </header>

  <div class="progress-wrap" id="progress-wrap" style="display:none;">
    <span class="pw-label" id="pw-label">Score : 0</span>
    <div class="pw-track"><div class="pw-fill" id="pw-fill"></div></div>
    <span class="pw-step" id="pw-step">Étape 1 / 2</span>
  </div>

  <div id="app"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
function shuffleArr(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ════ ÉTAPE 1 — Les règles (vocabulaire + comparaisons) ════ */
var ENQUETES = [
  { phrase:"Un nombre négatif est plus <span class='gap'>?</span> qu\u2019un nombre positif.",
    opts:["petit","grand"], ans:0,
    sol:"Un nombre négatif est toujours plus petit qu\u2019un nombre positif." },
  { phrase:"Si deux nombres sont positifs, le plus grand est celui qui a la plus <span class='gap'>?</span> partie numérique.",
    opts:["petite","grande"], ans:1,
    sol:"Chez deux positifs, le plus grand a la plus grande partie numérique (ex. 5,7 > 3,5)." },
  { phrase:"Si deux nombres sont négatifs, le plus grand est celui qui a la plus <span class='gap'>?</span> partie numérique.",
    opts:["petite","grande"], ans:0,
    sol:"Chez deux négatifs, c\u2019est l\u2019inverse : le plus grand a la plus petite partie numérique (ex. \u22122 > \u22125,2)." },
  { phrase:"Le symbole &lt; signifie : « est <span class='gap'>?</span> à ».",
    opts:["supérieur","inférieur"], ans:1,
    sol:"&lt; se lit « est inférieur à »." },
  { phrase:"Le symbole &gt; signifie : « est <span class='gap'>?</span> à ».",
    opts:["supérieur","inférieur"], ans:0,
    sol:"&gt; se lit « est supérieur à »." },
  { phrase:"Pour comparer des nombres décimaux, il faut le même nombre de <span class='gap'>?</span>.",
    opts:["chiffres","décimales","unités"], ans:1,
    sol:"On complète avec des zéros pour avoir le même nombre de décimales." }
];

var PAIRS = [
  { a:"3,5",  b:"5,7",   av:3.5,  bv:5.7,  sol:"3,5 &lt; 5,7 : deux positifs, 5,7 a la plus grande partie numérique." },
  { a:"2,7",  b:"-3,6",  av:2.7,  bv:-3.6, sol:"2,7 &gt; \u22123,6 : un positif est toujours plus grand qu\u2019un négatif." },
  { a:"-2",   b:"-5,2",  av:-2,   bv:-5.2, sol:"\u22122 &gt; \u22125,2 : chez les négatifs, \u22122 est plus proche de zéro, donc plus grand." },
  { a:"-7,6", b:"-7,44", av:-7.6, bv:-7.44, sol:"\u22127,6 &lt; \u22127,44 : \u22127,6 est plus loin de zéro, donc plus petit." }
];

/* ════ ÉTAPE 2 — Le grand rangement (clic croissant) ════ */
var RANK_NUMS   = [-5.04, 3.9, -5.4, -4.5, 2.6];
var RANK_LABELS = ["-5,04","3,9","-5,4","-4,5","2,6"];

/* ── état global ── */
var STEP = 0;          // 0 départ, 1 règles, 2 rangement, 3 bilan
var qIndex = 0;        // index dans la séquence étape 1
var SEQ = [];          // séquence étape 1 : {type:'enq'|'pair', data, ok}
var resSeq = [];       // résultats étape 1 (true/false)
var optOrder = [];     // ordre mélangé options de la question courante
var chosenCur = null;  // choix courant (index réel)
var rankSeq = [];      // indices cliqués étape 2
var rankDone = false;
var resRank = [];      // résultats par position étape 2

var TOTAL = ENQUETES.length + PAIRS.length + RANK_NUMS.length; // 6 + 4 + 5 = 15

function buildSeq(){
  SEQ = [];
  ENQUETES.forEach(function(e){ SEQ.push({type:"enq", data:e}); });
  PAIRS.forEach(function(p){ SEQ.push({type:"pair", data:p}); });
  resSeq = new Array(SEQ.length).fill(false);
}

function start(){
  STEP = 0; qIndex = 0; chosenCur = null; rankSeq = []; rankDone = false;
  buildSeq();
  $("progress-wrap").style.display = "none";
  renderStart();
}

function renderStart(){
  $("app").innerHTML =
    '<div class="screen">'
    + '<div class="big-ic">🟢</div>'
    + '<h2>C\u2019est parti, on s\u2019entraîne&nbsp;!</h2>'
    + '<p>D\u2019abord les <strong>règles</strong> pour comparer (vocabulaire et symboles), puis le <strong>grand rangement</strong> d\u2019une série de nombres. Deux étapes, un seul bilan.</p>'
    + '<div class="btn-row"><button class="btn btn-primary" onclick="beginStep1()">Commencer</button></div>'
    + '</div>';
}

/* ════ ÉTAPE 1 ════ */
function beginStep1(){
  STEP = 1; qIndex = 0; chosenCur = null;
  $("progress-wrap").style.display = "flex";
  renderQ();
}

function buildOptOrder(n){
  optOrder = [];
  for(var i=0;i<n;i++) optOrder.push(i);
  shuffleArr(optOrder);
}

function renderQ(){
  var item = SEQ[qIndex];
  chosenCur = null;
  var inner = '<div class="card"><div class="card-stripe"></div>'
    + '<div class="niveau-badge"><span class="nb-dot"></span>Niveau 1 · Les règles</div>'
    + '<div class="ex-title">Comparer les nombres relatifs</div>';

  if(item.type === "enq"){
    buildOptOrder(item.data.opts.length);
    inner += '<div class="consigne">Complète la phrase avec le bon mot.</div>'
      + '<div class="enonce"><div class="phrase">'+item.data.phrase+'</div></div>'
      + '<div class="options" id="options"></div>';
  } else {
    buildOptOrder(3); // < = >  (toujours 3 symboles)
    inner += '<div class="consigne">Choisis le bon signe entre les deux nombres.</div>'
      + '<div class="enonce"><div class="pair-eq">'+item.data.a+'  <span style="color:var(--day-dark)">?</span>  '+item.data.b+'</div></div>'
      + '<div class="sym-row" id="sym-row"></div>';
  }
  inner += '<div class="feedback" id="feedback"><span class="fb-ic" id="fb-ic"></span><div id="fb-msg"></div></div>'
    + '<div class="btn-row"><button class="btn btn-primary" id="btn-next" disabled onclick="nextQ()">Valider</button></div>'
    + '</div>';
  $("app").innerHTML = inner;

  if(item.type === "enq") buildOptions(item); else buildSymbols(item);
  updateProgress();
}

function buildOptions(item){
  var box = $("options"); box.innerHTML = "";
  optOrder.forEach(function(realIdx){
    var div = document.createElement("div");
    div.className = "opt"; div.setAttribute("data-i", realIdx);
    div.innerHTML = '<span class="opt-key">'+String.fromCharCode(65+box.children.length)+'</span><span>'+item.data.opts[realIdx]+'</span>';
    div.onclick = function(){ choose(realIdx, div); };
    box.appendChild(div);
  });
}

function buildSymbols(item){
  var box = $("sym-row"); box.innerHTML = "";
  var syms = ["&lt;","=","&gt;"];
  var vals = ["<","=",">"];
  optOrder.forEach(function(k){
    var div = document.createElement("div");
    div.className = "sym"; div.setAttribute("data-v", vals[k]);
    div.innerHTML = syms[k];
    div.onclick = function(){ chooseSym(vals[k], div); };
    box.appendChild(div);
  });
}

function correctSymFor(p){ return p.av < p.bv ? "<" : (p.av > p.bv ? ">" : "="); }

function choose(realIdx, div){
  if(chosenCur !== null) return;
  chosenCur = realIdx;
  var item = SEQ[qIndex];
  var correct = (realIdx === item.data.ans);
  resSeq[qIndex] = correct;
  document.querySelectorAll(".opt").forEach(function(o){
    o.classList.add("locked");
    var i = parseInt(o.getAttribute("data-i"),10);
    if(i === item.data.ans) o.classList.add(correct && i===realIdx ? "chosen-correct" : "reveal-correct");
    else if(i === realIdx) o.classList.add("chosen-wrong");
  });
  showFb(correct, item.data.sol);
}

function chooseSym(v, div){
  if(chosenCur !== null) return;
  chosenCur = v;
  var item = SEQ[qIndex];
  var good = correctSymFor(item.data);
  var correct = (v === good);
  resSeq[qIndex] = correct;
  document.querySelectorAll(".sym").forEach(function(o){
    o.classList.add("locked");
    var ov = o.getAttribute("data-v");
    if(ov === good) o.classList.add(correct && ov===v ? "chosen-correct" : "reveal-correct");
    else if(ov === v) o.classList.add("chosen-wrong");
  });
  showFb(correct, item.data.sol);
}

function showFb(correct, sol){
  var fb = $("feedback");
  fb.className = "feedback show " + (correct ? "ok" : "ko");
  $("fb-ic").textContent = correct ? "\u2705" : "\u274C";
  $("fb-msg").innerHTML = (correct ? "<strong>Bonne réponse\u00a0!</strong>" : "<strong>Pas tout à fait.</strong>")
    + "<span class='fb-sol'>"+sol+"</span>";
  $("btn-next").disabled = false;
  updateProgress();
}

function nextQ(){
  qIndex++;
  if(qIndex < SEQ.length){ renderQ(); }
  else { renderTransition(); }
}

function renderTransition(){
  STEP = 1.5;
  $("app").innerHTML =
    '<div class="screen">'
    + '<div class="big-ic">🟢</div>'
    + '<h2>Étape&nbsp;2 · Le grand rangement</h2>'
    + '<p>Tu connais les règles. Place maintenant cinq nombres dans l\u2019ordre <strong>croissant</strong>, du plus petit au plus grand. Attention aux négatifs&nbsp;!</p>'
    + '<div class="btn-row"><button class="btn btn-primary" onclick="beginStep2()">Continuer</button></div>'
    + '</div>';
  updateProgress();
}

/* ════ ÉTAPE 2 — rangement ════ */
function beginStep2(){
  STEP = 2; rankSeq = []; rankDone = false;
  renderRank();
}

function renderRank(){
  var inner = '<div class="card"><div class="card-stripe"></div>'
    + '<div class="niveau-badge"><span class="nb-dot"></span>Niveau 2 · Le grand rangement</div>'
    + '<div class="ex-title">Range dans l\u2019ordre croissant</div>'
    + '<div class="consigne">Clique sur les nombres du plus petit au plus grand. Clique sur une case déjà placée pour la retirer.</div>'
    + '<div class="rank-slots" id="rank-slots"></div>'
    + '<div class="rank-pool" id="rank-pool"></div>'
    + '<div class="feedback" id="feedback"><span class="fb-ic" id="fb-ic"></span><div id="fb-msg"></div></div>'
    + '<div class="btn-row"><button class="btn btn-primary" id="btn-check" disabled onclick="checkRank()">Vérifier le rangement</button></div>'
    + '</div>';
  $("app").innerHTML = inner;
  renderSlots(); renderPool();
  updateProgress();
}

function renderSlots(){
  var box = $("rank-slots"); box.innerHTML = "";
  for(var k=0;k<RANK_NUMS.length;k++){
    if(k>0){ var lt = document.createElement("span"); lt.className="rank-lt"; lt.innerHTML="&lt;"; box.appendChild(lt); }
    var slot = document.createElement("div");
    var idx = rankSeq[k];
    if(idx===undefined){ slot.className="rank-slot empty"; slot.textContent="?"; }
    else {
      slot.className="rank-slot";
      slot.textContent = RANK_LABELS[idx];
      if(rankDone) slot.className += (resRank[k] ? " correct-slot" : " wrong-slot");
    }
    (function(pos){ slot.onclick=function(){ if(!rankDone) removeAt(pos); }; })(k);
    box.appendChild(slot);
  }
}

function renderPool(){
  var box = $("rank-pool"); box.innerHTML = "";
  RANK_NUMS.forEach(function(n, i){
    var used = rankSeq.indexOf(i) !== -1;
    var d = document.createElement("div");
    d.className = "rank-num" + (used ? " used" : "");
    d.textContent = RANK_LABELS[i];
    if(!used && !rankDone){ d.onclick = function(){ placeNum(i); }; }
    box.appendChild(d);
  });
}

function placeNum(i){
  if(rankDone) return;
  if(rankSeq.indexOf(i) !== -1) return;
  if(rankSeq.length >= RANK_NUMS.length) return;
  rankSeq.push(i);
  renderSlots(); renderPool();
  $("btn-check").disabled = (rankSeq.length < RANK_NUMS.length);
  updateProgress();
}

function removeAt(pos){
  if(rankDone) return;
  if(rankSeq[pos]===undefined) return;
  rankSeq.splice(pos,1);
  renderSlots(); renderPool();
  $("btn-check").disabled = (rankSeq.length < RANK_NUMS.length);
  updateProgress();
}

function checkRank(){
  if(rankDone) return;
  if(rankSeq.length < RANK_NUMS.length) return;
  rankDone = true;
  // ordre croissant attendu (indices triés par valeur)
  var sortedIdx = RANK_NUMS.map(function(v,i){ return i; }).sort(function(a,b){ return RANK_NUMS[a]-RANK_NUMS[b]; });
  resRank = [];
  for(var k=0;k<RANK_NUMS.length;k++){ resRank[k] = (rankSeq[k] === sortedIdx[k]); }
  renderSlots(); renderPool();
  var allGood = resRank.every(Boolean);
  var fb = $("feedback");
  fb.className = "feedback show " + (allGood ? "ok" : "ko");
  $("fb-ic").textContent = allGood ? "\u2705" : "\u274C";
  var bonOrdre = sortedIdx.map(function(i){ return RANK_LABELS[i]; }).join(" &lt; ");
  $("fb-msg").innerHTML = (allGood ? "<strong>Parfait\u00a0!</strong>" : "<strong>Ce n\u2019est pas le bon ordre.</strong>")
    + "<span class='fb-sol'>Ordre croissant : "+bonOrdre+". Astuce : \u22125,4 est plus loin de zéro que \u22125,04, donc plus petit.</span>";
  $("btn-check").disabled = true; $("btn-check").style.display="none";
  var br = $("feedback").parentNode.querySelector(".btn-row");
  var b = document.createElement("button"); b.className="btn btn-primary"; b.textContent="Voir mon bilan"; b.onclick=showFinal;
  br.appendChild(b);
  updateProgress();
}

/* ════ progression ════ */
function curScore(){
  var s = resSeq.filter(Boolean).length;
  if(rankDone) s += resRank.filter(Boolean).length;
  return s;
}
function answeredCount(){
  var a = 0;
  for(var i=0;i<=qIndex && i<SEQ.length;i++){ if(STEP>=1 && (i<qIndex || chosenCur!==null)) a++; }
  if(STEP>=2) a = SEQ.length + (rankDone ? RANK_NUMS.length : rankSeq.length);
  if(STEP===1.5) a = SEQ.length;
  return a;
}
function updateProgress(){
  if($("progress-wrap").style.display==="none") return;
  var sc = curScore();
  $("pw-label").textContent = "Score : " + sc;
  $("pw-fill").style.width = Math.round(answeredCount()/TOTAL*100) + "%";
  $("pw-step").textContent = (STEP>=2 || STEP===1.5) ? "Étape 2 / 2" : "Étape 1 / 2";
}

/* ════ BILAN ════ */
function starsFrac(r){ return r>=1?5:r>=.8?4:r>=.6?3:r>=.4?2:1; }

function showFinal(){
  STEP = 3;
  var sc = curScore();
  var r = sc / TOTAL;
  var st = starsFrac(r);
  var msg;
  if(r>=1) msg = "Excellent\u00a0! Tu compares et tu ranges les nombres relatifs sans te tromper.";
  else if(r>=.8) msg = "Très bien\u00a0! Tu maîtrises presque tout.";
  else if(r>=.6) msg = "Bien\u00a0! Encore quelques comparaisons à revoir.";
  else if(r>=.4) msg = "Tu progresses. Reprends les règles, puis réessaie.";
  else msg = "À retravailler\u00a0: relis les règles de comparaison, puis recommence.";

  // récap COMPACT : résumé par étape + erreurs seulement
  var reglesOk = resSeq.filter(Boolean).length;
  var reglesTot = SEQ.length;
  var rankOk = rankDone && resRank.every(Boolean);
  var recap = '<div class="recap-item '+(reglesOk===reglesTot?"ok":"ko")+'">'
    + '<span class="ri-ic">'+(reglesOk===reglesTot?"\u2714":"\u2718")+'</span>'
    + '<span>Les règles : <strong>'+reglesOk+' / '+reglesTot+'</strong></span></div>'
    + '<div class="recap-item '+(rankOk?"ok":"ko")+'">'
    + '<span class="ri-ic">'+(rankOk?"\u2714":"\u2718")+'</span>'
    + '<span>Le grand rangement : <strong>'+(rankOk?"réussi":"à revoir")+'</strong></span></div>';

  $("progress-wrap").style.display = "none";
  $("app").innerHTML =
    '<div class="screen">'
    + '<div class="trophee">🏆</div>'
    + '<div class="global-score">'+sc+' / '+TOTAL+'</div>'
    + '<div class="stars">'+ "\u2B50".repeat(st) + "\u2606".repeat(5-st) +'</div>'
    + '<div class="global-msg">'+msg+'</div>'
    + '<div class="recap">'+recap+'</div>'
    + '<div class="comp-box"><h3>Tu sais maintenant :</h3>'
      + '<div class="comp-line"><span class="arr">&rarr;</span><span>comparer un positif et un négatif, et deux négatifs entre eux ;</span></div>'
      + '<div class="comp-line"><span class="arr">&rarr;</span><span>lire et utiliser les symboles &lt;, &gt; et = ;</span></div>'
      + '<div class="comp-line"><span class="arr">&rarr;</span><span>ranger une série de nombres relatifs dans l\u2019ordre croissant.</span></div>'
    + '</div>'
    + '<div class="btn-row"><button class="btn btn-primary" onclick="start()">Recommencer</button></div>'
    + '</div>';
}

function stripGap(html){
  return html.replace(/<span class='gap'>\?<\/span>/g, "\u2026").replace(/<[^>]+>/g,"");
}

document.addEventListener("DOMContentLoaded", start);
</script>
</body>
</html>
