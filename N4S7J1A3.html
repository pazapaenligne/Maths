.bg-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,20,30,.06), rgba(10,20,30,.14));}

.stage-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:clamp(125px,13vh,180px) 1rem 2.2rem;position:relative;}

/* Positionnement naturel (plus de centrage vertical) : la feuille descend depuis le
   haut, comme posée sur la table. Le padding-top s'adapte à la hauteur d'écran et se
   resserre sur tablette/mobile, où les cartouches passent en flux normal au-dessus
   de la feuille et occupent déjà de la place verticale. */
@media(max-width:860px){ .stage-wrap{ padding-top:clamp(52px,6vh,80px); } }
@media(max-height:680px), (max-width:480px){ .stage-wrap{ padding-top:26px; } }
@media(max-height:560px){ .stage-wrap{ padding-top:14px; } }

/* ---------- cartouches discrets ---------- */
.badges-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;}
.badge-mission,.badge-status{
  position:fixed;top:1rem;background:rgba(255,255,255,.78);border-radius:6px;padding:.37rem .65rem;
  font-size:.76rem;line-height:1.4;box-shadow:0 2px 8px rgba(20,35,50,.14);z-index:5;
  border:1px solid rgba(35,28,18,.05);
}
.badge-mission{left:1.1rem;text-align:left;min-width:150px;}
.badge-mission .b-strong{font-weight:800;color:var(--navy);font-size:.8rem;}
.badge-mission .b-title{color:var(--ocean);font-size:.72rem;margin-top:.15rem;line-height:1.35;}
.badge-mission .b-muted{color:var(--steel);}
.badge-status{right:1.1rem;display:flex;align-items:center;gap:.65rem;}
.badge-stat{text-align:center;}
.badge-stat .badge-label{display:block;font-size:.6rem;letter-spacing:.05em;color:var(--steel);text-transform:uppercase;}
.badge-stat span:last-child{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.95rem;color:var(--navy);}
.sound-btn{background:var(--gray-light);border:none;width:1.85rem;height:1.85rem;border-radius:50%;font-size:.82rem;cursor:pointer;}
.progress-mini{height:3px;background:var(--gray-light);border-radius:2px;overflow:hidden;margin-top:.4rem;width:100%;}
.progress-mini-fill{height:100%;width:0%;background:var(--ocean);border-radius:2px;transition:width .5s ease;}

@media(max-width:860px){
  .badge-mission,.badge-status{position:static;box-shadow:var(--shadow-soft);}
  .badges-row{flex-direction:column;align-items:center;margin-bottom:.9rem;}
}

/* ---------- la feuille ---------- */
.sheet{
  position:relative;
  background:
    repeating-linear-gradient(0deg, rgba(80,60,30,.012) 0px, rgba(80,60,30,.012) 1px, transparent 1px, transparent 3px),
    repeating-linear-gradient(90deg, rgba(80,60,30,.008) 0px, rgba(80,60,30,.008) 1px, transparent 1px, transparent 4px),
    rgba(251,249,242,.94);
  border-radius:9px 11px 8px 10px;
  box-shadow:var(--shadow-sheet);
  padding:1.9rem 2rem 1.7rem;max-width:560px;width:100%;animation:sheetIn .55s ease both;}
.sheet::after{
  content:'';position:absolute;right:9px;bottom:9px;width:18px;height:18px;
  background:linear-gradient(135deg, transparent 50%, rgba(60,45,25,.09) 52%, rgba(60,45,25,.04) 100%);
  border-radius:0 0 3px 0;pointer-events:none;}
@keyframes sheetIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.obs-eyebrow{font-size:.68rem;letter-spacing:.08em;color:var(--steel);text-transform:uppercase;font-weight:700;margin-bottom:.55rem;}
.consigne{font-size:clamp(1.05rem,2.6vw,1.24rem);font-weight:700;color:var(--navy);margin-bottom:1.2rem;line-height:1.55;}
.consigne .kw{color:var(--ocean);text-decoration:underline;text-decoration-color:var(--ocean);text-underline-offset:3px;}

.stage-feedback{margin-top:1.1rem;padding:.75rem 1rem;border-radius:8px;font-size:.95rem;display:none;line-height:1.65;border:1px solid;}
.stage-feedback.show{display:block;animation:fadeMsg .35s ease;}
.stage-feedback.ok{background:var(--green-light);border-color:var(--green);color:#245c3c;}
.stage-feedback.ko{background:var(--coral-light);border-color:var(--coral);color:#7a3226;}
.stage-feedback .fb-title{font-weight:800;margin-bottom:.3rem;color:var(--navy);}
.stage-feedback strong{color:var(--navy);}
@keyframes fadeMsg{from{opacity:0;}to{opacity:1;}}

.stage-next{margin-top:1.2rem;display:none;justify-content:flex-end;}
.stage-next.show{display:flex;}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:8px;
  font-family:'Inter',Arial,sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;border:none;min-height:2.6rem;
  background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(23,51,82,.2);transition:background .15s, box-shadow .15s;}
.btn:hover{background:var(--ocean);box-shadow:0 3px 8px rgba(23,51,82,.24);}
.btn:active{transform:scale(.98);}

/* ---------- petite ligne d'état (remplace le journal) ---------- */
.status-strip{max-width:640px;width:100%;margin-top:.8rem;text-align:center;min-height:1.8rem;}
.status-strip .log-line{display:none;}
.status-strip .log-line:nth-last-child(2){
  display:inline-block;padding:.3rem .85rem;border-radius:99px;background:rgba(255,255,255,.78);
  color:var(--ink);font-size:.74rem;border:1px solid rgba(35,28,18,.05);
  box-shadow:0 2px 6px rgba(20,35,50,.12);animation:fadeMsg .4s ease;}
.status-strip .log-time{font-weight:700;margin-right:.35rem;color:var(--ocean);}
.status-strip .cursor{display:none;}

/* ---------- bilan final : rapport de mission ---------- */
.bilan{padding:.2rem 0;}
.bilan-title{font-weight:700;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--steel);margin-bottom:.8rem;}

/* Le statut est la donnée la plus visible du rapport : bloc dédié, icône + libellé. */
.bilan-status{display:flex;align-items:center;gap:.65rem;padding:.85rem 1.1rem;border-radius:8px;border:1.5px solid;margin-bottom:1.15rem;box-shadow:0 1px 3px rgba(35,28,18,.06);}
.bilan-status.status-ok{background:var(--green-light);border-color:var(--green);}
.bilan-status.status-mid{background:var(--ocean-light);border-color:var(--ocean);}
.bilan-status.status-low{background:var(--coral-light);border-color:var(--coral);}
.bilan-status-icon{font-size:1.4rem;line-height:1;}
.bilan-status-text{font-size:1.18rem;font-weight:800;color:var(--navy);}

.bilan-divider{height:1px;background:var(--gray-light);margin:0 0 1.05rem;}
.bilan-lines{display:flex;flex-direction:column;gap:0;max-width:420px;margin:0 0 1.05rem;}
.bilan-line{display:flex;justify-content:space-between;gap:.6rem;padding:.55rem .05rem;border-bottom:1px solid var(--gray-light);font-size:.95rem;}
.bilan-line span{color:var(--steel);}
.bilan-line strong{color:var(--navy);}
.status-ok{color:var(--green) !important;}
.status-mid{color:var(--ocean) !important;}
.status-low{color:var(--coral) !important;}
.bilan-stars{font-size:1.6rem;margin-bottom:.65rem;}
.bilan-msg{color:var(--ink);font-size:.95rem;margin-bottom:.6rem;line-height:1.65;}
.bilan-footer{color:var(--steel);font-size:.82rem;font-style:italic;margin:0 0 1.3rem;}

/* ============================================================================
   MODULE DU JOUR — présentation des questions
   ============================================================================ */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
@media(max-width:480px){.opt-grid{grid-template-columns:1fr;}}
.opt-card{border:1.5px solid var(--gray-light);border-radius:8px;padding:.9rem .8rem;cursor:pointer;
  background:var(--white);text-align:center;transition:border-color .15s, background .15s;}
.opt-card:hover:not(:disabled){border-color:var(--ocean);background:#f3f8fa;}
.opt-card.correctZ{border-color:var(--green);background:var(--green-light);box-shadow:inset 0 0 0 1px var(--green);}
.opt-card{box-shadow:0 1px 3px rgba(35,28,18,.06);}
.opt-card.wrongZ{border-color:var(--coral);background:var(--coral-light);}
.opt-card.dimmed{opacity:.5;}
.opt-card.locked{cursor:default;}
.opt-card.stmt{text-align:left;display:flex;gap:.5rem;align-items:baseline;}
.opt-label{font-size:.66rem;color:var(--steel);letter-spacing:.05em;margin-bottom:.45rem;display:block;font-weight:700;}
.opt-card.stmt .opt-label{margin-bottom:0;flex-shrink:0;}
.pastilles{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;}
.pas{background:var(--gray-light);border:1px solid #e2e7ea;border-radius:5px;min-width:2.4rem;padding:.35rem .3rem;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.95rem;color:var(--ink);}
</style>
</head>
<body>
<div class="bg-photo" aria-hidden="true"></div>

<div class="stage-wrap">

  <div class="badges-row">
    <div class="badge-mission">
      <div class="b-strong" id="missionEyebrow">Mission Océan</div>
      <div class="b-title">Calculer des fréquences et des moyennes</div>
      <div>Jour <span id="dashJour">1 / 5</span></div>
      <div class="b-muted">Observation <span id="dashQuestions">1 / 5</span></div>
      <div class="progress-mini"><div class="progress-mini-fill" id="dashProgFill" style="width:0%"></div></div>
    </div>
    <div class="badge-status">
      <div class="badge-stat"><span class="badge-label">Score</span><span id="dashScore">0</span></div>
      <div class="badge-stat"><span class="badge-label">Temps</span><span id="dashTimer">02:00</span></div>
      <button
        class="sound-btn"
        type="button"
        id="soundBtn"
        aria-label="Désactiver le son"
        aria-pressed="false"
        onclick="toggleSound()">🔊</button>
    </div>
  </div>

  <section class="sheet" id="scannerPanel">
    <div id="scannerInner">
      <p class="obs-eyebrow">Initialisation</p>
      <p class="consigne">Chargement du premier exercice…</p>
    </div>
  </section>

  <div class="status-strip" id="journalLog">
    <div class="log-line"><span class="log-time">[08:14]</span>Connexion établie au laboratoire.</div>
    <div class="log-line" id="journalCursorLine"></div>
  </div>

</div>

<script>
/* ============================================================================
   COQUILLE — MOTEUR GÉNÉRIQUE (dashboard, chrono, score, journal, sons)
   INCHANGÉ dans sa logique par rapport à la version précédente.
   ============================================================================ */
const SEMAINE_NUM = 7;
const JOUR_ACTUEL = 1;
const TOTAL_JOURS = 5;
const TEMPS_PAR_QUESTION = 120;

let qIndex = 0, score = 0, timeUsedTotal = 0;
let currentData = null, currentController = null, answered = false, timeLeft = TEMPS_PAR_QUESTION, timerHandle = null;
let soundOn = true;
let missionClock = 8*3600 + 14*60 + 9;

function $(id){ return document.getElementById(id); }
function pad(n){ return n<10 ? "0"+n : ""+n; }
function fmtClock(sec){ const h=Math.floor(sec/3600)%24, m=Math.floor((sec%3600)/60); return pad(h)+":"+pad(m); }
function fmtMMSS(sec){ const m=Math.floor(sec/60), s=sec%60; return pad(m)+":"+pad(s); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function formatTempsTotal(sec){
  const min = Math.floor(sec / 60);
  const secondes = sec % 60;
  if(min === 0){ return secondes + " s"; }
  return min + " min " + pad(secondes) + " s";
}

function addLog(text){
  missionClock += 2 + Math.floor(Math.random()*5);
  const line = document.createElement("div");
  line.className = "log-line";
  line.innerHTML = '<span class="log-time">['+fmtClock(missionClock)+']</span>'+text;
  const log = $("journalLog"), cursor = $("journalCursorLine");
  log.insertBefore(line, cursor);
  log.scrollTop = log.scrollHeight;
}

function reactLab(success){
  const panel = $("scannerPanel");
  const cls = success ? "flash-ok" : "flash-ko";
  panel.classList.add(cls);
  setTimeout(function(){ panel.classList.remove(cls); }, 550);
  document.querySelectorAll(".blip").forEach(function(b){
    b.classList.add("ping-react");
    setTimeout(function(){ b.classList.remove("ping-react"); }, 900);
  });
}

function initShell(){
  $("dashJour").textContent = JOUR_ACTUEL + " / " + TOTAL_JOURS;
  $("missionEyebrow").textContent = "Mission Océan · Semaine " + SEMAINE_NUM;
  startQuestion();
}

function startQuestion(){
  answered = false;
  timeLeft = TEMPS_PAR_QUESTION;
  currentData = DAY_EXERCISE.buildQuestion(qIndex);
  if(typeof DAY_EXERCISE.onQuestionLoad === "function") DAY_EXERCISE.onQuestionLoad();
  addLog(pick([
    "Nouvel échantillon chargé — observation "+(qIndex+1)+".",
    "Connexion au capteur "+(qIndex+1)+" établie.",
    "Chargement des données de l'observation "+(qIndex+1)+"…",
    "Synchronisation des capteurs…",
    "Acquisition des données…",
    "Calibration des instruments…",
    "Données reçues du capteur "+(qIndex+1)+".",
    "Vérification des observations…"
  ]));
  renderScanner();
  startTimer();
  updateDashboard();
}

function renderScanner(){
  const inner = $("scannerInner");
  inner.innerHTML =
    '<div class="obs-eyebrow">Observation '+(qIndex+1)+' / '+DAY_EXERCISE.totalQuestions+'</div>'
    + '<div class="consigne">'+currentData.consigne+'</div>'
    + '<div id="stageBody"></div>'
    + '<div class="stage-feedback" id="stageFeedback" role="status" aria-live="polite" aria-atomic="true"></div>'
    + '<div class="stage-next" id="stageNext"><button class="btn" type="button" id="nextBtn" onclick="nextQuestion()"></button></div>';
  currentController = DAY_EXERCISE.render(currentData, $("stageBody"), submitAnswer);
}

function nextButtonLabel(){
  if(qIndex+1>=DAY_EXERCISE.totalQuestions) return "Voir le rapport de mission \u2192";
  return pick(["Nouvelle analyse \u2192","Observation suivante \u2192","Échantillon suivant \u2192"]);
}

function startTimer(){
  clearInterval(timerHandle);
  updateTimerDisplay();
  timerHandle = setInterval(function(){
    if(timeLeft > 0){ timeLeft--; }
    updateTimerDisplay();
    if(timeLeft === 0){
      clearInterval(timerHandle);
      if(!answered && currentController && currentController.forceTimeout) currentController.forceTimeout();
    }
  },1000);
}
function updateTimerDisplay(){
  const t = $("dashTimer");
  t.textContent = fmtMMSS(Math.max(0,timeLeft));
}
function updateDashboard(){
  $("dashQuestions").textContent = (qIndex+1)+" / "+DAY_EXERCISE.totalQuestions;
  $("dashScore").textContent = score;
  $("dashProgFill").style.width = Math.round((qIndex+1)/DAY_EXERCISE.totalQuestions*100)+"%";
}

function submitAnswer(result){
  if(answered) return;
  answered = true;
  clearInterval(timerHandle);
  timeUsedTotal += (TEMPS_PAR_QUESTION-Math.max(0,timeLeft));
  if(result.correct) score++;

  const fb = $("stageFeedback");
  const text = DAY_EXERCISE.feedbackHTML(currentData, result);
  fb.className = "stage-feedback show " + (result.correct ? "ok" : "ko");
  fb.innerHTML = '<div class="fb-title">'+text.title+'</div>'+text.body;

  reactLab(result.correct);

  if(result.correct){
    addLog(pick(["Analyse validée : série identifiée avec succès.","Observation confirmée par le système.","Corrélation confirmée entre les données.","Mesures validées…","Traitement terminé…","Série archivée…","Rapport scientifique enregistré…","Validation de l'observation…","Contrôle qualité terminé…","Transmission vers le laboratoire…"]));
    playCorrect();
  } else if(result.timeout){
    addLog(pick(["Signal perdu : temps de mesure écoulé.","Fenêtre d'analyse expirée.","Capteur en veille : délai dépassé."]));
    playWrong();
  } else {
    addLog(pick(["Anomalie détectée : mauvaise série sélectionnée.","Écart non conforme aux mesures attendues.","Résultat à revérifier par l'équipe.","Analyse statistique à reprendre…"]));
    playWrong();
  }

  $("stageNext").className = "stage-next show";
  $("nextBtn").textContent = nextButtonLabel();
  $("dashScore").textContent = score;
}

function nextQuestion(){
  qIndex++;
  if(qIndex>=DAY_EXERCISE.totalQuestions){ showResults(); return; }
  startQuestion();
}

function showResults(){
  $("dashProgFill").style.width = "100%";
  $("dashQuestions").textContent = DAY_EXERCISE.totalQuestions+" / "+DAY_EXERCISE.totalQuestions;
  const total = DAY_EXERCISE.totalQuestions;
  const stars = score===total ? 3 : (score>=3 ? 2 : 1);
  let st = ""; for(let s=0;s<3;s++) st += (s<stars ? "\u2b50" : "\u2606");

  let status, statusClass, msg;
  if(score===total){ status="Mission réussie"; statusClass="status-ok"; msg="Mission accomplie sans une seule erreur ! Le laboratoire te fait confiance."; }
  else if(score>=3){ status="Mission validée"; statusClass="status-mid"; msg="Bonne mission ! Continue à bien comparer les données avant de conclure."; }
  else { status="Mission à consolider"; statusClass="status-low"; msg="Mission à reprendre en douceur : relis bien chaque observation avant de choisir."; }
  const statusIcon = statusClass==="status-ok" ? "\u{1F7E2}" : (statusClass==="status-mid" ? "\u{1F7E1}" : "\u{1F534}");
  const footerMsg = pick(["Le rapport a été transmis au centre océanographique.","Les données de la mission ont été enregistrées.","Mission archivée. Prêt(e) pour une nouvelle analyse."]);

  $("scannerInner").innerHTML =
    '<div class="bilan">'
    + '<div class="bilan-title">Rapport de mission</div>'
    + '<div class="bilan-status '+statusClass+'"><span class="bilan-status-icon" aria-hidden="true">'+statusIcon+'</span><span class="bilan-status-text">'+status+'</span></div>'
    + '<div class="bilan-divider"></div>'
    + '<div class="bilan-lines">'
    + '<div class="bilan-line"><span>Observations réalisées</span><strong>'+total+' / '+total+'</strong></div>'
    + '<div class="bilan-line"><span>Observations validées</span><strong>'+score+' / '+total+'</strong></div>'
    + '<div class="bilan-line"><span>Temps utilisé</span><strong>'+formatTempsTotal(timeUsedTotal)+'</strong></div>'
    + (DAY_EXERCISE.competence ? '<div class="bilan-line"><span>Compétence travaillée</span><strong>'+DAY_EXERCISE.competence+'</strong></div>' : '')
    + '</div>'
    + '<div class="bilan-stars" aria-hidden="true">'+st+'</div>'
    + '<p class="bilan-msg">'+msg+'</p>'
    + '<p class="bilan-footer">'+footerMsg+'</p>'
    + '<button class="btn" type="button" aria-label="Recommencer la mission" onclick="restart()">Recommencer la mission</button>'
    + '</div>';
  addLog(pick(["Mission terminée : rapport final généré.","Toutes les observations ont été transmises au centre de contrôle.","Rapport scientifique enregistré.","Contrôle qualité terminé : mission archivée."]));
  playFinal();
}

function restart(){
  clearInterval(timerHandle);
  qIndex = 0;
  score = 0;
  timeUsedTotal = 0;
  answered = false;

  $("dashScore").textContent = "0";
  $("dashQuestions").textContent = "1 / " + DAY_EXERCISE.totalQuestions;
  $("dashProgFill").style.width = Math.round(1/DAY_EXERCISE.totalQuestions*100)+"%";

  addLog("Nouvelle mission lancée : régénération des données.");
  startQuestion();
}

/* ============================================================================
   SONS (Web Audio API) — inchangés (ambiance navire, sonar, bulles, mouettes).
   ============================================================================ */
let actx = null;
const AMBIENT_VOLUME = 0.12;
let ambientStarted = false, ambientGain = null;
let noiseSource = null, noiseFilter = null;
let shimmerSource = null, shimmerFilter = null, shimmerGain = null;

function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }

function duckAmbient(duration){
  if(!ambientGain || !actx) return;
  const now = actx.currentTime;
  ambientGain.gain.cancelScheduledValues(now);
  ambientGain.gain.setValueAtTime(ambientGain.gain.value, now);
  ambientGain.gain.linearRampToValueAtTime(AMBIENT_VOLUME*0.35, now+0.05);
  ambientGain.gain.linearRampToValueAtTime(soundOn?AMBIENT_VOLUME:0, now+duration+0.4);
}

function tone(freq, dur, type, delay, gainVal){
  if(!soundOn) return;
  const ctx = ensureAudio(); if(!ctx) return;
  duckAmbient(dur+(delay||0)+0.3);
  const t0 = ctx.currentTime + (delay||0);
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type||"sine"; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gainVal||0.12, t0+0.02);
  g.gain.linearRampToValueAtTime(0, t0+dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}

function playCorrect(){
  tone(523,.16,"sine",0,.085);
  tone(659,.20,"sine",.09,.075);
  tone(659,.30,"triangle",.09,.025);
}
function playWrong(){
  tone(300,.12,"sine",0,.07);
  tone(215,.20,"sine",.10,.06);
}
function playFinal(){
  tone(700,.10,"sine",0,.09);
  tone(700,.10,"sine",.16,.09);
  tone(392,.34,"sine",.34,.07);
}
function playObservationLoadSound(){
  tone(1150+Math.random()*60,.09,"sine",0,.032);
  tone(1150+Math.random()*60,.06,"sine",.12,.014);
}

function startAmbient(){
  if(ambientStarted) return;
  const ctx = ensureAudio(); if(!ctx) return;
  ambientStarted = true;

  const bufferSize = ctx.sampleRate * 4;

  const brownBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const bd = brownBuffer.getChannelData(0);
  let last = 0;
  for(let i=0;i<bufferSize;i++){
    const white = Math.random()*2-1;
    last = (last + 0.018*white) / 1.018;
    bd[i] = last * 3.2;
  }
  noiseSource = ctx.createBufferSource();
  noiseSource.buffer = brownBuffer;
  noiseSource.loop = true;

  noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = "lowpass";
  noiseFilter.frequency.value = 520;
  noiseFilter.Q.value = 0.5;

  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.09;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 110;
  lfo.connect(lfoGain);
  lfoGain.connect(noiseFilter.frequency);
  lfo.start();

  const shimmerBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const sd = shimmerBuffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ sd[i] = Math.random()*2-1; }
  shimmerSource = ctx.createBufferSource();
  shimmerSource.buffer = shimmerBuffer;
  shimmerSource.loop = true;

  shimmerFilter = ctx.createBiquadFilter();
  shimmerFilter.type = "bandpass";
  shimmerFilter.frequency.value = 1500;
  shimmerFilter.Q.value = 0.8;

  shimmerGain = ctx.createGain();
  shimmerGain.gain.value = 0.22;

  const lfo2 = ctx.createOscillator();
  lfo2.frequency.value = 0.06;
  const lfo2Gain = ctx.createGain();
  lfo2Gain.gain.value = 400;
  lfo2.connect(lfo2Gain);
  lfo2Gain.connect(shimmerFilter.frequency);
  lfo2.start();

  ambientGain = ctx.createGain();
  ambientGain.gain.value = 0;

  noiseSource.connect(noiseFilter);
  noiseFilter.connect(ambientGain);
  shimmerSource.connect(shimmerFilter);
  shimmerFilter.connect(shimmerGain);
  shimmerGain.connect(ambientGain);

  const engineOsc = ctx.createOscillator();
  engineOsc.type = "sine";
  engineOsc.frequency.value = 55;
  const engineGain = ctx.createGain();
  engineGain.gain.value = 0.045;
  const engineLfo = ctx.createOscillator();
  engineLfo.frequency.value = 0.05;
  const engineLfoGain = ctx.createGain();
  engineLfoGain.gain.value = 3;
  engineLfo.connect(engineLfoGain);
  engineLfoGain.connect(engineOsc.frequency);
  engineLfo.start();
  engineOsc.connect(engineGain);
  engineGain.connect(ambientGain);
  engineOsc.start();

  ambientGain.connect(ctx.destination);

  noiseSource.start();
  shimmerSource.start();

  if(soundOn){ ambientGain.gain.linearRampToValueAtTime(AMBIENT_VOLUME, ctx.currentTime+1.6); }
  scheduleBubble();
  scheduleAmbientPing();
  scheduleCreak();
  scheduleSeagull();
}

function scheduleAmbientPing(){
  const delay = 14000 + Math.random()*10000;
  setTimeout(function(){
    if(soundOn) tone(1100+Math.random()*40, .11, "sine", 0, .03);
    scheduleAmbientPing();
  }, delay);
}
function scheduleCreak(){
  const delay = 28000 + Math.random()*24000;
  setTimeout(function(){
    if(soundOn) playCreak();
    scheduleCreak();
  }, delay);
}
function playCreak(){
  const ctx = actx; if(!ctx) return;
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator(); const g = ctx.createGain(); const filt = ctx.createBiquadFilter();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(95, t0);
  osc.frequency.exponentialRampToValueAtTime(62, t0+0.55);
  filt.type = "lowpass"; filt.frequency.value = 300;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(0.035, t0+0.08);
  g.gain.exponentialRampToValueAtTime(0.001, t0+0.6);
  osc.connect(filt); filt.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+0.65);
}
function scheduleSeagull(){
  const delay = 40000 + Math.random()*30000;
  setTimeout(function(){
    if(soundOn) playSeagull();
    scheduleSeagull();
  }, delay);
}
function playSeagull(){
  const ctx = actx; if(!ctx) return;
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(950, t0);
  osc.frequency.linearRampToValueAtTime(1400, t0+0.12);
  osc.frequency.linearRampToValueAtTime(1050, t0+0.28);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(0.018, t0+0.04);
  g.gain.linearRampToValueAtTime(0, t0+0.32);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+0.35);
}
function scheduleBubble(){
  const delay = 2200 + Math.random()*7000;
  const cluster = Math.random() < 0.28;
  setTimeout(function(){
    if(soundOn){
      playBubble(1);
      if(cluster){
        setTimeout(function(){ if(soundOn) playBubble(0.85); }, 220+Math.random()*260);
      }
    }
    scheduleBubble();
  }, delay);
}
function playBubble(scale){
  scale = scale || 1;
  const ctx = actx; if(!ctx) return;
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  const startFreq = (200 + Math.random()*220) * scale;
  osc.type = "sine";
  osc.frequency.setValueAtTime(startFreq, t0);
  osc.frequency.exponentialRampToValueAtTime(startFreq*(1.8+Math.random()*0.6), t0+0.14+Math.random()*0.12);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(0.04*scale, t0+0.018);
  g.gain.exponentialRampToValueAtTime(0.001, t0+0.2+Math.random()*0.1);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+0.35);
}
function setAmbientVolume(target){
  if(!ambientGain || !actx) return;
  const now = actx.currentTime;
  ambientGain.gain.cancelScheduledValues(now);
  ambientGain.gain.setValueAtTime(ambientGain.gain.value, now);
  ambientGain.gain.linearRampToValueAtTime(target, now+0.8);
}
function armAmbientOnFirstInteraction(){
  function handler(){
    startAmbient();
    document.removeEventListener("pointerdown", handler);
    document.removeEventListener("keydown", handler);
  }
  document.addEventListener("pointerdown", handler, {once:true});
  document.addEventListener("keydown", handler, {once:true});
}

function toggleSound(){
  soundOn = !soundOn;
  const btn = $("soundBtn");
  btn.setAttribute("aria-pressed", String(!soundOn));
  btn.textContent = soundOn ? "🔊" : "🔇";
  btn.setAttribute("aria-label", soundOn ? "Désactiver le son" : "Activer le son");
  if(soundOn){
    ensureAudio();
    if(!ambientStarted) startAmbient(); else setAmbientVolume(AMBIENT_VOLUME);
  } else {
    setAmbientVolume(0);
  }
}

/* ============================================================================
   MODULE DU JOUR — JOUR 1 : moyennes et étendues (Semaine 7)
   GÉNÉRATION, VÉRIFICATIONS ET CALCULS STRICTEMENT INCHANGÉS.
   ============================================================================ */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function genSeriesMean(meanScaled, n, minVal, maxVal, maxTries){
  maxTries = maxTries || 100;
  for(let t=0; t<maxTries; t++){
    let vals=[], sum=0;
    for(let i=0;i<n-1;i++){ const v=randInt(minVal,maxVal); vals.push(v); sum+=v; }
    const last = meanScaled*n - sum;
    if(Number.isInteger(last) && last>=minVal && last<=maxVal){ vals.push(last); shuffle(vals); return vals; }
  }
  return null;
}
function genSeriesRange(rangeScaled, n, minVal, maxVal, maxTries){
  maxTries = maxTries || 100;
  for(let t=0; t<maxTries; t++){
    if(maxVal-rangeScaled < minVal) return null;
    const lo = randInt(minVal, maxVal-rangeScaled);
    let vals = [lo, lo+rangeScaled];
    for(let i=0;i<n-2;i++){ vals.push(randInt(lo, lo+rangeScaled)); }
    shuffle(vals);
    return vals;
  }
  return null;
}
function genValueSeries(cfg, targetScaled, n){
  return cfg.type==="moyenne"
    ? genSeriesMean(targetScaled, n, cfg.minVal, cfg.maxVal)
    : genSeriesRange(targetScaled, n, cfg.minVal, cfg.maxVal);
}
function checkSeries(cfg, vals, targetScaled){
  if(cfg.type==="moyenne") return vals.reduce((a,b)=>a+b,0) === targetScaled*vals.length;
  return (Math.max(...vals)-Math.min(...vals)) === targetScaled;
}
function fmtVal(v, scale){
  if(scale===1){ return v<0 ? "\u2212"+Math.abs(v) : String(v); }
  const dec = v/scale;
  const s = Math.abs(dec).toFixed(1).replace(".", ",");
  return dec<0 ? "\u2212"+s : s;
}
function typeLabel(type){ return type==="moyenne" ? "moyenne" : "étendue"; }
function methodReminder(type){
  return type==="moyenne"
    ? "Pour calculer une moyenne, on additionne toutes les valeurs de la série, puis on divise cette somme par le nombre de valeurs."
    : "L\u2019étendue correspond à la différence entre la plus grande et la plus petite valeur d\u2019une série.";
}
function genDistractors(target, scale, type, count){
  const pool = scale===1 ? [1,2,3,4,-1,-2,-3,-4,5,-5] : [5,10,15,20,-5,-10,-15,-20,25,-25];
  shuffle(pool);
  const result = [];
  for(const d of pool){
    const val = target+d;
    if(val===target) continue;
    if(type==="etendue" && val<1) continue;
    if(result.indexOf(val)===-1) result.push(val);
    if(result.length>=count) break;
  }
  let guard=0;
  while(result.length<count && guard<30){
    guard++;
    const step = (scale===1?1:10)*randInt(6,9)*(Math.random()<0.5?1:-1);
    const val = target+step;
    if(val!==target && result.indexOf(val)===-1 && !(type==="etendue"&&val<1)) result.push(val);
  }
  return result;
}

const FALLBACK_ZONES_DIFF_MOYENNE = {
  mode:"zones-diff", cfg:{type:"moyenne",scale:1}, scale:1, commonTarget:8, oddTarget:10,
  series:[
    { vals:[6,10], isOdd:false },
    { vals:[7,8,9], isOdd:false },
    { vals:[4,8,12], isOdd:false },
    { vals:[8,12], isOdd:true }
  ],
  correctIndex:3,
  consigne:'Quelle série de nombres n\u2019a pas la même <span class="kw">moyenne</span> que les autres&nbsp;?'
};
const FALLBACK_ZONES_DIFF_ETENDUE = {
  mode:"zones-diff", cfg:{type:"etendue",scale:1}, scale:1, commonTarget:6, oddTarget:9,
  series:[
    { vals:[2,8], isOdd:false },
    { vals:[5,11], isOdd:false },
    { vals:[0,6], isOdd:false },
    { vals:[2,11], isOdd:true }
  ],
  correctIndex:3,
  consigne:'Quelle série de nombres n\u2019a pas la même <span class="kw">étendue</span> que les autres&nbsp;?'
};
const FALLBACK_STATEMENTS = {
  mode:"statements", type:"moyenne", scale:1, vals:[4,6,8], target:6,
  items:[
    { value:8, isCorrect:false },
    { value:6, isCorrect:true },
    { value:5, isCorrect:false },
    { value:9, isCorrect:false }
  ],
  correctIndex:1,
  consigne:"Parmi ces quatre affirmations, laquelle est correcte&nbsp;?"
};
const FALLBACK_ZONES_TARGET = {
  mode:"zones-target", type:"moyenne", scale:1, target:7,
  series:[
    { vals:[4,6] },
    { vals:[5,9] },
    { vals:[8,10] },
    { vals:[3,7,8] }
  ],
  correctIndex:1,
  consigne:'Quelle série a pour <span class="kw">moyenne</span> <strong>7</strong>&nbsp;?'
};

function buildZonesDiff(cfg){
  for(let attempt=0; attempt<50; attempt++){
    const commonTarget = randInt(cfg.targetMin, cfg.targetMax);
    let delta = randInt(cfg.deltaMin, cfg.deltaMax);
    if(cfg.type==="moyenne" && Math.random()<0.5) delta = -delta;
    let oddTarget = commonTarget + delta;
    if(cfg.type==="etendue" && oddTarget<1) oddTarget = commonTarget + Math.abs(delta);
    if(oddTarget===commonTarget) continue;

    const series = []; let ok = true;
    for(let i=0;i<3;i++){
      const n = cfg.nOptions[randInt(0,cfg.nOptions.length-1)];
      const vals = genValueSeries(cfg, commonTarget, n);
      if(!vals){ ok=false; break; }
      series.push({ vals, isOdd:false });
    }
    if(!ok) continue;
    const nOdd = cfg.nOptions[randInt(0,cfg.nOptions.length-1)];
    const valsOdd = genValueSeries(cfg, oddTarget, nOdd);
    if(!valsOdd) continue;
    series.push({ vals:valsOdd, isOdd:true });

    shuffle(series);
    const correctIndex = series.findIndex(s=>s.isOdd);
    let checkOk = true;
    for(const s of series){ if(!checkSeries(cfg, s.vals, s.isOdd?oddTarget:commonTarget)) checkOk=false; }
    if(!checkOk || correctIndex<0) continue;

    const label = typeLabel(cfg.type);
    return {
      mode:"zones-diff", cfg, scale:cfg.scale, commonTarget, oddTarget, series, correctIndex,
      consigne: "Quelle série de nombres n\u2019a pas la même <span class=\"kw\">"+label+"</span> que les autres&nbsp;?"
    };
  }
  return cfg.type==="moyenne" ? FALLBACK_ZONES_DIFF_MOYENNE : FALLBACK_ZONES_DIFF_ETENDUE;
}

function buildStatements(){
  const type = Math.random()<0.5 ? "moyenne" : "etendue";
  const scale = (type==="moyenne" && Math.random()<0.4) ? 10 : 1;
  const cfg = {
    type, scale,
    minVal: type==="etendue" ? 0 : (scale===10 ? 10 : 1),
    maxVal: scale===10 ? 220 : 25
  };
  const targetMin = scale===10 ? 50 : (type==="etendue" ? 4 : 6);
  const targetMax = scale===10 ? 160 : (type==="etendue" ? 14 : 16);
  const nOptions = [3,4,5];

  for(let attempt=0; attempt<50; attempt++){
    const target = randInt(targetMin, targetMax);
    const n = nOptions[randInt(0,nOptions.length-1)];
    const vals = genValueSeries(cfg, target, n);
    if(!vals) continue;
    if(!checkSeries(cfg, vals, target)) continue;
    const distractors = genDistractors(target, scale, type, 3);
    if(distractors.length<3) continue;

    const items = shuffle([
      { value:target, isCorrect:true },
      { value:distractors[0], isCorrect:false },
      { value:distractors[1], isCorrect:false },
      { value:distractors[2], isCorrect:false }
    ]);
    const correctIndex = items.findIndex(it=>it.isCorrect);
    if(correctIndex<0) continue;

    return {
      mode:"statements", type, scale, vals, target, items, correctIndex,
      consigne:"Parmi ces quatre affirmations, laquelle est correcte&nbsp;?"
    };
  }
  return FALLBACK_STATEMENTS;
}

function buildZonesTarget(){
  const type = Math.random()<0.5 ? "moyenne" : "etendue";
  let cfg, targetMin, targetMax;
  if(type==="etendue"){
    cfg = { type, scale:1, minVal:0, maxVal:26 };
    targetMin=4; targetMax=16;
  } else {
    const decimal = Math.random()<0.35;
    const allowNeg = Math.random()<0.3;
    if(decimal){
      cfg = { type, scale:10, minVal: allowNeg?-60:10, maxVal:180 };
      targetMin = allowNeg?-20:40; targetMax = allowNeg?70:140;
    } else {
      cfg = { type, scale:1, minVal: allowNeg?-10:1, maxVal:25 };
      targetMin = allowNeg?-3:6; targetMax = allowNeg?12:16;
    }
  }
  const nOptions = type==="etendue" ? [2,3,4,5] : [2,3,4];

  for(let attempt=0; attempt<50; attempt++){
    const target = randInt(targetMin, targetMax);
    const nMain = nOptions[randInt(0,nOptions.length-1)];
    const mainVals = genValueSeries(cfg, target, nMain);
    if(!mainVals) continue;
    if(!checkSeries(cfg, mainVals, target)) continue;

    const series = [{ vals: mainVals }];
    let ok = true;
    for(let i=0;i<3;i++){
      let other = null;
      for(let tries=0; tries<20 && !other; tries++){
        const otherTarget = randInt(targetMin, targetMax);
        if(otherTarget===target) continue;
        const n = nOptions[randInt(0,nOptions.length-1)];
        const v = genValueSeries(cfg, otherTarget, n);
        if(v && checkSeries(cfg, v, otherTarget) && !checkSeries(cfg, v, target)) other = v;
      }
      if(!other){ ok=false; break; }
      series.push({ vals: other });
    }
    if(!ok) continue;

    shuffle(series);
    let matchCount = 0, correctIndex = -1;
    series.forEach(function(s,i){ if(checkSeries(cfg, s.vals, target)){ matchCount++; correctIndex=i; } });
    if(matchCount!==1) continue;

    const label = typeLabel(type);
    return {
      mode:"zones-target", type, scale:cfg.scale, target, series, correctIndex,
      consigne:"Quelle série a pour <span class=\"kw\">"+label+"</span> <strong>"+fmtVal(target,cfg.scale)+"</strong>&nbsp;?"
    };
  }
  return FALLBACK_ZONES_TARGET;
}

function renderZonesClick(data, stageBodyEl, submitAnswer){
  const letters = ["A","B","C","D"];
  let html = '<div class="opt-grid" id="zones" role="group" aria-label="Quatre séries de nombres, choisis celle qui répond à la consigne">';
  for(let i=0;i<4;i++){
    const s = data.series[i];
    let pas = "";
    const valsTxt = s.vals.map(function(v){ return fmtVal(v,data.scale); }).join(", ");
    for(const v of s.vals){ pas += '<div class="pas">'+fmtVal(v,data.scale)+'</div>'; }
    html += '<button class="opt-card" id="zone'+i+'" type="button" aria-label="Série '+letters[i]+' : '+valsTxt+'" onclick="daySelectZone('+i+')">'
      + '<span class="opt-label">Série '+letters[i]+'</span>'
      + '<div class="pastilles">'+pas+'</div></button>';
  }
  html += '</div>';
  stageBodyEl.innerHTML = html;
  return wireZones(data, submitAnswer);
}

function renderStatements(data, stageBodyEl, submitAnswer){
  const letters = ["A","B","C","D"];
  let pasHtml = '<div class="pastilles" style="margin-bottom:1.1rem;">';
  for(const v of data.vals){ pasHtml += '<div class="pas">'+fmtVal(v,data.scale)+'</div>'; }
  pasHtml += '</div>';
  let listHtml = '<div class="opt-grid" style="grid-template-columns:1fr;" role="group" aria-label="Quatre affirmations, une seule est correcte">';
  data.items.forEach(function(it,i){
    const verb = data.type==="moyenne" ? "La moyenne" : "L\u2019étendue";
    const text = verb+" de cette série est <strong>"+fmtVal(it.value,data.scale)+"</strong>.";
    listHtml += '<button class="opt-card stmt" id="zone'+i+'" type="button" onclick="daySelectZone('+i+')"><span class="opt-label">'+letters[i]+'</span><span>'+text+'</span></button>';
  });
  listHtml += '</div>';
  stageBodyEl.innerHTML = pasHtml + listHtml;
  return wireZones(data, submitAnswer);
}

function wireZones(data, submitAnswer){
  let locked = false;
  function lockAll(chosenIndex){
    locked = true;
    for(let i=0;i<4;i++){
      const z = $("zone"+i);
      z.classList.add("locked");
      z.disabled = true;
      z.onclick = null;
      if(i===data.correctIndex) z.classList.add("correctZ");
      else if(i===chosenIndex) z.classList.add("wrongZ");
      else z.classList.add("dimmed");
    }
  }
  window.daySelectZone = function(i){
    if(locked) return;
    const isCorrect = (i===data.correctIndex);
    lockAll(i);
    submitAnswer({correct:isCorrect, timeout:false, chosenIndex:i});
  };
  return {
    forceTimeout: function(){
      if(locked) return;
      lockAll(-1);
      submitAnswer({correct:false, timeout:true, chosenIndex:-1});
    }
  };
}

function feedbackZonesDiff(data, result){
  const label = typeLabel(data.cfg.type);
  const commonTxt = fmtVal(data.commonTarget, data.scale);
  const oddTxt = fmtVal(data.oddTarget, data.scale);
  const method = methodReminder(data.cfg.type);
  if(result.correct){
    return { title:"Bravo ! Cette série n\u2019a pas la même "+label+" que les trois autres.",
      body:method+" Les trois autres séries ont pour "+label+" <strong>"+commonTxt+"</strong>, tandis que cette série a pour "+label+" <strong>"+oddTxt+"</strong>." };
  }
  return { title:(result.timeout?"Temps écoulé.":"Ce n\u2019est pas cette série.")+" Compare les "+label+"s des quatre séries.",
    body:method+" La bonne réponse était la série mise en évidence. Les trois autres séries ont pour "+label+" <strong>"+commonTxt+"</strong>, tandis que celle-ci a pour "+label+" <strong>"+oddTxt+"</strong>." };
}
function feedbackZonesTarget(data, result){
  const label = typeLabel(data.type);
  const targetTxt = fmtVal(data.target, data.scale);
  const method = methodReminder(data.type);
  if(result.correct){
    return { title:"Bravo ! Cette série a bien pour "+label+" "+targetTxt+".",
      body:method+" Tu as correctement identifié la série dont la "+label+" vaut <strong>"+targetTxt+"</strong>." };
  }
  return { title:(result.timeout?"Temps écoulé.":"Ce n\u2019est pas cette série.")+" La série recherchée est mise en évidence.",
    body:method+" La série recherchée a bien pour "+label+" <strong>"+targetTxt+"</strong>." };
}
function feedbackStatements(data, result){
  const correctItem = data.items[data.correctIndex];
  const verb = data.type==="moyenne" ? "moyenne" : "étendue";
  const correctTxt = fmtVal(correctItem.value, data.scale);
  const method = methodReminder(data.type);
  if(result.correct){
    return { title:"Bravo ! Cette affirmation est exacte.",
      body:method+" La "+verb+" de cette série vaut bien <strong>"+correctTxt+"</strong>." };
  }
  return { title:(result.timeout?"Temps écoulé.":"Cette affirmation est fausse.")+" La bonne affirmation est mise en évidence.",
    body:method+" La "+verb+" de cette série vaut en réalité <strong>"+correctTxt+"</strong>." };
}

const DAY_EXERCISE = {
  meta: { title: "Calculer des fréquences et des moyennes" },
  totalQuestions: 5,
  competence: "Calculer et comparer des moyennes et des étendues",

  onQuestionLoad: function(){ playObservationLoadSound(); },

  buildQuestion(qIndex){
    switch(qIndex){
      case 0: return buildZonesDiff({ type:"moyenne", scale:1, nOptions:[2,3], minVal:1, maxVal:20, targetMin:6, targetMax:14, deltaMin:2, deltaMax:4 });
      case 1: return buildZonesDiff({ type:"moyenne", scale:1, nOptions:[3,4], minVal:1, maxVal:35, targetMin:12, targetMax:26, deltaMin:3, deltaMax:6 });
      case 2: return buildZonesDiff({ type:"etendue", scale:1, nOptions:[2,3,4,5], minVal:0, maxVal:26, targetMin:4, targetMax:14, deltaMin:3, deltaMax:6 });
      case 3: return buildStatements();
      case 4: return buildZonesTarget();
    }
  },

  render(data, stageBodyEl, submitAnswer){
    if(data.mode==="statements") return renderStatements(data, stageBodyEl, submitAnswer);
    return renderZonesClick(data, stageBodyEl, submitAnswer);
  },

  feedbackHTML(data, result){
    if(data.mode==="zones-diff") return feedbackZonesDiff(data, result);
    if(data.mode==="zones-target") return feedbackZonesTarget(data, result);
    return feedbackStatements(data, result);
  }
};

function validateFallbacks(){
  function check(cond, msg){ if(!cond) console.error("[Mission Océan] Jeu de secours invalide : "+msg); }

  const fdm = FALLBACK_ZONES_DIFF_MOYENNE;
  fdm.series.forEach(function(s,i){
    check(checkSeries({type:"moyenne"}, s.vals, s.isOdd?fdm.oddTarget:fdm.commonTarget), "FALLBACK_ZONES_DIFF_MOYENNE série "+i);
  });
  check(fdm.series.filter(function(s){return s.isOdd;}).length===1, "FALLBACK_ZONES_DIFF_MOYENNE : une seule série différente attendue");
  check(fdm.series[fdm.correctIndex] && fdm.series[fdm.correctIndex].isOdd===true, "FALLBACK_ZONES_DIFF_MOYENNE correctIndex");

  const fde = FALLBACK_ZONES_DIFF_ETENDUE;
  fde.series.forEach(function(s,i){
    check(checkSeries({type:"etendue"}, s.vals, s.isOdd?fde.oddTarget:fde.commonTarget), "FALLBACK_ZONES_DIFF_ETENDUE série "+i);
  });
  check(fde.series.filter(function(s){return s.isOdd;}).length===1, "FALLBACK_ZONES_DIFF_ETENDUE : une seule série différente attendue");
  check(fde.series[fde.correctIndex] && fde.series[fde.correctIndex].isOdd===true, "FALLBACK_ZONES_DIFF_ETENDUE correctIndex");

  const fs = FALLBACK_STATEMENTS;
  check(checkSeries({type:fs.type}, fs.vals, fs.target), "FALLBACK_STATEMENTS : série de base incohérente avec target");
  const correctItems = fs.items.filter(function(it){return it.isCorrect;});
  check(correctItems.length===1, "FALLBACK_STATEMENTS : une seule affirmation correcte attendue");
  check(correctItems[0] && correctItems[0].value===fs.target, "FALLBACK_STATEMENTS : la valeur correcte doit être égale à target");
  check(fs.items[fs.correctIndex] && fs.items[fs.correctIndex].isCorrect===true, "FALLBACK_STATEMENTS correctIndex");

  const ft = FALLBACK_ZONES_TARGET;
  let matchCount=0, matchIndex=-1;
  ft.series.forEach(function(s,i){ if(checkSeries({type:ft.type}, s.vals, ft.target)){ matchCount++; matchIndex=i; } });
  check(matchCount===1, "FALLBACK_ZONES_TARGET : une seule série doit correspondre à target");
  check(matchIndex===ft.correctIndex, "FALLBACK_ZONES_TARGET correctIndex");
}
validateFallbacks();

armAmbientOnFirstInteraction();
initShell();
