<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Je relève le défi – 4ème S2 J1 · Image &amp; antécédent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --jour:#f5a623; --jour-fonce:#c47a10; --jour-clair:#fff5e0; --jour-pale:#f5d080;
  --bg:#fffdf7; --txt:#2b2010; --gris:#8b7a60;
  --vert:#22c55e; --vert-clair:#e7faec; --rouge:#ef4444; --rouge-clair:#fdeaea;
  --bleu:#3ab5d8;
  --n1:#f5a623; --n2:#b94040;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg); color: var(--txt);
  min-height: 100vh; padding: 20px 16px 50px;
  position: relative; overflow-x: hidden;
}
.bulle{ position:fixed; border-radius:50%; opacity:.30; z-index:0; pointer-events:none; }
.bulle-1{ width:200px; height:200px; background:#ffd84d; top:-60px; right:-50px; }
.bulle-2{ width:240px; height:240px; background:var(--jour-pale); bottom:-80px; left:-70px; }
.bulle-3{ width:150px; height:150px; background:#9be7a5; top:45%; right:-70px; }
.bulle-4{ width:120px; height:120px; background:#f7c8d4; top:200px; left:-30px; }
.wrap{ position:relative; z-index:1; max-width:700px; margin:0 auto; }

.header{ text-align:center; margin-bottom:24px; }
.logo-badge{
  display:inline-flex; align-items:center; gap:8px;
  background: var(--jour); color:#3a2c00;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.72rem;
  letter-spacing:1.5px; padding:6px 14px; border-radius:20px;
  box-shadow:0 3px 10px rgba(245,166,35,.4); margin-bottom:12px;
}
.logo-badge .dots{ display:inline-flex; gap:3px; }
.logo-badge .dots i{ width:7px; height:7px; border-radius:50%; background:#3a2c00; display:block; }
.logo-badge .dots i:nth-child(2){ opacity:.6; }
.logo-badge .dots i:nth-child(3){ opacity:.3; }
.semaine{
  font-family:'Orbitron',sans-serif; font-size:.78rem; letter-spacing:3px;
  color:var(--gris); text-transform:uppercase; margin-bottom:6px;
}
.titre{
  font-family:'Orbitron', sans-serif; font-weight:900;
  font-size:2.2rem; line-height:1.1; color:var(--txt); margin-bottom:6px;
}
.titre .accent{ color:var(--jour-fonce); }
.sous-titre{
  font-family:'Orbitron',sans-serif; font-size:.82rem; letter-spacing:2px;
  color:var(--gris); margin-bottom:14px;
}
.badge-mission{
  display:inline-block; background: var(--jour); color:#3a2c00;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:.82rem;
  letter-spacing:1px; padding:9px 22px; border-radius:24px;
  box-shadow:0 4px 14px rgba(245,166,35,.45);
}

.scoreboard{
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  background: #fff; border: 2px solid var(--jour);
  border-radius: 14px; padding: 12px; margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(245,166,35,.15);
}
.score-col{
  text-align: center; padding: 8px 4px;
  background: #faf7ef; border-radius: 10px;
  border: 1.5px solid #ece4cf;
}
.score-col.ok{ border-color: #9be7a5; }
.score-col.ok .num{ color: #157f3a; }
.score-col.rem{ border-color: var(--jour-pale); }
.score-col.rem .num{ color: var(--jour-fonce); }
.score-col.err{ border-color: #f5b5b5; }
.score-col.err .num{ color: #c0392b; }
.score-col .num{
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size: 1.8rem; line-height: 1;
}
.score-col .lbl{
  font-family:'Orbitron',sans-serif; font-size: .6rem;
  font-weight: 700; letter-spacing: 1.5px;
  color: var(--gris); margin-top: 4px; text-transform: uppercase;
}

.niveau-titre{
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size: .85rem; letter-spacing: 2px;
  color: #fff; padding: 8px 16px; border-radius: 8px;
  margin: 18px 0 12px; display: inline-block;
}
.niveau-titre.n1{ background: var(--n1); color: #3a2c00; }
.niveau-titre.n2{ background: var(--n2); }

.card{
  background: #fff;
  border: 2px solid #ece4cf;
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}
.card.done-ok{ border-color: var(--vert); background: var(--vert-clair); }
.card.done-ko{ border-color: var(--rouge); background: var(--rouge-clair); }

.card-head{
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.card-num{
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size: .85rem; color: var(--jour-fonce);
  letter-spacing: 1px;
}
.card-type{
  font-family:'Orbitron',sans-serif; font-size: .65rem;
  background: var(--jour-clair); color: var(--jour-fonce);
  padding: 4px 10px; border-radius: 12px;
  border: 1px solid var(--jour-pale);
  letter-spacing: 1px;
}

.enonce{
  background: var(--jour-clair);
  border-left: 3px solid var(--jour);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 12px;
  font-size: .95rem;
  line-height: 1.5;
  font-style: italic;
}
.enonce b{ color: var(--jour-fonce); font-style: normal; }
.enonce .frac{
  display: inline-block; vertical-align: middle;
  text-align: center; line-height: 1.1;
  font-size: 1.05em; padding: 0 3px;
}
.enonce .frac .num{ display: block; border-bottom: 1.5px solid currentColor; padding: 0 4px; }
.enonce .frac .den{ display: block; padding: 0 4px; }

.saisie{
  display: flex; align-items: center; justify-content: center;
  gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
  padding: 14px 8px;
  background: #faf7ef;
  border-radius: 10px;
}
.saisie .prefix{
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size: 1.2rem; color: var(--txt);
}
.saisie input{
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size: 1.2rem; text-align: center;
  width: 130px; padding: 10px;
  border: 2px solid #ece4cf;
  border-radius: 8px;
  background: #fff;
  color: var(--txt);
}
.saisie input:focus{
  outline: none; border-color: var(--jour);
  box-shadow: 0 0 0 3px rgba(245,166,35,.3);
}
.saisie input.good{ border-color: var(--vert); background: #f0faeb; }
.saisie input.bad{ border-color: var(--rouge); background: #fff0f0; }
.saisie input:disabled{ opacity: .85; }

.btns{ display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn{
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size: .8rem; letter-spacing: 1px;
  padding: 9px 18px; border: none; border-radius: 8px;
  cursor: pointer; color: #fff;
  transition: transform .12s;
}
.btn:active{ transform: scale(.96); }
.btn-valider{ background: var(--vert); }
.btn-indice{ background: var(--bleu); }
.btn-valider:not(:disabled){ animation: pulse-vert 1.6s ease-in-out infinite; }
@keyframes pulse-vert{
  0%,100%{ box-shadow: 0 0 5px rgba(34,197,94,.4); }
  50%    { box-shadow: 0 0 14px rgba(34,197,94,.8); }
}
.btn:disabled{ background: #ccc !important; cursor: not-allowed; animation: none; }

.indice{
  display: none; margin-top: 10px;
  padding: 10px 14px;
  background: #e8f6fb;
  border-left: 3px solid var(--bleu);
  border-radius: 8px;
  font-size: .85rem;
  color: #1a6e88;
  line-height: 1.5;
}
.indice.show{ display: block; }

.feedback{
  display: none; margin-top: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  font-size: .9rem;
  text-align: center;
}
.feedback.show{ display: block; }
.feedback.ok{ background: var(--vert-clair); color: #157f3a; border: 1px solid #9be7a5; }
.feedback.ko{ background: var(--rouge-clair); color: #c0392b; border: 1px solid #f5b5b5; }

.correction{
  display: none; margin-top: 10px;
  padding: 12px 14px;
  background: #fff8e6;
  border: 1px dashed var(--jour);
  border-radius: 8px;
  font-size: .88rem;
  color: #5a4500;
  line-height: 1.5;
}
.correction.show{ display: block; }
.correction b{ color: var(--jour-fonce); }
.correction .frac{
  display: inline-block; vertical-align: middle;
  text-align: center; line-height: 1.1;
  font-size: 1.05em; padding: 0 3px;
}
.correction .frac .num{ display: block; border-bottom: 1.5px solid currentColor; padding: 0 4px; }
.correction .frac .den{ display: block; padding: 0 4px; }

.btn-score-final-wrap{ text-align: center; margin-top: 24px; }
.btn-score-final{
  font-family:'Orbitron',sans-serif; font-weight:700; font-size: 1rem;
  letter-spacing: 1.5px; padding: 16px 32px;
  border: 2px solid var(--jour); border-radius: 14px;
  background: #fff; color: var(--gris);
  cursor: not-allowed; opacity: .55; transition: all .25s;
}
.btn-score-final:not(:disabled){
  background: linear-gradient(135deg, var(--jour), #fff8d0, var(--jour));
  background-size: 200% 100%;
  color: #3a2c00; cursor: pointer; opacity: 1;
  border-color: var(--jour-fonce);
  animation: shine 2s linear infinite, pulse-final 1.6s ease-in-out infinite;
  box-shadow: 0 6px 20px rgba(245,166,35,.4);
}
@keyframes shine{ 0%{ background-position: 0% 0; } 100%{ background-position: 200% 0; } }
@keyframes pulse-final{
  0%,100%{ box-shadow: 0 6px 20px rgba(245,166,35,.4); }
  50%    { box-shadow: 0 8px 28px rgba(245,166,35,.7); }
}

.results{
  display: none; position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at center, rgba(245,166,35,.97), rgba(196,122,16,.97));
  align-items: center; justify-content: center;
  padding: 20px; overflow-y: auto;
}
.results.show{ display: flex; animation: fadeIn .5s ease; }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

.results-card{
  background: #fff;
  border: 5px solid var(--jour-fonce);
  border-radius: 18px;
  padding: 30px 26px;
  max-width: 500px; width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  animation: pop .7s cubic-bezier(.18,.89,.32,1.6);
}
@keyframes pop{
  from{ transform: scale(.6); opacity: 0; }
  to  { transform: scale(1); opacity: 1; }
}
.results-titre{
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size: 1.7rem; color: var(--jour-fonce);
  letter-spacing: 2px; margin-bottom: 10px;
}
.results-score{
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size: 4rem; color: var(--jour-fonce);
  line-height: 1; margin: 10px 0;
}
.results-stars{ font-size: 2.2rem; letter-spacing: 8px; color: var(--jour); margin-bottom: 14px; }
.results-msg{
  background: var(--jour-clair); border-left: 4px solid var(--jour-fonce);
  border-radius: 8px; padding: 14px 16px;
  font-size: .95rem; color: #5a3a08;
  margin-bottom: 18px; line-height: 1.5;
}
.btn-rejouer{
  display: block; width: 100%;
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size: 1rem; letter-spacing: 1px;
  padding: 14px;
  background: var(--jour); color: #3a2c00;
  border: 2px solid var(--jour-fonce);
  border-radius: 12px; cursor: pointer;
}

.confetti{
  position: fixed; top: -10px; width: 8px; height: 14px;
  z-index: 99; pointer-events: none;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{ transform: translateY(0) rotateZ(0deg); opacity: 1; }
  100%{ transform: translateY(110vh) rotateZ(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="bulle bulle-1"></div>
<div class="bulle bulle-2"></div>
<div class="bulle bulle-3"></div>
<div class="bulle bulle-4"></div>

<div class="wrap">

  <div class="header">
    <div class="logo-badge">
      <span class="dots"><i></i><i></i><i></i></span>
      PAZAPA · MATHS · 4ÈME
    </div>
    <div class="semaine">Semaine 2 – Jour 1</div>
    <h1 class="titre">🏆 Je relève le <span class="accent">défi</span>&nbsp;!</h1>
    <div class="sous-titre">📊 Image &amp; antécédent par une fonction linéaire</div>
    <div class="badge-mission">▶ DÉFI MATHS 4ÈME</div>
  </div>

  <div class="scoreboard">
    <div class="score-col ok">
      <div class="num" id="cntOk">0</div>
      <div class="lbl">Réussis</div>
    </div>
    <div class="score-col rem">
      <div class="num" id="cntRem">6</div>
      <div class="lbl">Restants</div>
    </div>
    <div class="score-col err">
      <div class="num" id="cntErr">0</div>
      <div class="lbl">Erreurs</div>
    </div>
  </div>

  <div class="niveau-titre n1">▶ NIVEAU 1</div>
  <div id="zoneN1"></div>

  <div class="niveau-titre n2">▶ NIVEAU 2</div>
  <div id="zoneN2"></div>

  <div class="btn-score-final-wrap">
    <button class="btn-score-final" id="btnScoreFinal" disabled>🏆 VOIR MON SCORE FINAL</button>
  </div>

</div>

<div class="results" id="results">
  <div class="results-card">
    <div class="results-titre">🎯 RÉSULTAT FINAL</div>
    <div class="results-score" id="rScore">0 / 6</div>
    <div class="results-stars" id="rStars">★★★★★</div>
    <div class="results-msg" id="rMsg"></div>
    <button class="btn-rejouer" onclick="restart()">🔄 Recommencer</button>
  </div>
</div>

<script>
// Helper pour générer un span fraction
function frac(num, den){
  return '<span class="frac"><span class="num">' + num + '</span><span class="den">' + den + '</span></span>';
}

const DEFIS = [
  // NIVEAU 1 — 3 captures fournies
  {
    niveau: 1,
    type: 'Image',
    expr: 'On considère la fonction f définie sur ℝ par <b>f(x) = 2x</b>. Calculer l\u2019image de 7 par la fonction f.',
    label: 'f(7) =',
    answers: ['14', '+14'],
    indice: 'L\u2019image de 7 par f, c\u2019est f(7). Remplace x par 7 dans l\u2019expression de f(x).',
    correction: 'f(7) = 2 × 7 = <b>14</b>.'
  },
  {
    niveau: 1,
    type: 'Antécédent',
    expr: 'On considère la fonction f définie sur ℝ par <b>f(x) = 6x</b>. Calculer l\u2019antécédent de 36 par f.',
    label: 'L\u2019antécédent de 36 par f est',
    answers: ['6', '+6'],
    indice: 'On cherche x tel que 6x = 36. Divise 36 par 6.',
    correction: 'On résout 6x = 36 → x = 36 ÷ 6 = <b>6</b>.'
  },
  {
    niveau: 1,
    type: 'Antécédent',
    expr: 'On considère la fonction f définie sur ℝ par <b>f(x) = 5x</b>. Calculer l\u2019antécédent de 25 par f.',
    label: 'L\u2019antécédent de 25 par f est',
    answers: ['5', '+5'],
    indice: 'On cherche x tel que 5x = 25.',
    correction: 'On résout 5x = 25 → x = 25 ÷ 5 = <b>5</b>.'
  },
  // NIVEAU 2 — 3 captures fournies
  {
    niveau: 2,
    type: 'Image',
    expr: 'On considère la fonction f définie sur ℝ par <b>f(x) = −2x</b>. Calculer l\u2019image de −5 par la fonction f.',
    label: 'f(−5) =',
    answers: ['10', '+10'],
    indice: 'On remplace x par −5 dans −2x. Règle des signes : négatif × négatif = positif.',
    correction: 'f(−5) = (−2) × (−5) = <b>10</b>. (Négatif × négatif = positif.)'
  },
  {
    niveau: 2,
    type: 'Image',
    expr: 'On considère la fonction f définie sur ℝ par <b>f(x) = ' + frac(2,9) + 'x</b>. Calculer l\u2019image de 8 par la fonction f.',
    label: 'f(8) =',
    answers: ['16/9', '+16/9'],
    indice: 'f(8) = (2/9) × 8 = (2 × 8) / 9. Le résultat ne se simplifie pas (16 et 9 n\u2019ont pas de diviseur commun). Saisis ta réponse sous forme fractionnaire (ex : 16/9).',
    correction: 'f(8) = ' + frac(2,9) + ' × 8 = ' + frac('2 × 8', 9) + ' = <b>' + frac(16,9) + '</b>.'
  },
  {
    niveau: 2,
    type: 'Antécédent',
    expr: 'On considère la fonction f définie sur ℝ par <b>f(x) = ' + frac(5,2) + 'x</b>. Calculer l\u2019antécédent de 9 par f.',
    label: 'L\u2019antécédent de 9 par f est',
    answers: ['18/5', '+18/5'],
    indice: 'On cherche x tel que (5/2) x = 9. Donc x = 9 ÷ (5/2) = 9 × (2/5). Saisis sous forme fractionnaire (ex : 18/5).',
    correction: 'On résout ' + frac(5,2) + 'x = 9 → x = 9 × ' + frac(2,5) + ' = <b>' + frac(18,5) + '</b>.'
  }
];

const TOTAL = DEFIS.length;
const etat = DEFIS.map(function(){ return { validated:false, isOk:false }; });

document.getElementById('cntRem').textContent = TOTAL;

function normaliseReponse(s){
  // Enlève les espaces, remplace virgule par point, gère unaire + et −
  s = String(s).trim().replace(/\s+/g, '').replace(',', '.').replace(/−/g, '-');
  return s;
}

function checkAnswer(input, expected){
  const norm = normaliseReponse(input);
  // Test direct (string match)
  for (let i = 0; i < expected.length; i++){
    if (norm === expected[i]) return true;
  }
  // Test numérique : si la réponse attendue est une fraction "a/b", on accepte aussi la valeur décimale
  const expFirst = expected[0];
  if (expFirst.indexOf('/') >= 0){
    const parts = expFirst.split('/');
    const numerator = parseFloat(parts[0]);
    const denominator = parseFloat(parts[1]);
    if (!isNaN(numerator) && !isNaN(denominator) && denominator !== 0){
      const decimal = numerator / denominator;
      // Tester la version "a/b" saisie par l'élève
      if (norm.indexOf('/') >= 0){
        const userParts = norm.split('/');
        const userNum = parseFloat(userParts[0]);
        const userDen = parseFloat(userParts[1]);
        if (!isNaN(userNum) && !isNaN(userDen) && userDen !== 0){
          if (Math.abs(userNum/userDen - decimal) < 1e-6) return true;
        }
      } else {
        // Réponse décimale
        const userVal = parseFloat(norm);
        if (!isNaN(userVal) && Math.abs(userVal - decimal) < 1e-3) return true;
      }
    }
  } else {
    // Réponse attendue entière
    const expVal = parseFloat(expFirst);
    const userVal = parseFloat(norm);
    if (!isNaN(expVal) && !isNaN(userVal) && Math.abs(userVal - expVal) < 1e-6) return true;
  }
  return false;
}

function buildCard(i){
  const d = DEFIS[i];
  return '' +
    '<div class="card" id="card' + i + '">' +
    '  <div class="card-head">' +
    '    <div class="card-num">Défi ' + (i+1) + ' / ' + TOTAL + '</div>' +
    '    <div class="card-type">' + d.type + '</div>' +
    '  </div>' +
    '  <div class="enonce">' + d.expr + '</div>' +
    '  <div class="saisie">' +
    '    <span class="prefix">' + d.label + '</span>' +
    '    <input type="text" id="ans' + i + '" placeholder="?" autocomplete="off" inputmode="text">' +
    '  </div>' +
    '  <div class="btns">' +
    '    <button class="btn btn-valider" id="btnV' + i + '" onclick="valider(' + i + ')">✓ Valider</button>' +
    '    <button class="btn btn-indice" onclick="showIndice(' + i + ')">💡 Indice</button>' +
    '  </div>' +
    '  <div class="indice" id="ind' + i + '">' + d.indice + '</div>' +
    '  <div class="feedback" id="fb' + i + '"></div>' +
    '  <div class="correction" id="cor' + i + '"><b>📝 Correction :</b> ' + d.correction + '</div>' +
    '</div>';
}

// Construire l'affichage
const zN1 = document.getElementById('zoneN1');
const zN2 = document.getElementById('zoneN2');
for (let i = 0; i < TOTAL; i++){
  const html = buildCard(i);
  if (DEFIS[i].niveau === 1) zN1.insertAdjacentHTML('beforeend', html);
  else zN2.insertAdjacentHTML('beforeend', html);
}
for (let i = 0; i < TOTAL; i++){
  document.getElementById('ans' + i).addEventListener('keydown', function(e){
    if (e.key === 'Enter') valider(i);
  });
}

function showIndice(i){
  document.getElementById('ind' + i).classList.add('show');
}

function valider(i){
  if (etat[i].validated) return;
  const inp = document.getElementById('ans' + i);
  const val = inp.value.trim();
  if (val === ''){ inp.focus(); return; }

  etat[i].validated = true;
  const isOk = checkAnswer(val, DEFIS[i].answers);
  etat[i].isOk = isOk;

  inp.disabled = true;
  inp.classList.add(isOk ? 'good' : 'bad');
  document.getElementById('btnV' + i).disabled = true;

  const fb = document.getElementById('fb' + i);
  fb.className = 'feedback show ' + (isOk ? 'ok' : 'ko');
  fb.innerHTML = isOk ? '✅ Bonne réponse&nbsp;!' : '❌ Pas tout à fait. Regarde la correction.';

  document.getElementById('cor' + i).classList.add('show');
  document.getElementById('card' + i).classList.add(isOk ? 'done-ok' : 'done-ko');

  updateScore();
}

function updateScore(){
  let ok = 0, err = 0, done = 0;
  for (let i = 0; i < TOTAL; i++){
    if (etat[i].validated){
      done++;
      if (etat[i].isOk) ok++; else err++;
    }
  }
  document.getElementById('cntOk').textContent = ok;
  document.getElementById('cntErr').textContent = err;
  document.getElementById('cntRem').textContent = TOTAL - done;
  document.getElementById('btnScoreFinal').disabled = (done < TOTAL);
}

document.getElementById('btnScoreFinal').onclick = function(){
  const ok = etat.filter(function(e){ return e.isOk; }).length;
  document.getElementById('rScore').textContent = ok + ' / ' + TOTAL;
  const ratio = ok / TOTAL;
  let stars, msg;
  if (ratio === 1){ stars = '★★★★★'; msg = '🏆 <b>Parfait&nbsp;!</b> Tu maîtrises image et antécédent.'; }
  else if (ratio >= .8){ stars = '★★★★☆'; msg = '✨ <b>Très bien&nbsp;!</b>'; }
  else if (ratio >= .5){ stars = '★★★☆☆'; msg = '👍 <b>Pas mal&nbsp;!</b> Reprends les erreurs.'; }
  else { stars = '★★☆☆☆'; msg = '💪 <b>Bon courage&nbsp;!</b> Relis les corrections.'; }
  document.getElementById('rStars').textContent = stars;
  document.getElementById('rMsg').innerHTML = msg;
  document.getElementById('results').classList.add('show');
  if (ok >= 5) launchConfetti();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

function launchConfetti(){
  const colors = ['#f5a623','#8dc63f','#3ab5d8','#f28b82','#f5c518','#fff'];
  for (let i = 0; i < 60; i++){
    (function(idx){
      setTimeout(function(){
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = (Math.random() * 100) + 'vw';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration = (2 + Math.random() * 2.5) + 's';
        c.style.transform = 'rotateZ(' + Math.floor(Math.random()*360) + 'deg)';
        document.body.appendChild(c);
        setTimeout(function(){ c.remove(); }, 5000);
      }, idx * 30);
    })(i);
  }
}

function restart(){
  for (let i = 0; i < TOTAL; i++){
    etat[i] = { validated:false, isOk:false };
    const inp = document.getElementById('ans' + i);
    inp.value = ''; inp.disabled = false;
    inp.classList.remove('good','bad');
    document.getElementById('btnV' + i).disabled = false;
    document.getElementById('fb' + i).className = 'feedback';
    document.getElementById('cor' + i).classList.remove('show');
    document.getElementById('ind' + i).classList.remove('show');
    document.getElementById('card' + i).classList.remove('done-ok','done-ko');
  }
  document.getElementById('results').classList.remove('show');
  updateScore();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
