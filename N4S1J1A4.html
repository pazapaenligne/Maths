<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Série d'exercices — Niveau 3 — Calcul littéral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --main:#f5a623; --titre:#a8660b; --light:#fff2dc; --border:#f5c98a;
         --badgetxt:#5a3500; --ink:#2a2a2a; --soft:#a8660b; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'JetBrains Mono',monospace;background:#ffffff;color:var(--ink);line-height:1.55;padding:14px;max-width:860px;margin:0 auto;}
  .hero{background:var(--light);border:3px solid var(--border);border-radius:20px;padding:24px 20px;text-align:center;margin-bottom:16px;}
  .brand-pill{display:inline-flex;align-items:center;gap:9px;background:var(--main);color:var(--badgetxt);font-weight:800;font-size:.92rem;letter-spacing:1px;padding:9px 22px;border-radius:30px;margin-bottom:16px;}
  .brand-pill .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .brand-pill .d1{background:rgba(90,53,0,.30);}
  .brand-pill .d2{background:var(--titre);}
  .week-label{color:var(--soft);font-weight:700;font-size:.86rem;letter-spacing:2px;margin-bottom:8px;}
  h1{font-weight:800;line-height:1.15;margin-bottom:10px;}
  h1 .serie{display:block;font-size:1.55rem;color:var(--titre);}
  h1 .niv{display:block;font-size:1.7rem;color:var(--ink);}
  h1 .niv .exp{color:var(--titre);font-size:1.1rem;}
  .subtitle{font-size:.95rem;color:var(--soft);font-weight:500;margin-bottom:16px;}
  .level-pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .pill{font-weight:800;font-size:.85rem;letter-spacing:.5px;padding:11px 20px;border-radius:14px;border:3px solid var(--border);background:#fff;color:var(--soft);min-width:118px;}
  .pill.active{background:var(--main);color:var(--badgetxt);border-color:var(--titre);box-shadow:0 4px 0 rgba(0,0,0,.12);}
  .level-pills .pill{cursor:default;}
  .scoreboard{background:#fff;border:3px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);}
  .sb-row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;}
  .sb-item{flex:1;min-width:90px;text-align:center;background:var(--light);border-radius:11px;padding:8px 4px;}
  .sb-item b{display:block;font-size:1.25rem;color:var(--titre);}
  .sb-item small{font-size:.7rem;color:var(--soft);font-weight:600;}
  .xp-wrap{margin-top:10px;}
  .xp-bar{height:14px;background:var(--light);border-radius:30px;overflow:hidden;border:2px solid var(--border);}
  .xp-fill{height:100%;width:0;background:var(--main);transition:width .4s ease;}
  .xp-txt{text-align:center;font-size:.78rem;color:var(--soft);font-weight:700;margin-top:5px;}
  .card{background:#fff;border:3px solid var(--border);border-radius:18px;padding:18px 16px;margin-bottom:16px;transition:.2s;}
  .card.done{border-color:var(--main);background:var(--light);}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .card-num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--main);color:var(--badgetxt);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.95rem;}
  .card-title{font-weight:700;font-size:.96rem;color:var(--titre);}
  .prompt{font-size:.95rem;margin-bottom:12px;}
  .prompt b{color:var(--titre);}
  .fig-wrap{display:flex;justify-content:center;margin:12px 0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;overflow-x:auto;}
  .field{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:8px 0;}
  .field label{font-size:.9rem;font-weight:600;flex:1;min-width:160px;}
  .field .unit{font-weight:700;color:var(--soft);}
  input[type=text]{font-family:inherit;font-size:1.05rem;font-weight:700;width:140px;padding:11px 12px;border:3px solid var(--border);border-radius:11px;text-align:center;color:var(--ink);background:#fff;}
  input[type=text]:focus{outline:none;border-color:var(--main);}
  .choices{display:flex;flex-direction:column;gap:9px;}
  .choice{font-family:inherit;text-align:left;font-size:.95rem;font-weight:600;padding:13px 14px;border:3px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink);transition:.12s;}
  .choice:hover{border-color:var(--main);}
  .choice.sel{background:var(--main);color:var(--badgetxt);border-color:var(--titre);}
  .choice.good{background:#dff5c6;border-color:#8dc63f;color:#3a4d00;}
  .choice.bad{background:#ffe1dd;border-color:#f28b82;color:#7a1c14;}
  .btn{font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;border:none;border-radius:12px;padding:13px 20px;background:var(--main);color:var(--badgetxt);box-shadow:0 4px 0 rgba(0,0,0,.14);transition:.1s;margin-top:6px;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14);}
  .btn.sec{background:#fff;color:var(--soft);border:3px solid var(--border);box-shadow:none;}
  .btn.retry{background:#ffe2b0;color:var(--badgetxt);}
  .btn.hint-btn{background:#fff;color:var(--soft);border:3px solid var(--border);box-shadow:none;margin-left:8px;}
  .hint{display:none;margin-top:10px;background:#fffbeb;border:2px dashed var(--border);border-radius:11px;padding:11px 13px;font-size:.88rem;color:var(--titre);line-height:1.6;}
  .hint.show{display:block;}
  .fb{margin-top:12px;font-weight:700;font-size:.92rem;padding:10px 12px;border-radius:11px;display:none;}
  .fb.ok{display:block;background:#dff5c6;color:#3a4d00;border:2px solid #8dc63f;}
  .fb.no{display:block;background:#ffe1dd;color:#7a1c14;border:2px solid #f28b82;}
  .sol{display:none;margin-top:10px;background:var(--light);border:2px dashed var(--titre);border-radius:11px;padding:11px 13px;font-size:.9rem;}
  .sol.show{display:block;}
  .sol b{color:var(--titre);}
  .ext-card .ext-frame{width:100%;border:2px solid var(--border);border-radius:12px;background:#fff;margin:10px 0;}
  .ext-note{font-size:.82rem;color:var(--soft);margin-bottom:8px;}
  .results{display:none;text-align:center;background:var(--light);border:3px solid var(--main);border-radius:20px;padding:28px 20px;margin-top:10px;}
  .results.show{display:block;}
  .results h2{color:var(--titre);font-size:1.4rem;margin-bottom:10px;}
  .results .big{font-size:2.4rem;font-weight:800;color:var(--titre);margin:8px 0;}
  .footer-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div class="hero">
  <div class="brand-pill"><span class="dot d1"></span><span class="dot d2"></span>PAZAPA · MATHS · 4ÈME</div>
  <div class="week-label">SEMAINE 1 — JOUR 1</div>
  <h1><span class="serie">✏️ Série d'exercices</span><span class="niv">Niveau 3 <span class="exp">· Expert</span></span></h1>
  <div class="subtitle">Calcul littéral : produire une expression</div>
  <div class="level-pills"><span class="pill">NIVEAU 1</span><span class="pill">NIVEAU 2</span><span class="pill active">NIVEAU 3</span></div>
</div>
<div class="scoreboard">
  <div class="sb-row">
    <div class="sb-item"><b id="sb-ok">0</b><small>Réussies</small></div>
    <div class="sb-item"><b id="sb-rem">0</b><small>Restantes</small></div>
    <div class="sb-item"><b id="sb-err">0</b><small>Erreurs</small></div>
  </div>
  <div class="xp-wrap">
    <div class="xp-bar"><div class="xp-fill" id="xp"></div></div>
    <div class="xp-txt" id="xp-txt">0 / 0</div>
  </div>
</div>
<div id="exos"></div>
<div class="results" id="results">
  <h2>🎉 Niveau terminé !</h2>
  <div class="big" id="res-score">0 / 0</div>
  <p id="res-msg"></p>
</div>
<div class="footer-actions">
  <button class="btn sec" onclick="resetLevel()">↻ Recommencer</button>
</div>
<script>
function tableur(cols, rows){
  var th='border:2px solid #b9c2c9;background:#e3e7ea;color:#475259;padding:7px 14px;font-weight:800;';
  var td='border:2px solid #b9c2c9;background:#fff;padding:8px 16px;font-weight:700;min-width:74px;';
  var s='<table style="border-collapse:collapse;font-size:.88rem;text-align:center">';
  s+='<tr><th style="'+th+'width:34px;"></th>';
  for(var c=0;c<cols.length;c++) s+='<th style="'+th+'">'+cols[c]+'</th>';
  s+='</tr>';
  for(var r=0;r<rows.length;r++){
    s+='<tr><th style="'+th+'">'+(r+1)+'</th>';
    for(c=0;c<cols.length;c++) s+='<td style="'+td+'">'+rows[r][c]+'</td>';
    s+='</tr>';
  }
  s+='</table>';
  return s;
}
function valTable(labels, rows){
  var th='border:2px solid #f5c98a;background:#fff2dc;color:#a8660b;padding:7px 14px;font-weight:800;';
  var td='border:2px solid #f5c98a;background:#fff;padding:8px 16px;font-weight:700;min-width:54px;';
  var s='<table style="border-collapse:collapse;font-size:.9rem;text-align:center">';
  for(var r=0;r<rows.length;r++){
    s+='<tr><th style="'+th+'">'+labels[r]+'</th>';
    for(var c=0;c<rows[r].length;c++) s+='<td style="'+td+'">'+rows[r][c]+'</td>';
    s+='</tr>';
  }
  return s+'</table>';
}
function rectFig(wLbl,hLbl){
  return '<svg viewBox="0 0 300 150" width="100%" style="max-width:300px" xmlns="http://www.w3.org/2000/svg">'
    +'<rect x="40" y="30" width="220" height="90" fill="#fff2dc" stroke="#a8660b" stroke-width="2.5"/>'
    +'<text x="150" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#a8660b" font-family="JetBrains Mono, monospace">'+wLbl+'</text>'
    +'<text x="24" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#a8660b" font-family="JetBrains Mono, monospace">'+hLbl+'</text>'
    +'</svg>';
}
var EXOS = [
  { kind:'multi', title:'Défi · modèle figuratif',
    prompt:'Un rectangle a pour largeur <b>x</b> et pour longueur <b>x + 3</b>. Son périmètre s\'écrit sous la forme <b>P = a\u00d7x + b</b>.',
    figure: rectFig('x + 3','x'),
    fields:[ {label:'a =', ans:4, tol:0.001, unit:''},
             {label:'b =', ans:6, tol:0.001, unit:''},
             {label:'Aire du rectangle pour x = 5 :', ans:40, tol:0.001, unit:''} ],
    hint:'Le p\u00e9rim\u00e8tre, c\'est le tour : ajoute les quatre c\u00f4t\u00e9s, ou calcule 2 fois (longueur + largeur), puis regroupe les x. Pour l\'aire, multiplie longueur par largeur avant de remplacer x.',
    sol:'P = 2 \u00d7 [x + (x + 3)] = 2 \u00d7 (2x + 3) = <b>4x + 6</b> (a = 4, b = 6).<br>Aire = x \u00d7 (x + 3) ; pour x = 5 : 5 \u00d7 8 = <b>40</b>.' },
  { kind:'qcm', title:'Défi · aire d\'une figure composée',
    prompt:'Une figure est formée d\'un <b>carré de c\u00f4té x</b> et d\'un <b>rectangle de c\u00f4tés x et 5</b> collés l\'un \u00e0 l\'autre. Quelle expression donne l\'<b>aire totale</b> ?',
    choices:['x\u00b2 + 5x','5x\u00b2','x\u00b2 + 5','6x'], ans:0,
    hint:'Calcule s\u00e9par\u00e9ment l\'aire du carr\u00e9 (c\u00f4t\u00e9 \u00d7 c\u00f4t\u00e9) et celle du rectangle (longueur \u00d7 largeur), puis additionne les deux aires.',
    sol:'Aire du carré = x\u00b2 ; aire du rectangle = 5x. Total : <b>x\u00b2 + 5x</b>.' },
  { kind:'multi', title:'Défi · deux programmes, même résultat ?',
    prompt:'Programme A : \u00ab multiplier par 2 puis ajouter 10 \u00bb. Programme B : \u00ab ajouter 5 puis multiplier par 2 \u00bb. Teste avec le nombre <b>7</b>, puis réponds <b>1</b> (OUI) ou <b>0</b> (NON) \u00e0 la dernière question.',
    fields:[ {label:'Résultat du programme A pour 7 :', ans:24, tol:0.001, unit:''},
             {label:'Résultat du programme B pour 7 :', ans:24, tol:0.001, unit:''},
             {label:'Donnent-ils toujours le même résultat ?', ans:1, tol:0.001, unit:''} ],
    hint:'Applique chaque programme \u00e9tape par \u00e9tape au nombre choisi, en respectant l\'ordre. Pour la derni\u00e8re question, \u00e9cris l\'expression de chaque programme et compare-les.',
    sol:'A : 2\u00d77 + 10 = <b>24</b>. B : (7 + 5)\u00d72 = <b>24</b>.<br>A donne 2x + 10 et B donne 2(x + 5) = 2x + 10 : ce sont les <b>mêmes expressions</b> \u2192 toujours le même résultat (réponse 1).' },
  { kind:'ext', title:'Produire une expression',
    note:'Entra\u00eenement en ligne : produis des expressions littérales. Termine l\'activité puis clique sur \u00ab J\'ai terminé \u00bb.',
    url:'https://www.jeuxmaths.fr/exercice-de-math-produireuneexpression1.html', height:560 },
  { kind:'ext', title:'Mission Indigo',
    note:'Exercice interactif.Résous-le, puis clique sur \u00ab J\'ai terminé \u00bb.',
    url:'https://www.hatier-clic.fr/miniliens/mie/9782401082175/C03_ex35_eleve/index.html', height:560 }
];
var state=[], errCount=0;
function genExercises(){ state=EXOS.map(function(){return {done:false,sel:null,wrong:false};}); errCount=0; buildAll(); updateScore(); document.getElementById('results').classList.remove('show'); }
function buildAll(){
  var box=document.getElementById('exos'); box.innerHTML='';
  EXOS.forEach(function(ex,idx){
    var c=document.createElement('div'); c.className='card'+(ex.kind==='ext'?' ext-card':''); c.id='card'+idx;
    var inner='<div class="card-head"><div class="card-num">'+(idx+1)+'</div><div class="card-title">'+ex.title+'</div></div>';
    if(ex.kind==='ext'){
      inner+='<div class="ext-note">'+ex.note+'</div>';
      inner+='<iframe class="ext-frame" style="height:'+(ex.height||520)+'px" src="'+ex.url+'" loading="lazy" allowfullscreen></iframe>';
      inner+='<button class="btn" id="extbtn'+idx+'" onclick="markExtDone('+idx+')">✓ J\'ai terminé</button>';
      inner+='<div class="fb" id="fb'+idx+'"></div>';
    } else {
      inner+='<div class="prompt">'+ex.prompt+'</div>';
      if(ex.figure) inner+='<div class="fig-wrap">'+ex.figure+'</div>';
      if(ex.kind==='num'){
        inner+='<div class="field"><input type="text" id="in'+idx+'_0" inputmode="decimal" autocomplete="off">'+(ex.unit?'<span class="unit">'+ex.unit+'</span>':'')+'</div>';
      } else if(ex.kind==='multi'){
        ex.fields.forEach(function(f,fi){ inner+='<div class="field"><label>'+f.label+'</label><input type="text" id="in'+idx+'_'+fi+'" inputmode="decimal" autocomplete="off">'+(f.unit?'<span class="unit">'+f.unit+'</span>':'')+'</div>'; });
      } else if(ex.kind==='qcm'){
        inner+='<div class="choices" id="ch'+idx+'">';
        ex.choices.forEach(function(ch,ci){ inner+='<button class="choice" id="ch'+idx+'_'+ci+'" onclick="selectQcm('+idx+','+ci+')">'+ch+'</button>'; });
        inner+='</div>';
      }
      inner+='<button class="btn" id="vbtn'+idx+'" onclick="checkExo('+idx+')">Valider</button>';
      if(ex.hint) inner+='<button class="btn hint-btn" id="hbtn'+idx+'" onclick="showHint('+idx+')">\uD83D\uDCA1 Indice</button>';
      inner+='<button class="btn sec hidden" id="ebtn'+idx+'" onclick="showSol('+idx+')">Voir l\'explication</button>';
      inner+='<div class="fb" id="fb'+idx+'"></div>';
      if(ex.hint) inner+='<div class="hint" id="hint'+idx+'">'+ex.hint+'</div>';
      inner+='<div class="sol" id="sol'+idx+'"><b>Solution :</b><br>'+ex.sol+'</div>';
    }
    c.innerHTML=inner; box.appendChild(c);
  });
}
function parseNum(v){ if(v===null||v===undefined) return NaN; v=(''+v).trim().replace(',','.').replace(/\s/g,'').replace('%',''); if(v==='') return NaN; return parseFloat(v); }
function selectQcm(idx,ci){ if(state[idx].done) return; state[idx].sel=ci; var ex=EXOS[idx]; for(var i=0;i<ex.choices.length;i++) document.getElementById('ch'+idx+'_'+i).classList.remove('sel'); document.getElementById('ch'+idx+'_'+ci).classList.add('sel'); }
function checkExo(idx){
  if(state[idx].done) return; var ex=EXOS[idx], ok=true;
  if(ex.kind==='num'){ var v=parseNum(document.getElementById('in'+idx+'_0').value); ok=!isNaN(v)&&Math.abs(v-ex.ans)<=ex.tol; }
  else if(ex.kind==='multi'){ for(var fi=0;fi<ex.fields.length;fi++){ var val=parseNum(document.getElementById('in'+idx+'_'+fi).value); if(isNaN(val)||Math.abs(val-ex.fields[fi].ans)>ex.fields[fi].tol) ok=false; } }
  else if(ex.kind==='qcm'){ if(state[idx].sel===null){ flash(idx,false,'Choisis d\'abord une réponse.'); return; } ok=(state[idx].sel===ex.ans); }
  if(ok){
    state[idx].done=true; document.getElementById('card'+idx).classList.add('done');
    document.getElementById('vbtn'+idx).classList.add('hidden');
    var eb=document.getElementById('ebtn'+idx); if(eb) eb.classList.remove('hidden');
    if(ex.kind==='qcm') document.getElementById('ch'+idx+'_'+ex.ans).classList.add('good');
    flash(idx,true,'✓ Bravo, c\'est juste !');
  } else {
    if(!state[idx].wrong){ state[idx].wrong=true; errCount++; }
    if(ex.kind==='qcm' && state[idx].sel!==null){ var b=document.getElementById('ch'+idx+'_'+state[idx].sel); b.classList.remove('sel'); b.classList.add('bad'); setTimeout(function(){ if(!state[idx].done) b.classList.remove('bad'); },900); }
    flash(idx,false,'✗ Pas encore. Vérifie ton calcul et réessaye.');
    var vb=document.getElementById('vbtn'+idx); vb.textContent='↻ Réessayer'; vb.classList.add('retry');
  }
  updateScore();
}
function markExtDone(idx){ if(state[idx].done) return; state[idx].done=true; document.getElementById('card'+idx).classList.add('done'); document.getElementById('extbtn'+idx).classList.add('hidden'); flash(idx,true,'✓ Activité validée !'); updateScore(); }
function showHint(idx){ var hb=document.getElementById('hint'+idx); if(!hb) return; var b=document.getElementById('hbtn'+idx); var open=hb.classList.toggle('show'); if(b) b.innerHTML= open ? '\uD83D\uDCA1 Masquer l\'indice' : '\uD83D\uDCA1 Indice'; }
function showSol(idx){ var s=document.getElementById('sol'+idx); if(!s) return; var b=document.getElementById('ebtn'+idx); var open=s.classList.toggle('show'); if(b) b.textContent= open ? 'Masquer l\'explication' : 'Voir l\'explication'; }
function flash(idx,good,msg){ var fb=document.getElementById('fb'+idx); fb.className='fb '+(good?'ok':'no'); fb.textContent=msg; }
function updateScore(){
  var done=state.filter(function(s){return s.done;}).length, tot=EXOS.length;
  document.getElementById('sb-ok').textContent=done; document.getElementById('sb-rem').textContent=(tot-done); document.getElementById('sb-err').textContent=errCount;
  var pct=tot?Math.round(done/tot*100):0; document.getElementById('xp').style.width=pct+'%'; document.getElementById('xp-txt').textContent=done+' / '+tot;
  if(done===tot && tot>0) showResults(done,tot); else document.getElementById('results').classList.remove('show');
}
function showResults(done,tot){
  var r=document.getElementById('results'); document.getElementById('res-score').textContent=done+' / '+tot;
  var msg; if(errCount===0) msg='Sans-faute ! Tu sais produire des expressions littérales. ✍️'; else if(errCount<=3) msg='Très bien joué, tu as su rebondir après les erreurs. 💪'; else msg='Niveau terminé ! Recommence pour viser le sans-faute. ✨';
  document.getElementById('res-msg').textContent=msg; r.classList.add('show'); r.scrollIntoView({behavior:'smooth',block:'center'});
}
function resetLevel(){ genExercises(); window.scrollTo({top:0,behavior:'smooth'}); }
genExercises();
</script>
</body>
</html>
