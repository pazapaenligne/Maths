<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa Maths – Semaine 1 Jour 1 – Lire et écrire les grands nombres</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--day-color:#f5a623;--day-dark:#c47a10;--day-light:#fff5e0;--day-border:#f5d080;--day-glow:rgba(245,166,35,.3);}
    :root{--bg:#fffdf7;--surface:#ffffff;--border:#e8e4d9;--yellow:#f5c518;--green:#8dc63f;--blue:#3ab5d8;--pink:#f28b82;--orange:#f5a623;--text:#1a1d23;--muted:#8a8f9a;--radius:16px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.6rem 1rem 3.5rem;position:relative;overflow-x:hidden;letter-spacing:.02em;word-spacing:.06em;}
    body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
    body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;width:260px;height:260px;background:var(--day-color);bottom:-60px;left:-60px;pointer-events:none;}
    .bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
    .bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;background:var(--pink);top:200px;left:-30px;pointer-events:none;}
    header{text-align:center;margin-bottom:1.4rem;position:relative;z-index:1;max-width:100%;}
    .logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);color:#000;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;white-space:nowrap;}
    .logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .week-label{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:.5rem;}
    h1{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:800;line-height:1.3;word-break:break-word;}
    h1 .hl{color:var(--day-color);}
    .subtitle{color:var(--muted);font-size:clamp(.8rem,2.5vw,.88rem);margin-top:.4rem;font-family:'JetBrains Mono',monospace;word-break:break-word;}
    .scorebar{position:sticky;top:0;z-index:5;width:100%;max-width:760px;background:var(--surface);border:2px solid var(--border);border-radius:99px;padding:.5rem .9rem;margin-bottom:1.4rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.06);}
    .scorebar .sb-label{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;color:var(--day-dark);white-space:nowrap;}
    .sb-track{flex:1;min-width:120px;height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
    .sb-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--day-color),var(--yellow));border-radius:99px;transition:width .5s ease;}
    .chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:99px;font-size:.74rem;font-family:'JetBrains Mono',monospace;white-space:nowrap;border:1.5px solid var(--border);background:var(--bg);font-weight:600;}
    .chip .dot{width:8px;height:8px;border-radius:50%;}
    .chip.correct .dot{background:var(--green);}
    .chip.wrong .dot{background:var(--pink);}
    .card{width:100%;max-width:760px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:1.8rem 1.6rem 1.4rem;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);animation:fadeUp .4s ease both;margin-bottom:1.4rem;}
    .card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day-color),var(--yellow),var(--orange),var(--pink));}
    .q-num{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.1em;}
    .theme-badge{display:inline-block;font-size:.64rem;font-weight:700;padding:.15rem .6rem;border-radius:4px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.7rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);white-space:nowrap;}
    .eq-box{background:var(--day-light);border:2px solid var(--day-border);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1rem,3.2vw,1.35rem);font-weight:700;color:var(--day-dark);text-align:center;line-height:1.5;word-break:break-word;}
    .method-box{background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day-color);border-radius:8px;padding:.75rem 1rem;margin-bottom:1.1rem;font-size:clamp(.78rem,2.4vw,.84rem);font-family:'JetBrains Mono',monospace;color:var(--day-dark);line-height:1.8;word-break:break-word;}
    .method-box strong{color:var(--day-color);}
    .field-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;position:relative;z-index:2;margin-bottom:.7rem;}
    .field-lbl{font-family:'JetBrains Mono',monospace;font-weight:700;flex:1;font-size:clamp(.86rem,2.6vw,1rem);word-break:break-word;}
    .ans-input{flex:1;min-width:120px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.02rem;font-weight:600;padding:.6rem .9rem;outline:none;transition:border-color .2s;min-height:44px;}
    .ans-input:focus{border-color:var(--day-color);}
    .ans-input.correct-input{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .ans-input.wrong-input{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .ans-num{max-width:120px;text-align:center;}
    .ans-long{width:100%;}
    .opt-list{display:flex;flex-direction:column;gap:.55rem;margin-bottom:.3rem;position:relative;z-index:2;}
    .opt-btn{display:flex;align-items:center;gap:.7rem;text-align:left;padding:.7rem .95rem;border:2px solid var(--border);border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(.88rem,2.6vw,.95rem);font-weight:600;cursor:pointer;background:var(--bg);color:var(--text);min-height:44px;line-height:1.6;word-break:break-word;transition:transform .12s,border-color .15s,background .15s;}
    .opt-btn:hover:not(.locked){border-color:var(--day-color);}
    .opt-btn:active{transform:scale(.98);}
    .opt-btn.selected{border-color:var(--day-color);background:var(--day-light);}
    .opt-btn.correct-opt{border-color:var(--green);background:#f0faeb;color:#2f6e10;}
    .opt-btn.wrong-opt{border-color:var(--pink);background:#fff0ef;color:#c0392b;}
    .opt-btn.locked{cursor:default;}
    .opt-mark{font-family:'JetBrains Mono',monospace;font-weight:700;width:1.6rem;flex-shrink:0;text-align:center;color:var(--day-dark);}
    .qcm-num{font-family:'JetBrains Mono',monospace;font-weight:700;margin-bottom:.5rem;font-size:clamp(1rem,3vw,1.2rem);color:var(--text);}
    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;position:relative;z-index:2;margin-top:.6rem;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.3rem;border-radius:10px;font-family:Arial,sans-serif;font-size:clamp(.85rem,2.5vw,.95rem);font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;position:relative;z-index:2;min-height:44px;}
    .btn:active{transform:scale(.96);}
    .btn:disabled{opacity:.38;cursor:default;}
    .btn-primary{background:var(--day-color);color:#fff;box-shadow:0 3px 10px var(--day-glow);}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px var(--day-glow);}
    .btn-hint{background:var(--orange);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border);}
    .btn-ghost:hover:not(:disabled){border-color:var(--day-color);color:var(--text);}
    .hint-box{margin-top:.9rem;background:#fffbeb;border:1.5px dashed var(--yellow);border-radius:10px;padding:.75rem 1rem;font-size:clamp(.8rem,2.4vw,.85rem);color:#7a6010;display:none;line-height:1.8;font-family:'JetBrains Mono',monospace;word-break:break-word;}
    .hint-box.show{display:block;}
    .feedback{margin-top:1.1rem;padding:.8rem 1rem;border-radius:10px;font-size:clamp(.86rem,2.5vw,.92rem);display:none;align-items:flex-start;gap:.7rem;line-height:1.8;}
    .feedback.show{display:flex;}
    .feedback.ok{background:#f0faeb;border:1.5px solid var(--green);color:#2f6e10;}
    .feedback.ko{background:#fff0ef;border:1.5px solid var(--pink);color:#c0392b;}
    .feedback-icon{font-size:1.4rem;flex-shrink:0;}
    .feedback-detail{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:clamp(.76rem,2.3vw,.82rem);margin-top:.3rem;line-height:1.8;word-break:break-word;}
    .global{width:100%;max-width:760px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 1.6rem;text-align:center;position:relative;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,.06);}
    .global-score{font-size:clamp(2.6rem,11vw,4.5rem);font-weight:800;line-height:1;margin:.4rem 0;}
    .global-score .s-num{color:var(--day-color);}
    .stars{font-size:1.9rem;margin:.3rem 0 .9rem;}
    .global-msg{color:var(--text);font-size:clamp(.86rem,2.6vw,.94rem);margin-bottom:1.4rem;font-weight:600;line-height:1.7;word-break:break-word;min-height:1.4rem;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .card,.global{animation:fadeUp .4s ease both;}
    @media(max-width:480px){
      body{padding:1.2rem .75rem 3rem;}
      .card{padding:1.3rem 1.1rem;}
      .field-row{flex-direction:column;align-items:stretch;}
      .ans-input,.ans-num,.ans-long{width:100%;max-width:none;min-width:0;}
      .btn-row .btn{flex:1 1 100%;width:100%;}
    }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>

  <header>
    <div class="logo-badge">
      <span class="logo-dot" style="background:#f5c518"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Pazapa &middot; Maths &middot; 6&egrave;me
    </div>
    <div class="week-label">Semaine 1 &ndash; Jour 1</div>
    <h1>Lire et écrire les <span class="hl">grands nombres</span></h1>
    <p class="subtitle">3 exercices &middot; numération &middot; niveau 6&egrave;me</p>
  </header>

  <div class="scorebar">
    <span class="sb-label" id="sb-label">0 / 3 exercices réussis</span>
    <div class="sb-track"><div class="sb-fill" id="sb-fill"></div></div>
    <span class="chip correct"><span class="dot"></span><span id="sb-ok">0</span></span>
    <span class="chip wrong"><span class="dot"></span><span id="sb-ko">0</span></span>
  </div>

  <div id="exos"></div>

  <div class="global">
    <div class="q-num">Bilan</div>
    <div class="global-score"><span class="s-num" id="g-num">0</span>/3</div>
    <div class="stars" id="g-stars">&#9734;&#9734;&#9734;&#9734;&#9734;</div>
    <div class="global-msg" id="g-msg">Réponds aux 3 exercices puis vérifie-les pour voir ton bilan.</div>
    <button class="btn btn-primary" onclick="restartAll()" style="margin:0 auto;display:flex;">&#128260; Tout recommencer</button>
  </div>

<script>
/* ════════════════════════════════════════════════════════════
   Semaine 1 Jour 1 — Lire et écrire les grands nombres
   Page unique, 100% autonome, compatible Moodle. Contenu vérifié.
   EX1 (QCM lecture) : 15 862 ; 45 052 694 003 ; 189 000 621 ; 28 001 100 999
   EX2 (rang des chiffres dans 83 251 601 230) : cm=6, dM=5, u.milliards=3
   EX3 (écriture en lettres) : 6 nombres, orthographe vérifiée
════════════════════════════════════════════════════════════ */

var EXERCISES = [
  {
    type:"qcm", theme:"Lire", eq:"Lire les grands nombres",
    method:"<strong>Méthode :</strong> découpe le nombre en tranches de 3 chiffres depuis la droite : milliards | millions | mille | unités, puis lis chaque tranche.",
    rows:[
      { lbl:"a) 15 862", options:[
        "quinze mille huit cent soixante-deux",
        "cent cinquante-huit mille soixante-deux",
        "quinze mille huit cent soixante-douze"], ans:0 },
      { lbl:"b) 189 000 621", options:[
        "cent quatre-vingt-neuf mille six cent vingt et un",
        "cent quatre-vingt-neuf millions six cent vingt et un",
        "cent quatre-vingt-neuf millions soixante-deux"], ans:1 },
      { lbl:"c) 45 052 694 003", options:[
        "quarante-cinq millions cinquante-deux mille six cent quatre-vingt-quatorze",
        "quarante-cinq milliards cinquante-deux millions six cent quatre-vingt-quatorze mille trois",
        "quarante-cinq milliards cinq cent vingt millions six cent quatre-vingt-quatorze"], ans:1 },
      { lbl:"d) 28 001 100 999", options:[
        "vingt-huit milliards un million cent mille neuf cent quatre-vingt-dix-neuf",
        "vingt-huit millions un mille cent neuf cent quatre-vingt-dix-neuf",
        "vingt-huit milliards onze mille cent neuf cent quatre-vingt-dix-neuf"], ans:0 }
    ],
    hint:"Repère bien les classes : 45 | 052 | 694 | 003 se lit « 45 milliards 52 millions 694 mille 3 ». Attention aux zéros."
  },
  {
    type:"fields", theme:"Rang des chiffres", eq:"On considère le nombre 83 251 601 230",
    method:"<strong>Méthode :</strong> découpe en classes : milliards (83) | millions (251) | mille (601) | unités (230). Le « chiffre des … » est un seul chiffre.",
    items:[
      { lbl:"a) chiffre des centaines de mille", ans:"6" },
      { lbl:"b) chiffre des dizaines de millions", ans:"5" },
      { lbl:"c) chiffre des unités de milliards", ans:"3" }
    ],
    numeric:true,
    hint:"Mille = 601 : centaines de mille = 6. Millions = 251 : dizaines de millions = 5. Milliards = 83 : unités de milliards = 3."
  },
  {
    type:"fields", theme:"Écrire en lettres", eq:"Écris chaque nombre en toutes lettres",
    method:"<strong>Rappels :</strong> « mille » est invariable. « cent » et « vingt » prennent un s s&rsquo;ils terminent le nombre et sont multipliés (deux cents, quatre-vingts), mais pas s&rsquo;ils sont suivis d&rsquo;un autre nombre. On accepte l&rsquo;écriture avec ou sans traits d&rsquo;union.",
    items:[
      { lbl:"a) 4 325", ans:"quatre mille trois cent vingt-cinq" },
      { lbl:"b) 265 200", ans:"deux cent soixante-cinq mille deux cents" },
      { lbl:"c) 3 650 321", ans:"trois millions six cent cinquante mille trois cent vingt et un" },
      { lbl:"d) 23 105 004", ans:"vingt-trois millions cent cinq mille quatre" },
      { lbl:"e) 12 385 420 280", ans:"douze milliards trois cent quatre-vingt-cinq millions quatre cent vingt mille deux cent quatre-vingts" },
      { lbl:"f) 361 157 082 376", ans:"trois cent soixante et un milliards cent cinquante-sept millions quatre-vingt-deux mille trois cent soixante-seize" }
    ],
    longtext:true,
    hint:"Sépare en tranches de 3 depuis la droite. Attention aux zéros intercalaires (105 004 → cent cinq mille quatre)."
  }
];

var TOTAL = EXERCISES.length;
var $ = function(id){ return document.getElementById(id); };

var state = EXERCISES.map(function(ex){
  if(ex.type === "qcm") return { done:false, ok:false, sel:new Array(ex.rows.length).fill(null) };
  return { done:false, ok:false, vals:new Array(ex.items.length).fill("") };
});

/* normalisation pour comparer du texte (accents, casse, traits d'union, "et") */
function normText(s){
  return String(s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")  /* enlève accents */
    .replace(/[-\u2013\u2014]/g," ")                  /* traits d'union -> espace */
    .replace(/\s+/g," ").trim();
}
function cleanNum(s){ return String(s).replace(/\s/g,"").replace(/\u00a0/g,""); }

/* compare une réponse texte à la solution (numérique ou littérale) */
function answerOk(ex, given, expected){
  if(ex.numeric) return cleanNum(given) === cleanNum(expected);
  return normText(given) === normText(expected);
}

function buildAll(){
  var root = $("exos"); root.innerHTML = "";
  EXERCISES.forEach(function(ex, ei){
    var card = document.createElement("div");
    card.className = "card"; card.id = "card-" + ei;
    card.innerHTML =
      '<div class="card-stripe"></div>' +
      '<div class="q-num">Exercice ' + (ei+1) + '</div>' +
      '<div class="theme-badge">' + ex.theme + '</div>' +
      '<div class="eq-box">' + ex.eq + '</div>' +
      '<div class="method-box">' + ex.method + '</div>' +
      '<div id="zone-' + ei + '"></div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="check-' + ei + '">&#10003; Vérifier</button>' +
        '<button class="btn btn-hint" id="hintbtn-' + ei + '">? Indice</button>' +
        '<button class="btn btn-ghost" id="redo-' + ei + '" style="display:none;">&#128260; Refaire</button>' +
      '</div>' +
      '<div class="hint-box" id="hint-' + ei + '"></div>' +
      '<div class="feedback" id="fb-' + ei + '">' +
        '<span class="feedback-icon" id="fbi-' + ei + '"></span>' +
        '<div><div id="fbm-' + ei + '"></div><div class="feedback-detail" id="fbd-' + ei + '"></div></div>' +
      '</div>';
    root.appendChild(card);
    $("check-" + ei).onclick = (function(i){ return function(){ checkEx(i); }; })(ei);
    $("hintbtn-" + ei).onclick = (function(i){ return function(){ toggleHint(i); }; })(ei);
    $("redo-" + ei).onclick = (function(i){ return function(){ redoEx(i); }; })(ei);
    renderZone(ei);
  });
  updateGlobal();
}

function renderZone(ei){
  var ex = EXERCISES[ei];
  var zone = $("zone-" + ei); zone.innerHTML = "";
  if(ex.type === "qcm") renderQcm(ei, zone); else renderFields(ei, zone);
}

function renderQcm(ei, zone){
  var ex = EXERCISES[ei], st = state[ei];
  var letters = ["A","B","C","D"];
  ex.rows.forEach(function(rowDef, ri){
    var block = document.createElement("div");
    block.style.cssText = "margin-bottom:1.1rem;padding-bottom:.9rem;border-bottom:1px solid var(--border);";
    var lab = document.createElement("div"); lab.className = "qcm-num"; lab.textContent = rowDef.lbl;
    block.appendChild(lab);
    var list = document.createElement("div"); list.className = "opt-list";
    rowDef.options.forEach(function(opt, oi){
      var b = document.createElement("button"); b.className = "opt-btn"; b.type = "button";
      var mark = document.createElement("span"); mark.className = "opt-mark"; mark.textContent = letters[oi];
      var t = document.createElement("span"); t.textContent = opt;
      b.appendChild(mark); b.appendChild(t);
      if(st.done){
        b.classList.add("locked");
        var chosen = st.sel[ri];
        if(oi === chosen) b.classList.add(oi === rowDef.ans ? "correct-opt" : "wrong-opt");
        if(oi === rowDef.ans && chosen !== rowDef.ans) b.classList.add("correct-opt");
      } else {
        if(st.sel[ri] === oi) b.classList.add("selected");
        b.onclick = (function(r, o){ return function(){
          st.sel[r] = o;
          var sibs = list.querySelectorAll(".opt-btn");
          sibs.forEach(function(s){ s.classList.remove("selected"); });
          this.classList.add("selected");
        };})(ri, oi);
      }
      list.appendChild(b);
    });
    block.appendChild(list);
    zone.appendChild(block);
  });
}

function renderFields(ei, zone){
  var ex = EXERCISES[ei], st = state[ei];
  ex.items.forEach(function(it, i){
    var row = document.createElement("div"); row.className = "field-row";
    if(ex.longtext) row.style.flexDirection = "column", row.style.alignItems = "stretch";
    var lbl = document.createElement("span"); lbl.className = "field-lbl"; lbl.textContent = it.lbl;
    var inp = document.createElement("input");
    inp.type = "text";
    inp.className = "ans-input " + (ex.longtext ? "ans-long" : "ans-num");
    inp.placeholder = ex.longtext ? "écris en toutes lettres…" : "?";
    inp.autocomplete = "off";
    if(ex.numeric){ inp.setAttribute("inputmode","numeric"); inp.maxLength = 1; }
    inp.id = "fld-" + ei + "-" + i;
    if(st.done){
      inp.value = st.vals[i]; inp.disabled = true;
      var ok = answerOk(ex, st.vals[i], it.ans);
      inp.className = "ans-input " + (ex.longtext ? "ans-long " : "ans-num ") + (ok ? "correct-input" : "wrong-input");
    } else {
      inp.value = st.vals[i];
      inp.oninput = (function(idx){ return function(){ st.vals[idx] = this.value; }; })(i);
      inp.addEventListener("keydown", function(ev){
        if(ev.key === "Enter"){ ev.preventDefault(); if(!$("check-"+ei).disabled) checkEx(ei); }
      });
    }
    row.appendChild(lbl); row.appendChild(inp); zone.appendChild(row);
  });
}

function checkEx(ei){
  var ex = EXERCISES[ei], st = state[ei];
  if(ex.type === "qcm"){
    for(var i=0;i<ex.rows.length;i++){ if(st.sel[i] === null) return; }
    st.ok = ex.rows.every(function(r,i){ return st.sel[i] === r.ans; });
    st.done = true;
    var dq = st.ok ? "" : ("Correction : " + ex.rows.filter(function(r,i){ return st.sel[i] !== r.ans; })
      .map(function(r){ return r.lbl + " &rarr; " + r.options[r.ans]; }).join("<br>"));
    showFb(ei, st.ok, st.ok ? "Bravo ! Tout est correct." : "Pas tout à fait\u2026", dq);
  } else {
    for(var j=0;j<ex.items.length;j++){ if((st.vals[j]||"").trim() === "") return; }
    st.ok = ex.items.every(function(it,k){ return answerOk(ex, st.vals[k], it.ans); });
    st.done = true;
    var df = st.ok ? "" : ("Correction : " + ex.items.filter(function(it,k){ return !answerOk(ex, st.vals[k], it.ans); })
      .map(function(it){ return it.lbl + " &rarr; " + it.ans; }).join("<br>"));
    showFb(ei, st.ok, st.ok ? "Bravo ! Tout est correct." : "Pas tout à fait\u2026", df);
  }
  finishEx(ei);
}

function finishEx(ei){
  renderZone(ei);
  $("check-"+ei).disabled = true;
  $("check-"+ei).style.display = "none";
  $("redo-"+ei).style.display = "inline-flex";
  updateGlobal();
}

function redoEx(ei){
  var ex = EXERCISES[ei];
  if(ex.type === "qcm") state[ei] = { done:false, ok:false, sel:new Array(ex.rows.length).fill(null) };
  else state[ei] = { done:false, ok:false, vals:new Array(ex.items.length).fill("") };
  $("fb-"+ei).className = "feedback";
  $("hint-"+ei).classList.remove("show");
  $("check-"+ei).style.display = "inline-flex";
  $("check-"+ei).disabled = false;
  $("redo-"+ei).style.display = "none";
  renderZone(ei);
  updateGlobal();
}

function showFb(ei, ok, msg, detail){
  var fb = $("fb-"+ei);
  fb.className = "feedback show " + (ok ? "ok" : "ko");
  $("fbi-"+ei).textContent = ok ? "\u2705" : "\u274C";
  $("fbm-"+ei).textContent = msg;
  $("fbd-"+ei).innerHTML = detail || "";
}

function toggleHint(ei){
  var h = $("hint-"+ei);
  if(h.classList.contains("show")) h.classList.remove("show");
  else { h.innerHTML = "<strong>? Indice :</strong> " + EXERCISES[ei].hint; h.classList.add("show"); }
}

function updateGlobal(){
  var done = state.filter(function(s){ return s.done; }).length;
  var ok = state.filter(function(s){ return s.done && s.ok; }).length;
  var ko = done - ok;
  $("sb-ok").textContent = ok;
  $("sb-ko").textContent = ko;
  $("sb-label").textContent = ok + " / " + TOTAL + " exercices réussis";
  $("sb-fill").style.width = Math.round(done / TOTAL * 100) + "%";
  $("g-num").textContent = ok;
  if(done < TOTAL){
    $("g-stars").innerHTML = "&#9734;&#9734;&#9734;&#9734;&#9734;";
    $("g-msg").textContent = "Réponds aux " + TOTAL + " exercices puis vérifie-les pour voir ton bilan. (" + done + " / " + TOTAL + " faits)";
    return;
  }
  var ratio = ok / TOTAL;
  var stars = ok >= TOTAL ? 5 : ratio >= .66 ? 4 : ratio >= .5 ? 3 : ratio >= .33 ? 2 : ok >= 1 ? 1 : 0;
  $("g-stars").textContent = "\u2B50".repeat(stars) + "\u2606".repeat(5-stars);
  var msg;
  if(ok === TOTAL) msg = "Excellent ! Tu sais lire et écrire les grands nombres.";
  else if(ratio >= .66) msg = "Très bien ! Encore un petit effort sur un exercice.";
  else if(ratio >= .33) msg = "Passable. Revois les classes et l'orthographe, puis réessaie.";
  else msg = "À retravailler : reprends la méthode de chaque exercice, puis recommence.";
  $("g-msg").textContent = msg;
}

function restartAll(){
  state = EXERCISES.map(function(ex){
    if(ex.type === "qcm") return { done:false, ok:false, sel:new Array(ex.rows.length).fill(null) };
    return { done:false, ok:false, vals:new Array(ex.items.length).fill("") };
  });
  buildAll();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", buildAll);
</script>
</body>
</html>
